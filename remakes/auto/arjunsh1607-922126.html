<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>@pixeluplabs showreel</title>
<style>html,body{margin:0;background:#000;height:100%;overflow:hidden}
#s{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:0 0}</style></head>
<body><canvas id="s" width="1280" height="720"></canvas>
<script>
window.DUR=15;
const c=document.getElementById('s'),x=c.getContext('2d'),W=1280,H=720;
function fit(){const k=Math.min(innerWidth/W,innerHeight/H);c.style.transform=`translate(-50%,-50%) scale(${k})`;c.style.transform=`scale(${k})`;c.style.left=(innerWidth-W*k)/2+'px';c.style.top=(innerHeight-H*k)/2+'px';}
addEventListener('resize',fit);fit();
const q=new URLSearchParams(location.search),T0=parseFloat(q.get('t')||0),st=performance.now();
const cl=v=>v<0?0:v>1?1:v,eo=t=>1-Math.pow(1-cl(t),4),eio=t=>{t=cl(t);return t<.5?8*t*t*t*t:1-Math.pow(-2*t+2,4)/2},
eb=t=>{t=cl(t);const a=1.70158;return 1+(a+1)*Math.pow(t-1,3)+a*Math.pow(t-1,2)};
const P=['#ff2e63','#08d9d6','#ffd23f','#7b5cff','#f5f5f5'];
function rnd(i){const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s)}
function txt(s,X,Y,sz,col,al='center',w='800',sp=0){x.font=`${w} ${sz}px Helvetica,Arial,sans-serif`;x.fillStyle=col;x.textAlign=al;x.textBaseline='middle';if(x.letterSpacing!==undefined)x.letterSpacing=sp+'px';x.fillText(s,X,Y);if(x.letterSpacing!==undefined)x.letterSpacing='0px'}
// grain
const g=document.createElement('canvas');g.width=g.height=256;{const gx=g.getContext('2d'),id=gx.createImageData(256,256);for(let i=0;i<id.data.length;i+=4){const v=Math.random()*255;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=18}gx.putImageData(id,0,0)}
function bg(a,b){const gr=x.createLinearGradient(0,0,W,H);gr.addColorStop(0,a);gr.addColorStop(1,b);x.fillStyle=gr;x.fillRect(0,0,W,H)}
// SCENE 1: pixel assemble intro 0-3
function s1(t){bg('#0b0b14','#14081c');
 const n=24,sz=26,ox=W/2-n*sz/2,oy=H/2-6*sz;
 for(let i=0;i<n;i++)for(let j=0;j<12;j++){const id=i*12+j,d=Math.hypot(i-n/2,j-6);
  const p=eo((t-.1-d*.04)/0.9),off=(1-p)*(rnd(id)*600-300);if(p<=0)continue;
  const pulse=Math.sin(t*4-d*.6)*.5+.5;x.globalAlpha=p*(.15+.5*pulse*(1-cl((t-1.6)/.8)));
  x.fillStyle=P[id%4];const s=sz*.8*p;x.fillRect(ox+i*sz+off*.3+(sz-s)/2,oy+j*sz+off+(sz-s)/2,s,s)}
 x.globalAlpha=1;
 const r=eb((t-1.3)/.7);if(r>0){x.save();x.translate(W/2,H/2);x.scale(r,r);
  x.fillStyle='#fff';x.fillRect(-60,-60,120,120);x.fillStyle='#0b0b14';
  [[0,0],[1,0],[0,1],[0,2],[1,1]].forEach(([a,b])=>x.fillRect(-36+a*24,-36+b*24,22,22));
  x.fillStyle=P[0];x.fillRect(12,-36,22,22);x.restore()}
 const k=eo((t-2)/.6);if(k>0){x.globalAlpha=k;txt('SHOWREEL 2025',W/2,H/2+110+(1-k)*20,22,'#aaa','center','600',10);x.globalAlpha=1}
}
// SCENE 2: kinetic type 3-6
function s2(t){bg('#ff2e63','#b0103f');
 const words=['WE','MAKE','PIXELS','MOVE'];
 for(let r=0;r<6;r++){x.globalAlpha=.08;const dir=r%2?1:-1;txt('MOTION • DESIGN • ANIMATION • ',W/2+dir*(t*120)%400,60+r*120,90,'#fff','center','900')}
 x.globalAlpha=1;
 words.forEach((w,i)=>{const a=eo((t-.15-i*.35)/.5),out=eio((t-2.5)/.4);
  const y=H/2-150+i*100,xo=(1-a)*(i%2?600:-600)-out*(i%2?-1400:1400);
  x.save();x.beginPath();x.rect(0,y-50,W,100);x.clip();
  txt(w,W/2+xo,y+(1-a)*60,i==2?120:96,i==2?'#ffd23f':'#fff','center','900',-2);x.restore()});
 const lw=eo((t-1.6)/.6)*360;x.fillStyle='#fff';x.fillRect(W/2-lw/2,H-90,lw,4);
}
// SCENE 3: shapes & morph 6-9
function s3(t){bg('#0a1a2f','#071019');
 x.strokeStyle='rgba(8,217,214,.12)';x.lineWidth=1;for(let i=0;i<W;i+=40){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke()}for(let j=0;j<H;j+=40){x.beginPath();x.moveTo(0,j);x.lineTo(W,j);x.stroke()}
 x.save();x.translate(W/2,H/2);
 for(let k=0;k<5;k++){const a=eb((t-k*.12)/.6);x.save();x.rotate(t*(k%2?.6:-.4)+k);x.scale(a,a);
  const sides=3+k,R=60+k*50,m=Math.sin(t*2+k)*.5+.5;x.beginPath();
  for(let i=0;i<=60;i++){const an=i/60*Math.PI*2,poly=Math.cos(Math.PI/sides)/Math.cos((an%(2*Math.PI/sides))-Math.PI/sides);const rr=R*(poly*(1-m)+m);i?x.lineTo(Math.cos(an)*rr,Math.sin(an)*rr):x.moveTo(Math.cos(an)*rr,Math.sin(an)*rr)}
  x.strokeStyle=P[k%4];x.lineWidth=3;x.setLineDash([12,8]);x.lineDashOffset=-t*60;x.stroke();x.restore()}
 x.setLineDash([]);for(let i=0;i<40;i++){const an=i/40*Math.PI*2+t,rr=300+Math.sin(t*3+i)*20,a=eo((t-.5)/.6);x.fillStyle=P[i%4];x.beginPath();x.arc(Math.cos(an)*rr*a,Math.sin(an)*rr*a*.6,4,0,7);x.fill()}
 x.restore();
 const a=eo((t-.8)/.5);x.globalAlpha=a;txt('SHAPE',80,H-80,48,'#fff','left','900',4);txt('/ 02 — FORM & RHYTHM',260,H-80,18,'#08d9d6','left','600',3);x.globalAlpha=1;
}
// SCENE 4: 3D bars / data 9-12
function s4(t){bg('#ffd23f','#ffb000');
 const n=16;for(let i=0;i<n;i++){const a=eo((t-i*.05)/.7),h=(120+260*(Math.sin(i*.7+t*2.5)*.5+.5))*a,w=46,X=170+i*60,Y=H-120;
  x.fillStyle='#1a1a2e';x.fillRect(X,Y-h,w,h);x.fillStyle='#ff2e63';x.beginPath();x.moveTo(X,Y-h);x.lineTo(X+12,Y-h-12);x.lineTo(X+w+12,Y-h-12);x.lineTo(X+w,Y-h);x.fill();
  x.fillStyle='#7b5cff';x.beginPath();x.moveTo(X+w,Y-h);x.lineTo(X+w+12,Y-h-12);x.lineTo(X+w+12,Y-12);x.lineTo(X+w,Y);x.fill()}
 x.fillStyle='#1a1a2e';x.fillRect(120,H-118,1060,3);
 const a=eo((t-.3)/.5),num=Math.floor(eio(t/2.4)*240);x.globalAlpha=a;
 txt(num+'+',150,110,110,'#1a1a2e','left','900',-3);txt('PROJECTS DELIVERED',156,185,20,'#1a1a2e','left','700',6);x.globalAlpha=1;
}
// SCENE 5: logo outro 12-15
function s5(t){bg('#0b0b14','#1a0c2a');
 for(let i=0;i<80;i++){const a=rnd(i)*Math.PI*2,sp=rnd(i+9)*500+100,d=eo(t/1.2)*sp;x.globalAlpha=(1-cl(t/1.5))*.8;x.fillStyle=P[i%4];x.fillRect(W/2+Math.cos(a)*d,H/2-40+Math.sin(a)*d,6,6)}
 x.globalAlpha=1;
 const s=eb(t/.6);x.save();x.translate(W/2,H/2-70);x.scale(s,s);x.rotate((1-s)*1.5);
 x.fillStyle='#fff';x.fillRect(-50,-50,100,100);x.fillStyle='#0b0b14';[[0,0],[1,0],[0,1],[0,2],[1,1]].forEach(([a,b])=>x.fillRect(-30+a*20,-30+b*20,18,18));x.fillStyle=P[0];x.fillRect(10,-30,18,18);x.restore();
 const h='@pixeluplabs',r=eo((t-.4)/.8),n=Math.floor(r*h.length);
 txt(h.slice(0,n),W/2,H/2+70,74,'#fff','center','900',-1);
 if(n<h.length&&t>.4){x.fillStyle=P[1];x.font='900 74px Helvetica,Arial';const w=x.measureText(h.slice(0,n)).width,fw=x.measureText(h).width;x.fillRect(W/2-fw/2+w+4,H/2+40,8,60)}
 const a=eo((t-1.3)/.6);x.globalAlpha=a;const lw=a*420;const gr=x.createLinearGradient(W/2-210,0,W/2+210,0);P.slice(0,4).forEach((p,i)=>gr.addColorStop(i/3,p));x.fillStyle=gr;x.fillRect(W/2-lw/2,H/2+125,lw,4);
 txt('MOTION  •  DESIGN  •  PIXELS',W/2,H/2+165,18,'#bbb','center','600',8);x.globalAlpha=1;
 x.fillStyle='#000';x.globalAlpha=cl((t-2.6)/.4);x.fillRect(0,0,W,H);x.globalAlpha=1;
}
const SC=[[0,3,s1],[3,3,s2],[6,3,s3],[9,3,s4],[12,3,s5]];
function frame(){let t=((performance.now()-st)/1000+T0)%DUR;
 let cur=SC.find(s=>t>=s[0]&&t<s[0]+s[1])||SC[0];x.save();
 const lt=t-cur[0],zoom=1+lt*.01;x.translate(W/2,H/2);x.scale(zoom,zoom);x.translate(-W/2,-H/2);cur[2](lt);x.restore();
 // wipe transitions
 const tr=lt-(cur[1]-.35);if(cur!==SC[4]&&tr>0){const p=eio(tr/.35);for(let i=0;i<4;i++){x.fillStyle=P[i];x.fillRect(-W+(p*2.2-i*.12)*W,0,W*.9,H)}}
 if(lt<.3&&cur!==SC[0]){const p=eio(lt/.3);for(let i=0;i<4;i++){x.fillStyle=P[i];x.fillRect((p*1.2+i*.05)*W-W*.1,0,W*.9,H)}}
 // HUD
 x.globalAlpha=.7;txt('@pixeluplabs',40,36,14,'#fff','left','700',3);txt('REEL — '+(Math.min(5,SC.indexOf(cur)+1))+'/5',W-40,36,14,'#fff','right','700',3);
 const tc=t.toFixed(2).padStart(5,'0');txt('TC 00:00:'+tc,W-40,H-30,12,'#fff','right','600',2);x.fillStyle='#fff';x.fillRect(40,H-31,(t/DUR)*200,2);x.globalAlpha=1;
 // letterbox, vignette, grain
 const v=x.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,H*.9);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.45)');x.fillStyle=v;x.fillRect(0,0,W,H);
 x.fillStyle=x.createPattern(g,'repeat');x.save();x.translate(rnd(Math.floor(t*24))*256,rnd(Math.floor(t*24)+5)*256);x.fillRect(-256,-256,W+256,H+256);x.restore();
 requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script></body></html>
