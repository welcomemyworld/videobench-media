<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Anime Opening Teaser</title>
<style>html,body{margin:0;background:#000;height:100%;overflow:hidden}
canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}</style></head>
<body><canvas id="c" width="1280" height="720"></canvas>
<script>
window.DUR=30;
const c=document.getElementById('c'),x=c.getContext('2d'),W=1280,H=720;
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);c.style.width=W*s+'px';c.style.height=H*s+'px'}
addEventListener('resize',fit);fit();
const off=parseFloat(new URLSearchParams(location.search).get('t'))||0;
let seed=7;const R=()=>(seed=(seed*16807)%2147483647)/2147483647;
const clouds=[...Array(14)].map(()=>({x:R()*W*2,y:R()*400,s:60+R()*120,v:.3+R()}));
const petals=[...Array(80)].map(()=>({x:R()*W,y:R()*H,r:R()*6.28,v:.5+R()*1.5,s:4+R()*5}));
const blds=[...Array(40)].map((_,i)=>({x:i*70,w:40+R()*60,h:120+R()*360,l:R()}));
const lines=[...Array(120)].map(()=>({a:R()*6.28,l:R(),s:R()}));
const cl=(v,a,b)=>Math.max(a,Math.min(b,v)),E=t=>t<0?0:t>1?1:t*t*(3-2*t);
function sky(t,top,bot){const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,top);g.addColorStop(1,bot);x.fillStyle=g;x.fillRect(0,0,W,H)}
function cloud(cx,cy,s,col){x.fillStyle=col;for(let i=0;i<5;i++){x.beginPath();x.arc(cx+(i-2)*s*.5,cy-Math.sin(i*1.3)*s*.3,s*(.45+.15*Math.sin(i*2)),0,7);x.fill()}}
function petal(t,k){x.fillStyle='rgba(255,190,215,.85)';for(const p of petals){const px=(p.x-t*40*p.v*k+W*10)%W,py=(p.y+t*60*p.v)%H;x.save();x.translate(px,py);x.rotate(p.r+t*p.v*2);x.beginPath();x.ellipse(0,0,p.s,p.s*.5,0,0,7);x.fill();x.restore()}}
function speed(t,cx,cy,a,col){x.strokeStyle=col;for(const L of lines){const r0=200+((L.l*900+t*1600*(.5+L.s))%900);x.globalAlpha=a*(.3+L.s*.7);x.lineWidth=1+L.s*3;x.beginPath();x.moveTo(cx+Math.cos(L.a)*r0,cy+Math.sin(L.a)*r0);x.lineTo(cx+Math.cos(L.a)*(r0+150),cy+Math.sin(L.a)*(r0+150));x.stroke()}x.globalAlpha=1}
function hero(t,cx,cy,sc,run){x.save();x.translate(cx,cy);x.scale(sc,sc);
 const b=run?Math.sin(t*14)*6:Math.sin(t*2)*2;x.translate(0,b);
 // scarf/hair flowing
 x.fillStyle='#d6204a';x.beginPath();x.moveTo(-10,-150);for(let i=0;i<=10;i++)x.lineTo(-20-i*22,-150+Math.sin(t*9-i*.8)*10*i/4+i*3);for(let i=10;i>=0;i--)x.lineTo(-20-i*22,-138+Math.sin(t*9-i*.8)*10*i/4+i*3);x.fill();
 x.fillStyle='#141428';
 // legs
 const s=run?Math.sin(t*14)*.8:0.1;
 for(const d of[1,-1]){x.save();x.translate(d*8,-60);x.rotate(s*d);x.fillRect(-9,0,18,65);x.restore()}
 x.beginPath();x.moveTo(-28,-150);x.lineTo(28,-150);x.lineTo(22,-55);x.lineTo(-22,-55);x.fill();
 for(const d of[1,-1]){x.save();x.translate(d*24,-145);x.rotate(-s*d*.9+d*.2);x.fillRect(-7,0,14,60);x.restore()}
 x.beginPath();x.arc(0,-178,28,0,7);x.fill();
 // spiky hair
 x.beginPath();for(let i=0;i<7;i++){const a=Math.PI+i*.5-.2;x.lineTo(Math.cos(a)*32,-178+Math.sin(a)*32);x.lineTo(Math.cos(a+.25)*55-10-Math.sin(t*8+i)*3,-185+Math.sin(a+.25)*48)}x.fill();
 x.fillStyle='#ffd23f';x.beginPath();x.ellipse(12,-180,5,3,0,0,7);x.fill();
 x.restore()}
function txt(s,y,sz,a,col,sp){x.globalAlpha=a;x.fillStyle=col;x.font='900 '+sz+'px "Arial Black",Arial,sans-serif';x.textAlign='center';x.textBaseline='middle';if(sp)x.letterSpacing=sp+'px';x.fillText(s,W/2,y);x.letterSpacing='0px';x.globalAlpha=1}
function bars(){x.fillStyle='#000';x.fillRect(0,0,W,60);x.fillRect(0,H-60,W,60)}
function frame(t){
 x.setTransform(1,0,0,1,0,0);
 if(t<6){// sky reveal
  const k=t/6;sky(t,'#1d3d8f','#ff9fb8');
  const g=x.createRadialGradient(950,180-k*60,0,950,180,400);g.addColorStop(0,'rgba(255,250,220,.95)');g.addColorStop(.15,'rgba(255,230,180,.5)');g.addColorStop(1,'rgba(255,200,200,0)');x.fillStyle=g;x.fillRect(0,0,W,H);
  for(const q of clouds)cloud((q.x-t*30*q.v)%(W+400)-200,q.y+300-k*150,q.s,'rgba(255,255,255,.85)');
  petal(t,1);txt('ONE SUMMER, THE SKY BROKE OPEN',H/2+200,30,E(t-1)*E(5.5-t),'#fff',8);
 }else if(t<12){// city dolly
  const u=t-6;sky(t,'#ff7b54','#ffd27f');
  x.fillStyle='#fff3';x.beginPath();x.arc(640,420,180,0,7);x.fill();
  for(let L=0;L<3;L++){const sp=(L+1)*120,col=['#7a3b6b','#4c2350','#1e0f2e'][L];
   for(const b of blds){const bx=((b.x*(1+L*.3)-u*sp)%2800+2800)%2800-200,bh=b.h*(.6+L*.25);x.fillStyle=col;x.fillRect(bx,H-bh,b.w,bh);
    if(L==2){x.fillStyle='#ffd86b';for(let wy=H-bh+15;wy<H-10;wy+=24)for(let wx=bx+6;wx<bx+b.w-8;wx+=14)if(((wx*7+wy*3)|0)%5<2)x.fillRect(wx,wy,6,10)}}}
  speed(t,640,360,.4,'#fff');petal(t,3);
  txt('THIS CITY HOLDS A SECRET',150,40,E(u-.5)*E(5.5-u),'#fff',6);
 }else if(t<18){// hero run
  const u=t-12;sky(t,'#2a1250','#d6204a');speed(t,640,360,.8,'#ffe');
  x.fillStyle='#120820';x.fillRect(0,560,W,160);
  for(let i=0;i<20;i++){x.fillStyle='#ffffff22';x.fillRect(((i*120-u*900)%1400+1400)%1400-100,580,60,4)}
  hero(t,400+u*60,560,1.4+u*.05,true);
  txt('RUN.',H/2-180,90,E((u-1)*2)*E(5.6-u),'#ffd23f',20);
 }else if(t<24){// impact
  const u=t-18,f=Math.max(0,1-u*2);
  sky(t,'#05030f','#3a0b3a');speed(t*2,640,360,1,'#ff4f7a');
  x.save();x.translate(640,360);x.rotate(u*.3);
  for(let i=0;i<8;i++){x.rotate(Math.PI/4);x.fillStyle='rgba(255,210,63,'+(.15+.1*Math.sin(t*6+i))+')';x.beginPath();x.moveTo(0,0);x.lineTo(900,-40);x.lineTo(900,40);x.fill()}x.restore();
  const sh=Math.max(0,1-u)*20;x.translate((R()-.5)*sh,(R()-.5)*sh);
  hero(t,640,560,2.2,false);
  x.setTransform(1,0,0,1,0,0);
  x.strokeStyle='#fff';x.lineWidth=6;for(let i=0;i<3;i++){const p=cl((u-1-i*.5)*3,0,1);if(p>0){x.globalAlpha=1-cl((u-2.5-i*.5),0,1);x.beginPath();x.moveTo(200+i*100,600-i*150);x.lineTo(200+i*100+p*900,600-i*150-p*300);x.stroke()}}x.globalAlpha=1;
  x.fillStyle='rgba(255,255,255,'+f+')';x.fillRect(0,0,W,H);
  txt('FIGHT FOR TOMORROW',140,46,E(u-1.5)*E(5.6-u),'#fff',8);
 }else{// title
  const u=t-24;sky(t,'#0e1a4a','#ff8fb0');
  for(const q of clouds)cloud((q.x-t*20*q.v)%(W+400)-200,q.y+380,q.s,'rgba(255,255,255,.35)');
  petal(t,1);
  const s=1+.6*(1-E(u*1.5));x.save();x.translate(640,320);x.scale(s,s);x.translate(-640,-320);
  x.shadowColor='#ff4f7a';x.shadowBlur=30;txt('SKYBOUND',320,140,E(u*2),'#fff',14);x.shadowBlur=0;x.restore();
  x.fillStyle='#ffd23f';x.globalAlpha=E(u-1);x.fillRect(640-260*E(u-1),410,520*E(u-1),4);x.globalAlpha=1;
  txt('APRIL  —  ANIME SERIES',460,30,E(u-1.5),'#fff',10);
  txt('COMING SOON',520,22,E(u-2.2)*(.6+.4*Math.sin(t*4)),'#ffd23f',12);
  x.fillStyle='rgba(0,0,0,'+E(u-5)+')';x.fillRect(0,0,W,H);
 }
 // cut flashes + vignette
 for(const k of[6,12,18,24]){const d=Math.abs(t-k);if(d<.15){x.fillStyle='rgba(255,255,255,'+(1-d/.15)*.8+')';x.fillRect(0,0,W,H)}}
 const v=x.createRadialGradient(640,360,300,640,360,800);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.6)');x.fillStyle=v;x.fillRect(0,0,W,H);
 bars();
}
const st=performance.now();
function loop(n){const t=((n-st)/1000+off)%DUR;seed=7+Math.floor(t*30);frame(t);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
