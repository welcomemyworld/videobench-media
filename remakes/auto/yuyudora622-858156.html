<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Yuyu</title>
<style>html,body{margin:0;background:#000;height:100%;overflow:hidden}
#c{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);}</style></head>
<body><canvas id="c" width="1280" height="720"></canvas>
<script>
window.DUR=15;
const c=document.getElementById('c'),x=c.getContext('2d'),W=1280,H=720;
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);c.style.width=W*s+'px';c.style.height=H*s+'px';}
addEventListener('resize',fit);fit();
const q=new URLSearchParams(location.search);const off=parseFloat(q.get('t')||0)||0;
const t0=performance.now()-off*1000;
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const eo=v=>1-Math.pow(1-cl(v),3);
const eb=v=>{v=cl(v);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(v-1,3)+c1*Math.pow(v-1,2)};
const ph=(t,a,b)=>cl((t-a)/(b-a));
const P=[];for(let i=0;i<400;i++)P.push({a:Math.random()*6.283,r:Math.random(),s:.3+Math.random(),h:Math.random()*360});
const pal=['#ff3d7f','#3df2ff','#ffd23d','#9d5bff'];
function txt(s,X,Y,sz,col,al='center',w='900'){x.font=w+' '+sz+'px Helvetica,Arial,sans-serif';x.textAlign=al;x.textBaseline='middle';x.fillStyle=col;x.fillText(s,X,Y);}
function bg(t){
 const g=x.createRadialGradient(W/2,H/2,50,W/2,H/2,800);
 const hue=(t*20)%360;g.addColorStop(0,`hsl(${hue+240},50%,12%)`);g.addColorStop(1,'#030308');
 x.fillStyle=g;x.fillRect(0,0,W,H);
 x.strokeStyle='rgba(255,255,255,0.05)';x.lineWidth=1;
 const o=(t*60)%80;for(let i=-80;i<W+80;i+=80){x.beginPath();x.moveTo(i+o,0);x.lineTo(i+o,H);x.stroke();}
 for(let j=-80;j<H+80;j+=80){x.beginPath();x.moveTo(0,j+o);x.lineTo(W,j+o);x.stroke();}
}
function burst(t,st){const k=t-st;if(k<0||k>2)return;
 for(const p of P){const r=eo(k/1.5)*p.r*900*p.s;const al=1-k/2;
  x.fillStyle=`hsla(${p.h},100%,65%,${al})`;x.beginPath();x.arc(W/2+Math.cos(p.a)*r,H/2+Math.sin(p.a)*r,3*p.s,0,7);x.fill();}}
function sc1(t){// 0-3 intro: shapes converge, letters drop
 const k=ph(t,0,1.2);
 for(let i=0;i<4;i++){const a=i*Math.PI/2+t*2;const r=(1-eo(k))*600+60+Math.sin(t*4+i)*10;
  x.save();x.translate(W/2+Math.cos(a)*r,H/2+Math.sin(a)*r);x.rotate(t*3+i);x.fillStyle=pal[i];
  x.fillRect(-25,-25,50,50);x.restore();}
 const ring=eo(ph(t,1,1.8));x.strokeStyle='#fff';x.lineWidth=6;x.beginPath();x.arc(W/2,H/2,ring*260,-1.57,-1.57+ring*6.283);x.stroke();
 txt('Hi!',W/2,H/2-150+ (1-eb(ph(t,0.6,1.3)))*-200,40,'rgba(255,255,255,'+ph(t,.6,1.3)+')','center','700');
 const n='YUYU';for(let i=0;i<4;i++){const p=eb(ph(t,1.3+i*.12,2+i*.12));
  x.save();x.translate(W/2-165+i*110,H/2-(1-p)*400);x.scale(p,p);txt(n[i],3,6,150,'#000');txt(n[i],0,0,150,pal[i]);x.restore();}
 burst(t,1.3);
}
function sc2(t,l){// 3-6 "I'm Yuyu" split
 const k=eo(ph(l,0,.6));
 x.fillStyle=pal[0];x.beginPath();x.moveTo(0,0);x.lineTo(W*k*.6,0);x.lineTo(W*k*.4,H);x.lineTo(0,H);x.fill();
 txt("I'M",-200+k*560,260,110,'#fff');
 txt('YUYU',W+300-k*520,420,190,pal[1]);
 const s=ph(l,.8,1.6);x.strokeStyle=pal[2];x.lineWidth=10;x.beginPath();x.moveTo(560,520);x.lineTo(560+eo(s)*600,520);x.stroke();
 txt('nice to meet you ✦',920,580,34,'rgba(255,255,255,'+ph(l,1.2,1.8)+')','center','600');
 for(let i=0;i<12;i++){const a=i/12*6.283+l;x.fillStyle=pal[i%4];x.beginPath();x.arc(1100+Math.cos(a)*90*k,170+Math.sin(a)*90*k,8,0,7);x.fill();}
}
function sc3(t,l){// 6-10 traits, cards flip
 const tr=[['CREATIVE','ideas everywhere'],['CURIOUS','always learning'],['PLAYFUL','fun in motion']];
 txt('ABOUT ME',W/2,110,56,'#fff');
 x.fillStyle=pal[2];x.fillRect(W/2-eo(ph(l,0,.5))*120,150,eo(ph(l,0,.5))*240,6);
 tr.forEach((s,i)=>{const p=ph(l,.3+i*.35,1+i*.35);const fl=Math.cos((1-eo(p))*Math.PI);
  const cx=W/2+(i-1)*380,cy=380+Math.sin(l*3+i)*10;
  x.save();x.translate(cx,cy);x.scale(Math.max(.01,fl),1);x.fillStyle=pal[i];x.fillRect(-160,-150,320,300);
  x.fillStyle='rgba(0,0,0,.25)';x.beginPath();x.arc(0,-60,50,0,7);x.fill();
  x.strokeStyle='#fff';x.lineWidth=6;x.beginPath();
  if(i==0){for(let j=0;j<5;j++){const a=j*1.2566-1.57;x.lineTo(Math.cos(a)*35,-60+Math.sin(a)*35);x.lineTo(Math.cos(a+.628)*15,-60+Math.sin(a+.628)*15);}x.closePath();}
  else if(i==1){x.arc(-5,-65,22,0,7);x.moveTo(10,-50);x.lineTo(30,-30);}
  else{x.arc(0,-60,28,.3,2.84);x.moveTo(-12,-72);x.arc(-12,-72,2,0,7);x.moveTo(12,-72);x.arc(12,-72,2,0,7);}
  x.stroke();txt(s[0],0,40,44,'#fff');txt(s[1],0,95,24,'rgba(255,255,255,.85)','center','600');x.restore();});
}
function sc4(t,l){// 10-12.5 tunnel "I love"
 for(let i=0;i<14;i++){const z=((i/14)+l*.5)%1;const r=z*z*900;
  x.strokeStyle=pal[i%4];x.globalAlpha=z;x.lineWidth=2+z*8;x.save();x.translate(W/2,H/2);x.rotate(l+i*.2);
  x.strokeRect(-r,-r*.6,r*2,r*1.2);x.restore();}
 x.globalAlpha=1;
 const w=['DESIGN','MUSIC','STORIES'];const i=Math.min(2,Math.floor(l/.8));const p=(l-i*.8)/.8;
 txt('I LOVE',W/2,H/2-110,48,'#fff');
 const s=.5+eb(cl(p*2))*.5;x.save();x.translate(W/2,H/2+20);x.scale(s,s);txt(w[i],0,0,140,pal[i]);x.restore();
}
function sc5(t,l){// 12.5-15 outro
 burst(t,12.5);
 const p=eb(ph(l,0,.7));
 for(let i=0;i<4;i++){x.fillStyle=pal[i];const r=(1-eo(ph(l,0,.8)))*0+ (260-i*45)*p;
  x.beginPath();x.arc(W/2,H/2-30,Math.max(0,r),0,7);x.fill();}
 x.save();x.translate(W/2,H/2-30);x.scale(p,p);x.rotate((1-p)*2);txt('YUYU',0,0,120,'#fff');x.restore();
 txt("let's create something amazing",W/2,H/2+290-(1-eo(ph(l,.6,1.2)))*40,36,'rgba(255,255,255,'+ph(l,.6,1.2)+')','center','600');
 const f=ph(l,2.2,2.5);if(f>0){x.fillStyle='rgba(0,0,0,'+f+')';x.fillRect(0,0,W,H);}
}
function wipe(t,at){const k=t-at;if(k<-.25||k>.25)return;const p=(k+.25)/.5;
 x.fillStyle=pal[Math.floor(at)%4];x.fillRect(-W+p*W*2,0,W,H);}
function loop(){
 const t=(((performance.now()-t0)/1000)%DUR+DUR)%DUR;
 bg(t);
 const sh=(t>1.3&&t<1.6)||(t>12.5&&t<12.8)?(Math.random()-.5)*14:0;
 x.save();x.translate(sh,sh);
 if(t<3)sc1(t);else if(t<6)sc2(t,t-3);else if(t<10)sc3(t,t-6);else if(t<12.5)sc4(t,t-10);else sc5(t,t-12.5);
 x.restore();
 [3,6,10,12.5].forEach(a=>wipe(t,a));
 x.fillStyle='rgba(255,255,255,.6)';x.fillRect(0,H-4,W*t/DUR,4);
 requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script></body></html>
