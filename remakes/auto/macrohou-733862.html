<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>REN — Motion × Sound</title>
<style>html,body{margin:0;background:#000;height:100%;overflow:hidden}
#s{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#000}</style></head>
<body><canvas id="s" width="1280" height="720"></canvas>
<script>
window.DUR=30;
const c=document.getElementById('s'),x=c.getContext('2d'),W=1280,H=720;
function fit(){const k=Math.min(innerWidth/W,innerHeight/H);c.style.width=W*k+'px';c.style.height=H*k+'px'}
addEventListener('resize',fit);fit();
const q=new URLSearchParams(location.search);const off=parseFloat(q.get('t')||0)||0;
const t0=performance.now()-off*1000;
const BPM=128,BT=60/BPM;
const ease=v=>v<0?0:v>1?1:1-Math.pow(1-v,3);
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const ss=(a,b,v)=>{v=cl((v-a)/(b-a),0,1);return v*v*(3-2*v)};
function R(n){let s=Math.sin(n*127.1)*43758.5453;return s-Math.floor(s)}
// ---- audio (best effort; silent if blocked)
let ac=null,lastB=-1;
try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
addEventListener('pointerdown',()=>ac&&ac.resume());
function kick(){if(!ac||ac.state!=='running')return;const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime;
o.frequency.setValueAtTime(150,n);o.frequency.exponentialRampToValueAtTime(40,n+.2);g.gain.setValueAtTime(.8,n);g.gain.exponentialRampToValueAtTime(.001,n+.35);
o.connect(g).connect(ac.destination);o.start(n);o.stop(n+.4)}
function hat(f){if(!ac||ac.state!=='running')return;const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime;o.type='square';o.frequency.value=f;
g.gain.setValueAtTime(.05,n);g.gain.exponentialRampToValueAtTime(.001,n+.08);o.connect(g).connect(ac.destination);o.start(n);o.stop(n+.1)}
// ---- palette
const COL=['#ff2e63','#08d9d6','#f9ed69','#ffffff'];
const parts=[];for(let i=0;i<420;i++)parts.push({a:R(i)*6.283,r:R(i+9)*1,s:R(i+3),c:COL[i%3]});
function letterPts(str,size){const o=document.createElement('canvas');o.width=W;o.height=H;const g=o.getContext('2d');
g.fillStyle='#fff';g.font='900 '+size+'px Arial Black, Arial, sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(str,W/2,H/2);
const d=g.getImageData(0,0,W,H).data,p=[];for(let y=0;y<H;y+=9)for(let xx=0;xx<W;xx+=9)if(d[(y*W+xx)*4+3]>128)p.push([xx,y]);return p}
const logo=letterPts('REN',340);
function txt(s,X,Y,sz,col,al,sp){x.save();x.globalAlpha=al;x.fillStyle=col;x.font='900 '+sz+'px Arial Black, Arial, sans-serif';
x.textAlign='center';x.textBaseline='middle';if(sp){x.letterSpacing=sp+'px'}x.fillText(s,X,Y);x.restore()}
function rgbText(s,X,Y,sz,sh,al){x.save();x.globalCompositeOperation='lighter';txt(s,X-sh,Y,sz,'#ff2e63',al);txt(s,X+sh,Y,sz,'#08d9d6',al);txt(s,X,Y+sh*.3,sz,'#f9ed69',al*.6);x.restore()}

function frame(now){
 let T=((now-t0)/1000)%DUR;if(T<0)T+=DUR;
 const b=Math.floor(T/BT),bp=(T%BT)/BT,env=Math.exp(-bp*6),bar=Math.floor(b/4);
 if(b!==lastB){lastB=b;if(T>2&&T<28.5){if(b%2==0||T>16)kick();hat(b%4==3?9000:6000)}}
 x.globalCompositeOperation='source-over';x.globalAlpha=1;
 x.fillStyle='rgba(5,5,12,'+(T<16?.35:.25)+')';x.fillRect(0,0,W,H);
 x.save();
 const shake=T>16&&T<23?env*6:env*2;x.translate((R(b)-.5)*shake,(R(b+5)-.5)*shake);
 // ===== Scene 1: pulse line (0-5)
 if(T<5.5){const a=1-ss(4.8,5.5,T);x.globalAlpha=a;
  const grow=ease(T/1.5);x.strokeStyle='#fff';x.lineWidth=2;x.beginPath();
  for(let i=0;i<=200;i++){const u=i/200,px=W/2+(u-.5)*W*grow;
   const amp=T>2?env*120*Math.sin(u*Math.PI):0;x.lineTo(px,H/2+Math.sin(u*40+T*20)*amp*Math.exp(-Math.pow((u-.5)*3,2)))}x.stroke();
  for(let k=0;k<3;k++){const rr=(bp+k*.33)%1;x.strokeStyle=COL[k];x.globalAlpha=a*(1-rr)*(T>2?1:0);x.lineWidth=3;
   x.beginPath();x.arc(W/2,H/2,rr*500,0,7);x.stroke()}
  x.globalAlpha=a;if(T>3)rgbText('LISTEN',W/2,H/2-170,40,env*10,ss(3,3.5,T));
 }
 // ===== Scene 2: spectrum MOTION (5-11)
 if(T>5&&T<11.5){const a=ss(5,5.6,T)*(1-ss(10.8,11.5,T));x.globalAlpha=a;
  const N=64;for(let i=0;i<N;i++){const u=i/N;
   const h=(Math.abs(Math.sin(i*.37+T*3))*.5+.5*env*(1-u))*360+20*Math.sin(T*8+i);
   const ang=u*6.283+T*.4,r0=140;
   x.save();x.translate(W/2,H/2);x.rotate(ang);x.fillStyle=COL[i%3];x.fillRect(r0,-5,h*.7,10);x.restore()}
  x.globalAlpha=a;x.fillStyle='#05050c';x.beginPath();x.arc(W/2,H/2,130,0,7);x.fill();
  const ch='MOTION';for(let i=0;i<6;i++){const d=ease((T-5.6-i*.08)/.5);
   txt(ch[i],W/2+(i-2.5)*44,H/2+(1-d)*80*(i%2?1:-1),56,i==b%6?'#f9ed69':'#fff',a*d)}
 }
 // ===== Scene 3: particles SOUND (11-17)
 if(T>11&&T<17.3){const a=ss(11,11.5,T)*(1-ss(16.6,17.3,T));
  x.globalCompositeOperation='lighter';
  parts.forEach((p,i)=>{const r=(80+p.r*420)*(.6+env*.6)+Math.sin(T*2+p.s*9)*30;
   const an=p.a+T*(p.s-.5)*1.4;x.globalAlpha=a*(.5+env*.5);x.fillStyle=p.c;
   const sz=2+p.s*4*env;x.fillRect(W/2+Math.cos(an)*r*1.4,H/2+Math.sin(an)*r*.8,sz,sz)});
  x.globalCompositeOperation='source-over';
  const sc=1+env*.15;x.save();x.translate(W/2,H/2);x.scale(sc,sc);rgbText('SOUND',0,0,130,env*14,a);x.restore();
  // EQ strip
  for(let i=0;i<40;i++){const h=(R(i+b*3)*.7+.3)*60*env+4;x.globalAlpha=a;x.fillStyle=COL[i%3];x.fillRect(240+i*20,640-h,12,h)}
 }
 // ===== Scene 4: shards -> REN (16.5-30)
 if(T>16.5){const fo=1-ss(29,30,T),as=ease((T-17)/3.5);
  // background stripes on beats
  if(T>20.5){x.globalAlpha=.12*env*fo;for(let i=0;i<8;i++){x.fillStyle=COL[(i+b)%3];x.fillRect(0,i*90,W,45)}}
  x.globalCompositeOperation='lighter';
  const n=logo.length,pulse=T>21?env:0;
  for(let i=0;i<n;i++){const p=logo[i],rs=R(i*1.7);
   const sa=rs*6.283,sd=600+R(i)*600;
   const sx=W/2+Math.cos(sa+T)*sd,sy=H/2+Math.sin(sa+T)*sd*.6;
   const d=ease(cl((T-17-rs*1.5)/2,0,1));
   let px=sx+(p[0]-sx)*d,py=sy+(p[1]-sy)*d;
   const wob=pulse*12*Math.sin(p[1]*.05+T*20);px+=wob*(rs-.5);
   if(T>25.5){const ex=ss(25.5,26.5,T)*(1-ss(26.5,27.5,T));px+=(p[0]-W/2)*ex*.3;py+=(p[1]-H/2)*ex*.3}
   x.globalAlpha=fo*(.6+.4*d);x.fillStyle=COL[i%3];const s=3+pulse*3;x.fillRect(px-s/2,py-s/2,s,s)}
  x.globalCompositeOperation='source-over';
  if(T>20){const ta=ss(20,21,T)*fo;rgbText('REN',W/2,H/2,340,2+pulse*16,ta*.95);}
  if(T>21.5){const ta=ss(21.5,22.3,T)*fo;
   x.globalAlpha=ta;x.fillStyle='#fff';const lw=ease((T-21.5)/.8)*520;x.fillRect(W/2-lw/2,H/2+170,lw,3);
   txt('MOTION  ×  SOUND',W/2,H/2+210,30,'#fff',ta,10)}
  // waveform footer
  if(T>22){x.globalAlpha=ss(22,23,T)*fo;x.strokeStyle='#08d9d6';x.lineWidth=2;x.beginPath();
   for(let i=0;i<=320;i++){const u=i/320;x.lineTo(u*W,60+Math.sin(u*60+T*12)*env*25*Math.sin(u*Math.PI))}x.stroke()}
  if(T>28.5){x.globalAlpha=1-ss(28.5,29.6,T);}
 }
 x.restore();
 // flashes on scene cuts
 [5,11,16.8,20,26].forEach(s=>{const d=T-s;if(d>=0&&d<.25){x.globalAlpha=(1-d/.25)*.7;x.fillStyle='#fff';x.fillRect(0,0,W,H)}});
 // scanlines + vignette
 x.globalAlpha=.08;x.fillStyle='#000';for(let y=0;y<H;y+=4)x.fillRect(0,y,W,2);
 x.globalAlpha=1;const g=x.createRadialGradient(W/2,H/2,250,W/2,H/2,800);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.75)');x.fillStyle=g;x.fillRect(0,0,W,H);
 // HUD timecode
 x.globalAlpha=.6;x.fillStyle='#fff';x.font='14px monospace';x.textAlign='left';x.fillText('REN // '+BPM+' BPM  BAR '+String(bar+1).padStart(2,'0')+'.'+(b%4+1),24,H-24);
 x.textAlign='right';x.fillText(T.toFixed(2)+'s',W-24,H-24);
 if(T>29.7){x.globalAlpha=1;x.fillStyle='#000';x.fillRect(0,0,W,H)}
 requestAnimationFrame(frame);
}
x.fillStyle='#000';x.fillRect(0,0,W,H);
requestAnimationFrame(frame);
</script></body></html>
