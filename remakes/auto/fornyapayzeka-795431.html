<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><title>Göl Üstünde Işık Senfonisi</title>
<style>
html,body{margin:0;background:#000;overflow:hidden;height:100%}
#s{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#000}
#b{position:absolute;right:14px;bottom:14px;font:14px sans-serif;color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);padding:8px 14px;border-radius:20px;cursor:pointer}
</style></head><body>
<canvas id="s" width="1280" height="720"></canvas>
<button id="b">Finali tekrar oynat ↻</button>
<script>
const W=1280,H=720,HOR=470;window.DUR=48;
const cv=document.getElementById('s'),c=cv.getContext('2d');
function fit(){const k=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*k+'px';cv.style.height=H*k+'px'}
fit();addEventListener('resize',fit);
let off=parseFloat(new URLSearchParams(location.search).get('t'))||0;
let t0=performance.now()-off*1000;
document.getElementById('b').onclick=()=>{t0=performance.now()-36*1000;reset(36)};
let seed=1;const R=()=>(seed=(seed*16807)%2147483647)/2147483647;
const stars=[];for(let i=0;i<260;i++)stars.push([R()*W,R()*HOR,R()*1.3+.2,R()*6]);
const city=[];{let x=0;while(x<W){const w=20+R()*45,h=15+R()*70*(1-Math.abs(x-640)/900);city.push([x,w,h]);x+=w}}
const wins=[];city.forEach(b=>{for(let i=0;i<b[1]*b[2]/120;i++)wins.push([b[0]+3+R()*(b[1]-6),HOR-3-R()*(b[2]-6),R()])});
// palettes
const PAL=[[255,190,90],[120,200,255],[255,90,140],[180,120,255],[140,255,180],[255,240,220],[255,130,60]];
let parts=[],rockets=[],sched=[],flash=[0,0,0],shake=0,lastT=0;
// choreography: [time, x, depth(0far..1near), type, color]
function build(){
 sched=[];seed=7;
 const ty=['peony','ring','willow','chrys','palm','crossette','heart'];
 // Act 1: lonely gold
 [[1,640,.5,'willow',0],[3.5,420,.3,'peony',0],[4.2,860,.3,'peony',0],[6.5,640,.7,'chrys',5]].forEach(a=>sched.push(a));
 // Act 2: rhythm pairs
 for(let i=0;i<10;i++){const tt=8+i*1.1;sched.push([tt,640+(i%2?1:-1)*(150+i*25),.2+R()*.6,ty[i%6],(i*2)%7])}
 // Act 3: depth wave L->R
 for(let i=0;i<14;i++)sched.push([20+i*.35,120+i*75,.15+(i%3)*.3,i%2?'ring':'peony',1+(i%4)]);
 sched.push([26,640,.9,'palm',6]);sched.push([27.5,400,.6,'crossette',3]);sched.push([28,880,.6,'crossette',3]);
 for(let i=0;i<8;i++)sched.push([29+i*.6,200+R()*880,R(),ty[(i*3)%7],i%7]);
 // FINALE
 for(let i=0;i<30;i++)sched.push([36+i*.18,640+Math.sin(i*1.7)*480,R(),i%3?'willow':'chrys',i%2?0:5]);
 sched.push([42,640,1,'grand',0]);
 for(let i=0;i<12;i++)sched.push([42.6+i*.05,640+Math.cos(i/12*6.28)*420,.5,'peony',i%7]);
 sched.sort((a,b)=>a[0]-b[0]);
}
build();
let si=0;
function reset(T){parts=[];rockets=[];si=0;while(si<sched.length&&sched[si][0]<T-2.5)si++;}
reset(off);
function launch(e){const d=e[2],sc=.45+d*.75;rockets.push({x:e[1],y:HOR+5,vx:(R()-.5)*20,vy:-(330+d*160)*(e[3]=='grand'?1.25:1),sc,ty:e[3],col:PAL[e[4]],fuse:e[3]=='grand'?1.9:1.3+R()*.4,age:0})}
function P(x,y,vx,vy,col,life,sz,o){parts.push(Object.assign({x,y,vx,vy,col,life,max:life,sz,drag:.985,g:60,tr:[]},o||{}))}
function burst(r){
 const {x,y,sc,col,ty}=r,n=ty=='grand'?600:(ty=='willow'?130:160),sp=(ty=='grand'?330:200)*sc;
 const fl=(ty=='grand'?2.2:.35)*sc;flash=[col[0]/255*fl,col[1]/255*fl,col[2]/255*fl];
 if(ty=='grand')shake=14;
 for(let i=0;i<n;i++){
  let a=R()*6.283,v=sp*(.3+R()*.7),vx,vy,o={};
  if(ty=='ring'){v=sp;a=i/n*6.283;vx=Math.cos(a)*v;vy=Math.sin(a)*v*.45}
  else if(ty=='heart'){const k=i/n*6.283;vx=16*Math.pow(Math.sin(k),3)*sp/16;vy=-(13*Math.cos(k)-5*Math.cos(2*k)-2*Math.cos(3*k))*sp/16}
  else if(ty=='palm'){if(i%10)continue;v=sp*1.1;vx=Math.cos(a)*v;vy=Math.sin(a)*v;o={g:90,sz:3}}
  else{const u=Math.sqrt(R());vx=Math.cos(a)*v*(ty=='peony'?1:u*1.4);vy=Math.sin(a)*v*(ty=='peony'?1:u*1.4)}
  if(ty=='willow'||ty=='grand'){o.drag=.97;o.g=35;o.tw=1}
  if(ty=='crossette')o.split=.7;
  let c2=col;if(ty=='chrys'&&i%2)c2=PAL[5];if(ty=='grand'&&i%3==0)c2=PAL[(i>>2)%7];
  P(x,y,vx,vy,c2,(ty=='willow'||ty=='grand'?3.2:1.8)+R()*.6,(o.sz||1.6)*sc,o);
 }
}
function frame(now){
 let T=(now-t0)/1000;
 if(T>=DUR){t0=now;T=0;reset(0);lastT=0}
 let dt=Math.min(.05,Math.max(0,T-lastT));if(T<lastT)dt=0;lastT=T;
 while(si<sched.length&&sched[si][0]<=T){launch(sched[si]);si++}
 // update rockets
 rockets=rockets.filter(r=>{r.age+=dt;r.vy+=120*dt;r.x+=r.vx*dt;r.y+=r.vy*dt;
  if(R()<.8)P(r.x,r.y,(R()-.5)*20,30,[255,180,100],.4,1*r.sc,{g:20});
  if(r.age>r.fuse){burst(r);return false}return true});
 for(const p of parts){
  p.tr.push(p.x,p.y);if(p.tr.length>(p.tw?16:8))p.tr.splice(0,2);
  p.vx*=Math.pow(p.drag,dt*60);p.vy=p.vy*Math.pow(p.drag,dt*60)+p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
  if(p.split&&p.max-p.life>p.split){p.split=0;for(let k=0;k<4;k++){const a=k*1.57+.78;P(p.x,p.y,Math.cos(a)*70,Math.sin(a)*70,PAL[5],.8,p.sz)}p.life=0}
 }
 parts=parts.filter(p=>p.life>0&&p.y<HOR+40);
 flash=flash.map(f=>f*Math.pow(.04,dt));shake*=Math.pow(.02,dt);
 // draw sky
 c.save();c.translate((R()-.5)*shake,(R()-.5)*shake);
 const fi=flash[0]+flash[1]+flash[2];
 let g=c.createLinearGradient(0,0,0,HOR);
 g.addColorStop(0,`rgb(${4+flash[0]*40|0},${6+flash[1]*40|0},${18+flash[2]*50|0})`);
 g.addColorStop(1,`rgb(${30+flash[0]*120|0},${22+flash[1]*90|0},${50+flash[2]*90|0})`);
 c.fillStyle=g;c.fillRect(-20,-20,W+40,HOR+20);
 for(const s of stars){c.globalAlpha=(.4+.4*Math.sin(T*2+s[3]))*Math.max(0,1-fi*.6);c.fillStyle='#fff';c.fillRect(s[0],s[1],s[2],s[2])}
 c.globalAlpha=1;
 // smoke haze from accumulation
 c.globalCompositeOperation='lighter';
 const drawP=(mir)=>{for(const p of parts){const a=Math.min(1,p.life/p.max*1.5)*(p.tw?(.6+.4*Math.sin(p.life*40+p.x)):1);
  const [r,gg,b]=p.col;c.strokeStyle=`rgba(${r},${gg},${b},${a*.45*(mir?.5:1)})`;c.lineWidth=p.sz;
  c.beginPath();for(let i=0;i<p.tr.length;i+=2){const yy=mir?2*HOR-p.tr[i+1]:p.tr[i+1];i?c.lineTo(p.tr[i],yy):c.moveTo(p.tr[i],yy)}c.stroke();
  if(!mir){c.fillStyle=`rgba(255,${200+gg/5|0},${180+b/4|0},${a})`;c.fillRect(p.x-p.sz/2,p.y-p.sz/2,p.sz,p.sz)}}};
 drawP(false);
 for(const r of rockets){c.fillStyle='#ffd';c.beginPath();c.arc(r.x,r.y,2*r.sc,0,7);c.fill()}
 // glow bloom
 if(fi>.02){const gl=c.createRadialGradient(640,250,0,640,250,700);gl.addColorStop(0,`rgba(${flash[0]*255|0},${flash[1]*255|0},${flash[2]*255|0},${Math.min(.5,fi*.15)})`);gl.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=gl;c.fillRect(0,0,W,H)}
 c.globalCompositeOperation='source-over';
 // water
 g=c.createLinearGradient(0,HOR,0,H);g.addColorStop(0,'#0b0d1c');g.addColorStop(1,'#020208');c.fillStyle=g;c.fillRect(-20,HOR,W+40,H-HOR+20);
 c.save();c.beginPath();c.rect(0,HOR,W,H-HOR);c.clip();c.globalCompositeOperation='lighter';
 c.setTransform(1,0,0,1,0,0);drawP(true);
 // shimmer lines
 for(let y=HOR+4;y<H;y+=4){const k=(y-HOR)/(H-HOR);c.fillStyle=`rgba(${flash[0]*200|0},${flash[1]*200|0},${flash[2]*220|0},${.08*(1-k)})`;c.fillRect(Math.sin(y*.3+T*3)*20,y,W,1)}
 c.restore();
 // city silhouette lit by flash
 const lc=`rgb(${8+flash[0]*50|0},${8+flash[1]*45|0},${14+flash[2]*55|0})`;c.fillStyle=lc;
 for(const b of city)c.fillRect(b[0],HOR-b[2],b[1]+1,b[2]);
 for(const w of wins){c.fillStyle=`rgba(255,${200+w[2]*40|0},120,${.35+.3*Math.sin(T*.3+w[2]*20)})`;c.fillRect(w[0],w[1],2,2)}
 // foreground silhouettes of spectators
 c.fillStyle='#000';for(let i=0;i<26;i++){const x=i*52+((i*37)%20),h=40+((i*13)%25);c.beginPath();c.arc(x,H-h,13,0,7);c.fill();c.fillRect(x-17,H-h+8,34,h)}
 c.restore();
 // titles
 c.font='300 26px sans-serif';c.textAlign='center';
 const tl=[[0,5,'Gece Gölü — Işık Senfonisi'],[8,11,'II. Ritim'],[20,23,'III. Derinlik'],[36,39,'IV. Final']];
 for(const q of tl)if(T>q[0]&&T<q[1]){c.fillStyle=`rgba(255,240,220,${Math.min(1,T-q[0],q[1]-T)*.85})`;c.fillText(q[2],640,60)}
 if(T>44.5){c.fillStyle=`rgba(255,240,220,${Math.min(1,T-44.5,DUR-T)*.9})`;c.font='300 34px sans-serif';c.fillText('İyi geceler',640,620)}
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
