<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CLAUDE — Motion Design Reel</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#000}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const DUR=15;window.DUR=DUR;
const BPM=128,B=60/BPM,BAR=B*4;
const cv=document.getElementById('c'),X=cv.getContext('2d');
const W=1280,H=720,S=1920/1280;
function fit(){const k=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*k+'px';cv.style.height=H*k+'px'}
addEventListener('resize',fit);fit();
const q=new URLSearchParams(location.search);const T0=parseFloat(q.get('t'))||0;
const start=performance.now();
const C={bg:'#0a0a12',o:'#ff5a36',c:'#36d6ff',y:'#ffd23f',p:'#ff3d8b',w:'#f4f1ea',v:'#7b5cff'};
const PAL=[C.o,C.c,C.y,C.p,C.v];
const cl=v=>v<0?0:v>1?1:v;
const eo=v=>1-Math.pow(1-cl(v),4);
const eio=v=>{v=cl(v);return v<.5?8*v*v*v*v:1-Math.pow(-2*v+2,4)/2};
const eb=v=>{v=cl(v);const c1=1.9,c3=c1+1;return 1+c3*Math.pow(v-1,3)+c1*Math.pow(v-1,2)};
function rnd(s){s=Math.sin(s*127.1+311.7)*43758.5453;return s-Math.floor(s)}
const F='"Helvetica Neue",Helvetica,Arial,sans-serif';
function txt(s,x,y,sz,col,wt='900',al='center',ls=0){X.font=`${wt} ${sz}px ${F}`;X.fillStyle=col;X.textAlign=al;X.textBaseline='middle';if(ls){X.letterSpacing=ls+'px'}else X.letterSpacing='0px';X.fillText(s,x,y)}
function poly(pts){X.beginPath();pts.forEach((p,i)=>i?X.lineTo(p[0],p[1]):X.moveTo(p[0],p[1]));X.closePath()}

/* ---------- AUDIO ---------- */
let AC=null,songOff=0,nextBeat=0,noiseBuf;
function initAudio(){
 if(AC){AC.resume();return}
 try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}
 noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 const t=songTime();songOff=AC.currentTime-t;nextBeat=Math.ceil(t/B*2);
 AC.master=AC.createGain();AC.master.gain.value=.7;
 const comp=AC.createDynamicsCompressor();AC.master.connect(comp);comp.connect(AC.destination);
}
addEventListener('pointerdown',initAudio);addEventListener('keydown',initAudio);
try{initAudio()}catch(e){}
function env(g,t,a,peak,dec){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+dec)}
function kick(t){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(42,t+.12);env(g,t,.003,1,.42);o.connect(g);g.connect(AC.master);o.start(t);o.stop(t+.5)}
function noise(t,f,dur,vol,type='highpass'){const s=AC.createBufferSource();s.buffer=noiseBuf;const fl=AC.createBiquadFilter();fl.type=type;fl.frequency.value=f;const g=AC.createGain();env(g,t,.002,vol,dur);s.connect(fl);fl.connect(g);g.connect(AC.master);s.start(t,Math.random()*.5);s.stop(t+dur+.05)}
function tone(t,f,dur,vol,type,cut){const o=AC.createOscillator(),g=AC.createGain(),fl=AC.createBiquadFilter();o.type=type;o.frequency.value=f;fl.type='lowpass';fl.frequency.setValueAtTime(cut,t);fl.frequency.exponentialRampToValueAtTime(200,t+dur);env(g,t,.005,vol,dur);o.connect(fl);fl.connect(g);g.connect(AC.master);o.start(t);o.stop(t+dur+.05)}
const ROOT=[45,45,41,41,48,48,43,45];const mf=m=>440*Math.pow(2,(m-69)/12);
function schedule(){
 if(!AC||AC.state!=='running')return;
 while(songOff+nextBeat*B/2<AC.currentTime+.15){
  const n=nextBeat,t=songOff+n*B/2;const e=((n%64)+64)%64,beat=e>>1,off=e&1,bar=beat>>2,bb=beat&3;
  if(t>=AC.currentTime-.01){
   if(!off){kick(t);if(bb==1||bb==3)noise(t,1800,.22,.5,'bandpass')}
   noise(t+(off?0:0),off?7000:9000,off?.09:.04,off?.28:.12);
   tone(t,mf(ROOT[bar]-12+(off?12:0)),B/2*.9,.35,'sawtooth',900);
   if(bb==0&&!off)[0,7,12,16].forEach(i=>tone(t,mf(ROOT[bar]+12+i),BAR*.5,.07,'square',2600));
   if(bar==7&&bb==3&&!off)noise(t,400,1.2,.4,'lowpass');
   if(e==0)noise(t,3000,1.5,.3);
  }
  nextBeat++;
 }
}
function songTime(){return((performance.now()-start)/1000+T0)%DUR}

/* ---------- SECTIONS ---------- */
function label(n,name,col){txt(n,60,60,14,col,'700','left',4);txt(name,60,82,14,col,'400','left',4)}

function s0(bt,bi,bp){ // intro name
 X.fillStyle=C.bg;X.fillRect(0,0,W,H);
 for(let i=0;i<24;i++){X.strokeStyle='rgba(255,255,255,.04)';X.beginPath();X.moveTo(i*56,0);X.lineTo(i*56,H);X.stroke()}
 const L='CLAUDE',grp=[0,0,1,2,2,3];const w=150,x0=W/2-w*2.5;
 for(let i=0;i<6;i++){const tt=(bt-grp[i]*B)/(B*.7);if(tt<0)continue;
  const y=H/2-10-(1-eb(tt))*300;X.save();X.translate(x0+i*w,y);X.rotate((1-eo(tt))*(i%2?.4:-.4));
  txt(L[i],6,6,190,PAL[i%5],'900');txt(L[i],0,0,190,C.w,'900');X.restore()}
 const u=eo((bt-3*B)/(B*.8));X.fillStyle=C.o;X.fillRect(W/2-420*u,H/2+105,840*u,6);
 if(u>0){X.globalAlpha=u;txt('MOTION DESIGNER  —  SHOWREEL',W/2,H/2+150,22,C.w,'400','center',10);X.globalAlpha=1}
}
function s1(bt,bi,bp){ // shape morph
 const bgc=[C.v,C.o,C.c,C.p][bi];X.fillStyle=bgc;X.fillRect(0,0,W,H);
 const shapes=[a=>1,a=>1/Math.max(Math.abs(Math.cos(a)),Math.abs(Math.sin(a))),a=>{const k=Math.PI*2/3;const m=((a+Math.PI/2)%k+k)%k-k/2;return .5/Math.cos(m)},a=>{const k=Math.PI/5;const m=((a)%(2*k)+2*k)%(2*k);return .55+.45*Math.abs(1-m/k)}];
 const a1=shapes[bi],a0=shapes[(bi+3)%4],m=eio(bp/.6);const rot=(bi+eb(bp/.6))*Math.PI/2;
 for(let L=3;L>=0;L--){const pts=[];const R=(200-L*40)*(1+.08*Math.exp(-bp*8));
  for(let i=0;i<120;i++){const a=i/120*Math.PI*2;const r=R*(a0(a)*(1-m)+a1(a)*m);const ar=a+rot*(L%2?-1:1)*.6;pts.push([W/2+Math.cos(ar)*r,H/2+Math.sin(ar)*r])}
  poly(pts);X.fillStyle=L%2?C.bg:C.w;X.fill()}
 label('01','SHAPE / MORPH',C.bg);
 txt(['CIRCLE','SQUARE','TRIANGLE','STAR'][bi],W-60,H-60,18,C.bg,'700','right',6);
}
function s2(bt,bi,bp){ // kinetic type
 const w=['MOVE','WITH','THE','BEAT'][bi];const bgs=[C.y,C.bg,C.p,C.c];X.fillStyle=bgs[bi];X.fillRect(0,0,W,H);
 const fg=bi==1?C.y:C.bg;const s=1+.25*Math.exp(-bp*10);
 X.save();X.translate(W/2,H/2);X.scale(s,s);
 for(let r=-3;r<=3;r++){if(!r)continue;X.globalAlpha=.12;txt(w,(bt*400*(r%2?1:-1))%400,r*110,120,fg,'900')}
 X.globalAlpha=1;const sl=eo(bp/.25);X.save();X.beginPath();X.rect(-W/2,-110,W,220);X.clip();
 txt(w,0,(1-sl)*220,230,fg,'900');X.restore();X.restore();
 label('02','KINETIC TYPE',fg);
}
function s3(bt,bi,bp){ // particles
 X.fillStyle='#05050a';X.fillRect(0,0,W,H);X.globalCompositeOperation='lighter';
 for(let b=0;b<=bi;b++){const age=bt-b*B;const cx=W/2+(b%2?1:-1)*(b*90),cy=H/2+(b>1?60:-60)*(b%2?1:-1);
  const ring=eo(age/.6)*360;X.strokeStyle=PAL[b];X.globalAlpha=cl(1-age/.8);X.lineWidth=4;X.beginPath();X.arc(cx,cy,ring,0,7);X.stroke();
  for(let i=0;i<90;i++){const a=rnd(i+b*99)*7,sp=150+rnd(i*3+b)*500;const d=sp*(1-Math.exp(-age*3))/3*2;
   const x=cx+Math.cos(a)*d,y=cy+Math.sin(a)*d+age*age*60;X.globalAlpha=cl(1-age/1.6)*.9;X.fillStyle=PAL[(i+b)%5];
   X.beginPath();X.arc(x,y,2+rnd(i)*4,0,7);X.fill()}}
 X.globalAlpha=1;X.globalCompositeOperation='source-over';
 txt('PARTICLES',W/2,H/2,64+20*Math.exp(-bp*8),C.w,'900','center',20);
 label('03','SIMULATION / FX',C.w);
}
function s4(bt,bi,bp){ // grid wave
 X.fillStyle=C.bg;X.fillRect(0,0,W,H);const cs=80,cols=16,rows=9;
 for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){
  const d=[i+j,cols-i+j,Math.hypot(i-7.5,j-4),i][bi]*.035;const v=eio((bp*B-d)/.3);
  const k=(bi+v)%2;const s=.15+.7*Math.abs(Math.cos(v*Math.PI));X.save();X.translate(i*cs+cs/2,j*cs+cs/2);X.rotate(v*Math.PI/2);
  X.fillStyle=PAL[(i+j+bi)%5];if((i+j)%3==0){X.beginPath();X.arc(0,0,cs*s/2,0,7);X.fill()}else X.fillRect(-cs*s/2,-cs*s/2,cs*s,cs*s);X.restore()}
 X.fillStyle='rgba(10,10,18,.75)';X.fillRect(40,40,300,64);label('04','GRID SYSTEMS',C.w);
}
function s5(bt,bi,bp){ // 3d
 const g=X.createRadialGradient(W/2,H/2,50,W/2,H/2,700);g.addColorStop(0,'#1a1440');g.addColorStop(1,'#05050a');X.fillStyle=g;X.fillRect(0,0,W,H);
 const ry=(bi+eb(bp/.5))*Math.PI/4+bt*.2,rx=.5+Math.sin(bt)*.2;
 const P=(x,y,z)=>{let c=Math.cos(ry),s=Math.sin(ry);[x,z]=[x*c-z*s,x*s+z*c];c=Math.cos(rx);s=Math.sin(rx);[y,z]=[y*c-z*s,y*s+z*c];const f=700/(z+700);return[W/2+x*f,H/2+y*f,z]};
 for(let k=0;k<3;k++){X.strokeStyle=PAL[k+1];X.lineWidth=2;X.globalAlpha=.6;X.beginPath();
  for(let i=0;i<=80;i++){const a=i/80*7;const r=260+k*40;let x=Math.cos(a)*r,y=Math.sin(a)*r*.1*(k-1)*3,z=Math.sin(a)*r;const p=P(x,y+k*5,z);i?X.lineTo(p[0],p[1]):X.moveTo(p[0],p[1])}X.stroke()}
 X.globalAlpha=1;const sz=140*(1+.1*Math.exp(-bp*8));const V=[];for(let i=0;i<8;i++)V.push(P(i&1?sz:-sz,i&2?sz:-sz,i&4?sz:-sz));
 const faces=[[0,1,3,2],[4,5,7,6],[0,1,5,4],[2,3,7,6],[0,2,6,4],[1,3,7,5]];
 faces.map((f,i)=>[f,i,f.reduce((a,v)=>a+V[v][2],0)]).sort((a,b)=>b[2]-a[2]).forEach(([f,i])=>{poly(f.map(v=>V[v]));X.fillStyle=PAL[i%5];X.globalAlpha=.85;X.fill();X.globalAlpha=1;X.strokeStyle=C.w;X.lineWidth=2;X.stroke()});
 label('05','3D / CAMERA',C.w);txt('DEPTH · ORBIT · LIGHT',W-60,H-60,16,C.w,'400','right',6);
}
function s6(bt,bi,bp){ // services stripes
 X.fillStyle=C.w;X.fillRect(0,0,W,H);X.save();X.translate(W/2,H/2);X.rotate(-.35);
 for(let i=-10;i<10;i++){const o=(i%2?1:-1)*(bi+eo(bp/.4))*160;X.fillStyle=PAL[(i+20)%5];X.fillRect(-1200+o+(i%3)*40,i*70,2400,30)}X.restore();
 X.fillStyle=C.bg;X.fillRect(W/2-380,H/2-150,760,300);
 const L=['BRAND IDENTITY','UI ANIMATION','3D & CGI','TITLE DESIGN'];
 for(let i=0;i<=bi;i++){const a=eo((bt-i*B)/.3);X.globalAlpha=i==bi?1:.35;txt((i+1+'').padStart(2,'0')+'  '+L[i],W/2-330+(1-a)*-40,H/2-105+i*70,i==bi?42:30,i==bi?PAL[i]:C.w,'900','left')}X.globalAlpha=1;
 label('06','SERVICES',C.bg);
}
function s7(bt,bi,bp){ // outro
 X.fillStyle=C.bg;X.fillRect(0,0,W,H);
 for(let i=0;i<5;i++){const r=eo(bt/(B*(1+i*.4)))*(120+i*90);X.strokeStyle=PAL[i];X.globalAlpha=.5;X.lineWidth=3;X.beginPath();X.arc(W/2,H/2-30,r,-Math.PI/2,-Math.PI/2+eio(bt/BAR*1.3)*7);X.stroke()}X.globalAlpha=1;
 const a=eb(bt/(B*.8));X.save();X.translate(W/2,H/2-30);X.scale(a,a);txt('CLAUDE',0,0,150,C.w,'900','center',12);X.restore();
 const b=eo((bt-B)/(B*.6));X.globalAlpha=b;txt('MOTION DESIGNER',W/2,H/2+70,26,C.o,'700','center',14);
 const c=eo((bt-2*B)/(B*.6));X.globalAlpha=c;txt('hello@claude.design  ·  available for work',W/2,H/2+120,18,C.w,'400','center',4);
 X.globalAlpha=1;const f=cl((bt-3.4*B)/(BAR-3.4*B));X.fillStyle=`rgba(0,0,0,${f})`;X.fillRect(0,0,W,H);
}
const SEC=[s0,s1,s2,s3,s4,s5,s6,s7];

function frame(){
 const t=songTime();schedule();
 X.setTransform(S,0,0,S,0,0);
 const bar=Math.min(7,Math.floor(t/BAR)),bt=t-bar*BAR,bi=Math.min(3,Math.floor(bt/B)),bp=(bt-bi*B)/B;
 SEC[bar](bt,bi,bp);
 // bar transition wipe
 if(bar>0){const w=eio(bt/.35);X.fillStyle=PAL[bar%5];X.fillRect(W*w,0,W*(1-w)+2,H);X.fillStyle=C.w;X.fillRect(W*w-12,0,12*(1-w),H)}
 // beat flash
 X.fillStyle=`rgba(255,255,255,${.12*Math.exp(-bp*B*18)})`;X.fillRect(0,0,W,H);
 // HUD
 const light=[2,6].includes(bar)||(bar==1);const hc=light?C.bg:C.w;
 if(bar<7){txt('CLAUDE® REEL',W-60,60,14,hc,'700','right',4);txt('BAR '+(bar+1)+'/8 · 128 BPM',W-60,82,12,hc,'400','right',4)}
 for(let i=0;i<32;i++){const on=i<=bar*4+bi;X.fillStyle=on?(light?C.bg:C.o):'rgba(128,128,128,.35)';X.fillRect(60+i*36.25,H-28,30,i==bar*4+bi?6:3)}
 // grain / vignette
 const vg=X.createRadialGradient(W/2,H/2,H*.4,W/2,H/2,H);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.35)');X.fillStyle=vg;X.fillRect(0,0,W,H);
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
