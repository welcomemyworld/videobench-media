</head><body><canvas id="c" width="1280" height="720"></canvas>
<script>
/* 阶段时长：预备 0–3.6s ｜ 升级 3.6–9.8s（三次，每次约1.1s）｜ 蓄力 10–12s ｜ 爆发 12–13.6s ｜ 揭晓 13.6–19.8s ｜ 结算 19.8–26s
   强度参数：BOOST（爆发总强度）、FLASH（闪白上限≤0.8）、SHAKE（震屏像素）、NP（粒子数量倍率）、PUSH（镜头前推量） */
const DUR=26;window.DUR=DUR;
const BOOST=1,FLASH=0.8,SHAKE=16,PUSH=0.08;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;const NP=RM?0.4:1;
const cv=document.getElementById('c'),g=cv.getContext('2d');const W=1280,H=720;
const t0=parseFloat(new URLSearchParams(location.search).get('t'))||0;
let start=performance.now()-t0*1000,prevT=t0;
const OL='#1A1033';
const TIERS=[{n:'普通宝箱',c:'#3fcf55',l:'#b8ff9a',bg:['#12452e','#071a14']},{n:'稀有宝箱',c:'#3a8cff',l:'#a8d4ff',bg:['#123a6e','#061229']},
{n:'史诗宝箱',c:'#a64dff',l:'#e2b6ff',bg:['#3d1666','#12061f']},{n:'传说宝箱',c:'#ffb81f',l:'#fff1a0',bg:['#6b3a08','#1f0c02']}];

const rnd=i=>{let x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const eob=x=>{x=cl(x);const s=2.2;return 1+(s+1)*Math.pow(x-1,3)+s*Math.pow(x-1,2)};
const eoe=x=>{x=cl(x);return x===0?0:x===1?1:Math.pow(2,-10*x)*Math.sin((x*10-0.75)*2.094)+1};
const eio=x=>{x=cl(x);return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2};
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const rgba=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const mix=(a,b,k)=>a.map((v,i)=>v+(b[i]-v)*k);
function tierAt(t){let n=0;for(const u of UPS)if(t>=u+0.4)n++;return n}

// ---------- Audio ----------
let AC=null,muted=false;
function tone(f,d,type='sine',f2=0,v=.2,dl=0){if(!AC||muted)return;const o=AC.createOscillator(),gg=AC.createGain(),t=AC.currentTime+dl;
o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);gg.gain.setValueAtTime(v,t);gg.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(gg).connect(AC.destination);o.start(t);o.stop(t+d)}
function noise(d,v=.4){if(!AC||muted)return;const b=AC.createBuffer(1,AC.sampleRate*d,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*Math.pow(1-i/a.length,2);
const s=AC.createBufferSource(),f=AC.createBiquadFilter(),gg=AC.createGain();f.type='lowpass';f.frequency.value=1200;gg.gain.value=v;s.buffer=b;s.connect(f).connect(gg).connect(AC.destination);s.start()}
const SFX={jump:()=>tone(300,.25,'square',700,.08),land:()=>tone(120,.2,'sine',50,.4),chord:k=>[0,4,7,12].forEach((s,i)=>tone(392*Math.pow(2,(s+k*2)/12),.6,'triangle',0,.12,i*.05)),
charge:()=>{tone(150,2,'sawtooth',1200,.07);tone(152,2,'square',1210,.03)},boom:()=>{tone(90,1,'sine',30,.7);noise(1.1,.5)},pop:()=>tone(500,.15,'sine',1100,.18),
tick:()=>tone(1500,.04,'square',0,.04),coin:()=>tone(1800+Math.random()*400,.18,'triangle',2600,.1),fan:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.5+i*.1,'sawtooth',0,.07,i*.12))};
const EV=[];UPS.forEach((u,i)=>{EV.push([u,'jump'],[u+.8,'land'],[u+.4,'chord',i+1])});EV.push([CH,'charge'],[B,'boom'],[13.8,'pop'],[14.2,'fan'],[15.2,'pop'],[CLAIM,'pop']);

// ---------- 3D chest (projected polygons, toon shaded) ----------
const D=8,F=8*120,CX=640,CY=520;const LGT=[-.45,.75,.5],RIM=[.85,.15,-.5];

function drawChest(st,tier,alpha){

  x*=st.sx;y*=st.sy;z*=st.sx;[x,z]=[x*cy+z*sy,-x*sy+z*cy];y+=st.h-.8;[y,z]=[y*cp-z*sp,y*sp+z*cp];return[x+st.dx,y,z]};
 const box=(a,b,col,lid)=>{const c=[];for(let i=0;i<8;i++)c.push(X([i&1?b[0]:a[0],i&2?b[1]:a[1],i&4?b[2]:a[2]],lid));

   if(n[0]*(-fc[0])+n[1]*(-fc[1])+n[2]*(D-fc[2])<=0)return;
   const d=n[0]*LN[0]+n[1]*LN[1]+n[2]*LN[2],k=d>.55?1.12:d>.1?.9:d>-.3?.72:.58;let cc=col.map(v=>Math.min(255,v*k));
   const rim=n[0]*RN[0]+n[1]*RN[1]+n[2]*RN[2];if(rim>.45)cc=mix(cc,hex(tier.l),.45);
   faces.push({p:p.map(q=>{const s=F/(D-q[2]);return[CX+q[0]*s,CY-q[1]*s]}),z:fc[2],c:cc})})};

 for(let i=0;i<3;i++)box([-1.1,.06+i*.385,-.75],[1.1,.06+i*.385+.35,.75],wood);
 box([-1.16,0,-.8],[1.16,.1,.8],metal);

 box([-1.1,1.2,-.75],[1.1,1.58,.75],wood,1);box([-1.02,1.58,-.6],[1.02,1.7,.6],wood,1);
 for(const s of[-.78,.78]){box([s-.11,1.19,-.79],[s+.11,1.74,.79],metal,1);box([s-.045,1.36,.79],[s+.045,1.45,.85],gold,1)}
 box([-.2,1.0,.75],[.2,1.36,.9],gold,1);box([-.09,1.12,.9],[.09,1.26,.96],hex(tier.l),1);
 faces.sort((a,b)=>a.z-b.z);g.save();g.globalAlpha=alpha;g.lineJoin='round';
 const path=f=>{g.beginPath();f.p.forEach((q,i)=>i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]));g.closePath()};
 g.strokeStyle=OL;g.fillStyle=OL;g.lineWidth=9;faces.forEach(f=>{path(f);g.fill();g.stroke()});
 g.lineWidth=2;faces.forEach(f=>{path(f);g.fillStyle=rgba(f.c);g.fill();g.stroke()});g.restore();
 const pr=q=>{const s=F/(D-q[2]);return[CX+q[0]*s,CY-q[1]*s]};return{seamL:pr(X([-1.1,1.2,.76],0)),seamR:pr(X([1.1,1.2,.76],0)),top:pr(X([0,1.3,0],0))}}

function rr(x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r)}

 g.fillStyle='rgba(0,0,0,.45)';g.fillText(s,x+sz*.06,y+sz*.1);g.lineWidth=sz*.2;g.strokeStyle=OL;g.strokeText(s,x,y);g.fillStyle=fill;g.fillText(s,x,y)}

 ch.forEach((c,i)=>{const d=t-t0-i*.07;if(d<0){cx+=w[i];return}const k=eob(d/.35),sc=3-2*k;g.save();g.globalAlpha=cl(d/.12);g.translate(cx+w[i]/2,y);g.scale(sc*(1+.15*Math.exp(-d*8)*Math.sin(d*40)),sc);txt(c,0,0,sz,fill);g.restore();cx+=w[i]})}
function spark(x,y,r,col,a){g.globalAlpha=a*.25;g.fillStyle=col;g.beginPath();g.arc(x,y,r*3,0,7);g.fill();g.globalAlpha=a;g.fillStyle='#fff';g.beginPath();g.arc(x,y,r,0,7);g.fill();g.globalAlpha=1}

function coin(x,y,r,spin){g.save();g.translate(x,y);g.scale(Math.max(.15,Math.abs(Math.cos(spin))),1);g.lineWidth=3;g.strokeStyle=OL;g.fillStyle='#e8a10c';g.beginPath();g.arc(0,0,r,0,7);g.fill();g.stroke();
 g.fillStyle='#ffd84a';g.beginPath();g.arc(-r*.08,-r*.08,r*.72,0,7);g.fill();g.fillStyle='#fff6c0';g.beginPath();g.arc(-r*.3,-r*.3,r*.18,0,7);g.fill();g.restore()}
function gem(x,y,r,spin,col='#ff3f8e'){g.save();g.translate(x,y);g.rotate(spin*.3);g.scale(Math.max(.3,Math.abs(Math.cos(spin))),1);g.lineWidth=3;g.strokeStyle=OL;
 g.fillStyle=col;g.beginPath();g.moveTo(0,-r);g.lineTo(r*.85,-r*.2);g.lineTo(0,r);g.lineTo(-r*.85,-r*.2);g.closePath();g.fill();g.stroke();
 g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.moveTo(0,-r*.2);g.lineTo(r*.85,-r*.2);g.lineTo(0,r);g.fill();g.fillStyle='rgba(255,255,255,.7)';g.beginPath();g.moveTo(0,-r);g.lineTo(-r*.85,-r*.2);g.lineTo(-r*.2,-r*.2);g.fill();
 g.lineWidth=1.2;g.beginPath();g.moveTo(-r*.85,-r*.2);g.lineTo(r*.85,-r*.2);g.stroke();g.restore()}
function metalPill(x,y,w,h,col){const gr=g.createLinearGradient(x,y,x+w*.3,y+h);gr.addColorStop(0,'#fff');gr.addColorStop(.25,col);gr.addColorStop(1,'#2a1a40');rr(x,y,w,h,h/2);g.fillStyle=gr;g.fill();g.lineWidth=3;g.strokeStyle=OL;g.stroke();

// ---------- hero card ----------

 g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.ellipse(0,h/2+26,130,16,0,0,7);g.fill();
 const cg=g.createConicGradient(t*2,0,0);for(let i=0;i<=6;i++)cg.addColorStop(i/6,`hsl(${i*60},100%,62%)`);
 rr(-w/2-12,-h/2-12,w+24,h+24,30);g.fillStyle=cg;g.fill();g.lineWidth=6;g.strokeStyle=OL;g.stroke();
 const bg=g.createLinearGradient(0,-h/2,0,h/2);bg.addColorStop(0,'#ffe27a');bg.addColorStop(1,'#d9711a');rr(-w/2,-h/2,w,h,22);g.fillStyle=bg;g.fill();g.lineWidth=4;g.stroke();
 g.save();rr(-w/2,-h/2,w,h,22);g.clip();g.globalAlpha=.22;g.fillStyle='#fff';
 for(let i=0;i<7;i++)for(let j=0;j<10;j++)star(-w/2+20+i*44+(j%2)*22,-h/2+20+j*42,7,'#fff',.6);g.restore();
 // creature: gem sprite "晶灵"
 const by=10+Math.sin(t*3)*6;g.fillStyle='rgba(60,20,0,.35)';g.beginPath();g.ellipse(0,120,80,14,0,0,7);g.fill();
 g.save();g.translate(0,by);const body=()=>{g.beginPath();g.moveTo(0,-120);g.quadraticCurveTo(105,-70,95,30);g.quadraticCurveTo(80,105,0,108);g.quadraticCurveTo(-80,105,-95,30);g.quadraticCurveTo(-105,-70,0,-120);g.closePath()};
 body();g.fillStyle='#ff5aa8';g.fill();g.save();body();g.clip();g.fillStyle='#c82a7a';g.beginPath();g.ellipse(45,40,90,110,-.3,0,7);g.fill();
 g.fillStyle='#ffc2e0';g.beginPath();g.ellipse(-40,-60,28,42,-.5,0,7);g.fill();g.restore();
 body();g.lineWidth=8;g.strokeStyle=OL;g.stroke();g.lineWidth=2.5;g.beginPath();g.moveTo(0,-120);g.lineTo(-30,-10);g.lineTo(0,108);g.moveTo(-30,-10);g.lineTo(-95,30);g.moveTo(-30,-10);g.lineTo(60,-30);g.stroke();
 const bl=(Math.sin(t*1.7)>.97)?.15:1;for(const s of[-1,1]){g.fillStyle='#fff';g.beginPath();g.ellipse(s*32,10,17,22*bl,0,0,7);g.fill();g.lineWidth=4;g.stroke();
  g.fillStyle=OL;g.beginPath();g.ellipse(s*32+4,14,9,13*bl,0,0,7);g.fill();g.fillStyle='#fff';g.beginPath();g.arc(s*32+7,8,4,0,7);g.fill()}
 g.lineWidth=5;g.beginPath();g.moveTo(-22,50);g.quadraticCurveTo(0,72,22,50);g.stroke();g.fillStyle='#ff9ccc';g.beginPath();g.ellipse(-62,40,12,7,0,0,7);g.ellipse(62,40,12,7,0,0,7);g.fill();g.restore();

// ---------- main ----------
function frame(now){let t=((now-start)/1000)%DUR;if(t<prevT)prevT=t-.0001;

  for(let i=0;i<n;i++){cg.addColorStop(i/n,rgba(hex(tier.l),0));cg.addColorStop((i+.5)/n,rgba(hex(tier.l),[.09,.06,.05][L]))}cg.addColorStop(1,rgba(hex(tier.l),0));g.fillStyle=cg;g.fillRect(-60,-60,1400,840)}
 g.globalAlpha=.08;g.fillStyle='#fff';for(let i=0;i<40;i++){const x=rnd(i)*1280,y=(rnd(i+50)*720-t*20*(.5+rnd(i+9)))%720;g.beginPath();g.arc(x,y<0?y+720:y,2+rnd(i+3)*3,0,7);g.fill()}g.globalAlpha=1;
 // chest state

 // charge inward particles
