<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>2025: The Year AI Went Vertical</title>
<style>
html,body{margin:0;background:#000;height:100%;overflow:hidden}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;display:block;background:#000}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1280" height="720"></canvas></div>
<script>
window.DUR = 56;
const cv = document.getElementById('c'), x = cv.getContext('2d');
const W = 1280, H = 720;
const q = new URLSearchParams(location.search);
const T0 = performance.now() - (parseFloat(q.get('t')) || 0) * 1000;

const EV = [
 [0.65,'DeepSeek-R1','DeepSeek','Open-weights reasoning shock','#4da3ff'],
 [0.97,'o3-mini','OpenAI','Fast, cheap reasoning','#e8e8e8'],
 [1.55,'Grok 3','xAI','Giant compute, think mode','#ff5a5a'],
 [1.80,'Claude 3.7 Sonnet','Anthropic','Hybrid reasoning + Claude Code','#ff9a5c'],
 [1.87,'GPT-4.5','OpenAI','Largest chat model yet','#e8e8e8'],
 [2.80,'Gemini 2.5 Pro','Google','Thinking model, 1M context','#7cf0c8'],
 [3.15,'Llama 4','Meta','Open multimodal MoE','#5a8cff'],
 [3.50,'o3 + o4-mini','OpenAI','Agentic tool use while reasoning','#e8e8e8'],
 [3.95,'Qwen3','Alibaba','Open hybrid thinking family','#b98cff'],
 [4.70,'Claude 4','Anthropic','Long-horizon coding agents','#ff9a5c'],
 [6.30,'Grok 4','xAI','Frontier reasoning push','#ff5a5a'],
 [6.40,'Kimi K2','Moonshot','Open agentic trillion-param MoE','#ffd84d'],
 [7.15,'gpt-oss','OpenAI','OpenAI returns to open weights','#e8e8e8'],
 [7.22,'GPT-5','OpenAI','Unified fast + thinking system','#e8e8e8'],
 [8.95,'Claude Sonnet 4.5','Anthropic','Hours of autonomous work','#ff9a5c'],
 [10.55,'Gemini 3','Google','Frontier multimodal reasoning','#7cf0c8'],
 [10.75,'Claude Opus 4.5','Anthropic','Top-tier agentic coding','#ff9a5c']
];
const N = EV.length, TS = 5, TE = 39, STEP = (TE - TS) / N;
EV.forEach((e, i) => { e.t = TS + i * STEP; e.s = 18 + 76 * Math.pow(i / (N - 1), 0.85) + Math.sin(i * 2.3) * 2; });
const MON = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const CAPS = ['REASONING','CODING AGENTS','1M+ CONTEXT','MULTIMODAL','OPEN WEIGHTS','COMPUTER USE','TOOL USE'];

// chart geometry
const CX0 = 110, CX1 = 1200, CY0 = 640, CY1 = 150;
const px = m => CX0 + (CX1 - CX0) * m / 12;
const py = s => CY0 - (CY0 - CY1) * s / 100;

// stars
const ST = [];
for (let i = 0; i < 260; i++) ST.push([Math.random() * W, Math.random() * H, Math.random() * 2 + .3, Math.random()]);

const cl = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const eo = t => 1 - Math.pow(1 - cl(t), 3);
const back = t => { t = cl(t); const c = 2.2; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };

function txt(s, X, Y, size, col, al = 'center', w = '900', a = 1) {
  x.globalAlpha = a; x.font = `${w} ${size}px Helvetica, Arial, sans-serif`;
  x.textAlign = al; x.textBaseline = 'middle'; x.fillStyle = col; x.fillText(s, X, Y); x.globalAlpha = 1;
}

function bg(t, speed) {
  const g = x.createRadialGradient(W / 2, H / 2, 50, W / 2, H / 2, 800);
  g.addColorStop(0, '#0b1230'); g.addColorStop(1, '#000');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  for (const s of ST) {
    const xx = (s[0] - t * speed * s[2] * 20) % W, X = xx < 0 ? xx + W : xx;
    x.globalAlpha = .3 + .7 * Math.abs(Math.sin(t * 2 + s[3] * 9));
    x.fillStyle = '#9cc4ff'; x.fillRect(X, s[1], s[2] * (1 + speed * 2), s[2]);
  }
  x.globalAlpha = 1;
}

function flash(a, col = '#fff') { if (a <= 0) return; x.globalAlpha = cl(a); x.fillStyle = col; x.fillRect(0, 0, W, H); x.globalAlpha = 1; }

function intro(t) {
  bg(t, 1 + t * 2);
  const beats = [0.3, 1.0, 1.7];
  const words = ['BANG.', 'BANG.', 'BOOM.'];
  for (let i = 0; i < 3; i++) {
    const lt = t - beats[i];
    if (lt > 0 && (i == 2 || t < beats[i + 1])) {
      const s = 3 - 2 * back(lt * 4);
      x.save(); x.translate(W / 2, H / 2); x.scale(s, s);
      txt(words[i], 0, 0, 150, i == 2 ? '#ffd84d' : '#fff');
      x.restore();
      flash(.6 - lt * 2);
    }
  }
  if (t > 2.6) {
    const lt = t - 2.6;
    x.fillStyle = '#000'; x.globalAlpha = cl(lt * 3); x.fillRect(0, 0, W, H); x.globalAlpha = 1;
    const s = 1.6 - .6 * back(lt * 2.5);
    x.save(); x.translate(W / 2, H / 2 - 30); x.scale(s, s);
    const g = x.createLinearGradient(-300, 0, 300, 0);
    g.addColorStop(0, '#4da3ff'); g.addColorStop(.5, '#b98cff'); g.addColorStop(1, '#ff9a5c');
    x.shadowColor = '#7aa8ff'; x.shadowBlur = 40;
    txt('2025', 0, 0, 220, g); x.shadowBlur = 0;
    x.restore();
    txt('THE YEAR AI WENT VERTICAL', W / 2, H / 2 + 110, 36, '#cfe0ff', 'center', '700', cl((lt - .4) * 3));
    flash(.8 - lt * 2.5);
  }
}

function timeline(t) {
  const last = EV.filter(e => e.t <= t);
  const li = last.length - 1;
  const since = li >= 0 ? t - EV[li].t : 9;
  const sh = Math.max(0, 1 - since * 4) * 14;
  x.save(); x.translate((Math.random() - .5) * sh, (Math.random() - .5) * sh);
  bg(t, 1.5);
  // grid
  x.strokeStyle = 'rgba(120,160,255,.12)'; x.lineWidth = 1;
  for (let m = 0; m <= 12; m++) { x.beginPath(); x.moveTo(px(m), CY0); x.lineTo(px(m), CY1 - 20); x.stroke(); }
  for (let s = 0; s <= 100; s += 25) { x.beginPath(); x.moveTo(CX0, py(s)); x.lineTo(CX1, py(s)); x.stroke(); }
  for (let m = 0; m < 12; m++) txt(MON[m], px(m + .5), CY0 + 22, 15, m <= (li >= 0 ? EV[li][0] : -1) ? '#9cc4ff' : '#334', 'center', '700');
  x.save(); x.translate(60, (CY0 + CY1) / 2); x.rotate(-Math.PI / 2);
  txt('CAPABILITY (illustrative trend)', 0, 0, 14, '#6f86b8', 'center', '700'); x.restore();
  // curve
  if (li >= 0) {
    const pts = [[CX0, py(12)]];
    for (let i = 0; i <= li; i++) pts.push([px(EV[i][0]), py(EV[i].s)]);
    const k = eo(since * 3); const lp = pts[pts.length - 2], cp = pts[pts.length - 1];
    const tip = [lp[0] + (cp[0] - lp[0]) * k, lp[1] + (cp[1] - lp[1]) * k];
    pts[pts.length - 1] = tip;
    const g = x.createLinearGradient(CX0, 0, CX1, 0);
    g.addColorStop(0, '#4da3ff'); g.addColorStop(.5, '#b98cff'); g.addColorStop(1, '#ff7a3c');
    x.beginPath(); x.moveTo(pts[0][0], CY0);
    pts.forEach(p => x.lineTo(p[0], p[1])); x.lineTo(tip[0], CY0); x.closePath();
    const fg = x.createLinearGradient(0, CY1, 0, CY0); fg.addColorStop(0, 'rgba(150,120,255,.35)'); fg.addColorStop(1, 'rgba(60,100,255,0)');
    x.fillStyle = fg; x.fill();
    x.beginPath(); pts.forEach((p, i) => i ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1]));
    x.strokeStyle = g; x.lineWidth = 5; x.shadowColor = '#a08cff'; x.shadowBlur = 25; x.stroke(); x.shadowBlur = 0;
    // points + labels
    for (let i = 0; i <= li; i++) {
      const e = EV[i], X = px(e[0]), Y = py(e.s), a = t - e.t;
      const r = 6 + Math.max(0, 1 - a * 2) * 14;
      x.fillStyle = e[4]; x.shadowColor = e[4]; x.shadowBlur = 20;
      x.beginPath(); x.arc(X, Y, r, 0, 7); x.fill(); x.shadowBlur = 0;
      if (a < .6) { x.strokeStyle = e[4]; x.globalAlpha = 1 - a / .6; x.lineWidth = 3; x.beginPath(); x.arc(X, Y, 10 + a * 160, 0, 7); x.stroke(); x.globalAlpha = 1; }
      const up = i % 2 ? -24 : 26;
      txt(e[1], X, Y + up, 13, '#dfe8ff', 'center', '700', cl(a * 2) * (i >= li - 5 ? 1 : .45));
    }
    // sparks at tip
    for (let j = 0; j < 30; j++) {
      const a = j * 2.4 + t * 3, d = (since * 300 + j * 7) % 120;
      x.globalAlpha = cl(1 - d / 120) * cl(1 - since);
      x.fillStyle = EV[li][4]; x.fillRect(tip[0] + Math.cos(a) * d, tip[1] + Math.sin(a) * d, 3, 3);
    }
    x.globalAlpha = 1;
  }
  x.restore();
  // card
  if (li >= 0) {
    const e = EV[li], a = since;
    const s = back(a * 3.5) ; const out = cl((a - STEP + .25) * 5);
    x.save(); x.translate(140 - out * 60, 95); x.globalAlpha = 1 - out;
    x.scale(.6 + .4 * s, .6 + .4 * s);
    x.fillStyle = 'rgba(8,12,30,.82)'; x.strokeStyle = e[4]; x.lineWidth = 2;
    x.beginPath(); x.roundRect(-30, -55, 560, 120, 14); x.fill(); x.stroke();
    x.fillStyle = e[4]; x.fillRect(-30, -55, 8, 120);
    txt(MON[Math.floor(e[0])] + ' 2025  ·  ' + e[2].toUpperCase(), 0, -32, 15, e[4], 'left', '800', 1 - out);
    txt(e[1], 0, 2, 44, '#fff', 'left', '900', 1 - out);
    txt(e[3], 0, 42, 19, '#bcd0ff', 'left', '600', 1 - out);
    x.restore(); x.globalAlpha = 1;
    txt(String(li + 1).padStart(2, '0') + ' / ' + N, 1200, 60, 22, '#6f86b8', 'right', '800');
  }
  flash(.35 - since * 1.5);
  if (t < TS + .6) flash(1 - (t - TS) * 2);
}

function caps(t) {
  const lt = t - TE, per = 1.0;
  bg(t, 4);
  const i = Math.min(CAPS.length - 1, Math.floor(lt / per)), a = lt - i * per;
  // radial burst
  x.save(); x.translate(W / 2, H / 2);
  for (let k = 0; k < 48; k++) {
    const ang = k / 48 * 6.283 + i, r0 = 80 + a * 500, r1 = r0 + 120;
    x.strokeStyle = `hsla(${(i * 50 + k * 4) % 360},90%,65%,${cl(1 - a)})`; x.lineWidth = 3;
    x.beginPath(); x.moveTo(Math.cos(ang) * r0, Math.sin(ang) * r0); x.lineTo(Math.cos(ang) * r1, Math.sin(ang) * r1); x.stroke();
  }
  const s = 2.4 - 1.4 * back(a * 4);
  x.scale(s, s);
  x.shadowColor = `hsl(${i * 50},90%,60%)`; x.shadowBlur = 30;
  txt(CAPS[i], 0, 0, 92, '#fff'); x.shadowBlur = 0;
  x.restore();
  txt('CAPABILITIES UNLOCKED', W / 2, 120, 22, '#9cc4ff', 'center', '800');
  const bars = Math.min(CAPS.length, i + 1);
  for (let k = 0; k < CAPS.length; k++) {
    x.fillStyle = k < bars ? `hsl(${k * 50},90%,60%)` : '#1a2340';
    x.fillRect(W / 2 - 210 + k * 60, 600, 50, 8);
  }
  flash(.5 - a * 2);
}

function finale(t) {
  const lt = t - (TE + 7);
  bg(t, 2 + lt);
  // mini full curve rising off the top
  x.save(); x.globalAlpha = .35;
  x.beginPath(); x.moveTo(CX0, py(12));
  EV.forEach(e => x.lineTo(px(e[0]), py(e.s)));
  x.lineTo(px(12.5), py(100 + lt * 20)); x.strokeStyle = '#b98cff'; x.lineWidth = 4; x.stroke();
  x.restore();
  const s = 1.8 - .8 * back(lt * 2);
  x.save(); x.translate(W / 2, H / 2 - 40); x.scale(s, s);
  txt('17 FRONTIER RELEASES', 0, -60, 34, '#9cc4ff', 'center', '800');
  const g = x.createLinearGradient(-400, 0, 400, 0);
  g.addColorStop(0, '#4da3ff'); g.addColorStop(.5, '#fff'); g.addColorStop(1, '#ff9a5c');
  x.shadowColor = '#a08cff'; x.shadowBlur = 40;
  txt('WHOA.', 0, 30, 140, g); x.shadowBlur = 0;
  x.restore();
  txt('Reasoning → Agents → Autonomy. And the curve keeps bending up.', W / 2, H / 2 + 120, 26, '#dfe8ff', 'center', '700', cl((lt - 1.2) * 2));
  txt('HERE WE GO.', W / 2, H / 2 + 200, 48, '#ffd84d', 'center', '900', cl((lt - 2.5) * 3));
  flash(1 - lt * 2);
  flash(cl((lt - 9.3) * 1.5), '#000');
}

function frame(now) {
  const t = ((now - T0) / 1000) % window.DUR;
  x.setTransform(1, 0, 0, 1, 0, 0); x.clearRect(0, 0, W, H);
  if (t < TS) intro(t);
  else if (t < TE) timeline(t);
  else if (t < TE + 7) caps(t);
  else finale(t);
  // vignette + letterbox
  const v = x.createRadialGradient(W / 2, H / 2, 300, W / 2, H / 2, 780);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.6)');
  x.fillStyle = v; x.fillRect(0, 0, W, H);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
