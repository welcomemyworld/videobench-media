<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><title>VELOX – Launch</title>
<style>
html,body{margin:0;background:#000;height:100%;overflow:hidden}
#w{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{width:min(100vw,177.78vh);height:min(56.25vw,100vh);display:block}
</style></head><body><div id="w"><canvas id="c" width="1280" height="720"></canvas></div>
<script>
window.DUR=32;
const c=document.getElementById('c'),x=c.getContext('2d'),W=1280,H=720;
const q=new URLSearchParams(location.search),T0=parseFloat(q.get('t')||0)||0;
const st=performance.now();
const BPM=120,BT=60/BPM;
const F='"Helvetica Neue",Helvetica,Arial,sans-serif';
let R=1;const rnd=()=>(R=(R*16807)%2147483647)/2147483647;
const parts=[];for(let i=0;i<260;i++)parts.push({x:rnd()*W,y:rnd()*H,s:rnd()*2+.5,v:rnd()*3+1,h:rnd()});
const nodes=[];for(let i=0;i<46;i++){const a=rnd()*6.283,r=Math.sqrt(rnd())*300;nodes.push({x:640+Math.cos(a)*r*1.6,y:360+Math.sin(a)*r*.9,p:rnd()*6})}
const toks="Die Antwort ist bereit bevor du blinzelst . Jedes Modell . Jede Anfrage . in Millisekunden".split(' ');
const ease=t=>t<0?0:t>1?1:1-Math.pow(1-t,3);
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
// ---------- MUSIK (WebAudio, synthetisiert) ----------
let A=null,aOff=0,nb=0,noise;
const prog=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]];
const mf=n=>440*Math.pow(2,(n-69)/12);
function initAudio(){
 if(A){if(A.state!=='running')A.resume();return}
 try{A=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}
 const b=A.createBuffer(1,A.sampleRate*.5,A.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;noise=b;
 A.master=A.createGain();A.master.gain.value=.55;
 const comp=A.createDynamicsCompressor();A.master.connect(comp);comp.connect(A.destination);
 aOff=A.currentTime-curT()+.05;nb=Math.ceil(curT()/(BT/2));
}
function env(g,t,a,v,d){g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+d)}
function kick(t){const o=A.createOscillator(),g=A.createGain();o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(40,t+.15);env(g,t,.003,1,.35);o.connect(g);g.connect(A.master);o.start(t);o.stop(t+.4)}
function hat(t,v){const s=A.createBufferSource();s.buffer=noise;const f=A.createBiquadFilter();f.type='highpass';f.frequency.value=8000;const g=A.createGain();env(g,t,.001,v,.06);s.connect(f);f.connect(g);g.connect(A.master);s.start(t);s.stop(t+.1)}
function clap(t){const s=A.createBufferSource();s.buffer=noise;const f=A.createBiquadFilter();f.type='bandpass';f.frequency.value=1500;const g=A.createGain();env(g,t,.002,.5,.2);s.connect(f);f.connect(g);g.connect(A.master);s.start(t);s.stop(t+.25)}
function tone(t,n,typ,v,d,fc){const o=A.createOscillator(),g=A.createGain(),f=A.createBiquadFilter();o.type=typ;o.frequency.value=mf(n);f.type='lowpass';f.frequency.value=fc;env(g,t,.01,v,d);o.connect(f);f.connect(g);g.connect(A.master);o.start(t);o.stop(t+d+.05)}
function sched(){
 if(!A||A.state!=='running')return;
 const now=A.currentTime;
 while(aOff+nb*BT/2<now+.2){
  const t=aOff+nb*BT/2,mt=((nb*BT/2)%DUR+DUR)%DUR,e=nb%2,beat=Math.floor(nb/2),bar=Math.floor(beat/4),ch=prog[bar%4];
  if(t>=now-.01){
   const drop=mt>=8&&mt<29,intro=mt<8;
   if(!e&&(drop||(intro&&mt>=4)))kick(t);
   if(drop&&e)hat(t,.25);if(intro&&e&&mt>=2)hat(t,.12);
   if(drop&&!e&&beat%2==1)clap(t);
   if(drop&&e)tone(t,ch[0]-24,'sawtooth',.35,.22,600+300*Math.sin(mt));
   if(!e&&beat%4==0&&mt<30)ch.forEach(n=>tone(t,n,'triangle',.09,BT*4,2000));
   if(mt>=16&&mt<29){const ar=[...ch,ch[0]+12];tone(t,ar[nb%4]+12,'square',.05,.18,3000)}
   if(mt>=28.5&&mt<29&&!e){kick(t)}
   if(Math.abs(mt-29)<.01){[45,57,64,69].forEach(n=>tone(t,n,'sawtooth',.12,3,1500));kick(t)}
  }
  nb++;
 }
}
['pointerdown','keydown','touchstart'].forEach(ev=>addEventListener(ev,initAudio));
try{initAudio()}catch(e){}
function curT(){return ((performance.now()-st)/1000+T0)}
// ---------- VISUALS ----------
function txt(s,X,Y,sz,a,col,wt,sp){x.save();x.globalAlpha=cl(a,0,1);x.fillStyle=col||'#fff';x.font=(wt||800)+' '+sz+'px '+F;x.textAlign='center';x.textBaseline='middle';if(sp)x.letterSpacing=sp+'px';x.fillText(s,X,Y);x.restore()}
function win(t,a,b){return cl(Math.min((t-a)/.35,(b-t)/.35),0,1)}
function frame(){
 const raw=curT(),t=((raw%DUR)+DUR)%DUR;
 sched();
 const bp=t%BT/BT,pulse=Math.pow(1-bp,4)*(t>4&&t<29?1:0);
 x.fillStyle='#05050a';x.fillRect(0,0,W,H);
 // hintergrund-glow
 const g=x.createRadialGradient(640,360,0,640,360,700);g.addColorStop(0,`rgba(255,110,60,${.08+pulse*.08})`);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,W,H);
 x.save();const sh=pulse*4;x.translate((rnd()-.5)*sh*(t>8&&t<9?3:0),0);
 // Szene 1: Punkt + Worte 0-8
 if(t<8){
  const r=4+pulse*10+ease(t/2)*6;x.fillStyle='#ff6a3d';x.beginPath();x.arc(640,360,r,0,7);x.fill();
  x.strokeStyle='rgba(255,106,61,.4)';for(let i=0;i<3;i++){const k=((t*.8+i/3)%1);x.globalAlpha=1-k;x.beginPath();x.arc(640,360,k*300,0,7);x.stroke()}x.globalAlpha=1;
  txt('Jedes Modell.',640,250,72,win(t,1,4),'#fff');
  txt('Jede Anfrage.',640,470,72,win(t,4,7.6),'#fff');
 }
 // Szene 2: Tokenstrom + Zähler 8-16
 if(t>=8&&t<16){
  const k=t-8;
  parts.forEach(p=>{const px=(p.x+k*p.v*260)%W;x.fillStyle=p.h>.7?'#ff6a3d':'rgba(255,255,255,.6)';x.fillRect(px,p.y,p.s*8*(1+pulse),p.s)});
  x.fillStyle='rgba(5,5,10,.75)';x.fillRect(240,230,800,260);x.strokeStyle='rgba(255,106,61,.6)';x.strokeRect(240,230,800,260);
  const n=Math.floor(Math.pow(ease(k/6),2)*48291);
  txt(n.toLocaleString('de-DE'),640,320,120,1,'#fff',900);
  txt('TOKENS PRO SEKUNDE',640,420,26,1,'#ff6a3d',600,8);
 }
 // Szene 3: Latenz 16-22
 if(t>=16&&t<22){
  const k=t-16,a=win(t,16,22);x.globalAlpha=a;
  x.strokeStyle='rgba(255,255,255,.1)';for(let i=0;i<=8;i++){x.beginPath();x.moveTo(160+i*120,180);x.lineTo(160+i*120,560);x.stroke()}
  x.lineWidth=5;x.strokeStyle='#ff6a3d';x.shadowColor='#ff6a3d';x.shadowBlur=20;x.beginPath();
  const pr=ease(k/3);let lx=0,ly=0;
  for(let i=0;i<=100*pr;i++){const u=i/100;lx=160+u*960;ly=200+340*(1-Math.exp(-u*5))+Math.sin(u*40)*6*(1-u);x.lineTo(lx,ly)}x.stroke();x.shadowBlur=0;
  x.fillStyle='#fff';x.beginPath();x.arc(lx,ly,8+pulse*6,0,7);x.fill();x.lineWidth=1;x.globalAlpha=1;
  const ms=Math.round(900-888*pr);
  txt(ms+' ms',640,120,96,a,'#fff',900);
  txt('Latenz bis zum ersten Token',640,640,28,a,'rgba(255,255,255,.7)',500,2);
 }
 // Szene 4: Netzwerk 22-28
 if(t>=22&&t<28.6){
  const k=t-22,a=win(t,22,28.6);x.globalAlpha=a;
  nodes.forEach((n,i)=>nodes.forEach((m,j)=>{if(j>i){const d=Math.hypot(n.x-m.x,n.y-m.y);if(d<170){x.strokeStyle=`rgba(255,106,61,${.35*(1-d/170)})`;x.beginPath();x.moveTo(n.x,n.y);x.lineTo(m.x,m.y);x.stroke();const u=(k*1.5+n.p)%1;x.fillStyle='#fff';x.fillRect(n.x+(m.x-n.x)*u-1.5,n.y+(m.y-n.y)*u-1.5,3,3)}}}));
  nodes.forEach(n=>{x.fillStyle='#ff6a3d';x.beginPath();x.arc(n.x,n.y,3+pulse*3*((n.p|0)%2),0,7);x.fill()});
  x.globalAlpha=1;x.fillStyle=`rgba(5,5,10,${.6*a})`;x.fillRect(290,300,700,120);
  txt('Global. Skalierbar. Ohne Kaltstart.',640,360,44,a,'#fff',800);
 }
 // Szene 5: Logo 28.6-32
 if(t>=28.6){
  const k=t-28.6,e=ease(k/.8);
  if(k<.15){x.fillStyle='#fff';x.globalAlpha=1-k/.15;x.fillRect(0,0,W,H);x.globalAlpha=1}
  x.fillStyle='#ff6a3d';x.save();x.translate(640,300);x.rotate((1-e)*3);x.scale(e,e);
  x.beginPath();x.moveTo(-40,-35);x.lineTo(0,40);x.lineTo(40,-35);x.lineTo(18,-35);x.lineTo(0,5);x.lineTo(-18,-35);x.closePath();x.fill();x.restore();
  txt('VELOX',640,410,96,e,'#fff',900,24);
  txt('Inferenz. Sofort.',640,490,32,ease((k-.6)/.6),'rgba(255,255,255,.8)',500,4);
  txt('JETZT VERFÜGBAR',640,600,22,ease((k-1.1)/.6),'#ff6a3d',700,10);
 }
 x.restore();
 // Vignette + Balken
 const v=x.createRadialGradient(640,360,300,640,360,800);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.7)');x.fillStyle=v;x.fillRect(0,0,W,H);
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
