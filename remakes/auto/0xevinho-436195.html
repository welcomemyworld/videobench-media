<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>To The Moon</title>
<style>html,body{margin:0;background:#000;height:100%;overflow:hidden}
canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);}</style></head>
<body><canvas id="c" width="1280" height="720"></canvas>
<script>
window.DUR=32;
const c=document.getElementById('c'),x=c.getContext('2d');
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);c.style.width=1280*s+'px';c.style.height=720*s+'px';}
fit();addEventListener('resize',fit);
const off=parseFloat(new URLSearchParams(location.search).get('t'))||0;
const t0=performance.now()-off*1000;
const SP=300,RX=320,GAP=380,STEP=360;
function rnd(n){const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s);}
function path(t){return 360+150*Math.sin(t*0.9)+60*Math.sin(t*2.1+1);}
const stars=[];for(let i=0;i<220;i++)stars.push([rnd(i)*1280,rnd(i+999)*720,rnd(i+77)*1.8+0.3,rnd(i+5)]);
function coin(cx,cy,r,rot){
  const w=Math.abs(Math.cos(rot))*r+1;
  x.save();x.translate(cx,cy);
  const g=x.createRadialGradient(-r*.3,-r*.3,1,0,0,r);g.addColorStop(0,'#ffe9a0');g.addColorStop(.6,'#f7931a');g.addColorStop(1,'#a85a00');
  x.fillStyle=g;x.beginPath();x.ellipse(0,0,w,r,0,0,7);x.fill();
  x.strokeStyle='#ffd27a';x.lineWidth=2;x.stroke();
  if(w>r*.4){x.scale(w/r,1);x.fillStyle='#fff';x.font='bold '+(r*1.3)+'px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('₿',0,2);}
  x.restore();
}
function candle(sx,top,bot,bull){
  x.fillStyle=bull?'#16c784':'#ea3943';
  x.shadowColor=x.fillStyle;x.shadowBlur=18;
  x.fillRect(sx-28,top,56,bot-top);x.shadowBlur=0;
  x.fillRect(sx-3,top-40,6,bot-top+80);
  x.fillStyle='rgba(255,255,255,.15)';x.fillRect(sx-28,top,10,bot-top);
}
function frame(){
  let T=((performance.now()-t0)/1000)%DUR;if(T<0)T+=DUR;
  const end=Math.max(0,T-(DUR-6))/6;
  x.fillStyle='#05030f';x.fillRect(0,0,1280,720);
  const bg=x.createLinearGradient(0,0,0,720);bg.addColorStop(0,'#0b0528');bg.addColorStop(1,'#1a0838');
  x.fillStyle=bg;x.fillRect(0,0,1280,720);
  for(const s of stars){const sx=((s[0]-T*40*s[2])%1280+1280)%1280;x.globalAlpha=.4+.6*Math.abs(Math.sin(T*2+s[3]*9));x.fillStyle='#fff';x.fillRect(sx,s[1],s[2],s[2]);}
  x.globalAlpha=1;
  // moon
  const mr=60+end*end*420,mx=1100-end*400,my=140+end*200;
  const mg=x.createRadialGradient(mx-mr*.3,my-mr*.3,5,mx,my,mr);mg.addColorStop(0,'#fffbe6');mg.addColorStop(1,'#b8b39a');
  x.shadowColor='#fff8c0';x.shadowBlur=60;x.fillStyle=mg;x.beginPath();x.arc(mx,my,mr,0,7);x.fill();x.shadowBlur=0;
  x.fillStyle='rgba(120,115,90,.35)';for(let i=0;i<6;i++){x.beginPath();x.arc(mx+Math.cos(i*2.3)*mr*.5,my+Math.sin(i*1.7)*mr*.5,mr*(.08+rnd(i)*.1),0,7);x.fill();}
  // background chart line
  x.strokeStyle='rgba(22,199,132,.25)';x.lineWidth=3;x.beginPath();
  for(let px=0;px<=1280;px+=8){const wt=T+(px-RX)/SP;const y=path(wt)+120-wt*4;px?x.lineTo(px,y):x.moveTo(px,y);}x.stroke();
  const wx=T*SP;let score=0,hit=0;
  const k0=Math.floor((wx-RX)/STEP)-1;
  if(end<.6)for(let k=Math.max(2,k0);k<k0+6;k++){
    const ow=k*STEP,sx=ow-wx+RX,gy=path(ow/SP);
    candle(sx,-50,gy-GAP/2,k%2==0);candle(sx,gy+GAP/2,770,k%2==1);
    const cw=ow+STEP/2,cs=cw-wx+RX;
    if(cw>wx)coin(cs,path(cw/SP),18,T*4+k);
    else if(wx-cw<SP*.4){const a=(wx-cw)/(SP*.4);x.globalAlpha=1-a;coin(RX,path(cw/SP)-a*80,18*(1+a),T*8);x.globalAlpha=1;}
  }
  score=Math.max(0,Math.floor((wx-STEP/2)/STEP)-1);
  // rocket
  let ry=path(T),rxx=RX;
  if(end>0){rxx=RX+end*end*(mx-RX);ry=ry+(my-ry)*end*end;}
  const ang=Math.atan2(path(T+.05)-path(T),.05*SP);
  x.save();x.translate(rxx,ry);x.rotate(ang*(1-end));
  for(let i=0;i<14;i++){const f=rnd(i+Math.floor(T*30));x.fillStyle=`rgba(255,${120+f*120|0},0,${.7-i*.05})`;x.beginPath();x.arc(-40-i*7,(f-.5)*10,10-i*.6,0,7);x.fill();}
  x.fillStyle='#ddd';x.beginPath();x.moveTo(-40,-20);x.lineTo(-55,-32);x.lineTo(-25,-18);x.fill();x.beginPath();x.moveTo(-40,20);x.lineTo(-55,32);x.lineTo(-25,18);x.fill();
  x.fillStyle='#eee';x.beginPath();x.ellipse(0,0,45,20,0,0,7);x.fill();
  x.fillStyle='#ea3943';x.beginPath();x.moveTo(30,-14);x.quadraticCurveTo(62,0,30,14);x.fill();
  coin(0,0,14,0);x.restore();
  // HUD
  const price=69420*Math.exp(T*.09);
  x.fillStyle='rgba(0,0,0,.45)';x.fillRect(20,20,330,92);x.strokeStyle='#f7931a';x.strokeRect(20,20,330,92);
  x.fillStyle='#f7931a';x.font='bold 18px monospace';x.textAlign='left';x.textBaseline='alphabetic';x.fillText('BTC/USD',36,48);
  x.fillStyle='#16c784';x.font='bold 30px monospace';x.fillText('$'+price.toLocaleString('en-US',{maximumFractionDigits:0}),36,86);
  x.font='16px monospace';x.fillText('▲ +'+((Math.exp(T*.09)-1)*100).toFixed(1)+'%',230,48);
  x.fillStyle='rgba(0,0,0,.45)';x.fillRect(1070,20,190,50);x.fillStyle='#ffd27a';x.font='bold 22px monospace';x.textAlign='right';x.fillText('₿ x '+score,1244,53);
  x.fillStyle='rgba(255,255,255,.6)';x.font='14px monospace';x.textAlign='left';x.fillText('AUTOPILOT: HODL BOT v1.0',24,700);
  x.textAlign='center';
  if(T<3){x.globalAlpha=Math.min(1,(3-T));x.fillStyle='#fff';x.font='bold 64px sans-serif';x.fillText('HODL THE LINE',640,360);x.font='22px sans-serif';x.fillStyle='#f7931a';x.fillText('Dodge the bears. Stack the sats.',640,400);x.globalAlpha=1;}
  if(end>.5){x.globalAlpha=Math.min(1,(end-.5)*3);x.fillStyle='#fff';x.shadowColor='#f7931a';x.shadowBlur=30;x.font='bold 84px sans-serif';x.fillText('TO THE MOON',640,620);x.shadowBlur=0;x.globalAlpha=1;}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
