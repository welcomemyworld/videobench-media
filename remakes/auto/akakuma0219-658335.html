<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><title>回収テープ — 最後の一分</title>
<style>html,body{margin:0;background:#000;height:100%;overflow:hidden}
#c{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:0 0}</style></head>
<body><canvas id="c" width="1280" height="720"></canvas>
<script>
// 題材：廃病院の廊下（"〇〇"の代わりに設定）。Three.jsは外部読込禁止のため自前レイキャスト3Dで描画。
window.DUR=60;
const C=document.getElementById('c'),X=C.getContext('2d');
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);C.style.transform=`scale(${s}) translate(-50%,-50%)`;C.style.left='50%';C.style.top='50%';C.style.transformOrigin='0 0';C.style.transform=`translate(-50%,-50%) scale(${s})`;C.style.transformOrigin='50% 50%';}
addEventListener('resize',fit);fit();
const W=320,H=180,L=document.createElement('canvas');L.width=W;L.height=H;const LX=L.getContext('2d'),ID=LX.createImageData(W,H),P=ID.data,ZB=new Float32Array(W);
// map
const MW=24,MH=10,M=new Uint8Array(MW*MH).fill(1);
const op=(x,y)=>M[y*MW+x]=0;
for(let x=1;x<=21;x++)op(x,2);for(let y=2;y<=8;y++)op(21,y);[[4,1],[9,3],[14,1],[18,3],[21,9]].forEach(a=>op(a[0],a[1]));
const wall=(x,y)=>x<0||y<0||x>=MW||y>=MH||M[(y|0)*MW+(x|0)];
const hash=(a,b)=>{let h=Math.imul(a*374761393+b*668265263,1274126177);h^=h>>>13;return((h>>>0)%1000)/1000};
const ss=x=>x<0?0:x>1?1:x*x*(3-2*x);
// camera keyframes [t,x,y,angle]
const PI=Math.PI,CK=[[0,1.5,2.5,0],[5,4,2.5,0],[7,4.2,2.5,-1.4],[9,4.6,2.5,0],[14,8.8,2.5,0.2],[16,9.1,2.5,1.4],[18,9.3,2.5,0],[20,10.5,2.5,0],[22,10.6,2.5,0],[25,10.6,2.5,PI],[28,10.6,2.5,PI+.15],[31,10.6,2.5,0.05],[38,10.6,2.5,0],[44,20.5,2.5,0],[46.5,21.4,2.5,PI/2],[50,21.5,3.2,PI/2],[51.5,21.5,2.9,PI/2+.3],[53,21.5,2.7,PI/2]];
function cam(t){for(let i=0;i<CK.length-1;i++){const a=CK[i],b=CK[i+1];if(t<b[0]){const k=ss((t-a[0])/(b[0]-a[0]));return[a[1]+(b[1]-a[1])*k,a[2]+(b[2]-a[2])*k,a[3]+(b[3]-a[3])*k,b[1]!=a[1]||b[2]!=a[2]]}}const z=CK[CK.length-1];return[z[1],z[2],z[3],0]}
function fig(t){ // figure position
 if(t>25&&t<28.6)return[3.5,2.5];
 if(t>31&&t<36.2)return[20.4,2.5];
 if(t>47.5&&t<52){const k=ss((t-47.5)/4.5);return[21.5,8.5-k*4.6]}
 if(t>53.2&&t<56)return[21.5,3.35];return null}
function flick(t){let f=1;if(t>18&&t<22)f=hash(t*20|0,3)>.35?1:.15;if(t>28.3&&t<31)f=hash(t*25|0,5)>.5?1:.05;if(t>36&&t<36.5)f=.05;if(t>51.6&&t<53.2)f=hash(t*30|0,7)>.4?.8:0;if(t>53.2)f=.9;return f}
function render(t){
 let[cx,cy,ca,mv]=cam(t);const fl=flick(t);
 const run=t>44&&t<52,bobA=mv?(run?.09:.04):.008,stepF=run?11:6.5;
 const fall=t>53?Math.min(1,(t-53)*3):0;
 const hor=H/2+Math.sin(t*stepF)*bobA*60+Math.sin(t*1.3)*3+fall*45;
 ca+=Math.sin(t*.9)*.03+Math.sin(t*2.3)*.015+(run?Math.sin(t*5)*.05:0);
 const tf=Math.tan(.5),f=fig(t);let sp=null;
 if(f){const dx=f[0]-cx,dy=f[1]-cy,c=Math.cos(-ca),s=Math.sin(-ca),zx=dx*c-dy*s,zy=dx*s+dy*c;if(zx>.1)sp={d:zx,sx:W/2+zy/zx/tf*W/2};}
 for(let x=0;x<W;x++){
  const cam=(x/W-.5)*2*tf,rel=Math.atan(cam),a=ca+rel,dx=Math.cos(a),dy=Math.sin(a);
  let mx=cx|0,my=cy|0;const ddx=Math.abs(1/dx),ddy=Math.abs(1/dy),stx=dx<0?-1:1,sty=dy<0?-1:1;
  let sdx=dx<0?(cx-mx)*ddx:(mx+1-cx)*ddx,sdy=dy<0?(cy-my)*ddy:(my+1-cy)*ddy,side=0;
  for(let i=0;i<64;i++){if(sdx<sdy){sdx+=ddx;mx+=stx;side=0}else{sdy+=ddy;my+=sty;side=1}if(wall(mx,my))break}
  let d=side?sdy-ddy:sdx-ddx;const pd=d*Math.cos(rel);ZB[x]=pd;
  let wx=side?cx+d*dx:cy+d*dy;wx-=Math.floor(wx);
  const lh=H/pd,top=hor-lh/2,bot=hor+lh/2,sxn=(x/W-.5)*2;
  for(let y=0;y<H;y++){
   let r,g,b,dist;const syn=(y-H/2)/H*2;
   if(y>=top&&y<bot){const ty=(y-top)/lh;dist=d;
    const n=hash(wx*48|0,ty*48|0),st=hash(wx*9|0,mx*7+my)*.5*ty;
    let v=.75+n*.15-st*(.6+.4*Math.sin(wx*30))*.6;if(ty>.88)v*=.45;if(side)v*=.8;
    r=150*v;g=160*v;b=138*v;
    if(t>14&&t<46&&mx==13&&my==1){/*文字*/}
    if(mx==10&&my==1&&ty>.3&&ty<.6&&wx>.2&&wx<.8&&hash(wx*20|0,ty*20|0)>.55){r=70;g=10;b=8}
   }else{const fy=y>hor;const k=Math.abs(y-hor)||.5;dist=(H/2)/k/Math.cos(rel);
    const fx=cx+dx*dist,fz=cy+dy*dist,n=hash(fx*8|0,fz*8|0);
    if(fy){const tl=((fx*2|0)+(fz*2|0))&1;const v=.45+n*.1+tl*.08;r=110*v;g=112*v;b=100*v}else{r=g=b=55+n*15}}
   const sp2=Math.exp(-(sxn*sxn*1.6+syn*syn*2.2))*fl,li=sp2*1.6/(1+dist*dist*.18)+.025;
   const o=(y*W+x)*4;P[o]=Math.min(255,r*li);P[o+1]=Math.min(255,g*li);P[o+2]=Math.min(255,b*li);P[o+3]=255}
 }
 if(sp){const sh=H/sp.d,sw=sh*.55,x0=Math.max(0,sp.sx-sw/2|0),x1=Math.min(W,sp.sx+sw/2|0),y0=hor-sh*.62,li=Math.min(1.2,1.6/(1+sp.d*sp.d*.18))*fl;
  const tilt=Math.sin(t*.7)*.06+.05;
  for(let x=x0;x<x1;x++){if(ZB[x]<sp.d)continue;const u=(x-sp.sx)/sw;
   for(let y=Math.max(0,y0|0);y<Math.min(H,hor+sh*.5);y++){const v=(y-y0)/(sh*1.12);let hit=0,face=0;
    const hu=u-tilt,hv=v-.1;if(hu*hu+hv*hv*.7<.012){hit=1;face=Math.abs(hu)<.07&&hv>-.02;
      if(face&&(Math.hypot(hu-.035,hv-.01)<.016||Math.hypot(hu+.035,hv-.01)<.016||(Math.abs(hu)<.025&&Math.abs(hv-.06)<.012)))face=2}
    else if(v>.18&&v<1&&Math.abs(u)<.11+v*.14+hash(y,x)*.02)hit=1;
    else if(v>.2&&v<.75&&Math.abs(Math.abs(u)-.2-v*.05)<.03)hit=1;
    if(hit){const o=(y*W+x)*4;let c=face==1?[150,140,125]:face==2?[0,0,0]:[14,12,12];
     if(face==1&&hash(x,y)>.6)c=[90,80,70];
     P[o]=c[0]*li+6;P[o+1]=c[1]*li+4;P[o+2]=c[2]*li+4}}}}
 // static
 let sn=t>56?1:t<1.2?.9-t*.7:0;if(t>28.2&&t<28.5||t>36&&t<36.25)sn=.7;if(t>51.8&&t<53)sn=Math.max(sn,(t-51.8)*.3*hash(t*20|0,9));
 if(sn>0)for(let i=0;i<W*H;i++){if(Math.random()<sn){const v=Math.random()*230;P[i*4]=P[i*4+1]=P[i*4+2]=v}}
 if(t>58.3)for(let i=0;i<W*H*4;i+=4)P[i]=P[i+1]=P[i+2]=0;
 LX.putImageData(ID,0,0);
 // compose
 X.fillStyle='#000';X.fillRect(0,0,1280,720);X.save();X.imageSmoothingEnabled=true;
 const rot=Math.sin(t*.8)*.012+(run?Math.sin(t*5.5)*.03:0)+fall*.5;
 X.translate(640+Math.sin(t*2.1)*6,360+Math.cos(t*1.7)*5);X.rotate(rot);X.scale(1.12+fall*.2,1.12+fall*.2);
 X.drawImage(L,-640,-360,1280,720);
 X.globalCompositeOperation='lighter';X.globalAlpha=.18;X.drawImage(L,-636,-360,1280,720);X.restore();
 // tracking distortion
 const bands=t>50?4:1;for(let i=0;i<bands;i++){const by=((t*90+i*233)%820)-50,bh=18+hash(i,t*3|0)*30;
  X.drawImage(C,0,by,1280,bh,(hash(t*40|0,i)-.5)*30,by,1280,bh);X.fillStyle='rgba(255,255,255,.05)';X.fillRect(0,by,1280,3)}
 X.fillStyle='rgba(0,0,0,.25)';for(let y=0;y<720;y+=3)X.fillRect(0,y,1280,1);
 const g=X.createRadialGradient(640,360,250,640,360,800);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.75)');X.fillStyle=g;X.fillRect(0,0,1280,720);
 // OSD
 X.font='bold 30px monospace';X.textBaseline='top';X.shadowColor='#000';X.shadowBlur=4;X.fillStyle='#eee';
 if(t<58.3){X.fillText('▶ PLAY',60,46);if((t*1.5|0)%2==0){X.fillStyle='#e22';X.fillText('●',1100,46);}X.fillStyle='#eee';X.fillText('REC',1135,46);X.fillText('SP',60,640);
  const s=47*60+12+t|0;X.fillText(`1998年11月03日 午前2:${String(s/60|0).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`,720,640);
  X.font='bold 22px monospace';const bt=Math.max(0,1-t/60);X.fillText('▮'.repeat(Math.ceil(bt*4))+'▯'.repeat(4-Math.ceil(bt*4)),1170,90);}
 X.textAlign='center';X.font='26px sans-serif';
 const sub=[[1.5,5,'【回収テープ No.7】 旧・聖ルカ病院 東病棟 — 最後の1分間'],[8,12,'「…ここ、誰もいないはずだよな」'],[19,22,'「くそ、ライトが…」'],[25.5,28,'「……今、後ろに」'],[32,36,'「誰だ！？」'],[44.5,47,'（荒い呼吸）'],[48.5,51.5,'「来るな、来るな来るな」']];
 sub.forEach(s=>{if(t>s[0]&&t<s[1]){X.fillStyle='rgba(0,0,0,.5)';X.fillRect(240,575,800,44);X.fillStyle='#ffe';X.fillText(s[2],640,583)}});
 if(t>58.3){X.font='bold 40px monospace';X.fillStyle='#ccc';X.fillText('信号なし',640,330);X.font='22px monospace';X.fillText('— テープはここで終わっている —',640,390)}
 X.textAlign='left';X.shadowBlur=0;
}
// ---- audio ----
let AC=null,last=-1,master,hissG,droneG;
function initAudio(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){return}
 master=AC.createGain();master.gain.value=.6;master.connect(AC.destination);
 const nb=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 const ns=AC.createBufferSource();ns.buffer=nb;ns.loop=true;const hf=AC.createBiquadFilter();hf.type='highpass';hf.frequency.value=3000;hissG=AC.createGain();hissG.gain.value=.05;ns.connect(hf).connect(hissG).connect(master);ns.start();
 droneG=AC.createGain();droneG.gain.value=.08;droneG.connect(master);[41,43.5,61.7].forEach(f=>{const o=AC.createOscillator();o.frequency.value=f;o.type='sawtooth';const lp=AC.createBiquadFilter();lp.frequency.value=180;o.connect(lp).connect(droneG);o.start()});
 window.NB=nb}
function noiseHit(dur,freq,gain,type){const s=AC.createBufferSource();s.buffer=NB;const f=AC.createBiquadFilter();f.type=type||'lowpass';f.frequency.value=freq;const g=AC.createGain(),n=AC.currentTime;g.gain.setValueAtTime(gain,n);g.gain.exponentialRampToValueAtTime(.001,n+dur);s.connect(f).connect(g).connect(master);s.start(n,Math.random());s.stop(n+dur)}
function tone(f0,f1,dur,gain,type){const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type=type||'sine';o.frequency.setValueAtTime(f0,n);o.frequency.exponentialRampToValueAtTime(f1,n+dur);g.gain.setValueAtTime(gain,n);g.gain.exponentialRampToValueAtTime(.001,n+dur);o.connect(g).connect(master);o.start(n);o.stop(n+dur)}
function audio(t){if(!AC||AC.state!='running'){return}
 const n=AC.currentTime;hissG.gain.setTargetAtTime(t>56||t<1.2?.35:.05,n,.05);
 droneG.gain.setTargetAtTime(t>56?0:.05+Math.min(.2,t/300)+(t>44&&t<56?.12:0),n,.3);
 const cr=(a)=>last<a&&t>=a;
 const c=cam(t),run=t>44&&t<52,rate=run?11/PI:6.5/PI;
 if(c[3]&&Math.floor(t*rate/2)!=Math.floor(last*rate/2))noiseHit(.12,run?500:300,run?.5:.3);
 if(t>40&&Math.floor(t*(t>48?2.4:1.3))!=Math.floor(last*(t>48?2.4:1.3))){tone(70,40,.15,.5);}
 [[18.1],[28.3],[36],[51.8]].forEach(e=>{if(cr(e[0])){noiseHit(.5,1500,.6,'bandpass');tone(900,60,.8,.25,'sawtooth')}});
 if(cr(25.3)){tone(300,290,2.5,.06,'triangle');tone(317,300,2.5,.06,'triangle')}
 if(cr(31.2))tone(1200,1100,3,.05,'sine');
 if(cr(53.2)){tone(200,30,2.5,.6,'sawtooth');noiseHit(2.5,4000,.8,'highpass');tone(2400,2600,2.5,.15,'square')}
 if(cr(53))noiseHit(.4,200,1);}
addEventListener('pointerdown',()=>{initAudio();AC&&AC.resume()});addEventListener('keydown',()=>{initAudio();AC&&AC.resume()});
initAudio();
const t0=parseFloat(new URLSearchParams(location.search).get('t'))||0,start=performance.now();
function loop(now){const t=((now-start)/1000+t0)%DUR;if(t<last)last=-1;render(t);audio(t);last=t;requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
