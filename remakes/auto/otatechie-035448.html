<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Moonwalk</title>
<style>html,body{margin:0;background:#000;height:100%;overflow:hidden}canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#000}</style>
</head><body><canvas id="c" width="1280" height="720"></canvas>
<script>
window.DUR=32;
const C=document.getElementById('c'),X=C.getContext('2d');
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);C.style.width=1280*s+'px';C.style.height=720*s+'px';}
addEventListener('resize',fit);fit();
const q=new URLSearchParams(location.search);const t0=parseFloat(q.get('t')||0)||0;
const start=performance.now()-t0*1000;
const BPM=120,T=60/BPM,S=50;
const lerp=(a,b,k)=>a+(b-a)*k,cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=k=>k*k*(3-2*k);
// ---------- AUDIO ----------
let A=null,aOff=0,next16=0,lastT=-1,NB=null;
function initAudio(){if(A)return;try{A=new (window.AudioContext||window.webkitAudioContext)();
NB=A.createBuffer(1,A.sampleRate,A.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
A.master=A.createGain();A.master.gain.value=.5;A.master.connect(A.destination);aOff=null;}catch(e){A=null}}
addEventListener('pointerdown',()=>{initAudio();A&&A.resume();});addEventListener('keydown',()=>{initAudio();A&&A.resume();});
initAudio();
function env(g,at,a,peak,d){g.gain.setValueAtTime(0.0001,at);g.gain.exponentialRampToValueAtTime(peak,at+a);g.gain.exponentialRampToValueAtTime(0.0001,at+a+d);}
function kick(at){const o=A.createOscillator(),g=A.createGain();o.frequency.setValueAtTime(140,at);o.frequency.exponentialRampToValueAtTime(40,at+.15);env(g,at,.003,1,.3);o.connect(g).connect(A.master);o.start(at);o.stop(at+.35);}
function noise(at,dur,f,type,vol){const s=A.createBufferSource();s.buffer=NB;const fl=A.createBiquadFilter();fl.type=type;fl.frequency.value=f;const g=A.createGain();env(g,at,.002,vol,dur);s.connect(fl).connect(g).connect(A.master);s.start(at,Math.random()*.5);s.stop(at+dur+.05);}
function tone(at,f,dur,type,vol,cut){const o=A.createOscillator(),g=A.createGain(),fl=A.createBiquadFilter();o.type=type;o.frequency.value=f;fl.type='lowpass';fl.frequency.setValueAtTime(cut,at);fl.frequency.exponentialRampToValueAtTime(cut/4,at+dur);env(g,at,.005,vol,dur);o.connect(fl).connect(g).connect(A.master);o.start(at);o.stop(at+dur+.05);}
const mf=n=>440*Math.pow(2,(n-69)/12);
const BASS=[40,0,40,52,0,40,50,0,40,0,43,0,45,0,47,0];
const CH=[[64,67,71,74],[64,67,71,74],[62,66,69,73],[60,64,67,71]];
function sched(i,at){const b=i%16,bar=Math.floor(i/16),t=i*T/4;
 const end=t>=28;
 if(b%4==0)kick(at);
 if(b==4||b==12)noise(at,.18,1800,'bandpass',.7);
 if(b%2==0||!end)noise(at,b%2?.03:.05,8000,'highpass',b%4==2?.25:.12);
 if(!end&&BASS[b])tone(at,mf(BASS[b]-(bar%4==3?2:0)),.18,'sawtooth',.35,900);
 if(end&&b==0&&bar%2==0)tone(at,mf(28),1.6,'sawtooth',.4,600);
 if((b==3||b==10)&&!end){CH[bar%4].forEach(n=>tone(at,mf(n),.12,'square',.05,3000));}
 if(bar%2==1&&b==14&&!end)noise(at,.4,600,'lowpass',.3);
 if(i==0||(end&&b==0&&bar==14))[64,67,71,76].forEach(n=>tone(at,mf(n),1.5,'triangle',.08,4000));
}
function audioTick(t){if(!A||A.state!='running')return;
 if(aOff===null||t<lastT){aOff=A.currentTime-t;next16=Math.ceil(t/(T/4));}
 lastT=t;
 while(next16*T/4<t+.2&&next16*T/4<DUR){const at=aOff+next16*T/4;if(at>=A.currentTime-.01)sched(next16,Math.max(at,A.currentTime));next16++;}}
// ---------- DANCER ----------
const TH=50,SH=50;
function leg(hx,hy,ax,ay){const dx=ax-hx,dy=ay-hy,d=Math.min(Math.hypot(dx,dy),TH+SH-.01);
 const a=Math.atan2(dy,dx),b=Math.acos((TH*TH+d*d-SH*SH)/(2*TH*d));const ka=a+b;// knee forward (right)
 return [hx+Math.cos(ka)*TH,hy+Math.sin(ka)*TH];}
function pose(t){
 if(t<28){const n=Math.floor(t/T),p=t/T-n;
  const Pn=-n*S,sl=Pn+S-2*S*(p<.08?0:(p-.08)/.92);
  const k=ease(cl(p/.12,0,1));
  const toeL=n%2==0?0:1;// which foot is toe
  const heel=[0,0];heel[toeL?0:1]=lerp(4,18,k);heel[toeL?1:0]=lerp(18,4,k);
  const fx=[0,0];fx[toeL?0:1]=Pn;fx[toeL?1:0]=sl;
  const hx=(fx[0]+fx[1])/2;
  return{hx,hy:92+Math.sin(p*Math.PI)*-3+ (1-k)*2,fx,heel,spin:0,arm:Math.sin((t/T)*Math.PI),lean:.06,hat:0};}
 const e=t-28,n=Math.floor(28/T),hx=-n*S+S/2;
 const sp=e<1.5?ease(e/1.5)*Math.PI*4:Math.PI*4;
 const toe=e>1.5?ease(cl((e-1.5)/.25,0,1)):0;
 return{hx,hy:92+toe*12,fx:[hx-4,hx+6],heel:[4+toe*26,4+toe*26],spin:sp,arm:e<1.5?1:-1-toe*.5,lean:.06-toe*.1,hat:toe*.4,toe};
}
function drawDancer(P,refl){
 X.save();X.translate(P.hx,0);X.scale(Math.cos(P.spin)||.0001,1);X.translate(-P.hx,0);
 const ink=refl?'rgba(30,30,50,1)':'#0b0b10',hy=-P.hy,hx=P.hx;
 X.lineCap='round';X.lineJoin='round';
 // legs
 for(let i=0;i<2;i++){const ax=P.fx[i],ay=-P.heel[i],tx=ax+(P.heel[i]>10?18:24),ty=P.heel[i]>10?-1:-1;
  const hpx=hx+(i?4:-4);const [kx,ky]=leg(hpx,hy,ax,ay);
  X.strokeStyle=i?'#1c1c26':ink;X.lineWidth=15;X.beginPath();X.moveTo(hpx,hy);X.lineTo(kx,ky);X.lineTo(ax,ay-10);X.stroke();
  X.strokeStyle='#f4f4f8';X.lineWidth=9;X.beginPath();X.moveTo(ax+lerp(0,0,1),ay-12);X.lineTo(ax,ay-3);X.stroke();//socks
  X.strokeStyle='#000';X.lineWidth=8;X.beginPath();X.moveTo(ax-4,ay);X.lineTo(tx,ty);X.stroke();
  X.strokeStyle='rgba(255,255,255,.35)';X.lineWidth=2;X.beginPath();X.moveTo(ax,ay-3);X.lineTo(tx-4,ty-2);X.stroke();}
 // torso
 const sx=hx+P.lean*70,sy=hy-62;
 X.fillStyle=ink;X.beginPath();X.moveTo(hx-12,hy+4);X.lineTo(hx+12,hy+4);X.lineTo(sx+14,sy);X.lineTo(sx-13,sy);X.closePath();X.fill();
 X.strokeStyle='#ddd';X.lineWidth=3;X.beginPath();X.moveTo(sx+2,sy+2);X.lineTo(hx+3,hy-30);X.stroke();//shirt V
 // arms
 for(let i=0;i<2;i++){const sw=(i?-1:1)*P.arm*.5;const a1=Math.PI/2+sw-0.1,ex=sx+Math.cos(a1)*30,ey=sy+4+Math.sin(a1)*30;
  const a2=a1-0.5-(P.toe?1.6*P.toe*(i?1:0):0),wx=ex+Math.cos(a2)*28,wy=ey+Math.sin(a2)*28;
  X.strokeStyle=i?'#1c1c26':ink;X.lineWidth=11;X.beginPath();X.moveTo(sx,sy+4);X.lineTo(ex,ey);X.lineTo(wx,wy);X.stroke();
  X.fillStyle=i?'#fff':'#e8c9a8';X.beginPath();X.arc(wx,wy,5.5,0,7);X.fill();
  if(i&&!refl){X.fillStyle='rgba(255,255,255,'+(.5+.5*Math.sin(performance.now()/60))+')';X.beginPath();X.arc(wx+3,wy-3,2,0,7);X.fill();}}
 // head + fedora
 const hdx=sx+3,hdy=sy-18;X.fillStyle='#d9b38c';X.beginPath();X.ellipse(hdx,hdy,10,12,0,0,7);X.fill();
 X.save();X.translate(hdx,hdy-6);X.rotate(-.15+P.hat);X.fillStyle='#000';X.fillRect(-19,-3,38,5);X.fillRect(-11,-15,22,13);
 X.fillStyle='#c22';X.fillRect(-11,-6,22,3);X.restore();
 X.restore();}
// ---------- SCENE ----------
const SH0=[{z:1,f:95,r:0,dx:0},{z:2.7,f:12,r:0,dx:15},{z:1.9,f:120,r:.05,dx:0},{z:1.35,f:70,r:-.08,dx:-60},{z:1.15,f:95,r:0,dx:120},{z:2.3,f:20,r:-.04,dx:-20}];
const dust=[...Array(70)].map((_,i)=>({x:Math.random()*1280,y:Math.random()*720,s:Math.random()*2+.5,v:Math.random()*.3+.1}));
function frame(){
 let t=((performance.now()-start)/1000)%DUR;if(t<0)t+=DUR;
 audioTick(t);
 const P=pose(t);
 const beat=t/T,cut=Math.floor(beat/2);
 let sh=SH0[cut%SH0.length];if(t<4)sh=SH0[0];if(t>=28)sh=t<30?{z:1.6,f:95,r:0,dx:0}:{z:lerp(1.6,1,ease(cl((t-30)/2,0,1))),f:95,r:0,dx:0};
 const sinceCut=(beat/2-cut)*2*T;
 X.setTransform(1,0,0,1,0,0);
 const bg=X.createRadialGradient(640,300,50,640,360,800);bg.addColorStop(0,'#1a1430');bg.addColorStop(1,'#000');X.fillStyle=bg;X.fillRect(0,0,1280,720);
 X.save();X.translate(640,470);X.rotate(sh.r);X.scale(sh.z,sh.z);X.translate(-P.hx-sh.dx/sh.z,sh.f-95);
 const cx=P.hx;
 // floor
 const fg=X.createLinearGradient(0,0,0,400);fg.addColorStop(0,'#1d1d2a');fg.addColorStop(1,'#000');X.fillStyle=fg;X.fillRect(cx-2000,0,4000,600);
 for(let k=Math.floor((cx-1500)/80);k<(cx+1500)/80;k++){const lit=(k+Math.floor(beat))%4==0;
  X.fillStyle=lit?'rgba(120,80,255,.35)':'rgba(255,255,255,.04)';X.beginPath();X.moveTo(k*80,0);X.lineTo(k*80+76,0);X.lineTo(k*80+76+(k*80-cx)*.6,300);X.lineTo(k*80+(k*80-cx)*.6,300);X.fill();}
 // reflection
 X.save();X.scale(1,-1);X.globalAlpha=.25;drawDancer(P,true);X.restore();X.globalAlpha=1;
 // spotlight
 const sg=X.createLinearGradient(0,-700,0,0);sg.addColorStop(0,'rgba(255,240,200,.0)');sg.addColorStop(1,'rgba(255,240,200,.16)');
 X.fillStyle=sg;X.beginPath();X.moveTo(cx-20,-700);X.lineTo(cx+20,-700);X.lineTo(cx+110,0);X.lineTo(cx-110,0);X.fill();
 X.fillStyle='rgba(255,240,200,.15)';X.beginPath();X.ellipse(cx,0,110,14,0,0,7);X.fill();
 X.fillStyle='rgba(0,0,0,.5)';X.beginPath();X.ellipse(cx,0,45,6,0,0,7);X.fill();
 // slide streaks
 if(t<28){X.strokeStyle='rgba(180,160,255,.25)';X.lineWidth=2;for(let i=0;i<5;i++){const xx=P.fx[0]+P.fx[1];X.beginPath();X.moveTo(Math.min(...P.fx)+20+i*14,-2-i);X.lineTo(Math.min(...P.fx)+60+i*20,-2-i);X.stroke();}}
 drawDancer(P,false);
 X.restore();
 // dust & vignette
 X.fillStyle='rgba(255,240,220,.5)';dust.forEach(d=>{const y=(d.y-t*d.v*40+720)%720;X.fillRect((d.x+Math.sin(t+d.y)*10),y,d.s,d.s);});
 const vg=X.createRadialGradient(640,360,300,640,360,800);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.8)');X.fillStyle=vg;X.fillRect(0,0,1280,720);
 // letterbox
 X.fillStyle='#000';X.fillRect(0,0,1280,50);X.fillRect(0,670,1280,50);
 // cut flash
 if(t>=4&&t<28&&sinceCut<.08){X.fillStyle='rgba(255,255,255,'+(.25*(1-sinceCut/.08))+')';X.fillRect(0,50,1280,620);}
 if(t>=29.5&&t<29.7){X.fillStyle='rgba(255,255,255,'+(1-(t-29.5)/.2)*.7+')';X.fillRect(0,0,1280,720);}
 // text
 X.textAlign='center';
 if(t<4){const a=cl(Math.min(t,4-t),0,1);X.fillStyle='rgba(255,255,255,'+a+')';X.font='bold 72px Helvetica,Arial';X.fillText('MOONWALK',640,170);X.font='20px Helvetica,Arial';X.fillStyle='rgba(200,180,255,'+a+')';X.fillText('120 BPM · glide backwards, one beat per step',640,205);}
 if(t>30){const a=cl(t-30,0,1)*cl(DUR-t,0,1)*2;X.fillStyle='rgba(255,255,255,'+Math.min(a,1)+')';X.font='bold 56px Helvetica,Arial';X.fillText('HEE-HEE!',640,180);}
 X.font='14px Helvetica,Arial';X.textAlign='left';X.fillStyle='rgba(255,255,255,.5)';
 X.fillText('BEAT '+(Math.floor(beat)%4+1)+' · SHOT '+(cut%SH0.length+1),24,36);
 if(!A||A.state!='running'){X.textAlign='right';X.fillText('click for sound',1256,36);}
 requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script></body></html>
