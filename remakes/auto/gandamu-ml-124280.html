<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>AW-VM · Nightcall</title>
<style>
html,body{margin:0;background:#000;height:100%;overflow:hidden}
#c{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);image-rendering:pixelated}
</style></head><body><canvas id="c" width="1280" height="720"></canvas>
<script>
window.DUR=40;
const C=document.getElementById('c'),X=C.getContext('2d');
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);C.style.width=1280*s+'px';C.style.height=720*s+'px'}
addEventListener('resize',fit);fit();
const W=320,H=180,B=document.createElement('canvas');B.width=W;B.height=H;const V=B.getContext('2d');
/* ===== TOOLS: shape authoring -> bytecode -> crude compression ===== */
function circ(cx,cy,r,n){const p=[];for(let i=0;i<n;i++){const a=i/n*6.283;p.push([cx+r*Math.cos(a)|0,cy+r*Math.sin(a)|0])}return p}
const SRC={
car:[[1,[[10,150],[22,126],[90,114],[122,88],[176,88],[212,112],[246,120],[252,150]]],
 [2,[[104,112],[126,93],[170,93],[198,112]]],
 [5,[[148,96],[156,92],[164,96],[164,110],[150,110]]],[1,[[146,94],[150,88],[160,88],[168,93],[160,92],[154,96]]],
 [0,[[8,150],[252,150],[248,162],[12,162]]],[6,[[236,124],[250,126],[250,134],[238,134]]],
 [0,circ(62,158,22,10)],[3,circ(62,158,11,8)],[0,circ(200,158,22,10)],[3,circ(200,158,11,8)]],
rear:[[1,[[40,150],[52,112],[84,96],[172,96],[204,112],[216,150]]],[2,[[66,112],[90,100],[166,100],[190,112]]],
 [5,[[118,104],[128,100],[138,104],[136,112],[120,112]]],[0,[[40,150],[216,150],[212,168],[44,168]]],
 [7,[[48,122],[96,122],[96,132],[50,132]]],[7,[[160,122],[208,122],[206,132],[160,132]]],
 [0,[[54,166],[84,166],[84,182],[54,182]]],[0,[[172,166],[202,166],[202,182],[172,182]]]],
face:[[8,[[0,255],[0,150],[60,120],[80,60],[255,60],[255,255]]],
 [5,[[90,120],[100,70],[150,50],[190,70],[200,110],[212,130],[200,136],[204,160],[188,176],[160,180],[150,210],[110,210],[100,170]]],
 [1,[[86,120],[78,80],[96,48],[120,32],[150,28],[176,34],[196,50],[204,72],[190,64],[170,58],[150,62],[130,74],[118,96],[110,124]]],
 [0,[[172,96],[184,94],[186,100],[174,102]]],[4,[[96,214],[160,208],[200,255],[70,255]]],[0,[[120,218],[146,214],[150,232],[128,236]]],
 [9,[[40,250],[120,236],[124,255],[40,255]]]],
lester:[[5,[[120,40],[136,40],[138,58],[122,60]]],[1,[[116,44],[118,32],[132,28],[142,34],[140,46],[132,40]]],
 [4,[[116,62],[142,62],[146,110],[114,110]]],[3,[[116,108],[144,108],[144,118],[116,118]]]],
lab:[[10,[[0,255],[0,90],[60,60],[200,60],[255,90],[255,255]]],[11,[[0,90],[60,60],[200,60],[255,90]]],
 [12,[[110,170],[150,170],[150,255],[110,255]]],[13,[[20,110],[60,110],[60,130],[20,130]]],[13,[[200,110],[240,110],[240,130],[200,130]]],
 [13,[[70,100],[100,100],[100,116],[70,116]]],[13,[[160,100],[190,100],[190,116],[160,116]]],[11,[[118,30],[142,30],[140,60],[120,60]]]]};
const NAMES=Object.keys(SRC);
function assemble(){const b=[NAMES.length];for(const k of NAMES){const s=SRC[k];b.push(s.length);for(const [c,p] of s){b.push(c,p.length);for(const [x,y] of p)b.push(Math.max(0,Math.min(255,x)),Math.max(0,Math.min(255,y)))}}return b}
function pack(b){const d=b.map((v,i)=>(v-(i?b[i-1]:0))&255),o=[];for(let i=0;i<d.length;){let r=1;while(i+r<d.length&&d[i+r]==d[i]&&r<255)r++;if(r>=3||d[i]==255){o.push(255,r,d[i]);i+=r}else{o.push(d[i]);i++}}return o}
function unpack(o){const d=[];for(let i=0;i<o.length;){if(o[i]==255){for(let k=0;k<o[i+1];k++)d.push(o[i+2]);i+=3}else d.push(o[i++])}let p=0;return d.map(v=>p=(p+v)&255)}
const RAW=assemble(),PACKED=pack(RAW);
const B64=btoa(String.fromCharCode(...PACKED));
/* ===== PLAYER: decode packed binary, polygon VM ===== */
const BIN=unpack(Array.from(atob(B64),c=>c.charCodeAt(0)));
const LIB={};(function(){let i=0;const n=BIN[i++];for(let s=0;s<n;s++){const np=BIN[i++],polys=[];for(let k=0;k<np;k++){const c=BIN[i++],m=BIN[i++],p=[];for(let j=0;j<m;j++){p.push(BIN[i],BIN[i+1]);i+=2}polys.push([c,p])}LIB[NAMES[s]]=polys}})();
let PAL=[],ops=0;
const BASEPAL=['#08060e','#c8202a','#1a1e4a','#9a9aa6','#e8e8e8','#e0a080','#ff3060','#ff2020','#101830','#202a50','#2a2f3e','#3a4256','#ffd27a','#7ad4ff','#000','#fff'];
function poly(c,pts){ops++;V.fillStyle=PAL[c]||c;V.beginPath();V.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)V.lineTo(pts[i],pts[i+1]);V.fill()}
function draw(n,x,y,s,f){const fl=f?-1:1;for(const [c,p] of LIB[n]){const q=[];for(let i=0;i<p.length;i+=2)q.push(x+(p[i]-128)*s*fl,y+(p[i+1]-128)*s);poly(c,q)}}
function rect(c,x,y,w,h){poly(c,[x,y,x+w,y,x+w,y+h,x,y+h])}
function sky(a,b,n){for(let i=0;i<n;i++){const k=i/(n-1);PAL[14]=mix(a,b,k);rect(14,0,i*H/n,W,H/n+1)}}
function mix(a,b,k){const p=s=>[1,3,5].map(i=>parseInt(s.substr(i,2),16));const A=p(a),Bc=p(b);return'rgb('+A.map((v,i)=>v+(Bc[i]-v)*k|0)+')'}
function hash(i){const s=Math.sin(i*127.1)*43758.5;return s-Math.floor(s)}
function skyline(off,y,col,sc,seed){for(let i=-1;i<14;i++){const w=30*sc,x=((i*w-off)%(14*w)+14*w)%(14*w)-w,h=(20+hash(i+seed)*50)*sc;rect(col,x,y-h,w-2,h+40);
 PAL[12]='#ffd27a';for(let j=0;j<5;j++)if(hash(i*9+j+seed)>.55)rect(12,x+3+(j%2)*10*sc,y-h+6+j*8*sc,3,2)}}
/* ===== SCENES ===== */
function scene(t){PAL=BASEPAL.slice();ops=0;let label='';
if(t<7){label='SEQ 01 · CITY';sky('#05030f','#3a0a3a',12);PAL[9]='#f04a8a';poly(9,circ(240,70,26,16).flat());
 for(let i=0;i<40;i++)if(hash(i)>.3){PAL[15]='#fff';rect(15,hash(i+3)*W,hash(i+7)*90,1,1)}
 skyline(t*6,150,10,1.4,1);skyline(t*14,165,8,1,5);rect(0,0,165,W,20);
 const cx=-60+t*35;draw('car',cx,158,.18,0)}
else if(t<17){const u=t-7;label='SEQ 02 · HIGHWAY';sky('#070418','#5a1048',10);PAL[9]='#ff7aa8';poly(9,circ(60,60,18,14).flat());
 skyline(u*10,120,11,1.3,2);skyline(u*30,138,10,1,7);rect(0,0,138,W,50);PAL[13]='#555';rect(13,0,150,W,2);
 for(let i=0;i<6;i++){const x=((i*80-u*260)%480+480)%480-80;rect(3,x,70,3,80);PAL[12]='#ffe9a0';rect(12,x-10,68,14,3);PAL[6]='rgba(255,220,140,.12)';poly(6,[x-10,71,x+4,71,x+30,150,x-36,150])}
 PAL[7]='#ff2';for(let i=0;i<8;i++){const x=((i*60-u*400)%480+480)%480-80;rect(7,x,166,24,2)}
 draw('car',140+Math.sin(u*2)*6,150+Math.sin(u*17)*.6,.4,0);PAL[6]='rgba(255,255,200,.25)';poly(6,[240,138,320,128,320,152])}
else if(t<26){const u=t-17;label='SEQ 03 · LESTER';const sw=(u*1.3)%1;
 PAL[8]=mix('#101830','#3a1830',Math.abs(Math.sin(u)));PAL[5]=mix('#a06850','#ffc090',Math.max(0,Math.sin(sw*6.28)));
 sky('#05030f','#200828',6);for(let i=0;i<5;i++){const x=((i*90-u*220)%450+450)%450-60;PAL[12]='#ffd27a';rect(12,x,40+hash(i)*30,4,2)}
 draw('face',150,100,.75,0);PAL[6]='rgba(255,180,120,.18)';const sx=W-((u*300)%600);poly(6,[sx,0,sx+40,0,sx-40,H,sx-80,H]);
 PAL[2]='#0a0a14';rect(2,0,0,W,12);rect(2,0,168,W,12)}
else if(t<33){const u=t-26;label='SEQ 04 · OUTSKIRTS';sky('#0a0420','#ff4a7a',14);PAL[12]='#ffb040';
 for(let i=0;i<7;i++){const y=50+i*7,w=Math.sqrt(36*36-(i*7-20)**2||0);if(i%2==0||i<3)poly(12,[160-w,y,160+w,y,160+w,y+5,160-w,y+5])}
 skyline(u*4,96,8,.8,3);rect(0,0,96,W,90);PAL[6]='#ff2fa0';
 for(let i=0;i<12;i++){const z=((i-u*3)%12+12)%12,y=96+Math.pow(z/12,2.2)*84;rect(6,0,y,W,1)}
 for(let i=-10;i<=10;i++)poly(6,[160+i*4,96,161+i*4,96,160+i*60+1,180,160+i*60,180]);
 PAL[13]='#222';poly(13,[150,96,170,96,250,180,70,180]);draw('rear',160+Math.sin(u*1.5)*8,150,.38,0)}
else{const u=t-33;label='SEQ 05 · THE LAB';sky('#02020a','#1a2040',8);for(let i=0;i<30;i++){PAL[15]='#cce';rect(15,hash(i)*W,hash(i+9)*60,1,1)}
 const blink=Math.sin(u*6)>0;PAL[13]=blink?'#7ad4ff':'#2a6a8a';PAL[12]=u>4.2?'#fff6c0':'#ffd27a';
 draw('lab',190,90,.55,0);rect(0,0,158,W,30);PAL[7]='#333';rect(7,0,158,W,1);
 const cx=Math.min(110,-60+u*80);draw('car',cx,148,.3,0);
 if(u>2.5){const lx=Math.min(195,128+(u-2.5)*40),wk=Math.sin(u*10)*3;if(lx<195){draw('lester',lx,140,.32,0);PAL[0]='#111';poly(0,[lx-3,154,lx,154,lx-1+wk,166,lx-4+wk,166]);poly(0,[lx,154,lx+3,154,lx+2-wk,166,lx-1-wk,166])}}
 if(u>5.5){PAL[14]='rgba(0,0,0,'+Math.min(1,(u-5.5)*1.5)+')';rect(14,0,0,W,H)}}
if(t<.8){PAL[14]='rgba(0,0,0,'+(1-t/.8)+')';rect(14,0,0,W,H)}
return label}
/* ===== MAIN ===== */
const q=new URLSearchParams(location.search),T0=performance.now()-(parseFloat(q.get('t'))||0)*1000;
function frame(now){const t=((now-T0)/1000)%DUR;const label=scene(t);
X.fillStyle='#000';X.fillRect(0,0,1280,720);X.imageSmoothingEnabled=false;X.drawImage(B,0,0,1280,720);
for(let y=0;y<720;y+=4){X.fillStyle='rgba(0,0,0,.18)';X.fillRect(0,y,1280,1)}
X.font='bold 16px monospace';X.textBaseline='top';X.fillStyle='rgba(0,0,0,.55)';X.fillRect(16,16,330,96);X.fillStyle='#7ad4ff';
X.fillText('AW-VM POLYGON PLAYER',28,24);X.fillStyle='#ddd';X.font='13px monospace';
X.fillText('shapes.bin  raw '+RAW.length+' B -> packed '+PACKED.length+' B',28,48);
X.fillText('ops/frame '+String(ops).padStart(3,'0')+'  res 320x180  pal 16',28,66);
X.fillText(label+'   t='+t.toFixed(2)+'s',28,84);
if(t<7&&t>1){const a=Math.min(1,(t-1)/1.2,(7-t)/1);X.globalAlpha=a;X.textAlign='center';X.font='bold 76px monospace';X.fillStyle='#ff3fa0';X.fillText('NIGHTCALL',643,283);X.fillStyle='#fff';X.fillText('NIGHTCALL',640,280);
 X.font='bold 22px monospace';X.fillStyle='#7ad4ff';X.fillText('KAVINSKY  ·  starring LESTER',640,372);X.textAlign='left';X.globalAlpha=1}
if(t>35&&t<39.5){X.globalAlpha=Math.min(1,(t-35)*2,(39.5-t)*2);X.textAlign='center';X.font='bold 30px monospace';X.fillStyle='#fff';X.fillText('23:58 — ARRIVING AT THE LAB',640,640);X.textAlign='left';X.globalAlpha=1}
requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script></body></html>
