<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reactive Resume — Showreel</title>
<style>
html,body{margin:0;background:#000;height:100%;overflow:hidden}
#s{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:0 0}
canvas{display:block;width:1280px;height:720px}
</style>
</head>
<body>
<div id="s"><canvas id="c" width="1280" height="720"></canvas></div>
<script>
window.DUR=46;
const W=1280,H=720,c=document.getElementById('c'),x=c.getContext('2d');
function fit(){const s=Math.min(innerWidth/W,innerHeight/H),d=document.getElementById('s');d.style.transform=`scale(${s}) translate(-50%,-50%)`;d.style.transformOrigin='0 0';d.style.left='50%';d.style.top='50%';d.style.transform=`translate(-50%,-50%) scale(${s})`;d.style.transformOrigin='center';}
addEventListener('resize',fit);fit();
const off=parseFloat(new URLSearchParams(location.search).get('t'))||0;
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const seg=(t,a,b)=>cl((t-a)/(b-a));
const eo=p=>1-Math.pow(1-p,3);
const eio=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const eb=p=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2)};
const lerp=(a,b,p)=>a+(b-a)*p;
const F='"Inter","Segoe UI",Helvetica,Arial,sans-serif';
const ACC=['#38bdf8','#a78bfa','#f472b6','#34d399','#fbbf24','#f87171'];
function rr(X,Y,w,h,r){x.beginPath();x.roundRect(X,Y,w,h,r);}
function txt(s,X,Y,sz,col,wt='700',al='left'){x.font=`${wt} ${sz}px ${F}`;x.fillStyle=col;x.textAlign=al;x.textBaseline='middle';x.fillText(s,X,Y);}
function hex2(c){return[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]}
function mix(a,b,p){const A=hex2(a),B=hex2(b);return`rgb(${A.map((v,i)=>Math.round(lerp(v,B[i],p))).join(',')})`}
// seeded random
let sd=7;const R=()=>(sd=(sd*16807)%2147483647)/2147483647;
const parts=[...Array(140)].map(()=>({x:R()*W,y:R()*H,z:R()*1+.2,a:R()*6.28}));

function bg(t,hue){
  const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#07080d');g.addColorStop(1,'#0e1018');x.fillStyle=g;x.fillRect(0,0,W,H);
  for(let i=0;i<3;i++){const px=W/2+Math.cos(t*.3+i*2.1)*420,py=H/2+Math.sin(t*.4+i*1.7)*220;
    const rg=x.createRadialGradient(px,py,0,px,py,420);rg.addColorStop(0,ACC[(i+hue)%6]+'30');rg.addColorStop(1,'#0000');x.fillStyle=rg;x.fillRect(0,0,W,H);}
  x.strokeStyle='rgba(255,255,255,.035)';x.lineWidth=1;const o=(t*20)%40;
  for(let X=-o;X<W;X+=40){x.beginPath();x.moveTo(X,0);x.lineTo(X,H);x.stroke();}
  for(let Y=-o;Y<H;Y+=40){x.beginPath();x.moveTo(0,Y);x.lineTo(W,Y);x.stroke();}
  for(const p of parts){const yy=(p.y-t*14*p.z+H*10)%H;x.fillStyle=`rgba(255,255,255,${.15*p.z})`;x.fillRect(p.x+Math.sin(t+p.a)*8,yy,1.6*p.z,1.6*p.z);}
}
// resume
function resume(X,Y,w,h,o){
  const acc=o.acc||'#38bdf8',L=o.layout||0,s=w/300;
  x.save();x.shadowColor='rgba(0,0,0,.5)';x.shadowBlur=30*s;x.shadowOffsetY=10*s;rr(X,Y,w,h,4*s);x.fillStyle='#fff';x.fill();x.restore();
  x.save();rr(X,Y,w,h,4*s);x.clip();
  const bar=(bx,by,bw,col='#d4d4d8',bh=4)=>{rr(bx,by,bw,bh*s,2*s);x.fillStyle=col;x.fill();};
  let cx=X+18*s,cw=w-36*s,top=Y+20*s;
  const nm=o.name??'Jordan Rivera',hd=o.head??'Motion Designer';
  if(L==2){x.fillStyle=acc;x.fillRect(X,Y,w,70*s);txt(nm,X+18*s,Y+28*s,20*s*(o.fs||1),'#fff');txt(hd,X+18*s,Y+50*s,10*s,'rgba(255,255,255,.85)','500');top=Y+90*s;}
  else{
    const sx=L==0?X:X+w*.66,sw=w*.34;x.fillStyle=acc+'22';x.fillRect(sx,Y,sw,h);
    x.beginPath();x.arc(sx+sw/2,Y+42*s,20*s,0,7);x.fillStyle=acc;x.fill();
    for(let i=0;i<9;i++){if(i%3==0)bar(sx+12*s,Y+(80+i*16)*s,sw*.45,acc);else bar(sx+12*s,Y+(80+i*16)*s,sw*(.5+(i*37%30)/100));}
    for(let i=0;i<5;i++){rr(sx+12*s,Y+(240+i*14)*s,sw-24*s,5*s,3*s);x.fillStyle='#e4e4e7';x.fill();rr(sx+12*s,Y+(240+i*14)*s,(sw-24*s)*(.4+((i*53)%50)/100),5*s,3*s);x.fillStyle=acc;x.fill();}
    cx=L==0?X+w*.34+16*s:X+16*s;cw=w*.66-32*s;
    txt(nm,cx,top+8*s,18*s*(o.fs||1),'#18181b');txt(hd,cx,top+28*s,10*s,acc,'600');top+=48*s;
  }
  for(let k=0;k<4;k++){if(top>Y+h-20*s)break;txt(['Summary','Experience','Education','Skills'][k].toUpperCase(),cx,top,8*s,acc,'800');x.fillStyle=acc;x.fillRect(cx,top+7*s,cw,1*s);top+=16*s;
    for(let i=0;i<(k==1?6:3);i++){bar(cx,top,cw*(.55+((i*31+k*17)%45)/100));top+=10*s;}top+=8*s;}
  x.restore();
}
function cursor(X,Y,cl){x.save();x.translate(X,Y);x.beginPath();x.moveTo(0,0);x.lineTo(0,18);x.lineTo(5,14);x.lineTo(9,22);x.lineTo(12,20);x.lineTo(8,13);x.lineTo(14,13);x.closePath();x.fillStyle='#fff';x.fill();x.strokeStyle='#000';x.lineWidth=1.2;x.stroke();if(cl){x.beginPath();x.arc(4,4,cl*26,0,7);x.strokeStyle=`rgba(56,189,248,${1-cl})`;x.lineWidth=3;x.stroke();}x.restore();}
function words(arr,cxp,Y,sz,t,a,col,wt='800'){
  x.font=`${wt} ${sz}px ${F}`;const gap=sz*.28,ws=arr.map(w=>x.measureText(w[0]).width);const tot=ws.reduce((p,v)=>p+v,0)+gap*(arr.length-1);let px=cxp-tot/2;
  arr.forEach((w,i)=>{const p=eo(seg(t,a+i*.09,a+i*.09+.6));x.save();x.beginPath();x.rect(px-4,Y-sz*.7,ws[i]+8,sz*1.4);x.clip();txt(w[0],px,Y+(1-p)*sz*1.2,sz,w[1]||col,wt);x.restore();px+=ws[i]+gap;});
}
function logo(X,Y,s,p){
  x.save();x.translate(X,Y);x.scale(s,s);
  rr(-50,-50,100,100,24);x.fillStyle='#111';x.fill();x.lineWidth=3;x.strokeStyle='rgba(255,255,255,.15)';x.stroke();
  x.lineCap='round';x.lineWidth=9;x.strokeStyle='#fff';
  x.setLineDash([300]);x.lineDashOffset=300*(1-p);
  x.beginPath();x.moveTo(-22,28);x.lineTo(-22,-26);x.lineTo(6,-26);x.quadraticCurveTo(24,-26,24,-9);x.quadraticCurveTo(24,6,6,6);x.lineTo(-22,6);x.moveTo(4,6);x.lineTo(24,28);x.stroke();x.setLineDash([]);x.restore();
}
const TPL=['Azurill','Bronzor','Chikorita','Ditto','Gengar','Glalie','Kakuna','Leafish','Nosepass','Onyx','Pikachu','Rhyhorn'];
const ICONS={
lock:()=>{rr(-18,-4,36,26,5);x.fill();x.beginPath();x.arc(0,-6,12,Math.PI,0);x.stroke();},
box:()=>{for(let i=0;i<3;i++)for(let j=0;j<2;j++){rr(-22+i*15,-14+j*12,12,9,2);x.fill();}x.beginPath();x.moveTo(-26,10);x.quadraticCurveTo(0,30,26,10);x.stroke();},
spark:()=>{x.beginPath();for(let i=0;i<8;i++){const r=i%2?7:22,a=i*Math.PI/4;x.lineTo(Math.cos(a)*r,Math.sin(a)*r);}x.fill();},
globe:()=>{x.beginPath();x.arc(0,0,20,0,7);x.stroke();x.beginPath();x.ellipse(0,0,8,20,0,0,7);x.stroke();x.beginPath();x.moveTo(-20,0);x.lineTo(20,0);x.stroke();},
pdf:()=>{rr(-15,-20,30,40,4);x.stroke();for(let i=0;i<3;i++){x.fillRect(-9,-10+i*9,18,3);}},
link:()=>{x.beginPath();x.ellipse(-8,0,12,7,-.6,0,7);x.stroke();x.beginPath();x.ellipse(8,0,12,7,-.6,0,7);x.stroke();}};
const FEAT=[['lock','Privacy first','No tracking. No ads.'],['box','Self-host','One Docker command'],['spark','AI assisted','Bring your own key'],['globe','Multilingual','Dozens of languages'],['pdf','PDF export','Pixel-perfect'],['link','Share a link','With view stats']];

function frame(t){
  const sc=[0,5,11,21,28,34,40,46];let si=sc.findIndex((v,i)=>t>=v&&t<sc[i+1]);
  bg(t,si);
  // ---- S1 intro
  if(t<5.4){const l=t;
    const p=eb(seg(l,.2,1.2)),ls=1.5*p;
    for(let i=0;i<24;i++){const a=i/24*6.28,r=eo(seg(l,.3,1.6))*360;x.fillStyle=ACC[i%6];x.globalAlpha=1-seg(l,.6,1.8);x.beginPath();x.arc(640+Math.cos(a)*r,300+Math.sin(a)*r,4,0,7);x.fill();}
    x.globalAlpha=1;
    const sl=eio(seg(l,2,2.8));logo(640-sl*250,300+sl*60,ls*(1-sl*.35),seg(l,.5,1.8));
    if(l>2.2){words([['Reactive'],['Resume',ACC[0]]],640+110,360,74,l,2.4,'#fff','900');}
    x.globalAlpha=seg(l,3.3,4);txt('THE SHOWREEL',640,460,16,'#94a3b8','600','center');x.globalAlpha=1;
  }
  // ---- S2 tagline
  else if(t<11.4){const l=t-5;
    words([['A'],['free'],['and'],['open-source',ACC[3]]],640,250,64,l,.2,'#fff');
    words([['resume'],['builder.']],640,330,64,l,.8,'#fff');
    words([['Simple.'],['Secure.',ACC[1]],['Yours.',ACC[2]]],640,450,40,l,2.2,'#cbd5e1','600');
    // counter
    const n=Math.floor(eo(seg(l,3,5))*1000000);x.globalAlpha=seg(l,3,3.5);txt(n.toLocaleString('en-US')+'+ resumes built',640,560,22,'#94a3b8','600','center');x.globalAlpha=1;
    const sw=eio(seg(l,.1,1.2));x.fillStyle=ACC[0];x.fillRect(640-sw*300,600,sw*600,3);
  }
  // ---- S3 editor UI
  else if(t<21.4){const l=t-11,ap=eo(seg(l,0,1.2));
    x.save();x.translate(640,360);x.scale(.86+ap*.14,.86+ap*.14);x.rotate((1-ap)*-.05);x.translate(-640,-360);x.globalAlpha=ap;
    rr(40,40,1200,640,14);x.fillStyle='#16171d';x.fill();x.strokeStyle='#2a2b33';x.stroke();
    rr(40,40,1200,40,14);x.fillStyle='#1d1e25';x.fill();['#f87171','#fbbf24','#34d399'].forEach((c,i)=>{x.beginPath();x.arc(66+i*20,60,6,0,7);x.fillStyle=c;x.fill();});
    txt('rxresu.me/builder',640,60,13,'#71717a','500','center');
    // left
    x.fillStyle='#1a1b22';x.fillRect(40,80,300,600);
    const sec=['Basics','Summary','Profiles','Experience','Education','Skills','Languages','Projects'];
    sec.forEach((s,i)=>{const p=eo(seg(l,.6+i*.06,1.2+i*.06));x.globalAlpha=ap*p;rr(56,100+i*30,22,22,6);x.fillStyle=i==0?ACC[0]:'#2a2b33';x.fill();txt(s,90-(1-p)*20,111+i*30,13,i==0?'#fff':'#a1a1aa','600');});
    x.globalAlpha=ap;
    const name='Jordan Rivera',head='Motion Designer & Art Director';
    const n1=Math.floor(cl((l-2)*9,0,name.length)),n2=Math.floor(cl((l-4)*14,0,head.length));
    [['Full Name',name.slice(0,n1),l>1.8&&l<4],['Headline',head.slice(0,n2),l>=4&&l<6.6],['Email','jordan@studio.io',0]].forEach((f,i)=>{const fy=370+i*70;txt(f[0],56,fy,11,'#71717a','600');rr(56,fy+12,268,34,7);x.fillStyle='#111217';x.fill();x.strokeStyle=f[2]?ACC[0]:'#2a2b33';x.lineWidth=f[2]?2:1;x.stroke();txt(f[1],68,fy+29,13,'#e4e4e7','500');
      if(f[2]&&(l*2|0)%2){x.font=`500 13px ${F}`;x.fillStyle=ACC[0];x.fillRect(70+x.measureText(f[1]).width,fy+20,2,18);}});
    // right
    x.fillStyle='#1a1b22';x.fillRect(1000,80,240,600);
    ['Template','Layout','Typography','Theme','Page','Sharing','Statistics','Export'].forEach((s,i)=>{txt(s,1024,110+i*34,13,'#a1a1aa','600');});
    txt('THEME',1024,400,11,'#71717a','800');
    const ci=Math.floor(cl((l-7.2)*1.6,0,5));ACC.forEach((c,i)=>{x.beginPath();x.arc(1034+i*32,428,11,0,7);x.fillStyle=c;x.fill();if(i==ci){x.strokeStyle='#fff';x.lineWidth=2.5;x.stroke();}});
    // center
    const dots=x.createPattern||0;x.fillStyle='#0f1015';x.fillRect(340,80,660,600);
    for(let gx=350;gx<1000;gx+=20)for(let gy=90;gy<680;gy+=20){x.fillStyle='#1f2028';x.fillRect(gx,gy,2,2);}
    const bump=l>7.2?.0:0;resume(520,110,300,424,{acc:ACC[ci],name:n1?name.slice(0,n1):' ',head:head.slice(0,n2)||' ',fs:.95});
    // cursor path
    let cxp=420,cyp=600,cc=0;
    if(l<2){const p=eio(seg(l,1,1.8));cxp=lerp(700,200,p);cyp=lerp(600,410,p);cc=seg(l,1.8,2.2);}
    else if(l<4){cxp=200;cyp=410;}else if(l<7){const p=eio(seg(l,3.6,4));cxp=200;cyp=lerp(410,480,p);cc=seg(l,4,4.4);}
    else{const p=eio(seg(l,6.6,7.2)),k=ci;cxp=lerp(200,1034+k*32,p);cyp=lerp(480,430,p);cc=((l-7.2)*1.6)%1;}
    cursor(cxp,cyp,cc>0&&cc<1?cc:0);
    x.restore();
    const cp=seg(l,1,1.6)-seg(l,9.4,10);x.globalAlpha=cp;rr(450,640,380,34,17);x.fillStyle=ACC[0];x.fill();txt('Live preview — every keystroke',640,657,15,'#0b0b0f','800','center');x.globalAlpha=1;
  }
  // ---- S4 templates
  else if(t<28.4){const l=t-21;
    words([['12+'],['templates.',ACC[4]],['Zero'],['cost.']],640,80,46,l,.1,'#fff');
    const rot=l*.55;
    const cards=TPL.map((n,i)=>{const a=(i/TPL.length)*6.28+rot;return{n,i,a,z:Math.cos(a)}}).sort((p,q)=>p.z-q.z);
    for(const k of cards){const s=.45+.35*(k.z+1)/2,px=640+Math.sin(k.a)*470,py=390;
      x.globalAlpha=cl((k.z+1.2)/1.6)*seg(l,0,.8);const w=200*s,h=w*1.414;
      resume(px-w/2,py-h/2,w,h,{acc:ACC[k.i%6],layout:k.i%3,name:'Jordan Rivera'});
      if(k.z>.6){x.globalAlpha=(k.z-.6)/.4;txt(k.n,px,py+h/2+26,20,'#fff','800','center');}}
    x.globalAlpha=1;
  }
  // ---- S5 customize
  else if(t<34.4){const l=t-28;
    const k=l*1.2,i0=Math.floor(k)%6,i1=(i0+1)%6,f=eio(cl((k%1)*2.5));
    const col=mix(ACC[i0],ACC[i1],f);const cc='#'+col.match(/\d+/g).map(v=>(+v).toString(16).padStart(2,'0')).join('');
    const ap=eb(seg(l,0,.9)),lay=Math.floor(l/2)%3;
    x.save();x.translate(860,370);x.scale(ap,ap);x.rotate(Math.sin(l*.8)*.04);resume(-170,-240,340,480,{acc:cc,layout:lay,fs:.9+.15*Math.sin(l*2)});x.restore();
    words([['Make'],['it'],['yours.',cc]],330,230,60,l,.2,'#fff','900');
    ['Colors','Fonts','Layouts','Custom CSS'].forEach((s,i)=>{const p=eo(seg(l,1+i*.25,1.6+i*.25));x.globalAlpha=p;rr(120-(1-p)*40,310+i*58,300,44,22);x.fillStyle='#1a1b22';x.fill();x.fillStyle=i==0?cc:ACC[(i+2)%6];x.beginPath();x.arc(146-(1-p)*40,332+i*58,8,0,7);x.fill();txt(s,166-(1-p)*40,332+i*58,18,'#e4e4e7','700');});
    x.globalAlpha=1;
    x.fillStyle=cc;x.fillRect(0,H-6,W*seg(l,0,6),6);
  }
  // ---- S6 features
  else if(t<40.4){const l=t-34;
    words([['Built'],['for'],['you,'],['not'],['for'],['data.',ACC[2]]],640,90,44,l,.1,'#fff');
    FEAT.forEach((f,i)=>{const cxp=260+(i%3)*380,cyp=270+Math.floor(i/3)*210,p=eb(seg(l,.5+i*.15,1.2+i*.15));
      x.save();x.translate(cxp,cyp+Math.sin(l*2+i)*4);x.scale(p,p);
      rr(-170,-85,340,170,18);x.fillStyle='#16171d';x.fill();x.strokeStyle=ACC[i]+'66';x.lineWidth=1.5;x.stroke();
      x.save();x.translate(-110,0);x.beginPath();x.arc(0,0,40,0,7);x.fillStyle=ACC[i]+'22';x.fill();x.fillStyle=ACC[i];x.strokeStyle=ACC[i];x.lineWidth=4;x.rotate(i==2?l:0);ICONS[f[0]]();x.restore();
      txt(f[1],-50,-14,22,'#fff','800');txt(f[2],-50,16,14,'#a1a1aa','500');x.restore();});
  }
  // ---- S7 outro
  else{const l=t-40;
    const p=eb(seg(l,.1,1));logo(640,250,1.3*p,seg(l,.2,1.4));
    words([['Free.'],['Forever.',ACC[0]]],640,400,68,l,.8,'#fff','900');
    x.globalAlpha=seg(l,1.8,2.4);rr(470,470,340,50,25);x.strokeStyle='#fff';x.lineWidth=2;x.stroke();txt('rxresu.me',640,495,24,'#fff','800','center');
    txt('Open source on GitHub · MIT licensed',640,560,16,'#94a3b8','600','center');
    x.globalAlpha=seg(l,4.8,5.8);x.fillStyle='#000';x.fillRect(0,0,W,H);x.globalAlpha=1;
  }
  // transitions
  for(const B of sc.slice(1,-1)){const d=t-B;if(d>-.45&&d<.45){const p=(d+.45)/.9,X=lerp(-1800,1400,eio(p));
    [ACC[(B|0)%6],'#0b0b0f'].forEach((c,j)=>{x.fillStyle=c;x.beginPath();x.moveTo(X+j*80,0);x.lineTo(X+1600+j*80,0);x.lineTo(X+1300+j*80,H);x.lineTo(X-300+j*80,H);x.fill();});}}
  // letterbox vignette
  const v=x.createRadialGradient(640,360,300,640,360,800);v.addColorStop(0,'#0000');v.addColorStop(1,'rgba(0,0,0,.55)');x.fillStyle=v;x.fillRect(0,0,W,H);
}
const st=performance.now();
function loop(n){const t=((n-st)/1000+off)%window.DUR;frame(t);requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
</body>
</html>
