<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Home</title>
<style>
html,body{margin:0;background:#000;height:100%;overflow:hidden}
#c{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#000}
</style></head><body>
<canvas id="c" width="1280" height="720"></canvas>
<script>
window.DUR=42;
const cv=document.getElementById('c'),x=cv.getContext('2d');
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);cv.style.width=1280*s+'px';cv.style.height=720*s+'px';}
addEventListener('resize',fit);fit();
const W=405,H=720,OX=(1280-W)/2;
const q=new URLSearchParams(location.search);const off=parseFloat(q.get('t'))||0;
const T0=performance.now()-off*1000;
// paper grain
const g=document.createElement('canvas');g.width=W;g.height=H;const gx=g.getContext('2d');
const id=gx.createImageData(W,H);
for(let i=0;i<id.data.length;i+=4){const v=Math.random()*255;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=18;}
gx.putImageData(id,0,0);
const stars=[];for(let i=0;i<60;i++)stars.push([Math.random()*W,Math.random()*380,Math.random()*6]);
const cl=v=>Math.max(0,Math.min(1,v));
const ease=v=>v*v*(3-2*v);
function sh(fn,col,d=5){x.save();x.fillStyle='rgba(0,0,0,.35)';x.translate(d,d);fn();x.restore();x.fillStyle=col;fn();}
function hill(y,a,f,ph,col,d){sh(()=>{x.beginPath();x.moveTo(0,H);for(let i=0;i<=W;i+=8)x.lineTo(i,y+Math.sin(i*f+ph)*a);x.lineTo(W,H);x.fill();},col,d);}
function tree(tx,ty,s,t){x.save();x.translate(tx,ty);x.rotate(Math.sin(t*.8)*.02);
 sh(()=>{x.beginPath();x.moveTo(-6*s,0);x.lineTo(-3*s,-70*s);x.lineTo(3*s,-70*s);x.lineTo(6*s,0);x.fill();
 for(let k=0;k<5;k++){x.beginPath();x.arc(Math.cos(k*1.3)*22*s,-80*s-Math.sin(k*2)*20*s,26*s,0,7);x.fill();}},'#1c1410',4);x.restore();}
function person(px,py,s,ph,walking){x.save();x.translate(px,py);x.scale(s,s);
 const sw=walking?Math.sin(ph)*0.4:0;
 sh(()=>{x.beginPath();x.arc(0,-62,9,0,7);x.fill();
 x.beginPath();x.moveTo(-10,-50);x.lineTo(10,-50);x.lineTo(13,-18);x.lineTo(-13,-18);x.fill();
 for(const a of[sw,-sw]){x.save();x.translate(0,-20);x.rotate(a);x.fillRect(-3,0,6,22);x.restore();}},'#140e0a',3);x.restore();}
function cat(cx,cy,t){sh(()=>{x.beginPath();x.ellipse(cx,cy,12,8,0,0,7);x.fill();x.beginPath();x.arc(cx+10,cy-8,6,0,7);x.fill();
 x.beginPath();x.moveTo(cx+6,cy-12);x.lineTo(cx+8,cy-19);x.lineTo(cx+11,cy-13);x.lineTo(cx+14,cy-19);x.lineTo(cx+15,cy-11);x.fill();
 x.beginPath();x.moveTo(cx-10,cy+3);x.quadraticCurveTo(cx-24,cy-4+Math.sin(t*3)*6,cx-18,cy-16+Math.sin(t*3)*6);x.lineWidth=3;x.strokeStyle=x.fillStyle;x.stroke();},'#140e0a',2);}
const caps=[[0.5,6.5,'What makes a place','feel like home?'],[7.5,13.5,'Not the walls alone…','but a light left on for you.'],
[14.5,20.5,'The smell of something warm,','drifting from the kitchen.'],[21.5,27.5,'Someone who knows','the sound of your footsteps.'],
[28.5,34.5,'Small rituals,','quietly repeated.'],[35.5,41.5,'Home is where','you are known.']];
function frame(t){
 x.setTransform(1,0,0,1,0,0);x.fillStyle='#050302';x.fillRect(0,0,1280,720);
 x.save();x.translate(OX,0);x.beginPath();x.rect(0,0,W,H);x.clip();
 const night=ease(cl((t-30)/8));
 const sk=x.createLinearGradient(0,0,0,H);
 sk.addColorStop(0,`rgb(${240-150*night|0},${150-100*night|0},${80-30*night|0})`);
 sk.addColorStop(.6,`rgb(${250-120*night|0},${200-120*night|0},${120-50*night|0})`);sk.addColorStop(1,'#3a2416');
 x.fillStyle=sk;x.fillRect(0,0,W,H);
 // moon/sun disc
 x.fillStyle=`rgba(255,240,200,${.6+.4*night})`;x.beginPath();x.arc(300,150+40*(1-night),38,0,7);x.fill();
 for(const s of stars){x.fillStyle=`rgba(255,240,210,${night*(.5+.5*Math.sin(t*2+s[2]))})`;x.fillRect(s[0],s[1],2,2);}
 hill(430,14,.012,t*.05,'#a8643a',4);
 hill(470,10,.02,1+t*.03,'#7a4426',5);
 tree(60,520,1.1,t);tree(355,530,.8,t+1);
 // house rises
 const r=ease(cl(t/4));const hy=560+(1-r)*240;
 x.save();x.translate(202,hy);
 sh(()=>{x.fillRect(-80,-120,160,120);x.beginPath();x.moveTo(-100,-115);x.lineTo(0,-200);x.lineTo(100,-115);x.fill();x.fillRect(40,-195,22,50);},'#2a1a12',7);
 const lit=ease(cl((t-8)/2));
 const fl=.9+.1*Math.sin(t*7)*Math.sin(t*3.1);
 for(const wx of[-55,15]){x.fillStyle=`rgba(255,${190+40*lit|0},90,${lit*fl})`;x.fillRect(wx,-95,40,36);
  x.fillStyle='#2a1a12';x.fillRect(wx+18,-95,4,36);x.fillRect(wx,-79,40,4);}
 if(lit>0){const gl=x.createRadialGradient(0,-70,10,0,-70,220);gl.addColorStop(0,`rgba(255,200,110,${.25*lit})`);gl.addColorStop(1,'rgba(255,200,110,0)');x.fillStyle=gl;x.fillRect(-220,-290,440,440);}
 const door=ease(cl((t-25)/1.5));
 x.fillStyle=`rgba(255,210,120,${door})`;x.fillRect(-15,-50,30,50);
 x.fillStyle='#1a100b';x.fillRect(-15,-50,30*(1-door*.8),50);
 if(t>28)cat(-35,-62,t);
 // smoke
 const sm=cl((t-14)/2);
 for(let i=0;i<7;i++){const p=((t*.25+i/7)%1);x.fillStyle=`rgba(250,235,215,${sm*.5*(1-p)})`;
  x.beginPath();x.arc(51+Math.sin(p*6+t)*12*p,-200-p*150,6+p*14,0,7);x.fill();}
 x.restore();
 hill(600,6,.03,2,'#2a1a10',6);
 // people
 if(t>21){const k=ease(cl((t-21)/4.5));person(-30+k*190,610,1,t*7,k<1);
  if(t>25.5){const k2=ease(cl((t-25.5)/1.5));person(202+k2*18,606,.95,0,false);}}
 // birds
 for(let i=0;i<3;i++){const bx=((t*25+i*90)%(W+80))-40,by=120+i*30+Math.sin(t+i)*8;x.strokeStyle=`rgba(30,20,15,${1-night})`;x.lineWidth=2;
  const w=Math.sin(t*6+i)*5;x.beginPath();x.moveTo(bx-9,by-w);x.lineTo(bx,by);x.lineTo(bx+9,by-w);x.stroke();}
 // caption
 x.textAlign='center';x.font='italic 25px Georgia,serif';
 for(const c of caps){const a=cl((t-c[0])/.8)*cl((c[1]-t)/.8);if(a<=0)continue;
  x.fillStyle=`rgba(20,12,8,${a*.55})`;x.fillRect(25,640,W-50,66);
  x.fillStyle=`rgba(255,238,210,${a})`;x.fillText(c[2],W/2,668);x.fillText(c[3],W/2,697);}
 x.drawImage(g,0,0);
 const vg=x.createRadialGradient(W/2,H/2,200,W/2,H/2,520);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.6)');x.fillStyle=vg;x.fillRect(0,0,W,H);
 const fd=cl(t/1)*cl((DUR-t)/1);x.fillStyle=`rgba(0,0,0,${1-fd})`;x.fillRect(0,0,W,H);
 x.restore();
}
// audio
let ac=null,nextT=0,step=0;
const chords=[[48,55,64],[45,52,60],[41,48,57],[43,50,59]];
const mel=[64,67,69,67,72,69,67,64,62,64,67,64,60,62,64,62];
const hz=m=>440*Math.pow(2,(m-69)/12);
function note(f,t0,d,v,type){const o=ac.createOscillator(),gn=ac.createGain();o.type=type;o.frequency.value=f;
 gn.gain.setValueAtTime(0,t0);gn.gain.linearRampToValueAtTime(v,t0+(type=='sine'?.02:.8));gn.gain.exponentialRampToValueAtTime(.0001,t0+d);
 o.connect(gn);gn.connect(ac.master);o.start(t0);o.stop(t0+d+.1);}
function startAudio(){if(ac){ac.resume();return;}try{ac=new (window.AudioContext||window.webkitAudioContext)();
 ac.master=ac.createGain();ac.master.gain.value=.5;const dl=ac.createDelay();dl.delayTime.value=.33;const fb=ac.createGain();fb.gain.value=.35;
 ac.master.connect(ac.destination);ac.master.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(ac.destination);nextT=ac.currentTime+.1;}catch(e){}}
function sched(){if(!ac||ac.state!='running')return;while(nextT<ac.currentTime+.5){
 const beat=.75;if(step%8==0){for(const m of chords[(step/8|0)%4])note(hz(m),nextT,6.5,.05,'triangle');}
 if(step%2==0||Math.random()<.3)note(hz(mel[step%16]+12),nextT,1.6,.07,'sine');
 nextT+=beat;step++;}}
startAudio();addEventListener('pointerdown',startAudio);addEventListener('keydown',startAudio);
function loop(){const t=((performance.now()-T0)/1000)%DUR;frame(t);sched();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script></body></html>
