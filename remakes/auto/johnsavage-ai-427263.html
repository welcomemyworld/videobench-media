<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#000;overflow:hidden;height:100%}
#s{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:0 0}
</style></head><body><canvas id="s" width="1280" height="720"></canvas>
<script>
window.DUR=20;
const c=document.getElementById('s'),x=c.getContext('2d');
function fit(){const k=Math.min(innerWidth/1280,innerHeight/720);c.style.transform=`scale(${k}) translate(-50%,-50%)`;c.style.left='50%';c.style.top='50%';c.style.transformOrigin='0 0';c.style.transform=`translate(-50%,-50%) scale(${k})`;c.style.transformOrigin='center';}
fit();addEventListener('resize',fit);
const q=new URLSearchParams(location.search);const off=parseFloat(q.get('t')||0)*1000;const t0=performance.now()-off;
const W=1280,H=720;
// grain buffer
const g=document.createElement('canvas');g.width=256;g.height=256;const gx=g.getContext('2d');const gi=gx.createImageData(256,256);
const stars=[];for(let i=0;i<300;i++)stars.push([Math.random()*2-1,Math.random()*2-1,Math.random()]);
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const ease=v=>v<.5?4*v*v*v:1-Math.pow(-2*v+2,3)/2;
const seg=(t,a,b)=>cl((t-a)/(b-a));
function txt(s,X,Y,sz,col,al,sp=0,glow=20){x.save();x.globalAlpha=al;x.font=`700 ${sz}px "Courier New",monospace`;x.textAlign='center';x.textBaseline='middle';x.fillStyle=col;x.shadowColor=col;x.shadowBlur=glow;
 if(sp){x.letterSpacing=sp+'px';}x.fillText(s,X,Y);x.restore();}
function grid(t,al){x.save();x.globalAlpha=al;const hz=H*0.58;
 let sky=x.createLinearGradient(0,0,0,hz);sky.addColorStop(0,'#0a0220');sky.addColorStop(1,'#4a0b4e');x.fillStyle=sky;x.fillRect(0,0,W,hz);
 // sun
 const sr=170,sy=hz-40;let sg=x.createLinearGradient(0,sy-sr,0,sy+sr);sg.addColorStop(0,'#ffe36b');sg.addColorStop(.5,'#ff5f8f');sg.addColorStop(1,'#a12bd8');
 x.save();x.beginPath();x.arc(W/2,sy,sr,0,7);x.clip();x.fillStyle=sg;x.shadowColor='#ff4fa0';x.shadowBlur=60;x.fillRect(W/2-sr,sy-sr,sr*2,sr*2);
 x.fillStyle='#2a0638';for(let i=0;i<9;i++){const yy=sy+i*i*2.4+((t*20)%12);x.fillRect(W/2-sr,yy,sr*2,2+i*1.3);}x.restore();
 // mountains
 x.fillStyle='#16042a';x.beginPath();x.moveTo(0,hz);for(let i=0;i<=40;i++){const xx=i/40*W;x.lineTo(xx,hz-40-Math.abs(Math.sin(i*1.7)*60+Math.sin(i*.6)*40)*(Math.abs(xx-W/2)/W*1.6));}x.lineTo(W,hz);x.fill();
 let fl=x.createLinearGradient(0,hz,0,H);fl.addColorStop(0,'#1a0330');fl.addColorStop(1,'#000');x.fillStyle=fl;x.fillRect(0,hz,W,H-hz);
 x.strokeStyle='#ff2fd0';x.shadowColor='#ff2fd0';x.shadowBlur=12;x.lineWidth=2;
 for(let i=-20;i<=20;i++){x.beginPath();x.moveTo(W/2+i*20,hz);x.lineTo(W/2+i*260,H);x.stroke();}
 const ph=(t*1.2)%1;for(let i=0;i<14;i++){const z=(i+1-ph);const yy=hz+(H-hz)*Math.pow(z/14,2.2);x.globalAlpha=al*cl(z/3);x.beginPath();x.moveTo(0,yy);x.lineTo(W,yy);x.stroke();}
 x.restore();}
function tunnel(t,al){x.save();x.globalAlpha=al;x.translate(W/2,H/2);
 for(let i=0;i<22;i++){let z=((i-t*4)%22+22)%22;const s=Math.pow(1.22,z)*6;const hue=(z*16+t*60)%360;x.strokeStyle=`hsl(${hue},100%,60%)`;x.shadowColor=x.strokeStyle;x.shadowBlur=15;x.lineWidth=1+z*0.15;x.globalAlpha=al*cl(z/5)*cl((22-z)/4);
  x.save();x.rotate(z*0.08+t*0.3);x.strokeRect(-s*1.6,-s,s*3.2,s*2);x.restore();}
 x.restore();}
function starfield(t,al,sp){x.save();x.globalAlpha=al;x.fillStyle='#bff';for(const s of stars){let z=((s[2]-t*sp)%1+1)%1;const k=1/(z+.02);const X=W/2+s[0]*k*60,Y=H/2+s[1]*k*60;const r=(1-z)*2.5;x.fillRect(X,Y,r,r);}x.restore();}
function frame(){
 let T=((performance.now()-t0)/1000)%DUR;
 x.globalCompositeOperation='source-over';x.fillStyle='#000';x.fillRect(0,0,W,H);
 // Scene 1: boot (0-4)
 if(T<4.5){const a=1-seg(T,4,4.5);starfield(T,a,.15);
  const lines=['> SYSTEM BOOT ...........OK','> LOADING NEURAL CORE .....OK','> CALIBRATING REASONING ...OK','> CONTEXT WINDOW ........∞','> INITIALIZING OPUS_'];
  x.save();x.font='22px "Courier New",monospace';x.fillStyle='#7dffb0';x.shadowColor='#3f8';x.shadowBlur=12;x.globalAlpha=a;
  lines.forEach((l,i)=>{const n=Math.floor(cl((T-0.3-i*.65)*30,0,l.length));x.fillText(l.slice(0,n)+(n<l.length&&n>0&&T*4%1<.5?'█':''),200,220+i*44);});x.restore();
  const p=seg(T,.4,3.6);x.globalAlpha=a;x.strokeStyle='#7dffb0';x.strokeRect(200,470,880,18);x.fillStyle='#7dffb0';x.fillRect(203,473,874*ease(p),12);x.globalAlpha=1;}
 // Scene 2: tunnel (4-9)
 if(T>3.8&&T<9.6){const a=seg(T,3.8,4.6)*(1-seg(T,9,9.6));tunnel(T,a);starfield(T,a,.6);
  const w=['THINK','DEEPER','REASON','FURTHER','CREATE','BOLDER'];const i=Math.floor((T-4.2)/0.85);
  if(i>=0&&i<6){const lt=((T-4.2)/0.85)%1;const sc=1+lt*.4;x.save();x.translate(W/2,H/2);x.scale(sc,sc);txt(w[i],0,0,96,i%2?'#ff4fd8':'#4ff7ff',a*Math.sin(lt*Math.PI),12,30);x.restore();}}
 // Scene 3: synthwave reveal (9-20)
 if(T>9){const a=seg(T,9,10.2)*(1-seg(T,19.3,20));grid(T,a);
  const r=ease(seg(T,10.5,12.5));const flash=Math.max(0,1-Math.abs(T-12.5)*3);
  // chrome title
  x.save();x.globalAlpha=a*r;x.translate(W/2,215);x.scale(1+(1-r)*.6,1+(1-r)*.6);
  x.font='italic 900 150px Impact,Arial Black,sans-serif';x.textAlign='center';x.textBaseline='middle';
  let cg=x.createLinearGradient(0,-70,0,70);cg.addColorStop(0,'#e8fbff');cg.addColorStop(.45,'#5fd0ff');cg.addColorStop(.5,'#1b0640');cg.addColorStop(.55,'#ff7ad9');cg.addColorStop(1,'#fff0c0');
  x.shadowColor='#ff2fd0';x.shadowBlur=40;x.lineWidth=4;x.strokeStyle='#fff';x.strokeText('OPUS',-60,0);x.fillStyle=cg;x.fillText('OPUS',-60,0);
  // shine
  const sx=((T-12)*500)%1600-800;x.globalCompositeOperation='source-atop';let sh=x.createLinearGradient(sx-60,0,sx+60,0);sh.addColorStop(0,'rgba(255,255,255,0)');sh.addColorStop(.5,'rgba(255,255,255,.8)');sh.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=sh;x.fillRect(-500,-90,1000,180);
  x.restore();
  const v=ease(seg(T,12.3,13.3));x.save();x.globalAlpha=a*v;x.translate(W/2+235,215);x.rotate(-.12);x.font='italic 900 110px Impact,Arial Black,sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillStyle='#ffe36b';x.shadowColor='#ff8a00';x.shadowBlur=35;x.fillText('5.5',0,(1-v)*-200);x.restore();
  txt('THE  NEXT  ERA  OF  INTELLIGENCE',W/2,330,24,'#4ff7ff',a*seg(T,13.5,14.5),6,15);
  const ft=['◆ DEEPER REASONING','◆ LONGER MEMORY','◆ SHARPER CODE'];
  ft.forEach((f,i)=>{const s=seg(T,15+i*.5,15.6+i*.5);txt(f,W/2+(i-1)*360+(1-ease(s))*40,610,22,'#ffe36b',a*s,2,12);});
  txt('AVAILABLE NOW',W/2,665,30,'#ff4fd8',a*seg(T,17,17.6)*(0.7+0.3*Math.sin(T*8)),8,25);
  if(flash>0){x.fillStyle=`rgba(255,220,255,${flash*.8*a})`;x.fillRect(0,0,W,H);}}
 // transition glitch
 const gl=Math.max(0,1-Math.abs(T-4)*4)+Math.max(0,1-Math.abs(T-9.3)*4);
 if(gl>0){for(let i=0;i<8;i++){const y=Math.random()*H,h=Math.random()*40;x.drawImage(c,0,y,W,h,(Math.random()-.5)*80*gl,y,W,h);}}
 // chromatic
 x.globalCompositeOperation='lighter';x.globalAlpha=.18;x.drawImage(c,3,0);x.globalAlpha=1;
 x.globalCompositeOperation='source-over';
 // scanlines
 x.fillStyle='rgba(0,0,0,.28)';for(let y=0;y<H;y+=3)x.fillRect(0,y,W,1);
 const ry=(T*180)%(H+200)-100;let rb=x.createLinearGradient(0,ry-60,0,ry+60);rb.addColorStop(0,'rgba(255,255,255,0)');rb.addColorStop(.5,'rgba(255,255,255,.05)');rb.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=rb;x.fillRect(0,ry-60,W,120);
 // grain
 const d=gi.data;for(let i=0;i<d.length;i+=4){const v=Math.random()*255;d[i]=d[i+1]=d[i+2]=v;d[i+3]=28;}gx.putImageData(gi,0,0);
 x.save();x.globalCompositeOperation='overlay';const ox=Math.random()*256,oy=Math.random()*256;x.translate(-ox,-oy);x.fillStyle=x.createPattern(g,'repeat');x.fillRect(0,0,W+256,H+256);x.restore();
 // vignette
 let vg=x.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.95);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.85)');x.fillStyle=vg;x.fillRect(0,0,W,H);
 x.fillStyle=`rgba(255,255,255,${0.015*Math.random()})`;x.fillRect(0,0,W,H);
 requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script></body></html>
