<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Showreel</title>
<style>
html,body{margin:0;background:#000;height:100%;overflow:hidden}
#s{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:0 0}
canvas{display:block}
</style></head><body>
<div id="s"><canvas id="c" width="1280" height="720"></canvas></div>
<script>
window.DUR=40;
const W=1280,H=720,c=document.getElementById('c'),x=c.getContext('2d');
const st=document.getElementById('s');
function fit(){const k=Math.min(innerWidth/W,innerHeight/H);st.style.transform=`scale(${k}) translate(-50%,-50%)`;st.style.left='50%';st.style.top='50%';st.style.transformOrigin='0 0';st.style.translate='';st.style.transform=`translate(-50%,-50%) scale(${k})`;st.style.transformOrigin='50% 50%';}
fit();addEventListener('resize',fit);
const q=new URLSearchParams(location.search);const off=parseFloat(q.get('t')||0)||0;
const t0=performance.now();
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const E=v=>{v=cl(v);return v<.5?4*v*v*v:1-Math.pow(-2*v+2,3)/2};
const EO=v=>1-Math.pow(1-cl(v),4);
const EB=v=>{v=cl(v);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(v-1,3)+c1*Math.pow(v-1,2)};
const lerp=(a,b,t)=>a+(b-a)*t;
function rnd(s){return function(){s=(s*16807)%2147483647;return s/2147483647}}
const R=rnd(7);
const stars=[...Array(260)].map(()=>[R()*W,R()*H,R()*1.6+.2,R()]);
const pts=[...Array(900)].map(()=>[R()*2-1,R()*2-1,R()*2-1,R()]);
const PAL=['#ff3d6e','#ffb238','#2de2c6','#5b6cff','#f4f1ea'];
function txt(s,X,Y,size,col,al=1,wt=800,sp=0,align='center'){x.save();x.globalAlpha=al;x.fillStyle=col;x.font=`${wt} ${size}px Helvetica,Arial,sans-serif`;x.textAlign=align;x.textBaseline='middle';if(x.letterSpacing!==undefined)x.letterSpacing=sp+'px';x.fillText(s,X,Y);x.restore();}
// letter reveal
function reveal(s,X,Y,size,col,t,wt=900,sp=0){x.save();x.font=`${wt} ${size}px Helvetica,Arial,sans-serif`;if(x.letterSpacing!==undefined)x.letterSpacing=sp+'px';const w=x.measureText(s).width;let cx=X-w/2;x.textBaseline='middle';for(let i=0;i<s.length;i++){const ch=s[i],cw=x.measureText(ch).width+(x.letterSpacing!==undefined?0:0);const p=EO((t-i*.04)/.6);x.save();x.beginPath();x.rect(cx-4,Y-size*.62,cw+sp+8,size*1.24);x.clip();x.globalAlpha=cl(p*1.5);x.fillStyle=col;x.fillText(ch,cx,Y+(1-p)*size*1.1);x.restore();cx+=cw;}x.restore();}
function grain(t){x.save();x.globalAlpha=.06;for(let i=0;i<500;i++){const r=Math.sin(i*91.7+t*733)*43758.5;const f=r-Math.floor(r);const g=Math.sin(i*12.3+t*511)*9343.1;x.fillStyle=f>.5?'#fff':'#000';x.fillRect(f*W,(g-Math.floor(g))*H,2,2);}x.restore();}
function vign(){const g=x.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,H*.95);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.75)');x.fillStyle=g;x.fillRect(0,0,W,H);}
function wipe(t,col){// circle iris transitions
}
// SCENE 1: 0-7 genesis point -> rings -> title
function s1(t){x.fillStyle='#07070b';x.fillRect(0,0,W,H);
for(const s of stars){x.globalAlpha=s[3]*cl(t/2)*(.5+.5*Math.sin(t*2+s[3]*20));x.fillStyle='#fff';x.fillRect(s[0],s[1],s[2],s[2]);}x.globalAlpha=1;
const cx=W/2,cy=H/2;
const dot=EB(t/.8)*8;x.fillStyle='#f4f1ea';x.beginPath();x.arc(cx,cy,dot*(1-EO((t-1.2)/.5)*.0),0,7);x.fill();
for(let i=0;i<5;i++){const p=EO((t-1-i*.15)/1.6);if(p<=0)continue;const r=p*(80+i*55);x.strokeStyle=PAL[i];x.lineWidth=(1-p)*14+2;x.globalAlpha=cl(1.3-EO((t-4.2)/1));x.beginPath();x.arc(cx,cy,r,-Math.PI/2+t*(i%2?1:-1)*.6,-Math.PI/2+t*(i%2?1:-1)*.6+Math.PI*2*p*.85);x.stroke();}
x.globalAlpha=1;
// burst lines
for(let i=0;i<24;i++){const a=i/24*Math.PI*2;const p=EO((t-1.1)/1);const r1=40+p*300,r2=40+cl(p*1.3-.2)*300;if(p<=0||p>=1)continue;x.strokeStyle=PAL[i%5];x.lineWidth=3;x.beginPath();x.moveTo(cx+Math.cos(a)*r2,cy+Math.sin(a)*r2);x.lineTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1);x.stroke();}
if(t>2.6){reveal('MOTION',cx,cy-30,150,'#f4f1ea',t-2.6,900,8);
const lp=E((t-3.4)/.8);x.fillStyle='#ff3d6e';x.fillRect(cx-260*lp,cy+52,520*lp,4);
if(t>3.8)reveal('DESIGN  ·  SHOWREEL  ·  MMXXV',cx,cy+90,20,'#c9c4b8',t-3.8,500,6);}
// exit iris
const ex=E((t-6)/1);if(ex>0){x.fillStyle='#ffb238';x.beginPath();x.arc(cx,cy,ex*800,0,7);x.fill();}}
// SCENE 2: 7-14 kinetic typography/grid swiss
function s2(t){x.fillStyle='#ffb238';x.fillRect(0,0,W,H);
const words=['SHAPE','RHYTHM','COLOR','TIME'];
for(let r=0;r<9;r++){const y=r*90+30;const dir=r%2?1:-1;const sp=(t*120+r*80)*dir;x.save();x.globalAlpha=.13;x.font='900 96px Helvetica,Arial';x.fillStyle='#1a1208';x.textBaseline='middle';let s='';for(let k=0;k<8;k++)s+=words[(k+r)%4]+' ';const w=x.measureText(s).width/2;let ox=((sp%w)+w)%w-w;x.fillText(s+s,ox,y);x.restore();}
// big swapping word
const idx=Math.floor(cl(t-.5,0,5.99)/1.5);const lt=(t-.5)-idx*1.5;
const wd=words[idx];const col=['#1a1208','#ff3d6e','#5b6cff','#07070b'][idx];
// block
const bp=E(lt/.4),bq=E((lt-1.1)/.4);x.fillStyle=col;const bw=760;x.fillRect(W/2-bw/2+bw*bq,H/2-110,bw*(bp-bq),220);
if(lt>.25&&lt<1.3)reveal(wd,W/2,H/2+4,170,idx==3?'#ffb238':'#f4f1ea',lt-.25,900,4);
txt('0'+(idx+1)+' / 04',90,60,18,'#1a1208',1,700,3,'left');txt('KINETIC TYPE',W-90,60,18,'#1a1208',1,700,3,'right');
// rotating geometric accents
x.save();x.translate(140,H-120);x.rotate(t*1.5);x.strokeStyle='#1a1208';x.lineWidth=4;x.strokeRect(-30,-30,60,60);x.restore();
x.save();x.translate(W-140,H-120);for(let i=0;i<3;i++){x.fillStyle=['#ff3d6e','#5b6cff','#1a1208'][i];x.beginPath();x.arc(Math.cos(t*3+i*2.1)*26,Math.sin(t*3+i*2.1)*26,9,0,7);x.fill();}x.restore();
const ex=E((t-6.2)/.8);if(ex>0){for(let i=0;i<8;i++){x.fillStyle='#07070b';const p=E((t-6.2-i*.04)/.6);x.fillRect(i*W/8,0,W/8+1,H*p);}}}
// SCENE 3: 14-21 3D particle sphere morph
function proj(px,py,pz,ry,rx){let c=Math.cos(ry),s=Math.sin(ry);let X=px*c-pz*s,Z=px*s+pz*c;c=Math.cos(rx);s=Math.sin(rx);let Y=py*c-Z*s;Z=py*s+Z*c;const f=700/(Z+3.2);return[W/2+X*f,H/2+Y*f,Z];}
function shape(i,k){const n=pts.length;const u=i/n;
if(k==0){const ph=Math.acos(1-2*u),th=Math.PI*(1+Math.sqrt(5))*i;return[Math.sin(ph)*Math.cos(th),Math.cos(ph),Math.sin(ph)*Math.sin(th)];}
if(k==1){const a=u*Math.PI*2*1,b=(i*0.618%1)*Math.PI*2;const R1=.85,r=.35;return[(R1+r*Math.cos(b))*Math.cos(a),r*Math.sin(b),(R1+r*Math.cos(b))*Math.sin(a)];}
if(k==2){const a=u*Math.PI*16;return[Math.cos(a)*(.3+u*.6)*1,(u-.5)*2,Math.sin(a)*(.3+u*.6)];}
const f=i%6,a=pts[i][0],b=pts[i][1];const m=[[1,a,b],[-1,a,b],[a,1,b],[a,-1,b],[a,b,1],[a,b,-1]][f];return m.map(v=>v*.7);}
function s3(t){x.fillStyle='#07070b';x.fillRect(0,0,W,H);
const g=x.createRadialGradient(W/2,H/2,0,W/2,H/2,500);g.addColorStop(0,'rgba(91,108,255,.25)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,W,H);
const ph=t/1.7;const k=Math.floor(ph)%4,k2=(k+1)%4;const m=E((ph%1-.55)/.45);
const ry=t*.7,rx=.35+Math.sin(t*.5)*.2;const arr=[];
const intro=EO(t/1.2);
for(let i=0;i<pts.length;i++){const a=shape(i,k),b=shape(i,k2);let p=[lerp(a[0],b[0],m),lerp(a[1],b[1],m),lerp(a[2],b[2],m)];const sc=intro;const P=proj(p[0]*sc+pts[i][0]*(1-sc)*3,p[1]*sc+pts[i][1]*(1-sc)*3,p[2]*sc,ry,rx);arr.push([P,i]);}
x.globalCompositeOperation='lighter';
for(const [P,i] of arr){const d=cl((1.6-P[2])/2.6,.15,1);x.fillStyle=PAL[i%4];x.globalAlpha=d;const s=d*3;x.fillRect(P[0]-s/2,P[1]-s/2,s,s);}
x.globalCompositeOperation='source-over';x.globalAlpha=1;
const names=['SPHERE','TORUS','HELIX','CUBE'];
txt('FORM',80,H-90,14,'#888',1,600,5,'left');txt(names[k],80,H-62,34,'#f4f1ea',1,800,4,'left');
txt('PROCEDURAL  /  900 PARTICLES',W-80,H-62,14,'#888',1,600,4,'right');
x.strokeStyle='#ffffff40';x.lineWidth=1;const cp=E(t/1);x.beginPath();x.moveTo(80,80);x.lineTo(80+40*cp,80);x.moveTo(80,80);x.lineTo(80,80+40*cp);x.moveTo(W-80,80);x.lineTo(W-80-40*cp,80);x.moveTo(W-80,80);x.lineTo(W-80,80+40*cp);x.stroke();
const ex=E((t-6.3)/.7);if(ex>0){x.fillStyle='#f4f1ea';x.save();x.translate(W/2,H/2);x.rotate(Math.PI/4);x.fillRect(-ex*950,-ex*950,ex*1900,ex*1900);x.restore();}}
// SCENE 4: 21-28 liquid blobs & bauhaus
function s4(t){x.fillStyle='#f4f1ea';x.fillRect(0,0,W,H);
// grid lines
x.strokeStyle='#1a120815';x.lineWidth=1;for(let i=0;i<=16;i++){x.beginPath();x.moveTo(i*80,0);x.lineTo(i*80,H);x.stroke();}for(let i=0;i<=9;i++){x.beginPath();x.moveTo(0,i*80);x.lineTo(W,i*80);x.stroke();}
// morph blob
function blob(cx,cy,r,col,sd,amp){x.fillStyle=col;x.beginPath();for(let i=0;i<=80;i++){const a=i/80*Math.PI*2;const rr=r*(1+amp*(Math.sin(a*3+t*2+sd)*.5+Math.sin(a*5-t*1.6+sd*2)*.3));const X=cx+Math.cos(a)*rr,Y=cy+Math.sin(a)*rr;i?x.lineTo(X,Y):x.moveTo(X,Y);}x.fill();}
const p=EB(t/1);x.globalCompositeOperation='multiply';
blob(W/2-150+Math.sin(t)*40,H/2,200*p,'#ff3d6e',0,.12);blob(W/2+120,H/2-60+Math.cos(t*1.2)*40,170*EB((t-.2)/1),'#2de2c6',2,.15);blob(W/2+30,H/2+110,140*EB((t-.4)/1),'#ffb238',4,.18);
x.globalCompositeOperation='source-over';
// bauhaus tiles
for(let i=0;i<6;i++){const pp=EB((t-.6-i*.12)/.7);if(pp<=0)continue;const X=120+i*0,Y=0;x.save();x.translate(110,140+i*80);x.scale(pp,pp);x.rotate(Math.sin(t+i)*.3);x.fillStyle=PAL[i%4];if(i%3==0){x.beginPath();x.arc(0,0,22,0,7);x.fill();}else if(i%3==1)x.fillRect(-20,-20,40,40);else{x.beginPath();x.moveTo(0,-24);x.lineTo(22,18);x.lineTo(-22,18);x.fill();}x.restore();}
// counter
const n=Math.floor(cl(t/4)*100);txt(String(n).padStart(3,'0')+'%',W-110,130,64,'#1a1208',1,900,0,'right');txt('ORGANIC',W-110,180,16,'#1a1208',1,700,6,'right');
if(t>1.5)reveal('FLUID',W-300,H-120,110,'#1a1208',t-1.5,900,2);
const ex=E((t-6.2)/.8);if(ex>0){x.fillStyle='#07070b';x.beginPath();x.moveTo(0,H);x.lineTo(W*2*ex,H);x.lineTo(0,H-H*2.5*ex);x.fill();}}
// SCENE 5: 28-35 neon tunnel / sinewaves data viz
function s5(t){x.fillStyle='#07070b';x.fillRect(0,0,W,H);x.globalCompositeOperation='lighter';
for(let i=0;i<22;i++){const z=((i-t*4)%22+22)%22;const s=1/(z*.12+.05);const rot=t*.3+z*.08;x.save();x.translate(W/2+Math.sin(t+z*.2)*40,H/2+Math.cos(t*.8+z*.2)*30);x.rotate(rot);x.strokeStyle=PAL[i%4];x.globalAlpha=cl(1-z/22)*cl(t/1);x.lineWidth=2*s*.15+.5;const r=30*s;x.beginPath();for(let k=0;k<=6;k++){const a=k/6*Math.PI*2;k?x.lineTo(Math.cos(a)*r,Math.sin(a)*r):x.moveTo(Math.cos(a)*r,Math.sin(a)*r);}x.stroke();x.restore();}
x.globalAlpha=1;
// waveforms
for(let w=0;w<3;w++){x.strokeStyle=PAL[w+1];x.globalAlpha=.8;x.lineWidth=2;x.beginPath();for(let X=0;X<=W;X+=6){const Y=H-90+Math.sin(X*.012+t*3+w*2)*20*Math.sin(X*.003+t)+w*0;X?x.lineTo(X,Y):x.moveTo(X,Y);}x.stroke();}
x.globalCompositeOperation='source-over';x.globalAlpha=1;
// bars
for(let i=0;i<32;i++){const h=(Math.sin(i*.7+t*4)*.5+.5)*(Math.sin(i*.31-t*2)*.5+.5)*120*E((t-.5)/1);x.fillStyle=PAL[i%4];x.fillRect(60+i*10,110-h/2,5,h);}
txt('SIGNAL',60,180,14,'#888',1,600,5,'left');
if(t>1)reveal('DEPTH',W/2,H/2,140,'#f4f1ea',t-1,900,10);
txt('120 FPS  ·  ∞ LOOP',W-60,110,14,'#888',1,600,4,'right');
const ex=E((t-6.2)/.8);if(ex>0){x.fillStyle='#ff3d6e';x.fillRect(0,H/2-H/2*ex,W,H*ex);}}
// SCENE 6: 35-40 outro
function s6(t){x.fillStyle='#ff3d6e';x.fillRect(0,0,W,H);
const p=E(t/1);x.fillStyle='#07070b';x.fillRect(0,0,W,H*.5*(1-p)*0);
// concentric squares rotating
for(let i=12;i>0;i--){const s=i*60*EO((t-i*.03)/1.2);x.save();x.translate(W/2,H/2);x.rotate(t*.2*(i%2?1:-1)+i*.05);x.fillStyle=i%2?'#ff3d6e':'#ff5b84';x.fillRect(-s/2,-s/2,s,s);x.restore();}
reveal('THANK YOU',W/2,H/2-20,120,'#f4f1ea',t-.4,900,6);
if(t>1.3){const lp=E((t-1.3)/.6);x.fillStyle='#07070b';x.fillRect(W/2-180*lp,H/2+50,360*lp,3);reveal('MADE WITH CODE & CRAFT',W/2,H/2+85,20,'#07070b',t-1.5,700,6);}
const ex=E((t-4.2)/.8);if(ex>0){x.fillStyle='#07070b';x.globalAlpha=ex;x.fillRect(0,0,W,H);x.globalAlpha=1;}}
const SC=[[0,7,s1],[7,14,s2],[14,21,s3],[21,28,s4],[28,35,s5],[35,40,s6]];
function frame(){const T=((performance.now()-t0)/1000+off)%DUR;
for(const [a,b,f] of SC)if(T>=a&&T<b){x.save();f(T-a);x.restore();break;}
// timecode + progress
x.globalAlpha=1;x.fillStyle='rgba(128,128,128,.6)';x.fillRect(0,H-3,W*T/DUR,3);
vign();grain(T);requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script></body></html>
