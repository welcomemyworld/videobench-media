<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Logo Motion</title>
<style>html,body{margin:0;background:#000;height:100%;overflow:hidden}
#s{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:0 0}</style></head>
<body><canvas id="s" width="1280" height="720"></canvas>
<script>
window.DUR=15;
const c=document.getElementById('s'),x=c.getContext('2d');
function fit(){const k=Math.min(innerWidth/1280,innerHeight/720);c.style.transform=`scale(${k}) translate(-50%,-50%)`;}
addEventListener('resize',fit);fit();
const q=new URLSearchParams(location.search),off=parseFloat(q.get('t')||0)*1000,t0=performance.now()-off;
const cl=v=>Math.max(0,Math.min(1,v)),eo=v=>1-Math.pow(1-cl(v),3),eb=v=>{v=cl(v);const s=1.7;return 1+(s+1)*Math.pow(v-1,3)+s*Math.pow(v-1,2)};
const A='#5b8cff',B='#b05bff',C='#3ff0c8';
function grad(x0,y0,x1,y1){const g=x.createLinearGradient(x0,y0,x1,y1);g.addColorStop(0,A);g.addColorStop(.5,B);g.addColorStop(1,C);return g;}
// logo mark: three orbiting petals forming a hexagonal flower
function mark(cx,cy,r,p,rot){
 x.save();x.translate(cx,cy);x.rotate(rot);
 for(let i=0;i<3;i++){const pp=eb(p*3-i*.4);if(pp<=0)continue;
  x.save();x.rotate(i*2.094);x.scale(pp,pp);x.globalAlpha=cl(pp);
  x.beginPath();x.ellipse(0,-r*.42,r*.3,r*.58,0,0,7);x.fillStyle=[A,B,C][i];x.globalCompositeOperation='lighter';x.fill();x.restore();}
 x.globalCompositeOperation='source-over';
 const pc=eb(p*2-1);if(pc>0){x.beginPath();x.arc(0,0,r*.16*pc,0,7);x.fillStyle='#fff';x.fill();}
 x.restore();}
function word(cx,cy,size,p,align){
 const s='LUMEN';x.font=`800 ${size}px Helvetica,Arial,sans-serif`;x.textBaseline='middle';
 let w=x.measureText(s).width+size*.12*(s.length-1),sx=align=='c'?cx-w/2:cx;
 for(let i=0;i<s.length;i++){const pp=eo(p*2-i*.15);x.globalAlpha=pp;x.fillStyle='#fff';
  x.fillText(s[i],sx,cy+(1-pp)*size*.6);sx+=x.measureText(s[i]).width+size*.12;}
 x.globalAlpha=1;return w;}
function bg(t){x.fillStyle='#07070f';x.fillRect(0,0,1280,720);
 for(let i=0;i<40;i++){const a=i*2.4+t*.05,rr=200+((i*97)%500);
  x.fillStyle=`rgba(${120+i*3},${110},255,${.05+.05*Math.sin(t+i)})`;
  x.beginPath();x.arc(640+Math.cos(a)*rr*1.3,360+Math.sin(a)*rr*.6,2+(i%3),0,7);x.fill();}
 const g=x.createRadialGradient(640,360,0,640,360,700);g.addColorStop(0,'rgba(91,140,255,.12)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,1280,720);}
function icon(k,cx,cy,s,t){x.save();x.translate(cx,cy);x.strokeStyle='#fff';x.lineWidth=s*.08;x.lineCap='round';x.lineJoin='round';
 if(k==0){for(let i=0;i<3;i++){x.beginPath();x.arc(0,0,s*(.15+i*.15)+((t*40)%(s*.15)),-.8,.8);x.stroke();}}
 else if(k==1){x.beginPath();x.moveTo(-s*.4,s*.3);x.lineTo(-s*.1,0);x.lineTo(s*.1,s*.15);x.lineTo(s*.4,-s*.3);x.stroke();
  x.beginPath();x.arc(s*.4,-s*.3,s*.06+Math.sin(t*6)*s*.02,0,7);x.fillStyle=C;x.fill();}
 else{x.beginPath();x.rect(-s*.3,-s*.05,s*.6,s*.4);x.stroke();x.beginPath();x.arc(0,-s*.05,s*.2,Math.PI,0);x.stroke();}
 x.restore();}
const feats=[['Connect','Everything in one place'],['Grow','Insights that move you forward'],['Secure','Protected by design']];
function frame(){
 const t=((performance.now()-t0)/1000)%DUR;bg(t);
 // Scene 1: logo build 0-4
 if(t<4.4){const o=1-eo((t-3.8)/.6);x.globalAlpha=o;
  const p=cl(t/1.6);x.strokeStyle=grad(540,260,740,460);x.lineWidth=3;
  x.beginPath();x.arc(640,320,110*eo(t/1),-Math.PI/2,-Math.PI/2+6.29*eo(t/1.2));x.stroke();
  mark(640,320,150,p,t*.3);x.globalAlpha=o;
  word(640,520,72,(t-1.4)/1.2,'c');
  x.font='400 22px Helvetica,Arial';x.textAlign='center';x.fillStyle=`rgba(200,210,255,${eo((t-2.4)/.6)*o})`;
  x.fillText('Light up what you build',640,590);x.textAlign='left';x.globalAlpha=1;}
 // Scene 2: features 4-11
 if(t>4&&t<11.4){const lt=t-4,o=1-eo((t-10.8)/.6);
  feats.forEach((f,i)=>{const st=lt-i*.3,p=eb(st/.8),cx=260+i*380,cy=360+(1-eo(st/.8))*200;
   x.save();x.globalAlpha=cl(p)*o;x.translate(cx,cy+Math.sin(t*1.5+i)*8);
   const fl=lt>1.5+i*1.7&&lt<3.2+i*1.7?1:0,sc=1+fl*.06;x.scale(sc,sc);
   x.fillStyle='rgba(255,255,255,.05)';x.strokeStyle=fl?grad(-150,-170,150,170):'rgba(255,255,255,.15)';x.lineWidth=2;
   x.beginPath();x.roundRect(-150,-170,300,340,24);x.fill();x.stroke();
   x.fillStyle=[A,B,C][i];x.beginPath();x.arc(0,-60,56,0,7);x.fill();icon(i,0,-60,80,t);
   x.fillStyle='#fff';x.textAlign='center';x.font='700 34px Helvetica,Arial';x.fillText(f[0],0,40);
   x.font='400 18px Helvetica,Arial';x.fillStyle='#aab';x.fillText(f[1],0,80);x.textAlign='left';x.restore();});
  x.globalAlpha=o;mark(70,60,40,1,t);x.font='800 26px Helvetica,Arial';x.fillStyle='#fff';x.textBaseline='middle';x.fillText('LUMEN',100,60);x.globalAlpha=1;}
 // Scene 3: outro 11-15
 if(t>11){const lt=t-11,o=1-eo((t-14.5)/.5);x.globalAlpha=o;
  const sh=eo((lt-.4)/1);mark(640-200*sh,360,170-50*sh,cl(lt/1),t*.3);x.globalAlpha=o;
  word(560,360,96,(lt-.9)/1.2,'l');
  x.font='400 24px Helvetica,Arial';x.fillStyle=`rgba(200,210,255,${eo((lt-1.8)/.6)*o})`;x.fillText('Start shining today',565,430);
  const w=600*eo((lt-1.6)/.8);x.fillStyle=grad(340,0,940,0);x.fillRect(640-w/2,560,w,3);x.globalAlpha=1;}
 requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script></body></html>
