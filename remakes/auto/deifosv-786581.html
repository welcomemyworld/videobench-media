<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ARCADIA — Launch</title>
<!--
=========================== SUNO SONG PROMPT ===========================
Style: high-energy electronic launch anthem, 128 BPM, future bass meets
electro-house, punchy four-on-the-floor kick, sidechained supersaws,
arcade chiptune lead, big riser into drop at 0:04, second drop at 0:19,
hype vocal chops, cinematic hit and clean ending at 0:30, instrumental.

Lyrics field (optional vocal chops):
[Intro] (riser) "Ready?"
[Drop] "Press start!" (chiptune lead)
[Build] "Desktop... mobile... everywhere"
[Drop] "Pick your style — play now!"
[Outro] (impact) "Game on."
=======================================================================
-->
<style>
html,body{margin:0;background:#000;height:100%;overflow:hidden}
#c{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<script>
window.DUR=30;
const cv=document.getElementById('c'),x=cv.getContext('2d');
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);cv.style.width=1280*s+'px';cv.style.height=720*s+'px'}
addEventListener('resize',fit);fit();
const off=parseFloat(new URLSearchParams(location.search).get('t'))||0;
const t0=performance.now();
const BPM=128;
const TH=[
{n:'NEON',bg:'#0a0420',fg:'#fff',a:'#ff2bd6',b:['#ff2bd6','#7a5cff','#00e5ff','#39ff88']},
{n:'RETRO',bg:'#1d1a12',fg:'#ffe9b0',a:'#ff9a2b',b:['#ff5a3c','#ff9a2b','#ffd23c','#9be15d']},
{n:'OCEAN',bg:'#04213a',fg:'#dff6ff',a:'#2be0ff',b:['#2be0ff','#1fa3ff','#5f7bff','#8affd8']},
{n:'LIGHT',bg:'#f2f4f8',fg:'#111',a:'#3a6bff',b:['#3a6bff','#ff4d6d','#ffb703','#2ec4b6']},
{n:'MATRIX',bg:'#010d04',fg:'#b6ffb6',a:'#22ff55',b:['#22ff55','#15c23f','#0e8f2e','#7dff9b']}];
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const ease=v=>1-Math.pow(1-cl(v),3);
const hash=i=>{let s=Math.sin(i*127.1+11.3)*43758.5;return s-Math.floor(s)};
const tri=(v)=>{v=((v%2)+2)%2;return v<1?v:2-v};
function rr(X,Y,W,H,r){x.beginPath();x.roundRect(X,Y,W,H,r)}
function txt(s,X,Y,sz,col,al='center',w='900'){x.font=`${w} ${sz}px Arial,Helvetica,sans-serif`;x.textAlign=al;x.textBaseline='middle';x.fillStyle=col;x.fillText(s,X,Y)}
function game(X,Y,W,H,t,th,seed){
 x.save();rr(X,Y,W,H,6);x.clip();x.fillStyle=th.bg;x.fillRect(X,Y,W,H);
 const cols=8,rows=5,bw=W/cols,bh=H*0.05,lt=t%9;
 for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const i=r*cols+c+seed*40;if(hash(i)*9<lt)continue;
  x.fillStyle=th.b[r%4];rr(X+c*bw+2,Y+H*0.08+r*(bh+3),bw-4,bh,2);x.fill()}
 const bx=X+8+tri(t*0.9+seed)*(W-16),by=Y+H*0.35+tri(t*1.3+seed*.3)*(H*0.55);
 const px=cl(bx-W*0.12,X,X+W*0.76);
 x.fillStyle=th.a;x.shadowColor=th.a;x.shadowBlur=12;rr(px,Y+H*0.92,W*0.24,H*0.025,4);x.fill();
 x.fillStyle=th.fg;x.beginPath();x.arc(bx,by,Math.max(3,W*0.012),0,7);x.fill();x.shadowBlur=0;
 txt('SCORE '+String(Math.floor(lt*137+seed*50)).padStart(5,'0'),X+8,Y+H*0.035,Math.max(9,W*0.03),th.fg,'left','700');
 x.restore()}
function laptop(cx,cy,w,t,th,seed){const h=w*0.6;
 x.fillStyle='#222';rr(cx-w/2-12,cy-h/2-12,w+24,h+24,14);x.fill();
 game(cx-w/2,cy-h/2,w,h,t,th,seed);
 x.fillStyle='#3a3a44';rr(cx-w/2-60,cy+h/2+12,w+120,16,8);x.fill()}
function phone(cx,cy,h,t,th,seed){const w=h*0.48;
 x.fillStyle='#1a1a1f';rr(cx-w/2-9,cy-h/2-9,w+18,h+18,26);x.fill();
 game(cx-w/2,cy-h/2,w,h,t,th,seed);
 x.fillStyle='#1a1a1f';rr(cx-22,cy-h/2-2,44,10,5);x.fill()}
function bg(t,beat,hue){
 const g=x.createRadialGradient(640,360,50,640,360,800);
 g.addColorStop(0,`hsl(${hue},80%,${14+beat*8}%)`);g.addColorStop(1,'#020008');x.fillStyle=g;x.fillRect(0,0,1280,720);
 x.strokeStyle=`hsla(${hue+40},100%,60%,0.18)`;x.lineWidth=1;
 for(let i=0;i<20;i++){const yy=420+Math.pow(((i+t*2)%20)/20,2)*300;x.beginPath();x.moveTo(0,yy);x.lineTo(1280,yy);x.stroke()}
 for(let i=-12;i<=12;i++){x.beginPath();x.moveTo(640+i*20,420);x.lineTo(640+i*160,720);x.stroke()}
 for(let i=0;i<60;i++){const px=(hash(i)*1280+t*(40+hash(i+9)*200))%1280,py=hash(i+3)*720;
  x.fillStyle=`hsla(${hue+hash(i)*90},100%,70%,${0.3+beat*0.5})`;x.fillRect(px,py,3+hash(i)*20,2)}}
function frame(){
 const T=((performance.now()-t0)/1000+off)%DUR;
 const bt=T*BPM/60,beat=Math.pow(1-(bt%1),3);
 const sh=T>4?beat*3:0;x.save();x.translate((hash(Math.floor(bt*4))-.5)*sh,(hash(Math.floor(bt*4)+5)-.5)*sh);
 bg(T,beat,(T*12+260)%360);
 if(T<4){
  const p=ease(T/1.2);txt('GET READY',640,200,30,'rgba(255,255,255,'+cl(T)+')','center','700');
  const s=T<3?1+(1-p)*3:1+(T-3)*0.3;
  x.save();x.translate(640,360);x.scale(s,s);x.shadowColor='#ff2bd6';x.shadowBlur=40;
  txt('ARCADIA',0,0,150,'#fff');x.restore();
  txt('THE GAME HUB IS LIVE',640,480,34,'#00e5ff','center','800');
  if(T>3.6){x.fillStyle=`rgba(255,255,255,${(T-3.6)/0.4})`;x.fillRect(0,0,1280,720)}
 }else if(T<11){
  const s=T-4;txt('LIVE RIGHT NOW',640,90,48,'#fff');
  x.fillStyle='#ff2b4d';x.beginPath();x.arc(450,90,10+beat*4,0,7);x.fill();
  const st=[['PLAYERS ONLINE',48213+Math.floor(s*311+Math.sin(s*7)*40),'#ff2bd6'],['GAMES PLAYED',1284500+Math.floor(s*5230),'#00e5ff'],['COUNTRIES',Math.floor(cl(s/2)*142),'#39ff88'],['AVG RATING','4.9 ★','#ffd23c']];
  st.forEach((d,i)=>{const p=ease((s-i*0.25)/0.6),X=180+i*307,Y=260+(1-p)*200;x.globalAlpha=cl(p);
   x.fillStyle='rgba(255,255,255,0.06)';rr(X-140,Y-80,280,170,18);x.fill();x.strokeStyle=d[2];x.lineWidth=2+beat*2;x.stroke();
   const v=typeof d[1]=='number'?Math.floor(d[1]*cl(s/1.5)).toLocaleString('en-US'):d[1];
   txt(v,X,Y-10,46,d[2]);txt(d[0],X,Y+45,18,'#ccc','center','700');x.globalAlpha=1});
  x.strokeStyle='#00e5ff';x.lineWidth=4;x.shadowColor='#00e5ff';x.shadowBlur=15;x.beginPath();
  for(let i=0;i<=100;i++){const X=140+i*10,v=i/100;if(v>s/6)break;const Y=620-v*v*120-Math.sin(i*0.7+s*3)*12*hash(i);i?x.lineTo(X,Y):x.moveTo(X,Y)}
  x.stroke();x.shadowBlur=0;txt('SIGN-UPS / MINUTE ▲ +312%',1140,450,20,'#39ff88','right','800');
 }else if(T<19){
  const s=T-11,p=ease(s/0.8);
  txt('PLAY ANYWHERE',640,80,56,'#fff');
  laptop(470-(1-p)*700,370,560,T,TH[0],1);
  phone(1010+(1-p)*500,380,440,T,TH[0],2);
  txt('DESKTOP',470,640,30,'#ff2bd6');txt('MOBILE',1010,640,30,'#00e5ff');
  if(s>4){const q=ease((s-4)/0.5);x.globalAlpha=q;txt('⟳  PROGRESS SYNCS INSTANTLY',740,700,22,'#39ff88','center','800');x.globalAlpha=1}
 }else if(T<26){
  const s=T-19,idx=Math.floor(bt/2)%TH.length,th=TH[idx];
  txt('PICK YOUR VIBE',640,70,56,'#fff');
  TH.forEach((h,i)=>{const X=180+i*230,on=i==idx;x.fillStyle=h.bg;rr(X-95,130,190,56,28);x.fill();
   x.strokeStyle=on?h.a:'#555';x.lineWidth=on?4+beat*3:2;x.stroke();txt(h.n,X,158,22,h.a)});
  const p=ease((bt%2)/0.4);x.save();x.translate(640,445);x.scale(0.9+p*0.1,0.9+p*0.1);
  x.shadowColor=th.a;x.shadowBlur=40;laptop(-120,0,500,T,th,3);x.shadowBlur=0;phone(310,10,380,T,th,4);x.restore();
  txt(th.n+' THEME',640,690,26,th.a);
 }else{
  const s=T-26,p=ease(s/0.6);
  if(s<0.25){x.fillStyle=`rgba(255,255,255,${1-s/0.25})`;x.fillRect(0,0,1280,720)}
  x.save();x.translate(640,280);x.scale(0.6+p*0.4+beat*0.04,0.6+p*0.4+beat*0.04);x.shadowColor='#00e5ff';x.shadowBlur=40;
  txt('ARCADIA',0,0,140,'#fff');x.restore();
  txt('DESKTOP • MOBILE • 5 THEMES • FREE',640,400,30,'#ff2bd6','center','800');
  x.globalAlpha=cl((s-0.6)/0.4);x.fillStyle='#00e5ff';rr(440,470,400,84,42);x.fill();
  txt('PLAY NOW',640,512,40,'#020010');txt('arcadia.gg',640,600,28,'#fff','center','700');x.globalAlpha=1;
  if(s>3.5){x.fillStyle=`rgba(0,0,0,${(s-3.5)/0.5})`;x.fillRect(0,0,1280,720)}
 }
 x.restore();
 x.fillStyle='rgba(255,255,255,0.12)';x.fillRect(0,716,1280*T/DUR,4);
 requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script>
</body>
</html>
