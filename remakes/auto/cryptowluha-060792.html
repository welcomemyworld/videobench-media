<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Sketch to Home</title>
<!-- No external resources are allowed here, so the Three.js/TSL pipeline is reproduced as a self-contained 3D renderer in Canvas 2D: perspective camera, lambert "node" shading, and painter's sort. -->
<style>html,body{margin:0;background:#000;height:100%;overflow:hidden}
canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100vw,177.78vh);height:min(56.25vw,100vh)}</style>
</head><body><canvas id="c" width="1280" height="720"></canvas><script>
window.DUR=24;
const c=document.getElementById('c'),g=c.getContext('2d');
const T0=performance.now()-(parseFloat(new URLSearchParams(location.search).get('t'))||0)*1000;
const cl=v=>Math.max(0,Math.min(1,v)),mix=(a,b,k)=>a+(b-a)*k,ease=k=>k*k*(3-2*k);
const faces=[];// {p:[pts],col:[r,g,b],det:bool,kind}
function F(p,col,det,kind){faces.push({p,col,det,kind})}
function box(x0,y0,z0,x1,y1,z1,col,det){
 const v=(x,y,z)=>[x,y,z];
 F([v(x0,y0,z1),v(x1,y0,z1),v(x1,y1,z1),v(x0,y1,z1)],col,det);
 F([v(x1,y0,z0),v(x0,y0,z0),v(x0,y1,z0),v(x1,y1,z0)],col,det);
 F([v(x0,y0,z0),v(x0,y0,z1),v(x0,y1,z1),v(x0,y1,z0)],col,det);
 F([v(x1,y0,z1),v(x1,y0,z0),v(x1,y1,z0),v(x1,y1,z1)],col,det);
 F([v(x0,y1,z1),v(x1,y1,z1),v(x1,y1,z0),v(x0,y1,z0)],col,det);
}
const WALL=[236,222,196],ROOF=[150,62,48],GAR=[214,200,176],GLASS=[120,170,210],DOOR=[110,70,40],TRIM=[250,250,245];
box(0,0,0,4,3,3,WALL,false);
// gable roof
F([[-.2,2.9,3.3],[4.2,2.9,3.3],[4.2,4.6,1.5],[-.2,4.6,1.5]],ROOF,false,'roof');
F([[4.2,2.9,-.3],[-.2,2.9,-.3],[-.2,4.6,1.5],[4.2,4.6,1.5]],ROOF,false,'roof');
F([[0,3,3],[0,3,0],[0,4.5,1.5]],WALL,false);F([[4,3,0],[4,3,3],[4,4.5,1.5]],WALL,false);
box(4,0,.4,6.6,2.2,3,GAR,false);
F([[3.9,2.2,3.15],[6.75,2.2,3.15],[6.75,2.4,3.15],[3.9,2.4,3.15]],TRIM,true);
box(2.8,3.6,.6,3.4,5.2,1.2,[160,90,70],true);
// details on front (z=3)
const z=3.02;
function win(x,y,w,h){F([[x,y,z],[x+w,y,z],[x+w,y+h,z],[x,y+h,z]],GLASS,true,'win')}
win(.4,1.6,.9,.9);win(2.7,1.6,.9,.9);win(.4,.3,.9,.9);
F([[1.6,0,z],[2.4,0,z],[2.4,1.7,z],[1.6,1.7,z]],DOOR,true);
F([[4.4,0,z],[6.2,0,z],[6.2,1.7,z],[4.4,1.7,z]],[200,200,195],true,'gar');
F([[1.75,3.4,2.62],[2.25,3.4,2.62],[2.25,3.85,2.17],[1.75,3.85,2.17]],GLASS,true);
F([[1.4,0,3.02],[2.6,0,3.02],[2.6,0,3.6],[1.4,0,3.6]],[170,165,160],true);
// side windows (x=0 face)
F([[-.02,1.6,.6],[-.02,1.6,1.3],[-.02,2.4,1.3],[-.02,2.4,.6]].map(p=>p.slice().reverse().reverse()),GLASS,true,'win');
faces.forEach((f,i)=>{const[a,b,c3]=f.p;const u=b.map((v,j)=>v-a[j]),w=c3.map((v,j)=>v-a[j]);
 let n=[u[1]*w[2]-u[2]*w[1],u[2]*w[0]-u[0]*w[2],u[0]*w[1]-u[1]*w[0]];const l=Math.hypot(...n)||1;f.n=n.map(v=>v/l);f.i=i});
const edges=[];faces.forEach(f=>f.p.forEach((p,i)=>edges.push({a:p,b:f.p[(i+1)%f.p.length],det:f.det})));
const base=edges.filter(e=>!e.det),det=edges.filter(e=>e.det);
const L=[.5,.8,.35];{const l=Math.hypot(...L);L.forEach((v,i)=>L[i]=v/l)}
let cam;
function P(p){const x=p[0]-3.2,y=p[1]-2,zz=p[2]-1.5;
 const ca=Math.cos(cam.a),sa=Math.sin(cam.a),ce=Math.cos(cam.e),se=Math.sin(cam.e);
 let X=x*ca-zz*sa,Z=x*sa+zz*ca;let Y=y*ce-Z*se;Z=y*se+Z*ce;Z=cam.d-Z;
 const f=820/Z;return[640+X*f,390-Y*f,Z]}
function rnd(s){s=Math.sin(s*127.1)*43758.5;return s-Math.floor(s)}
function pline(a,b,k,seed,alpha){if(k<=0)return;const A=P(a),B=P(b);
 const ex=mix(A[0],B[0],k),ey=mix(A[1],B[1],k);
 for(let r=0;r<2;r++){g.globalAlpha=alpha*(r?.45:.85);g.beginPath();
  const j=(q)=>(rnd(seed+q+r*7)-.5)*2.2;
  const dx=ex-A[0],dy=ey-A[1];g.moveTo(A[0]-dx*.03+j(1),A[1]-dy*.03+j(2));
  g.quadraticCurveTo((A[0]+ex)/2+j(3),(A[1]+ey)/2+j(4),ex+dx*.03*k+j(5),ey+dy*.03*k+j(6));g.stroke()}
 g.globalAlpha=1;return[ex,ey]}
const names=['1 · First Lines','2 · Massing','3 · Detail','4 · Finished Home'];
function frame(){
 const t=((performance.now()-T0)/1000)%DUR;
 cam={a:-.55+.35*Math.sin(t*.13),e:.32+.05*Math.sin(t*.21),d:15-1.2*ease(cl(t/24))};
 const s1=cl(t/5.5),s2=ease(cl((t-6)/3)),s3=cl((t-12)/5),s4=ease(cl((t-18)/2.5));
 // background: paper -> sky
 const bg=g.createLinearGradient(0,0,0,720);
 bg.addColorStop(0,`rgb(${mix(244,120,s4)|0},${mix(240,175,s4)|0},${mix(228,230,s4)|0})`);
 bg.addColorStop(1,`rgb(${mix(236,250,s4)|0},${mix(230,225,s4)|0},${mix(214,200,s4)|0})`);
 g.fillStyle=bg;g.fillRect(0,0,1280,720);
 // paper grain
 g.globalAlpha=.05*(1-s4);g.fillStyle='#000';for(let i=0;i<300;i++)g.fillRect(rnd(i)*1280,rnd(i+.5)*720,1,1);g.globalAlpha=1;
 // ground
 g.strokeStyle='#555';g.lineWidth=1;
 if(s4>0){g.globalAlpha=s4;g.fillStyle='#6a9a4a';g.beginPath();
  for(let i=0;i<=48;i++){const an=i/48*Math.PI*2,p=P([3.2+Math.cos(an)*8,0,1.5+Math.sin(an)*6]);i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])}g.fill();g.globalAlpha=1}
 g.globalAlpha=.25*(1-s4)*cl(t*2);
 for(let i=-4;i<=10;i++){const a=P([i,0,-3]),b=P([i,0,6]);g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke()}
 for(let i=-3;i<=6;i++){const a=P([-4,0,i]),b=P([10,0,i]);g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke()}
 g.globalAlpha=1;
 // faces
 const fs=faces.map(f=>{const pp=f.p.map(P);return{f,pp,d:pp.reduce((s,q)=>s+q[2],0)/pp.length+(f.det?-.05:0)}}).sort((a,b)=>b.d-a.d);
 for(const o of fs){const f=o.f;const vis=f.det?cl((s3-.6)*2.5+s4):s2;if(vis<=0)continue;
  const lam=.45+.55*Math.max(0,f.n[0]*L[0]+f.n[1]*L[1]+f.n[2]*L[2]);
  const gry=mix(170,245,lam);const col=f.col.map(v=>mix(gry,v*(.55+.5*lam),s4)|0);
  g.globalAlpha=vis*mix(.75,1,s4);g.fillStyle=`rgb(${col})`;g.beginPath();o.pp.forEach((q,i)=>i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]));g.closePath();g.fill();
  if(f.kind==='win'&&s4>0){g.globalAlpha=s4*.5;g.fillStyle='#fff';const q=o.pp;g.beginPath();g.moveTo(q[0][0],q[0][1]);g.lineTo((q[1][0]+q[0][0])/2,(q[1][1]+q[0][1])/2);g.lineTo(q[3][0],q[3][1]);g.fill()}
 }
 g.globalAlpha=1;
 // pencil lines
 const la=mix(1,.35,s4);g.lineCap='round';
 g.strokeStyle='#2b2b30';g.lineWidth=1.4;let tip=null;
 base.forEach((e,i)=>{const k=cl(s1*base.length-i);const r=pline(e.a,e.b,k,i,la);if(k>0&&k<1)tip=r});
 g.lineWidth=1.1;
 det.forEach((e,i)=>{const k=cl(s3*det.length*1.15-i);const r=pline(e.a,e.b,k,i+500,la);if(k>0&&k<1)tip=r});
 // roof tiles & siding hatching
 const h=cl((s3-.3)/.7);g.lineWidth=.8;
 for(let i=1;i<9;i++){const u=i/9,k=cl(h*9-i+1);
  pline([-.2,mix(2.9,4.6,u),mix(3.3,1.5,u)],[4.2,mix(2.9,4.6,u),mix(3.3,1.5,u)],k,900+i,la*.7);
  pline([4.2,mix(2.9,4.6,u),mix(-.3,1.5,u)],[-.2,mix(2.9,4.6,u),mix(-.3,1.5,u)],k,950+i,la*.7)}
 // pencil
 if(tip&&s4<1){g.save();g.translate(tip[0],tip[1]);g.rotate(-.7);g.fillStyle='#e8b04a';g.fillRect(6,-5,90,10);
  g.fillStyle='#f0d2a0';g.beginPath();g.moveTo(0,0);g.lineTo(8,-5);g.lineTo(8,5);g.fill();g.fillStyle='#222';g.beginPath();g.moveTo(0,0);g.lineTo(3,-2);g.lineTo(3,2);g.fill();
  g.fillStyle='#c66';g.fillRect(96,-5,12,10);g.restore()}
 // sun
 if(s4>0){g.globalAlpha=s4*.8;const sg=g.createRadialGradient(1100,120,10,1100,120,120);sg.addColorStop(0,'#fff8d0');sg.addColorStop(1,'rgba(255,240,200,0)');g.fillStyle=sg;g.fillRect(960,0,320,260);g.globalAlpha=1}
 // labels
 const st=Math.min(3,Math.floor(t/6)),lt=t-st*6,a=cl(lt*2)*cl((6-lt)*2+(st==3?9:0));
 g.globalAlpha=a;g.fillStyle=s4>.5?'#fff':'#2b2b30';g.font='600 34px Georgia,serif';g.fillText(names[st],60,80);
 g.font='italic 18px Georgia,serif';g.fillText(['Sketching the outline, stroke by stroke','Giving the form volume and weight','Windows, door, tiles and trim','Materials, light and life'][st],62,110);
 g.globalAlpha=1;
 for(let i=0;i<4;i++){g.fillStyle=i<=st?(s4>.5?'#fff':'#2b2b30'):'rgba(120,120,120,.4)';g.fillRect(60+i*70,660,60,4)}
 requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script></body></html>
