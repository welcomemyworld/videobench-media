<html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#000;height:100%;overflow:hidden}
canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#000}
</style></head><body><canvas id="c" width="1280" height="720"></canvas><script>
window.DUR=40;
const c=document.getElementById('c'),x=c.getContext('2d');
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);c.style.width=1280*s+'px';c.style.height=720*s+'px';}
fit();addEventListener('resize',fit);
const q=new URLSearchParams(location.search);const off=parseFloat(q.get('t')||0)||0;
const t0=performance.now()-off*1000;
const BPM=124,BEAT=60/BPM;
const lines=[
[0,4,"A sung explainer gave us an idea"],
[4,8,"AI agents explaining themselves over a house groove"],
[8,12,"Ten Treblo tracks. One human choice."],
[12,16,"One brief: turn the song into a film, not a slideshow"],
[16,20,"It built the motion. Synced the words."],
[20,24,"Rendered. Checked. Fixed its own work."],
[24,28,"No editing timeline dragged by hand"],
[28,32,"Follow the copper thread…"],
[32,36,"Taste set the direction"],
[36,40,"Agentic Music. This is Crazy."]];
const ease=v=>v<0?0:v>1?1:v*v*(3-2*v);
function thread(t,i){ // copper thread path point
 const u=i/200;const ph=t*0.6;
 let px=u*1400-60, py=360+Math.sin(u*9+ph)*80*Math.sin(t*0.3+1)+Math.sin(u*23-ph*2)*20;
 return [px,py];
}
function frame(){
 let T=((performance.now()-t0)/1000)%DUR;if(T<0)T+=DUR;
 const beat=(T/BEAT)%1,kick=Math.exp(-beat*6);
 x.fillStyle='#07060a';x.fillRect(0,0,1280,720);
 const g=x.createRadialGradient(640,360,50,640,360,700);
 g.addColorStop(0,`rgba(90,45,20,${0.25+kick*0.2})`);g.addColorStop(1,'rgba(0,0,0,0)');
 x.fillStyle=g;x.fillRect(0,0,1280,720);
 // grid floor
 x.strokeStyle='rgba(184,115,51,0.12)';x.lineWidth=1;
 for(let i=0;i<20;i++){const z=((i+T*2)%20)/20;const y=420+z*z*300;x.beginPath();x.moveTo(0,y);x.lineTo(1280,y);x.stroke();}
 for(let i=-10;i<=10;i++){x.beginPath();x.moveTo(640+i*20,420);x.lineTo(640+i*200,720);x.stroke();}
 // phase: 0-28 thread, 28-36 transforms into waveform ring, 36+ logo
 const m=ease((T-28)/5);
 const pts=[];
 for(let i=0;i<=200;i++){
  let [a,b]=thread(T,i);
  const ang=i/200*Math.PI*2-Math.PI/2;
  const r=170+Math.sin(i*0.6+T*8)*18*kick+Math.sin(i*0.25-T*3)*10;
  const cx=640+Math.cos(ang)*r,cy=330+Math.sin(ang)*r;
  pts.push([a+(cx-a)*m,b+(cy-b)*m]);
 }
 // the ten tracks as nodes (8-12)
 if(T>6&&T<14){const k=ease((T-6)/1.5)*(1-ease((T-12.5)/1.5));
  for(let i=0;i<10;i++){const p=pts[10+i*18];const ch=i==6;
   x.beginPath();x.arc(p[0],p[1],(ch?14+kick*8:7)*k,0,7);
   x.fillStyle=ch?'#ffb070':'rgba(200,140,90,0.5)';x.fill();}}
 x.shadowColor='#e0884a';x.shadowBlur=20+kick*25;
 for(let L=0;L<3;L++){x.beginPath();
  pts.forEach((p,i)=>{const o=L*4*Math.sin(i*0.1+T);i?x.lineTo(p[0],p[1]+o):x.moveTo(p[0],p[1]+o);});
  x.strokeStyle=L?`rgba(184,115,51,${0.4/L})`:'#d98a4e';x.lineWidth=L?1:3+kick*2;x.stroke();}
 x.shadowBlur=0;
 // traveling spark
 const sp=pts[Math.floor((T*40)%201)];x.fillStyle='#fff3e0';x.beginPath();x.arc(sp[0],sp[1],4+kick*3,0,7);x.fill();
 // frame boxes for "film not slideshow" (12-24)
 if(T>12&&T<24){const k=ease((T-12)/1)*(1-ease((T-23)/1));
  for(let i=0;i<6;i++){const fx=((i*230-T*120)%1500+1500)%1500-150;
   x.strokeStyle=`rgba(255,180,120,${0.25*k})`;x.strokeRect(fx,150,180,100);
   x.fillStyle=`rgba(255,180,120,${0.15*k})`;for(let h=0;h<8;h++)x.fillRect(fx+h*22+6,140,10,5);}
  if(T>20){x.fillStyle=`rgba(120,255,160,${k})`;x.font='600 22px sans-serif';x.textAlign='center';
   x.fillText(T<22?'render ✓':'check ✓  fix ✓',640,130);}}
 // logo end
 if(T>34){const k=ease((T-34)/1.5);x.globalAlpha=k;x.textAlign='center';
  x.fillStyle='#ffd2a8';x.font='800 46px sans-serif';x.fillText('AGENTIC MUSIC',640,342);
  x.font='400 18px sans-serif';x.fillStyle='#c98a5a';x.fillText('@agenticrealism  ·  Treblo  ·  Opus 5.5',640,372);x.globalAlpha=1;}
 // lyrics
 for(const [a,b,s] of lines){if(T>=a&&T<b){
  const l=T-a,al=ease(l/0.4)*(1-ease((l-3.5)/0.5));
  x.globalAlpha=al;x.textAlign='center';x.font='700 36px sans-serif';
  const words=s.split(' '),n=words.length;let tot=x.measureText(s).width,cx=640-tot/2;x.textAlign='left';
  words.forEach((w,i)=>{const lit=l>i*(3/n);x.fillStyle=lit?'#ffd2a8':'rgba(255,210,168,0.3)';
   x.fillText(w,cx,620-(lit?kick*3:0));cx+=x.measureText(w+' ').width;});
  x.globalAlpha=1;}}
 // progress
 x.fillStyle='rgba(217,138,78,0.6)';x.fillRect(0,716,1280*T/DUR,4);
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
