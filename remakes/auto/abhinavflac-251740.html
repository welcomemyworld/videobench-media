<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Live Type</title>
<style>
html,body{margin:0;background:#000;overflow:hidden;height:100%}
#s{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:0 0}
canvas{display:block}
</style></head><body>
<div id="s"><canvas id="c" width="1280" height="720"></canvas></div>
<script>
window.DUR=40;
const cv=document.getElementById('c'),x=cv.getContext('2d'),st=document.getElementById('s');
function fit(){const k=Math.min(innerWidth/1280,innerHeight/720);st.style.transform=`scale(${k}) translate(-50%,-50%)`;st.style.transformOrigin='0 0';st.style.left='50%';st.style.top='50%';st.style.transform=`translate(-50%,-50%) scale(${k})`;st.style.transformOrigin='center';}
addEventListener('resize',fit);fit();
const q=new URLSearchParams(location.search),T0=parseFloat(q.get('t')||0)||0,start=performance.now();
const pal=[["#0b0b14","#ff2d6f","#ffe14d","#f4f4f4"],["#f2ecdf","#111","#e63b2e","#111"],["#03141f","#22e6c8","#ff8a00","#e8fbff"],["#1a0628","#b45cff","#4dffb0","#fff"]];
let tapStyle=0;cv.addEventListener('click',()=>tapStyle++);
const lines=[
[0,"EVERY FRAME","IS PURE JAVASCRIPT"],
[8,"TAP THE FILM","RESTYLE LIVE"],
[16,"TRACE MANGA","INTO VECTORS"],
[24,"PRINT AS SVG","<path d=…/>"],
[32,"EVERY WORD","IS LIVE TYPE"]];
const beat=t=>Math.pow(1-((t*2)%1),3);
function hash(n){return (Math.sin(n*127.1)*43758.5453)%1}
function face(t,cx,cy,s,ink,prog){
 // manga face drawn as paths, revealed progressively
 const P=[];
 const add=(pts)=>P.push(pts);
 const arc=(ox,oy,r1,r2,a0,a1,n=40)=>{const a=[];for(let i=0;i<=n;i++){const u=a0+(a1-a0)*i/n;a.push([ox+Math.cos(u)*r1,oy+Math.sin(u)*r2])}return a};
 add(arc(0,10,120,150,0.1,Math.PI-0.1));          // jaw
 for(let i=0;i<9;i++){const b=-170+i*40;add([[b,-40],[b+20+hash(i)*30,-170-hash(i+3)*40],[b+45,-60]])} // hair spikes
 add(arc(0,-60,130,90,Math.PI,2*Math.PI));
 for(const sx of[-1,1]){add(arc(sx*50,0,32,24,Math.PI,2*Math.PI));add(arc(sx*50,6,14,18,0,Math.PI*2,24));add([[sx*25,-45],[sx*80,-52]])}
 add([[0,30],[-6,60],[4,62]]);
 add(arc(0,95,28,8,0.2,Math.PI-0.2));
 x.save();x.translate(cx,cy);x.scale(s,s);x.strokeStyle=ink;x.lineWidth=4/s*1.5;x.lineCap='round';x.lineJoin='round';
 const tot=P.length;
 P.forEach((p,i)=>{const lp=Math.max(0,Math.min(1,prog*tot-i));if(!lp)return;const n=Math.floor(p.length*lp);
  x.beginPath();for(let j=0;j<Math.max(2,n);j++){const q=p[Math.min(j,p.length-1)];j?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1])}x.stroke();
  if(prog<1.2)for(let j=0;j<n;j+=6){x.fillStyle=ink;x.fillRect(p[j][0]-3,p[j][1]-3,6,6)}});
 x.restore();
}
function frame(){
 const t=((performance.now()-start)/1000+T0)%DUR;
 const sec=Math.floor(t/8),lt=t-sec*8;
 const si=(sec+tapStyle+(t>=8&&t<16?Math.floor(lt*2):0))%pal.length;
 const [bg,a,b,fg]=pal[si];const bt=beat(t);
 x.fillStyle=bg;x.fillRect(0,0,1280,720);
 // halftone background
 x.fillStyle=a;x.globalAlpha=.25;
 for(let gy=0;gy<720;gy+=24)for(let gx=0;gx<1280;gx+=24){const d=Math.hypot(gx-640,gy-360);const r=6*(.5+.5*Math.sin(d*.02-t*4))*(.6+bt*.6);x.beginPath();x.arc(gx,gy,Math.max(0,r),0,7);x.fill()}
 x.globalAlpha=1;
 // speed lines
 x.strokeStyle=fg;x.globalAlpha=.15+bt*.2;x.lineWidth=2;
 for(let i=0;i<60;i++){const ang=i/60*Math.PI*2+t*.1;const r0=260+hash(i+Math.floor(t*4))*80;x.beginPath();x.moveTo(640+Math.cos(ang)*r0,360+Math.sin(ang)*r0);x.lineTo(640+Math.cos(ang)*900,360+Math.sin(ang)*900);x.stroke()}
 x.globalAlpha=1;
 // manga face, traced in section 2-3
 const prog=sec<2?0.15+ .1*Math.sin(t):sec==2?lt/6:1.3;
 face(t,sec==3?400:640,360+Math.sin(t*2)*6,1.1+bt*.04,sec==3?b:fg,prog);
 if(sec==3){ // SVG source print
  x.font='16px monospace';x.fillStyle=fg;x.textAlign='left';
  const src=['<svg viewBox="0 0 1280 720">','<path d="M120 10 A120 150..."/>','<path d="M-170 -40 L-140 -190"/>','<circle r="14"/>','</svg>'];
  const shown=Math.floor(lt*22);let c=0;
  src.forEach((s,i)=>{const k=Math.max(0,Math.min(s.length,shown-c));c+=s.length;x.fillText(s.slice(0,k),720,250+i*30)});
 }
 // live type
 const L=lines[sec];const ent=Math.min(1,lt/.6),ex=Math.max(0,(lt-7.4)/.6);
 x.textAlign='center';x.textBaseline='middle';
 [[L[1],90,a,110],[L[2],56,b,630]].forEach(([s,sz,col,y],k)=>{
  x.font=`900 ${sz*(1+bt*.06)}px Impact,Arial Black,sans-serif`;
  let w=x.measureText(s).width,px=640-w/2;
  for(let i=0;i<s.length;i++){const ch=s[i],cw=x.measureText(ch).width;
   const d=Math.max(0,Math.min(1,ent*1.6-i/s.length*.6))*(1-ex);
   const jy=(1-d)*80*(k?1:-1)+Math.sin(t*6+i)*4*bt;
   x.globalAlpha=d;x.fillStyle=bg;x.fillText(ch,px+cw/2+5,y+jy+5);x.fillStyle=col;x.fillText(ch,px+cw/2,y+jy);px+=cw}
  x.globalAlpha=1});
 x.font='14px monospace';x.fillStyle=fg;x.globalAlpha=.6;x.textAlign='left';
 x.fillText(`t=${t.toFixed(2)}s  style#${si}  ${sec==1?'[TAP]':''}`,20,700);x.globalAlpha=1;
 // flash on section change
 if(lt<.15){x.fillStyle=fg;x.globalAlpha=1-lt/.15;x.fillRect(0,0,1280,720);x.globalAlpha=1}
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
