<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#000;height:100%;overflow:hidden}
canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#000}
</style></head><body><canvas id="c" width="1280" height="720"></canvas><script>
window.DUR=30;
const c=document.getElementById('c'),x=c.getContext('2d');
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);c.style.width=1280*s+'px';c.style.height=720*s+'px'}
fit();addEventListener('resize',fit);
const off=parseFloat(new URLSearchParams(location.search).get('t')||0)||0;
const t0=performance.now()-off*1000;
// Phase 1 RAW (0-8), Phase 2 timeline cutting (8-13), Phase 3 edit (13-30)
const raw=[[0,"so um... okay so basically"],[2.2,"uh, I made coffee today and"],[4.5,"...wait is this recording?"],[6.3,"yeah okay. anyway."]];
const edit=[[13,15.5,"I MADE COFFEE.","☕",'#ffcc33',1.0],[15.5,18,"BEST. COFFEE. EVER.","🔥",'#ff5a5a',1.25],[18,20.5,"3 SPOONS of sugar","🥄",'#5ad1ff',1.1],[20.5,23,"(don't judge me)","😅",'#b88cff',1.0],[23,26,"10/10 would sip again","⭐",'#7dff8a',1.15],[26,30,"LIKE & SUBSCRIBE","👍",'#ff5a5a',1.0]];
const ease=t=>1-Math.pow(1-Math.min(1,Math.max(0,t)),3);
function face(cx,cy,s,talk,blink,mood,hue){
 x.save();x.translate(cx,cy);x.scale(s,s);
 // body
 x.fillStyle=`hsl(${hue},45%,40%)`;x.beginPath();x.ellipse(0,300,230,170,0,Math.PI,0);x.fill();
 x.fillStyle='#e9b48f';x.fillRect(-35,90,70,70);
 x.beginPath();x.ellipse(0,0,120,145,0,0,7);x.fill();
 x.fillStyle='#3a2416';x.beginPath();x.ellipse(0,-70,128,85,0,Math.PI,0);x.fill();
 x.beginPath();x.ellipse(-60,-95,70,40,-.4,0,7);x.fill();
 // eyes
 x.fillStyle='#fff';const eh=blink?2:16+mood*4;
 [-45,45].forEach(e=>{x.beginPath();x.ellipse(e,-10,20,eh,0,0,7);x.fill();x.fillStyle='#222';x.beginPath();x.arc(e,-8,blink?1:9,0,7);x.fill();x.fillStyle='#fff'});
 x.strokeStyle='#3a2416';x.lineWidth=7;
 [-45,45].forEach(e=>{x.beginPath();x.moveTo(e-22,-42-mood*8);x.lineTo(e+22,-42-mood*8+(e<0?-mood*4:mood*4)*0);x.stroke()});
 // mouth
 x.fillStyle='#7a2230';x.beginPath();x.ellipse(0,60,28+mood*12,4+talk*24,0,0,Math.PI*(mood>0.5?1:2));x.fill();
 x.restore();
}
function noteSound(t){} // visual-only music
function frame(){
 let T=((performance.now()-t0)/1000)%DUR;if(T<0)T+=DUR;
 const W=1280,H=720;
 if(T<8){ // RAW clip
  x.fillStyle='#4a4a44';x.fillRect(0,0,W,H);
  x.fillStyle='#55554e';x.fillRect(0,420,W,300);
  x.fillStyle='#3d3d38';x.fillRect(900,120,220,300);
  const sway=Math.sin(T*0.7)*6;
  const talk=(Math.sin(T*13)*.5+.5)*(T%2.2<1.7?1:.1);
  face(640+sway,330,1,talk*.6,(T%3.1)<.12,0,210);
  // grain
  for(let i=0;i<500;i++){x.fillStyle=`rgba(255,255,255,${Math.random()*.06})`;x.fillRect(Math.random()*W,Math.random()*H,2,2)}
  x.fillStyle='rgba(0,0,0,.35)';x.fillRect(0,0,W,H);
  x.fillStyle='#f33';if(T%1<.6){x.beginPath();x.arc(60,50,10,0,7);x.fill()}
  x.font='bold 24px monospace';x.fillStyle='#fff';x.fillText('REC  RAW_CLIP_001.mov  00:0'+Math.floor(T)+':'+String(Math.floor(T*30%30)).padStart(2,'0'),80,58);
  let s=raw.filter(r=>r[0]<=T).pop();
  x.font='26px monospace';x.textAlign='center';x.fillStyle='#ccc';x.fillText('"'+s[1]+'"',640,660);x.textAlign='left';
 } else if(T<13){ // editing timeline
  const p=T-8;
  x.fillStyle='#16161c';x.fillRect(0,0,W,H);
  x.fillStyle='#22222b';x.fillRect(40,40,760,428);
  x.save();x.beginPath();x.rect(40,40,760,428);x.clip();x.fillStyle='#4a4a44';x.fillRect(40,40,760,428);
  face(420,260,.55,Math.sin(p*12)*.3+.3,false,0,210);x.restore();
  x.fillStyle='#ddd';x.font='bold 22px sans-serif';x.fillText('EDITOR  —  Project: coffee_vlog',840,70);
  ['✂ Cut silences','🎵 Add music','💬 Auto subtitles','✨ Graphics','🔍 Punch-in zooms'].forEach((s,i)=>{
   const on=p>i*.8+.3;x.fillStyle=on?'#7dff8a':'#555';x.font='20px sans-serif';x.fillText((on?'✔ ':'○ ')+s,850,130+i*44)});
  // timeline
  x.fillStyle='#0d0d12';x.fillRect(0,500,W,220);
  const segs=[[0,.12,0],[.12,.3,1],[.3,.36,0],[.36,.55,1],[.55,.68,0],[.68,.9,1],[.9,1,0]];
  const k=ease((p-1)/2.5);
  let pos=60;
  segs.forEach(([a,b,keep])=>{let w=(b-a)*1160;if(!keep)w*=1-k;
   x.fillStyle=keep?'#4a8cff':`rgba(255,80,80,${1-k})`;if(w>1)x.fillRect(pos,540,w-3,50);pos+=w});
  x.fillStyle='#ff5aa8';for(let i=0;i<40;i++){const h=Math.abs(Math.sin(i*1.7+p*3))*25*Math.min(1,p);x.fillRect(60+i*29,640-h/2,20,h+2)}
  x.fillStyle='#aaa';x.font='16px sans-serif';x.fillText('V1',20,570);x.fillText('A1',20,645);
  const ph=60+((p*240)%1160);x.fillStyle='#ff0';x.fillRect(ph,520,3,170);
 } else { // FINAL EDIT
  const beat=(T-13)*2.2,bp=1-(beat%1);
  const seg=edit.find(e=>T>=e[0]&&T<e[1])||edit[5];
  const lt=T-seg[0],idx=edit.indexOf(seg);
  const col=seg[4];
  // bg
  const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,col);g.addColorStop(1,'#1a1030');x.fillStyle=g;x.fillRect(0,0,W,H);
  x.save();x.translate(640,360);x.rotate(T*.2);
  for(let i=0;i<16;i++){x.rotate(Math.PI/8);x.fillStyle=i%2?'rgba(255,255,255,.07)':'rgba(0,0,0,.06)';x.beginPath();x.moveTo(0,0);x.lineTo(900,-120);x.lineTo(900,120);x.fill()}
  x.restore();
  const zoom=seg[5]+(1-ease(lt*4))*0.15+bp*.02;
  const side=idx%2?-90:90;
  face(640+side*.3,400,zoom,Math.abs(Math.sin(T*14))*(lt<1.6?1:.2),(T%2.7)<.1,idx==2||idx==4?1:.4,(idx*60)%360);
  // flash cut
  if(lt<.08){x.fillStyle='rgba(255,255,255,.8)';x.fillRect(0,0,W,H)}
  // emoji stickers
  x.font='120px sans-serif';x.textAlign='center';
  const es=ease(lt*3);x.save();x.translate(idx%2?1050:230,200+Math.sin(T*4)*12);x.rotate(Math.sin(T*3)*.25);x.scale(es,es);x.fillText(seg[3],0,40);x.restore();
  // confetti on 5,6
  if(idx>=4)for(let i=0;i<60;i++){const fx=(i*97+T*60*(i%3+1))%W,fy=(i*53+T*200*(1+i%4)/2)%H;x.fillStyle=`hsl(${i*37},90%,60%)`;x.fillRect(fx,fy,10,16)}
  // subtitle words pop
  const words=seg[2].split(' ');x.font='900 64px sans-serif';
  let tw=0;const ws=words.map(w=>{const m=x.measureText(w+' ').width;tw+=m;return m});
  let px=640-tw/2;x.textAlign='left';
  words.forEach((w,i)=>{const a=ease((lt-i*.18)*5);if(a<=0){px+=ws[i];return}
   x.save();x.translate(px+ws[i]/2,620);x.scale(a*(1+bp*.04),a*(1+bp*.04));x.rotate((i%2?.03:-.03));
   x.lineWidth=12;x.strokeStyle='#000';x.lineJoin='round';x.textAlign='center';x.strokeText(w,-12,22);
   x.fillStyle=i==words.length-1?'#ffe14a':'#fff';x.fillText(w,-12,22);x.restore();px+=ws[i]});
  // lower third
  const lx=-420+ease((T-13.3)*2)*440;
  x.fillStyle='#000';x.fillRect(lx,40,400,64);x.fillStyle=col;x.fillRect(lx+400,40,14,64);
  x.fillStyle='#fff';x.font='bold 28px sans-serif';x.textAlign='left';x.fillText('ALEX ☕ COFFEE GUY',lx+24,82);
  // music eq + note
  x.fillStyle='rgba(0,0,0,.45)';x.fillRect(1080,40,170,60);
  for(let i=0;i<8;i++){const h=8+Math.abs(Math.sin(i*2.1+beat*3.14))*36*(0.4+bp*.6);x.fillStyle='#fff';x.fillRect(1095+i*19,92-h,12,h)}
  x.font='22px sans-serif';x.fillText('♪',1060,80);
  if(idx==5){x.fillStyle='#f22';const s=1+bp*.08;x.save();x.translate(640,170);x.scale(s,s);x.fillRect(-170,-40,340,80);x.fillStyle='#fff';x.font='900 40px sans-serif';x.textAlign='center';x.fillText('SUBSCRIBE',0,14);x.restore()}
  // progress
  x.fillStyle='rgba(255,255,255,.3)';x.fillRect(0,714,W,6);x.fillStyle='#ff3';x.fillRect(0,714,W*(T-13)/17,6);
  x.textAlign='left';
 }
 // phase labels
 x.font='bold 18px sans-serif';x.fillStyle='rgba(255,255,255,.8)';x.textAlign='right';
 x.fillText(T<8?'BEFORE: raw footage':T<13?'EDITING...':'AFTER: final edit',1260,T<8?60:T<13?700:140);x.textAlign='left';
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
