<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Badge Unlocked</title>
<style>html,body{margin:0;background:#000;height:100%;overflow:hidden}
canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}</style></head>
<body><canvas id="c" width="1280" height="720"></canvas>
<script>
window.DUR=16;
const c=document.getElementById('c'),x=c.getContext('2d');
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);c.style.width=1280*s+'px';c.style.height=720*s+'px';}
fit();addEventListener('resize',fit);
const off=parseFloat(new URLSearchParams(location.search).get('t'))||0;
const t0=performance.now()-off*1000;
const CX=640,CY=320,R=130;
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const eo=v=>1-Math.pow(1-cl(v),3);
let rx=0,ry=0,vx=0,vy=0,last=0,parts=[],burst=false,dust=[];
for(let i=0;i<70;i++)dust.push({x:Math.random()*1280,y:Math.random()*720,s:Math.random()*1.6+.3,p:Math.random()*6});
function reset(){rx=ry=vx=vy=0;parts=[];burst=false;}
function cursor(t){ // simulated user pointer
  if(t<5.5)return{x:1000,y:620,a:0};
  const k=t-5.5;
  return{x:CX+Math.sin(k*0.9)*300+Math.sin(k*2.1)*60,y:CY+Math.cos(k*0.7)*170,a:cl(k*2)*(t<DUR-1?1:cl(DUR-t))};
}
function star(r1,r2,n){x.beginPath();for(let i=0;i<n*2;i++){const r=i%2?r2:r1,a=-Math.PI/2+i*Math.PI/n;x.lineTo(Math.cos(a)*r,Math.sin(a)*r);}x.closePath();}
function spawn(){burst=true;for(let i=0;i<260;i++){const a=Math.random()*Math.PI*2,s=200+Math.random()*700;
parts.push({x:CX,y:CY,vx:Math.cos(a)*s,vy:Math.sin(a)*s-200,r:Math.random()*6,w:2+Math.random()*5,h:3+Math.random()*8,sp:(Math.random()-.5)*14,l:1.6+Math.random()*1.8,a:0,k:Math.random()<.4});}}
function badge(t,sc,al){
  const cx=Math.cos(ry),cy=Math.cos(rx),ex=Math.sin(ry),ey=Math.sin(rx);
  x.save();x.translate(CX,CY);x.globalAlpha=al;x.scale(sc,sc);
  // shadow
  x.save();x.translate(-ex*30,175);x.scale(1,.18);const sg=x.createRadialGradient(0,0,0,0,0,R);sg.addColorStop(0,'rgba(0,0,0,.6)');sg.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=sg;x.beginPath();x.arc(0,0,R*1.2,0,7);x.fill();x.restore();
  // thickness
  const T=18;
  for(let i=T;i>0;i--){x.save();x.translate(-ex*i,ey*i);x.scale(cx,cy);x.fillStyle=`rgb(${120+i*2},${82+i},${20})`;x.beginPath();x.arc(0,0,R,0,7);x.fill();x.restore();}
  x.save();x.scale(cx,cy);
  const lx=-ex*R*1.2-40,ly=ey*R*1.2-60;
  const g=x.createRadialGradient(lx,ly,10,0,0,R*1.3);
  g.addColorStop(0,'#fff6c8');g.addColorStop(.3,'#f5c84a');g.addColorStop(.7,'#c08a1c');g.addColorStop(1,'#6e4a0c');
  x.fillStyle=g;x.beginPath();x.arc(0,0,R,0,7);x.fill();
  x.lineWidth=6;x.strokeStyle='#ffe7a0';x.beginPath();x.arc(0,0,R-12,0,7);x.stroke();
  x.lineWidth=2;x.strokeStyle='rgba(90,60,10,.7)';x.beginPath();x.arc(0,0,R-22,0,7);x.stroke();
  for(let i=0;i<48;i++){const a=i/48*Math.PI*2;x.fillStyle='rgba(110,70,10,.55)';x.beginPath();x.arc(Math.cos(a)*(R-5),Math.sin(a)*(R-5),1.6,0,7);x.fill();}
  const g2=x.createLinearGradient(-60,-60,60,60);g2.addColorStop(0,'#fff3c0');g2.addColorStop(1,'#a36f12');
  x.save();x.translate(2,4);star(64,27,5);x.fillStyle='rgba(80,50,5,.5)';x.fill();x.restore();
  star(64,27,5);x.fillStyle=g2;x.fill();x.lineWidth=2;x.strokeStyle='#fff0b5';x.stroke();
  // sweep shine
  const sw=((t*0.35)%1.6-0.3)*R*3-R*1.5+ex*120;
  x.save();x.beginPath();x.arc(0,0,R,0,7);x.clip();x.globalCompositeOperation='lighter';
  const sh=x.createLinearGradient(sw-40,-R,sw+40,R);sh.addColorStop(0,'rgba(255,255,255,0)');sh.addColorStop(.5,'rgba(255,245,210,.45)');sh.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=sh;x.fillRect(-R,-R,R*2,R*2);x.restore();
  x.restore();x.restore();
}
function frame(now){
  let t=((now-t0)/1000)%DUR;if(t<0)t+=DUR;
  if(t<last)reset();const dt=Math.min(.05,Math.max(0,t-last));last=t;
  // background
  x.fillStyle='#07060a';x.fillRect(0,0,1280,720);
  const b=eo(t/1.5);
  let g=x.createRadialGradient(CX,CY,0,CX,CY,700);g.addColorStop(0,`rgba(70,48,14,${.9*b})`);g.addColorStop(.5,`rgba(25,16,8,${b})`);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,1280,720);
  // rays
  const ra=eo((t-1)/1.5);
  if(ra>0){x.save();x.translate(CX,CY);x.rotate(t*.08);x.globalCompositeOperation='lighter';
  for(let i=0;i<16;i++){x.rotate(Math.PI/8);const rg=x.createLinearGradient(0,0,600,0);rg.addColorStop(0,`rgba(255,200,90,${.12*ra})`);rg.addColorStop(1,'rgba(255,200,90,0)');x.fillStyle=rg;x.beginPath();x.moveTo(0,0);x.lineTo(650,-40);x.lineTo(650,40);x.fill();}
  x.restore();}
  // floor ring
  x.save();x.translate(CX,CY+178);x.scale(1,.16);x.strokeStyle=`rgba(255,200,100,${.35*ra})`;x.lineWidth=3;x.beginPath();x.arc(0,0,230*ra,0,7);x.stroke();x.restore();
  // dust
  for(const d of dust){const y=(d.y-t*12*d.s+720)%720;x.fillStyle=`rgba(255,215,140,${(.25+.25*Math.sin(t*2+d.p))*b})`;x.fillRect(d.x,y,d.s,d.s);}
  // physics tilt: critically damped spring toward cursor
  const cu=cursor(t);let tx=0,ty=0;
  if(t<3.2){ty=(1-eo((t-1.6)/1.6))*Math.PI*2*(t>1.6?1:1);}
  else if(cu.a>0){ty=cl((cu.x-CX)/500,-1,1)*.6*cu.a;tx=cl((cu.y-CY)/400,-1,1)*.5*cu.a;}
  const w=t<3.2?40:13;
  if(t<3.2){ry=ty;vy=0;}else{vy+=(w*w*(ty-ry)-2*w*vy)*dt;ry+=vy*dt;}
  vx+=(w*w*(tx-rx)-2*w*vx)*dt;rx+=vx*dt;
  // badge entrance
  const e=eo((t-1.6)/1.6);
  if(t>1.6){
    const glow=x.createRadialGradient(CX,CY,0,CX,CY,260);glow.addColorStop(0,`rgba(255,210,110,${.45*e})`);glow.addColorStop(1,'rgba(255,190,80,0)');
    x.globalCompositeOperation='lighter';x.fillStyle=glow;x.fillRect(0,0,1280,720);x.globalCompositeOperation='source-over';
    badge(t,.4+.6*e,e);
  }
  if(t>=3.2&&!burst)spawn();
  // flash
  if(t>3.2&&t<3.8){x.fillStyle=`rgba(255,240,200,${.5*(1-(t-3.2)/.6)})`;x.fillRect(0,0,1280,720);}
  // particles
  x.globalCompositeOperation='lighter';
  for(const p of parts){p.a+=dt;if(p.a>p.l)continue;p.vx*=Math.pow(.15,dt);p.vy=p.vy*Math.pow(.3,dt)+500*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.sp*dt;
    const al=1-p.a/p.l;x.save();x.translate(p.x,p.y);x.rotate(p.r);
    if(p.k){x.fillStyle=`rgba(255,230,150,${al})`;star(p.w+2,p.w/3,4);x.fill();}
    else{x.scale(1,Math.cos(p.r*2));x.fillStyle=`rgba(${230+p.w*4|0},${170+p.h*6|0},60,${al})`;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);}
    x.restore();}
  x.globalCompositeOperation='source-over';
  // text
  const ta=eo((t-3.6)/.8),ta2=eo((t-4.1)/.8);
  x.textAlign='center';
  x.fillStyle=`rgba(255,200,110,${ta})`;x.font='600 16px Helvetica,Arial,sans-serif';
  x.fillText('A C H I E V E M E N T   U N L O C K E D',CX,534+(1-ta)*12);
  const tg=x.createLinearGradient(0,550,0,600);tg.addColorStop(0,'#fff4cf');tg.addColorStop(1,'#e2a83a');
  x.globalAlpha=ta2;x.fillStyle=tg;x.font='700 46px Georgia,serif';x.fillText('Gold Explorer',CX,588+(1-ta2)*14);
  x.fillStyle='rgba(230,215,190,.7)';x.font='18px Helvetica,Arial,sans-serif';x.fillText('You completed 100 challenges. Keep shining.',CX,626+(1-ta2)*14);
  // button
  const ba=eo((t-4.6)/.8);x.globalAlpha=ba;
  x.fillStyle='rgba(255,200,100,.12)';x.strokeStyle='rgba(255,210,120,.7)';x.lineWidth=1.5;
  x.beginPath();x.roundRect(CX-90,650,180,44,22);x.fill();x.stroke();
  x.fillStyle='#ffe2a0';x.font='600 16px Helvetica,Arial,sans-serif';x.fillText('Collect Badge',CX,678);
  x.globalAlpha=1;
  // cursor
  if(cu.a>0){x.save();x.globalAlpha=cu.a*.9;x.translate(cu.x,cu.y);x.fillStyle='#fff';x.strokeStyle='#000';x.lineWidth=1.5;
  x.beginPath();x.moveTo(0,0);x.lineTo(0,20);x.lineTo(5,15);x.lineTo(9,23);x.lineTo(12,21);x.lineTo(8,14);x.lineTo(14,14);x.closePath();x.fill();x.stroke();x.restore();}
  // fade loop
  if(t>DUR-.6){x.fillStyle=`rgba(0,0,0,${(t-DUR+.6)/.6})`;x.fillRect(0,0,1280,720);}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
