<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>CLAUDE // KICKASS</title>
<style>
html,body{margin:0;background:#000;height:100%;overflow:hidden}
#c{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);image-rendering:pixelated}
</style></head><body><canvas id="c" width="1280" height="720"></canvas>
<script>
window.DUR=64;
const C=document.getElementById('c'),X=C.getContext('2d');
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);C.style.width=1280*s+'px';C.style.height=720*s+'px';}
addEventListener('resize',fit);fit();
const W=320,H=180,LB=document.createElement('canvas');LB.width=W;LB.height=H;
const LX=LB.getContext('2d'),IMG=LX.createImageData(W,H),PX=new Uint32Array(IMG.data.buffer);
const BPM=125,BEAT=60/BPM;
const q=new URLSearchParams(location.search),T0=parseFloat(q.get('t')||'0')||0,START=performance.now();
// tables
const TEX=new Uint8Array(65536);
for(let y=0;y<256;y++)for(let x=0;x<256;x++){TEX[y*256+x]=((x^y)&255)*0.6+(((x>>5)+(y>>5))&1)*100;}
const DIST=new Float32Array(W*H),ANG=new Float32Array(W*H);
for(let y=0;y<H;y++)for(let x=0;x<W;x++){const dx=x-W/2,dy=y-H/2;DIST[y*W+x]=4096/(Math.sqrt(dx*dx+dy*dy)+1);ANG[y*W+x]=Math.atan2(dy,dx)/Math.PI*128+128;}
const SIN=new Float32Array(1024);for(let i=0;i<1024;i++)SIN[i]=Math.sin(i/1024*Math.PI*2);
function rgb(r,g,b){return 0xff000000|(Math.max(0,Math.min(255,b))<<16)|(Math.max(0,Math.min(255,g))<<8)|Math.max(0,Math.min(255,r));}
function mkPal(f){const p=new Uint32Array(256);for(let i=0;i<256;i++)p[i]=f(i/255);return p;}
const PAL_PLASMA=mkPal(v=>rgb(128+127*Math.sin(v*6.28*2),128+127*Math.sin(v*6.28*2+2),128+127*Math.sin(v*6.28*2+4)));
const PAL_TUN=mkPal(v=>rgb(v*80,v*200,v*255));
const PAL_ROTO=mkPal(v=>rgb(255*v,90*v*v,200*Math.sqrt(v)));
const PAL_META=mkPal(v=>rgb(255*Math.min(1,v*2),255*Math.max(0,v*2-0.6),255*Math.max(0,v*3-2)));
const PAL_FIRE=mkPal(v=>rgb(v*3*255,(v*3-1)*255,(v*3-2)*255));
const FIRE=new Uint8Array(W*(H+2));
let seed=1;function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647;}
const STARS=[];for(let i=0;i<500;i++)STARS.push([rnd()*2-1,rnd()*2-1,rnd()]);
// scenes
const SC=[[0,8,'intro'],[8,16,'plasma'],[16,24,'tunnel'],[24,32,'roto'],[32,42,'glenz'],[42,50,'meta'],[50,60,'fire'],[60,64,'outro']];
function blit(){LX.putImageData(IMG,0,0);X.imageSmoothingEnabled=false;X.drawImage(LB,0,0,1280,720);}
function plasma(t,k){const a=t*60|0;let i=0;for(let y=0;y<H;y++)for(let x=0;x<W;x++){
 const v=SIN[(x*6+a)&1023]+SIN[(y*5-a*1.3)&1023]+SIN[((x+y)*3+a*2)&1023]+SIN[(Math.sqrt((x-160)*(x-160)+(y-90)*(y-90))*10-a*3|0)&1023];
 PX[i++]=PAL_PLASMA[((v+4)*32+t*40+k*30)&255];}
 blit();
 // copper bars
 for(let b=0;b<6;b++){const y=360+Math.sin(t*2+b*0.6)*250;const g=X.createLinearGradient(0,y-18,0,y+18);
  const h=(b*60+t*90)%360;g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.5,`hsla(${h},100%,70%,.85)`);g.addColorStop(1,'rgba(0,0,0,0)');
  X.fillStyle=g;X.fillRect(0,y-18,1280,36);}
}
function tunnel(t,k){const u=t*120|0,v=t*40|0,ox=Math.sin(t)*20|0,oy=Math.cos(t*.7)*12|0;let i=0;
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){const yy=Math.min(H-1,Math.max(0,y+oy)),xx=Math.min(W-1,Math.max(0,x+ox)),j=yy*W+xx;
  const d=DIST[j];const tx=(d+u)&255,ty=(ANG[j]+v)&255;let c=TEX[ty*256+tx]*Math.min(1,60/d*1.5);PX[i++]=PAL_TUN[Math.min(255,c+k*80)|0];}
 blit();}
function roto(t,k){const a=t*0.8,z=1.2+Math.sin(t*1.3)*0.9-k*.3,ca=Math.cos(a)*z,sa=Math.sin(a)*z,cx=t*50,cy=t*20;let i=0;
 for(let y=0;y<H;y++){let u=cx+(-W/2)*ca-(y-H/2)*sa,v=cy+(-W/2)*sa+(y-H/2)*ca;
  for(let x=0;x<W;x++){PX[i++]=PAL_ROTO[TEX[((v&255)<<8)|(u&255)]];u+=ca;v+=sa;}}
 blit();}
function meta(t,k){const B=[];for(let b=0;b<6;b++)B.push([160+Math.sin(t*(.7+b*.13)+b)*110,90+Math.cos(t*(.9+b*.11)+b*2)*65,500+k*300]);
 let i=0;for(let y=0;y<H;y++)for(let x=0;x<W;x++){let s=0;for(const b of B){const dx=x-b[0],dy=y-b[1];s+=b[2]/(dx*dx+dy*dy+1);}
  PX[i++]=PAL_META[Math.min(255,s*40)|0];}
 blit();}
function fire(t,k){for(let x=0;x<W;x++){FIRE[H*W+x]=FIRE[(H+1)*W+x]=rnd()<0.5+k*.4?255:40;}
 for(let y=0;y<H+1;y++)for(let x=0;x<W;x++){const s=FIRE[(y+1)*W+((x-1+W)%W)]+FIRE[(y+1)*W+x]+FIRE[(y+1)*W+(x+1)%W]+FIRE[Math.min(H+1,y+2)*W+x];
  FIRE[y*W+x]=Math.max(0,(s>>2)-(rnd()<.5?1:0));}
 for(let i=0;i<W*H;i++)PX[i]=PAL_FIRE[FIRE[i]];blit();}
function stars(t,sp,k){X.fillStyle='#000';X.fillRect(0,0,1280,720);
 for(const s of STARS){let z=(s[2]-t*sp)%1;if(z<0)z+=1;z=z*1+.02;const x=640+s[0]/z*400,y=360+s[1]/z*400;const sz=(1-z)*4+k*2;
  X.fillStyle=`rgba(${200+55*(1-z)|0},${220|0},255,${1-z})`;X.fillRect(x,y,sz,sz);}}
function proj(p,r){let[x,y,z]=p;let c=Math.cos(r[0]),s=Math.sin(r[0]);[y,z]=[y*c-z*s,y*s+z*c];
 c=Math.cos(r[1]);s=Math.sin(r[1]);[x,z]=[x*c+z*s,-x*s+z*c];c=Math.cos(r[2]);s=Math.sin(r[2]);[x,y]=[x*c-y*s,x*s+y*c];return[x,y,z];}
const CV=[];for(let i=0;i<8;i++)CV.push([(i&1)*2-1,(i>>1&1)*2-1,(i>>2&1)*2-1]);
const CF=[[0,1,3,2],[4,6,7,5],[0,4,5,1],[2,3,7,6],[0,2,6,4],[1,5,7,3]];
function glenz(t,k){X.fillStyle='rgba(0,0,20,1)';X.fillRect(0,0,1280,720);
 // torus dots background
 const r=[t*.5,t*.7,t*.3];
 for(let i=0;i<40;i++)for(let j=0;j<16;j++){const a=i/40*6.283,b=j/16*6.283+t;const p=proj([(3+Math.cos(b))*Math.cos(a),(3+Math.cos(b))*Math.sin(a),Math.sin(b)],[t*.3,t*.2,0]);
  const z=p[2]+8,sx=640+p[0]/z*700,sy=360+p[1]/z*700;X.fillStyle=`hsl(${(i*9+t*60)%360},90%,${30+40*(1-z/12)}%)`;X.fillRect(sx,sy,4,4);}
 const s=1.4+k*.4;const P=CV.map(v=>proj([v[0]*s,v[1]*s,v[2]*s],r)).map(p=>{const z=p[2]+5;return[640+p[0]/z*900,360+p[1]/z*900,p[2]];});
 const F=CF.map((f,i)=>({f,i,z:f.reduce((a,v)=>a+P[v][2],0)})).sort((a,b)=>b.z-a.z);
 X.globalCompositeOperation='lighter';
 for(const o of F){X.beginPath();o.f.forEach((v,j)=>j?X.lineTo(P[v][0],P[v][1]):X.moveTo(P[v][0],P[v][1]));X.closePath();
  X.fillStyle=o.i&1?'rgba(0,140,255,.35)':'rgba(255,40,160,.35)';X.fill();X.strokeStyle='rgba(255,255,255,.8)';X.lineWidth=2;X.stroke();}
 X.globalCompositeOperation='source-over';}
function txt(s,x,y,sz,col,al){X.save();X.globalAlpha=al;X.font=`900 ${sz}px Impact,Arial Black,sans-serif`;X.textAlign='center';X.textBaseline='middle';
 X.lineWidth=sz/10;X.strokeStyle='#000';X.strokeText(s,x,y);X.fillStyle=col;X.fillText(s,x,y);X.restore();}
function sineScroll(s,t,y,sz,sp){X.font=`900 ${sz}px Impact,Arial Black,sans-serif`;X.textBaseline='middle';const cw=sz*.62;
 let x0=1280-(t*sp)%(s.length*cw+1280);for(let i=0;i<s.length;i++){const x=x0+i*cw;if(x<-cw||x>1280)continue;
  const yy=y+Math.sin(x*.012+t*4)*40;X.fillStyle=`hsl(${(x*.4+t*200)%360},100%,65%)`;X.strokeStyle='#000';X.lineWidth=5;X.strokeText(s[i],x,yy);X.fillText(s[i],x,yy);}}
function logo(t,al,k){const g=X.createLinearGradient(0,250,0,410);g.addColorStop(0,'#fff');g.addColorStop(.5,'#f8a');g.addColorStop(.51,'#c0f');g.addColorStop(1,'#0ff');
 X.save();X.globalAlpha=al;X.font='900 170px Impact,Arial Black,sans-serif';X.textAlign='center';X.textBaseline='middle';
 const sc=1+k*.08;X.translate(640,330);X.scale(sc,sc);X.shadowColor='#f0f';X.shadowBlur=30+k*40;X.lineWidth=10;X.strokeStyle='#000';X.strokeText('CLAUDE',0,0);X.fillStyle=g;X.fillText('CLAUDE',0,0);X.restore();}
function frame(){const now=(performance.now()-START)/1000+T0;const t=now%DUR;
 const bt=t/BEAT,bp=bt%1,k=Math.exp(-bp*6),bar=Math.floor(bt/4);
 const sc=SC.find(s=>t>=s[0]&&t<s[1]),lt=t-sc[0];
 switch(sc[2]){
 case'intro':stars(t,.25,k);logo(t,Math.min(1,Math.max(0,(lt-2)/2)),lt>4?k:0);
  txt('a  t r a c k m o  i n  r e a l t i m e',640,470,30,'#9cf',Math.min(1,lt/2));
  if(lt>5)txt('presents',640,540,40,'#fff',Math.min(1,lt-5));break;
 case'plasma':plasma(t,k);txt('PLASMA OVERDRIVE',640,640,60,'#fff',Math.min(1,lt));break;
 case'tunnel':tunnel(t,k);txt('INTO THE VOID',640,80,56,'#cff',Math.min(1,lt)*(lt<6?1:Math.max(0,7-lt)));break;
 case'roto':roto(t,k);txt('ROTOZOOM  @  '+BPM+' BPM',640,650,50,'#fff',Math.min(1,lt));break;
 case'glenz':glenz(t,k);txt('GLENZ VECTORS',640,70,56,'#fff',Math.min(1,lt));break;
 case'meta':meta(t,k);txt('LIQUID METABALLS',640,650,54,'#ff8',Math.min(1,lt));break;
 case'fire':fire(t,k);logo(t,1,k);sineScroll('GREETINGS TO  FUTURE CREW * FARBRAUSCH * CONSPIRACY * ASD * SANITY * TBL * PURPLE MOTION * SKAVEN * AND ALL TRACKERS STILL BANGING OUT S3Ms AT 4AM ...   ',lt,560,64,320);break;
 case'outro':stars(t,.05,0);txt('CLAUDE  KICKS  ASS',640,330,90,'#fff',Math.min(1,lt));
  txt('code + gfx: claude   //   1990s forever',640,440,30,'#9cf',Math.min(1,lt));X.fillStyle=`rgba(0,0,0,${Math.max(0,lt-3)})`;X.fillRect(0,0,1280,720);break;}
 // beat flash, scene-change flash, scanlines
 if(sc[2]!=='intro'&&sc[2]!=='outro'&&bar%2==0&&bt%4<1){X.fillStyle=`rgba(255,255,255,${k*.25})`;X.fillRect(0,0,1280,720);}
 if(lt<.5&&sc[0]>0){X.fillStyle=`rgba(255,255,255,${1-lt*2})`;X.fillRect(0,0,1280,720);}
 X.fillStyle='rgba(0,0,0,.18)';for(let y=0;y<720;y+=4)X.fillRect(0,y,1280,2);
 requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script></body></html>
