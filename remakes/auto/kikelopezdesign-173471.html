<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Portfolio</title>
<style>html,body{margin:0;background:#000;height:100%;overflow:hidden}
canvas{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}</style></head>
<body><canvas id="c" width="1280" height="720"></canvas>
<script>
window.DUR=20;
const c=document.getElementById('c'),x=c.getContext('2d');
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);c.style.width=1280*s+'px';c.style.height=720*s+'px';}
addEventListener('resize',fit);fit();
const q=new URLSearchParams(location.search);const off=parseFloat(q.get('t')||0)||0;
const t0=performance.now()-off*1000;
const E=t=>t<0?0:t>1?1:1-Math.pow(1-t,3);
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const F='"Helvetica Neue",Helvetica,Arial,sans-serif';
// procedural "resources": a palette, a grid, a mark - everything made from the portfolio itself
const pal=['#ff5a36','#ffd23f','#3bceac','#5b8cff','#c86bfa'];
const projects=[
 {n:'01',title:'Generative Identity',tag:'Brand · Code',k:0},
 {n:'02',title:'Motion Systems',tag:'Animation · UI',k:1},
 {n:'03',title:'Data Landscapes',tag:'Visualization',k:2},
 {n:'04',title:'Interactive Spaces',tag:'WebGL · Sound',k:3}];
function rnd(s){return()=>(s=(s*16807)%2147483647)/2147483647;}
function txt(s,X,Y,size,col,al,w,a){x.globalAlpha=al;x.fillStyle=col;x.font=(w||'700')+' '+size+'px '+F;x.textAlign=a||'left';x.fillText(s,X,Y);x.globalAlpha=1;}
// project artworks, procedural
function art(k,X,Y,W,H,t){
 x.save();x.beginPath();x.rect(X,Y,W,H);x.clip();
 x.fillStyle='#111';x.fillRect(X,Y,W,H);
 const r=rnd(k*99+7);
 if(k==0){for(let i=0;i<14;i++){const a=t*.6+i*.45;x.fillStyle=pal[i%5];x.globalAlpha=.85;
  x.beginPath();x.arc(X+W/2+Math.cos(a)*W*.25*(i/14),Y+H/2+Math.sin(a*1.3)*H*.3*(i/14),W*.18*(1-i/16),0,7);x.fill();}}
 if(k==1){for(let i=0;i<10;i++){const p=(t*.4+i/10)%1;x.fillStyle=pal[i%5];
  x.fillRect(X,Y+i*H/10,W*E(Math.sin(p*Math.PI)),H/10-4);}}
 if(k==2){for(let j=0;j<12;j++){x.strokeStyle=pal[j%5];x.globalAlpha=.8;x.lineWidth=2;x.beginPath();
  for(let i=0;i<=40;i++){const px=X+i*W/40,py=Y+H*(.15+j*.06)+Math.sin(i*.3+t+j)*18*Math.sin(j+t*.3);i?x.lineTo(px,py):x.moveTo(px,py);}x.stroke();}}
 if(k==3){const n=8;for(let i=0;i<n;i++)for(let j=0;j<n*H/W|0+5;j++){const v=Math.sin(i*.7+t*2)+Math.cos(j*.6-t*1.5);
  x.fillStyle=pal[(i+j)%5];x.globalAlpha=cl((v+2)/4,0,1);const s=W/n;x.fillRect(X+i*s+3,Y+j*s+3,s-6,s-6);}}
 x.globalAlpha=1;x.restore();
}
function grid(a){x.strokeStyle='rgba(255,255,255,'+.05*a+')';x.lineWidth=1;
 for(let i=0;i<=1280;i+=64){x.beginPath();x.moveTo(i,0);x.lineTo(i,720);x.stroke();}
 for(let j=0;j<=720;j+=64){x.beginPath();x.moveTo(0,j);x.lineTo(1280,j);x.stroke();}}
function mark(cx,cy,s,t,a){x.globalAlpha=a;for(let i=0;i<5;i++){const an=t*.8+i*Math.PI*2/5;x.fillStyle=pal[i];
 x.beginPath();x.arc(cx+Math.cos(an)*s*.35,cy+Math.sin(an)*s*.35,s*.22,0,7);x.fill();}x.globalAlpha=1;}
function frame(){
 const T=((performance.now()-t0)/1000)%DUR;
 x.fillStyle='#0a0a0c';x.fillRect(0,0,1280,720);grid(1);
 // Scene 1: intro 0-4
 if(T<4.5){const a=E(T/1)*(1-E((T-3.8)/.7));
  mark(640,270,140*E(T/1.2),T,a);
  txt('PORTFOLIO',640,430,84,'#fff',a*E((T-.5)/.8),'800','center');
  txt('Built from scratch — every pixel made by code',640,480,22,'#aaa',a*E((T-1)/.8),'400','center');
  for(let i=0;i<5;i++){x.globalAlpha=a*E((T-1.4-i*.1)/.5);x.fillStyle=pal[i];x.fillRect(560+i*34,520,26,6);}x.globalAlpha=1;}
 // Scene 2: projects 4-15 (each 2.75s)
 if(T>=4&&T<15.5){const lt=T-4,i=Math.min(3,lt/2.75|0),p=projects[i],st=lt-i*2.75;
  const a=E(st/.6)*(i==3?1-E((T-14.8)/.7):1),slide=(1-E(st/.7))*80;
  art(p.k,620+slide,110,560,500,T);x.globalAlpha=1;
  x.strokeStyle=pal[i];x.lineWidth=3;x.strokeRect(620+slide,110,560,500);
  txt(p.n,100,250,120,pal[i],a*.9,'800');
  txt(p.title,100,330,46,'#fff',a,'700');
  txt(p.tag,100,375,22,'#999',a,'400');
  x.fillStyle=pal[i];x.globalAlpha=a;x.fillRect(100,400,200*E(st/1),4);x.globalAlpha=1;
  for(let k=0;k<4;k++){x.fillStyle=k==i?pal[i]:'#333';x.fillRect(100+k*40,560,30,4);}
  txt('SELECTED WORK',100,120,16,'#666',1,'600');}
 // Scene 3: overview mosaic 15-17.8
 if(T>=15&&T<18.3){const lt=T-15,a=E(lt/.6)*(1-E((lt-2.6)/.6));x.globalAlpha=a;
  for(let k=0;k<4;k++){const d=E((lt-k*.12)/.7);art(k,100+k*275,200+(1-d)*60,250,250,T);}
  x.globalAlpha=1;
  txt('4 projects · 1 language · 0 external assets',640,540,26,'#ddd',a,'500','center');}
 // Scene 4: outro 17.5-20
 if(T>=17.5){const lt=T-17.5,a=E(lt/.7)*(1-E((lt-2)/.5));
  mark(640,290,110,T,a);
  txt('Let’s make something.',640,420,48,'#fff',a,'700','center');
  txt('hello@portfolio.dev',640,465,22,pal[2],a,'500','center');}
 // progress
 x.fillStyle='#fff';x.globalAlpha=.25;x.fillRect(0,716,1280*T/DUR,4);x.globalAlpha=1;
 requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script></body></html>
