<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#000;height:100%;overflow:hidden}
canvas{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}
</style></head><body><canvas id="c" width="1280" height="720"></canvas>
<script>
window.DUR=15;
const c=document.getElementById('c'),x=c.getContext('2d');
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);c.style.width=1280*s+'px';c.style.height=720*s+'px';}
fit();addEventListener('resize',fit);
const q=new URLSearchParams(location.search);const off=parseFloat(q.get('t')||0)||0;
const t0=performance.now();
// battery geometry
const BX=340,BY=230,BW=560,BH=260;
function jit(t,i){return Math.sin(t*23+i*7.1)*0.8+Math.sin(t*11+i*3.3)*0.6;}
function ln(pts,t,k){x.beginPath();pts.forEach((p,i)=>{const a=p[0]+jit(t,i+k),b=p[1]+jit(t,i+k+5);i?x.lineTo(a,b):x.moveTo(a,b)});x.stroke();}
function rect(a,b,w,h,t,k){ln([[a,b],[a+w,b],[a+w,b+h],[a,b+h],[a,b]],t,k);}
function ease(v){v=Math.max(0,Math.min(1,v));return v*v*(3-2*v);}
// stick figure: pose params
function stick(px,py,s,pose,t){
 const {lean=0,la=[-0.5,0.3],ra=[0.5,-0.3],ll=[0.2,0],rl=[-0.2,0]}=pose;
 const hip=[px,py-50*s];const nk=[px+Math.sin(lean)*50*s,hip[1]-Math.cos(lean)*50*s];
 const hd=[nk[0]+Math.sin(lean)*16*s,nk[1]-Math.cos(lean)*16*s];
 x.beginPath();x.arc(hd[0]+jit(t,1),hd[1]+jit(t,2),14*s,0,7);x.stroke();
 ln([nk,hip],t,3);
 const limb=(o,ang,L)=>{const e=[o[0]+Math.sin(ang[0])*L*s,o[1]+Math.cos(ang[0])*L*s];const f=[e[0]+Math.sin(ang[0]+ang[1])*L*s,e[1]+Math.cos(ang[0]+ang[1])*L*s];ln([o,e,f],t,ang[0]*9);return f;};
 const sh=[nk[0]*0.8+hip[0]*0.2,nk[1]*0.8+hip[1]*0.2];
 const hL=limb(sh,la,24),hR=limb(sh,ra,24);
 limb(hip,ll,26);limb(hip,rl,26);return {hL,hR};
}
function draw(T){
 const t=T%DUR;
 x.fillStyle='#f3ead6';x.fillRect(0,0,1280,720);
 // paper grain
 x.fillStyle='rgba(120,100,70,0.05)';
 for(let i=0;i<300;i++){const a=(i*977.3)%1280,b=(i*613.7)%720;x.fillRect(a,b,2,2);}
 x.lineCap='round';x.lineJoin='round';x.strokeStyle='#1b1712';x.lineWidth=3;
 // level: drains, stickman pushes back, then recharge plug
 let lvl;
 if(t<9) lvl=0.9-0.75*ease(t/9)+0.08*Math.max(0,Math.sin(t*2.1))*(t>3?1:0);
 else if(t<11) lvl=0.12-0.04*ease((t-9)/2);
 else lvl=0.08+0.82*ease((t-11.3)/3.2);
 // battery
 x.lineWidth=5;rect(BX,BY,BW,BH,t,0);rect(BX+BW,BY+BH/2-40,28,80,t,9);x.lineWidth=3;
 // fill hatch
 const fw=(BW-24)*lvl, fx=BX+12;
 x.save();x.beginPath();x.rect(fx,BY+12,fw,BH-24);x.clip();
 x.strokeStyle='rgba(27,23,18,0.35)';x.lineWidth=2;
 for(let i=-300;i<BW;i+=16)ln([[fx+i,BY+BH],[fx+i+260,BY]],t,i);
 x.restore();
 // villain red line
 const rx=fx+fw;const charging=t>11.3;
 x.strokeStyle=charging?'#1b1712':'#c8261d';x.lineWidth=charging?3:5;
 x.beginPath();for(let y=BY+10;y<=BY+BH-10;y+=8){const w=charging?0:Math.sin(y*0.08+t*9)*5;y==BY+10?x.moveTo(rx+w,y):x.lineTo(rx+w,y);}x.stroke();
 if(!charging){ // angry eyes on villain
  x.fillStyle='#c8261d';const ey=BY+60+Math.sin(t*3)*8;
  x.beginPath();x.arc(rx-10,ey,3.5,0,7);x.arc(rx+10,ey,3.5,0,7);x.fill();
  x.lineWidth=2.5;ln([[rx-17,ey-10],[rx-5,ey-5]],t,40);ln([[rx+17,ey-10],[rx+5,ey-5]],t,41);
 }
 x.strokeStyle='#1b1712';x.lineWidth=3;
 // stickman
 const floor=BY+BH-14;let sx,pose;
 if(charging){sx=BX+120+Math.sin(t*3)*6;const j=Math.abs(Math.sin(t*6))*30;
  pose={la:[2.6+Math.sin(t*6)*0.3,0.3],ra:[-2.6-Math.sin(t*6)*0.3,-0.3],ll:[0.3,-0.4],rl:[-0.3,0.4]};
  stick(sx,floor-j,1.4,pose,t);}
 else if(t<9){sx=rx-32;const p=Math.sin(t*7)*0.15;
  pose={lean:0.45+p,la:[1.5,0.4],ra:[1.2,0.6],ll:[0.6,0.2],rl:[-0.7+p,0.3]};
  stick(sx,floor,1.4,pose,t);}
 else {sx=Math.max(BX+60,rx-50);pose={lean:0.2,la:[0.3,0.2],ra:[-0.3,-0.2],ll:[1.4,1.2],rl:[1.6,-0.2]};
  stick(sx,floor+30,1.4,pose,t);}
 // sweat
 if(!charging&&t>4){x.lineWidth=2;const d=(t*2)%1;ln([[sx-50,floor-110+d*20],[sx-54,floor-100+d*20]],t,50);x.lineWidth=3;}
 // plug arrives
 if(t>9.5){const k=ease((t-9.5)/1.8);const px=BX+BW+28+260*(1-k);const py=BY+BH/2;
  rect(px+10,py-30,70,60,t,60);ln([[px,py-14],[px+10,py-14]],t,70);ln([[px,py+14],[px+10,py+14]],t,71);
  x.beginPath();x.moveTo(px+80,py);x.bezierCurveTo(px+200,py,1150,560,1300,600);x.stroke();
  if(charging){x.lineWidth=4;ln([[BX+BW/2+10,BY-70],[BX+BW/2-12,BY-38],[BX+BW/2+6,BY-38],[BX+BW/2-14,BY-6]],t,80);x.lineWidth=3;}
 }
 // fade loop
 // labels
 x.fillStyle='#1b1712';x.font='italic 26px Georgia,serif';x.textAlign='center';
 x.fillText(Math.round(lvl*100)+'%',BX+BW/2,BY+BH+60);
 x.font='italic 18px Georgia,serif';x.fillStyle='#6b5d4a';
 x.fillText(charging?'charging…':(t<9?'hold the line':'low power'),BX+BW/2,BY+BH+92);
 const f=Math.max(0,1-t/0.5,(t-14.5)/0.5);if(f>0){x.fillStyle='rgba(243,234,214,'+f+')';x.fillRect(0,0,1280,720);}
}
function loop(){draw((performance.now()-t0)/1000+off);requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script></body></html>
