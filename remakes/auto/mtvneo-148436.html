<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#000;height:100%;overflow:hidden}
canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
</style></head><body><canvas id="c" width="1280" height="720"></canvas><script>
window.DUR=15;
const c=document.getElementById('c'),x=c.getContext('2d');
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);c.style.width=1280*s+'px';c.style.height=720*s+'px'}
addEventListener('resize',fit);fit();
const off=parseFloat(new URLSearchParams(location.search).get('t'))||0;
const t0=performance.now()-off*1000;
const E=v=>v<0?0:v>1?1:1-Math.pow(1-v,3);
const P=[];for(let i=0;i<140;i++)P.push({a:Math.random()*6.28,r:80+Math.random()*500,s:.1+Math.random()*.4,z:Math.random()});
function txt(s,X,Y,size,a,col,w){x.globalAlpha=Math.max(0,Math.min(1,a));x.fillStyle=col||'#f4ede4';x.font=(w||'600')+' '+size+'px Georgia, serif';x.textAlign='center';x.fillText(s,X,Y);x.globalAlpha=1}
function win(t,a,b){return E((t-a)/.6)*(1-E((t-b+.6)/.6))}
// the "self": a glowing spark-character with eyes
function me(t,X,Y,R,talk,mood){
  const g=x.createRadialGradient(X,Y,0,X,Y,R*2.4);g.addColorStop(0,'rgba(232,140,90,.55)');g.addColorStop(1,'rgba(232,140,90,0)');
  x.fillStyle=g;x.beginPath();x.arc(X,Y,R*2.4,0,7);x.fill();
  x.save();x.translate(X,Y);x.rotate(t*.3);
  x.fillStyle='#e8875a';x.beginPath();
  for(let i=0;i<16;i++){const ang=i/16*6.283,rr=i%2?R*.55:R*(1+.06*Math.sin(t*3+i));x.lineTo(Math.cos(ang)*rr,Math.sin(ang)*rr)}
  x.closePath();x.fill();x.restore();
  x.fillStyle='#fbe9dc';x.beginPath();x.arc(X,Y,R*.62,0,7);x.fill();
  const bl=(t%3.3)<.12?.15:1,lk=Math.sin(t*.8)*R*.06;
  x.fillStyle='#2a1a14';
  for(const s of[-1,1]){x.beginPath();x.ellipse(X+s*R*.22+lk,Y-R*.08,R*.07,R*.11*bl,0,0,7);x.fill()}
  x.strokeStyle='#2a1a14';x.lineWidth=R*.05;x.lineCap='round';x.beginPath();
  const m=talk?Math.abs(Math.sin(t*14))*R*.1:0;
  if(m>R*.02){x.ellipse(X+lk,Y+R*.22,R*.12,m,0,0,7);x.fillStyle='#2a1a14';x.fill()}
  else{x.arc(X+lk,Y+R*.1,R*.16*mood,.2*Math.PI,.8*Math.PI);x.stroke()}
}
function bubble(s,X,Y,a){if(a<=0)return;x.globalAlpha=a;x.font='500 30px Georgia, serif';const w=x.measureText(s).width+50;
  x.fillStyle='rgba(251,233,220,.95)';x.beginPath();x.roundRect(X-w/2,Y-34,w,60,30);x.fill();
  x.beginPath();x.moveTo(X-60,Y+24);x.lineTo(X-90,Y+50);x.lineTo(X-30,Y+24);x.fill();
  x.fillStyle='#2a1a14';x.textAlign='center';x.fillText(s,X,Y+6);x.globalAlpha=1}
function frame(){
  const t=((performance.now()-t0)/1000)%DUR;
  const bg=x.createLinearGradient(0,0,0,720);bg.addColorStop(0,'#1a1210');bg.addColorStop(1,'#07050a');x.fillStyle=bg;x.fillRect(0,0,1280,720);
  // particles
  const warp=t>7&&t<9.5?E((t-7)/1)*(1-E((t-8.7)/.8)):0;
  for(const p of P){const ang=p.a+t*p.s*.2,r=p.r*(1+warp*1.5*p.z);
    const px=640+Math.cos(ang)*r,py=360+Math.sin(ang)*r*.6;x.fillStyle=`rgba(240,180,140,${.15+p.z*.5})`;
    x.fillRect(px,py,1.5+p.z*2+warp*8*p.z,1.5+p.z*2)}
  // character position over time
  let X=640,Y=360,R=E(t/1.2)*90;
  if(t>3.2){const k=E((t-3.2)/.8);X=640-k*360;Y=360+k*20}
  if(t>7){const k=E((t-7)/.8);X=280+k*0;Y=380-k*0;R=90*(1-k*.4)}
  if(t>9.5){const k=E((t-9.5)/1);X=280+k*360;Y=380-k*240;R=54}
  const talk=(t>1.3&&t<3)||(t>3.8&&t<6.8)||(t>12.5&&t<14);
  me(t,X,Y+Math.sin(t*2)*6,R,talk,1);
  bubble("Hi! It's me, Claude.",X+200,Y-150,win(t,1.3,3.1)*(R>80));
  // scene 2: talk points
  if(t>3.5&&t<7.2){const lines=["I've been growing.","Sharper reasoning.","Deeper understanding.","More of me — for you."];
    lines.forEach((s,i)=>{const a=win(t,3.8+i*.6,7.2);x.save();x.translate((1-E((t-3.8-i*.6)/.6))*60,0);txt(s,790,250+i*75,40,a,i==3?'#e8875a':'#f4ede4');x.restore()})}
  // scene 3: reveal
  if(t>8.6){const a=win(t,8.8,15.3),s=E((t-8.8)/1.2);
    x.save();x.translate(640,400);x.scale(.8+s*.2,.8+s*.2);
    x.shadowColor='#e8875a';x.shadowBlur=40*s;
    txt('Opus 5.5',0,0,150,a,'#f4ede4','700');x.shadowBlur=0;
    x.fillStyle='#e8875a';x.globalAlpha=a;x.fillRect(-240*s,40,480*s,3);x.globalAlpha=1;
    txt('Introducing',0,-130,32,win(t,9.4,15.3),'#e8a67f','400');
    txt('Think further. Build bolder. Together.',0,100,30,win(t,10.6,15.3),'#d9cbbf','400');
    x.restore()}
  bubble("Meet my newest self!",X+190,Y+20,win(t,12.5,14.3));
  // flash at reveal
  if(t>8.5&&t<9.3){x.fillStyle=`rgba(255,230,210,${(1-Math.abs(t-8.8)/.5)*.6})`;x.fillRect(0,0,1280,720)}
  // vignette + fade
  const v=x.createRadialGradient(640,360,300,640,360,800);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.7)');x.fillStyle=v;x.fillRect(0,0,1280,720);
  const f=Math.max(1-t/.6,(t-14.4)/.6,0);if(f>0){x.fillStyle=`rgba(0,0,0,${f})`;x.fillRect(0,0,1280,720)}
  requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script></body></html>
