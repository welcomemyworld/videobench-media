<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><title>サイケデリック・グリッチ MV</title>
<style>html,body{margin:0;background:#000;height:100%;overflow:hidden}canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}</style></head>
<body><canvas id="c" width="1280" height="720"></canvas>
<script>
// 注: 楽曲・画像の添付は受け取れないため、キャラクターは手描き生成、楽曲は BPM120 の想定ビートマップで同期しています。
const W=1280,H=720,BPM=120,BEAT=60/BPM,BAR=BEAT*4,OFFSET=0;
window.DUR=48;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px'}fit();onresize=fit;
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const buf=mk(W,H),bx=buf.getContext('2d'),tmp=mk(W,H),tx=tmp.getContext('2d'),buf2=mk(W,H),b2=buf2.getContext('2d');
// セクション（小節単位）: 0-3 イントロ, 4-9 Aメロ, 10-15 サビ, 16-17 落ち, 18-23 サビ
function section(bar){if(bar<4)return['INTRO',.4];if(bar<10)return['A',.7];if(bar<16)return['CHORUS',1];if(bar<18)return['DROP',.3];return['CHORUS',1]}
const WORDS=['覚醒','幻覚','極彩色','NOISE','夢中','爆発','万華鏡','ZERO','光速','溶解','FEVER','永遠'];
// 擬似乱数
let sd=7;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647;
// ===== キャラクター生成 =====
const POSES=[[-.6,.6],[-2.4,.5],[-2.5,2.5],[-.4,2.6],[.3,-.3]];
function drawChar(g,p){
  const [la,ra]=POSES[p];g.lineCap='round';g.lineJoin='round';
  const limb=(x,y,a,len,col)=>{g.strokeStyle=col;g.lineWidth=26;g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.sin(a)*len,y+Math.cos(a)*len);g.stroke();g.fillStyle='#ffe0cc';g.beginPath();g.arc(x+Math.sin(a)*len,y+Math.cos(a)*len,16,0,7);g.fill()};
  // 後ろ髪
  g.fillStyle='#ff3fa4';g.beginPath();g.ellipse(200,190,135,150,0,0,7);g.fill();
  g.beginPath();g.moveTo(80,200);g.quadraticCurveTo(50,380,110,420);g.lineTo(150,250);g.fill();
  g.beginPath();g.moveTo(320,200);g.quadraticCurveTo(350,380,290,420);g.lineTo(250,250);g.fill();
  // 脚
  limb(170,450,0.15,120,'#222');limb(230,450,-0.15,120,'#222');
  // 体
  g.fillStyle='#4be3ff';g.beginPath();g.moveTo(160,290);g.lineTo(240,290);g.lineTo(300,470);g.lineTo(100,470);g.closePath();g.fill();
  g.fillStyle='#fff';g.beginPath();g.moveTo(170,290);g.lineTo(200,340);g.lineTo(230,290);g.fill();
  g.fillStyle='#ff2';g.beginPath();g.arc(200,320,12,0,7);g.fill();
  limb(165,310,la,110,'#4be3ff');limb(235,310,ra,110,'#4be3ff');
  // 顔
  g.fillStyle='#ffe0cc';g.beginPath();g.ellipse(200,185,100,95,0,0,7);g.fill();
  // 前髪
  g.fillStyle='#ff3fa4';g.beginPath();g.moveTo(95,170);g.quadraticCurveTo(110,70,200,75);g.quadraticCurveTo(290,70,305,170);
  for(let i=0;i<5;i++){g.lineTo(285-i*42,125+(i%2)*25)}g.closePath();g.fill();
  // 目
  for(const ex of[160,240]){g.fillStyle='#fff';g.beginPath();g.ellipse(ex,195,24,30,0,0,7);g.fill();
    const gr=g.createLinearGradient(0,170,0,225);gr.addColorStop(0,'#5a1cff');gr.addColorStop(1,'#00e0ff');
    g.fillStyle=gr;g.beginPath();g.ellipse(ex,198,19,25,0,0,7);g.fill();
    g.fillStyle='#111';g.beginPath();g.ellipse(ex,200,9,13,0,0,7);g.fill();
    g.fillStyle='#fff';g.beginPath();g.arc(ex-7,188,7,0,7);g.fill();g.beginPath();g.arc(ex+6,208,3,0,7);g.fill();
    g.strokeStyle='#222';g.lineWidth=5;g.beginPath();g.ellipse(ex,195,25,31,0,3.6,5.8);g.stroke()}
  g.fillStyle='#ff7aa8';g.globalAlpha=.5;g.beginPath();g.ellipse(130,232,16,8,0,0,7);g.ellipse(270,232,16,8,0,0,7);g.fill();g.globalAlpha=1;
  g.strokeStyle='#c22';g.lineWidth=4;g.beginPath();g.arc(200,238,p%2?14:9,.2,2.9);g.stroke();
  // アホ毛・星
  g.strokeStyle='#ff3fa4';g.lineWidth=8;g.beginPath();g.moveTo(200,78);g.quadraticCurveTo(230,30,255,50);g.stroke();
  g.fillStyle='#ff2';g.save();g.translate(290,110);g.beginPath();for(let i=0;i<10;i++){const r=i%2?9:22,a=i*Math.PI/5;g.lineTo(Math.sin(a)*r,-Math.cos(a)*r)}g.fill();g.restore();
}
// ステッカー化（白縁＋薄い影）
const SPR=POSES.map((_,p)=>{
  const raw=mk(400,600),r=raw.getContext('2d');drawChar(r,p);
  const sil=mk(400,600),s=sil.getContext('2d');s.drawImage(raw,0,0);s.globalCompositeOperation='source-in';s.fillStyle='#fff';s.fillRect(0,0,400,600);
  const out=mk(440,640),o=out.getContext('2d');
  o.save();o.shadowColor='rgba(0,0,0,.45)';o.shadowBlur=18;o.shadowOffsetX=8;o.shadowOffsetY=10;o.drawImage(sil,20,20);o.restore();
  for(let a=0;a<16;a++)o.drawImage(sil,20+Math.cos(a/16*6.283)*11,20+Math.sin(a/16*6.283)*11);
  o.drawImage(raw,20,20);return out});
// グレイン
const grain=mk(512,512);{const g=grain.getContext('2d'),d=g.createImageData(512,512);for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=28}g.putImageData(d,0,0)}
// カット割り（1拍ごと）
const NB=Math.ceil(DUR/BEAT),CUTS=[];
{let prevP=-1;for(let b=0;b<NB;b++){const bar=b>>2,[sec]=section(bar);let type;
  const types=['full','bust','eye','two','five','scene'];
  if(sec==='DROP'||sec==='INTRO'&&b%4===3)type=rnd()<.6?'scene':'full';else{type=types[Math.floor(rnd()*6)];if(CUTS[b-1]&&CUTS[b-1].type===type)type=types[(types.indexOf(type)+1)%6]}
  let p;do p=Math.floor(rnd()*POSES.length);while(p===prevP);let p2;do p2=Math.floor(rnd()*POSES.length);while(p2===p);
  prevP=(type==='two')?p2:p;CUTS.push({type,p,p2,h:rnd()*360,flip:rnd()<.5})}}
// ===== 背景 =====
function bg(g,t,kind,e){
  const T=t*(.6+e);
  if(kind===0){for(let r=900;r>0;r-=36){g.fillStyle=`hsl(${(r*.6-T*120)%360},100%,55%)`;g.beginPath();g.arc(W/2,H/2,r,T+r*.01,T+r*.01+Math.PI*1.5);g.lineTo(W/2,H/2);g.fill()}}
  else if(kind===1){g.save();g.translate(W/2,H/2);g.rotate(T*.5);for(let i=0;i<24;i++){g.fillStyle=`hsl(${i*15+T*60},100%,55%)`;g.beginPath();g.moveTo(0,0);g.arc(0,0,900,i/24*6.283,(i+1)/24*6.283);g.fill()}g.restore()}
  else if(kind===2){for(let y=0;y<H;y+=12){g.fillStyle=`hsl(${y*.5+Math.sin(y*.02+T*2)*60+T*80},100%,55%)`;g.fillRect(0,y,W,12)}
    g.globalAlpha=.5;for(let x=0;x<W;x+=16){g.fillStyle=`hsl(${x*.4-T*90+Math.sin(x*.01+T)*80},100%,60%)`;g.fillRect(x,0,16,H)}g.globalAlpha=1}
  else if(kind===3){g.save();g.translate(W/2,H/2);g.rotate(.5);for(let i=-30;i<30;i++){g.fillStyle=`hsl(${i*24+T*100},100%,55%)`;g.fillRect(i*50+(T*120%50),-900,50,1800)}g.restore()}
  else{const s=80,o=(T*60)%(s*2);g.fillStyle='#fff';g.fillRect(0,0,W,H);g.fillStyle='#000';for(let y=-2;y<H/s+2;y++)for(let x=-2;x<W/s+2;x++)if((x+y)&1)g.fillRect(x*s+o,y*s+o*.5,s,s)}
}
function scene(g,t){
  const sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#1a0040');sky.addColorStop(.6,'#ff4fa0');sky.addColorStop(1,'#ffd36b');g.fillStyle=sky;g.fillRect(0,0,W,H);
  g.fillStyle='#fff6a8';g.beginPath();g.arc(W/2,420,150,0,7);g.fill();
  for(let i=0;i<7;i++){g.strokeStyle=`hsl(${i*50},100%,60%)`;g.lineWidth=14;g.beginPath();g.arc(W/2,520,420-i*16,Math.PI,0);g.stroke()}
  for(let l=0;l<3;l++){g.fillStyle=['#5b1a8a','#33106a','#16052e'][l];g.beginPath();g.moveTo(0,H);for(let x=0;x<=W;x+=20)g.lineTo(x,470+l*60+Math.sin(x*.008*(l+1)+l+t*.2)*50);g.lineTo(W,H);g.fill()}
  g.fillStyle='#fff';for(let i=0;i<40;i++){const x=(i*173)%W,y=(i*97)%300;g.globalAlpha=.4+.6*Math.abs(Math.sin(t*2+i));g.fillRect(x,y,3,3)}g.globalAlpha=1;
}
function spr(g,p,x,y,s,hue,flip){g.save();g.translate(x,y);if(flip)g.scale(-1,1);if(hue)g.filter=`hue-rotate(${hue}deg)`;g.drawImage(SPR[p],-220*s,-320*s,440*s,640*s);g.restore()}
// ===== 描画 =====
let t0=performance.now()-(parseFloat(new URLSearchParams(location.search).get('t'))||0)*1000;
function frame(now){
  const t=((now-t0)/1000)%DUR,tb=Math.max(0,t-OFFSET),bi=Math.floor(tb/BEAT),bp=(tb%BEAT)/BEAT,bar=Math.floor(bi/4),inBar=bi%4,barP=(tb%BAR)/BAR;
  const [sec,E]=section(bar),cut=CUTS[bi]||CUTS[0],chorus=sec==='CHORUS',bounce=1+.04*E*Math.exp(-bp*6);
  const g=bx;g.setTransform(1,0,0,1,0,0);g.filter='none';g.globalCompositeOperation='source-over';
  // 背景＋カット
  if(cut.type==='scene'){scene(g,t);spr(g,cut.p,W/2,520,.55*bounce,0,cut.flip)}
  else{bg(g,t,(bar+(inBar>1?1:0))%5,E);
    if(cut.type==='full')spr(g,cut.p,W/2,370,1.0*bounce,0,cut.flip);
    else if(cut.type==='bust')spr(g,cut.p,W/2,720,2.1*bounce,0,cut.flip);
    else if(cut.type==='eye'){spr(g,cut.p,W/2,360+(320-215)*5.5,5.5*bounce,0,cut.flip)}
    else if(cut.type==='two'){spr(g,cut.p,W*.3,380,.95*bounce,0,false);spr(g,cut.p2,W*.7,380,.95*bounce,0,true)}
    else for(let i=0;i<5;i++)spr(g,cut.p,140+i*250,380+Math.sin(t*6+i)*15*E,.72*bounce,i*72,i%2)}
  // 万華鏡（サビ・1小節おき）
  if(chorus&&bar%2===0){b2.setTransform(1,0,0,1,0,0);b2.drawImage(buf,0,0);g.fillStyle='#000';g.fillRect(0,0,W,H);
    const N=10,a=6.283/N,rot=t*.3;for(let i=0;i<N;i++){g.save();g.translate(W/2,H/2);g.rotate(rot+i*a);if(i%2)g.scale(1,-1);
      g.beginPath();g.moveTo(0,0);g.arc(0,0,900,-a/2-.01,a/2+.01);g.closePath();g.clip();g.drawImage(buf2,-W/2+100,-H/2);g.restore()}}
  // 出力
  ctx.setTransform(1,0,0,1,0,0);ctx.globalCompositeOperation='source-over';ctx.filter=chorus?`hue-rotate(${(t*120)%360}deg)`:'none';
  // 引き裂き＋RGB分離
  const tear=E*Math.max(0,1-bp*2.2);
  if(tear>.02){ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='lighter';
    const off=[-18,0,18],cols=['#f00','#0f0','#00f'];
    for(let c=0;c<3;c++){tx.globalCompositeOperation='source-over';tx.drawImage(buf,0,0);tx.globalCompositeOperation='multiply';tx.fillStyle=cols[c];tx.fillRect(0,0,W,H);
      ctx.drawImage(tmp,off[c]*tear,0)}
    ctx.globalCompositeOperation='source-over';ctx.filter='none';sd=bi*31+5;
    const n=Math.floor(4+8*tear);for(let i=0;i<n;i++){const y=rnd()*H,h=8+rnd()*60,dx=(rnd()-.5)*160*tear;ctx.drawImage(ctx.canvas,0,y,W,h,dx,y,W,h)}}
  else ctx.drawImage(buf,0,0);
  ctx.filter='none';ctx.globalCompositeOperation='source-over';
  // 白フラッシュ
  const fl=(inBar===0?.85:.4)*E*Math.exp(-bp*9);if(fl>.01){ctx.fillStyle=`rgba(255,255,255,${fl})`;ctx.fillRect(0,0,W,H)}
  // 小節頭の大文字
  const bt=tb%BAR;if(bt<.4&&sec!=='DROP'){const w=WORDS[bar%WORDS.length],sc=1+bt*.4;ctx.save();ctx.translate(W/2,H/2);ctx.scale(sc,sc);
    ctx.font='900 220px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    let fs=220;const mw=ctx.measureText(w).width;if(mw>1100){fs=220*1100/mw;ctx.font=`900 ${fs}px sans-serif`}
    ctx.globalCompositeOperation='difference';ctx.fillStyle='#fff';ctx.fillText(w,0,0);ctx.globalCompositeOperation='source-over';
    const gr=ctx.createLinearGradient(-500,0,500,0);for(let i=0;i<=6;i++)gr.addColorStop(i/6,`hsl(${i*60+t*300},100%,60%)`);
    ctx.strokeStyle=gr;ctx.lineWidth=8;ctx.strokeText(w,0,0);ctx.restore()}
  // グレイン・走査線
  ctx.globalCompositeOperation='overlay';ctx.drawImage(grain,-Math.random()*200,-Math.random()*200,1600,1000);ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='rgba(0,0,0,.14)';for(let y=0;y<H;y+=3)ctx.fillRect(0,y,W,1);
  // テキスト
  ctx.font='bold 20px sans-serif';ctx.textBaseline='top';ctx.lineWidth=4;ctx.strokeStyle='rgba(0,0,0,.7)';ctx.fillStyle='#fff';
  const txt=(s,x,y,a)=>{ctx.textAlign=a;ctx.strokeText(s,x,y);ctx.fillText(s,x,y)};
  txt('【名前】 ／ サイケデリック・グリッチ',24,22,'left');txt('2025.01.01',W-24,22,'right');
  ctx.textBaseline='bottom';txt(`BAR ${String(bar+1).padStart(2,'0')} / ${Math.ceil(DUR/BAR)}`,W-24,H-20,'right');
  txt({INTRO:'イントロ',A:'Aメロ',CHORUS:'サビ',DROP:'落ち'}[sec],24,H-20,'left');
  // フェード
  const fd=Math.min(1,t/1.5,(DUR-t)/2);if(fd<1){ctx.fillStyle=`rgba(0,0,0,${1-Math.max(0,fd)})`;ctx.fillRect(0,0,W,H)}
  requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script></body></html>
