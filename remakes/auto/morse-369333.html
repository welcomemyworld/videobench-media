<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>One Shape</title>
<style>html,body{margin:0;background:#000;height:100%;overflow:hidden}canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}</style>
</head><body><canvas id="c" width="1280" height="720"></canvas>
<script>
const DUR=16;window.DUR=DUR;const B=0.5;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);cv.style.width=1280*s+'px';cv.style.height=720*s+'px';}
addEventListener('resize',fit);fit();
const FONT='Geist, Inter, "Helvetica Neue", system-ui, sans-serif';
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),lerp=(a,b,k)=>a+(b-a)*k;
function S(x,f=2.2,z=0.78){if(x<=0)return 0;const w=2*Math.PI*f,wd=w*Math.sqrt(1-z*z);return 1-Math.exp(-z*w*x)*(Math.cos(wd*x)+z*w/wd*Math.sin(wd*x));}
// sum of springs: keys [[beat,value],...]
function anim(bt,keys,f,z){let v=keys[0][1];for(let i=1;i<keys.length;i++)v+=(keys[i][1]-keys[i-1][1])*S((bt-keys[i][0])*B,f,z);return v;}
const ST=[
['button',0,240,64,32,1],['loader',2,64,64,32,1],['check',4,64,64,32,1],['island',5,280,52,26,1],
['player',6,520,180,32,1],['slider',11,440,72,36,0],['toggle',14,132,72,36,0],['tabs',16,480,64,32,0],
['chart',19,600,340,28,0],['cmdk',23,520,64,16,0],['palette',24,520,260,20,0],['toast',26,340,60,30,1],['button',28,240,64,32,1]];
const key=i=>ST.map(s=>[s[1],s[i]]);
const KW=key(2),KH=key(3),KR=key(4),KD=key(5).concat([[15,1],[16,0]]).sort((a,b)=>a[0]-b[0]);
const KZ=ST.map(s=>[s[1],Math.min(2.5,Math.min(1180/s[2],600/s[3])*0.68)]);
const CK=[[0,150,110],[1.6,30,6],[2.3,30,6],[3.5,110,80],[5.5,240,60],[6.8,200,-10],[7.3,200,-10],[7.9,-110,60],[8.6,140,60],[9.3,20,60],[9.8,60,60],[10.8,40,30],[11.4,42,0],[12.6,270,0],[13.2,270,0],[14.6,0,0],[15.3,0,0],[16.6,0,0],[17.2,0,0],[17.7,160,0],[18.4,160,0],[19.6,-260,20],[22.5,260,-30],[23.4,240,130],[26,240,130],[27.6,60,70],[28.6,20,8],[29.6,20,8],[31.3,150,110],[32,150,110]];
const DOWN=[[1.9,2.1],[6.95,7.15],[8.0,9.8],[11.5,13.0],[14.9,15.1],[16.9,17.1],[17.9,18.1],[28.9,29.1]];
function cur(bt){let i=0;while(i<CK.length-2&&CK[i+1][0]<=bt)i++;const a=CK[i],b=CK[i+1];let k=cl((bt-a[0])/(b[0]-a[0]));k=k*k*(3-2*k);return[lerp(a[1],b[1],k),lerp(a[2],b[2],k)];}
const isDown=bt=>DOWN.some(d=>bt>=d[0]&&bt<d[1]);
function press(bt){let p=0;for(const d of DOWN){p=Math.max(p,cl((bt-d[0]+0.08)/0.08)*cl((d[1]+0.15-bt)/0.15));}return p;}
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
function txt(s,x,y,sz,col,wt=500,al='center'){ctx.font=wt+' '+sz+'px '+FONT;ctx.fillStyle=col;ctx.textAlign=al;ctx.textBaseline='middle';ctx.fillText(s,x,y);}
function progress(bt){if(bt<8)return 0.18+Math.max(0,bt-7)*0.012;const sc=x=>cl((x+230)/460);if(bt<9.8)return sc(cur(bt)[0]);return sc(cur(9.8)[0])+(bt-9.8)*0.012;}
function volume(bt){const raw=x=>(x+150)/320,rb=r=>r>1?1+(r-1)*0.35:Math.max(0,r);
 if(bt<11.5)return 0.6;if(bt<13)return rb(raw(cur(bt)[0]));const v=rb(raw(cur(13)[0]));return 1+(v-1)*(1-S((bt-13)*B,2.6,0.8));}
const PTS=[0.3,0.42,0.35,0.55,0.5,0.62,0.48,0.7,0.66,0.8,0.74,0.9];
const ITEMS=['Export report','Expand all','New file','Settings','Share link'];
function content(k,bt,w,h,dark){
 const fg=dark?'#fff':'#111',mut=dark?'#8a8a8a':'#8b8780';
 ctx.lineCap='round';ctx.lineJoin='round';
 if(k==='button'){txt('Get started',0,1,22,fg,560);}
 else if(k==='loader'){ctx.strokeStyle='rgba(255,255,255,.2)';ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,0,16,0,7);ctx.stroke();
  ctx.strokeStyle='#fff';const a=bt*B*9;ctx.beginPath();ctx.arc(0,0,16,a,a+1.6+Math.sin(bt*B*5)*.6);ctx.stroke();}
 else if(k==='check'){const p=cl((bt-4.05)/0.5);ctx.strokeStyle='#fff';ctx.lineWidth=4;const P=[[-11,1],[-3,9],[12,-8]],L1=11.3,L2=22.7,d=p*(L1+L2);
  ctx.beginPath();ctx.moveTo(-11,1);if(d<L1){const q=d/L1;ctx.lineTo(-11+8*q,1+8*q);}else{ctx.lineTo(-3,9);const q=(d-L1)/L2;ctx.lineTo(-3+15*q,9-17*q);}ctx.stroke();}
 else if(k==='island'){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-w/2+28,0,7,0,7);ctx.fill();txt('Now playing',-w/2+46,1,17,'#fff',500,'left');
  for(let i=0;i<3;i++){const hh=6+8*Math.abs(Math.sin(bt*Math.PI+i*1.3));rr(w/2-46+i*8,-hh/2,4,hh,2);ctx.fill();}}
 else if(k==='player'){rr(-w/2+24,-h/2+24,h-48,h-48,16);ctx.fillStyle='#262626';ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(-w/2+24+(h-48)/2,0,22,0,7);ctx.stroke();ctx.beginPath();ctx.arc(-w/2+24+(h-48)/2,0,4,0,7);ctx.fillStyle='#fff';ctx.fill();
  const x0=-w/2+h-6;txt('Midnight Drive',x0,-34,24,'#fff',600,'left');txt('Nova Lane',x0,-6,17,mut,500,'left');
  const p=progress(bt),tx0=x0,tx1=w/2-28,ty=40;rr(tx0,ty-3,tx1-tx0,6,3);ctx.fillStyle='#3a3a3a';ctx.fill();
  rr(tx0,ty-3,(tx1-tx0)*p,6,3);ctx.fillStyle='#fff';ctx.fill();const kd=isDown(bt)&&bt>=8?9:6;ctx.beginPath();ctx.arc(tx0+(tx1-tx0)*p,ty,kd,0,7);ctx.fill();
  const tt=Math.floor(p*214);txt(Math.floor(tt/60)+':'+String(tt%60).padStart(2,'0'),tx0,ty+22,13,mut,500,'left');txt('3:34',tx1,ty+22,13,mut,500,'right');
  const m=anim(bt,[[0,0],[7,1]],3,0.85),bx=w/2-58,by=-22;ctx.beginPath();ctx.arc(bx,by,28,0,7);ctx.fill();
  const A=[[[-8,-12],[2,-6.5],[2,6.5],[-8,12]],[[2,-6.5],[12,0],[12,0],[2,6.5]]],Z=[[[-9,-11],[-3,-11],[-3,11],[-9,11]],[[3,-11],[9,-11],[9,11],[3,11]]];
  ctx.fillStyle='#111';for(let q=0;q<2;q++){ctx.beginPath();for(let j=0;j<4;j++){const X=lerp(A[q][j][0],Z[q][j][0],m)+bx+2*(1-m),Y=lerp(A[q][j][1],Z[q][j][1],m)+by;j?ctx.lineTo(X,Y):ctx.moveTo(X,Y);}ctx.closePath();ctx.fill();}}
 else if(k==='slider'){const v=volume(bt),x0=-150,len=320,ext=Math.max(0,v-1)*len;ctx.strokeStyle='#111';ctx.lineWidth=2.5;
  const ix=-w/2+30;ctx.beginPath();ctx.moveTo(ix,-5);ctx.lineTo(ix+5,-5);ctx.lineTo(ix+11,-10);ctx.lineTo(ix+11,10);ctx.lineTo(ix+5,5);ctx.lineTo(ix,5);ctx.closePath();ctx.stroke();
  ctx.beginPath();ctx.arc(ix+13,0,7,-0.8,0.8);ctx.stroke();
  const th=8+Math.min(ext,40)*-0.08;rr(x0,-th/2,len+ext,th,th/2);ctx.fillStyle='#d9d5ce';ctx.fill();rr(x0,-th/2,len*Math.min(v,1)+ext,th,th/2);ctx.fillStyle='#111';ctx.fill();
  ctx.beginPath();ctx.arc(x0+len*Math.min(v,1)+ext,0,isDown(bt)?13:11,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x0+len*Math.min(v,1)+ext,0,4,0,7);ctx.fill();}
 else if(k==='toggle'){const f=anim(bt,[[0,0],[15,1]],3.4,0.8),s=anim(bt,[[0,0],[15,1]],2,0.85);const L=-w/2+8+(w-72)*s,R=-w/2+64+(w-72)*f;
  rr(L,-28,R-L,56,28);ctx.fillStyle=dark?'#fff':'#111';ctx.fill();}
 else if(k==='tabs'){const C=[-160,0,160],ti=bt<17?0:bt<18?1:2,f=anim(bt,[[0,-160],[17,0],[18,160]],3.4,0.8),s=anim(bt,[[0,-160],[17,0],[18,160]],1.9,0.85);
  rr(s-72,-24,f-s+144,48,24);ctx.fillStyle='#111';ctx.fill();['Overview','Revenue','Users'].forEach((n,i)=>{const on=cl(1-Math.abs((f+s)/2-C[i])/160);txt(n,C[i],1,17,on>0.5?'#fff':'#6b6760',560);});}
 else if(k==='chart'){const L=-w/2+40,R=w/2-40,T=-h/2+80,Bt=h/2-40;txt('Revenue',L,-h/2+40,22,'#111',600,'left');txt('+24.8%',R,-h/2+40,17,'#6b6760',500,'right');
  ctx.strokeStyle='#e4e0d9';ctx.lineWidth=1.5;for(let i=0;i<4;i++){const y=lerp(T,Bt,i/3);ctx.beginPath();ctx.moveTo(L,y);ctx.lineTo(R,y);ctx.stroke();}
  const P=PTS.map((v,i)=>[lerp(L,R,i/(PTS.length-1)),lerp(Bt,T,v)]),pr=cl((bt-19.2)/1.4),e=1-Math.pow(1-pr,3),n=(P.length-1)*e;
  ctx.strokeStyle='#111';ctx.lineWidth=3.5;ctx.beginPath();ctx.moveTo(P[0][0],P[0][1]);for(let i=1;i<=Math.floor(n);i++)ctx.lineTo(P[i][0],P[i][1]);
  const fi=Math.floor(n),fr=n-fi;if(fi<P.length-1)ctx.lineTo(lerp(P[fi][0],P[fi+1][0],fr),lerp(P[fi][1],P[fi+1][1],fr));ctx.stroke();
  if(bt>19.7&&bt<23){const cx=cur(bt)[0],u=cl((cx-L)/(R-L))*(P.length-1),a=Math.floor(Math.min(u,P.length-2)),q=u-a,X=lerp(P[a][0],P[a+1][0],q),Y=lerp(P[a][1],P[a+1][1],q),al=cl((bt-19.7)/0.3)*cl((23-bt)/0.3);
   ctx.globalAlpha*=al;ctx.strokeStyle='#bdb8b0';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(X,T);ctx.lineTo(X,Bt);ctx.stroke();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(X,Y,7,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(X,Y,3,0,7);ctx.fill();
   const tw=96,tX=cl(X-tw/2,L,R-tw);rr(tX,Y-58,tw,38,10);ctx.fillStyle='#111';ctx.fill();txt('$'+(8+u*1.1).toFixed(1)+'k',tX+tw/2,Y-39,16,'#fff',600);}}
 else if(k==='cmdk'||k==='palette'){const typed='exp'.slice(0,[24.3,24.7,25.1].filter(x=>bt>=x).length);
  rr(-w/2+16,-h/2+16,44,32,8);ctx.fillStyle='#111';ctx.fill();txt('⌘K',-w/2+38,-h/2+33,15,'#fff',600);
  const ty=-h/2+32;if(typed)txt(typed,-w/2+76,ty,19,'#111',500,'left');else txt('Search commands…',-w/2+76,ty,19,'#a39e96',500,'left');
  ctx.font='500 19px '+FONT;const cw=ctx.measureText(typed).width;if(Math.floor(bt*2)%2===0||typed.length<3){ctx.fillStyle='#111';ctx.fillRect(-w/2+78+cw,ty-11,2,22);}
  if(k==='palette'){ctx.fillStyle='#e4e0d9';ctx.fillRect(-w/2,-h/2+64,w,1.5);const list=ITEMS.filter(s=>s.toLowerCase().includes(typed));
   list.slice(0,4).forEach((s,i)=>{const y=-h/2+100+i*46;if(i===0){rr(-w/2+10,y-20,w-20,40,10);ctx.fillStyle=bt>=25.8?'#111':'#efece7';ctx.fill();}
    txt(s,-w/2+28,y+1,17,i===0&&bt>=25.8?'#fff':'#111',500,'left');if(i===0)txt('↵',w/2-30,y+1,17,bt>=25.8?'#fff':'#8b8780',500);});}}
 else if(k==='toast'){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-w/2+32,0,11,0,7);ctx.fill();ctx.strokeStyle='#111';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(-w/2+27,0);ctx.lineTo(-w/2+31,4);ctx.lineTo(-w/2+37,-4);ctx.stroke();
  txt('Report exported',-w/2+54,1,18,'#fff',560,'left');txt('Undo',w/2-28,1,16,'#8a8a8a',560,'right');}
}
function draw(t){
 const bt=t/B;ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#ebe8e3';ctx.fillRect(0,0,1280,720);
 const z=anim(bt,KZ,1.6,0.85);let w=anim(bt,KW),h=anim(bt,KH),r=anim(bt,KR);const dk=cl(anim(bt,KD,3,0.9));
 const si=ST.findIndex((s,i)=>bt>=s[1]&&(i===ST.length-1||bt<ST[i+1][1]));
 if(ST[si][0]==='slider'){const v=volume(bt);w+=Math.max(0,v-1)*320;h-=Math.max(0,v-1)*14;}
 const pp=press(bt);let sc=1;if(cl(bt)>=0&&[0,1,4,5,12].includes(si)&&pp>0&&bt<30)sc=1-0.035*pp;if(si===12&&bt>28.6&&bt<29.6)sc*=1+0.02*Math.sin((bt-28.6)*Math.PI);
 ctx.setTransform(z*sc,0,0,z*sc,640,360);
 const g=Math.round(lerp(255,17,dk));ctx.shadowColor='rgba(40,30,20,0.12)';ctx.shadowBlur=30;ctx.shadowOffsetY=10;
 rr(-w/2,-h/2,w,h,r);ctx.fillStyle=`rgb(${g},${g},${g})`;ctx.fill();ctx.shadowColor='transparent';
 ctx.save();rr(-w/2,-h/2,w,h,r);ctx.clip();
 for(let i=Math.max(0,si-1);i<=si;i++){const s=ST[i],nx=i<ST.length-1?ST[i+1][1]:99;
  const ain=(i===0||i===ST.length-1&&false)?1:cl((bt-s[1]-0.08)/0.35),aout=cl((nx-bt)/0.18),a=Math.min(ain,aout);if(a<=0.01)continue;
  ctx.save();ctx.globalAlpha=a;const bl=(1-a)*6;if(bl>0.2)ctx.filter='blur('+bl.toFixed(1)+'px)';ctx.translate(0,(1-ain)*6);content(s[0],bt,w,h,dk>0.5);ctx.restore();}
 ctx.restore();
 // cursor in screen space
 const[cx,cy]=cur(bt);if(!(bt>23.4&&bt<26.6)){const X=640+cx*z*sc,Y=360+cy*z*sc,k=1-0.12*pp;ctx.setTransform(k*1.3,0,0,k*1.3,X,Y);
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,22);ctx.lineTo(6,16.5);ctx.lineTo(10,25);ctx.lineTo(13.5,23.5);ctx.lineTo(9.5,15.5);ctx.lineTo(17,15.5);ctx.closePath();
  ctx.fillStyle='#111';ctx.strokeStyle='#fff';ctx.lineWidth=1.6;ctx.lineJoin='round';ctx.fill();ctx.stroke();}
 if(bt>=23.4&&bt<26.6){ctx.setTransform(1,0,0,1,0,0);const a=cl((bt-23.6)/0.3)*cl((26.4-bt)/0.3);ctx.globalAlpha=a;
  const keys=[['E',24.3],['X',24.7],['P',25.1],['↵',25.8]];keys.forEach(([c,kb],i)=>{const on=cl(1-Math.abs(bt-kb-0.06)/0.25);const x=640-110+i*74,y=640+on*3;
   rr(x-28,y-28,56,52,12);ctx.fillStyle=on>0.3?'#111':'#fff';ctx.fill();txt(c,x,y-2,20,on>0.3?'#fff':'#111',600);});ctx.globalAlpha=1;}
}
const q=new URLSearchParams(location.search),off=parseFloat(q.get('t'))||0;let t0=null;
function frame(now){if(t0===null)t0=now;const t=((now-t0)/1000+off)%DUR;draw(t);requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script></body></html>
