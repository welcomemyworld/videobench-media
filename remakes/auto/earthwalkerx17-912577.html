<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Middle-earth — A Miniature Journey</title>
<style>
html,body{margin:0;background:#000;overflow:hidden;height:100%}
#st{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:0 0}
canvas{position:absolute;left:0;top:0;width:1280px;height:720px}
</style></head><body>
<div id="st"><canvas id="gl" width="1280" height="720"></canvas><canvas id="ov" width="1280" height="720"></canvas></div>
<script>
window.DUR=60;
const st=document.getElementById('st');
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);st.style.transform=`scale(${s}) translate(-50%,-50%)`;st.style.left='50%';st.style.top='50%';st.style.transform=`translate(-50%,-50%) scale(${s})`;st.style.transformOrigin='50% 50%';}
fit();addEventListener('resize',fit);
const gl=document.getElementById('gl').getContext('webgl',{preserveDrawingBuffer:true});
const ov=document.getElementById('ov').getContext('2d');
const VS=`attribute vec2 a;void main(){gl_Position=vec4(a,0,1);}`;
const FS=`precision highp float;
uniform vec2 R;uniform vec3 ro,ta,sd;uniform float T;
float hs(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float no(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hs(i),hs(i+vec2(1,0)),f.x),mix(hs(i+vec2(0,1)),hs(i+1.),f.x),f.y);}
float fbm(vec2 p,int o){float a=.5,s=0.;for(int i=0;i<7;i++){if(i>=o)break;s+=a*no(p);p=p*2.03+vec2(1.7,9.2);a*=.5;}return s;}
float H(vec2 p,int o){
 float b=fbm(p*.4,o);
 float rx=-1.+.35*sin(p.y*.6);
 float rg=exp(-pow((p.x-rx)*1.6,2.))*smoothstep(7.,4.,abs(p.y+.5));
 float h=b*1.2-.25+rg*(1.2+2.2*fbm(p*1.1+3.,o));
 vec2 c=vec2(5.5,4.);float d=length(p-c);
 h+=exp(-pow((d-2.6)*2.2,2.))*(1.+1.5*fbm(p*1.5,o));
 h=mix(h,.35+b*.3,smoothstep(2.3,1.8,d));
 h+=1.8*exp(-length(p-vec2(5.2,4.2))*2.2);
 h+=1.6*exp(-length(p-vec2(4.,-6.))*2.);
 h-=smoothstep(-6.5,-9.5,p.x)*1.6;
 h-=smoothstep(8.5,11.,length(p))*1.5;
 return h*.5;}
vec3 sky(vec3 rd,vec3 L,float day){
 float e=sd.y;
 vec3 zen=mix(vec3(.01,.015,.05),vec3(.18,.38,.75),day);
 vec3 hor=mix(vec3(.04,.05,.1),vec3(.65,.75,.9),day);
 hor=mix(hor,vec3(1.,.5,.25),exp(-abs(e)*8.)*.8);
 vec3 c=mix(hor,zen,pow(max(rd.y,0.),.5));
 float s=max(dot(rd,sd),0.);c+=vec3(1.,.8,.5)*pow(s,400.)*3.*step(-.05,e)+vec3(1.,.6,.3)*pow(s,8.)*.3*smoothstep(-.2,.1,e);
 float m=max(dot(rd,-sd),0.);c+=vec3(.8,.85,1.)*smoothstep(.9985,.999,m)*(1.-day);
 vec2 g=floor(rd.xz/(rd.y+.3)*120.);float st=step(.997,hs(g))*(1.-day)*smoothstep(0.,.2,rd.y);c+=st;
 return c;}
void main(){
 vec2 uv=(gl_FragCoord.xy-.5*R)/R.y;
 vec3 fw=normalize(ta-ro),rt=normalize(cross(fw,vec3(0,1,0))),up=cross(rt,fw);
 vec3 rd=normalize(uv.x*rt+uv.y*up+1.5*fw);
 float day=smoothstep(-.15,.25,sd.y);
 vec3 L=sd.y>-.05?sd:normalize(-sd+vec3(0,.3,0));
 vec3 lc=sd.y>-.05?mix(vec3(1.,.55,.3),vec3(1.,.95,.85),smoothstep(0.,.4,sd.y))*1.4:vec3(.25,.32,.5);
 float t=.05,h=0.;bool hit=false;vec3 p;
 for(int i=0;i<170;i++){p=ro+rd*t;h=max(H(p.xz,4),0.);float dy=p.y-h;if(dy<.002*t){hit=true;break;}t+=max(.004*t,dy*.45);if(t>40.)break;}
 vec3 col=sky(rd,L,day);
 if(hit){
  float th=H(p.xz,6);vec2 e=vec2(.01,0);
  vec3 n=normalize(vec3(H(p.xz-e.xy,6)-H(p.xz+e.xy,6),2.*e.x,H(p.xz-e.yx,6)-H(p.xz+e.yx,6)));
  vec3 alb;float md=length(p.xz-vec2(5.5,4.));
  if(th<=0.){n=normalize(vec3(.02*sin(p.x*40.+T),1.,.02*cos(p.z*37.+T*1.3)));alb=vec3(.03,.1,.16);}
  else{
   float fo=fbm(p.xz*2.5,4);
   alb=mix(vec3(.6,.55,.38),vec3(.25,.42,.15),smoothstep(.0,.04,th));
   alb=mix(alb,vec3(.07,.2,.07),smoothstep(.55,.65,fo)*smoothstep(.6,.3,th));
   alb=mix(alb,vec3(.38,.35,.32),smoothstep(.55,.75,1.-n.y)+smoothstep(.55,.8,th));
   alb=mix(alb,vec3(.95),smoothstep(1.,1.25,th+fo*.2)*step(.6,n.y));
   alb=mix(alb,vec3(.12,.09,.08),smoothstep(2.8,2.2,md));
  }
  float sh=1.;vec3 q=p+n*.01;float s=.02;
  for(int i=0;i<28;i++){vec3 r=q+L*s;float d=r.y-H(r.xz,4);sh=min(sh,12.*d/s);s+=max(.03,d*.5);if(sh<0.||s>6.)break;}
  sh=clamp(sh,0.,1.);
  float dif=max(dot(n,L),0.);
  col=alb*(lc*dif*sh+mix(vec3(.03,.04,.08),vec3(.25,.3,.4),day)*(.5+.5*n.y));
  if(th<=0.){vec3 rf=reflect(rd,n);col+=sky(rf,L,day)*.35+lc*pow(max(dot(rf,L),0.),60.)*sh;}
  float dd=length(p.xz-vec2(5.2,4.2));
  col+=vec3(1.,.3,.05)*smoothstep(.35,.0,dd)*(1.5+.5*sin(T*3.))*(1.2-day*.6);
  col+=vec3(.6,.1,.0)*smoothstep(2.3,.5,md)*fbm(p.xz*6.+T*.2,3)*.15*(1.-day);
  float f=1.-exp(-t*t*.0025);
  col=mix(col,sky(normalize(vec3(rd.x,.05,rd.z)),L,day),f);
 }
 col=pow(col/(1.+col),vec3(.85));col*=1.-.35*dot(uv,uv);
 gl_FragColor=vec4(col,1);}`;
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);return o}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);gl.useProgram(pr);
gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
const U=n=>gl.getUniformLocation(pr,n);
// JS terrain replica (GIS "bake")
const fr=x=>x-Math.floor(x);
const hs=(x,y)=>fr(Math.sin(x*127.1+y*311.7)*43758.5453);
function no(x,y){const ix=Math.floor(x),iy=Math.floor(y);let fx=x-ix,fy=y-iy;fx=fx*fx*(3-2*fx);fy=fy*fy*(3-2*fy);
const a=hs(ix,iy),b=hs(ix+1,iy),c=hs(ix,iy+1),d=hs(ix+1,iy+1);return (a+(b-a)*fx)+((c+(d-c)*fx)-(a+(b-a)*fx))*fy}
function fbm(x,y){let a=.5,s=0;for(let i=0;i<4;i++){s+=a*no(x,y);x=x*2.03+1.7;y=y*2.03+9.2;a*=.5}return s}
const ex=Math.exp,sm=(a,b,x)=>{let t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t)};
function H(x,y){const b=fbm(x*.4,y*.4);const rx=-1+.35*Math.sin(y*.6);
const rg=ex(-((x-rx)*1.6)**2)*sm(7,4,Math.abs(y+.5));
let h=b*1.2-.25+rg*(1.2+2.2*fbm(x*1.1+3,y*1.1+3));
const d=Math.hypot(x-5.5,y-4);h+=ex(-((d-2.6)*2.2)**2)*(1+1.5*fbm(x*1.5,y*1.5));
h=h+((.35+b*.3)-h)*sm(2.3,1.8,d);
h+=1.8*ex(-Math.hypot(x-5.2,y-4.2)*2.2);h+=1.6*ex(-Math.hypot(x-4,y+6)*2);
h-=sm(-6.5,-9.5,x)*1.6;h-=sm(8.5,11,Math.hypot(x,y))*1.5;return Math.max(h*.5,0)}
const LM=[["Grey Havens",-8.3,-3.4],["Hobbiton",-6,-3],["Bree",-4.2,-3.1],["Weathertop",-2.9,-2.8],["Rivendell",-1.7,-3.6],
["Erebor",4,-6],["Dale",4.3,-5.5],["Lake-town",4.5,-4.9],["Mirkwood",2.6,-3.2],["Dol Guldur",1.8,-1.6],["Moria",-1.1,-1.4],
["Lothlórien",0.4,-0.9],["Falls of Rauros",2.2,1.4],["Fangorn",-0.2,1.1],["Isengard",-1.3,1.7],["Helm's Deep",-0.7,2.5],
["Edoras",0.5,2.7],["Minas Tirith",1.9,4.1],["Osgiliath",2.6,4.0],["Dead Marshes",3.1,1.6],["Black Gate",4.4,1.5],
["Minas Morgul",3.3,4.3],["Barad-dûr",6.6,3.4],["Mount Doom",5.2,4.2]];
const N=LM.length;
function cr(a,b,c,d,u){return .5*(2*b+(c-a)*u+(2*a-5*b+4*c-d)*u*u+(3*b-a-3*c+d)*u*u*u)}
function path(s){const i=Math.floor(s),u=s-i,g=k=>LM[Math.max(0,Math.min(N-1,k))];
const A=g(i-1),B=g(i),C=g(i+1),D=g(i+2);return [cr(A[1],B[1],C[1],D[1],u),cr(A[2],B[2],C[2],D[2],u)]}
const lerp=(a,b,k)=>a+(b-a)*k,mix3=(a,b,k)=>a.map((v,i)=>lerp(v,b[i],k));
function camAt(t){
 const k=Math.min(1,Math.max(0,(t-4)/52))*(N-1);const i=Math.floor(k);let u=k-i;u=u-Math.sin(2*Math.PI*u)/(2*Math.PI)*.9;
 const [tx,tz]=path(Math.min(i+u,N-1));const ty=H(tx,tz)+.08;
 const a=t*.13+1.2,r=1.9;let cx=tx+Math.cos(a)*r,cz=tz+Math.sin(a)*r+0.6;let cy=Math.max(ty+.75,H(cx,cz)+.45);
 let ro=[cx,cy,cz],ta=[tx,ty,tz];
 const iA=sm(5.5,0,t),oA=sm(54,59.5,t);
 ro=mix3(ro,[-2+t*.6,5.5,11],iA);ta=mix3(ta,[0,0,-1],iA);
 ro=mix3(ro,[1-(t-54)*.3,6,13],oA);ta=mix3(ta,[1.5,0,0],oA);
 return {ro,ta,idx:Math.min(N-1,Math.round(i+u)),k}}
// Score (WebAudio, starts on user gesture)
let ac=null,nt=0,ci=0;const CH=[[50,57,62,66],[47,54,62,66],[43,50,59,62],[45,52,57,64],[50,57,62,69],[46,53,58,65],[48,55,60,64],[45,52,57,61]];
function startAudio(){if(ac)return;ac=new (window.AudioContext||window.webkitAudioContext)();nt=ac.currentTime+.1;}
addEventListener('click',startAudio);addEventListener('keydown',startAudio);
function score(){if(!ac)return;while(nt<ac.currentTime+1){const c=CH[ci%CH.length];ci++;
 c.forEach((m,j)=>{const f=440*Math.pow(2,(m-69)/12);for(const tp of ['sawtooth','sine']){const o=ac.createOscillator(),g=ac.createGain(),lp=ac.createBiquadFilter();
 o.type=tp;o.frequency.value=f*(tp=='sine'?2:1);o.detune.value=(j-1.5)*4;lp.type='lowpass';lp.frequency.value=900;
 g.gain.setValueAtTime(0,nt);g.gain.linearRampToValueAtTime(tp=='sine'?.02:.025,nt+1.2);g.gain.linearRampToValueAtTime(0,nt+4.2);
 o.connect(lp);lp.connect(g);g.connect(ac.destination);o.start(nt);o.stop(nt+4.3)}});
 const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=440*Math.pow(2,(c[0]-12-69)/12);
 g.gain.setValueAtTime(.06,nt);g.gain.exponentialRampToValueAtTime(.001,nt+3.5);o.connect(g);g.connect(ac.destination);o.start(nt);o.stop(nt+3.6);
 nt+=3.5}}
const t0=parseFloat(new URLSearchParams(location.search).get('t'))||0;let start=null;
function proj(P,c){const fw=norm(sub(c.ta,c.ro)),rt=norm(cross(fw,[0,1,0])),up=cross(rt,fw),v=sub(P,c.ro),z=dot(v,fw);
 if(z<.2)return null;return [640+dot(v,rt)/z*1.5*720,360-dot(v,up)/z*1.5*720,z]}
const sub=(a,b)=>a.map((v,i)=>v-b[i]),dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],norm=a=>{const l=Math.hypot(...a);return a.map(v=>v/l)},
cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
function txt(s,x,y,sz,a,al){ov.font=`${sz}px Georgia, 'Times New Roman', serif`;ov.textAlign=al||'left';ov.fillStyle=`rgba(0,0,0,${a*.6})`;ov.fillText(s,x+2,y+2);ov.fillStyle=`rgba(245,232,200,${a})`;ov.fillText(s,x,y)}
function frame(now){
 if(start===null)start=now;const t=((now-start)/1000+t0)%window.DUR;
 const c=camAt(t);const ph=2*Math.PI*t/window.DUR;const el=Math.cos(ph)*.75+.12;
 const sd=norm([Math.sin(ph)*.8+.3,el,-.5]);
 gl.viewport(0,0,1280,720);gl.uniform2f(U('R'),1280,720);gl.uniform3fv(U('ro'),c.ro);gl.uniform3fv(U('ta'),c.ta);gl.uniform3fv(U('sd'),sd);gl.uniform1f(U('T'),t);
 gl.drawArrays(gl.TRIANGLES,0,3);
 ov.clearRect(0,0,1280,720);
 const nightK=1-sm(-.15,.25,sd[1]);
 LM.forEach((L,i)=>{const y=H(L[1],L[2]);const p=proj([L[1],y,L[2]],c);if(!p||p[0]<-50||p[0]>1330||p[1]<-50||p[1]>770)return;
  const a=Math.max(0,Math.min(1,(9-p[2])/4))*(i==c.idx?1:.75);if(a<=0)return;
  const top=proj([L[1],y+.25,L[2]],c);const s=Math.max(2,10/p[2]);
  const gr=ov.createLinearGradient(p[0],p[1],top?top[0]:p[0],top?top[1]:p[1]-40);gr.addColorStop(0,`rgba(255,210,130,${a*.8})`);gr.addColorStop(1,'rgba(255,210,130,0)');
  ov.strokeStyle=gr;ov.lineWidth=Math.max(1,s*.4);ov.beginPath();ov.moveTo(p[0],p[1]);ov.lineTo(top?top[0]:p[0],top?top[1]:p[1]-40);ov.stroke();
  const col=i==22?'255,80,20':'255,220,150';const rg=ov.createRadialGradient(p[0],p[1],0,p[0],p[1],s*3);rg.addColorStop(0,`rgba(${col},${a})`);rg.addColorStop(1,`rgba(${col},0)`);
  ov.fillStyle=rg;ov.beginPath();ov.arc(p[0],p[1],s*3,0,7);ov.fill();
  if(i==22){const ey=proj([L[1],y+.35,L[2]],c);if(ey){ov.fillStyle=`rgba(255,${120+60*Math.sin(t*4)},20,${a*(.4+nightK*.6)})`;ov.beginPath();ov.ellipse(ey[0],ey[1],s*2.2,s*.9,0,0,7);ov.fill();ov.fillStyle='rgba(0,0,0,.8)';ov.fillRect(ey[0]-s*.2,ey[1]-s*.8,s*.4,s*1.6)}}
  if(top&&p[2]<7)txt(L[0],top[0],top[1]-6,Math.round(Math.min(22,Math.max(12,40/p[2]))),a*.9,'center')});
 const inT=t>4.5&&t<55.5?1:0;
 if(inT){const L=LM[c.idx],fk=c.k-Math.round(c.k);const fa=Math.max(0,1-Math.abs(fk)*2.6);
  ov.fillStyle=`rgba(0,0,0,${.35*fa})`;ov.fillRect(50,600,520,80);
  txt(String(c.idx+1).padStart(2,'0')+' / 24',70,628,16,fa*.8);txt(L[0],70,664,34,fa);
  ov.fillStyle=`rgba(245,232,200,.5)`;ov.fillRect(70,700,1140*(c.k/(N-1)),2);}
 const ia=sm(0,1,t)*sm(4.5,3,t);if(ia>0){txt('MIDDLE-EARTH',640,330,64,ia,'center');txt('A Miniature Journey · Twenty-four Landmarks',640,375,22,ia*.85,'center');}
 const oa=sm(55.5,57,t)*sm(60,59.2,t);if(oa>0){txt('There and Back Again',640,340,48,oa,'center');txt('procedurally baked terrain · real-time light · original score',640,380,18,oa*.75,'center')}
 if(!ac&&t<3){txt('click for score',1210,40,14,.5,'right')}
 const fd=Math.max(sm(.6,0,t),sm(59.4,60,t));if(fd>0){ov.fillStyle=`rgba(0,0,0,${fd})`;ov.fillRect(0,0,1280,720)}
 score();requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script></body></html>
