<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#000;height:100%;overflow:hidden}
canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#000}
</style></head><body><canvas id="c" width="1280" height="720"></canvas><script>
// A cat tries to knock a glass off a table. Escalation ensues.
window.DUR=24;
const c=document.getElementById('c'),x=c.getContext('2d');
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);c.style.width=1280*s+'px';c.style.height=720*s+'px'}
addEventListener('resize',fit);fit();
const off=parseFloat(new URLSearchParams(location.search).get('t'))||0;
const t0=performance.now()-off*1000;
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),E=v=>v<.5?2*v*v:1-Math.pow(-2*v+2,2)/2;
const seg=(t,a,b)=>cl((t-a)/(b-a));
function caption(s,sub){x.font='bold 40px sans-serif';x.textAlign='center';const w=x.measureText(s).width+40;
x.fillStyle='rgba(0,0,0,.6)';x.fillRect(640-w/2,630,w,60);x.fillStyle='#fff';x.fillText(s,640,673);
if(sub){x.font='italic 22px sans-serif';x.fillStyle='#ffd';x.fillText(sub,640,620)}}
function room(shake){x.fillStyle='#e9d8b4';x.fillRect(0,0,1280,720);
x.fillStyle='#d6c29a';for(let i=0;i<1280;i+=80)x.fillRect(i,0,40,520);
x.fillStyle='#8a5a34';x.fillRect(0,520,1280,200);
// window
x.fillStyle='#9fd3ff';x.fillRect(900,90,240,200);x.strokeStyle='#fff';x.lineWidth=10;x.strokeRect(900,90,240,200);
x.beginPath();x.moveTo(1020,90);x.lineTo(1020,290);x.moveTo(900,190);x.lineTo(1140,190);x.stroke();
// table
x.fillStyle='#6b3f1f';x.fillRect(300,400,500,24);x.fillRect(330,424,24,140);x.fillRect(746,424,24,140)}
function glass(gx,gy,rot,broken){x.save();x.translate(gx,gy);x.rotate(rot);
if(broken){x.fillStyle='rgba(180,230,255,.8)';for(let i=0;i<9;i++){x.beginPath();x.moveTo(i*14-60,0);x.lineTo(i*14-52,-12+(i%3)*4);x.lineTo(i*14-44,0);x.fill()}x.restore();return}
x.fillStyle='rgba(180,230,255,.7)';x.strokeStyle='#fff';x.lineWidth=3;
x.beginPath();x.moveTo(-22,-70);x.lineTo(22,-70);x.lineTo(16,0);x.lineTo(-16,0);x.closePath();x.fill();x.stroke();
x.fillStyle='rgba(80,160,255,.6)';x.fillRect(-18,-40,36,38);x.restore()}
function cat(cx,cy,paw,eyes,tail,s=1){x.save();x.translate(cx,cy);x.scale(s,s);
x.fillStyle='#f39a3c';x.strokeStyle='#222';x.lineWidth=4;
// tail
x.beginPath();x.moveTo(-60,-20);x.quadraticCurveTo(-130,-40+Math.sin(tail)*30,-110,-120+Math.sin(tail*1.3)*20);x.lineWidth=16;x.strokeStyle='#f39a3c';x.stroke();
x.lineWidth=4;x.strokeStyle='#222';
x.beginPath();x.ellipse(0,-40,75,50,0,0,7);x.fill();x.stroke();
// paw
x.save();x.translate(55,-50);x.rotate(-paw);x.beginPath();x.ellipse(40,0,42,13,0,0,7);x.fill();x.stroke();x.restore();
// head
x.beginPath();x.arc(30,-110,48,0,7);x.fill();x.stroke();
[[0,-145],[55,-145]].forEach(([a,b])=>{x.beginPath();x.moveTo(a-10+5,b+10);x.lineTo(a+5,b-30);x.lineTo(a+25,b+5);x.fill();x.stroke()});
x.fillStyle='#fff';x.beginPath();x.arc(15,-115,13,0,7);x.arc(50,-115,13,0,7);x.fill();
x.fillStyle='#111';const ey=eyes==='slit'?[3,11]:eyes==='big'?[10,10]:[6,9];
x.beginPath();x.ellipse(18,-115,ey[0],ey[1],0,0,7);x.ellipse(53,-115,ey[0],ey[1],0,0,7);x.fill();
x.fillStyle='#e66';x.beginPath();x.moveTo(30,-98);x.lineTo(38,-98);x.lineTo(34,-93);x.fill();x.restore()}
function human(hx,mood){x.save();x.translate(hx,0);x.fillStyle='#3a6fd8';x.fillRect(-40,300,80,180);
x.fillStyle='#333';x.fillRect(-35,480,30,100);x.fillRect(5,480,30,100);
x.fillStyle='#f2c49b';x.beginPath();x.arc(0,260,45,0,7);x.fill();
x.fillStyle='#111';x.fillRect(-18,250,8,mood===2?14:8);x.fillRect(10,250,8,mood===2?14:8);
x.beginPath();if(mood===2)x.arc(0,290,10,0,7);else x.arc(0,283,12,0,Math.PI);x.fill();x.restore()}
function bubble(s,bx,by){x.font='bold 30px sans-serif';const w=x.measureText(s).width+30;
x.fillStyle='#fff';x.strokeStyle='#000';x.lineWidth=3;x.beginPath();x.roundRect(bx-w/2,by-50,w,56,16);x.fill();x.stroke();
x.fillStyle='#000';x.textAlign='center';x.fillText(s,bx,by-12)}
function frame(){let t=((performance.now()-t0)/1000)%DUR;
x.save();let sh=0;if(t>14&&t<15.2)sh=(1-(t-14)/1.2)*20;x.translate((Math.random()-.5)*sh,(Math.random()-.5)*sh);
room();const tl=t*3;
let gx=600,gy=400,gr=0,br=false,paw=0,eyes='',cx=420,cs=1;
if(t<3){caption('Chapter 1: The Glass','A cat. A glass. A dream.');paw=0}
else if(t<6){caption('*tap*');paw=Math.sin(seg(t,3,6)*Math.PI*4)*.3;gx=600+seg(t,3,6)*40;eyes='slit'}
else if(t<9){caption('Wait. A human approaches.');human(1050-E(seg(t,6,8))*80,0);eyes='big';paw=.1;gx=640;bubble('Good kitty!',970,190)}
else if(t<12){human(970,0);gx=640;eyes='';caption('*maintains eye contact*');paw=E(seg(t,9.5,11.5))*.5;gx=640+E(seg(t,10,11.8))*40;bubble('...don\'t.',970,190)}
else if(t<14){human(970,2);eyes='slit';paw=.6;const f=seg(t,12,13.4);gx=680+f*90;gy=400+f*f*190;gr=f*4;if(f>=1){br=true;gy=595}caption('Gravity: confirmed.')}
else if(t<17){human(970,2);gx=770;gy=595;br=true;eyes='big';paw=0;caption('Chapter 2: Escalation');bubble('MY GRANDMA\'S GLASS!',900,190)}
else if(t<21){gx=770;gy=595;br=true;const f=seg(t,17,21);caption('Cat has found... the TV.');
x.fillStyle='#222';x.fillRect(560,250,180,150);x.fillStyle='#4af';x.fillRect(570,260,160,120);
human(970,2);paw=Math.sin(f*Math.PI*6)*.4;cx=420;eyes='slit';cs=1}
else{gx=770;gy=595;br=true;const f=seg(t,21,24);eyes='';cs=1;
caption('No regrets. 😼');x.fillStyle='#fff';x.font='bold 26px sans-serif';x.textAlign='center';x.fillText('THE END (of the glass)',640,80)}
glass(gx,gy,gr,br);cat(cx,400,paw,eyes,tl,cs);
if(t>12.8&&t<13.8){x.fillStyle='#ff0';x.font='bold 90px sans-serif';x.textAlign='center';x.fillText('CRASH!',780,520)}
x.restore();
// letterbox
x.fillStyle='#000';x.fillRect(0,0,1280,20);x.fillRect(0,700,1280,20);
requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script></body></html>
