<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Beret Blob</title>
<style>
html,body{margin:0;background:#000;height:100%;overflow:hidden}
#s{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:0 0}
canvas{display:block}
</style></head><body>
<div id="s"><canvas id="c" width="1280" height="720"></canvas></div>
<script>
window.DUR=30;
const cv=document.getElementById('c'),x=cv.getContext('2d'),st=document.getElementById('s');
function fit(){const k=Math.min(innerWidth/1280,innerHeight/720);st.style.transform=`scale(${k}) translate(-50%,-50%)`;st.style.left='50%';st.style.top='50%';st.style.transform=`translate(-50%,-50%) scale(${k})`;st.style.transformOrigin='50% 50%';}
addEventListener('resize',fit);fit();
const q=new URLSearchParams(location.search);const t0=parseFloat(q.get('t')||0)||0;const start=performance.now();
let mouse=null,mT=-99;
addEventListener('mousemove',e=>{const r=cv.getBoundingClientRect();mouse={x:(e.clientX-r.left)/r.width*1280,y:(e.clientY-r.top)/r.height*720};mT=performance.now();});
// felt noise texture
function feltTex(col,n){const c=document.createElement('canvas');c.width=c.height=512;const g=c.getContext('2d');g.fillStyle=col;g.fillRect(0,0,512,512);
let s=7;const R=()=>(s=(s*16807)%2147483647)/2147483647;
for(let i=0;i<n;i++){const a=R()*6.28,l=2+R()*7,px=R()*512,py=R()*512;const v=R();g.strokeStyle=v<.5?`rgba(255,255,255,${.04+R()*.08})`:`rgba(0,0,30,${.05+R()*.1})`;g.lineWidth=.6+R()*.8;g.beginPath();g.moveTo(px,py);g.quadraticCurveTo(px+Math.cos(a+1)*l*.5,py+Math.sin(a+1)*l*.5,px+Math.cos(a)*l,py+Math.sin(a)*l);g.stroke();}
return x.createPattern(c,'repeat');}
const bodyPat=feltTex('#f2ead8',26000),beretPat=feltTex('#2f5fd0',22000),bgPat=feltTex('#e9c9a8',14000);
// fuzz offsets
const fuzz=[];for(let i=0;i<260;i++)fuzz.push([Math.random()*6.283,Math.random(),Math.random()]);
// springs
const sp={hx:640,hy:0,vx:0,vy:0,ba:0,bva:0,bx:0,by:0,bvx:0,bvy:0,lx:0,ly:0};
let last=null;
function hop(t){ // hop events every ~5s
const p=t%5;if(p>3.2&&p<4.3){const u=(p-3.2)/1.1;return{h:Math.sin(u*Math.PI)*120,u};}return{h:0,u:-1};}
function blob(cx,cy,w,h,wob,t){x.beginPath();for(let i=0;i<=64;i++){const a=i/64*6.283;const r=1+wob*Math.sin(a*3+t*2)*.5+wob*Math.sin(a*5-t*1.3)*.3;const px=cx+Math.cos(a)*w*r,py=cy+Math.sin(a)*h*r*(Math.sin(a)>0?.92:1.04);i?x.lineTo(px,py):x.moveTo(px,py);}x.closePath();}
function frame(){const now=performance.now();let T=(now-start)/1000+t0;const t=T%DUR;const dt=last==null?1/60:Math.min(.05,(now-last)/1000);last=now;
// bg
x.fillStyle=bgPat;x.fillRect(0,0,1280,720);
const vg=x.createRadialGradient(640,360,200,640,360,800);vg.addColorStop(0,'rgba(255,240,220,0)');vg.addColorStop(1,'rgba(80,30,10,.55)');x.fillStyle=vg;x.fillRect(0,0,1280,720);
// floor
x.fillStyle='rgba(120,60,30,.18)';x.fillRect(0,560,1280,160);
// target: wander + mouse
const autoM={x:640+Math.sin(t*.45)*330,y:300+Math.sin(t*.73)*140};
const M=(now-mT<2500&&mouse)?mouse:autoM;
const H=hop(t);const breath=Math.sin(t*2.1);
let sq=0;// squash anticipation & landing
const p=t%5;if(p>2.9&&p<3.2)sq=Math.sin((p-2.9)/.3*Math.PI)*.18;if(p>4.3&&p<4.8)sq=Math.sin((p-4.3)/.5*Math.PI)*.22*Math.exp(-(p-4.3)*2);
let stretch=H.u>=0?Math.cos(H.u*Math.PI)*.15:0;
const sx=1+sq-stretch*.6+breath*.02, sy=1-sq+stretch+breath*.035;
// lean toward mouse
const tx=640+(M.x-640)*.08;
sp.vx+=((tx-sp.hx)*30-sp.vx*6)*dt;sp.hx+=sp.vx*dt;
const lean=Math.max(-.25,Math.min(.25,(M.x-sp.hx)/1500))+sp.vx*.0015;
const W=170,Hh=150,base=560;const cx=sp.hx,cyB=base-H.h;
const cy=cyB-Hh*sy;
// shadow
const sh=1-H.h/250;x.fillStyle=`rgba(60,20,10,${.35*sh})`;x.beginPath();x.ellipse(cx,base+6,W*sx*sh*1.05,22*sh,0,0,7);x.fill();
x.save();x.translate(cx,cyB);x.rotate(lean);x.translate(-cx,-cyB);
// body
const bw=W*sx,bh=Hh*sy;
x.save();blob(cx,cy,bw,bh,.025,t);x.fillStyle=bodyPat;x.fill();x.clip();
const sg=x.createRadialGradient(cx-bw*.35,cy-bh*.45,10,cx,cy,bw*1.3);sg.addColorStop(0,'rgba(255,255,250,.35)');sg.addColorStop(.6,'rgba(0,0,0,0)');sg.addColorStop(1,'rgba(90,50,40,.45)');x.fillStyle=sg;x.fillRect(cx-300,cy-300,600,600);
x.restore();
// fuzz rim
x.strokeStyle='rgba(240,230,215,.55)';x.lineWidth=1;
for(const f of fuzz){const a=f[0];const r=1+.025*Math.sin(a*3+t*2)*.5;const px=cx+Math.cos(a)*bw*r,py=cy+Math.sin(a)*bh*r*(Math.sin(a)>0?.92:1.04);const l=3+f[1]*5;const aa=a+(f[2]-.5)*.8;x.beginPath();x.moveTo(px-Math.cos(a)*2,py-Math.sin(a)*2);x.lineTo(px+Math.cos(aa)*l,py+Math.sin(aa)*l);x.stroke();}
// cheeks
x.fillStyle='rgba(240,120,110,.25)';for(const s of[-1,1]){x.beginPath();x.ellipse(cx+s*bw*.5,cy+bh*.15,26,14,0,0,7);x.fill();}
// eyes look
const ex=Math.max(-1,Math.min(1,(M.x-cx)/400)),ey=Math.max(-1,Math.min(1,(M.y-cy)/300));
sp.lx+=(ex-sp.lx)*Math.min(1,dt*8);sp.ly+=(ey-sp.ly)*Math.min(1,dt*8);
// blink
const bt=[1.2,4.1,4.4,7.6,10.3,13.9,16.2,16.5,19.8,23.1,26,28.7];let bl=1;for(const b of bt){const d=t-b;if(d>0&&d<.18)bl=Math.abs(d-.09)/.09;}
if(sq>.12)bl=Math.min(bl,.3);
for(const s of[-1,1]){const exx=cx+s*bw*.3+sp.lx*14,eyy=cy-bh*.05+sp.ly*10;const er=17;
x.fillStyle='#1a1410';x.beginPath();x.ellipse(exx,eyy,er*.8,Math.max(1.5,er*bl),0,0,7);x.fill();
if(bl>.4){x.fillStyle='rgba(255,255,255,.85)';x.beginPath();x.arc(exx-4,eyy-6*bl,4,0,7);x.fill();}}
// mouth
const mo=H.u>=0?8:2+Math.max(0,breath)*2;x.strokeStyle='#3a2018';x.lineWidth=3.5;x.lineCap='round';
x.beginPath();x.moveTo(cx-14+sp.lx*12,cy+bh*.22+sp.ly*6);x.quadraticCurveTo(cx+sp.lx*12,cy+bh*.22+mo+6+sp.ly*6,cx+14+sp.lx*12,cy+bh*.22+sp.ly*6);x.stroke();
// beret lagging spring
const topX=cx,topY=cy-bh*.88;
if(!sp.binit){sp.bx=topX;sp.by=topY;sp.binit=1;}
sp.bvx+=((topX-sp.bx)*120-sp.bvx*9)*dt;sp.bvy+=((topY-sp.by)*120-sp.bvy*9)*dt;sp.bx+=sp.bvx*dt;sp.by+=sp.bvy*dt;
const tA=-.22-lean*.6+(sp.bx-topX)*.006;sp.bva+=((tA-sp.ba)*90-sp.bva*7)*dt;sp.ba+=sp.bva*dt;
x.save();x.translate(sp.bx,sp.by);x.rotate(sp.ba);
const rw=bw*.82;
x.fillStyle='rgba(40,20,10,.25)';x.beginPath();x.ellipse(4,14,rw*.9,22,0,0,7);x.fill();
x.beginPath();x.moveTo(-rw*.85,10);x.bezierCurveTo(-rw*1.1,-40,-rw*.4,-78,rw*.15,-70);x.bezierCurveTo(rw*.8,-62,rw*1.15,-20,rw*.9,8);x.quadraticCurveTo(0,26,-rw*.85,10);x.closePath();
x.fillStyle=beretPat;x.fill();
const bg=x.createLinearGradient(0,-70,0,20);bg.addColorStop(0,'rgba(255,255,255,.18)');bg.addColorStop(1,'rgba(0,0,40,.4)');x.fillStyle=bg;x.fill();
x.strokeStyle='rgba(20,40,120,.6)';x.lineWidth=4;x.beginPath();x.moveTo(-rw*.8,9);x.quadraticCurveTo(0,24,rw*.88,7);x.stroke();
// stalk
x.strokeStyle='#22408f';x.lineWidth=6;x.beginPath();x.moveTo(-rw*.05,-70);x.quadraticCurveTo(-rw*.05+Math.sin(t*3)*3,-86,rw*.05,-90);x.stroke();
x.restore();
x.restore();
// grain overlay
x.fillStyle='rgba(0,0,0,.04)';for(let i=0;i<300;i++)x.fillRect(Math.random()*1280,Math.random()*720,1,1);
requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script></body></html>
