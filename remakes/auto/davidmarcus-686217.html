<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>@lightspark — Money at the speed of light</title>
<style>
html,body{margin:0;background:#000;height:100%;overflow:hidden}
#s{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:0 0}
canvas{display:block;width:1280px;height:720px}
#tap{position:absolute;right:16px;bottom:12px;color:#fff6;font:13px system-ui;cursor:pointer}
</style>
</head>
<body>
<div id="s"><canvas id="c" width="1280" height="720"></canvas><div id="tap">🔊 click for sound</div></div>
<script>
window.DUR=30;
const W=1280,H=720,cv=document.getElementById('c'),x=cv.getContext('2d'),st=document.getElementById('s');
function fit(){const k=Math.min(innerWidth/W,innerHeight/H);st.style.transform=`scale(${k}) translate(-50%,-50%)`;st.style.transformOrigin='0 0';st.style.left='50%';st.style.top='50%';st.style.transform=`translate(-50%,-50%) scale(${k})`;st.style.transformOrigin='center';}
addEventListener('resize',fit);fit();
const q=new URLSearchParams(location.search),T0=parseFloat(q.get('t')||0)||0,start=performance.now();
const GOLD='#FFC21A',ORA='#FF7A00';
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),eo=t=>1-Math.pow(1-cl(t),3),eb=t=>{t=cl(t);const c=1.9;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const P=[...Array(140)].map(()=>({x:rnd()*W,y:rnd()*H,z:rnd()*0.9+0.1}));
const CITIES=[...Array(14)].map(()=>({a:rnd()*6.28,b:(rnd()-.5)*2.2}));
// ---------- AUDIO ----------
let ac=null,master,lastB=-1,audioOff=0;
function initAudio(){if(ac){ac.resume();return}try{ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=.7;const comp=ac.createDynamicsCompressor();master.connect(comp);comp.connect(ac.destination);document.getElementById('tap').style.display='none';}catch(e){}}
addEventListener('pointerdown',initAudio);addEventListener('keydown',initAudio);initAudio();
function env(g,t,a,d,v){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+d)}
function kick(t){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.15);env(g,t,.002,.35,1);o.connect(g).connect(master);o.start(t);o.stop(t+.4)}
let nb=null;function noise(t,d,f,v,type='highpass'){if(!nb){nb=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const a=nb.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}const s=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain();s.buffer=nb;fl.type=type;fl.frequency.value=f;env(g,t,.002,d,v);s.connect(fl).connect(g).connect(master);s.start(t);s.stop(t+d+.05)}
function bass(t,n,d){const o=ac.createOscillator(),fl=ac.createBiquadFilter(),g=ac.createGain();o.type='sawtooth';o.frequency.value=55*Math.pow(2,n/12);fl.type='lowpass';fl.frequency.setValueAtTime(900,t);fl.frequency.exponentialRampToValueAtTime(120,t+d);env(g,t,.005,d,.35);o.connect(fl).connect(g).connect(master);o.start(t);o.stop(t+d+.05)}
function zap(t){const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.setValueAtTime(2400,t);o.frequency.exponentialRampToValueAtTime(200,t+.25);env(g,t,.002,.25,.15);o.connect(g).connect(master);o.start(t);o.stop(t+.3);noise(t,.5,3000,.3)}
function pad(t,ns,d){ns.forEach(n=>{const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=220*Math.pow(2,n/12);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(.06,t+.3);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g).connect(master);o.start(t);o.stop(t+d)})}
const BPM=128,SPB=60/BPM/2; // eighth notes
const PROG=[0,0,-4,-4,3,3,-2,-2];const HITS=[0,4.0,9.0,15.0,21.0,26.0];
function audio(t){if(!ac||ac.state!=='running')return;const s=Math.floor(t/SPB);if(lastB<0||s<lastB-1||s>lastB+8)lastB=s-1;
 while(lastB<Math.floor((t+.15)/SPB)){lastB++;const bt=lastB*SPB;if(bt>=DUR)break;const when=ac.currentTime+(bt-t);if(when<ac.currentTime-.01)continue;
  const step=lastB%8,bar=Math.floor(lastB/8),intro=bt<4,outro=bt>28.5;
  if(!outro){if(!intro&&step%2==0)kick(when);if(intro&&step==0)kick(when);
   if(!intro&&step%2==1)noise(when,.05,8000,.15);if(!intro&&(step==2||step==6))noise(when,.18,1500,.35,'bandpass');
   if(!intro)bass(when,PROG[bar%8]+(step%4==3?12:0),SPB*.9);
   if(step==0&&bar%2==0)pad(when,[0,3,7,10].map(n=>n+PROG[bar%8]),SPB*16);}
  HITS.forEach(h=>{if(Math.abs(bt-h)<SPB/2)zap(when)})}}
// ---------- DRAW HELPERS ----------
function txt(s,X,Y,sz,col,a=1,w=800,al='center'){x.globalAlpha=cl(a);x.fillStyle=col;x.font=`${w} ${sz}px "Helvetica Neue",Arial,sans-serif`;x.textAlign=al;x.textBaseline='middle';x.fillText(s,X,Y);x.globalAlpha=1}
function bolt(X,Y,s,col){x.save();x.translate(X,Y);x.scale(s,s);x.beginPath();x.moveTo(10,-50);x.lineTo(-22,6);x.lineTo(0,6);x.lineTo(-10,50);x.lineTo(24,-8);x.lineTo(2,-8);x.closePath();x.fillStyle=col;x.shadowColor=GOLD;x.shadowBlur=30;x.fill();x.restore()}
function lightning(x1,y1,x2,y2,sd,a){let s=sd;const r=()=>(s=(s*9301+49297)%233280)/233280;const pts=[[x1,y1]];const n=14;for(let i=1;i<n;i++){const k=i/n;pts.push([x1+(x2-x1)*k+(r()-.5)*40,y1+(y2-y1)*k+(r()-.5)*40])}pts.push([x2,y2]);
 x.save();x.globalAlpha=a;x.strokeStyle='#fff';x.shadowColor=GOLD;x.shadowBlur=20;x.lineWidth=2.5;x.beginPath();pts.forEach((p,i)=>i?x.lineTo(...p):x.moveTo(...p));x.stroke();x.restore()}
function win(t,a,b,f=.4){return cl(Math.min((t-a)/f,(b-t)/f))}
function wipe(t,a){// punchy transition bar
 const k=(t-a)/.35;if(k<0||k>1)return;x.fillStyle=GOLD;const w=W*1.4;const p=-w+k*(W+w*1.5);x.save();x.transform(1,0,-.35,1,0,0);x.fillRect(p+H*.35,0,w*.35,H);x.restore()}
// ---------- SCENES ----------
function bg(t){const g=x.createRadialGradient(W/2,H/2,50,W/2,H/2,800);g.addColorStop(0,'#1a1206');g.addColorStop(1,'#000');x.fillStyle=g;x.fillRect(0,0,W,H);
 x.strokeStyle='rgba(255,194,26,0.07)';x.lineWidth=1;const o=(t*60)%60;for(let i=-1;i<24;i++){x.beginPath();x.moveTo(i*60-o,0);x.lineTo(i*60-o,H);x.stroke()}for(let j=0;j<13;j++){x.beginPath();x.moveTo(0,j*60);x.lineTo(W,j*60);x.stroke()}
 P.forEach(p=>{const px=(p.x-t*200*p.z)%W,py=p.y;x.fillStyle=`rgba(255,${180+p.z*70|0},80,${p.z*.6})`;x.fillRect((px+W)%W,py,2+p.z*30,1.5)})}
function s1(t){// logo
 const k=eb(t/.8);if(t<.3){x.fillStyle=`rgba(255,255,255,${1-t/.3})`;x.fillRect(0,0,W,H)}
 lightning(W/2,-20,W/2,H/2-40,Math.floor(t*12)+1,cl(1-t*1.5));
 bolt(W/2-210,H/2,1.3*k,GOLD);
 x.save();x.beginPath();x.rect(W/2-170,H/2-60,eo((t-.4)/.6)*700,120);x.clip();txt('@lightspark',W/2-160,H/2,92,'#fff',1,900,'left');x.restore();
 txt('THE FUTURE OF MONEY MOVEMENT',W/2,H/2+95,22,GOLD,eo((t-1.3)/.5),700)}
function s2(t){// speed of light
 for(let i=0;i<3;i++)if(((t*3+i*.37)%1)<.25)lightning(rnd()*W,0,rnd()*W,H,Math.floor(t*20)+i*99,.6);
 const l1=eo(t/.5),l2=eo((t-.35)/.5),l3=eb((t-.8)/.6);
 txt('Move money',W/2-(1-l1)*300,H/2-110,84,'#fff',l1,900);
 txt('at the speed',W/2+(1-l2)*300,H/2-15,84,'#fff',l2,900);
 x.save();x.translate(W/2,H/2+95);x.scale(l3,l3);x.shadowColor=GOLD;x.shadowBlur=40;txt('of light.',0,0,96,GOLD,1,900);x.restore()}
function s3(t){// instant global 24/7 + globe
 const R=210,cx=W/2,cy=H/2+20,rot=t*.6;x.save();x.globalAlpha=.9;x.strokeStyle='rgba(255,194,26,.25)';x.lineWidth=1;
 for(let i=0;i<8;i++){x.beginPath();x.ellipse(cx,cy,Math.abs(Math.cos(rot+i*.39))*R,R,0,0,6.29);x.stroke()}for(let j=-3;j<=3;j++){const yy=cy+j*R/4,rr=Math.sqrt(R*R-(j*R/4)**2);x.beginPath();x.ellipse(cx,yy,rr,rr*.12,0,0,6.29);x.stroke()}
 const pts=CITIES.map(c=>{const a=c.a+rot,z=Math.cos(a);return{X:cx+Math.sin(a)*R*Math.cos(c.b/2),Y:cy+Math.sin(c.b/2)*R,z}});
 pts.forEach((p,i)=>{if(p.z<0)return;x.fillStyle=GOLD;x.shadowColor=GOLD;x.shadowBlur=15;x.beginPath();x.arc(p.X,p.Y,4,0,7);x.fill();
  const q2=pts[(i+5)%pts.length];if(q2.z>0){const ph=(t*1.5+i*.3)%1;x.strokeStyle=`rgba(255,220,120,${.7*(1-ph)})`;x.lineWidth=2;x.beginPath();x.moveTo(p.X,p.Y);x.quadraticCurveTo((p.X+q2.X)/2,(p.Y+q2.Y)/2-90,q2.X,q2.Y);x.stroke()}});
 x.restore();x.fillStyle='rgba(0,0,0,.45)';x.fillRect(0,0,W,H);
 const words=['INSTANT.','GLOBAL.','24/7.'];words.forEach((w,i)=>{const k=eb((t-i*.9)/.45);if(k<=0)return;x.save();x.translate(W/2,H/2-150+i*150);x.scale(.6+k*.4,.6+k*.4);txt(w,0,0,110,i==1?GOLD:'#fff',cl(k),900);x.restore()})}
function s4(t){// payment demo
 const pw=520,ph=380,px=W/2-pw/2,py=H/2-ph/2+10,k=eo(t/.5);x.save();x.translate(0,(1-k)*80);x.globalAlpha=k;
 x.fillStyle='#120d05';x.strokeStyle='rgba(255,194,26,.5)';x.lineWidth=2;x.beginPath();x.roundRect(px,py,pw,ph,28);x.fill();x.stroke();
 txt('SEND',px+40,py+50,18,'#ffffff88',k,700,'left');txt('$100.00',px+40,py+105,64,'#fff',k,900,'left');txt('USD',px+pw-40,py+105,22,GOLD,k,800,'right');
 const pr=cl((t-1.2)/1.1);x.fillStyle='#2a2010';x.fillRect(px+40,py+175,pw-80,8);x.fillStyle=GOLD;x.shadowColor=GOLD;x.shadowBlur=20;x.fillRect(px+40,py+175,(pw-80)*pr,8);x.shadowBlur=0;
 bolt(px+40+(pw-80)*pr,py+179,.35,'#fff');
 txt('RECEIVE',px+40,py+235,18,'#ffffff88',k,700,'left');const amt=(92.4*eo((t-1.2)/1.1)).toFixed(2);txt('€'+amt,px+40,py+290,64,'#fff',k,900,'left');txt('EUR',px+pw-40,py+290,22,GOLD,k,800,'right');
 x.restore();
 const d=eb((t-2.5)/.5);if(d>0){x.save();x.translate(W/2,py+ph+10);x.scale(d,d);x.fillStyle=GOLD;x.beginPath();x.roundRect(-170,-28,340,56,28);x.fill();txt('✓  SETTLED IN SECONDS',0,1,22,'#000',1,900);x.restore()}
 txt('Cross-border. Low fees. No waiting.',W/2,70,34,'#fff',eo((t-3.2)/.5),800)}
function s5(t){// stack
 txt('Built on Bitcoin.',W/2,150,70,'#fff',eo(t/.4),900);txt('Powered by Lightning.',W/2,235,70,GOLD,eo((t-.4)/.4),900);
 const items=[['⚡','Lightning','Instant payments'],['@','UMA','Pay a name, not a number'],['✦','Spark','Scale Bitcoin for everyone']];
 items.forEach((it,i)=>{const k=eb((t-1+i*-0+i*.3)/.5);if(k<=0)return;const bx=W/2-450+i*310,by=360;x.save();x.translate(bx+140,by+110);x.scale(k,k);x.translate(-140,-110);
  x.fillStyle='#140f06';x.strokeStyle='rgba(255,194,26,.45)';x.lineWidth=2;x.beginPath();x.roundRect(0,0,280,220,22);x.fill();x.stroke();
  txt(it[0],140,60,52,GOLD,1,900);txt(it[1],140,130,34,'#fff',1,900);txt(it[2],140,175,17,'#ffffffaa',1,600);x.restore()})}
function s6(t){const k=eb(t/.6);
 if(t<.25){x.fillStyle=`rgba(255,194,26,${1-t/.25})`;x.fillRect(0,0,W,H)}
 x.save();x.translate(W/2,H/2-120);x.scale(k,k);bolt(0,0,1.4,GOLD);x.restore();
 txt('Build the future of money.',W/2,H/2+20,58,'#fff',eo((t-.3)/.5),900);
 const b=eo((t-.9)/.5);x.save();x.globalAlpha=b;x.fillStyle=GOLD;x.beginPath();x.roundRect(W/2-180,H/2+90,360,70,35);x.fill();x.restore();txt('lightspark.com',W/2,H/2+126,30,'#000',b,900);
 txt('Follow @lightspark',W/2,H/2+210,24,'#ffffffbb',eo((t-1.4)/.5),700);
 if(t>3.3){x.fillStyle=`rgba(0,0,0,${cl((t-3.3)/.7)})`;x.fillRect(0,0,W,H)}}
const SC=[[0,4,s1],[4,9,s2],[9,15,s3],[15,21,s4],[21,26,s5],[26,30,s6]];
function frame(){const t=((performance.now()-start)/1000+T0)%DUR;audio(t);
 const beat=(t/(SPB*2))%1,shake=t>4&&t<28.5?Math.pow(1-beat,8)*4:0;
 x.setTransform(1,0,0,1,(Math.random()-.5)*shake,(Math.random()-.5)*shake);bg(t);
 SC.forEach(([a,b,f])=>{if(t>=a&&t<b){x.save();const o=win(t,a,b,.25);x.globalAlpha=1;f(t-a);x.restore();if(o<1&&t>b-.25){}}});
 SC.forEach(([a])=>{if(a>0)wipe(t,a-.18)});
 // vignette + flash on beat
 const v=x.createRadialGradient(W/2,H/2,300,W/2,H/2,820);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.75)');x.fillStyle=v;x.fillRect(-10,-10,W+20,H+20);
 if(t>4&&t<28.5){x.fillStyle=`rgba(255,194,26,${Math.pow(1-beat,10)*.06})`;x.fillRect(0,0,W,H)}
 requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script>
</body>
</html>
