<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><title>音声テスト機能 リリース</title>
<style>html,body{margin:0;background:#000;height:100%;overflow:hidden}
#c{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center;}</style></head>
<body><canvas id="c" width="1280" height="720"></canvas>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d');
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);cv.style.transform=`translate(-50%,-50%) scale(${s})`;}
addEventListener('resize',fit);fit();
window.DUR=26;
const off=parseFloat(new URLSearchParams(location.search).get('t'))||0;
const F='"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif';
const cl=v=>Math.max(0,Math.min(1,v));
const eo=v=>1-Math.pow(1-cl(v),3);
const eio=v=>{v=cl(v);return v<.5?4*v*v*v:1-Math.pow(-2*v+2,3)/2};
const back=v=>{v=cl(v);const c=1.7;return 1+(c+1)*Math.pow(v-1,3)+c*Math.pow(v-1,2)};
const P=(t,a,b)=>cl((t-a)/(b-a));
const lerp=(a,b,v)=>a+(b-a)*v;
function rr(X,Y,W,H,R){x.beginPath();x.roundRect(X,Y,W,H,R);}
function txt(s,X,Y,sz,col,w=500,al='left'){x.font=`${w} ${sz}px ${F}`;x.fillStyle=col;x.textAlign=al;x.textBaseline='middle';x.fillText(s,X,Y);}
const AC='#5b8cff',AC2='#9b6bff',OK='#2fd38a';

function bg(t){
  const g=x.createLinearGradient(0,0,1280,720);g.addColorStop(0,'#070b1a');g.addColorStop(1,'#120a24');
  x.fillStyle=g;x.fillRect(0,0,1280,720);
  for(let i=0;i<3;i++){const px=640+Math.cos(t*.3+i*2.1)*380,py=360+Math.sin(t*.25+i*1.7)*200;
    const r=x.createRadialGradient(px,py,0,px,py,420);r.addColorStop(0,i%2?'rgba(155,107,255,.22)':'rgba(91,140,255,.22)');r.addColorStop(1,'rgba(0,0,0,0)');
    x.fillStyle=r;x.fillRect(0,0,1280,720);}
  x.strokeStyle='rgba(255,255,255,.035)';x.lineWidth=1;
  for(let i=0;i<=1280;i+=64){x.beginPath();x.moveTo(i,0);x.lineTo(i,720);x.stroke();}
  for(let i=0;i<=720;i+=64){x.beginPath();x.moveTo(0,i);x.lineTo(1280,i);x.stroke();}
}
function wave(X,Y,W,H,t,amp,n,col){
  const bw=W/n;
  for(let i=0;i<n;i++){
    const h=Math.max(3,(Math.abs(Math.sin(i*.55+t*7)*Math.sin(i*.17+t*2.3))*.85+.15)*H*amp);
    x.fillStyle=typeof col==='function'?col(i/n):col;rr(X+i*bw+bw*.2,Y-h/2,bw*.6,h,bw*.3);x.fill();}
}
function cursor(X,Y,click){
  x.save();x.translate(X,Y);
  if(click>0&&click<1){x.strokeStyle=`rgba(255,255,255,${1-click})`;x.lineWidth=2;x.beginPath();x.arc(0,0,8+click*26,0,7);x.stroke();}
  const s=1-Math.sin(cl(click)*Math.PI)*.15;x.scale(s,s);
  x.beginPath();x.moveTo(0,0);x.lineTo(0,22);x.lineTo(6,17);x.lineTo(11,27);x.lineTo(15,25);x.lineTo(10,15);x.lineTo(17,15);x.closePath();
  x.fillStyle='#fff';x.shadowColor='rgba(0,0,0,.5)';x.shadowBlur=8;x.fill();x.shadowBlur=0;x.strokeStyle='#111';x.lineWidth=1.2;x.stroke();
  x.restore();
}
function check(X,Y,r,p,col){
  x.fillStyle=col;x.beginPath();x.arc(X,Y,r*back(p),0,7);x.fill();
  const q=P(p,.3,1);if(q<=0)return;
  x.strokeStyle='#fff';x.lineWidth=r*.22;x.lineCap='round';x.lineJoin='round';x.beginPath();
  const a=[X-r*.42,Y+r*.02],b=[X-r*.1,Y+r*.34],c=[X+r*.45,Y-r*.3];
  x.moveTo(...a);if(q<.4)x.lineTo(lerp(a[0],b[0],q/.4),lerp(a[1],b[1],q/.4));else{x.lineTo(...b);const k=(q-.4)/.6;x.lineTo(lerp(b[0],c[0],k),lerp(b[1],c[1],k));}
  x.stroke();x.lineCap='butt';
}

function scene1(t){
  const o=1-P(t,4,4.6);x.globalAlpha=o;
  const a=eo(P(t,.3,1.1));
  x.save();x.translate(640,250+(1-a)*20);x.globalAlpha=o*a;
  rr(-90,-20,180,40,20);x.fillStyle='rgba(91,140,255,.15)';x.fill();x.strokeStyle='rgba(91,140,255,.6)';x.lineWidth=1.5;x.stroke();
  txt('NEW FEATURE',0,1,16,'#a9c2ff',700,'center');x.restore();
  const l1='管理画面から、',l2='音声テストが可能に。';
  [[l1,330,.9],[l2,410,1.3]].forEach(([s,y,d])=>{
    const p=eo(P(t,d,d+.9));x.save();x.globalAlpha=o*p;x.translate(0,(1-p)*30);
    txt(s,640,y,62,'#fff',800,'center');x.restore();});
  const wp=eo(P(t,2,3));x.globalAlpha=o*wp;
  wave(440,500,400,50,t,wp,40,i=>`hsl(${225+i*45},90%,68%)`);
  x.globalAlpha=1;
}

const menu=['ダッシュボード','ユーザー管理','通知設定','音声テスト','システム設定'];
function scene2(t){
  const lt=t-4.5;
  const inP=back(P(lt,0,1.1)),out=eio(P(lt,11.8,12.5));
  const zoom=lerp(1,1.12,eio(P(lt,4.3,5.5)))*lerp(1,1,1)-eio(P(lt,10.5,11.5))*.12;
  x.save();x.globalAlpha=cl(P(lt,0,.5))*(1-out);
  x.translate(640,360);x.scale((.85+.15*inP)*zoom,(.85+.15*inP)*zoom);
  const fx=-eio(P(lt,4.3,5.5))*60+eio(P(lt,10.5,11.5))*60,fy=eio(P(lt,4.3,5.5))*-10+eio(P(lt,10.5,11.5))*10;
  x.translate(-640+fx,-360+fy-out*40);
  const X=160,Y=90,W=960,H=560;
  x.shadowColor='rgba(0,0,0,.6)';x.shadowBlur=60;x.shadowOffsetY=20;
  rr(X,Y,W,H,16);x.fillStyle='#10152a';x.fill();x.shadowBlur=0;x.shadowOffsetY=0;
  x.strokeStyle='rgba(255,255,255,.1)';x.lineWidth=1;x.stroke();
  x.save();rr(X,Y,W,H,16);x.clip();
  x.fillStyle='#161c36';x.fillRect(X,Y,W,40);
  ['#ff5f57','#febc2e','#28c840'].forEach((c,i)=>{x.fillStyle=c;x.beginPath();x.arc(X+22+i*20,Y+20,6,0,7);x.fill();});
  rr(X+340,Y+10,280,20,10);x.fillStyle='rgba(255,255,255,.06)';x.fill();
  txt('admin.example.com',X+480,Y+20,12,'rgba(255,255,255,.45)',400,'center');
  x.fillStyle='#0c1022';x.fillRect(X,Y+40,220,H-40);
  txt('◆ Admin Console',X+24,Y+75,16,'#fff',700);
  const sel=lt>3.6;
  menu.forEach((m,i)=>{const my=Y+130+i*48,active=sel?i===3:i===0;
    if(active){rr(X+12,my-18,196,36,8);x.fillStyle='rgba(91,140,255,.2)';x.fill();x.fillStyle=AC;x.fillRect(X+12,my-18,3,36);}
    x.fillStyle=active?AC:'rgba(255,255,255,.3)';rr(X+28,my-7,14,14,4);x.fill();
    txt(m,X+54,my,15,active?'#fff':'rgba(255,255,255,.6)',active?700:400);
    if(i===3){const bp=.5+.5*Math.sin(t*4);rr(X+150,my-10,44,20,10);x.fillStyle=`rgba(155,107,255,${.6+.3*bp})`;x.fill();txt('NEW',X+172,my+1,11,'#fff',800,'center');}
  });
  const cx=X+250,cy=Y+70;
  const sw=eio(P(lt,3.6,4.2));
  // dashboard
  if(sw<1){x.globalAlpha*=1;x.save();x.globalAlpha=x.globalAlpha*(1-sw);x.translate(-sw*30,0);
    txt('ダッシュボード',cx,cy+10,24,'#fff',700);
    for(let i=0;i<3;i++){rr(cx+i*226,cy+50,210,100,12);x.fillStyle='#182042';x.fill();
      txt(['アクティブ','通話数','稼働率'][i],cx+i*226+18,cy+78,13,'rgba(255,255,255,.55)');
      txt(['1,284','8,920','99.9%'][i],cx+i*226+18,cy+115,28,'#fff',800);}
    rr(cx,cy+170,662,270,12);x.fillStyle='#182042';x.fill();
    x.strokeStyle=AC;x.lineWidth=3;x.beginPath();
    for(let i=0;i<=30;i++){const px=cx+20+i*20.7,py=cy+380-(Math.sin(i*.5)*40+i*4+Math.sin(i*1.3)*15)*eo(P(lt,.6,2));i?x.lineTo(px,py):x.moveTo(px,py);}x.stroke();
    x.restore();}
  if(sw>0){x.save();x.globalAlpha=x.globalAlpha*sw;x.translate((1-sw)*30,0);
    txt('音声テスト',cx,cy+10,24,'#fff',700);
    txt('登録された音声が正しく再生されるか、ここで確認できます。',cx,cy+42,13,'rgba(255,255,255,.55)');
    rr(cx,cy+70,662,56,10);x.fillStyle='#182042';x.fill();
    txt('テスト音声',cx+20,cy+98,13,'rgba(255,255,255,.55)');
    rr(cx+120,cy+82,400,32,8);x.fillStyle='#0f1530';x.fill();x.strokeStyle='rgba(255,255,255,.12)';x.stroke();
    txt('ご案内メッセージ_01.wav',cx+136,cy+98,14,'#fff');txt('▾',cx+505,cy+98,14,'rgba(255,255,255,.5)',400,'right');
    rr(cx,cy+142,662,228,12);x.fillStyle='#182042';x.fill();
    const play=P(lt,6.0,9.5),playing=lt>6&&lt<9.5;
    const bx=cx+60,by=cy+256,pr=playing?1+.06*Math.sin(t*10):1;
    if(playing){x.strokeStyle='rgba(91,140,255,.35)';x.lineWidth=2;for(let k=0;k<2;k++){const q=(t*1.2+k*.5)%1;x.globalAlpha=sw*(1-q);x.beginPath();x.arc(bx,by,30+q*30,0,7);x.stroke();}x.globalAlpha=sw;}
    const g=x.createLinearGradient(bx-30,by-30,bx+30,by+30);g.addColorStop(0,AC);g.addColorStop(1,AC2);
    x.fillStyle=g;x.beginPath();x.arc(bx,by,30*pr,0,7);x.fill();x.fillStyle='#fff';
    if(playing){x.fillRect(bx-9,by-10,6,20);x.fillRect(bx+3,by-10,6,20);}
    else{x.beginPath();x.moveTo(bx-8,by-12);x.lineTo(bx+13,by);x.lineTo(bx-8,by+12);x.fill();}
    const amp=playing?eo(P(lt,6,6.4))*(1-P(lt,9.2,9.5)):.12;
    wave(cx+120,by-10,510,90,t,amp,56,i=>i<play?`hsl(${225+i*45},90%,68%)`:'rgba(255,255,255,.18)');
    rr(cx+120,by+52,510,4,2);x.fillStyle='rgba(255,255,255,.1)';x.fill();
    rr(cx+120,by+52,510*play,4,2);x.fillStyle=AC;x.fill();
    const sec=Math.floor(play*7);txt(`0:0${sec} / 0:07`,cx+630,by+72,12,'rgba(255,255,255,.5)',400,'right');
    txt(playing?'● 再生中…':(lt>9.5?'再生終了':'待機中'),cx+120,by+72,12,playing?OK:'rgba(255,255,255,.5)',600);
    const rp=P(lt,9.6,10.4);
    if(rp>0){x.save();x.globalAlpha=sw*eo(rp);x.translate(0,(1-eo(rp))*16);
      rr(cx,cy+386,662,64,12);x.fillStyle='rgba(47,211,138,.12)';x.fill();x.strokeStyle='rgba(47,211,138,.5)';x.stroke();
      check(cx+36,cy+418,15,P(lt,9.8,10.6),OK);
      txt('音声テスト完了',cx+64,cy+408,16,'#fff',700);txt('音声は正常に再生されました（7秒・ノイズなし）',cx+64,cy+430,12,'rgba(255,255,255,.65)');
      x.restore();}
    x.restore();}
  x.restore();
  // cursor
  let px=1000,py=640,ck=-1;
  const m1=eio(P(lt,1.8,3.2));px=lerp(1000,X+110,m1);py=lerp(640,Y+130+3*48,m1);
  if(lt>3.2&&lt<3.9)ck=(lt-3.3)/.6;
  const m2=eio(P(lt,4.4,5.7));px=lerp(px,cx+60,m2);py=lerp(py,cy+256,m2);
  if(lt>5.7&&lt<6.5)ck=(lt-5.8)/.6;
  const m3=eio(P(lt,6.6,7.6));px=lerp(px,cx+660,m3);py=lerp(py,cy+330,m3);
  x.restore();
  x.save();x.globalAlpha=cl(P(lt,1,1.5))*(1-out);
  x.translate(640,360);x.scale(zoom,zoom);x.translate(-640+fx,-360+fy);cursor(px,py,ck);x.restore();
  // caption
  const caps=[[1.5,3.8,'左メニューに「音声テスト」が追加'],[4.4,9.3,'ワンクリックで、その場で再生確認'],[9.6,11.8,'結果もすぐにわかる']];
  caps.forEach(([a,b,s])=>{const p=P(lt,a,a+.4)*(1-P(lt,b-.3,b));if(p<=0)return;
    x.save();x.globalAlpha=p;x.font=`700 20px ${F}`;const w=x.measureText(s).width+48;
    rr(640-w/2,666-(1-p)*10,w,40,20);x.fillStyle='rgba(10,14,30,.85)';x.fill();x.strokeStyle='rgba(91,140,255,.5)';x.stroke();
    txt(s,640,686-(1-p)*10,20,'#fff',700,'center');x.restore();});
}

function scene3(t){
  const lt=t-17,o=1-P(lt,4.6,5.1);
  x.save();x.globalAlpha=o;
  const hp=eo(P(lt,0,.6));x.globalAlpha=o*hp;txt('できるようになったこと',640,170-(1-hp)*20,36,'#fff',800,'center');
  const items=[['▶','ワンクリック再生','管理画面から直接、\n音声を再生して確認'],['≋','波形をリアルタイム表示','再生状況が\nひと目でわかる'],['✓','結果をその場で確認','正常に再生されたかを\nすぐにチェック']];
  items.forEach(([ic,h,d],i)=>{const p=P(lt,.4+i*.25,1.2+i*.25),s=back(p);if(p<=0)return;
    x.save();x.globalAlpha=o*cl(p*2);x.translate(270+i*370,400);x.scale(s,s);x.translate(0,-Math.sin(t*1.5+i)*4);
    rr(-160,-150,320,300,20);x.fillStyle='rgba(24,32,66,.85)';x.fill();x.strokeStyle='rgba(255,255,255,.1)';x.stroke();
    const g=x.createLinearGradient(-36,-110,36,-38);g.addColorStop(0,AC);g.addColorStop(1,AC2);
    rr(-36,-110,72,72,18);x.fillStyle=g;x.fill();txt(ic,0,-73,32,'#fff',800,'center');
    txt(h,0,10,22,'#fff',800,'center');
    d.split('\n').forEach((l,k)=>txt(l,0,56+k*26,15,'rgba(255,255,255,.65)',400,'center'));
    x.restore();});
  x.restore();
}

function scene4(t){
  const lt=t-22,o=1-P(lt,3.5,4);
  x.save();x.globalAlpha=o;
  const p=back(P(lt,0,.9));
  x.save();x.translate(640,260);x.scale(p,p);
  const g=x.createLinearGradient(-60,-60,60,60);g.addColorStop(0,AC);g.addColorStop(1,AC2);
  x.shadowColor='rgba(120,120,255,.6)';x.shadowBlur=50;rr(-60,-60,120,120,30);x.fillStyle=g;x.fill();x.shadowBlur=0;
  wave(-38,0,76,60,t,1,7,'#fff');x.restore();
  const a=eo(P(lt,.5,1.3));x.globalAlpha=o*a;
  txt('音声テスト機能、リリース。',640,400+(1-a)*20,52,'#fff',800,'center');
  const b=eo(P(lt,1,1.8));x.globalAlpha=o*b;
  txt('管理画面から、今すぐお試しください。',640,465+(1-b)*16,22,'rgba(255,255,255,.7)',500,'center');
  const c=eo(P(lt,1.5,2.2));x.globalAlpha=o*c;
  rr(560,515,160,44,22);x.fillStyle='rgba(91,140,255,.18)';x.fill();x.strokeStyle=AC;x.stroke();
  txt('NOW AVAILABLE',640,538,14,'#cfdcff',800,'center');
  x.restore();
}

let st=null;
function frame(now){
  if(st===null)st=now;
  const t=((now-st)/1000+off)%window.DUR;
  bg(t);
  if(t<4.6)scene1(t);
  if(t>=4.5&&t<17.1)scene2(t);
  if(t>=17&&t<22.2)scene3(t);
  if(t>=22)scene4(t);
  const v=x.createRadialGradient(640,360,300,640,360,800);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.55)');
  x.fillStyle=v;x.fillRect(0,0,1280,720);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
