<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>The Next 30 Years</title>
<style>html,body{margin:0;background:#000;height:100%;overflow:hidden}canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#000}</style>
</head><body><canvas id="c" width="1280" height="720"></canvas><script>
window.DUR=60;
const C=document.getElementById('c'),X=C.getContext('2d'),W=1280,H=720;
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);C.style.width=W*s+'px';C.style.height=H*s+'px'}addEventListener('resize',fit);fit();
const qt=parseFloat(new URLSearchParams(location.search).get('t'))||0;
// noise
function hs(x,y,z){let h=Math.imul(x,374761393)+Math.imul(y,668265263)+Math.imul(z,1274126177);h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}
function vn(x,y,z){const xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z);let fx=x-xi,fy=y-yi,fz=z-zi;fx=fx*fx*(3-2*fx);fy=fy*fy*(3-2*fy);fz=fz*fz*(3-2*fz);
const L=(a,b,t)=>a+(b-a)*t;const c=(i,j,k)=>hs(xi+i,yi+j,zi+k);
return L(L(L(c(0,0,0),c(1,0,0),fx),L(c(0,1,0),c(1,1,0),fx),fy),L(L(c(0,0,1),c(1,0,1),fx),L(c(0,1,1),c(1,1,1),fx),fy),fz)}
function fbm(x,y,z,o){let s=0,a=.5,f=1;for(let i=0;i<o;i++){s+=a*vn(x*f+i*17,y*f,z*f);a*=.5;f*=2.03}return s/(1-Math.pow(.5,o))}
const TW=512,TH=256;
function mkTex(fn){const col=new Float32Array(TW*TH*3),li=new Float32Array(TW*TH),cl=new Float32Array(TW*TH);
for(let j=0;j<TH;j++){const lat=(.5-(j+.5)/TH)*Math.PI;for(let i=0;i<TW;i++){const lon=(i+.5)/TW*2*Math.PI;
const p=[Math.cos(lat)*Math.sin(lon),Math.sin(lat),Math.cos(lat)*Math.cos(lon)];const r=fn(p,lat,lon),k=j*TW+i;
col[k*3]=r[0];col[k*3+1]=r[1];col[k*3+2]=r[2];li[k]=r[3]||0;cl[k]=r[4]||0}}return{col,li,cl}}
const EARTH=mkTex((p,lat)=>{const e=fbm(p[0]*1.7+3,p[1]*1.7,p[2]*1.7,6),v=fbm(p[0]*4,p[1]*4+9,p[2]*4,4),al=Math.abs(lat)*57.3;
const cl=Math.max(0,fbm(p[0]*3+5,p[1]*6,p[2]*3,5)-.48)*2.6;let c,li=0;
if(al>72||(al>62&&e>.5))c=[230,235,240];else if(e>.53){const d=Math.abs(lat)<.45&&v<.5?1:0;c=d?[170,140,90]:[50+v*60,90+v*40,40];
const n=fbm(p[0]*22,p[1]*22,p[2]*22,3);li=Math.max(0,n-.5)*4*(e<.6?1.3:.7);li=Math.min(1,li*li*1.5);}
else{const s=Math.max(0,e-.45)*4;c=[8+s*20,25+s*50,60+s*60]}return[...c,li,Math.min(1,cl)]});
const MOON=mkTex(p=>{const a=fbm(p[0]*2,p[1]*2,p[2]*2,4),b=fbm(p[0]*9,p[1]*9,p[2]*9,4),cr=Math.abs(b-.5)<.03?-25:0;const g=95+a*80-(a<.42?45:0)+cr+b*30;return[g,g*.98,g*.95]});
const cities=[];for(let i=0;i<14;i++){const la=(hs(i,3,1)-.5)*1.6,lo=hs(i,7,2)*6.283;cities.push([Math.cos(la)*Math.sin(lo),Math.sin(la),Math.cos(la)*Math.cos(lo),.05+hs(i,1,9)*.08])}
const MARS=mkTex((p,lat)=>{const a=fbm(p[0]*2+1,p[1]*2,p[2]*2,6),b=fbm(p[0]*7,p[1]*7,p[2]*7,3);let c=[180+a*50-b*20,80+a*30,40+a*15];
if(a<.45)c=[110,55,35];if(Math.abs(lat)*57.3>78)c=[235,225,215];let li=0;
for(const q of cities){const d=Math.hypot(p[0]-q[0],p[1]-q[1],p[2]-q[2]);if(d<q[3]){li+=(1-d/q[3])*(.5+fbm(p[0]*40,p[1]*40,p[2]*40,2))}}return[...c,Math.min(1,li)]});
const SUN=mkTex(p=>{const a=fbm(p[0]*5,p[1]*5,p[2]*5,5),b=fbm(p[0]*30,p[1]*30,p[2]*30,2);const g=.75+a*.3+b*.15;return[255,180*g+40,60*g]});
// sphere renderer
const pool={};
function sphere(T,N,rot,o){N=Math.max(8,Math.min(440,N|0));let cv=pool[N];if(!cv){cv=document.createElement('canvas');cv.width=cv.height=N;pool[N]=[cv,cv.getContext('2d'),null];cv=pool[N]}
const[can,g]=cv;let id=cv[2]||(cv[2]=g.createImageData(N,N));const d=id.data;const L=o.L||[-.75,-.15,-.35],ll=Math.hypot(...L);const lx=L[0]/ll,ly=L[1]/ll,lz=L[2]/ll;
for(let y=0;y<N;y++){const dy=(y+.5)/N*2-1;for(let x=0;x<N;x++){const dx=(x+.5)/N*2-1,r2=dx*dx+dy*dy,k=(y*N+x)*4;
if(r2>1){d[k+3]=0;continue}const nz=Math.sqrt(1-r2);let lon=Math.atan2(dx,nz)+rot,lat=Math.asin(-dy);
let u=((lon/6.2832)%1+1)%1*TW|0,v=(.5-lat/3.1416)*TH|0;if(v>=TH)v=TH-1;const ti=v*TW+u;
let R=T.col[ti*3],G=T.col[ti*3+1],B=T.col[ti*3+2],a=255;
if(o.sun){const ld=Math.pow(nz,.45);R*=ld;G*=ld;B*=ld*.8}else{
const dd=dx*lx+dy*ly+nz*lz;let df=Math.max(0,Math.min(1,dd*1.6+.12));
const cl=T.cl[ti];R=R*(1-cl)+245*cl;G=G*(1-cl)+245*cl;B=B*(1-cl)+250*cl;R*=df;G*=df;B*=df;
const nl=Math.max(0,Math.min(1,.2-dd*3))*(o.lights||0)*T.li[ti]*(1-cl*.7);R+=nl*255;G+=nl*175;B+=nl*90;
if(o.atm){const rim=Math.pow(1-nz,3);R+=rim*o.atm[0]*(df+.05);G+=rim*o.atm[1]*(df+.05);B+=rim*o.atm[2]*(df+.05)}}
const e=(1-r2)*N*N*.25;if(e<1.5)a=255*e/1.5;
d[k]=R;d[k+1]=G;d[k+2]=B;d[k+3]=a}}g.putImageData(id,0,0);return can}
// world
const P={earth:[0,0,100],moon:[380,-60,27],mars:[2400,40,53],sun:[-4000,0,400]};
const KF=[[0,0,0,2.3],[7,10,0,2.0],[9.5,40,0,1.55],[15,20,0,1.45],[18,200,-30,1.0],[21,375,-60,6],[26,382,-58,6.4],[29,1400,0,.4],[32,2400,40,4.4],[38,2405,40,4.7],[42,1000,0,.25],[45,0,0,.6],[50,-3000,0,.35],[54,-4000,0,.62],[60,-4000,0,.7]];
function cam(t){let i=0;while(i<KF.length-2&&t>KF[i+1][0])i++;const a=KF[i],b=KF[i+1];let u=Math.max(0,Math.min(1,(t-a[0])/(b[0]-a[0])));u=u*u*(3-2*u);
const lz=Math.log(a[3])+(Math.log(b[3])-Math.log(a[3]))*u;return[a[1]+(b[1]-a[1])*u,a[2]+(b[2]-a[2])*u,Math.exp(lz)]}
const stars=[];for(let i=0;i<700;i++)stars.push([hs(i,1,1)*4000,hs(i,2,2)*720,hs(i,3,3),hs(i,4,4)]);
const sats=[];for(let i=0;i<520;i++)sats.push([1.07+hs(i,5,1)*hs(i,6,2)*.6,(hs(i,7,3)-.5)*2.6,hs(i,8,4)*6.28,.4+hs(i,9,5)*.8,hs(i,1,6)*6.28]);
const mirs=[];for(let i=0;i<1100;i++)mirs.push([1.25+hs(i,2,7)*1.1,(hs(i,3,8)-.5)*.9,hs(i,4,9)*6.28,.15+hs(i,5,1)*.2,hs(i,6,2)*6.28,hs(i,7,7)]);
const cl01=v=>Math.max(0,Math.min(1,v)),ss=(a,b,v)=>{v=cl01((v-a)/(b-a));return v*v*(3-2*v)};
function orbitPts(list,S,R,t,fn){for(const s of list){const r=s[0]*R,inc=s[1],a=s[2]+t*s[3]*(1/s[0]);const x0=Math.cos(a)*r,z0=Math.sin(a)*r,c=Math.cos(s[4]),sn=Math.sin(s[4]);
const y1=-z0*Math.sin(inc),z1=z0*Math.cos(inc);fn(S[0]+(x0*c-y1*sn),S[1]+(x0*sn+y1*c)*.9,z1,s)}}
const CAP=[[0,8.5,'2026','Earth at night, wrapped in a cloud of satellites'],[9.5,17,'2032','An orbital ring, tethered by space elevators'],[19.5,27.5,'2040','A permanent base on the Moon'],[30.5,39.5,'2048','The first cities on Mars'],[51,60,'2056','A swarm of mirrors circling the Sun']];
const t0=performance.now()-qt*1000;
function frame(now){const t=((now-t0)/1000)%DUR;const[cx,cy,z]=cam(t);
const S=(wx,wy)=>[640+(wx-cx)*z,360+(wy-cy)*z];
X.fillStyle='#000';X.fillRect(0,0,W,H);
for(const s of stars){let x=((s[0]-cx*.03*(.3+s[2]))%4000+4000)%4000;if(x>W)continue;const b=.3+s[2]*.7*(.8+.2*Math.sin(t*2+s[3]*20));X.fillStyle=`rgba(${200+s[3]*55|0},${210},255,${b})`;X.fillRect(x,s[1],s[2]>.9?2:1.2,s[2]>.9?2:1.2)}
// sun
{const[sx,sy]=S(P.sun[0],P.sun[1]),R=P.sun[2]*z;const gR=Math.max(60,R*3.2);
if(sx+gR>-200){const gg=X.createRadialGradient(sx,sy,R*.5,sx,sy,gR);gg.addColorStop(0,'rgba(255,200,120,.55)');gg.addColorStop(.3,'rgba(255,140,50,.18)');gg.addColorStop(1,'rgba(255,100,30,0)');X.fillStyle=gg;X.fillRect(sx-gR,sy-gR,gR*2,gR*2);
const mA=ss(46,53,t);const pts=[];if(mA>0)orbitPts(mirs,P.sun,P.sun[2],t*.6,(x,y,zz,m)=>{if(m[5]<mA)pts.push([x,y,zz,m])});
const drawM=front=>{for(const p of pts){if((p[2]>0)!=front)continue;const[px,py]=S(p[0],p[1]);const f=.5+.5*Math.cos(t*3+p[3][4]*5);const w=Math.max(1,z*7),h=Math.max(.8,z*7*(.3+.7*f));
X.fillStyle=`rgba(255,${220+f*35|0},${170+f*80|0},${.35+.65*f*f})`;X.fillRect(px-w/2,py-h/2,w,h)}};
drawM(false);if(R>3){const sp=sphere(SUN,R*2,t*.03,{sun:1});X.drawImage(sp,sx-R,sy-R,R*2,R*2)}drawM(true);}}
// earth
{const[ex,ey]=S(0,0),R=P.earth[2]*z;if(ex>-R*3&&ex<W+R*3){
const rA=ss(8.5,13,t),ang=t*.08,rr=1.9;
const ringPt=(a,r)=>[ex+Math.cos(a)*r*R,ey+Math.sin(a)*r*R*.2+R*.04];
const ring=front=>{if(rA<=0)return;X.lineCap='round';
for(let k=0;k<3;k++){X.strokeStyle=['rgba(120,140,170,','rgba(200,210,230,','rgba(255,220,170,'][k]+(rA*[.6,.8,.5][k])+')';X.lineWidth=Math.max(1,R*[.05,.025,.006][k]);
X.beginPath();X.ellipse(ex,ey+R*.04,rr*R,rr*R*.2,0,front?0:Math.PI,front?Math.PI:2*Math.PI);X.stroke()}
for(let i=0;i<60;i++){const a=i/60*6.283+ang;if((Math.sin(a)>0)!=front)continue;const[px,py]=ringPt(a,rr);X.fillStyle=`rgba(255,230,180,${rA})`;X.fillRect(px-1,py-1,2,2)}
for(let i=0;i<5;i++){const a=i/5*6.283+ang;if((Math.sin(a)>0)!=front)continue;const[px,py]=ringPt(a,rr),[qx,qy]=ringPt(a,front?1:1);
X.strokeStyle=`rgba(190,220,255,${rA*.8})`;X.lineWidth=Math.max(.6,R*.008);X.beginPath();X.moveTo(qx,qy);X.lineTo(px,py);X.stroke();
const cp=((t*.15+i*.3)%1);X.fillStyle=`rgba(255,255,255,${rA})`;X.fillRect(qx+(px-qx)*cp-1.5,qy+(py-qy)*cp-1.5,3,3)}};
const sp=[];orbitPts(sats,[0,0],1,t*.5,(x,y,zz,s)=>sp.push([x,y,zz]));
const sA=1-ss(14,19,t)*.5;const satD=front=>{for(const p of sp){if((p[2]>0)!=front)continue;if(!front&&Math.hypot(p[0],p[1])<1)continue;X.fillStyle=`rgba(200,225,255,${sA*(.4+.4*Math.abs(Math.sin(p[2]*9+t)))})`;X.fillRect(ex+p[0]*R-.8,ey+p[1]*R-.8,1.6,1.6)}};
const gl=X.createRadialGradient(ex,ey,R*.95,ex,ey,R*1.25);gl.addColorStop(0,'rgba(90,150,255,.35)');gl.addColorStop(1,'rgba(90,150,255,0)');X.fillStyle=gl;X.beginPath();X.arc(ex,ey,R*1.25,0,7);X.fill();
satD(false);ring(false);X.drawImage(sphere(EARTH,R*2,t*.12+2.2,{lights:1.2,atm:[90,150,255]}),ex-R,ey-R,R*2,R*2);ring(true);satD(true);}}
// moon
{const[mx,my]=S(P.moon[0],P.moon[1]),R=P.moon[2]*z;if(mx>-R*2&&mx<W+R*2){X.drawImage(sphere(MOON,R*2,1.1,{}),mx-R,my-R,R*2,R*2);
const bA=ss(17,22,t);if(bA>0&&R>15){const bx=mx+R*.38,by=my+R*.18,s=R/160;X.save();X.globalAlpha=bA;
const gb=X.createRadialGradient(bx,by,0,bx,by,40*s);gb.addColorStop(0,'rgba(255,210,140,.5)');gb.addColorStop(1,'rgba(255,210,140,0)');X.fillStyle=gb;X.fillRect(bx-40*s,by-40*s,80*s,80*s);
for(let i=0;i<6;i++){const ox=(hs(i,2,5)-.5)*40*s,oy=(hs(i,3,5)-.5)*14*s,dr=(3+hs(i,4,5)*5)*s;X.fillStyle='rgba(170,180,195,.95)';X.beginPath();X.ellipse(bx+ox,by+oy,dr,dr*.55,0,Math.PI,0);X.fill();
X.fillStyle='rgba(255,220,150,.9)';X.fillRect(bx+ox-dr*.3,by+oy-dr*.25,dr*.6,Math.max(1,dr*.18))}
X.strokeStyle='rgba(255,240,200,.7)';X.lineWidth=Math.max(.5,s);X.beginPath();X.ellipse(bx+24*s,by+9*s,6*s,2*s,0,0,7);X.stroke();
for(let i=0;i<14;i++){const f=.5+.5*Math.sin(t*5+i);X.fillStyle=`rgba(255,${200+f*55|0},120,${f})`;X.fillRect(bx+(hs(i,9,1)-.5)*50*s,by+(hs(i,8,1)-.5)*18*s,1.5,1.5)}
const fl=(t*.4)%1;X.fillStyle='#fff';X.fillRect(bx+24*s-1,by+9*s-fl*60*s-1,2,2);X.restore()}}}
// mars
{const[mx,my]=S(P.mars[0],P.mars[1]),R=P.mars[2]*z;if(mx>-R*2&&mx<W+R*2){
const gl=X.createRadialGradient(mx,my,R*.95,mx,my,R*1.12);gl.addColorStop(0,'rgba(255,150,100,.25)');gl.addColorStop(1,'rgba(255,150,100,0)');X.fillStyle=gl;X.beginPath();X.arc(mx,my,R*1.12,0,7);X.fill();
X.drawImage(sphere(MARS,R*2,t*.09+3.4,{lights:ss(29,36,t)*1.6,atm:[230,140,100]}),mx-R,my-R,R*2,R*2);
if(R>40){const n=Math.floor(ss(31,38,t)*8);for(let i=0;i<n;i++){const a=t*.3+i*.8,x=mx+Math.cos(a)*R*1.3,y=my+Math.sin(a)*R*.25;if(Math.sin(a)<0&&Math.hypot(x-mx,y-my)<R)continue;X.fillStyle='rgba(220,240,255,.9)';X.fillRect(x-1,y-1,2,2)}}}}
// vignette
const vg=X.createRadialGradient(640,360,300,640,360,800);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.6)');X.fillStyle=vg;X.fillRect(0,0,W,H);
// captions
for(const c of CAP){const a=ss(c[0],c[0]+1.2,t)*(1-ss(c[1]-1.2,c[1],t));if(a<=0)continue;X.globalAlpha=a;X.fillStyle='#fff';X.textBaseline='alphabetic';
X.font='300 72px Helvetica,Arial,sans-serif';X.fillText(c[2],70,600);X.font='22px Helvetica,Arial,sans-serif';X.fillStyle='rgba(220,230,255,.9)';X.fillText(c[3],74,636);X.globalAlpha=1}
// timeline
X.strokeStyle='rgba(255,255,255,.25)';X.lineWidth=1;X.beginPath();X.moveTo(860,640);X.lineTo(1210,640);X.stroke();
X.font='12px Helvetica,Arial,sans-serif';X.textAlign='center';CAP.forEach((c,i)=>{const x=860+i*87.5,on=t>=c[0];X.fillStyle=on?'#fff':'rgba(255,255,255,.35)';X.beginPath();X.arc(x,640,on?4:3,0,7);X.fill();X.fillText(c[2],x,664)});
const yr=t<CAP[4][0]?null:null;X.fillStyle='#ffd27a';X.beginPath();X.arc(860+350*Math.min(1,t/52),640,2.5,0,7);X.fill();X.textAlign='left';
X.fillStyle=`rgba(0,0,0,${1-ss(0,1,t)+ss(59,60,t)})`;X.fillRect(0,0,W,H);
requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script></body></html>
