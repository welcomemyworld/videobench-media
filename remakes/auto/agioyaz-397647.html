 g.strokeStyle='rgba(30,15,10,.55)';g.lineWidth=1.5;for(let i=-2;i<=2;i++){g.beginPath();g.moveTo(cx+i*w*.08,cy+h*.15);g.quadraticCurveTo(cx+i*w*.18,cy+h*.6,cx+i*w*.2,cy+h);g.stroke()}}

 g.beginPath();g.moveTo(cx,cy);g.lineTo(cx-r*.05,cy+r*.35);g.stroke();g.strokeStyle='#8a2a22';g.beginPath();g.moveTo(cx-r*.18,cy+r*.55);g.quadraticCurveTo(cx,cy+r*.62,cx+r*.18,cy+r*.55);g.stroke()}

g.fillStyle='#f0c040';g.beginPath();g.moveTo(186,hy-16);for(let i=0;i<5;i++)g.lineTo(186+i*7,hy-26+(i%2)*8);g.lineTo(214,hy-16);g.fill();
// angels

// ---------- blocks ----------

const WORDS="BUSY URGENT ASAP DEADLINE KPI MEETING OVERTIME OPTIMIZE EFFICIENCY INBOX FASTER TO-DO SPRINT TARGETS HUSTLE REPLY_ALL EOD METRICS SCALE GRIND RUSH PING FOLLOW-UP MULTITASK NOW".split(' ').map(s=>s.replace('_',' '));

const avg=[];{const d=g.getImageData(0,0,GW,GH).data;blocks.forEach(b=>{let r=0,gg=0,bb=0,n=0;for(let y=b.r*75;y<b.r*75+75;y+=5)for(let x=b.c*80;x<b.c*80+80;x+=5){const k=(y*GW+x)*4;r+=d[k];gg+=d[k+1];bb+=d[k+2];n++}avg.push([r/n,gg/n,bb/n].map(v=>Math.min(255,v*1.6|0)))})}
// floor mapping

const LINES=[[3.4,6.4,"Every day, faster."],[6.8,9.6,"Every day, more efficient."],[9.9,13.4,"Until the light could no longer get in."],[14.6,18.4,"Let one thing go."],[19.4,24.5,"Where there is space, light comes in."],[26.8,31.8,"And the light was richer than before."]];

function audio(off){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}

 if(14.8>=off){const o=A.createOscillator(),e=A.createGain();o.frequency.value=55;o.type='sawtooth';o.connect(e);e.connect(m);e.gain.setValueAtTime(0,now+Math.max(off,0));e.gain.linearRampToValueAtTime(.05,now+10.5);e.gain.linearRampToValueAtTime(0,now+11);o.frequency.linearRampToValueAtTime(90,now+11);o.start(now+Math.max(off,0));o.stop(now+11.1)}

 [261.6,329.6,392,523.3,659.3].forEach((f,i)=>{if(off>36)return;const o=A.createOscillator(),e=A.createGain();o.type='triangle';o.frequency.value=f;o.detune.value=(i-2)*6;o.connect(e);e.connect(m);const s=now+Math.max(off,19);e.gain.setValueAtTime(0,s);e.gain.linearRampToValueAtTime(.035,now+33);e.gain.linearRampToValueAtTime(0,now+37);o.start(s);o.stop(now+37)});}

let curT=0;const start=performance.now();
function scene(t){

 for(let i=-8;i<=8;i++){X.beginPath();X.moveTo(640+i*60,430);X.lineTo(640+i*260,720);X.stroke()}
 [[200,140],[1080,140],[360,80],[920,80]].forEach(([x,w])=>{const gg=X.createLinearGradient(x-w/2,0,x+w/2,0);gg.addColorStop(0,`rgba(0,0,0,.9)`);gg.addColorStop(.5,`rgba(90,80,68,${amb*1.3})`);gg.addColorStop(1,'rgba(0,0,0,.95)');X.fillStyle=gg;X.fillRect(x-w/2,0,w,x<640?430+(640-x)*.6:430+(x-640)*.6)});
 // window
 X.save();winPath();X.clip();X.fillStyle='#000';X.fillRect(WX,WY,WW,WH);
 if(t>14)X.drawImage(G,WX,WY,WW,WH);
 X.fillStyle=`rgba(255,252,244,${t<11?1:0})`;X.fillRect(WX,WY,WW,WH);

 // light: projection + shafts

 blocks.forEach((b,i)=>{let open=t<11?(t<b.tin+.3?1:0):(t>=b.tout?ss(b.tout,b.tout+1.2,t):0);if(t>=11&&t<14)open=0;if(!open)return;

  X.globalAlpha=open*(t<11?.55:1);
  if(t<11){X.fillStyle='rgb(255,248,230)';X.beginPath();X.moveTo(...p0);X.lineTo(...p1);X.lineTo(...p2);X.lineTo(...p3);X.fill()}
  else{quad(G,b.c*80,b.r*75+75,80,-75,p0,p1,p3)}});
 X.restore();
 // blocks
 blocks.forEach((b,i)=>{if(t<b.tin-1)return;let x=WX+b.c*BW,y=WY+b.r*BH,a=1,rot=0;
  if(t<b.tin+.3){const k=ss(b.tin-1,b.tin+.3,t),e=1-k;x+=b.ox*e*e;y+=b.oy*e*e;rot=b.rot*e*e}

  if(a<=0)return;X.save();X.globalAlpha=a;X.translate(x+BW/2,y+BH/2);X.rotate(rot);
  const lit=t<11?.9:(t<14?.08:.35);X.fillStyle=`rgb(${110*lit+25|0},${110*lit+25|0},${115*lit+28|0})`;X.fillRect(-BW/2,-BH/2,BW,BH);
  X.strokeStyle='rgba(0,0,0,.6)';X.strokeRect(-BW/2,-BH/2,BW,BH);X.fillStyle=`rgba(${i==bi&&t>14?'255,210,120':'30,30,32'},${t<11||t>14?.9:.2})`;
  X.font='bold 7px Arial';X.textAlign='center';X.textBaseline='middle';X.fillText(b.w,0,0);X.restore()});
 // busy sparks
 if(t>14.6&&t<18){const d=t-14.6;X.save();X.globalCompositeOperation='lighter';sparks.forEach(s=>{const r=s.s*d,px=WX+2.5*BW+Math.cos(s.a)*r,py=WY+4.5*BH+Math.sin(s.a)*r+d*d*30;X.globalAlpha=cl(1-d/(1.5+s.l*2));X.fillStyle='#ffcc66';X.fillRect(px,py,2,2)});X.restore()}
 // dust

}
