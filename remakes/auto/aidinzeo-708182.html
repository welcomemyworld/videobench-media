<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#000;height:100%;overflow:hidden}
canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
</style></head><body><canvas id="c" width="1280" height="720"></canvas><script>
const W=1280,H=720,DUR=36;window.DUR=DUR;
const cv=document.getElementById('c'),x=cv.getContext('2d');
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px';}
addEventListener('resize',fit);fit();
const q=new URLSearchParams(location.search);const off=parseFloat(q.get('t')||0)||0;
const S=1/8.4,ox=0.62,oy=0.22,fx=ox/(1-S),fy=oy/(1-S),LV=6,K=Math.log(8.4);
const N=6;
// child transforms: rotations around ring; one of them is exactly (S, 0 rot, offset)
const ang0=Math.atan2(oy,ox),R0=Math.hypot(ox,oy);
const kids=[];for(let i=0;i<N;i++){const a=ang0+i*Math.PI*2/N;kids.push({a,tx:Math.cos(a)*R0,ty:Math.sin(a)*R0,rot:i*Math.PI*2/N});}
let st=performance.now();
function draw(depth,hue,tt,sz){
  // unit-space shape; sz = pixel size of unit
  if(sz<1.5)return;
  x.lineWidth=1.6/sz*2;
  for(let i=0;i<N;i++){const k=kids[i];
    x.strokeStyle=`hsla(${(hue+i*12)%360},90%,${55+10*Math.sin(tt+i)}%,0.85)`;
    x.beginPath();x.moveTo(0,0);
    const ca=k.a+0.5;x.quadraticCurveTo(Math.cos(ca)*0.4,Math.sin(ca)*0.4,k.tx*0.88,k.ty*0.88);x.stroke();
  }
  const g=x.createRadialGradient(0,0,0,0,0,0.28);
  g.addColorStop(0,`hsla(${hue},100%,85%,0.95)`);g.addColorStop(0.4,`hsla(${hue+30},90%,55%,0.5)`);g.addColorStop(1,'hsla(0,0%,0%,0)');
  x.fillStyle=g;x.beginPath();x.arc(0,0,0.28,0,7);x.fill();
  x.strokeStyle=`hsla(${hue+180},80%,70%,0.7)`;x.beginPath();x.arc(0,0,0.5,0,7);x.stroke();
  x.beginPath();for(let j=0;j<=12;j++){const a=j*Math.PI/6+tt*0.3,r=j%2?0.18:0.34;x[j?'lineTo':'moveTo'](Math.cos(a)*r,Math.sin(a)*r);}x.stroke();
  if(depth<=0)return;
  for(const k of kids){x.save();x.translate(k.tx,k.ty);x.rotate(k.rot);x.scale(S,S);draw(depth-1,hue+40,tt,sz*S);x.restore();}
}
function frame(){
  const T=((performance.now()-st)/1000+off)%DUR;
  const lt=T/DUR*LV, z=Math.exp(lt*K), f=lt%1, lz=Math.exp(f*K);
  x.fillStyle='#03030a';x.fillRect(0,0,W,H);
  const bg=x.createRadialGradient(W/2,H/2,0,W/2,H/2,700);bg.addColorStop(0,'rgba(40,20,80,0.5)');bg.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=bg;x.fillRect(0,0,W,H);
  const base=300;
  x.save();x.translate(W/2,H/2);x.rotate(-f*0.0);x.scale(base*lz,base*lz);x.translate(-fx,-fy);
  // draw from the loop-identical frame; render ancestors not needed since parent covers view
  x.save();x.translate(fx,fy);x.scale(8.4,8.4);x.translate(-fx,-fy); // one parent level for surroundings
  draw(4,200+lt*40,T,base*lz*8.4);x.restore();
  x.restore();
  // HUD
  x.fillStyle='rgba(0,0,0,0.45)';x.fillRect(30,H-80,330,52);
  x.fillStyle='#cfe';x.font='bold 26px sans-serif';x.fillText('×'+Math.round(z).toLocaleString(),48,H-44);
  x.font='15px sans-serif';x.fillStyle='rgba(200,230,255,0.7)';x.fillText('Zoom',260,H-46);
  const fin=T>DUR-4?Math.min(1,(T-DUR+4)/1.5)*Math.min(1,(DUR-T)/0.6):(T<3?Math.min(1,(3-T)):0);
  if(fin>0){x.globalAlpha=fin;x.fillStyle='#fff';x.font='bold 40px sans-serif';x.textAlign='center';
    x.fillText(T<3?'Endless Zoom':'×'+Math.round(z).toLocaleString()+' — back to the beginning',W/2,90);x.textAlign='left';x.globalAlpha=1;}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
