<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>他的糖葫芦</title>
<style>
html,body{margin:0;background:#000;height:100%;overflow:hidden}
canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#f3e6cf}
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<script>
window.DUR=34;
const cv=document.getElementById('c'),X=cv.getContext('2d');
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);cv.style.width=1280*s+'px';cv.style.height=720*s+'px';}
addEventListener('resize',fit);fit();
const q=new URLSearchParams(location.search);const off=parseFloat(q.get('t')||'0')||0;
const t0=performance.now()-off*1000;
const INK='#3a2a20';
// seeded noise for paper
function rnd(i){const s=Math.sin(i*127.1+311.7)*43758.5;return s-Math.floor(s);}
const grain=document.createElement('canvas');grain.width=1280;grain.height=720;
{const g=grain.getContext('2d');for(let i=0;i<9000;i++){g.fillStyle=`rgba(90,60,30,${rnd(i)*0.07})`;g.fillRect(rnd(i+1)*1280,rnd(i+2)*720,1+rnd(i+3)*2,1+rnd(i+4)*2);}}
// paper shape: jittered polygon with shadow
function paper(fn,col,sh=4){
  X.save();X.translate(sh,sh);X.fillStyle='rgba(60,35,15,0.22)';X.beginPath();fn();X.fill();X.restore();
  X.fillStyle=col;X.strokeStyle=INK;X.lineWidth=2;X.beginPath();fn();X.fill();X.stroke();
}
function rr(x,y,w,h,r){X.roundRect(x,y,w,h,r);}
function pin(x,y){X.fillStyle='#c9a24a';X.beginPath();X.arc(x,y,2.5,0,7);X.fill();}
function limb(x,y,a,len,w,col,a2,len2,hand){
  X.save();X.translate(x,y);X.rotate(a);
  paper(()=>rr(-w/2,-w/2,w,len+w/2,w/2),col,3);pin(0,0);
  X.translate(0,len);X.rotate(a2||0);
  paper(()=>rr(-w/2,-w/2,w,len2+w/2,w/2),col,3);pin(0,0);
  if(hand)hand(len2);
  X.restore();
}
function ease(x){x=Math.max(0,Math.min(1,x));return x*x*(3-2*x);}
function face(hx,hy,r,mood,t){
  X.fillStyle=INK;
  if(mood=='happy'){X.lineWidth=2.5;X.strokeStyle=INK;
    X.beginPath();X.arc(hx+r*0.15,hy-2,4,Math.PI,0);X.stroke();
    X.beginPath();X.arc(hx+r*0.55,hy-2,4,Math.PI,0);X.stroke();
    X.beginPath();X.arc(hx+r*0.4,hy+8,7,0.1,Math.PI-0.1);X.stroke();
    X.fillStyle='rgba(230,110,100,0.5)';X.beginPath();X.arc(hx+r*0.65,hy+6,5,0,7);X.fill();
  }else if(mood=='stern'){
    X.beginPath();X.arc(hx+r*0.2,hy,2.6,0,7);X.arc(hx+r*0.58,hy,2.6,0,7);X.fill();
    X.lineWidth=2.5;X.strokeStyle=INK;X.beginPath();X.moveTo(hx+r*0.05,hy-9);X.lineTo(hx+r*0.3,hy-6);
    X.moveTo(hx+r*0.45,hy-6);X.lineTo(hx+r*0.72,hy-9);X.moveTo(hx+r*0.25,hy+12);X.lineTo(hx+r*0.6,hy+12);X.stroke();
  }else if(mood=='giggle'){
    X.lineWidth=2.5;X.strokeStyle=INK;
    X.beginPath();X.moveTo(hx+r*0.1,hy-4);X.lineTo(hx+r*0.25,hy);X.lineTo(hx+r*0.1,hy+3);
    X.moveTo(hx+r*0.65,hy-4);X.lineTo(hx+r*0.5,hy);X.lineTo(hx+r*0.65,hy+3);X.stroke();
    X.fillStyle='rgba(230,110,100,0.55)';X.beginPath();X.arc(hx+r*0.05,hy+8,5,0,7);X.arc(hx+r*0.7,hy+8,5,0,7);X.fill();
  }else{
    X.beginPath();X.arc(hx+r*0.2,hy,2.6,0,7);X.arc(hx+r*0.58,hy,2.6,0,7);X.fill();
  }
}
function tanghulu(n){
  X.strokeStyle='#8a6a3a';X.lineWidth=3;X.beginPath();X.moveTo(0,10);X.lineTo(0,-95);X.stroke();
  for(let i=0;i<n;i++){const y=-88+i*16;
    paper(()=>X.arc(0,y,9,0,7),'#d6302a',2);
    X.fillStyle='rgba(255,255,255,0.7)';X.beginPath();X.arc(-3,y-3,2.5,0,7);X.fill();}
}
// teacher: tall, sparse hair, backpack
function teacher(x,y,ph,o){
  const s=Math.sin(ph),bob=Math.abs(Math.cos(ph))*5*(o.walk?1:0);
  X.save();X.translate(x,y-bob);
  const legA=o.walk?s*0.45:0;
  limb(-8,-150,legA,72,18,'#4b5563',-Math.max(0,s)*0.3,70);
  limb(8,-150,-legA,72,18,'#556070',-Math.max(0,-s)*0.3,70);
  // backpack
  if(o.pack)paper(()=>rr(-52,-262,30,80,10),'#2f6b6a');
  limb(-6,-250,o.walk?-s*0.35:0.1,55,15,'#7d8c99',-0.3,50);
  paper(()=>rr(-28,-270,58,128,16),'#8fa0ad');
  if(o.pack){X.strokeStyle='#1f4746';X.lineWidth=5;X.beginPath();X.moveTo(-20,-266);X.lineTo(-6,-170);X.stroke();}
  // head
  paper(()=>X.ellipse(4,-302,28,34,0,0,7),'#f2d3b3');
  X.strokeStyle=INK;X.lineWidth=2;
  for(let i=0;i<6;i++){const a=-2.6+i*0.28;X.beginPath();X.moveTo(4+Math.cos(a)*28,-302+Math.sin(a)*34);
    X.quadraticCurveTo(4+Math.cos(a)*36,-302+Math.sin(a)*44+Math.sin(ph*2+i)*2,4+Math.cos(a+0.2)*38,-302+Math.sin(a)*40);X.stroke();}
  // glasses
  X.lineWidth=2;X.beginPath();X.arc(8,-304,8,0,7);X.arc(26,-304,7,0,7);X.stroke();
  face(0,-304,40,o.mood,ph);
  // front arm
  if(o.hulu!==undefined){
    const raise=o.bite;
    limb(6,-250,-0.5-raise*0.6,52,15,'#9aabb8',-1.6+raise*0.2,46,L=>{X.translate(0,L);X.rotate(2.1-raise*0.4);tanghulu(o.hulu);});
  }else if(o.point){
    limb(6,-250,-1.9+Math.sin(ph*3)*0.15,52,15,'#9aabb8',-0.2,46,L=>{X.translate(0,L);X.fillStyle='#d6302a';X.fillRect(-3,0,6,22);});
  }else limb(6,-250,o.walk?s*0.35:-0.1,52,15,'#9aabb8',-0.3,48);
  X.restore();
}
function student(x,y,ph,col,hair,o){
  const s=Math.sin(ph),shake=o.giggle?Math.sin(ph*9)*2.5:0,bob=o.walk?Math.abs(Math.cos(ph))*4:0;
  X.save();X.translate(x+shake,y-bob);
  const l=o.walk?s*0.4:0;
  limb(-6,-90,l,46,15,'#3d4a5c',-0.25,44);limb(6,-90,-l,46,15,'#465569',-0.25,44);
  limb(0,-170,o.walk?-s*0.4:0.2,38,13,col,-0.3,34);
  X.save();X.rotate(o.hunch||0);
  paper(()=>rr(-22,-180,46,96,16),col);
  paper(()=>X.arc(4,-206,25,0,7),'#f4d6b6');
  X.fillStyle=hair;X.strokeStyle=INK;X.beginPath();X.arc(0,-212,26,Math.PI*0.9,Math.PI*2.05);X.closePath();X.fill();X.stroke();
  if(o.pony){X.beginPath();X.ellipse(-26,-200,8,16,0.4,0,7);X.fill();X.stroke();}
  face(-2,-204,32,o.mood,ph);
  if(o.cover)limb(6,-170,-2.3,34,13,col,-1.5,30);
  else limb(6,-170,o.walk?s*0.4:-0.2,36,13,col,-0.3,34);
  X.restore();X.restore();
}
function caption(txt,a){
  if(a<=0)return;X.save();X.globalAlpha=a;X.font='bold 34px "PingFang SC","Microsoft YaHei",sans-serif';
  const w=X.measureText(txt).width+60;
  paper(()=>rr(640-w/2,610,w,64,10),'#fff8ea');
  X.fillStyle=INK;X.textAlign='center';X.textBaseline='middle';X.fillText(txt,640,643);X.restore();
}
const caps=[[4.3,7.8,'读研时，有位老师超级较真'],[7.9,11.3,'改作业一点情面都不留'],[11.4,14.8,'我还偷偷觉得他太执着于“忠实”……'],
[15.6,19,'有天吃完饭出食堂，一抬头——'],[19.1,22.6,'高高的个子，头发稀稀，背着双肩包'],[22.7,26.2,'手里居然举着一根糖葫芦！'],
[26.3,30,'我们决定偷偷跟上去，憋笑憋到发抖'],[30.1,33.6,'到现在还记得这一幕，非常可爱。']];
function classroom(t){
  X.fillStyle='#e8d6b4';X.fillRect(0,0,1280,720);
  paper(()=>rr(140,90,760,330,8),'#2e4a3c');
  X.strokeStyle='rgba(255,255,255,0.8)';X.lineWidth=3;X.font='36px serif';X.fillStyle='rgba(255,255,255,0.85)';
  X.fillText('翻译 = 忠实 !!!',220,180);X.fillText('信 · 达 · 雅',220,250);
  X.fillStyle='#e8c9a0';X.fillRect(0,560,1280,160);
  // papers with red marks
  for(let i=0;i<3;i++){const px=880+i*110,py=440;
    paper(()=>rr(px,py,90,120,3),'#fffdf6');
    X.strokeStyle='#bbb';X.lineWidth=2;for(let k=0;k<5;k++){X.beginPath();X.moveTo(px+10,py+20+k*18);X.lineTo(px+80,py+20+k*18);X.stroke();}
    const p=ease((t-6-i*0.6)/0.4);X.strokeStyle='#d6302a';X.lineWidth=5;X.beginPath();
    X.moveTo(px+20,py+30);X.lineTo(px+20+50*p,py+30+60*p);X.moveTo(px+70,py+30);X.lineTo(px+70-50*p,py+30+60*p);X.stroke();}
  teacher(560,600,t*3,{mood:'stern',point:true});
  // students row front
  const sw=t>8;
  student(180,720,t*2,'#e2a24c','#3a2a20',{mood:sw?'':'',hunch:sw?0.12:0});
  student(330,720,t*2+1,'#7fae7a','#4a3020',{pony:true,hunch:sw?0.12:0});
  if(sw){X.fillStyle='#7fc4e8';for(const sx of[205,355]){const k=(t*1.5)%1;X.beginPath();X.ellipse(sx+30,520+k*20,5,8,0,0,7);X.fill();}}
  if(t>11.4){X.save();X.globalAlpha=ease(t-11.4);X.font='bold 28px sans-serif';X.fillStyle=INK;
    paper(()=>X.ellipse(330,430,70,40,0,0,7),'#fff');X.fillStyle=INK;X.textAlign='center';X.fillText('哼…',330,440);X.restore();}
}
function outdoor(t){
  const lt=t-14.8,tx=380+lt*62;
  const cam=Math.max(0,tx-560);
  const g=X.createLinearGradient(0,0,0,500);g.addColorStop(0,'#f6d7a8');g.addColorStop(1,'#f8ead0');X.fillStyle=g;X.fillRect(0,0,1280,720);
  X.save();X.translate(-cam*0.3,0);
  for(let i=0;i<8;i++){const hx=i*320-100;paper(()=>X.ellipse(hx,470,200,120,0,Math.PI,0),'#c9d7a0',0);}
  X.restore();
  X.save();X.translate(-cam,0);
  // canteen
  paper(()=>rr(-60,170,380,330,6),'#d9a87c');
  paper(()=>rr(-80,150,420,40,4),'#a84c3a');
  X.fillStyle=INK;X.font='bold 36px sans-serif';X.textAlign='center';X.fillText('食 堂',130,240);
  paper(()=>rr(90,330,90,170,4),'#6b4a35');
  for(let i=0;i<14;i++){const x=480+i*260;
    paper(()=>rr(x-10,330,20,190,4),'#8a5f3e');
    paper(()=>{X.arc(x,300,70,0,7);},i%2?'#7fae6a':'#93bd78');
    if(i%2){paper(()=>rr(x+120,360,6,160,2),'#555');paper(()=>rr(x+108,350,30,18,5),'#f3d36b');}}
  X.restore();
  X.fillStyle='#d8c49c';X.fillRect(0,500,1280,220);
  X.fillStyle='#cdb68a';for(let i=0;i<30;i++){const x=((i*90-cam)%1300+1300)%1300-20;X.fillRect(x,540+(i%3)*40,50,4);}
  // teacher
  const bitePh=(lt%4.2),bite=t>23?Math.max(0,Math.sin(Math.min(1,bitePh/1.2)*Math.PI)):0;
  const n=5-Math.min(3,Math.floor(Math.max(0,t-23)/4.2+0.0));
  const sx=tx-cam;
  teacher(sx,600,lt*4.4,{walk:true,pack:true,mood:'happy',hulu:n,bite});
  if(t>22.7){X.save();X.globalAlpha=0.8;X.fillStyle='#d6302a';X.font='30px serif';
    for(let i=0;i<3;i++){const k=(lt*0.6+i/3)%1;X.globalAlpha=1-k;X.fillText(i%2?'♪':'♫',sx+40+i*20,250-k*80);}X.restore();}
  // students follow
  if(t>25.6){
    const st=t-25.6,stx=Math.min(sx-260,-60+st*230);
    student(stx,640,lt*4.4,'#e2a24c','#3a2a20',{walk:true,giggle:true,mood:'giggle',cover:true,hunch:0.15});
    student(stx-110,650,lt*4.4+1.3,'#7fae7a','#4a3020',{walk:true,giggle:true,mood:'giggle',cover:true,pony:true,hunch:0.15});
    if(st>1.2){X.font='bold 30px sans-serif';X.fillStyle='#d6302a';X.textAlign='center';
      const j=Math.sin(t*20)*3;X.fillText('噗…',stx-30+j,380);X.fillText('嘘！',stx-140-j,395);}
  }
  if(t>19&&t<22.7){X.save();X.globalAlpha=ease((t-19)*2)*ease((22.7-t)*2);X.strokeStyle='#d6302a';X.lineWidth=4;
    X.setLineDash([10,8]);X.beginPath();X.arc(sx,420,170,0,7);X.stroke();X.restore();}
}
function frame(){
  const t=((performance.now()-t0)/1000)%window.DUR;
  if(t<4.2){
    X.fillStyle='#f3e6cf';X.fillRect(0,0,1280,720);
    X.save();X.translate(640,330);const a=ease(t/1.2);X.globalAlpha=a*ease((4.2-t)/0.6);X.rotate(Math.sin(t*2)*0.02);
    paper(()=>rr(-300,-90,600,180,14),'#fff8ea',7);
    X.fillStyle='#d6302a';X.font='bold 80px "PingFang SC","Microsoft YaHei",serif';X.textAlign='center';X.textBaseline='middle';
    X.fillText('《他的糖葫芦》',0,-10);X.font='26px sans-serif';X.fillStyle=INK;X.fillText('— 散步纸偶 · 小动画 —',0,60);
    X.translate(330,0);X.rotate(0.3);tanghulu(5);X.restore();
  }else if(t<14.8)classroom(t);
  else outdoor(t);
  for(const c of caps)caption(c[2],ease((t-c[0])*3)*ease((c[1]-t)*3));
  if(t>32.8){X.fillStyle=`rgba(0,0,0,${ease((t-32.8)/1.2)})`;X.fillRect(0,0,1280,720);}
  if(t>4&&t<4.6||t>14.6&&t<15.2){const k=1-Math.abs((t%1>0.5?t-0.3:t)%1-0.3)/0.3;X.fillStyle=`rgba(243,230,207,${Math.max(0,Math.min(1,1-Math.abs(t-(t<10?4.3:14.9))*3.3))})`;X.fillRect(0,0,1280,720);}
  X.drawImage(grain,0,0);
  const v=X.createRadialGradient(640,360,300,640,360,800);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(60,30,10,0.35)');X.fillStyle=v;X.fillRect(0,0,1280,720);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
