<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flowline 2.0 — Launch</title>
<style>
html,body{margin:0;background:#000;height:100%;overflow:hidden}
#s{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
</style>
</head>
<body>
<canvas id="s" width="1280" height="720"></canvas>
<script>
// Fictional product "Flowline" (no external assets allowed; everything drawn procedurally)
window.DUR=30;
const c=document.getElementById('s'),x=c.getContext('2d'),W=1280,H=720;
function fit(){const k=Math.min(innerWidth/W,innerHeight/H);c.style.width=W*k+'px';c.style.height=H*k+'px';}
addEventListener('resize',fit);fit();
const q=new URLSearchParams(location.search),T0=parseFloat(q.get('t'))||0,start=performance.now();
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const eo=t=>1-Math.pow(1-cl(t),3), eio=t=>{t=cl(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const seg=(t,a,b)=>cl((t-a)/(b-a));
const F='"Helvetica Neue",Helvetica,Arial,sans-serif';
function rr(X,Y,w,h,r){x.beginPath();x.roundRect(X,Y,w,h,r);}
function grad(x0,y0,x1,y1){const g=x.createLinearGradient(x0,y0,x1,y1);g.addColorStop(0,'#7c5cff');g.addColorStop(1,'#20d3ff');return g;}
function txt(s,X,Y,size,col,al='center',wt='700',a=1){x.globalAlpha=a;x.font=wt+' '+size+'px '+F;x.textAlign=al;x.textBaseline='middle';x.fillStyle=col;x.fillText(s,X,Y);x.globalAlpha=1;}
function sceneA(t,a,b,fi=.5,fo=.5){return Math.min(seg(t,a,a+fi),1-seg(t,b-fo,b));}

function bg(t){
 x.fillStyle='#05060d';x.fillRect(0,0,W,H);
 const bl=[[300,200,'124,92,255'],[1000,500,'32,211,255'],[700,650,'255,80,180']];
 bl.forEach((b,i)=>{const px=b[0]+Math.sin(t*.3+i*2)*120,py=b[1]+Math.cos(t*.25+i)*80;
  const g=x.createRadialGradient(px,py,0,px,py,500);g.addColorStop(0,'rgba('+b[2]+',.22)');g.addColorStop(1,'rgba('+b[2]+',0)');x.fillStyle=g;x.fillRect(0,0,W,H);});
 x.strokeStyle='rgba(255,255,255,.035)';x.lineWidth=1;const o=(t*12)%60;
 for(let i=-60;i<W+60;i+=60){x.beginPath();x.moveTo(i+o,0);x.lineTo(i+o,H);x.stroke();}
 for(let j=-60;j<H+60;j+=60){x.beginPath();x.moveTo(0,j+o);x.lineTo(W,j+o);x.stroke();}
 for(let i=0;i<40;i++){const px=(i*197+t*(8+i%5*4))%W,py=(i*331)%H+Math.sin(t+i)*10;x.fillStyle='rgba(255,255,255,'+(.15+.15*Math.sin(t*2+i))+')';x.fillRect(px,py,2,2);}
}
function logo(cx,cy,s,p){
 x.save();x.translate(cx,cy);x.scale(s,s);x.lineCap='round';x.lineWidth=10;x.strokeStyle=grad(-50,-50,50,50);
 x.shadowColor='#7c5cff';x.shadowBlur=30;
 for(let k=0;k<3;k++){const pp=cl(p*3-k);if(pp<=0)continue;x.beginPath();
  for(let i=0;i<=40*pp;i++){const u=i/40,X=-45+u*90,Y=-25+k*25+Math.sin(u*Math.PI*2+k)*10;i?x.lineTo(X,Y):x.moveTo(X,Y);}x.stroke();}
 x.restore();
}
function intro(t){
 const a=sceneA(t,0,4.2,.3,.6);if(a<=0)return;x.globalAlpha=a;
 const p=eo(seg(t,.3,2));logo(W/2,300-eo(seg(t,2,2.8))*20,1.4+(1-p)*.6,p);
 const r=eo(seg(t,2,3));x.save();x.beginPath();x.rect(0,360,W,90);x.clip();
 txt('Flowline',W/2,410+(1-r)*80,76,'#fff','center','800',a);x.restore();
 txt('INTRODUCING VERSION 2.0',W/2,480,16,'rgba(200,210,255,.8)','center','600',a*seg(t,2.6,3.4));
 x.globalAlpha=1;
 const f=1-seg(t,.3,1.2);if(f>0){x.fillStyle='rgba(255,255,255,'+f*.3+')';x.fillRect(0,0,W,H);}
}
function kinetic(t){
 const words=[['Your work.',4.2],['Your data.',5.6],['One flow.',7]];
 words.forEach(([w,s],i)=>{const e=s+(i<2?1.4:1.8);const a=sceneA(t,s,e,.25,.3);if(a<=0)return;
  const p=eo(seg(t,s,s+.6)),sc=1+(t-s)*.04;x.save();x.translate(W/2,H/2);x.scale(sc,sc);
  x.font='800 120px '+F;x.textAlign='center';x.textBaseline='middle';x.globalAlpha=a;
  x.fillStyle=i==2?grad(-300,0,300,0):'#fff';x.filter='blur('+((1-p)*12)+'px)';x.fillText(w,0,(1-p)*40);x.filter='none';x.restore();x.globalAlpha=1;});
}
function dashboard(t){
 const a=sceneA(t,8.6,16.4,.6,.5);if(a<=0)return;
 const p=eio(seg(t,8.6,10)),z=.85+.1*p+(t-10)*.006;
 x.save();x.globalAlpha=a;x.translate(W/2,H/2+(1-p)*200);x.scale(z,z);x.transform(1,0,(1-p)*-.2,1,0,0);
 x.shadowColor='rgba(124,92,255,.5)';x.shadowBlur=60;rr(-520,-290,1040,580,18);x.fillStyle='#0e1020';x.fill();x.shadowBlur=0;
 x.strokeStyle='rgba(255,255,255,.12)';x.stroke();
 ['#ff5f57','#febc2e','#28c840'].forEach((cc,i)=>{x.fillStyle=cc;x.beginPath();x.arc(-495+i*20,-268,6,0,7);x.fill();});
 rr(-520,-250,180,540,0);x.fillStyle='#0a0c18';x.fill();
 logo(-480,-215,.25,1);txt('Flowline',-445,-215,16,'#fff','left');
 ['Overview','Pipelines','Insights','Team','Settings'].forEach((s,i)=>{if(i==0){rr(-508,-178+i*44,156,34,8);x.fillStyle='rgba(124,92,255,.25)';x.fill();}txt(s,-490,-161+i*44,14,i?'#8890b0':'#fff','left','600');});
 txt('Overview',-310,-215,24,'#fff','left','800');
 const kp=[['Revenue','$',482900],['Active users','',128450],['Conversion','%',12.4]];
 kp.forEach((k,i)=>{const X=-310+i*270,Y=-175,pp=eo(seg(t,10+i*.2,11.5+i*.2));rr(X,Y,250,90,12);x.fillStyle='#151833';x.fill();
  txt(k[0],X+18,Y+26,13,'#8890b0','left','600');const v=k[2]*pp;
  txt(k[1]=='$'?'$'+Math.round(v).toLocaleString():k[1]=='%'?v.toFixed(1)+'%':Math.round(v).toLocaleString(),X+18,Y+58,26,'#fff','left','800');
  txt('▲ '+(8+i*5)+'%',X+232,Y+26,12,'#3ee6a0','right','700');});
 rr(-310,-65,520,330,12);x.fillStyle='#151833';x.fill();txt('Growth',-292,-40,15,'#fff','left','700');
 const cp=eio(seg(t,10.5,13));x.save();x.beginPath();x.rect(-300,-60,500*cp,330);x.clip();
 x.beginPath();for(let i=0;i<=50;i++){const X=-290+i*9.6,Y=220-i*3.4-Math.sin(i*.5)*18-Math.sin(i*.17)*25;i?x.lineTo(X,Y):x.moveTo(X,Y);}
 x.strokeStyle=grad(-290,0,200,0);x.lineWidth=4;x.stroke();x.lineTo(190,250);x.lineTo(-290,250);
 const g=x.createLinearGradient(0,0,0,250);g.addColorStop(0,'rgba(124,92,255,.4)');g.addColorStop(1,'rgba(124,92,255,0)');x.fillStyle=g;x.fill();x.restore();
 rr(230,-65,270,330,12);x.fillStyle='#151833';x.fill();txt('Pipelines',248,-40,15,'#fff','left','700');
 for(let i=0;i<7;i++){const bp=eo(seg(t,11+i*.12,12.2+i*.12)),h=(60+((i*53)%120))*bp;rr(255+i*34,240-h,22,h,5);x.fillStyle=i==4?'#20d3ff':'#3b3f7a';x.fill();}
 // cursor + click
 const cx=-560+eo(seg(t,12.5,14))*860,cy=300-eo(seg(t,12.5,14))*170,ck=seg(t,14,14.6);
 if(ck>0&&ck<1){x.strokeStyle='rgba(32,211,255,'+(1-ck)+')';x.lineWidth=3;x.beginPath();x.arc(cx,cy,ck*40,0,7);x.stroke();}
 if(t>14.2){const tp=eo(seg(t,14.2,14.8));rr(300,40-tp*20,190,70,10);x.globalAlpha=a*tp;x.fillStyle='#20d3ff';x.fill();
  txt('AI: +24% next week',395,75-tp*20,15,'#05060d','center','800',a*tp);x.globalAlpha=a;}
 x.beginPath();x.moveTo(cx,cy);x.lineTo(cx,cy+22);x.lineTo(cx+6,cy+16);x.lineTo(cx+15,cy+16);x.closePath();x.fillStyle='#fff';x.fill();x.strokeStyle='#000';x.lineWidth=1.5;x.stroke();
 x.restore();
 txt('Everything your team needs. In one place.',W/2,50,26,'#fff','center','700',a*seg(t,9.5,10.3));
}
function icon(i,X,Y,t){x.save();x.translate(X,Y);x.strokeStyle='#fff';x.lineWidth=4;x.lineCap='round';
 if(i==0){x.rotate(t*2);x.beginPath();x.arc(0,0,20,.3,2.8);x.stroke();x.beginPath();x.arc(0,0,20,3.4,5.9);x.stroke();}
 else if(i==1){for(let k=0;k<6;k++){x.beginPath();x.arc(Math.cos(k+t)*16,Math.sin(k*1.7+t)*16,3,0,7);x.fillStyle='#fff';x.fill();}x.beginPath();x.arc(0,0,7,0,7);x.stroke();}
 else{x.beginPath();x.moveTo(0,-24);x.lineTo(20,-14);x.lineTo(18,8);x.quadraticCurveTo(10,20,0,26);x.quadraticCurveTo(-10,20,-18,8);x.lineTo(-20,-14);x.closePath();x.stroke();x.beginPath();x.moveTo(-8,0);x.lineTo(-2,7);x.lineTo(9,-6);x.stroke();}
 x.restore();}
function features(t){
 const a=sceneA(t,16.4,22.4,.4,.5);if(a<=0)return;
 txt('Built for how teams actually work',W/2,130,40,'#fff','center','800',a*eo(seg(t,16.4,17.2)));
 const fs=[['Real-time sync','Every change, everywhere, instantly.'],['AI insights','Forecasts and answers, built in.'],['Enterprise security','SOC 2, SSO and end-to-end encryption.']];
 fs.forEach((f,i)=>{const p=eo(seg(t,16.9+i*.3,17.9+i*.3)),X=110+i*370,Y=230+(1-p)*120,fl=Math.sin(t*1.5+i)*6;
  x.save();x.globalAlpha=a*p;x.translate(0,fl);rr(X,Y,320,300,20);x.fillStyle='rgba(20,22,45,.85)';x.fill();x.strokeStyle='rgba(124,92,255,.5)';x.lineWidth=1.5;x.stroke();
  rr(X+30,Y+34,72,72,18);x.fillStyle=grad(X+30,Y+34,X+102,Y+106);x.fill();icon(i,X+66,Y+70,t);
  txt(f[0],X+30,Y+160,26,'#fff','left','800',a*p);txt(f[1],X+30,Y+200,15,'#a0a8cc','left','500',a*p);
  rr(X+30,Y+240,260*eo(seg(t,18+i*.3,20)),6,3);x.fillStyle=grad(X,0,X+300,0);x.fill();x.restore();});
}
function stats(t){
 const a=sceneA(t,22.4,26.4,.4,.5);if(a<=0)return;
 const ss=[[10,'x','faster workflows'],[99.99,'%','uptime SLA'],[50,'k+','teams onboard']];
 ss.forEach((s,i)=>{const p=eo(seg(t,22.6+i*.25,24.2+i*.25)),X=W/2+(i-1)*380,v=s[0]*p;
  x.save();x.globalAlpha=a*cl(p*3);x.font='800 92px '+F;x.textAlign='center';x.textBaseline='middle';x.fillStyle=grad(X-150,0,X+150,0);
  x.fillText((s[0]%1?v.toFixed(2):Math.round(v))+s[1],X,330+(1-p)*30);x.restore();
  txt(s[2],X,410,20,'#c0c6e6','center','600',a*p);
  if(i){x.fillStyle='rgba(255,255,255,'+.15*a+')';x.fillRect(X-190,290,1,140);}});
}
function cta(t){
 const a=sceneA(t,26.4,30.2,.5,.6);if(a<=0)return;
 const p=eo(seg(t,26.4,27.6));logo(W/2,230,1.1,p);
 txt('Flowline 2.0',W/2,345,72,'#fff','center','800',a*p);
 txt('Available today.',W/2,415,30,'#c0c6e6','center','500',a*seg(t,27.2,28));
 const bp=eo(seg(t,27.8,28.6)),pulse=1+Math.sin(t*4)*.02;
 x.save();x.globalAlpha=a*bp;x.translate(W/2,500);x.scale(pulse*bp,pulse*bp);x.shadowColor='#7c5cff';x.shadowBlur=30;
 rr(-150,-32,300,64,32);x.fillStyle=grad(-150,0,150,0);x.fill();x.shadowBlur=0;txt('Start free →',0,0,22,'#fff','center','800',a*bp);x.restore();
 txt('flowline.app',W/2,580,18,'#8890b0','center','600',a*seg(t,28.4,29));
}
function frame(){
 const t=((performance.now()-start)/1000+T0)%window.DUR;
 bg(t);intro(t);kinetic(t);dashboard(t);features(t);stats(t);cta(t);
 const v=x.createRadialGradient(W/2,H/2,300,W/2,H/2,800);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.6)');x.fillStyle=v;x.fillRect(0,0,W,H);
 const e=Math.min(seg(t,0,.4),1-seg(t,window.DUR-.4,window.DUR));x.fillStyle='rgba(0,0,0,'+(1-e)+')';x.fillRect(0,0,W,H);
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
