<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Speaker Carousel</title>
<style>html,body{margin:0;background:#000;height:100%;overflow:hidden}
#s{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:0 0}</style></head>
<body><canvas id="s" width="1280" height="720"></canvas>
<script>
window.DUR=24;
const c=document.getElementById('s'),x=c.getContext('2d');
function fit(){const k=Math.min(innerWidth/1280,innerHeight/720);c.style.transform=`scale(${k}) translate(-50%,-50%)`;c.style.transformOrigin='0 0';c.style.left='50%';c.style.top='50%';c.style.transform=`translate(-50%,-50%) scale(${k})`;c.style.transformOrigin='50% 50%';}
addEventListener('resize',fit);fit();
const q=new URLSearchParams(location.search),off=parseFloat(q.get('t')||0)||0,t0=performance.now();
const N=8,names=['AVA MORENO','KENJI SATO','LENA BRANDT','OMAR HADDAD','PRIYA NAIR','JONAS VEGA','MEI CHEN','SARA OKAFOR'],
roles=['Design Lead','Creative Director','Motion Artist','Engineer','Researcher','Producer','Art Director','Strategist'],
hues=[200,330,40,160,270,10,190,90];
function ease(u){return u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2}
function face(cx,cy,s,h,a){
 x.save();x.globalAlpha=a;x.translate(cx,cy);
 const g=x.createLinearGradient(0,-s,0,s);g.addColorStop(0,`hsl(${h},70%,55%)`);g.addColorStop(1,`hsl(${h+40},60%,20%)`);
 x.fillStyle=g;x.beginPath();x.roundRect(-s*.7,-s,s*1.4,s*2,s*.18);x.fill();
 x.save();x.clip();
 x.fillStyle=`hsl(${h},30%,12%)`;x.beginPath();x.ellipse(0,s*1.05,s*.62,s*.55,0,0,7);x.fill();
 x.fillStyle=`hsl(30,35%,${60+h%20}%)`;x.beginPath();x.arc(0,-s*.12,s*.3,0,7);x.fill();
 x.fillStyle=`hsl(${h},25%,15%)`;x.beginPath();x.arc(0,-s*.22,s*.31,Math.PI*1.05,Math.PI*1.95);x.fill();
 x.restore();
 x.strokeStyle='rgba(255,255,255,.35)';x.lineWidth=2;x.beginPath();x.roundRect(-s*.7,-s,s*1.4,s*2,s*.18);x.stroke();
 x.restore();
}
function frame(){
 const T=((performance.now()-t0)/1000+off)%DUR;
 x.fillStyle='#05060a';x.fillRect(0,0,1280,720);
 const bg=x.createRadialGradient(640,380,50,640,380,700);bg.addColorStop(0,'#1a1f3a');bg.addColorStop(1,'#05060a');x.fillStyle=bg;x.fillRect(0,0,1280,720);
 // step-rotate ring: 3s per speaker
 const step=DUR/N,i=Math.floor(T/step),u=(T%step)/step,mv=ease(Math.min(1,Math.max(0,(u-.7)/.3)));
 const rot=-(i+mv)*Math.PI*2/N, cur=(i+(mv>.5?1:0))%N;
 // floor ring
 x.strokeStyle='rgba(120,160,255,.25)';x.lineWidth=2;x.beginPath();x.ellipse(640,520,460,70,0,0,7);x.stroke();
 const items=[];
 for(let k=0;k<N;k++){const a=k*Math.PI*2/N+rot;items.push({k,z:Math.cos(a),sx:Math.sin(a)});}
 items.sort((a,b)=>a.z-b.z);
 for(const it of items){const d=(it.z+1)/2,s=50+80*d*d,cx=640+it.sx*440,cy=330+ (1-d)*-60+ d*30;
  // reflection
  x.save();x.translate(0,(cy+s)*2+8);x.scale(1,-1);face(cx,cy,s,hues[it.k],.12*d);x.restore();
  face(cx,cy,s,hues[it.k],.25+.75*d);
  if(it.z<.98){x.fillStyle=`rgba(5,6,10,${.6*(1-d)})`;x.beginPath();x.roundRect(cx-s*.7,cy-s,s*1.4,s*2,s*.18);x.fill();}
 }
 // lower third
 const ta=Math.min(1,u/.12)*(1-Math.max(0,(u-.62)/.08)), ap=Math.max(0,Math.min(1,ta));
 x.save();x.globalAlpha=ap;x.textAlign='center';
 x.fillStyle=`hsl(${hues[i]},80%,65%)`;x.fillRect(640-120*ap,612,240*ap,3);
 x.fillStyle='#fff';x.font='bold 40px Helvetica,Arial';x.fillText(names[i],640,600-10*(1-ap));
 x.fillStyle='#aab';x.font='22px Helvetica,Arial';x.fillText(roles[i].toUpperCase(),640,648);x.restore();
 x.fillStyle='rgba(255,255,255,.8)';x.font='bold 22px Helvetica,Arial';x.textAlign='left';x.fillText('SPEAKERS 2025',50,60);
 x.fillStyle='rgba(255,255,255,.5)';x.font='18px Helvetica,Arial';x.textAlign='right';x.fillText(String(i+1).padStart(2,'0')+' / '+String(N).padStart(2,'0'),1230,60);
 const f=Math.min(1,T/.8,(DUR-T)/.8);if(f<1){x.fillStyle=`rgba(0,0,0,${1-f})`;x.fillRect(0,0,1280,720);}
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
