<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Reel publicitario</title>
<style>html,body{margin:0;background:#000;height:100%;overflow:hidden}
#c{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#000}</style></head>
<body><canvas id="c" width="1280" height="720"></canvas>
<script>
window.DUR=15;
const c=document.getElementById('c'),x=c.getContext('2d');
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);c.style.width=1280*s+'px';c.style.height=720*s+'px'}
addEventListener('resize',fit);fit();
const q=new URLSearchParams(location.search);const off=parseFloat(q.get('t'))||0;const t0=performance.now()-off*1000;
const cl=v=>Math.max(0,Math.min(1,v));
const eo=v=>1-Math.pow(1-cl(v),3);
const eb=v=>{v=cl(v);const s=1.7;return 1+(s+1)*Math.pow(v-1,3)+s*Math.pow(v-1,2)};
// window for a scene: fade in/out
const win=(t,a,b)=>cl((t-a)/0.35)*cl((b-t)/0.35);
const parts=[];for(let i=0;i<140;i++)parts.push({x:Math.random()*1280,y:Math.random()*720,s:Math.random()*2+.5,v:Math.random()*40+10,h:Math.random()});
function txt(s,X,Y,size,col,a,w='900',sp=0){x.save();x.globalAlpha=a;x.fillStyle=col;x.font=`${w} ${size}px Helvetica,Arial,sans-serif`;x.textAlign='center';x.textBaseline='middle';if(sp&&x.letterSpacing!==undefined)x.letterSpacing=sp+'px';x.fillText(s,X,Y);x.restore()}
function bg(t){
 const h=(t*12)%360;
 const g=x.createLinearGradient(0,0,1280,720);
 g.addColorStop(0,`hsl(${260+Math.sin(t*.4)*20},70%,9%)`);g.addColorStop(1,`hsl(${320+Math.cos(t*.3)*20},70%,12%)`);
 x.fillStyle=g;x.fillRect(0,0,1280,720);
 for(let k=0;k<3;k++){const px=640+Math.cos(t*.5+k*2)*380,py=360+Math.sin(t*.7+k*2)*200;
  const r=x.createRadialGradient(px,py,0,px,py,420);r.addColorStop(0,`hsla(${[290,190,330][k]},90%,55%,.28)`);r.addColorStop(1,'transparent');x.fillStyle=r;x.fillRect(0,0,1280,720)}
 for(const p of parts){const yy=(p.y-t*p.v)%720;x.fillStyle=`hsla(${280+p.h*80},100%,80%,${.3+p.h*.5})`;x.fillRect(p.x,(yy+720)%720,p.s,p.s)}
}
function orb(X,Y,R,t,a){
 x.save();x.globalAlpha=a;
 const r=x.createRadialGradient(X,Y,0,X,Y,R*2.2);r.addColorStop(0,'rgba(255,80,220,.5)');r.addColorStop(1,'transparent');x.fillStyle=r;x.fillRect(X-R*3,Y-R*3,R*6,R*6);
 const g=x.createLinearGradient(X-R,Y-R,X+R,Y+R);g.addColorStop(0,'#ffd36b');g.addColorStop(.5,'#ff3fa4');g.addColorStop(1,'#6a3bff');
 x.fillStyle=g;x.beginPath();x.arc(X,Y,R,0,7);x.fill();
 x.strokeStyle='rgba(255,255,255,.7)';x.lineWidth=3;
 for(let i=0;i<3;i++){x.beginPath();x.ellipse(X,Y,R*1.5,R*.35,t*.8+i*1.05,0,7);x.stroke()}
 x.fillStyle='rgba(255,255,255,.55)';x.beginPath();x.ellipse(X-R*.35,Y-R*.4,R*.28,R*.14,-.6,0,7);x.fill();
 x.restore()}
function bar(t,a,b){const p=cl((t-a)/(b-a));x.fillStyle='rgba(255,255,255,.15)';x.fillRect(0,712,1280,8);x.fillStyle='#ff3fa4';x.fillRect(0,712,1280*p,8)}
function frame(now){
 const t=((now-t0)/1000)%DUR;
 bg(t);
 // flash
 let fl=Math.max(0,1-t/0.4)+Math.max(0,1-Math.abs(t-6)/0.15)*.6+Math.max(0,1-Math.abs(t-10.5)/0.15)*.6;
 // Scene 1: 0-3 hook
 let a=win(t,0,3);
 if(a>0){const s=eb((t-.1)/.6);
  txt('ALGO',640,280,150*s,'#fff',a,'900',10);
  txt('NUEVO',640,420,170*eb((t-.35)/.6),'#ff3fa4',a,'900',10);
  txt('ESTÁ LLEGANDO',640,540,36,'#ffd36b',a*cl((t-1)/.4),'700',12)}
 // Scene 2: 3-6 product
 a=win(t,3,6);
 if(a>0){const s=eb((t-3)/.7);orb(420,360,140*s,t,a);
  txt('NOVA',880,300,130,'#fff',a*cl((t-3.3)/.4),'900',8);
  txt('Diseñado para destacar',880,400,40,'#ffd36b',a*cl((t-3.7)/.4),'600');
  x.save();x.globalAlpha=a;x.fillStyle='#ff3fa4';x.fillRect(880-160*eo((t-3.9)/.5),450,320*eo((t-3.9)/.5),6);x.restore()}
 // Scene 3: 6-10.5 benefits
 a=win(t,6,10.5);
 if(a>0){txt('¿POR QUÉ ELEGIRNOS?',640,150,56,'#fff',a*eo((t-6)/.4),'900',4);
  const B=[['⚡','Rápido'],['★','Calidad premium'],['♥','Te va a encantar']];
  B.forEach((b,i)=>{const k=eo((t-6.4-i*.5)/.5),X=260+i*380,Y=400+(1-k)*80;
   x.save();x.globalAlpha=a*k;x.fillStyle='rgba(255,255,255,.08)';x.strokeStyle='rgba(255,63,164,.8)';x.lineWidth=3;
   x.beginPath();x.roundRect(X-160,Y-130,320,260,26);x.fill();x.stroke();x.restore();
   txt(b[0],X,Y-40,80,'#ffd36b',a*k,'400');txt(b[1],X,Y+70,36,'#fff',a*k,'800')})}
 // Scene 4: 10.5-15 offer + CTA
 a=win(t,10.5,15.2);
 if(a>0){const s=eb((t-10.6)/.6);const pul=1+Math.sin(t*8)*.03;
  x.save();x.translate(640,280);x.rotate(-.06);x.scale(s*pul,s*pul);x.globalAlpha=a;
  x.fillStyle='#ff3fa4';x.beginPath();x.roundRect(-300,-110,600,220,30);x.fill();x.restore();
  x.save();x.translate(640,280);x.rotate(-.06);x.scale(s*pul,s*pul);txt('-30% OFF',0,0,140,'#fff',a,'900');x.restore();
  txt('SOLO POR TIEMPO LIMITADO',640,450,40,'#ffd36b',a*cl((t-11.3)/.4),'800',6);
  const k=eo((t-11.8)/.5);x.save();x.globalAlpha=a*k;x.fillStyle='#fff';x.beginPath();x.roundRect(640-230,530,460,90,45);x.fill();x.restore();
  txt('¡COMPRALO YA! →',640,577,44,'#6a3bff',a*k,'900')}
 if(fl>0){x.fillStyle=`rgba(255,255,255,${Math.min(1,fl)})`;x.fillRect(0,0,1280,720)}
 bar(t,0,DUR);
 requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script></body></html>
