<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>1857 Napoleon 12-pdr — Procedural Field Cannon</title>
<style>html,body{margin:0;background:#000;height:100%;overflow:hidden}
#c{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#000}</style></head>
<body><canvas id="c" width="1280" height="720"></canvas>
<script>
window.DUR=30;
const cv=document.getElementById('c'),g=cv.getContext('2d');
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);cv.style.width=1280*s+'px';cv.style.height=720*s+'px';}
addEventListener('resize',fit);fit();
const q=new URLSearchParams(location.search),T0=performance.now()-(parseFloat(q.get('t'))||0)*1000;
const SHOT=7.5,ELEV=[2.5,5,8,4],V0=439,PMAX=1650; // m/s, bar approx
const PH=[[0,1.5,'SPONGING BORE'],[1.5,3,'LOADING 12-PDR ROUND + CHARGE'],[3,4.5,'LAYING GUN · ELEVATION SCREW'],[4.5,5,'PRIMING · FRICTION PRIMER'],[5,5.7,'FIRE!'],[5.7,7.5,'RUNNING BACK TO BATTERY']];
const ease=x=>x<0?0:x>1?1:x*x*(3-2*x);
// trajectory with quadratic drag
function traj(eDeg){const pts=[];let a=eDeg*Math.PI/180,x=0,y=1.15,vx=V0*Math.cos(a),vy=V0*Math.sin(a),t=0,dt=0.02,k=0.00035;
 while(y>=0&&t<20){pts.push([x,y,t]);const v=Math.hypot(vx,vy);vx-=k*v*vx*dt;vy-=(9.81+k*v*vy)*dt;x+=vx*dt;y+=vy*dt;t+=dt;}pts.push([x,0,t]);return pts;}
const TR=ELEV.map(traj);
// ---- 3D ----
let faces=[];const cam={yaw:0,pitch:0.28,d:6.2,tx:-0.6,ty:0.8};
function proj(p){let x=p[0]-cam.tx,y=p[1]-cam.ty,z=p[2];const cy=Math.cos(cam.yaw),sy=Math.sin(cam.yaw);
 let x1=x*cy-z*sy,z1=x*sy+z*cy;const cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch);
 let y1=y*cp-z1*sp,z2=y*sp+z1*cp+cam.d;const f=720/z2*1.0;return [440+x1*f,330-y1*f,z2,x1,y1];}
const L=norm([0.5,0.8,-0.4]);function norm(v){const l=Math.hypot(...v)||1;return v.map(a=>a/l);}
function quad(ps,col,sh=1){const a=ps[0],b=ps[1],c=ps[2];const u=[b[0]-a[0],b[1]-a[1],b[2]-a[2]],v=[c[0]-a[0],c[1]-a[1],c[2]-a[2]];
 let n=norm([u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]]);
 const d=Math.abs(n[0]*L[0]+n[1]*L[1]+n[2]*L[2]);const k=(0.35+0.75*d)*sh;const pr=ps.map(proj);
 const spec=Math.pow(d,24)*col[3];faces.push({pr,z:pr.reduce((s,p)=>s+p[2],0)/pr.length,c:`rgb(${col[0]*k+spec|0},${col[1]*k+spec|0},${col[2]*k+spec|0})`});}
function lathe(prof,seg,map,col){for(let i=0;i<prof.length-1;i++)for(let j=0;j<seg;j++){const a0=j/seg*6.283,a1=(j+1)/seg*6.283;
 const P=(k,a)=>map([prof[k][0],prof[k][1]*Math.cos(a),prof[k][1]*Math.sin(a)]);quad([P(i,a0),P(i+1,a0),P(i+1,a1),P(i,a1)],col);}}
function box(map,sx,sy,sz,col){const v=[];for(let i=0;i<8;i++)v.push(map([(i&1?.5:-.5)*sx,(i&2?.5:-.5)*sy,(i&4?.5:-.5)*sz]));
 [[0,1,3,2],[4,5,7,6],[0,1,5,4],[2,3,7,6],[0,2,6,4],[1,3,7,5]].forEach(f=>quad(f.map(i=>v[i]),col));}
const rot=(p,ax,a)=>{const c=Math.cos(a),s=Math.sin(a),[x,y,z]=p;return ax==0?[x,y*c-z*s,y*s+z*c]:ax==1?[x*c+z*s,y,-x*s+z*c]:[x*c-y*s,x*s+y*c,z];};
const add=(p,o)=>[p[0]+o[0],p[1]+o[1],p[2]+o[2]];
const BRONZE=[190,128,62,90],WOOD=[92,104,62,10],IRON=[52,52,56,30],DARK=[20,16,12,0];
const BARREL=[[-0.86,0],[-0.86,0.05],[-0.8,0.065],[-0.74,0.03],[-0.68,0.05],[-0.62,0.16],[-0.58,0.17],[-0.5,0.17],[-0.47,0.165],[0.2,0.14],[0.9,0.112],[0.98,0.118],[1.04,0.132],[1.08,0.13],[1.1,0.13],[1.1,0.058]];
let smoke=[];
function buildScene(elev,recoil,loadT,sponge,wheelRot){
 faces=[];const X=-recoil;
 const bm=p=>add(rot(p,2,elev*Math.PI/180),[X,1.15,0]);
 lathe(BARREL,22,bm,BRONZE);
 lathe([[0,0.058],[-0.05,0.058],[-0.05,0]],10,p=>bm([1.1+p[0],p[1],p[2]]),DARK);
 [-1,1].forEach(s=>lathe([[0,0],[0,0.06],[0.24,0.06],[0.24,0]],10,p=>bm([0,p[1],s*0.12+s*p[0]]).map((v,i)=>i==2?bm([0,0,0])[2]+s*(0.12+p[0]):v),BRONZE));
 // carriage cheeks + trail
 [-1,1].forEach(s=>{const m=p=>{let q=rot(p,2,0.2);return add(q,[X-1.2,0.72,s*0.2]);};box(m,2.9,0.26,0.1,WOOD);});
 box(p=>add(rot(p,2,0.2),[X-2.55,0.45,0]),0.5,0.14,0.5,WOOD);
 box(p=>add(p,[X+0.05,0.73,0]),0.14,0.14,1.7,IRON);
 box(p=>add(rot(p,2,elev*Math.PI/180*0.5),[X-0.75,0.95,0]),0.12,0.25,0.12,IRON);// elevating screw
 // wheels
 [-1,1].forEach(s=>{const C=[X+0.05,0.73,s*0.8];const wm=p=>add(rot(p,2,wheelRot),C);
  const N=18;for(let i=0;i<N;i++){const a0=i/N*6.283,a1=(i+1)/N*6.283;for(const[r0,r1,col]of[[0.64,0.71,WOOD],[0.71,0.735,IRON]]){
   const pt=(r,a,z)=>wm([r*Math.cos(a),r*Math.sin(a),z]);
   quad([pt(r1,a0,-.045),pt(r1,a1,-.045),pt(r1,a1,.045),pt(r1,a0,.045)],col);quad([pt(r0,a0,s*.045),pt(r1,a0,s*.045),pt(r1,a1,s*.045),pt(r0,a1,s*.045)],col);}}
  for(let i=0;i<14;i++){const a=i/14*6.283;box(p=>wm(rot(add(p,[0.38,0,0]),2,a)),0.55,0.045,0.035,WOOD);}
  lathe([[-0.1,0],[-0.1,0.12],[0.1,0.12],[0.1,0]],10,p=>wm([p[1],p[2],p[0]]),WOOD);});
 // rammer/sponge staff
 if(sponge>0){const mz=bm([1.1,0,0]);const dir=rot([1,0,0],2,elev*Math.PI/180);const ins=sponge;
  const head=add(mz,dir.map(v=>-v*ins));const tail=add(head,dir.map(v=>v*2.4));
  const m=p=>{const c=[(head[0]+tail[0])/2,(head[1]+tail[1])/2,0];return add(rot(p,2,elev*Math.PI/180),c);};box(m,2.4,0.035,0.035,WOOD);
  lathe([[0,0],[0,0.055],[0.18,0.055],[0.18,0]],8,p=>add(rot([p[0]-0.09,p[1],p[2]],2,elev*Math.PI/180),head),[70,60,50,0]);}
 if(loadT>0&&loadT<1){const mz=bm([1.1+0.6*(1-loadT),0,0]);lathe([[-.058,0],[-.058,.04],[0,.058],[.058,.04],[.058,0]],10,p=>add(p,mz),IRON);}
 faces.sort((a,b)=>b.z-a.z);
}
function drawGround(){const sky=g.createLinearGradient(0,0,0,720);sky.addColorStop(0,'#2b3546');sky.addColorStop(0.5,'#7d7461');sky.addColorStop(1,'#3a3326');g.fillStyle=sky;g.fillRect(0,0,880,720);
 g.strokeStyle='rgba(255,230,180,0.12)';g.lineWidth=1;for(let i=-8;i<=8;i++){line3([i,0,-6],[i,0,6]);line3([-8,0,i*0.75],[8,0,i*0.75]);}}
function line3(a,b){const p=proj(a),q=proj(b);if(p[2]<0.3||q[2]<0.3)return;g.beginPath();g.moveTo(p[0],p[1]);g.lineTo(q[0],q[1]);g.stroke();}
// ---- ortho panels ----
function panel(x,y,w,h,title){g.fillStyle='#0d1a2a';g.fillRect(x,y,w,h);g.strokeStyle='#5f8fbf';g.lineWidth=1;g.strokeRect(x+.5,y+.5,w-1,h-1);
 g.strokeStyle='rgba(95,143,191,0.18)';for(let i=x+20;i<x+w;i+=20){g.beginPath();g.moveTo(i,y);g.lineTo(i,y+h);g.stroke();}for(let j=y+20;j<y+h;j+=20){g.beginPath();g.moveTo(x,j);g.lineTo(x+w,j);g.stroke();}
 g.fillStyle='#cfe3ff';g.font='bold 12px monospace';g.fillText(title,x+8,y+16);}
function sidePanel(x,y,w,h,e,rec){panel(x,y,w,h,'FIG.1  SIDE ELEVATION (ORTHO)');const s=105,ox=x+130-rec*s,oy=y+h-45;
 g.strokeStyle='#cfe3ff';g.lineWidth=1.3;const a=-e*Math.PI/180;
 const tp=(px,py)=>[ox+(px*Math.cos(a)-py*Math.sin(a))*s,oy-0+(px*Math.sin(a)+py*Math.cos(a))*s];
 g.beginPath();BARREL.forEach(([px,r],i)=>{const p=tp(px,-r);i?g.lineTo(...p):g.moveTo(...p);});for(let i=BARREL.length-1;i>=0;i--)g.lineTo(...tp(BARREL[i][0],BARREL[i][1]));g.closePath();g.stroke();
 g.setLineDash([4,3]);g.beginPath();g.moveTo(...tp(-0.6,-0.058));g.lineTo(...tp(1.1,-0.058));g.moveTo(...tp(-0.6,0.058));g.lineTo(...tp(1.1,0.058));g.stroke();
 g.strokeStyle='#ffb347';g.beginPath();g.moveTo(ox,oy);g.lineTo(ox+150,oy);g.stroke();g.setLineDash([]);
 g.beginPath();g.arc(ox,oy,120,a,0);g.stroke();g.beginPath();g.arc(ox,oy,4,0,7);g.stroke();
 g.fillStyle='#ffb347';g.font='13px monospace';g.fillText('θ = '+e.toFixed(2)+'°',ox+150,oy-8);
 g.fillStyle='#cfe3ff';g.font='11px monospace';g.fillText('BORE 4.62 in · L 66 in · 1227 lb',x+8,y+h-10);g.fillText('RECOIL '+(rec*100).toFixed(0)+' cm',x+w-110,y+h-10);}
function pressPanel(x,y,w,h,tf){panel(x,y,w,h,'FIG.2  CHAMBER PRESSURE p(t)');const px=t=>x+40+t/12*(w-55),py=p=>y+h-25-p/PMAX*(h-50);
 g.strokeStyle='#5f8fbf';g.beginPath();g.moveTo(px(0),py(0));g.lineTo(px(12),py(0));g.moveTo(px(0),py(0));g.lineTo(px(0),py(PMAX));g.stroke();
 const P=t=>PMAX*(t/2.2)*Math.exp(1-t/2.2)*(t<9?1:Math.max(0,1-(t-9)/1.5));
 g.strokeStyle='rgba(255,90,60,0.35)';g.beginPath();for(let t=0;t<=12;t+=0.1)t?g.lineTo(px(t),py(P(t))):g.moveTo(px(t),py(P(t)));g.stroke();
 const ms=tf*1000;let cur=0;if(tf>=0){g.strokeStyle='#ff5a3c';g.lineWidth=2;g.beginPath();for(let t=0;t<=Math.min(12,ms);t+=0.1)t?g.lineTo(px(t),py(P(t))):g.moveTo(px(t),py(P(t)));g.stroke();g.lineWidth=1;
  if(ms<=12){cur=P(ms);g.fillStyle='#fff';g.beginPath();g.arc(px(ms),py(cur),4,0,7);g.fill();}}
 g.fillStyle='#cfe3ff';g.font='11px monospace';g.fillText('t (ms) →',x+w-70,y+h-8);g.fillText('p = '+cur.toFixed(0)+' bar   peak '+PMAX,x+40,y+32);}
function trajPanel(x,y,w,h,k,tf){panel(x,y,w,h,'FIG.3  TRAJECTORY (ORTHO, ×20 VERT)');const R=1900,px=v=>x+20+v/R*(w-40),py=v=>y+h-20-v*20/R*(w-40)*0.5;
 g.strokeStyle='#5f8fbf';g.beginPath();g.moveTo(x+20,py(0));g.lineTo(x+w-20,py(0));g.stroke();g.fillStyle='#7fa7cf';g.font='10px monospace';
 for(let m=0;m<=1800;m+=300){g.fillText(m,px(m)-8,py(0)+12);}
 ELEV.forEach((e,i)=>{const tr=TR[i];g.strokeStyle=i==k?'#7dffb0':'rgba(125,255,176,0.18)';g.setLineDash(i==k?[]:[3,3]);g.beginPath();tr.forEach((p,j)=>j?g.lineTo(px(p[0]),py(p[1])):g.moveTo(px(p[0]),py(p[1])));g.stroke();});g.setLineDash([]);
 const tr=TR[k],fl=tr[tr.length-1];let info='READY';if(tf>=0){const tt=tf*1.6;let p=tr.find(p=>p[2]>=tt)||fl;
  g.fillStyle='#fff';g.beginPath();g.arc(px(p[0]),py(p[1]),4,0,7);g.fill();info=p===fl?'IMPACT '+fl[0].toFixed(0)+' m  ToF '+fl[2].toFixed(2)+' s':'x '+p[0].toFixed(0)+' m  y '+p[1].toFixed(1)+' m';if(p===fl){g.strokeStyle='#ffb347';g.beginPath();g.arc(px(p[0]),py(0),8+((tt*4)%8),0,7);g.stroke();}}
 g.fillStyle='#cfe3ff';g.font='11px monospace';g.fillText('v₀ '+V0+' m/s · θ '+ELEV[k]+'° · '+info,x+8,y+32);}
// ---- loop ----
let lastT=0;
function frame(){const T=((performance.now()-T0)/1000)%DUR,dt=Math.max(0,Math.min(0.05,T-lastT));lastT=T;
 const k=Math.floor(T/SHOT)%ELEV.length,s=T%SHOT,prevE=ELEV[(k+ELEV.length-1)%ELEV.length];
 const e=prevE+(ELEV[k]-prevE)*ease((s-3)/1.5);const tf=s>=5?s-5:-1;
 let rec=0;if(s>=5&&s<5.7)rec=1.1*Math.sin(Math.min(1,(s-5)/0.25)*Math.PI/2);else if(s>=5.7)rec=1.1*(1-ease((s-5.7)/1.6));
 const sponge=s<1.5?1.1*Math.sin(s/1.5*Math.PI):s>=1.5&&s<3?1.4*Math.sin((s-1.5)/1.5*Math.PI):0;
 const loadT=s>=1.5&&s<2.4?(s-1.5)/0.9:0;
 cam.yaw=-0.75+0.35*Math.sin(T*0.21);cam.pitch=0.22+0.06*Math.sin(T*0.13);
 buildScene(e,rec,loadT,sponge,rec/0.73);
 drawGround();
 for(const f of faces){g.fillStyle=f.c;g.beginPath();f.pr.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();g.fill();g.strokeStyle=f.c;g.lineWidth=0.6;g.stroke();}
 // muzzle effects
 const ar=e*Math.PI/180,mz=[-rec+1.15*Math.cos(ar),1.15+1.15*Math.sin(ar),0];
 if(tf>=0&&tf<0.03+dt)for(let i=0;i<60;i++)smoke.push({p:mz.slice(),v:[Math.cos(ar)*(2+Math.random()*7)+Math.random()-.5,Math.sin(ar)*4+Math.random()*1.5,(Math.random()-.5)*3],a:0,r:0.15+Math.random()*0.2});
 if(T<0.05)smoke=[];
 smoke=smoke.filter(o=>o.a<5);for(const o of smoke){o.a+=dt;o.v=o.v.map((v,i)=>v*(1-1.6*dt)+(i==1?0.25*dt:0));o.p=add(o.p,o.v.map(v=>v*dt));o.r+=dt*0.5;}
 smoke.sort((a,b)=>proj(b.p)[2]-proj(a.p)[2]).forEach(o=>{const p=proj(o.p);const r=o.r*720/p[2];g.fillStyle=`rgba(${215-o.a*10|0},${210-o.a*10|0},200,${0.35*(1-o.a/5)})`;g.beginPath();g.arc(p[0],p[1],r,0,7);g.fill();});
 if(tf>=0&&tf<0.18){const p=proj(mz),r=(1-tf/0.18)*140;const gr=g.createRadialGradient(p[0],p[1],0,p[0],p[1],r);gr.addColorStop(0,'rgba(255,250,210,1)');gr.addColorStop(0.3,'rgba(255,170,60,0.8)');gr.addColorStop(1,'rgba(255,80,0,0)');g.fillStyle=gr;g.beginPath();g.arc(p[0],p[1],r,0,7);g.fill();}
 // HUD
 g.fillStyle='rgba(0,0,0,0.55)';g.fillRect(0,0,880,64);g.fillStyle='#f3e2c0';g.font='bold 22px Georgia,serif';g.fillText('M1857 "NAPOLEON" 12-POUNDER LIGHT FIELD GUN',20,30);
 g.font='13px monospace';g.fillStyle='#d9c79e';g.fillText('Procedural geometry · lathe-turned bronze tube · flat-shaded software 3D',20,52);
 const ph=PH.find(p=>s>=p[0]&&s<p[1])||PH[5];g.fillStyle='rgba(0,0,0,0.6)';g.fillRect(20,640,840,60);
 g.fillStyle=ph[2]=='FIRE!'?'#ffb347':'#f3e2c0';g.font='bold 20px monospace';g.fillText('ROUND '+(k+1)+'/4 · '+ph[2],36,668);
 g.font='13px monospace';g.fillStyle='#cfe3ff';g.fillText('ELEV '+e.toFixed(2)+'°   RECOIL '+(rec).toFixed(2)+' m   CHARGE 2.5 lb BLACK POWDER',36,690);
 g.fillStyle='#4a6a8a';g.fillRect(30,700,820*(s/SHOT),3);
 g.fillStyle='#050a12';g.fillRect(880,0,400,720);
 sidePanel(888,8,384,232,e,rec);pressPanel(888,248,384,224,tf);trajPanel(888,480,384,232,k,tf);
 requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script></body></html>
