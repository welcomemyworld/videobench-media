<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>THE LINK — a cinematic teaser</title>
<style>
html,body{margin:0;background:#000;overflow:hidden;height:100%}
#s{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#000}
</style>
</head>
<body>
<canvas id="s" width="1280" height="720"></canvas>
<script>
window.DUR=45;
const W=1280,H=720,c=document.getElementById('s'),x=c.getContext('2d');
function fit(){const k=Math.min(innerWidth/W,innerHeight/H);c.style.width=W*k+'px';c.style.height=H*k+'px'}
fit();addEventListener('resize',fit);
const q=new URLSearchParams(location.search);const off=parseFloat(q.get('t'))||0;
const t0=performance.now()-off*1000;
// seeded random
let sd=7;const R=()=>(sd=(sd*16807)%2147483647)/2147483647;
const stars=[];for(let i=0;i<700;i++)stars.push({x:R()*W,y:R()*H,z:R(),p:R()*6});
const dust=[];for(let i=0;i<160;i++)dust.push({x:R()*W,y:R()*H,v:.2+R(),s:R()*2});
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const ss=(a,b,v)=>{v=cl((v-a)/(b-a));return v*v*(3-2*v)};
const fade=(t,a,b,f=1)=>ss(a,a+f,t)*(1-ss(b-f,b,t));
const SERIF='"Times New Roman",Georgia,serif',SANS='Helvetica,Arial,sans-serif';
function txt(s,X,Y,size,a,sp=0.3,font=SANS,col='255,255,255',wt='300'){
 if(a<=0)return;x.save();x.globalAlpha=a;x.fillStyle=`rgb(${col})`;
 x.font=`${wt} ${size}px ${font}`;x.textAlign='center';x.textBaseline='middle';
 if('letterSpacing' in x)x.letterSpacing=(size*sp)+'px';
 x.fillText(s,X+(size*sp)/2,Y);x.restore();}
function bars(){x.fillStyle='#000';x.fillRect(0,0,W,78);x.fillRect(0,H-78,W,78)}
function starfield(t,drift,bright){
 for(const s of stars){let X=(s.x-t*drift*(s.z*20+2))%W;if(X<0)X+=W;
  const a=bright*(.3+.7*s.z)*(.6+.4*Math.sin(t*2+s.p));
  x.fillStyle=`rgba(220,230,255,${a})`;x.fillRect(X,s.y,s.z*1.8+.4,s.z*1.8+.4);}}
function planet(cx,cy,r,lightAng,a){
 x.save();x.globalAlpha=a;
 let g=x.createRadialGradient(cx+Math.cos(lightAng)*r*.6,cy+Math.sin(lightAng)*r*.6,r*.1,cx,cy,r);
 g.addColorStop(0,'#3b4a63');g.addColorStop(.6,'#121a28');g.addColorStop(1,'#020306');
 x.fillStyle=g;x.beginPath();x.arc(cx,cy,r,0,7);x.fill();
 // atmosphere rim
 x.lineWidth=3;x.strokeStyle='rgba(120,170,255,.35)';x.shadowColor='#6af';x.shadowBlur=30;
 x.beginPath();x.arc(cx,cy,r,lightAng-1.1,lightAng+1.1);x.stroke();x.restore();}
function sun(X,Y,s,a){
 x.save();x.globalCompositeOperation='lighter';x.globalAlpha=a;
 let g=x.createRadialGradient(X,Y,0,X,Y,300*s);
 g.addColorStop(0,'rgba(255,255,240,1)');g.addColorStop(.05,'rgba(255,240,200,.9)');
 g.addColorStop(.3,'rgba(255,170,80,.25)');g.addColorStop(1,'rgba(0,0,0,0)');
 x.fillStyle=g;x.fillRect(X-300*s,Y-300*s,600*s,600*s);
 x.fillStyle='rgba(255,220,170,.35)';x.fillRect(0,Y-1.5*s,W,3*s);// anamorphic flare
 x.fillStyle='rgba(120,170,255,.18)';x.fillRect(0,Y-.5,W,1);
 x.restore();}
function monolith(X,Y,h,a,glow){
 const w=h*0.25;x.save();x.globalAlpha=a;
 if(glow>0){x.shadowColor=`rgba(140,190,255,${glow})`;x.shadowBlur=60*glow}
 let g=x.createLinearGradient(X-w/2,0,X+w/2,0);
 g.addColorStop(0,'#000');g.addColorStop(.85,'#07080b');g.addColorStop(1,'#1c2230');
 x.fillStyle=g;x.fillRect(X-w/2,Y-h,w,h);
 x.shadowBlur=0;x.strokeStyle=`rgba(160,200,255,${.15+glow*.5})`;x.lineWidth=1;
 x.strokeRect(X-w/2,Y-h,w,h);x.restore();}
function grain(t){
 x.save();x.globalAlpha=.05;
 for(let i=0;i<220;i++){const r=Math.sin(i*91.7+t*137.1)*43758.5;const f=r-Math.floor(r);
  const r2=Math.sin(i*12.9+t*78.2)*24634.6;const g2=r2-Math.floor(r2);
  x.fillStyle=f>.5?'#fff':'#000';x.fillRect(f*W,g2*H,2,2);}
 x.restore();
 let v=x.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,H*.95);
 v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.75)');x.fillStyle=v;x.fillRect(0,0,W,H);}
// "music": a visual waveform pulse, synced to beats
function beat(t){const bpm=60,ph=(t*bpm/60)%1;return Math.exp(-ph*5)*ss(8,12,t)}
function frame(){
 let t=((performance.now()-t0)/1000)%DUR;if(t<0)t+=DUR;
 x.globalAlpha=1;x.fillStyle='#000';x.fillRect(0,0,W,H);
 const b=beat(t);
 // ===== ACT I : dawn (0-14)
 if(t<15){
  const k=t/15;
  starfield(t,.4,ss(0,3,t)*(1-ss(13,15,t)));
  const py=H+260-ss(1,12,t)*230;
  sun(W/2,py-430-ss(5,12,t)*40,.6+ss(5,12,t)*.8,ss(5,11,t)*(1-ss(13,15,t)));
  planet(W/2,py+300,620,-Math.PI/2,1-ss(13,15,t));
  txt('A SIGNAL HAS BEEN SENT',W/2,250,26,fade(t,2,7),.6);
  txt('NO ONE KNOWS WHO OPENED IT FIRST',W/2,250,26,fade(t,7.5,12.5),.6);
 }
 // ===== ACT II : the monolith (14-30)
 if(t>13&&t<31){
  const a=ss(13,15,t)*(1-ss(29,31,t));
  x.save();x.globalAlpha=a;
  let sky=x.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#010205');sky.addColorStop(.62,'#0b1220');sky.addColorStop(.63,'#06070a');sky.addColorStop(1,'#000');
  x.fillStyle=sky;x.fillRect(0,0,W,H);x.restore();
  starfield(t,.15,a*.6);
  const hz=H*.63;
  // desert ridges
  for(let L=0;L<3;L++){x.fillStyle=`rgba(${8+L*6},${9+L*6},${13+L*7},${a})`;x.beginPath();x.moveTo(0,H);
   for(let X=0;X<=W;X+=16)x.lineTo(X,hz+L*30+Math.sin(X*.006+L*2)*14*(3-L)+Math.sin(X*.02+L)*4);
   x.lineTo(W,H);x.fill();}
  // dust
  for(const d of dust){d.x=(d.x+d.v*.6)%W;x.fillStyle=`rgba(200,210,230,${a*.25})`;x.fillRect(d.x,d.y*.4+hz,d.s,d.s)}
  const zoom=1+ss(15,29,t)*.5;
  monolith(W/2,hz+70,260*zoom,a,b*.8+ss(24,29,t));
  // shadow
  x.fillStyle=`rgba(0,0,0,${a*.6})`;x.beginPath();x.ellipse(W/2,hz+72,90*zoom,8,0,0,7);x.fill();
  // scan ring
  if(t>20){const r=((t-20)%2)*350;x.strokeStyle=`rgba(140,190,255,${a*(1-r/700)*.5})`;x.lineWidth=1.5;
   x.beginPath();x.ellipse(W/2,hz+70,r,r*.12,0,0,7);x.stroke();}
  txt('IT WAS ALWAYS THERE',W/2,170,24,fade(t,15.5,20),.6);
  txt('WAITING FOR ONE CLICK',W/2,170,24,fade(t,20.5,25.5),.6);
  txt('ELEVEN CHARACTERS. ONE DOORWAY.',W/2,170,24,fade(t,25.5,30),.5);
 }
 // ===== ACT III : alignment & stargate (30-38)
 if(t>29&&t<39){
  const a=ss(29,31,t)*(1-ss(37.5,39,t)),u=t-30;
  x.save();x.globalAlpha=a;x.translate(W/2,H/2);
  for(let i=0;i<60;i++){const zz=((i/60+u*.35)%1),s=1/(1.05-zz);
   const hue=200+Math.sin(i*.7)*40+zz*60;
   x.strokeStyle=`hsla(${hue},90%,${40+zz*30}%,${zz*.7})`;x.lineWidth=zz*4;
   x.strokeRect(-40*s,-12*s*3,80*s,24*s*3);}
  // streaks
  for(let i=0;i<120;i++){const an=i*2.399,zz=((i*.013+u*.6)%1),r=zz*zz*900;
   x.strokeStyle=`rgba(255,${180+i%70},${120+i%120},${zz*.6})`;x.lineWidth=1;
   x.beginPath();x.moveTo(Math.cos(an)*r,Math.sin(an)*r*.6);x.lineTo(Math.cos(an)*r*1.15,Math.sin(an)*r*.69);x.stroke();}
  x.restore();
  txt('BEYOND THE INFINITE',W/2,H/2,40,fade(t,32,37)*a,.7,SERIF,'255,255,255','400');
 }
 // flash
 const fl=Math.exp(-Math.abs(t-38.6)*4);if(fl>.01){x.fillStyle=`rgba(255,250,240,${fl})`;x.fillRect(0,0,W,H)}
 // ===== FINALE (38.5-45)
 if(t>38.5){
  const a=ss(38.6,40,t)*(1-ss(44,45,t));
  starfield(t,.05,a*.5);
  sun(W/2,H/2-30,.5+b*.15,a*.5);
  txt('THE LINK',W/2,300,96,a,.45,SERIF,'255,255,255','400');
  x.save();x.globalAlpha=a*.6;x.fillStyle='#9bc4ff';x.fillRect(W/2-ss(39,41,t)*220,360,ss(39,41,t)*440,1);x.restore();
  txt('t.co/4PtUhRtzAT',W/2,410,30,ss(40.2,41.5,t)*a,.25,SANS,'170,205,255','400');
  txt('OPEN IT. IF YOU DARE.',W/2,480,16,ss(41.5,42.5,t)*a,.8);
 }
 // beat waveform — the "score"
 if(t>8&&t<44){x.save();x.globalAlpha=.35*ss(8,10,t)*(1-ss(43,44,t));x.strokeStyle='#8ab';x.lineWidth=1;x.beginPath();
  for(let X=0;X<=200;X+=2){const y=Math.sin(X*.25+t*8)*Math.sin(X*.03)*(2+b*12);X?x.lineTo(W-260+X,H-110+y):x.moveTo(W-260+X,H-110+y)}
  x.stroke();x.restore();}
 grain(t);bars();
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
