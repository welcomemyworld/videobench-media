<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><title>SHOWREEL</title>
<style>html,body{margin:0;background:#000;height:100%;overflow:hidden}
canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);}
</style></head><body><canvas id="c" width="1280" height="720"></canvas>
<script>
window.DUR=15;
const C=document.getElementById('c'),X=C.getContext('2d'),W=1280,H=720;
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);C.style.width=W*s+'px';C.style.height=H*s+'px';}
addEventListener('resize',fit);fit();
const q=new URLSearchParams(location.search);const T0=parseFloat(q.get('t')||0)||0;let st=null;
const BPM=128,PAL=[['#ff2d7a','#ffd400'],['#00e5ff','#ff2d7a'],['#a6ff00','#7a2dff'],['#ffd400','#00e5ff']];
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const S=Math.sin,Co=Math.cos,PI=Math.PI;
function pose(b){
 const m=Math.floor(b/8)%4,p=b%1,k=Math.floor(b),ph=b*PI,bn=Math.abs(S(ph));
 let o={hx:0,hy:-bn*18,lean:0,la:[.4,.3],ra:[-.4,-.3],ll:[.15,0],rl:[-.15,0],sx:1,head:0};
 if(m==0){const u=k%2;o.la=[u?2.9:1.2,u?.2:1.6];o.ra=[u?-1.2:-2.9,u?-1.6:-.2];o.lean=(u?.15:-.15)*bn;o.ll=[.3,-.4*bn];o.rl=[-.3,-.4*bn];o.head=o.lean;}
 if(m==1){const s=S(ph);o.hx=s*70;o.lean=-s*.25;o.la=[1.6+S(b*PI*2)*.6,.8];o.ra=[-1.6+S(b*PI*2+1)*.6,-.8];o.ll=[.1+s*.5,-.6*Math.max(0,s)];o.rl=[-.1+s*.5,.6*Math.max(0,-s)];o.head=s*.3;}
 if(m==2){o.sx=Co(b*PI/2);o.la=[2.5,.5];o.ra=[-.6,-1.8];o.ll=[.05,0];o.rl=[-.6,-1.6];o.hy=-10-bn*10;}
 if(m==3){const j=Math.pow(bn,.6);o.hy=-j*110;o.la=[2.4*j+.3,0];o.ra=[-2.4*j-.3,0];o.ll=[.7*j+.1,-.8*(1-j)];o.rl=[-.7*j-.1,.8*(1-j)];o.lean=0;}
 return o;}
function limb(x,y,a1,a2,l1,l2,w,col){const x1=x+S(a1)*l1,y1=y+Co(a1)*l1,x2=x1+S(a1+a2)*l2,y2=y1+Co(a1+a2)*l2;
 X.strokeStyle=col;X.lineWidth=w;X.lineCap=X.lineJoin='round';X.beginPath();X.moveTo(x,y);X.lineTo(x1,y1);X.lineTo(x2,y2);X.stroke();return[x2,y2];}
function girl(cx,cy,o,sc,flat,t){
 X.save();X.translate(cx+o.hx*sc,cy+o.hy*sc);X.scale(sc*(Math.abs(o.sx)<.15?.15*Math.sign(o.sx||1):o.sx),sc);
 const skin=flat||'#ffd9c2',hair=flat||'#2a1440',top=flat||'#ff2d7a',sk=flat||'#1d1d3a',leg=flat||'#f4f4ff',shoe=flat||'#ffd400';
 // legs
 limb(-14,0,o.ll[0],o.ll[1],58,58,16,leg);limb(14,0,o.rl[0],o.rl[1],58,58,16,leg);
 for(const [l,s] of [[o.ll,-14],[o.rl,14]]){const fx=s+S(l[0])*58+S(l[0]+l[1])*58,fy=Co(l[0])*58+Co(l[0]+l[1])*58;X.fillStyle=shoe;X.beginPath();X.ellipse(fx+4,fy+4,13,8,0,0,7);X.fill();}
 X.rotate(o.lean);
 // skirt
 X.fillStyle=sk;X.beginPath();const fl=S(t*20)*6;X.moveTo(-20,-30);X.lineTo(20,-30);X.lineTo(42+fl,14);X.lineTo(-42+fl,14);X.fill();
 // arms back
 limb(-20,-88,o.la[0]*-1+PI*0,-o.la[1],44,42,12,skin);
 // torso
 X.fillStyle=top;X.beginPath();X.moveTo(-24,-95);X.quadraticCurveTo(0,-102,24,-95);X.lineTo(18,-28);X.lineTo(-18,-28);X.fill();
 if(!flat){X.fillStyle='#fff';X.font='bold 18px sans-serif';X.textAlign='center';X.fillText('★',0,-58);}
 limb(20,-88,-o.ra[0],o.ra[1]*-1,44,42,12,skin);
 // head
 X.translate(0,-120);X.rotate(o.head*.6);
 const sw=S(t*9)*.4;
 X.fillStyle=hair;for(const s of[-1,1]){X.save();X.translate(s*26,-14);X.rotate(s*(.5+sw*s));X.beginPath();X.ellipse(s*8,30,12,38,0,0,7);X.fill();X.restore();}
 X.fillStyle=skin;X.beginPath();X.arc(0,0,27,0,7);X.fill();
 X.fillStyle=hair;X.beginPath();X.arc(0,-6,29,PI*1.02,PI*1.98);X.quadraticCurveTo(10,-12,-29,-4);X.fill();
 if(!flat){X.fillStyle='#2a1440';X.beginPath();X.arc(-9,3,3.5,0,7);X.arc(9,3,3.5,0,7);X.fill();
 X.strokeStyle='#c0304a';X.lineWidth=2.5;X.beginPath();X.arc(0,10,7,.2,PI-.2);X.stroke();
 X.fillStyle='rgba(255,90,140,.45)';X.beginPath();X.arc(-16,10,5,0,7);X.arc(16,10,5,0,7);X.fill();
 X.fillStyle='#ffd400';X.beginPath();X.arc(22,-22,6,0,7);X.fill();}
 X.restore();}
function bigText(s,x,y,size,fill,stroke,al){X.font='900 '+size+'px "Arial Black",Impact,sans-serif';X.textAlign='center';X.textBaseline='middle';
 X.globalAlpha=al;if(fill){X.fillStyle=fill;X.fillText(s,x,y);}if(stroke){X.strokeStyle=stroke;X.lineWidth=3;X.strokeText(s,x,y);}X.globalAlpha=1;}
const WORDS=['DANCE','MOTION','RHYTHM','ENERGY'],JP=['キャラクターアニメーション','キネティック・タイポグラフィ','コンポジット / エフェクト','モーションデザイン'];
function frame(now){
 if(st===null)st=now;let t=((now-st)/1000+T0)%DUR;
 const b=t*BPM/60,bp=b%1,kick=Math.pow(1-bp,4),sec=Math.floor(b/8)%4,pal=PAL[sec];
 X.save();
 const sh=kick*8*(t>2&&t<13?1:.3);X.translate((Math.random()-.5)*sh,(Math.random()-.5)*sh);
 // BG
 X.fillStyle='#0b0718';X.fillRect(-20,-20,W+40,H+40);
 X.save();X.translate(W/2,H/2);X.rotate(t*.3);
 for(let i=0;i<24;i++){X.fillStyle=i%2?pal[0]:'#140c2a';X.globalAlpha=i%2?.18+kick*.15:1;X.beginPath();X.moveTo(0,0);X.arc(0,0,1000,i*PI/12,(i+1)*PI/12);X.fill();}
 X.globalAlpha=1;X.restore();
 // rings
 for(let i=0;i<5;i++){const r=((b*0.5+i/5)%1);X.strokeStyle=pal[1];X.globalAlpha=(1-r)*.6;X.lineWidth=6*(1-r)+1;X.beginPath();X.arc(W/2,H/2+20,r*700,0,7);X.stroke();}
 X.globalAlpha=1;
 // scrolling giant word
 const wd=WORDS[sec];for(let r=0;r<3;r++){const off=((t*(r%2?-220:220))%900);for(let k=-1;k<3;k++)bigText(wd,off+k*900-200,140+r*220,200,null,r==1?pal[1]:'rgba(255,255,255,.25)',1);}
 // floating shapes
 for(let i=0;i<18;i++){const a=i*2.4+t*(.3+i%3*.2),x=(i*173+t*60*(i%2?1:-1))%W,y=(i*97+S(a)*60+H)%H;X.save();X.translate((x+W)%W,y);X.rotate(a);X.fillStyle=i%2?pal[0]:pal[1];X.globalAlpha=.7;const z=8+i%4*6;
 if(i%3==0)X.fillRect(-z,-z,z*2,z*2);else if(i%3==1){X.beginPath();X.moveTo(0,-z);X.lineTo(z,z);X.lineTo(-z,z);X.fill();}else{X.beginPath();X.arc(0,0,z,0,7);X.fill();}X.restore();}
 X.globalAlpha=1;
 // dancer
 const vis=cl((t-1.6)/.5,0,1)*(1-cl((t-13.3)/.4,0,1));
 if(vis>0){const sc=(1.5+kick*.06)*ease(vis),cx=W/2,cy=H/2+150;
  X.fillStyle='rgba(0,0,0,.35)';X.beginPath();X.ellipse(cx,cy+130*sc/1.5*1.1,110*sc/1.5,16,0,0,7);X.fill();
  for(let e=4;e>=1;e--){X.globalAlpha=.22*(5-e)/4;girl(cx-e*6,cy,pose(b-e*.07),sc,e%2?pal[0]:pal[1],t);}
  X.globalAlpha=1;girl(cx+4*kick,cy,pose(b),sc,pal[1],t);girl(cx-4*kick,cy,pose(b),sc,pal[0],t);girl(cx,cy,pose(b),sc,null,t);}
 // beat flash
 if(t>2&&t<13&&Math.floor(b)%4==0){X.fillStyle='#fff';X.globalAlpha=kick*.35;X.fillRect(0,0,W,H);X.globalAlpha=1;}
 X.restore();
 // INTRO
 if(t<2.2){const a=cl(t/.3,0,1),o=1-cl((t-1.8)/.4,0,1);X.fillStyle='#0b0718';X.globalAlpha=o;X.fillRect(0,0,W,H);
  const wipe=ease(cl(t/.6,0,1));X.fillStyle='#ff2d7a';X.fillRect(0,H/2-70,W*wipe,140);X.fillStyle='#ffd400';X.fillRect(W*(1-wipe),H/2+75,W*wipe,10);
  bigText('SHOWREEL',W/2+(1-ease(a))*300,H/2,120,'#fff',null,o);
  X.font='bold 30px sans-serif';X.fillStyle='#fff';X.globalAlpha=o*cl((t-.5)/.4,0,1);X.textAlign='center';X.fillText('モーショングラフィックス作品集  2024',W/2,H/2+125);X.globalAlpha=1;}
 // lower third
 if(t>2.4&&t<13){const lt=(b%8)/8,ap=ease(cl(lt*6,0,1))*(1-ease(cl((lt-.85)*7,0,1)));
  X.fillStyle=pal[0];X.fillRect(50,H-120,520*ap,52);X.fillStyle='#fff';X.fillRect(50,H-68,360*ap,30);
  X.save();X.beginPath();X.rect(50,H-120,520,90);X.clip();X.fillStyle='#fff';X.font='bold 30px sans-serif';X.textAlign='left';X.textBaseline='middle';
  X.fillText(JP[sec],66-(1-ap)*500,H-94);X.fillStyle='#0b0718';X.font='bold 17px sans-serif';X.fillText('0'+(sec+1)+' / '+WORDS[sec]+' — '+BPM+' BPM',66-(1-ap)*400,H-53);X.restore();}
 // HUD
 X.fillStyle='rgba(255,255,255,.85)';X.font='16px monospace';X.textAlign='right';X.textBaseline='top';
 const f=Math.floor(t*30)%30;X.fillText('REC ● 00:00:'+String(Math.floor(t)).padStart(2,'0')+':'+String(f).padStart(2,'0'),W-40,30);
 X.textAlign='left';X.fillText('PORTFOLIO / MOTION DESIGNER',40,30);
 X.fillStyle='#ffd400';X.fillRect(40,H-14,(W-80)*t/DUR,4);
 // letterbox
 X.fillStyle='#000';X.fillRect(0,0,W,12);X.fillRect(0,H-8,W,8);
 // OUTRO
 if(t>13.2){const a=ease(cl((t-13.2)/.5,0,1));X.fillStyle='#0b0718';X.globalAlpha=a;X.fillRect(0,0,W,H);X.globalAlpha=1;
  X.fillStyle='#ff2d7a';X.fillRect(W/2-300*a,H/2-4,600*a,8);
  bigText('THANK YOU',W/2,H/2-70,100,'#fff',null,a);
  X.font='bold 28px sans-serif';X.textAlign='center';X.fillStyle='#ffd400';X.globalAlpha=cl((t-13.7)/.4,0,1);
  X.fillText('ご視聴ありがとうございました',W/2,H/2+50);X.fillStyle='#fff';X.font='20px sans-serif';X.fillText('Character Animation ・ Typography ・ Compositing',W/2,H/2+95);X.globalAlpha=1;}
 requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script></body></html>
