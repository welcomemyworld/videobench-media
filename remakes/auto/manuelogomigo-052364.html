<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Showreel</title>
<style>html,body{margin:0;background:#000;height:100%;overflow:hidden}
canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100vw,177.78vh);height:min(56.25vw,100vh)}</style></head>
<body><canvas id="c" width="1280" height="720"></canvas>
<script>
window.DUR=15;
const c=document.getElementById('c'),x=c.getContext('2d'),W=1280,H=720;
const q=new URLSearchParams(location.search),off=parseFloat(q.get('t')||0)||0;
const t0=performance.now()-off*1000;
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const eo=t=>1-Math.pow(1-cl(t),4), eio=t=>{t=cl(t);return t<.5?8*t*t*t*t:1-Math.pow(-2*t+2,4)/2};
const eb=t=>{t=cl(t);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const P=['#ff2e63','#08d9d6','#f9ed69','#7b2ff7','#ffffff'];
const R=i=>{let s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s)};
function txt(s,X,Y,sz,col,al='center',w='900',sp=0){x.font=`${w} ${sz}px Helvetica,Arial,sans-serif`;x.fillStyle=col;x.textAlign=al;x.textBaseline='middle';if(x.letterSpacing!==undefined)x.letterSpacing=sp+'px';x.fillText(s,X,Y);if(x.letterSpacing!==undefined)x.letterSpacing='0px'}
function kinetic(s,X,Y,sz,lt,col,stag=.04){x.font=`900 ${sz}px Helvetica,Arial,sans-serif`;const tw=x.measureText(s).width;let px=X-tw/2;
for(let i=0;i<s.length;i++){const ch=s[i],cw=x.measureText(ch).width,p=eb((lt-i*stag)/.5);
x.save();x.translate(px+cw/2,Y+(1-p)*sz*.9);x.rotate((1-p)*.6);x.globalAlpha=cl(p*2);
x.beginPath();x.rect(-cw,-sz*.7-(1-p)*sz,cw*2,sz*1.4);x.fillStyle=col;x.textAlign='center';x.textBaseline='middle';x.fillText(ch,0,0);x.restore();px+=cw}}
function wipe(t,col,dir){// transition bar sweep
 if(t<0||t>1)return;const a=eio(t);x.fillStyle=col;
 for(let i=0;i<5;i++){const d=i*.06,p=eio((t-d)/.7);const y=i*H/5;
 const s=p<.5?0:(p-.5)*2*W*1.4, e=Math.min(p*2,1)*W*1.4;x.fillStyle=P[i%4];x.fillRect(dir?W-e:s-W*.2,y,e-s,H/5+1)}}
// SCENES
function s1(lt){// intro: burst circles + logo
 x.fillStyle='#0b0b14';x.fillRect(0,0,W,H);
 for(let i=0;i<6;i++){const p=eo((lt-i*.12)/1.2);x.strokeStyle=P[i%4];x.lineWidth=40*(1-p)+1;x.beginPath();x.arc(W/2,H/2,p*700,0,7);x.stroke()}
 for(let i=0;i<60;i++){const a=R(i)*6.28,p=eo((lt-.2)/1.5),r=p*(200+R(i+9)*500);x.fillStyle=P[i%4];x.globalAlpha=1-cl((lt-1.2)/1);
  x.beginPath();x.arc(W/2+Math.cos(a)*r,H/2+Math.sin(a)*r,4+R(i+3)*8,0,7);x.fill()}x.globalAlpha=1;
 const s=eb((lt-.3)/.7);x.save();x.translate(W/2,H/2-40);x.rotate((1-s)*-1.5+lt*.15);x.scale(s,s);
 for(let k=0;k<3;k++){x.rotate(2.094);x.fillStyle=P[k];x.beginPath();x.moveTo(0,0);x.lineTo(70,-40);x.lineTo(70,40);x.fill()}x.restore();
 kinetic('MOTION',W/2,H/2+90,110,lt-.8,'#fff');
 const p=eo((lt-1.6)/.6);x.fillStyle='#ff2e63';x.fillRect(W/2-220*p,H/2+160,440*p,6);
 txt('SHOWREEL 2025',W/2,H/2+195,22,'rgba(255,255,255,'+cl((lt-1.9)*2)+')','center','700',12)}
function s2(lt){// grid of morphing shapes
 x.fillStyle='#f9ed69';x.fillRect(0,0,W,H);const n=12,m=7,cs=W/n;
 for(let i=0;i<n;i++)for(let j=0;j<m;j++){const d=Math.hypot(i-n/2,j-m/2),ph=lt*3-d*.5;
  const sc=eb((lt-d*.06)/.6)*(.55+.35*Math.sin(ph));x.save();x.translate(i*cs+cs/2,j*cs+cs/2-20);x.rotate(ph*.6);
  x.fillStyle=(i+j)%3==0?'#ff2e63':(i+j)%3==1?'#7b2ff7':'#111';const r=cs*.4*sc,k=(Math.sin(ph)+1)/2;
  x.beginPath();x.roundRect?x.roundRect(-r,-r,2*r,2*r,r*k):x.rect(-r,-r,2*r,2*r);x.fill();x.restore()}
 const p=eo((lt-.4)/.5);x.fillStyle='#111';x.fillRect(0,H/2-70,W*p,140);
 kinetic('RHYTHM',W/2,H/2,120,lt-.5,'#f9ed69',.03)}
function s3(lt){// liquid waves + text
 const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#7b2ff7');g.addColorStop(1,'#08d9d6');x.fillStyle=g;x.fillRect(0,0,W,H);
 for(let k=0;k<6;k++){x.beginPath();x.moveTo(0,H);for(let X=0;X<=W;X+=16){const y=H*.35+k*70+Math.sin(X*.006+lt*2.5+k)*50*Math.sin(lt+k)+Math.sin(X*.013-lt*3)*20;x.lineTo(X,y-(1-eo(lt/1))*-400)}
  x.lineTo(W,H);x.fillStyle=`rgba(${k%2?'255,46,99':'11,11,20'},${.25+k*.1})`;x.fill()}
 x.save();x.translate(W/2,H/2-100);const s=eo((lt-.3)/.6);x.scale(s,s);
 for(let i=0;i<3;i++){x.save();x.rotate(lt*(1+i*.4)*(i%2?-1:1));x.strokeStyle='#fff';x.lineWidth=4;x.setLineDash([30,20]);x.beginPath();x.arc(0,0,60+i*30,0,7);x.stroke();x.restore()}x.restore();x.setLineDash([]);
 kinetic('FLOW',W/2,H/2+90,150,lt-.4,'#fff',.07)}
function s4(lt){// 3D-ish rotating cube of points + counters
 x.fillStyle='#0b0b14';x.fillRect(0,0,W,H);const a=lt*.9,b=lt*.6,pts=[];
 for(let i=-4;i<=4;i++)for(let j=-4;j<=4;j++)for(let k=-4;k<=4;k++){if(Math.abs(i)<4&&Math.abs(j)<4&&Math.abs(k)<4)continue;
  let X=i,Y=j,Z=k;const ex=eo((lt-.2)/1)*(1+.4*Math.sin(lt*3+i+j));X*=ex;Y*=ex;Z*=ex;
  let x1=X*Math.cos(a)-Z*Math.sin(a),z1=X*Math.sin(a)+Z*Math.cos(a),y1=Y*Math.cos(b)-z1*Math.sin(b),z2=Y*Math.sin(b)+z1*Math.cos(b);pts.push([x1,y1,z2,(i+j+k+12)%4])}
 pts.sort((p,q)=>p[2]-q[2]);for(const p of pts){const f=500/(p[2]*40+700);x.fillStyle=P[p[3]];x.globalAlpha=cl(.3+f*.6);
  x.beginPath();x.arc(W*.62+p[0]*40*f,H/2+p[1]*40*f,5*f,0,7);x.fill()}x.globalAlpha=1;
 const n=Math.floor(eo(lt/1.8)*120);txt(String(n).padStart(3,'0'),70,H/2-60,170,'#fff','left');
 txt('FPS OF PURE',75,H/2+50,30,'#08d9d6','left','700',8);kinetic('DEPTH',260,H/2+130,90,lt-.6,'#ff2e63')}
function s5(lt){// outro
 x.fillStyle='#ff2e63';x.fillRect(0,0,W,H);
 for(let i=0;i<14;i++){const p=eo((lt-i*.04)/.8);x.fillStyle=i%2?'#0b0b14':'#7b2ff7';x.save();x.translate(W/2,H/2);x.rotate(i*.25+lt*.3);x.fillRect(-W,-6-i*2,W*2*p,12+i*4);x.restore()}
 const p=eb((lt-.5)/.6);x.save();x.translate(W/2,H/2);x.scale(p,p);x.fillStyle='#0b0b14';x.beginPath();x.arc(0,0,250,0,7);x.fill();x.restore();
 kinetic('LET\u2019S',W/2,H/2-55,80,lt-.8,'#fff');kinetic('MOVE.',W/2,H/2+35,110,lt-1,'#f9ed69');
 txt('MOTION DESIGN \u2022 ANIMATION \u2022 DIRECTION',W/2,H/2+125,16,'rgba(255,255,255,'+cl((lt-1.6)*2)+')','center','700',4);
 x.fillStyle='#000';x.globalAlpha=cl((lt-2.6)/.4);x.fillRect(0,0,W,H);x.globalAlpha=1}
const S=[[0,3,s1],[3,6,s2],[6,9,s3],[9,12,s4],[12,15,s5]];
function frame(){const t=((performance.now()-t0)/1000)%DUR;
 // camera shake on cuts
 let sh=0;for(const s of S){const d=t-s[0];if(d>=0&&d<.3)sh=(1-d/.3)*10}
 x.save();x.translate((R(t*99)-.5)*sh,(R(t*77)-.5)*sh);
 for(const s of S)if(t>=s[0]&&t<s[1])s[2](t-s[0]);x.restore();
 for(let i=1;i<S.length;i++)wipe((t-S[i][0]+.35)/.7,'#fff',i%2);
 // grain + vignette
 const v=x.createRadialGradient(W/2,H/2,300,W/2,H/2,800);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.45)');x.fillStyle=v;x.fillRect(0,0,W,H);
 x.fillStyle='rgba(255,255,255,.05)';for(let i=0;i<300;i++)x.fillRect(R(i+t*60)*W,R(i*3+t*40)*H,2,2);
 // HUD
 txt('REEL_25 // '+t.toFixed(2).padStart(5,'0')+'s',W-30,30,14,'rgba(255,255,255,.7)','right','700',2);
 x.fillStyle='rgba(255,255,255,.7)';x.fillRect(30,H-24,(W-60)*t/DUR,3);
 requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script></body></html>
