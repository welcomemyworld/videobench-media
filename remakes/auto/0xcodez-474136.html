<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Moonlight Paws</title>
<style>html,body{margin:0;background:#000;height:100%;overflow:hidden}
canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#000}</style></head>
<body><canvas id="c" width="1280" height="720"></canvas>
<script>
window.DUR=60;
const DUR=60,BAR=1.5,cv=document.getElementById('c'),ctx=cv.getContext('2d');
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);cv.style.width=1280*s+'px';cv.style.height=720*s+'px'}
addEventListener('resize',fit);fit();
// ---------- MUSIC ----------
const notes=[];function add(t,m,d,v,h){notes.push({t,m,d,v,h})}
const SC=[0,2,4,5,7,9,11],dm=(d,o)=>72+12*(Math.floor(d/7)+o)+SC[((d%7)+7)%7];
const tri=(r,q)=>[r,r+(q?4:3),r+7];
const P=[[48,1],[45,0],[41,1],[43,1],[40,0],[41,1],[38,0],[43,1]],PF=[[41,1],[43,1],[40,0],[45,0],[41,1],[43,1],[48,1],[48,1]];
const TH=[[[4,2],[2,1]],[[5,1],[4,1],[2,1]],[[3,2],[5,1]],[[4,3]],[[2,2],[4,1]],[[5,1],[6,1],[7,1]],[[8,2],[6,1]],[[4,3]]];
const IB=[];for(let b=0;b<40;b++)IB.push(b<8?.25+b*.012:b<16?.4+(b-8)*.015:b<24?.55+(b-16)*.025:b<32?.8+(b-24)*.02:Math.max(.12,.75-(b-32)*.085));
function inten(t){const b=Math.min(39,Math.max(0,t/BAR-.5)),i=Math.floor(b),f=b-i;return IB[i]*(1-f)+IB[Math.min(39,i+1)]*f}
const hv=i=>.9+.2*((Math.sin(i*91.7)*43758.5)%1+1)%1;
for(let b=0;b<40;b++){const T=b*BAR,I=IB[b],[r,q]=b<32?P[b%8]:PF[b-32],c=tri(r,q);
 if(b<8||b>=32){if(b>=38){add(T,r-(b==39?12:0),b==39?3:1.5,I*.9,'L')}else{add(T,r,1.4,I,'L');add(T+.5,c[1]+12,1,I*.8,'L');add(T+1,c[2]+12,.5,I*.8,'L')}}
 else{const a=b>=24?[r-12,r,r+7,r+12,c[1]+12,r+7]:[r,r+7,r+12,c[1]+12,r+12,r+7];a.forEach((m,k)=>add(T+k*.25,m,.5,I*(k?.7:1)*hv(b*7+k),'L'))}
 if(b<32){let bt=0;TH[b%8].forEach(([d,l],k)=>{const t=T+bt*.5,v=Math.min(1,I*1.3)*hv(b*3+k);
  if(b<16){add(t,dm(d,0),l*.5,v,'R');if(b>=8&&k==0)add(t,dm(d-2,0),l*.5,v*.6,'R')}
  else if(b<24){add(t,dm(d,0),l*.5-.05,v,'R');if(l>1)add(t+(l-.5)*.5,dm(d+1,0),.25,v*.7,'R');else add(t+.25,dm(d-1,0),.22,v*.6,'R')}
  else{add(t,dm(d-3,1),l*.5,v*.6,'R');add(t,dm(d,1)>96?dm(d,0):dm(d,1),l*.5,v,'R')}bt+=l})}
 else{const v=I*1.2;if(b<38){add(T,c[1]+24,1,v,'R');add(T+1,c[2]+24-(c[2]+24>79?12:0),.5,v*.8,'R')}else if(b==38){add(T,79,.75,v,'R');add(T+.75,76,.75,v*.8,'R')}else add(T,72,3,v,'R')}}
notes.sort((a,b)=>a.t-b.t||a.m-b.m);
const LH=notes.filter(n=>n.h=='L'),RH=notes.filter(n=>n.h=='R');
// ---------- AUDIO ----------
let ac=null,bus=null,master,rev,nb,aBase=0,sched=0;
function initAudio(){ac=new (window.AudioContext||window.webkitAudioContext)();
 const comp=ac.createDynamicsCompressor();comp.connect(ac.destination);master=ac.createGain();master.gain.value=.7;master.connect(comp);
 rev=ac.createConvolver();const L=ac.sampleRate*2.8,ib=ac.createBuffer(2,L,ac.sampleRate);
 for(let ch=0;ch<2;ch++){const d=ib.getChannelData(ch);for(let i=0;i<L;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/L,3)}
 rev.buffer=ib;const wet=ac.createGain();wet.gain.value=.4;rev.connect(wet);wet.connect(comp);
 nb=ac.createBuffer(1,ac.sampleRate*.3,ac.sampleRate);const nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1}
function resetBus(){if(!ac)return;if(bus){bus.gain.setTargetAtTime(0,ac.currentTime,.04)}
 bus=ac.createGain();bus.connect(master);bus.connect(rev);aBase=ac.currentTime+.06-tl;sched=0;while(sched<notes.length&&notes[sched].t<tl)sched++}
function pnote(n){const w=Math.max(aBase+n.t,ac.currentTime),f=440*Math.pow(2,(n.m-69)/12),v=n.v,ng=ac.createGain();ng.connect(bus);
 ng.gain.setValueAtTime(1,w);ng.gain.setTargetAtTime(0,w+n.d,.15);const dec=.8+(96-n.m)/22,end=w+n.d+1.2;
 for(let k=1;k<=6;k++){const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f*k*Math.sqrt(1+.0003*k*k);
  if(f*k>12000)continue;const a=v*.16/Math.pow(k,1.1)*(k>1?.35+v*.7:1);
  g.gain.setValueAtTime(0,w);g.gain.linearRampToValueAtTime(a,w+.004);g.gain.setTargetAtTime(0,w+.004,dec/(1+k*.7));
  o.connect(g);g.connect(ng);o.start(w);o.stop(end)}
 const s=ac.createBufferSource(),bp=ac.createBiquadFilter(),hg=ac.createGain();s.buffer=nb;bp.type='bandpass';bp.frequency.value=Math.min(f*3,5000);
 hg.gain.setValueAtTime(v*.12,w);hg.gain.setTargetAtTime(0,w,.012);s.connect(bp);bp.connect(hg);hg.connect(bus);s.start(w);s.stop(w+.2)}
// ---------- TIME ----------
const qs=new URLSearchParams(location.search);let off=(parseFloat(qs.get('t'))||0)%DUR,t0=performance.now(),playing=true,tl=off;
function toggle(){const now=performance.now();if(playing){off=tl;playing=false;if(bus)bus.gain.setTargetAtTime(0,ac.currentTime,.05)}else{off=tl;t0=now;playing=true;resetBus()}}
function replay(){off=0;t0=performance.now();tl=0;playing=true;resetBus()}
cv.addEventListener('click',()=>{if(!ac){initAudio();resetBus();return}toggle()});
addEventListener('keydown',e=>{if(e.code=='Space'){e.preventDefault();if(!ac){initAudio();resetBus()}else toggle()}if(e.key=='r'||e.key=='R'){if(!ac)initAudio();replay()}});
// ---------- CRAYON ----------
const H=n=>{n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n)};let B=0;const J=s=>H(s+B*13.7)-.5;
const rectP=(x,y,w,h)=>[[x,y],[x+w,y],[x+w,y+h],[x,y+h]];
function ellP(cx,cy,rx,ry,n=26){const p=[];for(let i=0;i<n;i++){const a=i/n*Math.PI*2;p.push([cx+Math.cos(a)*rx,cy+Math.sin(a)*ry])}return p}
function sub(p){const o=[];for(let i=0;i<p.length;i++){const a=p[i],b=p[(i+1)%p.length],n=Math.max(1,Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])/30));for(let k=0;k<n;k++)o.push([a[0]+(b[0]-a[0])*k/n,a[1]+(b[1]-a[1])*k/n])}return o}
function path(p,s,a){ctx.beginPath();p.forEach((q,i)=>{const x=q[0]+J(s+i)*a,y=q[1]+J(s+i+.37)*a;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath()}
function shape(p,fill,stroke,s,hatch,lw=2.4){const pp=sub(p);
 if(fill){path(pp,s,1.5);ctx.fillStyle=fill;ctx.fill();if(hatch){ctx.save();ctx.clip();let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;pp.forEach(q=>{x0=Math.min(x0,q[0]);y0=Math.min(y0,q[1]);x1=Math.max(x1,q[0]);y1=Math.max(y1,q[1])});
  const h=y1-y0;ctx.beginPath();for(let d=-h;d<x1-x0+h;d+=5){const j=J(s+d)*3;ctx.moveTo(x0+d+j,y0);ctx.lineTo(x0+d-h*.6+j,y1)}ctx.strokeStyle=hatch;ctx.lineWidth=1.6;ctx.globalAlpha=.28;ctx.stroke();ctx.globalAlpha=1;ctx.restore()}}
 if(stroke){for(let k=0;k<2;k++){path(pp,s+k*50,2.2);ctx.strokeStyle=stroke;ctx.lineWidth=k?lw*.5:lw;ctx.globalAlpha=k?.5:.85;ctx.stroke()}ctx.globalAlpha=1}}
function line(pts,col,w,s){ctx.lineCap='round';ctx.lineJoin='round';for(let k=0;k<2;k++){ctx.beginPath();pts.forEach((q,i)=>{const x=q[0]+J(s+i+k*9)*2,y=q[1]+J(s+i+k*9+.5)*2;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.strokeStyle=col;ctx.lineWidth=k?w*.6:w;ctx.globalAlpha=k?.6:.9;ctx.stroke()}ctx.globalAlpha=1}
// paper
const paper=document.createElement('canvas');paper.width=1280;paper.height=720;{const p=paper.getContext('2d');p.fillStyle='#808080';p.fillRect(0,0,1280,720);
 for(let i=0;i<60000;i++){const g=100+Math.random()*60|0;p.fillStyle=`rgb(${g},${g},${g})`;p.fillRect(Math.random()*1280,Math.random()*720,1+Math.random()*2,1)}
 p.strokeStyle='rgba(200,200,200,.25)';for(let i=0;i<500;i++){const x=Math.random()*1280,y=Math.random()*720;p.beginPath();p.moveTo(x,y);p.lineTo(x+Math.random()*20-10,y+Math.random()*8-4);p.stroke()}}
// keyboard map
const KX0=360,KW=560/36,KY=380,KX={},WH=[];let wi=0;
for(let m=36;m<=96;m++){if([1,3,6,8,10].includes(m%12))KX[m]=KX0+wi*KW;else{KX[m]=KX0+(wi+.5)*KW;WH.push([m,wi]);wi++}}
function paw(list,t,def){let i=-1;for(let k=0;k<list.length;k++){if(list[k].t<=t)i=k;else break}
 if(i<0)return[def,KY+5-18,0];const a=list[i],b=list[i+1];let x=KX[a.m],lift=0,pr=t-a.t<.12?1-(t-a.t)/.12:0;
 if(b){const s=a.t+Math.max(.06,(b.t-a.t)*.45);if(t>s){let u=(t-s)/(b.t-s);u=u*u*(3-2*u);x=KX[a.m]+(KX[b.m]-KX[a.m])*u;lift=Math.sin(u*Math.PI)*Math.min(28,8+Math.abs(KX[b.m]-KX[a.m])*.15)}}
 else lift=Math.min(25,(t-a.t-a.d)*15);return[x,KY+28-Math.max(0,lift)+pr*4,pr]}
// ---------- DRAW ----------
function draw(t){B=Math.floor(t*8);const I=inten(t);let hit=0;
 for(const n of notes){const a=t-n.t;if(a>=0&&a<.4)hit+=n.v*(1-a/.4)}
 ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,1280,720);
 const endF=t>DUR-4?(t-(DUR-4))/4:0,z=1+.14*I+hit*.008-endF*.08+(t<4?(4-t)*.02:0);
 ctx.setTransform(z,0,0,z,640-640*z+Math.sin(t*.3)*10*I,420-420*z+Math.cos(t*.23)*5);
 shape(rectP(-60,-60,1400,660),'#2a2140',null,1,'#4a3a66');
 // window
 shape(rectP(90,110,210,260),'#17244f','#c9a36a',10,'#2c3f80',4);
 shape(ellP(200,180,26,26),'#f3e9b5','#fff6cf',11,'#d8c47a');
 for(let i=0;i<14;i++){const x=100+H(i)*190,y=120+H(i+50)*230,tw=.5+.5*Math.sin(t*2+i*3);if(Math.hypot(x-200,y-180)<40)continue;ctx.globalAlpha=.4+.6*tw;line([[x-3,y],[x+3,y]],'#fff3c4',2,i);line([[x,y-3],[x,y+3]],'#fff3c4',2,i+3)}
 line([[195,112],[195,368]],'#c9a36a',4,20);line([[92,240],[298,240]],'#c9a36a',4,21);
 // picture
 shape(rectP(1030,140,130,95),'#d9cfa8','#a0703a',30,'#bfb38a',4);shape(ellP(1095,188,32,16),'#e07a3a','#8a3a1a',31);line([[1125,188],[1145,174],[1145,202],[1125,188]],'#8a3a1a',3,32);
 // floor, rug
 shape(rectP(-60,600,1400,200),'#3a2418',null,40,'#5a3a26');shape(ellP(640,668,340,42),'#7a2f3a','#b44a50',41,'#a03a48');
 // piano
 shape(rectP(330,170,620,430),'#4a2516','#1e0e08',50,'#6b3a22',3);shape(rectP(315,158,650,26),'#5a2e1b','#1e0e08',51,'#7a4528',3);
 shape(rectP(365,200,550,130),'#3d1e11','#1e0e08',52,'#5a2e1b');
 shape(rectP(560,212,160,95),'#efe6cc','#9a8a6a',53,'#d8ccaa');
 for(let i=0;i<5;i++){const y=228+i*16;line([[572,y],[708,y]],'#6a5a4a',1.2,60+i);for(let k=0;k<6;k++){const x=580+H(i*9+k)*120;shape(ellP(x,y-3+H(i+k)*6,3,2.2,8),'#3a2a20',null,70+i*9+k)}}
 shape(rectP(345,340,590,40),'#2e160c','#1e0e08',54,'#4a2516');
 // keys
 const pressed=new Set();for(const n of notes)if(t>=n.t&&t<n.t+Math.min(n.d,.35)+.05)pressed.add(n.m);
 for(const [m,i] of WH){const x=KX0+i*KW,p=pressed.has(m);shape(rectP(x,KY+(p?2:0),KW,50),p?'#f2c879':'#f4efe0','#5a4a3a',100+m,null,1.4)}
 for(let m=36;m<=96;m++)if([1,3,6,8,10].includes(m%12)){const p=pressed.has(m);shape(rectP(KX[m]-4.5,KY,9,30+(p?2:0)),p?'#7a5a2a':'#141010',null,200+m)}
 shape(rectP(345,430,590,20),'#3d1e11','#1e0e08',55,'#5a2e1b');shape(rectP(365,465,550,125),'#3d1e11','#1e0e08',56,'#5a2e1b');
 for(let i=0;i<3;i++)shape(ellP(600+i*40,590,9,4),'#c9a36a','#7a5a2a',57+i);
 // lamp
 line([[880,158],[880,118]],'#c9a36a',4,80);shape(ellP(880,158,22,5),'#c9a36a',null,81);
 shape([[848,90],[912,90],[928,125],[832,125]],`rgb(${230+20*I},${170+30*I},70)`,'#8a5a1a',82,'#ffd27a');
 // floating notes
 for(const n of RH){const a=t-n.t;if(a<0||a>2.6||n.v<.35)continue;const x=KX[n.m]+Math.sin(a*2+n.m)*18,y=KY-30-a*70;ctx.globalAlpha=(1-a/2.6)*.8;
  shape(ellP(x,y,5,3.6,10),'#ffd68a',null,300+n.m);line([[x+4,y],[x+4,y-16]],'#ffd68a',2,301+n.m);ctx.globalAlpha=1}
 // bench
 shape(rectP(495,592,290,22),'#6b3a22','#1e0e08',90,'#8a5030',3);for(const x of[510,760])shape(rectP(x,614,12,50),'#4a2516','#1e0e08',91+x);
 // cat
 const beat=t/.5,bob=Math.sin(beat*Math.PI)*2*I+(t>DUR-3?0:0),sway=Math.sin(t*.8)*4;
 const tx=700,tp=[];for(let i=0;i<10;i++){const u=i/9;tp.push([tx+u*80+Math.sin(t*1.5+u*3)*10*u,610-u*u*60+Math.cos(t*1.5+u*2)*8*u])}
 line(tp,'#0c0a0e',13,95);
 shape(ellP(640+sway*.3,560,64,72),'#141118','#000',96,'#3a3346',3);
 const pl=paw(LH,t,560),pr=paw(RH,t,720);
 for(const [s,pw] of [[[598+sway,515],pl],[[682+sway,515],pr]]){line([s,[(s[0]+pw[0])/2,(s[1]+pw[1])/2+8],[pw[0],pw[1]]],'#141118',15,97+s[0]);
  shape(ellP(pw[0],pw[1],9,7,12),'#2a2430','#000',98+s[0]);if(pw[2]>0){ctx.globalAlpha=pw[2]*.7;shape(ellP(pw[0],pw[1]-4,16,10,14),null,'#ffe0a0',99+s[0]);ctx.globalAlpha=1}}
 const hx=640+sway,hy=478+bob;
 shape([[hx-36,hy-14],[hx-30,hy-54],[hx-8,hy-34]],'#141118','#000',110,'#3a3346');shape([[hx+36,hy-14],[hx+30,hy-54],[hx+8,hy-34]],'#141118','#000',111,'#3a3346');
 shape([[hx-31,hy-20],[hx-28,hy-44],[hx-15,hy-30]],'#5a3a4a',null,112);shape([[hx+31,hy-20],[hx+28,hy-44],[hx+15,hy-30]],'#5a3a4a',null,113);
 shape(ellP(hx,hy,40,36),'#141118','#000',114,'#3a3346',3);
 // lighting / mood
 ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle=`rgba(12,8,35,${.5-.32*I+endF*.25})`;ctx.fillRect(0,0,1280,720);
 ctx.globalCompositeOperation='lighter';const lx=(880-640)*z+640,ly=(110-420)*z+420,R=(250+260*I+hit*15)*z,g=ctx.createRadialGradient(lx,ly,10,lx,ly,R);
 g.addColorStop(0,`rgba(255,190,100,${.28+.25*I})`);g.addColorStop(1,'rgba(255,150,60,0)');ctx.fillStyle=g;ctx.fillRect(0,0,1280,720);
 const mg=ctx.createRadialGradient(330,280,10,330,280,420);mg.addColorStop(0,`rgba(110,140,255,${.12+.1*(1-I)})`);mg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=mg;ctx.fillRect(0,0,1280,720);
 ctx.globalCompositeOperation='overlay';ctx.globalAlpha=.55;ctx.drawImage(paper,(B%3)-1,(B%2)-1);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
 const vg=ctx.createRadialGradient(640,360,300,640,360,800);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.6)');ctx.fillStyle=vg;ctx.fillRect(0,0,1280,720);
 // text
 ctx.textAlign='center';ctx.font='bold 44px Georgia, serif';
 const ta=t<6?Math.min(1,t)*Math.min(1,(6-t)/1.5):0;if(ta>0){ctx.globalAlpha=ta;ctx.fillStyle='#f6e2b0';ctx.fillText('Moonlight Paws',640,80);ctx.font='20px Georgia, serif';ctx.fillText('a little nocturne for piano & cat',640,112);ctx.globalAlpha=1}
 if(endF>.3){ctx.globalAlpha=Math.min(1,(endF-.3)*2);ctx.font='italic 40px Georgia, serif';ctx.fillStyle='#f6e2b0';ctx.fillText('fin',640,90);ctx.globalAlpha=1}
 ctx.font='16px sans-serif';ctx.fillStyle='rgba(246,226,176,.7)';ctx.textAlign='left';
 ctx.fillText(!ac?'Click for sound':(playing?'Click / Space: pause  ·  R: replay':'❚❚ Paused — click to resume'),20,700);
 ctx.textAlign='right';ctx.fillText('bar '+Math.min(40,Math.floor(t/BAR)+1)+' / 40',1260,700)}
function frame(now){if(playing){const n=(off+(now-t0)/1000)%DUR;if(n<tl-1){tl=n;resetBus()}tl=n;
  if(ac&&bus){while(sched<notes.length&&notes[sched].t<tl+.25){pnote(notes[sched]);sched++}}}
 draw(tl);requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script></body></html>
