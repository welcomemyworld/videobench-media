<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#000;height:100%;overflow:hidden}
canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);}
</style></head><body><canvas id="c" width="1280" height="720"></canvas><script>
const DUR=30;window.DUR=DUR;
const c=document.getElementById('c'),x=c.getContext('2d');
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);c.style.width=1280*s+'px';c.style.height=720*s+'px';}
addEventListener('resize',fit);fit();
const q=new URLSearchParams(location.search);const off=parseFloat(q.get('t')||0)||0;
const t0=performance.now();
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),ease=v=>v<.5?2*v*v:1-Math.pow(-2*v+2,2)/2;
function blinkAmt(t){
 // natural blinks + slow blink 20-24
 if(t>20&&t<24){const p=(t-20)/4;return p<.45?ease(p/.45):p<.6?1:1-ease((p-.6)/.4);}
 for(const b of [3.2,8.5,13.1,17.4,26.5]){const d=Math.abs(t-b);if(d<.12)return 1-d/.12;}return 0;}
function cat(t,cx,cy,s,look){
 x.save();x.translate(cx,cy);x.scale(s,s);
 const br=Math.sin(t*2)*2;
 // tail
 x.strokeStyle='#111';x.lineWidth=18;x.lineCap='round';x.beginPath();x.moveTo(60,120);
 x.quadraticCurveTo(140+Math.sin(t*1.3)*20,90,120+Math.sin(t*1.7)*30,10);x.stroke();
 // body
 x.fillStyle='#141414';x.beginPath();x.ellipse(0,110+br*.3,85,75,0,0,7);x.fill();
 x.fillStyle='#f2f2f2';x.beginPath();x.ellipse(0,105,35,55,0,0,7);x.fill();
 x.beginPath();x.ellipse(-35,175,20,12,0,0,7);x.ellipse(35,175,20,12,0,0,7);x.fill();
 // head
 x.translate(look*6,br);
 x.fillStyle='#141414';
 x.beginPath();x.moveTo(-62,-30);x.lineTo(-55,-95);x.lineTo(-15,-55);x.fill();
 x.beginPath();x.moveTo(62,-30);x.lineTo(55,-95);x.lineTo(15,-55);x.fill();
 x.fillStyle='#d88';x.beginPath();x.moveTo(-52,-45);x.lineTo(-50,-80);x.lineTo(-28,-58);x.fill();
 x.beginPath();x.moveTo(52,-45);x.lineTo(50,-80);x.lineTo(28,-58);x.fill();
 x.fillStyle='#141414';x.beginPath();x.ellipse(0,-15,70,58,0,0,7);x.fill();
 x.fillStyle='#f2f2f2';x.beginPath();x.moveTo(0,-45);x.quadraticCurveTo(-12,0,-40,15);x.quadraticCurveTo(0,50,40,15);x.quadraticCurveTo(12,0,0,-45);x.fill();
 const b=blinkAmt(t);
 for(const sx of[-1,1]){x.save();x.translate(sx*28,-20);
  x.fillStyle='#c9d84a';x.beginPath();x.ellipse(0,0,15,15*(1-b)+.5,0,0,7);x.fill();
  if(b<.9){x.fillStyle='#000';x.beginPath();x.ellipse(look*3,0,4,13*(1-b),0,0,7);x.fill();
  x.fillStyle='#fff';x.beginPath();x.arc(4,-5*(1-b),2.5,0,7);x.fill();}
  x.strokeStyle='#000';x.lineWidth=2;x.beginPath();x.moveTo(-15,15*(1-b)*-0+0);x.stroke();
  x.restore();}
 x.fillStyle='#e99';x.beginPath();x.moveTo(-7,8);x.lineTo(7,8);x.lineTo(0,15);x.fill();
 x.strokeStyle='#333';x.lineWidth=2;x.beginPath();x.moveTo(0,15);x.lineTo(0,20);x.quadraticCurveTo(-6,26,-11,21);x.moveTo(0,20);x.quadraticCurveTo(6,26,11,21);x.stroke();
 x.strokeStyle='rgba(255,255,255,.7)';x.lineWidth=1.2;
 for(const sx of[-1,1])for(let i=0;i<3;i++){x.beginPath();x.moveTo(sx*18,14+i*4);x.lineTo(sx*75,6+i*9+Math.sin(t*3+i)*1.5);x.stroke();}
 x.restore();}
function claude(t,cx,cy,s){
 x.save();x.translate(cx,cy);x.scale(s,s);x.rotate(t*.4);
 x.fillStyle='#d97757';
 for(let i=0;i<12;i++){x.save();x.rotate(i*Math.PI/6);x.beginPath();x.moveTo(-6,0);x.lineTo(0,-(38+(i%2)*8));x.lineTo(6,0);x.fill();x.restore();}
 x.beginPath();x.arc(0,0,12,0,7);x.fill();x.restore();}
function set(t,shot){
 // studio
 const g=x.createLinearGradient(0,0,0,720);g.addColorStop(0,'#121018');g.addColorStop(1,'#050407');x.fillStyle=g;x.fillRect(0,0,1280,720);
 // backdrop sweep
 x.fillStyle='#2a3550';x.beginPath();x.moveTo(380,120);x.lineTo(900,120);x.lineTo(900,470);x.quadraticCurveTo(900,560,960,560);x.lineTo(320,560);x.quadraticCurveTo(380,560,380,470);x.fill();
 const sp=x.createRadialGradient(640,380,20,640,380,330);sp.addColorStop(0,'rgba(255,230,180,.55)');sp.addColorStop(1,'rgba(255,230,180,0)');x.fillStyle=sp;x.fillRect(300,100,700,480);
 // floor
 x.fillStyle='#1a1414';x.fillRect(0,560,1280,160);
 x.strokeStyle='#2a2020';for(let i=0;i<14;i++){x.beginPath();x.moveTo(i*100-60,560);x.lineTo(i*130-260,720);x.stroke();}
 // lights
 for(const lx of[180,1100]){x.strokeStyle='#333';x.lineWidth=4;x.beginPath();x.moveTo(lx,560);x.lineTo(lx,260);x.moveTo(lx-40,560);x.lineTo(lx,470);x.lineTo(lx+40,560);x.stroke();
  x.fillStyle='#222';x.fillRect(lx-35,220,70,50);x.fillStyle='#ffe9b0';x.fillRect(lx-28,228,56,34);
  const lg=x.createRadialGradient(lx,245,5,lx,245,120);lg.addColorStop(0,'rgba(255,230,170,.4)');lg.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=lg;x.fillRect(lx-120,125,240,240);}
 // cushion
 x.fillStyle='#8a2a3a';x.beginPath();x.ellipse(640,540,140,30,0,0,7);x.fill();
 cat(t,640,345,1,Math.sin(t*.5)*.6*(t<20?1:0));
 // camera on tripod (front)
 x.save();x.translate(930,470);x.strokeStyle='#444';x.lineWidth=5;
 x.beginPath();x.moveTo(0,0);x.lineTo(-40,180);x.moveTo(0,0);x.lineTo(40,180);x.moveTo(0,0);x.lineTo(0,190);x.stroke();
 x.fillStyle='#222';x.fillRect(-55,-60,110,60);x.fillStyle='#111';x.fillRect(-100,-50,48,40);
 x.fillStyle='#333';x.beginPath();x.arc(-25,-75,20,0,7);x.arc(25,-75,20,0,7);x.fill();
 if(Math.floor(t*2)%2){x.fillStyle='#f33';x.beginPath();x.arc(40,-48,5,0,7);x.fill();}
 x.restore();
 // director chair + mascot
 x.save();x.translate(170,600);x.fillStyle='#5a3a22';x.fillRect(-50,-60,8,120);x.fillRect(42,-60,8,120);
 x.fillStyle='#222';x.fillRect(-50,-60,100,15);x.fillRect(-50,-130,100,40);x.fillStyle='#d97757';x.font='bold 14px sans-serif';x.textAlign='center';x.fillText('DIRECTOR',0,-104);
 x.restore();
 claude(t,170,440+Math.sin(t*2)*6,1);
}
function monitor(t,mx,my,w,h){
 x.save();x.fillStyle='#0c0c0c';x.fillRect(mx-14,my-14,w+28,h+40);
 x.beginPath();x.rect(mx,my,w,h);x.clip();
 x.fillStyle='#2a3550';x.fillRect(mx,my,w,h);
 const sp=x.createRadialGradient(mx+w/2,my+h*.6,10,mx+w/2,my+h*.6,w*.6);sp.addColorStop(0,'rgba(255,230,180,.5)');sp.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=sp;x.fillRect(mx,my,w,h);
 cat(t,mx+w/2,my+h*.55,w/320,0);
 x.strokeStyle='rgba(255,255,255,.4)';x.lineWidth=1;x.strokeRect(mx+w*.1,my+h*.1,w*.8,h*.8);
 x.fillStyle='#f33';x.font='bold '+(h*.06|0)+'px monospace';x.textAlign='left';
 if(Math.floor(t*2)%2)x.fillText('● REC',mx+w*.04,my+h*.09);
 x.fillStyle='#fff';x.textAlign='right';const s=Math.floor(t);x.fillText('00:00:'+String(s).padStart(2,'0')+':'+String(Math.floor(t*24%24)).padStart(2,'0'),mx+w*.96,my+h*.09);
 for(let y=0;y<h;y+=3){x.fillStyle='rgba(0,0,0,.12)';x.fillRect(mx,my+y,w,1);}
 x.restore();
 x.fillStyle='#888';x.font='12px monospace';x.textAlign='left';x.fillText('A-CAM  ·  50mm  ·  T2.0',mx,my+h+18);}
function title(txt,sub,a){x.globalAlpha=a;x.fillStyle='#fff';x.textAlign='center';x.font='bold 54px Georgia,serif';x.fillText(txt,640,330);
 if(sub){x.font='22px Georgia,serif';x.fillStyle='#d97757';x.fillText(sub,640,380);}x.globalAlpha=1;}
function frame(){
 const t=((performance.now()-t0)/1000+off)%DUR;
 x.setTransform(1,0,0,1,0,0);
 if(t<4){set(t,0);x.fillStyle='rgba(0,0,0,'+(.85-cl(t/4)*.3)+')';x.fillRect(0,0,1280,720);title('Directed by Claude','a tiny film · every frame is code',cl(t)*cl(4-t));}
 else if(t<12){const p=ease(cl((t-4)/8));x.save();const z=1+p*.5;x.translate(640,380);x.scale(z,z);x.translate(-640-(p*-80),-380);set(t,1);x.restore();
  monitor(t,40,40,300,170);
  // slate
  if(t<6){const sa=cl((t-4)/.6)*cl((6-t)/.4);x.globalAlpha=sa;x.fillStyle='#111';x.fillRect(520,250,240,150);x.fillStyle='#fff';x.font='bold 22px monospace';x.textAlign='left';
   x.fillText('SCENE 1  TAKE 1',540,320);x.fillText('STAR: TUXEDO',540,360);
   const an=t<5?-.5:0;x.save();x.translate(520,250);x.rotate(an);for(let i=0;i<6;i++){x.fillStyle=i%2?'#fff':'#111';x.fillRect(i*40,-30,40,30);}x.restore();x.globalAlpha=1;}
 }
 else if(t<19){set(t,2);monitor(t,330,90,620,350);
  x.fillStyle='#fff';x.font='italic 24px Georgia,serif';x.textAlign='center';x.fillText(t<15.5?'"Okay… look right into the lens."':'"Now — slowly…"',640,640);}
 else if(t<26){// full-frame on monitor, slow blink
  const z=1+ease(cl((t-19)/7))*.15;x.save();x.translate(640,360);x.scale(z,z);x.translate(-640,-360);
  x.fillStyle='#2a3550';x.fillRect(0,0,1280,720);const sp=x.createRadialGradient(640,420,20,640,420,700);sp.addColorStop(0,'rgba(255,230,180,.5)');sp.addColorStop(1,'rgba(0,0,0,.6)');x.fillStyle=sp;x.fillRect(0,0,1280,720);
  cat(t,640,460,2.6,0);x.restore();
  for(let y=0;y<720;y+=3){x.fillStyle='rgba(0,0,0,.1)';x.fillRect(0,y,1280,1);}
  x.strokeStyle='rgba(255,255,255,.35)';x.strokeRect(90,60,1100,600);
  if(Math.floor(t*2)%2){x.fillStyle='#f33';x.font='bold 28px monospace';x.textAlign='left';x.fillText('● REC',110,100);}
  if(t>24.3){x.globalAlpha=cl((t-24.3)*2)*cl(26-t);x.fillStyle='#fff';x.font='italic 30px Georgia,serif';x.textAlign='center';x.fillText('"…cut. Perfect. That\u2019s the take."',640,640);x.globalAlpha=1;}
 }
 else{set(t,3);const a=cl((t-26)/1.2);x.fillStyle='rgba(0,0,0,'+a*.85+')';x.fillRect(0,0,1280,720);
  title('MY CAT\u2019S FIRST MOVIE','starring the tuxedo · no After Effects',a*cl((DUR-t)/.8));claude(t,640,200,.9*a);}
 // letterbox + grain
 x.fillStyle='#000';x.fillRect(0,0,1280,40);x.fillRect(0,680,1280,40);
 for(let i=0;i<300;i++){x.fillStyle='rgba(255,255,255,'+Math.random()*.05+')';x.fillRect(Math.random()*1280,Math.random()*720,2,2);}
 requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script></body></html>
