<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>How Backlinks Work</title>
<style>
html,body{margin:0;background:#000;height:100%;overflow:hidden}
#s{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:0 0}
</style></head><body>
<canvas id="s" width="1280" height="720"></canvas>
<script>
window.DUR=48;
const c=document.getElementById('s'),x=c.getContext('2d');
function fit(){const k=Math.min(innerWidth/1280,innerHeight/720);c.style.transform=`scale(${k}) translate(-50%,-50%)`;c.style.left='50%';c.style.top='50%';c.style.transformOrigin='0 0';c.style.transform=`translate(-50%,-50%) scale(${k})`;c.style.transformOrigin='center';}
fit();addEventListener('resize',fit);
const q=new URLSearchParams(location.search);const off=parseFloat(q.get('t')||0)||0;const t0=performance.now()-off*1000;
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),ease=v=>{v=cl(v);return v*v*(3-2*v)},lerp=(a,b,t)=>a+(b-a)*t;
function R(n){let s=n;return()=>(s=(s*16807)%2147483647)/2147483647}
// sites
const r=R(7);const sites=[];
for(let i=0;i<14;i++){const a=i/14*Math.PI*2+r()*.3,d=200+r()*90;sites.push({a,d,auth:i<3?.95-i*.05:.2+r()*.5,spam:i>=11,name:i<3?['news.org','university.edu','industry.io'][i]:i>=11?'spam'+(i-10)+'.biz':'blog'+i+'.com'});}
const tgt={x:640,y:380};
function pos(s,t){const a=s.a+t*.05;return{x:tgt.x+Math.cos(a)*s.d*1.5,y:tgt.y+Math.sin(a)*s.d*.85}}
function txt(s,X,Y,sz,col,al='center',w=600){x.font=`${w} ${sz}px system-ui,Segoe UI,Helvetica,Arial`;x.fillStyle=col;x.textAlign=al;x.fillText(s,X,Y)}
function glow(X,Y,rad,col,a){const g=x.createRadialGradient(X,Y,0,X,Y,rad);g.addColorStop(0,col.replace('A',a));g.addColorStop(1,col.replace('A',0));x.fillStyle=g;x.beginPath();x.arc(X,Y,rad,0,7);x.fill()}
function node(X,Y,rad,col,label,a=1){x.globalAlpha=a;glow(X,Y,rad*3,col,.35);x.fillStyle='#0b1220';x.strokeStyle=col.replace('A',1);x.lineWidth=2;x.beginPath();x.arc(X,Y,rad,0,7);x.fill();x.stroke();if(label)txt(label,X,Y+rad+16,12,'rgba(200,215,240,.85)','center',500);x.globalAlpha=1}
const scenes=[[0,6,'How Backlinks Work','Every link is a vote of confidence'],[6,14,'1. A backlink','Another site links to yours: <a href="yoursite.com">'],[14,22,'2. Links pass authority','"Link equity" flows from the linking page to yours'],[22,30,'3. Quality beats quantity','One trusted link outweighs many spammy ones'],[30,38,'4. Relevance & anchor text','Topical, descriptive links tell Google what you are about'],[38,48,'5. Authority → Rankings','More quality votes, higher position in search results']];
function frame(){const T=((performance.now()-t0)/1000)%DUR;
x.fillStyle='#04070f';x.fillRect(0,0,1280,720);
// grid bg
x.strokeStyle='rgba(60,100,180,.07)';x.lineWidth=1;for(let i=0;i<1280;i+=40){x.beginPath();x.moveTo(i+(T*8)%40,0);x.lineTo(i+(T*8)%40,720);x.stroke()}for(let j=0;j<720;j+=40){x.beginPath();x.moveTo(0,j);x.lineTo(1280,j);x.stroke()}
let sc=scenes.find(s=>T>=s[0]&&T<s[1]);const lt=T-sc[0],fa=cl(lt/.6)*cl((sc[1]-T)/.6);
// authority score
let auth=0;const links=[];
sites.forEach((s,i)=>{const appear=T<6?0:T<14?(i==0?ease((T-7)/1.5):0):T<22?ease((T-14-i*.4)/1):1;if(appear>0)links.push({s,i,appear})});
const showRank=T>=38;
const cx=showRank?lerp(640,420,ease((T-38)/1.5)):640;tgt.x=cx;
links.forEach(L=>{const p=pos(L.s,T);let w=L.s.spam?.4:.5+L.s.auth*3,col=L.s.spam?'rgba(255,80,90,A)':L.s.auth>.8?'rgba(255,200,80,A)':'rgba(80,200,255,A)';
let a=L.appear*(T>=22&&T<30&&L.s.spam?.35:1);
const ex=lerp(p.x,tgt.x,L.appear),ey=lerp(p.y,tgt.y,L.appear);
x.strokeStyle=col.replace('A',.35*a);x.lineWidth=w;x.beginPath();x.moveTo(p.x,p.y);x.lineTo(ex,ey);x.stroke();
if(T>=14&&L.appear>=1){for(let k=0;k<3;k++){const f=((T*(.3+L.s.auth*.4)+k/3+L.i*.13)%1);const px=lerp(p.x,tgt.x,f),py=lerp(p.y,tgt.y,f);glow(px,py,4+L.s.auth*8,col,.9*a)}}
auth+=(L.s.spam?.02:L.s.auth)*L.appear;
node(p.x,p.y,8+L.s.auth*12,col,T>=22&&T<38||T<14&&L.i==0?L.s.name:'',a);
if(T>=22&&T<30&&L.s.spam){txt('✕',p.x,p.y+5,14,'rgba(255,90,90,.9)')}});
// unlinked sites dim
sites.forEach((s,i)=>{if(!links.find(l=>l.i==i)&&T>=6){const p=pos(s,T);node(p.x,p.y,6,'rgba(120,140,170,A)','',.4)}});
const score=Math.round(cl(auth/7)*100*(T>=14?1:.15)+5);
const pr=1+Math.sin(T*3)*.03;
glow(tgt.x,tgt.y,70+score*1.2,'rgba(90,255,180,A)',.25);
node(tgt.x,tgt.y,34*pr,'rgba(90,255,180,A)','');
txt('yoursite.com',tgt.x,tgt.y-46,15,'#bfffe6');txt(score,tgt.x,tgt.y+8,22,'#fff','center',800);
txt('authority',tgt.x,tgt.y+60,11,'rgba(180,255,220,.7)','center',500);
// scene 1 code
if(T>=6&&T<14){const a=cl((T-8)/.8);x.globalAlpha=a*fa;x.fillStyle='rgba(15,25,45,.9)';x.fillRect(840,560,400,70);x.strokeStyle='#3a6';x.strokeRect(840,560,400,70);
x.font='15px monospace';x.textAlign='left';x.fillStyle='#8cf';x.fillText('news.org/article:',856,585);x.fillStyle='#fd8';x.fillText('<a href="yoursite.com">guide</a>',856,612);x.globalAlpha=1}
// scene 4 anchors
if(T>=30&&T<38){const ex=[['"best trail running shoes"','relevant ✓','#6f9'],['"click here"','vague','#fc6'],['"cheap pills casino"','irrelevant ✕','#f67']];
ex.forEach((e,i)=>{const a=cl((lt-.5-i*.8)/.6)*fa;x.globalAlpha=a;x.fillStyle='rgba(15,25,45,.85)';x.fillRect(40,200+i*80,330,58);txt(e[0],56,225+i*80,15,'#fff','left');txt(e[1],56,246+i*80,13,e[2],'left',500);x.globalAlpha=1})}
// scene 5 SERP
if(showRank){const a=ease((T-39)/1);x.globalAlpha=a;x.fillStyle='rgba(12,20,38,.92)';x.fillRect(820,170,400,420);x.strokeStyle='rgba(120,160,255,.4)';x.strokeRect(820,170,400,420);
txt('🔍 trail running shoes',840,200,15,'#cde','left',500);
const myRank=lerp(7,0,ease((T-40)/6));const others=['competitor-a.com','shoe-mag.com','store-x.com','forum.net','reviews.co','outdoor.io','gearhub.com'];
let list=others.slice();list.splice(Math.round(myRank),0,'yoursite.com');
for(let i=0;i<8;i++){const me=list[i]=='yoursite.com';const y=i==Math.round(myRank)?235+myRank*44:235+i*44;
x.fillStyle=me?'rgba(90,255,180,.15)':'rgba(255,255,255,.03)';x.fillRect(835,y-4,370,38);
txt((i+1)+'.',850,y+20,15,me?'#5fb':'#789','left');txt(list[i],880,y+20,15,me?'#bfffe6':'#9ab','left',me?700:500)}
x.globalAlpha=1}
// titles
x.globalAlpha=fa;
if(T<6){x.globalAlpha=1;x.fillStyle='rgba(4,7,15,.55)';x.fillRect(0,0,1280,720);x.globalAlpha=fa;txt(sc[2],640,330,64,'#fff','center',800);txt(sc[3],640,385,24,'#9fd8ff','center',400);txt('SEO explained visually',640,425,15,'rgba(150,180,220,.7)','center',400)}
else{txt(sc[2],40,64,34,'#fff','left',800);txt(sc[3],40,98,18,'#9fd8ff','left',400)}
x.globalAlpha=1;
// legend
if(T>=14&&T<38){[['High-authority','#fc5'],['Normal','#5cf'],['Spam','#f56']].forEach((l,i)=>{x.fillStyle=l[1];x.beginPath();x.arc(52,664+i*0-0,0,0,7);x.fill();x.beginPath();x.arc(50+i*170,690,6,0,7);x.fill();txt(l[0],62+i*170,695,13,'#abc','left',500)})}
// progress
x.fillStyle='rgba(90,255,180,.6)';x.fillRect(0,716,1280*T/DUR,4);
requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script></body></html>
