<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Samurai Kata</title>
<style>html,body{margin:0;background:#000;overflow:hidden;height:100%}canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}</style>
</head><body><canvas id="c" width="1280" height="720"></canvas>
<script>
const W=1280,H=720,DUR=36;window.DUR=DUR;
const cv=document.getElementById('c'),x=cv.getContext('2d');
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px'}
addEventListener('resize',fit);fit();
const q=new URLSearchParams(location.search);const off=parseFloat(q.get('t')||0)||0;const t0=performance.now();
// pose: [rootDX,rootDY,torsoLean,head,uArmR,lArmR,uArmL,lArmL,thighR,shinR,thighL,shinL,swordAng,spin]
// angles in radians, 0 = pointing down
const P={
 stand:[0,0,0,0,0.2,0.3,-0.2,-0.3,0.1,0,-0.1,0,2.6,0],
 draw:[0,8,0.1,0.1,1.2,1.6,0.9,1.4,0.5,-0.4,-0.4,0.3,2.0,0],
 chudan:[0,20,0.05,0,0.9,1.5,0.7,1.6,0.6,-0.6,-0.5,0.4,2.3,0],
 jodan:[0,15,-0.05,-0.1,2.8,3.3,2.6,3.2,0.6,-0.5,-0.5,0.5,3.6,0],
 strike:[30,40,0.5,0.3,1.6,1.7,1.5,1.7,1.1,-0.2,-0.7,1.1,1.7,0],
 low:[-10,90,0.6,0.4,0.6,0.9,1.0,1.4,1.5,-1.5,-1.2,1.3,1.0,0],
 spinA:[0,10,0.2,0,1.6,1.6,-1.2,-1.6,0.3,-0.2,-0.6,0.8,1.6,1],
 spinB:[0,30,0.3,0,1.7,1.7,-1.4,-1.9,0.8,-0.9,-0.9,1.4,1.6,2],
 jump:[0,-170,-0.2,0,2.9,3.2,2.7,3.1,1.6,-2.2,-1.0,2.0,3.4,0],
 slam:[20,95,0.7,0.5,1.4,1.3,1.3,1.4,1.6,-1.6,-1.0,1.6,0.6,0],
 kneel:[0,110,0.1,0.2,0.5,0.8,0.3,1.4,1.6,-1.6,0.1,1.7,0.3,0],
 sheath:[0,0,0,-0.1,0.4,1.8,-0.6,0.6,0.1,0,-0.1,0,2.0,0],
 hasso:[0,25,0.1,0,2.0,2.9,1.6,2.8,0.7,-0.6,-0.5,0.5,2.9,0],
 thrust:[50,45,0.7,0.6,1.7,1.7,1.6,1.7,1.0,0,-1.0,1.2,1.65,0]
};
const seq=[['stand',0],['stand',2],['draw',3.5],['chudan',5],['hasso',7],['jodan',8.5],['strike',9.2],['low',11],['chudan',12.5],['spinA',13.3],['spinB',14.1],['thrust',15.5],['chudan',17],['jodan',18],['jump',19],['slam',19.8],['low',21.5],['hasso',23],['strike',23.6],['spinA',24.4],['spinB',25.2],['jodan',26.5],['slam',27.2],['kneel',29],['sheath',32],['stand',34.5],['stand',36]];
const names=['','抜刀 · NUKITSUKE','','八相 · HASSŌ','上段 · JŌDAN','斬 · KIRI','','','旋風 · SENPŪ','','突 · TSUKI','','','飛龍 · HIRYŪ','','','','','','','','','','残心 · ZANSHIN','',''];
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function pose(t){for(let i=0;i<seq.length-1;i++){const[a,ta]=seq[i],[b,tb]=seq[i+1];if(t<tb){let k=ease((t-ta)/(tb-ta));const A=P[a],B=P[b];return{p:A.map((v,j)=>v+(B[j]-v)*k),i,k,spin:j=>0,sp:A[13]!=B[13]?((A[13]+(B[13]-A[13])*k)):A[13]}}}return{p:P.stand,i:0,k:0,sp:0}}
// particles
let parts=[],embers=[];
let seed=1;const R=()=>(seed=(seed*16807)%2147483647)/2147483647;
for(let i=0;i<180;i++)embers.push({x:R()*W,y:R()*H,s:1+R()*3,v:20+R()*60,p:R()*6});
let trail=[],lastT=-1,shake=0;
function seg(x0,y0,a,l){return[x0+Math.sin(a)*l,y0+Math.cos(a)*l]}
function limb(ax,ay,bx,by,w,c){x.strokeStyle=c;x.lineWidth=w;x.lineCap='round';x.beginPath();x.moveTo(ax,ay);x.lineTo(bx,by);x.stroke()}
function frame(){
 let t=((performance.now()-t0)/1000+off)%DUR;if(t<0)t+=DUR;
 const dt=lastT<0||t<lastT?0.016:Math.min(.05,t-lastT);if(t<lastT){trail=[];parts=[]}lastT=t;
 const{p,i,sp}=pose(t);
 const int=0.5+0.5*Math.sin(t*0.7)+(i>=13&&i<=16?0.5:0);
 // bg
 let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0a0000');g.addColorStop(.6,'#3a0800');g.addColorStop(1,'#120200');x.fillStyle=g;x.fillRect(0,0,W,H);
 // sun
 const rg=x.createRadialGradient(640,330,20,640,330,330);rg.addColorStop(0,'rgba(255,120,30,.9)');rg.addColorStop(.35,'rgba(200,30,0,.55)');rg.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=rg;x.fillRect(0,0,W,H);
 x.fillStyle='#c41a00';x.beginPath();x.arc(640,330,170,0,7);x.fill();
 // flames floor
 for(let k=0;k<70;k++){const fx=k/69*W,h=60+40*Math.sin(k*1.7+t*6)+30*Math.sin(k*.6-t*4)+50*int;const fg=x.createLinearGradient(0,H-h-60,0,H);fg.addColorStop(0,'rgba(255,200,60,0)');fg.addColorStop(.5,'rgba(255,90,0,.5)');fg.addColorStop(1,'rgba(255,40,0,.9)');x.fillStyle=fg;x.beginPath();x.moveTo(fx-30,H);x.quadraticCurveTo(fx+10*Math.sin(t*5+k),H-h,fx,H-h-60);x.quadraticCurveTo(fx+5,H-h,fx+30,H);x.fill()}
 // embers
 x.globalCompositeOperation='lighter';
 for(const e of embers){e.y-=e.v*dt*(1+int);e.x+=Math.sin(t*2+e.p)*0.5;if(e.y<-10){e.y=H+10;e.x=R()*W}x.fillStyle=`rgba(255,${120+e.s*30|0},40,.8)`;x.fillRect(e.x,e.y,e.s,e.s)}
 x.globalCompositeOperation='source-over';
 // shake
 if(i===14&&t>19.6&&t<19.8||i===4&&t>9&&t<9.2)shake=14;shake*=0.88;
 x.save();x.translate((R()-.5)*shake,(R()-.5)*shake);
 // ground
 x.fillStyle='#0a0200';x.fillRect(0,600,W,120);
 // figure
 const S=1.25,fx0=640+p[0],fy0=430+p[1];
 const flip=Math.cos(sp*Math.PI);// spin squash
 x.save();x.translate(fx0,fy0);x.scale(flip*S,S);
 // shadow drawn in world? simple
 const hip=[0,0],lean=p[2];
 const neck=seg(0,0,Math.PI+lean,-(-90));
 const nk=[Math.sin(Math.PI+lean)*-90*-1,0];// compute properly
 const tx=Math.sin(lean)*90,ty=-Math.cos(lean)*90;
 const shR=[tx+8,ty+8],shL=[tx-8,ty+8];
 const kR=seg(6,0,p[8],55),fR=seg(kR[0],kR[1],p[8]+p[9],55);
 const kL=seg(-6,0,p[10],55),fL=seg(kL[0],kL[1],p[10]+p[11],55);
 const eR=seg(shR[0],shR[1],p[4],40),hR=seg(eR[0],eR[1],p[5],38);
 const eL=seg(shL[0],shL[1],p[6],40),hL=seg(eL[0],eL[1],p[7],38);
 const sw=p[12]+Math.PI,hand=hR;
 const tip=[hand[0]+Math.sin(p[12])*150,hand[1]+Math.cos(p[12])*150];
 // glow aura
 x.shadowColor='#ff5000';x.shadowBlur=30;
 const dark='#140806',cloth='#2a0a08';
 limb(shL[0],shL[1],eL[0],eL[1],14,dark);limb(eL[0],eL[1],hL[0],hL[1],12,dark);
 // hakama legs
 x.fillStyle=cloth;x.beginPath();x.moveTo(-14,-6);x.lineTo(kL[0]-14,kL[1]);x.lineTo(fL[0]-16,fL[1]);x.lineTo(fL[0]+10,fL[1]);x.lineTo(kL[0]+10,kL[1]);x.lineTo(14,-6);x.fill();
 x.beginPath();x.moveTo(-14,-6);x.lineTo(kR[0]-12,kR[1]);x.lineTo(fR[0]-12,fR[1]);x.lineTo(fR[0]+16,fR[1]);x.lineTo(kR[0]+14,kR[1]);x.lineTo(14,-6);x.fill();
 // torso
 x.fillStyle=dark;x.beginPath();x.moveTo(-15,0);x.lineTo(tx-24,ty+6);x.lineTo(tx+24,ty+6);x.lineTo(15,0);x.fill();
 // obi
 limb(-15,-4,15,-4,9,'#a01000');
 // sheath
 limb(-14,-6,-60,22,6,'#000');
 // head + topknot
 const hx=tx+Math.sin(lean+p[3])*24,hy=ty-Math.cos(lean+p[3])*24;
 x.fillStyle=dark;x.beginPath();x.arc(hx,hy,15,0,7);x.fill();
 limb(hx-6,hy-14,hx-14,hy-24,6,dark);
 // headband tails
 const hb=Math.sin(t*9);x.strokeStyle='#d01800';x.lineWidth=4;x.beginPath();x.moveTo(hx-12,hy-3);x.quadraticCurveTo(hx-35,hy+hb*6,hx-55,hy+10+hb*10);x.stroke();
 // right arm
 limb(shR[0],shR[1],eR[0],eR[1],14,dark);limb(eR[0],eR[1],hR[0],hR[1],12,dark);
 // sword
 x.shadowColor='#ffb040';x.shadowBlur=25;
 limb(hand[0],hand[1],tip[0],tip[1],5,'#ffe6b0');
 limb(hand[0]-Math.sin(p[12])*22,hand[1]-Math.cos(p[12])*22,hand[0],hand[1],7,'#300');
 x.restore();
 // trail world coords
 const wt=[fx0+tip[0]*flip*S,fy0+tip[1]*S],wh=[fx0+hand[0]*flip*S,fy0+hand[1]*S];
 trail.push([wt,wh]);if(trail.length>14)trail.shift();
 x.globalCompositeOperation='lighter';
 for(let k=1;k<trail.length;k++){const a=trail[k-1],b=trail[k],al=k/trail.length;x.fillStyle=`rgba(255,${100+al*120|0},20,${al*.55})`;x.beginPath();x.moveTo(a[0][0],a[0][1]);x.lineTo(b[0][0],b[0][1]);x.lineTo(b[1][0],b[1][1]);x.lineTo(a[1][0],a[1][1]);x.fill()}
 // sparks from tip when fast
 if(trail.length>1){const a=trail[trail.length-2][0],sv=Math.hypot(wt[0]-a[0],wt[1]-a[1]);if(sv>8)for(let k=0;k<Math.min(8,sv/4);k++)parts.push({x:wt[0],y:wt[1],vx:(R()-.5)*300,vy:(R()-.7)*300,l:1})}
 if(shake>12)for(let k=0;k<20;k++)parts.push({x:fx0+(R()-.5)*200,y:600,vx:(R()-.5)*600,vy:-R()*500,l:1.3});
 parts=parts.filter(o=>(o.l-=dt*1.5)>0);
 for(const o of parts){o.x+=o.vx*dt;o.y+=o.vy*dt;o.vy+=400*dt;x.fillStyle=`rgba(255,${150*o.l+60|0},30,${Math.min(1,o.l)})`;x.fillRect(o.x,o.y,3,3)}
 x.globalCompositeOperation='source-over';
 x.restore();
 // shockwave ring
 const ring=(ts)=>{const d=t-ts;if(d>0&&d<1){x.strokeStyle=`rgba(255,180,60,${1-d})`;x.lineWidth=6*(1-d);x.beginPath();x.ellipse(640,600,d*600,d*60,0,0,7);x.stroke()}};ring(19.8);ring(9.2);ring(27.2);
 // title
 const nm=names[i]||'';x.textAlign='center';
 x.font='bold 42px serif';x.fillStyle='rgba(255,220,160,.9)';x.shadowColor='#f40';x.shadowBlur=20;if(nm)x.fillText(nm,640,80);
 x.font='16px serif';x.fillStyle='rgba(255,180,120,.6)';x.fillText('侍の型 — THE BURNING KATA',640,690);x.shadowBlur=0;
 // vignette + fades
 const v=x.createRadialGradient(640,360,250,640,360,800);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.8)');x.fillStyle=v;x.fillRect(0,0,W,H);
 const f=Math.max(0,1-t/1.2,(t-(DUR-1.2))/1.2);if(f>0){x.fillStyle=`rgba(0,0,0,${f})`;x.fillRect(0,0,W,H)}
 requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script></body></html>
