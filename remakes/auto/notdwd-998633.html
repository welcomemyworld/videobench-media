<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Beacon — brand film</title>
<style>
html,body{margin:0;background:#000;height:100%;overflow:hidden}
#c{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#000}
</style></head><body><canvas id="c" width="1280" height="720"></canvas>
<script>
// NOTE: placeholder inputs (no external assets allowed): brand "Beacon", word "signal", url beacon.so.
const BRAND="Beacon",WORD="signal",URL="beacon.so",ORANGE=[255,104,26];
window.DUR=58;
const W=1280,H=720,cv=document.getElementById('c'),x=cv.getContext('2d');
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px'}
addEventListener('resize',fit);fit();
const q=new URLSearchParams(location.search),T0=parseFloat(q.get('t')||0),start=performance.now();
const hs=n=>{const s=Math.sin(n*12.9898+78.233)*43758.5453;return s-Math.floor(s)};
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),ss=v=>{v=cl(v);return v*v*(3-2*v)},lerp=(a,b,k)=>a+(b-a)*k;
const FPS=24;
const g=document.createElement('canvas');g.width=320;g.height=180;const gx=g.getContext('2d'),gid=gx.createImageData(320,180);
const sm=document.createElement('canvas');sm.width=160;sm.height=90;const smx=sm.getContext('2d');
const SERIF='Georgia,"Times New Roman",serif',SANS='Helvetica,Arial,sans-serif',MONO='"Courier New",monospace';

// ---- captions: lines of words, timestamp per word, grey->white over 0.2s
function caption(t,lines,t0,step,y=640){
  let i=0;x.textAlign='left';x.font='500 26px '+SANS;x.textBaseline='middle';
  const lh=34,y0=y-(lines.length-1)*lh/2;
  lines.forEach((ln,li)=>{const ws=ln.split(' ');let tw=0;ws.forEach(w=>tw+=x.measureText(w+' ').width);
    let cx=W/2-tw/2;ws.forEach(w=>{const k=cl((t-(t0+i*step))/0.2);const v=Math.round(lerp(110,250,k));
      x.fillStyle=`rgba(${v},${v},${v-4},${0.55+0.45*k})`;x.fillText(w,cx,y0+li*lh);cx+=x.measureText(w+' ').width;i++})});
}
function bg(c){x.fillStyle=c;x.fillRect(0,0,W,H)}
function glitch(f){ // 1-2 frames on a real cut
  for(let i=0;i<9;i++){const y=hs(f*7+i)*H,h=8+hs(f+i)*40,dx=(hs(i*3+f)-.5)*80;x.drawImage(cv,0,y,W,h,dx,y,W,h)}
}
// ---- CRT
function tv(t,fn,zoom=1){
  bg('#050403');x.save();x.translate(W/2,H/2);x.scale(zoom,zoom);x.translate(-W/2,-H/2);
  const g1=x.createRadialGradient(W/2,H/2,100,W/2,H/2,520);g1.addColorStop(0,'rgba(210,215,220,.16)');g1.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=g1;x.fillRect(0,0,W,H);
  x.fillStyle='#1b1915';rr(300,110,680,500,40);x.fill();x.strokeStyle='#3a362f';x.lineWidth=3;x.stroke();
  x.fillStyle='#2a2722';for(let i=0;i<2;i++){x.beginPath();x.arc(925,430+i*70,20,0,7);x.fill()}
  for(let i=0;i<8;i++){x.fillStyle='#0e0d0b';x.fillRect(900,250+i*12,50,4)}
  x.save();rr(340,150,520,400,36);x.clip();
  x.fillStyle='#0c0c0c';x.fillRect(340,150,520,400);
  x.save();x.translate(340,150);fn(t);x.restore();
  const fl=0.92+0.08*hs(Math.floor(t*FPS));x.fillStyle=`rgba(0,0,0,${1-fl})`;x.fillRect(340,150,520,400);
  for(let y=150;y<550;y+=3){x.fillStyle='rgba(0,0,0,.28)';x.fillRect(340,y,520,1)}
  const v=x.createRadialGradient(600,350,120,600,350,330);v.addColorStop(0,'rgba(255,255,255,.06)');v.addColorStop(1,'rgba(0,0,0,.75)');x.fillStyle=v;x.fillRect(340,150,520,400);
  x.restore();x.restore();
}
function rr(a,b,w,h,r){x.beginPath();x.roundRect(a,b,w,h,r)}
function scratches(t){const f=Math.floor(t*FPS);for(let i=0;i<3;i++){if(hs(f*3+i)>.6){x.fillStyle='rgba(230,225,210,.35)';x.fillRect(hs(f+i*9)*520,0,1,400)}}}
function person(px,py,s,c,t,pose){x.fillStyle=c;x.beginPath();x.arc(px,py-60*s,14*s,0,7);x.fill();
  rr(px-20*s,py-44*s,40*s,70*s,10*s);x.fill();x.fillRect(px-15*s,py+20*s,10*s,50*s);x.fillRect(px+5*s,py+20*s,10*s,50*s);
  if(pose=='phone'){x.fillRect(px+12*s,py-60*s,8*s,26*s)}}
function arch1(t){ // man on candlestick phone
  const gr=x.createLinearGradient(0,0,0,400);gr.addColorStop(0,'#8a877f');gr.addColorStop(1,'#3a3833');x.fillStyle=gr;x.fillRect(0,0,520,400);
  x.fillStyle='#b8b4aa';x.fillRect(320,60,140,120);x.fillStyle='#5a574f';x.fillRect(388,60,4,120);x.fillRect(320,118,140,4);
  x.fillStyle='#1d1c19';x.fillRect(60,260,400,20);x.fillRect(80,280,14,120);x.fillRect(430,280,14,120);
  const b=Math.sin(t*2.2)*3;person(220+b,240,1.25,'#141310',t,'phone');
  x.fillRect(300,200,8,60);x.beginPath();x.arc(304,198,10,0,7);x.fill();scratches(t);
}
function archDoor(t){
  x.fillStyle='#7c7a74';x.fillRect(0,0,520,400);x.fillStyle='#4e4c47';for(let i=0;i<5;i++)x.fillRect(i*130-((t*40)%130),70,110,330);
  x.fillStyle='#22211e';x.fillRect(330,130,80,270);x.fillStyle='#9a978f';x.beginPath();x.arc(395,270,5,0,7);x.fill();
  const k=Math.sin(t*14)>0?6:0;person(250,300,1.3,'#151412',t);x.fillStyle='#151412';x.fillRect(265,230-k,60,12);scratches(t);
}
function archDial(t){
  x.fillStyle='#6f6d67';x.fillRect(0,0,520,400);x.save();x.translate(260,210);
  x.fillStyle='#1a1916';x.beginPath();x.arc(0,0,150,0,7);x.fill();x.rotate(-t*2.4%1.6);
  for(let i=0;i<10;i++){const a=i*0.5+0.6;x.fillStyle='#d8d4c8';x.beginPath();x.arc(Math.cos(a)*105,Math.sin(a)*105,22,0,7);x.fill()}
  x.restore();x.fillStyle='#d8d4c8';x.font='bold 22px '+MONO;x.textAlign='center';x.fillText('KLONDIKE 5',260,215);scratches(t);
}
function archScroll(t){
  x.fillStyle='#d9d6cc';x.fillRect(0,0,520,400);x.font='15px '+SERIF;x.fillStyle='#222';x.textAlign='left';
  const o=(t*260)%28;for(let i=0;i<18;i++){const n=Math.floor(t*260/28)+i;x.fillText(ASKS[n%ASKS.length],30,i*28-o+20);}
  x.fillStyle='rgba(20,20,20,.85)';x.beginPath();x.ellipse(430,300+Math.sin(t*9)*30,30,44,0,0,7);x.fill();
}
// ---- asks (period-style "wanted" posts)
const A1=['WTD:','Looking for','Need','ISO','Anyone know','WANTED:','Seeking','Help! need'];
const A2=['a guitar teacher','used upright piano','a good plumber in Tulsa','someone to fix my modem','cheap web hosting','a babysitter Tues','a ride to Chicago','vintage Pez dispensers','a wedding photographer','a tutor for algebra','roommate, no smokers','a mechanic who is honest','a laptop under $900','a dentist who takes walk-ins'];
const ASKS=[];for(let i=0;i<64;i++)ASKS.push(A1[i%8]+' '+A2[(i*5+Math.floor(i/8))%14]);
function page(t,seed,cursorK){
  bg('#d6d3ca');x.fillStyle='#e8e5dc';x.fillRect(180,0,920,H);
  x.fillStyle='#8a877f';x.fillRect(180,0,920,54);x.fillStyle='#f4f1e8';x.font='bold 26px '+SERIF;x.textAlign='left';
  x.fillText(['Classifieds 2000 :: WANTED','Community Board — Requests','The Want Ads Online','ASK-IT Forum :: Help Needed'][seed%4],200,36);
  x.font='12px '+SANS;x.fillStyle='#4a4842';x.fillText('Home | Post an ad | Search | Members   Last updated: 03/14/2000   Visitors: '+(104882+seed*37),200,76);
  for(let i=0;i<14;i++){const y=112+i*40,s=ASKS[(i+seed*3)%64];x.fillStyle='#2b2a26';x.font='bold 17px '+SERIF;
    x.fillText(s,220,y);x.font='12px '+SERIF;x.fillStyle='#66635b';x.fillText('posted by user'+(100+((i*37+seed*13)%900))+' · '+(1+i%9)+' replies',220,y+16)}
  if(cursorK!=null){const ty=112+4*40;if(cursorK>.95){x.fillStyle='#2b2a26';x.fillRect(220,ty+3,x.measureText(ASKS[4]).width*1.4,1.5)}
    const cx=lerp(900,330,ss(cursorK)),cy=lerp(560,ty-4,ss(cursorK));x.fillStyle='#fff';x.strokeStyle='#000';x.lineWidth=1.2;
    x.beginPath();x.moveTo(cx,cy);x.lineTo(cx,cy+20);x.lineTo(cx+5,cy+15);x.lineTo(cx+10,cy+24);x.lineTo(cx+13,cy+22);x.lineTo(cx+8,cy+14);x.lineTo(cx+15,cy+14);x.closePath();x.fill();x.stroke()}
}
function fmt(n){return Math.floor(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,',')}
function counter(t,cx,cy,size,label,rate,base){ // linear on global clock
  const v=base+Math.max(0,t)*rate;x.textAlign='right';x.font=`bold ${size}px ${MONO}`;x.fillStyle='#f3f0e6';
  x.fillText(fmt(v),cx,cy);x.font=`${size*0.34}px ${SANS}`;x.fillStyle='#b9b6ad';x.fillText(label,cx,cy+size*0.6);
}
// ---- galaxy
function galaxy(t,rot,logos,snapK){
  bg('#060505');x.textAlign='center';
  for(let i=0;i<220;i++){const r=60+hs(i)*520,a=hs(i+3)*6.283+rot*(1-r/900),z=hs(i+7);
    const px=W/2+Math.cos(a)*r,py=H/2+Math.sin(a)*r*0.42,s=0.5+z;
    if(i==4&&snapK>0)continue;
    const al=0.25+0.5*z;x.fillStyle=`rgba(236,232,220,${al*(1-snapK*0.6)})`;
    if(z>.72){x.font=`${10*s}px ${SERIF}`;x.fillText(ASKS[i%64],px,py)}else{x.fillRect(px,py,1.6*s,1.6*s)}}
  if(logos){const P=['X','reddit','in','▶','◎','♪'];for(let i=0;i<6;i++){const a=rot*1.6+i*1.047,px=W/2+Math.cos(a)*300,py=H/2+Math.sin(a)*130;
    x.save();x.shadowColor='#fff';x.shadowBlur=24;x.strokeStyle='#fff';x.lineWidth=2;x.beginPath();x.arc(px,py,30,0,7);x.stroke();
    x.fillStyle='#fff';x.font='bold 20px '+SANS;x.textBaseline='middle';x.fillText(P[i],px,py);x.restore();x.textBaseline='alphabetic'}}
  if(snapK>0){const k=ss(snapK);const px=lerp(W/2+250,W/2,k),py=lerp(H/2-80,H/2-20,k);
    x.font='bold 26px '+SERIF;const tw=x.measureText(ASKS[4]).width;x.fillStyle='#fff';x.fillText(ASKS[4],px,py+9);
    x.strokeStyle=`rgba(255,255,255,${k})`;x.lineWidth=2;rr(px-tw/2-24,py-28,tw+48,56,8);x.stroke();
    if(snapK>.5){const c=ss((snapK-.5)*2);x.fillStyle=`rgba(255,255,255,${c})`;rr(px+tw/2-30,py-46,90,26,13);x.fill();
      x.fillStyle='#000';x.font='bold 14px '+SANS;x.fillText(WORD,px+tw/2+15,py-28)}}
}
// ---- THE BUTTON (pseudo-3D, physical-ish shading)
function logo(cx,cy,s,col,lw){x.strokeStyle=col;x.fillStyle=col;x.lineWidth=lw*s;x.lineCap='round';
  x.beginPath();x.arc(cx,cy+12*s,9*s,0,7);x.fill();
  for(let i=1;i<=3;i++){x.beginPath();x.arc(cx,cy+12*s,(9+i*16)*s,-Math.PI*0.78,-Math.PI*0.22);x.stroke()}}
function button(cx,cy,R,colK,rimK,press){
  const tilt=0.42,dep=R*0.32*(1-press*0.3),c=ORANGE.map(v=>Math.round(lerp(150,v,colK)));
  const c2=c.map(v=>Math.round(v*0.45));
  // brushed metal base
  const bR=R*1.35;x.save();x.beginPath();x.ellipse(cx,cy+dep+R*0.12,bR,bR*tilt,0,0,7);x.clip();
  x.fillStyle=`rgb(${30+60*rimK},${30+60*rimK},${32+60*rimK})`;x.fillRect(cx-bR,cy,bR*2,dep+bR);
  for(let i=0;i<70;i++){const r=bR*i/70;x.strokeStyle=`rgba(255,255,255,${0.04+hs(i)*0.08*rimK})`;x.beginPath();x.ellipse(cx,cy+dep+R*0.12,r,r*tilt,0,0,7);x.stroke()}
  x.restore();
  // side wall
  const sg=x.createLinearGradient(cx-R,0,cx+R,0);
  sg.addColorStop(0,`rgba(190,215,255,${rimK})`);sg.addColorStop(0.12,`rgb(${c2})`);sg.addColorStop(0.7,`rgb(${c2.map(v=>v*0.6|0)})`);sg.addColorStop(0.94,`rgba(255,200,150,${rimK*(0.4+0.6*colK)})`);sg.addColorStop(1,`rgb(${c2})`);
  x.fillStyle=sg;x.beginPath();x.ellipse(cx,cy+dep,R,R*tilt,0,0,Math.PI);x.lineTo(cx-R,cy);x.ellipse(cx,cy,R,R*tilt,0,Math.PI,0,true);x.closePath();x.fill();
  // top cap
  const tg=x.createRadialGradient(cx-R*0.3,cy-R*0.25,R*0.05,cx,cy,R*1.05);
  tg.addColorStop(0,`rgb(${c.map(v=>Math.min(255,v+60))})`);tg.addColorStop(0.55,`rgb(${c})`);tg.addColorStop(1,`rgb(${c2})`);
  x.save();x.beginPath();x.ellipse(cx,cy,R,R*tilt,0,0,7);x.fillStyle=tg;x.fill();x.clip();
  x.globalAlpha=Math.max(rimK*0.3,colK);
  x.save();x.translate(cx,cy);x.scale(1,tilt);
  logo(-2,-R*0.12-3,R/90,'rgba(0,0,0,.35)',7);logo(2,-R*0.12+3,R/90,'rgba(255,255,255,.35)',7);logo(0,-R*0.12,R/90,`rgb(${c.map(v=>v*0.8|0)})`,6);
  x.restore();x.globalAlpha=1;
  // clearcoat highlight
  const hg=x.createRadialGradient(cx-R*0.35,cy-R*0.18,0,cx-R*0.35,cy-R*0.18,R*0.55);hg.addColorStop(0,`rgba(255,255,255,${0.55*Math.max(rimK,colK)})`);hg.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=hg;x.fillRect(cx-R,cy-R,R*2,R*2);x.restore();
  // rim lights
  x.lineWidth=3;x.strokeStyle=`rgba(200,225,255,${0.9*rimK})`;x.beginPath();x.ellipse(cx,cy,R,R*tilt,0,Math.PI*0.9,Math.PI*1.45);x.stroke();
  x.strokeStyle=`rgba(255,215,180,${0.8*rimK})`;x.beginPath();x.ellipse(cx,cy,R,R*tilt,0,Math.PI*1.6,Math.PI*2.05);x.stroke();
  if(colK>0){x.save();x.globalCompositeOperation='lighter';const gl=x.createRadialGradient(cx,cy,R*0.6,cx,cy,R*2.2);
    gl.addColorStop(0,`rgba(255,104,26,${0.22*colK})`);gl.addColorStop(1,'rgba(255,104,26,0)');x.fillStyle=gl;x.fillRect(0,0,W,H);x.restore()}
}
// ---- charts
function axes(){x.strokeStyle='rgba(220,218,210,.25)';x.lineWidth=1;for(let i=0;i<5;i++){x.beginPath();x.moveTo(160,160+i*100);x.lineTo(1120,160+i*100);x.stroke()}}
function curve(t,k,steep){bg('#070606');axes();x.save();x.shadowColor='#fff';x.shadowBlur=steep?18:0;x.strokeStyle=steep?'#fff':'#8d8b85';x.lineWidth=3;x.beginPath();
  const n=Math.floor(120*k);for(let i=0;i<=n;i++){const u=i/120,px=160+u*960,py=steep?560-400*Math.pow(u,3.2):560-12*u;i?x.lineTo(px,py):x.moveTo(px,py)}x.stroke();x.restore()}
function sine(t,lt){bg('#060505');const cam=lt*520;x.save();x.translate(-cam,0);x.shadowColor='#fff';x.shadowBlur=16;
  x.strokeStyle='rgba(255,255,255,.85)';x.lineWidth=3;x.beginPath();const hx=W*0.6+cam;
  for(let px=cam-40;px<=hx;px+=6){const py=360+Math.sin(px/90)*120;px==cam-40?x.moveTo(px,py):x.lineTo(px,py)}x.stroke();
  const hy=360+Math.sin(hx/90)*120;for(let i=0;i<14;i++){x.fillStyle=`rgba(255,255,255,${0.5-i*0.035})`;x.beginPath();x.arc(hx-i*7,360+Math.sin((hx-i*7)/90)*120,9-i*0.5,0,7);x.fill()}
  x.shadowBlur=40;x.fillStyle='#fff';x.beginPath();x.arc(hx,hy,10,0,7);x.fill();x.restore()}
const PL=[['X','posts / day'],['Reddit','comments / day'],['LinkedIn','posts / day'],['YouTube','comments / day'],['Instagram','comments / day'],['TikTok','comments / day']];
const PG=['X','reddit','in','▶','◎','♪'];
function platform(t,i,lt){bg('#070606');const s=1+lt*0.08,f=Math.floor(t*FPS);
  x.save();x.translate(W/2,H/2);x.scale(s,s);x.translate(-W/2,-H/2);
  if(lt<0.08){x.fillStyle='rgba(255,255,255,.9)';x.fillRect(0,0,W,H)}
  x.shadowColor='#fff';x.shadowBlur=30;x.strokeStyle='#fff';x.lineWidth=3;x.beginPath();x.arc(W/2,250,70,0,7);x.stroke();
  x.fillStyle='#fff';x.font='bold 50px '+SANS;x.textAlign='center';x.textBaseline='middle';x.fillText(PG[i],W/2,252);x.shadowBlur=0;x.textBaseline='alphabetic';
  x.font='22px '+SANS;x.fillStyle='#cfccc3';x.fillText(PL[i][0],W/2,360);
  counter(t,W/2+230,450,60,PL[i][1],[6e5,2.2e5,4e4,1.1e6,9e5,1.4e6][i],[5e8,3e7,2e6,1e8,9e7,2e8][i]);x.restore()}
function hyper(lt){bg('#030303');for(let i=0;i<260;i++){const a=hs(i)*6.283,r0=(hs(i+9)*400+lt*lt*1600)%700,len=20+lt*260*hs(i+2);
  x.strokeStyle=`rgba(240,236,226,${0.3+0.6*hs(i+4)})`;x.lineWidth=1+hs(i+5)*2;x.beginPath();
  x.moveTo(W/2+Math.cos(a)*r0,H/2+Math.sin(a)*r0);x.lineTo(W/2+Math.cos(a)*(r0+len),H/2+Math.sin(a)*(r0+len));x.stroke()}}
// ---- main
function seek(t){
  const f=Math.floor(t*FPS);x.save();x.textBaseline='alphabetic';let cutGl=false;
  const cuts=[8,17,22,26,27.3,28.6,30,36,44,48,51];for(const c of cuts)if(t>=c&&t<c+2/FPS&&c!=36)cutGl=true;
  if(t<8){tv(t,arch1,1+t*0.02);caption(t,['"Hello, Central? I need a man','who can fix a fence."'],1.2,0.42,655)}
  else if(t<17){const lt=t-8;
    if(lt>4.4&&lt<6){page(t,f,null)}else{x.save();const z=1.25-lt*0.03;x.translate(W/2,H/2);x.scale(z,z);x.translate(-W/2,-H/2+(lt>6?-40:0));
      page(t,lt>6?2:0,lt<4.4?cl((lt-0.8)/2):null);x.restore()}
    x.fillStyle='rgba(8,7,6,.82)';rr(870,20,390,100,10);x.fill();counter(t-8,1240,74,40,'posts / day, worldwide',5.55e7,0);
    x.fillStyle='rgba(8,7,6,.72)';x.fillRect(0,590,W,110);
    if(lt<4.4)caption(t,['People have always asked the internet','for what they need.'],8.6,0.32);
    else if(lt>5.6)caption(t,['Today, there are five hundred','million posts a day.'],13.9,0.34)}
  else if(t<22){const lt=t-17;galaxy(t,lt*0.09,false,cl((lt-2.2)/1.2));
    if(lt<2.6)caption(t,['Some of them are','ready to buy.'],17.3,0.3);else caption(t,['We call that','a '+WORD+'.'],20.0,0.32)}
  else if(t<26){tv(t,archDoor,1.02+(t-22)*0.03);caption(t,['For decades, we found them','by hand.'],22.3,0.35,660)}
  else if(t<27.3){tv(t,archDoor,1.25);caption(t,['Door by door.'],26.1,0.3,660)}
  else if(t<28.6){tv(t,archDial,1.25);caption(t,['Call by call.'],27.4,0.3,660)}
  else if(t<30){tv(t,archScroll,1.25);caption(t,['Scroll by scroll.'],28.7,0.3,660)}
  else if(t<33.5){const lt=t-30;bg('#020202');button(W/2,lerp(560,330,ss(lt/2)),180,0,ss((lt-0.3)/1.2),0);caption(t,[BRAND+' finds the '+WORD+'s.'],31.3,0.35,650)}
