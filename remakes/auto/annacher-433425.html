<!--
STATE LIST ON THE BEAT GRID (120 BPM: 1 beat = 0.5 s, 7 bars = 28 beats = 14 s).
One loop is 14 s. window.DUR = 28 plays it twice, because 15 s is the minimum length.
Every change below is the SAME rounded rect morphing its w/h/radius/color.
The camera zoom is derived from the shape's sprung size.

BAR 1
  b0  0.0  Button "Connect ad account" (black pill). Cursor glides in.
  b1  0.5  CLICK. Morphs to a white card with 5 logos (Meta, Google, LinkedIn, TikTok, Reddit).
  b2  1.0  CLICK Meta. The tile inverts.
  b3  1.5  Morphs to a circle with a loader arc.
BAR 2
  b4  2.0  The circle turns accent and a check mark draws itself.
  b5  2.5  Morphs to the prompt bar. Typing starts.
  b6  3.0  "Launch ads that convert" finishes typing.
  b7  3.5  CLICK send. Morphs to the black island.
BAR 3
  b8  4.0  Island "Researching 42 competitors". The counter ticks.
  b9  4.5  Counter lands on 42.
  b10 5.0  Morphs to the Ads Library wall.
  b11 5.5  Cursor DRAGS the wall. Scroll follows the cursor, then the release springs it on.
BAR 4
  b12 6.0  The wall lands on the Top performer card.
  b13 6.5  CLICK the card. Morphs to the approval card.
  b14 7.0  Hover "Approve & launch".
  b15 7.5  CLICK approve.
BAR 5
  b16 8.0  Morphs to the budget slider.
  b17 8.5  PRESS the knob. The knob follows the cursor.
  b18 9.0  Dragged past max. Rubber-band stretch.
  b19 9.5  RELEASE. Springs back to max from where it was.
BAR 6
  b20 10.0 Morphs to the Autopilot row. CLICK the toggle; its knob edges ride two springs.
  b21 10.5 The knob becomes the liquid tab indicator: Meta.
  b22 11.0 CLICK LinkedIn. The leading edge stretches ahead.
  b23 11.5 CLICK Reddit.
BAR 7
  b24 12.0 Morphs to the ROAS chart. The line draws itself and a hover tooltip appears.
  b25 12.5 ⌘K palette. Types "pause".
  b26 13.0 CLICK. Toast "Paused 3 losing ads".
  b27 13.5 Back to the button. The cursor returns to its t=0 pose, so the loop is seamless.

All springs are closed-form step responses (z = 0.82, ~1% overshoot).
A value that changes target many times is a sum of springs; the previous cycle's terms are included,
so the frame at 14 s equals the frame at 0 s.
-->
