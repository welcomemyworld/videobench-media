<html><head><meta charset="utf-8"><title>Pixel Wizard</title>
<style>html,body{margin:0;background:#000;overflow:hidden;height:100%}canvas{position:absolute;image-rendering:pixelated;image-rendering:crisp-edges}</style></head>
<body><canvas id="c"></canvas>
<script>
window.DUR=16;
var P=["#05040f","#0d0b26","#171542","#24205e","#3a2f80","#5a4aa8","#e8e4d0","#c9c4b8","#8a8578","#4a3b2a","#7a5230","#b07840","#6b1f3a","#a8324f","#d65a5a","#f0c890","#2a1838","#ffffff","#9ff6ff","#3fc8ff","#1a6cc8","#ffe46b","#ff8a2a","#c84aff"];
var W=128,H=96,off=document.createElement('canvas');off.width=W;off.height=H;var g=off.getContext('2d');
var cv=document.getElementById('c'),cx=cv.getContext('2d');
function rs(){var s=Math.max(1,Math.floor(Math.min(innerWidth/W,innerHeight/H)));cv.width=W*s;cv.height=H*s;cv.style.width=W*s+'px';cv.style.height=H*s+'px';cv.style.left=((innerWidth-W*s)>>1)+'px';cv.style.top=((innerHeight-H*s)>>1)+'px';}
addEventListener('resize',rs);rs();
var cur=-1;function R(x,y,w,h,c){x=x|0;y=y|0;if(c!==cur){g.fillStyle=P[c];cur=c;}g.fillRect(x,y,w|0,h|0);}
// stars
var NS=26,sx=new Int16Array(NS),sy=new Int16Array(NS),sp=new Float32Array(NS),seed=7;
function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647;}
for(var i=0;i<NS;i++){sx[i]=rnd()*W|0;sy[i]=rnd()*60|0;sp[i]=rnd()*6.28;}
// particles
var NP=160,px=new Float32Array(NP),py=new Float32Array(NP),vx=new Float32Array(NP),vy=new Float32Array(NP),pl=new Float32Array(NP),pm=new Float32Array(NP),pa=new Uint8Array(NP),pk=new Uint8Array(NP),pr=new Float32Array(NP),pt=new Float32Array(NP);
var RAMP=[18,19,20,4,2];
function spawn(x,y,a,b,life,kind,r,th){for(var i=0;i<NP;i++)if(!pa[i]){pa[i]=1;px[i]=x;py[i]=y;vx[i]=a;vy[i]=b;pl[i]=life;pm[i]=life;pk[i]=kind;pr[i]=r;pt[i]=th;return;}}
// pose
var pose={st:0,arm:0,tilt:0,sway:0,bob:0},gemX=0,gemY=0,shake=0,proj=0,projX=0,flash=0,glow=0;
var BX=34,BY=82;
function ease(t){t=t<0?0:t>1?1:t;return t*t*(3-2*t);}
var tick=0,simT=0;
var q=new URLSearchParams(location.search),t0=performance.now()-(parseFloat(q.get('t'))||0)*1000;
function state(t){return t<4?0:t<8.5?1:t<10?2:3;}
function step(){var t=simT%DUR,s=state(t);tick++;
 var st=0,arm=0,tilt=0,sw=Math.sin(t*3)*0.7;glow=0.15;
 if(s===1){var e=ease((t-4)/1.5);st=e;arm=e;tilt=-e;glow=0.3+0.7*ease((t-4)/4.5);}
 else if(s===2){var e2=ease((t-8.5)/0.25);st=1+e2*0.4;arm=1;tilt=-1+e2*0.5;glow=1;}
 else if(s===3){var e3=ease((t-10)/2.5);st=1.4*(1-e3);arm=1-e3;tilt=-0.5*(1-e3);glow=1-0.85*e3;}
 pose.st=st;pose.arm=arm;pose.tilt=tilt;pose.sway=sw;pose.bob=(Math.floor(t*2)%2);
 var ang=-0.15-st*0.9;gemX=BX+9+Math.sin(-ang)*6+st*4;gemY=BY-22-arm*8-Math.cos(ang)*4;
 if(s===1&&tick%3===0){var th=rnd()*6.28;spawn(0,0,0,0,50+rnd()*30,0,14+rnd()*8,th);}
 if(s===2&&!proj&&t>8.6){proj=1;projX=gemX;flash=8;shake=18;for(var k=0;k<40;k++){var a=rnd()*6.28,v=0.5+rnd()*1.5;spawn(gemX,gemY,Math.cos(a)*v,Math.sin(a)*v,30+rnd()*30,1,0,0);}}
 if(s===0)proj=0;
 if(proj===1){projX+=2.2;if(tick%1===0)spawn(projX,gemY+Math.sin(projX*.4)*1.5,-0.3,(rnd()-.5)*.4,20+rnd()*15,1,0,0);
  if(projX>118){proj=2;shake=10;flash=5;for(var k2=0;k2<30;k2++){var a2=rnd()*6.28,v2=0.4+rnd()*1.2;spawn(118,gemY,Math.cos(a2)*v2,Math.sin(a2)*v2,25+rnd()*25,1,0,0);}}}
 if(shake>0)shake--;if(flash>0)flash--;
 for(var i=0;i<NP;i++)if(pa[i]){pl[i]--;if(pl[i]<=0){pa[i]=0;continue;}
  if(pk[i]===0){pr[i]*=0.975;pt[i]+=0.12+(20-pr[i])*0.01;px[i]=gemX+Math.cos(pt[i])*pr[i];py[i]=gemY+Math.sin(pt[i])*pr[i]*0.8;if(pr[i]<1.5)pl[i]=0;}
  else{px[i]+=vx[i];py[i]+=vy[i];vx[i]*=0.96;vy[i]=vy[i]*0.96+0.02;}}
}
function rim(x,y,h){if(glow>0.25)R(x,y,1,h,glow>0.7?18:19);}
function drawWiz(t){var b=pose.bob,sw=Math.round(pose.sway),x=BX,y=BY;
 // staff
 var gx=Math.round(gemX),gy=Math.round(gemY),hx=x+8,hy=y-4;
 var n=Math.max(Math.abs(gx-hx),Math.abs(gy-hy));for(var i=0;i<=n;i++){R(hx+(gx-hx)*i/n,hy+(gy-hy)*i/n+2,1,1,i%5?10:9);}
 // robe
 for(var r=0;r<20;r++){var w=8+(r>>1),yy=y-20+r+b*(r<10?1:0),ox=x-(w>>1)+(r>12?sw:0);
  R(ox-1,yy,w+2,1,16);R(ox,yy,w,1,12);R(ox,yy,(w*0.4)|0,1,13);}
 R(x-6+sw,y-1,13,1,16);R(x-5,y-12+b,11,1,22);// belt
 R(x-1,y-12+b,2,1,21);
 rim(x+4+(glow>0?1:0),y-18+b,9);
 // arm
 var ar=Math.round(pose.arm*6);R(x+2,y-17+b-ar,4,3+ar,16);R(x+2,y-17+b-ar,3,2+ar,13);R(gx-1+0,gy+3,2,2,15);
 // head
 var tl=Math.round(pose.tilt),hy2=y-25+b;
 R(x-3+tl,hy2,7,5,15);R(x-3+tl,hy2+1,1,1,8);R(x+1+tl,hy2+1,1,1,0);R(x+3+tl,hy2+1,1,1,0);
 // beard
 var bs=Math.round(Math.sin(t*3+1)*0.8);
 for(var r2=0;r2<11;r2++){var bw=r2<6?6:6-(r2-5),bx=x-3+tl+(r2>5?bs:0)+(r2>5?(6-bw)>>1:0);R(bx,hy2+3+r2,bw,1,r2>8?7:6);R(bx,hy2+3+r2,1,1,8);}
 R(x+tl,hy2+2,2,1,7);
 // hat
 R(x-7+tl,hy2-1,15,2,16);R(x-6+tl,hy2-1,13,1,4);
 for(var r3=0;r3<10;r3++){var hw=Math.max(1,9-r3),bend=r3>6?(r3-6)*-1-Math.round(sw*0.5):0;var hx2=x-(hw>>1)+tl+bend+(r3>>2);
  R(hx2-1,hy2-2-r3,hw+2,1,16);R(hx2,hy2-2-r3,hw,1,4);if(hw>2)R(hx2+hw-2,hy2-2-r3,1,1,5);}
 R(x-4+tl,hy2-3,9,1,21);
 if(glow>0.25){R(x+4+tl,hy2-1,1,1,glow>0.7?18:19);R(x+3+tl,hy2+3,1,4,19);}
 // gem
 var fl=(pose.st>0.5&&(tick>>2)%2)?18:19;R(gx-1,gy-1,3,3,16);R(gx,gy-1,1,3,fl);R(gx-1,gy,3,1,fl);R(gx,gy,1,1,17);
}
function render(){var t=simT%DUR;cur=-1;
 for(var y=0;y<H;y++){R(0,y,W,1,y<20?0:y<45?1:y<70?2:3);}
 for(var i=0;i<NS;i++){var tw=Math.floor(t*10+sp[i]*3)%7;if(tw)R(sx[i],sy[i],1,1,tw>4?6:5);}
 R(96,10,10,10,7);R(95,12,12,6,7);R(97,9,8,12,7);R(99,12,3,2,8);R(101,16,2,2,8);R(103,11,2,8,6);
 R(0,82,W,14,1);R(0,82,W,1,5);for(var x=0;x<W;x+=11)R(x+((x/11)%2)*5,86,1,10,0);R(0,89,W,1,0);
 g.save();var sh=shake>0?((shake&2)?1:-1)*(shake>8?2:1):0;g.translate(sh,shake>0&&(shake&1)?1:0);
 if(glow>0.4){R(BX-12,82,26,1,glow>0.8?20:4);}
 drawWiz(t);
 if(proj===1){var X=Math.round(projX),Y=Math.round(gemY);R(X-2,Y-1,5,3,19);R(X-1,Y-2,3,5,19);R(X-1,Y,3,1,17);R(X,Y-1,1,3,17);}
 for(var p=0;p<NP;p++)if(pa[p]){var f=1-pl[p]/pm[p],c=RAMP[Math.min(4,f*5|0)];if(pk[p]===1&&f<0.4&&(p%3===0))c=p%2?21:23;R(px[p],py[p],1,1,c);}
 g.restore();
 if(flash>0){g.globalAlpha=flash/14;cur=-1;R(0,0,W,H,17);g.globalAlpha=1;cur=-1;}
 cx.imageSmoothingEnabled=false;cx.drawImage(off,0,0,cv.width,cv.height);}
var acc=0,last=null;
function loop(now){var target=((now-t0)/1000)%DUR;
 if(last===null||target<simT-0.5){simT=0;for(var i=0;i<NP;i++)pa[i]=0;proj=0;}
 var n=0;while(simT+1/60<=target&&n<1200){simT+=1/60;step();n++;}last=now;
 render();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script></body></html>
