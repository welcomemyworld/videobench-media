<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Saturn V — Interactive Cutaway</title>
<style>html,body{margin:0;background:#000;height:100%;overflow:hidden}
canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}</style></head>
<body><canvas id="c" width="1280" height="720"></canvas>
<script>
window.DUR=40;
const C=document.getElementById('c'),X=C.getContext('2d');
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);C.style.width=1280*s+'px';C.style.height=720*s+'px';}
addEventListener('resize',fit);fit();
const T0=parseFloat(new URLSearchParams(location.search).get('t'))||0;
const N=24,PI=Math.PI;
// parts
const P=[];const Q=[];
function part(name,desc,dy,hull,col){P.push({name,desc,dy,hull,col,cy:0,n:0});return P.length-1}
function lathe(pi,prof,n,cx,cz){n=n||N;cx=cx||0;cz=cz||0;const p=P[pi];
 for(let k=0;k<prof.length-1;k++){const[y0,r0]=prof[k],[y1,r1]=prof[k+1];
  for(let i=0;i<n;i++){const a0=i/n*2*PI,a1=(i+1)/n*2*PI,am=(a0+a1)/2;
   const pts=[[cx+Math.cos(a0)*r0,y0,cz+Math.sin(a0)*r0],[cx+Math.cos(a1)*r0,y0,cz+Math.sin(a1)*r0],[cx+Math.cos(a1)*r1,y1,cz+Math.sin(a1)*r1],[cx+Math.cos(a0)*r1,y1,cz+Math.sin(a0)*r1]];
   let nx=Math.cos(am)*(y1-y0),ny=-(r1-r0),nz=Math.sin(am)*(y1-y0),l=Math.hypot(nx,ny,nz)||1;
   Q.push({pts,pi,n:[nx/l,ny/l,nz/l],c:p.col(am,(y0+y1)/2)});}
  p.cy+=(y0+y1)/2;p.n++;}}
const W=[235,235,230],B=[22,22,24];
const qd=a=>Math.floor(a/(PI/2))%2;
const tank=(y0,y1,r)=>[[y0,0],[y0+r*.3,r*.7],[y0+r*.6,r],[y1-r*.6,r],[y1-r*.3,r*.7],[y1,0]];
const metal=()=>[70,68,66];
let i;
i=part('F-1 Engines ×5','Five F-1s burn kerosene and LOX for 7.5 million lbf of liftoff thrust.',-12,0,metal);
const f1=[[0,0],[3,3],[-3,3],[3,-3],[-3,-3]];
for(const[x,z]of f1)lathe(i,[[0,1.9],[1.5,1.6],[3,1.0],[4,.6],[5,.9],[6,1.1],[6.3,0]],16,x,z);
i=part('S-IC First Stage','Booster stage: lifts 2,900 t off the pad and burns out 67 km up.',0,1,(a,y)=>y<16?(qd(a)?B:W):(y>38&&y<40?B:W));
lathe(i,[[6,5],[16,5],[38,5],[40,5],[42,5]]);
i=part('RP-1 Fuel Tank','Holds 770,000 litres of refined kerosene for the F-1 engines.',0,0,()=>[200,110,60]);lathe(i,tank(8,23,4.5));
i=part('S-IC LOX Tank','1.2 million litres of liquid oxygen at −183 °C.',8,0,()=>[70,130,220]);lathe(i,tank(25,40.5,4.5));
i=part('J-2 Engines ×5 (S-II)','Five hydrogen-burning J-2s push the second stage toward orbit.',18,0,metal);
for(const[x,z]of f1)lathe(i,[[42,1],[43.5,.65],[44.6,.35],[45.5,.5],[46,0]],12,x*.75,z*.75);
i=part('S-II Second Stage','Second stage: six minutes of burn from 67 km to near orbit.',26,1,(a,y)=>y>69?B:W);
lathe(i,[[42,5],[46,5],[69,5],[71,5]]);
i=part('S-II LOX Tank','Liquid oxygen sits in the lower bulkhead of the S-II.',22,0,()=>[70,130,220]);lathe(i,tank(46.5,53,4.5));
i=part('S-II LH2 Tank','Huge liquid-hydrogen tank, chilled to −253 °C.',32,0,()=>[150,220,235]);lathe(i,tank(53.5,70.5,4.6));
i=part('J-2 Engine (S-IVB)','Single restartable J-2: reaches orbit, then fires again toward the Moon.',40,0,metal);
lathe(i,[[71,1.1],[72.5,.7],[73.7,.4],[74.6,.55],[75,0]],14);
i=part('S-IVB Third Stage','Third stage: parks in Earth orbit, then performs translunar injection.',48,1,(a,y)=>y<80&&y>75?(qd(a)?B:W):W);
lathe(i,[[71,5],[75,3.3],[80,3.3],[92,3.3]]);
i=part('S-IVB Propellant Tanks','Common-bulkhead LOX (lower) and LH2 (upper) tanks.',54,0,(a,y)=>y<80?[70,130,220]:[150,220,235]);
lathe(i,[[75,0],[76,2.6],[78,3],[91,3],[91.8,2],[92.1,0]]);
i=part('LM Adapter','Panelled cone that shields the Lunar Module during launch.',60,1,()=>W);
lathe(i,[[92,3.3],[101,2.05]]);
i=part('Lunar Module','Two-stage lander that carried two astronauts to the Moon\u2019s surface.',64,0,(a,y)=>y<96?[210,165,60]:[190,190,195]);
lathe(i,[[93,0],[93.2,2.1],[96,2.1],[96,1.6],[98.6,1.4],[99,0]],8);
i=part('Service Module','Main engine, oxygen, power and fuel cells for the Apollo crew.',70,0,()=>[185,190,198]);
lathe(i,[[101,0],[101,2],[105,2],[105,0]]);
i=part('Command Module','Cone where three astronauts ride — the only part that comes home.',74,0,()=>[215,215,220]);
lathe(i,[[105,0],[105,2],[108.5,.35],[108.7,0]]);
i=part('Launch Escape Tower','Solid rocket that yanks the capsule clear if the launch goes wrong.',80,0,(a,y)=>y<110?[150,150,150]:[200,60,40]);
lathe(i,[[108.5,.9],[110,.3],[116,.3],[116,.6],[117.5,.6],[118.7,0]],12);
P.forEach(p=>p.cy/=p.n);
// stars
const ST=[];for(let k=0;k<220;k++)ST.push([Math.random()*1280,Math.random()*500,Math.random()]);
const sm=x=>x<0?0:x>1?1:x*x*(3-2*x);
let cam,fw,rt,up,F=1150;
function proj(p){const d=[p[0]-cam[0],p[1]-cam[1],p[2]-cam[2]];const z=d[0]*fw[0]+d[1]*fw[1]+d[2]*fw[2];
 const x=d[0]*rt[0]+d[1]*rt[1]+d[2]*rt[2],y=d[0]*up[0]+d[1]*up[1]+d[2]*up[2];return[640+x*F/z,360-y*F/z,z];}
const L=(()=>{const v=[.5,.6,.65],l=Math.hypot(...v);return v.map(a=>a/l)})();
const btn={x:1110,y:30,w:140,h:44};
const t0=performance.now();
function frame(now){
 const t=(T0+(now-t0)/1000)%DUR;
 const e=t<8.3?0:t<11?sm((t-8.3)/2.7):t<30.3?1:t<31.6?1-sm((t-30.3)/1.3):0;
 const yaw=.6+t*.16,pit=.12+.08*Math.sin(t*.3);
 const tgt=[0,56+e*40,0],dist=235+e*125-(t>34?sm((t-34)/4)*40:0);
 cam=[tgt[0]+dist*Math.cos(pit)*Math.sin(yaw),tgt[1]+dist*Math.sin(pit),tgt[2]+dist*Math.cos(pit)*Math.cos(yaw)];
 fw=[tgt[0]-cam[0],tgt[1]-cam[1],tgt[2]-cam[2]];let l=Math.hypot(...fw);fw=fw.map(a=>a/l);
 rt=[fw[2],0,-fw[0]];l=Math.hypot(...rt);rt=rt.map(a=>-a/l);
 up=[rt[1]*fw[2]-rt[2]*fw[1],rt[2]*fw[0]-rt[0]*fw[2],rt[0]*fw[1]-rt[1]*fw[0]];
 if(up[1]<0){rt=rt.map(a=>-a);up=up.map(a=>-a);}
 // hover schedule
 const pressing=(t>6.6&&t<8.6)||(t>28.6&&t<30.6);
 const hov=pressing?-1:Math.floor(t/1.7)%P.length;
 // sky
 const g=X.createLinearGradient(0,0,0,720);g.addColorStop(0,'#02040c');g.addColorStop(.6,'#0b1430');g.addColorStop(1,'#1a1a22');
 X.fillStyle=g;X.fillRect(0,0,1280,720);
 for(const s of ST){X.fillStyle=`rgba(255,255,255,${.3+.5*s[2]*(.6+.4*Math.sin(t*2+s[0]))})`;X.fillRect(s[0],s[1],1.4,1.4);}
 // ground grid
 X.strokeStyle='rgba(120,140,170,.18)';X.lineWidth=1;
 for(let k=-120;k<=120;k+=12){line([k,-3,-120],[k,-3,120]);line([-120,-3,k],[120,-3,k]);}
 X.fillStyle='rgba(90,90,95,.6)';poly([[-16,-3,-16],[16,-3,-16],[16,-3,16],[-16,-3,16]]);
 // tower
 X.strokeStyle='rgba(170,70,50,.75)';X.lineWidth=1.2;const tx=16,tw=6;
 const cs=[[tx,-tw/2],[tx+tw,-tw/2],[tx+tw,tw/2],[tx,tw/2]];
 for(const c of cs)line([c[0],-3,c[1]],[c[0],120,c[1]]);
 for(let y=-3;y<120;y+=6)for(let k=0;k<4;k++){const a=cs[k],b=cs[(k+1)%4];line([a[0],y,a[1]],[b[0],y,b[1]]);line([a[0],y,a[1]],[b[0],y+6,b[1]]);}
 for(const y of[20,60,86,104])line([tx,y,0],[5,y,0]);
 // smoke
 const fdy=P[0].dy*e;
 for(let k=0;k<90;k++){const ph=(t*.35+k/90)%1,a=k*2.399,side=k%2?1:-1;
  const p=proj([side*(6+ph*70)+Math.cos(a)*ph*20,-2+ph*16+Math.sin(a*3)*2,Math.sin(a)*ph*35]);if(p[2]<1)continue;
  const r=(5+ph*26)*F/p[2];const gr=X.createRadialGradient(p[0],p[1],0,p[0],p[1],r);
  gr.addColorStop(0,`rgba(185,180,175,${.22*(1-ph)})`);gr.addColorStop(1,'rgba(150,150,150,0)');X.fillStyle=gr;X.fillRect(p[0]-r,p[1]-r,2*r,2*r);}
 // mesh
 const D=[];
 for(const q of Q){const p=P[q.pi],dy=p.dy*e;const w=q.pts.map(v=>[v[0],v[1]+dy,v[2]]);
  const m=[(w[0][0]+w[2][0])/2,(w[0][1]+w[2][1])/2,(w[0][2]+w[2][2])/2];
  const vd=(cam[0]-m[0])*q.n[0]+(cam[1]-m[1])*q.n[1]+(cam[2]-m[2])*q.n[2];
  if(vd<0&&!p.hull)continue;
  const s=w.map(proj);if(s[0][2]<1)continue;
  D.push({s,q,p,front:vd>=0,z:(s[0][2]+s[2][2])/2});}
 D.sort((a,b)=>b.z-a.z);
 for(const d of D){const q=d.q,h=d.q.pi===hov;let li=.3+.7*Math.max(0,q.n[0]*L[0]+q.n[1]*L[1]+q.n[2]*L[2]);
  let c=q.c,al=1;if(d.p.hull){if(d.front){al=h?.32:.16}else li*=.55;}
  let r=c[0]*li,gg=c[1]*li,b=c[2]*li;if(h){const k=.4+.15*Math.sin(t*8);r+=(255-r)*k;gg+=(210-gg)*k;b+=(80-b)*k;}
  X.fillStyle=`rgba(${r|0},${gg|0},${b|0},${al})`;X.beginPath();for(const v of d.s)X.lineTo(v[0],v[1]);X.closePath();X.fill();
  if(al<1||h){X.strokeStyle=h?'rgba(255,220,120,.35)':'rgba(255,255,255,.07)';X.stroke();}}
 // flames
 X.globalCompositeOperation='lighter';
 for(const[x,z]of f1){const p=proj([x,fdy,z]);if(p[2]<1)continue;const r=4*F/p[2]*(1+.08*Math.sin(t*40+x));
  const gr=X.createRadialGradient(p[0],p[1],0,p[0],p[1],r);gr.addColorStop(0,'rgba(255,250,220,.9)');gr.addColorStop(.4,'rgba(255,170,60,.5)');gr.addColorStop(1,'rgba(255,80,0,0)');X.fillStyle=gr;X.fillRect(p[0]-r,p[1]-r,2*r,2*r);}
 for(let k=0;k<200;k++){const ph=(t*2.2+k*.618)%1,en=f1[k%5],j=Math.sin(k*12.9)*ph*2.5,jj=Math.cos(k*7.3)*ph*2.5;
  const p=proj([en[0]+j,fdy-ph*16,en[1]+jj]);if(p[2]<1)continue;const r=(1.6+ph*2.2)*F/p[2];
  const gr=X.createRadialGradient(p[0],p[1],0,p[0],p[1],r);const a=.5*(1-ph);
  gr.addColorStop(0,`rgba(255,${(240-ph*150)|0},${(160-ph*150)|0},${a})`);gr.addColorStop(1,'rgba(255,60,0,0)');X.fillStyle=gr;X.fillRect(p[0]-r,p[1]-r,2*r,2*r);}
 X.globalCompositeOperation='source-over';
 // labels
 X.font='600 14px Helvetica,Arial,sans-serif';X.textBaseline='middle';
 const rc=proj([0,tgt[1],0])[0];
 if(e>.05){const lb=P.map((p,k)=>{const s=proj([0,p.cy+p.dy*e,0]);return{k,p,s}}).sort((a,b)=>a.s[1]-b.s[1]);
  const last=[-99,-99];lb.forEach((o,j)=>{const sd=j%2;let y=Math.max(o.s[1],last[sd]+26);y=Math.min(y,700);last[sd]=y;
   const lx=sd?rc+150:rc-150;X.globalAlpha=e;X.strokeStyle=o.k===hov?'#ffd070':'rgba(200,220,255,.6)';X.beginPath();X.moveTo(o.s[0],o.s[1]);X.lineTo(lx,y);X.stroke();
   X.fillStyle='rgba(8,14,30,.75)';const w=X.measureText(o.p.name).width+14;const bx=sd?lx:lx-w;X.fillRect(bx,y-11,w,22);
   X.fillStyle=o.k===hov?'#ffd070':'#e8eefc';X.textAlign='left';X.fillText(o.p.name,bx+7,y);X.globalAlpha=1;});}
 // title
 X.textAlign='left';X.fillStyle='#fff';X.font='700 26px Helvetica,Arial,sans-serif';X.fillText('SATURN V',28,38);
 X.font='14px Helvetica,Arial,sans-serif';X.fillStyle='#9fb0d0';X.fillText('Cutaway on Launch Complex 39A  ·  drag to orbit  ·  scroll to zoom',28,64);
 // button
 const pr=pressing&&((t>8&&t<8.25)||(t>30&&t<30.25));
 X.fillStyle=pr?'#ffb040':e>.5?'#3a2a10':'#10203c';X.strokeStyle='#ffb040';X.lineWidth=2;
 X.beginPath();X.roundRect(btn.x,btn.y,btn.w,btn.h,8);X.fill();X.stroke();
 X.fillStyle=pr?'#000':'#ffd890';X.font='700 17px Helvetica,Arial,sans-serif';X.textAlign='center';
 X.fillText(e>.5?'Assemble':'Explode',btn.x+btn.w/2,btn.y+btn.h/2);
 // info panel
 if(hov>=0){const p=P[hov];X.fillStyle='rgba(8,14,30,.82)';X.fillRect(340,640,600,58);X.strokeStyle='#ffb040';X.strokeRect(340,640,600,58);
  X.fillStyle='#ffd070';X.font='700 17px Helvetica,Arial,sans-serif';X.fillText(p.name,640,658);
  X.fillStyle='#e0e6f4';X.font='14px Helvetica,Arial,sans-serif';X.fillText(p.desc,640,682);}
 // cursor
 let cx,cy;if(pressing){const k=sm(((t>20?t-28.6:t-6.6))/1.2);const s=proj([0,P[14].cy,0]);cx=s[0]+(btn.x+70-s[0])*k;cy=s[1]+(btn.y+26-s[1])*k;}
 else{const p=P[hov],s=proj([0,p.cy+p.dy*e,0]);const pp=P[(hov+P.length-1)%P.length],s2=proj([0,pp.cy+pp.dy*e,0]);const k=sm((t%1.7)/.5);cx=s2[0]+(s[0]-s2[0])*k+8;cy=s2[1]+(s[1]-s2[1])*k;}
 X.fillStyle='#fff';X.strokeStyle='#000';X.lineWidth=1.5;X.beginPath();X.moveTo(cx,cy);X.lineTo(cx,cy+20);X.lineTo(cx+5,cy+15);X.lineTo(cx+13,cy+15);X.closePath();X.fill();X.stroke();
 requestAnimationFrame(frame);
}
function line(a,b){const p=proj(a),q=proj(b);if(p[2]<1||q[2]<1)return;X.beginPath();X.moveTo(p[0],p[1]);X.lineTo(q[0],q[1]);X.stroke();}
function poly(v){const s=v.map(proj);if(s.some(p=>p[2]<1))return;X.beginPath();for(const p of s)X.lineTo(p[0],p[1]);X.fill();}
requestAnimationFrame(frame);
</script></body></html>
