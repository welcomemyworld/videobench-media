<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Produto</title>
<style>html,body{margin:0;background:#000;height:100%;overflow:hidden}
#c{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#000}</style></head>
<body><canvas id="c" width="1280" height="720"></canvas>
<script>
window.DUR=24;
const c=document.getElementById('c'),x=c.getContext('2d');
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);c.style.width=1280*s+'px';c.style.height=720*s+'px';}
addEventListener('resize',fit);fit();
const q=new URLSearchParams(location.search),off=parseFloat(q.get('t')||0)||0,t0=performance.now();
const E=v=>v<0?0:v>1?1:1-Math.pow(1-v,3);
const P=[];for(let i=0;i<140;i++)P.push({x:Math.random()*1280,y:Math.random()*720,z:Math.random()*2+.3,p:Math.random()*6});
const scenes=[
 [0,5,'O futuro começa','agora.'],
 [5,10,'Simples.','Poderoso. Elegante.'],
 [10,15,'Feito para quem','não para de evoluir.'],
 [15,20,'Rápido. Seguro.','Inteligente.'],
 [20,24,'Conheça o produto','t.co/Lv7w1nzKzq']];
function txt(s,X,Y,size,a,col,w){x.globalAlpha=a;x.font=(w||'700')+' '+size+'px Helvetica,Arial,sans-serif';x.fillStyle=col;x.textAlign='center';x.fillText(s,X,Y);x.globalAlpha=1;}
function frame(){
 const t=((performance.now()-t0)/1000+off)%DUR;
 const g=x.createRadialGradient(640,360,50,640,360,800);
 const h=(220+t*6)%360;
 g.addColorStop(0,`hsl(${h},60%,14%)`);g.addColorStop(1,'#03030a');
 x.fillStyle=g;x.fillRect(0,0,1280,720);
 // particles
 for(const p of P){const yy=(p.y-t*20*p.z+720*5)%720;x.globalAlpha=.25+.25*Math.sin(t*2+p.p);x.fillStyle='#9cf';x.beginPath();x.arc(p.x,yy,p.z,0,7);x.fill();}
 x.globalAlpha=1;
 // rotating rings
 x.save();x.translate(640,360);
 for(let i=0;i<4;i++){x.rotate(t*.2*(i%2?1:-1));x.strokeStyle=`hsla(${h+i*30},90%,65%,${.18+i*.05})`;x.lineWidth=2;x.beginPath();x.ellipse(0,0,220+i*45,80+i*20,i,0,Math.PI*1.6);x.stroke();}
 x.restore();
 for(const s of scenes){if(t<s[0]||t>=s[1])continue;
  const l=t-s[0],d=s[1]-s[0],a=E(l/0.8)*(1-E((l-(d-0.7))/0.7));
  const sl=(1-E(l/1))*40;
  txt(s[2],640,330+sl,64,a,'#fff');
  const gr=x.createLinearGradient(400,0,880,0);gr.addColorStop(0,`hsl(${h},100%,70%)`);gr.addColorStop(1,`hsl(${h+80},100%,70%)`);
  txt(s[3],640,410+sl*1.5,s===scenes[4]?42:56,a*E((l-.3)/.8),gr,'300');
  x.globalAlpha=a;x.fillStyle=gr;x.fillRect(640-160*E((l-.5)/1),450,320*E((l-.5)/1),3);x.globalAlpha=1;}
 // flash between scenes
 for(const s of scenes){const k=Math.abs(t-s[0]);if(k<.15&&s[0]>0){x.fillStyle=`rgba(255,255,255,${.25*(1-k/.15)})`;x.fillRect(0,0,1280,720);}}
 // progress
 x.fillStyle='rgba(255,255,255,.15)';x.fillRect(0,716,1280,4);x.fillStyle=`hsl(${h},90%,65%)`;x.fillRect(0,716,1280*t/DUR,4);
 requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script></body></html>
