<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>AllInvestView</title>
<style>html,body{margin:0;background:#000;height:100%;overflow:hidden}
#s{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:0 0}</style></head>
<body><canvas id="s" width="1280" height="720"></canvas>
<script>
window.DUR=30;
const c=document.getElementById('s'),x=c.getContext('2d');
function fit(){const k=Math.min(innerWidth/1280,innerHeight/720);c.style.transform=`scale(${k}) translate(-50%,-50%)`;c.style.left='50%';c.style.top='50%';c.style.transformOrigin='0 0';c.style.translate=`${-640*k}px ${-360*k}px`;c.style.transform=`scale(${k})`;}
addEventListener('resize',fit);fit();
const q=new URLSearchParams(location.search),T0=parseFloat(q.get('t')||0);let st=null;
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),E=t=>1-Math.pow(1-cl(t),3),EI=t=>{t=cl(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
let S=7;const R=()=>(S=(S*16807)%2147483647)/2147483647;
const pts=[];for(let i=0;i<120;i++)pts.push([R()*1280,R()*720,R()*2+.5,R()]);
const series=[];for(let k=0;k<4;k++){let v=50,a=[];for(let i=0;i<120;i++){v+=(R()-.42)*4;a.push(v)}series.push(a)}
const C1='#3cf0c8',C2='#4d8bff',C3='#b56cff',C4='#ffb84d';
function txt(s,X,Y,sz,col,al,w='700',a='center'){x.globalAlpha=cl(al);x.fillStyle=col;x.font=`${w} ${sz}px Helvetica,Arial,sans-serif`;x.textAlign=a;x.textBaseline='middle';x.fillText(s,X,Y);x.globalAlpha=1}
function bg(t){const g=x.createRadialGradient(640+Math.sin(t*.3)*200,360,50,640,360,900);g.addColorStop(0,'#0c1a33');g.addColorStop(1,'#02040a');x.fillStyle=g;x.fillRect(0,0,1280,720);
x.strokeStyle='rgba(77,139,255,0.07)';x.lineWidth=1;const o=(t*30)%60;for(let i=-60;i<1340;i+=60){x.beginPath();x.moveTo(i+o,0);x.lineTo(i+o,720);x.stroke()}for(let j=0;j<720;j+=60){x.beginPath();x.moveTo(0,j);x.lineTo(1280,j);x.stroke()}
for(const p of pts){const y=(p[1]-t*20*p[2])%720;x.fillStyle=`rgba(60,240,200,${.2+.3*Math.sin(t*2+p[3]*9)})`;x.fillRect(p[0],(y+720)%720,p[2],p[2])}}
function logo(cx,cy,s,a,t){x.save();x.translate(cx,cy);x.scale(s,s);x.globalAlpha=cl(a);x.lineWidth=6;x.lineCap='round';
const g=x.createLinearGradient(-60,0,60,0);g.addColorStop(0,C1);g.addColorStop(1,C3);x.strokeStyle=g;x.shadowColor=C1;x.shadowBlur=25;
x.beginPath();x.arc(0,0,60,0,Math.PI*2*cl(a*1.2));x.stroke();
x.beginPath();x.moveTo(-35,20);x.lineTo(-12,-5);x.lineTo(8,10);x.lineTo(35,-25);x.stroke();x.restore()}
function line(a,X,Y,W,H,col,p,fill){const n=Math.floor(a.length*cl(p));if(n<2)return;let mn=Math.min(...a),mx=Math.max(...a);x.beginPath();for(let i=0;i<n;i++){const px=X+i/(a.length-1)*W,py=Y+H-(a[i]-mn)/(mx-mn)*H;i?x.lineTo(px,py):x.moveTo(px,py)}
x.strokeStyle=col;x.lineWidth=3;x.shadowColor=col;x.shadowBlur=12;x.stroke();x.shadowBlur=0;
if(fill){const lx=X+(n-1)/(a.length-1)*W;x.lineTo(lx,Y+H);x.lineTo(X,Y+H);const g=x.createLinearGradient(0,Y,0,Y+H);g.addColorStop(0,col+'55');g.addColorStop(1,col+'00');x.fillStyle=g;x.fill()}}
function card(X,Y,W,H,a){x.globalAlpha=cl(a);x.fillStyle='rgba(16,28,52,0.75)';x.strokeStyle='rgba(120,170,255,0.25)';x.lineWidth=1.5;x.beginPath();x.roundRect(X,Y,W,H,16);x.fill();x.stroke();x.globalAlpha=1}
function flash(t,at){const d=Math.abs(t-at);if(d<.25){x.fillStyle=`rgba(255,255,255,${(.25-d)*1.6})`;x.fillRect(0,0,1280,720)}}
function scene1(t){// 0-5 intro
const a=E(t/1.2),o=1-cl((t-4.4)/.6);logo(640,290,.8+.3*a,a*o,t);
const w='AllInvestView';for(let i=0;i<w.length;i++){const p=E((t-.8-i*.06)/.5);txt(w[i],640-w.length*17+i*34+17,420+(1-p)*30,56,i<3?C1:i<9?'#fff':C2,p*o,'800')}
txt('YOUR ENTIRE PORTFOLIO. ONE VIEW.',640,485,20,'#9fb4d8',E((t-2)/.8)*o,'600');}
function scene2(t){// 5-11 aggregation
txt('Every asset. Connected.',640,80,44,'#fff',E(t/.6),'800');
const items=[['Stocks',C1],['ETFs',C2],['Crypto',C4],['Bonds',C3],['Real Estate','#ff6b8b'],['Funds','#6bffb0'],['Cash','#9fe0ff'],['Brokers','#ffd36b']];
const cx=640,cy=400;logo(cx,cy,.9,1,t);
items.forEach((it,i)=>{const ang=i/items.length*Math.PI*2+t*.25,p=E((t-.3-i*.15)/.7),r=230*p+(1-p)*600;const X=cx+Math.cos(ang)*r*1.3,Y=cy+Math.sin(ang)*r*.8;
x.strokeStyle=it[1]+'66';x.lineWidth=2;x.setLineDash([6,8]);x.lineDashOffset=-t*40;x.beginPath();x.moveTo(cx,cy);x.lineTo(X,Y);x.stroke();x.setLineDash([]);
const k=(t*.8+i*.13)%1;x.fillStyle=it[1];x.beginPath();x.arc(X+(cx-X)*k,Y+(cy-Y)*k,4,0,7);x.fill();
card(X-75,Y-24,150,48,p);txt(it[0],X,Y,20,it[1],p,'700')});
const o=cl((t-5.5)/.5);x.fillStyle=`rgba(0,0,0,${o})`;x.fillRect(0,0,1280,720)}
function scene3(t){// 11-18 dashboard
const a=E(t/.8);txt('Real-time Dashboard',640,60,40,'#fff',a,'800');
card(60,110,760,360,a);txt('Total Net Worth',90,145,18,'#9fb4d8',a,'600','left');
const val=Math.floor(1284530*EI(t/3));txt('€ '+val.toLocaleString('en-US'),90,190,46,'#fff',a,'800','left');
txt('▲ +23.8%',780,190,24,C1,E((t-2.5)/.5),'800','right');
line(series[0],90,240,700,200,C1,t/3,1);
const vs=[['Dividends','€ 18,240',C4],['Annual Return','+14.2%',C1],['Risk Score','Low',C2]];
vs.forEach((v,i)=>{const p=E((t-.6-i*.25)/.6),Y=110+i*125+(1-p)*40;card(850,Y,370,105,p);txt(v[0],875,Y+32,18,'#9fb4d8',p,'600','left');txt(v[1],875,Y+70,34,v[2],p,'800','left')});
// donut
const p=E((t-1.5)/1.5),al=[.42,.25,.18,.15],cs=[C1,C2,C3,C4],nm=['Stocks','ETFs','Crypto','Bonds'];card(60,490,1160,200,E((t-1)/.6));
let s=-Math.PI/2;al.forEach((v,i)=>{x.strokeStyle=cs[i];x.lineWidth=26;x.beginPath();x.arc(190,590,65,s,s+v*Math.PI*2*p);x.stroke();s+=v*Math.PI*2*p;
const lp=E((t-2-i*.15)/.5);x.globalAlpha=lp;x.fillStyle=cs[i];x.fillRect(320,530+i*32,14,14);x.globalAlpha=1;txt(nm[i]+'  '+Math.round(v*100)+'%',345,537+i*32,18,'#dfe8ff',lp,'600','left')});
for(let i=0;i<14;i++){const h=(40+60*Math.abs(Math.sin(i*1.7+1)))*E((t-2.2-i*.05)/.5);x.fillStyle=i%3?C2:C3;x.fillRect(620+i*40,660-h,24,h)}
txt('Monthly performance',620,520,16,'#9fb4d8',E((t-2)/.5),'600','left');}
function scene4(t){// 18-24 features
txt('Built for serious investors',640,80,42,'#fff',E(t/.6),'800');
const f=[['Performance Analytics','TTWROR, IRR & benchmarks',C1],['Dividend Tracking','Forecasts & calendar',C4],['Tax Reports','Ready in one click',C3],['Multi-Portfolio','Family & accounts',C2],['Automatic Import','Hundreds of brokers','#ff6b8b'],['Bank-grade Security','Encrypted & private','#6bffb0']];
f.forEach((v,i)=>{const col=i%3,row=Math.floor(i/3),p=E((t-.4-i*.2)/.6),X=110+col*360,Y=160+row*250+(1-p)*60;
card(X,Y,340,210,p);x.globalAlpha=p;x.strokeStyle=v[2];x.lineWidth=4;x.shadowColor=v[2];x.shadowBlur=15;x.beginPath();x.arc(X+60,Y+65,26,0,Math.PI*2*p);x.stroke();
x.beginPath();x.arc(X+60,Y+65,8+3*Math.sin(t*4+i),0,7);x.fillStyle=v[2];x.fill();x.shadowBlur=0;x.globalAlpha=1;
txt(v[0],X+30,Y+130,24,'#fff',p,'800','left');txt(v[1],X+30,Y+165,17,'#9fb4d8',p,'500','left')});}
function scene5(t){// 24-30 outro
const z=EI(t/1);series.forEach((s,i)=>line(s,0,150+i*80,1280,200,[C1,C2,C3,C4][i]+'',t/1.5,0));
x.fillStyle=`rgba(2,4,10,${.6*z})`;x.fillRect(0,0,1280,720);
const a=E((t-.8)/.8);logo(640,230,1,a,t);txt('AllInvestView',640,370,78,'#fff',a,'800');
txt('See everything. Decide better.',640,440,28,C1,E((t-1.6)/.7),'600');
const b=E((t-2.4)/.6);x.globalAlpha=b;const g=x.createLinearGradient(500,0,780,0);g.addColorStop(0,C1);g.addColorStop(1,C2);x.fillStyle=g;x.shadowColor=C1;x.shadowBlur=30*(.6+.4*Math.sin(t*4));
x.beginPath();x.roundRect(490,505,300,64,32);x.fill();x.shadowBlur=0;x.globalAlpha=1;txt('Start free today',640,537,24,'#02121a',b,'800');
txt('allinvestview.com',640,620,20,'#9fb4d8',E((t-3)/.6),'600');
x.fillStyle=`rgba(0,0,0,${cl((t-5.4)/.6)})`;x.fillRect(0,0,1280,720)}
function frame(now){if(st===null)st=now;const t=((now-st)/1000+T0)%DUR;
bg(t);x.save();
if(t<5)scene1(t);else if(t<11)scene2(t-5);else if(t<18)scene3(t-11);else if(t<24)scene4(t-18);else scene5(t-24);
x.restore();[5,11,18,24].forEach(a=>flash(t,a));
const v=x.createRadialGradient(640,360,300,640,360,800);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.6)');x.fillStyle=v;x.fillRect(0,0,1280,720);
x.fillStyle=C1;x.fillRect(0,716,1280*t/DUR,4);
requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script></body></html>
