<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Company Demo</title>
<style>html,body{margin:0;background:#000;height:100%;overflow:hidden}
#s{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:0 0}</style></head>
<body><canvas id="s" width="1280" height="720"></canvas>
<script>
window.DUR=30;
const C=document.getElementById('s'),X=C.getContext('2d'),W=1280,H=720;
function fit(){const k=Math.min(innerWidth/W,innerHeight/H);C.style.transform=`translate(${-W*k/2}px,${-H*k/2}px) scale(${k})`;}
addEventListener('resize',fit);fit();
const q=new URLSearchParams(location.search),T0=parseFloat(q.get('t')||0)||0,st=performance.now();
const NAME="(company name)";
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const seg=(t,a,b)=>ease(cl((t-a)/(b-a)));
let R=1;const rnd=()=>(R=(R*16807)%2147483647)/2147483647;
const P=[];for(let i=0;i<400;i++)P.push({x:rnd()*2-1,y:rnd()*2-1,z:rnd(),s:rnd()});
const N=[];for(let i=0;i<60;i++){const a=rnd()*6.283,b=Math.acos(rnd()*2-1);N.push([Math.sin(b)*Math.cos(a),Math.cos(b),Math.sin(b)*Math.sin(a)]);}
function txt(s,x,y,sz,a,col='#fff',w='600',sp=0){X.save();X.globalAlpha=cl(a);X.fillStyle=col;X.font=`${w} ${sz}px Helvetica,Arial,sans-serif`;X.textAlign='center';X.textBaseline='middle';if(X.letterSpacing!==undefined)X.letterSpacing=sp+'px';X.fillText(s,x,y);X.restore();}
function bg(t){const g=X.createRadialGradient(W/2,H/2,50,W/2,H/2,900);const h=(220+t*4)%360;
g.addColorStop(0,`hsl(${h},60%,12%)`);g.addColorStop(1,'#000');X.fillStyle=g;X.fillRect(0,0,W,H);
for(const p of P){let z=(p.z-t*0.06)%1;if(z<0)z+=1;const x=W/2+p.x*W/(z*1.5+.1)*.3,y=H/2+p.y*H/(z*1.5+.1)*.3;
const a=(1-z)*.8;X.fillStyle=`hsla(${h+p.s*60},90%,75%,${a})`;X.fillRect(x,y,(1-z)*2.5,(1-z)*2.5);}}
function globe(t,cx,cy,r,a){const ry=t*.5;const pts=N.map(([x,y,z])=>{const X2=x*Math.cos(ry)-z*Math.sin(ry),Z=x*Math.sin(ry)+z*Math.cos(ry);return[cx+X2*r,cy+y*r,Z];});
X.save();X.globalAlpha=a;X.lineWidth=1;
for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){const d=Math.hypot(pts[i][0]-pts[j][0],pts[i][1]-pts[j][1]);if(d<r*.45){X.strokeStyle=`rgba(120,200,255,${(1-d/(r*.45))*.5*((pts[i][2]+1.5)/2.5)})`;X.beginPath();X.moveTo(pts[i][0],pts[i][1]);X.lineTo(pts[j][0],pts[j][1]);X.stroke();}}
for(const p of pts){X.fillStyle=`rgba(180,230,255,${(p[2]+1.3)/2.3})`;X.beginPath();X.arc(p[0],p[1],2+p[2]*1.5,0,7);X.fill();}
const g=X.createRadialGradient(cx,cy,0,cx,cy,r*1.4);g.addColorStop(0,'rgba(80,160,255,.25)');g.addColorStop(1,'rgba(0,0,0,0)');X.fillStyle=g;X.fillRect(cx-r*1.5,cy-r*1.5,r*3,r*3);X.restore();}
function scene(t){
bg(t);
// 0-6 intro logo
if(t<7){const a=seg(t,0.3,1.8)*(1-seg(t,5.8,6.8));
const r=80+40*seg(t,0,2);X.save();X.translate(W/2,H/2-60);X.rotate(t*.6);X.globalAlpha=a;
for(let i=0;i<6;i++){X.rotate(Math.PI/3);X.strokeStyle=`hsl(${190+i*20},90%,65%)`;X.lineWidth=4;X.beginPath();X.arc(r*.5,0,r*.5,0,Math.PI*1.3*seg(t,.3+i*.15,2+i*.15));X.stroke();}
X.restore();
txt(NAME,W/2,H/2+110,64,a*seg(t,1.5,2.8),'#fff','700',4);
txt("THE FUTURE STARTS HERE",W/2,H/2+170,20,a*seg(t,2.5,3.5),'#8cf','400',8);}
// 7-14 features
if(t>=6.5&&t<15){const a=seg(t,6.5,7.5)*(1-seg(t,14,15));
txt("Built for what's next",W/2,110,46,a,'#fff','700');
const F=[["⚡","Fast","Speed at every scale"],["◆","Secure","Trust by design"],["∞","Scalable","Grows with you"]];
F.forEach((f,i)=>{const k=seg(t,7.6+i*.5,8.6+i*.5)*a;const x=W/2+(i-1)*360,y=H/2+40+(1-k)*60;
X.save();X.globalAlpha=k;X.fillStyle='rgba(255,255,255,.06)';X.strokeStyle=`hsla(${200+i*40},90%,65%,.8)`;X.lineWidth=2;
X.beginPath();X.roundRect(x-150,y-130,300,260,20);X.fill();X.stroke();
X.beginPath();X.arc(x,y-50,40+Math.sin(t*3+i)*3,0,7);X.fillStyle=`hsla(${200+i*40},90%,60%,.25)`;X.fill();X.restore();
txt(f[0],x,y-50,40,k,`hsl(${200+i*40},90%,75%)`);txt(f[1],x,y+30,32,k,'#fff','700');txt(f[2],x,y+75,18,k,'#aac','400');});}
// 15-22 globe + stats
if(t>=14.5&&t<23){const a=seg(t,14.5,15.5)*(1-seg(t,22,23));
globe(t,400,H/2,210,a);
txt("Connecting the world",900,170,40,a,'#fff','700');
const S=[["Customers",1e6,"+"],["Countries",120,""],["Uptime",99.99,"%"]];
S.forEach((s,i)=>{const k=seg(t,15.5+i*.4,18+i*.4);const v=s[1]*k;
const str=s[1]<100?v.toFixed(2):Math.round(v).toLocaleString('en-US');
txt(str+s[2],900,280+i*120,54,a*cl(k*3),`hsl(${190+i*30},90%,70%)`,'800');
txt(s[0].toUpperCase(),900,320+i*120,16,a*cl(k*3),'#9ab','400',5);});}
// 23-30 outro
if(t>=22.5){const a=seg(t,22.5,24)*(1-seg(t,29.3,30));const k=seg(t,22.5,25);
X.save();X.globalAlpha=a;for(let i=0;i<3;i++){X.strokeStyle=`hsla(${200+i*30},90%,65%,${.5-i*.12})`;X.lineWidth=2;X.beginPath();X.arc(W/2,H/2,(120+i*60)*k+Math.sin(t*2+i)*6,0,7);X.stroke();}X.restore();
txt(NAME,W/2,H/2-20,72,a,'#fff','800',3);
txt("Let's build the future together.",W/2,H/2+50,24,a*seg(t,24.5,25.5),'#bdf','400',2);}
// letterbox + flash
X.fillStyle='#000';X.fillRect(0,0,W,40);X.fillRect(0,H-40,W,40);
for(const c of[6.8,14.8,22.8]){const f=1-Math.abs(t-c)/.3;if(f>0){X.fillStyle=`rgba(255,255,255,${f*.25})`;X.fillRect(0,0,W,H);}}
}
function loop(){const t=((performance.now()-st)/1000+T0)%DUR;scene(t);requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script></body></html>
