const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],mul=(a,s)=>[a[0]*s,a[1]*s,a[2]*s],

});
{const ms=[cyl([0,0,0],[1,0,0],.26,5.4,12)];CYL.forEach(c=>{const pd=[0,Math.cos(c.pin),Math.sin(c.pin)];

function hit(it,m){if(it.seg){const[a,b]=it.seg,dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy||1,u=Math.max(0,Math.min(1,((m[0]-a[0])*dx+(m[1]-a[1])*dy)/l));return Math.hypot(a[0]+u*dx-m[0],a[1]+u*dy-m[1])<it.w/2+2}
 let ins=false;const p=it.pts;for(let i=0,j=p.length-1;i<p.length;j=i++)if((p[i][1]>m[1])!=(p[j][1]>m[1])&&m[0]<(p[j][0]-p[i][0])*(m[1]-p[i][1])/(p[j][1]-p[i][1])+p[i][0])ins=!ins;return ins}
requestAnimationFrame(frame);
