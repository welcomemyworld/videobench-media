<!DOCTYPE html><html><head><meta charset="utf-8"><title>Debris Flow Riverbed Change Model</title>
<style>html,body{margin:0;background:#000;height:100%;overflow:hidden}canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}</style></head><body><canvas id="c" width="1280" height="720"></canvas><script>
window.DUR=32;
const cv=document.getElementById('c'),X=cv.getContext('2d');
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);cv.style.width=1280*s+'px';cv.style.height=720*s+'px';}
fit();addEventListener('resize',fit);
const q=new URLSearchParams(location.search),T0=parseFloat(q.get('t')||0)||0,st=performance.now();
const N=110,M=80,CS=5.6,ZK=2.6,OX=560,OY=70;
const jc=i=>M/2+7*Math.sin(i*0.07)+3*Math.sin(i*0.15);
const nz=(i,j)=>Math.sin(i*.9+j*.3)*.5+Math.sin(j*1.3-i*.4)*.4+Math.sin(i*.23+j*.17)*1.2+Math.sin(i*2.1+j*1.7)*.25;
const Z=new Float32Array(N*M),B=[],G=new Float32Array(N),W=new Float32Array(N),DJ=new Float32Array(N*M);
for(let i=0;i<N;i++){
 G[i]=i<55?(0.05+0.25*Math.exp(-((i-33)/4)**2)):Math.min(1,0.4+(i-55)*0.06)*Math.exp(-Math.max(0,i-85)/12);
 W[i]=i<55?2.4:2.4+(i-55)*0.42;
 for(let j=0;j<M;j++){
  const k=i*M+j,dj=j-jc(i);DJ[k]=dj;
  let z=i<55?96-1.3*i:24.5-0.28*(i-55);
  if(i<75)z+=(1-i/75)*Math.min(dj*dj*0.04,45);
  z+=Math.min(Math.abs(dj)*0.08,3);
  z-=(i<55?6:2.2)*Math.exp(-(dj/2.6)**2);
  z+=nz(i,j)*(i<55?1.6:0.4);Z[k]=z;
  let r,g,b,n=nz(i*1.7,j*1.3);
  if(Math.abs(dj)<1.8){r=150+n*10;g=140+n*8;b=120;}
  else if(i<58||Math.abs(dj)>30){r=40+n*8;g=72+n*14;b=38;}
  else{const f=(Math.floor((i-58)/6)+Math.floor((j+300)/7))%3;
   if(f==0){r=120;g=135;b=60}else if(f==1){r=150;g=140;b=85}else{r=85;g=115;b=50}
   const hx=(i*7+j*13)%23;if(hx<2&&Math.abs(dj)>4&&Math.abs(dj)<22){r=200;g=110;b=90}
   r+=n*6;g+=n*6;}
  B.push([r,g,b]);}}
const sm=(a,b,x)=>{x=Math.max(0,Math.min(1,(x-a)/(b-a)));return x*x*(3-2*x)};
function ramp(v){v=Math.min(1,v);const s=[[255,240,90],[255,150,30],[220,40,20],[120,0,40]];
 const p=v*3,a=Math.min(2,Math.floor(p)),f=p-a;return s[a].map((c,n)=>c+(s[a+1][n]-c)*f);}
const P=(i,j,z)=>[OX+(i-j)*CS,OY+(i+j)*CS*0.5-z*ZK+180];
const D=new Float32Array(N*M),F=new Float32Array(N*M);
function frame(){
 const t=((performance.now()-st)/1000+T0)%DUR;
 const tf=Math.max(0,t-3),sf=tf<20?N*1.15*(1-Math.pow(1-tf/20,1.6)):N*1.15;
 let vol=0,mx=0,mxk=0,fl=0;
 for(let i=0;i<N;i++){const pas=sm(0,14,sf-i),ta=Math.max(0,sf-i);
  for(let j=0;j<M;j++){const k=i*M+j,dj=DJ[k];
   const d=8*G[i]*Math.exp(-((dj)/W[i])**2)*pas*(0.9+0.1*nz(j,i));D[k]=Math.max(0,d);
   vol+=D[k];if(D[k]>mx){mx=D[k];mxk=k}
   const fw=W[i]*1.7+1.5,lat=Math.exp(-((dj)/fw)**4);
   const f=(sf>i?lat*Math.exp(-ta/(i<55?10:30))*sm(0,3,ta):0)*(t>27?Math.max(0,1-(t-27)/3):1);
   F[k]=f;if(f>0.08&&Math.abs(dj)>2)fl++;}}
 X.fillStyle='#0b1018';X.fillRect(0,0,1280,720);
 const gr=X.createLinearGradient(0,0,0,720);gr.addColorStop(0,'#1a2840');gr.addColorStop(1,'#05070c');X.fillStyle=gr;X.fillRect(0,0,1280,720);
 for(let s=0;s<N+M-2;s++)for(let i=Math.max(0,s-M+2);i<=Math.min(N-2,s);i++){const j=s-i;
  const k=i*M+j,h=(a,b)=>Z[a*M+b]+D[a*M+b];
  const z00=h(i,j),z10=h(i+1,j),z01=h(i,j+1),z11=h(i+1,j+1);
  const sh=Math.max(0.35,Math.min(1.4,1+((z00-z10)*0.12+(z01-z00)*0.18)));
  let c=B[k].slice();const d=D[k];
  if(d>0.15){const r=ramp(d/7),a=Math.min(0.85,0.3+d*0.15);c=c.map((v,n)=>v*(1-a)+r[n]*a);}
  const f=F[k];if(f>0.05){const a=Math.min(0.75,f*0.9);c=[c[0]*(1-a)+40*a,c[1]*(1-a)+120*a,c[2]*(1-a)+230*a];}
  X.fillStyle=`rgb(${c[0]*sh|0},${c[1]*sh|0},${c[2]*sh|0})`;
  const a=P(i,j,z00),b=P(i+1,j,z10),e=P(i+1,j+1,z11),g=P(i,j+1,z01);
  X.beginPath();X.moveTo(a[0],a[1]);X.lineTo(b[0],b[1]);X.lineTo(e[0],e[1]);X.lineTo(g[0],g[1]);X.closePath();X.fill();}
 // front marker
 if(sf>0&&sf<N-1&&tf<20){const i=Math.floor(sf),p=P(i,jc(i),Z[i*M+Math.round(jc(i))]+D[i*M+Math.round(jc(i))]);
  X.fillStyle='#fff';X.beginPath();X.arc(p[0],p[1],4,0,7);X.fill();X.font='13px sans-serif';X.fillText('Debris flow front',p[0]+8,p[1]-8);}
 // annotations
 X.font='bold 14px sans-serif';
 if(t>22){const ai=Math.floor(mxk/M),aj=mxk%M,p=P(ai,aj,Z[mxk]+D[mxk]),al=Math.min(1,(t-22)/1.5);
  X.globalAlpha=al;X.strokeStyle='#fff';X.lineWidth=1.5;X.beginPath();X.moveTo(p[0],p[1]);X.lineTo(p[0]+70,p[1]-90);X.stroke();
  X.fillStyle='rgba(0,0,0,.6)';X.fillRect(p[0]+70,p[1]-112,230,40);X.fillStyle='#ffd04a';
  X.fillText('Max deposition: '+mx.toFixed(1)+' m',p[0]+78,p[1]-95);X.fillStyle='#ddd';X.font='12px sans-serif';X.fillText('Alluvial fan apex (slope break)',p[0]+78,p[1]-80);
  const p2=P(33,jc(33),Z[33*M+Math.round(jc(33))]);X.fillStyle='#fff';X.font='bold 13px sans-serif';X.fillText('◀ Minor deposit at bend',p2[0]+14,p2[1]);X.globalAlpha=1;}
 // HUD
 X.fillStyle='rgba(0,0,0,.55)';X.fillRect(20,20,420,110);X.fillStyle='#fff';X.font='bold 22px sans-serif';
 X.fillText('Debris Flow Riverbed Change Model',34,50);X.font='13px sans-serif';X.fillStyle='#bcd';
 X.fillText('∂z/∂t = −(∂qs/∂x)/(1−λ)   deposition when slope θ < θ_e',34,72);
 X.fillStyle='#fff';X.font='15px monospace';
 X.fillText('t = '+(tf*60/20).toFixed(1).padStart(5)+' min  (simulated)',34,96);
 X.fillText('Deposited vol: '+(vol*25*25/1000).toFixed(1)+' ×10³ m³',34,118);
 X.fillStyle='rgba(0,0,0,.55)';X.fillRect(20,140,220,80);X.fillStyle='#fff';X.font='12px monospace';
 X.fillText('Max thickness: '+mx.toFixed(2)+' m',30,160);X.fillText('Flooded area : '+(fl*0.0625).toFixed(1)+' ha',30,180);X.fillText('Grid: 110×80, Δx=25 m',30,200);
 // legend
 X.fillStyle='rgba(0,0,0,.55)';X.fillRect(1060,20,200,150);X.fillStyle='#fff';X.font='bold 13px sans-serif';X.fillText('Deposition thickness',1072,42);
 for(let n=0;n<100;n++){const c=ramp(n/100);X.fillStyle=`rgb(${c|0},${c[1]|0},${c[2]|0})`;X.fillRect(1072+n*1.7,52,2,14);}
 X.fillStyle='#ddd';X.font='11px sans-serif';X.fillText('0 m',1072,80);X.fillText('3.5',1146,80);X.fillText('7+ m',1222,80);
 X.fillStyle='rgba(40,120,230,.85)';X.fillRect(1072,94,20,14);X.fillStyle='#fff';X.fillText('Flow / flooding',1100,105);
 X.fillStyle='rgb(200,110,90)';X.fillRect(1072,118,20,14);X.fillStyle='#fff';X.fillText('Houses',1100,129);
 X.fillStyle='rgb(150,140,120)';X.fillRect(1072,142,20,14);X.fillStyle='#fff';X.fillText('Original riverbed',1100,153);
 // longitudinal profile
 const gx=880,gy=560,gw=370,gh=140;X.fillStyle='rgba(0,0,0,.6)';X.fillRect(gx-10,gy-30,gw+20,gh+45);
 X.fillStyle='#fff';X.font='bold 13px sans-serif';X.fillText('Longitudinal bed profile (channel)',gx,gy-12);
 const py=z=>gy+gh-(z/100)*gh,px=i=>gx+i/(N-1)*gw;
 X.beginPath();for(let i=0;i<N;i++){const k=i*M+Math.round(jc(i));X.lineTo(px(i),py(Z[k]+D[k]*3));}
 X.lineTo(px(N-1),gy+gh);X.lineTo(px(0),gy+gh);X.fillStyle='rgba(230,120,40,.8)';X.fill();
 X.beginPath();for(let i=0;i<N;i++){const k=i*M+Math.round(jc(i));X.lineTo(px(i),py(Z[k]));}
 X.lineTo(px(N-1),gy+gh);X.lineTo(px(0),gy+gh);X.fillStyle='#6b6255';X.fill();
 X.fillStyle='#ccc';X.font='11px sans-serif';X.fillText('Orange: deposition (×3 vertical)',gx+150,gy+12);X.fillText('upstream',gx,gy+gh+12);X.fillText('fan / downstream',gx+gw-90,gy+gh+12);
 if(t<3){X.globalAlpha=1-t/3;X.fillStyle='#fff';X.font='bold 30px sans-serif';X.textAlign='center';X.fillText('Debris flow release from upstream gully',640,690);X.textAlign='left';X.globalAlpha=1;}
 requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script></body></html>
