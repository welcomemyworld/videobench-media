<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Alan AI</title>
<style>html,body{margin:0;background:#000;height:100%;overflow:hidden}
#c{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#000}</style></head>
<body><canvas id="c" width="1280" height="720"></canvas>
<script>
window.DUR=15;
const c=document.getElementById('c'),x=c.getContext('2d'),W=1280,H=720;
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);c.style.width=W*s+'px';c.style.height=H*s+'px';}
addEventListener('resize',fit);fit();
const q=new URLSearchParams(location.search),off=parseFloat(q.get('t')||0)||0,t0=performance.now();
const cl=v=>Math.max(0,Math.min(1,v)),eo=v=>1-Math.pow(1-cl(v),4),eio=v=>{v=cl(v);return v<.5?8*v*v*v*v:1-Math.pow(-2*v+2,4)/2};
const back=v=>{v=cl(v);const s=1.9;return 1+(s+1)*Math.pow(v-1,3)+s*Math.pow(v-1,2)};
const lerp=(a,b,v)=>a+(b-a)*v;
const P=[];for(let i=0;i<220;i++)P.push({a:Math.random()*6.28,r:Math.random(),s:.3+Math.random(),z:Math.random()});
const C1='#7c5cff',C2='#22d3ee',C3='#ff4fd8';
function grad(a,b,w){const g=x.createLinearGradient(-w/2,0,w/2,0);g.addColorStop(0,C1);g.addColorStop(.5,C2);g.addColorStop(1,C3);return g;}
function txt(s,X,Y,sz,a,col,wt,sp){x.save();x.globalAlpha=a;x.font=(wt||800)+' '+sz+'px Helvetica,Arial,sans-serif';x.textAlign='center';x.textBaseline='middle';
 if(sp){x.letterSpacing=sp+'px'}x.fillStyle=col||'#fff';x.fillText(s,X,Y);x.restore();}
function kinetic(s,X,Y,sz,t,stag,col){x.save();x.font='900 '+sz+'px Helvetica,Arial,sans-serif';x.textBaseline='middle';
 const w=x.measureText(s).width;let px=X-w/2;for(let i=0;i<s.length;i++){const ch=s[i],cw=x.measureText(ch).width,k=t-i*stag,e=back(k*2.2);
 x.save();x.translate(px+cw/2,Y+(1-e)*sz*.9);x.rotate((1-eo(k*2.2))*.6);x.globalAlpha=cl(k*4);x.fillStyle=col||'#fff';x.textAlign='center';x.fillText(ch,0,0);x.restore();px+=cw;}x.restore();}
function wave(t,amp,y,a){for(let k=0;k<3;k++){x.beginPath();for(let i=0;i<=W;i+=8){const v=Math.sin(i*.012+t*4+k*1.3)*Math.sin(i*.003+t*1.7)*amp*Math.exp(-Math.pow((i-W/2)/420,2));
 i?x.lineTo(i,y+v):x.moveTo(i,y+v);}x.strokeStyle=[C1,C2,C3][k];x.globalAlpha=a*.85;x.lineWidth=3;x.shadowBlur=20;x.shadowColor=x.strokeStyle;x.stroke();}x.shadowBlur=0;x.globalAlpha=1;}
function orb(X,Y,r,t,a){x.save();x.globalAlpha=a;x.translate(X,Y);
 const g=x.createRadialGradient(0,0,0,0,0,r*2.4);g.addColorStop(0,'rgba(124,92,255,.55)');g.addColorStop(.5,'rgba(34,211,238,.15)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(-r*3,-r*3,r*6,r*6);
 for(let k=0;k<5;k++){x.beginPath();for(let i=0;i<=64;i++){const an=i/64*6.283,rr=r*(1+.08*Math.sin(an*(3+k)+t*(2+k*.5))+.04*Math.sin(an*7-t*3));const px=Math.cos(an)*rr,py=Math.sin(an)*rr;i?x.lineTo(px,py):x.moveTo(px,py);}
 x.closePath();x.strokeStyle=[C1,C2,C3,C2,C1][k];x.lineWidth=2.5;x.shadowBlur=25;x.shadowColor=x.strokeStyle;x.stroke();}
 x.restore();}
function frame(T){
 x.setTransform(1,0,0,1,0,0);x.globalAlpha=1;
 const bg=x.createRadialGradient(W/2,H/2,0,W/2,H/2,800);bg.addColorStop(0,'#0d0a24');bg.addColorStop(1,'#000');x.fillStyle=bg;x.fillRect(0,0,W,H);
 // camera shake on hits
 let sh=0;[2.2,4.6,7.4,10.6].forEach(h=>{if(T>h&&T<h+.35)sh=(1-(T-h)/.35)*10});
 x.translate((Math.random()-.5)*sh,(Math.random()-.5)*sh);
 // grid
 x.save();x.globalAlpha=.18;x.strokeStyle=C1;x.lineWidth=1;const gy=(T*60)%60;
 for(let i=0;i<14;i++){const yy=H*.62+Math.pow(i/13,2)*H*.5+gy*Math.pow(i/13,1.5)*.3;x.beginPath();x.moveTo(0,yy);x.lineTo(W,yy);x.stroke();}
 for(let i=-12;i<=12;i++){x.beginPath();x.moveTo(W/2+i*20,H*.62);x.lineTo(W/2+i*160,H);x.stroke();}x.restore();
 // particles warp
 const warp=T<2.2?eo(T/2.2)*.3:(T>10.3&&T<11)?3:.4;
 P.forEach(p=>{p.z-=.004*p.s*(1+warp*6);if(p.z<=.01)p.z=1;const r=(1-p.z)*900*p.r+40,X=W/2+Math.cos(p.a+T*.1)*r,Y=H/2+Math.sin(p.a+T*.1)*r*.6;
  x.fillStyle=p.r>.5?C2:C3;x.globalAlpha=(1-p.z)*.8;x.fillRect(X,Y,2+(1-p.z)*2,2+(1-p.z)*2);});x.globalAlpha=1;
 // Scene 1: 0-2.2 ring burst + "Hey"
 if(T<2.4){const e=eo(T/1.2);for(let k=0;k<4;k++){x.beginPath();x.arc(W/2,H/2,e*(120+k*90),0,6.283*eo((T-k*.1)/1));x.strokeStyle=[C1,C2,C3,'#fff'][k];x.lineWidth=4-k*.6;x.globalAlpha=1-cl((T-1.6)/.6);x.stroke();}
  x.globalAlpha=1;kinetic('Hey.',W/2,H/2,150,T-.5,.08);x.globalAlpha=1;
  if(T>2)x.fillStyle='#fff',x.globalAlpha=1-cl((T-2)/.2)*0+(T-2)/.4,x.fillRect(0,0,W,H);x.globalAlpha=1;}
 // Scene 2: 2.2-4.6 voice wave + Talk to your app
 if(T>=2.2&&T<4.8){const s=T-2.2,o=1-cl((T-4.4)/.3);wave(T,90*eo(s/.6),H/2+40,o);
  x.globalAlpha=o;kinetic('Talk to your app.',W/2,H/2-130,84,s-.15,.035);
  txt('VOICE  ·  INTERFACE  ·  REIMAGINED',W/2,H-120,22,o*cl((s-.8)/.5),C2,600,8);}
 // Scene 3: 4.6-7.4 chat bubbles
 if(T>=4.6&&T<7.6){const s=T-4.6,o=1-cl((T-7.2)/.35);
  const B=[['“Show my orders from last week”',1,.1],['Here are 3 orders. Want me to reorder?',0,.9],['“Yes, the blue one”',1,1.6],['Done ✓ Arriving Friday.',0,2.1]];
  B.forEach((b,i)=>{const e=back((s-b[2])*2.5);if(e<=0)return;x.save();x.globalAlpha=o*cl((s-b[2])*4);x.font='600 28px Helvetica,Arial';const w=x.measureText(b[0]).width+60;
   const X=b[1]?W/2+360-w:W/2-360,Y=170+i*110;x.translate(X+(b[1]?w:0),Y+30);x.scale(e,e);x.translate(-(b[1]?w:0),-30);
   x.fillStyle=b[1]?grad(0,0,w*2):'rgba(255,255,255,.08)';x.strokeStyle='rgba(255,255,255,.2)';x.beginPath();x.roundRect(0,0,w,60,30);x.fill();x.stroke();
   x.fillStyle='#fff';x.textBaseline='middle';x.fillText(b[0],30,31);x.restore();});
  orb(W/2-470,H/2+20,40*eo(s*2),T,o);}
 // Scene 4: 7.4-10.6 big words slam
 if(T>=7.4&&T<10.8){const s=T-7.4,ws=['ACCURATE.','FAST.','HUMAN.'],i=Math.min(2,Math.floor(s/1.05)),ls=s-i*1.05;
  const sc=lerp(3,1,eo(ls*4))+ls*.05;x.save();x.translate(W/2,H/2);x.scale(sc,sc);
  for(let k=3;k>0;k--)txt(ws[i],k*6*Math.sin(T*9),0,150,.25,[C1,C2,C3][k-1],900);txt(ws[i],0,0,150,cl(ls*5),'#fff',900);x.restore();
  x.fillStyle=grad();x.save();x.translate(W/2,H/2+110);x.fillStyle=grad(0,0,600);x.fillRect(-300*eo(ls*3),0,600*eo(ls*3),6);x.restore();
  txt('0'+(i+1)+' / 03',W/2,H-80,20,.6,'#fff',600,6);}
 // Scene 5: 10.6-15 logo
 if(T>=10.6){const s=T-10.6,e=eo(s/.8),o=1-cl((T-14.5)/.5);
  orb(W/2,H/2-90,75*back(s*1.5),T,o);
  // logo glyph A
  x.save();x.translate(W/2,H/2-90);x.globalAlpha=o;x.lineWidth=10;x.lineCap='round';x.strokeStyle='#fff';x.shadowBlur=30;x.shadowColor=C2;
  const d=eo((s-.3)/.8);x.beginPath();x.moveTo(-32,35);x.lineTo(lerp(-32,0,d),lerp(35,-38,d));x.lineTo(lerp(0,32,cl(d*2-1)),lerp(-38,35,cl(d*2-1)));x.stroke();
  x.beginPath();x.moveTo(-16,10);x.lineTo(lerp(-16,16,cl((s-1)/.4)),10);x.stroke();x.restore();
  x.save();x.globalAlpha=o;kinetic('Alan AI',W/2,H/2+70,110,s-.6,.06);x.restore();
  x.save();x.translate(W/2,H/2+70);x.globalAlpha=o*cl((s-1.6)/.4)*.9;x.fillStyle=grad(0,0,500);x.fillRect(-220*eo(s-1.6),62,440*eo(s-1.6),3);x.restore();
  txt('The AI voice assistant for your app',W/2,H/2+170,30,o*cl((s-1.9)/.5),'#cfd3ff',500);
  txt('@tryAlanAI',W/2,H/2+225,26,o*cl((s-2.4)/.5),C2,700,4);}
 // flash transitions
 [2.2,4.6,7.4,10.6].forEach(h=>{const d=T-h;if(d>=0&&d<.25){x.setTransform(1,0,0,1,0,0);x.globalAlpha=(1-d/.25)*.7;x.fillStyle='#fff';x.fillRect(0,0,W,H);}});
 // letterbox + vignette
 x.setTransform(1,0,0,1,0,0);x.globalAlpha=1;const v=x.createRadialGradient(W/2,H/2,300,W/2,H/2,820);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.75)');x.fillStyle=v;x.fillRect(0,0,W,H);
 const lb=40*eio(T/1)*(1-cl((T-14.6)/.4));x.fillStyle='#000';x.fillRect(0,0,W,lb);x.fillRect(0,H-lb,W,lb);
 x.globalAlpha=1-cl(T/.4)+cl((T-14.7)/.3);x.fillRect(0,0,W,H);x.globalAlpha=1;
}
function loop(){const T=((performance.now()-t0)/1000+off)%window.DUR;frame(T);requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script></body></html>
