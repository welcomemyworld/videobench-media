<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>BUILD THE FLOOR</title>
<style>html,body{margin:0;background:#000;height:100%;overflow:hidden}
canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#102820}</style></head>
<body><canvas id="c" width="1280" height="720"></canvas>
<script>
window.DUR=20;
const C=document.getElementById('c'),X=C.getContext('2d');
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);C.style.width=1280*s+'px';C.style.height=720*s+'px';}
addEventListener('resize',fit);fit();
const q=new URLSearchParams(location.search),T0=parseFloat(q.get('t')||0)||0,P0=performance.now();
const INK='#F4E9D5',GOLD='#F2B544',BG='#102820';
const SER='Georgia,"Times New Roman",serif',GRO='"Arial Black","Helvetica Neue",Impact,sans-serif',MON='"Courier New",monospace';
const cl=v=>v<0?0:v>1?1:v, ss=(a,b,t)=>{t=cl((t-a)/(b-a));return t*t*(3-2*t)};
const h=n=>{n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n)};
const NL=21;
// weights
function W(t){
 return{p:1-ss(3,3.8,t),
  s:(ss(3,3.6,t)+ss(4.1,4.7,t)+ss(5.2,5.8,t))/3*(1-ss(6.5,7.6,t)),
  n:ss(6.8,8.8,t)*(1-ss(12.5,13.6,t)),
  f:ss(12.6,14.2,t)};
}
let NX=640,NY=360;
function disp(x,y0,w){
 let dy=0;
 dy+=-(y0-360)*0.6*Math.exp(-Math.pow((x-1110)/240,2))*w.p;
 const sag=Math.exp(-Math.pow((x-820)/380,2));
 dy+=w.s*120*sag*(0.4+y0/720);
 const d=y0-NY,dx=x-NX,R=110;
 const push=R*R*d/(d*d+dx*dx*0.6+R*R*0.25);
 dy+=w.n*push*0.95;
 return dy;
}
function lineY(x,i,w){
 const y0=40+i*(640/(NL-1));
 const yf=478+i*4;
 return (y0+disp(x,y0,w))*(1-w.f)+yf*w.f;
}
function drawLines(w,te,alpha,frac,fromEnd){
 X.strokeStyle=GOLD;X.lineWidth=1.3;
 for(let i=0;i<NL;i++){
  X.globalAlpha=alpha*(0.22+0.2*Math.abs(Math.sin(i*1.7)));
  X.beginPath();
  const n=81,lim=Math.floor(n*frac);
  for(let k=0;k<=lim;k++){
   const kk=fromEnd?n-k:k,x=kk*16;
   const y=lineY(x,i,w)+Math.sin(x*0.01+te*1.3+i)*1.5*(1-w.f);
   k?X.lineTo(x,y):X.moveTo(x,y);
  }
  X.stroke();
 }
 X.globalAlpha=1;
}
function filings(w,te){
 X.fillStyle=GOLD;
 const g=ss(3,6.5,te)*(1-ss(6.5,8,te));
 for(let id=0;id<280;id++){
  const i=Math.floor(h(id)*NL),v=20+h(id+9)*50;
  let x=((h(id+3)*1400+v*te)%1400)-60;
  x=x*(1-g)+(820+(x-820)*0.25+(h(id+5)-.5)*120)*g;
  if(w.n>0.01){const dx=x-NX;if(Math.abs(dx)<140)x=NX+Math.sign(dx||1)*(140-(140-Math.abs(dx))*(1-w.n))}
  const y=lineY(x,i,w)+(h(id+7)-.5)*8+(g*18*h(id+11));
  const a=Math.atan2(lineY(x+4,i,w)-lineY(x-4,i,w),8);
  X.globalAlpha=0.35+0.4*h(id+2);
  X.save();X.translate(x,y);X.rotate(a);X.fillRect(-3,-0.7,6,1.4);X.restore();
 }
 X.globalAlpha=1;
}
// draw letters with per-letter fn
function word(s,font,size,x,y,alpha,fn,align){
 X.font=size+'px '+font;
 let tot=0;const ws=[];for(const ch of s){const m=X.measureText(ch).width;ws.push(m);tot+=m}
 let cx=align==='c'?x-tot/2:x;const out=[];
 X.fillStyle=INK;X.globalAlpha=cl(alpha);X.textBaseline='alphabetic';X.textAlign='center';
 [...s].forEach((ch,k)=>{
  const o=fn?fn(k,cx+ws[k]/2):{};
  const lx=cx+ws[k]/2+(o.dx||0),ly=y+(o.dy||0);
  X.save();X.translate(lx,ly);X.rotate(o.a||0);X.fillText(ch,0,0);X.restore();
  out.push([lx,ws[k]]);cx+=ws[k]*(o.sp||1);
 });
 X.globalAlpha=1;X.textAlign='left';return out;
}
function mono(s,x,y,a,al){X.font='15px '+MON;X.fillStyle=GOLD;X.globalAlpha=a;X.textAlign=al||'left';X.fillText(s,x,y);X.textAlign='left';X.globalAlpha=1;}
function frame(t){
 X.setTransform(1,0,0,1,0,0);X.fillStyle=BG;X.fillRect(0,0,1280,720);
 const te=t<11?t:t<11.6?11:t-0.6; // stillness hold
 const w=W(t);
 // null point = counter of O in ROOM
 X.font='200px '+GRO;const rW=X.measureText('ROOM').width,rR=X.measureText('R').width,rO=X.measureText('O').width;
 const roomX=640-rR-rO/2-0, roomY=470;
 NX=640;NY=roomY-72;
 if(t>10)NY=NY+(360-NY)*ss(10,10.8,t);
 // zoom into the O counter
 const z=1+ss(9.6,10.6,t)*7*(1-ss(10.6,10.61,t));
 // field
 if(t>6.5&&t<7.8){
  const k=ss(6.5,7.6,t);
  drawLines(W(6.49),te,1,1-k,true);
  drawLines(w,te,1,k,false);
 }else drawLines(w,te,1,1,false);
 filings(w,te);
 // ---- scene 1
 if(t<3.4){
  const a=ss(0.1,0.6,t)*(1-ss(2.9,3.3,t));
  word('WAIT.',GRO,150,880,425,ss(0.9,1.3,t)*(1-ss(2.9,3.3,t)),(k,x)=>({a:0}));
  word('We were told to',SER,62,90,410,a,(k,x)=>{const p=Math.pow(x/880,2);return{a:-0.42*p*ss(0.5,1.6,t),sp:1-0.32*p*ss(0.5,1.6,t),dy:-(0)}});
 }
 // ---- scene 2
 if(t>2.9&&t<6.9){
  const out=1-ss(6.4,6.85,t);
  const rows=[['So we learned',3.0,170],['the weight',4.1,300],['of waiting.',5.2,430]];
  rows.forEach(([s,st,y])=>{
   word(s,SER,66,300,y,ss(st,st+0.4,t)*out,(k,x)=>{const d0=disp(x,y,w),d1=disp(x+6,y,w);return{dy:d0*0.8,a:Math.atan2((d1-d0)*0.8,6)}});
  });
  // suspended WAITING load
  const sw=Math.sin(te*1.6)*0.05;
  const ld=ss(5.4,6,t)*out;
  X.save();X.translate(960,560+disp(960,560,w)*0.4);X.rotate(0.16+sw);
  word('WAITING',GRO,64,0,0,ld,null,'c');X.restore();
  X.strokeStyle=GOLD;X.globalAlpha=ld*0.6;X.beginPath();X.moveTo(960,90);X.lineTo(960,500+disp(960,560,w)*0.4);X.stroke();X.globalAlpha=1;
 }
 // ---- scene 3
 if(t>6.5&&t<10.7){
  const out=1-ss(9.9,10.5,t);
  const tilt=(1-ss(7.2,9.4,t));
  const fn=yb=>(k,x)=>{const d0=disp(x,yb,W(6.49)),d1=disp(x+6,yb,W(6.49));return{a:Math.atan2(d1-d0,6)*tilt*(Math.sin(k*2.3)>0?1:-1)*1.4}};
  word('Then one',SER,60,640,130,ss(6.6,7,t)*out,fn(130),'c');
  word('VOICE',GRO,110,640,255,ss(7.1,7.5,t)*out,(k,x)=>({a:(0.6-k*0.3)*(1-ss(7.2,8.6,t))}),'c');
  word('made',SER,56,640,320,ss(8.1,8.5,t)*out,fn(320),'c');
  X.save();X.translate(NX,NY);X.scale(z,z);X.translate(-NX,-NY);
  word('ROOM.',GRO,200,roomX,roomY,ss(8.7,9.2,t)*(1-ss(10.3,10.6,t)),(k,x)=>({a:k===1?0:0.25*(k%2?1:-1)*(1-ss(8.8,9.6,t))}));
  X.restore();
  // still eye
  X.strokeStyle=GOLD;X.globalAlpha=ss(8.9,9.4,t)*out*0.8;X.beginPath();X.arc(NX,NY,4,0,7);X.stroke();X.globalAlpha=1;
 }
 // ---- scene 4: inside the counter
 if(t>10.3&&t<12.9){
  const a=ss(10.4,10.9,t)*(1-ss(12.4,12.85,t));
  X.strokeStyle=INK;X.globalAlpha=a*0.9;X.lineWidth=3;
  X.beginPath();X.ellipse(640,360,330,260,0,0,7);X.stroke();
  word('Then another.',SER,64,640,382,a,null,'c');
  X.strokeStyle=GOLD;X.globalAlpha=a*ss(10.8,11,t)*0.9;X.lineWidth=1.5;
  X.beginPath();X.moveTo(450,396);X.lineTo(830,396);X.stroke();X.globalAlpha=1;X.lineWidth=1;
  if(t>11&&t<11.6)mono('HOLD · ∂B/∂t = 0',640,450,a*0.8,'center');
 }
 // ---- scene 5
 if(t>12.6){
  word('Now the',SER,58,640,300,ss(12.7,13.1,t),null,'c');
  word('FLOOR',GRO,170,640,472,ss(13.4,14.1,t),(k,x)=>({dy:(1-ss(13.4,14.3,t))*-60*(k%2?1:-0.6)}),'c');
  word('belongs to us.',SER,58,640,640,ss(14.5,15,t),null,'c');
 }
 // ---- title
 const ta=ss(16.4,17.2,t)*(1-ss(19.5,19.95,t));
 X.font='20px '+MON;X.fillStyle=INK;X.globalAlpha=ta;X.textAlign='center';X.fillText('B U I L D   T H E   F L O O R',640,70);X.textAlign='left';X.globalAlpha=1;
 // gauges
 const flux=(0.82*w.p+0.6*w.s+0.08*w.n*(t<10?1:0))*(1-w.f)+(t<0.1?0.82:0);
 const B=t>10.8&&t<12.5?0:flux*(1-w.n*0.9);
 mono('Φ '+(flux*1.2+0.004*Math.sin(te*7)*(1-w.f)).toFixed(3)+' Wb',36,690,0.75);
 mono('|B| '+Math.max(0,B).toFixed(3)+' T',36,30,0.75);
 mono('BUILD THE FLOOR · '+t.toFixed(2)+'s',1244,690,0.6,'right');
 mono(['PLATE','LOAD','REVERSAL','NULL','PLANE'][t<3?0:t<6.5?1:t<10?2:t<12.5?3:4],1244,30,0.75,'right');
 // vignette
 const g=X.createRadialGradient(640,360,250,640,360,800);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,0.45)');
 X.fillStyle=g;X.fillRect(0,0,1280,720);
 X.globalAlpha=1-ss(0,0.4,t)+ss(19.6,20,t);X.fillStyle=BG;X.fillRect(0,0,1280,720);X.globalAlpha=1;
}
function loop(now){const t=((now-P0)/1000+T0)%window.DUR;frame(t);requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script></body></html>
