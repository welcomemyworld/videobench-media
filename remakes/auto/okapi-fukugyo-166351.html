<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><title>Morph UI</title>
<style>html,body{margin:0;background:#000;height:100%;overflow:hidden}
#c{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#e9e6e1}</style></head>
<body><canvas id="c" width="1280" height="720"></canvas>
<script>
window.DUR=16;
const cv=document.getElementById('c'),X=cv.getContext('2d');
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);cv.style.width=1280*s+'px';cv.style.height=720*s+'px'}
addEventListener('resize',fit);fit();
const F='"Geist","Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif';
const q=new URLSearchParams(location.search),T0=parseFloat(q.get('t')||0)||0,P0=performance.now();
// closed-form spring step response (zeta .9 => tiny overshoot)
function sp(t,om,z){z=z||0.9;if(t<=0)return 0;const wd=om*Math.sqrt(1-z*z);return 1-Math.exp(-z*om*t)*(Math.cos(wd*t)+z*om/wd*Math.sin(wd*t))}
function K(keys,tb,om){let v=keys[0][1];for(let i=1;i<keys.length;i++)v+=(keys[i][1]-keys[i-1][1])*sp((tb-keys[i][0])/2,om);return v}
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
// shape states (beat, w,h,r,c) c:0 dark 1 light
const S=[[0,240,72,36,0],[1,72,72,36,0],[4,380,60,30,0],[6,460,170,32,1],[11,460,84,42,1],[14,132,72,36,0],[15,132,72,36,1],[16,132,72,36,0],[17,520,72,36,1],[20,560,340,28,1],[24,560,72,20,1],[24.5,560,324,20,1],[25,560,228,20,1],[25.5,560,180,20,1],[26,560,132,20,1],[27,400,64,32,0],[28.4,240,72,36,0]];
const sk=i=>S.map(s=>[s[0],s[i]]);const SW=sk(1),SH=sk(2),SR=sk(3),SC=sk(4);
// cursor (beat,x,y) local coords
const CK=[[0,150,90],[0.5,20,8],[1.6,140,70],[5.6,170,-25],[8.4,-76,45],[9.2,100,45],[10.6,120,90],[11.3,20,8],[12.1,280,8],[13.5,60,60],[14.1,0,0],[17.1,170,0],[18.1,-170,0],[19.0,0,0],[20.2,200,140],[21.6,-200,20],[23.4,200,-20],[24.1,150,140],[26.2,-80,30],[27.2,150,90]];
const CX=CK.map(k=>[k[0],k[1]]),CY=CK.map(k=>[k[0],k[2]]);
const clicks=[1,6.5,14.5,15.5,16.5,17.6,18.6,19.5,26.8],drags=[[9,10.4],[12,13.2]];
function pressed(tb){for(const c of clicks)if(tb>c-0.12&&tb<c+0.1)return 1;for(const d of drags)if(tb>d[0]&&tb<d[1])return 1;return 0}
function curX(tb){return K(CX,tb,13)}function curY(tb){return K(CY,tb,13)}
function rr(x,y,w,h,r){X.beginPath();X.roundRect(x,y,w,h,r)}
function txt(s,x,y,sz,col,al,w){X.font=(w||500)+' '+sz+'px '+F;X.fillStyle=col;X.textAlign=al||'center';X.textBaseline='middle';X.fillText(s,x,y)}
// scrub
function scrubX(tb){if(tb<9)return -76+Math.max(0,tb-6.5)*2;if(tb<10.4)return cl(curX(tb),-190,190);const r=cl(curX(10.4),-190,190);return r+(tb-10.4)*2}
function volX(tb){const st=x=>x>180?180+34*(1-Math.exp(-(x-180)/50)):Math.max(-140,x);if(tb<12)return 20;if(tb<13.2)return st(curX(tb));const r=st(curX(13.2));return r+(180-r)*sp((tb-13.2)/2,16)}
// toggle edges: leading edge fast, trailing slow
function edges(keys,tb){let L=keys[0][1],R=keys[0][2];for(let i=1;i<keys.length;i++){const dir=Math.sign(keys[i][1]-keys[i-1][1]),t=(tb-keys[i][0])/2;L+=(keys[i][1]-keys[i-1][1])*sp(t,dir<0?24:11);R+=(keys[i][2]-keys[i-1][2])*sp(t,dir>0?24:11)}return[L,R]}
const TG=[[0,-62,-2],[14.5,2,62],[15.5,-62,-2],[16.5,2,62]];
const TB=[[0,-250,-90],[17.6,90,250],[18.6,-250,-90],[19.5,-80,80]];
const PTS=[0.3,0.45,0.38,0.62,0.55,0.78,0.7,0.9];
const ITEMS=['グラフを作成','グラデーション','グループ設定','ラベル編集','ファイル共有'];
function query(tb){return tb<25?'':tb<25.5?'グ':tb<26?'グラ':'グラフ'}
// content layers [startBeat,endBeat,draw]
const L=[
[-1,1,(tb,w,h,fg)=>txt('はじめる',0,1,24,fg,'center',600)],
[1,3,(tb,w,h,fg)=>{X.strokeStyle=fg;X.lineWidth=4;X.lineCap='round';const a=tb*Math.PI*1.6;X.beginPath();X.arc(0,0,18,a,a+Math.PI*1.3);X.stroke()}],
[3,4,(tb,w,h,fg)=>{X.strokeStyle=fg;X.lineWidth=4;X.lineCap='round';X.lineJoin='round';const p=cl((tb-3)*3,0,1);X.setLineDash([50*p,60]);X.beginPath();X.moveTo(-13,1);X.lineTo(-4,10);X.lineTo(14,-9);X.stroke();X.setLineDash([])}],
[4,6,(tb,w,h,fg)=>{X.fillStyle=fg;rr(-w/2+14,-16,32,32,8);X.fill();txt('Midnight Drive',-w/2+58,0,17,fg,'left',600);for(let i=0;i<5;i++){const bh=6+10*Math.abs(Math.sin(tb*3.1+i*1.3));X.fillRect(w/2-60+i*8,-bh/2,4,bh)}}],
[6,11,(tb,w,h,fg)=>{X.fillStyle='#111';rr(-210,-60,72,72,14);X.fill();txt('Midnight Drive',-122,-38,20,fg,'left',600);txt('Kinoko · 120 BPM',-122,-12,15,'#777','left');
 const m=sp((tb-6.5)/2,18),pl=[[[-7,-11],[1,-5.5],[1,5.5],[-7,11]],[[1,-5.5],[10,0],[10,0],[1,5.5]]],pa=[[[-8,-10],[-3,-10],[-3,10],[-8,10]],[[3,-10],[8,-10],[8,10],[3,10]]];
 X.fillStyle='#111';X.beginPath();X.arc(170,-25,26,0,7);X.fill();X.fillStyle='#fff';for(let k=0;k<2;k++){X.beginPath();for(let j=0;j<4;j++){const x=pl[k][j][0]+(pa[k][j][0]-pl[k][j][0])*m,y=pl[k][j][1]+(pa[k][j][1]-pl[k][j][1])*m;j?X.lineTo(170+x,-25+y):X.moveTo(170+x,-25+y)}X.fill()}
 const kx=scrubX(tb),dr=tb>9&&tb<10.4;X.fillStyle='#ddd';rr(-190,43,380,4,2);X.fill();X.fillStyle='#111';rr(-190,43,kx+190,4,2);X.fill();X.beginPath();X.arc(kx,45,dr?9:7,0,7);X.fill();
 const sec=Math.round((kx+190)/380*214);txt(Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0'),-190,66,13,'#777','left');txt('3:34',190,66,13,'#777','right')}],
[11,14,(tb,w,h,fg)=>{X.strokeStyle=fg;X.lineWidth=2.5;X.lineJoin='round';X.lineCap='round';X.beginPath();X.moveTo(-200,-5);X.lineTo(-194,-5);X.lineTo(-186,-12);X.lineTo(-186,12);X.lineTo(-194,5);X.lineTo(-200,5);X.closePath();X.stroke();X.beginPath();X.arc(-183,0,9,-0.8,0.8);X.stroke();
 const vx=volX(tb);X.fillStyle='#ddd';rr(-140,4,320,8,4);X.fill();X.fillStyle='#111';rr(-140,4,vx+140,8,4);X.fill();X.beginPath();X.arc(vx,8,10,0,7);X.fill();txt(Math.round(cl((vx+140)/320,0,1)*100)+'%',200,-14,14,'#555','right',600);txt('音量',-140,-16,14,'#555','left',600)}],
[14,17,(tb,w,h,fg)=>{const e=edges(TG,tb);X.fillStyle='#fff';rr(e[0],-30,e[1]-e[0],60,30);X.fill()}],
[17,20,(tb,w,h,fg)=>{const e=edges(TB,tb),lab=['概要','分析','設定'];X.fillStyle='#111';rr(e[0],-28,e[1]-e[0],56,28);X.fill();lab.forEach((s,i)=>txt(s,(i-1)*170,1,19,'#111','center',600));X.save();rr(e[0],-28,e[1]-e[0],56,28);X.clip();lab.forEach((s,i)=>txt(s,(i-1)*170,1,19,'#fff','center',600));X.restore()}],
[20,24,(tb,w,h,fg)=>{txt('週間アクティブ',-250,-135,20,'#111','left',600);txt('12,480',250,-135,20,'#111','right',600);X.strokeStyle='#e4e4e4';X.lineWidth=1;for(let i=0;i<4;i++){X.beginPath();X.moveTo(-250,-80+i*60);X.lineTo(250,-80+i*60);X.stroke()}
 const P=PTS.map((v,i)=>[-250+i*500/7,120-v*220]),pr=cl((tb-20.3)/1.5,0,1)*7;X.strokeStyle='#111';X.lineWidth=3;X.lineJoin='round';X.lineCap='round';X.beginPath();X.moveTo(P[0][0],P[0][1]);for(let i=1;i<=Math.ceil(pr)&&i<8;i++){const f=Math.min(1,pr-i+1);X.lineTo(P[i-1][0]+(P[i][0]-P[i-1][0])*f,P[i-1][1]+(P[i][1]-P[i-1][1])*f)}X.stroke();
 ['月','火','水','木','金','土','日','月'].forEach((d,i)=>i<7&&txt(d,P[i][0],145,13,'#999'));
 if(tb>21.6&&tb<23.9){const cx=curX(tb);let n=0;P.forEach((p,i)=>{if(Math.abs(p[0]-cx)<Math.abs(P[n][0]-cx))n=i});const ha=Math.min(1,(tb-21.6)*4,(23.9-tb)*4);X.globalAlpha*=ha;const p=P[n];X.fillStyle='#fff';X.strokeStyle='#111';X.lineWidth=3;X.beginPath();X.arc(p[0],p[1],6,0,7);X.fill();X.stroke();
 const bx=cl(p[0],-200,200);X.fillStyle='#111';rr(bx-50,p[1]-52,100,34,10);X.fill();txt((Math.round(PTS[n]*14000)).toLocaleString(),bx,p[1]-35,15,'#fff','center',600)}}],
[24,27,(tb,w,h,fg)=>{const y0=-h/2+36,qs=query(tb);X.strokeStyle='#111';X.lineWidth=2.5;X.beginPath();X.arc(-245,y0-2,8,0,7);X.moveTo(-239,y0+4);X.lineTo(-233,y0+10);X.stroke();
 txt(qs||'検索…',-220,y0,19,qs?'#111':'#999','left',500);if(qs&&(tb*2)%2<1.2){X.font='500 19px '+F;X.fillStyle='#111';X.fillRect(-218+X.measureText(qs).width,y0-12,2,24)}
 X.strokeStyle='#ccc';X.lineWidth=1.5;rr(210,y0-14,44,28,7);X.stroke();txt('⌘K',232,y0+1,14,'#555','center',600);
 if(h>90){X.fillStyle='#eee';X.fillRect(-280,-h/2+72,560,1);let n=0;ITEMS.forEach(s=>{if(qs&&!s.includes(qs))return;const y=-h/2+72+12+n*48+24;if(n==0){X.fillStyle='#f0efec';rr(-266,y-20,532,40,10);X.fill();txt('Enter',240,y,13,'#888','right',600)}txt(s,-246,y,17,'#111','left',500);n++})}}],
[27,28.5,(tb,w,h,fg)=>{X.fillStyle='#fff';X.beginPath();X.arc(-w/2+34,0,12,0,7);X.fill();X.strokeStyle='#111';X.lineWidth=2.5;X.lineCap='round';X.beginPath();X.moveTo(-w/2+29,0);X.lineTo(-w/2+33,4);X.lineTo(-w/2+40,-4);X.stroke();txt('グラフを作成しました',-w/2+58,1,17,fg,'left',600)}],
[28.5,33,(tb,w,h,fg)=>txt('はじめる',0,1,24,fg,'center',600)]];
function seek(T){
 const tb=T*2;X.setTransform(1,0,0,1,0,0);X.fillStyle='#e9e6e1';X.fillRect(0,0,1280,720);
 const w=K(SW,tb,15),h=K(SH,tb,15),r=K(SR,tb,15),c=cl(K(SC,tb,18),0,1);
 const s=Math.min(1280*0.6/w,720*0.6/h,3.0);
 X.setTransform(s,0,0,s,640,360);
 const g=Math.round(17+c*238);X.fillStyle=`rgb(${g},${g},${g})`;X.shadowColor='rgba(60,50,40,0.10)';X.shadowBlur=24/s*s;X.shadowOffsetY=6;rr(-w/2,-h/2,w,h,r);X.fill();X.shadowColor='transparent';
 const fg=c>0.5?'#111':'#fff';X.save();rr(-w/2,-h/2,w,h,r);X.clip();
 for(const l of L){const fi=0.18,a=Math.min(cl((tb-l[0])/fi+1,0,1),cl((l[1]-tb)/fi,0,1));if(a<=0)continue;X.globalAlpha=a;X.filter=a<1?`blur(${((1-a)*6).toFixed(2)}px)`:'none';l[2](tb,w,h,fg);X.filter='none';X.globalAlpha=1}
 X.restore();
 // ⌘K hint
 const ka=Math.min(cl((tb-23.4)*4,0,1),cl((24.6-tb)*4,0,1));if(ka>0){X.setTransform(1,0,0,1,0,0);X.globalAlpha=ka;X.fillStyle='#111';rr(560,620,72,48,12);X.fill();rr(644,620,72,48,12);X.fill();txt('⌘',596,645,24,'#fff');txt('K',680,645,22,'#fff','center',600);X.globalAlpha=1}
 // cursor
 const px=640+curX(tb)*s,py=360+curY(tb)*s,pr=pressed(tb),cs=1-0.12*pr;
 X.setTransform(cs,0,0,cs,px,py);X.fillStyle='#111';X.strokeStyle='#fff';X.lineWidth=2;X.lineJoin='round';X.beginPath();X.moveTo(0,0);X.lineTo(0,26);X.lineTo(7,20);X.lineTo(12,31);X.lineTo(17,29);X.lineTo(12,18);X.lineTo(21,18);X.closePath();X.fill();X.stroke();
}
function frame(){const T=((performance.now()-P0)/1000+T0)%window.DUR;seek(T);requestAnimationFrame(frame)}
window.seek=seek;requestAnimationFrame(frame);
</script></body></html>
