<html><head><meta charset="utf-8"><title>nightshift.</title>
<style>html,body{margin:0;background:#000;height:100%;overflow:hidden}

<body><canvas id="c" width="1280" height="720"></canvas>
<script>
window.DUR=24;
const W=1280,H=720,cv=document.getElementById('c'),X=cv.getContext('2d');
const FONT='Geist,-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif';
const NAME='nightshift',JOB='book 10 sales calls this week',RES=['200 leads found','200 emails sent','10 calls booked'];
const mk=()=>{const c=document.createElement('canvas');c.width=W;c.height=H;return c};
const rng=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),L=(a,b,p)=>a+(b-a)*p;
function E(x){x=cl(x);if(x<=0||x>=1)return x;let u=x;for(let i=0;i<10;i++){const f=3*(1-u)*(1-u)*u*.45+3*(1-u)*u*u*.15+u*u*u-x,d=3*(1-u)*(1-u)*.45+6*(1-u)*u*(-.3)+3*u*u*.85;if(Math.abs(d)<1e-6)break;u=cl(u-f/d)}return 3*(1-u)*u*u+u*u*u}
const g=(t,a,d=.8)=>E((t-a)/d);
function rr(c,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
// ---------- procedural "photos" ----------
function scene(day,out){const c=mk(),x=c.getContext('2d'),R=rng(out?9:5);
 let gr=x.createLinearGradient(0,0,0,560);
 (out?['#2f86e6','#7dbbf2','#d6ecfb']:day?['#3a7fd0','#9cc6ee','#f8ddb4']:['#02040f','#0b1434','#2a2c58']).forEach((v,i)=>gr.addColorStop(i/2,v));
 x.fillStyle=gr;x.fillRect(0,0,W,H);
 for(let i=0;i<220;i++){const sx=R()*W,sy=R()*420,sr=R()*1.4+.3;if(!day){x.fillStyle=`rgba(255,255,255,${.3+R()*.7})`;x.fillRect(sx,sy,sr,sr)}}
 if(day){const sg=x.createRadialGradient(990,170,10,990,170,240);sg.addColorStop(0,'rgba(255,250,215,1)');sg.addColorStop(.2,'rgba(255,240,190,.8)');sg.addColorStop(1,'rgba(255,240,190,0)');x.fillStyle=sg;x.fillRect(700,0,580,450);
  for(let i=0;i<9;i++){const cx=R()*W,cy=60+R()*200,s=40+R()*70;x.fillStyle='rgba(255,255,255,.75)';for(let j=0;j<6;j++){x.beginPath();x.ellipse(cx+(j-3)*s*.45,cy+Math.sin(j*2)*s*.15,s*.5,s*.3,0,0,7);x.fill()}}}
 else{x.fillStyle='#e9e6dc';x.beginPath();x.arc(990,150,28,0,7);x.fill();x.fillStyle='#0b1434';x.beginPath();x.arc(1002,142,26,0,7);x.fill()}
 const mc=out?['#6fae6a','#4b9450','#3c8a3f']:day?['#86a7c6','#5f86aa']:['#141c3a','#0c1229'];
 mc.forEach((col,l)=>{x.fillStyle=col;x.beginPath();x.moveTo(0,H);for(let i=0;i<=W;i+=8){const y=(out?470+l*60:420+l*40)-40*Math.sin(i*.004+l*2)-25*Math.sin(i*.011+l)-12*Math.sin(i*.03+l*5);x.lineTo(i,y)}x.lineTo(W,H);x.fill()});
 if(out)return c;
 const B=rng(42);let bx=-10;
 while(bx<W){const bw=40+B()*70,bh=80+B()*240,top=560-bh;x.fillStyle=day?'#5d6d82':'#090d1b';x.fillRect(bx,top,bw,bh);
  for(let wy=top+10;wy<550;wy+=16)for(let wx=bx+6;wx<bx+bw-8;wx+=12){const lit=B()<.32;x.fillStyle=day?'rgba(190,215,235,.55)':lit?'#ffcf73':'#141a2e';x.fillRect(wx,wy,6,9)}bx+=bw+2}
 gr=x.createLinearGradient(0,560,0,H);gr.addColorStop(0,day?'#4f7fa8':'#070b1c');gr.addColorStop(1,day?'#2b5275':'#02030a');x.fillStyle=gr;x.fillRect(0,560,W,160);
 x.save();x.globalAlpha=.28;x.translate(0,1120);x.scale(1,-1);x.drawImage(c,0,380,W,180,0,400,W,160);x.restore();
 return c}
const NIGHT=scene(0),DAY=scene(1),OUT=scene(1,1);
function blur(src){const c=mk(),x=c.getContext('2d');x.filter='blur(22px)';x.drawImage(src,-40,-40,W+80,H+80);return c}
const BN=blur(NIGHT),BD=blur(DAY);
const IN=mk(),IX=IN.getContext('2d'),GO=mk(),GX=GO.getContext('2d');
// ---------- morph table ----------
const K=[[0,{x:640,y:380,w:0,h:0,r:0,a:0,k:0,m:0}],[4.0,{w:300,h:68,r:34,a:1}],[5.05,{w:640,h:76,r:38}],[6.95,{w:18,h:18,r:9}],[7.6,{a:0},.2],
[9.45,{y:380,w:640,h:400,r:28,a:1}],[12.6,{y:360,w:220,h:220,r:110}],[15.1,{k:1}],[15.9,{a:0},.01],
[17.95,{x:640,y:200,w:200,h:56,r:28,a:1,k:1},.01],[18.05,{y:360,w:300,h:640,r:46,m:1,k:0}],[19.65,{w:760,h:470,r:28,m:0}],
[22.2,{w:420,h:84,r:42,k:1}],[22.75,{w:18,h:18,r:9}],[23.3,{a:0},.01]];
function S(t){let s=Object.assign({},K[0][1]);for(let i=1;i<K.length;i++){const[kt,ks,d]=K[i];if(t<kt)break;const p=g(t,kt,d||.8),n=Object.assign({},s,ks);for(const k in s)s[k]=L(s[k],n[k],p)}return s}
const win=(t,a,b,f=.25)=>cl((t-a)/f)*cl((b-t)/f);
function txt(c,s,x,y,size,col,al='center',w=600){c.font=`${w} ${size}px ${FONT}`;c.fillStyle=col;c.textAlign=al;c.textBaseline='middle';c.fillText(s,x,y)}
function roll(c,s,x,y,size,tin,tout,t,col='#fff'){if(t<tin-.01||t>tout+.8)return;c.save();c.beginPath();c.rect(0,y-size*.75,W,size*1.5);c.clip();
 const o=(1-g(t,tin,.6))*size*1.4-g(t,tout,.6)*size*1.4;txt(c,s,x,y+o,size,col);c.restore()}
function shadowed(c,h,fn){c.save();c.shadowColor='rgba(0,0,0,.35)';c.shadowBlur=8+h*.09;c.shadowOffsetY=3+h*.035;fn();c.restore()}
function glass(c,x,y,w,h,r,dawn,tint){shadowed(c,h,()=>{rr(c,x,y,w,h,r);c.fillStyle='rgba(0,0,0,.25)';c.fill()});
 c.save();rr(c,x,y,w,h,r);c.clip();c.drawImage(BN,0,0);if(dawn>0){c.globalAlpha=dawn;c.drawImage(BD,0,0);c.globalAlpha=1}
 c.fillStyle=tint||'rgba(22,24,40,.38)';c.fillRect(x,y,w,h);c.restore();
 const gr=c.createLinearGradient(x,y,x+w*.4,y+h);gr.addColorStop(0,'rgba(255,255,255,.7)');gr.addColorStop(.5,'rgba(255,255,255,.08)');gr.addColorStop(1,'rgba(255,255,255,.3)');
 rr(c,x+.5,y+.5,w-1,h-1,r);c.strokeStyle=gr;c.lineWidth=1.4;c.stroke()}
function pointer(c,x,y,s=1,col='#000',lab){c.save();c.translate(x,y);c.scale(1.35*s,1.35*s);c.shadowColor='rgba(0,0,0,.35)';c.shadowBlur=4;c.shadowOffsetY=2;
 c.beginPath();[[0,0],[0,17],[4,13.2],[6.8,19.6],[9.6,18.4],[6.9,12.2],[12,12]].forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();
 c.fillStyle=col;c.fill();c.shadowColor='transparent';c.strokeStyle='#fff';c.lineWidth=1.3;c.stroke();
 if(lab){c.font=`600 9px ${FONT}`;const lw=c.measureText(lab).width+12;rr(c,12,18,lw,16,8);c.fillStyle=col;c.fill();c.fillStyle='#fff';c.textAlign='left';c.textBaseline='middle';c.fillText(lab,18,26.5)}c.restore()}
// ---------- data ----------
const GR=[],GRR=rng(77);for(let j=0;j<15;j++)for(let i=0;i<23;i++)GR.push({x:640+(i-11)*22,y:380+(j-7)*22,r:GRR()});
const thr=[...GR].map(d=>d.r).sort((a,b)=>a-b)[199];GR.forEach(d=>d.on=d.r<=thr);
const MEET=[[0,1],[0,5],[1,0.5],[1,3],[2,1.5],[2,4],[3,2],[3,6],[4,1],[4,4.5]];
const CH=[];for(let i=0;i<12;i++)CH.push(i/11*i/11*.75+i/11*.2+Math.sin(i*1.7)*.04);
const chX=i=>330+i*620/11,chY=v=>545-v*280;
function chartAt(p){const f=p*11,i=Math.min(10,Math.floor(f));return[L(chX(i),chX(i+1),f-i),chY(L(CH[i],CH[i+1],f-i))]}
const BODY1='Hi Maya, saw Northpeak just opened Austin.',BODY2='Worth 15 min Thursday to compare notes?';
const typed=(s,a,b,t)=>s.slice(0,Math.floor(cl((t-a)/(b-a))*s.length));
const CUR=[[4.25,980,620,0],[4.35,980,620,1],[4.85,650,392,1],[5.4,720,480,1],[5.55,720,480,0],[6.5,1010,480,0],[6.6,1010,480,1],[6.92,926,388,1],[7.25,990,480,1],[7.35,990,480,0],
[19.15,820,600,0],[19.25,820,600,1],[19.5,700,300,1],[19.75,700,300,1],[20.5,700,300,1],[20.75,590,238,1],[20.95,590,238,1],[21.55,700,420,1],[22.1,955,280,1],[22.4,700,372,1],[22.75,700,372,1],[22.85,700,372,0]];
function cursorAt(t){if(t<CUR[0][0]||t>CUR[CUR.length-1][0])return null;
 if(t>21.6&&t<22.08){const p=chartAt(.15+.85*cl((t-21.6)/.45));return[p[0]+4,p[1]+4,1]}
 for(let i=1;i<CUR.length;i++)if(t<=CUR[i][0]){const a=CUR[i-1],b=CUR[i],p=E((t-a[0])/(b[0]-a[0]||1));return[L(a[1],b[1],p),L(a[2],b[2],p),L(a[3],b[3],p)]}return null}
const CLICKS=[4.9,6.97,19.55,22.62];
// ---------- inside world ----------
function inside(t){const c=IX,dawn=g(t,13.0,2.6);c.globalAlpha=1;c.drawImage(NIGHT,0,0);if(dawn>0){c.globalAlpha=dawn;c.drawImage(DAY,0,0);c.globalAlpha=1}
 roll(c,'you log off at 6',640,360,58,1.75,2.85,t);roll(c,NAME+' doesn\u2019t',640,360,58,2.9,3.85,t);
 const s=S(t),x=s.x-s.w/2,y=s.y-s.h/2;
 // chip (find / write)
 if(t>7.9&&t<12.9){const a=win(t,7.9,12.9,.3);let lab;
  if(t<9.6){let n=0;const sx=L(380,900,cl((t-8.1)/1.3));GR.forEach(d=>{if(d.on&&d.x<=sx&&t>8.1)n++});lab='Leads found  '+n}
  else lab='Emails sent  '+Math.round(200*cl((t-11.95)/.6))+'/200';
  c.save();c.globalAlpha=a;glass(c,520,128,240,40,20,dawn);txt(c,lab,640,149,17,'#fff');c.restore()}
 // grid
 if(t>7.2&&t<10.1){const sx=L(380,900,cl((t-8.1)/1.3)),pour=g(t,9.4,.6);
  GR.forEach(d=>{const dist=Math.hypot(d.x-640,d.y-380),ap=cl((t-7.25-dist/650)/.15);if(ap<=0)return;
   const lit=d.on&&t>8.1&&d.x<=sx;let px=d.x,py=d.y,r=3.2,al=ap*(lit?1:.35);
   if(lit){px=L(d.x,640+(d.x-640)*.5,pour);py=L(d.y,320+(d.y-380)*.3,pour);r=L(4,1,pour);al*=1-cl((t-9.75)/.3)}else al*=1-pour;
   c.fillStyle=lit?'#fff':'rgba(200,210,255,1)';c.globalAlpha=al;c.beginPath();c.arc(px,py,r,0,7);c.fill()});
  c.globalAlpha=1;if(t>8.1&&t<9.45){c.fillStyle='rgba(255,255,255,.85)';c.fillRect(sx,212,2,336)}}
 // morph element
 if(s.a>.01&&s.w>1){c.save();c.globalAlpha=s.a;glass(c,x,y,s.w,s.h,s.r,dawn);
  if(s.k>0){c.save();c.globalAlpha=s.a*s.k;rr(c,x,y,s.w,s.h,s.r);c.fillStyle='#0a0a0c';c.fill();c.restore()}
  if(s.m>0){c.save();rr(c,x,y,s.w,s.h,s.r);c.clip();c.globalAlpha=s.a*s.m;c.drawImage(DAY,280,0,720,720,x,y,s.w,s.h);c.restore();
   c.save();rr(c,x-12*s.m,y-12*s.m,s.w+24*s.m,s.h+24*s.m,s.r+12*s.m);rr(c,x,y,s.w,s.h,s.r);c.fillStyle='#111';c.globalAlpha=s.a*s.m;c.fill('evenodd');c.restore()}
  c.restore();content(c,t,s,x,y,dawn)}
 // night: clock + caption
 if(t>12.8&&t<15.9){c.save();c.globalAlpha=win(t,12.8,15.9,.3);glass(c,560,186,160,44,22,dawn);c.restore();
  [['11:42 PM',12.8,13.6],['3:17 AM',13.6,14.4],['5:02 AM',14.4,15.2],['6:59 AM',15.2,15.65]].forEach(([s,a,b])=>roll(c,s,640,208,20,a,b,t));
  roll(c,'while you sleep',640,545,40,13.3,15.3,t)}
 // goo split / merge
 if(t>=15.9&&t<17.95){GX.fillStyle='#fff';GX.fillRect(0,0,W,H);GX.fillStyle='#000';const sp=g(t,15.9),mg=g(t,17.15);
  const P=[0,1,2].map(i=>{const px=640,py=L(L(360,264+i*96,sp),200,mg),pw=L(L(220,420,sp),200,mg),ph=L(L(220,72,sp),56,mg);return[px,py,pw,ph]});
  P.forEach(p=>{rr(GX,p[0]-p[2]/2,p[1]-p[3]/2,p[2],p[3],p[3]/2);GX.fill()});
  shadowed(c,80,()=>{c.globalCompositeOperation='multiply';c.filter='blur(9px) contrast(45)';c.drawImage(GO,0,0);c.filter='none';c.globalCompositeOperation='source-over'});
  const ta=cl((t-16.5)/.25)*(1-cl((t-17.1)/.2));if(ta>0)P.forEach((p,i)=>{c.save();c.globalAlpha=ta;txt(c,RES[i],p[0]+18,p[1],24,'#fff');
   const pc=g(t,16.6+i*.12,.4),cx=p[0]-p[2]/2+38;c.translate(cx,p[1]);c.scale(pc,pc);c.fillStyle='#30d158';c.beginPath();c.arc(0,0,15,0,7);c.fill();
   c.strokeStyle='#fff';c.lineWidth=3;c.lineCap='round';c.beginPath();c.moveTo(-6,0);c.lineTo(-2,5);c.lineTo(7,-5);c.stroke();c.restore()})}
 // purple agent cursor
 if(t>10.05&&t<12.4){const a=win(t,10.05,12.4,.15);let px,py;const tp=Math.max(typed(BODY1,10.3,11.0,t).length,0);
  c.font=`400 19px ${FONT}`;if(t<11.0){px=352+c.measureText(typed(BODY1,10.3,11.0,t)).width;py=392}else if(t<11.6){px=352+c.measureText(typed(BODY2,11.0,11.55,t)).width;py=422}
  else{const p=g(t,11.6,.35);px=L(352+c.measureText(BODY2).width,872,p);py=L(422,532,p)}
  c.save();c.globalAlpha=a;pointer(c,px+4,py+6,t>11.95&&t<12.05?.85:1,'#7c4dff',NAME);c.restore()}
 const cu=cursorAt(t);if(cu&&cu[2]>0){let sc=1;CLICKS.forEach(k=>{if(t>k-.06&&t<k+.1)sc=.85});c.save();c.globalAlpha=cu[2];pointer(c,cu[0],cu[1],sc);c.restore()}}
function content(c,t,s,x,y,dawn){const cx=s.x,cy=s.y;c.save();
 let a=win(t,4.35,5.05,.2);if(a>0){c.globalAlpha=a;txt(c,'Ask '+NAME,cx,cy,24,'#fff')}
 a=win(t,5.35,6.97,.2);if(a>0){c.globalAlpha=a;txt(c,typed(JOB,5.5,6.6,t)+(t%0.8<.4?'|':''),x+34,cy,24,'#fff','left',500);
  c.fillStyle='#fff';c.beginPath();c.arc(x+s.w-38,cy,22,0,7);c.fill();c.strokeStyle='#000';c.lineWidth=3;c.lineCap='round';c.beginPath();c.moveTo(x+s.w-38,cy+9);c.lineTo(x+s.w-38,cy-9);c.moveTo(x+s.w-46,cy-1);c.lineTo(x+s.w-38,cy-9);c.lineTo(x+s.w-30,cy-1);c.stroke()}
 a=win(t,9.95,12.6,.25);if(a>0){c.globalAlpha=a;txt(c,'New message',cx,y+30,16,'rgba(255,255,255,.7)');
  [['To','maya@northpeak.co',y+80],['Subject','Austin launch',y+124]].forEach(([l,v,yy])=>{txt(c,l,x+32,yy,17,'rgba(255,255,255,.55)','left',500);txt(c,v,x+120,yy,18,'#fff','left',500);c.fillStyle='rgba(255,255,255,.15)';c.fillRect(x+32,yy+22,s.w-64,1)});
  txt(c,typed(BODY1,10.3,11.0,t),x+32,y+212,19,'#fff','left',400);txt(c,typed(BODY2,11.0,11.55,t),x+32,y+242,19,'#fff','left',400);
  const pr=t>11.95&&t<12.08?.94:1;c.save();c.translate(872,532);c.scale(pr,pr);rr(c,-55,-21,110,42,21);c.fillStyle='#7c4dff';c.fill();txt(c,'Send',0,0,18,'#fff');c.restore()}
 a=win(t,12.95,15.5,.25);if(a>0){c.globalAlpha=a;const p=cl((t-13)/2.5);c.lineWidth=6;c.lineCap='round';c.strokeStyle='rgba(255,255,255,.18)';c.beginPath();c.arc(cx,cy,84,0,7);c.stroke();
  c.strokeStyle='#fff';c.beginPath();c.arc(cx,cy,84,-Math.PI/2,-Math.PI/2+p*6.283);c.stroke();txt(c,Math.round(p*100)+'%',cx,cy,34,'#fff')}
 a=win(t,18.45,19.75,.25);if(a>0){c.globalAlpha=a;txt(c,'Tuesday, May 14',cx,y+100,17,'#fff',undefined,500);txt(c,'7:00',cx,y+160,86,'#fff',undefined,700);
  RES.forEach((r,i)=>{const p=g(t,18.75+i*.15,.6),ny=L(y+40,y+290+i*80,p);if(p<=0)return;c.save();c.globalAlpha=a*cl(p*3);
   const op=i==0?g(t,19.58,.3):0;glass(c,x+15-op*8,ny-32-op*6,s.w-30+op*16,64+op*12,18,dawn,'rgba(245,245,250,.55)');
   rr(c,x+28,ny-16,32,32,8);c.fillStyle='#111';c.fill();c.fillStyle='#fff';c.beginPath();c.arc(x+44,ny+4,3,0,7);c.fill();
   txt(c,NAME.toUpperCase(),x+70,ny-11,11,'rgba(0,0,0,.55)','left',600);txt(c,r,x+70,ny+9,17,'#111','left',600);c.restore()})}
 a=win(t,19.95,20.95,.25);if(a>0){c.globalAlpha=a;txt(c,'This week  \u00b7  10 calls booked',x+40,y+36,22,'#fff','left',600);
  ['Mon','Tue','Wed','Thu','Fri'].forEach((d,i)=>{txt(c,d,330+i*140,y+76,15,'rgba(255,255,255,.6)');c.fillStyle='rgba(255,255,255,.1)';c.fillRect(260+i*140,y+92,1,350)});
  MEET.forEach(([d,h],i)=>{const p=g(t,20.05+i*.05,.4);if(p<=0)return;const mx=330+d*140,my=y+120+h*48;c.save();c.translate(mx,my);c.scale(p,p);rr(c,-60,-18,120,36,10);c.fillStyle=i==4?'#a48bff':'#7c4dff';c.fill();txt(c,'Sales call',0,0,14,'#fff');c.restore()});
  const hv=win(t,20.7,21.0,.1);if(hv>0){c.globalAlpha=a*hv;rr(c,520,168,170,36,10);c.fillStyle='#fff';c.fill();txt(c,'Wed \u00b7 10:30 AM',605,186,15,'#111')}}
 a=win(t,20.95,22.35,.2);if(a>0){c.globalAlpha=a;txt(c,'Pipeline',x+40,y+36,18,'rgba(255,255,255,.7)','left',500);
  txt(c,'$'+Math.round(48200*E(cl((t-21.0)/.9))).toLocaleString('en-US'),x+40,y+80,44,'#fff','left',700);
  const p=cl((t-21.05)/.85);c.strokeStyle='#fff';c.lineWidth=4;c.lineJoin='round';c.beginPath();const n=p*11;
  for(let i=0;i<=Math.floor(n);i++){i?c.lineTo(chX(i),chY(CH[i])):c.moveTo(chX(i),chY(CH[i]))}const e=chartAt(p);c.lineTo(e[0],e[1]);c.stroke();
  if(t>21.6&&t<22.1){const h=chartAt(.15+.85*cl((t-21.6)/.45));c.fillStyle='#fff';c.beginPath();c.arc(h[0],h[1],7,0,7);c.fill()}
