<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Seed</title>
<style>html,body{margin:0;background:#000;height:100%;overflow:hidden}
canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#000}</style></head>
<body><canvas id="c" width="1280" height="720"></canvas>
<script>
window.DUR=60;
const C=document.getElementById('c'),X=C.getContext('2d'),W=1280,H=720;
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);C.style.width=W*s+'px';C.style.height=H*s+'px'}
addEventListener('resize',fit);fit();
const q=new URLSearchParams(location.search),OFF=parseFloat(q.get('t')||0)||0;
let R=12345;const rnd=()=>(R=(R*16807)%2147483647)/2147483647;
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),ss=(a,b,v)=>{v=cl((v-a)/(b-a));return v*v*(3-2*v)},lerp=(a,b,k)=>a+(b-a)*k;
const N=2200,P=[];
for(let i=0;i<N;i++){const arm=i%3,r=Math.pow(rnd(),0.6)*330+4;
P.push({d:rnd()*6.283,sp:0.3+rnd()*1.4,r,a:arm*2.094+r*0.018+(rnd()-.5)*(0.9-r/500),
h:rnd()<.15?20+rnd()*30:200+rnd()*60,s:rnd()*1.6+0.4,z:(rnd()-.5)*20*(1-r/400)});}
const BG=[];for(let i=0;i<400;i++)BG.push([rnd()*W,rnd()*H,rnd()*1.3,rnd()*6]);
function txt(s,a,y=640,sz=26){if(a<=0)return;X.save();X.globalAlpha=a;X.fillStyle='#e8eefc';X.font='300 '+sz+'px Georgia,serif';X.textAlign='center';
X.shadowColor='#8af';X.shadowBlur=14;X.fillText(s,W/2,y);X.restore();}
function glow(x,y,r,c,a){const g=X.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,c.replace('A',a));g.addColorStop(1,c.replace('A',0));X.fillStyle=g;X.fillRect(x-r,y-r,2*r,2*r);}
function stars(t,a){X.fillStyle='#fff';for(const s of BG){X.globalAlpha=a*(0.4+0.6*Math.abs(Math.sin(t*0.8+s[3])));X.fillRect(s[0],s[1],s[2]+.4,s[2]+.4);}X.globalAlpha=1;}
// scene: point
function point(t,loc){const p=1+0.25*Math.sin(t*3);glow(W/2,H/2,60*p,'rgba(255,240,210,A)',0.9);glow(W/2,H/2,8,'rgba(255,255,255,A)',1);}
// cosmos: bang -> galaxy -> zoom
function cosmos(t){ // t from 6
X.globalCompositeOperation='lighter';
const bang=t,form=ss(5,10,t),zoom=ss(14,21,t),rot=t*0.25;
const sc=lerp(1,9,zoom*zoom),tx=lerp(0,-150,zoom),ty=lerp(0,40,zoom);
if(t<1.5)glow(W/2,H/2,900*t,'rgba(255,230,200,A)',0.9*(1-t/1.5));
for(const p of P){const e=(1-Math.exp(-bang*1.2))*p.sp*520;
let bx=Math.cos(p.d)*e,by=Math.sin(p.d)*e*0.8;
const ang=p.a+rot*(1.6/(1+p.r/120));let gx=Math.cos(ang)*p.r,gy=Math.sin(ang)*p.r*0.45+p.z;
let x=lerp(bx,gx,form),y=lerp(by,gy,form);x=(x+tx)*sc+W/2;y=(y+ty)*sc+H/2;
if(x<-20||x>W+20||y<-20||y>H+20)continue;
const heat=cl(1-t/4);X.fillStyle=`hsla(${lerp(p.h,40,heat)},${80-heat*40}%,${70+heat*25}%,${0.8})`;
const s=p.s*Math.sqrt(sc);X.fillRect(x,y,s,s);}
glow(W/2-150*sc*0+tx*sc,H/2+ty*sc,90*sc*form,'rgba(255,210,150,A)',0.5*form);
X.globalCompositeOperation='source-over';}
// star system
function system(t){ // t from 0
stars(t,1);const sx=lerp(640,250,ss(0,4,t)),sy=360;
glow(sx,sy,260,'rgba(255,170,60,A)',0.6);glow(sx,sy,90,'rgba(255,240,200,A)',1);
const z=ss(5,11,t);const oa=t*0.5+1;const orr=lerp(330,380,z);
let px=sx+Math.cos(oa)*orr*1.2,py=sy+Math.sin(oa)*orr*0.35;
px=lerp(px,860,z);py=lerp(py,380,z);const pr=lerp(14,230,z*z);
X.strokeStyle='rgba(255,255,255,'+0.15*(1-z)+')';X.beginPath();X.ellipse(sx,sy,orr*1.2,orr*.35,0,0,6.283);X.stroke();
X.save();X.beginPath();X.arc(px,py,pr,0,6.283);X.clip();
let g=X.createRadialGradient(px-pr*.4,py-pr*.3,pr*.1,px,py,pr);g.addColorStop(0,'#3b8fd6');g.addColorStop(1,'#061a3a');X.fillStyle=g;X.fillRect(px-pr,py-pr,2*pr,2*pr);
for(let i=0;i<14;i++){const u=((i*0.37+t*0.03)%1)*2.6-1.3;X.fillStyle=i%3?'rgba(60,140,70,.75)':'rgba(255,255,255,.35)';
X.beginPath();X.ellipse(px+u*pr,py+Math.sin(i*2.1)*pr*.6,pr*(.15+.1*Math.sin(i)),pr*(.08+.05*Math.cos(i*3)),i,0,6.283);X.fill();}
g=X.createLinearGradient(px-pr,0,px+pr,0);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.55,'rgba(0,0,0,.2)');g.addColorStop(1,'rgba(0,0,10,.9)');X.fillStyle=g;X.fillRect(px-pr,py-pr,2*pr,2*pr);
X.restore();glow(px,py,pr*1.2,'rgba(120,180,255,A)',0.25);}
// life
function branch(x,y,l,a,d,g,t){if(d<=0||g<=0)return;const k=cl(g);const ex=x+Math.cos(a)*l*k,ey=y+Math.sin(a)*l*k;
X.lineWidth=d*1.3;X.strokeStyle=`hsl(${260+d*8},30%,${12+d*2}%)`;X.beginPath();X.moveTo(x,y);X.lineTo(ex,ey);X.stroke();
if(d<3&&k>=1){X.fillStyle=`hsla(${(d*40+x)%360},90%,70%,.7)`;X.beginPath();X.arc(ex,ey,2.5,0,6.283);X.fill();}
const sw=Math.sin(t*0.8+d)*0.04;if(k>=1){branch(ex,ey,l*.76,a-0.42+sw,d-1,g-1,t);branch(ex,ey,l*.7,a+0.38+sw,d-1,g-1.2,t);}}
function life(t,camZ){
X.save();const fx=640,fy=190;X.translate(fx,fy);X.scale(camZ,camZ);X.translate(-fx,-fy);
let g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,'#05031a');g.addColorStop(.7,'#2a1550');g.addColorStop(1,'#d0607a');X.fillStyle=g;X.fillRect(0,0,W,H);
stars(t,0.7);
X.fillStyle='#0b0718';X.beginPath();X.moveTo(0,H);for(let x=0;x<=W;x+=20)X.lineTo(x,600+Math.sin(x*.01)*20+Math.sin(x*.031)*8);X.lineTo(W,H);X.fill();
X.lineCap='round';const gr=t*1.1;branch(640,610,120,-1.5708,10,gr,t);
branch(250,600,55,-1.5708,7,gr-2,t);branch(1030,605,65,-1.5708,7,gr-1.5,t);
for(let i=0;i<40;i++){const fx2=(i*97+t*20)%W,fy2=500-((i*53+t*15)%300);X.globalAlpha=.5+.5*Math.sin(t*3+i);glow(fx2,fy2,6,'rgba(200,255,150,A)',0.8);}
X.globalAlpha=1;const sa=ss(3,6,t);glow(fx,fy,50,'rgba(255,240,210,A)',sa*0.9);glow(fx,fy,6,'rgba(255,255,255,A)',sa);
X.restore();}
let T0=null;
function frame(now){if(T0===null)T0=now;let t=((now-T0)/1000+OFF)%DUR;
X.globalAlpha=1;X.fillStyle='#000';X.fillRect(0,0,W,H);
if(t<6){point(t);txt('In the beginning, there was a single point of light.',ss(1,2,t)*(1-ss(4.5,5.5,t)));if(t>5.6)glow(W/2,H/2,1400*(t-5.6),'rgba(255,255,255,A)',1);}
else if(t<28){cosmos(t-6);txt('It remembered how to become everything.',ss(8,9,t)*(1-ss(13,14,t)));
txt('Stars learned to spin.',ss(16,17,t)*(1-ss(20,21,t)));
if(t>25.5){X.fillStyle='rgba(0,0,0,'+ss(25.5,28,t)+')';X.fillRect(0,0,W,H);}}
else if(t<40){system(t-28);txt('One star kept a small blue secret.',ss(29,30,t)*(1-ss(33,34,t)));
if(t>38){X.fillStyle='rgba(255,255,255,'+ss(38,40,t)+')';X.fillRect(0,0,W,H);}}
else{const lt=t-40;const z=1+Math.pow(ss(10,17,lt),3)*300;life(lt,z);
if(lt<2){X.fillStyle='rgba(255,255,255,'+(1-lt/2)+')';X.fillRect(0,0,W,H);}
txt('Life grew, and looked up, and wondered.',ss(1.5,2.5,lt)*(1-ss(6,7,lt)));
txt('Inside every wonder, a single point of light.',ss(7.5,8.5,lt)*(1-ss(10.5,11.5,lt)),640,26);
if(lt>16){X.fillStyle='rgba(0,0,0,'+ss(16,18.5,lt)+')';X.fillRect(0,0,W,H);point(lt);txt('...and it begins again.',ss(17,18,lt)*(1-ss(19.3,20,lt)));}}
const v=X.createRadialGradient(W/2,H/2,H*.4,W/2,H/2,H);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.6)');X.fillStyle=v;X.fillRect(0,0,W,H);
requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script></body></html>
