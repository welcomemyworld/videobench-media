 polygon([[c.x-.49,c.y+.48,.08],[c.x+.49,c.y+.48,.08],[c.x+.49,.035,c.y+.48],[c.x-.49,.035,c.y+.48]],grad);
 for(let k=0;k<3;k++){
 let f=(hash(c.n*9+k)+t*.014)%1;
 let xx=c.x+(hash(k*19+c.n)-.5)*1.0;
 let p=project([xx,c.y*(1-f),c.y*f+.1]);
 if(!p)continue;
 let tw=.3+.7*Math.pow(Math.sin(t*1.3+k+c.n),2);
 ctx.fillStyle=`rgba(${rgb},${tw*(.22+color*.5)*(1-late*.5)})`;
 ctx.beginPath();ctx.arc(p[0],p[1],.6+hash(k+c.n)*1.2,0,7);ctx.fill();
 }
 }
 ctx.restore();
}
function text(t){
 const captions=[
 [0.45,3.0,'毎日、もっと速く。'],
 [4.1,7.5,'もっと、効率よく。'],
 [10.9,14.0,'気づけば、光が入らなくなっていた。'],
 [14.55,18.7,'ひとつ、手放してみる。'],
 [20.0,25.1,'空いたところから、光が入る。'],
 [28.1,32.6,'その光は、前より豊かだった。']
 ];
 ctx.textAlign='center';ctx.textBaseline='middle';
 for(let [a,b,str] of captions){
 let opacity=smooth((t-a)/.8)*(1-smooth((t-(b-.65))/.65));
 if(opacity<=0)continue;
 ctx.save();ctx.globalAlpha=opacity;
 let fs=str.length>18?24:29;
 ctx.font=`${fs}px "Yu Mincho","Hiragino Mincho ProN","Noto Serif CJK JP",serif`;
 ctx.shadowColor='#000';ctx.shadowBlur=15;ctx.fillStyle='#edeae4';
 ctx.fillText(str,W/2,H*.894);ctx.restore();
 }
 let title=smooth(t/.8)*(1-smooth((t-2.1)/.8));
 if(title>0){
 ctx.globalAlpha=title*.7;ctx.fillStyle='#d6d7d6';
 ctx.font='23px "Yu Mincho","Hiragino Mincho ProN",serif';
 ctx.fillText('余 白',W/2,101);ctx.globalAlpha=1;
 }
 if(t>=33.2){
 let a=smooth((t-33.35)/1.2);
 ctx.save();ctx.globalAlpha=a;ctx.fillStyle='#504a40';
 ctx.font='38px "Yu Mincho","Hiragino Mincho ProN","Noto Serif CJK JP",serif';
 ctx.fillText('豊かさは余白に宿る',W/2,H*.48);
 ctx.globalAlpha=a*.58;ctx.font='18px "Yu Mincho","Hiragino Mincho ProN",serif';
 ctx.fillText('余 白',W/2,H*.55);ctx.restore();
 }
}
function render(t){
 camera(t);
 let light=buildTexture(t),late=smooth((t-26)/6.6);
 stone(t,light);
 // Both surfaces use the very same masked image and the same 45° ray map.
 ctx.save();ctx.globalCompositeOperation='screen';
 ctx.globalAlpha=mix(.44,.93,smooth((t-14)/12));
 ctx.shadowBlur=19;ctx.shadowColor=t<14?'#dce4ed':'#e2bc67';
 mapped(texture,floor,8,18);
 ctx.shadowBlur=0;ctx.globalAlpha=mix(.68,.98,smooth((t-14)/11));
 mapped(texture,floor,8,18);
 ctx.restore();
 ctx.save();ctx.globalCompositeOperation='screen';ctx.globalAlpha=.95;
 mapped(texture,win,8,12);ctx.restore();
 beams(t,light);
 let sorted=cells.filter(c=>t>=c.arrival-.9&&t<c.release+1.45).sort((a,b)=>{
 let za=t<a.arrival?mix(24,.52,smooth((t-a.arrival+.9)/.9)):.52;
 let zb=t<b.arrival?mix(24,.52,smooth((t-b.arrival+.9)/.9)):.52;
 return za-zb;
 });
 sorted.forEach(c=>cube(c,t));
 // Darkness is held for three seconds without suppressing the inscriptions.
 let blackout=smooth((t-10.75)/.25)*(1-smooth((t-14.25)/.7));
 if(blackout){ctx.fillStyle=`rgba(0,2,5,${blackout*.85})`;ctx.fillRect(0,0,W,H)}
 // Warm scattered light blooms as the camera rises into the revealed image.
 if(t>25){
 let bloom=smooth((t-25)/7)*.13;
 let rg=ctx.createRadialGradient(W*.5,H*.48,20,W*.5,H*.48,H*.65);
 rg.addColorStop(0,`rgba(255,215,148,${bloom})`);rg.addColorStop(1,'rgba(238,154,74,0)');
 ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);
 }
 let vig=ctx.createRadialGradient(W/2,H*.46,W*.15,W/2,H*.5,H*.67);
 vig.addColorStop(0,'rgba(0,0,0,0)');vig.addColorStop(1,`rgba(0,0,0,${.6-late*.3})`);
 ctx.fillStyle=vig;ctx.fillRect(0,0,W,H);
 if(t>32.8){
 let a=smooth((t-32.8)/1.8);
 ctx.fillStyle=`rgba(255,249,232,${a})`;ctx.fillRect(0,0,W,H);
 }
 text(t);
 out.fillStyle='#000';out.fillRect(0,0,1280,720);
 out.drawImage(film,437.5,0,405,720);
}
let offset=Number(new URLSearchParams(location.search).get('t')||0);
if(!Number.isFinite(offset))offset=0;
const origin=performance.now();
let previous=-1;
function frame(now){
 let seconds=((now-origin)/1000+offset)%window.DUR;
 if(seconds<0)seconds+=window.DUR;
 let index=Math.floor(seconds*30);
 if(index!==previous){render(index/30);previous=index}
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
