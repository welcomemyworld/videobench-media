<script>
'use strict';
/*
  Self-contained original procedural music film.
  No remote song, transcription, model, or stem-separation services are called.
  Original lyrics and the ten-scene storyboard are embedded below.
  Perspective-projected 3D engraving geometry is rendered without dependencies.
  The optional original instrumental is synthesized locally and loudness-normalized.
  A 16-frame contact sheet is available in the console: exportContactSheet().
*/
window.DUR=50;
const W=1280,H=720,PW=1080,PH=1920,TAU=Math.PI*2;
const canvas=document.getElementById('screen'),ctx=canvas.getContext('2d');
const portrait=document.createElement('canvas');portrait.width=PW;portrait.height=PH;
const p=portrait.getContext('2d');
const bone='#eee4cf',orange='#f77932',black='#080807';
const startOffset=Number(new URLSearchParams(location.search).get('t'))||0;
let epoch,nowTime=0,lastScene=-1;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const smooth=x=>{x=clamp(x);return x*x*(3-2*x)};
const mix=(a,b,t)=>a+(b-a)*t;

const scenes=[
{word:'SPARK',lyric:'I held a spark beneath the stone.',show:'A living seed inside a fractured shell',camera:'SLOW ORBIT / CLOSE',kind:'seed'},
{word:'RIVER',lyric:'The dark became a riverbed.',show:'An orange current through etched waves',camera:'LOW FLIGHT / FORWARD',kind:'river'},
{word:'WINGS',lyric:'I taught my paper wings to rise.',show:'A bird assembled from engraved feathers',camera:'ASCENDING / THREE-QUARTER',kind:'bird'},
{word:'CITY',lyric:'The city burned behind my eyes.',show:'A city of black needles against an ember sun',camera:'ORBIT / WIDE',kind:'city'},
{word:'CLIMB',lyric:'I climbed the names I left below.',show:'A spiral staircase suspended in darkness',camera:'CRANE / UPWARD',kind:'stairs'},
{word:'HEART',lyric:'A borrowed heart began to glow.',show:'A wire-carved heart and concentric pulses',camera:'PUSH IN / FRONTAL',kind:'heart'},
{word:'SKY',lyric:'I saw the sky inside the sea.',show:'A celestial eye above a field of ripples',camera:'DOLLY / FLOATING',kind:'eye'},
{word:'ROOTS',lyric:'My roots remembered how to fly.',show:'A suspended tree with roots like wings',camera:'ORBIT / REVEAL',kind:'tree'},
{word:'BEYOND',lyric:'I walked where every shadow ends.',show:'Nine nested gates opening into light',camera:'FORWARD / THROUGH',kind:'door'},
{word:'MORNING',lyric:'And made a morning of my bones.',show:'A rising engraved sun with a crown of rays',camera:'PULL BACK / HORIZON',kind:'sun'}
];
const models=[];
function path(model,points,color=0,width=1,opacity=1,closed=false){model.push({points,color,width,opacity,closed})}
function line(m,a,b,c=0,w=1,o=1){path(m,[a,b],c,w,o)}
function curve(m,fn,n=80,c=0,w=1,o=1,closed=false){let a=[];for(let i=0;i<=n;i++)a.push(fn(i/n));path(m,a,c,w,o,closed)}
function circle(m,r,y=0,c=0,w=1,axis='xz',center=[0,0,0],n=96){
curve(m,t=>{let a=t*TAU;return axis==='xy'?[center[0]+r*Math.cos(a),center[1]+r*Math.sin(a)+y,center[2]]:axis==='yz'?[center[0],center[1]+r*Math.cos(a)+y,center[2]+r*Math.sin(a)]:[center[0]+r*Math.cos(a),center[1]+y,center[2]+r*Math.sin(a)]},n,c,w);
}
function sphere(m,r=1,center=[0,0,0],c=0){
for(let j=1;j<38;j++){let lat=-Math.PI/2+j*Math.PI/38;curve(m,t=>{let a=t*TAU,rr=r*Math.cos(lat);return[center[0]+rr*Math.cos(a),center[1]+r*Math.sin(lat),center[2]+rr*Math.sin(a)]},96,c,j%4===0?1.4:.65,.75)}
for(let j=0;j<28;j++){let a=j*TAU/28;curve(m,t=>{let lat=-Math.PI/2+t*Math.PI;return[center[0]+r*Math.cos(lat)*Math.cos(a),center[1]+r*Math.sin(lat),center[2]+r*Math.cos(lat)*Math.sin(a)]},60,c,.65,.45)}
}
function box(m,x,y,z,w,h,d,c=0){
const a=[[x-w/2,y,z-d/2],[x+w/2,y,z-d/2],[x+w/2,y,z+d/2],[x-w/2,y,z+d/2]];
path(m,[...a,a[0]],c,1.4);
let b=a.map(v=>[v[0],v[1]+h,v[2]]);path(m,[...b,b[0]],c,1.4);
for(let k=0;k<4;k++)line(m,a[k],b[k],c,1);
for(let j=.08;j<h;j+=.10)line(m,[x-w/2,y+j,z-d/2],[x+w/2,y+j,z-d/2],c,.6,.5);
}
function build(kind,index){
let m=[],rand=rng(500+index);
if(kind==='seed'){

for(let j=0;j<28;j++){
let a=j*TAU/28;
curve(m,t=>{let q=t*Math.PI,rad=1.23+.12*Math.sin(q*9+a);return[rad*Math.sin(q)*Math.cos(a),.2-1.2*Math.cos(q),rad*Math.sin(q)*Math.sin(a)]},64,0,.9,.65);
}
sphere(m,.43,[0,.2,0],1);
for(let k=0;k<90;k++){let a=rand()*TAU,z=rand()*2-1,r=Math.sqrt(1-z*z),rr=1.5+rand()*.6;line(m,[r*Math.cos(a)*rr,z*rr+.2,r*Math.sin(a)*rr],[r*Math.cos(a)*(rr+.09),z*(rr+.09)+.2,r*Math.sin(a)*(rr+.09)],1,.8,.7)}

for(let j=0;j<90;j++){let z=-3.5+j*.075;curve(m,t=>{let x=(t-.5)*6.4;return[x,-.4+.24*Math.sin(x*2+z*1.8)+.09*Math.sin(x*7-z*3),z]},80,j>38&&j<45?1:0,j%6===0?1.5:.7,.85)}

}
for(let j=0;j<18;j++)curve(m,t=>{let a=t*TAU;return[.19*Math.cos(a)*Math.sin(j*Math.PI/18),.55*Math.sin(a),.16*Math.sin(a+j*.2)]},60,0,.9);
sphere(m,.20,[0,.48,0],1);
line(m,[.12,.52,0],[.34,.48,.03],1,1.7);
for(let j=0;j<15;j++)line(m,[0,-.3,0],[(j-7)*.05,-1.1-Math.abs(j-7)*.014,.18],0,1);
for(let j=0;j<5;j++)circle(m,1.6+j*.09,-1.45,0,.6);
}
if(kind==='city'){
for(let k=0;k<38;k++){let a=k*2.39996,r=.35+Math.sqrt(k/38)*2.1,x=Math.cos(a)*r,z=Math.sin(a)*r,h=.45+rand()*1.95;box(m,x,-1.4,z,.13+rand()*.22,h,.15+rand()*.22,k%11===0?1:0);
if(k%3===0)line(m,[x,-1.4+h,z],[x,-1.4+h+.35,z],0,.9)}
for(let i=0;i<18;i++)circle(m,.4+i*.13,-1.42,0,.6);
sphere(m,.84,[0,1.4,-1.55],1);
}
if(kind==='stairs'){
for(let i=0;i<48;i++){
let a=i*.23,y=-1.6+i*.067,r=.94;
let points=[[.24*Math.cos(a),y,.24*Math.sin(a)],[1.4*Math.cos(a),y,1.4*Math.sin(a)],[1.4*Math.cos(a+.19),y,1.4*Math.sin(a+.19)],[.24*Math.cos(a+.19),y,.24*Math.sin(a+.19)]];

for(let k=0;k<7;k++){let t=k/7;line(m,[mix(points[0][0],points[1][0],t),y,mix(points[0][2],points[1][2],t)],[mix(points[3][0],points[2][0],t),y,mix(points[3][2],points[2][2],t)],0,.65,.6)}

}
curve(m,t=>{let a=t*47*.23;return[1.4*Math.cos(a),-1.22+t*47*.067,1.4*Math.sin(a)]},180,1,1.7);
for(let j=0;j<20;j++){let a=j*TAU/20;line(m,[.18*Math.cos(a),-1.6,.18*Math.sin(a)],[.18*Math.cos(a),1.6,.18*Math.sin(a)],0,.65)}
}
if(kind==='heart'){
const hp=(a,s,z)=>[s*.083*16*Math.pow(Math.sin(a),3),s*.083*(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a))+.2,z];
for(let i=0;i<52;i++){let z=-.72+1.44*i/51,s=Math.sqrt(Math.max(0,1-z*z/.72/.72));curve(m,t=>hp(t*TAU,s,z),110,i%10===0?1:0,i%5===0?1.4:.8,.8)}
for(let j=0;j<48;j++){let a=j*TAU/48;curve(m,t=>{let u=-Math.PI/2+t*Math.PI;return hp(a,Math.cos(u),.72*Math.sin(u))},60,0,.7,.55)}
for(let j=0;j<8;j++)circle(m,1.7+j*.12,0,j<2?1:0,.65,'xy');
}
if(kind==='eye'){
for(let j=0;j<22;j++){let f=j/22;curve(m,t=>{let a=t*TAU,x=2.25*Math.cos(a),y=.87*Math.sin(a)*(1-f*.7);return[x,y,.35*Math.sin(a)*Math.sin(a)+f*.1]},96,0,j%5===0?1.4:.6,.7)}
sphere(m,.71,[0,0,.35],1);
for(let j=0;j<88;j++){let a=j*TAU/88;curve(m,t=>{let r=.28+t*.37;return[r*Math.cos(a),r*Math.sin(a),.96+.035*Math.sin(t*30+a*7)]},24,j%7===0?1:0,.8,.8)}
for(let j=0;j<18;j++)circle(m,1+j*.11,-1.45,0,.7);
for(let s of [-1,1])for(let j=0;j<16;j++){let a=.15+j*.17;line(m,[2.12*Math.cos(a),s*.87*Math.sin(a),.1],[2.28*Math.cos(a),s*(.87*Math.sin(a)+.2),.1],0,.9)}
}
if(kind==='tree'){
function branch(a,angle,len,depth,root=false){
let b=[a[0]+Math.sin(angle)*len,a[1]+Math.cos(angle)*len*(root?-1:1),a[2]+(rand()-.5)*len*.5];
for(let j=0;j<Math.max(2,depth*2);j++){let off=(j-depth)*.011;

else{for(let j=0;j<3;j++)curve(m,t=>[b[0]+Math.sin(t*TAU)*.07,b[1]+Math.cos(t*TAU)*.12,b[2]+j*.025],20,1,.6,.65)}
}
branch([0,-.7,0],0,.85,5);
branch([0,-.7,0],-.7,.53,4,true);branch([0,-.7,0],.7,.53,4,true);
for(let j=0;j<7;j++)circle(m,1.1+j*.12,-1.9,0,.6);

if(kind==='door'){
for(let j=0;j<10;j++){
let z=-3+j*.62,w=1.02,h=1.55;
for(let k=0;k<6;k++){let e=k*.026;path(m,[[-w-e,-h,z],[-w-e,h,z],[w+e,h,z],[w+e,-h,z]],j===0?1:0,k===0?1.8:.65,.65)}

for(let k=-12;k<=12;k++)line(m,[k*.22,-1.56,-4],[k*.22,-1.56,3],0,.7,.6);
for(let j=0;j<35;j++)line(m,[-2.7,-1.56,-4+j*.2],[2.7,-1.56,-4+j*.2],0,.6,.5);
sphere(m,.19,[0,-.54,-3.1],1);
path(m,[[-.12,-.74,-3.1],[-.2,-1.3,-3.1],[.2,-1.3,-3.1],[.12,-.74,-3.1]],1,2);
}
if(kind==='sun'){
sphere(m,1.16,[0,.38,0],1);
for(let k=0;k<100;k++){let a=k*TAU/100,r=1.35,r2=1.6+.43*Math.pow(Math.sin(a*7),2);line(m,[r*Math.cos(a),.38+r*Math.sin(a),0],[r2*Math.cos(a),.38+r2*Math.sin(a),0],k%4===0?1:0,k%5===0?1.8:.7,.85)}
for(let j=0;j<38;j++){let z=-3+j*.16;curve(m,t=>{let x=(t-.5)*6;return[x,-1.4+.07*Math.sin(x*4+z*3),z]},60,0,.7,.65)}
circle(m,1.31,.38,1,1.2,'xy');

}
for(let i=0;i<10;i++)models.push(build(scenes[i].kind,i));
const particles=[];let pr=rng(781);
for(let i=0;i<175;i++)particles.push([pr()*PW,pr()*PH,pr(),pr()*TAU]);
const grain=document.createElement('canvas');grain.width=270;grain.height=480;
let gc=grain.getContext('2d'),im=gc.createImageData(270,480),gr=rng(7891);
for(let i=0;i<im.data.length;i+=4){let v=gr()>.58?220:0;im.data[i]=v;im.data[i+1]=v*.96;im.data[i+2]=v*.87;im.data[i+3]=gr()*20}
gc.putImageData(im,0,0);
function text(c,s,x,y,size,color=bone,align='left',font='monospace'){
c.fillStyle=color;c.font=`${size}px ${font}`;c.textAlign=align;c.fillText(s,x,y);
}
function spaced(c,s,x,y,size,spacing,color=bone){
c.font=`${size}px monospace`;let width=[...s].reduce((a,b)=>a+c.measureText(b).width+spacing,0)-spacing;
c.fillStyle=color;let xx=x-width/2;for(let ch of s){c.fillText(ch,xx,y);xx+=c.measureText(ch).width+spacing}
}
function drawModel(c,index,u,time,alpha){
const kind=scenes[index].kind;
let yaw=.28+u*.55,pitch=.12+Math.sin(u*Math.PI)*.07,dist=6.8;
if(kind==='river'){yaw=-.12+u*.22;pitch=.52;dist=7.4}
if(kind==='bird'){yaw=-.35+u*.7;pitch=.12;dist=7.4}
if(kind==='city'){yaw=.3+u*.6;pitch=.30;dist=7.8}
if(kind==='stairs'){yaw=-.3+u*.9;pitch=.16-u*.18}
if(kind==='heart'){yaw=-.23+u*.46;dist=7.1-u*.55;pitch=.04}
if(kind==='eye'){yaw=-.12+u*.24;pitch=.12;dist=7.4}
if(kind==='tree'){yaw=-.35+u*.55;pitch=.03;dist=7.7}
if(kind==='door'){yaw=.035*Math.sin(u*Math.PI);pitch=.02;dist=8.4-u*1.8}

let x=v[0],y=v[1],z=v[2];

if(kind==='tree')x+=Math.max(0,y)*.025*Math.sin(time*1.3+y);

let sorted=models[index].map(a=>({a,z:a.points.reduce((s,v)=>s+(-v[0]*sy+v[2]*cy),0)/a.points.length})).sort((a,b)=>a.z-b.z);

function drawPortrait(t){

/* Local instrumental: 96 BPM, 80 beats, ten five-second phrases.
   K-weighted, gated loudness measurement controls gain before playback. */
let audioContext=null,audioBuffer=null,source=null,audioEnabled=false;
function makeScore(ac){
const sr=24000,len=sr*50,b=ac.createBuffer(2,len,sr),L=b.getChannelData(0),R=b.getChannelData(1),random=rng(8113);
const hz=n=>440*Math.pow(2,(n-69)/12),beat=.625;
function tone(at,duration,midi,amp,pan,type){
let st=Math.floor(at*sr),N=Math.floor(duration*sr),f=hz(midi);
for(let j=0;j<N&&st+j<len;j++){
let t=j/sr,q=t/duration,e=Math.min(1,t/.035)*Math.pow(1-q,type===1?2:1.3);
let a=Math.sin(TAU*f*t),v;
if(type===1)v=(a+.22*Math.sin(TAU*f*2*t)+.1*Math.sin(TAU*f*3*t))*e;
else v=(a*.6+Math.sin(TAU*f*1.003*t)*.25+Math.sin(TAU*f*.5*t)*.15)*e;
let fade=Math.min(1,(50-at-t)/.8);v*=amp*Math.max(0,fade);
L[st+j]+=v*Math.sqrt((1-pan)*.5);R[st+j]+=v*Math.sqrt((1+pan)*.5);
}
}
function drum(at,kind,amp){
let st=Math.floor(at*sr),dur=kind===0?.31:kind===1?.18:.07,N=Math.floor(dur*sr),phase=0;
for(let j=0;j<N&&st+j<len;j++){
let t=j/sr,v;
if(kind===0){phase+=TAU*(42+110*Math.exp(-t*35))/sr;v=Math.sin(phase)*Math.exp(-t*16)}
else {let noise=random()*2-1;v=noise*Math.exp(-t*(kind===1?29:80));if(kind===1)v=.8*v+.2*Math.sin(TAU*175*t)*Math.exp(-t*23)}
let a=v*amp;L[st+j]+=a;R[st+j]+=a;
}
}
const chords=[[50,57,62,65],[46,53,58,62],[41,48,57,60],[48,55,60,64]];
const melody=[[74,77,76,72],[70,74,77,74],[69,72,76,77],[72,76,74,69]];
for(let bar=0;bar<20;bar++){
let at=bar*4*beat,c=chords[Math.floor(bar/2)%4],volume=bar<2?.68:bar>17?.78:1;
c.forEach((n,j)=>tone(at,2.6,n,.085*volume,(j-1.5)*.35,0));
for(let k=0;k<4;k++){
let bt=at+k*beat;
tone(bt,.43,c[0]-12,.22*volume,0,1);
drum(bt,0,.28*volume);
if((k===1||k===3)&&bar>1)drum(bt,1,.095*volume);
if(bar>1){drum(bt,2,.025);drum(bt+beat/2,2,.018)}
let n=melody[Math.floor(bar/2)%4][k];
tone(bt+.015,.53,n,.065*volume,Math.sin(bar+k)*.5,1);
if(bar>7&&bar<17)tone(bt+beat/2,.25,c[2]+12,.026,(k%2?-.6:.6),1);
}
}
function biquad(data,b0,b1,b2,a1,a2){
let out=new Float32Array(data.length),x1=0,x2=0,y1=0,y2=0;
for(let i=0;i<data.length;i++){let x=data[i],y=b0*x+b1*x1+b2*x2-a1*y1-a2*y2;out[i]=y;x2=x1;x1=x;y2=y1;y1=y}
return out;
}
function weighted(data){
let K=Math.tan(Math.PI*1681.974450955533/sr),Vh=Math.pow(10,3.99984385397/20),Vb=Math.pow(Vh,.49966677415454),Q=.7071752369554196,a0=1+K/Q+K*K;
let x=biquad(data,(Vh+Vb*K/Q+K*K)/a0,2*(K*K-Vh)/a0,(Vh-Vb*K/Q+K*K)/a0,2*(K*K-1)/a0,(1-K/Q+K*K)/a0);
K=Math.tan(Math.PI*38.13547087602444/sr);Q=.5003270373238773;a0=1+K/Q+K*K;
return biquad(x,1/a0,-2/a0,1/a0,2*(K*K-1)/a0,(1-K/Q+K*K)/a0);
}
let wl=weighted(L),wr=weighted(R),blocks=[],N=Math.floor(sr*.4),hop=Math.floor(sr*.1);
for(let st=0;st+N<len;st+=hop){let e=0;for(let j=st;j<st+N;j++)e+=wl[j]*wl[j]+wr[j]*wr[j];e/=N;if(-.691+10*Math.log10(e+1e-20)>-70)blocks.push(e)}
let average=blocks.reduce((a,v)=>a+v,0)/blocks.length,gate=average*.1,gated=blocks.filter(v=>v>gate);
average=gated.reduce((a,v)=>a+v,0)/gated.length;
let lufs=-.691+10*Math.log10(average),gain=Math.pow(10,(-14-lufs)/20),peak=0;
for(let j=0;j<len;j++){L[j]*=gain;R[j]*=gain;peak=Math.max(peak,Math.abs(L[j]),Math.abs(R[j]))}
if(peak>.98){let scale=.98/peak;for(let j=0;j<len;j++){L[j]*=scale;R[j]*=scale}}
return b;
}

});
