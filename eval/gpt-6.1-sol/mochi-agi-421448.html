 }
 // Hem obscures the feet; the body remains a back view.

 poly(c,[[-37,249],[-8,249],[-9,260],[-46,262]],'#010509');poly(c,[[17,249],[45,249],[55,260],[15,263]],'#010509');
 for(let i=0;i<14;i++){let xx=-36+rnd()*76;line(c,xx,12+rnd()*48,xx*1.1,151,'rgba(128,145,145,.07)',1)}
 c.fillStyle='#58635c';c.beginPath();c.moveTo(-29,-66);c.lineTo(24,-68);c.lineTo(37,-48);c.quadraticCurveTo(0,-25,-38,-48);c.fill();
 poly(c,[[17,-52],[34,-49],[26,42],[11,37]],'#4a564f');

 line(c,26,-102,35,-100,'#02080b',3);

function lips(c){
 c.fillStyle=grad(c,0,0,W,H,[[0,'#070b12'],[.45,'#151e25'],[.8,'#252c2e'],[1,'#04080e']]);c.fillRect(0,0,W,H);

 for(let i=0;i<87;i++){

 }
 c.strokeStyle='rgba(207,181,155,.12)';c.lineWidth=2;c.beginPath();c.moveTo(-126,66);c.quadraticCurveTo(-11,88,120,62);c.stroke();
 glow(c,0,134,237,44,'#020609',.4);c.restore();
 // Hair at the edges only.
 for(let i=0;i<60;i++){
 let left=i<30,x=left?50+rnd()*200:1065+rnd()*140;

 c.beginPath();c.moveTo(x,-20);c.bezierCurveTo(x-60,170,x+30,430,x-80,H+20);c.stroke();

function train(c){
 // One painted image of a train passing without stopping.
 poly(c,[[844,229],[1280,157],[1280,660],[896,313]],grad(c,0,190,0,630,[[0,'#172d32'],[.5,'#3b5050'],[1,'#121e26']]));

const plates=[];

 let back=surface(),mid=surface(),front=surface();

 {speaker:'男',line:'よかった。誰もいなくて……',start:.7,rate:.055},
 {speaker:'男',line:'今の電車……止まってない。',start:.5,rate:.065},
 {speaker:'女',line:'止まらなくても、乗れるの。',start:.35,rate:.22},
 {speaker:'男',line:'あなた……足は……！？',start:.55,rate:.065,shake:3},
 {speaker:'女',line:'見ないで。次は、あなた。',start:.3,rate:.24},
 {speaker:'女',line:'お帰りなさい。',start:.6,rate:.32}
];
const duration=5;
function clamp(v,a=0,b=1){return Math.max(a,Math.min(b,v))}
function smooth(t){t=clamp(t);return t*t*(3-2*t)}
function drawPlate(i,u,alpha){
 ctx.save();ctx.globalAlpha=alpha;
 const push=[.043,.046,.067,.042,.034,.073,.052,.058,.05][i];
 for(let j=0;j<3;j++){
 let depth=1+j*.5,sc=1.035+u*push*depth;
 let dx=([9,-9,13,3,-16,-10,7,-11,8][i])*(u-.5)*depth;
 let dy=(i===6?-7:3)*(u-.5)*depth;
 ctx.save();ctx.translate(640+dx,360+dy);ctx.scale(sc,sc);ctx.drawImage(plates[i][j],-640,-360);ctx.restore();
 }
 ctx.restore();
}
function vertical(str,x,y,size,alpha){
 ctx.save();ctx.font=`${size}px ${serif}`;ctx.textAlign='center';ctx.textBaseline='middle';
 ctx.shadowColor='#020408';ctx.shadowBlur=11;
 [...str].forEach((ch,n)=>{
 let yy=y+n*(size+10),xx=x;
 if('、。'.includes(ch)){xx+=size*.29;yy-=size*.28}
 ctx.fillStyle=`rgba(220,226,218,${alpha})`;ctx.fillText(ch,xx,yy);
 });
 ctx.restore();
}
function captions(i,local,time,alpha=1){
 let s=scenes[i];if(!s.line||local<s.start)return;
 let elapsed=local-s.start,count=Math.min(s.line.length,Math.floor(elapsed/s.rate)+1),str=s.line.slice(0,count);
 let fade=smooth(elapsed/.32)*smooth((5-local)/.42)*alpha;
 if(s.speaker==='女'){
 // Vertical mincho, revealed at a breath-soft cadence.
 let chars=[...str],col1=chars.slice(0,10).join(''),col2=chars.slice(10).join('');
 vertical(col1,1132,147,27,fade*.89);
 if(col2)vertical(col2,1084,147,27,fade*.89);
 }else{
 ctx.save();ctx.font=`30px ${serif}`;ctx.textBaseline='alphabetic';
 let width=ctx.measureText(s.line).width,xx=(W-width)/2;
 let amplitude=s.shake||((i===4)?1.05:.14);
 for(let n=0;n<str.length;n++){
 let ch=str[n],jitterX=Math.sin(time*81+n*13.7)*amplitude,jitterY=Math.sin(time*96+n*8.1)*amplitude*.75;
 ctx.shadowColor='#000';ctx.shadowBlur=12;ctx.fillStyle=`rgba(233,233,221,${fade})`;
 ctx.fillText(ch,xx+jitterX,602+jitterY);xx+=ctx.measureText(ch).width;
 }ctx.restore();
 }
}
function typography(t){
 if(t<4.8){
 let a=smooth((t-.5)/1.1)*smooth((4.7-t)/.8);
 ctx.save();ctx.globalAlpha=a;
 text(ctx,'終 電',99,203,57,'#ccd7ce');
 line(ctx,102,232,235,232,'#5f7972',1);
 text(ctx,'零時十七分',104,262,15,'#93a8a0');
 text(ctx,'白鷺駅  ／  二番線',104,288,12,'#69817b');
 ctx.restore();
 }
 if(t>42.2){
 let a=smooth((t-42.2)/1.2);
 ctx.save();ctx.globalAlpha=a;
 text(ctx,'終 電',105,228,51,'#bfcfc4');
 text(ctx,'降りる人は、いない。',109,267,16,'#899e94');ctx.restore();
 }
}
// Optional locally synthesized ambience. No files, network, or voice service.
// Audio is unlocked only by a viewer gesture; the film itself autoplays.
let audio=null;
function unlock(){
 if(audio)return;
 try{
 let A=window.AudioContext||window.webkitAudioContext;if(!A)return;
 let ac=new A(),master=ac.createGain();master.gain.value=.15;master.connect(ac.destination);
 let buffer=ac.createBuffer(1,ac.sampleRate*3,ac.sampleRate),data=buffer.getChannelData(0);
 let k=19,v=0;
 for(let i=0;i<data.length;i++){k=(k*1664525+1013904223)>>>0;v=.97*v+.03*((k/4294967296)*2-1);data[i]=v*3}
 let noise=ac.createBufferSource();noise.buffer=buffer;noise.loop=true;
 let filter=ac.createBiquadFilter();filter.type='lowpass';filter.frequency.value=850;
 let ng=ac.createGain();ng.gain.value=.22;noise.connect(filter);filter.connect(ng);ng.connect(master);noise.start();
 let drone=ac.createOscillator();drone.type='sine';drone.frequency.value=47;
 let dg=ac.createGain();dg.gain.value=.25;drone.connect(dg);dg.connect(master);drone.start();
 let high=ac.createOscillator();high.type='sine';high.frequency.value=141;
 let hg=ac.createGain();hg.gain.value=.035;high.connect(hg);hg.connect(master);high.start();
 audio={ac,ng,filter,dg,hg};ac.resume();
 }catch(e){}
}
canvas.addEventListener('pointerdown',unlock);
const start=performance.now();
function frame(now){
 const t=((now-start)/1000+offset)%window.DUR,tt=(t+window.DUR)%window.DUR;
 let i=Math.min(8,Math.floor(tt/duration)),local=tt-i*duration,u=local/duration;
 ctx.fillStyle='#030609';ctx.fillRect(0,0,W,H);
 // Slow parallax is the only scene movement: nine static layered paintings.
 let transition=.58;
 if(local<transition&&i>0){
 drawPlate(i-1,1,1);drawPlate(i,u,smooth(local/transition));
 }else drawPlate(i,u,1);
 ctx.drawImage(vignette,0,0);
 let bottom=ctx.createLinearGradient(0,470,0,H);bottom.addColorStop(0,'transparent');bottom.addColorStop(1,'rgba(0,4,9,.76)');ctx.fillStyle=bottom;ctx.fillRect(0,470,W,250);
 // Film grain, not object animation.
 ctx.save();ctx.globalAlpha=.25;ctx.translate(Math.floor(Math.sin(tt*19)*6),Math.floor(Math.cos(tt*23)*5));ctx.drawImage(grain,-7,-7,W+14,H+14);ctx.restore();
 ctx.fillStyle='#000';ctx.fillRect(0,0,W,43);ctx.fillRect(0,677,W,43);
 captions(i,local,tt);
 typography(tt);
 // Quiet visual bookends.
 let fadeIn=1-smooth(tt/1.3),fadeOut=smooth((tt-44.05)/.95);
 if(fadeIn>0||fadeOut>0){ctx.fillStyle=`rgba(0,0,0,${Math.max(fadeIn,fadeOut)})`;ctx.fillRect(0,0,W,H)}
 if(audio){
 let trainLevel=Math.exp(-Math.pow((tt-23.0)/2.2,2));
 audio.ng.gain.value=.12+.76*trainLevel;
 audio.filter.frequency.value=430+1700*trainLevel;
 audio.dg.gain.value=.18+.14*Math.exp(-Math.pow((tt-36)/4,2));
 audio.hg.gain.value=.012+.043*Math.exp(-Math.pow((tt-31)/4,2));
 }
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
