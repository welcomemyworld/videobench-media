<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PULSE — Motion Intelligence</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform:translate(-50%,-50%) scale(var(--scale,1));background:#000}
canvas{display:block;width:1280px;height:720px}
</style>
</head>
<body>
<div id="stage"><canvas id="canvas" width="2560" height="1440"></canvas></div>
<script>
window.DUR=24;
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const W=1280,H=720,G='#c4ff53',WHITE='#f1f2ed',MUTED='#777c77',PURPLE='#b9a2ff';
const offset=Number(new URLSearchParams(location.search).get('t'))||0;
const start=performance.now();
function resize(){document.documentElement.style.setProperty('--scale',Math.min(innerWidth/W,innerHeight/H));}
addEventListener('resize',resize);resize();
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const ease=v=>{v=clamp(v);return v*v*v*(v*(v*6-15)+10)};
const mix=(a,b,v)=>a+(b-a)*v;
function round(x,y,w,h,r=12){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
function box(x,y,w,h,fill='#0b0d0b',stroke='#262b25',r=16){
 round(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke();}
}
function line(x1,y1,x2,y2,col='#262b25',width=1){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=col;ctx.lineWidth=width;ctx.stroke();}
function text(str,x,y,size=14,col=WHITE,weight=400,align='left'){
 ctx.fillStyle=col;ctx.font=`${weight} ${size}px Arial, Helvetica, sans-serif`;ctx.textAlign=align;ctx.textBaseline='alphabetic';ctx.fillText(str,x,y);
}
function tracking(str,x,y,size=10,col=MUTED,space=2){
 ctx.font=`600 ${size}px Arial, Helvetica, sans-serif`;ctx.fillStyle=col;ctx.textAlign='left';ctx.textBaseline='alphabetic';
 for(const char of str){ctx.fillText(char,x,y);x+=ctx.measureText(char).width+space;}
}
function dot(x,y,r,col){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=col;ctx.fill();}
function arrow(x,y,size=14,col=G){
 line(x-size*.5,y+size*.5,x+size*.5,y-size*.5,col,2);
 line(x-size*.2,y-size*.5,x+size*.5,y-size*.5,col,2);
 line(x+size*.5,y-size*.5,x+size*.5,y+size*.2,col,2);
}
function pill(str,x,y,w,col=G,fill='#18220e'){
 box(x,y,w,29,fill,null,15);text(str,x+w/2,y+19,10,col,600,'center');
}
function icon(x,y,type,col=MUTED){
 ctx.strokeStyle=col;ctx.lineWidth=1.5;
 if(type===0){for(let i=0;i<4;i++){round(x+(i%2)*8,y+Math.floor(i/2)*8,5,5,1);ctx.stroke();}}
 else if(type===1){line(x,y+14,x+4,y+7,col,1.5);line(x+4,y+7,x+9,y+10,col,1.5);line(x+9,y+10,x+15,y+1,col,1.5);}
 else if(type===2){for(let i=0;i<3;i++)line(x+i*6,y+15,x+i*6,y+3+i*2,col,2);}
 else {ctx.beginPath();ctx.arc(x+7,y+7,6,0,Math.PI*2);ctx.stroke();dot(x+7,y+7,2,col);}
}
function wave(x,y,w,h,t,col=G){
 ctx.beginPath();
 for(let i=0;i<=150;i++){
  const q=i/150;
  const envelope=Math.pow(Math.sin(q*Math.PI),1.4);
  const yy=y+Math.sin(q*48-t*4*Math.PI)*Math.sin(q*11+t*.7)*h*.45*envelope;
  if(i===0)ctx.moveTo(x,yy);else ctx.lineTo(x+q*w,yy);
 }
 ctx.strokeStyle=col;ctx.lineWidth=2;ctx.stroke();
}
function orbit(x,y,r,t){
 const pulse=Math.exp(-((t*2)%1)*7);
 const glow=ctx.createRadialGradient(x,y,20,x,y,r*1.5);
 glow.addColorStop(0,'rgba(196,255,83,.075)');glow.addColorStop(1,'rgba(196,255,83,0)');
 ctx.fillStyle=glow;ctx.fillRect(x-r*1.5,y-r*1.5,r*3,r*3);
 for(let i=0;i<4;i++){
  ctx.save();ctx.translate(x,y);ctx.rotate(t*.13+i*Math.PI/4);
  ctx.beginPath();ctx.ellipse(0,0,r*(.92+i*.025),r*(.25+i*.065),0,0,Math.PI*2);
  ctx.strokeStyle=i===0?'#c4ff53':i===1?'#738f43':'#313d25';ctx.lineWidth=i===0?1.8:1;ctx.stroke();ctx.restore();
 }
 ctx.beginPath();ctx.arc(x,y,42+pulse*4,0,Math.PI*2);ctx.fillStyle='#c4ff53';ctx.fill();
 ctx.fillStyle='#101609';ctx.font='900 29px Arial';ctx.textAlign='center';ctx.fillText('P',x,y+10);
 const a=t*Math.PI/2;
 dot(x+Math.cos(a)*r,y+Math.sin(a)*r*.45,5,WHITE);
 line(x-r-22,y,x-r-12,y,'#4d6040');line(x+r+12,y,x+r+22,y,'#4d6040');
 line(x,y-r-20,x,y-r-10,'#4d6040');line(x,y+r+10,x,y+r+20,'#4d6040');
}
function button(x,y,w,label,t){
 box(x,y,w,48,G,null,8);text(label,x+20,y+30,13,'#111808',700);arrow(x+w-25,y+24,12,'#111808');
}
function intro(t){
 tracking('01 / THE MANIFESTO',62,145,10,MUTED,2);
 const p=Math.exp(-((t*2)%1)*9);
 ctx.save();ctx.translate(62,0);
 text('LESS',-3,260,104,WHITE,900);
 text('NOISE.',-3,360,104,WHITE,900);
 ctx.save();ctx.translate(0,459);ctx.scale(1+p*.008,1+p*.015);text('MORE SIGNAL.',-2,0,66,G,900);ctx.restore();
 ctx.restore();
 text('A sharper rhythm for everything you create.',65,506,16,'#999e96');
 button(65,542,183,'Find your flow',t);
 tracking('LESS FRICTION. MORE FEELING.',65,623,9,'#62685e',1.7);
 box(770,157,441,431,'#080b07','#283023',18);
 tracking('SIGNAL ENGINE',794,189,10,'#959e8c',1.8);
 dot(1160,185,3,G);text('ON',1170,189,9,G,600);
 orbit(990,344,137,t);
 line(794,505,1187,505,'#252d20');
 text('Perfectly in phase.',794,538,19,WHITE,600);
 text('Human instinct. Machine precision.',794,561,12,MUTED);
 const pips=24;
 for(let i=0;i<pips;i++){
  const hh=7+21*(.5+.5*Math.sin(i*.8-t*Math.PI*4));
  box(1077+i*4.2,563-hh,2,hh,i<18?G:'#37402e',null,1);
 }
 text('120',805,478,11,G,600);text('BPM',834,478,9,MUTED);
 text('SYNC / 100%',1176,478,10,MUTED,400,'right');
}
function chart(x,y,w,h,t){
 for(let j=0;j<4;j++){
  line(x,y+j*h/3,x+w,y+j*h/3,'#22281f');
  text(String(100-j*25),x-10,y+j*h/3+4,9,'#626c5b',400,'right');
 }
 const points=[];
 for(let i=0;i<=70;i++){
  const q=i/70;
  const v=.66-.38*q+.09*Math.sin(i*.38)+.045*Math.cos(i*.95)+.025*Math.sin(t*Math.PI*4-i*.1);
  points.push([x+q*w,y+v*h]);
 }
 ctx.beginPath();ctx.moveTo(x,y+h);
 points.forEach(p=>ctx.lineTo(...p));ctx.lineTo(x+w,y+h);ctx.closePath();
 const gr=ctx.createLinearGradient(0,y,0,y+h);gr.addColorStop(0,'rgba(196,255,83,.17)');gr.addColorStop(1,'rgba(196,255,83,0)');
 ctx.fillStyle=gr;ctx.fill();
 ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.strokeStyle=G;ctx.lineWidth=2.5;ctx.stroke();
 const k=clamp((t-5)/5.5),xx=x+w*(.63+.2*Math.sin(t*.8)),idx=Math.floor((xx-x)/w*70),yy=points[idx][1];
 ctx.setLineDash([3,5]);line(xx,y,xx,y+h,'#6a7c55');ctx.setLineDash([]);dot(xx,yy,5,G);dot(xx,yy,2,'#111');
 box(xx-30,yy-34,60,23,'#c4ff53',null,5);text('98.6%',xx,yy-18,10,'#15200a',700,'center');
 for(let i=0;i<5;i++)text(['09:00','10:00','11:00','12:00','13:00'][i],x+i*w/4,y+h+22,9,'#717a69',400,'center');
}
function dashboard(t){
 tracking('02 / YOUR WORKSPACE',62,145,10,MUTED,2);
 text('Clarity, at a glance.',62,190,35,WHITE,700);
 text('Everything in sync. Nothing in your way.',63,218,13,MUTED);
 pill('ALL SYSTEMS LIVE',1057,164,153);
 box(62,246,1148,375,'#080a08','#2b3027',15);
 line(246,247,246,620);
 text('pulse',84,281,22,WHITE,800);
 const items=['Overview','Activity','Insights','Settings'];
 items.forEach((s,i)=>{
  if(i===0)box(78,306+i*47,151,37,'#192211',null,7);
  icon(91,317+i*47,i,i===0?G:'#71786a');text(s,118,330+i*47,12,i===0?G:'#959b8e',i===0?600:400);
 });
 box(78,543,151,60,'#0f140c','#293323',8);
 dot(94,562,3,G);text('Studio workspace',105,566,10,WHITE,600);text('PRO PLAN',94,587,9,'#737f67');
 const cards=[['Total sessions','24,806','+18.4%'],['Flow score','98.6','+6.2%'],['Response time','12 ms','−24.8%']];
 cards.forEach((c,i)=>{
  const x=268+i*304;
  box(x,265,285,83,'#10130e','#262c22',9);
  text(c[0],x+17,288,11,'#8e9784');
  text(c[1],x+17,326,28,WHITE,700);
  pill(c[2],x+209,307,62,G,'#1b2811');
 });
 box(268,365,585,236,'#0c100a','#262d21',10);
 text('Signal performance',289,391,13,WHITE,600);
 dot(768,387,3,G);text('Live',780,391,10,MUTED);
 chart(310,417,511,141,t);
 box(870,365,319,236,'#0c100a','#262d21',10);
 text('Recent activity',889,392,13,WHITE,600);text('VIEW ALL',1168,392,9,G,600,'right');
 const messages=[['Workflow optimized','Latency reduced by 24.8%','NOW'],['New peak detected','Flow score reached 98.6','2 MIN'],['All channels synced','8 connections, zero friction','4 MIN']];
 messages.forEach((m,i)=>{
  const yy=428+i*57;
  box(889,yy,28,28,i===0?'#1d2b12':'#191c16',null,7);icon(895,yy+6,i+1,i===0?G:'#829274');
  text(m[0],929,yy+9,11,WHITE,600);text(m[1],929,yy+27,10,MUTED);
  text(m[2],1168,yy+9,8,'#78846c',400,'right');
  if(i<2)line(889,yy+43,1168,yy+43,'#252b20');
 });
 const cx=1003+23*Math.sin((t-5)*.8),cy=480+12*Math.cos((t-5)*1.2);
 ctx.save();ctx.translate(cx,cy);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,17);ctx.lineTo(5,12);ctx.lineTo(9,20);ctx.lineTo(13,18);ctx.lineTo(8,10);ctx.lineTo(16,10);ctx.closePath();ctx.fillStyle=WHITE;ctx.fill();ctx.strokeStyle='#111';ctx.lineWidth=2;ctx.stroke();ctx.restore();
 box(cx+20,cy+20,86,24,'#252e1c','#4c6133',5);text('AI ASSIST',cx+63,cy+36,9,G,600,'center');
}
function metric(t){
 tracking('03 / BUILT ON RHYTHM',62,145,10,MUTED,2);
 box(62,177,468,438,'#080b07','#293323',18);
 tracking('CLOCK PRECISION',87,211,10,'#98a18f',1.8);
 pill('PHASE LOCKED',377,191,128);
 const p=Math.exp(-((t*2)%1)*8);
 const x=296,y=386,r=126;
 for(let i=0;i<60;i++){
  const a=i*Math.PI/30-Math.PI/2;
  const active=i<Math.floor((t*2%8)/8*60);
  const rr=r+(i%5===0?9:0);
  line(x+Math.cos(a)*r,y+Math.sin(a)*r,x+Math.cos(a)*(rr+6),y+Math.sin(a)*(rr+6),active?G:'#303a27',i%5===0?2:1);
 }
 ctx.beginPath();ctx.arc(x,y,109,0,Math.PI*2);ctx.strokeStyle='#293721';ctx.lineWidth=1;ctx.stroke();
 ctx.beginPath();ctx.arc(x,y,109,-Math.PI/2,-Math.PI/2+(t*2%8)/8*Math.PI*2);ctx.strokeStyle=G;ctx.lineWidth=3;ctx.stroke();
 text('IN SYNC',x,y-24,11,'#839574',600,'center');
 text('100',x,y+31,76,WHITE,700,'center');
 text('PERCENT',x,y+59,10,G,600,'center');
 dot(x,y-109,4+p*3,G);
 line(87,550,505,550,'#293323');
 text('ZERO DRIFT',87,577,10,MUTED,600);
 wave(321,574,183,27,t);
 text('120',587,349,180,WHITE,900);
 text('BPM',978,347,44,G,700);
 tracking('THE TEMPO OF POSSIBILITY',597,393,11,'#8d9783',2.5);
 text('LOCKED IN.',589,480,66,G,900);
 text('One beat. Infinite momentum.',595,526,19,WHITE,400);
 text('A precise pulse for a fluid experience.',596,553,14,MUTED);
 const bx=597,by=588;
 for(let i=0;i<8;i++){
  const active=Math.floor(t*2)%8===i;
  box(bx+i*70,by,57,14,active?G:'#1c2417',active?G:'#303a28',3);
 }
}
function outro(t){
 tracking('04 / KEEP THE MOMENTUM',62,145,10,MUTED,2);
 text('STAY',59,278,113,WHITE,900);
 text('IN',61,381,113,WHITE,900);
 const p=Math.exp(-((t*2)%1)*8);
 ctx.save();ctx.translate(61,484);ctx.scale(1+p*.005,1);text('MOTION.',0,0,102,G,900);ctx.restore();
 text('Good design doesn’t stand still. Neither do you.',65,530,16,'#949b8c');
 button(65,564,193,'Make your move',t);
 const x=823,y=222;
 ctx.save();ctx.translate(x+177,y+164);ctx.rotate(-.075);
 box(-172,-147,344,326,'#0c1009','#38482a',15);
 for(let i=0;i<7;i++)line(-149,-108+i*39,147,-108+i*39,'#222d1b');
 ctx.restore();
 ctx.save();ctx.translate(x+175,y+169);ctx.rotate(.055);
 box(-172,-155,344,326,'#11170c','#485d32',15);
 tracking('MOMENTUM INDEX',-145,-119,9,'#839773',1.5);
 wave(-142,10,280,147,t,'#617e42');
 ctx.restore();
 box(802,202,382,365,'#0b0f08','#4b6233',15);
 tracking('YOUR NEXT LEVEL',828,235,10,'#91a580',1.8);arrow(1154,229,13,G);
 text('Limitless.',826,291,38,WHITE,700);
 text('Built for what comes next.',828,318,13,MUTED);
 line(828,342,1158,342,'#293622');
 const heights=[35,54,46,72,64,88,101,120,139,155,177];
 for(let i=0;i<heights.length;i++){
  const hh=heights[i]*(1+.015*Math.sin(t*Math.PI*4+i));
  box(830+i*30,529-hh,19,hh,i>7?G:i>4?'#789e3f':'#354c22',null,3);
 }
 text('+128%',828,554,11,G,600);text('GROWTH WITHOUT LIMITS',1158,554,9,MUTED,500,'right');
}
function camera(t){
 if(t<4)return 0;
 if(t<5)return 1280*ease(t-4);
 if(t<10)return 1280;
 if(t<11)return 1280+1280*ease(t-10);
 if(t<16)return 2560;
 if(t<17)return 2560+1280*ease(t-16);
 if(t<22.75)return 3840;
 if(t<23.8)return 3840+1280*ease((t-22.75)/1.05);
 return 5120;
}
function background(t){
 ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
 ctx.strokeStyle='#0d100c';ctx.lineWidth=.6;
 for(let x=0;x<W;x+=40)line(x,0,x,H,'#0c0f0b',.6);
 for(let y=0;y<H;y+=40)line(0,y,W,y,'#0c0f0b',.6);
 const grad=ctx.createRadialGradient(1050,340,0,1050,340,600);
 grad.addColorStop(0,'rgba(75,98,36,.055)');grad.addColorStop(1,'rgba(0,0,0,0)');
 ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
}
function chrome(t){
 const p=Math.exp(-((t*2)%1)*8);
 for(let i=0;i<3;i++)box(62+i*8,43+(i===1?0:4),5,i===1?22:14,G,null,1);
 text('PULSE',99,61,20,WHITE,800);
 tracking('MOTION INTELLIGENCE',193,59,9,'#71796a',1.7);
 tracking('DESIGNED TO MOVE',642,58,10,'#7a8273',2.3);
 box(1040,35,99,35,'#0b1007','#303c24',18);dot(1056,52,3+p*1.3,G);text('120 BPM',1071,56,10,G,600);
 box(1151,35,59,35,'#090b08','#252d20',18);text('LIVE',1180,56,10,WHITE,600,'center');
 line(62,88,1210,88,'#252c20');
 line(62,650,1210,650,'#252c20');
 tracking('A CONTINUOUS EXPERIENCE',62,686,9,'#77816c',1.5);
 const beat=Math.floor(t*2)%8;
 for(let i=0;i<8;i++){
  const xx=507+i*35;
  box(xx,672,24,6,i===beat?G:'#293222',null,2);
  text(String(i+1).padStart(2,'0'),xx+12,695,8,i===beat?G:'#59624f',400,'center');
 }
 text('60 / 2',1040,685,11,'#69775a',500);
 tracking('FEEL THE FLOW',1104,685,9,G,1.2);
}
function frame(now){
 const t=((now-start)/1000+offset)%window.DUR;
 ctx.setTransform(2,0,0,2,0,0);
 background(t);
 ctx.save();ctx.beginPath();ctx.rect(36,109,1208,527);ctx.clip();
 const cam=camera(t);
 const zoom=1+.0018*Math.exp(-((t*2)%1)*9);
 ctx.translate(640,360);ctx.scale(zoom,zoom);ctx.translate(-640,-360);
 const scenes=[intro,dashboard,metric,outro,intro];
 for(let i=0;i<5;i++){
  const dx=i*1280-cam;
  if(dx>-1280&&dx<1280){ctx.save();ctx.translate(dx,0);scenes[i](t);ctx.restore();}
 }
 ctx.restore();chrome(t);
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
