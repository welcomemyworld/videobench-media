<script>
(()=>{

const canvas=document.getElementById("c"),ctx=canvas.getContext("2d"),stage=document.getElementById("stage");
const W=1280,H=720,INK="#17221f",CREAM="#f4f3eb",BLUE="#354bff",ORANGE="#ff704c",LIME="#d9f56b",WHITE="#ffffff";
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const ease=v=>1-Math.pow(1-clamp(v),3);

const noise=document.createElement("canvas");noise.width=320;noise.height=180;
const nx=noise.getContext("2d"),nd=nx.createImageData(320,180);
let seed=31246;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}

function lines(a,x,y,size,color=INK,weight=700,leading=1.07){a.forEach((s,i)=>txt(s,x,y+i*size*leading,size,color,weight))}
function line(x,y,x2,y2,color,w=1){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x2,y2);ctx.strokeStyle=color;ctx.lineWidth=w;ctx.stroke()}
function circle(x,y,r,color){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=color;ctx.fill()}
function shadow(fn,blur=28,alpha=.12){ctx.save();ctx.shadowColor=`rgba(23,34,31,${alpha})`;ctx.shadowBlur=blur;ctx.shadowOffsetY=12;fn();ctx.restore()}
function appear(p,dx,dy,fn){if(p<=0)return;ctx.save();ctx.globalAlpha*=p;ctx.translate(dx*(1-p),dy*(1-p));fn();ctx.restore()}
function chip(label,x,y,w,color=INK,fill=null){rr(x,y,w,34,17,fill,fill?null:rgba(color,.22));txt(label,x+w/2,y+23,12,color,700,"center")}
function arrow(x,y,color=INK,size=24){line(x,y,x+size,y,color,2.5);line(x+size,y,x+size-7,y-7,color,2.5);line(x+size,y,x+size-7,y+7,color,2.5)}
function icon(x,y,s=30,color=BLUE){ctx.save();ctx.translate(x,y);rr(0,0,s,s,s*.27,color);ctx.strokeStyle=CREAM;ctx.lineWidth=s*.086;ctx.lineCap="round";ctx.lineJoin="round";ctx.beginPath();ctx.moveTo(s*.23,s*.67);ctx.lineTo(s*.23,s*.36);ctx.quadraticCurveTo(s*.23,s*.25,s*.35,s*.32);ctx.lineTo(s*.5,s*.48);ctx.lineTo(s*.65,s*.32);ctx.quadraticCurveTo(s*.77,s*.25,s*.77,s*.36);ctx.lineTo(s*.77,s*.67);ctx.stroke();ctx.restore()}

function selectBox(x,y,w,h,p,color=BLUE){

const scenes=[
{start:0,end:4.5,bg:CREAM,dark:false,label:"MAKE THE SCENE",fn:scene0},
{start:4.5,end:9,bg:CREAM,dark:false,label:"FIND YOUR FORMAT",fn:scene1},
{start:9,end:16,bg:CREAM,dark:false,label:"MAKE IT YOURS",fn:scene2},

{start:26,end:32,bg:CREAM,dark:false,label:"YOUR NEXT STORY",fn:scene5}
];
let offset=Number(new URLSearchParams(location.search).get("t"))||0;offset=((offset%window.DUR)+window.DUR)%window.DUR;
let origin=null;
function drawScene(index,time,alpha=1,shift=0){
const s=scenes[index],local=time-s.start;ctx.save();ctx.globalAlpha=alpha;ctx.translate(shift,0);s.fn(local);ctx.restore();
}
function render(now){
if(origin===null)origin=now;
const time=((now-origin)/1000+offset)%window.DUR;
let idx=scenes.findIndex(s=>time>=s.start&&time<s.end);if(idx<0)idx=0;
const s=scenes[idx],local=time-s.start;
let blend=idx>0?smooth(local/.44):0;
if(idx>0&&local<.44){
const prev=scenes[idx-1];
bg(prev.bg,time,prev.dark);
ctx.save();ctx.globalAlpha=blend;ctx.fillStyle=s.bg;ctx.fillRect(0,0,W,H);ctx.restore();
drawScene(idx-1,Math.min(time,prev.end-.001),1-blend,-60*blend);
drawScene(idx,time,blend,60*(1-blend));
}else{bg(s.bg,time,s.dark);drawScene(idx,time)}
branding(s.dark,time);foot(s.dark,idx+1,s.label,idx!==5);
if(time>31.65){let p=smooth((time-31.65)/.35);ctx.save();ctx.globalAlpha=p;ctx.fillStyle=CREAM;ctx.fillRect(0,0,W,H);ctx.restore();ctx.save();ctx.globalAlpha=p;branding(false,0);foot(false,1,scenes[0].label,true);ctx.restore()}
requestAnimationFrame(render);
}
requestAnimationFrame(render);
})();
