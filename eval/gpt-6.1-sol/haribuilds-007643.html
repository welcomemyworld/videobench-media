<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Point Nemo — The Oceanic Pole of Inaccessibility</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:#000;overflow:hidden}body{display:flex;align-items:center;justify-content:center}canvas{display:block;width:min(100vw,177.7778vh);height:min(56.25vw,100vh)}
</style>
</head>
<body>
<canvas id="stage" width="1280" height="720" aria-label="Animated data story about Point Nemo, distance to land, orbital altitude, and spacecraft reentry"></canvas>
<script>
(()=>{
'use strict';
const c=document.getElementById('stage'),g=c.getContext('2d');
window.DUR=48;
const offset=Number(new URLSearchParams(location.search).get('t'))||0;
const PI=Math.PI,RAD=PI/180;
const C={ink:'#07121e',white:'#eef5f5',muted:'#94aebc',teal:'#62e3d4',blue:'#469edd',orange:'#ffb878'};
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>{x=clamp(x);return x*x*(3-2*x)};
function text(s,x,y,size=18,color=C.white,weight=400,align='left'){
 g.fillStyle=color;g.font=`${weight} ${size}px Arial, sans-serif`;g.textAlign=align;g.textBaseline='alphabetic';g.fillText(s,x,y);
}
function line(x1,y1,x2,y2,color,width=1){g.strokeStyle=color;g.lineWidth=width;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke()}
function circle(x,y,r,color,width=1){g.strokeStyle=color;g.lineWidth=width;g.beginPath();g.arc(x,y,r,0,PI*2);g.stroke()}
function dot(x,y,r,color){g.fillStyle=color;g.beginPath();g.arc(x,y,r,0,PI*2);g.fill()}
function spaced(s,x,y,size=12,color=C.muted,space=2){
 g.font=`600 ${size}px Arial`;g.fillStyle=color;g.textAlign='left';
 for(const ch of s){g.fillText(ch,x,y);x+=g.measureText(ch).width+space}
}
const continents=[
[[-168,72],[-155,71],[-145,69],[-137,59],[-130,55],[-125,49],[-124,41],[-117,32],[-110,29],[-105,22],[-97,16],[-88,15],[-83,9],[-78,8],[-80,20],[-87,22],[-82,25],[-81,31],[-75,36],[-70,44],[-60,48],[-56,53],[-65,60],[-74,62],[-84,70],[-102,73],[-115,69],[-135,70],[-155,71]],
[[-81,12],[-73,11],[-63,10],[-51,4],[-35,-6],[-38,-15],[-40,-22],[-48,-29],[-52,-33],[-57,-38],[-65,-47],[-67,-55],[-74,-52],[-75,-43],[-73,-34],[-71,-28],[-70,-18],[-77,-9],[-81,-3]],
[[113,-22],[114,-28],[115,-34],[122,-35],[130,-32],[136,-35],[140,-38],[147,-39],[152,-32],[153,-25],[148,-20],[145,-15],[142,-11],[136,-12],[130,-14],[126,-14],[122,-18]],
[[166,-46],[168,-46],[173,-42],[174,-40],[172,-41],[169,-43]],
[[174,-41],[177,-39],[178,-37],[175,-35],[174,-37],[174,-39]],
[[-180,-78],[-160,-77],[-145,-74],[-130,-73],[-112,-74],[-99,-73],[-83,-73],[-74,-69],[-66,-64],[-61,-63],[-58,-66],[-62,-71],[-47,-77],[-30,-78],[-10,-72],[10,-70],[35,-69],[55,-66],[80,-67],[100,-66],[120,-66],[140,-67],[160,-70],[180,-78],[180,-90],[-180,-90]],
[[-17,35],[4,37],[12,33],[26,32],[35,29],[43,12],[51,11],[42,-1],[39,-15],[32,-29],[19,-35],[12,-17],[9,4],[-5,5],[-16,15]],
[[-10,36],[-9,44],[-1,49],[7,54],[21,59],[30,70],[45,69],[62,73],[100,76],[135,72],[179,66],[173,55],[160,59],[142,50],[134,41],[122,31],[109,21],[105,10],[98,6],[90,22],[78,8],[70,24],[54,26],[44,40],[30,41],[23,38],[15,40],[8,44]],
[[-52,60],[-42,61],[-23,69],[-20,77],[-39,83],[-60,78],[-65,67]]
];
function inside(x,y,p){
 let b=false;for(let i=0,j=p.length-1;i<p.length;j=i++){
 const a=p[i],d=p[j];
 if(((a[1]>y)!=(d[1]>y))&&(x<(d[0]-a[0])*(y-a[1])/(d[1]-a[1])+a[0]))b=!b;
 }return b;
}
const lon0=-123.393333*RAD,lat0=-48.876667*RAD;
function project(lon,lat){
 const a=lat*RAD,b=lon*RAD-lon0;
 return {x:Math.cos(a)*Math.sin(b),y:-(Math.cos(lat0)*Math.sin(a)-Math.sin(lat0)*Math.cos(a)*Math.cos(b)),
 z:Math.sin(lat0)*Math.sin(a)+Math.cos(lat0)*Math.cos(a)*Math.cos(b)};
}
const earth=document.createElement('canvas');earth.width=600;earth.height=600;
const eg=earth.getContext('2d'),im=eg.createImageData(600,600);
for(let py=0;py<600;py++)for(let px=0;px<600;px++){
 const x=(px-299.5)/298,y=-(py-299.5)/298,r2=x*x+y*y;if(r2>1)continue;
 const z=Math.sqrt(1-r2),lat=Math.asin(y*Math.cos(lat0)+z*Math.sin(lat0));
 let lon=lon0+Math.atan2(x,z*Math.cos(lat0)-y*Math.sin(lat0));
 lon=(lon/RAD+540)%360-180;
 const land=continents.some(p=>inside(lon,lat/RAD,p));
 const light=clamp(.66+.20*z-.15*x+.12*y,.25,1);
 const h=Math.sin(px*.093+py*.141)*Math.sin(py*.033-px*.026);
 const base=land?[46,85,94]:[9,38,62];
 const k=(py*600+px)*4;
 im.data[k]=base[0]*light+h*1.8;im.data[k+1]=base[1]*light+h*2;im.data[k+2]=base[2]*light+h*2.8;im.data[k+3]=255;
}
eg.putImageData(im,0,0);
function globe(cx,cy,r,t,grid=true){
 const halo=g.createRadialGradient(cx,cy,r*.9,cx,cy,r*1.16);
 halo.addColorStop(0,'#28648625');halo.addColorStop(1,'#28648600');
 g.fillStyle=halo;g.fillRect(cx-r*1.18,cy-r*1.18,r*2.36,r*2.36);
 g.drawImage(earth,cx-r,cy-r,r*2,r*2);
 circle(cx,cy,r-1,'#52839966',1);
 if(grid){
  g.save();g.beginPath();g.arc(cx,cy,r-2,0,PI*2);g.clip();
  g.strokeStyle='#92cad519';g.lineWidth=.8;
  function gridPath(points){
   g.beginPath();let on=false;
   for(const [lo,la]of points){const p=project(lo,la);
    if(p.z>0){if(!on)g.moveTo(cx+p.x*r,cy+p.y*r);else g.lineTo(cx+p.x*r,cy+p.y*r);on=true}else on=false;
   }g.stroke();
  }
  for(let la=-80;la<=80;la+=20){const p=[];for(let lo=-180;lo<=180;lo+=2)p.push([lo,la]);gridPath(p)}
  for(let lo=-180;lo<180;lo+=20){const p=[];for(let la=-90;la<=90;la+=2)p.push([lo,la]);gridPath(p)}
  g.restore();
 }
}
function ping(x,y,t,color=C.teal){
 dot(x,y,4,color);circle(x,y,9,color,1.2);
 const q=(t*.37)%1;circle(x,y,10+q*26,color+Math.round((1-q)*100).toString(16).padStart(2,'0'),1);
}
function header(n,title){
 spaced('FIELD NOTES  /  EARTH’S EXTREMES',64,43,11,C.muted,1.6);
 text(String(n).padStart(2,'0')+' / 04',1216,43,12,C.muted,500,'right');
 line(64,62,1216,62,'#7894a82b');
 spaced(title,64,100,12,C.teal,2.5);
}
function footer(t){
 const labels=['LOCATION','NEAREST LAND','ORBIT VS. OCEAN','REENTRY ZONE'];
 const starts=[0,10,22,34],ends=[10,22,34,48];
 for(let i=0;i<4;i++){
  const x=64+i*292;
  line(x,676,x+270,676,'#56728342',2);
  line(x,676,x+270*clamp((t-starts[i])/(ends[i]-starts[i])),676,C.teal,2);
  spaced(labels[i],x,699,9,t>=starts[i]&&t<ends[i]?C.white:C.muted,1.2);
 }
}
function intro(u,t){
 header(1,'THE OCEANIC POLE OF INACCESSIBILITY');
 text('As far from land',64,188,48,C.white,600);
 text('as Earth allows.',64,245,48,C.white,600);
 text('Point Nemo',64,332,60,C.teal,600);
 text('48°52.6′ S  /  123°23.6′ W',67,375,21,C.white);
 text('An invisible point in the South Pacific.',67,441,20,C.muted);
 text('No island. No landmark. Just open ocean.',67,472,20,C.muted);
 line(67,511,458,511,'#819fa43a');
 spaced('NEAREST DRY LAND',67,548,11,C.muted,2);
 text('2,688',64,609,52,C.white,600);
 text('km',217,606,24,C.teal);
 const r=251+ease(u/5)*9,cx=923,cy=367;
 globe(cx,cy,r,t);
 const p=project(-123.393333,-48.876667);
 ping(cx+p.x*r,cy+p.y*r,t);
 line(cx+15,cy,cx+75,cy-48,C.teal);
 text('POINT NEMO',cx+84,cy-52,12,C.teal,600);
 spaced('SOUTH PACIFIC OCEAN',796,627,10,C.muted,1.6);
}
function az(lo,la){
 const a=la*RAD,d=lo*RAD-lon0;
 const cs=clamp(Math.sin(lat0)*Math.sin(a)+Math.cos(lat0)*Math.cos(a)*Math.cos(d),-1,1);
 const angle=Math.acos(cs),k=angle/Math.max(.00001,Math.sin(angle));
 return {x:k*Math.cos(a)*Math.sin(d)*6371,y:-k*(Math.cos(lat0)*Math.sin(a)-Math.sin(lat0)*Math.cos(a)*Math.cos(d))*6371};
}
function distanceScene(u,t){
 header(2,'THREE SHORES. ONE EMPTY CENTER.');
 text('The nearest land is 2,688 km away.',64,151,36,C.white,600);
 const cx=574,cy=406,scale=.079;
 const rg=g.createRadialGradient(cx,cy,0,cx,cy,260);rg.addColorStop(0,'#153f4b90');rg.addColorStop(1,'#08203410');
 g.fillStyle=rg;g.beginPath();g.arc(cx,cy,260,0,PI*2);g.fill();
 for(const km of [1000,2000,2688]){
  const r=km*scale;circle(cx,cy,r,km===2688?'#62e3d473':'#739aa333',km===2688?1.5:1);
  text(km.toLocaleString('en-US')+' km',cx+r+7,cy+5,11,C.muted);
 }
 line(cx-255,cy,cx+255,cy,'#819caa20');line(cx,cy-238,cx,cy+238,'#819caa20');
 const points=[
 {n:'DUCIE ISLAND',sub:'Pitcairn Islands',lo:-124.788,la:-24.675,lx:286,ly:199,side:'left'},
 {n:'MOTU NUI',sub:'Near Rapa Nui / Easter Island',lo:-109.454,la:-27.201,lx:798,ly:234,side:'right'},
 {n:'MAHER ISLAND',sub:'Off Antarctica',lo:-126.367,la:-72.967,lx:295,ly:587,side:'left'}
 ];
 for(let i=0;i<points.length;i++){
  const p=points[i],v=az(p.lo,p.la),x=cx+v.x*scale,y=cy+v.y*scale,a=ease((u-.7-i*.6)/1.6);
  g.save();g.globalAlpha=a;
  g.setLineDash([4,6]);line(cx,cy,cx+(x-cx)*a,cy+(y-cy)*a,'#62e3d48c',1.3);g.setLineDash([]);
  dot(x,y,5,C.orange);circle(x,y,10,'#ffb87855');
  const ex=p.side==='left'?p.lx+181:p.lx-14;
  line(x,y,ex,p.ly+8,'#94aebc75');
  text(p.n,p.lx,p.ly,15,C.white,600);
  text(p.sub,p.lx,p.ly+24,14,C.muted);
  g.restore();
 }
 ping(cx,cy,t);
 text('POINT NEMO',cx+15,cy-17,12,C.teal,600);
 g.save();g.globalAlpha=ease((u-2)/2);
 line(979,322,979,496,'#7b9da440');
 text('2,688',1005,378,46,C.white,600);
 spaced('KILOMETERS',1008,411,11,C.teal,1.7);
 text('to the closest land',1008,448,16,C.muted);
 text('in every direction.',1008,472,16,C.muted);
 g.restore();
 text('Distance measured along Earth’s surface. Map centered on Nemo; rings show true radial distance.',64,648,13,C.muted);
}
function station(x,y,scale=1,angle=0){
 g.save();g.translate(x,y);g.rotate(angle);g.scale(scale,scale);
 g.fillStyle='#87c7ec';g.strokeStyle='#b8deed';g.lineWidth=1;
 for(const k of [-1,1]){
  g.fillRect(k<0?-47:18,-19,29,38);
  for(let a=1;a<4;a++)line(k<0?-47:18,-19+a*9.5,k<0?-18:47,-19+a*9.5,'#295675',.8);
  line(k<0?-32:32,-19,k<0?-32:32,19,'#295675',.8);
 }
 g.fillStyle='#e2edf0';g.fillRect(-12,-7,24,14);g.fillRect(-3,-22,6,44);
 line(-47,0,47,0,'#e1eeee',2);g.restore();
}
function comparison(u,t){
 header(3,'SPACE CAN BE CLOSER THAN SHORE');
 text('400 km up. 2,688 km across.',64,151,38,C.white,600);
 const cx=269,cy=417,r=153;
 globe(cx,cy,r,t);
 g.save();g.setLineDash([3,7]);circle(cx,cy,201,'#80a7b65c');g.setLineDash([]);g.restore();
 const theta=-.7+Math.min(u,8)*.032;
 const sx=cx+Math.cos(theta)*201,sy=cy+Math.sin(theta)*201;
 station(sx,sy,.68,theta+PI/2);
 const px=cx+Math.cos(theta)*r,py=cy+Math.sin(theta)*r;
 line(px,py,sx,sy,C.orange,1.5);
 ping(cx,cy,t);
 text('ISS',sx+18,sy-22,14,C.orange,600);
 text('Diagram not to scale',269,648,12,C.muted,400,'center');
 const x=551,y=267,w=617;
 spaced('SAME LINEAR SCALE',x,y,11,C.muted,1.8);
 const progress=ease((u-.5)/2);
 text('Point Nemo → nearest land',x,y+43,20,C.white,500);
 g.fillStyle='#62e3d41b';g.fillRect(x,y+63,w,26);
 g.fillStyle=C.teal;g.fillRect(x,y+63,w*progress,26);
 text('2,688 km',x+w,y+44,19,C.teal,600,'right');
 text('Earth’s surface → ISS',x,y+132,20,C.white,500);
 g.fillStyle='#ffb87819';g.fillRect(x,y+152,w,26);
 g.fillStyle=C.orange;g.fillRect(x,y+152,w*400/2688*progress,26);
 text('≈ 400 km',x+w,y+133,19,C.orange,600,'right');
 if(u>2){
  g.save();g.globalAlpha=ease((u-2)/1.5);
  text('6.7×',x,y+251,53,C.white,600);
  text('farther to land than to orbital altitude',x+141,y+239,19,C.muted);
  text('2688 ÷ 400',x+142,y+266,13,C.muted);
  g.restore();
 }
 text('When the ISS passes overhead, its crew can be the closest humans to Point Nemo.',551,611,16,C.white);
 text('ISS altitude varies. Vertical altitude and surface distance are different measurements.',551,637,12,C.muted);
}
function reentry(u,t){
 header(4,'THE OCEANIC SPACECRAFT CEMETERY');
 text('A remote ocean. A final descent.',64,151,38,C.white,600);
 const cx=373,cy=417,r=222;
 globe(cx,cy,r,t);
 g.save();g.translate(cx,cy);g.rotate(-.22);
 g.fillStyle='#ffb87812';g.strokeStyle='#ffb87868';g.setLineDash([5,5]);
 g.beginPath();g.ellipse(0,0,103,59,0,0,2*PI);g.fill();g.stroke();g.restore();
 ping(cx,cy,t,C.orange);
 text('POINT NEMO',cx+16,cy+25,11,C.orange,600);
 const cycle=(u%6)/6,travel=ease(clamp(cycle/.68));
 const start={x:642,y:214},end={x:374,y:415};
 function pos(q){return{x:start.x+(end.x-start.x)*q,y:start.y+(end.y-start.y)*q*q}}
 g.save();g.strokeStyle='#ffb87845';g.lineWidth=1.5;g.setLineDash([4,6]);
 g.beginPath();for(let i=0;i<=60;i++){const p=pos(i/60);i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y)}g.stroke();g.setLineDash([]);
 if(cycle<.73){
  const p=pos(travel),prev=pos(Math.max(0,travel-.01)),angle=Math.atan2(p.y-prev.y,p.x-prev.x);
  for(let i=1;i<23;i++){const q=travel-i*.009;if(q<0)continue;const a=pos(q);dot(a.x,a.y,(1-i/24)*3.4,`rgba(255,163,101,${(1-i/24)*.5})`)}
  g.translate(p.x,p.y);g.rotate(angle);
  g.fillStyle=C.white;g.beginPath();g.moveTo(10,0);g.lineTo(-7,-5);g.lineTo(-7,5);g.closePath();g.fill();
  g.fillStyle=C.orange;g.beginPath();g.moveTo(-7,-3);g.lineTo(-23,0);g.lineTo(-7,3);g.fill();
 }else{
  const q=(cycle-.73)/.27;circle(end.x,end.y,8+q*43,`rgba(255,184,120,${1-q})`,1.5);
 }
 g.restore();
 spaced('SOUTH PACIFIC DISPOSAL REGION',191,652,10,C.muted,1.4);
 const x=752;
 spaced('CONTROLLED REENTRY',x,214,11,C.orange,2);
 text('Hundreds of retired spacecraft',x,254,25,C.white,600);
 text('have been directed into this remote region.',x,282,17,C.muted);
 const rows=[
 ['2001','Mir space station','Controlled reentry into the South Pacific'],
 ['2008–2015','ESA’s ATV cargo vehicles','Five missions ended with destructive reentry'],
 ['SINCE 1978','Progress cargo spacecraft','Many missions disposed of by reentry']
 ];
 for(let i=0;i<3;i++){
  const y=334+i*77,a=ease((u-.8-i*.6)/1.1);
  g.save();g.globalAlpha=a;
  line(x,y+44,1215,y+44,'#7393a02b');
  text(rows[i][0],x,y,12,C.orange,600);
  text(rows[i][1],x+111,y,19,C.white,500);
  text(rows[i][2],x+111,y+23,12,C.muted);
  g.restore();
 }
 g.save();g.globalAlpha=ease((u-5)/1.5);
 text('NEXT CHAPTER',x,581,11,C.teal,600);
 text('ISS retirement: planned around 2030',x,609,20,C.white,500);
 text('A future controlled deorbit—not yet part of the cemetery.',x,633,12,C.muted);
 g.restore();
 text('A broad disposal zone, not a single wreck site. Most material burns up; surviving debris reaches the ocean.',64,182,14,C.muted);
}
const stars=Array.from({length:110},(_,i)=>({x:(Math.sin(i*127.1)*43758.5453%1+1)%1*1280,y:(Math.sin(i*311.7)*17358.13%1+1)%1*720,r:i%7===0?1.2:.6}));
function background(t){
 g.fillStyle=C.ink;g.fillRect(0,0,1280,720);
 const grad=g.createRadialGradient(787,358,20,787,358,740);
 grad.addColorStop(0,'#16334b80');grad.addColorStop(1,'#06101b00');
 g.fillStyle=grad;g.fillRect(0,0,1280,720);
 for(let i=0;i<stars.length;i++){const s=stars[i];dot(s.x,s.y,s.r,`rgba(141,183,207,${.09+.05*Math.sin(t*.4+i)})`)}
}
const scenes=[intro,distanceScene,comparison,reentry],bounds=[0,10,22,34,48];
let start;
function frame(now){
 if(start===undefined)start=now;
 const t=(((now-start)/1000+offset)%window.DUR+window.DUR)%window.DUR;
 background(t);
 let idx=0;while(idx<3&&t>=bounds[idx+1])idx++;
 const u=t-bounds[idx],duration=bounds[idx+1]-bounds[idx];
 g.save();
 g.globalAlpha=ease(u/.65)*ease((duration-u)/.65);
 scenes[idx](u,t);
 g.restore();
 footer(t);
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
