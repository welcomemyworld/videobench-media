<script>
"use strict";

const canvas=document.getElementById("stage"),c=canvas.getContext("2d");
const W=1280,H=720,PI=Math.PI,TAU=PI*2;
const P={paper:"#eee8d9",white:"#fff9e9",ink:"#252d31",coral:"#e97050",red:"#d54b36",lime:"#dbe778",blue:"#4875b5",pale:"#abc6d2",gray:"#b7b8a6"};
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));

function star(x,y,r,col,n=12,phase=0,inner=.53){

[Math.cos(a-.2)*59,Math.sin(a-.2)*59],

let blink=Math.sin(t*1.7)> .986;

else{ellipse(-15,1,3.3,4.6,P.ink);ellipse(14,1,3.3,4.6,P.ink);

else{c.beginPath();c.moveTo(-7,20);c.quadraticCurveTo(1,26,10,18);c.strokeStyle=P.ink;c.lineWidth=1.8;c.stroke()}
ellipse(-22,13,6,3,"rgba(233,112,80,.3)");ellipse(22,13,6,3,"rgba(233,112,80,.3)");

}

let offset=Number(new URLSearchParams(location.search).get("t")||0);

let start;
function render(now){

}
