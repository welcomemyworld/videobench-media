<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<body>

<script>
'use strict';
window.DUR=32;
const W=1280,H=720,DUR=window.DUR;
const canvas=document.getElementById('c'),g=canvas.getContext('2d');

function fit(){stage.style.transform=`scale(${Math.min(innerWidth/W,innerHeight/H)})`}
addEventListener('resize',fit);fit();
const offset=Number(new URLSearchParams(location.search).get('t'))||0;
const epoch=performance.now()-offset*1000;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const smooth=x=>{x=clamp(x);return x*x*(3-2*x)};
const lerp=(a,b,x)=>a+(b-a)*x;
const TAU=Math.PI*2;
let seed=5811;
function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
const stars=Array.from({length:125},()=>({x:rand()*W,y:rand()*H,z:rand(),r:.3+rand()*1.15,p:rand()*TAU}));
const grain=document.createElement('canvas');grain.width=256;grain.height=144;
const ng=grain.getContext('2d'),im=ng.createImageData(256,144);
for(let i=0;i<im.data.length;i+=4){let v=rand()*255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=20}
ng.putImageData(im,0,0);
function text(s,x,y,size=16,color='#eef5f4',weight=400,align='left'){
g.fillStyle=color;g.font=`${weight} ${size}px Arial, Helvetica, sans-serif`;g.textAlign=align;g.textBaseline='alphabetic';g.fillText(s,x,y);
}
function spaced(s,x,y,size=11,color='#7f949d',spacing=2){
g.font=`500 ${size}px Arial,sans-serif`;g.fillStyle=color;g.textAlign='left';
for(const ch of s){g.fillText(ch,x,y);x+=g.measureText(ch).width+spacing}
}
function line(x1,y1,x2,y2,c='#33434d',w=1){g.strokeStyle=c;g.lineWidth=w;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke()}
function pill(x,y,w,h,r=14){g.beginPath();g.roundRect(x,y,w,h,r)}
function glow(x,y,r,color){
let a=g.createRadialGradient(x,y,0,x,y,r);a.addColorStop(0,color);a.addColorStop(1,'rgba(0,0,0,0)');
g.fillStyle=a;g.fillRect(x-r,y-r,r*2,r*2);
}
function arrow(x,y,s=18,c='#b5ffe8'){line(x-s,y+s,x+s,y-s,c,1.5);line(x-s*.1,y-s,x+s,y-s,c,1.5);line(x+s,y-s,x+s,y+s*.1,c,1.5)}
function audioPulse(t){return Math.pow(1-(t*2%1),4)}
function sceneAlpha(t,start,end){return smooth((t-start)/.75)*smooth((end-t)/.7)}
function label(num,title,x,y){
g.fillStyle='#b0fce3';g.fillRect(x,y-8,5,5);

}
function background(t){
g.fillStyle='#05090f';g.fillRect(0,0,W,H);
glow(990,335,510,'rgba(22,85,91,.22)');
glow(190,660,460,'rgba(31,45,93,.20)');
glow(1060,70,360,'rgba(115,61,38,.10)');
g.save();
g.strokeStyle='rgba(131,183,189,.035)';g.lineWidth=1;
for(let x=-100;x<W+100;x+=80){g.beginPath();g.moveTo(x,0);g.lineTo(x+80*Math.sin(t*.08),H);g.stroke()}
for(let y=40;y<H;y+=80)line(0,y,W,y,'rgba(131,183,189,.028)');
for(const s of stars){
const xx=(s.x+t*(1+s.z)*2)%W, yy=s.y+Math.sin(t*.2+s.p)*6;
g.globalAlpha=(.12+.3*s.z)*(.7+.3*Math.sin(t*.7+s.p));
g.fillStyle=s.z>.75?'#abe9dc':'#9db1c7';g.beginPath();g.arc(xx,yy,s.r,0,TAU);g.fill();
}
g.restore();
}
function chrome(t){
g.save();
g.globalAlpha=Math.min(1,.25+t*.8);
g.fillStyle='#b0ffe1';g.beginPath();g.moveTo(64,41);g.lineTo(64,57);g.quadraticCurveTo(64,70,76,70);g.quadraticCurveTo(88,70,88,57);g.lineTo(88,41);g.lineTo(82,41);g.lineTo(82,57);g.quadraticCurveTo(82,64,76,64);g.quadraticCurveTo(70,64,70,57);g.lineTo(70,41);g.fill();
spaced('ULTRACODE',104,61,14,'#e2efee',3);
spaced('MOTION / SOUND / EXPLORATION',290,59,9,'#6c818e',1.5);
spaced('LINK STUDY',1091,51,10,'#a0b5bd',1.6);
text('001 — 2026',1209,70,10,'#667e89',400,'right');
line(64,92,1216,92,'#23303a');
line(64,641,1216,641,'#23303a');
line(64,641,64+1152*(t/DUR),641,'#adffe2',1.5);
spaced('SHORT-LINK CONCEPT · DESTINATION NOT VERIFIED',64,678,9,'#75858e',1.1);
const secs=Math.floor(t).toString().padStart(2,'0');
text(`00:${secs} / 00:32`,705,678,10,'#91a6af',400,'center');
g.restore();
}
function project(x,y,z,t,cx,cy,size){
let a=t*.19+.3,b=.4+Math.sin(t*.12)*.25;
let X=x*Math.cos(a)+z*Math.sin(a),Z=-x*Math.sin(a)+z*Math.cos(a);
let Y=y*Math.cos(b)-Z*Math.sin(b);Z=y*Math.sin(b)+Z*Math.cos(b);
const p=4.4/(4.4+Z);
return {x:cx+X*size*p,y:cy+Y*size*p,z:Z,p};
}
function sculpture(t){
const final=smooth((t-23)/2);
let cx=lerp(946,640,final),cy=lerp(352,308,final),scale=lerp(93,100,final);
const emergence=smooth(t/2),energy=audioPulse(t);
g.save();g.globalAlpha=emergence;
glow(cx,cy,310,'rgba(62,206,177,.085)');
glow(cx+100,cy-60,230,'rgba(228,141,89,.05)');
const segments=[];
const mode=smooth((t-7)/2)-smooth((t-15)/2);
const expand=smooth((t-15)/2)-smooth((t-23)/2);
for(let k=0;k<5;k++){
let prev=null;
for(let i=0;i<=280;i++){
const u=i/280*TAU, phase=k*.043;
let r=2+.44*Math.cos(3*u+t*.2+phase);
let x=r*Math.cos(2*u+phase), y=r*Math.sin(2*u+phase), z=.76*Math.sin(3*u+t*.2+phase);
const sphereX=2.42*Math.cos(u)*Math.sin(u*3+k*.17+t*.1);
const sphereY=2.42*Math.sin(u)*Math.sin(u*3+k*.17+t*.1);
const sphereZ=2.42*Math.cos(u*3+k*.17+t*.1);
x=lerp(x,sphereX,expand*.8);y=lerp(y,sphereY,expand*.8);z=lerp(z,sphereZ,expand*.8);
x=lerp(x,2.9*Math.cos(u),mode*.65);
y=lerp(y,1.6*Math.sin(u),mode*.65);
z=lerp(z,.9*Math.sin(u*4+t*.35+k*.04),mode*.65);
const p=project(x,y,z,t,cx,cy,scale*(1+.012*energy));
if(prev)segments.push({a:prev,b:p,z:(prev.z+p.z)/2,k,i});
prev=p;
}
}
segments.sort((a,b)=>b.z-a.z);
g.globalCompositeOperation='lighter';
for(const s of segments){
const light=clamp((2.7-s.z)/5.4);
const warm=s.k===0||s.k===4;
g.strokeStyle=warm?`rgba(246,158,109,${.10+light*.54})`:`rgba(139,255,223,${.12+light*.63})`;
g.lineWidth=.65+light*1.05;
g.beginPath();g.moveTo(s.a.x,s.a.y);g.lineTo(s.b.x,s.b.y);g.stroke();
}
for(let k=0;k<24;k++){
let u=(k/24+t*.025)%1*TAU;
let r=2+.44*Math.cos(3*u+t*.2);
const p=project(r*Math.cos(2*u),r*Math.sin(2*u),.76*Math.sin(3*u+t*.2),t,cx,cy,scale);
g.fillStyle=k%3?'#d2fff0':'#ffb486';g.beginPath();g.arc(p.x,p.y,1.3,0,TAU);g.fill();
if(k%6===0)glow(p.x,p.y,13,'rgba(156,255,215,.22)');
}
g.globalCompositeOperation='source-over';
g.restore();
if(t<24){
g.save();g.globalAlpha=emergence*.6;
line(1129,174,1152,151,'#4e6970');line(1152,151,1215,151,'#4e6970');
spaced('LIVE FORM',1138,140,8,'#8aa0a8',1);
text(['01 / SIGNAL','02 / CONNECTION','03 / DISCOVERY'][Math.min(2,Math.floor(t/8))],1197,576,9,'#80939b',400,'right');
line(1082,566,1094,578,'#425b63');line(1094,578,1197,578,'#425b63');
g.restore();
}
}
function intro(t){
const a=sceneAlpha(t,0,8);
if(a<=0)return;
g.save();g.globalAlpha=a;
const move=25*(1-smooth(t/1.4));
g.translate(0,move);
label('01','THE SIGNAL',76,184);
text('Small link.',72,292,82,'#f2f5ef',600);
text('Big possibility.',72,383,76,'#b4ffe6',600);
text('Every discovery starts somewhere.',78,431,19,'#95a9b2');
g.save();g.globalAlpha=smooth((t-1.5)/1);
pill(77,479,399,51,9);g.fillStyle='rgba(24,39,46,.78)';g.fill();g.strokeStyle='#334d52';g.stroke();
line(99,504,110,504,'#a7ffe4',2);line(105,498,116,498,'#a7ffe4',2);
text('t.co/wQXZTaqf1b',136,511,20,'#d8e7e5');
arrow(443,504,7);
g.restore();
spaced('ONE LINK. AN OPEN INVITATION.',78,582,10,'#617d86',2);
g.restore();
}
function connection(t){
const a=sceneAlpha(t,8,16);if(a<=0)return;
g.save();g.globalAlpha=a;
let q=smooth((t-8)/1.2);
g.translate(-20*(1-q),0);
label('02','THE CONNECTION',76,184);
text('Less distance.',72,290,74,'#f2f5ef',600);
text('More discovery.',72,380,72,'#b4ffe6',600);
text('A short URL. A direct way forward.',78,430,19,'#95a9b2');
const y=505,st=104,en=548;
line(st,y,en,y,'#2b454b',1);
let f=(t-8)/8;
const head=st+(en-st)*smooth(f*1.35);
line(st,y,head,y,'#aaffe0',1.5);
glow(head,y,25,'rgba(161,255,218,.28)');
for(let i=0;i<3;i++){
let x=st+i*(en-st)/2;
g.fillStyle=head>=x?'#bcffe7':'#23343f';g.beginPath();g.arc(x,y,i===1?4:6,0,TAU);g.fill();
}
spaced('CURIOSITY',77,544,9,'#8aa0a8',1.3);
spaced('ONE CLICK',283,544,9,'#8aa0a8',1.3);
spaced('WHAT’S NEXT',485,544,9,'#8aa0a8',1.3);
g.restore();
}
function discovery(t){
const a=sceneAlpha(t,16,24);if(a<=0)return;
g.save();g.globalAlpha=a;
label('03','THE INVITATION',76,184);
text('Follow your',72,291,78,'#f2f5ef',600);
text('curiosity.',72,382,88,'#b4ffe6',600);
text('Open the link.',78,439,21,'#c7d5d8');
text('Explore the destination.',78,470,21,'#91a7b0');
line(78,518,124,518,'#aaffe0',2);
spaced('THERE’S ONLY ONE WAY TO FIND OUT.',78,558,10,'#819aa5',1.6);
g.restore();
}
function closing(t){
const a=sceneAlpha(t,24,32);if(a<=0)return;
g.save();g.globalAlpha=a;
let grad=g.createLinearGradient(0,255,0,610);
grad.addColorStop(0,'rgba(5,9,15,0)');grad.addColorStop(.44,'rgba(5,9,15,.7)');grad.addColorStop(1,'rgba(5,9,15,.98)');
g.fillStyle=grad;g.fillRect(0,255,W,363);
text('ONE LINK. GO FURTHER.',640,386,15,'#b8ffe5',500,'center');
text('t.co/wQXZTaqf1b',640,466,62,'#f0f7f3',600,'center');
text('Open the link. Explore what’s next.',640,509,19,'#9fb4bd',400,'center');
const x=505,y=540;
pill(x,y,270,47,24);g.fillStyle='#b8ffe4';g.fill();
text('EXPLORE THE LINK',x+26,y+29,12,'#132e2b',600);
arrow(x+238,y+23,7,'#132e2b');
g.restore();
}
function accents(t){
g.save();
const beat=audioPulse(t);
g.globalAlpha=.2+beat*.35;
line(64,107,86,107,'#a7ffe0',1);line(64,107,64,129,'#a7ffe0',1);
line(1216,621,1194,621,'#a7ffe0',1);line(1216,621,1216,599,'#a7ffe0',1);
g.restore();
g.save();g.globalAlpha=.16;
g.drawImage(grain,Math.sin(t*17)*7-10,Math.cos(t*13)*7-10,W+20,H+20);
g.restore();
let v=g.createRadialGradient(640,360,220,640,360,780);
v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.52)');
g.fillStyle=v;g.fillRect(0,0,W,H);
}
let ac,master,verb,delay,ready=false,nextStep=null;
const bpm=120,step=.25,totalSteps=128;
function midi(n){return 440*Math.pow(2,(n-69)/12)}
function envelope(gain,time,attack,decay,level){
gain.gain.setValueAtTime(.0001,time);
gain.gain.exponentialRampToValueAtTime(level,time+attack);
gain.gain.exponentialRampToValueAtTime(.0001,time+attack+decay);
}
function tone(note,time,dur,vol,type='sine',cut=2600,wet=.22){
const osc=ac.createOscillator(),amp=ac.createGain(),filter=ac.createBiquadFilter();
osc.type=type;osc.frequency.value=midi(note);
filter.type='lowpass';filter.frequency.setValueAtTime(cut,time);
filter.frequency.exponentialRampToValueAtTime(Math.max(180,cut*.24),time+dur);
envelope(amp,time,.012,dur,vol);
osc.connect(filter);filter.connect(amp);amp.connect(master);
const send=ac.createGain();send.gain.value=wet;amp.connect(send);send.connect(verb);
if(type==='triangle'){const ds=ac.createGain();ds.gain.value=.2;amp.connect(ds);ds.connect(delay)}
osc.start(time);osc.stop(time+dur+.08);
}
let noiseBuffer;
function noise(time,dur,vol,frequency,type){
const src=ac.createBufferSource(),f=ac.createBiquadFilter(),amp=ac.createGain();
src.buffer=noiseBuffer;f.type=type||'highpass';f.frequency.value=frequency;
envelope(amp,time,.002,dur,vol);
src.connect(f);f.connect(amp);amp.connect(master);src.start(time);src.stop(time+dur+.02);
}
function kick(time,v=.6){
const o=ac.createOscillator(),a=ac.createGain();
o.frequency.setValueAtTime(132,time);o.frequency.exponentialRampToValueAtTime(43,time+.14);
envelope(a,time,.003,.29,v);o.connect(a);a.connect(master);o.start(time);o.stop(time+.34);
}
const chords=[[50,57,60,64,69],[46,53,57,60,65],[41,48,57,60,64],[48,55,58,62,67]];
function musicEvent(n,time){
const s=((n%128)+128)%128;
const beat=Math.floor(s/2),bar=Math.floor(s/8),ch=chords[Math.floor(bar/2)%4];
const act=Math.floor(s/32);
if(s%8===0){
ch.slice(1).forEach((note,i)=>{
tone(note,time+i*.013,1.92,act===0?.038:.047,'sine',1800,.65);
tone(note+12,time+i*.019,1.65,.012,'sine',3200,.7);
});
}
if(s>=16&&s<120&&s%2===0){
const root=ch[0]-12;
tone(root,time,.31,act===0?.065:.12,'sine',500,.05);
}
if(s>=32&&s<120){
if(s%8===0||s%8===4)kick(time,act===2?.64:.5);
if(s%8===2||s%8===6){
noise(time,.13,.11,1500,'highpass');
noise(time+.021,.09,.067,1000,'bandpass');
}
noise(time,.037,s%2===0?.035:.052,7600,'highpass');
if(s%16===15)noise(time,.11,.042,6900,'highpass');
}else if(s>=8&&s<120&&s%2===1)noise(time,.04,.027,8000);
if(s>=8&&s<116){
const pattern=[0,2,1,3,2,4,1,3];
if(act===2||s%2===0){
const note=ch[pattern[s%8]]+12;
tone(note,time,.34,act===2?.071:.05,'triangle',3500,.38);
}
}
if(s===0||s===32||s===64||s===96){
tone(ch[2]+24,time,2.8,.045,'sine',5000,.85);
noise(time,1.1,.023,4500,'highpass');
}
if(s===120){
chords[0].slice(1).forEach(n=>tone(n,time,1.8,.04,'sine',1800,.65));
}
}
function setupAudio(){
if(ac)return;
const Audio=window.AudioContext||window.webkitAudioContext;
if(!Audio){sound.textContent='SOUND UNAVAILABLE';return}
ac=new Audio();
master=ac.createGain();master.gain.value=.67;
const comp=ac.createDynamicsCompressor();
comp.threshold.value=-19;comp.knee.value=18;comp.ratio.value=3;comp.attack.value=.01;comp.release.value=.2;
master.connect(comp);comp.connect(ac.destination);
verb=ac.createConvolver();
const len=Math.floor(ac.sampleRate*2.6),ir=ac.createBuffer(2,len,ac.sampleRate);
let s=919;
for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++){s=(s*1664525+1013904223)>>>0;d[i]=((s/4294967296)*2-1)*Math.pow(1-i/len,3)*.46}}
verb.buffer=ir;
const vg=ac.createGain();vg.gain.value=.42;verb.connect(vg);vg.connect(master);
delay=ac.createDelay(1);delay.delayTime.value=.375;
const fb=ac.createGain();fb.gain.value=.25;delay.connect(fb);fb.connect(delay);
const dg=ac.createGain();dg.gain.value=.33;delay.connect(dg);dg.connect(master);
noiseBuffer=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);
const nd=noiseBuffer.getChannelData(0);
for(let i=0;i<nd.length;i++){s=(s*1664525+1013904223)>>>0;nd[i]=(s/4294967296)*2-1}
ac.onstatechange=()=>{
ready=ac.state==='running';
sound.textContent=ready?'♫ ORIGINAL SCORE · 120 BPM':'ENABLE SOUND ↗';
nextStep=null;
};
}
async function enableSound(){
setupAudio();
if(ac){await ac.resume();ready=ac.state==='running';nextStep=null}
}
sound.addEventListener('click',enableSound);
document.addEventListener('pointerdown',()=>{if(!ready)enableSound()},{once:true});
document.addEventListener('keydown',()=>{if(!ready)enableSound()},{once:true});
function schedule(elapsed){
if(!ready||!ac)return;
if(nextStep===null||nextStep*step<elapsed-.15)nextStep=Math.ceil(elapsed/step);
while(nextStep*step<elapsed+.13){
const when=ac.currentTime+(nextStep*step-elapsed);
if(when>=ac.currentTime)musicEvent(nextStep,when);
nextStep++;
}
}
setupAudio();
function frame(now){
const elapsed=(now-epoch)/1000;
const t=((elapsed%DUR)+DUR)%DUR;
schedule(elapsed);
background(t);sculpture(t);intro(t);connection(t);discovery(t);closing(t);accents(t);chrome(t);
const opening=smooth(t/.65),ending=smooth((32-t)/.7);
g.fillStyle=`rgba(0,0,0,${1-opening*ending})`;g.fillRect(0,0,W,H);
requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
