  const bass=(Math.sin(TAU*bassfreq*t)+.2*Math.sin(TAU*bassfreq*2*t))*Math.exp(-p*7)*(full?.19:.06);
  let pad=0;
  for(let j=0;j<3;j++)pad+=(Math.sin(TAU*chord[j]*t)+.3*Math.sin(TAU*(chord[j]*1.002)*t))*.019;
  const af=chord[[0,1,2,1,0,2,1,2][step%8]]*(step%8>3?4:2);
  const arp=(Math.sin(TAU*af*t)+.2*Math.sin(TAU*af*2*t))*Math.exp(-ap*13)*(t>2?.09:.02);
  const glitter=Math.sin(TAU*chord[2]*8*t)*Math.exp(-(t%2)*5)*.025;
  const env=smooth(t/.3)*(1-smooth((t-29.5)/.5));
  const common=(kick+sn+hat+bass+pad)*env;
  L[i]=Math.tanh((common+arp*(.65+.35*Math.sin(step))*env+glitter*env)*1.22)*.74;
  R[i]=Math.tanh((common+arp*(.65-.35*Math.sin(step))*env-glitter*env)*1.22)*.74;
 }
 // Short stereo delay, printed into the score rather than fetched as an asset.
 const d=Math.floor(sr*.375);
 for(let i=d;i<n;i++){L[i]+=.17*R[i-d];R[i]+=.15*L[i-d]}
 musicBuffer=buf;
}
function requestSound(){
 if(unlockRequested&&ac&&ac.state==='running')return;
 unlockRequested=true;
 try{
  if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();createMusic()}
  ac.resume().catch(()=>{});
 }catch(e){}
}
function syncSound(t){
 if(ac&&ac.state==='running'&&musicBuffer&&!audioStarted){
  sourceNode=ac.createBufferSource();sourceNode.buffer=musicBuffer;sourceNode.loop=true;
  const gain=ac.createGain();gain.gain.value=.8;sourceNode.connect(gain);gain.connect(ac.destination);
  sourceNode.start(0,t);audioStarted=true;
 }
}
document.addEventListener('pointerdown',requestSound);
document.addEventListener('keydown',requestSound);
function draw(now){
 if(epoch===null){epoch=now;requestSound()}
 time=((now-epoch)/1000+offset)%window.DUR;
 syncSound(time);
 c.setTransform(1,0,0,1,0,0);c.globalAlpha=1;c.shadowBlur=0;c.shadowOffsetY=0;
 if(time<4)intro(time);
 else if(time<10)source(time);
 else if(time<16)orbit(time);
 else if(time<22)verbs(time);
 else if(time<26)tunnel(time);
 else finale(time);
 texture();
 if(!audioStarted){
  const dark=time<4||(time>=10&&time<16)||time>=26;
  c.save();c.globalAlpha=.65;
  txt('CLICK FOR SOUND',1237,41,9,dark?P.paper:P.ink,600,'right');
  for(let j=0;j<4;j++)line(1109+j*4,31,1109+j*4,39-(j%2)*4,dark?P.lime:P.ink,2);
  c.restore();
 }else{
  const dark=time<4||(time>=10&&time<16)||time>=26;
  for(let j=0;j<9;j++){
   const hh=3+Math.abs(Math.sin(time*7+j*1.7))*10*(.5+beat(time)*.5);
   line(1205+j*4,38,1205+j*4,38-hh,dark?P.lime:P.ink,2);
  }
 }
 frame++;requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
