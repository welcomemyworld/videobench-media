<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OUT OF FRAME — Motion Study</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:#08090b;overflow:hidden}body{display:flex;align-items:center;justify-content:center}canvas{display:block;width:min(100vw,177.7778vh);height:min(56.25vw,100vh)}
</style>
</head>
<body>
<canvas id="stage" width="1280" height="720"></canvas>
<script>
window.DUR=26;
const canvas=document.getElementById('stage'),c=canvas.getContext('2d');
const W=1280,H=720,ink='#111316',cream='#f1eee4',lime='#dfff00';
const paper=document.createElement('canvas');paper.width=470;paper.height=550;
const p=paper.getContext('2d');
let seed=319;
function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>{x=clamp(x);return x*x*(3-2*x)};
const mix=(a,b,t)=>a+(b-a)*t;
const rgb=(a,b,t)=>`rgb(${a.map((v,i)=>Math.round(mix(v,b[i],t))).join(',')})`;
function text(ctx,s,x,y,size,color,align='left',weight=500){
ctx.fillStyle=color;ctx.font=`${weight} ${size}px Arial,Helvetica,sans-serif`;ctx.textAlign=align;ctx.fillText(s,x,y);
}
p.fillStyle=lime;p.fillRect(0,0,470,550);
p.strokeStyle=ink;p.lineWidth=1;
p.strokeRect(17.5,17.5,435,515);
text(p,'NO. 001',29,40,11,ink,'left',700);
text(p,'BOUNDARIES ARE OPTIONAL',441,40,10,ink,'right',700);
p.beginPath();p.moveTo(28,53);p.lineTo(441,53);p.stroke();
for(let i=0;i<12;i++){
p.fillStyle=i%2?ink:cream;
p.fillRect(28+i*7,182,4,76);
p.fillRect(362+i*7,317,4,65);
}
text(p,'A STUDY IN',29,300,9,ink,'left',700);
text(p,'LIMITLESS',29,313,9,ink,'left',700);
text(p,'POSSIBILITY',29,326,9,ink,'left',700);
p.save();p.translate(443,254);p.rotate(-Math.PI/2);
text(p,'DO NOT CONTAIN',0,0,11,ink,'center',700);p.restore();
p.beginPath();p.moveTo(29,507);p.lineTo(441,507);p.stroke();
text(p,'DESIGNED TO ESCAPE.',29,527,10,ink,'left',700);
text(p,'1280 × 720 / MOTION',441,527,10,ink,'right',700);
for(let i=0;i<3800;i++){
p.fillStyle=rand()>.5?'rgba(0,0,0,.035)':'rgba(255,255,255,.08)';
p.fillRect(rand()*470,rand()*550,1,1);
}
const tiles=[];
for(let row=0;row<7;row++)for(let col=0;col<6;col++){
let sx=col*470/6,sy=row*550/7,ww=470/6,hh=550/7;
let nx=(col-2.5)/2.5,ny=(row-3)/3;
let a=Math.atan2(ny,nx)+(rand()-.5)*.35;
let edge=Math.max(Math.abs(nx),Math.abs(ny));
tiles.push({sx,sy,w:ww,h:hh,cx:405+sx+ww/2,cy:85+sy+hh/2,
dx:Math.cos(a)*(190+rand()*280),dy:Math.sin(a)*(100+rand()*175),
rz:(rand()-.5)*3.8,rx:(rand()-.5)*2.4,ry:(rand()-.5)*3.5,
z:rand()*180-50,delay:rand()*.15+(1-edge)*.07,edge,phase:rand()*6.28});
}
const dust=Array.from({length:90},()=>({x:rand()*1280,y:rand()*720,r:.3+rand()*.8,a:rand()*.12}));
const debris=Array.from({length:44},()=>({a:rand()*6.28,r:150+rand()*360,s:2+rand()*6,spin:rand()*5,phase:rand()*6.28}));
const noise=document.createElement('canvas');noise.width=256;noise.height=144;
const nc=noise.getContext('2d'),ni=nc.createImageData(256,144);
for(let i=0;i<ni.data.length;i+=4){let v=rand()*255;ni.data[i]=ni.data[i+1]=ni.data[i+2]=v;ni.data[i+3]=13}nc.putImageData(ni,0,0);
function triangle(source,s0,s1,s2,d0,d1,d2){
let den=(s1.x-s0.x)*(s2.y-s0.y)-(s2.x-s0.x)*(s1.y-s0.y);
let a=((d1.x-d0.x)*(s2.y-s0.y)-(d2.x-d0.x)*(s1.y-s0.y))/den;
let b=((d1.y-d0.y)*(s2.y-s0.y)-(d2.y-d0.y)*(s1.y-s0.y))/den;
let cc=((s1.x-s0.x)*(d2.x-d0.x)-(s2.x-s0.x)*(d1.x-d0.x))/den;
let d=((s1.x-s0.x)*(d2.y-d0.y)-(s2.x-s0.x)*(d1.y-d0.y))/den;
c.save();c.beginPath();c.moveTo(d0.x,d0.y);c.lineTo(d1.x,d1.y);c.lineTo(d2.x,d2.y);c.closePath();c.clip();
c.transform(a,b,cc,d,d0.x-a*s0.x-cc*s0.y,d0.y-b*s0.x-d*s0.y);c.drawImage(source,0,0);c.restore();
}
function tileDraw(o,e,t){
let f=ease((e-o.delay)/(1-o.delay));
let drift=Math.sin(t*.8+o.phase)*f*9;
let tx=o.cx+o.dx*f,ty=o.cy+o.dy*f+drift;
let rx=o.rx*f,ry=o.ry*f,rz=o.rz*f;
let sc=1-f*.2;
let verts=[[-o.w/2,-o.h/2],[o.w/2,-o.h/2],[o.w/2,o.h/2],[-o.w/2,o.h/2]].map(([x,y])=>{
x*=sc;y*=sc;
let yy=y*Math.cos(rx),zz=y*Math.sin(rx);
let xx=x*Math.cos(ry)+zz*Math.sin(ry);zz=-x*Math.sin(ry)+zz*Math.cos(ry);
let x2=xx*Math.cos(rz)-yy*Math.sin(rz),y2=xx*Math.sin(rz)+yy*Math.cos(rz);
let persp=760/(760+zz-o.z*f);
return{x:tx+x2*persp,y:ty+y2*persp};
});
let alpha=1-f*(o.edge<.7?.87:.32);
c.save();c.globalAlpha=alpha;
if(f>.01){
c.beginPath();verts.forEach((v,i)=>i?c.lineTo(v.x+7*f,v.y+15*f):c.moveTo(v.x+7*f,v.y+15*f));c.closePath();
c.fillStyle='rgba(0,0,0,.3)';c.fill();
}
let src=[{x:o.sx,y:o.sy},{x:o.sx+o.w,y:o.sy},{x:o.sx+o.w,y:o.sy+o.h},{x:o.sx,y:o.sy+o.h}];
triangle(paper,src[0],src[1],src[2],verts[0],verts[1],verts[2]);
triangle(paper,src[0],src[2],src[3],verts[0],verts[2],verts[3]);
if(f>.02){
c.beginPath();verts.forEach((v,i)=>i?c.lineTo(v.x,v.y):c.moveTo(v.x,v.y));c.closePath();
c.fillStyle=`rgba(0,0,0,${Math.abs(Math.sin(ry))*.25*f})`;c.fill();
c.strokeStyle='rgba(242,255,166,.35)';c.lineWidth=.6;c.stroke();
}
c.restore();
}
function frame(e,t){
let x=391,y=71,w=498,h=578;
const segments= [
[x,y,x+w/2,y,-115,-72,-.15],[x+w/2,y,x+w,y,145,-64,.24],
[x+w,y,x+w,y+h/2,157,-23,.38],[x+w,y+h/2,x+w,y+h,167,55,-.23],
[x+w,y+h,x+w/2,y+h,128,66,.15],[x+w/2,y+h,x,y+h,-121,54,-.19],
[x,y+h,x,y+h/2,-147,33,.27],[x,y+h/2,x,y,-140,-40,-.3]
];
segments.forEach((a,i)=>{
let f=ease(e),mx=(a[0]+a[2])/2,my=(a[1]+a[3])/2;
c.save();c.translate(mx+a[4]*f,my+a[5]*f);
c.rotate(a[6]*f+Math.sin(t*1.2+i)*f*.035);
c.strokeStyle=rgb([205,203,192],[98,105,111],f);c.lineWidth=1.5;
c.beginPath();c.moveTo(a[0]-mx,a[1]-my);c.lineTo(a[2]-mx,a[3]-my);c.stroke();
c.fillStyle=cream;c.fillRect(a[0]-mx-1.5,a[1]-my-1.5,3,3);
c.restore();
});
}
function headline(word,y,width,e,t,offset){
let font=164;
c.save();c.font=`900 ${font}px Arial,Helvetica,sans-serif`;
let total=c.measureText(word).width,scale=width/total,x=640-width/2;
c.translate(x,y);c.scale(scale,1);
for(let i=0;i<word.length;i++){
let prev=c.measureText(word.slice(0,i)).width;
let lift=Math.sin(t*1.4+i*.85)*e*2;
let twist=Math.sin(t*.9+i)*e*.012;
c.save();c.translate(prev,lift);c.rotate(twist);
c.fillStyle=offset?rgb([17,19,22],[223,255,0],e):rgb([17,19,22],[241,238,228],e);
c.fillText(word[i],0,0);c.restore();
}
c.restore();
}
function globe(e,t){
let r=mix(94,108,e),x=640,y=mix(362,375,e);
c.save();c.translate(x,y);
c.rotate(mix(-.2,-.43,e)+Math.sin(t*.55)*.05*e);
c.shadowColor='rgba(0,0,0,.3)';c.shadowBlur=26*e;c.shadowOffsetY=12*e;
c.fillStyle=rgb([17,19,22],[37,64,234],e);
c.beginPath();c.arc(0,0,r,0,Math.PI*2);c.fill();
c.shadowBlur=0;c.shadowOffsetY=0;c.save();
c.beginPath();c.arc(0,0,r-.5,0,Math.PI*2);c.clip();
c.strokeStyle=cream;c.lineWidth=1.7;
for(let i=-6;i<=6;i++){
let v=i/7,yy=v*r,wide=Math.sqrt(1-v*v)*r;
c.beginPath();c.ellipse(0,yy,wide,Math.max(3,(1-v*v)*r*.16),0,0,Math.PI*2);c.stroke();
}
for(let i=0;i<7;i++){
let a=(i/7*Math.PI)+t*.26*e;
c.beginPath();c.ellipse(0,0,Math.max(1,Math.abs(Math.sin(a))*r),r,0,0,Math.PI*2);c.stroke();
}
let grd=c.createLinearGradient(-r,-r,r,r);grd.addColorStop(0,'rgba(255,255,255,.2)');grd.addColorStop(.5,'rgba(0,0,0,0)');grd.addColorStop(1,'rgba(0,0,0,.26)');
c.fillStyle=grd;c.fillRect(-r,-r,r*2,r*2);c.restore();
c.strokeStyle=cream;c.lineWidth=2;c.beginPath();c.ellipse(0,0,r*1.38,r*.32,-.36,0,Math.PI*2);c.stroke();
let a=t*.62,px=Math.cos(a)*r*1.38,py=Math.sin(a)*r*.32;
c.rotate(-.36);c.fillStyle=lime;c.fillRect(px-5,py-5,10,10);
c.restore();
}
function render(t){
let opening=ease(t/1.8);
let e=t<6?0:t<11?ease((t-6)/5):t<20?1:t<24.5?1-ease((t-20)/4.5):0;
let pulse=Math.sin(t*37)*ease((t-4.5)/1.5)*(1-ease((t-6)/1.2))*1.1;
c.fillStyle='#0b0d10';c.fillRect(0,0,W,H);
let bg=c.createRadialGradient(640,350,20,640,350,740);
bg.addColorStop(0,'#20252b');bg.addColorStop(1,'#090b0d');c.fillStyle=bg;c.fillRect(0,0,W,H);
c.strokeStyle='rgba(220,228,235,.045)';c.lineWidth=1;
for(let x=64;x<W;x+=64){c.beginPath();c.moveTo(x,0);c.lineTo(x,H);c.stroke()}
for(let y=40;y<H;y+=64){c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke()}
dust.forEach(d=>{c.fillStyle=`rgba(244,240,230,${d.a})`;c.fillRect(d.x,(d.y+t*1.3)%720,d.r,d.r)});
text(c,'FORM / FREEDOM',42,41,12,cream,'left',700);
text(c,'MOTION STUDY',640,41,11,'#899099','center',500);
text(c,'001 — 026',1238,41,12,cream,'right',700);
c.strokeStyle='#4a5056';c.lineWidth=1;
c.beginPath();c.moveTo(42,54);c.lineTo(1238,54);c.stroke();
c.save();
c.translate(640,360);c.scale(.93+.07*opening,.93+.07*opening);c.translate(-640,-360);
c.globalAlpha=opening;c.translate(pulse,pulse*.4);
if(e<.002){
c.save();c.shadowColor='#000';c.shadowBlur=35;c.shadowOffsetY=17;c.drawImage(paper,405,85);c.restore();
}else tiles.forEach(o=>tileDraw(o,e,t));
frame(e,t);
if(e>.05){
c.save();c.globalAlpha=e*.65;
debris.forEach((d,i)=>{
let a=d.a+Math.sin(t*.3+d.phase)*.06,rr=d.r*e;
let x=640+Math.cos(a)*rr*1.45,y=370+Math.sin(a)*rr*.67;
c.save();c.translate(x,y);c.rotate(d.spin+t*.4);
c.fillStyle=i%4===0?'#f1eee4':i%3===0?'#4164ef':lime;
c.fillRect(-d.s/2,-d.s/2,d.s,d.s*(i%3===0?3:1));c.restore();
});c.restore();
}
globe(e,t);
c.save();
let fs=mix(105,164,e)/164;
c.translate(0,mix(232,248,e));c.scale(1,fs);
headline('BREAK',0,mix(414,966,e),e,t,0);c.restore();
c.save();let fs2=mix(155,184,e)/164;
c.translate(0,mix(582,632,e));c.scale(1,fs2);
headline('OUT',0,mix(414,904,e),e,t,1);c.restore();
if(e>.08){
c.globalAlpha=e;
c.save();c.translate(125,358);c.rotate(-Math.PI/2);
text(c,'NO FRAME CAN HOLD AN IDEA.',0,0,11,cream,'center',700);c.restore();
c.save();c.translate(1155,358);c.rotate(Math.PI/2);
text(c,'EXPAND BEYOND THE EXPECTED.',0,0,11,cream,'center',700);c.restore();
}
c.restore();
let label=t<4.5?'01 / CONTAINED':t<6.5?'02 / PRESSURE':t<11?'03 / RUPTURE':t<20?'04 / UNBOUND':t<24.5?'05 / REFORM':'01 / CONTAINED';
text(c,label,42,681,11,cream,'left',700);
text(c,e>.5?'THE POSTER IS NOT THE LIMIT.':'EVERY EDGE IS A BEGINNING.',640,681,11,'#a3a9ae','center',500);
text(c,'OUT OF FRAME',1238,681,11,cream,'right',700);
c.fillStyle='#363c42';c.fillRect(42,696,1196,2);c.fillStyle=lime;c.fillRect(42,696,1196*t/window.DUR,2);
if(t>6&&t<6.22){
c.fillStyle=`rgba(240,255,204,${Math.sin((t-6)/.22*Math.PI)*.13})`;c.fillRect(0,0,W,H);
}
c.globalAlpha=.26;c.drawImage(noise,0,0,1280,720);c.globalAlpha=1;
}
const offset=Number(new URLSearchParams(location.search).get('t'))||0;
let origin;
function tick(now){
if(origin===undefined)origin=now;
const t=((now-origin)/1000+offset)%window.DUR;
render((t+window.DUR)%window.DUR);
requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
