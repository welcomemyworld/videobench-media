 for(let i=0;i<scenes.length;i++){
 const [start,end,fn]=scenes[i],fade=.55;
 let a=1;
 if(t<start-fade||t>=end)continue;
 if(t<start)a=ease((t-(start-fade))/fade);
 else if(t>end-fade)a=1-ease((t-(end-fade))/fade);
 c.save();c.globalAlpha=a;fn(Math.max(0,t-start));c.restore();
 }
 if(t>39.45){c.fillStyle=`rgba(243,243,237,${ease((t-39.45)/.55)})`;c.fillRect(0,0,W,H)}
 if(t<.4){c.fillStyle=`rgba(243,243,237,${1-ease(t/.4)})`;c.fillRect(0,0,W,H)}
}

 const dg=audio.createGain();dg.gain.value=.18;
 master.connect(delay);delay.connect(dg);dg.connect(comp);
 noiseBuffer=audio.createBuffer(1,audio.sampleRate*.18,audio.sampleRate);
 const d=noiseBuffer.getChannelData(0);let seed=131;
 for(let i=0;i<d.length;i++){seed=(seed*16807)%2147483647;d[i]=(seed/2147483647*2-1)*Math.exp(-i/d.length*9)}
}
function tone(midi,at,len,amp,type="sine"){
 const o=audio.createOscillator(),g=audio.createGain();
 o.type=type;o.frequency.value=440*Math.pow(2,(midi-69)/12);
 g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(amp,at+.025);
 g.gain.exponentialRampToValueAtTime(.0001,at+len);
 o.connect(g);g.connect(audio.master);o.start(at);o.stop(at+len+.03);
}
function rhythm(at,amp,low){
 if(low){
 const o=audio.createOscillator(),g=audio.createGain();
 o.frequency.setValueAtTime(100,at);o.frequency.exponentialRampToValueAtTime(43,at+.16);
 g.gain.setValueAtTime(amp,at);g.gain.exponentialRampToValueAtTime(.0001,at+.2);
 o.connect(g);g.connect(audio.master);o.start(at);o.stop(at+.22);
 }else{

 n.buffer=noiseBuffer;f.type="highpass";f.frequency.value=6200;g.gain.value=amp;

}
function sequence(t){
 if(!audio||!musicOn||audio.state!=="running")return;
 const stepDur=.3125;
 let k=Math.floor((t+.12)/stepDur);
 if(k<lastStep){lastStep=k-1}
 while(lastStep<k){
 const step=++lastStep,local=(step*stepDur)%40;
 const at=audio.currentTime+Math.max(.005,step*stepDur-t);

 const ch=chords[Math.floor(step/16)%4],sub=step%16;
 const env=Math.min(1,local/1.5,(40-local)/1.8);
 if(sub===0){ch.forEach(n=>tone(n+12,at,4,.024*env,"triangle"));tone(ch[0]-12,at,1.5,.12*env)}
 if(sub===8)tone(ch[0]-12,at,1.1,.075*env);
 if(step%2===0){const pattern=[0,2,1,3,2,1,3,2];tone(ch[pattern[(step/2)%8]]+24,at,1.25,.08*env,"sine")}
 if(step%4===0)rhythm(at,.065*env,true);
 if(step%2===1)rhythm(at,.025*env,false);

}
musicBtn.onclick=async()=>{

 audio.master.gain.value=musicOn?.42:0;lastStep=-1;

};
let recorder=null,exportCanvas=null,exportCtx=null,recording=false,wantExport=false,chunks=[],exportStart=0;
exportBtn.onclick=async()=>{
 initAudio();if(audio){await audio.resume();musicOn=true;audio.master.gain.value=.42;musicBtn.textContent="配乐已开启"}

function startExport(now){

 if(!window.MediaRecorder||!canvas.captureStream){status.textContent="浏览器不支持录制。请用录屏软件捕获此动画。";status.style.display="block";return}
 const types=['video/mp4;codecs=avc1.640028,mp4a.40.2','video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4'];
 const mime=types.find(s=>MediaRecorder.isTypeSupported(s));
 if(!mime){status.textContent="此浏览器不支持 MP4 编码，请使用支持 MP4 录制的新版本浏览器。";status.style.display="block";return}
 try{
 exportCanvas=document.createElement("canvas");exportCanvas.width=1920;exportCanvas.height=1080;
 exportCtx=exportCanvas.getContext("2d");render(0);exportCtx.drawImage(canvas,0,0,1920,1080);
 const stream=exportCanvas.captureStream(60);
 if(audio)audio.recordDest.stream.getAudioTracks().forEach(track=>stream.addTrack(track));
 recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:50000000,audioBitsPerSecond:320000});
 chunks=[];
 recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
 recorder.onstop=()=>{
 const blob=new Blob(chunks,{type:"video/mp4"}),url=URL.createObjectURL(blob);
 const a=document.createElement("a");a.href=url;a.download="笔记工作台_1080p_高码率.mp4";a.click();
 recording=false;exportBtn.disabled=false;exportBtn.textContent="导出 1080p MP4";
 status.textContent="MP4 已导出。浏览器编码为有损；严格无损需使用无损录制工作流。";status.style.display="block";
 stream.getVideoTracks().forEach(tr=>tr.stop());
 };
 exportStart=now;origin=now;offset=0;lastStep=-1;recording=true;
 recorder.start();exportBtn.disabled=true;status.style.display="block";
 status.textContent="正在录制 40 秒 · 含代码配乐 · 请保持此页面在前台";
 }catch(e){status.textContent="录制未能启动："+e.message;status.style.display="block";exportBtn.disabled=false;recording=false}
}
let offset=Number(new URLSearchParams(location.search).get("t"))||0;
offset=((offset%window.DUR)+window.DUR)%window.DUR;
let origin=null,prevTime=0;
function frame(){
 const now=performance.now();
 if(origin===null)origin=now;
 if(wantExport)startExport(now);
 const elapsed=(now-origin)/1000+offset,t=elapsed%window.DUR;
 render(t);
 if(t<prevTime)lastStep=-1;
 sequence(t);prevTime=t;
 if(recording){
 const rt=(now-exportStart)/1000;
 if(rt>=window.DUR){
 // Preserve the final composed frame instead of capturing a loop-start flash.
 render(39.94);exportCtx.drawImage(canvas,0,0,1920,1080);
 if(recorder.state==="recording")recorder.stop();
 recording=false;
 }else{
 exportCtx.drawImage(canvas,0,0,1920,1080);
 exportBtn.textContent=`录制中 ${Math.floor(rt)} / 40 秒`;
 }
 }
 requestAnimationFrame(frame);
}
