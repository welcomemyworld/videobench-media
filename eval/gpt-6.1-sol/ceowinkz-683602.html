function icon(type,x,y,col,t){

const scenes=[scene0,scene1,scene2,scene3,scene4],bounds=[0,2.8,5.8,8.8,11.8,15];
function render(t){
 c.setTransform(1,0,0,1,0,0);c.globalAlpha=1;c.shadowBlur=0;c.textBaseline='alphabetic';c.lineCap='butt';
 let index=0;for(let i=1;i<5;i++)if(t>=bounds[i])index=i;
 const p=t-bounds[index];
 scenes[index](p,t);
 // A fast, full-frame diagonal wipe gives every chapter a deliberate cut.
 if(index>0&&p<.27){
  const k=clamp(p/.27),x=mix(-290,1720,k);
  c.save();c.transform(1,0,-.3,1,0,0);
  rect(x-370,0,210,720,index===4?INK:LIME);
  rect(x-153,0,100,720,index===2?INK:BLUE);
  rect(x-45,0,18,720,CREAM);
  c.restore();
 }
 // Subtle frame grain, generated entirely in the drawing space.
 c.save();for(let i=0;i<165;i++){c.globalAlpha=.018+rand(i+3)*.015;rect(rand(i+20)*1280,rand(i+400)*720,1.4,1.4,index===1||index===4?INK:CREAM)}c.restore();
 // A slim, unobtrusive fifteen-second progress rail.
 let color=index===1||index===4?INK:LIME;
 c.save();c.globalAlpha=.2;rect(0,715,1280,5,color);c.globalAlpha=.8;rect(0,715,1280*t/15,5,color);c.restore();

 if(t<.13){rect(0,0,W,H,`rgba(0,0,0,${1-ease(t/.13)})`)}
 if(t>14.8){rect(0,0,W,H,`rgba(0,0,0,${ease((t-14.8)/.2)})`)}
}
function frame(now){
 if(start===undefined)start=now;
 const t=((now-start)/1000+offset)%window.DUR;
 render((t+window.DUR)%window.DUR);
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
