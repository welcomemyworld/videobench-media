  let birth=7.6+rand(i+34)*7.4,age=t-birth;if(age<0||age>16)continue;

  let x=Math.cos(angle)*r+Math.sin(age+i)*.5,z=Math.sin(angle)*r;
  let y=5.7+age*.38+rand(i+55)*2;
  let size=(2.1+age*.58)*(1+rand(i+47)*.35),a=.24*(1-smooth(9,16,age))*smooth(0,.7,age);
  smoke.push(x,y,z,size,a,0,clamp(age/9));
 }
 if(t>10){
  for(let i=0;i<390;i++){
   let age=rand(i+381)*Math.min(t-10,6.5),birth=t-age;
   let y=7+altitude(birth)-age*(4+rand(i+5)*3),r=(.8+age*1.1),a=i*2.399;
   let x=Math.cos(a)*r*rand(i+701)+age*.35,z=Math.sin(a)*r*rand(i+503);
   smoke.push(x,y,z,1.8+age*1.25,.2*(1-age/7),0,.25+age*.1);
  }
 }
 let len=4+power*13;
 for(let i=0;i<380;i++){
  let f=rand(i+91),a=i*2.399+t*(2+rand(i)),r=(.25+f*.9)*rand(i+51);
  fire.push(Math.cos(a)*r,7+alt-f*len,Math.sin(a)*r,.3+f*.8,(1-f)*power*.8,1,1-f);
 }
 // Back-to-front sorting for translucent steam.
 let parts=[];for(let i=0;i<smoke.length;i+=7){let p=smoke.slice(i,i+7);p.push((p[0]-eye[0])**2+(p[1]-eye[1])**2+(p[2]-eye[2])**2);parts.push(p)}
 parts.sort((a,b)=>b[7]-a[7]);smoke=[];for(let p of parts)smoke.push(...p.slice(0,7));
 return {smoke,fire};
}
function text(s,x,y,size=12,color='#bfd3d9',font='monospace',align='left'){
 ctx.font=(font==='sans-serif'?'500 ':'')+size+'px '+font;ctx.fillStyle=color;ctx.textAlign=align;ctx.fillText(s,x,y);
}
function line(x,y,x2,y2,color='#7999a055'){ctx.strokeStyle=color;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x2,y2);ctx.stroke()}
function hudDraw(t,alt,power){
 ctx.clearRect(0,0,1280,720);
 ctx.fillStyle='#02060b';ctx.fillRect(0,0,1280,31);ctx.fillRect(0,683,1280,37);
 let fade=smooth(0,1.5,t)*(1-smooth(34.5,36,t));ctx.globalAlpha=fade;
 text('P E L A G I C',48,79,23,'#f0f0e7','sans-serif');
 text('01  /  OCEAN LAUNCH SYSTEM',49,102,10,'#a4bac1');
 line(49,117,274,117);
 text('DAWN WINDOW',48,144,11,'#e6bd8b');
 text('05:42 UTC   /   NORTH ATLANTIC',48,162,10,'#a8b8be');
 text('31° 24′ N     47° 08′ W',48,180,10,'#8da3ad');
 text('AUTONOMOUS FLIGHT',1230,66,10,'#a3bac4','monospace','right');
 ctx.fillStyle='#96d5b4';ctx.beginPath();ctx.arc(1093,62,3,0,TAU);ctx.fill();
 const phase=t<7.6?'PRE-LAUNCH':t<10?'ENGINE IGNITION':t<15?'TOWER CLEAR':t<25?'POWERED ASCENT':'FLIGHT NOMINAL';
 const g=ctx.createLinearGradient(990,0,1280,0);g.addColorStop(0,'#03101a00');g.addColorStop(1,'#03101a88');ctx.fillStyle=g;ctx.fillRect(985,204,295,318);
 text('TELEMETRY  /  LIVE',1228,229,10,'#91b6bf','monospace','right');
 line(1064,242,1228,242);
 text('ALTITUDE',1064,270,10,'#8aa5b1');
 text(alt<1000?String(Math.round(alt)).padStart(4,'0'):(alt/1000).toFixed(2),1062,309,34,'#edf2ed');
 text(alt<1000?'METERS AGL':'KILOMETERS AGL',1065,328,9,'#90aab4');
 let q=Math.max(0,t-10),speed=1.24*q+.075*q*q;
 text('VERTICAL SPEED',1064,369,10,'#8aa5b1');
 text(speed.toFixed(1),1062,402,28,'#edf2ed');text('M / S',1190,400,10,'#90aab4');
 text('THRUST',1064,441,10,'#8aa5b1');
 for(let i=0;i<24;i++){ctx.fillStyle=i<Math.round(power*24)?'#eab886':'#68869435';ctx.fillRect(1064+i*6.7,456,4.4,14)}
 text(Math.round(power*100)+'% RATED',1228,490,10,'#bacad0','monospace','right');
 text('SEA STATE  02   ·   WIND  04 KT',1228,517,9,'#8aa5b1','monospace','right');
 let count=t<10?'T − '+(10-t).toFixed(1).padStart(4,'0'):'T + '+(t-10).toFixed(1).padStart(4,'0');
 text(count,48,602,32,'#f1ede4');
 text(phase,49,626,12,t<10?'#e8b986':'#aacdbb');
 let caption=t<7.6?'Every horizon is a beginning.':t<10?'Seven engines. One trajectory.':t<15?'Release the ocean.':t<25?'Beyond the platform. Beyond the horizon.':'The dawn belongs to the next frontier.';
 text(caption,640,643,16,'#d6d9d6','sans-serif','center');
 line(49,658,1230,658,'#b8ced52b');
 const marks=[['CHECKOUT',0],['IGNITION',7.6],['LIFTOFF',10],['ASCENT',20],['NOMINAL',30]];
 for(let [name,at] of marks){let x=50+at/36*1178;ctx.fillStyle=t>=at?'#e5bb8b':'#68808c';ctx.beginPath();ctx.arc(x,658,2.5,0,TAU);ctx.fill();text(name,x,675,8,t>=at?'#c5c6b8':'#70858d')}
 ctx.fillStyle='#e6bd8b';ctx.fillRect(49,657,1180*t/36,2);
 text('PELAGIC  /  FLIGHT 001',48,706,9,'#788e99');
 text('DRAG TO ORBIT   ·   DOUBLE-CLICK RESET VIEW   ·   R REPLAY',1230,706,9,'#788e99','monospace','right');
 // Restrained central tracking reticle, free of the vehicle silhouette.
 if(t>15){ctx.globalAlpha=fade*.45;line(921,347,938,347);line(929,339,929,355);text('TRACK LOCK',943,351,8,'#add1cf')}
 ctx.globalAlpha=1;
 let black=1-smooth(0,1,t)+smooth(34.8,36,t);if(black>0){ctx.fillStyle='rgba(0,0,0,'+clamp(black)+')';ctx.fillRect(0,31,1280,652)}
}
function frame(now){
 let t=((now-epoch)/1000+offset)%window.DUR;if(t<0)t+=window.DUR;
 let alt=altitude(t),power=smooth(7.6,9.7,t);
 // Three continuous camera beats: approach, release, then a rising chase.
 let angle=mix(.72,.38,smooth(0,9,t))+mix(0,-.45,smooth(13,32,t))+orbit;
 let distance=mix(88,68,smooth(0,7,t));distance=mix(distance,93,smooth(9,16,t));distance=mix(distance,67,smooth(18,30,t));
 let target=[0,19+alt,0],height=mix(27,19,smooth(0,8,t));height=mix(height,24,smooth(10,18,t));height=mix(height,5,smooth(19,29,t));
 let eye=[Math.sin(angle)*distance,alt+height+tilt,Math.cos(angle)*distance];
 target[0]=5;target[1]=alt+19;let camera=matVP(eye,target);
 gl.viewport(0,0,1280,720);gl.clearColor(0,0,0,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
 gl.disable(gl.DEPTH_TEST);gl.disable(gl.BLEND);gl.depthMask(false);
 gl.useProgram(bg);gl.bindBuffer(gl.ARRAY_BUFFER,quad);attr(bg,'p',2,8,0);
 for(let k of ['eye','forward','right','up'])gl.uniform3fv(loc(bg,k),k==='eye'?eye:camera[k]);
 gl.uniform1f(loc(bg,'time'),t);gl.drawArrays(gl.TRIANGLES,0,6);
 gl.depthMask(true);gl.enable(gl.DEPTH_TEST);
 drawMesh(deck,[0,0,0],camera.vp,eye,t,power*(1-smooth(12,17,t)));
 drawMesh(rocket,[0,7+alt,0],camera.vp,eye,t,power*(1-smooth(12,17,t)));
 gl.enable(gl.BLEND);gl.depthMask(false);
 let p=exhaust(t,alt,power,eye);drawParticles(p.smoke,smokeBuf,camera.vp,eye,t,false);
 if(power>.001){
  gl.useProgram(flame);gl.bindBuffer(gl.ARRAY_BUFFER,flameGeo.buf);attr(flame,'p',3,36,0);
  gl.uniformMatrix4fv(loc(flame,'vp'),false,camera.vp);gl.uniform1f(loc(flame,'time'),t);gl.uniform1f(loc(flame,'power'),power);
  gl.blendFunc(gl.SRC_ALPHA,gl.ONE);
  for(let i=0;i<5;i++){
   let a=i*PI/2,x=i<4?Math.cos(a)*1.02:0,z=i<4?Math.sin(a)*1.02:0;
   gl.uniform3fv(loc(flame,'origin'),[x,6.9+alt,z]);
   gl.uniform1f(loc(flame,'lengthF'),(i<4?8:13)*power*(1+.055*Math.sin(t*37+i)));
   gl.uniform1f(loc(flame,'widthF'),i<4?.48:.65);
   gl.drawArrays(gl.TRIANGLES,0,flameGeo.count);
  }
  drawParticles(p.fire,fireBuf,camera.vp,eye,t,true);
 }
 gl.depthMask(true);gl.disable(gl.BLEND);
 hudDraw(t,alt,power);requestAnimationFrame(frame);
}
if(gl)requestAnimationFrame(frame);
