<!DOCTYPE html>
<html lang="ar"><head><meta charset="utf-8"><style>
html,body{margin:0;background:#000;height:100%;overflow:hidden}
#w{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:0 0}
canvas{width:1280px;height:720px;display:block}
</style></head><body><div id="w"><canvas id="c" width="1280" height="720"></canvas></div>
<script>
const W=1280,H=720,cv=document.getElementById('c'),g=cv.getContext('2d'),box=document.getElementById('w');
window.DUR=40;
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);box.style.transform=`scale(${s}) translate(${(innerWidth/s-W)/2}px,${(innerHeight/s-H)/2}px)`;box.style.left=0;box.style.top=0}
fit();onresize=fit;
const q=new URLSearchParams(location.search),off=parseFloat(q.get('t'))||0,t0=performance.now();
function rnd(s){s=Math.sin(s*127.1)*43758.5453;return s-Math.floor(s)}
const HZ=400;
function mix(a,b,t){return a+(b-a)*t}
function col(a,b,t){return `rgb(${mix(a[0],b[0],t)|0},${mix(a[1],b[1],t)|0},${mix(a[2],b[2],t)|0})`}
function ridge(base,amp,sc,sd,ox,color){g.fillStyle=color;g.beginPath();g.moveTo(0,HZ);for(let x=0;x<=W;x+=8){const X=x+ox;g.lineTo(x,base-amp*(Math.sin(X*sc+sd)*.5+.5+.5*Math.sin(X*sc*2.3+sd*3)*.5))}g.lineTo(W,HZ);g.fill()}
function pagoda(x,y,s,c){g.fillStyle=c;for(let i=0;i<4;i++){const w=(60-i*10)*s,yy=y-i*26*s;g.fillRect(x-w*.35,yy-18*s,w*.7,18*s);g.beginPath();g.moveTo(x-w,yy-16*s);g.quadraticCurveTo(x,yy-24*s,x+w,yy-16*s);g.lineTo(x+w*.7,yy-22*s);g.lineTo(x-w*.7,yy-22*s);g.fill()}g.fillRect(x-1.5*s,y-130*s,3*s,30*s)}
function tree(x,y,s,c,t){g.fillStyle='#3a2a28';g.fillRect(x-2*s,y-30*s,4*s,30*s);g.fillStyle=c;for(let i=0;i<14;i++){const a=rnd(i+x)*6.28,r=rnd(i*3+x)*26*s;g.beginPath();g.arc(x+Math.cos(a)*r+Math.sin(t+i)*1.5,y-40*s+Math.sin(a)*r*.6,14*s,0,7);g.fill()}}
function torii(x,y,s){g.fillStyle='#c0392b';g.fillRect(x-30*s,y-60*s,6*s,60*s);g.fillRect(x+24*s,y-60*s,6*s,60*s);g.fillRect(x-40*s,y-66*s,80*s,7*s);g.fillRect(x-32*s,y-50*s,64*s,4*s)}
function scene(t,T,rain,sun){
 const day=sun;
 const sk0=col([20,24,50],[250,170,140],Math.min(1,day*1.6)),sk1=col([40,50,90],[170,200,225],day);
 let gr=g.createLinearGradient(0,0,0,HZ);gr.addColorStop(0,sk1);gr.addColorStop(1,sk0);
 g.fillStyle=gr;g.fillRect(0,0,W,HZ);
 // sun
 const sy=HZ-40-day*180;g.fillStyle=`rgba(255,${200+day*40|0},170,${.9-rain*.6})`;g.beginPath();g.arc(900,sy,38,0,7);g.fill();
 // clouds
 g.fillStyle=`rgba(${200-rain*100|0},${205-rain*100|0},${220-rain*90|0},${.35+rain*.5})`;
 for(let i=0;i<9;i++){const x=((rnd(i)*W*1.5+t*(8+i*2))%(W+300))-150,y=40+rnd(i+9)*140;for(let k=0;k<5;k++){g.beginPath();g.ellipse(x+k*34,y+Math.sin(k*2)*8,50,18+rain*10,0,0,7);g.fill()}}
 // mountains
 const fog=1-rain*.3;
 ridge(HZ-120,150,.004,1,t*3,col([90,100,140],[130,150,180],day));
 ridge(HZ-60,120,.006,5,t*6,col([60,80,100],[90,125,130],day));
 g.fillStyle='rgba(255,255,255,.7)';g.beginPath();g.moveTo(560,HZ-210);g.lineTo(620,HZ-190);g.lineTo(500,HZ-190);g.fill();
 // far shore
 g.fillStyle=col([20,30,40],[50,90,70],day);g.fillRect(0,HZ-14,W,14);
 const sh=(t*14)%400;
 for(let i=-1;i<5;i++){const x=i*400-sh+200;pagoda(x+60,HZ-12,.8,col([30,25,35],[110,50,50],day));torii(x+250,HZ-2,.6)}
 for(let i=-1;i<16;i++){const x=i*110-(t*22)%110;tree(x,HZ+2,.9,rnd(i+Math.floor(t*22/110))>.5?'#e79ab0':col([30,60,45],[70,130,80],day),t)}
 // water
 let wg=g.createLinearGradient(0,HZ,0,H);wg.addColorStop(0,col([30,40,70],[150,170,190],day));wg.addColorStop(1,col([8,18,30],[25,70,90],day));
 g.fillStyle=wg;g.fillRect(0,HZ,W,H-HZ);
 // sun reflection
 for(let y=HZ;y<H;y+=3){const d=(y-HZ)/(H-HZ),w=20+d*160*(1-rain*.6),o=Math.sin(y*.5+t*3)*w*.5*d;g.fillStyle=`rgba(255,220,180,${(.35-d*.2)*(1-rain*.7)*(.5+.5*Math.sin(y*1.7+t*4))})`;g.fillRect(900+o-w/2,y,w,2)}
 // mirrored shoreline
 g.save();g.globalAlpha=.25;g.translate(0,HZ*2);g.scale(1,-1);g.beginPath();g.rect(0,HZ,W,30);g.clip();g.restore();
 g.fillStyle=`rgba(20,40,40,.25)`;for(let i=0;i<40;i++){const x=rnd(i)*W;g.fillRect(x,HZ+4+rnd(i+5)*20,30+rnd(i)*40,2)}
 // ripples
 g.strokeStyle='rgba(255,255,255,.18)';for(let i=0;i<60;i++){const d=rnd(i+1),y=HZ+10+d*d*(H-HZ),x=(rnd(i+3)*W+t*20*d)%W,l=10+d*60;g.beginPath();g.moveTo(x,y+Math.sin(t*2+i)*2);g.lineTo(x+l,y+Math.sin(t*2+i)*2);g.stroke()}
}
function boat(x,y,t,rain){
 const r=Math.sin(t*1.3)*.04,bob=Math.sin(t*1.7)*3;
 g.save();g.translate(x,y+bob);g.rotate(r);
 // reflection
 g.save();g.scale(1,-.4);g.globalAlpha=.25;g.fillStyle='#000';g.fillRect(-120,-10,240,20);g.restore();
 // hull
 g.fillStyle='#4a2c1c';g.beginPath();g.moveTo(-150,-30);g.quadraticCurveTo(-110,30,-60,34);g.lineTo(80,34);g.quadraticCurveTo(140,26,170,-40);g.quadraticCurveTo(0,-14,-150,-30);g.fill();
 g.fillStyle='#8a5a38';g.fillRect(-120,-10,230,5);
 // canopy
 g.fillStyle='#6b3b24';g.fillRect(-60,-80,6,50);g.fillRect(50,-80,6,50);
 g.fillStyle='#b8442e';g.beginPath();g.moveTo(-90,-76);g.quadraticCurveTo(0,-108,90,-76);g.lineTo(70,-70);g.lineTo(-70,-70);g.fill();
 // lantern
 const gl=.6+.4*Math.sin(t*5);g.fillStyle=`rgba(255,180,80,${gl})`;g.beginPath();g.arc(0,-56,8,0,7);g.fill();
 // figures: rower, passenger
 fig(-20,-30,'#2c4a7a',0,t);fig(30,-30,'#a03060',1,t);
 // oar
 g.strokeStyle='#5a3a22';g.lineWidth=4;const o=Math.sin(t*2)*.3;g.beginPath();g.moveTo(-100,-20);g.lineTo(-130+Math.sin(o)*40,30);g.stroke();
 if(rain>.3){g.fillStyle='rgba(0,0,0,.0)'}
 g.restore();
}
function fig(x,y,c,hat,t){
 g.fillStyle=c;g.beginPath();g.moveTo(x-14,y);g.quadraticCurveTo(x,y-50,x+14,y);g.fill();
 g.fillStyle='#f0cfa8';g.beginPath();g.arc(x,y-38,8,0,7);g.fill();
 g.fillStyle=hat?'#222':'#d8b45a';g.beginPath();
 if(hat){g.arc(x,y-42,9,Math.PI,0);g.fill()}else{g.moveTo(x-18,y-38);g.lineTo(x,y-58);g.lineTo(x+18,y-38);g.fill()}
}
function rainfx(t,a){
 g.strokeStyle=`rgba(200,215,235,${a*.5})`;g.lineWidth=1;g.beginPath();
 for(let i=0;i<260*a;i++){const x=(rnd(i)*W+t*80)%W,y=(rnd(i+7)*H+t*900)%H;g.moveTo(x,y);g.lineTo(x-4,y+16)}g.stroke();
 g.strokeStyle=`rgba(255,255,255,${a*.3})`;for(let i=0;i<40*a;i++){const p=(t*1.5+rnd(i))%1,x=rnd(i+2)*W,y=HZ+30+rnd(i+4)*(H-HZ-40);g.beginPath();g.ellipse(x,y,p*20,p*5,0,0,7);g.stroke()}
}
function petals(t,a){for(let i=0;i<50;i++){const x=(rnd(i)*W-t*40*(1+rnd(i+1))+W*3)%W,y=(rnd(i+2)*H+t*(30+rnd(i)*30))%H;g.fillStyle=`rgba(255,180,200,${a})`;g.beginPath();g.ellipse(x,y,4,2,t+i,0,7);g.fill()}}
function frame(now){
 const T=((now-t0)/1000+off)%DUR,t=T;
 // weather cycle: clear -> rain -> clear ; sun from dusk to day
 const rain=Math.max(0,Math.min(1,Math.sin((T/DUR)*Math.PI*2-1.2)*1.6));
 const sun=.35+.65*(.5+.5*Math.sin(T/DUR*Math.PI*2-1.5));
 scene(t,T,rain,sun);
 boat(560+Math.sin(t*.4)*30,560,t,rain);
 if(rain<.5)petals(t,.8-rain);
 if(rain>.02){g.fillStyle=`rgba(40,50,70,${rain*.35})`;g.fillRect(0,0,W,H);rainfx(t,rain);
  if(rain>.8&&Math.sin(t*7)>.97){g.fillStyle='rgba(255,255,255,.35)';g.fillRect(0,0,W,H)}}
 // vignette
 const v=g.createRadialGradient(W/2,H/2,250,W/2,H/2,780);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.55)');g.fillStyle=v;g.fillRect(0,0,W,H);
 // titles
 g.textAlign='center';g.direction='rtl';g.fillStyle='#fff';g.shadowColor='rgba(0,0,0,.7)';g.shadowBlur=8;
 const fa=Math.min(1,T/2,(DUR-T)/2);g.globalAlpha=Math.max(0,fa);
 g.font='bold 40px sans-serif';g.fillText('رحلة قارب في اليابان',W/2,70);
 g.font='20px sans-serif';g.fillText(rain>.5?'مطر هادئ فوق الماء':sun>.7?'صباح مشرق وأزهار الكرز':'غروب دافئ على النهر',W/2,102);
 g.globalAlpha=1;g.shadowBlur=0;
 requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script></body></html>
