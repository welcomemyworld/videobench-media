<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#000;height:100%;overflow:hidden}
#w{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:0 0}
canvas{width:1280px;height:720px;display:block}
</style></head><body><div id="w"><canvas id="c" width="1280" height="720"></canvas></div>
<script>
const W=1280,H=720,cv=document.getElementById('c'),g=cv.getContext('2d'),wr=document.getElementById('w');
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);wr.style.transform=`scale(${s})`;wr.style.left=(innerWidth-W*s)/2+'px';wr.style.top=(innerHeight-H*s)/2+'px'}
fit();onresize=fit;
window.DUR=15;
const q=new URLSearchParams(location.search),off=parseFloat(q.get('t'))||0,st=performance.now();
function rnd(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)}
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const eo=x=>1-Math.pow(1-cl(x),3);
const eb=x=>{x=cl(x);const c=1.70158*1.4;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const ei=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
function hsl(h,s,l,a=1){return `hsla(${h},${s}%,${l}%,${a})`}
const scenes=[0,3,6.5,10,12.5,15];
function bg(t,hue){
const gr=g.createLinearGradient(0,0,W,H);
gr.addColorStop(0,hsl(hue,70,8));gr.addColorStop(1,hsl(hue+60,70,14));
g.fillStyle=gr;g.fillRect(0,0,W,H);
g.save();g.globalCompositeOperation='lighter';
for(let i=0;i<60;i++){
const x=(rnd(i)*W+t*20*(rnd(i+9)-.5)*4+W)%W,y=(rnd(i+3)*H-t*(10+rnd(i+5)*40)+H*4)%H,r=1+rnd(i+7)*3;
g.fillStyle=hsl(hue+rnd(i)*80,80,70,.35);g.beginPath();g.arc(x,y,r,0,7);g.fill();}
g.restore();
// grid
g.strokeStyle=hsl(hue,80,60,.08);g.lineWidth=1;
for(let i=0;i<=16;i++){const x=i*80-(t*30)%80;g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke()}
for(let i=0;i<=9;i++){g.beginPath();g.moveTo(0,i*80);g.lineTo(W,i*80);g.stroke()}
}
function text(s,x,y,size,col,a=1,al='center',w=800){g.save();g.globalAlpha=cl(a);g.font=`${w} ${size}px "Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif`;g.textAlign=al;g.textBaseline='middle';g.fillStyle=col;g.fillText(s,x,y);g.restore()}
function lineText(s,x,y,size,t0,t,col){ // per-char rise
const cs=[...s];g.save();g.font=`800 ${size}px "Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif`;
const ws=cs.map(c=>g.measureText(c).width),tot=ws.reduce((a,b)=>a+b,0);let cx=x-tot/2;
cs.forEach((c,i)=>{const p=eb((t-t0-i*.05)/.5);g.globalAlpha=cl(p);g.fillStyle=col;g.textAlign='left';g.textBaseline='middle';g.fillText(c,cx,y+(1-p)*60);cx+=ws[i]});g.restore()}
// product: smart bottle/orb device
function product(cx,cy,s,t,rot){
g.save();g.translate(cx,cy);g.scale(s,s);
// glow
const gl=g.createRadialGradient(0,0,10,0,0,260);gl.addColorStop(0,'hsla(190,100%,60%,.45)');gl.addColorStop(1,'transparent');
g.fillStyle=gl;g.fillRect(-300,-300,600,600);
// rings
for(let i=0;i<3;i++){g.save();g.rotate(rot*(i+1)*.5+i);g.scale(1,.3+.1*i);g.strokeStyle=hsl(180+i*40,100,65,.7);g.lineWidth=3;g.setLineDash([30,14]);g.lineDashOffset=-t*40*(i+1);g.beginPath();g.arc(0,0,170+i*35,0,7);g.stroke();g.restore()}
// body
g.rotate(Math.sin(rot)*.06);
const bd=g.createLinearGradient(-70,0,70,0);bd.addColorStop(0,'#16324a');bd.addColorStop(.35,'#58d6ff');bd.addColorStop(.6,'#2a7fb8');bd.addColorStop(1,'#0b1c30');
g.fillStyle=bd;g.beginPath();g.roundRect(-70,-110,140,230,38);g.fill();
g.fillStyle='#e9f6ff';g.beginPath();g.roundRect(-34,-150,68,48,10);g.fill();
g.fillStyle='#0b1c30';g.fillRect(-34,-124,68,6);
// screen
g.fillStyle='rgba(5,15,30,.85)';g.beginPath();g.roundRect(-42,-60,84,100,14);g.fill();
g.strokeStyle='#7ff';g.lineWidth=3;g.beginPath();
for(let i=0;i<=20;i++){const x=-34+i*3.4,y=-10+Math.sin(i*.7+t*5)*16*Math.sin(t+i*.1);i?g.lineTo(x,y):g.moveTo(x,y)}g.stroke();
text('AQUA',0,22,16,'#bff',1,'center',700);
// highlight
g.fillStyle='rgba(255,255,255,.25)';g.beginPath();g.roundRect(-58,-96,14,190,7);g.fill();
g.restore()}
function transition(t){ // wipes at scene boundaries
for(let k=1;k<5;k++){const d=t-scenes[k];if(d>-.35&&d<.45){
const p=(d+.35)/.8;g.save();g.fillStyle=hsl(180+k*40,90,55);
const a=ei(p<.5?p*2:1),b=p<.5?0:ei((p-.5)*2);
g.beginPath();g.moveTo(W*a-200*(1-a)+0,0);g.lineTo(W*a,0);g.lineTo(W*a-150,H);g.lineTo(W*b-150,H);g.lineTo(W*b,0);
g.closePath();g.globalAlpha=.95;
g.fill();g.restore()}}}
function frame(t){
g.clearRect(0,0,W,H);
const sc=scenes.findIndex((v,i)=>t>=v&&t<scenes[i+1]);const lt=t-scenes[sc];
const hue=190+sc*25;bg(t,hue);
g.save();
// camera drift
g.translate(W/2,H/2);g.scale(1+.03*Math.sin(t*.5),1+.03*Math.sin(t*.5));g.translate(-W/2,-H/2);
if(sc==0){
// intro: particles converge into logo
const p=eo(lt/1.6);
for(let i=0;i<140;i++){const a=rnd(i)*6.283,r=500*(1-p)+20+rnd(i+1)*30;
g.fillStyle=hsl(170+rnd(i)*60,90,70,.8*p+.2);g.beginPath();g.arc(W/2+Math.cos(a+lt*2*(1-p))*r*1.4,H/2+Math.sin(a+lt*2*(1-p))*r*.9,2,0,7);g.fill()}
const s=eb((lt-1)/1);
g.save();g.translate(W/2,H/2-30);g.scale(s,s);g.strokeStyle='#7ff';g.lineWidth=6;g.beginPath();g.arc(0,0,70,0,6.283*cl(lt/1.8));g.stroke();
g.fillStyle='#fff';g.beginPath();g.moveTo(0,-40);g.bezierCurveTo(30,-5,35,10,0,40);g.bezierCurveTo(-35,10,-30,-5,0,-40);g.fill();g.restore();
lineText('AQUA ONE',W/2,H/2+120,64,1.3,lt,'#fff');
text('新しい水分補給のかたち',W/2,H/2+180,24,'#9ef',eo((lt-2)/.7),'center',500);
}else if(sc==1){
// reveal product, with callouts
const p=eb(lt/1);
product(W*.5,H*.52,p*1.1,t,t);
const items=[['スマート水分管理',-1,-150],['24時間 保冷',1,-100],['UV-C 自動除菌',-1,110],['USB-C 急速充電',1,140]];
items.forEach((it,i)=>{const q=eo((lt-.8-i*.4)/.5);if(q<=0)return;
const sx=W/2+it[1]*130,ex=W/2+it[1]*(330+(1-q)*60),y=H*.52+it[2];
g.strokeStyle='#7ff';g.lineWidth=2;g.beginPath();g.moveTo(sx,H*.52+it[2]*.5);g.lineTo(sx+(ex-sx)*q,y);g.stroke();
g.fillStyle='#7ff';g.beginPath();g.arc(sx,H*.52+it[2]*.5,5,0,7);g.fill();
text(it[0],ex+it[1]*10,y-4,30,'#fff',q,it[1]<0?'right':'left')});
text('AQUA ONE',60,60,28,'#9ef',1,'left');
}else if(sc==2){
// big number stats
const stats=[['24','時間保冷'],['99.9','% 除菌率'],['500','ml 容量']];
stats.forEach((s,i)=>{const q=eb((lt-i*.5)/.7);const x=220+i*420;
g.save();g.translate(x,H/2);g.scale(q,q);
g.strokeStyle=hsl(hue+i*40,90,65,.8);g.lineWidth=4;g.beginPath();g.arc(0,0,150,-1.57,-1.57+6.283*eo((lt-i*.5)/1.5)*(i==1?.999:i?.75:.9));g.stroke();
const v=parseFloat(s[0])*eo((lt-i*.5)/1.5);
text(s[0].includes('.')?v.toFixed(1):Math.round(v)+'',0,-10,72,'#fff');
text(s[1],0,50,24,'#9ef',1,'center',500);g.restore()});
text('数字で見る、圧倒的な性能',W/2,90,38,'#fff',eo(lt/.5));
}else if(sc==3){
// colors
const cols=[200,320,40,150];
for(let i=0;i<4;i++){const q=eb((lt-i*.25)/.7);const x=190+i*300;
g.save();g.translate(x+60,H/2+20);g.scale(q*.55,q*.55);g.rotate((1-q)*.8);
g.fillStyle=hsl(cols[i],80,55);g.beginPath();g.roundRect(-70,-110,140,230,38);g.fill();
g.fillStyle='rgba(255,255,255,.3)';g.beginPath();g.roundRect(-58,-96,14,190,7);g.fill();
g.fillStyle='#fff';g.beginPath();g.roundRect(-34,-150,68,48,10);g.fill();g.restore()}
lineText('選べる4つのカラー',W/2,95,52,0,lt,'#fff');
text('あなたのスタイルに、ひと雫の彩りを',W/2,640,24,'#9ef',eo((lt-1)/.6),'center',500);
}else{
// finale
const p=eb(lt/.9);
for(let i=0;i<24;i++){const a=i/24*6.283+t*.3,r=260+60*Math.sin(t*2+i);g.strokeStyle=hsl(hue+i*8,90,65,.35);g.lineWidth=2;g.beginPath();g.moveTo(W/2+Math.cos(a)*r*1.5,H/2+Math.sin(a)*r);g.lineTo(W/2+Math.cos(a)*(r+80)*1.5,H/2+Math.sin(a)*(r+80));g.stroke()}
product(W/2,H/2-30,p*.8,t,t);
lineText('AQUA ONE',W/2,H-130,76,.5,lt,'#fff');
text('いま、すべての水を賢く。',W/2,H-65,28,'#9ef',eo((lt-1.3)/.6),'center',500);
}
g.restore();
transition(t);
// vignette & letterbox progress
const v=g.createRadialGradient(W/2,H/2,300,W/2,H/2,800);v.addColorStop(0,'transparent');v.addColorStop(1,'rgba(0,0,0,.55)');g.fillStyle=v;g.fillRect(0,0,W,H);
g.fillStyle='#7ff';g.fillRect(0,H-4,W*t/DUR,4);
// fade in/out
const f=Math.min(cl(t/.4),cl((DUR-t)/.4));g.fillStyle=`rgba(0,0,0,${1-f})`;g.fillRect(0,0,W,H);
}
function loop(){const t=((performance.now()-st)/1000+off)%DUR;frame(t);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
