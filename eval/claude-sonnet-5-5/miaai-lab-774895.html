<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#000;height:100%;overflow:hidden}
#s{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:0 0}
canvas{position:absolute;left:0;top:0;width:1280px;height:720px}
</style></head><body>
<div id="s"><canvas id="g" width="1280" height="720"></canvas><canvas id="o" width="1280" height="720"></canvas></div>
<script>
window.DUR=48;
const st=document.getElementById('s');
function fit(){const k=Math.min(innerWidth/1280,innerHeight/720);st.style.transform=`scale(${k}) translate(-50%,-50%)`;st.style.left=innerWidth/2+'px';st.style.top=innerHeight/2+'px';
st.style.transform=`translate(${-640*k}px,${-360*k}px) scale(${k})`;}
fit();addEventListener('resize',fit);
const gl=document.getElementById('g').getContext('webgl',{preserveDrawingBuffer:true});
const vs=`attribute vec2 p;void main(){gl_Position=vec4(p,0,1);}`;
const fs=`precision highp float;uniform vec2 R;uniform float T,Z,CH,GA,TH;
mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
float map(vec3 p){p=mod(p+2.,4.)-2.;float d=1e9,sc=1.;
vec3 O=vec3(.9,.6,.75)+.12*vec3(sin(T*.13),cos(T*.11),sin(T*.17))+CH*.05;
float A=.5+.35*sin(T*.09)+CH*.1,B=.7+.3*cos(T*.07);
for(int i=0;i<6;i++){p=abs(p)-O;p.xy*=rot(A);p.xz*=rot(B);
d=min(d,(length(p.xy)-TH)/sc);d=min(d,(length(p.yz+vec2(.2,0))-TH*.7)/sc);
p*=1.35;sc*=1.35;}
return d;}
void main(){vec2 uv=(gl_FragCoord.xy-.5*R)/R.y;
vec3 ro=vec3(.35*sin(T*.21),.35*cos(T*.17),Z);
vec3 rd=normalize(vec3(uv,1.1-.3*smoothstep(38.,47.,T)));
rd.xy*=rot(T*.05+.4*sin(T*.1)+CH*.3);rd.xz*=rot(.25*sin(T*.13));
float t=0.;vec3 col=vec3(0);
for(int i=0;i<84;i++){vec3 q=ro+rd*t;float d=map(q);
float g=.0032/(abs(d)+.0045);
vec3 pal=.5+.5*cos(6.2832*(vec3(0.,.33,.67)*.55+.1*CH+T*.012+t*.035));
col+=pal*g*exp(-t*.11);
t+=max(d*.75,.018);if(t>40.)break;}
col*=GA;
float v=length(uv);col*=smoothstep(1.25,.25,v)*.9+.1;
col+=vec3(.9,.6,.4)*.02*GA/(.02+dot(uv,uv)*30.)*smoothstep(38.,47.,T);
col=1.-exp(-col*1.4);col=pow(col,vec3(.9));
gl_FragColor=vec4(col,1);}`;
function sh(t,s){const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);return x}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);gl.useProgram(pr);
const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const al=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(al);gl.vertexAttribPointer(al,2,gl.FLOAT,false,0,0);
const U=n=>gl.getUniformLocation(pr,n);
const uR=U('R'),uT=U('T'),uZ=U('Z'),uC=U('CH'),uG=U('GA'),uH=U('TH');
const ox=document.getElementById('o').getContext('2d');
const chap=[[1,'I','THE SEED','a single spark, before anything'],[10,'II','BLOOM','structure remembers how to grow'],[21,'III','CATHEDRAL','light, folded into architecture'],[33,'IV','THE FALL','everything leans toward the center'],[43,'','· · ·','']];
const sm=(a,b,x)=>{x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x)};
const q=new URLSearchParams(location.search),off=parseFloat(q.get('t'))||0,t0=performance.now();
function frame(){
const T=((performance.now()-t0)/1000+off)%DUR;
let z=T*.55+(T>33?Math.pow(T-33,2)*.22:0);
let ch=sm(8,22,T)+sm(30,46,T)*1.5;
let th=.004+.05*sm(1,14,T)+.02*Math.sin(T*.5)*sm(14,20,T);
th*=1-.4*sm(40,47,T);
let ga=sm(0,4,T)*(1-sm(46,48,T))*(.35+.65*sm(2,12,T))*(1+.6*sm(34,44,T));
gl.viewport(0,0,1280,720);
gl.uniform2f(uR,1280,720);gl.uniform1f(uT,T);gl.uniform1f(uZ,z);gl.uniform1f(uC,ch);gl.uniform1f(uG,ga);gl.uniform1f(uH,th);
gl.drawArrays(gl.TRIANGLES,0,3);
ox.clearRect(0,0,1280,720);ox.textAlign='center';
for(let i=0;i<chap.length;i++){const c=chap[i],s=c[0],e=i<chap.length-1?chap[i+1][0]-1.5:DUR;
if(T<s||T>s+7||!c[2])continue;
const a=sm(s,s+1.8,T)*(1-sm(s+5,s+7,T));
ox.globalAlpha=a*.9;ox.fillStyle='#fff';ox.shadowColor='rgba(150,200,255,.9)';ox.shadowBlur=18;
ox.font='italic 16px Georgia,serif';ox.fillText(c[1]?'CHAPTER '+c[1]:'',640,602);
const sp=(1-a)*14;ox.font='36px Georgia,serif';
if(ox.letterSpacing!==undefined)ox.letterSpacing=(12+sp)+'px';
ox.fillText(c[2],640+6,648);
if(ox.letterSpacing!==undefined)ox.letterSpacing='2px';
ox.globalAlpha=a*.6;ox.font='italic 18px Georgia,serif';ox.fillText(c[3],640,682);
ox.letterSpacing='0px';}
ox.globalAlpha=1;ox.shadowBlur=0;
requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script></body></html>
