<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000;height:100%;overflow:hidden}#w{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:0 0}canvas{display:block}</style></head><body><div id="w"><canvas id="c" width="1280" height="720"></canvas></div>
<script>
window.DUR=40;
const c=document.getElementById('c'),g=c.getContext('2d'),w=document.getElementById('w');
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);w.style.transform=`scale(${s})`;w.style.marginLeft=-640*s+'px';w.style.marginTop=-360*s+'px'}
fit();onresize=fit;
const q=new URLSearchParams(location.search);const off=parseFloat(q.get('t'))||0;const t0=performance.now();
function R(n){let x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)}
const F='"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif';
// lines: start,end,speaker(m/f),text
const L=[[2,6,'m','終電、行っちゃいましたかね'],[6.5,11,'f','……まだ、来ますよ'],[11.5,15,'m','え？ 誰もいないはずじゃ'],[16,21,'f','ずっと、後ろにいます'],[22,26,'m','やめろ、来るな！'],[27,32,'f','ほら……もう、聞こえる'],[33,38,'m','うわあああああ！']];
function scene(t){ // pseudo-still depth layers
const p=t/DUR;
g.fillStyle='#050808';g.fillRect(0,0,1280,720);
const cx=Math.sin(t*.3)*30,zoom=1+p*.25;
g.save();g.translate(640,360);g.scale(zoom,zoom);g.translate(-640,-360);
// back wall/tunnel
let gr=g.createLinearGradient(0,0,0,720);gr.addColorStop(0,'#0b1514');gr.addColorStop(1,'#020303');g.fillStyle=gr;g.fillRect(0,0,1280,720);
// platform perspective
const vx=640+cx*.5,vy=300;
g.fillStyle='#0d1312';g.beginPath();g.moveTo(vx-40,vy);g.lineTo(vx+40,vy);g.lineTo(1400,720);g.lineTo(-120,720);g.fill();
g.strokeStyle='#8a7a2a';g.lineWidth=3;g.beginPath();g.moveTo(vx-20,vy);g.lineTo(200+cx,720);g.stroke();
// lights
for(let i=0;i<8;i++){const d=i/8,y=vy+Math.pow(d,1.8)*-0+0;const s=1-d;const x=vx-(40+620*s*s)*1,yy=60+ (1-s)*160;
let fl=R(Math.floor(t*12)+i)>.9?.3:1;if(i==3)fl*=R(Math.floor(t*20))>.5?1:.2;
for(const sx of[-1,1]){const X=vx+sx*(60+560*s*s),Y=40+(1-s)*230,r=10+50*s*s;
const rg=g.createRadialGradient(X,Y,0,X,Y,r*3);rg.addColorStop(0,`rgba(180,255,220,${.5*fl})`);rg.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=rg;g.fillRect(X-r*3,Y-r*3,r*6,r*6)}}
// pillars
for(let i=0;i<5;i++){const s=1-i/5,x=vx+(i%2?1:-1)*(80+520*s*s);g.fillStyle=`rgba(5,9,9,${.9})`;g.fillRect(x-20*s,vy-200*s,40*s,300*s+200*s)}
// woman back figure
const fx=vx+Math.sin(t*.5)*6,sc=t>16?1:.6,al=Math.min(1,Math.max(0,(t-10)/6));
g.globalAlpha=al*.95;g.fillStyle='#030404';g.beginPath();g.ellipse(fx,330,30*sc*1.3,38*sc*1.3,0,0,7);g.fill();
g.beginPath();g.moveTo(fx-55*sc*1.3,720);g.quadraticCurveTo(fx-60*sc*1.3,400,fx-20*sc*1.3,365);g.lineTo(fx+20*sc*1.3,365);g.quadraticCurveTo(fx+60*sc*1.3,400,fx+55*sc*1.3,720);g.fill();
// hair
g.fillRect(fx-34*sc*1.3,330,8,300*sc);g.globalAlpha=1;
g.restore();
}
function draw(t){
scene(t);
// noise & vignette
for(let i=0;i<120;i++){g.fillStyle=`rgba(255,255,255,${R(i+Math.floor(t*24)*7)*.06})`;g.fillRect(R(i*3+Math.floor(t*24))*1280,R(i*5+Math.floor(t*24))*720,2,2)}
const v=g.createRadialGradient(640,360,200,640,360,760);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.85)');g.fillStyle=v;g.fillRect(0,0,1280,720);
if(t>37.2&&R(Math.floor(t*30))>.5){g.fillStyle='rgba(255,255,255,.15)';g.fillRect(0,0,1280,720)}
// lips (woman speaking) 
for(const l of L){if(l[2]=='f'&&t>l[0]&&t<l[1]){const o=Math.abs(Math.sin(t*9))*5;g.fillStyle='rgba(120,20,30,.8)';g.beginPath();g.ellipse(640,640,26,3+o,0,0,7);g.fill()}}
// subtitles
g.textBaseline='middle';
for(const l of L){if(t<l[0]||t>l[1]+.8)continue;const el=t-l[0],tx=l[3],a=Math.min(1,(l[1]+.8-t)*2);
g.globalAlpha=a;g.fillStyle='#e8e4d8';g.shadowColor='#000';g.shadowBlur=8;
if(l[2]=='f'){g.font=`30px ${F}`;g.textAlign='center';const n=Math.min(tx.length,Math.floor(el/0.22));
for(let i=0;i<n;i++){g.globalAlpha=a*Math.min(1,(el-i*.22)*3)*.85;g.fillText(tx[i],1130,110+i*36)}}
else{const amp=l[0]>30?7:l[0]>20?3.5:0.8;g.textAlign='left';g.font=`38px ${F}`;let x=1280/2-tx.length*19;
for(let i=0;i<tx.length;i++){const k=Math.floor(t*30)+i*13;g.fillText(tx[i],x+i*38+(R(k)-.5)*amp*2,655+(R(k+9)-.5)*amp*2)}}
g.globalAlpha=1;g.shadowBlur=0}
// title/fade
const f=Math.min(1,t/1.5,(DUR-t)/1.5);g.fillStyle=`rgba(0,0,0,${1-Math.max(0,f)})`;g.fillRect(0,0,1280,720);
}
function loop(n){const t=((n-t0)/1000+off)%DUR;draw(t);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
