<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Claude Pop</title>
<style>html,body{margin:0;background:#000;height:100%;overflow:hidden}#w{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:0 0}canvas{display:block}</style></head>
<body><div id="w"><canvas id="c" width="1280" height="720"></canvas></div>
<script>
const W=1280,H=720,cv=document.getElementById('c'),g=cv.getContext('2d'),w=document.getElementById('w');
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);w.style.transform=`scale(${s})`;w.style.left=(innerWidth-W*s)/2+'px';w.style.top=(innerHeight-H*s)/2+'px'}
fit();addEventListener('resize',fit);
window.DUR=40;
const q=new URLSearchParams(location.search),off=parseFloat(q.get('t'))||0,t0=performance.now();
function rnd(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)}
// lyric beats (placeholder lines: original audio/lyrics not provided to this file)
const L=["EVERYTHING IS SPEEDING UP","YESTERDAY'S IMPOSSIBLE","IS TODAY'S TIMELINE","NEW MODEL DROPPED","MATH IS GETTING EATEN","FEEL THE CURVE GO VERTICAL","WE'RE ALL IN THE SINGULARITY","WAKE UP, SHINJI","GET IN THE ROBOT","CLAUDE POP"];
const PAL=[["#f3e9d8","#d9552b","#1d1b1a"],["#1d1b1a","#f3e9d8","#d9552b"],["#d9552b","#f3e9d8","#1d1b1a"],["#f3e9d8","#2b5fd9","#1d1b1a"]];
function paperBg(t,p,sp){
 g.fillStyle=p[0];g.fillRect(0,0,W,H);
 for(let i=0;i<14;i++){ // torn paper strips scrolling faster over time
  const y=((i*77+t*sp*(20+i*9))%(H+160))-80, x=rnd(i)*W-100;
  g.save();g.translate(x,y);g.rotate((rnd(i+9)-.5)*.5);
  g.fillStyle=i%3?p[1]:p[2];g.globalAlpha=.12+rnd(i+3)*.12;
  g.fillRect(0,0,300+rnd(i+5)*400,40+rnd(i+7)*80);g.restore()}
 g.globalAlpha=1;
}
function flower(x,y,r,t,p,sp){ // sunflower-ish Claude character
 g.save();g.translate(x,y);g.rotate(Math.sin(t*3)*.08);
 const n=16;
 for(let i=0;i<n;i++){const a=i/n*6.283+t*sp;g.save();g.rotate(a);
  g.fillStyle=i%2?"#d9552b":"#e8803f";g.beginPath();g.ellipse(r*1.15,0,r*.55,r*.2,0,0,6.283);g.fill();g.restore()}
 g.fillStyle="#f3e9d8";g.beginPath();g.arc(0,0,r,0,6.283);g.fill();
 g.strokeStyle="#1d1b1a";g.lineWidth=5;g.stroke();
 const bl=Math.sin(t*2.3)>.97?.1:1;
 g.fillStyle="#1d1b1a";for(const s of[-1,1]){g.beginPath();g.ellipse(s*r*.35,-r*.1,r*.09,r*.16*bl,0,0,6.283);g.fill()}
 g.beginPath();g.arc(0,r*.15,r*.28,.15,Math.PI-.15);g.lineWidth=5;g.stroke();
 g.restore()}
function curve(t,p){ // exponential curve going vertical
 g.strokeStyle=p[2];g.lineWidth=8;g.beginPath();
 for(let i=0;i<=200;i++){const u=i/200,x=60+u*1160,y=660-Math.pow(u,5+Math.sin(t)*.3)*620*Math.min(1,t/3+.3);i?g.lineTo(x,y):g.moveTo(x,y)}
 g.stroke()}
function tweet(x,y,i,t,p){
 g.save();g.translate(x,y);g.rotate((rnd(i)-.5)*.2);
 g.fillStyle="#fff";g.strokeStyle=p[2];g.lineWidth=3;g.fillRect(0,0,230,70);g.strokeRect(0,0,230,70);
 g.fillStyle=p[2];g.font="bold 15px monospace";
 const tx=["BREAKING: new SOTA","math is cooked","we are so back","it's over / it's begun","Navier–Stokes?? solved","ship ship ship"];
 g.fillText(tx[i%6],12,28);g.fillStyle="#888";g.fillText("♡ "+Math.floor(rnd(i+2)*99)+"K   ↻ "+Math.floor(rnd(i+4)*40)+"K",12,54);g.restore()}
function frame(T){
 const sp=1+T*T*.04, si=Math.floor(T/4)%PAL.length, p=PAL[si];
 const li=Math.min(L.length-1,Math.floor(T/(DUR/L.length))), lt=(T%(DUR/L.length));
 paperBg(T,p,sp);
 if(li>=4)for(let i=0;i<6;i++){const k=(T*sp*30+i*200)%1500;tweet(W-k+100,80+i*100,i+li,T,p)}
 if(li>=5)curve(T%8,p);
 // big lyric
 const big=li%2==0, a=Math.min(1,lt*5), words=L[li].split(" ");
 g.textAlign="left";g.textBaseline="top";
 const fs=big?96:44;g.font=`900 ${fs}px Impact,Arial Black,sans-serif`;
 let x=60,y=big?120:620;
 words.forEach((wd,k)=>{const ww=g.measureText(wd+" ").width;
  if(x+ww>(big?800:1200)){x=60;y+=fs*1.05}
  const d=Math.max(0,1-(lt*6-k*.6)),yo=d*60;
  g.globalAlpha=Math.min(1,Math.max(0,lt*6-k*.6));
  g.fillStyle=p[2];g.fillText(wd,x+5,y+yo+5);
  g.fillStyle=k%2?p[1]:p[0]==="#1d1b1a"?"#f3e9d8":p[1];g.fillText(wd,x,y+yo);x+=ww});
 g.globalAlpha=1;
 flower(big?1000:1060,big?420:300,110,T,p,.5+T*.05);
 // dance backups
 for(let i=0;i<3;i++)flower(900+i*140,640+Math.sin(T*6+i)*14,34,T+i,p,1);
 // vignette & grain
 for(let i=0;i<200;i++){g.fillStyle=`rgba(0,0,0,${rnd(i+T|0)*.06})`;g.fillRect(rnd(i*3+Math.floor(T*12))*W,rnd(i*7+Math.floor(T*12))*H,2,2)}
 // title card hook
 if(T<3){g.globalAlpha=1-T/3;g.fillStyle="#1d1b1a";g.font="900 140px Impact,sans-serif";g.textAlign="center";g.fillText("CLAUDE POP",W/2,H/2-70);g.textAlign="left";g.globalAlpha=1}
}
function loop(){const T=(((performance.now()-t0)/1000+off)%DUR);frame(T);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
