<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000;height:100%;overflow:hidden}#w{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:0 0}canvas{display:block}</style></head><body><div id="w"><canvas id="c" width="1280" height="720"></canvas></div>
<script>
const DUR=50;window.DUR=DUR;
const c=document.getElementById('c'),g=c.getContext('2d'),w=document.getElementById('w');
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);w.style.transform=`scale(${s})`;w.style.left=(innerWidth-1280*s)/2+'px';w.style.top=(innerHeight-720*s)/2+'px'}
fit();onresize=fit;
const K='#0b0907',B='#e8dfc8',O='#ff6a1a';
const scenes=[
["Pipeline: Suno → lyrics","Demucs: 4 stems","sphere","orbit","SONG"],
["Whisper aligns each line","1 line = 1 scene","wave","dolly","VOICE"],
["Storyboard: show, camera, word","Opus ×4 write scenes","cube","spin","SCENE"],
["Contact sheet: 16 frames","Verify before render","grid","tilt","CHECK"],
["Chrome 1080×1920 @60fps","Normalize to −14 LUFS","tunnel","rush","RENDER"]];
const N=scenes.length,SL=DUR/N;
// 3D helpers
function proj(p,cam){let [x,y,z]=p;
 let cy=Math.cos(cam.ry),sy=Math.sin(cam.ry);let X=x*cy+z*sy,Z=-x*sy+z*cy;
 let cx=Math.cos(cam.rx),sx=Math.sin(cam.rx);let Y=y*cx-Z*sx;Z=y*sx+Z*cx;
 Z+=cam.d;if(Z<.1)return null;const f=640/Z;return[640+X*f,360+Y*f,Z]}
function line(a,b,cam,col,al){const p=proj(a,cam),q=proj(b,cam);if(!p||!q)return;
 g.strokeStyle=col;g.globalAlpha=al;g.beginPath();g.moveTo(p[0],p[1]);g.lineTo(q[0],q[1]);g.stroke()}
function hatch(pts,cam,col,al,n){ // engraving hatch between two rings
 for(let i=0;i<n;i++)line(pts(i/n,0),pts(i/n,1),cam,col,al)}
function draw(type,t,cam,e){
 g.lineWidth=1;
 if(type=="sphere"){
  for(let i=0;i<40;i++){const la=(i/40-.5)*Math.PI;let prev=null;
   for(let j=0;j<=60;j++){const lo=j/60*6.283;const r=1.5+.15*Math.sin(lo*5+t*3+i*.3);
    const p=[r*Math.cos(la)*Math.cos(lo),r*Math.sin(la),r*Math.cos(la)*Math.sin(lo)];
    if(prev)line(prev,p,cam,i%7==0?O:B,.8);prev=p}}}
 if(type=="wave"){
  for(let i=0;i<36;i++){let prev=null;for(let j=0;j<=80;j++){const x=(j/80-.5)*6,z=(i/36-.5)*5;
   const y=.5*Math.sin(x*2+t*4+i*.2)*Math.sin(z+t)*(1+Math.sin(t*2));
   const p=[x,y,z];if(prev)line(prev,p,cam,i%6==0?O:B,.85);prev=p}}}
 if(type=="cube"){
  for(let k=0;k<3;k++){const s=1-k*.3,a=t*(1+k*.5)*(k%2?-1:1);
   const v=[];for(let i=0;i<8;i++){let x=(i&1?1:-1)*s,y=(i&2?1:-1)*s,z=(i&4?1:-1)*s;
    v.push([x*Math.cos(a)+z*Math.sin(a),y,-x*Math.sin(a)+z*Math.cos(a)])}
   for(let i=0;i<8;i++)for(let b=1;b<8;b<<=1)if(!(i&b))line(v[i],v[i|b],cam,k==1?O:B,1);
   for(let h=0;h<=10;h++){const u=-s+2*s*h/10;line([u,-s,-s],[u,s,s],cam,B,.25)}}}
 if(type=="grid"){
  for(let i=0;i<16;i++){const gx=(i%4-1.5)*1.3,gy=(Math.floor(i/4)-1.5)*1.3;
   const on=Math.floor(t*3)%16==i,s=.5;
   for(let h=0;h<=8;h++){const u=-s+2*s*h/8;line([gx-s,gy+u,0],[gx+s,gy+u,0],cam,on?O:B,on?.9:.35)}}}
 if(type=="tunnel"){
  for(let i=0;i<30;i++){const z=((i-t*6)%30+30)%30*.5;let prev=null;
   for(let j=0;j<=40;j++){const a=j/40*6.283,r=1.6+.2*Math.sin(a*6+z);
    const p=[r*Math.cos(a),r*Math.sin(a),z-3];if(prev)line(prev,p,cam,i%5==0?O:B,Math.max(0,1-z/15));prev=p}}
  for(let j=0;j<24;j++){const a=j/24*6.283;line([1.6*Math.cos(a),1.6*Math.sin(a),-3],[1.6*Math.cos(a),1.6*Math.sin(a),12],cam,B,.3)}}
}
function frame(T){
 T=((T%DUR)+DUR)%DUR;
 const si=Math.min(N-1,Math.floor(T/SL)),t=T-si*SL,u=t/SL,S=scenes[si];
 g.globalAlpha=1;g.fillStyle=K;g.fillRect(0,0,1280,720);
 // beat pulse
 const beat=Math.pow(Math.max(0,Math.cos(T*Math.PI*2*1.0)),6);
 const fade=Math.min(1,t*3,(SL-t)*3);
 const cam={rx:.3,ry:0,d:5};
 const m=S[3];
 if(m=="orbit"){cam.ry=t*.5;cam.d=5.5-u}
 if(m=="dolly"){cam.rx=.6-u*.3;cam.d=7-u*3;cam.ry=.4}
 if(m=="spin"){cam.ry=u*3;cam.rx=.4;cam.d=5}
 if(m=="tilt"){cam.rx=u*.4-.1;cam.d=6.5-u}
 if(m=="rush"){cam.rx=0;cam.ry=Math.sin(t)*.2;cam.d=3+Math.sin(t*2)*.3}
 cam.d-=beat*.15;
 g.save();g.globalAlpha=fade;draw(S[2],T,cam);g.restore();
 // orange sun / hatch circle
 g.globalAlpha=.9*fade;g.strokeStyle=O;g.lineWidth=1;
 for(let i=0;i<14;i++){g.beginPath();g.arc(1100,140,28+i*2+beat*4,0,6.283);g.stroke()}
 // frame border
 g.globalAlpha=1;g.strokeStyle=B;g.lineWidth=2;g.strokeRect(20,20,1240,680);g.lineWidth=1;g.strokeRect(28,28,1224,664);
 // text
 g.globalAlpha=fade;g.textAlign="left";
 g.fillStyle=O;g.font="bold 120px Georgia,serif";g.fillText(S[4],60,640-0*u);
 g.fillStyle=B;g.font="italic 30px Georgia,serif";g.fillText(S[0],60,95);
 g.font="22px Georgia,serif";g.fillText(S[1],60,130);
 g.globalAlpha=1;
 // progress + scene counter
 g.fillStyle=B;g.font="16px monospace";g.textAlign="right";
 g.fillText(`SCENE ${si+1}/${N}  ${T.toFixed(1)}s / 50s`,1230,680);
 g.fillStyle=O;g.fillRect(28,692,1224*T/DUR,4);
 // scanline engraving
 g.globalAlpha=.06;g.fillStyle=B;for(let y=0;y<720;y+=3)g.fillRect(0,y,1280,1);g.globalAlpha=1;
}
const off=parseFloat(new URLSearchParams(location.search).get('t'))||0,t0=performance.now();
function loop(n){frame((n-t0)/1000+off);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
