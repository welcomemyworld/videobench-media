<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000;height:100%;overflow:hidden}#w{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:0 0}canvas{width:1280px;height:720px;display:block}</style></head><body><div id="w"><canvas id="c" width="1280" height="720"></canvas></div><script>
const c=document.getElementById('c'),g=c.getContext('2d'),w=document.getElementById('w');
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);w.style.transform=`scale(${s})`;w.style.left=(innerWidth-1280*s)/2+'px';w.style.top=(innerHeight-720*s)/2+'px'}
fit();onresize=fit;
window.DUR=40;
const q=new URLSearchParams(location.search),off=parseFloat(q.get('t'))||0,st=performance.now();
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),ez=x=>1-Math.pow(1-cl(x),3);
function rnd(n){let s=Math.sin(n*127.1)*43758.5453;return s-Math.floor(s)}
const A='#7cf0c8',B='#6a7bff',C='#ff6ad5';
function txt(s,x,y,sz,col,al,a,wt){g.globalAlpha=cl(a??1);g.fillStyle=col||'#fff';g.font=`${wt||700} ${sz}px system-ui,Helvetica,Arial,sans-serif`;g.textAlign=al||'center';g.textBaseline='middle';g.fillText(s,x,y);g.globalAlpha=1}
function bg(t){const gr=g.createLinearGradient(0,0,1280,720);gr.addColorStop(0,'#05060f');gr.addColorStop(1,'#0d0a24');g.fillStyle=gr;g.fillRect(0,0,1280,720);
g.strokeStyle='rgba(124,240,200,0.06)';g.lineWidth=1;const o=(t*20)%40;for(let x=-40;x<1320;x+=40){g.beginPath();g.moveTo(x+o,0);g.lineTo(x+o,720);g.stroke()}for(let y=0;y<720;y+=40){g.beginPath();g.moveTo(0,y);g.lineTo(1280,y);g.stroke()}
for(let i=0;i<60;i++){g.fillStyle=`rgba(255,255,255,${.1+.2*rnd(i+9)})`;g.fillRect((rnd(i)*1280+t*10*(1+rnd(i+3)))%1280,rnd(i+5)*720,2,2)}}
function logo(x,y,s,a){g.globalAlpha=a;g.save();g.translate(x,y);g.scale(s,s);const gr=g.createLinearGradient(-40,-40,40,40);gr.addColorStop(0,A);gr.addColorStop(1,B);g.fillStyle=gr;g.beginPath();g.roundRect(-40,-40,80,80,20);g.fill();g.fillStyle='#05060f';g.font='800 40px system-ui';g.textAlign='center';g.textBaseline='middle';g.fillText('10x',0,2);g.restore();g.globalAlpha=1}
function code(t,x,y,n){const L=['const college = find(you);','for (frame of 7867) {','  draw(frame, math);','}','render("10xColleges");','// no screen recording'];
g.fillStyle='rgba(10,12,30,.9)';g.strokeStyle='rgba(124,240,200,.4)';g.beginPath();g.roundRect(x,y,500,260,14);g.fill();g.stroke();
['#ff5f57','#febc2e','#28c840'].forEach((k,i)=>{g.fillStyle=k;g.beginPath();g.arc(x+24+i*22,y+24,6,0,7);g.fill()});
let ch=Math.floor(n),acc=0;L.forEach((l,i)=>{const s=l.slice(0,Math.max(0,ch-acc));acc+=l.length;g.font='500 20px monospace';g.textAlign='left';g.fillStyle=i==5?'#7a86b8':i%2?A:'#cfd6ff';g.fillText(s,x+26,y+70+i*30)});
if(Math.floor(t*2)%2){g.fillStyle=A;g.fillRect(x+26+Math.min(ch-acc+0,0)*0+ (Math.min(ch,100)>0?0:0),y+70+5*30+12,0,0)}}
function scene(t){
if(t<6){const a=ez(t/1.5);logo(640,250,1.6+.1*Math.sin(t),a);
txt('10xColleges',640,370,84,'#fff','center',ez((t-.8)/1.2));
txt('Introducing the next way into college',640,440,30,A,'center',ez((t-2)/1.2),400);
txt('PRODUCT LAUNCH',640,600,16,'#7a86b8','center',ez((t-3)/1))}
else if(t<14){const u=t-6;txt('Nothing was screen-recorded.',640,110,48,'#fff','center',ez(u/1)*(1-ez(u-7)));
code(t,60,200,u*30);
const cnt=Math.floor(7867*ez(u/6));txt(cnt.toLocaleString('en-US'),960,300,100,A,'center',ez((u-.5)/1));
txt('frames drawn by code',960,380,30,'#cfd6ff','center',ez((u-1)/1),400);
g.fillStyle='rgba(255,255,255,.1)';g.fillRect(740,440,440,8);g.fillStyle=A;g.fillRect(740,440,440*ez(u/6),8);
txt('Every pixel is math.',640,600,34,C,'center',ez((u-4)/1))}
else if(t<24){const u=t-14;txt('Why 10x?',640,90,52,'#fff','center',ez(u/.8));
const F=[['Match','Find colleges that fit you',A],['Plan','Applications, mapped step by step',B],['Win','Aid and offers, side by side',C]];
F.forEach((f,i)=>{const e=ez((u-.8-i*1.2)/1),x=240+i*400,y=360+(1-e)*60;g.globalAlpha=e;g.fillStyle='rgba(18,20,48,.9)';g.strokeStyle=f[2];g.lineWidth=2;g.beginPath();g.roundRect(x-170,y-170,340,340,24);g.fill();g.stroke();
g.strokeStyle=f[2];g.lineWidth=5;g.beginPath();g.arc(x,y-70,34,0,6.28*e);g.stroke();
g.globalAlpha=1;txt(String(i+1),x,y-70,34,f[2],'center',e);txt(f[0],x,y+10,44,'#fff','center',e);txt(f[1],x,y+70,19,'#b8c0ee','center',e,400)});}
else if(t<33){const u=t-24;txt('Editing means editing a script.',640,100,44,'#fff','center',ez(u/1));
g.strokeStyle='rgba(255,255,255,.2)';g.lineWidth=1;g.beginPath();g.moveTo(140,560);g.lineTo(1140,560);g.moveTo(140,560);g.lineTo(140,200);g.stroke();
g.lineWidth=5;[[A,1],[B,.0]].forEach(([k,m],j)=>{g.strokeStyle=k;g.beginPath();for(let x=0;x<=1000*ez(u/4);x+=8){const v=j?x/1000:Math.pow(x/1000,2.2);const y=540-(j?v*120:v*320)-(j?0:0);x?g.lineTo(140+x,y):g.moveTo(140,y)}g.stroke()});
txt('10xColleges',900,230,24,A,'center',ez((u-3)/1));txt('the old way',900,470,22,B,'center',ez((u-3)/1),400);
txt('Change a line. Re-render. Done.',640,640,30,C,'center',ez((u-5)/1))}
else{const u=t-33;logo(640,230,2+.05*Math.sin(u*2),ez(u/1));
txt('10xColleges',640,350,88,'#fff','center',ez((u-.4)/1));
txt('Launching today',640,430,36,A,'center',ez((u-1.2)/1),400);
txt('10xcolleges.com',640,520,28,'#cfd6ff','center',ez((u-2)/1),400);
for(let i=0;i<30;i++){const a=i/30*6.28+u,r=200+ez(u/3)*200+40*Math.sin(u+i);g.fillStyle=[A,B,C][i%3];g.globalAlpha=.4*ez(u/2);g.beginPath();g.arc(640+Math.cos(a)*r*1.5,360+Math.sin(a)*r*.6,3,0,7);g.fill();g.globalAlpha=1}}
}
function f(now){const t=((now-st)/1000+off)%DUR;bg(t);scene(t);
const fa=Math.min(cl(t/.5),cl((DUR-t)/.5));g.fillStyle=`rgba(0,0,0,${1-fa})`;g.fillRect(0,0,1280,720);requestAnimationFrame(f)}
requestAnimationFrame(f);
</script></body></html>
