<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000;height:100%;overflow:hidden}canvas{position:absolute;left:50%;top:50%;transform-origin:0 0}</style></head><body><canvas id="c" width="1280" height="720"></canvas><script>
window.DUR=24;
const c=document.getElementById('c'),g=c.getContext('2d');
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);c.style.transform`scale(${s})`;c.style.transform='scale('+s+') translate(-50%,-50%)';c.style.transformOrigin='0 0';c.style.left='50%';c.style.top='50%';c.style.marginLeft=(-640*s+640*s)+'px'}
function fit2(){const s=Math.min(innerWidth/1280,innerHeight/720);c.style.transformOrigin='center';c.style.transform='translate(-50%,-50%) scale('+s+')'}
fit2();onresize=fit2;
const q=new URLSearchParams(location.search),off=parseFloat(q.get('t'))||0,st=performance.now();
function R(n){let x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)}
const ez=t=>t<0?0:t>1?1:t*t*(3-2*t);
const eo=t=>1-Math.pow(1-Math.min(1,Math.max(0,t)),3);
const cols=['#ff3d5a','#ffc531','#2ee6c5','#5b6cff','#f4efe6'];
function poster(t,p){ // draws poster content in local coords 0..W,0..H
  const W=360,H=520;
  g.fillStyle='#f4efe6';g.fillRect(0,0,W,H);
  g.fillStyle='#14141c';g.fillRect(16,16,W-32,H-32);
  g.fillStyle='#ffc531';g.beginPath();g.arc(180,220,100+Math.sin(t*2)*6,0,7);g.fill();
  g.fillStyle='#ff3d5a';g.fillRect(40,300,280,16);
  g.fillStyle='#2ee6c5';g.beginPath();g.moveTo(40,260);g.lineTo(140,120);g.lineTo(200,260);g.fill();
  g.fillStyle='#f4efe6';g.font='bold 56px Impact,Arial Black,sans-serif';g.textAlign='center';
  g.fillText('BREAK',W/2,390);g.fillText('OUT',W/2,445);
  g.font='14px monospace';g.fillText('NO FRAME CAN HOLD US',W/2,480);
}
function frame(now){
  let t=((now-st)/1000+off)%DUR;
  g.setTransform(1,0,0,1,0,0);
  g.fillStyle='#0b0b12';g.fillRect(0,0,1280,720);
  // bg rays
  const burst=ez((t-8)/2);
  for(let i=0;i<24;i++){g.fillStyle='rgba(255,255,255,'+(0.02+0.04*burst)+')';g.beginPath();g.moveTo(640,360);const a=i/24*6.283+t*0.1;g.lineTo(640+Math.cos(a)*1500,360+Math.sin(a)*1500);g.lineTo(640+Math.cos(a+0.1)*1500,360+Math.sin(a+0.1)*1500);g.fill()}
  // frame (wooden/white)
  const fx=640,fy=360;
  let sc=1+ez((t-1)/6)*0.15+eo((t-9)/6)*1.8;
  // phase: 0-3 poster in frame; 3-8 shaking, cracks; 8 break; after: poster large
  const shake=t>2&&t<8?Math.sin(t*60)*ez((t-2)/6)*5:0;
  const fw=400,fh=560;
  // frame fall-apart
  const fb=ez((t-8)/0.3);
  g.save();g.translate(fx,fy);
  if(fb<=0||t<8.05){
    g.translate(shake,shake*0.6);
    g.fillStyle='#caa15a';g.fillRect(-fw/2,-fh/2,fw,fh);
    g.strokeStyle='#8a6a30';g.lineWidth=3;g.strokeRect(-fw/2+8,-fh/2+8,fw-16,fh-16);
  }
  g.restore();
  // frame shards
  if(t>=8){const k=t-8;
    for(let i=0;i<28;i++){
      const a=R(i)*6.283,v=200+R(i+9)*700;
      const x=640+Math.cos(a)*v*eo(k/2.5)+0,y=360+Math.sin(a)*v*eo(k/2.5)+k*k*40;
      g.save();g.translate(x,y);g.rotate(R(i+3)*6+k*(R(i+5)-0.5)*8);
      g.globalAlpha=Math.max(0,1-k/6);
      g.fillStyle=i%3?'#caa15a':'#8a6a30';
      const w=30+R(i+1)*60,h=14+R(i+2)*24;
      g.fillRect(-w/2,-h/2,w,h);g.restore();
    }
  }
  g.globalAlpha=1;
  // poster
  g.save();
  let px=640,py=360,rot=0,s=0.9;
  if(t<8){s=0.9+ez((t-3)/5)*0.1;rot=shake*0.003}
  else{const k=t-8;s=1+eo(k/3)*0.5+Math.sin(k*1.5)*0.03;rot=Math.sin(k*1.2)*0.12*ez(k/1.5);px+=Math.sin(k*0.9)*150*ez(k/2);py+=Math.cos(k*1.1)*40*ez(k/2)}
  if(t>=16){const k=ez((t-16)/3);s=s*(1-k*0.3);px=px+(640-px)*k;py=py+(360-py)*k;rot*=1-k}
  g.translate(px+shake,py);g.rotate(rot);g.scale(s,s);g.translate(-180,-260);
  g.shadowColor='rgba(0,0,0,.6)';g.shadowBlur=30+(t>8?40:0);
  g.beginPath();g.rect(0,0,360,520);g.clip();
  poster(t);
  // cracks
  if(t>3&&t<8.1){g.strokeStyle='#fff';g.lineWidth=2;const n=Math.floor(ez((t-3)/5)*14);
    for(let i=0;i<n;i++){let x=R(i)*360,y=R(i+1)*520;g.beginPath();g.moveTo(x,y);for(let j=0;j<4;j++){x+=(R(i*7+j)-.5)*60;y+=(R(i*5+j)-.5)*60;g.lineTo(x,y)}g.stroke()}}
  g.restore();
  // poster elements escaping: orbiting shapes
  if(t>8.2){const k=t-8.2;
    for(let i=0;i<40;i++){
      const a=R(i)*6.283+k*(R(i+4)-.3)*1.2,d=eo(k/2)*(120+R(i+2)*520);
      const x=640+Math.cos(a)*d*1.6,y=360+Math.sin(a)*d*0.9;
      g.save();g.translate(x,y);g.rotate(k*(R(i+6)-.5)*5);g.fillStyle=cols[i%5];g.globalAlpha=Math.min(1,k)*0.9;
      const z=8+R(i+8)*26;
      if(i%3==0){g.beginPath();g.arc(0,0,z/1.5,0,7);g.fill()}else if(i%3==1)g.fillRect(-z,-z/3,z*2,z*0.66);else{g.beginPath();g.moveTo(0,-z);g.lineTo(z,z);g.lineTo(-z,z);g.fill()}
      g.restore();}
  }
  g.globalAlpha=1;
  // flash
  const fl=Math.max(0,1-Math.abs(t-8.05)*5);
  if(fl>0){g.fillStyle='rgba(255,255,255,'+fl+')';g.fillRect(0,0,1280,720)}
  // text
  g.textAlign='center';g.fillStyle='#f4efe6';g.font='bold 34px Arial';
  let msg='',a=0;
  if(t<3){msg='A POSTER, PERFECTLY FRAMED';a=ez(t/1)*(1-ez(t-2.4))}
  else if(t<8){msg='BUT IT WANTS MORE…';a=ez((t-3.2)/1)*(1-ez((t-7.5)/0.5))}
  else if(t<16){msg='';}
  if(t>=10&&t<16){msg='NO FRAME CAN HOLD IT';a=ez((t-10)/1)*(1-ez((t-15)/1))}
  if(t>=18){msg='BREAK OUT.';a=ez((t-18)/1)*(1-ez((t-23)/1))}
  g.globalAlpha=Math.max(0,a);
  if(msg){g.fillText(msg,640,t<8?60:(t>=18?95:680));}
  g.globalAlpha=1;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
