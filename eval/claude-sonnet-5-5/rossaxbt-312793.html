<!DOCTYPE html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000;height:100%;overflow:hidden}canvas{position:absolute;left:50%;top:50%;transform-origin:0 0}</style></head><body><canvas id="c" width="1280" height="720"></canvas><script>
const c=document.getElementById('c'),g=c.getContext('2d');window.DUR=22;
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);c.style.transform=`scale(${s}) translate(-50%,-50%)`;c.style.width='1280px';c.style.height='720px'}
fit();onresize=fit;
const q=new URLSearchParams(location.search),t0=parseFloat(q.get('t'))||0,st=performance.now();
const bez=(()=>{const x1=.45,y1=0,x2=.15,y2=1;const f=(a,b,c,t)=>3*a*(1-t)*(1-t)*t+3*b*(1-t)*t*t+t*t*t;return p=>{p=Math.max(0,Math.min(1,p));let lo=0,hi=1;for(let i=0;i<24;i++){const m=(lo+hi)/2;f(x1,x2,0,m)<p?lo=m:hi=m}return f(y1,y2,0,lo)}})();
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ph=(t,a,d=.8)=>bez((t-a)/d);
const L=(a,b,k)=>a+(b-a)*k;
const GR='#1ed760';
function rr(x,y,w,h,r){g.beginPath();g.roundRect(x-w/2,y-h/2,w,h,r)}
function cur(x,y,s=1){g.save();g.translate(x,y);g.scale(s,s);g.fillStyle='#000';g.strokeStyle='#fff';g.lineWidth=1.5;g.beginPath();g.moveTo(0,0);g.lineTo(0,17);g.lineTo(4,13);g.lineTo(7,20);g.lineTo(10,19);g.lineTo(7,12);g.lineTo(12,12);g.closePath();g.fill();g.stroke();g.restore()}
function cover(x,y,s,i){const h=[[20,200],[300,340]][i];const gr=g.createLinearGradient(x-s/2,y-s/2,x+s/2,y+s/2);gr.addColorStop(0,`hsl(${h[0]},70%,45%)`);gr.addColorStop(1,`hsl(${h[1]},60%,18%)`);g.fillStyle=gr;rr(x,y,s,s,s*.04);g.fill();g.save();g.clip();g.fillStyle='rgba(255,255,255,.15)';g.beginPath();g.arc(x-s*.1,y-s*.1,s*.3,0,7);g.fill();g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.arc(x+s*.25,y+s*.3,s*.4,0,7);g.fill();g.restore()}
function shadow(e){g.shadowColor='rgba(0,0,0,.18)';g.shadowBlur=10+30*e;g.shadowOffsetY=3+14*e}
function ns(){g.shadowColor='transparent';g.shadowBlur=0;g.shadowOffsetY=0}
function txt(s,x,y,sz,col,al='center',w=600){g.font=`${w} ${sz}px Geist,Helvetica,Arial,sans-serif`;g.fillStyle=col;g.textAlign=al;g.textBaseline='middle';g.fillText(s,x,y)}
function spark(x,y,r,k){g.save();g.translate(x,y);g.strokeStyle='#d97757';g.lineCap='round';g.lineWidth=r*.12;const n=12;for(let i=0;i<n;i++){const grp=i%2;const a=i/n*Math.PI*2+ (1-k)*(i<6?0:0.5)*(i%2?1:-1)*0;const aa=L(Math.floor(i/2)*Math.PI*2/6*1,i/n*Math.PI*2,k)+(i%2?0:0);const len=r*(.55+.45*((i*7)%5)/4)*cl(k*1.5);g.beginPath();g.moveTo(Math.cos(aa)*r*.12,Math.sin(aa)*r*.12);g.lineTo(Math.cos(aa)*len,Math.sin(aa)*len);g.stroke()}g.restore()}
const Q="is this all code?",A="yes. every frame.";
const kn=[[640,360]];
function draw(T){
const tt=T;
// background: light stage or dark world
const dark=cl(ph(tt,7.2,.8)-ph(tt,15.5,.8)*0+0);

let bg=g.createLinearGradient(0,0,1280,720);bg.addColorStop(0,'#f3f3f0');bg.addColorStop(1,'#e3e3de');g.fillStyle=bg;g.fillRect(0,0,1280,720);
const dkA=cl(ph(tt,7.2,.8)*(1-ph(tt,17.2,.8)));
if(dkA>0){const h=L(20,300,tm);g.globalAlpha=dkA;g.fillStyle=`hsl(${h},25%,${L(7,8,0)}%)`;g.fillRect(0,0,1280,720);const rg=g.createLinearGradient(0,0,0,720);rg.addColorStop(0,`hsla(${h},50%,30%,.55)`);rg.addColorStop(1,'rgba(18,18,18,0)');g.fillStyle=rg;g.fillRect(0,0,1280,720);g.globalAlpha=1}
// camera

const d1=ph(tt,12.5,.8);zoom*=L(1,2.2,d1);cx=L(640,1000,d1);cy=L(360,585,d1);
const d2=ph(tt,14.2,1);cx=L(cx,1500,d2);cy=L(cy,300,d2);
const d3=ph(tt,16.2,.8);
g.save();
const dv=ph(tt,17.2,.8);
if(tt>=16){ // chart + dive
}
const cs=tt>=16.4?L(1,40,ph(tt,16.4,.8)):1;
g.translate(640,360);g.scale(zoom,zoom);g.translate(-cx,-cy);
// scene content
// 0-7.2: generate -> check -> dots -> triangle
if(tt<8.2){
const al=1-cl((tt-7.4)/.6);
g.globalAlpha=1;
const mx=640,my=360;
if(tt<3.6){
const a=1-cl((tt-3.2)/.4);g.globalAlpha=a;
const sp=ph(tt,1.2,.8),ck=ph(tt,2.4,.8);
const w=L(220,64,sp),h=64;
shadow(.3);g.fillStyle=ck>0?L(0,0,0)||'#111':'#111';
g.fillStyle=ck>0.01?GR:'#111';rr(mx,my,w,h,32);g.fill();ns();
if(sp<.5)txt("Generate",mx,my,22,'#fff','center',600).valueOf;
if(sp>.3&&ck<.5){g.strokeStyle='#fff';g.lineWidth=4;g.lineCap='round';g.beginPath();g.arc(mx,my,16,tt*8,tt*8+4.5);g.stroke()}
if(ck>.3){g.strokeStyle='#000';g.lineWidth=5;g.lineCap='round';g.lineJoin='round';g.beginPath();g.moveTo(mx-12,my+1);g.lineTo(mx-3,my+10);g.lineTo(mx+13,my-9);g.stroke()}
const cp=tt<1.2?[L(900,640,bez(tt/1.0)),L(560,365,bez(tt/1.0))]:[640,365];
cur(cp[0],cp[1],tt>1&&tt<1.2?.85:1);g.globalAlpha=1;
}
if(tt>=3.0&&tt<7.4){
const sp=ph(tt,3.2,.8);const fly=ph(tt,3.2,.8);
const mg=ph(tt,5.6,.8);
const tri=ph(tt,6.4,.8);
const bs=L(0,1,0);
const tx=cl((tt-4.0)/1.0),rx=cl((tt-4.6)/1.0);
// dots
const ds=L(0,1,1);
const lx=L(640,L(440,640,mg),0)+0,ly=0;
const lp=[L(L(640,300,fly),640,mg),L(L(360,200,fly),360,mg)];
const rp=[L(L(640,980,fly),640,mg),L(L(360,530,fly),360,mg)];
const bub=1-mg;
g.globalAlpha=1;
// left bubble/dot
function bubble(p,w,txs,col,fc,prog){const ww=L(26,w,cl(prog*1.3))*(1)+0;const W=L(26,ww,1-mg),H=L(26,56,(1-mg)*cl(prog*2));shadow(.4);g.fillStyle=col;rr(p[0],p[1],L(26,w,(1-mg)*cl((tt-3.6)/.6)),L(26,58,(1-mg)*cl((tt-3.6)/.6)),L(13,26,1));g.fill();ns();
const bb=(1-mg)*cl((tt-3.8)/.8);if(bb>.9){const n=Math.floor(txs.length*cl(prog));txt(txs.slice(0,n),p[0],p[1],22,fc)}}
// connecting goo
g.fillStyle='#111';
if(fly<1&&fly>0){g.strokeStyle='#111';g.lineWidth=20*(1-fly);g.beginPath();g.moveTo(640,360);g.lineTo(lp[0],lp[1]);g.moveTo(640,360);g.lineTo(rp[0],rp[1]);g.stroke()}
// triangle / middle dot
const R=13;
const a1=tri;
if(tri<=0.001){g.fillStyle='#111';g.beginPath();g.arc(640,360,R+L(0,0,0),0,7);g.fill()}
else{const P=[[612,324],[612,396],[680,360]];const D=[[640-R,360-R*.2],[640,360+R],[640+R,360]];
const k=i=>bez(cl(tri*3-i));g.fillStyle='#111';g.beginPath();const q=[0,1,2].map(i=>[L(D[i][0],P[i][0],k(i)),L(D[i][1],P[i][1],k(i))]);g.moveTo(...q[0]);g.lineTo(...q[1]);g.lineTo(...q[2]);g.closePath();g.lineJoin='round';g.lineWidth=14*(1-tri)+8;g.strokeStyle='#111';g.stroke();g.fill()}
// side dots
if(mg<1){bubble(lp,300,Q,'#fff','#111',tx);bubble(rp,320,A,GR,'#000',rx)}
if(mg>=1||fly<.05){}
// goo dots at start
if(fly<.3){g.fillStyle='#111';[-1,1].forEach(s=>{g.beginPath();g.arc(640+s*L(0,0,0),360,0,0,7)})}
// cursor for click
let cpx=L(900,650,bez(cl((tt-6.4)/.8))),cpy=L(600,380,bez(cl((tt-6.4)/.8)));
if(tt>6.2){cur(cpx,cpy,tt>7.0&&tt<7.3?.8:1)}
g.globalAlpha=1}
}
// Phase 7.2+: dark flood & now playing
if(tt>=7.2&&tt<17.2){
const ap=1-ph(tt,16.6,.6)*0;
// white play button
const pb=1-ph(tt,8.0,.8);
const sw=tt>=10?ph(tt,10,.8):0;
const sx=tt>=10.0?L(0,-1,0):0;
const ox=tt>=10.0?bez(cl((tt-10.0)/.8)):0;
// now playing
const ui=ph(tt,8.4,.8);
const shift=ox<1?0:0;
const cx0=L(0,-1280*0,0);
g.globalAlpha=ui;
const slide=tt<10?0:bez(cl((tt-10)/.8));
function track(i,off){const px=640+off;cover(px,230,290,i);txt(i?'Neon Static':'Quiet Hours',px,420,30,'#fff','center',700);txt(i?'Mira Vale':'Aster',px,452,18,'#aaa','center',500)}
g.save();
track(0,-slide*900-(tt>=10?0:0)+L(0,0,0));track(1,900-slide*900);
g.restore();
g.globalAlpha=ui;
// heart
const lk=ph(tt,9.0,.6);
g.fillStyle=lk>.01?GR:'transparent';g.strokeStyle=lk>.01?GR:'#aaa';g.lineWidth=3;const hx=900,hy=440;g.beginPath();g.moveTo(hx,hy+10);g.bezierCurveTo(hx-22,hy-4,hx-10,hy-22,hx,hy-10);g.bezierCurveTo(hx+10,hy-22,hx+22,hy-4,hx,hy+10);g.fill();g.stroke();
// progress
g.fillStyle='#444';rr(640,500,500,5,3);g.fill();const pr=.15+.1*cl((tt-8)/6);g.fillStyle='#fff';rr(390+250*pr,500,500*pr,5,3);g.fill();
// controls
g.fillStyle='#fff';[[540],[740]].forEach(p=>{g.beginPath();g.moveTo(p[0]-8,560);g.lineTo(p[0]+8,550);g.lineTo(p[0]+8,570);g.fill()});
g.beginPath();g.arc(640,560,24,0,7);g.fill();g.fillStyle='#000';g.fillRect(632,550,5,20);g.fillRect(643,550,5,20);
// volume
const vol=tt<12.4?.4:L(.4,1,ph(tt,12.4,.8));
g.fillStyle='#444';rr(1000,620,160,5,3);g.fill();g.fillStyle=GR;rr(920+80*vol,620,160*vol,5,3);g.fill();g.fillStyle='#fff';g.beginPath();g.arc(920+160*vol,620,8,0,7);g.fill();
g.globalAlpha=1;
// white play shape remaining at start
if(pb>0){g.fillStyle='#fff';g.beginPath();g.arc(640,360,L(40,30,1)*1,0,7);g.fill();g.fillStyle='#111';g.beginPath();g.moveTo(630,345);g.lineTo(630,375);g.lineTo(658,360);g.fill()}
// cursor
let cp=[640,360];
if(tt>=7.2&&tt<9.5){cp=[650,380]}
if(tt>=9.5&&tt<10.8){const k=bez(cl((tt-9.6)/1.0));cp=[L(700,380,k),L(260,260,k)]}
if(tt>=10.8&&tt<12.4){cp=[L(380,1080,ph(tt,11.0,1.2)),L(260,620,ph(tt,11.0,1.2))]}
if(tt>=12.4&&tt<14.6){const k=ph(tt,12.4,.8);cp=[L(1080,1080+80*vol+0,k)+0,620]; cp[0]=920+160*vol}
if(tt>=14.6){cp=[920+160*vol,620]}
if(tt>=9.5&&tt<10.1)cp=[L(700,540,1),260];
cur(cp[0],cp[1]);
}

if(cvA>0){g.fillStyle='#121212';g.globalAlpha=cvA;g.fillRect(0,0,1280,720);g.fillStyle='#333';for(let x=20;x<1280;x+=32)for(let y=20;y<720;y+=32){g.fillRect(x,y,2,2)}
const ch=ph(tt,15.4,1.4);
const cnt=Math.round(ch*128);
g.strokeStyle=GR;g.lineWidth=5;g.lineCap='round';g.lineJoin='round';g.beginPath();const N=40;for(let i=0;i<=N*ch;i++){const u=i/N;const x=160+u*880;const y=560-Math.pow(u,2.2)*380-Math.sin(u*9)*14*(1-u);i?g.lineTo(x,y):g.moveTo(x,y)}g.stroke();
const ex=160+ch*880,ey=560-Math.pow(ch,2.2)*380-Math.sin(ch*9)*14*(1-ch);
g.fillStyle='#fff';g.beginPath();g.arc(ex,ey,10,0,7);g.fill();

if(tt>16){cur(L(ex+160,ex,ph(tt,16,.6)),L(ey+120,ey,ph(tt,16,.6)))}
g.globalAlpha=1}
// dive: light stage fills
const dvk=ph(tt,16.8,.8);
if(tt>=16.8){const x=1040,y=180;g.save();g.fillStyle='#f3f3f0';g.globalAlpha=dvk;g.beginPath();g.arc(x,y,dvk*dvk*1600+10,0,7);g.fill();g.restore()}
// ending
if(tt>=17.6){
const e1=ph(tt,17.6,.8),e2=ph(tt,18.8,.8),e3=ph(tt,19.6,1);
const w=L(L(0,300,e1),L(300,6,1),e2),h=L(L(0,64,e1),L(64,6,1),e2);
if(e3<.01){shadow(e1);g.fillStyle='#111';rr(640,360,Math.max(w,4),Math.max(h,4),h/2);g.fill();ns();if(e2<.4)txt('Ask Claude',640,360,22,'#fff','center',600)}
else{ }
if(e2>0.5||e3>0){const lineh=L(6,0,e3);if(e3<1){g.fillStyle='#111';g.globalAlpha=1-e3;rr(640,360,6,6,3);g.fill();g.globalAlpha=1}}
if(e3>0){spark(640,360,L(20,140,e3),e3);}
if(tt>=20.6)spark(640,360,140,1);
}
}
function frame(){const T=(t0+(performance.now()-st)/1000)%DUR;

draw(T2);requestAnimationFrame(frame)}
frame();
</script></body></html>
