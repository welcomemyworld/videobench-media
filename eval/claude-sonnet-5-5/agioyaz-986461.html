function render(t){
const I0=sm(0,1.2,t),w=sm(14,14.6,t),k=sm(27,31,t),wa=1-sm(27.5,30.5,t);let L=0;

g.fillStyle='rgba('+c+','+(.075*q.o*I0)+')';g.beginPath();P.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.fill()}
