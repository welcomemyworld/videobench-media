<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#000;height:100%;overflow:hidden}
#w{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:0 0}
canvas{width:1280px;height:720px;display:block}
</style></head><body><div id="w"><canvas id="c" width="1280" height="720"></canvas></div>
<script>
window.DUR=20;
const c=document.getElementById('c'),g=c.getContext('2d'),w=document.getElementById('w');
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);w.style.transform=`scale(${s})`;w.style.left=(innerWidth-1280*s)/2+'px';w.style.top=(innerHeight-720*s)/2+'px'}
fit();onresize=fit;
const q=new URLSearchParams(location.search),off=parseFloat(q.get('t'))||0,st=performance.now();
const W=1280,H=720,CX=640,CY=360,TAU=Math.PI*2;
const hsl=(h,s,l,a=1)=>`hsla(${((h%360)+360)%360},${s}%,${l}%,${a})`;
const ease=x=>x<0?0:x>1?1:x*x*(3-2*x);
const eo=x=>1-Math.pow(1-Math.min(1,Math.max(0,x)),4);
function rnd(n){const s=Math.sin(n*127.1)*43758.5453;return s-Math.floor(s)}
// scenes: 0-4 tunnel, 4-8 spirograph/rings, 8-12 kaleido petals, 12-16 grid waves/eye, 16-20 finale
function bg(t,h){
 const r=g.createRadialGradient(CX,CY,0,CX,CY,500);
 r.addColorStop(0,hsl(h+40,80,12));r.addColorStop(1,hsl(h+200,90,3));
 g.fillStyle=r;g.fillRect(0,0,W,H);
}
function tunnel(t,k){
 const n=26;
 for(let i=n;i>=0;i--){
  let z=((i+ -t*1.6)%n+n)%n; let p=z/n; let s=Math.pow(p,2.2)*1100+4;
  const sides=3+Math.floor(k*3)%4+ (i%2?0:0);
  g.save();g.translate(CX+Math.sin(t*.7+p*3)*40*p,CY+Math.cos(t*.5+p*3)*30*p);
  g.rotate(t*.4+p*(3+Math.sin(t)*2));
  g.beginPath();const sd=5+Math.floor(k)%3;
  for(let j=0;j<=sd;j++){const a=j/sd*TAU;g.lineTo(Math.cos(a)*s,Math.sin(a)*s)}
  g.lineWidth=1+p*10;g.strokeStyle=hsl(t*50+p*360,100,60,Math.min(1,(1-p)*2+.2));
  g.shadowColor=hsl(t*50+p*360,100,60);g.shadowBlur=18;g.stroke();
  g.restore();
 }
 g.shadowBlur=0;
}
function spiro(t,lt){
 g.globalCompositeOperation='lighter';
 for(let L=0;L<5;L++){
  g.beginPath();
  const R=150+L*28,r=(40+L*13)+Math.sin(t*.6)*12,d=60+L*20+Math.sin(t+L)*30;
  for(let i=0;i<=900;i++){
   const a=i/900*TAU*7+t*.3;
   const x=(R-r)*Math.cos(a)+d*Math.cos((R-r)/r*a);
   const y=(R-r)*Math.sin(a)-d*Math.sin((R-r)/r*a);
   const sc=1.1*ease(lt*2-L*.15);
   i?g.lineTo(CX+x*sc,CY+y*sc):g.moveTo(CX+x*sc,CY+y*sc);
  }
  g.lineWidth=2;g.strokeStyle=hsl(t*40+L*60,100,60,.8);g.stroke();
 }
 for(let i=0;i<14;i++){
  const rr=(i*60+t*120)%840;
  g.beginPath();g.arc(CX,CY,rr,0,TAU);
  g.lineWidth=2+rr/60;g.strokeStyle=hsl(t*60+i*30,100,55,.25*(1-rr/840));g.stroke();
 }
 g.globalCompositeOperation='source-over';
}
function petals(t){
 g.globalCompositeOperation='lighter';
 const N=16;
 for(let L=0;L<6;L++){
  for(let i=0;i<N;i++){
   g.save();g.translate(CX,CY);
   g.rotate(i/N*TAU+t*(.2+L*.07)*(L%2?-1:1));
   const len=80+L*55+Math.sin(t*2+L)*30;
   g.beginPath();g.moveTo(0,0);
   g.bezierCurveTo(len*.3,-len*.35,len*.8,-len*.2,len,0);
   g.bezierCurveTo(len*.8,len*.2,len*.3,len*.35,0,0);
   g.fillStyle=hsl(t*45+L*50+i*6,100,50,.12);g.fill();
   g.strokeStyle=hsl(t*45+L*50+i*6,100,70,.5);g.lineWidth=1.2;g.stroke();
   g.restore();
  }
 }
 g.globalCompositeOperation='source-over';
}
function grid(t){
 g.globalCompositeOperation='lighter';
 const cols=48,rows=27;
 for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
  const px=(x+.5)*W/cols,py=(y+.5)*H/rows;
  const dx=px-CX,dy=py-CY,d=Math.hypot(dx,dy);
  const v=Math.sin(d*.02-t*4)+Math.sin(px*.012+t*1.3)*.5+Math.cos(py*.015-t);
  const s=6+v*5+ (Math.sin(d*.01-t*3)>.7?6:0);
  g.save();g.translate(px+Math.cos(v+t)*6,py+Math.sin(v+t)*6);g.rotate(v+t);
  g.fillStyle=hsl(d*.5+t*80+v*40,100,55,.85);
  g.fillRect(-Math.abs(s)/2,-Math.abs(s)/2,Math.abs(s),Math.abs(s));
  g.restore();
 }
 // eye
 const o=Math.sin(t*1.5)*.3+.7;
 g.globalCompositeOperation='source-over';
 g.beginPath();g.ellipse(CX,CY,260,150*o,0,0,TAU);g.fillStyle='rgba(0,0,0,.75)';g.fill();
 g.lineWidth=4;g.strokeStyle=hsl(t*100,100,65);g.stroke();
 for(let i=0;i<6;i++){g.beginPath();g.arc(CX+Math.sin(t)*20,CY,110-i*17,0,TAU);g.strokeStyle=hsl(t*100+i*40,100,60);g.lineWidth=5;g.stroke()}
 g.beginPath();g.arc(CX+Math.sin(t)*20,CY,16,0,TAU);g.fillStyle='#000';g.fill();
}
function text(s,y,size,a,t,sp){
 g.save();g.font=`900 ${size}px Impact,Arial Black,sans-serif`;g.textAlign='center';g.textBaseline='middle';
 const ch=[...s];let tot=0;const ws=ch.map(x=>{const m=g.measureText(x).width+sp;tot+=m;return m});
 let x=CX-tot/2;
 ch.forEach((l,i)=>{
  const e=eo(a*1.6-i*.06);
  g.save();g.globalAlpha=e;g.translate(x+ws[i]/2,y+(1-e)*60+Math.sin(t*3+i)*4);g.rotate((1-e)*.8);
  g.lineWidth=3;g.strokeStyle='#000';g.strokeText(l,0,0);
  g.fillStyle='#fff';g.shadowColor=hsl(t*80+i*25,100,60);g.shadowBlur=30;g.fillText(l,0,0);
  g.restore();x+=ws[i];
 });
 g.restore();
}
function frame(now){
 let T=((now-st)/1000+off)%DUR;
 const sc=Math.floor(T/4),lt=(T%4)/4;
 bg(T,T*30);
 g.save();
 // global zoom punch on scene starts
 const pz=1+0.08*Math.pow(1-Math.min(1,lt*5),2);
 g.translate(CX,CY);g.scale(pz,pz);g.rotate(Math.sin(T*.5)*.03);g.translate(-CX,-CY);
 if(sc==0){tunnel(T,T)}
 else if(sc==1){tunnel(T*.5,0);spiro(T,lt)}
 else if(sc==2){petals(T);}
 else if(sc==3){grid(T)}
 else{tunnel(T*1.5,T*2);petals(T*1.2);spiro(T,1)}
 g.restore();
 // vignette
 const v=g.createRadialGradient(CX,CY,250,CX,CY,760);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.75)');
 g.fillStyle=v;g.fillRect(0,0,W,H);
 // flash transitions
 const f=Math.pow(Math.max(0,1-lt*8),2)*(T>.1?1:0);
 if(f>0){g.fillStyle=hsl(T*90,100,70,f*.7);g.fillRect(0,0,W,H)}
 // titles
 const titles=["MOTION","HYPNOSIS","BLOOM","PULSE","SHOWREEL"];
 const sub=["DESIGN IN MOTION","LOOP · SPIN · BREATHE","GEOMETRY ALIVE","RHYTHM OF COLOR","2025 · MOTION DESIGNER"];
 const fade=lt>.88?1-(lt-.88)/.12:1;
 g.globalAlpha=fade;
 text(titles[sc],CY-10+ (sc==4?0:0),sc==1?96:120,lt,T,sc==2?30:16);
 g.font='600 24px Arial, sans-serif';g.textAlign='center';g.fillStyle='#fff';
 g.globalAlpha=fade*ease((lt-.15)*4);
 const s=sub[sc].split('').join(String.fromCharCode(8202,8202,8202));
 g.fillText(s,CX,CY+80);
 g.globalAlpha=1;
 // bars
 const bh=40*Math.min(1,T*2,(DUR-T)*2)+ 0;
 g.fillStyle='#000';g.fillRect(0,0,W,bh);g.fillRect(0,H-bh,W,bh);
 // progress
 g.fillStyle=hsl(T*60,100,60);g.fillRect(0,H-4,W*T/DUR,4);
 // particles
 g.globalCompositeOperation='lighter';
 for(let i=0;i<60;i++){
  const a=rnd(i)*TAU,sp=.3+rnd(i+9),p=((T*sp*.3+rnd(i+3))%1);
  const r=p*p*800;g.fillStyle=hsl(i*9+T*60,100,70,1-p);
  g.beginPath();g.arc(CX+Math.cos(a+T*.2)*r,CY+Math.sin(a+T*.2)*r,1+p*4,0,TAU);g.fill();
 }
 g.globalCompositeOperation='source-over';
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
