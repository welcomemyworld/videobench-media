<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000;height:100%;overflow:hidden}#w{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:0 0}canvas{width:1280px;height:720px;display:block}</style></head><body><div id="w"><canvas id="c" width="1280" height="720"></canvas></div><script>
const c=document.getElementById('c'),x=c.getContext('2d'),w=document.getElementById('w');
window.DUR=30;
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);w.style.transform=`scale(${s})`;w.style.marginLeft=-640*s+'px';w.style.marginTop=-360*s+'px'}
fit();onresize=fit;
const q=new URLSearchParams(location.search),off=parseFloat(q.get('t'))||0,t0=performance.now();
const E=t=>t<0?0:t>1?1:1-Math.pow(1-t,3),cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
// 9:16 phone-format panel centered in 1280x720: 405x720
const PW=405,PX=(1280-PW)/2;
const scenes=[
{n:'Mercado',ic:'cart',col:'#34d399',items:[['Frutas e legumes',32.9],['Pães e laticínios',24.5],['Carnes',68.3],['Bebidas',19.9]],cat:'Compras'},
{n:'Posto Shell',ic:'fuel',col:'#fbbf24',items:[['Gasolina 32 L',198.4],['Lavagem',35],['Café',9.5]],cat:'Combustível'},
{n:'Restaurante',ic:'fork',col:'#f472b6',items:[['Prato executivo',42],['Sobremesa',18],['Bebidas',24],['Serviço 10%',8.4]],cat:'Alimentação'}];
function rr(a,b,w2,h,r){x.beginPath();x.roundRect(a,b,w2,h,r)}
function txt(s,a,b,sz,col,al='center',wt=600){x.font=`${wt} ${sz}px Helvetica,Arial,sans-serif`;x.fillStyle=col;x.textAlign=al;x.fillText(s,a,b)}
function brl(v){return 'R$ '+v.toFixed(2).replace('.',',')}
function icon(k,cx,cy,col){x.strokeStyle=col;x.lineWidth=4;x.lineCap='round';x.lineJoin='round';x.beginPath();
if(k=='cart'){x.moveTo(cx-16,cy-14);x.lineTo(cx-10,cy-14);x.lineTo(cx-5,cy+8);x.lineTo(cx+12,cy+8);x.lineTo(cx+16,cy-6);x.lineTo(cx-8,cy-6);x.stroke();x.beginPath();x.arc(cx-3,cy+15,2,0,7);x.arc(cx+10,cy+15,2,0,7);x.stroke()}
else if(k=='fuel'){x.rect(cx-12,cy-15,16,30);x.moveTo(cx+4,cy-4);x.lineTo(cx+12,cy-4);x.lineTo(cx+12,cy+8);x.stroke();x.beginPath();x.moveTo(cx-8,cy-9);x.lineTo(cx,cy-9);x.stroke()}
else{x.moveTo(cx-8,cy-15);x.lineTo(cx-8,cy+15);x.moveTo(cx-14,cy-15);x.lineTo(cx-14,cy-4);x.quadraticCurveTo(cx-8,cy+2,cx-2,cy-4);x.lineTo(cx-2,cy-15);x.moveTo(cx+12,cy-15);x.quadraticCurveTo(cx+4,cy-4,cx+12,cy+2);x.lineTo(cx+12,cy+15);x.stroke()}}
function bg(t){const g=x.createLinearGradient(0,0,1280,720);g.addColorStop(0,'#05060f');g.addColorStop(1,'#10082a');x.fillStyle=g;x.fillRect(0,0,1280,720);
for(let i=0;i<3;i++){const px=640+Math.cos(t*.3+i*2)*300,py=360+Math.sin(t*.25+i*2.4)*200;const r=x.createRadialGradient(px,py,0,px,py,260);r.addColorStop(0,['#6d28d980','#06b6d460','#ec489960'][i]);r.addColorStop(1,'#0000');x.fillStyle=r;x.fillRect(0,0,1280,720)}}
function draw(t){
bg(t);
// side bars clip to 9:16
x.save();rr(PX,0,PW,720,0);x.clip();
x.fillStyle='rgba(8,8,22,.78)';x.fillRect(PX,0,PW,720);
const cx=640;
if(t<4){const a=E(t/1.2),b=E((t-1.5)/1);
x.globalAlpha=a;
const g=x.createLinearGradient(cx-80,0,cx+80,0);g.addColorStop(0,'#a78bfa');g.addColorStop(1,'#22d3ee');
x.fillStyle=g;x.beginPath();x.arc(cx,250+(1-a)*30,56*(.6+.4*a),0,7);x.fill();
x.strokeStyle='#fff';x.lineWidth=3;x.beginPath();x.arc(cx,250,34,0,7);x.stroke();
txt('Orbe',cx,380,56,'#fff','center',800);
x.globalAlpha=b;txt('Seu dinheiro,',cx,450,28,'#cbd5e1');txt('sob controle.',cx,486,28,'#fff','center',800);
txt('Veja um dia de gastos real',cx,590,17,'#94a3b8');x.globalAlpha=1}
else if(t<25){
const st=t-4,si=Math.min(2,Math.floor(st/7)),lt=st-si*7,s=scenes[si];
const ain=E(lt/.6),aout=1-E((lt-6.4)/.6);x.globalAlpha=cl(Math.min(ain,aout));
const ox=(1-ain)*60;x.translate(ox,0);
txt('Dia a dia · '+(si+1)+'/3',cx,60,15,'#94a3b8');
// header card
x.fillStyle=s.col+'33';x.beginPath();x.arc(cx,135,38,0,7);x.fill();icon(s.ic,cx,135,s.col);
txt(s.n,cx,212,34,'#fff','center',800);
// receipt
const rx=PX+28,rw=PW-56;rr(rx,245,rw,270,18);x.fillStyle='rgba(255,255,255,.07)';x.fill();
let tot=0,y=285;
s.items.forEach((it,i)=>{const p=E((lt-.8-i*.7)/.5);x.globalAlpha=cl(Math.min(ain,aout))*p;
txt(it[0],rx+20,y+(1-p)*12,17,'#e2e8f0','left',500);txt(brl(it[1]),rx+rw-20,y+(1-p)*12,17,'#fff','right',700);y+=42;if(p>0)tot+=it[1]*p});
x.globalAlpha=cl(Math.min(ain,aout));
x.strokeStyle='rgba(255,255,255,.2)';x.setLineDash([6,6]);x.beginPath();x.moveTo(rx+20,470);x.lineTo(rx+rw-20,470);x.stroke();x.setLineDash([]);
txt('Total',rx+20,500,18,'#94a3b8','left');txt(brl(tot),rx+rw-20,502,26,s.col,'right',800);
// categorized chip
const cp=E((lt-4)/.6);x.globalAlpha=cl(Math.min(ain,aout))*cp;
rr(cx-110,545+(1-cp)*15,220,50,25);x.fillStyle=s.col;x.fill();
txt('✓ Categorizado: '+s.cat,cx,577+(1-cp)*15,15,'#06060f','center',800);
x.globalAlpha=cl(Math.min(ain,aout));
// running day total
let day=0;for(let k=0;k<si;k++)day+=scenes[k].items.reduce((a,b)=>a+b[1],0);
day+=tot;txt('Gasto do dia: '+brl(day),cx,660,19,'#fff','center',700);
}else{
const a=E((t-25)/.8);x.globalAlpha=a;
const g=x.createLinearGradient(cx-80,0,cx+80,0);g.addColorStop(0,'#a78bfa');g.addColorStop(1,'#22d3ee');
x.fillStyle=g;x.beginPath();x.arc(cx,190,44,0,7);x.fill();
let T=0;scenes.forEach(s=>s.items.forEach(i=>T+=i[1]));
txt('Total de hoje',cx,300,20,'#94a3b8');txt(brl(T),cx,355,44,'#fff','center',800);
scenes.forEach((s,i)=>{const v=s.items.reduce((a,b)=>a+b[1],0),p=E((t-25.6-i*.3)/.6),bw=(PW-80)*v/T*p;
txt(s.n,PX+40,410+i*52,14,'#cbd5e1','left');txt(brl(v),PX+PW-40,410+i*52,14,'#fff','right');
rr(PX+40,418+i*52,PW-80,8,4);x.fillStyle='#ffffff18';x.fill();rr(PX+40,418+i*52,bw,8,4);x.fillStyle=s.col;x.fill()});
txt('Conheça o Orbe',cx,625,26,'#fff','center',800);
txt('lp.meuorbe.com.br',cx,662,19,'#22d3ee','center',700)}
x.restore();x.globalAlpha=1;
x.strokeStyle='rgba(255,255,255,.15)';x.lineWidth=2;x.strokeRect(PX,1,PW,718);
}
function f(){const t=((performance.now()-t0)/1000+off)%DUR;draw(t);requestAnimationFrame(f)}
f();
</script></body></html>
