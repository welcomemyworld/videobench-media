<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#000;height:100%;overflow:hidden}
#w{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:0 0}
canvas{width:1280px;height:720px;display:block}
</style></head><body><div id="w"><canvas id="c" width="1280" height="720"></canvas></div>
<script>
window.DUR=30;
const c=document.getElementById('c'),g=c.getContext('2d'),w=document.getElementById('w');
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);w.style.transform=`scale(${s})`;w.style.marginLeft=-640*s+'px';w.style.marginTop=-360*s+'px'}
fit();onresize=fit;
const off=parseFloat(new URLSearchParams(location.search).get('t'))||0;
const t0=performance.now();
const TAU=Math.PI*2,W=1280,H=720;
const ease=x=>x<0?0:x>1?1:x*x*(3-2*x);
const eo=x=>{x=Math.max(0,Math.min(1,x));return 1-Math.pow(1-x,4)};
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
function rnd(s){s=Math.sin(s*127.1+311.7)*43758.5453;return s-Math.floor(s)}
const pal=[[255,70,120],[255,170,60],[80,220,255],[150,110,255],[90,255,170]];
function col(i,a=1){const p=pal[((i%5)+5)%5];return `rgba(${p[0]},${p[1]},${p[2]},${a})`}
function bg(t,hue){
 const gr=g.createRadialGradient(W/2,H/2,50,W/2,H/2,800);
 gr.addColorStop(0,`hsl(${hue},45%,12%)`);gr.addColorStop(1,'#030308');
 g.fillStyle=gr;g.fillRect(0,0,W,H);
 for(let i=0;i<70;i++){const x=(rnd(i)*W+t*(5+rnd(i+9)*20))%W,y=rnd(i+3)*H;
  g.fillStyle=`rgba(255,255,255,${.1+.2*rnd(i+5)*(.5+.5*Math.sin(t*2+i))})`;g.fillRect(x,y,1.5,1.5)}
}
function text(s,x,y,size,a,sp=0,wt='700'){
 g.save();g.globalAlpha=cl(a);g.font=`${wt} ${size}px Helvetica,Arial,sans-serif`;g.textAlign='center';g.textBaseline='middle';
 if(g.letterSpacing!==undefined)g.letterSpacing=sp+'px';g.fillStyle='#fff';g.fillText(s,x,y);g.restore()}
// Scene 1: 0-7 rings converge, title
function s1(t){
 bg(t,230);
 g.save();g.translate(W/2,H/2);g.globalCompositeOperation='lighter';
 for(let i=0;i<48;i++){
  const p=eo((t-i*.03)/2.2);const r=(1-p)*700+60+i*3.2*p;
  const a=p*.9*(1-ease((t-5.5)/1.5));
  g.strokeStyle=col(i,a*.7);g.lineWidth=2;
  g.beginPath();g.ellipse(0,0,r,r*(.35+.65*Math.abs(Math.cos(i*.2+t*.4))),t*.3+i*.13,0,TAU);g.stroke()}
 g.restore();
 const a=ease((t-2)/1.2)*(1-ease((t-6)/.8));
 const k=eo((t-2)/1.8);
 text('M O T I O N',W/2,H/2-10,92*(0.9+.1*k),a,18+(1-k)*40);
 text('a study in rhythm, light and geometry',W/2,H/2+60,22,a*.7,4,'300');
}
// Scene 2: 7-14 wave of bars / particle sine
function s2(t){
 bg(t+10,280);
 g.globalCompositeOperation='lighter';
 const n=64;
 for(let i=0;i<n;i++){
  const x=60+i*(W-120)/(n-1);
  const ap=eo((t-i*.025)/1.2);
  for(let j=0;j<7;j++){
   const ph=t*2.2+i*.22+j*.9;
   const y=H/2+Math.sin(ph)*110*Math.sin(t*.6+j*.3+1)*ap+(j-3)*34*ap;
   const r=3+3*Math.sin(ph*1.3)**2;
   g.fillStyle=col(j+Math.floor(i/16),.85);
   g.beginPath();g.arc(x,y,r*ap,0,TAU);g.fill();
   g.fillStyle=col(j+Math.floor(i/16),.12);g.beginPath();g.arc(x,y,r*4*ap,0,TAU);g.fill()}
 }
 g.globalCompositeOperation='source-over';
 const a=ease((t-.8)/.8)*(1-ease((t-6)/.8));
 text('FLOW',W/2,92,48,a,22);
}
// Scene 3: 14-22 orbit/spirograph tunnel
function s3(t){
 bg(t+20,170);
 g.save();g.translate(W/2,H/2);g.globalCompositeOperation='lighter';
 const fade=ease(t/1)*(1-ease((t-7)/1));
 for(let k=0;k<5;k++){
  g.strokeStyle=col(k,.55*fade);g.lineWidth=1.6;g.beginPath();
  for(let i=0;i<=500;i++){
   const u=i/500*TAU*6;
   const R=230+30*Math.sin(t+k),r=60+k*22,d=110+40*Math.sin(t*.8+k);
   const x=(R-r)*Math.cos(u+t*.1*k)+d*Math.cos((R-r)/r*u+t*.5);
   const y=(R-r)*Math.sin(u+t*.1*k)-d*Math.sin((R-r)/r*u+t*.5);
   const z=eo(t/2);
   i?g.lineTo(x*z,y*z):g.moveTo(x*z,y*z)}
  g.stroke()}
 for(let i=0;i<14;i++){const an=t*.8+i/14*TAU,rr=300*eo(t/2);
  g.fillStyle=col(i,.9*fade);g.beginPath();g.arc(Math.cos(an)*rr,Math.sin(an)*rr*.55,6,0,TAU);g.fill()}
 g.restore();
 text('ORBIT',W/2,H-70,34,ease((t-1)/1)*(1-ease((t-6.5)/.8)),20);
}
// Scene 4: 22-30 burst & finale
function s4(t){
 bg(t+30,340);
 g.save();g.translate(W/2,H/2);g.globalCompositeOperation='lighter';
 for(let i=0;i<260;i++){
  const an=rnd(i)*TAU,sp=80+rnd(i+1)*520,life=t-rnd(i+2)*.6;
  if(life<0)continue;
  const d=eo(life/3.5)*sp, gy=life*life*14;
  const x=Math.cos(an)*d,y=Math.sin(an)*d+gy;
  const a=cl(1-life/7)*(.5+.5*Math.sin(t*8+i));
  g.fillStyle=col(i,a);g.beginPath();g.arc(x,y,1.5+rnd(i+4)*3,0,TAU);g.fill()}
 const pulse=ease(t/.6)*(1-ease((t-.6)/1.4));
 g.strokeStyle=`rgba(255,255,255,${pulse})`;g.lineWidth=6*pulse;
 g.beginPath();g.arc(0,0,eo(t/1.6)*600,0,TAU);g.stroke();
 g.restore();
 const a=ease((t-1.5)/1.2)*(1-ease((t-7.2)/.8));
 text('THANK YOU',W/2,H/2-6,78,a,14);
 text('made entirely in code',W/2,H/2+56,22,a*.7,5,'300');
}
function frame(now){
 const T=((now-t0)/1000+off)%DUR;
 g.globalCompositeOperation='source-over';g.globalAlpha=1;
 const sc=[[0,s1],[7,s2],[14,s3],[22,s4]];
 let i=3;while(T<sc[i][0])i--;
 const lt=T-sc[i][0];
 sc[i][1](lt);
 // vignette + letterbox
 const v=g.createRadialGradient(W/2,H/2,300,W/2,H/2,780);
 v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.65)');
 g.fillStyle=v;g.fillRect(0,0,W,H);
 // global fade at loop
 const f=Math.max(1-cl(T/.6),cl((T-(DUR-.6))/.6));
 if(f>0){g.fillStyle=`rgba(0,0,0,${f})`;g.fillRect(0,0,W,H)}
 // progress line
 g.fillStyle='rgba(255,255,255,.35)';g.fillRect(0,H-3,W*T/DUR,3);
 requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script></body></html>
