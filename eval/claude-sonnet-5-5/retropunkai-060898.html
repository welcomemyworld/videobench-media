<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000;height:100%;overflow:hidden}#c{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:0 0}</style></head><body><canvas id="c" width="1280" height="720"></canvas><script>
window.DUR=40;
const cv=document.getElementById('c'),x=cv.getContext('2d');
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);cv.style.transform=`scale(${s}) translate(-50%,-50%)`;cv.style.left='50%';cv.style.top='50%';cv.style.transformOrigin='0 0'}
fit();addEventListener('resize',fit);
const q=new URLSearchParams(location.search),off=parseFloat(q.get('t'))||0,st=performance.now();
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const eo=t=>1-Math.pow(1-cl(t),3);
const eb=t=>{t=cl(t);const c=1.70158+1;return 1+c*Math.pow(t-1,3)+1.70158*Math.pow(t-1,2)};
const sc=[
{t:0,d:6,y:"2018",h:"Groundbreaking",s:"A bold idea: the world's largest spherical venue, in Las Vegas."},
{t:6,d:7,y:"2019–2021",h:"Steel Rises",s:"A 366 ft tall, 516 ft wide steel dome frame takes shape."},
{t:13,d:7,y:"2021–2023",h:"Skin of LEDs",s:"1.2 million programmable LED ppucks wrap the exterior: the Exosphere."},
{t:20,d:6,y:"Sept 2023",h:"Grand Opening",s:"U2 launches the venue with a residency. 160,000 sq ft of 16K screen inside."},
{t:26,d:14,y:"Today",h:"Bands Go Live",s:"Phish, Eagles, Dead & Company and more play immersive shows."}];
function stars(T){for(let i=0;i<90;i++){const a=(i*97)%1280,b=(i*53)%720;x.globalAlpha=.3+.3*Math.sin(T*2+i);x.fillStyle='#fff';x.fillRect(a,b,1.5,1.5)}x.globalAlpha=1}
function skyline(){x.fillStyle='#0b0b1a';for(let i=0;i<30;i++){const h=40+(i*37%90);x.fillRect(i*45,640-h,36,h+80)}x.fillStyle='#07070f';x.fillRect(0,640,1280,80)}
function sphere(cx,cy,r,p,T,mode){
// mode: progress 0..1 of build, led amount
const g=cl(p);
if(g<=0)return;
x.save();x.translate(cx,cy);
x.lineWidth=2;
const rings=Math.floor(10*g);
x.strokeStyle='#8a93a8';
for(let i=0;i<=rings;i++){const a=-Math.PI/2+i*Math.PI/10;x.beginPath();x.ellipse(0,0,r*Math.abs(Math.cos(a)),r,0,0,7);x.stroke()}
for(let i=1;i<9*g;i++){const yy=-r+i*2*r/9*1;const w=Math.sqrt(Math.max(0,r*r-yy*yy));x.beginPath();x.ellipse(0,yy,w,w*.18,0,0,7);x.stroke()}
x.restore()}
function led(cx,cy,r,a,T,face){
if(a<=0)return;
x.save();x.translate(cx,cy);x.beginPath();x.arc(0,0,r,0,7);x.clip();
x.globalAlpha=a;
const gr=x.createRadialGradient(-r*.3,-r*.3,r*.1,0,0,r);gr.addColorStop(0,'#222');gr.addColorStop(1,'#000');x.fillStyle=gr;x.fillRect(-r,-r,2*r,2*r);
for(let i=-r;i<r;i+=9)for(let j=-r;j<r;j+=9){const d=Math.hypot(i,j)/r;if(d>1)continue;let hue;
if(face===0)hue=(i*.3+j*.2+T*80)%360;
else if(face===1){hue=20;}
else hue=(Math.hypot(i,j)*.8-T*120)%360;
let l=50+30*Math.sin(T*3+i*.05+j*.04);
if(face===1){const dd=Math.hypot(i-0,j+r*.1);if(dd<r*.35){hue=30;l=60}else{hue=10+i*.1;l=25+20*Math.sin(T*4+j*.1)}}
x.fillStyle=`hsl(${hue},90%,${l}%)`;x.fillRect(i,j,6,6)}
x.restore();x.globalAlpha=1}
function txt(s,px,py,sz,col,al,w){x.font=`bold ${sz}px Arial`;x.fillStyle=col;x.textAlign=al||'left';x.fillText(s,px,py)}
function wrap(s,px,py,w,sz,col){x.font=`${sz}px Arial`;x.fillStyle=col;x.textAlign='left';let l='',y=py;for(const wd of s.split(' ')){const t=l+wd+' ';if(x.measureText(t).width>w&&l){x.fillText(l,px,y);y+=sz*1.35;l=wd+' '}else l=t}x.fillText(l,px,y)}
function frame(now){
const T=((now-st)/1000+off)%DUR;
let bg=x.createLinearGradient(0,0,0,720);bg.addColorStop(0,'#05051a');bg.addColorStop(1,'#2a1040');x.fillStyle=bg;x.fillRect(0,0,1280,720);
stars(T);skyline();
let i=sc.findIndex((s,k)=>T>=s.t&&(k==4||T<sc[k+1].t));const s=sc[i],lt=T-s.t;
const cx=830,cy=370,R=190;
let build=0,ledA=0,face=0;
if(i==0){build=0;}
if(i==1)build=lt/6;
if(i>=2)build=1;
if(i==2)ledA=lt/6;
if(i>=3)ledA=1;
if(i==3)face=1;if(i==4)face=Math.floor(lt/3.5)%3==0?0:(Math.floor(lt/3.5)%3==1?1:2);
// ground / crane early
if(i==0){const p=eo(lt/3);x.strokeStyle='#ffd24a';x.lineWidth=3;x.setLineDash([8,6]);x.beginPath();x.arc(cx,cy,R*p,0,7);x.stroke();x.setLineDash([]);
x.fillStyle='#ffd24a';x.fillRect(cx-R*p,590,R*2*p,6);
if(lt>3){const q=eb((lt-3)/1.5);x.fillStyle='#fff';x.globalAlpha=q;x.fillRect(cx-3,590-120*q,6,120*q);x.globalAlpha=1}}
else{
if(ledA<1||i<3)sphere(cx,cy,R,build,T);
led(cx,cy,R-2,ledA,T,i>=3?face:0);
if(ledA>=1){x.strokeStyle='rgba(255,255,255,.4)';x.lineWidth=3;x.beginPath();x.arc(cx,cy,R,0,7);x.stroke()}
}
// glow
if(ledA>0){const g=x.createRadialGradient(cx,cy,R,cx,cy,R*1.6);g.addColorStop(0,`hsla(${T*60%360},90%,60%,${.35*ledA})`);g.addColorStop(1,'transparent');x.fillStyle=g;x.fillRect(0,0,1280,720)}
// base
x.fillStyle='#14142a';x.fillRect(cx-150,cy+R-10,300,40);
// opening fireworks
if(i==3){for(let k=0;k<30;k++){const a=k/30*6.283,d=lt*60%160;x.fillStyle=`hsl(${k*12},100%,60%)`;x.fillRect(cx+Math.cos(a)*(R+20+d),cy-R*.8+Math.sin(a)*d,4,4)}}
// band silhouettes
if(i==4){const bl=cl(lt/2);x.fillStyle='#000';for(let k=0;k<5;k++){const bx=cx-120+k*60,by=cy+R+40;x.fillRect(bx-8,by-40*bl-Math.abs(Math.sin(T*6+k))*6,16,40*bl);x.beginPath();x.arc(bx,by-48*bl-Math.abs(Math.sin(T*6+k))*6,9,0,7);x.fill()}
const names=["PHISH","EAGLES","DEAD & CO","U2"];x.globalAlpha=.9;
names.forEach((n,k)=>{const p=eb((lt-1-k*.8)/.6);if(p<=0)return;x.save();x.translate(60,470+k*40);x.scale(p,p);txt(n,0,0,28,`hsl(${k*80+T*30},90%,65%)`);x.restore()});x.globalAlpha=1;
txt("Pick a band. See the Sphere light up.",60,650,18,'#ccc')}
// text panel
const pin=eb(lt/.8);
x.save();x.globalAlpha=cl(lt/.5);x.translate(-120*(1-pin),0);
x.fillStyle='rgba(255,255,255,.08)';x.fillRect(50,100,420,i==4?200:240);
x.fillStyle=`hsl(${T*40%360},90%,60%)`;x.fillRect(50,100,6,i==4?200:240);
txt(s.y,76,150,40,'#ffd24a');
txt(s.h,76,200,32,'#fff');
wrap(s.s,76,240,370,20,'#ddd');
x.restore();
// title & timeline
txt("THE SPHERE · LAS VEGAS",50,50,22,'#fff');
txt("A brief history",50,74,14,'#aaa');
x.fillStyle='#333';x.fillRect(50,690,1180,4);x.fillStyle='#ffd24a';x.fillRect(50,690,1180*T/DUR,4);
sc.forEach(e=>{x.fillStyle=T>=e.t?'#ffd24a':'#555';x.beginPath();x.arc(50+1180*e.t/DUR,692,6,0,7);x.fill()});
requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script></body></html>
