<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000;height:100%;overflow:hidden}#w{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:0 0}canvas{display:block}</style></head><body><div id="w"><canvas id="c" width="1280" height="720"></canvas></div><script>
window.DUR=15;
const c=document.getElementById('c'),x=c.getContext('2d'),w=document.getElementById('w');
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);w.style.transform=`scale(${s}) translate(${(innerWidth/s-1280)/2}px,${(innerHeight/s-720)/2}px)`}
fit();onresize=fit;
const T0=parseFloat(new URLSearchParams(location.search).get('t'))||0,P=performance.now();
const ease=t=>t<0?0:t>1?1:1-Math.pow(1-t,3);
const back=t=>{t=Math.max(0,Math.min(1,t));const s=1.9;return 1+(s+1)*Math.pow(t-1,3)+s*Math.pow(t-1,2)};
function rr(X,Y,W,H,r){x.beginPath();x.roundRect(X,Y,W,H,r)}
function rnd(i){return (Math.sin(i*127.1)*43758.5453)%1}
function logo(t,cx,cy,s){
 x.save();x.translate(cx,cy);x.scale(s,s);
 // card icon
 const a=back(t*1.6);x.save();x.translate(-150,0);x.rotate((1-a)*-1.2);x.scale(a,a);
 const g=x.createLinearGradient(-60,-60,60,60);g.addColorStop(0,'#26e0a8');g.addColorStop(1,'#1366ff');
 x.fillStyle=g;rr(-60,-45,120,90,18);x.fill();
 x.fillStyle='rgba(0,0,0,.35)';x.fillRect(-60,-22,120,16);
 x.fillStyle='#fff';rr(-44,14,34,12,4);x.fill();
 x.globalAlpha=.6;x.beginPath();x.arc(36,20,10,0,7);x.fill();x.restore();
 // text
 x.font='900 92px Arial, sans-serif';x.textBaseline='middle';
 const L=['P','a','y','B','o','x'],ws=[],X0=-70;let px=X0;
 L.forEach((l,i)=>{const k=ease((t-.35-i*.06)*2.5);const wd=x.measureText(l).width;
  x.save();x.globalAlpha=k;x.translate(px,(1-k)*60);x.fillStyle=i<3?'#fff':'#26e0a8';x.fillText(l,0,0);x.restore();px+=wd});
 x.restore();
}
function frame(t){
 const bg=x.createRadialGradient(640,360,50,640,360,800);
 bg.addColorStop(0,'#0c1f3d');bg.addColorStop(1,'#030612');x.fillStyle=bg;x.fillRect(0,0,1280,720);
 // moving grid
 x.strokeStyle='rgba(38,224,168,.08)';x.lineWidth=1;
 for(let i=-1;i<20;i++){const X=i*80-(t*40)%80;x.beginPath();x.moveTo(X,0);x.lineTo(X,720);x.stroke()}
 for(let i=0;i<10;i++){const Y=i*80-(t*25)%80;x.beginPath();x.moveTo(0,Y);x.lineTo(1280,Y);x.stroke()}
 // floating coins/particles
 for(let i=0;i<40;i++){const r=Math.abs(rnd(i+1)),q=Math.abs(rnd(i+50));
  const X=r*1280+Math.sin(t+i)*30,Y=720-((t*(30+q*60)+q*720)%800)+40;
  x.fillStyle=`rgba(${i%2?'38,224,168':'60,140,255'},${.15+q*.3})`;x.beginPath();x.arc(X,Y,2+q*5,0,7);x.fill()}
 // expanding rings
 for(let i=0;i<4;i++){const k=((t*.5+i/4)%1);x.strokeStyle=`rgba(38,224,168,${.25*(1-k)})`;x.lineWidth=2;x.beginPath();x.arc(640,360,k*600,0,7);x.stroke()}
 const ph=t%15;
 // scenes: 0-5 logo build, 5-10 taglines+logo, 10-15 outro
 let t1=t;
 if(t<4){logo(t/2.2,640,360,1+t*.02)}
 else if(t<9){
  const k=ease((t-4)/1);const sc=1-.25*k;logo(2,640,360-110*k,sc*(1.08));
  const tags=['Fast','Secure','Borderless'];
  tags.forEach((s,i)=>{const u=ease((t-4.6-i*.6)*1.8);x.save();x.globalAlpha=u;
   const X=640+(i-1)*330;x.translate(X,470+(1-u)*40);
   x.fillStyle='rgba(255,255,255,.08)';rr(-120,-34,240,68,34);x.fill();
   x.strokeStyle='#26e0a8';x.lineWidth=2;x.stroke();
   x.fillStyle='#fff';x.font='700 30px Arial';x.textAlign='center';x.textBaseline='middle';x.fillText(s,0,0);x.restore()});
 } else {
  const k=ease((t-9)/1.2);
  const sh=t>13.5?ease((t-13.5)/1):0;
  logo(2,640,330+0*k,1.1+.1*k);
  x.globalAlpha=k*(1-sh);x.fillStyle='#fff';x.font='700 34px Arial';x.textAlign='center';x.fillText('Payments, simplified.',640,450);
  x.fillStyle='#26e0a8';x.font='600 24px Arial';x.fillText('paybox.app',640,500);x.globalAlpha=1;
 }
 // light sweep
 const sw=((t%3)/3)*1800-400;const gg=x.createLinearGradient(sw-100,0,sw+100,0);
 gg.addColorStop(0,'rgba(255,255,255,0)');gg.addColorStop(.5,'rgba(255,255,255,.07)');gg.addColorStop(1,'rgba(255,255,255,0)');
 x.fillStyle=gg;x.fillRect(0,0,1280,720);
 // fades
 const f=Math.max(1-t/.6,0,(t-14.4)/.6);if(f>0){x.fillStyle=`rgba(0,0,0,${Math.min(1,f)})`;x.fillRect(0,0,1280,720)}
}
function loop(){const t=((performance.now()-P)/1000+T0)%DUR;x.textAlign='left';frame(t);requestAnimationFrame(loop)}
loop();
</script></body></html>
