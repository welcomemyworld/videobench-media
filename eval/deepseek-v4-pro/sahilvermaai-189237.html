<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poster Breaking Free</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    max-width: 100vw;
    max-height: 100vh;
    aspect-ratio: 1280 / 720;
    object-fit: contain;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  canvas.width = 1280;
  canvas.height = 720;

  const W = 1280, H = 720;
  const DUR = 22;
  window.DUR = DUR;

  // Timing constants
  const T_CALM = 3.2;
  const T_TREMBLE = 4.0;
  const T_CRACK_START = 5.2;
  const T_BREAK_TOP = 7.2;
  const T_BREAK_RIGHT = 8.6;
  const T_BREAK_LEFT = 9.8;
  const T_BREAK_BOTTOM = 10.8;
  const T_FULL_BURST = 11.5;
  const T_SETTLE_START = 15.0;
  const T_END = 20.5;

  // Poster geometry
  const POSTER_W = 440, POSTER_H = 580;
  const POSTER_CX = 640, POSTER_CY = 360;
  const POSTER_X = POSTER_CX - POSTER_W / 2;
  const POSTER_Y = POSTER_CY - POSTER_H / 2;
  const FRAME_BORDER = 24;
  const FRAME_OUTER_W = POSTER_W + FRAME_BORDER * 2;
  const FRAME_OUTER_H = POSTER_H + FRAME_BORDER * 2;
  const FRAME_X = POSTER_CX - FRAME_OUTER_W / 2;
  const FRAME_Y = POSTER_CY - FRAME_OUTER_H / 2;

  // Frame pieces
  const framePieces = [];
  const FP_TOP = 0, FP_RIGHT = 1, FP_BOTTOM = 2, FP_LEFT = 3;

  function makeFramePiece(id, x, y, w, h, breakTime, dirX, dirY, angVel) {
    return {
      id, x, y, w, h,
      origX: x, origY: y,
      vx: 0, vy: 0,
      rotation: 0, angVel: 0,
      state: 'attached',
      breakTime,
      dirX, dirY,
      baseAngVel: angVel,
      crackLevel: 0,
      crackSeed: id * 7919
    };
  }

  framePieces.push(makeFramePiece(FP_TOP,
    FRAME_X + FRAME_OUTER_W / 2, FRAME_Y + FRAME_BORDER / 2,
    FRAME_OUTER_W, FRAME_BORDER, T_BREAK_TOP, 0.4, -1.2, -0.06));
  framePieces.push(makeFramePiece(FP_RIGHT,
    FRAME_X + FRAME_OUTER_W - FRAME_BORDER / 2, FRAME_Y + FRAME_OUTER_H / 2,
    FRAME_BORDER, FRAME_OUTER_H, T_BREAK_RIGHT, 1.5, -0.5, 0.09));
  framePieces.push(makeFramePiece(FP_BOTTOM,
    FRAME_X + FRAME_OUTER_W / 2, FRAME_Y + FRAME_OUTER_H - FRAME_BORDER / 2,
    FRAME_OUTER_W, FRAME_BORDER, T_BREAK_BOTTOM, 0.1, 1.6, 0.05));
  framePieces.push(makeFramePiece(FP_LEFT,
    FRAME_X + FRAME_BORDER / 2, FRAME_Y + FRAME_OUTER_H / 2,
    FRAME_BORDER, FRAME_OUTER_H, T_BREAK_LEFT, -1.6, -0.7, -0.08));

  // Particles
  const particles = [];
  const MAX_PARTICLES = 900;

  // Poster palette colors
  const PALETTE = [
    '#FF6B35', '#FF9A5A', '#FF2E63', '#FFC93C',
    '#FFD93D', '#F5E6CA', '#E8A87C', '#D45079',
    '#F7B733', '#FC4A1A', '#4ECDC4', '#45B7D1'
  ];

  function hash(n) {
    return Math.abs(Math.sin(n * 127.1) * 43758.5453) % 1;
  }

  function lerp(a, b, t) {
    return a + (b - a) * t;
  }

  function clamp(v, mn, mx) {
    return Math.max(mn, Math.min(mx, v));
  }

  function easeInOut(t) {
    return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  }

  function easeOutCubic(t) {
    return 1 - Math.pow(1 - t, 3);
  }

  function easeOutBack(t) {
    const c1 = 1.70158;
    const c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  }

  // Jagged torn edge path generator
  function jaggedPath(ctx, points, baseX, baseY, amplitude, direction) {
    // direction: 'top', 'bottom', 'left', 'right'
    const segCount = points.length - 1;
    if (direction === 'top' || direction === 'bottom') {
      const ySign = direction === 'top' ? -1 : 1;
      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 0; i < segCount; i++) {
        const p1 = points[i], p2 = points[i + 1];
        const midX = (p1.x + p2.x) / 2;
        const range = (p2.x - p1.x) / 3;
        const jagX = midX + (hash(i * 13 + 7) * 2 - 1) * range * 0.8;
        const jagY = baseY + (hash(i * 29 + 3) * 2 - 1) * amplitude * ySign;
        ctx.lineTo(jagX, jagY);
        ctx.lineTo(p2.x, p2.y);
      }
    } else {
      const xSign = direction === 'left' ? -1 : 1;
      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 0; i < segCount; i++) {
        const p1 = points[i], p2 = points[i + 1];
        const midY = (p1.y + p2.y) / 2;
        const range = (p2.y - p1.y) / 3;
        const jagY = midY + (hash(i * 17 + 11) * 2 - 1) * range * 0.8;
        const jagX = baseX + (hash(i * 31 + 5) * 2 - 1) * amplitude * xSign;
        ctx.lineTo(jagX, jagY);
        ctx.lineTo(p2.x, p2.y);
      }
    }
  }

  function drawJaggedRect(ctx, x, y, w, h, tearTop, tearBottom, tearLeft, tearRight, seedOffset) {
    const segs = 28;
    const pts = [];
    for (let i = 0; i <= segs; i++) {
      pts.push({ x: x + (i / segs) * w, y: y });
    }
    const ptsBottom = [];
    for (let i = 0; i <= segs; i++) {
      ptsBottom.push({ x: x + (i / segs) * w, y: y + h });
    }
    const ptsLeft = [];
    for (let i = 0; i <= segs; i++) {
      ptsLeft.push({ x: x, y: y + (i / segs) * h });
    }
    const ptsRight = [];
    for (let i = 0; i <= segs; i++) {
      ptsRight.push({ x: x + w, y: y + (i / segs) * h });
    }

    ctx.beginPath();
    // Top edge
    if (tearTop > 0.01) {
      jaggedPath(ctx, pts, x, y, tearTop, 'top');
    } else {
      ctx.moveTo(x, y);
      ctx.lineTo(x + w, y);
    }
    // Right edge
    if (tearRight > 0.01) {
      jaggedPath(ctx, ptsRight, x + w, y, tearRight, 'right');
    } else {
      ctx.lineTo(x + w, y + h);
    }
    // Bottom edge
    if (tearBottom > 0.01) {
      jaggedPath(ctx, ptsBottom, x, y + h, tearBottom, 'bottom');
    } else {
      ctx.lineTo(x, y + h);
    }
    // Left edge
    if (tearLeft > 0.01) {
      jaggedPath(ctx, ptsLeft, x, y, tearLeft, 'left');
    } else {
      ctx.lineTo(x, y);
    }
    ctx.closePath();
  }

  // Reset scene state
  function resetScene() {
    particles.length = 0;
    framePieces.forEach(fp => {
      fp.state = 'attached';
      fp.vx = 0; fp.vy = 0;
      fp.rotation = 0; fp.angVel = 0;
      fp.crackLevel = 0;
      fp.x = fp.origX;
      fp.y = fp.origY;
    });
  }

  // Read time offset
  const urlParams = new URLSearchParams(window.location.search);
  const tOffset = parseFloat(urlParams.get('t')) || 0;
  const startWallTime = performance.now() - tOffset * 1000;

  function getTime(now) {
    let t = (now - startWallTime) / 1000;
    if (t < 0) t = 0;
    return t % DUR;
  }

  // Compute breakout progress (0 = inside frame, 1 = fully broken out)
  function getBreakoutProgress(t) {
    const t1 = T_BREAK_TOP;
    const t2 = T_FULL_BURST;
    const raw = clamp((t - t1) / (t2 - t1), 0, 1);
    return easeInOut(raw);
  }

  // Compute tear extensions for each side
  function getTearAmounts(t) {
    const bp = getBreakoutProgress(t);
    const tearTop = bp > 0.05 ? easeOutBack(clamp((bp - 0.05) / 0.7, 0, 1)) * 70 : 0;
    const tearBottom = bp > 0.2 ? easeOutBack(clamp((bp - 0.2) / 0.65, 0, 1)) * 55 : 0;
    const tearLeft = bp > 0.35 ? easeOutBack(clamp((bp - 0.35) / 0.55, 0, 1)) * 48 : 0;
    const tearRight = bp > 0.3 ? easeOutBack(clamp((bp - 0.3) / 0.6, 0, 1)) * 50 : 0;
    return { top: tearTop, bottom: tearBottom, left: tearLeft, right: tearRight };
  }

  // Draw the wall background
  function drawWall(t) {
    // Base wall gradient
    const wallGrad = ctx.createRadialGradient(W / 2, H / 2 - 60, 80, W / 2, H / 2, 850);
    wallGrad.addColorStop(0, '#2a2940');
    wallGrad.addColorStop(0.55, '#1c1b2e');
    wallGrad.addColorStop(1, '#0d0c18');
    ctx.fillStyle = wallGrad;
    ctx.fillRect(0, 0, W, H);

    // Subtle wall texture (dots)
    ctx.fillStyle = 'rgba(255,255,255,0.015)';
    for (let i = 0; i < 80; i++) {
      const wx = hash(i * 7.3) * W;
      const wy = hash(i * 13.7) * H;
      const wr = 1 + hash(i * 23.1) * 3;
      ctx.beginPath();
      ctx.arc(wx, wy, wr, 0, Math.PI * 2);
      ctx.fill();
    }

    // Spotlight from above
    const spotGrad = ctx.createRadialGradient(POSTER_CX, -80, 40, POSTER_CX, -80, 750);
    spotGrad.addColorStop(0, 'rgba(255,255,240,0.13)');
    spotGrad.addColorStop(0.45, 'rgba(255,255,240,0.06)');
    spotGrad.addColorStop(1, 'rgba(255,255,240,0)');
    ctx.fillStyle = spotGrad;
    ctx.fillRect(0, 0, W, H);

    // Light beam cone
    const beamGrad = ctx.createLinearGradient(0, -50, 0, H);
    beamGrad.addColorStop(0, 'rgba(255,250,230,0.07)');
    beamGrad.addColorStop(0.5, 'rgba(255,250,230,0.03)');
    beamGrad.addColorStop(1, 'rgba(255,250,230,0)');
    ctx.fillStyle = beamGrad;
    ctx.beginPath();
    ctx.moveTo(POSTER_CX - 350, -20);
    ctx.lineTo(POSTER_CX + 350, -20);
    ctx.lineTo(POSTER_CX + 500, H);
    ctx.lineTo(POSTER_CX - 500, H);
    ctx.closePath();
    ctx.fill();
  }

  // Draw dust particles in spotlight
  function drawDust(t) {
    const dustCount = 50;
    ctx.fillStyle = 'rgba(255,250,230,0.25)';
    for (let i = 0; i < dustCount; i++) {
      const angle = hash(i * 3.7 + 0.1) * Math.PI * 0.7 + Math.PI * 0.15;
      const dist = hash(i * 7.9 + 0.2) * 500 + 50;
      const speed = 10 + hash(i * 11.3) * 30;
      const dx = Math.cos(angle) * dist;
      const dy = Math.sin(angle) * dist;
      const drift = (t * speed + i * 50) % 700;
      const px = POSTER_CX + dx + Math.sin(t * 0.3 + i) * 20;
      const py = -30 + drift + dy * 0.5;
      if (py < H && py > -10) {
        const alpha = 0.2 * Math.sin((drift / 700) * Math.PI);
        ctx.globalAlpha = clamp(alpha, 0, 0.3);
        ctx.beginPath();
        ctx.arc(px, py, 1.2 + hash(i) * 1.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }
  }

  // Draw floor shadow
  function drawFloorShadow() {
    const shadowGrad = ctx.createRadialGradient(POSTER_CX, H + 20, 10, POSTER_CX, H + 20, 320);
    shadowGrad.addColorStop(0, 'rgba(0,0,0,0.45)');
    shadowGrad.addColorStop(0.7, 'rgba(0,0,0,0.2)');
    shadowGrad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = shadowGrad;
    ctx.fillRect(POSTER_CX - 350, H - 180, 700, 200);
  }

  // Draw metallic frame piece
  function drawFramePiece(fp, t) {
    if (fp.state === 'gone') return;

    const alpha = fp.state === 'flying' ? clamp(1 - (t - fp.flyStartTime) * 0.08, 0.6, 1) : 1;
    ctx.save();
    ctx.globalAlpha = alpha;

    if (fp.state === 'flying') {
      ctx.translate(fp.x, fp.y);
      ctx.rotate(fp.rotation);
      ctx.translate(-fp.w / 2, -fp.h / 2);
    } else {
      ctx.translate(fp.x - fp.w / 2, fp.y - fp.h / 2);
    }

    // Frame metallic gradient
    const isVertical = fp.h > fp.w;
    const grad = isVertical
      ? ctx.createLinearGradient(0, 0, fp.w, 0)
      : ctx.createLinearGradient(0, 0, 0, fp.h);

    grad.addColorStop(0, '#6b5b3a');
    grad.addColorStop(0.2, '#d4a944');
    grad.addColorStop(0.5, '#f0d878');
    grad.addColorStop(0.75, '#c49a3a');
    grad.addColorStop(1, '#5a4a2e');

    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, fp.w, fp.h);

    // Edge highlights
    ctx.fillStyle = 'rgba(255,255,220,0.35)';
    if (isVertical) {
      ctx.fillRect(2, 4, fp.w - 4, 3);
    } else {
      ctx.fillRect(4, 2, 3, fp.h - 4);
    }

    // Inner shadow edge
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    if (isVertical) {
      ctx.fillRect(fp.w - 4, 4, 2, fp.h - 8);
    } else {
      ctx.fillRect(4, fp.h - 4, fp.w - 8, 2);
    }

    // Crack lines on this piece
    if (fp.crackLevel > 0.01) {
      ctx.strokeStyle = `rgba(30,20,10,${clamp(fp.crackLevel * 0.9, 0, 0.85)})`;
      ctx.lineWidth = 1.5 + fp.crackLevel * 2;
      ctx.lineCap = 'round';
      const crackCount = Math.floor(fp.crackLevel * 6) + 2;
      for (let c = 0; c < crackCount; c++) {
        const seed = fp.crackSeed + c * 100;
        ctx.beginPath();
        const cx = hash(seed) * fp.w * 0.8 + fp.w * 0.1;
        const cy = hash(seed + 50) * fp.h * 0.8 + fp.h * 0.1;
        const len = (hash(seed + 100) * 0.5 + 0.3) * fp.crackLevel * Math.max(fp.w, fp.h);
        const angle = hash(seed + 200) * Math.PI * 2;
        ctx.moveTo(cx, cy);
        for (let s = 0; s < 6; s++) {
          const segLen = len / 6;
          const segAngle = angle + (hash(seed + s * 7) * 2 - 1) * 0.8;
          ctx.lineTo(cx + Math.cos(segAngle) * segLen * (s + 1), cy + Math.sin(segAngle) * segLen * (s + 1));
        }
        ctx.stroke();
      }
    }
    ctx.restore();

    // Flying trail/shadow
    if (fp.state === 'flying') {
      ctx.save();
      ctx.globalAlpha = alpha * 0.2;
      ctx.translate(fp.x - fp.vx * 0.15, fp.y - fp.vy * 0.15);
      ctx.rotate(fp.rotation);
      ctx.fillStyle = '#000';
      const blur = 8;
      ctx.filter = `blur(${blur}px)`;
      ctx.fillRect(-fp.w / 2, -fp.h / 2, fp.w, fp.h);
      ctx.filter = 'none';
      ctx.restore();
    }
  }

  // Draw poster art with breakout extensions
  function drawPosterArt(t, tears, bp) {
    const shake = getShakeAmount(t);
    const sx = POSTER_X + shake.x;
    const sy = POSTER_Y + shake.y;

    // Poster inner area
    const pw = POSTER_W, ph = POSTER_H;

    // Background gradient (extends with tears)
    ctx.save();
    const bgGrad = ctx.createLinearGradient(sx, sy, sx, sy + ph);
    bgGrad.addColorStop(0, '#FF6B35');
    bgGrad.addColorStop(0.35, '#E8543A');
    bgGrad.addColorStop(0.65, '#B43A6B');
    bgGrad.addColorStop(1, '#2D1B4E');
    ctx.fillStyle = bgGrad;

    // Draw main poster background
    ctx.fillRect(sx, sy, pw, ph);

    // Extended torn backgrounds
    if (tears.top > 0.5) {
      ctx.beginPath();
      jaggedPath(ctx, Array.from({ length: 30 }, (_, i) => ({
        x: sx + (i / 29) * pw,
        y: sy + (hash(i * 17 + 5) * 2 - 1) * tears.top * 0.3
      })), sx, sy, tears.top, 'top');
      ctx.lineTo(sx + pw, sy);
      ctx.lineTo(sx, sy);
      ctx.closePath();
      ctx.fill();
    }

    if (tears.bottom > 0.5) {
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(sx, sy + ph);
      ctx.lineTo(sx + pw, sy + ph);
      ctx.lineTo(sx + pw, sy + ph + tears.bottom);
      const bPts = Array.from({ length: 30 }, (_, i) => ({
        x: sx + (i / 29) * pw,
        y: sy + ph + (hash(i * 31 + 9) * 2 - 1) * tears.bottom * 0.4
      }));
      jaggedPath(ctx, bPts, sx, sy + ph, tears.bottom, 'bottom');
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    if (tears.left > 0.5) {
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(sx - tears.left, sy);
      const lPts = Array.from({ length: 26 }, (_, i) => ({
        x: sx - (hash(i * 41 + 7) * 2 - 1) * tears.left * 0.4,
        y: sy + (i / 25) * ph
      }));
      jaggedPath(ctx, lPts, sx, sy, tears.left, 'left');
      ctx.lineTo(sx, sy + ph);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    if (tears.right > 0.5) {
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(sx + pw, sy);
      ctx.lineTo(sx + pw + tears.right, sy);
      const rPts = Array.from({ length: 26 }, (_, i) => ({
        x: sx + pw + (hash(i * 53 + 3) * 2 - 1) * tears.right * 0.4,
        y: sy + (i / 25) * ph
      }));
      jaggedPath(ctx, rPts, sx + pw, sy, tears.right, 'right');
      ctx.lineTo(sx + pw, sy + ph);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // Sun circle (extends upward with tear)
    const sunBaseY = sy + 180;
    const sunR = 110;
    const sunExtend = tears.top * 0.9;
    const sunGlow = ctx.createRadialGradient(POSTER_CX, sunBaseY, sunR * 0.2, POSTER_CX, sunBaseY, sunR + sunExtend + 40);
    sunGlow.addColorStop(0, 'rgba(255,220,120,0.7)');
    sunGlow.addColorStop(0.6, 'rgba(255,180,80,0.45)');
    sunGlow.addColorStop(1, 'rgba(255,150,60,0)');
    ctx.fillStyle = sunGlow;
    ctx.beginPath();
    ctx.arc(POSTER_CX, sunBaseY, sunR + sunExtend + 40, 0, Math.PI * 2);
    ctx.fill();

    // Sun disc
    const sunGrad = ctx.createRadialGradient(POSTER_CX, sunBaseY, 10, POSTER_CX, sunBaseY, sunR);
    sunGrad.addColorStop(0, '#FFF8E0');
    sunGrad.addColorStop(0.5, '#FFE066');
    sunGrad.addColorStop(1, '#FFA040');
    ctx.fillStyle = sunGrad;
    ctx.beginPath();
    ctx.arc(POSTER_CX, sunBaseY, sunR, 0, Math.PI * 2);
    ctx.fill();

    // Sun extension above frame (breaking out)
    if (sunExtend > 2) {
      ctx.save();
      const extX1 = POSTER_CX - sunR * 0.85;
      const extX2 = POSTER_CX + sunR * 0.85;
      const extY = sy - sunExtend * 0.6;
      const extR = sunR * 0.85;

      ctx.beginPath();
      ctx.moveTo(extX1, sunBaseY);
      ctx.quadraticCurveTo(POSTER_CX - extR * 0.5, extY, POSTER_CX, extY - 10);
      ctx.quadraticCurveTo(POSTER_CX + extR * 0.5, extY, extX2, sunBaseY);
      ctx.closePath();
      ctx.fillStyle = sunGrad;
      ctx.fill();

      // Jagged torn edge on the sun extension
      ctx.beginPath();
      const jagSegs = 20;
      for (let i = 0; i <= jagSegs; i++) {
        const jx = extX1 + (i / jagSegs) * (extX2 - extX1);
        const baseJagY = extY + Math.sin((i / jagSegs) * Math.PI) * 15;
        const jagOffset = (hash(i * 67 + 3) * 2 - 1) * sunExtend * 0.35;
        const jy = baseJagY + jagOffset;
        if (i === 0) ctx.moveTo(jx, jy);
        else ctx.lineTo(jx, jy);
      }
      ctx.strokeStyle = 'rgba(255,180,100,0.7)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.restore();
    }

    // Mountains (extend downward and sideways)
    const mountBase = sy + ph;
    const mountExt = tears.bottom * 0.8;
    const sideExt = tears.left + tears.right;

    // Mountain 1 (large, center-left)
    drawMountain(sx - sideExt * 0.3, mountBase + mountExt, 240, 180, '#3D2B5A', bp);
    // Mountain 2 (center-right)
    drawMountain(sx + pw * 0.5 - sideExt * 0.2, mountBase + mountExt * 0.9, 280, 220, '#2A1D3E', bp);
    // Mountain 3 (small, left)
    drawMountain(sx - 40 + sideExt * 0.2, mountBase + mountExt * 0.5, 160, 120, '#4A326A', bp);
    // Mountain 4 (small, right)
    drawMountain(sx + pw - 60 + sideExt * 0.25, mountBase + mountExt * 0.6, 180, 140, '#3A2652', bp);

    // Stars/dots scattered
    const starCount = 25;
    for (let i = 0; i < starCount; i++) {
      const starX = sx + hash(i * 3.7) * pw;
      const starY = sy + hash(i * 7.1) * ph * 0.6;
      const starR = 1.5 + hash(i * 11.9) * 2.5;
      ctx.fillStyle = `rgba(255,255,240,${0.4 + hash(i * 13.3) * 0.5})`;
      ctx.beginPath();
      ctx.arc(starX, starY, starR, 0, Math.PI * 2);
      ctx.fill();
      // Cross sparkle
      ctx.strokeStyle = `rgba(255,255,240,${0.2 + hash(i * 17.7) * 0.3})`;
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.moveTo(starX - starR * 2.5, starY);
      ctx.lineTo(starX + starR * 2.5, starY);
      ctx.moveTo(starX, starY - starR * 2.5);
      ctx.lineTo(starX, starY + starR * 2.5);
      ctx.stroke();
    }

    // Decorative thin lines
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(sx + 20, sy + 30);
    ctx.lineTo(sx + pw - 20, sy + 30);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(sx + 20, sy + ph - 25);
    ctx.lineTo(sx + pw - 20, sy + ph - 25);
    ctx.stroke();

    // Text: BREAK FREE
    ctx.textAlign = 'center';
    const textBP = clamp(bp, 0, 1);
    const textY1 = sy + 340;
    const textY2 = sy + 430;
    const textJitter = textBP * 30;

    // Text shadow
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.font = 'bold 62px Impact, "Arial Black", Arial, sans-serif';
    ctx.fillText('BREAK', POSTER_CX + 3 + (Math.random() - 0.5) * textJitter, textY1 + 3 + (Math.random() - 0.5) * textJitter);

    // Text main
    ctx.fillStyle = '#FFFFFF';
    ctx.fillText('BREAK', POSTER_CX + (Math.random() - 0.5) * textJitter, textY1 + (Math.random() - 0.5) * textJitter);

    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillText('FREE', POSTER_CX + 3 + (Math.random() - 0.5) * textJitter, textY2 + 3 + (Math.random() - 0.5) * textJitter);

    ctx.fillStyle = '#FFFFFF';
    ctx.fillText('FREE', POSTER_CX + (Math.random() - 0.5) * textJitter, textY2 + (Math.random() - 0.5) * textJitter);

    // Red accent underline
    ctx.fillStyle = '#FF2E63';
    ctx.fillRect(POSTER_CX - 90, textY2 + 22, 180, 4);
    ctx.fillRect(POSTER_CX - 60, textY1 - 60, 120, 3);

    // Circle accent
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(POSTER_CX, sy + 120, 25, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(POSTER_CX, sy + 120, 18, Math.PI * 0.5, Math.PI * 1.5);
    ctx.stroke();

    ctx.restore();
  }

  function drawMountain(baseX, baseY, width, height, color, bp) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(baseX - width / 2, baseY);
    ctx.lineTo(baseX, baseY - height);
    ctx.lineTo(baseX + width / 2, baseY);
    ctx.closePath();
    ctx.fill();
    // Peak highlight
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.beginPath();
    ctx.moveTo(baseX - width / 8, baseY);
    ctx.lineTo(baseX, baseY - height);
    ctx.lineTo(baseX, baseY);
    ctx.closePath();
    ctx.fill();
  }

  function getShakeAmount(t) {
    if (t < T_TREMBLE) return { x: 0, y: 0 };
    if (t < T_BREAK_TOP) {
      const s = (t - T_TREMBLE) / (T_BREAK_TOP - T_TREMBLE);
      const amp = s * 2.5;
      return { x: (Math.random() - 0.5) * amp, y: (Math.random() - 0.5) * amp };
    }
    if (t < T_FULL_BURST) {
      const s = (t - T_BREAK_TOP) / (T_FULL_BURST - T_BREAK_TOP);
      const amp = lerp(4, 12, s);
      return { x: (Math.random() - 0.5) * amp, y: (Math.random() - 0.5) * amp };
    }
    if (t < T_SETTLE_START) {
      const s = (t - T_FULL_BURST) / (T_SETTLE_START - T_FULL_BURST);
      const amp = lerp(12, 2, s);
      return { x: (Math.random() - 0.5) * amp, y: (Math.random() - 0.5) * amp };
    }
    const s = (t - T_SETTLE_START) / (T_END - T_SETTLE_START);
    const amp = lerp(2, 0, s) * 0.6;
    return { x: (Math.random() - 0.5) * amp, y: (Math.random() - 0.5) * amp };
  }

  function emitParticle(x, y, color, vx, vy, size, life, isShape) {
    if (particles.length >= MAX_PARTICLES) return;
    particles.push({
      x, y, vx, vy, size,
      life, maxLife: life,
      color, isShape: isShape || false,
      rotation: Math.random() * Math.PI * 2,
      angVel: (Math.random() - 0.5) * 0.15,
      gravity: 0.08 + Math.random() * 0.06
    });
  }

  function burstParticles(t) {
    if (t < T_BREAK_TOP || t > T_END + 1) return;

    const bp = getBreakoutProgress(t);
    const intensity = clamp((t - T_BREAK_TOP) / (T_FULL_BURST - T_BREAK_TOP), 0, 1);
    const peakFactor = t < T_SETTLE_START ? intensity : clamp(1 - (t - T_SETTLE_START) / 3, 0, 1);

    const emitCount = Math.floor(peakFactor * 18);
    for (let i = 0; i < emitCount; i++) {
      const side = Math.floor(Math.random() * 4);
      let px, py, vx, vy;
      const speed = 120 + Math.random() * 380 * peakFactor + 60;
      const angle = Math.random() * Math.PI * 2;

      if (side === 0) { px = POSTER_X + Math.random() * POSTER_W; py = POSTER_Y; }
      else if (side === 1) { px = POSTER_X + POSTER_W; py = POSTER_Y + Math.random() * POSTER_H; }
      else if (side === 2) { px = POSTER_X + Math.random() * POSTER_W; py = POSTER_Y + POSTER_H; }
      else { px = POSTER_X; py = POSTER_Y + Math.random() * POSTER_H; }

      vx = Math.cos(angle) * speed * 0.6 + (side === 0 ? -20 : side === 1 ? 60 : side === 2 ? 10 : -50);
      vy = Math.sin(angle) * speed * 0.6 - 30 - Math.random() * 80 * peakFactor;

      const color = PALETTE[Math.floor(Math.random() * PALETTE.length)];
      const size = 1.5 + Math.random() * 5;
      const life = 0.8 + Math.random() * 2.5;
      emitParticle(px, py, color, vx, vy, size, life, Math.random() > 0.6);
    }
  }

  function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += p.gravity * dt * 2;
      p.vx *= 0.99;
      p.vy *= 0.99;
      p.rotation += p.angVel * dt;
      p.life -= dt;
      if (p.life <= 0 || p.y > H + 100 || p.x < -100 || p.x > W + 100) {
        particles.splice(i, 1);
      }
    }
  }

  function drawParticles(t) {
    for (const p of particles) {
      const alpha = clamp(p.life / p.maxLife, 0, 1);
      ctx.save();
      ctx.globalAlpha = alpha;

      if (p.isShape) {
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation);
        ctx.fillStyle = p.color;
        const s = p.size * 1.5;
        ctx.beginPath();
        if (Math.random() > 0.5) {
          ctx.moveTo(0, -s);
          ctx.lineTo(s * 0.8, s * 0.6);
          ctx.lineTo(-s * 0.8, s * 0.6);
        } else {
          ctx.rect(-s * 0.6, -s * 0.6, s * 1.2, s * 1.2);
        }
        ctx.closePath();
        ctx.fill();
      } else {
        // Glow circle
        const glowR = p.size * 2;
        const glowGrad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, glowR);
        glowGrad.addColorStop(0, p.color);
        glowGrad.addColorStop(1, 'transparent');
        ctx.fillStyle = glowGrad;
        ctx.beginPath();
        ctx.arc(p.x, p.y, glowR, 0, Math.PI * 2);
        ctx.fill();
        // Core
        ctx.fillStyle = '#FFF';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * 0.5, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
  }

  function updateFramePieces(t, dt) {
    for (const fp of framePieces) {
      if (fp.state === 'attached') {
        // Crack level calculation
        const crackStart = T_CRACK_START;
        const breakTime = fp.breakTime;
        if (t >= crackStart && t < breakTime) {
          fp.crackLevel = clamp((t - crackStart) / (breakTime - crackStart), 0, 1);
        } else if (t >= breakTime && fp.state === 'attached') {
          fp.state = 'flying';
          fp.flyStartTime = t;
          fp.crackLevel = 1;
          // Initial velocities
          const burstFactor = 220 + Math.random() * 200;
          fp.vx = fp.dirX * burstFactor * (1 + Math.random() * 0.5);
          fp.vy = fp.dirY * burstFactor * (1 + Math.random() * 0.5) - 80 - Math.random() * 100;
          fp.angVel = fp.baseAngVel * (1 + Math.random() * 0.6);
          // Emit particles from break point
          for (let i = 0; i < 25; i++) {
            const bx = fp.x + (Math.random() - 0.5) * fp.w * 0.5;
            const by = fp.y + (Math.random() - 0.5) * fp.h * 0.5;
            const color = PALETTE[Math.floor(Math.random() * PALETTE.length)];
            emitParticle(bx, by, color,
              (Math.random() - 0.5) * 200, (Math.random() - 0.5) * 200 - 50,
              2 + Math.random() * 4, 0.7 + Math.random() * 1.5, true);
          }
        }
      } else if (fp.state === 'flying') {
        fp.vy += 180 * dt;
        fp.x += fp.vx * dt;
        fp.y += fp.vy * dt;
        fp.rotation += fp.angVel * dt;
        fp.vx *= 0.995;
        fp.vy *= 0.995;
        // Bounce off floor if we define one (bottom of canvas)
        if (fp.y + fp.h / 2 > H - 5 && fp.vy > 0) {
          fp.vy *= -0.45;
          fp.vy += 10;
          fp.angVel *= 0.5;
          fp.y = H - 5 - fp.h / 2;
        }
        if (fp.y > H + 150 || fp.x < -200 || fp.x > W + 200) {
          fp.state = 'gone';
        }
      }
    }
  }

  function drawVignette() {
    const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.4, W / 2, H / 2, H * 0.95);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(0.7, 'rgba(0,0,0,0.12)');
    vg.addColorStop(1, 'rgba(0,0,0,0.5)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }

  function drawFrameBehindPoster(t) {
    // Draw only attached pieces behind poster (they are drawn in order)
    for (const fp of framePieces) {
      if (fp.state === 'attached' && fp.crackLevel < 0.9) {
        drawFramePiece(fp, t);
      }
    }
  }

  function drawFrameInFrontOfPoster(t) {
    for (const fp of framePieces) {
      if (fp.state === 'flying' || (fp.state === 'attached' && fp.crackLevel >= 0.9)) {
        drawFramePiece(fp, t);
      }
    }
  }

  function drawScene(t) {
    ctx.clearRect(0, 0, W, H);

    const shake = getShakeAmount(t);
    ctx.save();
    ctx.translate(shake.x, shake.y);

    // Wall
    drawWall(t);
    drawDust(t);
    drawFloorShadow();

    // Frame pieces behind poster (for depth)
    drawFrameBehindPoster(t);

    // Poster
    const tears = getTearAmounts(t);
    const bp = getBreakoutProgress(t);
    drawPosterArt(t, tears, bp);

    // Frame pieces in front
    drawFrameInFrontOfPoster(t);

    // Particles
    drawParticles(t);

    ctx.restore();

    // Vignette overlay (not shaken)
    drawVignette();

    // Final color grade subtle warm tint
    ctx.fillStyle = 'rgba(255,160,60,0.04)';
    ctx.fillRect(0, 0, W, H);
  }

  // Check if scene needs reset
  let prevT = -1;
  function checkReset(t) {
    if (t < prevT - DUR * 0.5) {
      resetScene();
    }
    prevT = t;
  }

  function animate(now) {
    const t = getTime(now);
    checkReset(t);

    const dt = 1 / 60; // Fixed timestep for physics stability

    // Update frame pieces
    updateFramePieces(t, dt);

    // Burst particles
    burstParticles(t);

    // Update particles
    updateParticles(dt);

    // Draw everything
    drawScene(t);

    requestAnimationFrame(animate);
  }

  // Start the animation
  resetScene();
  requestAnimationFrame(animate);

  // Handle resize
  function resizeCanvas() {
    const maxW = window.innerWidth;
    const maxH = window.innerHeight;
    const scale = Math.min(maxW / W, maxH / H);
    canvas.style.width = (W * scale) + 'px';
    canvas.style.height = (H * scale) + 'px';
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();
})();
</script>
