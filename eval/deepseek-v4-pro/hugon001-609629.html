<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Mentis - Showreel</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#000;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden}
  canvas{display:block;width:min(100vw,calc(100vh*16/9));height:min(100vh,calc(100vw*9/16))}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const W=1280,H=720,DUR=15;
window.DUR=DUR;
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
cv.width=W;cv.height=H;
const params=new URLSearchParams(location.search);
let tOff=parseFloat(params.get('t')||'0');
const startTime=performance.now()-tOff*1000;

function easeOutCubic(t){return 1-Math.pow(1-t,3)}
function easeInOutCubic(t){return t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
function easeOutBack(t){const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)}
function easeOutExpo(t){return t===1?1:1-Math.pow(2,-10*t)}
function lerp(a,b,t){return a+(b-a)*t}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function fadeInOut(t,fi,fo){if(t<fi)return 0;if(t<fo)return (t-fi)/(fo-fi);return 1}
function fadeOut(t,fs,fe){if(t<fs)return 1;if(t>=fe)return 0;return 1-(t-fs)/(fe-fs)}

function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function drawStar(cx,cy,spikes,outerR,innerR,rot){
  ctx.beginPath();
  for(let i=0;i<spikes*2;i++){
    const r=i%2===0?outerR:innerR;
    const a=rot+i*Math.PI/spikes;
    const x=cx+Math.cos(a)*r;
    const y=cy+Math.sin(a)*r;
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  }
  ctx.closePath();
}

const colors={
  bg1:'#0a0e1a',bg2:'#12182b',bg3:'#0d1220',
  indigo:'#6366f1',cyan:'#06b6d4',purple:'#a855f7',
  white:'#ffffff',grey:'#94a3b8',darkGrey:'#64748b',
  gold:'#fbbf24',screenBg:'#0f172a',cardBg:'#1e293b'
};

let ambientParticles=[];
for(let i=0;i<70;i++){
  ambientParticles.push({
    x:Math.random()*W,y:Math.random()*H,
    vx:(Math.random()-0.5)*0.25,vy:-0.1-Math.random()*0.3,
    size:0.5+Math.random()*2.5,alpha:0.15+Math.random()*0.5,
    color:Math.random()<0.5?colors.cyan:colors.indigo
  });
}
let burstParticles=[];
function emitBurst(cx,cy,count,colorArr,speedMax,lifeMax){
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2;
    const sp=Math.random()*speedMax+speedMax*0.2;
    burstParticles.push({
      x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
      life:0,maxLife:lifeMax*(0.5+Math.random()*0.5),
      size:1+Math.random()*3.5,
      color:colorArr[Math.floor(Math.random()*colorArr.length)],
      alpha:0.7+Math.random()*0.3
    });
  }
}
function updateParticles(dt){
  for(let p of ambientParticles){
    p.x+=p.vx*dt*60;p.y+=p.vy*dt*60;
    if(p.y<-10){p.y=H+10;p.x=Math.random()*W}
    if(p.x<-10)p.x=W+10;if(p.x>W+10)p.x=-10;
  }
  for(let i=burstParticles.length-1;i>=0;i--){
    const p=burstParticles[i];
    p.life+=dt;
    p.x+=p.vx*dt*60;p.y+=p.vy*dt*60;
    p.vy+=0.04*dt*60;p.vx*=0.995;p.vy*=0.995;
    if(p.life>=p.maxLife)burstParticles.splice(i,1);
  }
}
function drawParticles(t){
  for(let p of ambientParticles){
    const tw=0.5+0.5*Math.sin(t*2+p.x*0.01);
    ctx.globalAlpha=p.alpha*(0.6+0.4*tw);
    ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  for(let p of burstParticles){
    const lp=1-p.life/p.maxLife;
    ctx.globalAlpha=p.alpha*lp;
    ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size*lp,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}

function drawBackground(t){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,colors.bg1);
  g.addColorStop(0.5,colors.bg2);
  g.addColorStop(1,colors.bg3);
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);
  const rg=ctx.createRadialGradient(W/2,H*0.4,0,W/2,H*0.4,600);
  const pulse=0.5+0.5*Math.sin(t*1.5);
  rg.addColorStop(0,`rgba(99,102,241,${0.06+0.04*pulse})`);
  rg.addColorStop(0.5,`rgba(6,182,212,${0.04+0.03*Math.sin(t*1.8+1)})`);
  rg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=rg;
  ctx.fillRect(0,0,W,H);
  const vg=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,900);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(0,0,0,0.55)');
  ctx.fillStyle=vg;
  ctx.fillRect(0,0,W,H);
}

function textWithGlow(txt,x,y,size,weight,color,glowColor,glowBlur,alpha,align='center'){
  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.font=`${weight} ${size}px 'Segoe UI','Helvetica Neue',sans-serif`;
  ctx.textAlign=align;
  ctx.textBaseline='middle';
  if(glowColor&&glowBlur>0){
    ctx.shadowColor=glowColor;ctx.shadowBlur=glowBlur;
    ctx.fillStyle=color;
    ctx.fillText(txt,x,y);
    ctx.shadowBlur=0;
    ctx.fillText(txt,x,y);
  }else{
    ctx.fillStyle=color;
    ctx.fillText(txt,x,y);
  }
  ctx.restore();
}

function drawLogoMentis(x,y,size,alpha,glowIntensity=0.5){
  ctx.save();
  ctx.globalAlpha=alpha;
  const grad=ctx.createLinearGradient(x-size*2.5,y-size*0.4,x+size*2.5,y+size*0.4);
  grad.addColorStop(0,colors.indigo);
  grad.addColorStop(0.5,colors.cyan);
  grad.addColorStop(1,colors.purple);
  ctx.font=`bold ${size}px 'Segoe UI','Helvetica Neue',sans-serif`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.shadowColor=colors.indigo;ctx.shadowBlur=size*0.3*glowIntensity;
  ctx.fillStyle=grad;
  ctx.fillText('Mentis',x,y);
  ctx.shadowBlur=0;
  ctx.fillText('Mentis',x,y);
  const dotR=size*0.07;
  const dotX=x+size*1.55;
  const dotY=y-size*0.38;
  ctx.fillStyle=colors.cyan;
  ctx.shadowColor=colors.cyan;ctx.shadowBlur=size*0.2*glowIntensity;
  ctx.beginPath();ctx.arc(dotX,dotY,dotR,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
  ctx.restore();
}

function drawRing(cx,cy,radius,strokeWidth,color,alpha){
  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.strokeStyle=color;
  ctx.lineWidth=strokeWidth;
  ctx.beginPath();ctx.arc(cx,cy,radius,0,Math.PI*2);ctx.stroke();
  ctx.restore();
}

function drawFeatureCard(x,y,w,h,alpha,iconType,title,subtitle,iconScale=1){
  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.shadowColor='rgba(99,102,241,0.3)';
  ctx.shadowBlur=20;
  rr(x,y,w,h,16);
  ctx.fillStyle=colors.cardBg;
  ctx.fill();
  ctx.shadowBlur=0;
  rr(x,y,w,h,16);
  ctx.strokeStyle='rgba(99,102,241,0.35)';
  ctx.lineWidth=1.5;
  ctx.stroke();
  const cx=x+w/2,cy=y+40;
  if(iconType==='organize'){
    ctx.strokeStyle=colors.cyan;ctx.lineWidth=3;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(cx-18,cy-8);ctx.lineTo(cx-5,cy+8);ctx.lineTo(cx+20,cy-12);ctx.stroke();
    rr(cx-25,cy-18,50,34,6);
    ctx.strokeStyle='rgba(6,182,212,0.5)';ctx.lineWidth=2;ctx.stroke();
  }else if(iconType==='analytics'){
    ctx.fillStyle=colors.purple;
    rr(cx-12,cy-4,7,18,2);ctx.fill();
    rr(cx-2,cy-10,7,24,2);ctx.fill();
    rr(cx+8,cy-16,7,30,2);ctx.fill();
    ctx.strokeStyle='rgba(168,85,247,0.6)';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(cx-25,cy+12);ctx.lineTo(cx+25,cy+12);ctx.stroke();
  }else if(iconType==='sync'){
    ctx.strokeStyle=colors.indigo;ctx.lineWidth=3;ctx.lineCap='round';
    for(let i=0;i<2;i++){
      const rot=i*Math.PI;
      ctx.save();
      ctx.translate(cx,cy);ctx.rotate(rot);
      ctx.beginPath();ctx.arc(0,0,16,Math.PI*0.15,Math.PI*0.85);ctx.stroke();
      const tipX=Math.cos(Math.PI*0.85)*16,tipY=Math.sin(Math.PI*0.85)*16;
      ctx.beginPath();ctx.moveTo(tipX,tipY);ctx.lineTo(tipX-6,tipY+10);ctx.lineTo(tipX+8,tipY+7);ctx.closePath();ctx.fillStyle=colors.indigo;ctx.fill();
      ctx.restore();
    }
  }
  ctx.fillStyle=colors.white;
  ctx.font='bold 22px "Segoe UI","Helvetica Neue",sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(title,cx,y+65);
  ctx.fillStyle=colors.grey;
  ctx.font='16px "Segoe UI","Helvetica Neue",sans-serif';
  ctx.fillText(subtitle,cx,y+95);
  ctx.restore();
}

function drawPhoneMockup(cx,cy,scale,alpha,t){
  ctx.save();
  ctx.globalAlpha=alpha;
  const phoneW=250*scale,phoneH=500*scale;
  const px=cx-phoneW/2,py=cy-phoneH/2;
  ctx.shadowColor='rgba(99,102,241,0.5)';
  ctx.shadowBlur=60;
  rr(px-3,py-3,phoneW+6,phoneH+6,30*scale);
  ctx.fillStyle='#1a1a2e';
  ctx.fill();
  ctx.shadowBlur=0;
  rr(px,py,phoneW,phoneH,28*scale);
  ctx.fillStyle='#2d2d44';
  ctx.fill();
  const screenMargin=8*scale;
  rr(px+screenMargin,py+screenMargin,phoneW-screenMargin*2,phoneH-screenMargin*2,22*scale);
  ctx.fillStyle=colors.screenBg;
  ctx.fill();
  const sx=px+screenMargin,sy=py+screenMargin,sw=phoneW-screenMargin*2,sh=phoneH-screenMargin*2;
  if(alpha>0.5){
    const notchW=80*scale;
    const notchH=18*scale;
    rr(px+phoneW/2-notchW/2,py+screenMargin+4*scale,notchW,notchH,9*scale);
    ctx.fillStyle='#1a1a2e';
    ctx.fill();
    ctx.fillStyle='rgba(148,163,184,0.7)';
    ctx.font=`${11*scale}px 'Segoe UI','Helvetica Neue',sans-serif`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('9:41',px+phoneW/2,py+screenMargin+13*scale);
  }
  if(alpha>0.4&&alpha<=0.6){
    ctx.fillStyle='rgba(255,255,255,0.15)';
    rr(sx+10*scale,sy+40*scale,sw-20*scale,30*scale,8*scale);ctx.fill();
    rr(sx+10*scale,sy+80*scale,sw-20*scale,50*scale,8*scale);ctx.fill();
    rr(sx+10*scale,sy+140*scale,sw-20*scale,60*scale,8*scale);ctx.fill();
    rr(sx+10*scale,sy+210*scale,sw*0.45,80*scale,8*scale);ctx.fill();
    rr(sx+sw*0.55,sy+210*scale,sw*0.4,80*scale,8*scale);ctx.fill();
  }else if(alpha>0.6){
    ctx.fillStyle=colors.indigo;
    rr(sx+10*scale,sy+40*scale,sw-20*scale,32*scale,6*scale);ctx.fill();
    ctx.fillStyle=colors.white;
    ctx.font=`bold ${14*scale}px 'Segoe UI','Helvetica Neue',sans-serif`;
    ctx.textAlign='left';ctx.textBaseline='middle';
    ctx.fillText('Mentis',sx+22*scale,sy+56*scale);
    ctx.fillStyle='rgba(148,163,184,0.8)';
    ctx.font=`${10*scale}px 'Segoe UI','Helvetica Neue',sans-serif`;
    ctx.fillText('Aujourd\'hui',sx+22*scale,sy+72*scale);
    const cardY1=sy+90*scale;
    ctx.fillStyle='#1e293b';
    rr(sx+10*scale,cardY1,sw-20*scale,55*scale,10*scale);ctx.fill();
    ctx.fillStyle=colors.cyan;
    ctx.beginPath();ctx.arc(sx+25*scale,cardY1+27*scale,8*scale,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=colors.white;
    ctx.font=`${13*scale}px 'Segoe UI','Helvetica Neue',sans-serif`;
    ctx.fillText('Réunion à 14h',sx+40*scale,cardY1+27*scale);
    ctx.fillStyle=colors.grey;
    ctx.font=`${10*scale}px 'Segoe UI','Helvetica Neue',sans-serif`;
    ctx.fillText('Salle B12',sx+40*scale,cardY1+44*scale);
    const cardY2=cardY1+65*scale;
    ctx.fillStyle='#1e293b';
    rr(sx+10*scale,cardY2,sw-20*scale,55*scale,10*scale);ctx.fill();
    ctx.fillStyle=colors.purple;
    ctx.beginPath();ctx.arc(sx+25*scale,cardY2+27*scale,8*scale,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=colors.white;
    ctx.font=`${13*scale}px 'Segoe UI','Helvetica Neue',sans-serif`;
    ctx.fillText('3 tâches à finir',sx+40*scale,cardY2+27*scale);
    ctx.fillStyle=colors.grey;
    ctx.font=`${10*scale}px 'Segoe UI','Helvetica Neue',sans-serif`;
    ctx.fillText('Priorité haute',sx+40*scale,cardY2+44*scale);
    const chartY=cardY2+70*scale;
    ctx.fillStyle='#1e293b';
    rr(sx+10*scale,chartY,sw-20*scale,100*scale,10*scale);ctx.fill();
    ctx.fillStyle=colors.white;
    ctx.font=`bold ${12*scale}px 'Segoe UI','Helvetica Neue',sans-serif`;
    ctx.textAlign='left';
    ctx.fillText('Productivité',sx+22*scale,chartY+18*scale);
    const bars=[
      {h:30,v:0.5},{h:45,v:0.7},{h:25,v:0.4},{h:55,v:0.85},{h:40,v:0.65},{h:65,v:1},
      {h:50,v:0.75},{h:35,v:0.55},{h:70,v:1.05},{h:60,v:0.9}
    ];
    const barW=(sw-60*scale)/bars.length;
    const barBase=chartY+88*scale;
    const animT=t%2;
    bars.forEach((b,i)=>{
      const h=b.h*scale*(0.8+0.3*Math.sin(animT*3+i*0.5));
      const bh=Math.abs(h);
      ctx.fillStyle=i%2===0?colors.cyan:colors.indigo;
      ctx.globalAlpha=0.5+b.v*0.5;
      rr(sx+20*scale+i*barW,barBase-bh,barW-3*scale,bh,2*scale);
      ctx.fill();
    });
    ctx.globalAlpha=1;
    ctx.fillStyle='rgba(99,102,241,0.5)';
    rr(sx+10*scale,sh-35*scale,sw-20*scale,28*scale,14*scale);ctx.fill();
    ctx.fillStyle=colors.white;
    ctx.font=`${10*scale}px 'Segoe UI','Helvetica Neue',sans-serif`;
    ctx.textAlign='center';
    ctx.fillText('Tableau de bord',sx+sw/2,sh-21*scale);
  }
  ctx.restore();
}

function drawAppStoreButtons(x,y,width,alpha,isIOS){
  ctx.save();
  ctx.globalAlpha=alpha;
  const h=62;
  rr(x,y,width,h,14);
  ctx.fillStyle='#1a1a2e';
  ctx.fill();
  rr(x,y,width,h,14);
  ctx.strokeStyle='rgba(255,255,255,0.3)';
  ctx.lineWidth=1.5;
  ctx.stroke();
  const iconX=x+18,iconY=y+h/2;
  if(isIOS){
    ctx.fillStyle=colors.white;
    ctx.font='32px "Segoe UI","Helvetica Neue",sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('',iconX+18,iconY);
    ctx.beginPath();
    ctx.moveTo(iconX+10,iconY-10);ctx.quadraticCurveTo(iconX+18,iconY-18,iconX+26,iconY-10);
    ctx.quadraticCurveTo(iconX+30,iconY-4,iconX+26,iconY+2);
    ctx.quadraticCurveTo(iconX+18,iconY+10,iconX+10,iconY+2);
    ctx.quadraticCurveTo(iconX+6,iconY-4,iconX+10,iconY-10);
    ctx.fill();
  }else{
    ctx.fillStyle=colors.white;
    ctx.font='bold 26px "Segoe UI","Helvetica Neue",sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('▶',iconX+18,iconY);
  }
  ctx.fillStyle=colors.white;
  ctx.font='11px "Segoe UI","Helvetica Neue",sans-serif';
  ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.fillText(isIOS?'Télécharger sur':'Disponible sur',iconX+45,y+19);
  ctx.font='bold 16px "Segoe UI","Helvetica Neue",sans-serif';
  ctx.fillText(isIOS?'App Store':'Google Play',iconX+45,y+42);
  ctx.restore();
}

function scene1(t,localT){
  const alpha=fadeInOut(t,0.2,0.9,2.0,2.5);
  const sc=lerp(0.7,1,easeOutBack(clamp((localT)/0.9,0,1)));
  const y=H/2-30;
  const glowI=1-Math.abs(localT-0.8)*0.5;
  drawLogoMentis(W/2,y,110*sc,alpha,glowI);
  if(localT>0.3){
    const ringP=clamp((localT-0.3)/1.2,0,1);
    const r=ringP*350;
    const ra=1-ringP;
    drawRing(W/2,y,r,2+2*(1-ringP),colors.indigo,alpha*ra*0.7);
  }
  if(localT>0.5){
    const ringP2=clamp((localT-0.5)/1.0,0,1);
    const r2=ringP2*280;
    const ra2=1-ringP2;
    drawRing(W/2,y,r2,1.5+1.5*(1-ringP2),colors.cyan,alpha*ra2*0.5);
  }
  if(localT<0.8){
    const ep=clamp(localT/0.8,0,1);
    if(Math.random()<ep*0.4){
      emitBurst(W/2+Math.random()*80-40,y+Math.random()*40-20,1,[colors.cyan,colors.indigo,colors.purple],4,0.8);
    }
  }
  const subAlpha=fadeInOut(t,1.2,1.8,2.0,2.5);
  if(subAlpha>0){
    textWithGlow('VOTRE ESPRIT, AMPLIFIÉ',W/2,y+95,27,'bold',colors.white,colors.indigo,10,subAlpha);
  }
}

function scene2(t,localT){
  const prevLogoAlpha=fadeOut(t,0,0.4);
  const logoY=lerp(H/2-30,H/2-110,easeOutCubic(clamp(localT/1.0,0,1)));
  if(prevLogoAlpha>0){
    drawLogoMentis(W/2,logoY,60,prevLogoAlpha,0.3);
  }
  const alpha=fadeInOut(t,0.2,0.8,2.0,2.5);
  const tagY=H/2+10;
  if(alpha>0){
    const stagger=clamp((localT-0.15)/0.6,0,1);
    const ease=easeOutCubic(stagger);
    textWithGlow('L\'intelligence à votre service',W/2,tagY,42,'bold',colors.white,colors.cyan,12,alpha*ease);
    const lineW=500*ease;
    const ly=tagY+42;
    ctx.save();
    ctx.globalAlpha=alpha*ease;
    ctx.strokeStyle='rgba(99,102,241,0.6)';
    ctx.lineWidth=2.5;
    ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(W/2-lineW/2,ly);ctx.lineTo(W/2+lineW/2,ly);ctx.stroke();
    const dotR=4*ease;
    ctx.fillStyle=colors.cyan;
    ctx.beginPath();ctx.arc(W/2-lineW/2,ly,dotR,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(W/2+lineW/2,ly,dotR,0,Math.PI*2);ctx.fill();
    ctx.restore();
    const subAlpha2=fadeInOut(t,0.8,1.4,1.8,2.2);
    if(subAlpha2>0){
      textWithGlow('Organisez · Analysez · Progressez',W/2,tagY+82,22,'normal',colors.grey,colors.indigo,4,subAlpha2*ease);
    }
  }
  if(localT>0.4&&alpha>0){
    const floatY=H/2+80+Math.sin(localT*2)*15;
    ctx.save();
    ctx.globalAlpha=alpha*0.4;
    for(let i=0;i<3;i++){
      const ox=(i-1)*180+Math.sin(localT*2+i)*20;
      const oy=floatY+Math.cos(localT*1.5+i*2)*15;
      const sz=8+i*4;
      ctx.fillStyle=i%2===0?colors.indigo:colors.cyan;
      ctx.globalAlpha=alpha*0.25;
      ctx.beginPath();
      if(i===1){ctx.arc(W/2+ox,oy,sz,0,Math.PI*2);ctx.fill();}
      else{
        ctx.moveTo(W/2+ox,oy-sz);ctx.lineTo(W/2+ox+sz,oy+sz);ctx.lineTo(W/2+ox-sz,oy+sz);ctx.closePath();ctx.fill();
      }
    }
    ctx.restore();
  }
}

function scene3(t,localT){
  const prevAlpha=fadeOut(t,0,0.35);
  if(prevAlpha>0){
    textWithGlow('L\'intelligence à votre service',W/2,H/2+10,42,'bold',colors.white,colors.cyan,12,prevAlpha);
  }
  const cards=[
    {x:W/2-460,y:H/2-60,title:'Organisation intelligente',sub:'Vos tâches, priorisées',icon:'organize'},
    {x:W/2-130,y:H/2-60,title:'Analyse en temps réel',sub:'Des insights actionnables',icon:'analytics'},
    {x:W/2+200,y:H/2-60,title:'Synchronisation instantanée',sub:'Tous vos appareils connectés',icon:'sync'}
  ];
  const cardW=310,cardH=190;
  cards.forEach((c,i)=>{
    const delay=i*0.2;
    const a=fadeInOut(t,0.2+delay,0.8+delay,2.5,2.95);
    if(a>0){
      const sc=lerp(0.85,1,easeOutBack(clamp((localT-delay)/0.5,0,1)));
      const cx=c.x+cardW/2,cy=c.y+cardH/2;
      const dx=(cx-W/2)*(1-sc),dy=(cy-H/2)*(1-sc);
      ctx.save();
      ctx.translate(dx,dy);
      drawFeatureCard(c.x,c.y,cardW,cardH,a*clamp((localT-delay)/0.3,0,1),c.icon,c.title,c.sub,sc);
      ctx.restore();
    }
  });
  const headerAlpha=fadeInOut(t,0.15,0.5,2.4,2.8);
  if(headerAlpha>0){
    textWithGlow('Fonctionnalités clés',W/2,170,36,'bold',colors.white,colors.indigo,15,headerAlpha);
  }
  const subAlpha3=fadeInOut(t,1.5,2.2,2.5,2.95);
  if(subAlpha3>0){
    textWithGlow('Tout ce dont vous avez besoin, en un seul endroit',W/2,H-80,20,'normal',colors.grey,colors.indigo,4,subAlpha3);
  }
}

function scene4(t,localT){
  const prevAlpha=fadeOut(t,0,0.35);
  if(prevAlpha>0){
    textWithGlow('Fonctionnalités clés',W/2,170,36,'bold',colors.white,colors.indigo,15,prevAlpha);
  }
  const phoneAlpha=fadeInOut(t,0.2,0.8,2.0,2.45);
  if(phoneAlpha>0){
    const sc=lerp(0.6,1,easeOutBack(clamp(localT/0.55,0,1)));
    drawPhoneMockup(W/2-240,H/2+15,sc,phoneAlpha,localT);
  }
  const textAlpha=fadeInOut(t,0.6,1.2,2.0,2.45);
  if(textAlpha>0){
    const tx=W/2+170;
    const ease=easeOutCubic(clamp((localT-0.5)/0.7,0,1));
    textWithGlow('Interface intuitive',tx,H/2-40,38,'bold',colors.white,colors.cyan,12,textAlpha*ease);
    textWithGlow('Une expérience fluide et',tx,H/2+10,22,'normal',colors.grey,colors.indigo,4,textAlpha*ease);
    textWithGlow('pensée pour vous',tx,H/2+40,22,'normal',colors.grey,colors.indigo,4,textAlpha*ease);
    const lineY=H/2+80;
    const lw2=220*ease;
    ctx.save();
    ctx.globalAlpha=textAlpha*ease;
    ctx.fillStyle=colors.cyan;
    ctx.fillRect(tx-lw2/2,lineY,8,8);
    ctx.fillStyle=colors.indigo;
    ctx.fillRect(tx-lw2/2+12,lineY,30,8);
    ctx.fillStyle=colors.purple;
    ctx.fillRect(tx-lw2/2+46,lineY,55,8);
    ctx.restore();
  }
}

function scene5(t,localT){
  const prevAlpha=fadeOut(t,0,0.35);
  if(prevAlpha>0){
    textWithGlow('Interface intuitive',W/2+170,H/2-40,38,'bold',colors.white,colors.cyan,12,prevAlpha);
  }
  const alpha=fadeInOut(t,0.2,0.7,2.2,2.55);
  if(alpha>0){
    const ease=easeOutCubic(clamp(localT/0.6,0,1));
    const countP=clamp((localT-0.2)/1.6,0,1);
    const displayNum=Math.floor(easeOutExpo(countP)*1000000);
    const formatted='1M+';
    textWithGlow(formatted,W/2,H/2-70,110,'bold',colors.white,colors.indigo,25,alpha*ease);
    textWithGlow('utilisateurs actifs',W/2,H/2+20,30,'bold',colors.grey,colors.indigo,6,alpha*ease);
    const starY=H/2+85;
    const starAlpha=alpha*clamp((localT-0.6)/0.5,0,1);
    if(starAlpha>0){
      for(let i=0;i<5;i++){
        const fill=i<4?1:0.9;
        const sx=W/2+(i-2)*45;
        const sy=starY+Math.sin(localT*4+i)*3;
        drawStar(sx,sy,5,19,9,-Math.PI/2);
        ctx.fillStyle=colors.gold;
        ctx.globalAlpha=starAlpha*fill;
        ctx.fill();
        ctx.strokeStyle=colors.gold;
        ctx.lineWidth=1.5;
        ctx.globalAlpha=starAlpha*0.8;
        ctx.stroke();
        ctx.globalAlpha=1;
      }
      textWithGlow('4.9/5',W/2+160,starY,20,'bold',colors.gold,colors.gold,8,starAlpha);
      textWithGlow('Note moyenne',W/2,starY+40,20,'normal',colors.grey,colors.indigo,4,starAlpha);
    }
    const subAlpha5=fadeInOut(t,1.8,2.3,2.3,2.55);
    if(subAlpha5>0){
      textWithGlow('Les utilisateurs adorent Mentis',W/2,H-90,22,'normal',colors.grey,colors.indigo,4,subAlpha5);
    }
  }
}

function scene6(t,localT){
  const prevAlpha=fadeOut(t,0,0.3);
  if(prevAlpha>0){
    textWithGlow('1M+',W/2,H/2-70,110,'bold',colors.white,colors.indigo,25,prevAlpha);
  }
  const alpha=fadeInOut(t,0.15,0.7,14,15);
  if(alpha>0){
    const ease=easeOutBack(clamp(localT/0.6,0,1));
    const glow=1-Math.abs(localT-0.7)*0.4;
    drawLogoMentis(W/2,H/2-80,70*ease,alpha,glow*0.6);
    textWithGlow('Téléchargez Mentis',W/2,H/2+30,58,'bold',colors.white,colors.cyan,18,alpha*ease);
    textWithGlow('Disponible sur iOS et Android',W/2,H/2+85,24,'normal',colors.grey,colors.indigo,6,alpha*ease);
    const btnAlpha=alpha*clamp((localT-0.5)/0.4,0,1);
    const btnY=H/2+160;
    if(btnAlpha>0){
      drawAppStoreButtons(W/2-280,btnY,260,btnAlpha,true);
      drawAppStoreButtons(W/2+20,btnY,260,btnAlpha,false);
    }
    if(localT<1.5&&Math.random()<0.15){
      emitBurst(W/2+Math.random()*160-80,H/2-50+Math.random()*120-60,1,[colors.cyan,colors.indigo,colors.purple,colors.gold],5,1.2);
    }
    if(localT>0.8&&localT<2.5){
      const pr=clamp((localT-0.8)/0.7,0,1);
      drawRing(W/2,H/2-30,pr*400,2,colors.indigo,alpha*(1-pr)*0.6);
      drawRing(W/2,H/2-30,pr*320,1.5,colors.cyan,alpha*(1-pr)*0.5);
    }
  }
}

let lastEmit1=false,lastEmit2=false;
function render(t){
  drawBackground(t);
  drawParticles(t);
  const s1=0,s2=2.5,s3=4.8,s4=7.8,s5=10.2,s6=12.8;
  if(t>=s1&&t<s2)scene1(t,t-s1);
  else if(t>=s2&&t<s3)scene2(t,t-s2);
  else if(t>=s3&&t<s4)scene3(t,t-s3);
  else if(t>=s4&&t<s5)scene4(t,t-s4);
  else if(t>=s5&&t<s6)scene5(t,t-s5);
  else if(t>=s6)scene6(t,t-s6);
  else scene1(t,t);
}

function loop(){
  const now=performance.now();
  const raw=(now-startTime)/1000;
  const t=((raw+tOff)%DUR+DUR)%DUR;
  const dt=1/60;
  ctx.clearRect(0,0,W,H);
  updateParticles(dt);
  render(t);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
