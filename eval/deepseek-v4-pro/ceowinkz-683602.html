<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Winkz Enterprises - Brand Pitch</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
(function(){
  const cvs = document.getElementById('stage');
  const ctx = cvs.getContext('2d');
  const W = 1280, H = 720;
  cvs.width = W; cvs.height = H;
  
  // Fit canvas to window while preserving aspect ratio
  function fitCanvas() {
    const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
    cvs.style.width = (W * scale) + 'px';
    cvs.style.height = (H * scale) + 'px';
  }
  fitCanvas();
  window.addEventListener('resize', fitCanvas);

  // Time setup
  window.DUR = 15;
  const urlParams = new URLSearchParams(window.location.search);
  const tOffset = parseFloat(urlParams.get('t') || '0') || 0;

  // Easing functions
  const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
  const easeInOutCubic = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
  const easeOutExpo = t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t);
  const easeInOutExpo = t => t === 0 ? 0 : t === 1 ? 1 : t < 0.5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2;

  // Colors
  const BG1 = '#0a0a18';
  const BG2 = '#141428';
  const GOLD = '#f0b429';
  const GOLD_LIGHT = '#ffd75e';
  const TEAL = '#4ecdc4';
  const WHITE = '#ffffff';
  const TEXT_DIM = 'rgba(255,255,255,0.7)';
  const TEXT_FAINT = 'rgba(255,255,255,0.4)';

  // Particles
  const particles = [];
  for (let i = 0; i < 50; i++) {
    particles.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: 0.8 + Math.random() * 2.2,
      vx: (Math.random() - 0.5) * 0.25,
      vy: -0.15 - Math.random() * 0.35,
      alpha: 0.15 + Math.random() * 0.4,
      pulse: Math.random() * Math.PI * 2,
      pulseSpeed: 0.01 + Math.random() * 0.02
    });
  }

  // Background geometric shapes
  const bgShapes = [
    { type: 'circle', x: 110, y: 120, r: 65, angle: 0, speed: 0.08, alpha: 0.06, color: GOLD },
    { type: 'square', x: 1100, y: 550, s: 90, angle: 0, speed: -0.05, alpha: 0.05, color: TEAL },
    { type: 'triangle', x: 1080, y: 90, s: 70, angle: 0, speed: 0.06, alpha: 0.05, color: GOLD },
    { type: 'circle', x: 650, y: 620, r: 50, angle: 0, speed: -0.07, alpha: 0.04, color: '#ffffff' },
    { type: 'square', x: 240, y: 610, s: 65, angle: 0, speed: 0.09, alpha: 0.05, color: GOLD },
    { type: 'triangle', x: 150, y: 420, s: 55, angle: 0, speed: -0.04, alpha: 0.04, color: TEAL }
  ];

  function drawBackground(time) {
    // Base gradient
    const bgShift = Math.sin(time * 0.3) * 0.03 + 0.5;
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#0a0a16');
    grad.addColorStop(0.5, '#0e0e1e');
    grad.addColorStop(1, '#16162c');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Subtle radial glow
    const centerGlow = ctx.createRadialGradient(W * 0.5, H * 0.45, 80, W * 0.5, H * 0.45, 600);
    centerGlow.addColorStop(0, 'rgba(240, 180, 41, 0.025)');
    centerGlow.addColorStop(0.5, 'rgba(78, 205, 196, 0.015)');
    centerGlow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = centerGlow;
    ctx.fillRect(0, 0, W, H);

    // Rotating shapes
    bgShapes.forEach(s => {
      s.angle += s.speed * 0.02;
      ctx.save();
      ctx.globalAlpha = s.alpha;
      ctx.translate(s.x, s.y);
      ctx.rotate(s.angle);
      if (s.type === 'circle') {
        ctx.beginPath();
        ctx.arc(0, 0, s.r, 0, Math.PI * 2);
        ctx.strokeStyle = s.color;
        ctx.lineWidth = 1.5;
        ctx.stroke();
      } else if (s.type === 'square') {
        ctx.strokeStyle = s.color;
        ctx.lineWidth = 1.5;
        ctx.strokeRect(-s.s / 2, -s.s / 2, s.s, s.s);
      } else if (s.type === 'triangle') {
        ctx.beginPath();
        ctx.moveTo(0, -s.s / 2);
        ctx.lineTo(s.s / 2, s.s / 2);
        ctx.lineTo(-s.s / 2, s.s / 2);
        ctx.closePath();
        ctx.strokeStyle = s.color;
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
      ctx.restore();
    });

    // Vignette
    const vignette = ctx.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, H * 1.05);
    vignette.addColorStop(0, 'rgba(0,0,0,0)');
    vignette.addColorStop(1, 'rgba(0,0,0,0.55)');
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, W, H);
  }

  function drawParticles(time) {
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.pulse += p.pulseSpeed;
      if (p.y < -10) { p.y = H + 10; p.x = Math.random() * W; }
      if (p.x < -10) p.x = W + 10;
      if (p.x > W + 10) p.x = -10;
      const alpha = p.alpha * (0.6 + 0.4 * Math.sin(p.pulse));
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 220, 150, ${alpha})`;
      ctx.fill();
    });
  }

  function drawTextGlow(text, x, y, fontSize, color, alpha, glowColor, glowBlur, align = 'center', fontFamily = 'system-ui, -apple-system, Arial, sans-serif') {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    ctx.font = `bold ${fontSize}px ${fontFamily}`;
    ctx.textAlign = align;
    ctx.textBaseline = 'middle';
    if (glowBlur > 0) {
      ctx.shadowColor = glowColor;
      ctx.shadowBlur = glowBlur;
    }
    ctx.fillText(text, x, y);
    ctx.restore();
  }

  function drawText(text, x, y, fontSize, color, alpha, align = 'center', fontFamily = 'system-ui, -apple-system, Arial, sans-serif', weight = 'bold') {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    ctx.font = `${weight} ${fontSize}px ${fontFamily}`;
    ctx.textAlign = align;
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x, y);
    ctx.restore();
  }

  // Scene 1: Intro (0 - 2.3s)
  function drawIntro(t) {
    const localT = t;
    const letters = ['W', 'I', 'N', 'K', 'Z'];
    const letterPositions = [];
    const spacing = 72;
    const startX = W / 2 - ((letters.length - 1) * spacing) / 2;
    const baseY = H / 2 - 25;

    // Letter pop-in stagger
    letters.forEach((letter, i) => {
      const delay = 0.1 + i * 0.09;
      const lt = Math.max(0, Math.min(1, (localT - delay) / 0.55));
      const scale = easeOutBack(lt);
      const alpha = Math.max(0, Math.min(1, (localT - delay) / 0.35));
      const x = startX + i * spacing;
      ctx.save();
      ctx.translate(x, baseY);
      ctx.scale(scale, scale);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = GOLD;
      ctx.font = 'bold 110px system-ui, -apple-system, Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = 'rgba(240, 180, 41, 0.7)';
      ctx.shadowBlur = 28;
      ctx.fillText(letter, 0, 0);
      ctx.restore();
    });

    // "ENTERPRISES" below
    const entAlpha = easeOutCubic(Math.max(0, Math.min(1, (localT - 0.85) / 0.7)));
    if (entAlpha > 0) {
      ctx.save();
      ctx.globalAlpha = entAlpha;
      ctx.fillStyle = WHITE;
      ctx.font = 'bold 30px system-ui, -apple-system, Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = 'rgba(255,255,255,0.3)';
      ctx.shadowBlur = 12;
      ctx.fillText('ENTERPRISES', W / 2, baseY + 85);
      ctx.restore();
    }

    // Gold accent line
    const lineProgress = easeOutCubic(Math.max(0, Math.min(1, (localT - 1.1) / 0.7)));
    if (lineProgress > 0) {
      const lineWidth = 280 * lineProgress;
      ctx.save();
      ctx.globalAlpha = lineProgress * 0.9;
      ctx.fillStyle = GOLD;
      ctx.shadowColor = 'rgba(240,180,41,0.8)';
      ctx.shadowBlur = 15;
      ctx.fillRect(W / 2 - lineWidth / 2, baseY + 105, lineWidth, 3);
      ctx.restore();
    }

    // Brief tagline
    const tagAlpha = easeOutCubic(Math.max(0, Math.min(1, (localT - 1.5) / 0.5)));
    if (tagAlpha > 0) {
      drawText('Your Amazon Growth Partner', W / 2, baseY + 138, 21, TEXT_DIM, tagAlpha * 0.8);
    }

    // Fade out entire intro
    const fadeOut = Math.max(0, Math.min(1, (t - 2.05) / 0.35));
    if (fadeOut > 0) {
      ctx.fillStyle = `rgba(10,10,22,${fadeOut * 0.85})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  // Scene 2: Amazon Wholesale Experts (2.0 - 4.7s)
  function drawExpertise(t) {
    const localT = t - 2.0;
    const fadeIn = easeOutCubic(Math.max(0, Math.min(1, localT / 0.6)));
    const fadeOut = Math.max(0, Math.min(1, (t - 4.35) / 0.4));
    const totalAlpha = fadeIn * (1 - fadeOut);

    if (totalAlpha <= 0) return;

    const slideUp = easeOutCubic(Math.max(0, Math.min(1, localT / 0.7))) * 30;
    const textY = H / 2 - 10 + (30 - slideUp);

    // Title
    drawTextGlow('Amazon Wholesale', W / 2, textY - 35, 52, WHITE, totalAlpha, 'rgba(255,255,255,0.4)', 18);
    drawTextGlow('EXPERTS', W / 2, textY + 35, 68, GOLD, totalAlpha, 'rgba(240,180,41,0.7)', 30);

    // Underline
    const underlineProgress = easeOutCubic(Math.max(0, Math.min(1, (localT - 0.5) / 0.8)));
    if (underlineProgress > 0 && fadeIn > 0) {
      const lineW = 380 * underlineProgress;
      ctx.save();
      ctx.globalAlpha = totalAlpha * 0.95;
      ctx.fillStyle = GOLD;
      ctx.shadowColor = 'rgba(240,180,41,0.9)';
      ctx.shadowBlur = 18;
      ctx.fillRect(W / 2 - lineW / 2, textY + 85, lineW, 3.5);
      ctx.restore();
    }

    // Subtitle
    const subAlpha = easeOutCubic(Math.max(0, Math.min(1, (localT - 0.75) / 0.6))) * totalAlpha;
    if (subAlpha > 0) {
      drawText('Decades of combined marketplace expertise', W / 2, textY + 125, 22, TEXT_DIM, subAlpha * 0.85);
    }

    // Decorative elements
    const decAlpha = fadeIn * (1 - fadeOut);
    if (decAlpha > 0.05) {
      ctx.save();
      ctx.globalAlpha = decAlpha * 0.5;
      // Small decorative dots
      for (let i = 0; i < 8; i++) {
        const dotX = W / 2 - 420 + i * 120;
        const dotY = textY + 60 + Math.sin(i * 2.1) * 12;
        const dotSize = 2.5 + Math.sin(localT * 3 + i) * 1;
        ctx.beginPath();
        ctx.arc(dotX, dotY, dotSize, 0, Math.PI * 2);
        ctx.fillStyle = i % 2 === 0 ? GOLD : TEAL;
        ctx.fill();
      }
      ctx.restore();
    }
  }

  // Scene 3: Stats Cards (4.5 - 8.3s)
  function drawStats(t) {
    const localT = t - 4.5;
    const fadeIn = easeOutCubic(Math.max(0, Math.min(1, localT / 0.5)));
    const fadeOut = Math.max(0, Math.min(1, (t - 7.95) / 0.4));
    const totalAlpha = fadeIn * (1 - fadeOut);

    if (totalAlpha <= 0) return;

    const stats = [
      { icon: 'brands', value: '200+', label: 'Brands Partnered', x: 280, color: GOLD },
      { icon: 'growth', value: '3.2x', label: 'Avg. Revenue Growth', x: 640, color: TEAL },
      { icon: 'accuracy', value: '98%', label: 'Order Accuracy', x: 1000, color: '#ff8fab' }
    ];

    stats.forEach((stat, idx) => {
      const delay = 0.2 + idx * 0.22;
      const popT = Math.max(0, Math.min(1, (localT - delay) / 0.55));
      const popScale = easeOutBack(popT);
      const cardAlpha = Math.max(0, Math.min(1, (localT - delay) / 0.4)) * totalAlpha;
      const cardY = H / 2 + 15;

      if (cardAlpha <= 0 || popT <= 0) return;

      // Card background
      ctx.save();
      ctx.globalAlpha = cardAlpha;
      ctx.translate(stat.x, cardY);
      ctx.scale(popScale, popScale);
      
      // Card rect
      const cardW = 280, cardH = 210;
      ctx.fillStyle = 'rgba(255,255,255,0.04)';
      ctx.strokeStyle = 'rgba(255,255,255,0.12)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(-cardW / 2, -cardH / 2, cardW, cardH, 16);
      ctx.fill();
      ctx.stroke();
      
      // Top accent bar
      ctx.fillStyle = stat.color;
      ctx.shadowColor = stat.color;
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.roundRect(-cardW / 2 + 30, -cardH / 2 - 2, cardW - 60, 4, 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Icon area
      ctx.save();
      ctx.translate(0, -35);
      
      if (stat.icon === 'brands') {
        // Three overlapping circles
        const iconAlpha = cardAlpha;
        ctx.globalAlpha = iconAlpha;
        const circlePositions = [[-22, 0], [22, 0], [0, -16]];
        circlePositions.forEach((cp, ci) => {
          ctx.beginPath();
          ctx.arc(cp[0], cp[1], 18, 0, Math.PI * 2);
          ctx.strokeStyle = stat.color;
          ctx.lineWidth = 2.5;
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(cp[0], cp[1], 6, 0, Math.PI * 2);
          ctx.fillStyle = stat.color;
          ctx.fill();
        });
      } else if (stat.icon === 'growth') {
        // Upward arrow
        ctx.globalAlpha = cardAlpha;
        ctx.beginPath();
        ctx.moveTo(-15, 22);
        ctx.lineTo(-5, 22);
        ctx.lineTo(-5, -8);
        ctx.lineTo(5, -8);
        ctx.lineTo(5, 22);
        ctx.lineTo(15, 22);
        ctx.lineTo(15, -18);
        ctx.lineTo(28, -18);
        ctx.lineTo(0, -40);
        ctx.lineTo(-28, -18);
        ctx.lineTo(-15, -18);
        ctx.lineTo(-15, 22);
        ctx.closePath();
        ctx.strokeStyle = stat.color;
        ctx.lineWidth = 2.5;
        ctx.stroke();
        ctx.fillStyle = 'rgba(78,205,196,0.25)';
        ctx.fill();
      } else if (stat.icon === 'accuracy') {
        // Checkmark in circle
        ctx.globalAlpha = cardAlpha;
        ctx.beginPath();
        ctx.arc(0, 0, 22, 0, Math.PI * 2);
        ctx.strokeStyle = stat.color;
        ctx.lineWidth = 2.5;
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(-11, 2);
        ctx.lineTo(-4, 10);
        ctx.lineTo(13, -10);
        ctx.strokeStyle = stat.color;
        ctx.lineWidth = 3.5;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.stroke();
      }
      ctx.restore();

      // Value
      ctx.globalAlpha = cardAlpha;
      ctx.fillStyle = WHITE;
      ctx.font = 'bold 44px system-ui, -apple-system, Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(stat.value, 0, 25);

      // Label
      ctx.globalAlpha = cardAlpha * 0.85;
      ctx.fillStyle = TEXT_DIM;
      ctx.font = '600 18px system-ui, -apple-system, Arial, sans-serif';
      ctx.fillText(stat.label, 0, 68);

      ctx.restore();
    });
  }

  // Scene 4: Growth Chart (7.8 - 11.2s)
  function drawGrowth(t) {
    const localT = t - 7.8;
    const fadeIn = easeOutCubic(Math.max(0, Math.min(1, localT / 0.55)));
    const fadeOut = Math.max(0, Math.min(1, (t - 10.85) / 0.4));
    const totalAlpha = fadeIn * (1 - fadeOut);

    if (totalAlpha <= 0) return;

    const chartX = 360, chartY = 480, chartW = 560, chartH = 260;
    const chartData = [
      [0, 220], [0.08, 195], [0.18, 170], [0.3, 148], [0.42, 125],
      [0.55, 105], [0.67, 85], [0.8, 60], [0.92, 38], [1.0, 18]
    ];

    // Chart progress: reveal line from left to right
    const chartProgress = easeOutCubic(Math.max(0, Math.min(1, (localT - 0.3) / 1.6)));

    ctx.save();
    ctx.globalAlpha = totalAlpha;
    
    // Chart area background
    ctx.fillStyle = 'rgba(255,255,255,0.025)';
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.roundRect(chartX - 30, chartY - chartH - 40, chartW + 60, chartH + 70, 12);
    ctx.fill();
    ctx.stroke();

    // Grid lines
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 1;
    for (let i = 1; i <= 4; i++) {
      const gy = chartY - (i * chartH / 4);
      ctx.beginPath();
      ctx.moveTo(chartX - 10, gy);
      ctx.lineTo(chartX + chartW + 10, gy);
      ctx.stroke();
    }
    for (let i = 1; i <= 5; i++) {
      const gx = chartX + (i * chartW / 5);
      ctx.beginPath();
      ctx.moveTo(gx, chartY - chartH + 15);
      ctx.lineTo(gx, chartY + 20);
      ctx.stroke();
    }

    // Draw the line
    if (chartProgress > 0) {
      const numPoints = chartData.length;
      const revealPoints = Math.floor(chartProgress * numPoints);
      
      // Area fill
      ctx.beginPath();
      ctx.moveTo(chartX, chartY + 15);
      for (let i = 0; i <= revealPoints && i < numPoints; i++) {
        const px = chartX + chartData[i][0] * chartW;
        const py = chartY - chartData[i][1];
        if (i === 0) ctx.lineTo(px, py);
        else ctx.lineTo(px, py);
      }
      const lastIdx = Math.min(revealPoints, numPoints - 1);
      ctx.lineTo(chartX + chartData[lastIdx][0] * chartW, chartY + 15);
      ctx.closePath();
      const areaGrad = ctx.createLinearGradient(0, chartY - chartH, 0, chartY + 15);
      areaGrad.addColorStop(0, 'rgba(240,180,41,0.28)');
      areaGrad.addColorStop(0.6, 'rgba(240,180,41,0.07)');
      areaGrad.addColorStop(1, 'rgba(240,180,41,0)');
      ctx.fillStyle = areaGrad;
      ctx.fill();

      // Line
      ctx.beginPath();
      for (let i = 0; i <= revealPoints && i < numPoints; i++) {
        const px = chartX + chartData[i][0] * chartW;
        const py = chartY - chartData[i][1];
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.strokeStyle = GOLD;
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.shadowColor = 'rgba(240,180,41,0.8)';
      ctx.shadowBlur = 14;
      ctx.stroke();
      ctx.shadowBlur = 0;

      // Data points
      for (let i = 0; i <= revealPoints && i < numPoints; i++) {
        const px = chartX + chartData[i][0] * chartW;
        const py = chartY - chartData[i][1];
        const ptAlpha = i === revealPoints ? 1 : 0.6;
        ctx.save();
        ctx.globalAlpha = ptAlpha * totalAlpha;
        ctx.beginPath();
        ctx.arc(px, py, 6, 0, Math.PI * 2);
        ctx.fillStyle = GOLD_LIGHT;
        ctx.shadowColor = 'rgba(240,180,41,0.9)';
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.restore();
      }
      
      // End label
      if (chartProgress >= 0.95) {
        const endAlpha = (chartProgress - 0.95) / 0.05;
        const lastPx = chartX + chartW;
        const lastPy = chartY - 18;
        ctx.save();
        ctx.globalAlpha = endAlpha * totalAlpha;
        ctx.fillStyle = GOLD_LIGHT;
        ctx.font = 'bold 22px system-ui, -apple-system, Arial, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('▲ 500% YoY', lastPx, lastPy - 28);
        ctx.restore();
      }
    }

    // Text overlay
    const textAlpha = easeOutCubic(Math.max(0, Math.min(1, (localT - 1.2) / 0.6))) * totalAlpha;
    if (textAlpha > 0) {
      const textSlide = easeOutCubic(Math.max(0, Math.min(1, (localT - 1.2) / 0.7))) * 20;
      drawTextGlow('We Scale Your Brand', W / 2, chartY - chartH - 20 + (20 - textSlide), 38, WHITE, textAlpha, 'rgba(255,255,255,0.35)', 14);
      drawTextGlow('on Amazon', W / 2, chartY - chartH + 25 + (20 - textSlide), 48, GOLD, textAlpha, 'rgba(240,180,41,0.6)', 20);
    }

    ctx.restore();
  }

  // Scene 5: Results/Promise (10.8 - 13.3s)
  function drawResults(t) {
    const localT = t - 10.8;
    const fadeIn = easeOutCubic(Math.max(0, Math.min(1, localT / 0.55)));
    const fadeOut = Math.max(0, Math.min(1, (t - 12.95) / 0.4));
    const totalAlpha = fadeIn * (1 - fadeOut);

    if (totalAlpha <= 0) return;

    const scaleIn = easeOutBack(Math.max(0, Math.min(1, localT / 0.7)));
    
    ctx.save();
    ctx.globalAlpha = totalAlpha;
    ctx.translate(W / 2, H / 2 - 20);
    ctx.scale(scaleIn, scaleIn);
    
    // Main text
    drawTextGlow('Proven Results.', 0, -40, 58, WHITE, 1, 'rgba(255,255,255,0.4)', 16);
    drawTextGlow('Real Growth.', 0, 40, 58, GOLD, 1, 'rgba(240,180,41,0.7)', 24);

    // Accent bars
    const barAlpha = easeOutCubic(Math.max(0, Math.min(1, (localT - 0.5) / 0.5)));
    if (barAlpha > 0) {
      ctx.globalAlpha = barAlpha * totalAlpha;
      ctx.fillStyle = GOLD;
      ctx.shadowColor = 'rgba(240,180,41,0.7)';
      ctx.shadowBlur = 12;
      ctx.fillRect(-85, 78, 170 * barAlpha, 3);
      ctx.shadowBlur = 0;
    }
    
    ctx.restore();

    // Small supporting text below
    const subAlpha = easeOutCubic(Math.max(0, Math.min(1, (localT - 0.7) / 0.6))) * totalAlpha;
    if (subAlpha > 0) {
      drawText('Your brand deserves a winning Amazon strategy', W / 2, H / 2 + 105, 20, TEXT_DIM, subAlpha * 0.8);
    }
  }

  // Scene 6: Call to Action (12.8 - 15.0s)
  function drawCTA(t) {
    const localT = t - 12.8;
    const fadeIn = easeOutCubic(Math.max(0, Math.min(1, localT / 0.6)));
    
    if (fadeIn <= 0) return;

    const scaleIn = easeOutBack(Math.max(0, Math.min(1, localT / 0.75)));
    const pulse = 0.03 * Math.sin(localT * 3) * (t < 14.2 ? 1 : Math.max(0, 1 - (t - 14.2) / 0.8));
    
    // Center CTA
    ctx.save();
    ctx.globalAlpha = fadeIn;
    ctx.translate(W / 2, H / 2 - 10);
    ctx.scale(scaleIn + pulse, scaleIn + pulse);
    
    // Button-like shape
    const btnAlpha = Math.max(0, Math.min(1, (localT - 0.35) / 0.5));
    if (btnAlpha > 0) {
      ctx.globalAlpha = btnAlpha * fadeIn;
      ctx.fillStyle = 'rgba(240,180,41,0.12)';
      ctx.strokeStyle = 'rgba(240,180,41,0.65)';
      ctx.lineWidth = 2.5;
      ctx.shadowColor = 'rgba(240,180,41,0.6)';
      ctx.shadowBlur = 24;
      ctx.beginPath();
      ctx.roundRect(-330, -55, 660, 110, 22);
      ctx.fill();
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
    
    // Text
    ctx.globalAlpha = fadeIn;
    drawTextGlow('Partner with', 0, -22, 38, WHITE, 1, 'rgba(255,255,255,0.4)', 14);
    drawTextGlow('WINKZ ENTERPRISES', 0, 28, 44, GOLD, 1, 'rgba(240,180,41,0.8)', 28);
    
    ctx.restore();

    // Subtext below
    const subAlpha = easeOutCubic(Math.max(0, Math.min(1, (localT - 0.55) / 0.6))) * fadeIn;
    if (subAlpha > 0) {
      drawText('Let\'s grow together →', W / 2, H / 2 + 92, 24, TEAL, subAlpha * 0.9);
    }

    // Final flash at the end
    if (t > 14.3) {
      const flashAlpha = Math.max(0, Math.min(1, (t - 14.3) / 0.25)) * Math.max(0, 1 - (t - 14.6) / 0.4);
      if (flashAlpha > 0) {
        ctx.fillStyle = `rgba(240,180,41,${flashAlpha * 0.18})`;
        ctx.fillRect(0, 0, W, H);
      }
    }
  }

  // Main render loop
  function render() {
    const rawTime = performance.now() / 1000;
    const time = (rawTime + tOffset) % window.DUR;

    ctx.clearRect(0, 0, W, H);
    drawBackground(time);
    drawParticles(time);

    // Scene rendering with overlap transitions
    if (time < 2.3) drawIntro(time);
    if (time >= 1.9 && time < 5.1) drawExpertise(time);
    if (time >= 4.4 && time < 8.7) drawStats(time);
    if (time >= 7.7 && time < 11.6) drawGrowth(time);
    if (time >= 10.7 && time < 13.6) drawResults(time);
    if (time >= 12.7) drawCTA(time);

    // Final fade to black at very end of loop
    if (time > 14.7) {
      const endFade = Math.max(0, Math.min(1, (time - 14.7) / 0.3));
      ctx.fillStyle = `rgba(0,0,0,${endFade})`;
      ctx.fillRect(0, 0, W, H);
    }

    requestAnimationFrame(render);
  }

  // Polyfill for roundRect if needed
  if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
      if (typeof r === 'number') r = { tl: r, tr: r, br: r, bl: r };
      this.moveTo(x + r.tl, y);
      this.lineTo(x + w - r.tr, y);
      this.quadraticCurveTo(x + w, y, x + w, y + r.tr);
      this.lineTo(x + w, y + h - r.br);
      this.quadraticCurveTo(x + w, y + h, x + w - r.br, y + h);
      this.lineTo(x + r.bl, y + h);
      this.quadraticCurveTo(x, y + h, x, y + h - r.bl);
      this.lineTo(x, y + r.tl);
      this.quadraticCurveTo(x, y, x + r.tl, y);
      return this;
    };
  }

  requestAnimationFrame(render);
})();
</script>
