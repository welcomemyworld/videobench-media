<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>The Last Signal</title>
<style>
  body { margin:0; background:#000; display:flex; align-items:center; justify-content:center; height:100vh; overflow:hidden; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<script>
(function(){
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const W = 1280, H = 720, CX = W/2, CY = H/2;
  const FOCAL = 520;
  const DUR = 30;
  window.DUR = DUR;

  // Scaling
  function resize() {
    const scale = Math.min(window.innerWidth/W, window.innerHeight/H);
    canvas.style.width = (W*scale)+'px';
    canvas.style.height = (H*scale)+'px';
  }
  window.addEventListener('resize', resize);
  resize();

  // Time offset
  const params = new URLSearchParams(window.location.search);
  const tOffset = parseFloat(params.get('t') || '0') || 0;
  const startTime = performance.now();

  // Helper functions
  function lerp(a,b,t){ return a+(b-a)*t; }
  function smooth(t){ return t*t*(3-2*t); }
  function clamp(v,min,max){ return Math.max(min,Math.min(max,v)); }
  function randomUnitVector(){
    const theta = Math.random()*2*Math.PI;
    const phi = Math.acos(2*Math.random()-1);
    return { x: Math.sin(phi)*Math.cos(theta), y: Math.sin(phi)*Math.sin(theta), z: Math.cos(phi) };
  }
  function rotateY(p, angle){
    const c = Math.cos(angle), s = Math.sin(angle);
    return { x: p.x*c - p.z*s, y: p.y, z: p.x*s + p.z*c };
  }
  function project(p, camDist, camRotY){
    const r = rotateY(p, camRotY);
    const depth = camDist - r.z;
    const scale = FOCAL / Math.max(depth, 1);
    return { x: CX + r.x*scale, y: CY + r.y*scale, scale: scale, depth: depth };
  }

  // Color palette
  function getHue(t){
    const stops = [[0,220],[0.15,240],[0.3,280],[0.5,320],[0.7,0],[0.85,50],[1,220]];
    for(let i=0;i<stops.length-1;i++){
      if(t >= stops[i][0] && t <= stops[i+1][0]){
        const f = (t - stops[i][0]) / (stops[i+1][0]-stops[i][0]);
        return lerp(stops[i][1], stops[i+1][1], smooth(f));
      }
    }
    return stops[stops.length-1][1];
  }

  // Pre-render glow sprites
  const glowCache = {};
  function getGlow(color, size){
    const key = color + '_' + size;
    if(glowCache[key]) return glowCache[key];
    const off = document.createElement('canvas');
    off.width = off.height = size*2;
    const octx = off.getContext('2d');
    const grad = octx.createRadialGradient(size,size,0,size,size,size);
    grad.addColorStop(0, 'rgba(255,255,255,1)');
    grad.addColorStop(0.3, color);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    octx.fillStyle = grad;
    octx.fillRect(0,0,size*2,size*2);
    glowCache[key] = off;
    return off;
  }

  // Background stars
  const bgStars = [];
  for(let i=0;i<600;i++){
    bgStars.push({
      x: Math.random()*W, y: Math.random()*H,
      size: Math.random()*1.5+0.3,
      alpha: Math.random()*0.7+0.3,
      depth: Math.random()*0.8+0.2
    });
  }

  // Nebula blobs
  const nebulae = [];
  for(let i=0;i<6;i++){
    nebulae.push({
      x: Math.random()*W, y: Math.random()*H,
      r: Math.random()*300+200,
      hue: Math.random()*360,
      alpha: 0.04
    });
  }

  // Morph particles (network -> galaxy)
  const SPHERE_R = 380;
  const GALAXY_MAX_R = 280;
  const morphParticles = [];
  const NUM_MORPH = 700;
  for(let i=0;i<NUM_MORPH;i++){
    // Start: sphere
    const u = Math.random()*2-1;
    const phi = Math.random()*2*Math.PI;
    const r = SPHERE_R * Math.cbrt(Math.random());
    const start = {
      x: r * Math.sqrt(1-u*u) * Math.cos(phi),
      y: r * Math.sqrt(1-u*u) * Math.sin(phi),
      z: r * u
    };
    // End: spiral galaxy (2 arms)
    const arm = Math.floor(Math.random()*2);
    const radius = GALAXY_MAX_R * Math.pow(Math.random(), 0.5);
    const angle = arm * Math.PI + radius * 0.045 + (Math.random()-0.5)*0.4;
    const end = {
      x: radius * Math.cos(angle),
      y: radius * Math.sin(angle),
      z: (Math.random()-0.5) * 50
    };
    morphParticles.push({
      start, end,
      size: Math.random()*2.5+1.5,
      alpha: Math.random()*0.5+0.5
    });
  }

  // Precompute connections (2 nearest neighbors in sphere)
  const connections = [];
  for(let i=0;i<NUM_MORPH;i++){
    const dists = [];
    for(let j=0;j<NUM_MORPH;j++){
      if(i===j) continue;
      const dx = morphParticles[i].start.x - morphParticles[j].start.x;
      const dy = morphParticles[i].start.y - morphParticles[j].start.y;
      const dz = morphParticles[i].start.z - morphParticles[j].start.z;
      dists.push({idx:j, dist: dx*dx+dy*dy+dz*dz});
    }
    dists.sort((a,b)=>a.dist-b.dist);
    for(let k=0;k<2;k++){
      const j = dists[k].idx;
      if(i<j) connections.push([i,j]);
    }
  }

  // Galaxy-only stars (fade in after morph)
  const galaxyStars = [];
  const NUM_GALAXY = 1800;
  for(let i=0;i<NUM_GALAXY;i++){
    const arm = Math.floor(Math.random()*2);
    const radius = GALAXY_MAX_R * Math.pow(Math.random(), 0.6);
    const angle = arm * Math.PI + radius * 0.045 + (Math.random()-0.5)*0.35;
    galaxyStars.push({
      x: radius * Math.cos(angle),
      y: radius * Math.sin(angle),
      z: (Math.random()-0.5) * 40,
      size: Math.random()*1.8+0.5,
      alpha: Math.random()*0.6+0.4
    });
  }

  // Explosion particles
  const explosionParticles = [];
  const NUM_EXPLOSION = 450;
  for(let i=0;i<NUM_EXPLOSION;i++){
    const dir = randomUnitVector();
    explosionParticles.push({
      dir,
      speed: Math.random()*6+3,
      life: 0,
      maxLife: Math.random()*2+2,
      active: false,
      size: Math.random()*3+1,
      alpha: Math.random()*0.8+0.2
    });
  }

  // Camera keyframes: [time, camDist, camRotY]
  const camKeys = [
    [0.0, 850, 0.0],
    [0.08, 320, 0.15],
    [0.2, 210, 0.35],
    [0.35, 280, 0.55],
    [0.5, 240, 0.75],
    [0.65, 200, 0.95],
    [0.75, 180, 1.1],
    [0.85, 300, 1.3],
    [0.95, 500, 1.5],
    [1.0, 850, 1.6]
  ];
  function getCam(t){
    for(let i=0;i<camKeys.length-1;i++){
      if(t >= camKeys[i][0] && t <= camKeys[i+1][0]){
        const f = (t-camKeys[i][0])/(camKeys[i+1][0]-camKeys[i][0]);
        return {
          dist: lerp(camKeys[i][1], camKeys[i+1][1], smooth(f)),
          rotY: lerp(camKeys[i][2], camKeys[i+1][2], smooth(f))
        };
      }
    }
    return {dist: camKeys[camKeys.length-1][1], rotY: camKeys[camKeys.length-1][2]};
  }

  function getMorphProgress(t){
    if(t < 0.12) return 0;
    if(t < 0.45) return smooth((t-0.12)/0.33);
    return 1;
  }

  // Explosion trigger time
  const EXPLOSION_TIME = 0.72;

  function draw(t){
    // Fade
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    ctx.fillRect(0,0,W,H);

    // Base background subtle gradient
    const hue = getHue(t);
    const bgGrad = ctx.createRadialGradient(CX,CY,0,CX,CY,600);
    bgGrad.addColorStop(0, `hsl(${hue},70%,8%)`);
    bgGrad.addColorStop(1, '#000');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0,0,W,H);

    // Nebulae
    ctx.globalCompositeOperation = 'lighter';
    for(const neb of nebulae){
      const nhue = (neb.hue + hue*0.3) % 360;
      const grad = ctx.createRadialGradient(neb.x,neb.y,0,neb.x,neb.y,neb.r);
      grad.addColorStop(0, `hsla(${nhue},80%,20%,${neb.alpha})`);
      grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad;
      ctx.fillRect(neb.x-neb.r, neb.y-neb.r, neb.r*2, neb.r*2);
    }

    // Pulsing dot (early phase)
    if(t < 0.12){
      const pulse = 0.5 + 0.5*Math.sin(t*60);
      const size = 30 + pulse*50;
      const alpha = 0.6 + pulse*0.4;
      const dotGrad = ctx.createRadialGradient(CX,CY,0,CX,CY,size);
      dotGrad.addColorStop(0, `hsla(${hue},80%,70%,${alpha})`);
      dotGrad.addColorStop(1, 'transparent');
      ctx.fillStyle = dotGrad;
      ctx.beginPath();
      ctx.arc(CX,CY,size,0,Math.PI*2);
      ctx.fill();
    }

    // Camera
    const cam = getCam(t);
    const morphProgress = getMorphProgress(t);
    const galaxyAngle = t * 0.6;

    // Draw network lines (before morph fully done)
    if(morphProgress < 0.55){
      ctx.strokeStyle = `hsla(${hue},80%,70%,${0.25*(1-morphProgress/0.55)})`;
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      for(const [i,j] of connections){
        const pi = morphParticles[i], pj = morphParticles[j];
        // Current positions
        const ci = {
          x: lerp(pi.start.x, rotateY(pi.end, galaxyAngle).x, morphProgress),
          y: lerp(pi.start.y, rotateY(pi.end, galaxyAngle).y, morphProgress),
          z: lerp(pi.start.z, rotateY(pi.end, galaxyAngle).z, morphProgress)
        };
        const cj = {
          x: lerp(pj.start.x, rotateY(pj.end, galaxyAngle).x, morphProgress),
          y: lerp(pj.start.y, rotateY(pj.end, galaxyAngle).y, morphProgress),
          z: lerp(pj.start.z, rotateY(pj.end, galaxyAngle).z, morphProgress)
        };
        // Project
        const si = project(ci, cam.dist, cam.rotY);
        const sj = project(cj, cam.dist, cam.rotY);
        // Only draw if distance in screen space is not too large
        const dx = si.x-sj.x, dy = si.y-sj.y;
        if(dx*dx+dy*dy < 200*200){
          ctx.moveTo(si.x, si.y);
          ctx.lineTo(sj.x, sj.y);
        }
      }
      ctx.stroke();
    }

    // Draw morph particles (as nodes during network, then as stars)
    for(const p of morphParticles){
      const rotatedEnd = rotateY(p.end, galaxyAngle);
      const cx = lerp(p.start.x, rotatedEnd.x, morphProgress);
      const cy = lerp(p.start.y, rotatedEnd.y, morphProgress);
      const cz = lerp(p.start.z, rotatedEnd.z, morphProgress);
      const sp = project({x:cx,y:cy,z:cz}, cam.dist, cam.rotY);
      if(sp.depth < 10) continue;
      const alpha = p.alpha * (morphProgress < 0.3 ? 0.8 : 1);
      const size = sp.scale * p.size * (morphProgress < 0.3 ? 2.5 : 1);
      const color = `hsla(${hue},90%,${70+morphProgress*20}%,${alpha})`;
      const glow = getGlow(color, Math.max(2, Math.min(20, size)));
      ctx.globalAlpha = alpha;
      ctx.drawImage(glow, sp.x - size*2, sp.y - size*2, size*4, size*4);
    }

    // Galaxy-only stars (fade in with morph)
    if(morphProgress > 0.15){
      const fadeIn = clamp((morphProgress-0.15)/0.3, 0, 1);
      for(const s of galaxyStars){
        const rotated = rotateY(s, galaxyAngle);
        const sp = project(rotated, cam.dist, cam.rotY);
        if(sp.depth < 10) continue;
        const size = sp.scale * s.size;
        const alpha = s.alpha * fadeIn;
        const color = `hsla(${hue},85%,75%,${alpha})`;
        const glow = getGlow(color, Math.max(1, Math.min(10, size)));
        ctx.globalAlpha = alpha;
        ctx.drawImage(glow, sp.x - size*2, sp.y - size*2, size*4, size*4);
      }
    }

    // Explosion
    const sinceExplosion = t - EXPLOSION_TIME;
    if(sinceExplosion >= 0 && sinceExplosion < 3){
      const expProgress = sinceExplosion / 3;
      // Central flash
      if(expProgress < 0.3){
        const flashSize = 300 * (expProgress/0.3);
        const flashAlpha = 1 - expProgress/0.3;
        const flashGrad = ctx.createRadialGradient(CX,CY,0,CX,CY,flashSize);
        flashGrad.addColorStop(0, `rgba(255,255,255,${flashAlpha})`);
        flashGrad.addColorStop(0.5, `rgba(255,200,100,${flashAlpha*0.7})`);
        flashGrad.addColorStop(1, 'transparent');
        ctx.fillStyle = flashGrad;
        ctx.beginPath();
        ctx.arc(CX,CY,flashSize,0,Math.PI*2);
        ctx.fill();
      }
      // Activate particles
      if(sinceExplosion < 0.1){
        for(const ep of explosionParticles){
          ep.active = true;
          ep.life = 0;
        }
      }
      // Draw explosion particles
      for(const ep of explosionParticles){
        if(!ep.active) continue;
        ep.life += 0.016; // approx per frame, but we can compute from time delta? We'll use fixed increment since frame-based
        if(ep.life > ep.maxLife){
          ep.active = false;
          continue;
        }
        const dist = ep.life * ep.speed * 30;
        const pos = {
          x: ep.dir.x * dist,
          y: ep.dir.y * dist,
          z: ep.dir.z * dist
        };
        const sp = project(pos, cam.dist, cam.rotY);
        if(sp.depth < 5) continue;
        const fade = 1 - ep.life/ep.maxLife;
        const alpha = ep.alpha * fade;
        const size = sp.scale * ep.size * fade;
        const ehue = (hue + 30) % 360;
        const color = `hsla(${ehue},90%,80%,${alpha})`;
        const glow = getGlow(color, Math.max(1, Math.min(15, size)));
        ctx.globalAlpha = alpha;
        ctx.drawImage(glow, sp.x - size*2, sp.y - size*2, size*4, size*4);
      }
    }

    // Text phase
    const textAlpha = (() => {
      if(t < 0.8 || t > 0.98) return 0;
      if(t < 0.85) return (t-0.8)/0.05;
      if(t > 0.95) return (0.98-t)/0.03;
      return 1;
    })();
    if(textAlpha > 0){
      ctx.globalCompositeOperation = 'source-over';
      const textScale = 1 + 0.05*Math.sin(t*2);
      const fontSize = 64 * textScale;
      ctx.font = `bold ${fontSize}px Georgia, serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      // Glow
      ctx.shadowColor = `hsla(${hue},100%,70%,${textAlpha})`;
      ctx.shadowBlur = 40;
      ctx.fillStyle = `rgba(255,255,255,${textAlpha})`;
      ctx.fillText('We are made of star-stuff', CX, CY);
      ctx.shadowBlur = 0;
      // Subtext
      ctx.font = 'italic 28px Georgia, serif';
      ctx.fillStyle = `rgba(255,255,255,${textAlpha*0.7})`;
      ctx.fillText('— Carl Sagan', CX, CY + 70);
      ctx.globalCompositeOperation = 'lighter';
    }

    // Vignette
    ctx.globalCompositeOperation = 'source-over';
    const vignette = ctx.createRadialGradient(CX,CY,H*0.4,CX,CY,H*0.8);
    vignette.addColorStop(0, 'transparent');
    vignette.addColorStop(1, 'rgba(0,0,0,0.6)');
    ctx.fillStyle = vignette;
    ctx.fillRect(0,0,W,H);

    // Reset global alpha
    ctx.globalAlpha = 1;
  }

  // Main loop
  function frame(){
    const elapsed = (performance.now() - startTime)/1000 + tOffset;
    const t = elapsed % DUR;
    draw(t);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
