<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Letzter Tag der Wiesn – Ein Prost!</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: min(100vw, calc(100vh * 16 / 9));
    height: auto;
    aspect-ratio: 16 / 9;
  }
</style>
</head>
<body>
<canvas id="scene" width="1280" height="720"></canvas>
<script>
(() => {
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  const W = 1280, H = 720;
  window.DUR = 15;

  const params = new URLSearchParams(window.location.search);
  const tOffset = parseFloat(params.get('t') || '0') || 0;
  const startTime = performance.now() - tOffset * 1000;

  function getTime() {
    let t = (performance.now() - startTime) / 1000;
    return ((t % window.DUR) + window.DUR) % window.DUR;
  }

  function smoothstep(edge0, edge1, x) {
    const t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
    return t * t * (3 - 2 * t);
  }

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  function lerp(a, b, t) { return a + (b - a) * t; }

  function easeInOut(t) { return t < 0.5 ? 2*t*t : -1+(4-2*t)*t; }

  function drawSky(t) {
    const grad = ctx.createLinearGradient(0, 0, 0, 500);
    grad.addColorStop(0, '#0a0e2a');
    grad.addColorStop(0.5, '#1a2040');
    grad.addColorStop(0.85, '#2d2a4a');
    grad.addColorStop(1, '#3d2a3a');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, 500);
    // stars
    for (let i = 0; i < 40; i++) {
      const sx = (i * 137.5 + 50) % W;
      const sy = (i * 89.7 + 20) % 380;
      const twinkle = 0.3 + 0.5 * Math.sin(t * 2 + i * 1.7);
      ctx.fillStyle = `rgba(255,255,255,${twinkle * 0.7})`;
      ctx.beginPath();
      ctx.arc(sx, sy, 1.3, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawFerrisWheel(t) {
    const cx = 1080, cy = 330, R = 180;
    ctx.save();
    ctx.globalAlpha = 0.75;
    // outer ring
    ctx.strokeStyle = '#1a1a30';
    ctx.lineWidth = 12;
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.stroke();
    // inner ring
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(cx, cy, R - 18, 0, Math.PI * 2);
    ctx.stroke();
    // spokes
    ctx.lineWidth = 3;
    const spokes = 16;
    for (let i = 0; i < spokes; i++) {
      const angle = (i / spokes) * Math.PI * 2 + Math.PI / 8;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(angle) * (R - 4), cy + Math.sin(angle) * (R - 4));
      ctx.stroke();
    }
    // cabins
    const numCabins = 14;
    for (let i = 0; i < numCabins; i++) {
      const angle = (i / numCabins) * Math.PI * 2 + t * 0.05;
      const bx = cx + Math.cos(angle) * (R - 8);
      const by = cy + Math.sin(angle) * (R - 8);
      ctx.fillStyle = '#22223a';
      ctx.fillRect(bx - 10, by - 12, 20, 22);
      ctx.fillStyle = i % 3 === 0 ? 'rgba(255,200,100,0.8)' : 'rgba(40,40,60,0.6)';
      ctx.fillRect(bx - 6, by - 8, 12, 14);
    }
    // base
    ctx.fillStyle = '#1a1a28';
    ctx.fillRect(cx - 6, cy + R - 8, 12, 80);
    ctx.fillRect(cx - 30, cy + R + 60, 60, 10);
    ctx.restore();
  }

  function drawTents(t) {
    ctx.save();
    // Left tent
    ctx.globalAlpha = 0.7;
    const tentX = 130, tentY = 390, tentW = 220, tentH = 140;
    ctx.fillStyle = '#1c1c30';
    ctx.fillRect(tentX, tentY, tentW, tentH);
    // stripes on roof
    for (let i = 0; i < 7; i++) {
      const sx = tentX + i * (tentW / 7);
      const sw = tentW / 7;
      ctx.fillStyle = i % 2 === 0 ? '#4a2030' : '#8a3a2a';
      ctx.beginPath();
      ctx.moveTo(sx, tentY);
      ctx.lineTo(sx + sw, tentY);
      ctx.lineTo(sx + sw / 2 + 10, tentY - 55);
      ctx.lineTo(sx - 10, tentY);
      ctx.closePath();
      ctx.fill();
    }
    // body stripes
    for (let i = 0; i < 5; i++) {
      const sx = tentX + i * (tentW / 5);
      ctx.fillStyle = i % 2 === 0 ? '#4a2030' : '#7a3525';
      ctx.fillRect(sx, tentY, tentW / 5, tentH);
    }
    ctx.fillStyle = '#1a1a28';
    ctx.fillRect(tentX - 5, tentY - 5, tentW + 10, 6);

    // Right tent (smaller)
    const tx2 = 750, ty2 = 400, tw2 = 180, th2 = 110;
    ctx.fillStyle = '#1e1e32';
    ctx.fillRect(tx2, ty2, tw2, th2);
    for (let i = 0; i < 6; i++) {
      const sx = tx2 + i * (tw2 / 6);
      const sw = tw2 / 6;
      ctx.fillStyle = i % 2 === 0 ? '#3a2030' : '#6a3025';
      ctx.beginPath();
      ctx.moveTo(sx, ty2);
      ctx.lineTo(sx + sw, ty2);
      ctx.lineTo(sx + sw / 2 + 8, ty2 - 45);
      ctx.lineTo(sx - 8, ty2);
      ctx.closePath();
      ctx.fill();
    }
    for (let i = 0; i < 4; i++) {
      const sx = tx2 + i * (tw2 / 4);
      ctx.fillStyle = i % 2 === 0 ? '#3a2030' : '#652a20';
      ctx.fillRect(sx, ty2, tw2 / 4, th2);
    }
    ctx.fillStyle = '#1a1a28';
    ctx.fillRect(tx2 - 4, ty2 - 4, tw2 + 8, 5);
    ctx.restore();
  }

  function drawGround(t) {
    const grad = ctx.createLinearGradient(0, 450, 0, 720);
    grad.addColorStop(0, '#2d2a1e');
    grad.addColorStop(0.4, '#3d3525');
    grad.addColorStop(1, '#1e1a15');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 450, W, 270);
    // subtle path
    ctx.fillStyle = 'rgba(60,50,35,0.3)';
    ctx.beginPath();
    ctx.moveTo(400, 520);
    ctx.quadraticCurveTo(640, 480, 880, 520);
    ctx.lineTo(880, 720);
    ctx.lineTo(400, 720);
    ctx.closePath();
    ctx.fill();
    // texture
    for (let i = 0; i < 120; i++) {
      const gx = (i * 97.3 + 30) % W;
      const gy = 460 + (i * 61.7) % 250;
      ctx.fillStyle = `rgba(30,25,20,${0.1 + 0.15 * Math.sin(i * 3.7)})`;
      ctx.fillRect(gx, gy, 3, 2);
    }
  }

  function drawTables(t) {
    ctx.save();
    // Table 1 (left)
    const tx = 260, ty = 500;
    ctx.fillStyle = '#5a3d25';
    ctx.fillRect(tx - 80, ty, 160, 12);
    ctx.fillStyle = '#4a3020';
    ctx.fillRect(tx - 65, ty + 12, 8, 45);
    ctx.fillRect(tx + 57, ty + 12, 8, 45);
    // mugs on table
    for (let i = 0; i < 3; i++) {
      const mx = tx - 35 + i * 35;
      ctx.fillStyle = '#8a7a50';
      ctx.fillRect(mx, ty - 14, 14, 14);
      ctx.fillStyle = '#d4c8a0';
      ctx.fillRect(mx - 1, ty - 18, 16, 5);
    }
    // Table 2 (right)
    const tx2 = 900, ty2 = 490;
    ctx.fillStyle = '#5a3d25';
    ctx.fillRect(tx2 - 70, ty2, 140, 11);
    ctx.fillStyle = '#4a3020';
    ctx.fillRect(tx2 - 55, ty2 + 11, 7, 42);
    ctx.fillRect(tx2 + 48, ty2 + 11, 7, 42);
    for (let i = 0; i < 2; i++) {
      const mx = tx2 - 20 + i * 30;
      ctx.fillStyle = '#8a7a50';
      ctx.fillRect(mx, ty2 - 13, 12, 13);
      ctx.fillStyle = '#d4c8a0';
      ctx.fillRect(mx - 1, ty2 - 17, 14, 5);
    }
    ctx.restore();
  }

  function drawBgCharacters(t) {
    ctx.save();
    // 3-4 simple figures at tables
    const chars = [
      { x: 210, y: 500, raise: 0 },
      { x: 300, y: 498, raise: 0 },
      { x: 850, y: 495, raise: 0 },
      { x: 950, y: 490, raise: 0 }
    ];
    const raiseAmount = t > 7 && t < 12 ? smoothstep(7, 9, t) : (t >= 12 ? 1 - smoothstep(12, 14, t) : 0);
    for (const ch of chars) {
      const cx = ch.x, baseY = ch.y;
      // head
      ctx.fillStyle = '#d4a87a';
      ctx.beginPath();
      ctx.arc(cx, baseY - 40, 14, 0, Math.PI * 2);
      ctx.fill();
      // body
      ctx.fillStyle = '#4a3020';
      ctx.fillRect(cx - 18, baseY - 28, 36, 55);
      // shirt
      ctx.fillStyle = '#7a3a2a';
      ctx.fillRect(cx - 16, baseY - 30, 32, 25);
      // arm (raised based on t)
      if (raiseAmount > 0.1) {
        const armAngle = -Math.PI / 2 * raiseAmount;
        ctx.save();
        ctx.translate(cx + 14, baseY - 25);
        ctx.rotate(armAngle);
        ctx.fillStyle = '#7a3a2a';
        ctx.fillRect(-2, 0, 4, 22);
        // mug
        ctx.fillStyle = '#a08a55';
        ctx.fillRect(-6, 18, 12, 10);
        ctx.fillStyle = '#e0d4b0';
        ctx.fillRect(-7, 15, 14, 4);
        ctx.restore();
      }
      // legs
      ctx.fillStyle = '#3a2518';
      ctx.fillRect(cx - 12, baseY + 25, 8, 18);
      ctx.fillRect(cx + 4, baseY + 25, 8, 18);
      // socks
      ctx.fillStyle = '#e0e0e0';
      ctx.fillRect(cx - 12, baseY + 38, 8, 8);
      ctx.fillRect(cx + 4, baseY + 38, 8, 8);
    }
    ctx.restore();
  }

  function drawStringLights(t) {
    const numLights = 16;
    const wireYstart = (x) => 25 + 60 * Math.pow((x - 640) / 560, 2);
    
    // decide which lights are off based on time
    let offCount = 0;
    if (t > 11.8) {
      offCount = Math.floor((t - 11.8) / 0.18);
    }
    offCount = Math.min(offCount, numLights);
    
    // draw wire
    ctx.save();
    ctx.strokeStyle = '#3a3a4a';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    for (let i = 0; i <= 50; i++) {
      const x = 80 + i * (1120 / 50);
      const y = wireYstart(x);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();
    
    // draw bulbs
    for (let i = 0; i < numLights; i++) {
      const x = 80 + i * (1120 / (numLights - 1));
      const y = wireYstart(x);
      const isOn = i >= offCount;
      
      // small wire drop
      ctx.strokeStyle = '#2a2a3a';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x, y + 8);
      ctx.stroke();
      
      const bulbX = x, bulbY = y + 14;
      
      if (isOn) {
        // glow
        const glow = ctx.createRadialGradient(bulbX, bulbY, 2, bulbX, bulbY, 32);
        glow.addColorStop(0, 'rgba(255,220,120,0.85)');
        glow.addColorStop(0.4, 'rgba(255,180,80,0.4)');
        glow.addColorStop(1, 'rgba(255,140,60,0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(bulbX, bulbY, 32, 0, Math.PI * 2);
        ctx.fill();
        // bulb body
        ctx.fillStyle = '#ffdd88';
        ctx.beginPath();
        ctx.arc(bulbX, bulbY, 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffeedd';
        ctx.beginPath();
        ctx.arc(bulbX - 2, bulbY - 2, 3, 0, Math.PI * 2);
        ctx.fill();
        // socket
        ctx.fillStyle = '#55555a';
        ctx.fillRect(bulbX - 3, bulbY - 12, 6, 5);
      } else {
        // off bulb
        ctx.fillStyle = '#3a3a3a';
        ctx.beginPath();
        ctx.arc(bulbX, bulbY, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#4a4a4a';
        ctx.fillRect(bulbX - 2.5, bulbY - 11, 5, 4);
      }
    }
    ctx.restore();
    return offCount / numLights;
  }

  function drawMainCharacter(t, cx, cy) {
    // cy = feet position
    const appearT = smoothstep(1, 3, t);
    const charX = lerp(1250, cx, appearT);
    const charY = cy;
    
    // Arm raising animation
    let armProgress = 0;
    if (t >= 5 && t < 9) armProgress = smoothstep(5, 9, t);
    else if (t >= 9) armProgress = 1;
    // slight lowering at the end
    if (t > 12) {
      armProgress = 1 - 0.3 * smoothstep(12, 14.8, t);
    }
    const armAngle = Math.PI / 2 - armProgress * Math.PI; // PI/2=down, -PI/2=up
    
    ctx.save();
    ctx.translate(charX, charY);
    
    // Scale factor for character
    const s = 1;
    ctx.scale(s, s);
    
    // --- Legs ---
    // Left leg
    ctx.fillStyle = '#3d2a1c';
    ctx.fillRect(-22, -50, 16, 30);
    ctx.fillStyle = '#e8e8e0';
    ctx.fillRect(-22, -28, 16, 18);
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(-24, -14, 20, 14);
    // Right leg
    ctx.fillRect(6, -50, 16, 30);
    ctx.fillStyle = '#e8e8e0';
    ctx.fillRect(6, -28, 16, 18);
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(4, -14, 20, 14);
    
    // --- Lederhosen (brown shorts) ---
    ctx.fillStyle = '#5a3a20';
    ctx.fillRect(-28, -105, 56, 60);
    // leather texture
    ctx.fillStyle = 'rgba(40,25,10,0.3)';
    ctx.fillRect(-25, -100, 50, 50);
    // suspenders
    ctx.fillStyle = '#4a2d15';
    ctx.fillRect(-18, -130, 8, 30);
    ctx.fillRect(10, -130, 8, 30);
    // buttons on suspenders
    ctx.fillStyle = '#c0a060';
    ctx.beginPath(); ctx.arc(-14, -102, 3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(14, -102, 3, 0, Math.PI*2); ctx.fill();
    
    // --- Checkered shirt ---
    const shirtY = -170;
    ctx.fillStyle = '#f0f0f0';
    ctx.fillRect(-30, shirtY, 60, 70);
    // checkered pattern
    ctx.fillStyle = '#cc3030';
    for (let i = 0; i < 5; i++) {
      const sy = shirtY + 5 + i * 14;
      ctx.fillRect(-30, sy, 60, 3);
    }
    for (let i = 0; i < 4; i++) {
      const sx = -30 + i * 17;
      ctx.fillRect(sx, shirtY, 3, 70);
    }
    
    // --- Head ---
    const headCenterX = 0, headCenterY = -205;
    const headR = 38;
    ctx.fillStyle = '#d4a87a';
    ctx.beginPath();
    ctx.arc(headCenterX, headCenterY, headR, 0, Math.PI * 2);
    ctx.fill();
    // rosy cheeks
    ctx.fillStyle = 'rgba(220,100,80,0.45)';
    ctx.beginPath(); ctx.arc(headCenterX - 18, headCenterY + 8, 10, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(headCenterX + 18, headCenterY + 8, 10, 0, Math.PI*2); ctx.fill();
    // eyes
    ctx.fillStyle = '#2a1a1a';
    ctx.beginPath(); ctx.arc(headCenterX - 14, headCenterY - 5, 5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(headCenterX + 14, headCenterY - 5, 5, 0, Math.PI*2); ctx.fill();
    // eye highlights
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(headCenterX - 12, headCenterY - 7, 2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(headCenterX + 16, headCenterY - 7, 2, 0, Math.PI*2); ctx.fill();
    // mustache
    ctx.fillStyle = '#6a4a2a';
    ctx.beginPath();
    ctx.moveTo(headCenterX - 15, headCenterY + 18);
    ctx.quadraticCurveTo(headCenterX, headCenterY + 12, headCenterX + 15, headCenterY + 18);
    ctx.quadraticCurveTo(headCenterX + 5, headCenterY + 22, headCenterX - 5, headCenterY + 22);
    ctx.quadraticCurveTo(headCenterX - 15, headCenterY + 20, headCenterX - 15, headCenterY + 18);
    ctx.fill();
    // mouth (smile that changes with time)
    const smileSize = armProgress > 0.5 ? 12 + 6 * armProgress : 4;
    ctx.strokeStyle = '#3a2010';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    if (armProgress > 0.3) {
      ctx.arc(headCenterX, headCenterY + 12, smileSize, 0.15 * Math.PI, 0.85 * Math.PI);
    } else {
      ctx.arc(headCenterX, headCenterY + 16, 6, 0.2 * Math.PI, 0.8 * Math.PI);
    }
    ctx.stroke();
    
    // --- Hat ---
    ctx.fillStyle = '#2a5a30';
    ctx.beginPath();
    ctx.moveTo(headCenterX - 40, headCenterY - 30);
    ctx.lineTo(headCenterX + 40, headCenterY - 30);
    ctx.lineTo(headCenterX + 28, headCenterY - 55);
    ctx.lineTo(headCenterX - 28, headCenterY - 55);
    ctx.closePath();
    ctx.fill();
    // hat brim
    ctx.fillStyle = '#1e4022';
    ctx.fillRect(headCenterX - 45, headCenterY - 34, 90, 8);
    // feather
    ctx.fillStyle = '#a0c040';
    ctx.beginPath();
    ctx.moveTo(headCenterX + 20, headCenterY - 50);
    ctx.quadraticCurveTo(headCenterX + 45, headCenterY - 65, headCenterX + 50, headCenterY - 90);
    ctx.quadraticCurveTo(headCenterX + 38, headCenterY - 70, headCenterX + 25, headCenterY - 55);
    ctx.fill();
    
    // --- Left arm (hanging at side) ---
    ctx.save();
    ctx.translate(-28, -155);
    ctx.fillStyle = '#f0f0f0';
    ctx.fillRect(-4, 0, 10, 45);
    ctx.fillStyle = '#cc3030';
    ctx.fillRect(-4, 5, 10, 3);
    ctx.fillRect(-4, 20, 10, 3);
    ctx.fillRect(-4, 35, 10, 3);
    // hand
    ctx.fillStyle = '#d4a87a';
    ctx.beginPath(); ctx.arc(2, 50, 6, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    
    // --- Right arm (raised, animated) ---
    ctx.save();
    ctx.translate(28, -155);
    ctx.rotate(armAngle);
    
    // Upper arm
    ctx.fillStyle = '#f0f0f0';
    ctx.fillRect(-4, 0, 10, 42);
    // Checkered pattern on arm
    ctx.fillStyle = '#cc3030';
    ctx.fillRect(-4, 5, 10, 3);
    ctx.fillRect(-4, 20, 10, 3);
    ctx.fillRect(-4, 35, 10, 3);
    
    // Forearm
    ctx.fillStyle = '#f0f0f0';
    ctx.fillRect(-3, 42, 8, 35);
    ctx.fillStyle = '#cc3030';
    ctx.fillRect(-3, 47, 8, 3);
    ctx.fillRect(-3, 60, 8, 3);
    // Hand
    ctx.fillStyle = '#d4a87a';
    ctx.beginPath();
    ctx.arc(2, 80, 7, 0, Math.PI * 2);
    ctx.fill();
    
    // --- Beer Mug (held by hand at end of arm) ---
    // mug body (drawn in local arm space, so "up" from hand is negative y when arm raised)
    ctx.fillStyle = '#a08a55';
    ctx.fillRect(-8, 82, 16, 20);
    // mug handle
    ctx.strokeStyle = '#8a7545';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(10, 91, 6, -0.5, 0.5);
    ctx.stroke();
    // foam
    ctx.fillStyle = '#e8d8b0';
    ctx.fillRect(-9, 77, 18, 6);
    ctx.fillStyle = '#f5ead0';
    ctx.beginPath(); ctx.arc(1, 77, 8, Math.PI, 0); ctx.fill();
    ctx.restore();
    
    ctx.restore(); // end character transform
  }

  function drawProstText(t) {
    if (t < 8.8) return;
    let alpha = 0;
    let scale = 1;
    if (t >= 8.8 && t < 10) {
      const tt = smoothstep(8.8, 10, t);
      alpha = tt;
      scale = 0.6 + 0.4 * easeInOut(tt);
    } else if (t >= 10 && t < 12.5) {
      alpha = 1 + 0.05 * Math.sin((t - 10) * 6);
      scale = 1;
    } else if (t >= 12.5 && t < 14.5) {
      alpha = 1 - smoothstep(12.5, 14.5, t) * 0.8;
      scale = 1 + 0.02 * (t - 12.5);
    } else {
      alpha = 0.2;
      scale = 1.02;
    }
    
    ctx.save();
    ctx.globalAlpha = clamp(alpha, 0, 1);
    ctx.translate(640, 180);
    ctx.scale(scale, scale);
    // text glow
    const glow = ctx.createRadialGradient(0, 0, 10, 0, 0, 180);
    glow.addColorStop(0, 'rgba(255,200,80,0.4)');
    glow.addColorStop(0.6, 'rgba(255,160,50,0.15)');
    glow.addColorStop(1, 'rgba(255,120,30,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(0, 0, 180, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.font = 'bold 110px Georgia, "Times New Roman", serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillText('Prost!', 4, 6);
    // main text
    const txtGrad = ctx.createLinearGradient(0, -60, 0, 60);
    txtGrad.addColorStop(0, '#ffdd88');
    txtGrad.addColorStop(0.5, '#e8a040');
    txtGrad.addColorStop(1, '#c87a20');
    ctx.fillStyle = txtGrad;
    ctx.fillText('Prost!', 0, 0);
    // subtle outline
    ctx.strokeStyle = 'rgba(120,60,10,0.5)';
    ctx.lineWidth = 2;
    ctx.strokeText('Prost!', 0, 0);
    ctx.restore();
  }

  function drawConfetti(t) {
    if (t < 9.5 || t > 13) return;
    const particleCount = 80;
    ctx.save();
    for (let i = 0; i < particleCount; i++) {
      const seed = i * 7.3;
      const pT = (t - 9.5 + (seed % 13) / 13) % 3.5;
      if (pT < 0 || pT > 3) continue;
      const px = ((i * 127.7 + 40) % W);
      const py = 200 + pT * 130 + Math.sin(pT * 3 + i) * 30;
      const size = 3 + (i % 4);
      const colors = ['#dd3344', '#eedd66', '#33aa55', '#4499dd', '#ee8833', '#aa44cc'];
      ctx.fillStyle = colors[i % colors.length];
      ctx.globalAlpha = 0.7 * (1 - pT / 3.5);
      ctx.fillRect(px, py, size, size * 0.7);
      ctx.globalAlpha = 0.7 * (1 - pT / 3.5) * 0.6;
      ctx.fillRect(px + 3, py - 5 - Math.sin(pT * 4 + i) * 20, size * 0.6, size * 0.5);
    }
    ctx.restore();
  }

  function drawDarkOverlay(t, lightsOutFrac) {
    // calculate overlay darkness based on lights going out
    let darkAlpha = lightsOutFrac * 0.75;
    // final fade to black
    if (t > 14.3) {
      darkAlpha = Math.max(darkAlpha, smoothstep(14.3, 15, t) * 0.9);
    }
    if (t < 0.3) {
      darkAlpha = Math.max(darkAlpha, 1 - smoothstep(0, 0.3, t));
    }
    if (darkAlpha > 0.01) {
      ctx.fillStyle = `rgba(0,0,0,${clamp(darkAlpha, 0, 0.95)})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  function drawSign(t) {
    ctx.save();
    // small sign at right edge
    const sx = 1150, sy = 380;
    ctx.fillStyle = '#4a3020';
    ctx.fillRect(sx - 5, sy - 5, 10, 55);
    ctx.fillStyle = '#6a4a2a';
    ctx.fillRect(sx - 30, sy - 15, 60, 35);
    ctx.fillStyle = '#2a1a10';
    ctx.fillRect(sx - 26, sy - 11, 52, 27);
    ctx.font = 'bold 13px Georgia, serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#e0d0b0';
    ctx.fillText('LETZTER', sx, sy - 2);
    ctx.fillText('TAG', sx, sy + 12);
    ctx.restore();
  }

  function draw(t) {
    ctx.clearRect(0, 0, W, H);
    
    // Background layers
    drawSky(t);
    drawFerrisWheel(t);
    drawTents(t);
    drawGround(t);
    drawSign(t);
    drawTables(t);
    drawBgCharacters(t);
    
    // Main character
    drawMainCharacter(t, 560, 500);
    
    // Confetti
    drawConfetti(t);
    
    // Prost text
    drawProstText(t);
    
    // String lights (drawn on top) and get fraction of lights out
    const lightsOutFrac = drawStringLights(t);
    
    // Dark overlay for lights going out
    drawDarkOverlay(t, lightsOutFrac);
    
    // Subtle vignette
    const vignette = ctx.createRadialGradient(640, 360, 250, 640, 360, 700);
    vignette.addColorStop(0, 'rgba(0,0,0,0)');
    vignette.addColorStop(1, 'rgba(0,0,0,0.35)');
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, W, H);
  }

  function loop() {
    const t = getTime();
    draw(t);
    requestAnimationFrame(loop);
  }

  loop();
})();
</script>
</body>
</html>
