<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Type 1 Diabetes: The Broken Message</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; font-family: Arial, Helvetica, sans-serif; }
  #stage { position: relative; width: 1280px; height: 720px; transform-origin: center center; flex-shrink: 0; }
  #c { position: absolute; top: 0; left: 0; width: 1280px; height: 720px; display: block; }
  #ui { position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 14px; z-index: 10; user-select: none; -webkit-user-select: none; }
  #ui .label { color: #cce; font-size: 13px; font-weight: bold; letter-spacing: 1.5px; text-shadow: 0 1px 4px rgba(0,0,0,0.7); }
  #ui .label.intact { color: #8cf; }
  #ui .label.broken { color: #f88; }
  #slider { -webkit-appearance: none; appearance: none; width: 220px; height: 6px; border-radius: 3px; background: linear-gradient(90deg, #4af, #f84); outline: none; cursor: pointer; box-shadow: 0 0 12px rgba(100,150,255,0.3); }
  #slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff, #ccd); border: 2px solid #668; cursor: pointer; box-shadow: 0 0 16px rgba(255,255,255,0.5); }
  #slider::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff, #ccd); border: 2px solid #668; cursor: pointer; box-shadow: 0 0 16px rgba(255,255,255,0.5); }
  .scene-dots { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 10; }
  .scene-dot { width: 10px; height: 10px; border-radius: 50%; background: #334; transition: background 0.3s, box-shadow 0.3s; box-shadow: 0 0 4px rgba(0,0,0,0.5); }
  .scene-dot.active { background: #adf; box-shadow: 0 0 12px #adf; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="1280" height="720"></canvas>
  <div class="scene-dots" id="dots">
    <div class="scene-dot active"></div><div class="scene-dot"></div><div class="scene-dot"></div><div class="scene-dot"></div><div class="scene-dot"></div>
  </div>
  <div id="ui">
    <span class="label intact">◀ INTACT</span>
    <input type="range" id="slider" min="0" max="1" step="0.005" value="0.25">
    <span class="label broken">BROKEN ▶</span>
  </div>
</div>
<script>
window.DUR = 35;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const slider = document.getElementById('slider');
const stage = document.getElementById('stage');
const dots = document.querySelectorAll('.scene-dot');
let broken = 0.25;
let userInteracted = false;
let autoBroken = 0;
const urlParams = new URLSearchParams(location.search);
let timeOffset = parseFloat(urlParams.get('t')) || 0;
let startTime = performance.now() - timeOffset * 1000;

function resize() {
  const s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
  stage.style.transform = 'scale(' + s + ')';
}
window.addEventListener('resize', resize);
resize();

slider.addEventListener('input', () => { broken = parseFloat(slider.value); userInteracted = true; });
slider.addEventListener('pointerdown', () => { userInteracted = true; });
slider.addEventListener('pointerup', () => { setTimeout(() => { userInteracted = false; }, 5000); });

function hexPath(c, x, y, r) {
  c.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = Math.PI / 3 * i - Math.PI / 6;
    i === 0 ? c.moveTo(x + r * Math.cos(a), y + r * Math.sin(a)) : c.lineTo(x + r * Math.cos(a), y + r * Math.sin(a));
  }
  c.closePath();
}

function drawGlucose(x, y, r, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.shadowColor = '#fc4';
  ctx.shadowBlur = r * 0.6;
  ctx.fillStyle = '#fcaa44';
  hexPath(ctx, x, y, r);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = '#e88922';
  ctx.lineWidth = Math.max(1, r * 0.12);
  ctx.stroke();
  ctx.fillStyle = '#8b5a20';
  const s = r * 0.35;
  ctx.font = `${s}px Arial`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#5a3500';
  ctx.fillText('G', x, y + 1);
  ctx.restore();
}

function drawInsulin(x, y, r, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.shadowColor = '#6cf';
  ctx.shadowBlur = r * 0.7;
  ctx.fillStyle = '#55ccff';
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = '#2a9ad0';
  ctx.lineWidth = Math.max(1, r * 0.15);
  ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.font = `${r * 0.9}px Arial`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('I', x, y + 1);
  ctx.restore();
}

function drawBody(time, brk) {
  const cx = 640, cy = 360;
  ctx.save();
  ctx.fillStyle = 'rgba(10,10,26,0)';
  // background particles
  for (let i = 0; i < 40; i++) {
    const px = ((i * 137 + 50) % 1280);
    const py = ((i * 211 + 200 + Math.sin(time * 0.3 + i) * 30) % 720);
    const pr = 1 + (i % 3);
    ctx.fillStyle = `rgba(100,150,220,${0.15 + 0.08 * Math.sin(time * 1.2 + i * 2)})`;
    ctx.beginPath();
    ctx.arc(px, py, pr, 0, Math.PI * 2);
    ctx.fill();
  }
  // body silhouette
  ctx.shadowColor = 'rgba(150,200,255,0.5)';
  ctx.shadowBlur = 30;
  ctx.strokeStyle = 'rgba(180,210,240,0.7)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(640, 52);
  ctx.bezierCurveTo(585, 48, 570, 85, 570, 112);
  ctx.bezierCurveTo(570, 150, 610, 165, 640, 165);
  ctx.bezierCurveTo(670, 165, 710, 150, 710, 112);
  ctx.bezierCurveTo(710, 85, 695, 48, 640, 52);
  ctx.closePath();
  ctx.fillStyle = 'rgba(30,40,60,0.25)';
  ctx.fill();
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(640, 165);
  ctx.bezierCurveTo(600, 175, 560, 220, 550, 260);
  ctx.bezierCurveTo(542, 300, 548, 330, 555, 350);
  ctx.bezierCurveTo(540, 370, 530, 400, 525, 435);
  ctx.bezierCurveTo(520, 470, 530, 510, 545, 565);
  ctx.bezierCurveTo(558, 610, 575, 650, 595, 685);
  ctx.lineTo(620, 685);
  ctx.bezierCurveTo(605, 650, 592, 610, 580, 565);
  ctx.bezierCurveTo(568, 515, 565, 470, 570, 435);
  ctx.bezierCurveTo(575, 405, 590, 375, 540, 360);
  ctx.bezierCurveTo(520, 350, 508, 340, 505, 320);
  ctx.bezierCurveTo(502, 295, 525, 255, 560, 238);
  ctx.bezierCurveTo(590, 225, 610, 195, 640, 165);
  ctx.closePath();
  ctx.fillStyle = 'rgba(35,45,65,0.35)';
  ctx.fill();
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(640, 165);
  ctx.bezierCurveTo(680, 175, 720, 220, 730, 260);
  ctx.bezierCurveTo(738, 300, 732, 330, 725, 350);
  ctx.bezierCurveTo(740, 370, 750, 400, 755, 435);
  ctx.bezierCurveTo(760, 470, 750, 510, 735, 565);
  ctx.bezierCurveTo(722, 610, 705, 650, 685, 685);
  ctx.lineTo(660, 685);
  ctx.bezierCurveTo(675, 650, 688, 610, 700, 565);
  ctx.bezierCurveTo(712, 515, 715, 470, 710, 435);
  ctx.bezierCurveTo(705, 405, 690, 375, 740, 360);
  ctx.bezierCurveTo(760, 350, 772, 340, 775, 320);
  ctx.bezierCurveTo(778, 295, 755, 255, 720, 238);
  ctx.bezierCurveTo(690, 225, 670, 195, 640, 165);
  ctx.closePath();
  ctx.fillStyle = 'rgba(35,45,65,0.35)';
  ctx.fill();
  ctx.stroke();
  // arms
  ctx.beginPath();
  ctx.moveTo(550, 240);
  ctx.bezierCurveTo(500, 270, 470, 310, 455, 350);
  ctx.bezierCurveTo(445, 385, 448, 410, 455, 425);
  ctx.lineTo(480, 420);
  ctx.bezierCurveTo(475, 405, 472, 385, 480, 360);
  ctx.bezierCurveTo(490, 325, 515, 290, 555, 262);
  ctx.closePath();
  ctx.fillStyle = 'rgba(35,45,65,0.3)';
  ctx.fill();
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(730, 240);
  ctx.bezierCurveTo(780, 270, 810, 310, 825, 350);
  ctx.bezierCurveTo(835, 385, 832, 410, 825, 425);
  ctx.lineTo(800, 420);
  ctx.bezierCurveTo(805, 405, 808, 385, 800, 360);
  ctx.bezierCurveTo(790, 325, 765, 290, 725, 262);
  ctx.closePath();
  ctx.fillStyle = 'rgba(35,45,65,0.3)';
  ctx.fill();
  ctx.stroke();
  // legs
  ctx.beginPath();
  ctx.moveTo(595, 680);
  ctx.bezierCurveTo(585, 640, 590, 585, 600, 540);
  ctx.bezierCurveTo(610, 500, 625, 470, 640, 455);
  ctx.bezierCurveTo(655, 470, 670, 500, 680, 540);
  ctx.bezierCurveTo(690, 585, 695, 640, 685, 680);
  ctx.closePath();
  ctx.fillStyle = 'rgba(35,45,65,0.30)';
  ctx.fill();
  ctx.stroke();
  ctx.shadowBlur = 0;
  // heart
  const hx = 595, hy = 255;
  ctx.fillStyle = 'rgba(220,60,60,0.55)';
  ctx.beginPath();
  ctx.moveTo(hx, hy - 12);
  ctx.bezierCurveTo(hx - 18, hy - 25, hx - 28, hy - 5, hx, hy + 12);
  ctx.bezierCurveTo(hx + 28, hy - 5, hx + 18, hy - 25, hx, hy - 12);
  ctx.fill();
  // lungs
  ctx.fillStyle = 'rgba(220,150,150,0.35)';
  ctx.beginPath();
  ctx.ellipse(580, 245, 32, 48, 0.1, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(700, 245, 32, 48, -0.1, 0, Math.PI * 2);
  ctx.fill();
  // liver
  ctx.fillStyle = 'rgba(170,110,60,0.45)';
  ctx.beginPath();
  ctx.ellipse(705, 315, 38, 30, -0.3, 0, Math.PI * 2);
  ctx.fill();
  // stomach
  ctx.fillStyle = 'rgba(190,160,80,0.35)';
  ctx.beginPath();
  ctx.ellipse(590, 318, 28, 40, 0.2, 0, Math.PI * 2);
  ctx.fill();
  // pancreas (highlighted)
  const px = 640, py = 330;
  const glow = 0.4 + 0.6 * (1 - brk) + 0.25 * Math.sin(time * 1.5);
  ctx.shadowColor = '#fa0';
  ctx.shadowBlur = 25 * glow;
  ctx.fillStyle = `rgba(255,140,60,${0.6 + 0.3 * glow})`;
  ctx.beginPath();
  ctx.ellipse(px, py, 34, 18, 0.15, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(255,200,100,0.5)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,220,160,0.25)';
  ctx.beginPath();
  ctx.ellipse(px - 5, py - 3, 12, 7, -0.1, 0, Math.PI * 2);
  ctx.fill();
  // blood vessels
  ctx.strokeStyle = 'rgba(200,60,60,0.45)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(hx, hy + 8);
  ctx.bezierCurveTo(560, 270, 540, 300, 545, 355);
  ctx.bezierCurveTo(548, 400, 555, 450, 548, 520);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(hx, hy + 8);
  ctx.bezierCurveTo(630, 275, 620, 310, 625, 350);
  ctx.bezierCurveTo(632, 400, 640, 440, 638, 500);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(hx, hy + 6);
  ctx.bezierCurveTo(650, 268, 662, 295, 660, 330);
  ctx.bezierCurveTo(658, 380, 665, 430, 660, 490);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(150,80,180,0.35)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(hx + 5, hy);
  ctx.bezierCurveTo(620, 262, 625, 250, 640, 248);
  ctx.stroke();
  // glucose in blood
  const gCount = 10;
  for (let i = 0; i < gCount; i++) {
    const t = (time * 0.4 + i / gCount) % 1;
    const gx = 530 + Math.sin(t * Math.PI * 2) * 30;
    const gy = 260 + t * 260;
    drawGlucose(gx, gy, 5, 0.7 * (1 - brk * 0.5));
  }
  for (let i = 0; i < 6; i++) {
    const t = (time * 0.5 + i / 6) % 1;
    const gx2 = 650 + Math.cos(t * Math.PI * 2) * 35;
    const gy2 = 260 + t * 250;
    drawGlucose(gx2, gy2, 4, 0.65);
  }
  // insulin particles (visible when intact)
  const insCount = Math.floor(8 * (1 - brk));
  for (let i = 0; i < insCount; i++) {
    const t = (time * 0.35 + i / Math.max(insCount, 1)) % 1;
    const ix = 640 + Math.sin(t * Math.PI * 2) * 20;
    const iy = 250 + t * 280;
    drawInsulin(ix, iy, 4, 0.6);
  }
  ctx.restore();
}

function drawPancreas(time, brk) {
  const cx = 640, cy = 360;
  ctx.save();
  ctx.fillStyle = 'rgba(30,20,15,0.15)';
  ctx.fillRect(0, 0, 1280, 720);
  // tissue background
  ctx.fillStyle = 'rgba(255,180,130,0.08)';
  for (let i = 0; i < 80; i++) {
    const x = ((i * 173 + 30) % 1280);
    const y = ((i * 271 + 80) % 720);
    const r = 12 + (i % 7) * 4;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  // blood vessel
  ctx.strokeStyle = 'rgba(200,60,60,0.5)';
  ctx.lineWidth = 10;
  ctx.beginPath();
  ctx.moveTo(0, 180);
  ctx.bezierCurveTo(300, 160, 500, 220, 700, 190);
  ctx.bezierCurveTo(900, 160, 1100, 200, 1280, 170);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(200,60,60,0.3)';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(0, 185);
  ctx.bezierCurveTo(300, 165, 500, 225, 700, 195);
  ctx.bezierCurveTo(900, 165, 1100, 205, 1280, 175);
  ctx.stroke();
  // islets (clusters)
  const isletPositions = [[420, 260], [640, 300], [820, 250], [530, 380], [730, 380], [610, 200], [890, 330], [370, 320]];
  isletPositions.forEach((pos, idx) => {
    const ix = pos[0], iy = pos[1];
    const pulse = 0.9 + 0.1 * Math.sin(time * 2 + idx);
    const isletR = 42 * pulse;
    // alpha cells (periphery)
    for (let c = 0; c < 12; c++) {
      const a = c / 12 * Math.PI * 2;
      const cx2 = ix + Math.cos(a) * isletR * 0.75;
      const cy2 = iy + Math.sin(a) * isletR * 0.65;
      ctx.fillStyle = 'rgba(200,120,80,0.45)';
      ctx.beginPath();
      ctx.arc(cx2, cy2, 9, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(160,90,50,0.3)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
    // beta cells (center)
    const betaR = 14;
    for (let b = 0; b < 6; b++) {
      const a = b / 6 * Math.PI * 2 + 0.3;
      const bx = ix + Math.cos(a) * isletR * 0.35;
      const by = iy + Math.sin(a) * isletR * 0.3;
      const alive = 1 - brk * (0.5 + 0.3 * Math.sin(time * 1.7 + idx + b));
      ctx.fillStyle = `rgba(255,140,90,${0.35 + 0.4 * alive})`;
      ctx.beginPath();
      ctx.arc(bx, by, betaR, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(180,80,40,0.5)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      // nucleus
      ctx.fillStyle = 'rgba(140,60,40,0.5)';
      ctx.beginPath();
      ctx.arc(bx - 2, by - 1, 4, 0, Math.PI * 2);
      ctx.fill();
      // insulin granules
      const granCount = Math.floor(5 * alive);
      for (let g = 0; g < granCount; g++) {
        const ga = g / 5 * Math.PI * 2 + idx;
        const gx = bx + Math.cos(ga) * betaR * 0.45;
        const gy = by + Math.sin(ga) * betaR * 0.4;
        ctx.fillStyle = 'rgba(150,80,220,0.7)';
        ctx.beginPath();
        ctx.arc(gx, gy, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowColor = '#a5f';
        ctx.shadowBlur = 4;
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }
    // immune cells in broken state
    if (brk > 0.2) {
      const immCount = Math.floor(brk * 5);
      for (let ic = 0; ic < immCount; ic++) {
        const ia = time * 0.8 + ic * 2.1 + idx;
        const ir = isletR + 15 + 8 * Math.sin(time * 1.3 + ic + idx);
        const ix2 = ix + Math.cos(ia) * ir;
        const iy2 = iy + Math.sin(ia) * ir * 0.7;
        ctx.fillStyle = 'rgba(60,200,100,0.55)';
        ctx.beginPath();
        ctx.arc(ix2, iy2, 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(30,140,60,0.5)';
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }
    // halo
    ctx.shadowColor = 'rgba(255,180,100,0.5)';
    ctx.shadowBlur = 15 * (1 - brk * 0.7);
    ctx.strokeStyle = 'rgba(255,170,80,0.3)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(ix, iy, isletR + 4, 0, Math.PI * 2);
    ctx.stroke();
    ctx.shadowBlur = 0;
  });
  ctx.restore();
}

function drawMolecular(time, brk) {
  const cx = 640, cy = 360;
  ctx.save();
  ctx.fillStyle = 'rgba(8,10,20,0.2)';
  ctx.fillRect(0, 0, 1280, 720);
  // cell membrane (lipid bilayer)
  const membraneY = 380;
  // phospholipids top layer
  for (let i = 0; i < 55; i++) {
    const x = 20 + i * 23;
    const wobble = Math.sin(time * 2 + i * 0.4) * 3;
    const y = membraneY + wobble;
    ctx.fillStyle = 'rgba(210,180,120,0.65)';
    ctx.beginPath();
    ctx.arc(x, y, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(170,140,80,0.4)';
    ctx.lineWidth = 1;
    ctx.stroke();
    if (i % 3 === 0) {
      ctx.fillStyle = 'rgba(160,200,120,0.5)';
      ctx.beginPath();
      ctx.arc(x, y + 8, 3.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  // bottom layer
  for (let i = 0; i < 55; i++) {
    const x = 30 + i * 23;
    const wobble2 = Math.sin(time * 2 + i * 0.4 + 1) * 3;
    const y = membraneY + 14 + wobble2;
    ctx.fillStyle = 'rgba(190,160,100,0.55)';
    ctx.beginPath();
    ctx.arc(x, y, 6, 0, Math.PI * 2);
    ctx.fill();
  }
  // membrane line
  ctx.strokeStyle = 'rgba(220,190,130,0.5)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, membraneY + 7);
  for (let i = 0; i <= 60; i++) {
    const x = i * 21.3;
    const wob = Math.sin(time * 1.5 + i * 0.35) * 3;
    ctx.lineTo(x, membraneY + 7 + wob);
  }
  ctx.stroke();
  // insulin receptors
  const receptors = [[300, membraneY - 12], [480, membraneY - 10], [640, membraneY - 14], [800, membraneY - 8], [950, membraneY - 12], [1100, membraneY - 10]];
  receptors.forEach((pos, idx) => {
    const rx = pos[0], ry = pos[1];
    const activated = brk < 0.3 || Math.sin(time * 1.2 + idx) > 0.3 && brk < 0.7;
    const rColor = activated ? 'rgba(100,220,180,0.8)' : 'rgba(130,120,110,0.5)';
    ctx.fillStyle = rColor;
    // Y-shape
    ctx.beginPath();
    ctx.moveTo(rx, ry);
    ctx.lineTo(rx - 10, ry + 22);
    ctx.lineTo(rx - 18, ry + 28);
    ctx.lineTo(rx - 8, ry + 24);
    ctx.lineTo(rx, ry + 30);
    ctx.lineTo(rx + 8, ry + 24);
    ctx.lineTo(rx + 18, ry + 28);
    ctx.lineTo(rx + 10, ry + 22);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(60,140,100,0.4)';
    ctx.lineWidth = 1;
    ctx.stroke();
    if (activated && brk < 0.5) {
      // bound insulin
      drawInsulin(rx, ry - 16, 6, 0.85);
    }
  });
  // GLUT4 transporters inside cell (below membrane)
  const glutCount = 8;
  for (let i = 0; i < glutCount; i++) {
    const gx = 100 + i * 130 + Math.sin(time * 1.5 + i * 0.9) * 18;
    const gy = membraneY + 70 + Math.sin(time * 1.1 + i * 0.7) * 25;
    const active = brk < 0.35;
    const targetY = active ? membraneY + 22 : membraneY + 65;
    const currentY = gy + (targetY - gy) * Math.min(1, (1 - brk) * 2);
    ctx.fillStyle = active ? 'rgba(140,220,160,0.7)' : 'rgba(120,100,80,0.45)';
    ctx.fillRect(gx - 12, currentY - 7, 24, 14);
    ctx.strokeStyle = 'rgba(80,160,100,0.4)';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(gx - 12, currentY - 7, 24, 14);
    ctx.fillStyle = 'rgba(60,120,70,0.5)';
    ctx.fillRect(gx - 4, currentY - 3, 8, 6);
  }
  // glucose molecules above membrane
  const gCount = 14;
  for (let i = 0; i < gCount; i++) {
    const gx = 60 + ((i * 103 + 10) % 1160);
    const gy = 120 + Math.sin(time * 1.8 + i * 0.8) * 55;
    const entering = brk < 0.4 && gy > membraneY - 40;
    const alpha = entering ? 0.4 : 0.75;
    drawGlucose(gx, gy, 7, alpha);
    if (entering && brk < 0.25) {
      // arrow showing entry
      ctx.strokeStyle = 'rgba(100,200,150,0.5)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(gx, gy + 10);
      ctx.lineTo(gx, gy + 30);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(gx - 5, gy + 25);
      ctx.lineTo(gx, gy + 32);
      ctx.lineTo(gx + 5, gy + 25);
      ctx.stroke();
    }
  }
  // insulin in fluid for healthy
  if (brk < 0.35) {
    const insCount = Math.floor(10 * (1 - brk * 2.8));
    for (let i = 0; i < insCount; i++) {
      const ix = 80 + ((i * 157 + 40) % 1120);
      const iy = 80 + Math.sin(time * 2 + i * 0.6) * 45;
      drawInsulin(ix, iy, 5, 0.6);
    }
  }
  ctx.restore();
}

function drawTech(time, brk) {
  const cx = 640, cy = 360;
  ctx.save();
  ctx.fillStyle = 'rgba(10,15,30,0.15)';
  ctx.fillRect(0, 0, 1280, 720);
  const bgAlpha = 0.5;
  // skin patch (CGM)
  ctx.fillStyle = 'rgba(70,80,110,0.7)';
  ctx.fillRect(370, 230, 140, 100);
  const cornerR = 16;
  ctx.fillStyle = 'rgba(90,100,130,0.8)';
  ctx.beginPath();
  ctx.roundRect(370, 230, 140, 100, cornerR);
  ctx.fill();
  ctx.strokeStyle = 'rgba(140,160,200,0.6)';
  ctx.lineWidth = 2;
  ctx.stroke();
  // sensor needle
  ctx.strokeStyle = 'rgba(200,200,220,0.7)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(440, 228);
  ctx.lineTo(438, 180);
  ctx.stroke();
  // glucose reading display
  const glucoseVal = Math.round(280 - brk * 180 + Math.sin(time * 3) * 8);
  ctx.fillStyle = '#dfe';
  ctx.font = 'bold 28px Arial';
  ctx.textAlign = 'center';
  ctx.fillText(glucoseVal + ' mg/dL', 440, 280);
  ctx.font = '13px Arial';
  ctx.fillStyle = '#adf';
  ctx.fillText('CGM sensor', 440, 310);
  // green/red indicator
  ctx.fillStyle = glucoseVal < 180 ? 'rgba(100,220,100,0.7)' : glucoseVal > 250 ? 'rgba(255,100,100,0.7)' : 'rgba(255,220,100,0.7)';
  ctx.beginPath();
  ctx.arc(520, 270, 8, 0, Math.PI * 2);
  ctx.fill();
  // insulin pump
  ctx.fillStyle = 'rgba(60,70,100,0.75)';
  ctx.fillRect(740, 250, 90, 120);
  ctx.beginPath();
  ctx.roundRect(740, 250, 90, 120, 12);
  ctx.fill();
  ctx.strokeStyle = 'rgba(120,140,180,0.6)';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = '#bef';
  ctx.font = '20px Arial';
  ctx.fillText('Pump', 785, 310);
  // tubing
  ctx.strokeStyle = 'rgba(170,200,230,0.6)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(740, 320);
  ctx.bezierCurveTo(660, 360, 600, 320, 540, 350);
  ctx.stroke();
  // insulin droplet
  const dropT = (time * 0.6) % 1;
  const dropX = 740 - dropT * 200;
  const dropY = 325 + Math.sin(dropT * Math.PI) * 25;
  drawInsulin(dropX, dropY, 4, 0.6);
  // AID algorithm loop
  const aidX = 950, aidY = 280;
  ctx.strokeStyle = 'rgba(100,180,255,0.5)';
  ctx.lineWidth = 2;
  const aidPts = [[aidX, aidY - 50], [aidX - 45, aidY - 20], [aidX - 30, aidY + 25], [aidX + 30, aidY + 25], [aidX + 45, aidY - 20]];
  ctx.beginPath();
  ctx.moveTo(aidX, aidY - 50);
  for (let i = 0; i < aidPts.length; i++) {
    ctx.lineTo(aidPts[i][0], aidPts[i][1]);
  }
  ctx.closePath();
  ctx.stroke();
  ctx.fillStyle = '#adf';
  ctx.font = '12px Arial';
  ctx.fillText('AID', aidX, aidY - 60);
  const sensorReading = Math.sin(time * 2) * 0.3 + 0.5;
  const pumpAction = Math.max(0, Math.sin(time * 2 + 0.7)) * 0.4;
  ctx.fillStyle = `rgba(80,200,120,${0.4 + sensorReading * 0.4})`;
  ctx.beginPath();
  ctx.arc(aidX, aidY - 50, 8, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = `rgba(255,180,80,${0.3 + pumpAction * 0.5})`;
  ctx.beginPath();
  ctx.arc(aidX + 45, aidY - 22, 8, 0, Math.PI * 2);
  ctx.fill();
  // text
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 22px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('Technology helps. It does not cure.', cx, 120);
  ctx.fillStyle = '#adf';
  ctx.font = '16px Arial';
  ctx.fillText('CGM tracks glucose • Pump delivers insulin • AID adjusts automatically', cx, 155);
  ctx.fillStyle = '#cce';
  ctx.font = '14px Arial';
  ctx.fillText('Insulin therapy replaces a signal the body can no longer send.', cx, 520);
  ctx.fillText('Balancing: food • exercise • stress • timing change everything.', cx, 550);
  ctx.restore();
}

function drawCompare(time, brk) {
  const cx = 640, cy = 360;
  ctx.save();
  ctx.fillStyle = 'rgba(10,8,20,0.15)';
  ctx.fillRect(0, 0, 1280, 720);
  // three panels
  const panels = [
    { label: 'Healthy', x: 100, color: 'rgba(100,220,160,0.85)', curve: (t) => 90 + 55 * Math.exp(-Math.pow((t - 0.3) * 3, 2)), desc: 'Glucose returns to normal' },
    { label: 'Type 1', x: 480, color: 'rgba(255,130,100,0.85)', curve: (t) => 90 + 200 * (1 - Math.exp(-t * 2.2)), desc: 'Glucose rises and stays high' },
    { label: 'T1D + Insulin', x: 860, color: 'rgba(120,180,255,0.85)', curve: (t) => 90 + 90 * Math.exp(-Math.pow((t - 0.25) * 2, 2)) + 30 * Math.sin(t * 4) * Math.exp(-t * 1.5), desc: 'Controlled but variable' }
  ];
  panels.forEach((panel, idx) => {
    const px = panel.x, py = 300, pw = 300, ph = 190;
    ctx.strokeStyle = panel.color;
    ctx.lineWidth = 2;
    ctx.fillStyle = 'rgba(20,18,35,0.7)';
    ctx.beginPath();
    ctx.roundRect(px - pw / 2, py - ph / 2, pw, ph, 16);
    ctx.fill();
    ctx.stroke();
    // graph
    const graphX = px - pw / 2 + 25;
    const graphY = py - ph / 2 + 15;
    const graphW = pw - 50;
    const graphH = ph - 40;
    ctx.strokeStyle = 'rgba(100,100,120,0.35)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= 4; i++) {
      const ly = graphY + graphH * i / 4;
      ctx.beginPath();
      ctx.moveTo(graphX, ly);
      ctx.lineTo(graphX + graphW, ly);
      ctx.stroke();
    }
    // glucose curve
    ctx.strokeStyle = panel.color;
    ctx.lineWidth = 3;
    ctx.beginPath();
    for (let i = 0; i <= 80; i++) {
      const t = i / 80;
      const gx = graphX + t * graphW;
      const gVal = panel.curve(t);
      const gy = graphY + graphH * (1 - Math.min(1, Math.max(0, (gVal - 50) / 250)));
      i === 0 ? ctx.moveTo(gx, gy) : ctx.lineTo(gx, gy);
    }
    ctx.stroke();
    // threshold line
    ctx.strokeStyle = 'rgba(255,255,180,0.25)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(graphX, graphY + graphH * 0.55);
    ctx.lineTo(graphX + graphW, graphY + graphH * 0.55);
    ctx.stroke();
    ctx.setLineDash([]);
    // label
    ctx.fillStyle = panel.color;
    ctx.font = 'bold 16px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(panel.label, px, py - ph / 2 + 8);
    ctx.fillStyle = '#cce';
    ctx.font = '12px Arial';
    ctx.fillText(panel.desc, px, py + ph / 2 + 20);
    // meal marker
    ctx.fillStyle = 'rgba(255,220,100,0.7)';
    ctx.beginPath();
    ctx.arc(graphX + graphW * 0.15, graphY + graphH * 0.6, 5, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 28px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('Same meal. Different systems.', cx, 90);
  ctx.fillStyle = '#adf';
  ctx.font = '17px Arial';
  ctx.fillText('Type 1 diabetes changes the system. It doesn\'t define the person.', cx, 145);
  ctx.fillStyle = '#cce';
  ctx.font = '13px Arial';
  ctx.fillText('Educational visualization • Not medical advice', cx, 620);
  // ketones warning
  if (brk > 0.6) {
    ctx.fillStyle = 'rgba(255,80,40,0.8)';
    ctx.font = 'bold 14px Arial';
    ctx.fillText('⚠ DKA risk: ketone buildup from rapid fat breakdown', cx, 580);
  }
  ctx.restore();
}

function drawSceneText(sceneIdx, time, brk) {
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  const fadeIn = Math.min(1, time * 3);
  const fadeOut = Math.min(1, (8 - time) * 3);
  const alpha = Math.max(0, Math.min(fadeIn, fadeOut));
  ctx.globalAlpha = alpha;
  switch (sceneIdx) {
    case 0:
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 42px Arial';
      ctx.fillText('Type 1 Diabetes', 640, 28);
      ctx.fillStyle = '#adf';
      ctx.font = '20px Arial';
      ctx.fillText('The Broken Message', 640, 80);
      ctx.fillStyle = '#cce';
      ctx.font = '15px Arial';
      ctx.fillText('Autoimmune — not caused by sugar, weight, or lifestyle', 640, 120);
      ctx.fillStyle = `${brk > 0.5 ? 'rgba(255,150,100,0.8)' : 'rgba(150,200,255,0.6)'}`;
      ctx.font = '14px Arial';
      ctx.fillText(brk > 0.5 ? '⚠ Beta cells under attack — insulin signal fading' : 'Pancreas producing insulin normally', 640, 590);
      break;
    case 1:
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 30px Arial';
      ctx.fillText('Inside the Pancreas: Islets', 640, 28);
      ctx.fillStyle = '#cce';
      ctx.font = '16px Arial';
      ctx.fillText('Tiny clusters — 1–2% of the pancreas — where insulin is made', 640, 72);
      ctx.fillStyle = brk < 0.4 ? 'rgba(150,220,180,0.8)' : 'rgba(255,150,130,0.8)';
      ctx.font = '15px Arial';
      ctx.fillText(brk < 0.4 ? 'Beta cells healthy • insulin granules ready' : 'Immune cells infiltrating • beta cells dying', 640, 590);
      break;
    case 2:
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 28px Arial';
      ctx.fillText('Molecular Level: The Missing Signal', 640, 28);
      ctx.fillStyle = '#adf';
      ctx.font = '16px Arial';
      ctx.fillText('Insulin is the key • Without it, glucose cannot enter cells', 640, 70);
      ctx.fillStyle = brk < 0.4 ? 'rgba(160,220,200,0.8)' : 'rgba(255,180,150,0.8)';
      ctx.font = '15px Arial';
      ctx.fillText(brk < 0.4 ? 'Insulin binds → GLUT4 moves → glucose in' : 'No insulin → GLUT4 inactive → glucose out', 640, 590);
      break;
    case 3:
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 28px Arial';
      ctx.fillText('Technology: CGM + Pump + AID', 640, 28);
      ctx.fillStyle = '#cce';
      ctx.font = '15px Arial';
      ctx.fillText('Sensing glucose every few minutes • adjusting insulin automatically', 640, 70);
      break;
    case 4:
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 30px Arial';
      ctx.fillText('Comparison', 640, 28);
      break;
  }
  ctx.restore();
}

let lastScene = 0;

function getScene(t) {
  const scenes = [0, 8, 16, 24, 30, 35];
  for (let i = 0; i < scenes.length - 1; i++) {
    if (t >= scenes[i] && t < scenes[i + 1]) return i;
  }
  return 4;
}

function render(now) {
  const elapsed = (now - startTime) / 1000;
  const loopTime = ((elapsed % window.DUR) + window.DUR) % window.DUR;
  const sceneIdx = getScene(loopTime);
  const scenes = [0, 8, 16, 24, 30, 35];
  const sceneStart = scenes[sceneIdx];
  const sceneTime = loopTime - sceneStart;
  // auto slider
  if (!userInteracted) {
    if (loopTime < 7) broken = 0.05 + loopTime / 7 * 0.15;
    else if (loopTime < 15) broken = 0.2 + (loopTime - 7) / 8 * 0.4;
    else if (loopTime < 23) broken = 0.6 + (loopTime - 15) / 8 * 0.3;
    else if (loopTime < 30) broken = 0.9 + (loopTime - 23) / 7 * 0.07;
    else broken = 0.95;
    slider.value = broken;
  } else {
    broken = parseFloat(slider.value);
  }
  // update dots
  dots.forEach((dot, i) => {
    dot.classList.toggle('active', i === sceneIdx);
  });
  // clear
  ctx.clearRect(0, 0, 1280, 720);
  // draw background gradient
  const bgrad = ctx.createRadialGradient(640, 360, 100, 640, 360, 800);
  bgrad.addColorStop(0, '#0c0c1e');
  bgrad.addColorStop(1, '#04040a');
  ctx.fillStyle = bgrad;
  ctx.fillRect(0, 0, 1280, 720);
  // crossfade between scenes
  const fadeDuration = 1.0;
  const nextIdx = (sceneIdx + 1) % 5;
  const isTransitioning = sceneTime > (scenes[sceneIdx + 1] - scenes[sceneIdx] - fadeDuration);
  let currentAlpha = 1;
  let nextAlpha = 0;
  if (isTransitioning) {
    const transitionProgress = (sceneTime - (scenes[sceneIdx + 1] - scenes[sceneIdx] - fadeDuration)) / fadeDuration;
    nextAlpha = Math.min(1, Math.max(0, transitionProgress));
    currentAlpha = 1 - nextAlpha;
  }
  // draw current scene
  ctx.save();
  ctx.globalAlpha = currentAlpha;
  switch (sceneIdx) {
    case 0: drawBody(sceneTime, broken); break;
    case 1: drawPancreas(sceneTime, broken); break;
    case 2: drawMolecular(sceneTime, broken); break;
    case 3: drawTech(sceneTime, broken); break;
    case 4: drawCompare(sceneTime, broken); break;
  }
  ctx.restore();
  // draw next scene during transition
  if (nextAlpha > 0) {
    const nextSceneTime = sceneTime + fadeDuration - (scenes[sceneIdx + 1] - scenes[sceneIdx]);
    ctx.save();
    ctx.globalAlpha = nextAlpha;
    switch (nextIdx) {
      case 0: drawBody(nextSceneTime, broken); break;
      case 1: drawPancreas(nextSceneTime, broken); break;
      case 2: drawMolecular(nextSceneTime, broken); break;
      case 3: drawTech(nextSceneTime, broken); break;
      case 4: drawCompare(nextSceneTime, broken); break;
    }
    ctx.restore();
  }
  // text overlay
  ctx.globalAlpha = currentAlpha;
  drawSceneText(sceneIdx, sceneTime, broken);
  ctx.globalAlpha = 1;
  // vignette
  const vig = ctx.createRadialGradient(640, 360, 300, 640, 360, 650);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.5)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, 1280, 720);
  requestAnimationFrame(render);
}

// polyfill roundRect
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    if (typeof r === 'number') r = [r, r, r, r];
    this.moveTo(x + r[0], y);
    this.lineTo(x + w - r[1], y);
    this.arcTo(x + w, y, x + w, y + r[1], r[1]);
    this.lineTo(x + w, y + h - r[2]);
    this.arcTo(x + w, y + h, x + w - r[2], y + h, r[2]);
    this.lineTo(x + r[3], y + h);
    this.arcTo(x, y + h, x, y + h - r[3], r[3]);
    this.lineTo(x, y + r[0]);
    this.arcTo(x, y, x + r[0], y, r[0]);
    this.closePath();
    return this;
  };
}

requestAnimationFrame(render);
</script>
