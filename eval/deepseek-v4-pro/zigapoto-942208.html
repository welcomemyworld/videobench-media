<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Agentic Analytics</title>
<style>
  body { margin:0; background:#000; display:flex; justify-content:center; align-items:center; height:100vh; overflow:hidden; }
  canvas { position:absolute; left:50%; top:50%; transform-origin:center; }
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 1280, H = 720;
const DUR = 32; // seconds

// Parse ?t=SECONDS
const urlParams = new URLSearchParams(window.location.search);
let t0 = parseFloat(urlParams.get('t')) || 0;
if (isNaN(t0)) t0 = 0;
t0 = t0 % DUR;

let startTime = performance.now() - t0 * 1000;

// Audio context and music synthesis
let audioCtx = null;
let noiseBuffer = null;
let audioStarted = false;
let audioStartTime = 0;
let nextScheduleTime = 0;
const stepDur = 0.125; // 16th note at 120 BPM
const totalSteps = 256; // 32 seconds of steps
const lookahead = 0.2;

function initAudio() {
  if (!audioCtx) {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch(e) { return; }
    // Create noise buffer for hi-hat
    noiseBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.1, audioCtx.sampleRate);
    const data = noiseBuffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    audioStartTime = audioCtx.currentTime;
    nextScheduleTime = audioStartTime + t0;
    if (audioCtx.state === 'suspended') {
      audioCtx.resume().then(() => {
        audioStartTime = audioCtx.currentTime;
        nextScheduleTime = audioStartTime + t0;
        audioStarted = true;
      });
    } else {
      audioStarted = true;
    }
  }
}

initAudio();
document.addEventListener('click', () => {
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume().then(() => {
      audioStartTime = audioCtx.currentTime;
      nextScheduleTime = audioStartTime + t0;
      audioStarted = true;
    });
  }
  initAudio();
});

// Musical patterns per scene (each scene = 64 steps = 8 seconds)
function getKick(stepInScene, scene) {
  if (scene === 0) return stepInScene % 4 === 0 ? 1 : 0;
  if (scene === 1) return (stepInScene % 4 === 0 || stepInScene % 16 === 14) ? 1 : 0;
  if (scene === 2) return (stepInScene % 4 === 0) ? 1 : 0;
  return stepInScene % 8 === 0 ? 1 : 0; // scene 3 half-time
}

function getHihat(stepInScene, scene) {
  if (scene === 0) return stepInScene % 4 === 2 ? 1 : 0; // offbeat 8ths
  if (scene === 1) return stepInScene % 2 === 0 ? 1 : 0; // 8ths
  if (scene === 2) return stepInScene % 2 === 0 ? 1 : 0;
  return stepInScene % 4 === 0 ? 1 : 0;
}

function getBass(stepInScene, scene) {
  const roots = [[110, 87.31, 130.81, 98], [87.31, 130.81, 98, 110], [110, 87.31, 130.81, 98], [110, 110, 110, 110]];
  const root = roots[scene][Math.floor(stepInScene / 16) % 4];
  const pattern = [
    [0, null, null, null, null, null, 6, null, null, null, 10, null, null, null, 14, null], // scene0 sparse
    [0, null, null, 0, null, null, 6, null, null, 10, null, null, 0, null, 14, null], // scene1 more
    [0, null, 0, null, 6, null, 0, null, 10, null, 0, null, 14, null, 0, null], // scene2 driving
    [0, null, null, null, null, null, null, null, 0, null, null, null, null, null, null, null] // scene3 sparse
  ];
  const offsets = [1, 1.5, 2];
  const idx = pattern[scene][stepInScene % 16];
  if (idx === null) return null;
  return root * offsets[idx % offsets.length];
}

function getLead(stepInScene, scene) {
  const roots = [[110, 87.31, 130.81, 98], [87.31, 130.81, 98, 110], [110, 87.31, 130.81, 98], [110, 110, 110, 110]];
  const root = roots[scene][Math.floor(stepInScene / 16) % 4];
  const tones = [root * 2, root * 2.5, root * 3, root * 4];
  if (scene === 0) return stepInScene % 4 === 0 ? tones[stepInScene % 4] : null;
  if (scene === 1) return stepInScene % 2 === 0 ? tones[stepInScene % 4] : null;
  if (scene === 2) return stepInScene % 2 === 0 ? tones[stepInScene % 4] : null;
  return stepInScene % 8 === 0 ? tones[0] : null;
}

function playKick(time) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(150, time);
  osc.frequency.exponentialRampToValueAtTime(50, time + 0.1);
  gain.gain.setValueAtTime(1.0, time);
  gain.gain.exponentialRampToValueAtTime(0.001, time + 0.2);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(time);
  osc.stop(time + 0.2);
}

function playHihat(time) {
  const src = audioCtx.createBufferSource();
  src.buffer = noiseBuffer;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'highpass';
  filter.frequency.value = 7000;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.5, time);
  gain.gain.exponentialRampToValueAtTime(0.001, time + 0.05);
  src.connect(filter).connect(gain).connect(audioCtx.destination);
  src.start(time);
  src.stop(time + 0.05);
}

function playBass(time, freq) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.3, time);
  gain.gain.exponentialRampToValueAtTime(0.001, time + 0.3);
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 800;
  osc.connect(filter).connect(gain).connect(audioCtx.destination);
  osc.start(time);
  osc.stop(time + 0.3);
}

function playLead(time, freq) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'square';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.15, time);
  gain.gain.exponentialRampToValueAtTime(0.001, time + 0.2);
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 2000;
  osc.connect(filter).connect(gain).connect(audioCtx.destination);
  osc.start(time);
  osc.stop(time + 0.2);
}

function scheduleAudio(t) {
  if (!audioCtx || !audioStarted) return;
  const currentAudioTime = audioStartTime + t;
  while (nextScheduleTime < currentAudioTime + lookahead) {
    const globalStep = Math.floor((nextScheduleTime - audioStartTime) / stepDur) % totalSteps;
    const scene = Math.floor(globalStep / 64);
    const stepInScene = globalStep % 64;
    if (getKick(stepInScene, scene)) playKick(nextScheduleTime);
    if (getHihat(stepInScene, scene)) playHihat(nextScheduleTime);
    const bassFreq = getBass(stepInScene, scene);
    if (bassFreq) playBass(nextScheduleTime, bassFreq);
    const leadFreq = getLead(stepInScene, scene);
    if (leadFreq) playLead(nextScheduleTime, leadFreq);
    nextScheduleTime += stepDur;
  }
}

// Visual data
const particles = [];
const numParticles = 120;
for (let i = 0; i < numParticles; i++) {
  particles.push({
    x0: Math.random() * W,
    y0: Math.random() * H,
    vx: (Math.random() - 0.5) * 60,
    vy: (Math.random() - 0.5) * 60,
    amp: Math.random() * 30 + 10,
    freq: Math.random() * 2 + 0.5,
    phase: Math.random() * Math.PI * 2,
    radius: Math.random() * 2 + 1,
    color: ['#00ffff','#ff00ff','#ffff00','#ffffff'][Math.floor(Math.random()*4)]
  });
}

const networkNodes = [];
const center = {x: W/2, y: H/2};
const nodeCount = 12;
for (let i = 0; i < nodeCount; i++) {
  const angle = (i / nodeCount) * Math.PI * 2;
  const dist = 180 + Math.random() * 120;
  networkNodes.push({
    x: center.x + Math.cos(angle) * dist,
    y: center.y + Math.sin(angle) * dist,
    angle: angle,
    dist: dist,
    appearTime: 0.5 + i * 0.15,
    color: ['#00ffff','#ff00ff','#ffff00'][i%3]
  });
}

// Helper drawing functions
function easeInOutCubic(t) { return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2; }
function easeOutBack(t) { const c1=1.70158, c3=c1+1; return 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2); }
function easeOutCubic(t) { return 1 - Math.pow(1-t,3); }

function getParticlePos(p, t) {
  return {
    x: p.x0 + p.vx * t + Math.sin(t * p.freq + p.phase) * p.amp,
    y: p.y0 + p.vy * t + Math.cos(t * p.freq * 0.7 + p.phase) * p.amp * 0.6
  };
}

function drawBackground(t) {
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0, '#0a0a1a');
  grad.addColorStop(0.5, '#000000');
  grad.addColorStop(1, '#0a0a1a');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);
}

function drawParticles(t) {
  for (const p of particles) {
    const pos = getParticlePos(p, t);
    const prevPositions = [];
    for (let i=0; i<5; i++) {
      const tt = t - i*0.03;
      if (tt<0) continue;
      prevPositions.push(getParticlePos(p, tt));
    }
    if (prevPositions.length > 0) {
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
      for (const prev of prevPositions) ctx.lineTo(prev.x, prev.y);
      ctx.strokeStyle = p.color;
      ctx.lineWidth = p.radius;
      ctx.globalAlpha = 0.8;
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, p.radius, 0, Math.PI*2);
    ctx.fillStyle = p.color;
    ctx.fill();
  }
}

function drawScanlines() {
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  for (let y=0; y<H; y+=4) {
    ctx.fillRect(0, y, W, 1);
  }
}

function drawVignette() {
  const grad = ctx.createRadialGradient(W/2,H/2, H*0.4, W/2,H/2, H*0.9);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, 'rgba(0,0,0,0.7)');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);
}

function drawGlowText(text, x, y, size, color, align='center', glow=true) {
  ctx.save();
  ctx.font = `bold ${size}px Arial, sans-serif`;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  if (glow) {
    ctx.shadowColor = color;
    ctx.shadowBlur = 20;
  }
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
  ctx.restore();
}

function drawDot(x, y, r, color) {
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI*2);
  ctx.fillStyle = color;
  ctx.shadowColor = color;
  ctx.shadowBlur = 15;
  ctx.fill();
  ctx.shadowBlur = 0;
}

function drawTransition(t) {
  const boundaries = [5, 12, 20, 32];
  for (const b of boundaries) {
    const dist = Math.abs(t - b);
    if (dist < 0.15) {
      const alpha = 1 - dist / 0.15;
      ctx.fillStyle = `rgba(255,255,255,${alpha * 0.8})`;
      ctx.fillRect(0,0,W,H);
    }
  }
}

// Scene drawing functions
function drawScene1(t) {
  const localT = t;
  const appearTime = 1.5;
  const alpha = Math.min(1, localT / 0.5);
  drawParticles(localT);
  const titleScale = easeOutBack(Math.min(1, localT / appearTime));
  const titleY = H * 0.4;
  const titleSize = 80 * titleScale;
  drawGlowText('AGENTIC', W/2, titleY - 50, titleSize, '#00ffff');
  drawGlowText('ANALYTICS', W/2, titleY + 40, titleSize, '#ff00ff');
  if (localT > 1.5) {
    const subAlpha = Math.min(1, (localT - 1.5) / 1);
    ctx.globalAlpha = subAlpha;
    drawGlowText('Autonomous Data Intelligence', W/2, titleY + 120, 32, '#ffffff');
    ctx.globalAlpha = 1;
  }
  // Glitch effect
  if (localT > 2.5 && localT < 3.5) {
    for (let i=0; i<5; i++) {
      const y = Math.random() * H;
      const h = Math.random() * 10 + 2;
      ctx.drawImage(canvas, 0, y, W, h, 10, y, W, h);
    }
  }
}

function drawScene2(t) {
  const localT = t - 5;
  drawParticles(localT * 0.5);
  const hubPulse = (localT % 1) / 1;
  const hubRadius = 20 + hubPulse * 10;
  ctx.beginPath();
  ctx.arc(center.x, center.y, hubRadius, 0, Math.PI*2);
  ctx.fillStyle = '#00ffff';
  ctx.shadowColor = '#00ffff';
  ctx.shadowBlur = 20;
  ctx.fill();
  ctx.shadowBlur = 0;
  for (let i=0; i<networkNodes.length; i++) {
    const node = networkNodes[i];
    const appear = Math.max(0, Math.min(1, (localT - node.appearTime) / 0.5));
    if (appear <= 0) continue;
    const x = center.x + (node.x - center.x) * easeOutBack(appear);
    const y = center.y + (node.y - center.y) * easeOutBack(appear);
    ctx.beginPath();
    ctx.moveTo(center.x, center.y);
    ctx.lineTo(x, y);
    ctx.strokeStyle = `rgba(0,255,255,${0.3 * appear})`;
    ctx.lineWidth = 2;
    ctx.stroke();
    const nodePulse = (localT * 2 + i) % 1;
    const radius = 5 + nodePulse * 5;
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI*2);
    ctx.fillStyle = node.color;
    ctx.shadowColor = node.color;
    ctx.shadowBlur = 15;
    ctx.fill();
    ctx.shadowBlur = 0;
    const pulseTime = (localT * 1.5 + i * 0.1) % 1;
    const px = center.x + (x - center.x) * pulseTime;
    const py = center.y + (y - center.y) * pulseTime;
    drawDot(px, py, 3, '#ffffff');
  }
  if (localT > 2) {
    const alpha = Math.min(1, (localT - 2) / 1);
    ctx.globalAlpha = alpha;
    drawGlowText('AI Agents analyze data', W/2, H*0.85, 40, '#ffff00');
    drawGlowText('in real-time', W/2, H*0.85 + 50, 40, '#ffff00');
    ctx.globalAlpha = 1;
  }
}

function drawScene3(t) {
  const localT = t - 12;
  drawParticles(localT * 0.2);
  const panelX = 100, panelY = 100, panelW = 1080, panelH = 500;
  ctx.fillStyle = 'rgba(20,20,30,0.8)';
  ctx.fillRect(panelX, panelY, panelW, panelH);
  ctx.strokeStyle = '#00ffff';
  ctx.lineWidth = 2;
  ctx.strokeRect(panelX, panelY, panelW, panelH);

  const chartX = 150, chartY = 200, chartW = 500, chartH = 250;
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(chartX, chartY);
  ctx.lineTo(chartX, chartY + chartH);
  ctx.lineTo(chartX + chartW, chartY + chartH);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.1)';
  for (let i=0; i<5; i++) {
    const y = chartY + chartH * i/4;
    ctx.beginPath(); ctx.moveTo(chartX, y); ctx.lineTo(chartX+chartW, y); ctx.stroke();
  }
  const progress = Math.min(1, localT / 6);
  const numPoints = Math.floor(progress * 20);
  ctx.beginPath();
  ctx.strokeStyle = '#00ffff';
  ctx.lineWidth = 3;
  ctx.shadowColor = '#00ffff';
  ctx.shadowBlur = 10;
  for (let i=0; i<numPoints; i++) {
    const px = chartX + (i / 19) * chartW;
    const py = chartY + chartH - (Math.sin(i*0.8) * 0.4 + 0.5) * chartH;
    if (i===0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.stroke();
  ctx.shadowBlur = 0;
  if (numPoints > 0) {
    const i = numPoints - 1;
    const px = chartX + (i / 19) * chartW;
    const py = chartY + chartH - (Math.sin(i*0.8) * 0.4 + 0.5) * chartH;
    drawDot(px, py, 6, '#ffffff');
  }

  const barX = 700, barY = 200, barW = 400, barH = 250;
  ctx.strokeStyle = '#333';
  ctx.strokeRect(barX, barY, barW, barH);
  const bars = [0.7, 0.9, 0.5, 0.8, 1.0, 0.6, 0.75, 0.85];
  const barCount = bars.length;
  const barGap = 5;
  const barWidth = (barW - (barCount-1)*barGap) / barCount;
  const barProgress = Math.min(1, localT / 4);
  for (let i=0; i<barCount; i++) {
    const bh = bars[i] * barH * barProgress;
    const x = barX + i * (barWidth + barGap);
    const y = barY + barH - bh;
    ctx.fillStyle = ['#ff00ff','#00ffff','#ffff00'][i%3];
    ctx.fillRect(x, y, barWidth, bh);
  }

  const metricValue = Math.floor(progress * 1000);
  drawGlowText(`Insights generated: ${metricValue}`, panelX + 50, panelY + 40, 30, '#ffffff', 'left');
  drawGlowText(`Decisions automated: ${Math.floor(progress*500)}`, panelX + 50, panelY + 80, 30, '#ffffff', 'left');

  if (localT > 5) {
    const alpha = Math.min(1, (localT - 5) / 1);
    ctx.globalAlpha = alpha;
    drawGlowText('Insights that Act', W/2, panelY + panelH + 60, 48, '#00ffff');
    ctx.globalAlpha = 1;
  }
}

function drawScene4(t) {
  const localT = t - 20;
  drawParticles(localT * 0.3);
  const logoCenterX = W/2, logoCenterY = H/2 - 40;
  const logoScale = Math.min(1, localT / 1);
  const logoSize = 150 * logoScale;
  const topX = logoCenterX, topY = logoCenterY - logoSize/2;
  const leftX = logoCenterX - logoSize/2, leftY = logoCenterY + logoSize/2;
  const rightX = logoCenterX + logoSize/2, rightY = logoCenterY + logoSize/2;
  ctx.beginPath();
  ctx.moveTo(topX, topY);
  ctx.lineTo(leftX, leftY);
  ctx.lineTo(rightX, rightY);
  ctx.closePath();
  ctx.strokeStyle = '#00ffff';
  ctx.lineWidth = 4;
  ctx.shadowColor = '#00ffff';
  ctx.shadowBlur = 20;
  ctx.stroke();
  ctx.shadowBlur = 0;
  const crossY = logoCenterY - logoSize/6;
  ctx.beginPath();
  ctx.moveTo(leftX + logoSize*0.15, crossY);
  ctx.lineTo(rightX - logoSize*0.15, crossY);
  ctx.stroke();
  drawDot(topX, topY, 8, '#ff00ff');
  drawDot(leftX, leftY, 8, '#ffff00');
  drawDot(rightX, rightY, 8, '#ffff00');

  if (localT > 1.5) {
    const alpha = Math.min(1, (localT - 1.5) / 1);
    ctx.globalAlpha = alpha;
    drawGlowText('Your Data, On Autopilot', W/2, H/2 + 100, 52, '#ffffff');
    ctx.globalAlpha = 1;
  }
  if (localT > 3.5) {
    const alpha = Math.min(1, (localT - 3.5) / 1);
    ctx.globalAlpha = alpha;
    const btnX = W/2 - 150, btnY = H/2 + 160, btnW = 300, btnH = 60;
    ctx.fillStyle = 'rgba(0,255,255,0.1)';
    ctx.strokeStyle = '#00ffff';
    ctx.lineWidth = 2;
    ctx.fillRect(btnX, btnY, btnW, btnH);
    ctx.strokeRect(btnX, btnY, btnW, btnH);
    drawGlowText('START FREE TRIAL', W/2, btnY + btnH/2, 28, '#00ffff');
    ctx.globalAlpha = 1;
  }
}

function draw(t) {
  ctx.clearRect(0,0,W,H);
  drawBackground(t);
  if (t < 5) drawScene1(t);
  else if (t < 12) drawScene2(t);
  else if (t < 20) drawScene3(t);
  else drawScene4(t);
  drawTransition(t);
  drawScanlines();
  drawVignette();
}

function frame() {
  const now = performance.now();
  let t = (now - startTime) / 1000;
  t = t % DUR;
  if (t < 0) t += DUR;
  scheduleAudio(t);
  draw(t);
  requestAnimationFrame(frame);
}

function resize() {
  const scaleX = window.innerWidth / W;
  const scaleY = window.innerHeight / H;
  const scale = Math.min(scaleX, scaleY);
  canvas.style.transform = `translate(-50%, -50%) scale(${scale})`;
  canvas.style.left = '50%';
  canvas.style.top = '50%';
}
window.addEventListener('resize', resize);
resize();

requestAnimationFrame(frame);
</script>
</body>
</html>
