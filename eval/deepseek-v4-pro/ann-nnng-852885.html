<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motion Design Showcase</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }
        canvas {
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="c" width="1280" height="720"></canvas>
    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        const W = 1280, H = 720;
        const DUR = 15;
        window.DUR = DUR;

        // Parse ?t=SECONDS
        const urlParams = new URLSearchParams(window.location.search);
        const startOffset = parseFloat(urlParams.get('t')) || 0;
        const animStart = performance.now() - startOffset * 1000;

        // Easing functions
        const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
        const easeInOutCubic = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        const easeOutBack = t => { const c1 = 1.70158; const c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
        const easeOutElastic = t => { const c4 = (2 * Math.PI) / 3; return t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * c4) + 1; };
        const easeInOutBack = t => { const c1 = 1.70158; const c2 = c1 * 1.525; return t < 0.5 ? (Math.pow(2 * t, 2) * ((c2 + 1) * 2 * t - c2)) / 2 : (Math.pow(2 * t - 2, 2) * ((c2 + 1) * (t * 2 - 2) + c2) + 2) / 2; };
        const easeOutQuint = t => 1 - Math.pow(1 - t, 5);
        const easeInQuint = t => t * t * t * t * t;
        const easeOutQuad = t => 1 - (1 - t) * (1 - t);
        const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
        const lerp = (a, b, t) => a + (b - a) * t;
        const smoothstep = (a, b, t) => { const x = clamp((t - a) / (b - a), 0, 1); return x * x * (3 - 2 * x); };

        // Color palette
        function getPalette(phase) {
            // phase 0=cyan/blue, 1=magenta/purple, 2=gold/warm, 3=back to cyan
            const palettes = [
                { primary: '#00D4FF', secondary: '#0066FF', accent: '#00FFAA', bg: '#0A0A14', glow1: '#00D4FF', glow2: '#0066FF' },
                { primary: '#FF006E', secondary: '#9900FF', accent: '#FF4400', bg: '#140A0F', glow1: '#FF006E', glow2: '#9900FF' },
                { primary: '#FFB800', secondary: '#FF6600', accent: '#FFE066', bg: '#14100A', glow1: '#FFB800', glow2: '#FF6600' },
                { primary: '#00E5FF', secondary: '#7C4DFF', accent: '#00FFCC', bg: '#0A0A14', glow1: '#00E5FF', glow2: '#7C4DFF' }
            ];
            const seg = 1 / 3;
            if (phase < seg) {
                const t = phase / seg;
                return {
                    primary: lerpColor(palettes[0].primary, palettes[1].primary, t),
                    secondary: lerpColor(palettes[0].secondary, palettes[1].secondary, t),
                    accent: lerpColor(palettes[0].accent, palettes[1].accent, t),
                    bg: lerpColor(palettes[0].bg, palettes[1].bg, t),
                    glow1: lerpColor(palettes[0].glow1, palettes[1].glow1, t),
                    glow2: lerpColor(palettes[0].glow2, palettes[1].glow2, t)
                };
            } else if (phase < 2 * seg) {
                const t = (phase - seg) / seg;
                return {
                    primary: lerpColor(palettes[1].primary, palettes[2].primary, t),
                    secondary: lerpColor(palettes[1].secondary, palettes[2].secondary, t),
                    accent: lerpColor(palettes[1].accent, palettes[2].accent, t),
                    bg: lerpColor(palettes[1].bg, palettes[2].bg, t),
                    glow1: lerpColor(palettes[1].glow1, palettes[2].glow1, t),
                    glow2: lerpColor(palettes[1].glow2, palettes[2].glow2, t)
                };
            } else {
                const t = (phase - 2 * seg) / seg;
                return {
                    primary: lerpColor(palettes[2].primary, palettes[3].primary, t),
                    secondary: lerpColor(palettes[2].secondary, palettes[3].secondary, t),
                    accent: lerpColor(palettes[2].accent, palettes[3].accent, t),
                    bg: lerpColor(palettes[2].bg, palettes[3].bg, t),
                    glow1: lerpColor(palettes[2].glow1, palettes[3].glow1, t),
                    glow2: lerpColor(palettes[2].glow2, palettes[3].glow2, t)
                };
            }
        }

        function lerpColor(c1, c2, t) {
            const r1 = parseInt(c1.slice(1, 3), 16), g1 = parseInt(c1.slice(3, 5), 16), b1 = parseInt(c1.slice(5, 7), 16);
            const r2 = parseInt(c2.slice(1, 3), 16), g2 = parseInt(c2.slice(3, 5), 16), b2 = parseInt(c2.slice(5, 7), 16);
            const r = Math.round(lerp(r1, r2, t));
            const g = Math.round(lerp(g1, g2, t));
            const b = Math.round(lerp(b1, b2, t));
            return `rgb(${r},${g},${b})`;
        }

        function hexToRgb(hex) {
            const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
            return [r, g, b];
        }

        function rgbStr(r, g, b, a = 1) {
            return `rgba(${Math.round(r)},${Math.round(g)},${Math.round(b)},${a})`;
        }

        // Shape morphing: t=0 circle, t=0.5 rounded square, t=1 triangle, t=1.5 diamond, back to circle at 2
        function drawMorphShape(x, y, size, morphT, rotation, color, lineWidth = 2, fillAlpha = 0.15) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rotation);
            ctx.beginPath();
            const m = ((morphT % 2) + 2) % 2;
            const segments = 120;
            if (m < 0.5) {
                // circle to square
                const t = m / 0.5;
                const r = size * (1 - t * 0.3);
                for (let i = 0; i <= segments; i++) {
                    const angle = (i / segments) * Math.PI * 2;
                    const baseR = r;
                    const squareR = r * Math.min(1 / Math.abs(Math.cos(angle)), 1 / Math.abs(Math.sin(angle))) * 0.7;
                    const radius = lerp(baseR, squareR, t);
                    const px = Math.cos(angle) * radius;
                    const py = Math.sin(angle) * radius;
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
            } else if (m < 1) {
                // square to triangle
                const t = (m - 0.5) / 0.5;
                const r = size * 0.7;
                for (let i = 0; i <= segments; i++) {
                    const angle = (i / segments) * Math.PI * 2;
                    const squareR = r * Math.min(1 / Math.abs(Math.cos(angle)), 1 / Math.abs(Math.sin(angle))) * 0.7;
                    const triR = r * Math.cos(Math.PI / 3) / Math.cos((angle % (Math.PI * 2 / 3)) - Math.PI / 3);
                    const radius = lerp(squareR, triR, t);
                    const px = Math.cos(angle) * radius;
                    const py = Math.sin(angle) * radius;
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
            } else if (m < 1.5) {
                // triangle to diamond
                const t = (m - 1) / 0.5;
                const r = size;
                for (let i = 0; i <= segments; i++) {
                    const angle = (i / segments) * Math.PI * 2;
                    const triR = r * Math.cos(Math.PI / 3) / Math.cos((angle % (Math.PI * 2 / 3)) - Math.PI / 3);
                    const diamondR = r * Math.min(1 / Math.abs(Math.cos(angle + Math.PI / 4)), 1 / Math.abs(Math.sin(angle + Math.PI / 4))) * 0.65;
                    const radius = lerp(triR, diamondR, t);
                    const px = Math.cos(angle) * radius;
                    const py = Math.sin(angle) * radius;
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
            } else {
                // diamond back to circle
                const t = (m - 1.5) / 0.5;
                const r = size;
                for (let i = 0; i <= segments; i++) {
                    const angle = (i / segments) * Math.PI * 2;
                    const diamondR = r * Math.min(1 / Math.abs(Math.cos(angle + Math.PI / 4)), 1 / Math.abs(Math.sin(angle + Math.PI / 4))) * 0.65;
                    const radius = lerp(diamondR, r, t);
                    const px = Math.cos(angle) * radius;
                    const py = Math.sin(angle) * radius;
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
            }
            ctx.closePath();
            const [cr, cg, cb] = hexToRgb(color);
            ctx.fillStyle = rgbStr(cr, cg, cb, fillAlpha);
            ctx.fill();
            ctx.strokeStyle = rgbStr(cr, cg, cb, 0.9);
            ctx.lineWidth = lineWidth;
            ctx.shadowColor = color;
            ctx.shadowBlur = 18;
            ctx.stroke();
            ctx.shadowBlur = 0;
            ctx.restore();
        }

        // Particle system
        class Particle {
            constructor(seed) {
                this.seed = seed;
                this.reset();
            }
            reset() {
                this.x = Math.random() * W;
                this.y = Math.random() * H;
                this.vx = (Math.random() - 0.5) * 15;
                this.vy = (Math.random() - 0.5) * 15;
                this.size = 1 + Math.random() * 3;
                this.phase = Math.random() * Math.PI * 2;
                this.orbitSpeed = 0.3 + Math.random() * 0.7;
                this.orbitRadius = 20 + Math.random() * 80;
                this.orbitAngle = Math.random() * Math.PI * 2;
                this.baseAlpha = 0.3 + Math.random() * 0.5;
            }
            update(t, dt, palette) {
                this.orbitAngle += this.orbitSpeed * dt;
                this.x += this.vx * dt + Math.cos(this.orbitAngle) * 0.3;
                this.y += this.vy * dt + Math.sin(this.orbitAngle) * 0.3;
                this.phase += dt * 0.8;
                if (this.x < -20) this.x = W + 20;
                if (this.x > W + 20) this.x = -20;
                if (this.y < -20) this.y = H + 20;
                if (this.y > H + 20) this.y = -20;
            }
            draw(ctx, t, palette, alphaMul) {
                const twinkle = 0.7 + 0.3 * Math.sin(this.phase + t * 3);
                const alpha = this.baseAlpha * twinkle * alphaMul;
                const [cr, cg, cb] = hexToRgb(palette.glow1);
                const size = this.size * (0.8 + 0.4 * Math.sin(this.phase + t));
                ctx.beginPath();
                ctx.arc(this.x, this.y, size, 0, Math.PI * 2);
                ctx.fillStyle = rgbStr(cr, cg, cb, alpha);
                ctx.fill();
                if (size > 2.5) {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, size * 1.8, 0, Math.PI * 2);
                    ctx.fillStyle = rgbStr(cr, cg, cb, alpha * 0.2);
                    ctx.fill();
                }
            }
        }

        // Initialize particles
        const particles = [];
        const NUM_PARTICLES = 110;
        for (let i = 0; i < NUM_PARTICLES; i++) {
            particles.push(new Particle(i));
        }

        // Star field (background subtle)
        const stars = [];
        for (let i = 0; i < 200; i++) {
            stars.push({
                x: Math.random() * W,
                y: Math.random() * H,
                size: 0.5 + Math.random() * 1.5,
                alpha: 0.15 + Math.random() * 0.4,
                phase: Math.random() * Math.PI * 2,
                speed: 0.2 + Math.random() * 0.8
            });
        }

        // Letter layout for "MOTION" and "DESIGN"
        function getLetterPositions(word, fontSize, centerX, y, ctx) {
            ctx.font = `900 ${fontSize}px 'Helvetica Neue', 'Arial Black', Arial, sans-serif`;
            const letters = word.split('');
            const positions = [];
            const spacing = fontSize * 0.55;
            const totalWidth = (letters.length - 1) * spacing + letters.reduce((sum, ch) => {
                return sum + ctx.measureText(ch).width;
            }, 0);
            let currentX = centerX - totalWidth / 2;
            for (const ch of letters) {
                const w = ctx.measureText(ch).width;
                positions.push({ char: ch, x: currentX + w / 2, y, width: w });
                currentX += w + spacing;
            }
            return positions;
        }

        function drawTextStaggered(word, fontSize, centerX, y, t, startTime, staggerDelay, color, glowColor, ctx, charOffsetMult = 30, alphaScale = 1) {
            const positions = getLetterPositions(word, fontSize, centerX, y, ctx);
            ctx.font = `900 ${fontSize}px 'Helvetica Neue', 'Arial Black', Arial, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const [cr, cg, cb] = hexToRgb(color);
            const [gr, gg, gb] = hexToRgb(glowColor);

            positions.forEach((pos, i) => {
                const charStart = startTime + i * staggerDelay;
                const charDur = 0.7;
                const localT = clamp((t - charStart) / charDur, 0, 1);
                if (localT <= 0) return;
                const eased = easeOutBack(localT);
                const offsetY = (1 - eased) * -charOffsetMult;
                const offsetX = (1 - eased) * (Math.random() * 0.5 - 0.25) * charOffsetMult * 0.5;
                const scale = 0.3 + 0.7 * eased;
                const alpha = clamp(localT * 2, 0, 1) * alphaScale;

                ctx.save();
                ctx.translate(pos.x + offsetX, pos.y + offsetY);
                ctx.scale(scale, scale);
                ctx.globalAlpha = alpha;
                ctx.shadowColor = glowColor;
                ctx.shadowBlur = 20;
                ctx.fillStyle = rgbStr(cr, cg, cb, 0.15);
                ctx.fillText(pos.char, 2, 2);
                ctx.fillStyle = rgbStr(cr, cg, cb, alpha);
                ctx.fillText(pos.char, 0, 0);
                ctx.shadowBlur = 0;
                ctx.globalAlpha = 1;
                ctx.restore();
            });
        }

        function drawTextSimple(word, fontSize, centerX, y, t, startTime, dur, color, glowColor, ctx, alphaMul = 1) {
            const localT = clamp((t - startTime) / dur, 0, 1);
            if (localT <= 0) return;
            const eased = easeOutCubic(localT);
            ctx.font = `900 ${fontSize}px 'Helvetica Neue', 'Arial Black', Arial, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const alpha = clamp(localT * 2, 0, 1) * alphaMul;
            const [cr, cg, cb] = hexToRgb(color);
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.shadowColor = glowColor;
            ctx.shadowBlur = 25;
            ctx.fillStyle = rgbStr(cr, cg, cb, alpha);
            ctx.fillText(word, centerX, y);
            ctx.shadowBlur = 0;
            ctx.globalAlpha = 1;
            ctx.restore();
        }

        function drawTextFadeOut(word, fontSize, centerX, y, t, startTime, dur, color, glowColor, ctx) {
            const localT = clamp((t - startTime) / dur, 0, 1);
            if (localT <= 0) return;
            const alpha = (1 - localT) * clamp(localT * 4, 0, 1);
            if (alpha <= 0.01) return;
            ctx.font = `900 ${fontSize}px 'Helvetica Neue', 'Arial Black', Arial, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const [cr, cg, cb] = hexToRgb(color);
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.shadowColor = glowColor;
            ctx.shadowBlur = 15;
            ctx.fillStyle = rgbStr(cr, cg, cb, alpha);
            ctx.fillText(word, centerX, y);
            ctx.shadowBlur = 0;
            ctx.globalAlpha = 1;
            ctx.restore();
        }

        // Orbit shapes
        const orbitShapes = [
            { radius: 220, speed: 0.6, size: 38, morphSpeed: 0.35, startAngle: 0, rotation: 0.4, colorIdx: 0, thickness: 2.5 },
            { radius: 280, speed: -0.4, size: 28, morphSpeed: 0.5, startAngle: Math.PI * 0.7, rotation: -0.3, colorIdx: 1, thickness: 2 },
            { radius: 190, speed: 0.8, size: 48, morphSpeed: 0.25, startAngle: Math.PI * 1.3, rotation: 0.6, colorIdx: 2, thickness: 3 },
            { radius: 320, speed: -0.55, size: 22, morphSpeed: 0.45, startAngle: Math.PI * 1.8, rotation: -0.5, colorIdx: 0, thickness: 1.8 },
        ];

        // Grid drawing
        function drawGrid(t, alpha, palette) {
            ctx.save();
            ctx.globalAlpha = alpha * 0.35;
            ctx.strokeStyle = palette.secondary;
            ctx.lineWidth = 0.5;
            const spacing = 45;
            const offset = (t * 15) % spacing;
            for (let x = -spacing + offset; x < W + spacing; x += spacing) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, H);
                ctx.stroke();
            }
            for (let y = -spacing + offset; y < H + spacing; y += spacing) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(W, y);
                ctx.stroke();
            }
            ctx.globalAlpha = 1;
            ctx.restore();
        }

        // Accent flowing lines
        function drawFlowLines(t, alpha, palette) {
            ctx.save();
            ctx.globalAlpha = alpha * 0.5;
            ctx.lineWidth = 1.5;
            const count = 6;
            for (let i = 0; i < count; i++) {
                const baseY = H * 0.15 + (i / (count - 1)) * H * 0.7;
                const amp = 20 + Math.sin(i * 2.1) * 15;
                const freq = 0.008 + (i % 3) * 0.003;
                const phase = t * (1.2 + i * 0.15);
                ctx.beginPath();
                for (let x = 0; x <= W; x += 8) {
                    const y = baseY + Math.sin(x * freq + phase) * amp + Math.cos(x * freq * 0.5 + phase * 0.7) * amp * 0.4;
                    if (x === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                const [cr, cg, cb] = hexToRgb(i % 2 === 0 ? palette.primary : palette.accent);
                ctx.strokeStyle = rgbStr(cr, cg, cb, 0.4 * alpha);
                ctx.stroke();
            }
            ctx.globalAlpha = 1;
            ctx.restore();
        }

        // Render function
        function draw(t) {
            // Global fade in/out for seamless loop
            const fadeIn = smoothstep(0, 0.6, t);
            const fadeOut = 1 - smoothstep(14.4, 15, t);
            const globalAlpha = fadeIn * fadeOut;

            const phase = clamp(t / DUR, 0, 1);
            const palette = getPalette(phase);

            // Background
            const [br, bg, bb] = hexToRgb(palette.bg);
            const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
            bgGrad.addColorStop(0, rgbStr(br, bg, bb, 1));
            bgGrad.addColorStop(0.5, rgbStr(br * 0.7, bg * 0.7, bb * 0.85, 1));
            bgGrad.addColorStop(1, rgbStr(br * 0.5, bg * 0.5, bb * 0.7, 1));
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, W, H);

            // Stars
            stars.forEach(star => {
                const twinkle = 0.6 + 0.4 * Math.sin(star.phase + t * star.speed * 2);
                const alpha = star.alpha * twinkle * globalAlpha * 0.6;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fillStyle = rgbStr(200, 200, 220, alpha);
                ctx.fill();
            });

            // Grid (subtle, appears mid-video)
            const gridAlpha = smoothstep(5.5, 7, t) * (1 - smoothstep(10.5, 12, t)) * globalAlpha;
            if (gridAlpha > 0.01) drawGrid(t, gridAlpha, palette);

            // Flow lines (appear during color transitions)
            const flowAlpha = (smoothstep(3, 4.5, t) * (1 - smoothstep(7, 8.5, t)) + smoothstep(9.5, 11, t) * (1 - smoothstep(13.5, 14.8, t))) * globalAlpha;
            if (flowAlpha > 0.01) drawFlowLines(t, flowAlpha, palette);

            // Particles
            const particleAlpha = globalAlpha * (0.7 + 0.3 * Math.sin(t * 2));
            particles.forEach(p => {
                p.update(t, 0.016, palette);
                p.draw(ctx, t, palette, particleAlpha);
            });

            // Orbiting shapes
            const orbitAlpha = globalAlpha;
            if (orbitAlpha > 0.01) {
                orbitShapes.forEach((shape, i) => {
                    const angle = shape.startAngle + t * shape.speed;
                    const x = W / 2 + Math.cos(angle) * shape.radius;
                    const y = H / 2 + Math.sin(angle) * shape.radius * 0.7;
                    const morphT = t * shape.morphSpeed + i * 0.3;
                    const color = i % 3 === 0 ? palette.primary : (i % 3 === 1 ? palette.secondary : palette.accent);
                    const rotSpeed = shape.rotation + Math.sin(t * 0.7 + i) * 0.5;
                    drawMorphShape(x, y, shape.size, morphT, rotSpeed, color, shape.thickness, 0.12 * orbitAlpha);
                });
            }

            // Center glow
            const centerGlowAlpha = globalAlpha * 0.15;
            if (centerGlowAlpha > 0.005) {
                const grad = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, 350);
                const [gr, gg, gb] = hexToRgb(palette.primary);
                grad.addColorStop(0, rgbStr(gr, gg, gb, 0.25 * centerGlowAlpha * 15));
                grad.addColorStop(0.5, rgbStr(gr, gg, gb, 0.08 * centerGlowAlpha * 15));
                grad.addColorStop(1, rgbStr(gr, gg, gb, 0));
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, W, H);
            }

            // Main text - "MOTION" staggered
            const motionStart = 0.8;
            const motionStagger = 0.09;
            drawTextStaggered('MOTION', 95, W / 2, H / 2 - 75, t, motionStart, motionStagger, palette.primary, palette.glow1, ctx, 35, globalAlpha);

            // "DESIGN" staggered
            const designStart = 2.8;
            const designStagger = 0.1;
            drawTextStaggered('DESIGN', 95, W / 2, H / 2 + 75, t, designStart, designStagger, palette.secondary, palette.glow2, ctx, 30, globalAlpha);

            // Supporting words appearing and fading
            const supAlpha = globalAlpha;
            // "PRECISION" - appears around 5.5s
            const precStart = 5.2;
            const precDur = 1.2;
            const precT = clamp((t - precStart) / precDur, 0, 1);
            if (precT > 0 && precT < 1.5) {
                const inAlpha = smoothstep(0, 0.3, precT) * (1 - smoothstep(0.8, 1.2, precT));
                if (inAlpha > 0.01) {
                    ctx.font = '300 28px "Helvetica Neue", Arial, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    const [cr, cg, cb] = hexToRgb(palette.accent);
                    ctx.save();
                    ctx.globalAlpha = inAlpha * supAlpha * 0.8;
                    ctx.shadowColor = palette.accent;
                    ctx.shadowBlur = 12;
                    ctx.fillStyle = rgbStr(cr, cg, cb, inAlpha * supAlpha * 0.8);
                    ctx.fillText('PRECISION', W / 2 + 350, H / 2 - 120);
                    ctx.shadowBlur = 0;
                    ctx.globalAlpha = 1;
                    ctx.restore();
                }
            }
            // "FLUIDITY" - appears around 7.5s
            const fluidStart = 7.2;
            const fluidDur = 1.2;
            const fluidT = clamp((t - fluidStart) / fluidDur, 0, 1);
            if (fluidT > 0 && fluidT < 1.5) {
                const inAlpha = smoothstep(0, 0.3, fluidT) * (1 - smoothstep(0.8, 1.2, fluidT));
                if (inAlpha > 0.01) {
                    ctx.font = '300 28px "Helvetica Neue", Arial, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    const [cr, cg, cb] = hexToRgb(palette.accent);
                    ctx.save();
                    ctx.globalAlpha = inAlpha * supAlpha * 0.8;
                    ctx.shadowColor = palette.accent;
                    ctx.shadowBlur = 12;
                    ctx.fillStyle = rgbStr(cr, cg, cb, inAlpha * supAlpha * 0.8);
                    ctx.fillText('FLUIDITY', W / 2 - 370, H / 2 + 150);
                    ctx.shadowBlur = 0;
                    ctx.globalAlpha = 1;
                    ctx.restore();
                }
            }
            // "CREATIVITY" - appears around 9.5s
            const creatStart = 9.2;
            const creatDur = 1.4;
            const creatT = clamp((t - creatStart) / creatDur, 0, 1);
            if (creatT > 0 && creatT < 1.5) {
                const inAlpha = smoothstep(0, 0.3, creatT) * (1 - smoothstep(0.7, 1.3, creatT));
                if (inAlpha > 0.01) {
                    ctx.font = '300 28px "Helvetica Neue", Arial, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    const [cr, cg, cb] = hexToRgb(palette.accent);
                    ctx.save();
                    ctx.globalAlpha = inAlpha * supAlpha * 0.8;
                    ctx.shadowColor = palette.accent;
                    ctx.shadowBlur = 12;
                    ctx.fillStyle = rgbStr(cr, cg, cb, inAlpha * supAlpha * 0.8);
                    ctx.fillText('CREATIVITY', W / 2 + 400, H / 2 + 50);
                    ctx.shadowBlur = 0;
                    ctx.globalAlpha = 1;
                    ctx.restore();
                }
            }

            // Final "MOTION DESIGN" lockup at end
            const lockupStart = 11.5;
            const lockupT = clamp((t - lockupStart) / 1.5, 0, 1);
            if (lockupT > 0) {
                const eased = easeOutCubic(lockupT);
                const alpha = clamp(lockupT * 2, 0, 1) * globalAlpha;
                if (alpha > 0.01) {
                    const fontSize = 50;
                    ctx.font = `900 ${fontSize}px 'Helvetica Neue', 'Arial Black', Arial, sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    const scale = 0.7 + 0.3 * eased;
                    const yOff = (1 - eased) * 60;
                    const [pr, pg, pb] = hexToRgb(palette.primary);
                    const [sr, sg, sb] = hexToRgb(palette.secondary);
                    ctx.save();
                    ctx.translate(W / 2, H / 2 + 200 + yOff);
                    ctx.scale(scale, scale);
                    ctx.globalAlpha = alpha * 0.9;
                    ctx.shadowColor = palette.glow1;
                    ctx.shadowBlur = 30;
                    ctx.fillStyle = rgbStr(pr, pg, pb, alpha * 0.9);
                    ctx.fillText('MOTION DESIGN', 0, 0);
                    ctx.shadowBlur = 0;
                    ctx.globalAlpha = 1;
                    ctx.restore();
                }
            }

            // Orbiting ring accent
            const ringAlpha = globalAlpha * 0.5;
            if (ringAlpha > 0.005) {
                ctx.save();
                ctx.globalAlpha = ringAlpha;
                ctx.beginPath();
                ctx.arc(W / 2, H / 2, 160 + Math.sin(t * 1.5) * 20, 0, Math.PI * 2);
                ctx.strokeStyle = palette.primary;
                ctx.lineWidth = 1.5;
                ctx.setLineDash([8, 12]);
                ctx.lineDashOffset = -t * 40;
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.globalAlpha = 1;
                ctx.restore();
            }

            // Bottom accent bar
            const barAlpha = globalAlpha * smoothstep(12, 13.5, t) * 0.7;
            if (barAlpha > 0.005) {
                ctx.save();
                ctx.globalAlpha = barAlpha;
                const barWidth = 400 * easeOutCubic(clamp((t - 12.5) / 1.2, 0, 1));
                ctx.fillStyle = palette.primary;
                ctx.fillRect(W / 2 - barWidth / 2, H - 45, barWidth, 3);
                ctx.fillStyle = palette.secondary;
                ctx.fillRect(W / 2 - barWidth / 2 - 30, H - 40, 60, 3);
                ctx.fillRect(W / 2 + barWidth / 2 - 30, H - 40, 60, 3);
                ctx.globalAlpha = 1;
                ctx.restore();
            }

            // Vignette overlay for cinematic feel
            const vigGrad = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.75);
            vigGrad.addColorStop(0, 'rgba(0,0,0,0)');
            vigGrad.addColorStop(1, 'rgba(0,0,0,0.5)');
            ctx.fillStyle = vigGrad;
            ctx.fillRect(0, 0, W, H);
        }

        // Main render loop
        function render(now) {
            const t = ((now - animStart) / 1000) % DUR;
            draw(t);
            requestAnimationFrame(render);
        }

        // Set up font and start
        document.fonts.ready.then(() => {
            requestAnimationFrame(render);
        });
        // Fallback if fonts already loaded
        setTimeout(() => {
            if (!document.fonts.status || document.fonts.status === 'loaded') {
                // Already started
            }
            requestAnimationFrame(render);
        }, 100);
    </script>
</body>
