<!DOCTYPE html><html lang="ar"><head><meta charset="utf-8"><style>body{margin:0;background:#000;overflow:hidden}canvas{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}</style></head><body><canvas id="c" width="1280" height="720"></canvas><script>
const W=1280,H=720,DUR=48;window.DUR=DUR;
const cv=document.getElementById('c'),x=cv.getContext('2d');
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px'}fit();onresize=fit;
const q=new URLSearchParams(location.search);const off=parseFloat(q.get('t')||0)||0;const t0=performance.now()-off*1000;
const HZ=380;
function R(i){return Math.abs(Math.sin(i*127.1+311.7)*43758.5)%1}
function L(a,b,k){return a+(b-a)*k}
function lc(a,b,k){return a.map((v,i)=>Math.round(L(v,b[i],k)))}
function rgb(c,a){return a==null?`rgb(${c})`:`rgba(${c},${a})`}
// weather keyframes: sun, cloudy, rain, storm, snow/dusk
const WX=[{t:0,sky1:[120,170,230],sky2:[250,210,190],rain:0,fog:.1,dark:0,snow:0},{t:10,sky1:[150,170,200],sky2:[230,220,210],rain:0,fog:.25,dark:.1,snow:0},{t:18,sky1:[80,95,115],sky2:[140,150,160],rain:.7,fog:.4,dark:.35,snow:0},{t:26,sky1:[40,45,60],sky2:[80,85,100],rain:1,fog:.5,dark:.55,snow:0},{t:34,sky1:[60,60,100],sky2:[240,150,120],rain:0,fog:.3,dark:.25,snow:0},{t:42,sky1:[30,35,70],sky2:[150,130,170],rain:0,fog:.35,dark:.4,snow:1},{t:48,sky1:[120,170,230],sky2:[250,210,190],rain:0,fog:.1,dark:0,snow:0}];
function wx(t){for(let i=0;i<WX.length-1;i++){const a=WX[i],b=WX[i+1];if(t<b.t){let k=(t-a.t)/(b.t-a.t);k=k*k*(3-2*k);const o={};for(const p in a)o[p]=Array.isArray(a[p])?lc(a[p],b[p],k):L(a[p],b[p],k);return o}}return WX[0]}
const names=['ربيع مشمس','غيوم الصباح','مطر خفيف','عاصفة رعدية','غروب ذهبي','ثلج الليل'];
// draw elements in world; s = scroll offset per layer
function mountain(s,base,hgt,col,seed){x.fillStyle=col;x.beginPath();x.moveTo(0,HZ);for(let X=0;X<=W;X+=8){const u=(X+s)/300;const y=base-hgt*(.5+.3*Math.sin(u+seed)+.2*Math.sin(u*2.3+seed*3));x.lineTo(X,y)}x.lineTo(W,HZ);x.fill()}
function fuji(s,w){const cx=900-s*.05;x.fillStyle=rgb(lc([90,110,150],[50,55,70],w.dark));x.beginPath();x.moveTo(cx-380,HZ);x.lineTo(cx-60,150);x.lineTo(cx+60,150);x.lineTo(cx+380,HZ);x.fill();x.fillStyle='#f4f6fb';x.beginPath();x.moveTo(cx-110,205);x.lineTo(cx-60,150);x.lineTo(cx+60,150);x.lineTo(cx+110,205);for(let i=0;i<5;i++)x.lineTo(cx+110-i*55,205+(i%2?18:0));x.fill()}
function pagoda(X,base,sc,w){const r=lc([170,40,30],[80,30,30],w.dark),rf=lc([50,40,40],[25,22,25],w.dark);for(let i=0;i<5;i++){const y=base-i*28*sc,bw=(46-i*6)*sc;x.fillStyle=rgb(r);x.fillRect(X-bw/2,y-22*sc,bw,22*sc);x.fillStyle=rgb(rf);x.beginPath();x.moveTo(X-bw*.95,y-18*sc);x.quadraticCurveTo(X,y-34*sc,X+bw*.95,y-18*sc);x.lineTo(X+bw*.6,y-28*sc);x.lineTo(X-bw*.6,y-28*sc);x.fill()}x.fillStyle=rgb(rf);x.fillRect(X-1.5*sc,base-5*28*sc-30*sc,3*sc,30*sc)}
function torii(X,base,sc,w){x.fillStyle=rgb(lc([210,50,30],[100,35,30],w.dark));x.fillRect(X-30*sc,base-80*sc,7*sc,80*sc);x.fillRect(X+23*sc,base-80*sc,7*sc,80*sc);x.fillRect(X-38*sc,base-66*sc,76*sc,6*sc);x.fillStyle='#222';x.beginPath();x.moveTo(X-48*sc,base-86*sc);x.quadraticCurveTo(X,base-78*sc,X+48*sc,base-86*sc);x.lineTo(X+44*sc,base-78*sc);x.lineTo(X-44*sc,base-78*sc);x.fill()}
function house(X,base,sc,w,lit){x.fillStyle=rgb(lc([230,220,200],[120,115,110],w.dark));x.fillRect(X-40*sc,base-30*sc,80*sc,30*sc);if(lit){x.fillStyle=`rgba(255,200,110,${.3+w.dark})`;x.fillRect(X-30*sc,base-24*sc,60*sc,16*sc)}x.strokeStyle='#5a3a26';x.lineWidth=2*sc;for(let i=-3;i<=3;i++){x.beginPath();x.moveTo(X+i*10*sc,base-30*sc);x.lineTo(X+i*10*sc,base);x.stroke()}x.fillStyle=rgb(lc([60,60,70],[30,30,35],w.dark));x.beginPath();x.moveTo(X-55*sc,base-28*sc);x.quadraticCurveTo(X-30*sc,base-34*sc,X-20*sc,base-56*sc);x.lineTo(X+20*sc,base-56*sc);x.quadraticCurveTo(X+30*sc,base-34*sc,X+55*sc,base-28*sc);x.fill()}
function sakura(X,base,sc,w,t,i){x.strokeStyle='#3a2420';x.lineWidth=6*sc;x.beginPath();x.moveTo(X,base);x.quadraticCurveTo(X+8*sc,base-40*sc,X-4*sc,base-70*sc);x.stroke();const c=w.snow>.5?[240,240,250]:lc([255,180,205],[150,110,130],w.dark);for(let k=0;k<9;k++){x.fillStyle=rgb(lc(c,[255,255,255],R(i*9+k)*.3),.9);x.beginPath();x.arc(X+(R(i+k)-.5)*70*sc+Math.sin(t+k)*2,base-75*sc+(R(i*3+k)-.5)*45*sc,(18+R(k+i)*10)*sc,0,7);x.fill()}}
function lantern(X,base,sc,w,t){x.fillStyle='#555';x.fillRect(X-3*sc,base-30*sc,6*sc,30*sc);x.fillStyle=`rgba(255,190,90,${.5+w.dark*.5+.1*Math.sin(t*5)})`;x.fillRect(X-8*sc,base-44*sc,16*sc,14*sc);x.fillStyle='#444';x.fillRect(X-12*sc,base-48*sc,24*sc,5*sc)}
function person(X,base,sc,col,t,ph){const b=Math.sin(t*2+ph)*2*sc;x.fillStyle=col;x.beginPath();x.moveTo(X-8*sc,base);x.lineTo(X-5*sc,base-26*sc+b);x.lineTo(X+5*sc,base-26*sc+b);x.lineTo(X+8*sc,base);x.fill();x.fillStyle='#f0d2b4';x.beginPath();x.arc(X,base-31*sc+b,5*sc,0,7);x.fill();x.fillStyle='#1a1a1a';x.beginPath();x.arc(X,base-33*sc+b,5*sc,Math.PI,0);x.fill()}
// shore scene: scrolling objects
function shore(s,w,t,far){const base=far?HZ:HZ+8,sc=far?.7:1.1,sp=far?.35:1;const step=far?260:340;x.fillStyle=rgb(lc(far?[70,110,70]:[60,100,55],[30,40,35],w.dark));x.fillRect(0,base-(far?10:16),W,far?10:16);const o=s*sp;const i0=Math.floor(o/step)-1;for(let i=i0;i<i0+W/step+3;i++){const X=i*step-o+(far?0:120);const k=Math.abs(Math.floor(R(i+(far?50:0))*6));const bs=base-(far?10:16);if(k==0)pagoda(X,bs,sc,w);else if(k==1)torii(X,bs,sc,w);else if(k==2){house(X,bs,sc,w,true);person(X+60*sc,bs,sc*.9,'#3b5a8a',t,i)}else if(k==3){sakura(X,bs,sc,w,t,i);person(X+40*sc,bs,sc*.9,'#a83a5a',t,i)}else if(k==4){lantern(X,bs,sc,w,t);sakura(X+80*sc,bs,sc,w,t,i+3)}else{house(X,bs,sc,w,false);lantern(X+70*sc,bs,sc,w,t)}}}
function scene(t,w){const s=t*60;const g=x.createLinearGradient(0,0,0,HZ);g.addColorStop(0,rgb(w.sky1));g.addColorStop(1,rgb(w.sky2));x.fillStyle=g;x.fillRect(0,0,W,HZ);
// sun/moon
const sx=300+t*6,sy=120+Math.sin(t*.13)*30;x.fillStyle=`rgba(255,240,200,${Math.max(0,1-w.rain*1.3)*.9})`;x.beginPath();x.arc(sx%W,sy,34,0,7);x.fill();
// clouds
for(let i=0;i<9;i++){const cx=((i*190-t*(10+i*2))%(W+300)+W+300)%(W+300)-150,cy=60+R(i)*130;x.fillStyle=`rgba(${lc([255,255,255],[90,95,110],w.dark)},${.4+w.fog})`;for(let j=0;j<4;j++){x.beginPath();x.ellipse(cx+j*35,cy+Math.sin(j)*8,50,22,0,0,7);x.fill()}}
fuji(s,w);mountain(s*.15,HZ-20,90,rgb(lc([70,105,95],[40,48,55],w.dark)),1);mountain(s*.25,HZ-5,50,rgb(lc([50,90,70],[30,40,40],w.dark)),4);shore(s,w,t,true);
x.fillStyle=`rgba(${lc([230,230,240],[110,115,130],w.dark)},${w.fog*.6})`;x.fillRect(0,HZ-90,W,90)}
function draw(T){const t=((T-t0)/1000%DUR+DUR)%DUR;const w=wx(t);x.save();x.beginPath();x.rect(0,0,W,HZ);x.clip();scene(t,w);x.restore();
// reflection
x.save();x.translate(0,2*HZ);x.scale(1,-1);x.beginPath();x.rect(0,HZ,W,HZ);x.clip();scene(t,w);x.restore();
// water tint & ripple distortion
const wg=x.createLinearGradient(0,HZ,0,H);wg.addColorStop(0,`rgba(${lc([30,70,110],[15,25,40],w.dark)},.45)`);wg.addColorStop(1,`rgba(${lc([10,40,70],[5,10,20],w.dark)},.9)`);x.fillStyle=wg;x.fillRect(0,HZ,W,H-HZ);
for(let y=HZ;y<H;y+=3){const d=(y-HZ)/(H-HZ);const sh=Math.sin(y*.15+t*3)*(2+d*10)*(1+w.rain);x.drawImage(cv,0,y,W,3,sh,y,W,3)}
x.strokeStyle=`rgba(255,255,255,${.12+w.rain*.1})`;x.lineWidth=1;for(let i=0;i<70;i++){const d=R(i*3);const y=HZ+d*d*(H-HZ);const X=((R(i)*W-t*60*(.3+d))%W+W)%W;x.beginPath();x.moveTo(X,y);x.lineTo(X+10+d*40,y);x.stroke()}
shore(t*60,w,t,false);
// boat
const bx=560,by=560+Math.sin(t*1.6)*5,ang=Math.sin(t*1.2)*.03*(1+w.rain*2);
x.save();x.translate(bx,by);x.rotate(ang);x.fillStyle='rgba(0,0,0,.25)';x.beginPath();x.ellipse(0,18,170,14,0,0,7);x.fill();
x.fillStyle='#5a3418';x.beginPath();x.moveTo(-170,-10);x.quadraticCurveTo(-120,25,0,25);x.quadraticCurveTo(140,25,190,-30);x.lineTo(150,-8);x.lineTo(-150,-8);x.fill();x.fillStyle='#7a4a24';x.fillRect(-150,-14,300,8);
// roof cabin
x.fillStyle='#e8dcc0';x.fillRect(-90,-58,110,44);x.fillStyle='#8a1e1e';x.beginPath();x.moveTo(-110,-56);x.quadraticCurveTo(-35,-80,40,-56);x.lineTo(30,-66);x.quadraticCurveTo(-35,-86,-100,-66);x.fill();
x.fillStyle=`rgba(255,190,90,${.6+w.dark*.4})`;x.beginPath();x.arc(30,-60,7,0,7);x.fill();
person(-55,-14,1,'#2f4f6f',t,0);person(-15,-14,1,'#b04a6a',t,1);
// boatman with pole
const pa=Math.sin(t*1.5)*.25;x.save();x.translate(110,-14);person(0,0,1.1,'#4a4a3a',t,2);x.fillStyle='#c9b37a';x.beginPath();x.moveTo(-14,-38);x.lineTo(0,-50);x.lineTo(14,-38);x.fill();x.strokeStyle='#8a6a3a';x.lineWidth=3;x.rotate(pa);x.beginPath();x.moveTo(8,-60);x.lineTo(30,60);x.stroke();x.restore();x.restore();
// wake
x.strokeStyle='rgba(255,255,255,.3)';for(let i=0;i<6;i++){const k=(t*.8+i/6)%1;x.lineWidth=2*(1-k);x.beginPath();x.ellipse(bx-170-k*200,by+15,30+k*60,4+k*6,0,0,7);x.stroke()}
// rain
if(w.rain>.02){x.strokeStyle=`rgba(200,210,230,${.5*w.rain})`;x.lineWidth=1.2;for(let i=0;i<400*w.rain;i++){const X=(R(i)*W+t*200)%W,Y=(R(i+7)*H+t*900*(.8+R(i)*.4))%H;x.beginPath();x.moveTo(X,Y);x.lineTo(X-6,Y+18);x.stroke()}
for(let i=0;i<40*w.rain;i++){const k=(t*2+R(i))%1;x.strokeStyle=`rgba(220,230,255,${.4*(1-k)})`;x.beginPath();x.ellipse(R(i*5+Math.floor(t*2+R(i)))*W,HZ+30+R(i*9)*300,k*12,k*3,0,0,7);x.stroke()}}
if(w.rain>.9&&(t*7%11)<.35){x.fillStyle='rgba(230,235,255,.55)';x.fillRect(0,0,W,H)}
if(w.snow>.02){x.fillStyle=`rgba(255,255,255,${.9*w.snow})`;for(let i=0;i<220;i++){const X=(R(i)*W+Math.sin(t+i)*30+t*20)%W,Y=(R(i+3)*H+t*60*(.5+R(i)))%H;x.beginPath();x.arc(X,Y,1+R(i)*2.5,0,7);x.fill()}}
else if(w.rain<.1){for(let i=0;i<40;i++){const X=W-((R(i)*W+t*90)%W),Y=(R(i+2)*H+t*50)%H;x.fillStyle='rgba(255,190,210,.8)';x.save();x.translate(X,Y);x.rotate(t*2+i);x.beginPath();x.ellipse(0,0,4,2,0,0,7);x.fill();x.restore()}}
// vignette & UI
const vg=x.createRadialGradient(W/2,H/2,300,W/2,H/2,800);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,`rgba(0,0,0,${.5+w.dark*.3})`);x.fillStyle=vg;x.fillRect(0,0,W,H);
const ph=[0,10,18,26,34,42].filter(v=>v<=t).length-1;x.fillStyle='rgba(0,0,0,.4)';x.fillRect(W-330,24,306,74);x.fillStyle='#fff';x.textAlign='right';x.font='bold 30px sans-serif';x.fillText('رحلة في اليابان',W-40,58);x.font='20px sans-serif';x.fillStyle='#ffd9a0';x.fillText('الطقس: '+names[ph],W-40,86);
requestAnimationFrame(draw)}
requestAnimationFrame(draw);
</script></body></html>
