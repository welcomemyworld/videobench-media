<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#000;height:100%;overflow:hidden}
canvas{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}
</style></head><body><canvas id="c" width="1280" height="720"></canvas><script>
window.DUR=20;
const c=document.getElementById('c'),x=c.getContext('2d');
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);c.style.width=1280*s+'px';c.style.height=720*s+'px'}
fit();addEventListener('resize',fit);
const q=new URLSearchParams(location.search),off=parseFloat(q.get('t')||0)*1000,t0=performance.now()-off;
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),E=v=>{v=cl(v);return v<.5?4*v*v*v:1-Math.pow(-2*v+2,3)/2};
const eB=v=>{v=cl(v);const c1=1.7,c3=c1+1;return 1+c3*Math.pow(v-1,3)+c1*Math.pow(v-1,2)};
// poster frame
const FX=440,FY=110,FW=400,FH=500;
// shards of frame glass
let R=s=>{s=Math.sin(s*127.1)*43758.5453;return s-Math.floor(s)};
const shards=[];for(let i=0;i<46;i++){const a=R(i)*6.283,sp=200+R(i+9)*700;shards.push({x:FX+R(i+3)*FW,y:FY+R(i+5)*FH,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-200,r:R(i+7)*10-5,s:8+R(i+11)*28,k:i})}
function bg(t){
 const g=x.createRadialGradient(640,360,50,640,360,800);g.addColorStop(0,'#2a1f3a');g.addColorStop(1,'#07050c');x.fillStyle=g;x.fillRect(0,0,1280,720);
 x.strokeStyle='rgba(255,255,255,.04)';x.lineWidth=1;
 for(let i=0;i<40;i++){x.beginPath();x.moveTo(0,i*20+(t*10%20));x.lineTo(1280,i*20+(t*10%20));x.stroke()}
}
function posterContent(t,brk){
 // inner art in poster-local coords centered at 0,0 size FW x FH
 x.fillStyle='#f2e6d0';x.fillRect(-FW/2,-FH/2,FW,FH);
 // sun
 const sy=-60+Math.sin(t)*6;
 x.fillStyle='#ff4b2b';x.beginPath();x.arc(0,sy,110,0,7);x.fill();
 x.fillStyle='#f2e6d0';for(let i=0;i<6;i++)x.fillRect(-120,sy+20+i*16,240,4+i*1.2);
 // mountains
 x.fillStyle='#1d1838';x.beginPath();x.moveTo(-FW/2,120);x.lineTo(-90,0);x.lineTo(-20,70);x.lineTo(70,-20);x.lineTo(FW/2,110);x.lineTo(FW/2,FH/2);x.lineTo(-FW/2,FH/2);x.fill();
 x.fillStyle='#1d1838';x.font='900 54px Helvetica,Arial';x.textAlign='center';x.fillText('BREAK',0,-FH/2+70);
 x.font='700 16px Helvetica,Arial';x.fillStyle='#f2e6d0';x.fillText('OUT OF THE FRAME — 2024',0,FH/2-30);
}
function frame(t,shake,crack){
 x.save();x.translate(640+shake*(R(t*60|0)-.5)*14,360+shake*(R(t*61|0)-.5)*14);
 x.fillStyle='rgba(0,0,0,.5)';x.fillRect(-FW/2-14,-FH/2-6,FW+40,FH+40);
 x.strokeStyle='#c9a35a';x.lineWidth=18;x.strokeRect(-FW/2-9,-FH/2-9,FW+18,FH+18);
 x.strokeStyle='#7a5a24';x.lineWidth=2;x.strokeRect(-FW/2,-FH/2,FW,FH);
 if(crack>0){x.strokeStyle='rgba(255,255,255,.8)';x.lineWidth=1.5;
  for(let i=0;i<10;i++){let a=i*.63+.2,px=30,py=-40;x.beginPath();x.moveTo(px,py);
   for(let j=0;j<5;j++){const l=crack*60*(1+R(i*9+j));px+=Math.cos(a+R(i+j)-.5)*l;py+=Math.sin(a+R(j*3+i)-.5)*l;x.lineTo(px,py)}x.stroke()}}
 x.restore();
}
function draw(now){
 const t=((now-t0)/1000%DUR+DUR)%DUR;
 bg(t);
 const intro=E(t/2),crackT=cl((t-4)/2.5),burst=t-7;
 const fade=1-cl((t-18.5)/1.5);
 x.globalAlpha=intro*fade;
 if(burst<0){
  frame(t,crackT>0?crackT:0,crackT);
  x.save();x.translate(640,360+(1-intro)*40);x.beginPath();x.rect(-FW/2,-FH/2,FW,FH);x.clip();
  x.scale(1+crackT*.04,1+crackT*.04);posterContent(t);x.restore();
  x.fillStyle='rgba(255,255,255,'+(.08+.1*Math.sin(t*3))+')';
  x.beginPath();x.moveTo(FX,FY);x.lineTo(FX+120,FY);x.lineTo(FX,FY+200);x.fill();
  x.fillStyle='#ddd';x.font='300 18px Helvetica,Arial';x.textAlign='center';
  x.globalAlpha=cl(t-1)*cl(4-t)*fade;x.fillText('every frame is a boundary…',640,670);
 }else{
  // empty broken frame drifts back
  const fb=E(burst/2);
  x.save();x.translate(640,360);x.scale(1-fb*.25,1-fb*.25);x.translate(-640,-360);x.globalAlpha=(1-fb*.7)*fade;frame(t,0,1);x.restore();
  x.globalAlpha=fade;
  // shards
  for(const s of shards){const tt=burst;if(tt>4)continue;
   const px=s.x+s.vx*tt,py=s.y+s.vy*tt+300*tt*tt;
   x.save();x.translate(px,py);x.rotate(s.r*tt);x.globalAlpha=cl(1-tt/3)*fade;
   x.fillStyle=s.k%3?'rgba(220,235,255,.5)':'#c9a35a';x.beginPath();x.moveTo(0,-s.s);x.lineTo(s.s*.7,s.s*.5);x.lineTo(-s.s*.5,s.s*.3);x.fill();x.restore()}
  // flash
  x.globalAlpha=cl(1-burst*3)*fade;x.fillStyle='#fff';x.fillRect(0,0,1280,720);x.globalAlpha=fade;
  // poster elements escape: layers expand
  const p=eB(burst/1.6);
  const sc=1+p*.9;
  // big sun breaking out
  const sy=360-60*sc-p*40;
  x.fillStyle='#ff4b2b';x.beginPath();x.arc(640+p*260,sy,110*(1+p*1.2)+Math.sin(t*2)*4,0,7);x.fill();
  x.fillStyle='#07050c';for(let i=0;i<6;i++){x.globalAlpha=.85*fade;x.fillRect(0,sy+30*(1+p)+i*28*(1+p*.5),1280,5+i*2.4)}
  x.globalAlpha=fade;
  // mountains sweep wide
  const my=360+(1-p)*0;x.fillStyle='#1d1838';x.beginPath();
  const w=FW/2*(1+p*2.4);x.moveTo(640-w,my+120+p*160);x.lineTo(640-90*sc,my+p*100);x.lineTo(640-20*sc,my+70+p*100);x.lineTo(640+70*sc,my-20+p*90);x.lineTo(640+w,my+110+p*160);x.lineTo(640+w,800);x.lineTo(640-w,800);x.fill();
  // title explodes letter by letter
  const L='BREAK';x.font='900 '+(54+p*96)+'px Helvetica,Arial';x.textAlign='center';
  for(let i=0;i<5;i++){const lp=eB((burst-.3-i*.08)/1.2),dx=(i-2)*(40+lp*80),dy=-190-lp*0+Math.sin(t*2+i)*lp*6;
   x.save();x.translate(640+dx,360+dy*(1-lp)+lp*(-150));x.rotate((1-lp)*(i-2)*.3);
   x.fillStyle='#000';x.globalAlpha=.4*fade;x.fillText(L[i],6,6);x.globalAlpha=fade;x.fillStyle='#f2e6d0';x.fillText(L[i],0,0);x.restore()}
  const sp=cl((burst-2)/1);x.globalAlpha=sp*fade;x.font='700 22px Helvetica,Arial';x.fillStyle='#f2e6d0';
  x.fillText('OUT OF THE FRAME',640,320+(1-sp)*20);
  x.font='300 18px Helvetica,Arial';x.fillStyle='#ccc';x.globalAlpha=cl((burst-4)/1)*fade;x.fillText('…until it isn\'t.',640,670);
 }
 x.globalAlpha=1;
 // vignette
 const v=x.createRadialGradient(640,360,300,640,360,800);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.6)');x.fillStyle=v;x.fillRect(0,0,1280,720);
 requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script></body></html>
