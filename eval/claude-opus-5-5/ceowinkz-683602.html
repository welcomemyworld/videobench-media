<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Winkz Enterprises</title>
<style>html,body{margin:0;background:#000;height:100%;overflow:hidden}canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}</style></head>
<body><canvas id="c" width="1280" height="720"></canvas>
<script>
window.DUR=15;
const c=document.getElementById('c'),x=c.getContext('2d');
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);c.style.width=1280*s+'px';c.style.height=720*s+'px';}
addEventListener('resize',fit);fit();
const q=new URLSearchParams(location.search);const off=parseFloat(q.get('t')||0)||0;const t0=performance.now();
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const eo=v=>1-Math.pow(1-cl(v),3);
const eb=v=>{v=cl(v);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(v-1,3)+c1*Math.pow(v-1,2)};
const ORANGE='#ff9900',NAVY='#0b1730';
const parts=[];for(let i=0;i<120;i++)parts.push({x:Math.random()*1280,y:Math.random()*720,s:Math.random()*2+.5,v:Math.random()*40+10});
function txt(s,X,Y,size,col,al,w='800',a='center'){x.globalAlpha=cl(al);x.fillStyle=col;x.font=w+' '+size+'px Helvetica,Arial,sans-serif';x.textAlign=a;x.textBaseline='middle';x.fillText(s,X,Y);x.globalAlpha=1}
function win(t,a,b){return cl((t-a)/.5)*cl((b-t)/.4)}
function bg(t){
 const g=x.createRadialGradient(640,360,50,640,360,800);g.addColorStop(0,'#16294d');g.addColorStop(1,'#03070f');x.fillStyle=g;x.fillRect(0,0,1280,720);
 x.strokeStyle='rgba(255,153,0,0.07)';x.lineWidth=1;const o=(t*40)%60;
 for(let i=-60;i<1340;i+=60){x.beginPath();x.moveTo(i+o,0);x.lineTo(i+o,720);x.stroke()}
 for(let j=-60;j<780;j+=60){x.beginPath();x.moveTo(0,j+o);x.lineTo(1280,j+o);x.stroke()}
 for(const p of parts){const y=(p.y-t*p.v+7200)%720;x.fillStyle='rgba(255,190,90,'+(.2+p.s*.15)+')';x.fillRect(p.x,y,p.s,p.s)}
}
function smile(cx,cy,w,p,col){x.strokeStyle=col;x.lineWidth=w*.06;x.lineCap='round';x.beginPath();x.moveTo(cx-w/2,cy);x.quadraticCurveTo(cx,cy+w*.28,cx+w/2*eo(p),cy-w*.05*eo(p));x.stroke();
 if(p>.9){x.fillStyle=col;x.beginPath();const ax=cx+w/2,ay=cy-w*.05;x.moveTo(ax+w*.06,ay-w*.04);x.lineTo(ax-w*.08,ay-w*.07);x.lineTo(ax-w*.02,ay+w*.07);x.fill()}}
function box(X,Y,s,r){x.save();x.translate(X,Y);x.rotate(r);x.fillStyle='#c98a4b';x.fillRect(-s/2,-s/2,s,s);x.fillStyle='#a8703a';x.fillRect(-s/2,-s*.08,s,s*.16);x.strokeStyle='#7a4f25';x.lineWidth=2;x.strokeRect(-s/2,-s/2,s,s);smile(0,s*.18,s*.5,1,'#222');x.restore()}
// Scenes
function s1(t){ // 0-3 logo
 const a=win(t,0,3.1);if(a<=0)return;
 const p=eb(t/0.9);x.save();x.translate(640,330);x.scale(p,p);
 x.globalAlpha=a;x.fillStyle=ORANGE;x.beginPath();x.arc(0,-40,70,0,7);x.fill();
 // wink eye
 x.fillStyle=NAVY;x.beginPath();x.arc(-24,-55,9,0,7);x.fill();
 x.strokeStyle=NAVY;x.lineWidth=7;x.lineCap='round';x.beginPath();x.moveTo(14,-55);x.lineTo(36,-55);x.stroke();
 x.restore();
 smile(640,305,90,cl((t-.5)/.6),NAVY);
 const ls='WINKZ';for(let i=0;i<5;i++){const lp=eb((t-.6-i*.08)/.5);txt(ls[i],640-120+i*60,450+(1-lp)*60,80,'#fff',a*cl(lp*2),'900')}
 txt('E N T E R P R I S E S',640,515,26,ORANGE,a*cl((t-1.2)/.5),'700');
 txt('Your Amazon Growth Partner',640,575,28,'#cdd8ee',a*cl((t-1.7)/.5),'400');
}
function s2(t){ // 3-6 problem
 const a=win(t,3,6.1);if(a<=0)return;const l=t-3;
 txt('SELLING ON AMAZON IS HARD.',640,140,54,'#fff',a*cl(l/.4),'900');
 const items=['Unauthorized resellers','Price erosion & MAP violations','Bad listings, lost Buy Box','Stockouts & ranking drops'];
 items.forEach((s,i)=>{const p=eo((l-.4-i*.3)/.4);const y=250+i*85;x.globalAlpha=a*p;x.fillStyle='rgba(255,60,60,.15)';x.fillRect(260-(1-p)*200,y-32,760,64);x.fillStyle='#ff4d4d';x.fillRect(260-(1-p)*200,y-32,6,64);x.globalAlpha=1;txt('✕',300-(1-p)*200,y,32,'#ff4d4d',a*p,'900');txt(s,340-(1-p)*200,y,32,'#fff',a*p,'600','left')});
}
function s3(t){ // 6-9 solution pillars
 const a=win(t,6,9.1);if(a<=0)return;const l=t-6;
 txt('WE FIX THAT.',640,110,64,ORANGE,a*eb(l/.5),'900');
 const P=[['🛡','Brand Protection','MAP enforced, zero rogue sellers'],['📈','Listing Optimization','A+ content, SEO, PPC'],['📦','FBA Logistics','Prime-ready, always in stock'],['🤝','Wholesale Buyer','We buy inventory upfront']];
 P.forEach((p,i)=>{const e=eb((l-.3-i*.18)/.5);const X=190+i*300,Y=380+(1-e)*300;x.globalAlpha=a*cl(e);
  x.fillStyle='rgba(255,255,255,.06)';x.strokeStyle=ORANGE;x.lineWidth=2;x.beginPath();x.roundRect(X-130,Y-150,260,300,18);x.fill();x.stroke();x.globalAlpha=1;
  x.fillStyle=ORANGE;x.globalAlpha=a*cl(e);x.beginPath();x.arc(X,Y-75,46,0,7);x.fill();x.globalAlpha=1;
  txt(p[0],X,Y-73,44,'#fff',a*cl(e),'400');txt(p[1],X,Y+20,24,'#fff',a*cl(e),'800');
  const w=p[2].split(', ');txt(w[0],X,Y+65,18,'#b8c6e0',a*cl(e),'400');if(w[1])txt(w[1],X,Y+92,18,'#b8c6e0',a*cl(e),'400')});
}
function s4(t){ // 9-12 numbers + chart
 const a=win(t,9,12.1);if(a<=0)return;const l=t-9;
 txt('RESULTS THAT SPEAK',640,90,48,'#fff',a*cl(l/.4),'900');
 const S=[[98,'%','Buy Box Win Rate'],[3.4,'x','Avg. Sales Growth'],[24,'/7','Price Monitoring']];
 S.forEach((s,i)=>{const p=eo((l-.2)/1.4);const v=s[0]%1?(s[0]*p).toFixed(1):Math.round(s[0]*p);const X=230,Y=220+i*140;
  txt(v+s[1],X,Y,74,ORANGE,a*cl((l-i*.15)/.4),'900');txt(s[2],X,Y+50,22,'#cdd8ee',a*cl((l-i*.15)/.4),'500')});
 // chart
 const cx=520,cy=600,cw=640,ch=400;x.globalAlpha=a;x.strokeStyle='rgba(255,255,255,.25)';x.lineWidth=2;x.beginPath();x.moveTo(cx,cy-ch);x.lineTo(cx,cy);x.lineTo(cx+cw,cy);x.stroke();
 const n=12,pr=eo((l-.3)/1.8);
 for(let i=0;i<n;i++){const h=ch*(.12+.8*Math.pow(i/(n-1),1.8))*cl(pr*n-i);x.fillStyle=i==n-1?ORANGE:'rgba(255,153,0,'+(.3+i*.04)+')';x.fillRect(cx+20+i*51,cy-h,36,h)}
 x.strokeStyle='#fff';x.lineWidth=4;x.beginPath();for(let i=0;i<=n*pr;i++){const k=Math.min(i,n-1);const h=ch*(.12+.8*Math.pow(k/(n-1),1.8));const px=cx+38+k*51,py=cy-h-20;i?x.lineTo(px,py):x.moveTo(px,py)}x.stroke();x.globalAlpha=1;
 txt('Revenue with Winkz',cx+170,cy-ch+20,22,'#fff',a*cl(pr*2),'700');
}
function s5(t){ // 12-15 CTA
 const a=cl((t-12)/.4)*cl((15-t)/.3);if(a<=0)return;const l=t-12;
 for(let i=0;i<10;i++){const k=(l*1.2+i*.37)%3;box(80+i*125,-60+k*320,50,l*2+i)}
 x.globalAlpha=a*.85;x.fillStyle=NAVY;x.fillRect(0,200,1280,330);x.globalAlpha=1;
 x.fillStyle=ORANGE;x.fillRect(0,200,1280*eo(l/.6),6);x.fillRect(1280*(1-eo(l/.6)),524,1280,6);
 txt('LET\'S GROW YOUR BRAND',640,280,60,'#fff',a*eb(l/.5),'900');
 txt('— TOGETHER —',640,345,30,ORANGE,a*cl((l-.4)/.4),'700');
 const pulse=1+Math.sin(l*6)*.04*cl(l-1);x.save();x.translate(640,445);x.scale(pulse,pulse);x.globalAlpha=a*cl((l-.8)/.4);x.fillStyle=ORANGE;x.beginPath();x.roundRect(-280,-38,560,76,38);x.fill();x.restore();
 txt('Partner with Winkz Enterprises',640,445,30,NAVY,a*cl((l-.8)/.4),'900');
 txt('Authorized Amazon Wholesale · Brand Protection · Growth',640,620,22,'#cdd8ee',a*cl((l-1.2)/.4),'500');
}
function flash(t){for(const b of [3,6,9,12]){const d=Math.abs(t-b);if(d<.15){x.fillStyle='rgba(255,153,0,'+(.35*(1-d/.15))+')';x.fillRect(0,0,1280,720)}}}
function frame(){
 const t=((performance.now()-t0)/1000+off)%DUR;
 bg(t);s1(t);s2(t);s3(t);s4(t);s5(t);flash(t);
 const v=x.createRadialGradient(640,360,400,640,360,900);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.6)');x.fillStyle=v;x.fillRect(0,0,1280,720);
 x.fillStyle=ORANGE;x.fillRect(0,716,1280*t/DUR,4);
 requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script></body></html>
