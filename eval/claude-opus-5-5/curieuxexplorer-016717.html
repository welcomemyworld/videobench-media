<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>The Broken Message</title>
<style>
html,body{margin:0;background:#000;height:100%;overflow:hidden}
#s{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:0 0}
canvas{display:block}
</style></head><body>
<div id="s"><canvas id="c" width="1280" height="720"></canvas></div>
<script>
const DUR=60;window.DUR=DUR;
const cv=document.getElementById('c'),x=cv.getContext('2d'),S=document.getElementById('s');
function fit(){const k=Math.min(innerWidth/1280,innerHeight/720);S.style.transform=`scale(${k}) translate(-50%,-50%)`;S.style.left='50%';S.style.top='50%';S.style.transform=`translate(-50%,-50%) scale(${k})`;}
addEventListener('resize',fit);fit();
const q=new URLSearchParams(location.search);const off=parseFloat(q.get('t')||0)||0;const t0=performance.now();
const cl=v=>Math.max(0,Math.min(1,v)),ease=v=>v*v*(3-2*v);
function R(i){let s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s);}
function txt(s,X,Y,sz,col,al,a){x.globalAlpha=a===undefined?1:a;x.fillStyle=col||'#fff';x.font=(sz>30?'600 ':'400 ')+sz+'px Helvetica,Arial,sans-serif';x.textAlign=al||'center';x.fillText(s,X,Y);x.globalAlpha=1;}
function fade(t,a,b){return cl((t-a)/0.8)*cl((b-t)/0.8);}
function circ(X,Y,r,c){x.beginPath();x.arc(X,Y,r,0,7);x.fillStyle=c;x.fill();}
function body(cx,cy,k,a){x.globalAlpha=a;x.strokeStyle='#4af';x.lineWidth=2;x.beginPath();x.arc(cx,cy-180*k,40*k,0,7);x.stroke();
x.beginPath();x.moveTo(cx-60*k,cy-130*k);x.lineTo(cx+60*k,cy-130*k);x.lineTo(cx+50*k,cy+40*k);x.lineTo(cx+40*k,cy+220*k);x.lineTo(cx+10*k,cy+220*k);x.lineTo(cx,cy+60*k);x.lineTo(cx-10*k,cy+220*k);x.lineTo(cx-40*k,cy+220*k);x.lineTo(cx-50*k,cy+40*k);x.closePath();x.stroke();
x.fillStyle='rgba(255,170,90,.8)';x.beginPath();x.ellipse(cx+5*k,cy-20*k,38*k,10*k,-.2,0,7);x.fill();x.globalAlpha=1;}
// glucose curve model
function curve(mode,tm){// tm 0..1 over 6h, meal at .1
const m=Math.max(0,tm-.1);let base=90,peak;
if(mode==0){return base+50*m*Math.exp(-m*12)*12*Math.E/1;}
if(mode==1){return 250+Math.min(150,m*500)*(1-Math.exp(-m*6));}
return 120+70*m*Math.exp(-m*7)*7*Math.E/1*.6;}
function graph(t,a){x.globalAlpha=a;const X0=180,Y0=600,W=900,H=380;
x.strokeStyle='#335';x.lineWidth=1;for(let g=0;g<=4;g++){x.beginPath();x.moveTo(X0,Y0-g*H/4);x.lineTo(X0+W,Y0-g*H/4);x.stroke();}
x.fillStyle='rgba(60,200,120,.08)';const y70=Y0-70/400*H,y180=Y0-180/400*H;x.fillRect(X0,y180,W,y70-y180);
txt('70–180 mg/dL',X0+W-6,y180+16,14,'#6c9','right',a);
const p=cl(t);const cols=['#5f9','#f55','#fc4'],nm=['Healthy','Type 1 (no insulin)','Type 1 + insulin'];
for(let mde=0;mde<3;mde++){x.strokeStyle=cols[mde];x.lineWidth=3;x.beginPath();for(let i=0;i<=200*p;i++){const u=i/200;const v=Math.min(400,curve(mde,u));const yy=Y0-v/400*H;i?x.lineTo(X0+u*W,yy):x.moveTo(X0+u*W,yy);}x.globalAlpha=a;x.stroke();
x.fillStyle=cols[mde];x.fillRect(X0+mde*300,Y0+30,16,16);txt(nm[mde],X0+mde*300+24,Y0+44,18,'#ddd','left',a);}
x.strokeStyle='#888';x.setLineDash([5,5]);x.beginPath();x.moveTo(X0+.1*W,Y0);x.lineTo(X0+.1*W,Y0-H);x.stroke();x.setLineDash([]);
txt('🍽 meal',X0+.1*W,Y0-H-8,16,'#ccc','center',a);txt('Same meal · 6 hours',640,170,20,'#9ab','center',a);x.globalAlpha=1;}
function frame(){const now=((performance.now()-t0)/1000+off)%DUR;const t=now;
x.fillStyle='#03060d';x.fillRect(0,0,1280,720);
// ambient particles
for(let i=0;i<70;i++){const px=(R(i)*1280+t*8*(R(i+9)+.2))%1280,py=(R(i+3)*720+Math.sin(t+i)*10);circ(px,py,1+R(i+5)*1.5,'rgba(90,140,255,.15)');}
let a;
// 0-6 title
if((a=fade(t,0,6))>0){txt('THE BROKEN MESSAGE',640,320,64,'#fff','center',a);txt('Type 1 diabetes — from the whole body down to a single molecule',640,380,22,'#9bd','center',a);}
// 6-14 autoimmune: body + pancreas zoom
if((a=fade(t,6,14))>0){const z=1+ease(cl((t-8)/5))*0.6;body(360,380,z*.9,a);
txt('Not caused by sugar, weight or lifestyle.',860,250,28,'#fff','center',a);
txt('It is autoimmune:',860,300,24,'#fc8','center',a);
txt('the immune system destroys the',860,340,22,'#ddd','center',a);txt('insulin-making beta cells in the pancreas.',860,370,22,'#ddd','center',a);
const p=cl((t-9)/4);for(let i=0;i<8;i++){const ang=i*.8+t;const r=100-60*p;circ(860+Math.cos(ang)*r*2,520+Math.sin(ang)*r*.6,9,`rgba(240,80,80,${a})`);}circ(860,520,26*(1-p*.7),`rgba(255,200,90,${a})`);txt('T-cells attack',860,620,18,'#f88','center',a);}
// 14-22 islets & insulin release
if((a=fade(t,14,22))>0){txt('Islets: tiny clusters, ~1–2% of the pancreas',640,90,30,'#fff','center',a);
for(let i=0;i<40;i++){const ang=R(i)*7,r=Math.sqrt(R(i+1))*150;circ(640+Math.cos(ang)*r,380+Math.sin(ang)*r,12,`rgba(255,${180+R(i)*50|0},90,${a*.85})`);}
for(let i=0;i<60;i++){const u=((t-14)*.3+R(i+20))%1;const ang=R(i+40)*7;circ(640+Math.cos(ang)*(150+u*300),380+Math.sin(ang)*(150+u*200),4,`rgba(120,230,255,${a*(1-u)})`);}
txt('Glucose rises → beta cells release insulin',640,630,22,'#9ef','center',a);txt('Insulin: muscle & fat take glucose in · liver releases less',640,665,20,'#bbb','center',a);}
// 22-31 slider intact->broken
if((a=fade(t,22,31))>0){const s=ease(cl((t-23)/6));txt('The signal',640,80,34,'#fff','center',a);
x.globalAlpha=a;x.fillStyle='#223';x.fillRect(340,640,600,8);x.fillStyle='#4cf';circ(340+600*s,644,14,'#fff');x.globalAlpha=1;
txt('INTACT',320,650,18,'#6f9','right',a);txt('BROKEN',960,650,18,'#f66','left',a);
// cell with receptors
x.globalAlpha=a;x.strokeStyle='#8af';x.lineWidth=4;x.beginPath();x.ellipse(640,380,260,160,0,0,7);x.stroke();x.globalAlpha=1;
for(let i=0;i<50;i++){const u=((t*.25)+R(i))%1;const inside=R(i+7)>s;const ang=R(i+2)*7;const rr=inside?380-u*300:330;const px=640+Math.cos(ang+(inside?0:u*.6))*rr*1.1,py=380+Math.sin(ang+(inside?0:u*.6))*rr*.7;circ(px,py,6,`rgba(255,230,90,${a})`);}
for(let i=0;i<25*(1-s);i++){const ang=R(i+60)*7+t*.3;circ(640+Math.cos(ang)*290,380+Math.sin(ang)*190,5,`rgba(120,230,255,${a})`);}
txt(s<.5?'Insulin opens the door — glucose enters':'The fuel is still there. The message is missing.',640,140,24,s<.5?'#9ef':'#f99','center',a);
if(s>.7)txt('Glucose builds up in the blood',640,385,22,'#fc8','center',a*cl((s-.7)*4));}
// 31-39 graph
if((a=fade(t,31,40))>0){txt('Healthy vs Type 1 vs Type 1 + insulin',640,100,32,'#fff','center',a);graph((t-32)/6,a);}
// 40-46 DKA
if((a=fade(t,40,46))>0){txt('Almost no insulin → fat breaks down fast',640,130,28,'#fff','center',a);txt('The liver makes ketones',640,175,24,'#fc8','center',a);
const n=Math.min(120,(t-40)*28);for(let i=0;i<n;i++){circ(240+R(i)*800,240+R(i+3)*300,7,`rgba(255,${120-R(i)*80|0},60,${a*.8})`);}
txt('Diabetic ketoacidosis (DKA) — a medical emergency',640,620,26,'#f66','center',a*cl((t-42)/1));}
// 46-54 therapy & tech
if((a=fade(t,46,54))>0){txt('Insulin therapy replaces a missing signal — it is not a cure',640,90,26,'#fff','center',a);
txt('Too little → glucose rises · Too much → dangerous lows',640,130,20,'#fc8','center',a);
const X0=200,Y0=480,W=620;x.globalAlpha=a;x.strokeStyle='#355';x.strokeRect(X0,Y0-220,W,220);x.fillStyle='rgba(60,200,120,.08)';x.fillRect(X0,Y0-180*0.9,W,110*0.9);
x.strokeStyle='#fc4';x.lineWidth=3;x.beginPath();const p=cl((t-46.5)/6);for(let i=0;i<=100*p;i++){const u=i/100;const v=130+40*Math.sin(u*9)*Math.exp(-u*1.5)+20*Math.sin(u*25)*.3;const yy=Y0-v*0.9;i?x.lineTo(X0+u*W,yy):x.moveTo(X0+u*W,yy);}x.stroke();
for(let i=0;i<=100*p;i+=5){x.fillStyle='#fc4';const u=i/100;const v=130+40*Math.sin(u*9)*Math.exp(-u*1.5)+6*Math.sin(u*25);circ(X0+u*W,Y0-v*.9,3,'#fff');}
x.fillStyle='#2a3a55';x.fillRect(900,280,180,110);x.fillStyle='#9ef';x.font='600 34px Arial';x.textAlign='center';x.fillText(Math.round(130+40*Math.sin(p*9)*Math.exp(-p*1.5))+'',990,345);x.globalAlpha=1;
txt('mg/dL',990,375,14,'#9bd','center',a);txt('CGM',990,270,18,'#fff','center',a);
txt('CGM reads glucose every few minutes',510,540,20,'#ccc','center',a);txt('Pump + AID adjusts insulin automatically',510,575,20,'#ccc','center',a);
for(let i=0;i<5;i++)circ(990+((t*80+i*40)%160)-80,450,4,`rgba(120,230,255,${a})`);txt('AID loop',990,490,16,'#9ef','center',a);}
// 54-60 end
if((a=fade(t,54,60.9))>0){txt('Type 1 diabetes changes the system.',640,320,40,'#fff','center',a);txt("It doesn't define the person.",640,380,36,'#9ef','center',a*cl((t-55.5)));txt('Educational visualization, not medical advice.',640,660,16,'#778','center',a);}
requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script></body></html>
