<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><title>終電のホーム</title>
<style>
html,body{margin:0;background:#000;height:100%;overflow:hidden}
#c{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#000}
</style></head><body><canvas id="c" width="1280" height="720"></canvas>
<script>
const W=1280,H=720,cv=document.getElementById('c'),x=cv.getContext('2d');
window.DUR=46;
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px'}
addEventListener('resize',fit);fit();
const q=new URLSearchParams(location.search),T0=performance.now()-(parseFloat(q.get('t'))||0)*1000;
const FONT='"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP","MS PMincho",serif';
// 9 stills: [start, end, type, cam from, cam to]
const S=[
[0,5,'wide',{x:0,y:0,z:0},{x:-30,y:0,z:.25}],
[5,10,'clock',{x:0,y:0,z:0},{x:20,y:-10,z:.2}],
[10,15,'back',{x:0,y:0,z:0},{x:0,y:0,z:.35}],
[15,20,'man',{x:-20,y:0,z:0},{x:20,y:0,z:.15}],
[20,25,'lips',{x:0,y:0,z:0},{x:0,y:0,z:.2}],
[25,30,'back2',{x:20,y:0,z:0},{x:-20,y:0,z:.4}],
[30,35,'man2',{x:0,y:0,z:.1},{x:0,y:0,z:.35}],
[35,40,'lips2',{x:0,y:0,z:.1},{x:0,y:0,z:.45}],
[40,46,'end',{x:0,y:0,z:0},{x:0,y:0,z:.6}]];
// dialogue: who, start, text, intensity
const D=[
['m',6.2,'……終電、もう出たのか',0.1],
['w',11,'まだ、来るよ'],
['m',16,'すみません、もう電車は来ませんよ',0.3],
['w',20.6,'知ってる'],
['w',26,'あなたを、待ってたの'],
['m',30.5,'だ、誰なんですか……？',0.7],
['w',35.5,'次は、あなたの番'],
['m',40.5,'やめろ、来るな――！',1.4]];
const lerp=(a,b,t)=>a+(b-a)*t,ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function rnd(n){return Math.sin(n*127.1)*43758.5453%1}
function layer(c,d,f){x.save();const s=1+c.z*d;x.translate(W/2,H/2);x.scale(s,s);x.translate(-W/2-c.x*d,-H/2-c.y*d);f();x.restore()}
function lights(t,fl){return fl&&Math.sin(t*37)*Math.sin(t*11)>.6?.25:1}
function station(c,t,fl){
 const L=lights(t,fl);
 layer(c,.3,()=>{const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#05070a');g.addColorStop(1,'#0c1013');x.fillStyle=g;x.fillRect(-200,-200,W+400,H+400);
  x.fillStyle='#1a1f22';x.fillRect(-200,200,W+400,120);});
 layer(c,.6,()=>{ // rails
  x.fillStyle='#050606';x.beginPath();x.moveTo(-300,H+100);x.lineTo(560,330);x.lineTo(600,330);x.lineTo(200,H+100);x.fill();
  x.strokeStyle='#2a2d30';x.lineWidth=2;for(let i=0;i<2;i++){x.beginPath();x.moveTo(-200+i*200,H+100);x.lineTo(565+i*15,330);x.stroke()}});
 layer(c,1,()=>{ // platform
  x.fillStyle=`rgba(70,75,72,${.6*L+.2})`;x.beginPath();x.moveTo(200,H+100);x.lineTo(600,330);x.lineTo(1500,330);x.lineTo(1500,H+100);x.fill();
  x.fillStyle=`rgba(200,170,40,${.6*L})`;x.beginPath();x.moveTo(250,H+100);x.lineTo(605,330);x.lineTo(615,330);x.lineTo(330,H+100);x.fill();
  for(let i=0;i<6;i++){const p=Math.pow(.62,i),px=640+760*p,py=330-260*p;
   x.fillStyle='#202426';x.fillRect(px,py,40*p+4,(H+100-py)*1.0);
   x.fillStyle=`rgba(220,240,230,${.9*L})`;x.fillRect(560+400*p,120-60*p,140*p+10,6*p+2);
   const g=x.createRadialGradient(630+400*p,125-60*p,0,630+400*p,125-60*p,220*p+40);g.addColorStop(0,`rgba(180,220,200,${.25*L})`);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,-200,W+300,H)}});
}
function woman(px,py,s,t){
 x.save();x.translate(px,py);x.scale(s,s);
 x.fillStyle='#0b0b0c';x.beginPath();x.ellipse(0,-150,38,46,0,0,7);x.fill();
 x.beginPath();x.moveTo(-40,-160);x.quadraticCurveTo(-60+Math.sin(t)*3,-20,-50,40);x.lineTo(50,40);x.quadraticCurveTo(60,-20,40,-160);x.fill();
 x.fillStyle='#d8d6cf';x.beginPath();x.moveTo(-55,30);x.lineTo(55,30);x.lineTo(70,200);x.lineTo(-70,200);x.fill();
 x.fillStyle='#0b0b0c';x.fillRect(-38,200,22,80);x.fillRect(16,200,22,80);
 for(let i=0;i<12;i++){x.strokeStyle='rgba(0,0,0,.8)';x.beginPath();x.moveTo(-40+i*7,-150);x.quadraticCurveTo(-40+i*7+Math.sin(t*.7+i)*4,0,-45+i*8,40+i%3*6);x.stroke()}
 x.restore();
}
function man(c,t,shake){
 layer(c,1.4,()=>{const j=shake*(Math.random()-.5)*6;x.save();x.translate(250+j,0);
  x.fillStyle='#08090a';x.beginPath();x.ellipse(0,330,95,110,0,0,7);x.fill();
  x.beginPath();x.moveTo(-230,H+50);x.quadraticCurveTo(-200,460,0,430);x.quadraticCurveTo(200,460,230,H+50);x.fill();
  x.fillStyle='rgba(160,190,180,.25)';x.beginPath();x.ellipse(70,320,22,90,.2,0,7);x.fill();x.restore()});
}
function lips(c,t,talk){
 layer(c,1,()=>{x.fillStyle='#030303';x.fillRect(-200,-200,W+400,H+400);
  const g=x.createRadialGradient(640,430,20,640,430,420);g.addColorStop(0,'#3a2c27');g.addColorStop(1,'#000');x.fillStyle=g;x.fillRect(0,0,W,H);});
 layer(c,1.2,()=>{const o=talk?Math.abs(Math.sin(t*9))*14:2;
  x.fillStyle='#5e0d12';x.beginPath();x.moveTo(500,430);x.quadraticCurveTo(580,380,640,400);x.quadraticCurveTo(700,380,780,430);x.quadraticCurveTo(640,440-o/2,500,430);x.fill();
  x.fillStyle='#120203';x.beginPath();x.moveTo(510,431);x.quadraticCurveTo(640,442+o,770,431);x.quadraticCurveTo(640,432-o*.2,510,431);x.fill();
  x.fillStyle='#6d1016';x.beginPath();x.moveTo(500,432);x.quadraticCurveTo(640,520+o,780,432);x.quadraticCurveTo(640,446+o,500,432);x.fill();
  x.fillStyle='rgba(255,220,220,.18)';x.beginPath();x.ellipse(640,470+o/2,60,8,0,0,7);x.fill();
  x.fillStyle='#000';for(let i=0;i<18;i++){x.fillRect(300+i*40+Math.sin(i)*20,0,14,330+Math.sin(i*3)*80)}});
}
function clock(c,t){station(c,t,0);layer(c,1.3,()=>{x.fillStyle='#111';x.fillRect(460,150,360,150);x.strokeStyle='#333';x.strokeRect(460,150,360,150);
 x.fillStyle='#e04030';x.font='bold 80px monospace';x.textAlign='center';x.fillText(t%1<.5?'0:47':'0 47',640,260);
 x.fillStyle='#999';x.font='26px '+FONT;x.fillText('本日の運転は終了しました',640,340)})}
function draw(t){
 const s=S.find(a=>t>=a[0]&&t<a[1])||S[8],k=ease((t-s[0])/(s[1]-s[0])),c={x:lerp(s[3].x,s[4].x,k),y:lerp(s[3].y,s[4].y,k),z:lerp(s[3].z,s[4].z,k)};
 x.fillStyle='#000';x.fillRect(0,0,W,H);const ty=s[2];
 if(ty=='wide'){station(c,t,0)}
 else if(ty=='clock')clock(c,t);
 else if(ty=='back'){station(c,t,0);layer(c,1,()=>woman(1060,340,.55,t))}
 else if(ty=='man'){station(c,t,0);layer(c,1,()=>woman(1060,340,.6,t));man(c,t,.2)}
 else if(ty=='lips')lips(c,t,t>20.6&&t<22.5);
 else if(ty=='back2'){station(c,t,1);layer(c,1.1,()=>woman(820,380,1.2,t))}
 else if(ty=='man2'){station(c,t,1);layer(c,1,()=>woman(860,370,1.0,t));man(c,t,1)}
 else if(ty=='lips2')lips(c,t,t>35.5&&t<38.5);
 else{const u=t-40;station(c,t,1);layer(c,1,()=>woman(640,420,1.6+u*.5,t));man(c,t,2);
  if(u>3.6){x.fillStyle=`rgba(255,250,230,${Math.max(0,1-(u-3.6)*2)})`;x.fillRect(0,0,W,H)}
  if(u>4.1){x.fillStyle='#000';x.fillRect(0,0,W,H);x.globalAlpha=Math.min(1,(u-4.3));x.fillStyle='#ccc';x.font='40px '+FONT;x.textAlign='center';x.fillText('終電は、もう来ない。',640,370);x.globalAlpha=1}}
 // scene fade
 const e=Math.min(t-s[0],s[1]-t);if(e<.4){x.fillStyle=`rgba(0,0,0,${1-e/.4})`;x.fillRect(0,0,W,H)}
 // grade, vignette, grain
 x.fillStyle='rgba(20,60,50,.12)';x.fillRect(0,0,W,H);
 const v=x.createRadialGradient(640,360,200,640,360,780);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.85)');x.fillStyle=v;x.fillRect(0,0,W,H);
 for(let i=0;i<500;i++){x.fillStyle=`rgba(255,255,255,${Math.random()*.06})`;x.fillRect(Math.random()*W,Math.random()*H,2,2)}
 subs(t);
 if(t<4){x.globalAlpha=Math.min(1,t)*Math.min(1,4-t);x.fillStyle='#ddd';x.font='54px '+FONT;x.textAlign='center';x.fillText('終電のホーム',640,330);x.font='20px '+FONT;x.fillStyle='#888';x.fillText('午前零時四十七分',640,380);x.globalAlpha=1}
}
function subs(t){
 for(let i=0;i<D.length;i++){const d=D[i],end=(D[i+1]?D[i+1][1]:46)-.3;if(t<d[1]||t>end)continue;
  const a=Math.min(1,(end-t)*3);x.globalAlpha=a;x.textAlign='center';x.textBaseline='middle';
  if(d[0]=='w'){const n=Math.floor((t-d[1])/.32)+1,ch=[...d[2]];x.font='36px '+FONT;
   for(let j=0;j<Math.min(n,ch.length);j++){const f=Math.min(1,(t-d[1]-j*.32)/.3);x.fillStyle=`rgba(230,220,215,${f*.9})`;x.shadowColor='#600';x.shadowBlur=12;
    let c=ch[j],y=150+j*46;if('、。'.includes(c)){x.fillText(c,1150+14,y-14)}else if('…ー'.includes(c)){x.save();x.translate(1150,y);x.rotate(Math.PI/2);x.fillText(c,0,0);x.restore()}else x.fillText(c,1150,y)}
   x.shadowBlur=0}
  else{const ch=[...d[2]],amp=d[3]*(1+Math.min(1,(t-d[1])))*3;x.font='38px '+FONT;x.fillStyle='#f2f2f2';x.shadowColor='#000';x.shadowBlur=8;
   const w=38,x0=640-ch.length*w/2+w/2;for(let j=0;j<ch.length;j++)x.fillText(ch[j],x0+j*w+(Math.random()-.5)*amp,640+(Math.random()-.5)*amp);x.shadowBlur=0}
  x.globalAlpha=1}
}
function loop(){const t=((performance.now()-T0)/1000)%window.DUR;draw(t);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
