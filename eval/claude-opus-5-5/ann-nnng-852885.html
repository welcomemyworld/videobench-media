<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Claude — Motion</title>
<style>
html,body{margin:0;background:#000;height:100%;overflow:hidden}
#s{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:0 0}
canvas{display:block}
</style></head><body>
<div id="s"><canvas id="c" width="1280" height="720"></canvas></div>
<script>
window.DUR=15;
const cv=document.getElementById('c'),x=cv.getContext('2d'),st=document.getElementById('s');
function fit(){const k=Math.min(innerWidth/1280,innerHeight/720);st.style.transform=`scale(${k}) translate(-50%,-50%)`;st.style.left='50%';st.style.top='50%';st.style.transform=`translate(-50%,-50%) scale(${k})`;st.style.transformOrigin='50% 50%';}
addEventListener('resize',fit);fit();
const q=new URLSearchParams(location.search),off=parseFloat(q.get('t')||0)||0,t0=performance.now();
const W=1280,H=720,OR='#D97757',CR='#F4EFE6',INK='#1F1E1D';
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),
eo=v=>1-Math.pow(1-cl(v),4),eio=v=>{v=cl(v);return v<.5?8*v*v*v*v:1-Math.pow(-2*v+2,4)/2},
ph=(t,a,b)=>cl((t-a)/(b-a)),back=v=>{v=cl(v);const c=1.9;return 1+(c+1)*Math.pow(v-1,3)+c*Math.pow(v-1,2)};
// seeded particles
let sd=7;const R=()=>(sd=(sd*16807)%2147483647)/2147483647;
const P=[];for(let i=0;i<220;i++)P.push({a:R()*6.283,r:300+R()*600,s:1+R()*3,ray:i%12,d:R()});
function star(cx,cy,r,rot,a,col){x.save();x.translate(cx,cy);x.rotate(rot);x.globalAlpha=a;x.fillStyle=col||OR;
 for(let i=0;i<12;i++){x.rotate(Math.PI/6);const l=r*(i%2?0.78:1);x.beginPath();x.moveTo(-r*.07,0);x.quadraticCurveTo(0,-l*.15,0,-l);x.quadraticCurveTo(0,-l*.15,r*.07,0);x.fill();}
 x.beginPath();x.arc(0,0,r*.12,0,7);x.fill();x.restore();}
function txt(s,X,Y,sz,col,al,wt,ls){x.save();x.globalAlpha=cl(al);x.fillStyle=col;x.font=`${wt||700} ${sz}px Georgia, 'Times New Roman', serif`;x.textAlign='center';x.textBaseline='middle';
 if(ls){x.letterSpacing=ls+'px'}x.fillText(s,X,Y);x.restore();}
function sans(s,X,Y,sz,col,al,al2){x.save();x.globalAlpha=cl(al);x.fillStyle=col;x.font=`600 ${sz}px Helvetica, Arial, sans-serif`;x.textAlign=al2||'center';x.textBaseline='middle';x.fillText(s,X,Y);x.restore();}
function bg(t){
 // background shifts cream->ink->cream
 const dark=cl(ph(t,2.6,3.2))*(1-ph(t,11.6,12.2));
 const g=x.createRadialGradient(W/2,H/2,50,W/2,H/2,800);
 const mix=(a,b)=>{const p=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));const A=p(a),B=p(b);return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*dark)).join(',')})`};
 g.addColorStop(0,mix('#FBF7F0','#2A2826'));g.addColorStop(1,mix('#E9E1D3','#121110'));x.fillStyle=g;x.fillRect(0,0,W,H);
 x.save();x.globalAlpha=.06;x.strokeStyle=dark>.5?'#fff':'#000';x.lineWidth=1;const o=(t*30)%60;
 for(let i=-60;i<W+60;i+=60){x.beginPath();x.moveTo(i+o,0);x.lineTo(i+o,H);x.stroke();}
 for(let j=-60;j<H+60;j+=60){x.beginPath();x.moveTo(0,j+o*.5);x.lineTo(W,j+o*.5);x.stroke();}x.restore();return dark;}
function scene1(t){ // 0-3 particles converge into star + name
 const c=eio(ph(t,0,1.4));
 P.forEach(p=>{const ta=p.ray*Math.PI/6-Math.PI/2,tr=20+p.d*70;
  const a=p.a+(1-c)*t*.6,r=p.r*(1-c)+tr*c,an=a*(1-c)+ta*c;
  x.globalAlpha=(1-ph(t,1.5,1.9))*.9;x.fillStyle=OR;x.beginPath();x.arc(W/2+Math.cos(an)*r,H/2-40+Math.sin(an)*r,p.s,0,7);x.fill();});
 x.globalAlpha=1;
 const s=back(ph(t,1.3,2.0)),out=eio(ph(t,2.5,3.1));
 if(t>1.3){star(W/2-out*0,H/2-40-out*0,90*s*(1+out*8),t*.4,1-out);
  txt('Claude',W/2,H/2+110,84*(1+out),INK,ph(t,1.6,2.1)-out,700,2);}
 // wipe ring
 if(t>2.4){x.save();x.strokeStyle=OR;x.lineWidth=40*(1-out);x.globalAlpha=1-out;x.beginPath();x.arc(W/2,H/2,out*900,0,7);x.stroke();x.restore();}
}
function scene2(t){ // 3-6.4 kinetic words
 const L=t-3,words=['Think','deeper.','Build','faster.'];
 words.forEach((w,i)=>{const s=i*.55,a=eo(ph(L,s,s+.5)),o=eio(ph(L,2.8,3.3));
  const X=W/2+(i%2?120:-120),Y=230+Math.floor(i/2)*190;
  x.save();x.translate(X+(1-a)*(i%2?300:-300),Y-o*400*(i%2?-1:1));
  const col=i%2?OR:CR;txt(w,0,0,120,col,a*(1-o),700);x.restore();});
 // orbiting arcs
 x.save();x.translate(W/2,H/2);x.strokeStyle=OR;x.lineWidth=3;
 for(let i=0;i<3;i++){x.globalAlpha=.5*(1-ph(L,3,3.4))*ph(L,0,.5);x.beginPath();x.arc(0,0,320+i*40,L*(1+i*.5),L*(1+i*.5)+eo(ph(L,0,1.5))*2.5);x.stroke();}
 x.restore();
}
function scene3(t){ // 6.4-9.4 chat + code
 const L=t-6.4,o=eio(ph(L,2.6,3.0)),cx=W/2,y0=110-o*600;
 const a=eo(ph(L,0,.5));
 x.save();x.globalAlpha=a;x.translate(0,(1-a)*80+y0-110);
 // window
 x.fillStyle='#1B1A19';x.strokeStyle='#3a3734';x.lineWidth=2;rr(cx-430,110,860,500,22);x.fill();x.stroke();
 ['#E5655B','#E9B84F','#7BB86F'].forEach((c,i)=>{x.fillStyle=c;x.beginPath();x.arc(cx-400+i*24,140,7,0,7);x.fill();});
 // user bubble
 const ub=eo(ph(L,.3,.7));x.fillStyle=OR;x.globalAlpha=a*ub;rr(cx+410-380*ub,175,380*ub,56,18);x.fill();
 sans('Write a function to sort my data',cx+220,203,19,'#fff',a*ph(L,.6,.8));
 // claude reply typing code
 x.globalAlpha=a;star(cx-395,280,18,L*2,ph(L,.8,1));
 const code=['def sort_data(items, key):','    """Sort items gracefully."""','    return sorted(items,','                  key=lambda i: i[key])','','# ✓ Done — clean, tested, ready.'];
 const n=Math.floor(ph(L,1,2.4)*code.join('').length);let c=0;
 x.font='20px Menlo, Consolas, monospace';x.textAlign='left';x.textBaseline='middle';
 code.forEach((ln,i)=>{const sh=ln.slice(0,cl(n-c,0,ln.length));c+=ln.length;
  x.fillStyle=i==5?'#7BB86F':i==1?'#9C9184':'#F4EFE6';if(i==0&&sh.length>3){x.fillStyle=OR;x.fillText('def',cx-350,290);x.fillStyle=CR;x.fillText(sh.slice(3),cx-350+x.measureText('def').width,290);}
  else x.fillText(sh,cx-350,290+i*42);
  if(n>=c-ln.length&&n<c&&Math.floor(L*4)%2){x.fillStyle=OR;x.fillRect(cx-350+x.measureText(sh).width+2,278+i*42,10,24)}});
 x.restore();
 sans('From idea to working code.',W/2,660-o*600,26,CR,ph(L,1.2,1.7));
}
function rr(X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath();}
function scene4(t){ // 9.4-12.2 capability tiles
 const L=t-9.4,items=[['Write','✎'],['Code','</>'],['Analyze','◔'],['Reason','∞']];
 items.forEach((it,i)=>{const a=back(ph(L,i*.15,i*.15+.6)),o=eio(ph(L,2.2,2.7));
  const X=200+i*293,Y=H/2;x.save();x.translate(X,Y+(1-a)*200);x.rotate((1-a)*.5*(i%2?1:-1)+o*(i-1.5)*.3);x.scale(1-o,1-o);
  x.fillStyle=i==1?OR:'#2E2B28';x.strokeStyle=OR;x.lineWidth=2;rr(-120,-150,240,300,24);x.fill();x.stroke();
  const fl=Math.sin(L*3+i)*6;sans(it[1],0,-40+fl,64,i==1?'#fff':OR,1);txt(it[0],0,80,40,CR,1,700);x.restore();});
 sans('One collaborator. Every task.',W/2,90,30,CR,ph(L,.6,1)-ph(L,2.1,2.4));
}
function scene5(t){ // 12.2-15 end card
 const L=t-12.2,a=back(ph(L,0,.8));
 for(let i=0;i<5;i++){x.save();x.strokeStyle=OR;x.globalAlpha=.25*(1-ph(L,i*.2,i*.2+1.5));x.lineWidth=2;x.beginPath();x.arc(W/2,280,eo(ph(L,i*.2,i*.2+1.5))*500,0,7);x.stroke();x.restore();}
 star(W/2,270,80*a,L*.5+.2,1);
 const p=eo(ph(L,.4,1));x.save();x.beginPath();x.rect(0,340,W,120);x.clip();txt('Claude',W/2,400+(1-p)*120,96,INK,1,700,2);x.restore();
 sans('Your thoughtful AI collaborator.',W/2,480,28,'#6B635A',ph(L,.9,1.4));
 const b=eo(ph(L,1.2,1.7));x.fillStyle=INK;x.globalAlpha=b;rr(W/2-110*b,540,220*b,56,28);x.fill();
 sans('by Anthropic',W/2,568,20,CR,ph(L,1.5,1.8));x.globalAlpha=1;
 x.fillStyle='#000';x.globalAlpha=ph(L,2.5,2.8);x.fillRect(0,0,W,H);x.globalAlpha=1;
}
function frame(){
 const t=((performance.now()-t0)/1000+off)%window.DUR;
 x.globalAlpha=1;bg(t);
 if(t<3.2)scene1(t);
 if(t>3&&t<6.5)scene2(t);
 if(t>6.4&&t<9.5)scene3(t);
 if(t>9.4&&t<12.3)scene4(t);
 if(t>12.2)scene5(t);
 x.fillStyle=OR;x.globalAlpha=1;x.fillRect(0,H-4,W*t/window.DUR,4);
 requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script></body></html>
