<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Interior of a Thought</title>
<style>
html,body{margin:0;background:#000;overflow:hidden;height:100%}
#s{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:0 0}
canvas{position:absolute;left:0;top:0;width:1280px;height:720px}
</style></head><body>
<div id="s"><canvas id="g" width="1280" height="720"></canvas><canvas id="o" width="1280" height="720"></canvas></div>
<script>
window.DUR=48;
const st=document.getElementById('s');
function fit(){const k=Math.min(innerWidth/1280,innerHeight/720);st.style.transform=`scale(${k}) translate(-50%,-50%)`;}
addEventListener('resize',fit);fit();
const q=new URLSearchParams(location.search);const off=parseFloat(q.get('t')||0)||0;
const c=document.getElementById('g');
const gl=c.getContext('webgl',{preserveDrawingBuffer:true,antialias:false});
const vs=`attribute vec2 p;void main(){gl_Position=vec4(p,0,1);}`;
const fs=`precision highp float;
uniform float T;uniform vec2 R;
float sc;
mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
float box(vec3 p){
  vec4 z=vec4(p,1.);vec3 o=p;float s=2.2+0.25*sin(T*.21);
  for(int i=0;i<8;i++){
    z.xyz=clamp(z.xyz,-1.,1.)*2.-z.xyz;
    float r=dot(z.xyz,z.xyz);
    z*=clamp(max(.25/r,.25),0.,1.)*4.;
    z=z*vec4(s/4.)*1.+vec4(o,1.);
    if(i==3)sc=r;
  }
  return (length(z.xyz)-1.5)/abs(z.w)-.0005;
}
float gyro(vec3 p){
  float g=dot(sin(p*1.3),cos(p.yzx*1.3+T*.2));
  return (abs(g)-.12)/2.2;
}
float ocean(vec3 p){
  float h=0.;vec2 q=p.xz;float a=.6;
  for(int i=0;i<5;i++){h+=a*sin(q.x+T*.7)*cos(q.y*1.1-T*.5);q=rot(1.1)*q*1.9;a*=.45;}
  float core=length(p-vec3(0,1.6,8.))-1.2-.15*sin(p.y*6.+T*3.);
  sc=core;
  return min(p.y+1.2-h*.5,core);
}
float W;
float map(vec3 p){
  if(W<1.){vec3 q=p;q.z=mod(q.z+3.,6.)-3.;return box(q*.5)*2.;}
  if(W<2.)return ocean(p);
  return gyro(p);
}
vec3 nrm(vec3 p){vec2 e=vec2(.002,0);return normalize(vec3(map(p+e.xyy)-map(p-e.xyy),map(p+e.yxy)-map(p-e.yxy),map(p+e.yyx)-map(p-e.yyx)));}
vec3 pal(float t,vec3 a,vec3 b){return .5+.5*cos(6.283*(t*a+b));}
void main(){
  vec2 uv=(gl_FragCoord.xy-R*.5)/R.y;
  float t=mod(T,48.);float seg=floor(t/12.);float lt=fract(t/12.);
  W=mod(seg,3.);if(seg>2.5)W=0.;
  vec3 ro,rd;vec3 col=vec3(0);
  float fov=1.1;
  if(seg<0.5){ro=vec3(.3*sin(t*.2),.2*cos(t*.17),t*1.2);}
  else if(seg<1.5){ro=vec3(sin(t*.15)*2.,.8+.3*sin(t*.3),t*1.5-18.);}
  else if(seg<2.5){ro=vec3(sin(t*.1)*3.,cos(t*.13)*3.,t*.9);}
  else{ro=vec3(.3*sin(t*.2),.2*cos(t*.17),t*1.2-lt*lt*6.);fov=1.1+lt*lt*2.;}
  rd=normalize(vec3(uv,fov));
  rd.xy*=rot(t*.05+(seg>2.5?lt*lt*3.:0.));
  rd.xz*=rot(.15*sin(t*.11));
  float d=0.,h;int st=0;vec3 p;float glow=0.;
  for(int i=0;i<110;i++){p=ro+rd*d;h=map(p);glow+=exp(-h*40.)*.01;if(h<.0015*d||d>40.)break;d+=h*.85;st=i;}
  vec3 sky=W<1.?vec3(.02,.01,.04):W<2.?mix(vec3(.9,.45,.25),vec3(.05,.05,.15),clamp(rd.y*3.+.3,0.,1.)):vec3(.01,.02,.03);
  if(d<40.){
    vec3 n=nrm(p);vec3 L=normalize(vec3(.5,.8,-.3));
    float dif=max(dot(n,L),0.);float ao=1.-float(st)/110.;
    float fr=pow(1.-max(dot(-rd,n),0.),3.);
    vec3 base;
    if(W<1.){base=pal(sc*.15+t*.02,vec3(1.,1.,1.),vec3(.0,.33,.67))*.9;}
    else if(W<2.){vec3 rf=reflect(rd,n);base=mix(vec3(.03),mix(vec3(.9,.5,.3),vec3(.1,.1,.2),clamp(rf.y*3.+.3,0.,1.)),.8+.2*fr);if(sc<.05)base=vec3(1.,.7,.4)*3.;}
    else{base=pal(p.x*.1+p.y*.07+p.z*.05+t*.05,vec3(1.,.8,.6),vec3(.1,.4,.7));base*=1.+2.*smoothstep(.85,1.,sin(p.z*.7+t));}
    col=base*(.25+dif*.9)*ao+fr*.3*base;
    col=mix(col,sky,1.-exp(-d*.06));
  }else col=sky;
  vec3 gc=W<1.?vec3(.4,.6,1.):W<2.?vec3(1.,.6,.3):vec3(.3,1.,.7);
  col+=glow*gc*.7;
  if(seg>2.5){float s=exp(-length(uv)*(8.-lt*7.))*lt*lt*4.;col+=vec3(1.,.95,.9)*s;}
  float fade=smoothstep(0.,.06,lt)*smoothstep(1.,.94,lt);
  if(seg>2.5)fade=smoothstep(0.,.06,lt);
  col*=mix(.15,1.,fade);if(seg>2.5)col=mix(col,vec3(1.),smoothstep(.93,1.,lt));
  col=1.-exp(-col*1.3);col=pow(col,vec3(.4545));
  col*=1.-.35*dot(uv,uv);
  col+=(fract(sin(dot(gl_FragCoord.xy,vec2(12.9,78.2))+T)*43758.5)-.5)*.03;
  gl_FragColor=vec4(col,1);
}`;
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(o));return o;}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);gl.useProgram(pr);
const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const pl=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(pl);gl.vertexAttribPointer(pl,2,gl.FLOAT,false,0,0);
const uT=gl.getUniformLocation(pr,'T'),uR=gl.getUniformLocation(pr,'R');
const o=document.getElementById('o').getContext('2d');
const caps=[["I · SEED","every thought begins as an infinite room"],["II · OCEAN","then it learns to move"],["III · BLOOM","then it learns to grow"],["IV · RETURN","and folds back into a single point of light"]];
const t0=performance.now();
function frame(){
  const T=((performance.now()-t0)/1000+off)%window.DUR;
  gl.viewport(0,0,1280,720);gl.uniform1f(uT,T);gl.uniform2f(uR,1280,720);gl.drawArrays(gl.TRIANGLES,0,3);
  o.clearRect(0,0,1280,720);
  const seg=Math.floor(T/12),lt=(T%12)/12;
  const a=Math.max(0,Math.min(1,(lt-.08)/.08))*Math.max(0,Math.min(1,(.42-lt)/.08));
  if(a>0){
    o.textAlign='center';o.fillStyle=`rgba(255,255,255,${a*.9})`;
    o.font='300 15px Helvetica,Arial,sans-serif';
    o.letterSpacing='8px';o.fillText(caps[seg][0],640,600);
    o.font='italic 300 26px Georgia,serif';o.letterSpacing='1px';
    o.fillText(caps[seg][1],640,640);
  }
  if(T<4){const k=Math.min(1,T/1.2)*Math.min(1,(4-T)/1);o.textAlign='center';o.fillStyle=`rgba(255,255,255,${k})`;o.font='200 44px Helvetica,Arial,sans-serif';o.letterSpacing='18px';o.fillText('INTERIOR OF A THOUGHT',640,370);}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
