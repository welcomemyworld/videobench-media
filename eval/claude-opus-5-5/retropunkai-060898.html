<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>The Sphere – A Brief History</title>
<style>
html,body{margin:0;background:#000;height:100%;overflow:hidden}
#s{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:0 0}
</style></head><body><canvas id="s" width="1280" height="720"></canvas>
<script>
window.DUR=56;
const c=document.getElementById('s'),x=c.getContext('2d');
function fit(){const k=Math.min(innerWidth/1280,innerHeight/720);c.style.transform=`scale(${k}) translate(-50%,-50%)`;c.style.left='50%';c.style.top='50%';c.style.transformOrigin='0 0';c.style.translate=`${-640*k}px ${-360*k}px`;c.style.transform=`scale(${k})`;}
addEventListener('resize',fit);fit();
// GSAP-style ease library
const E={
 power2:t=>1-(1-t)*(1-t),
 power4:t=>1-Math.pow(1-t,4),
 inOut:t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,
 back:t=>{const s=1.9;return 1+(s+1)*Math.pow(t-1,3)+s*Math.pow(t-1,2)},
 elastic:t=>t<=0?0:t>=1?1:Math.pow(2,-10*t)*Math.sin((t*10-.75)*2*Math.PI/3)+1,
 bounce:t=>{const n=7.5625,d=2.75;if(t<1/d)return n*t*t;if(t<2/d)return n*(t-=1.5/d)*t+.75;if(t<2.5/d)return n*(t-=2.25/d)*t+.9375;return n*(t-=2.625/d)*t+.984375}
};
const cl=v=>v<0?0:v>1?1:v;
const P=(t,a,b)=>cl((t-a)/(b-a));
const tw=(t,a,d,e='power4')=>E[e](P(t,a,a+d));
const off=parseFloat(new URLSearchParams(location.search).get('t'))||0;
const t0=performance.now()-off*1000;
const BG1='#0b0f2a',ACC='#7cf7ff',PINK='#ff4fb8',YEL='#ffd84a',GRN='#88ff66';
// sphere points
function sphere(cx,cy,R,rot,opt){
 const {build=1,mode='wire',col=ACC,lit=0,t=0,img=null}=opt;
 const lats=18,lons=36;
 x.save();
 if(mode==='wire'){
  x.strokeStyle=col;x.lineWidth=1.5;
  for(let i=1;i<lats;i++){const la=-Math.PI/2+i*Math.PI/lats;const h=(Math.sin(la)+1)/2;if(1-h>build)continue;
   const y=cy+Math.sin(la)*R*-1,r=Math.cos(la)*R;x.globalAlpha=.8;x.beginPath();x.ellipse(cx,y,r,r*.18,0,0,Math.PI*2);x.stroke();}
  for(let j=0;j<lons/2;j++){const a=j*Math.PI*2/lons+rot;x.globalAlpha=.6;x.beginPath();
   for(let i=0;i<=40;i++){const la=-Math.PI/2+i*Math.PI/40;const h=(Math.sin(la)+1)/2;if(h>build)break;
    const px=cx+Math.cos(la)*Math.sin(a)*R,py=cy-Math.sin(la)*R;i?x.lineTo(px,py):x.moveTo(px,py);}x.stroke();}
 } else {
  // LED dots
  for(let i=0;i<34;i++){const la=-Math.PI/2+(i+.5)*Math.PI/34;const n=Math.max(6,Math.round(68*Math.cos(la)));
   for(let j=0;j<n;j++){const a=j*Math.PI*2/n+rot;const z=Math.cos(la)*Math.cos(a);if(z<0)continue;
    const px=cx+Math.cos(la)*Math.sin(a)*R,py=cy-Math.sin(la)*R;
    const u=Math.sin(a),v=Math.sin(la);let k=img?img(u,v,t):[80,90,120];
    const on=cl(lit*1.6-(1-(v+1)/2)*.6);
    x.fillStyle=on>0?`rgb(${k[0]*on+30*(1-on)|0},${k[1]*on+35*(1-on)|0},${k[2]*on+45*(1-on)|0})`:'#222838';
    x.globalAlpha=.4+.6*z;x.beginPath();x.arc(px,py,R*.022*(.5+.5*z),0,7);x.fill();}}
 }
 x.restore();
}
const eye=(u,v,t)=>{const dx=u-Math.sin(t*.8)*.25,dy=v-.05;const d=Math.hypot(dx,dy*1.2);
 if(d<.13)return[10,10,10];if(d<.33)return[60,140+80*Math.sin(d*40),255];if(d<.8)return[255,250,245];return[240,190,180];};
const plasma=(u,v,t)=>{const s=Math.sin(u*6+t*2)+Math.sin(v*7-t*1.5)+Math.sin((u+v)*5+t);return[128+127*Math.sin(s),128+127*Math.sin(s+2),128+127*Math.sin(s+4)];};
const earth=(u,v,t)=>{const s=Math.sin(u*4+t)*Math.cos(v*3)+Math.sin(u*9-v*5);return s>.5?[60,170,80]:[30,90,220];};
function txt(s,X,Y,sz,col='#fff',al='center',w='800',a=1){x.save();x.globalAlpha=a;x.fillStyle=col;x.font=`${w} ${sz}px Helvetica,Arial,sans-serif`;x.textAlign=al;x.textBaseline='middle';x.fillText(s,X,Y);x.restore();}
function pill(s,X,Y,col,a){x.save();x.globalAlpha=a;x.font='800 22px Helvetica,Arial';const w=x.measureText(s).width+36;x.fillStyle=col;x.beginPath();x.roundRect(X-w/2,Y-20,w,40,20);x.fill();x.restore();txt(s,X,Y,22,'#0b0f2a','center','800',a);}
function ground(a){x.save();x.globalAlpha=a;x.fillStyle='#141a3f';x.fillRect(0,560,1280,160);x.strokeStyle='#26306a';
 for(let i=-20;i<20;i++){x.beginPath();x.moveTo(640+i*30,560);x.lineTo(640+i*120,720);x.stroke();}x.restore();}
function bg(t){const g=x.createLinearGradient(0,0,0,720);g.addColorStop(0,BG1);g.addColorStop(1,'#1d1450');x.fillStyle=g;x.fillRect(0,0,1280,720);
 x.fillStyle='#fff';for(let i=0;i<70;i++){x.globalAlpha=.3+.3*Math.sin(t*2+i);x.fillRect((i*197)%1280,(i*89)%420,2,2);}x.globalAlpha=1;}
function yearTag(y,t,a){const k=tw(t,a,.8,'back');txt(y,90,80,64*k,YEL,'left','900',k>0?1:0);}
function caption(s,sub,t,a){const k=tw(t,a,.7);txt(s,640,620+30*(1-k),40,'#fff','center','900',k);if(sub)txt(sub,640,668+30*(1-tw(t,a+.2,.7)),24,'#b9c3ff','center','500',tw(t,a+.2,.7));}
function draw(T){
 const t=T%DUR;bg(t);
 if(t<6){ // title
  const k=tw(t,.2,1.5,'elastic');sphere(640,330,170*k,t*.5,{mode:'wire',build:1,col:ACC});
  'THE SPHERE'.split('').forEach((ch,i)=>{const e=tw(t,1.4+i*.07,.8,'back');txt(ch,640-250+i*55,330,90*e,'#fff','center','900',e>0?1:0)});
  caption('A brief history, from blueprint to icon','Las Vegas · 2018 → today',t,2.4);
 } else if(t<14){ const s=t-6;ground(1);yearTag('2018',s,.2);
  // blueprint grid
  x.save();x.globalAlpha=tw(s,.3,1)*.25;x.strokeStyle=ACC;for(let i=0;i<1280;i+=40){x.beginPath();x.moveTo(i,0);x.lineTo(i,560);x.stroke();}for(let j=0;j<560;j+=40){x.beginPath();x.moveTo(0,j);x.lineTo(1280,j);x.stroke();}x.restore();
  const b=tw(s,1,4,'inOut');sphere(640,370,190,s*.3,{mode:'wire',build:b,col:'#9fd8ff'});
  x.setLineDash([8,6]);x.strokeStyle=YEL;x.globalAlpha=tw(s,3,1);x.beginPath();x.moveTo(860,180);x.lineTo(860,560);x.stroke();x.setLineDash([]);
  txt('366 ft tall',880,370,24,YEL,'left','800',tw(s,3.2,1));txt('516 ft wide',640,150,24,YEL,'center','800',tw(s,3.6,1));
  caption('MSG announces a giant spherical venue','Groundbreaking: September 2018, east of the Strip',s,.6);
 } else if(t<22){ const s=t-14;ground(1);
  yearTag(s<4?'2019–20':'2021',s,s<4?.2:4);
  const b=s<3?.15+s*.12:s<4.5?.5:cl(.5+(s-4.5)*.25);
  // steel lattice
  x.save();x.strokeStyle='#c9cfe0';x.lineWidth=2;
  for(let i=0;i<14;i++){const a=-Math.PI*.9+i*Math.PI*.9/7;for(let k=0;k<12;k++){const h=k/12;if(h>b)break;const r=190*Math.cos(Math.asin(h*2-1));const px=640+Math.cos(i*Math.PI/7)*r,py=560-h*380;x.fillStyle='#c9cfe0';x.fillRect(px-2,py-2,4,4);}}
  x.restore();sphere(640,370,190,0,{mode:'wire',build:b,col:'#c9cfe0'});
  // crane
  const cx=950;x.strokeStyle=YEL;x.lineWidth=6;x.beginPath();x.moveTo(cx,560);x.lineTo(cx,120);x.lineTo(cx-330,120);x.moveTo(cx,120);x.lineTo(cx+80,120);x.stroke();
  const hk=cx-150-100*Math.sin(s*.8);x.lineWidth=2;x.beginPath();x.moveTo(hk,120);x.lineTo(hk,220+40*Math.sin(s));x.stroke();x.fillStyle='#ff7a3c';x.fillRect(hk-30,220+40*Math.sin(s),60,14);
  if(s>3&&s<4.6){pill('⏸ 2020: pandemic pauses construction',640,190,PINK,tw(s,3,.4,'back'));}
  caption(s<4?'Steel rises, ring by ring':'Dome structure tops out','',s,s<4?.3:4.2);
 } else if(t<30){ const s=t-22;ground(.6);yearTag('JULY 4, 2023',s,.2);
  const lit=tw(s,.8,3,'inOut');sphere(640,350,220,s*.15,{mode:'led',lit,img:s<5?plasma:eye,t:s});
  x.globalAlpha=.35*lit;const g=x.createRadialGradient(640,350,200,640,350,380);g.addColorStop(0,'#7cf7ff');g.addColorStop(1,'transparent');x.fillStyle=g;x.fillRect(0,0,1280,720);x.globalAlpha=1;
  pill('1.2 million LED pucks',230,250,ACC,tw(s,2,.6,'back'));pill('580,000 sq ft Exosphere',1050,250,GRN,tw(s,2.4,.6,'back'));
  caption('The Exosphere lights up the skyline','The world’s largest LED screen becomes a canvas',s,1);
 } else if(t<38){ const s=t-30;yearTag('SEPT 29, 2023',s,.2);
  // interior view
  x.save();x.beginPath();x.ellipse(640,330,560,260,0,Math.PI,0);x.lineTo(1200,420);x.lineTo(80,420);x.closePath();x.clip();
  for(let i=0;i<60;i++)for(let j=0;j<18;j++){const k=plasma(i/30-1,j/9-1,s*.7);x.fillStyle=`rgb(${k[0]},${k[1]|0},${k[2]|0})`;x.globalAlpha=tw(s,.5,1.5);x.fillRect(80+i*19,70+j*20,19,20);}x.restore();
  for(let r=0;r<8;r++){x.fillStyle=`rgb(${20+r*4},${15+r*3},${50+r*6})`;x.beginPath();x.ellipse(640,440+r*28,620-r*20,30,0,0,Math.PI*2);x.fill();}
  const n=n0=>Math.round(n0*tw(s,1.5,2.5,'power2')).toLocaleString('en-US');
  txt(n(17600),300,520,54,YEL,'center','900');txt('seats',300,560,22,'#ccd');
  txt(n(16)+'K',640,520,54,ACC,'center','900');txt('interior resolution',640,560,22,'#ccd');
  txt(n(167000),980,520,54,PINK,'center','900');txt('speakers (Holoplot)',980,560,22,'#ccd');
  caption('Opening night: U2 — UV Achtung Baby Live','',s,.6);
 } else if(t<49){ const s=t-38;
  txt('How bands bring shows to life — the GSAP way',640,60,34,'#fff','center','900',tw(s,0,.6));
  txt('A concert is a timeline: every cue is a tween, every beat a keyframe',640,98,22,'#b9c3ff','center','500',tw(s,.3,.6));
  // timeline panel
  const tracks=[['Music',PINK],['Visuals',ACC],['Lights',YEL],['Haptics',GRN]];
  const play=(s-1.5)/8;const ph=cl(play);
  x.fillStyle='rgba(255,255,255,.06)';x.beginPath();x.roundRect(80,140,700,300,16);x.fill();
  tracks.forEach((tr,i)=>{const y=180+i*66;txt(tr[0],100,y,20,'#fff','left','700',tw(s,.5+i*.1,.5));
   for(let k=0;k<5;k++){const bx=210+k*110+i*18,bw=80;const a=tw(s,.8+i*.1+k*.05,.5,'back');x.fillStyle=tr[1];x.globalAlpha=.85;x.beginPath();x.roundRect(bx,y-14,bw*a,28,8);x.fill();}x.globalAlpha=1;});
  const phx=210+ph*560;x.strokeStyle='#fff';x.lineWidth=3;x.beginPath();x.moveTo(phx,150);x.lineTo(phx,430);x.stroke();
  txt('tl.play()',phx,454,18,'#fff','center','700',s>1.5?1:0);
  // stage preview: sphere reacts
  const beat=Math.pow(Math.abs(Math.sin(s*Math.PI*2*1.1)),8);
  sphere(1030,270,140+12*beat,s*.6,{mode:'led',lit:1,img:Math.floor(s/2.5)%2?earth:plasma,t:s});
  // band silhouettes with stagger
  for(let i=0;i<4;i++){const e=tw(s,1+i*.15,.8,'bounce');const bx=920+i*70,by=520-60*(1-e)*0+0;x.globalAlpha=e;x.fillStyle='#000';x.beginPath();x.arc(bx,by-60-beat*6*(i%2),14,0,7);x.fill();x.fillRect(bx-14,by-46-beat*6*(i%2),28,50);x.globalAlpha=1;}
  // ease cards
  const eases=[['power4.out','power4'],['back.out','back'],['elastic.out','elastic'],['stagger: 0.15','bounce']];
  eases.forEach((e,i)=>{const X=180+i*175,Y=560;const a=tw(s,4+i*.4,.6,'back');x.globalAlpha=a;x.strokeStyle='#ffffff40';x.strokeRect(X-70,Y-50,140,100);x.strokeStyle=[PINK,ACC,YEL,GRN][i];x.lineWidth=3;x.beginPath();for(let k=0;k<=30;k++){const u=k/30;const px=X-60+u*120,py=Y+30-E[e[1]](u)*60;k?x.lineTo(px,py):x.moveTo(px,py);}x.stroke();
   const u=((s*.6+i*.2)%1);x.fillStyle='#fff';x.beginPath();x.arc(X-60+u*120,Y+30-E[e[1]](u)*60,6,0,7);x.fill();x.globalAlpha=1;txt(e[0],X,Y+70,18,'#fff','center','700',a);});
  txt('Eases shape the feel · staggers ripple across 1.2M LEDs',1030,640,20,'#b9c3ff','center','600',tw(s,6,.6));
  txt('One master clock keeps sound, light & video in sync',1030,670,20,'#b9c3ff','center','600',tw(s,6.4,.6));
 } else { const s=t-49;ground(.7);yearTag('TODAY',s,.2);
  sphere(640,320,180,s*.3,{mode:'led',lit:1,img:Math.floor(s/2)%2?eye:earth,t:s});
  const L=['U2','Postcard from Earth','Dead & Company','Phish','Eagles','Kenny Chesney','Backstreet Boys','The Wizard of Oz'];
  L.forEach((n,i)=>{const side=i%2?1:-1;const a=tw(s,.6+i*.18,.6,'back');txt(n,640+side*(330+60*(1-a))+0,170+Math.floor(i/2)*85,26,[ACC,PINK,YEL,GRN][i%4],side<0?'right':'left','800',a)});
  caption('From empty lot to the world’s most immersive stage','The Sphere · Las Vegas',s,2.2);
 }
 // scene fades
 const ed=[6,14,22,30,38,49,56];for(const b of ed){const d=Math.abs(t-b);if(d<.3){x.fillStyle=`rgba(0,0,0,${1-d/.3})`;x.fillRect(0,0,1280,720);}}
 if(t<.3){x.fillStyle=`rgba(0,0,0,${1-t/.3})`;x.fillRect(0,0,1280,720);}
}
function loop(){draw((performance.now()-t0)/1000);requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script></body></html>
