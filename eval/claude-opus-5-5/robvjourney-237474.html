<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>No Hands Labs</title>
<style>html,body{margin:0;background:#000;height:100%;overflow:hidden}canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}</style>
</head><body><canvas id="c" width="1280" height="720"></canvas>
<script>
window.DUR=15;
const C=document.getElementById('c'),X=C.getContext('2d'),W=1280,H=720;
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);C.style.width=W*s+'px';C.style.height=H*s+'px'}
addEventListener('resize',fit);fit();
const off=parseFloat(new URLSearchParams(location.search).get('t')||0)||0;
const T0=performance.now();
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),eo=x=>1-Math.pow(1-cl(x),3),eio=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const ACC='#c6ff00',CY='#00f0ff',MG='#ff2e88';
const F='"Arial Black","Helvetica Neue",Impact,sans-serif';
function rnd(i){const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s)}
// sample text points
const N=1400,pts=[];
(function(){const o=document.createElement('canvas');o.width=W;o.height=H;const g=o.getContext('2d');
g.fillStyle='#fff';g.textAlign='center';g.textBaseline='middle';g.font='900 150px '+F;g.fillText('NO HANDS',W/2,300);g.font='900 150px '+F;g.fillText('LABS',W/2,440);
const d=g.getImageData(0,0,W,H).data,c=[];for(let y=0;y<H;y+=4)for(let x=0;x<W;x+=4)if(d[(y*W+x)*4+3]>128)c.push([x,y]);
for(let i=0;i<N;i++)pts.push(c[Math.floor(rnd(i+7)*c.length)]||[W/2,H/2])})();
function grid(t,sp,al){X.save();X.globalAlpha=al;X.strokeStyle=ACC;X.lineWidth=1.5;const hy=H/2;
for(let s=-1;s<=1;s+=2){for(let i=0;i<22;i++){const z=((i-(t*sp)%1)/22);const p=1/(z*z*6+.02);const y=hy+s*Math.min(p*1.3,H);X.globalAlpha=al*cl(1-z)*.8;X.beginPath();X.moveTo(0,y);X.lineTo(W,y);X.stroke()}
X.globalAlpha=al*.5;for(let k=-14;k<=14;k++){X.beginPath();X.moveTo(W/2+k*8,hy);X.lineTo(W/2+k*260,hy+s*H);X.stroke()}}X.restore()}
function slam(txt,t0,t,size,y,col){const k=t-t0;if(k<0)return 0;const e=eo(k/.28);const sc=1+(1-e)*2.4;
X.save();X.translate(W/2,y);X.scale(sc,sc);X.font='900 '+size+'px '+F;X.textAlign='center';X.textBaseline='middle';
const ab=(1-e)*30+ (k<.5?Math.sin(k*90)*4:0);X.globalAlpha=e;X.globalCompositeOperation='lighter';
X.fillStyle=MG;X.fillText(txt,-ab,0);X.fillStyle=CY;X.fillText(txt,ab,0);X.globalCompositeOperation='source-over';X.fillStyle=col;X.fillText(txt,0,0);X.restore();return k<.35?(1-k/.35):0}
function scan(t){X.save();X.globalAlpha=.08;X.fillStyle='#000';for(let y=0;y<H;y+=3)X.fillRect(0,y,W,1);X.restore();
const v=X.createRadialGradient(W/2,H/2,200,W/2,H/2,800);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.85)');X.fillStyle=v;X.fillRect(0,0,W,H)}
function glitch(a,t){if(a<=0)return;for(let i=0;i<8;i++){const y=rnd(Math.floor(t*30)+i)*H,h=4+rnd(i+t)*30,dx=(rnd(i*3+Math.floor(t*40))-.5)*120*a;X.drawImage(C,0,y,W,h,dx,y,W,h)}}
function hud(t,al){X.save();X.globalAlpha=al;X.strokeStyle=ACC;X.lineWidth=2;const m=40,l=40;
[[m,m,1,1],[W-m,m,-1,1],[m,H-m,1,-1],[W-m,H-m,-1,-1]].forEach(([x,y,a,b])=>{X.beginPath();X.moveTo(x+a*l,y);X.lineTo(x,y);X.lineTo(x,y+b*l);X.stroke()});
X.fillStyle=ACC;X.font='700 14px monospace';X.textAlign='left';X.fillText('NHL//SYS '+t.toFixed(2).padStart(5,'0'),m+10,m+28);
X.textAlign='right';X.fillText('HANDS: 0  //  AUTOPILOT: ON',W-m-10,H-m-16);X.restore()}
function frame(){
const t=(((performance.now()-T0)/1000+off)%DUR+DUR)%DUR;
X.globalCompositeOperation='source-over';X.fillStyle='#000';X.fillRect(0,0,W,H);
let shake=0;
// grid
const gA=t<6?cl((t-.2)/1)*.35:t<9?.7:t<12?.5:.3;const sp=t>6&&t<9?3.2:0.8;grid(t,sp,gA);
X.save();
// phase 1: NO / HANDS / LABS
if(t<6){const ex=t>5.4?eio((t-5.4)/.6):0;X.globalAlpha=1-ex;
if(t<.6){X.fillStyle=ACC;X.globalAlpha=(Math.sin(t*80)>0?.9:.1);X.fillRect(W/2-6,H/2-40,12,80)}
shake+=slam('NO',.6,t,170,200,'#fff');shake+=slam('HANDS',1.8,t,190,370,ACC);shake+=slam('LABS',3.2,t,170,540,'#fff');
if(t>3.2){const k=t-3.2;X.strokeStyle=ACC;X.lineWidth=3;for(let r=0;r<3;r++){const rr=eo((k-r*.12)/1)*700;X.globalAlpha=(1-ex)*cl(1-(k-r*.12))*.8;X.beginPath();X.arc(W/2,370,rr,0,7);X.stroke()}}
if(t>4.2){X.globalAlpha=(1-ex)*cl((t-4.2)*3);X.fillStyle='#aaa';X.font='700 22px monospace';X.textAlign='center';X.fillText('> INITIALIZING_HANDS_FREE_MODE'.slice(0,Math.floor((t-4.2)*28)),W/2,650)}}
// phase 2: rapid words
if(t>=6&&t<9){const words=['HANDS-FREE','AUTOMATED','AMPLIFIED','UNSTOPPABLE'];const i=Math.floor((t-6)/.75),k=(t-6)%.75;
const cols=[ACC,'#fff',CY,ACC];X.fillStyle=i%2?ACC:'rgba(0,0,0,0)';if(i%2){X.globalAlpha=.12;X.fillRect(0,0,W,H);X.globalAlpha=1}
const s=1+k*.25;X.translate(W/2,H/2);X.scale(s,s);X.font='900 '+(i==3?120:140)+'px '+F;X.textAlign='center';X.textBaseline='middle';
X.globalAlpha=cl(k*10)*cl((.75-k)*8);X.globalCompositeOperation='lighter';X.fillStyle=MG;X.fillText(words[i],-6,0);X.fillStyle=CY;X.fillText(words[i],6,0);
X.globalCompositeOperation='source-over';X.fillStyle=cols[i];X.fillText(words[i],0,0);X.setTransform(1,0,0,1,0,0);if(k<.12)shake+=.7;
X.globalAlpha=.9;X.fillStyle=ACC;X.fillRect(0,H-6,W*(t-6)/3,6)}
X.restore();
// phase 3+4: particle swarm -> logo
if(t>=8.6){const a=cl((t-8.6)/.5),m=eio((t-10.6)/2.2);X.save();X.globalCompositeOperation='lighter';
for(let i=0;i<N;i++){const ang=i*2.39996+t*(.6+rnd(i)*.8),r=120+rnd(i+3)*260+Math.sin(t*2+i)*20,el=Math.sin(i*.37+t)*.5;
const z=Math.sin(ang)*r;const sx=W/2+Math.cos(ang)*r,sy=H/2+z*.35+el*60;const p=pts[i];
const lm=cl(m*1.3-rnd(i+9)*.3);const x=sx+(p[0]-sx)*lm,y=sy+(p[1]-sy)*lm;
X.globalAlpha=a*(.5+.5*rnd(i+1));X.fillStyle=rnd(i+5)>.75?CY:ACC;const sz=lm>.98?2.6:1.5+(1-lm)*1.5;X.fillRect(x,y,sz,sz)}
X.restore();
if(t<12){X.save();X.translate(W/2,H/2);X.strokeStyle=ACC;X.lineWidth=2;X.globalAlpha=a*(1-m)*.7;
for(let r=0;r<3;r++){X.rotate(t*(r%2?-1:1)*.8);X.setLineDash([40+r*20,25]);X.beginPath();X.arc(0,0,180+r*70,0,7);X.stroke()}X.restore()}}
// final lockup
if(t>=12.4){const k=t-12.4;if(k<.12){X.fillStyle='#fff';X.globalAlpha=1-k/.12;X.fillRect(0,0,W,H);shake+=1}
X.save();X.globalAlpha=cl(k*3);X.font='900 150px '+F;X.textAlign='center';X.textBaseline='middle';X.shadowColor=ACC;X.shadowBlur=30;
X.fillStyle='#fff';X.fillText('NO HANDS',W/2,300);X.fillStyle=ACC;X.fillText('LABS',W/2,440);X.shadowBlur=0;
const w=eo((k-.3)/.6)*520;X.fillStyle=ACC;X.fillRect(W/2-w/2,525,w,4);
X.globalAlpha=cl((k-.6)*3);X.fillStyle='#fff';X.font='700 30px monospace';X.fillText('nohandslabs.com',W/2,580);
X.fillStyle='#888';X.font='700 16px monospace';X.fillText('LOOK MA, NO HANDS.',W/2,625);X.restore()}
// fade out tail
if(t>14.5){X.fillStyle='#000';X.globalAlpha=(t-14.5)/.5;X.fillRect(0,0,W,H);X.globalAlpha=1}
hud(t,t<.4?0:t>14.5?0:.85);
glitch(shake+(t>5.8&&t<6.15?1:0)+(t>8.9&&t<9.1?.8:0),t);
scan(t);
if(shake>0){const s=shake*16;C.style.marginLeft=(rnd(t*99)-.5)*s+'px';C.style.marginTop=(rnd(t*77)-.5)*s+'px'}else{C.style.marginLeft=C.style.marginTop='0'}
requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script></body></html>
