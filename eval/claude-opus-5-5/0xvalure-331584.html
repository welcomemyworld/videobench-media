<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>PayBox</title>
<style>html,body{margin:0;background:#000;height:100%;overflow:hidden}
#c{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}</style></head>
<body><canvas id="c" width="1280" height="720"></canvas>
<script>
window.DUR=15;
const cv=document.getElementById('c'),x=cv.getContext('2d');
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);cv.style.width=1280*s+'px';cv.style.height=720*s+'px'}
fit();addEventListener('resize',fit);
const off=parseFloat(new URLSearchParams(location.search).get('t')||0)||0;
const t0=performance.now()-off*1000;
const cl=v=>Math.max(0,Math.min(1,v));
const eo=v=>1-Math.pow(1-cl(v),3);
const eb=v=>{v=cl(v);const c=1.70158;return 1+(c+1)*Math.pow(v-1,3)+c*Math.pow(v-1,2)};
const ei=v=>{v=cl(v);return v<.5?4*v*v*v:1-Math.pow(-2*v+2,3)/2};
const P1='#5B2EFF',P2='#00D1FF',G='#00E59B';
function rr(px,py,w,h,r){x.beginPath();x.roundRect(px,py,w,h,r)}
function box(cx,cy,s,open,rot){ // logo mark: rounded box with lid
 x.save();x.translate(cx,cy);x.rotate(rot);x.scale(s,s);
 const g=x.createLinearGradient(-60,-60,60,60);g.addColorStop(0,P1);g.addColorStop(1,P2);
 x.fillStyle=g;rr(-60,-40,120,100,22);x.fill();
 x.save();x.translate(-64,-44);x.rotate(-open*0.6);
 x.fillStyle='#fff';rr(0,-6,128,26,12);x.fill();x.restore();
 // P glyph
 x.fillStyle='#fff';x.font='bold 70px Arial';x.textAlign='center';x.textBaseline='middle';x.fillText('P',0,14);
 x.restore();
}
const parts=[...Array(60)].map((_,i)=>({a:i*2.399,s:200+(i*97)%300,r:2+i%4,c:[P1,P2,G][i%3]}));
function frame(){
 const T=((performance.now()-t0)/1000)%DUR;
 x.fillStyle='#07051a';x.fillRect(0,0,1280,720);
 // bg glow
 const bg=x.createRadialGradient(640,360,0,640,360,700);bg.addColorStop(0,'rgba(91,46,255,'+(0.35*eo(T/2))+')');bg.addColorStop(1,'rgba(0,0,0,0)');
 x.fillStyle=bg;x.fillRect(0,0,1280,720);
 // diagonal swipes 0-1.6
 for(let i=0;i<4;i++){const p=ei((T-i*0.12)/1.2);if(p<=0||p>=1)continue;
  x.save();x.translate(640,360);x.rotate(-0.5);x.fillStyle=[P1,P2,G,'#fff'][i];
  x.fillRect(-1600+p*3200-400,-900,400,1800);x.restore();}
 // rings
 for(let i=0;i<3;i++){const p=cl((T-1.5-i*.15)/1.4);if(p>0&&p<1){x.strokeStyle=`rgba(0,209,255,${1-p})`;x.lineWidth=8*(1-p);x.beginPath();x.arc(640,360,40+p*500,0,7);x.stroke();}}
 // particles burst at 1.6
 const pb=T-1.6;if(pb>0&&pb<3)for(const q of parts){const d=eo(pb/2)*q.s;x.globalAlpha=1-pb/3;x.fillStyle=q.c;x.beginPath();x.arc(640+Math.cos(q.a)*d,360+Math.sin(q.a)*d,q.r,0,7);x.fill();}
 x.globalAlpha=1;
 // logo mark: drop in, then slide left
 const sIn=eb((T-1.3)/0.8), slide=ei((T-3.4)/0.9), outp=ei((T-13.6)/0.8);
 const open=Math.sin(cl((T-2.2)/1)*Math.PI);
 const mx=640-slide*230, sc=sIn*(1+0.04*Math.sin(T*3))*(1-outp);
 if(sc>0.01)box(mx,360,sc*1.3,open,(1-sIn)*-1.2);
 // coin pops into box
 const cp=cl((T-2.2)/1);if(cp>0&&cp<1){const cy=300-Math.sin(cp*Math.PI)*160+cp*80;x.globalAlpha=1-cp*cp;x.fillStyle='#FFC93C';x.beginPath();x.ellipse(mx,cy,26*Math.abs(Math.cos(T*8)),26,0,0,7);x.fill();x.globalAlpha=1;}
 // wordmark reveal letter by letter
 const word='PayBox';x.font='bold 120px Arial';x.textBaseline='middle';x.textAlign='left';
 let wx=560;for(let i=0;i<word.length;i++){const p=eb((T-3.8-i*0.08)/0.6)*(1-outp);const ch=word[i];const w=x.measureText(ch).width;
  if(p>0){x.save();x.beginPath();x.rect(wx-5,290,w+10,150);x.clip();x.globalAlpha=cl(p);
   x.fillStyle=i<3?'#fff':P2;x.fillText(ch,wx,360+(1-p)*120);x.restore();}wx+=w;}
 // underline sweep
 const ul=eo((T-4.6)/0.7)*(1-outp);if(ul>0){const g=x.createLinearGradient(560,0,wx,0);g.addColorStop(0,P1);g.addColorStop(1,G);x.fillStyle=g;x.fillRect(560,440,(wx-560)*ul,8);}
 // taglines cycling
 const tags=['Pay instantly.','Send securely.','Get paid. Anywhere.'];
 for(let i=0;i<3;i++){const s=5.4+i*2.3,p=eo((T-s)/0.5),q=ei((T-s-1.9)/0.4);if(p>0&&q<1){x.globalAlpha=p*(1-q);x.fillStyle='#cfd4ff';x.font='36px Arial';x.textAlign='left';x.fillText(tags[i],562,500+(1-p)*30-q*30);}}
 x.globalAlpha=1;
 // final CTA
 const cta=eo((T-12.4)/0.6)*(1-outp);if(cta>0){x.globalAlpha=cta;x.fillStyle=G;rr(562,480,280,56,28);x.fill();x.fillStyle='#07051a';x.font='bold 26px Arial';x.textAlign='center';x.fillText('Download now',702,509);x.globalAlpha=1;}
 // final flash & end logo center
 const fin=ei((T-14.3)/0.4);if(T>14.1){x.fillStyle=`rgba(255,255,255,${Math.max(0,1-Math.abs(T-14.2)*6)})`;x.fillRect(0,0,1280,720);
  if(fin>0)box(640,360,fin*0.9,0,0);}
 // letterbox grain lines
 x.fillStyle='rgba(255,255,255,0.03)';for(let i=0;i<8;i++)x.fillRect(0,(T*200+i*97)%720,1280,1);
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
