(()=>{'use strict';

function font(size,weight=400){ctx.font=`${weight} ${size}px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif`}
function txt(s,x,y,size,color,weight=400,align='left',alpha=1,maxW){ctx.save();ctx.globalAlpha*=clamp(alpha);font(size,weight);ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='alphabetic';if(maxW)ctx.fillText(s,x,y,maxW);else ctx.fillText(s,x,y);ctx.restore()}
function lines(s,x,y,lh,size,color,weight=400,alpha=1){s.split('\n').forEach((v,i)=>txt(v,x,y+i*lh,size,color,weight,'left',alpha))}
function rr(x,y,w,h,r=12){r=Math.max(0,Math.min(r,w/2,h/2));ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
