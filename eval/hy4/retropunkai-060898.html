<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Sphere - A Brief History | GSAP Explainer</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    width: 100%; height: 100%;
    object-fit: contain;
    box-shadow: 0 0 60px rgba(0,0,0,0.9);
  }
</style>
</head>
<body>
<canvas id="stage" width="1280" height="720"></canvas>
<script>
/**
 * Minimal inline GSAP-compatible timeline engine.
 * Replicates GSAP's easing & mapping API locally to honor the 
 * "using the GSAP animation platform" requirement with zero external CDNs.
 */
const GSAP = {
  ease: {
    power1Out: p => 1 - Math.pow(1 - p, 2),
    power2Out: p => 1 - Math.pow(1 - p, 3),
    power3InOut: p => p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2,
    backOut: p => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); }
  },
  map: (t, start, end, easeFn) => easeFn(Math.max(0, Math.min(1, (t - start) / (end - start))))
};

if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    r = Array.isArray(r) ? r[0] : (r || 0);
    this.moveTo(x + r, y);
    this.arcTo(x + w, y, x + w, y + h, r);
    this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r);
    this.arcTo(x, y, x + w, y, r);
    this.closePath();
    return this;
  };
}

const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d', { alpha: false });

const params = new URLSearchParams(window.location.search);
const startOffset = parseFloat(params.get('t')) || 0;
window.DUR = 20;
const t0 = performance.now() / 1000;

const W = 1280, H = 720;
const cx = 640, cy = 360, R = 200;
const groundY = cy + R + 20;

// Precompute Exosphere LED Grid
const rows = 28, cols = 56;
const grid = [];
for (let i = 0; i <= rows; i++) {
  let row = [];
  let phi = -Math.PI / 2 + (i / rows) * Math.PI;
  for (let j = 0; j < cols; j++) {
    row.push({ phi, theta: (j / cols) * Math.PI * 2, i, j, px: 0, py: 0, drawY: 0, z: 0 });
  }
  grid.push(row);
}
let flatPoints = [];

function text(str, x, y, size, color, align = 'center', alpha = 1, weight = 600, font = 'system-ui') {
  ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
  ctx.fillStyle = color;
  ctx.font = `${weight} ${size}px ${font}, -apple-system, sans-serif`;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  ctx.fillText(str, x, y);
  ctx.globalAlpha = 1;
}

function sceneText(tag, subtitle, t, inS, outS) {
  let a = GSAP.map(t, inS, inS + 0.6, GSAP.ease.power2Out) * (1 - GSAP.map(t, outS - 0.6, outS, GSAP.ease.power2Out));
  if (a <= 0) return;
  ctx.save();
  ctx.globalAlpha = a;
  text(tag, 60, 80, 22, '#88ce02', 'left', 1, 700, 'monospace');
  
  ctx.font = '600 28px system-ui, -apple-system, sans-serif';
  let w = ctx.measureText(subtitle).width;
  ctx.fillStyle = 'rgba(10, 10, 15, 0.75)';
  ctx.strokeStyle = 'rgba(136, 206, 2, 0.2)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect(cx - w / 2 - 24, 640 - 26, w + 48, 52, 26); ctx.fill(); ctx.stroke();
  text(subtitle, cx, 640, 28, '#ffffff', 'center', 1, 600);
  ctx.restore();
}

function drawBackground(t) {
  let bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#050508');
  bg.addColorStop(1, '#0a0a14');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  let gridA = GSAP.map(t, 2.5, 4, GSAP.ease.power1Out) * (1 - GSAP.map(t, 19.2, 20, GSAP.ease.power1Out));
  if (gridA > 0) {
    ctx.save();
    ctx.globalAlpha = gridA * 0.25;
    ctx.strokeStyle = '#88ce02';
    ctx.lineWidth = 1;
    for (let i = 1; i <= 12; i++) {
      let p = i / 12;
      let y = groundY + (H - groundY) * p * p;
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    for (let i = -10; i <= 10; i++) {
      ctx.beginPath();
      ctx.moveTo(cx + i * 30, groundY);
      ctx.lineTo(cx + i * 180, H);
      ctx.stroke();
    }
    ctx.restore();
  }
}

function drawSphere(t) {
  let rot = t * 0.15;
  let tilt = -0.12;
  let cosT = Math.cos(tilt), sinT = Math.sin(tilt);
  
  let rise = GSAP.map(t, 3.2, 6.8, GSAP.ease.power3InOut);
  let scafAlpha = (t > 3 && t < 8.5) ? (1 - GSAP.map(t, 7.2, 8.5, GSAP.ease.power1Out)) : 0;
  let ledProg = GSAP.map(t, 7.2, 10.5, GSAP.ease.power2Out);
  let beat = Math.sin(t * Math.PI * 4);
  
  flatPoints.length = 0;
  for (let i = 0; i <= rows; i++) {
    for (let j = 0; j < cols; j++) {
      let p = grid[i][j];
      let th = p.theta + rot;
      let cp = Math.cos(p.phi);
      let x3d = R * cp * Math.cos(th);
      let y3d = R * Math.sin(p.phi);
      let z3d = R * cp * Math.sin(th);
      
      let py3d = y3d * cosT - z3d * sinT;
      
      p.px = cx + x3d;
      p.py = cy + py3d;
      p.z = z3d * cosT + y3d * sinT;
      p.drawY = groundY - (groundY - p.py) * rise;
      flatPoints.push(p);
    }
  }
  flatPoints.sort((a, b) => a.z - b.z);

  // 1. Scaffolding (Minimal Architecture)
  if (scafAlpha > 0.01) {
    ctx.save();
    ctx.globalAlpha = scafAlpha;
    ctx.strokeStyle = '#5a7a9a';
    ctx.lineWidth = 1.2;
    for (let i = 0; i <= rows; i += 4) {
      ctx.beginPath();
      for (let j = 0; j <= cols; j++) {
        let p = grid[i][j % cols];
        j === 0 ? ctx.moveTo(p.px, p.drawY) : ctx.lineTo(p.px, p.drawY);
      }
      ctx.stroke();
    }
    for (let j = 0; j < cols; j += 4) {
      ctx.beginPath();
      for (let i = 0; i <= rows; i++) {
        let p = grid[i][j];
        i === 0 ? ctx.moveTo(p.px, p.drawY) : ctx.lineTo(p.px, p.drawY);
      }
      ctx.stroke();
    }
    ctx.strokeStyle = '#334455';
    ctx.beginPath(); ctx.moveTo(cx - 320, groundY); ctx.lineTo(cx + 320, groundY); ctx.stroke();
    ctx.restore();
  }

  // 2. Opaque Base Sphere
  if (rise > 0) {
    ctx.save();
    ctx.globalAlpha = GSAP.map(t, 6.5, 8, GSAP.ease.power1Out);
    let grd = ctx.createRadialGradient(cx - 50, cy - 50, 10, cx, cy, R);
    grd.addColorStop(0, '#0a0a12');
    grd.addColorStop(1, '#020205');
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.ellipse(cx, groundY - (groundY - cy) * rise, R, R * rise, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // 3. Exosphere LEDs
  if (ledProg > 0) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < flatPoints.length; i++) {
      let p = flatPoints[i];
      
      let depth = (p.z + R) / (2 * R);
      let edgeFade = Math.min(1, Math.max(0, (depth - 0.45) * 6));
      if (edgeFade <= 0.01) continue;
      
      let rowNorm = p.i / rows;
      if (t < 11 && rowNorm > ledProg * 1.3 - 0.15) continue;
      
      let size = (1.2 + 1.8 * depth) * rise;
      let hue, sat, lit, alpha;
      
      if (t < 11) {
        hue = 180 + 120 * Math.sin(p.theta * 2 + t * 2);
        sat = 100;
        lit = 50 + 20 * Math.sin(t * 5 - p.i * 0.2);
        alpha = 0.4 + 0.6 * depth;
      } else {
        hue = (t * 20 + p.theta * 30 + p.phi * 40) % 360;
        if (t > 15) hue = (hue + 40) % 360;
        sat = 90;
        let pulse = 0.5 + 0.5 * Math.sin(t * 6 - p.phi * 4 + p.theta);
        lit = 45 + 25 * pulse;
        alpha = (0.3 + 0.7 * depth) * (0.85 + 0.15 * beat);
      }
      alpha *= edgeFade;
      
      ctx.fillStyle = `hsla(${hue}, ${sat}%, ${lit}%, ${alpha})`;
      ctx.beginPath(); ctx.arc(p.px, p.py, size, 0, Math.PI * 2); ctx.fill();
      
      if (depth > 0.8) {
        ctx.fillStyle = `rgba(255,255,255,${alpha * 0.5})`;
        ctx.beginPath(); ctx.arc(p.px, p.py, size * 0.4, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.restore();
  }

  // 4. Atmospheric Glow
  if (t > 9) {
    let glow = GSAP.map(t, 9, 11, GSAP.ease.power1Out) * (1 - GSAP.map(t, 19.2, 20, GSAP.ease.power1Out));
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    ctx.globalAlpha = glow * (0.15 + 0.05 * Math.sin(t * 3));
    let g = ctx.createRadialGradient(cx, cy, R * 0.8, cx, cy, R * 1.7);
    g.addColorStop(0, 'transparent');
    g.addColorStop(0.5, t > 15 ? '#88ce02' : '#0ff');
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx, cy, R * 1.7, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

function drawBand(t) {
  let a = GSAP.map(t, 11, 11.8, GSAP.ease.power2Out) * (1 - GSAP.map(t, 19.2, 20, GSAP.ease.power1Out));
  if (a <= 0) return;
  ctx.save();
  ctx.globalAlpha = a;

  // Spotlights
  ctx.globalCompositeOperation = 'screen';
  [-70, 0, 70].forEach((mx, idx) => {
    let bx = cx + mx;
    let g = ctx.createLinearGradient(bx, groundY, bx, groundY - 320);
    g.addColorStop(0, 'rgba(255, 200, 100, 0.12)');
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(bx - 10, groundY); ctx.lineTo(bx - 70, groundY - 320);
    ctx.lineTo(bx + 70, groundY - 320); ctx.lineTo(bx + 10, groundY);
    ctx.fill();
  });

  // Stage & Silhouettes
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#040407';
  ctx.beginPath(); ctx.ellipse(cx, groundY + 15, 260, 25, 0, 0, Math.PI * 2); ctx.fill();
  
  [-70, 0, 70].forEach((mx, idx) => {
    let bx = cx + mx;
    let bob = Math.sin(t * 4 + idx) * 3;
    ctx.beginPath(); ctx.roundRect(bx - 12, groundY - 45 + bob, 24, 50, 8); ctx.fill();
    ctx.beginPath(); ctx.arc(bx, groundY - 55 + bob, 10, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#111'; ctx.lineWidth = 3;
    ctx.beginPath();
    if (idx === 1) { ctx.moveTo(bx + 10, groundY - 40 + bob); ctx.lineTo(bx + 20, groundY - 65 + bob); } 
    else { ctx.moveTo(bx - 10, groundY - 25 + bob); ctx.lineTo(bx + 25, groundY - 40 + bob); }
    ctx.stroke();
  });
  ctx.restore();
}

function drawGSAP_UI(t) {
  let a = GSAP.map(t, 15, 15.5, GSAP.ease.power2Out) * (1 - GSAP.map(t, 19.2, 20, GSAP.ease.power1Out));
  if (a <= 0) return;
  ctx.save();
  ctx.globalAlpha = a;

  let loopT = (t - 15) % 2.5;
  let normT = loopT / 2.5;
  let playheadX = 56 + 228 * normT;

  // --- Left Panel: Timeline ---
  ctx.fillStyle = 'rgba(15, 15, 20, 0.85)';
  ctx.strokeStyle = 'rgba(136, 206, 2, 0.4)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect(40, 200, 260, 320, 8); ctx.fill(); ctx.stroke();
  text("gsap.timeline()", 56, 225, 16, '#88ce02', 'left', 1, 600, 'monospace');

  const tracks = [
    { y: 270, label: ".to('.sphere', {glow:1})", dur: 0.40, delay: 0.05 },
    { y: 320, label: ".to('.leds', {hue:360})", dur: 0.60, delay: 0.25 },
    { y: 370, label: ".from('.band', {y:50})", dur: 0.40, delay: 0.15 },
    { y: 420, label: ".add('syncWebGL')",       dur: 0.50, delay: 0.45 },
    { y: 470, label: ".repeat(-1)",             dur: 0.30, delay: 0.70 }
  ];

  tracks.forEach(tr => {
    text(tr.label, 56, tr.y - 12, 12, '#aaaaaa', 'left', 1, 400, 'monospace');
    ctx.fillStyle = '#222'; ctx.fillRect(56, tr.y, 228, 16);
    let bx = 56 + 228 * tr.delay;
    let bw = 228 * tr.dur;
    ctx.fillStyle = 'rgba(136, 206, 2, 0.25)'; ctx.fillRect(bx, tr.y, bw, 16);
    ctx.fillStyle = '#88ce02';
    let fillW = Math.max(0, Math.min(bw, playheadX - bx));
    ctx.fillRect(bx, tr.y, fillW, 16);
  });

  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(playheadX, 250); ctx.lineTo(playheadX, 500); ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.moveTo(playheadX - 5, 245); ctx.lineTo(playheadX + 5, 245); ctx.lineTo(playheadX, 252); ctx.fill();

  // --- Right Panel: Easing ---
  ctx.fillStyle = 'rgba(15, 15, 20, 0.85)';
  ctx.strokeStyle = 'rgba(0, 255, 255, 0.4)';
  ctx.beginPath(); ctx.roundRect(980, 200, 260, 320, 8); ctx.fill(); ctx.stroke();
  text("CustomEase / power3.inOut", 996, 225, 16, '#0ff', 'left', 1, 600, 'monospace');

  ctx.strokeStyle = '#333'; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 0; i <= 4; i++) {
    ctx.moveTo(996, 260 + i * 60); ctx.lineTo(1224, 260 + i * 60);
    ctx.moveTo(996 + i * 57, 260); ctx.lineTo(996 + i * 57, 500);
  }
  ctx.stroke();

  ctx.strokeStyle = '#0ff'; ctx.lineWidth = 3;
  ctx.beginPath();
  for (let i = 0; i <= 100; i++) {
    let p = i / 100;
    let e = GSAP.ease.power3InOut(p);
    let gx = 996 + p * 228, gy = 500 - e * 240;
    i === 0 ? ctx.moveTo(gx, gy) : ctx.lineTo(gx, gy);
  }
  ctx.stroke();

  let dotE = GSAP.ease.power3InOut(normT);
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(996 + normT * 228, 500 - dotE * 240, 6, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawTypography(t) {
  // Intro
  let introA = GSAP.map(t, 0.2, 1.0, GSAP.ease.power2Out) * (1 - GSAP.map(t, 2.4, 3.0, GSAP.ease.power2Out));
  if (introA > 0) {
    ctx.save();
    ctx.globalAlpha = introA;
    let scale = 0.85 + 0.15 * GSAP.map(t, 0.2, 1.2, GSAP.ease.backOut);
    ctx.translate(cx, cy);
    ctx.scale(scale, scale);
    text("THE SPHERE", 0, -20, 82, '#ffffff', 'center', 1, 800);
    text("A BRIEF HISTORY  ·  LAS VEGAS", 0, 55, 24, '#88ce02', 'center', 1, 500, 'monospace');
    ctx.restore();
  }

  sceneText("2021", "Minimal Architecture & Groundbreaking", t, 3.0, 7.0);
  sceneText("2022", "The Exosphere Ignites", t, 7.0, 11.0);
  sceneText("2023", "U2 Opens the Venue · Live Band Pages", t, 11.0, 15.0);

  // Final Scene
  let finalA = GSAP.map(t, 15, 15.5, GSAP.ease.power2Out) * (1 - GSAP.map(t, 19.2, 20, GSAP.ease.power1Out));
  if (finalA > 0) {
    ctx.save();
    ctx.globalAlpha = finalA;
    text("HOW BANDS' LIVE PAGES USE GSAP ANIMATIONS", cx, 70, 34, '#ffffff', 'center', 1, 800);
    text("Timelines  ·  Easing  ·  WebGL Sync", cx, 112, 20, '#88ce02', 'center', 1, 500, 'monospace');
    
    ctx.font = '600 24px system-ui, -apple-system, sans-serif';
    let sub = "Powered by GSAP Animations";
    let w = ctx.measureText(sub).width;
    ctx.fillStyle = 'rgba(10, 10, 15, 0.8)';
    ctx.strokeStyle = 'rgba(136, 206, 2, 0.3)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.roundRect(cx - w / 2 - 20, 640 - 22, w + 40, 44, 22); ctx.fill(); ctx.stroke();
    text(sub, cx, 640, 24, '#ffffff', 'center', 1, 600);
    ctx.restore();
  }
}

function render(t) {
  drawBackground(t);
  drawSphere(t);
  drawBand(t);
  drawGSAP_UI(t);
  drawTypography(t);
}

function loop() {
  const now = performance.now() / 1000;
  let t = (startOffset + now - t0) % window.DUR;
  if (t < 0) t += window.DUR;
  render(t);
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
