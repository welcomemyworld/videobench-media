<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cinematic Rocket Launch</title>
<style>
  body { margin: 0; background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; }
  #stage { width: 1280px; height: 720px; position: relative; transform-origin: center; box-shadow: 0 0 50px rgba(0,0,0,0.8); }
  canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1280" height="720"></canvas></div>
<script>
window.DUR = 30;
const ctx = document.getElementById('c').getContext('2d', {alpha: false});
const sunDir = (() => { let v={x:0.8,y:0.05,z:-0.6}; let l=Math.hypot(v.x,v.y,v.z); return {x:v.x/l,y:v.y/l,z:v.z/l}; })();

// --- Math & Utils ---
function rand(n) { let x = Math.sin(n * 12.9898) * 43758.5453; return x - Math.floor(x); }
function mix(a,b,t) { return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]; }
function rgb(c) { return `rgb(${c[0]|0},${c[1]|0},${c[2]|0})`; }
function sub(a,b){return {x:a.x-b.x,y:a.y-b.y,z:a.z-b.z}}
function add(a,b){return {x:a.x+b.x,y:a.y+b.y,z:a.z+b.z}}
function scale(a,s){return {x:a.x*s,y:a.y*s,z:a.z*s}}
function dot(a,b){return a.x*b.x+a.y*b.y+a.z*b.z}
function cross(a,b){return {x:a.y*b.z-a.z*b.y, y:a.z*b.x-a.x*b.z, z:a.x*b.y-a.y*b.x}}
function norm(a){let l=Math.hypot(a.x,a.y,a.z)||1; return scale(a,1/l)}
function lerp(a,b,t){return {x:a.x+(b.x-a.x)*t, y:a.y+(b.y-a.y)*t, z:a.z+(b.z-a.z)*t}}
function adjust(c, f) { return `rgb(${Math.min(255,c[0]*f+(f>0.8?15:0))|0},${Math.min(255,c[1]*f)|0},${Math.min(255,c[2]*f)|0})`; }

// --- Procedural Sprites ---
function makeGlow(r,g,b) {
   let c=document.createElement('canvas'); c.width=c.height=64; let x=c.getContext('2d');
   let g_=x.createRadialGradient(32,32,0,32,32,32);
   g_.addColorStop(0,`rgba(${r},${g},${b},1)`); g_.addColorStop(0.2,`rgba(${r},${g},${b},0.7)`); g_.addColorStop(1,`rgba(${r},${g},${b},0)`);
   x.fillStyle=g_; x.fillRect(0,0,64,64); return c;
}
function createSmoke(r,g,b) {
   let c=document.createElement('canvas'); c.width=c.height=128; let x=c.getContext('2d');
   for(let i=0;i<25;i++){
      x.fillStyle=`rgba(${r},${g},${b},${0.05+rand(i)*0.1})`; x.beginPath();
      x.arc(30+rand(i*3)*68, 30+rand(i*7)*68, 20+rand(i*11)*35, 0, 7); x.fill();
   }
   let m=x.createRadialGradient(64,64,15,64,64,64);
   m.addColorStop(0,'rgba(0,0,0,1)'); m.addColorStop(1,'rgba(0,0,0,0)');
   x.globalCompositeOperation='destination-in'; x.fillStyle=m; x.fillRect(0,0,128,128); return c;
}
const glowFire=makeGlow(255,180,50), glowSpark=makeGlow(255,240,180), glowSun=makeGlow(255,200,100), glowCore=makeGlow(200,235,255), glowWater=makeGlow(180,220,255);
const smokeDark=createSmoke(120,115,110), smokeLit=createSmoke(255,160,100), smokeWater=createSmoke(180,220,255);

// --- Mesh Generation ---
let platformMesh=[], rocketMesh=[];
function addBox(arr,w,h,d,c,cx,cy,cz){
   let x1=cx-w/2,x2=cx+w/2,y1=cy-h/2,y2=cy+h/2,z1=cz-d/2,z2=cz+d/2;
   let p=[{x:x1,y:y1,z:z1},{x:x2,y:y1,z:z1},{x:x2,y:y2,z:z1},{x:x1,y:y2,z:z1},{x:x1,y:y1,z:z2},{x:x2,y:y1,z:z2},{x:x2,y:y2,z:z2},{x:x1,y:y2,z:z2}];
   let faces=[[0,1,2,3],[5,4,7,6],[4,0,3,7],[1,5,6,2],[3,2,6,7],[4,5,1,0]], sh=[0.8,0.5,0.6,0.9,1.1,0.3];
   for(let i=0;i<6;i++) arr.push({pts:faces[i].map(j=>p[j]), color:adjust(c,sh[i])});
}
function addCylinder(arr,r,h,seg,c,cx,cy,cz){
   let b=[],t=[];
   for(let i=0;i<seg;i++){let a=i/seg*Math.PI*2; b.push({x:cx+Math.cos(a)*r,y:cy,z:cz+Math.sin(a)*r}); t.push({x:cx+Math.cos(a)*r,y:cy+h,z:cz+Math.sin(a)*r});}
   for(let i=0;i<seg;i++){
      let j=(i+1)%seg, a=(i+0.5)/seg*Math.PI*2, f=0.3+0.7*Math.max(0,Math.cos(a)*sunDir.x+Math.sin(a)*sunDir.z);
      arr.push({pts:[b[i],b[j],t[j],t[i]],color:adjust(c,f)});
   }
   arr.push({pts:t,color:adjust(c,1.1)});
}
function addCone(arr,r,h,seg,c,cx,cy,cz){
   let b=[],apex={x:cx,y:cy+h,z:cz};
   for(let i=0;i<seg;i++){let a=i/seg*Math.PI*2; b.push({x:cx+Math.cos(a)*r,y:cy,z:cz+Math.sin(a)*r});}
   for(let i=0;i<seg;i++){
      let j=(i+1)%seg, a=(i+0.5)/seg*Math.PI*2, f=0.3+0.7*Math.max(0,Math.cos(a)*sunDir.x+Math.sin(a)*sunDir.z);
      arr.push({pts:[b[i],b[j],apex],color:adjust(c,f)});
   }
}
function buildScene(){
   addBox(platformMesh,70,4,70,[60,65,75],0,0,0);
   for(let x of [-28,28]) for(let z of [-28,28]) addCylinder(platformMesh,4,25,8,[40,45,50],x,-25,z);
   let tx=-18,tz=-18;
   for(let x of [0,6]) for(let z of [0,6]) addBox(platformMesh,1,75,1,[150,160,170],tx+x,37.5,tz+z);
   for(let y=5;y<75;y+=6){
      addBox(platformMesh,6,0.5,0.5,[120,130,140],tx+3,y,tz); addBox(platformMesh,6,0.5,0.5,[120,130,140],tx+3,y,tz+6);
      addBox(platformMesh,0.5,0.5,6,[120,130,140],tx,y,tz+3); addBox(platformMesh,0.5,0.5,6,[120,130,140],tx+6,y,tz+3);
      addBox(platformMesh,8,0.5,0.5,[110,120,130],tx+3,y+3,tz);
   }
   addCylinder(rocketMesh,3.5,50,16,[235,235,240],0,0,0);
   addCone(rocketMesh,3.5,12,16,[220,60,50],0,50,0);
   addCylinder(rocketMesh,3.55,4,16,[30,30,35],0,36,0);
   addCylinder(rocketMesh,3.55,2,16,[200,50,40],0,12,0);
   addBox(rocketMesh,0.6,40,0.6,[200,200,210],3.4,5,0);
   for(let i=0;i<30;i++){let a=rand(i*31)*Math.PI*2,y=rand(i*37)*45; addBox(rocketMesh,0.8,1.5,0.8,[180,180,190],Math.cos(a)*3.5,y,Math.sin(a)*3.5);}
   for(let i=0;i<4;i++){
      let a=i*Math.PI/2, rot=p=>({x:p.x*Math.cos(a)-p.z*Math.sin(a),y:p.y,z:p.x*Math.sin(a)+p.z*Math.cos(a)});
      let fp=[rot({x:3,y:0,z:0}),rot({x:8,y:0,z:0}),rot({x:8,y:2,z:0}),rot({x:3,y:10,z:0})];
      rocketMesh.push({pts:fp,color:'#ccc'}); rocketMesh.push({pts:[fp[3],fp[2],fp[1],fp[0]],color:'#aaa'});
   }
   for(let i=0;i<3;i++){let a=i/3*Math.PI*2; addCylinder(rocketMesh,1,3,8,[50,50,55],Math.cos(a)*1.5,-3,Math.sin(a)*1.5);}
}
buildScene();

// --- Dynamics & Camera ---
function rocketY(t){ if(t<12) return 0; let d=t-12; return 2*d*d + 0.5*d*d*d; }
function getWave(x,z,t){
   let y = Math.sin(x*0.02+t*1.5)*1.5 + Math.sin(z*0.03-t*1.2)*1.2 + Math.sin((x+z)*0.05+t*2)*0.5;
   let d=Math.hypot(x,z); if(d<100) y+=Math.sin(d*0.2-t*8)*(100-d)/100;
   return {x,y:-10+y,z};
}
function getCamera(t){
   let cam={pos:{x:0,y:0,z:0},target:{x:0,y:0,z:0}}, shake=0;
   if(t<5){ let a=t*0.15+0.5; cam.pos={x:Math.cos(a)*180,y:30,z:Math.sin(a)*180}; cam.target={x:0,y:40,z:0}; }
   else if(t<8){ let p=(t-5)/3,e=p*p*(3-2*p),a0=1.25; cam.pos=lerp({x:Math.cos(a0)*180,y:30,z:Math.sin(a0)*180},{x:25,y:12,z:35},e); cam.target=lerp({x:0,y:40,z:0},{x:0,y:15,z:0},e); }
   else if(t<12){ cam.pos={x:25,y:12,z:35}; cam.target={x:0,y:15,z:0}; if(t>7) shake=Math.min(1,(t-7)*2)*0.5; }
   else if(t<18){ let p=(t-12)/6,rY=rocketY(t); cam.pos={x:25+p*40,y:12+p*10,z:35+p*50}; cam.target={x:0,y:15+rY*0.5,z:0}; shake=Math.max(0,1-p*2)*0.3; }
   else { let rY=rocketY(t); cam.pos={x:65,y:22,z:85}; cam.target={x:0,y:40+rY*0.8,z:0}; }
   if(shake>0){ cam.pos.x+=(Math.sin(t*123)*0.5+Math.sin(t*456)*0.5)*shake; cam.pos.y+=(Math.sin(t*789)*0.5+Math.sin(t*321)*0.5)*shake; }
   return cam;
}

let cam,f,r,u;
function updateCamera(c){ cam=c.pos; f=norm(sub(c.target,cam)); r=norm(cross(f,{x:0,y:1,z:0})); u=cross(r,f); }
function project(p){
   let d=sub(p,cam), rz=dot(d,f); if(rz<1) return null;
   let sc=800/rz; return {x:640+dot(d,r)*sc, y:360-dot(d,u)*sc, z:rz, scale:sc};
}

// --- Rendering Modules ---
function drawSky(t){
   let pitch=Math.asin(f.y), hY=Math.max(0.1,Math.min(1.5, 0.5+(pitch/1.57)*0.9));
   let y0=(hY-0.7)*720, y1=(hY+0.5)*720;
   let g=ctx.createLinearGradient(0,y0,0,y1), dark=Math.min(1,Math.max(0,(t-18)/8));
   g.addColorStop(0,rgb(mix([10,15,40],[0,0,4],dark)));
   g.addColorStop(0.5,rgb(mix([90,45,85],[4,4,12],dark)));
   g.addColorStop(0.7,rgb(mix([230,110,60],[15,8,18],dark)));
   g.addColorStop(1,rgb(mix([200,120,70],[8,12,30],dark)));
   ctx.fillStyle=g; ctx.fillRect(0,0,1280,720);

   let sp=project(add(scale(sunDir,8000),{x:0,y:100,z:0}));
   if(sp&&sp.z>0){
      ctx.globalAlpha=1-dark*0.8; ctx.globalCompositeOperation='lighter';
      ctx.drawImage(glowSun,sp.x-120,sp.y-120,240,240);
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(sp.x,sp.y,18,0,7); ctx.fill();
      ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1;
   }
   if(dark>0){
      ctx.fillStyle='#fff';
      for(let i=0;i<120;i++){
         ctx.globalAlpha=dark*(0.5+0.5*Math.sin(t*3+i));
         ctx.fillRect(rand(i*11)*1280,rand(i*13)*500,rand(i*17)*1.5+0.5,rand(i*17)*1.5+0.5);
      }
      ctx.globalAlpha=1;
   }
}
function drawOcean(t,rq){
   for(let i=0;i<35;i++){
      let r1=i*i*2.5,r2=(i+1)*(i+1)*2.5;
      for(let j=0;j<48;j++){
         let a1=j/48*Math.PI*2,a2=(j+1)/48*Math.PI*2;
         let p1=getWave(r1*Math.cos(a1),r1*Math.sin(a1),t), p2=getWave(r2*Math.cos(a1),r2*Math.sin(a1),t);
         let p3=getWave(r2*Math.cos(a2),r2*Math.sin(a2),t), p4=getWave(r1*Math.cos(a2),r1*Math.sin(a2),t);
         let q1=project(p1),q2=project(p2),q3=project(p3),q4=project(p4);
         if(!q1||!q2||!q3||!q4) continue;
         let n=norm(cross(sub(p4,p1),sub(p2,p1))); if(n.y<0) n=scale(n,-1);
         let diff=Math.max(0,dot(n,sunDir)), h=norm(add(sunDir,norm(sub(cam,p1))));
         let spec=Math.pow(Math.max(0,dot(n,h)),32);
         let ref=(p1.x>0&&p1.z<0)?spec*255*(0.5+0.5*Math.sin(p1.x*0.5+p1.z*0.5+t*5)):spec*150;
         rq.push({z:(q1.z+q2.z+q3.z+q4.z)/4,type:'poly',pts:[q1,q2,q3,q4],stroke:true,
            c:rgb([8+diff*15+ref, 12+diff*25+ref*0.8, 30+diff*40+ref*0.5])});
      }
   }
   for(let x of [-28,28]) for(let z of [-28,28]){
      let p=project({x,y:-9,z}); if(p) rq.push({z:p.z,type:'sprite',p,r:6,c:glowWater,a:0.3+0.1*Math.sin(t*5+x),blend:'lighter'});
   }
}
function renderMesh(mesh,off,rq){
   for(let poly of mesh){
      let pts=poly.pts.map(p=>project({x:p.x,y:p.y+off,z:p.z}));
      if(pts.some(p=>!p)) continue;
      rq.push({z:pts.reduce((s,p)=>s+p.z,0)/pts.length,type:'poly',pts,c:poly.color});
   }
}
function drawParticles(t,rq){
   let ign=Math.min(1,Math.max(0,(t-7)/0.8));
   // Fire
   for(let i=0;i<3000;i++){
      let birth=7+i/400; if(birth>22) break; let age=t-birth;
      if(age<0||age>0.4) continue;
      let r1=rand(i*3),r2=rand(i*3+1),r3=rand(i*3+2),ang=r1*Math.PI*2,rad=r2*3,rY=rocketY(birth);
      let p={x:Math.cos(ang)*(rad+age*10), y:rY+2-(100+r3*50)*age, z:Math.sin(ang)*(rad+age*10)};
      let pp=project(p); if(!pp) continue;
      rq.push({z:pp.z,type:'sprite',p:pp,r:(5+r2*10)*(1+age*5),c:glowFire,a:Math.sin(age/0.4*Math.PI)*ign,blend:'lighter'});
   }
   // Smoke
   for(let i=0;i<1500;i++){
      let birth=7.2+i/100; if(birth>22) break; let age=t-birth;
      if(age<0||age>4) continue;
      let r1=rand(i*5),r2=rand(i*5+1),r3=rand(i*5+2),ang=r1*Math.PI*2,spd=20+r2*40,rY=rocketY(birth);
      let p={x:Math.cos(ang)*spd*age, y:2+rY-20*age+10*age*age, z:Math.sin(ang)*spd*age};
      let pp=project(p); if(!pp) continue;
      let a=Math.sin(age/4*Math.PI)*0.8, sz=10+age*30+r3*20;
      if(p.y>120){
         rq.push({z:pp.z,type:'sprite',p:pp,r:sz*1.5,c:smokeLit,a:a*0.4,blend:'lighter'});
         rq.push({z:pp.z+0.1,type:'sprite',p:pp,r:sz,c:smokeDark,a:a*0.5,blend:'source-over'});
      } else rq.push({z:pp.z,type:'sprite',p:pp,r:sz,c:smokeDark,a:a,blend:'source-over'});
   }
   // Deluge
   for(let i=0;i<800;i++){
      let birth=6.5+i/150; if(birth>14) break; let age=t-birth;
      if(age<0||age>2) continue;
      let r1=rand(i*19),r2=rand(i*19+1),ang=r1*Math.PI*2,spd=20+r2*40;
      let p={x:Math.cos(ang)*spd*age,y:2+30*age-15*age*age,z:Math.sin(ang)*spd*age};
      let pp=project(p); if(!pp) continue;
      rq.push({z:pp.z,type:'sprite',p:pp,r:8+age*15,c:smokeWater,a:Math.sin(age/2*Math.PI)*0.6,blend:'screen'});
   }
   // Sparks
   for(let i=0;i<500;i++){
      let birth=7+i/200, age=t-birth; if(age<0||age>1.5) continue;
      let r1=rand(i*7),r2=rand(i*7+1),ang=r1*Math.PI*2,spd=30+r2*60;
      let p={x:Math.cos(ang)*spd*age,y:12+(r2*40-10)*age-20*age*age,z:Math.sin(ang)*spd*age};
      let pp=project(p); if(!pp) continue;
      rq.push({z:pp.z,type:'sprite',p:pp,r:1.5,c:glowSpark,a:1-age/1.5,blend:'lighter'});
   }
   // Core & Sep Flash
   if(t>7.2&&t<22){
      let p=project({x:0,y:2+rocketY(t)-2,z:0}); if(p){
         let r=15*p.scale*Math.min(1,(t-7.2)*3);
         rq.push({z:p.z-1,type:'sprite',p,r,c:glowCore,a:0.9,blend:'lighter'});
         rq.push({z:p.z-2,type:'sprite',p,r:r*2,c:glowFire,a:0.8,blend:'lighter'});
      }
   }
   if(t>22&&t<22.5){
      let p=project({x:0,y:2+rocketY(t),z:0}); if(p) rq.push({z:p.z,type:'sprite',p,r:30*p.scale,c:glowCore,a:1-(t-22)*2,blend:'lighter'});
   }
}
function drawBloom(t){
   if(t<7||t>22.2) return;
   let inten=Math.min(1,(t-7)*2)*Math.min(1,(22.2-t)*3), p=project({x:0,y:2+rocketY(t),z:0});
   if(p&&p.z>0){
      ctx.globalCompositeOperation='lighter';
      let R=Math.min(1600,500*p.scale), g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,R);
      g.addColorStop(0,`rgba(255,140,40,${0.35*inten})`); g.addColorStop(0.25,`rgba(255,70,20,${0.15*inten})`); g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=g; ctx.fillRect(0,0,1280,720); ctx.globalCompositeOperation='source-over';
   }
}
function drawText(t){
   ctx.font='300 18px "Segoe UI", Arial, sans-serif'; ctx.fillStyle='rgba(255,255,255,0.7)';
   let fade=(a,b)=>Math.min(1,Math.max(0,(t-a)/(b-a)))*Math.min(1,Math.max(0,(b+1-t)));
   if(t<6){ ctx.globalAlpha=fade(0,1)*Math.min(1,6-t); ctx.fillText("A E R O S P A C E   D Y N A M I C S",60,80); ctx.fillText("OCEAN PLATFORM // DAWN",60,110); }
   if(t>6&&t<12){
      ctx.globalAlpha=fade(6,7)*Math.min(1,12-t); ctx.fillStyle='#ffaa55';
      ctx.fillText("T - 00:0"+Math.max(0,Math.floor(12-t)),60,80); ctx.fillStyle='rgba(255,255,255,0.7)'; ctx.fillText("IGNITION SEQUENCE",60,110);
   }
   if(t>12&&t<20){
      ctx.globalAlpha=fade(12,13)*Math.min(1,20-t); let dt=Math.max(0,t-12);
      ctx.fillText("LIFTOFF",60,80); ctx.font='300 14px monospace';
      ctx.fillText("ALT: "+Math.floor(rocketY(t)*10)+" m",60,110); ctx.fillText("VEL: "+Math.floor((4*dt+1.5*dt*dt)*10)+" m/s",60,130);
   }
   if(t>22){ ctx.globalAlpha=fade(22,24); ctx.fillText("STAGE 1 SEPARATION",60,80); }
   ctx.globalAlpha=0.3; ctx.strokeStyle='#fff'; ctx.lineWidth=1; ctx.beginPath();
   ctx.moveTo(40,40);ctx.lineTo(60,40);ctx.moveTo(40,40);ctx.lineTo(40,60); ctx.moveTo(1240,40);ctx.lineTo(1220,40);ctx.moveTo(1240,40);ctx.lineTo(1240,60);
   ctx.moveTo(40,680);ctx.lineTo(60,680);ctx.moveTo(40,680);ctx.lineTo(40,660); ctx.moveTo(1240,680);ctx.lineTo(1220,680);ctx.moveTo(1240,680);ctx.lineTo(1240,660);
   ctx.stroke(); ctx.globalAlpha=1;
}

// --- Main Loop ---
function render(t){
   updateCamera(getCamera(t));
   drawSky(t);
   let rq=[];
   drawOcean(t,rq);
   renderMesh(platformMesh,0,rq);
   renderMesh(rocketMesh,2+rocketY(t),rq);
   
   if(t>16){
      let p1=project({x:0,y:2+rocketY(16),z:0}), p2=project({x:0,y:2+rocketY(t),z:0});
      if(p1&&p2) rq.push({z:99999,type:'line',p1,p2,c:'rgba(255,220,200,0.4)',w:2});
   }
   if(t<11.8){
      let ext=t>11?1-(t-11)/0.8:1;
      for(let i=0;i<4;i++){
         let a=i*Math.PI/2+Math.PI/4, len=12*ext; if(len<=0) continue;
         let p1=project({x:Math.cos(a)*15,y:20,z:Math.sin(a)*15}), p2=project({x:Math.cos(a)*(15-len),y:20,z:Math.sin(a)*(15-len)});
         if(p1&&p2) rq.push({z:(p1.z+p2.z)/2,type:'line',p1,p2,c:'#889',w:4});
      }
   }
   drawParticles(t,rq);
   
   rq.sort((a,b)=>b.z-a.z);
   for(let it of rq){
      if(it.type==='poly'){
         ctx.fillStyle=it.c; ctx.beginPath(); ctx.moveTo(it.pts[0].x,it.pts[0].y);
         for(let i=1;i<it.pts.length;i++) ctx.lineTo(it.pts[i].x,it.pts[i].y);
         ctx.closePath(); ctx.fill();
         if(it.stroke){ ctx.strokeStyle=it.c; ctx.lineWidth=1; ctx.stroke(); }
      } else if(it.type==='sprite'){
         ctx.globalAlpha=it.a; ctx.globalCompositeOperation=it.blend||'source-over';
         let r=it.r*it.p.scale; ctx.drawImage(it.c,it.p.x-r,it.p.y-r,r*2,r*2);
      } else if(it.type==='line'){
         ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1; ctx.strokeStyle=it.c;
         ctx.lineWidth=it.w*it.p1.scale; ctx.beginPath(); ctx.moveTo(it.p1.x,it.p1.y); ctx.lineTo(it.p2.x,it.p2.y); ctx.stroke();
      }
   }
   ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
   drawBloom(t);
   drawText(t);
}

let startTime=performance.now();
let tOffset=parseFloat(new URLSearchParams(location.search).get('t'))||0;
function loop(now){
   render(((now-startTime)/1000+tOffset)%window.DUR);
   requestAnimationFrame(loop);
}
function resize(){
   let s=Math.min(window.innerWidth/1280,window.innerHeight/720);
   document.getElementById('stage').style.transform=`scale(${s})`;
}
window.addEventListener('resize',resize); resize();
requestAnimationFrame(loop);
</script>
