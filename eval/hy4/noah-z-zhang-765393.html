<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nocturne OS — Dark UI Motion</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
canvas{display:block;width:min(100vw,calc(100vh * 16 / 9));height:min(100vh,calc(100vw * 9 / 16));background:#000}
</style>
</head>
<body>
<canvas id="stage" width="1280" height="720"></canvas>
<script>
(()=>{
const W=1280,H=720,DUR=24,BPM=120,BEAT=60/BPM,PH=2,N=12,TAU=Math.PI*2;
window.DUR=DUR;
const canvas=document.getElementById('stage'),ctx=canvas.getContext('2d');
const FONT='Arial, Helvetica, sans-serif',WHITE='#F4F7FB',MUT='rgba(226,236,246,.56)',DIM='rgba(226,236,246,.30)';
const PAL=['#C9FF3D','#7C5CFF','#37E6FF','#FF5C7A','#FFB84D','#4DFFB8'];
const NAMES=['OVERVIEW','TIMELINE','BEAT ENGINE','TYPOGRAPHY','CAMERA RIG','CONTINUITY','GRID SYSTEM','COMPONENTS','MICRO DETAIL','SIGNAL FLOW','STATE MACHINE','LOOP VECTOR'];
const PHRASES=[['DARK','MODE'],['ONE','TIMELINE'],['STRICT','120 BPM'],['PUNCHY','TYPE'],['SNAPPY','CAMERA'],['NO','HARD CUTS'],['GRID','SYSTEM'],['MOTION','PRIMITIVES'],['MICRO','DETAIL'],['SIGNAL','FLOW'],['CONTINUOUS','STATE'],['LOOP','READY']];
const MAIN_TITLES=['ACTIVITY / LIVE SIGNAL','TIMELINE / ONE PASS','BPM ENGINE / 120','TYPE SPECIMEN / KINETIC','CAMERA PATH / SNAP','CONTINUITY MAP','GRID STRUCTURE','COMPONENT STATES','MICRO INTERACTIONS','SIGNAL SPECTRUM','STATE MACHINE','LOOP VECTOR'];
const KEYS=[];
for(let i=0;i<N;i++){const a=TAU*i/N;KEYS.push({x:1500*Math.cos(a),y:850*Math.sin(a),s:.875+.065*Math.sin(a*3+.5),r:.038*Math.sin(a*2)});}
const qParam=parseFloat(new URLSearchParams(location.search).get('t'));
const offset=((isFinite(qParam)?qParam:0)%DUR+DUR)%DUR;
let origin=null;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,u)=>a+(b-a)*u;
const fract=x=>x-Math.floor(x);
const mod=(a,m)=>((a%m)+m)%m;
const easeOutExpo=x=>{x=clamp(x);return x>=1?1:1-Math.pow(2,-10*x)};
function hash(n){const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)}
function rgba(hex,a){const n=parseInt(hex.replace('#',''),16);return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')'}
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath()}
function box(x,y,w,h,r,fill,stroke,lw){rr(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||1;ctx.stroke()}}
function line(x1,y1,x2,y2,color,width){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=color;ctx.lineWidth=width||1;ctx.stroke()}
function circle(x,y,r,fill){ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fillStyle=fill;ctx.fill()}
function text(str,x,y,size,color,weight,align,alpha){ctx.save();ctx.globalAlpha*=alpha===undefined?1:alpha;ctx.font=(weight||600)+' '+size+'px '+FONT;ctx.textAlign=align||'left';ctx.textBaseline='middle';ctx.fillStyle=color;ctx.fillText(str,x,y);ctx.restore()}
function beatState(t){const b=Math.floor(t/BEAT),ph=fract(t/BEAT);return{b,ph,pulse:Math.pow(1-ph,5)}}
function motionValue(seed,bs){const bm=mod(bs.b,48),nb=(bm+1)%48,e=easeOutExpo(clamp(bs.ph*3.2,0,1));return lerp(hash(seed+bm*31),hash(seed+nb*31),e)}
function timeline(t){const p=t/PH,base=Math.floor(p),i=base%N,f=p-base,TW=.25;let from=i,to=i,q=0,trans=false;if(f>=1-TW){trans=true;to=(i+1)%N;q=easeOutExpo((f-(1-TW))/TW)}return{i,from,to,q,trans,p}}
function focusMap(st){const f=new Array(N).fill(0);if(st.trans){f[st.from]=1-st.q;f[st.to]=st.q}else f[st.i]=1;return f}
function cameraAt(st,bs){const a=KEYS[st.from],b=KEYS[st.to],q=st.q;return{x:lerp(a.x,b.x,q),y:lerp(a.y,b.y,q),s:lerp(a.s,b.s,q)*(1+.016*bs.pulse),r:lerp(a.r,b.r,q)+.006*Math.sin(TAU*st.p/N)}}
function render(t){
ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.setLineDash([]);ctx.shadowBlur=0;ctx.globalCompositeOperation='source-over';
const st=timeline(t),bs=beatState(t),cam=cameraAt(st,bs),focus=focusMap(st);
drawBG(cam,bs);
ctx.save();ctx.translate(820,380-3*bs.pulse);ctx.scale(cam.s,cam.s);ctx.rotate(-cam.r);ctx.translate(-cam.x,-cam.y);
drawPath(t,focus,bs);drawStations(t,bs,focus,cam);ctx.restore();
drawVignette();drawPhrase(st,bs);drawHUD(t,bs);
}
function drawBG(cam,bs){
ctx.fillStyle='#000000';ctx.fillRect(0,0,W,H);
const g1=.017+.009*bs.pulse,g2=.030+.012*bs.pulse;
const ox=mod(-cam.x*.045,40),oy=mod(-cam.y*.045,40);
for(let x=ox-40;x<W+40;x+=40)line(x,0,x,H,rgba('#FFFFFF',g1),1);
for(let y=oy-40;y<H+40;y+=40)line(0,y,W,y,rgba('#FFFFFF',g1),1);
const mx=mod(-cam.x*.045,160),my=mod(-cam.y*.045,160);
for(let x=mx-160;x<W+160;x+=160)line(x,0,x,H,rgba('#FFFFFF',g2),1);
for(let y=my-160;y<H+160;y+=160)line(0,y,W,y,rgba('#FFFFFF',g2),1);
}
function drawPath(t,focus,bs){
ctx.save();ctx.beginPath();for(let i=0;i<N;i++){const k=KEYS[i];if(i===0)ctx.moveTo(k.x,k.y);else ctx.lineTo(k.x,k.y)}ctx.closePath();
ctx.setLineDash([8,16]);ctx.lineDashOffset=-t*96;ctx.strokeStyle=rgba('#C9FF3D',.13);ctx.lineWidth=2;ctx.stroke();ctx.setLineDash([]);
for(let i=0;i<N;i++){const k=KEYS[i],a=PAL[i%PAL.length],f=focus[i];ctx.shadowColor=rgba(a,.45*f);ctx.shadowBlur=18*f;circle(k.x,k.y,3+6*f+2*bs.pulse*f,rgba(a,.32+.55*f));ctx.shadowBlur=0}
ctx.restore();
}
function drawStations(t,bs,focus,cam){
const list=[];
for(let i=0;i<N;i++){const d=Math.hypot(KEYS[i].x-cam.x,KEYS[i].y-cam.y),vis=clamp((1850-d)/700,0,1);if(vis>.01)list.push({i,d,vis})}
list.sort((a,b)=>b.d-a.d);
for(const o of list){const f=focus[o.i],alpha=o.vis*(.18+.82*Math.max(f,.08));drawStation(o.i,KEYS[o.i],t,bs,f,alpha)}
}
function drawStation(i,k,t,bs,focus,alpha){
const a=PAL[i%PAL.length];ctx.save();ctx.globalAlpha=alpha;ctx.translate(k.x,k.y+4*Math.sin(TAU*t/DUR+i*.7));ctx.rotate(.006*Math.sin(TAU*t/DUR+i));
drawPanelBase(a,focus,bs);drawSilhouette(a,focus,bs);
const detail=clamp(focus*1.25,0,1);if(detail>.01){ctx.save();ctx.globalAlpha*=detail;stationHeader(i,a,focus,bs);stationBody(i,a,focus,bs);ctx.restore()}
ctx.restore();
}
function drawPanelBase(a,focus,bs){
ctx.save();ctx.shadowColor=rgba(a,.10+.28*focus+.06*bs.pulse*focus);ctx.shadowBlur=24+34*focus+8*bs.pulse*focus;
const g=ctx.createLinearGradient(-380,-220,380,220);g.addColorStop(0,'rgba(14,17,23,.97)');g.addColorStop(1,'rgba(5,7,10,.97)');
box(-380,-220,760,440,22,g,rgba(a,.11+.35*focus),1.2);ctx.restore();
box(-379,-219,758,54,20,'rgba(255,255,255,.025)');line(-380,-164,380,-164,rgba('#FFFFFF',.06),1);box(-356,-220,72,2,1,rgba(a,.85));
}
function drawSilhouette(a,focus,bs){
for(let k=0;k<3;k++)box(-352+k*236,-144,216,92,14,'rgba(255,255,255,.018)',rgba('#FFFFFF',.035));
box(-352,-32,452,184,16,'rgba(255,255,255,.014)',rgba('#FFFFFF',.035));box(120,-32,232,184,16,'rgba(255,255,255,.014)',rgba('#FFFFFF',.035));
for(let j=0;j<5;j++)line(-330,-8+j*34,300,-8+j*34,rgba('#FFFFFF',.035),1);
for(let j=0;j<9;j++){const x=-330+j*54;line(x,18,x,128,rgba(a,.035+.05*focus+.03*bs.pulse*focus),1)}
line(-350,190,350,190,rgba('#FFFFFF',.06),1);
}
function stationHeader(i,a,focus,bs){
ctx.save();ctx.shadowColor=rgba(a,.7);ctx.shadowBlur=10+8*bs.pulse;circle(-352,-193,4+2*bs.pulse,rgba(a,.95));ctx.restore();
text('NOCTURNE / '+NAMES[i],-328,-193,12,WHITE,800);text('SYNC',302,-193,10,MUT,700,'right');text('LIVE',354,-193,10,rgba(a,.95),800,'right');
}
function stationBody(i,a,focus,bs){
const labels=['PERFORMANCE','MOTION','LATENCY'],vals=['98.'+(i%8+1)+'%',(12+i)+'.8K','0.'+(36+i)+'s'],subs=['SYNC','BEAT','LOCK'];
for(let k=0;k<3;k++)miniCard(-352+k*236,-144,216,92,labels[k],vals[k],subs[k],a,bs,20+i*9+k);
drawMainWidget(i,-352,-32,452,184,a,focus,bs);drawSideWidget(i,120,-32,232,184,a,bs);drawFooter(i,a,focus,bs);
}
function miniCard(x,y,w,h,label,value,sub,a,bs,seed){
box(x,y,w,h,14,'rgba(8,11,16,.82)',rgba('#FFFFFF',.055));text(label,x+16,y+20,10,MUT,700);text(value,x+16,y+49,25,WHITE,800);text(sub,x+16,y+76,9,rgba(a,.85),800);
for(let j=0;j<5;j++){const v=.2+.8*motionValue(seed*7+j,bs),bh=8+v*25;box(x+w-72+j*11,y+55-bh,6,bh,3,rgba(j%2?WHITE:a,.18+.45*v))}
const p=.22+.7*motionValue(seed*11,bs);box(x+14,y+h-8,(w-28)*p,2,1,rgba(a,.8));
}
function drawMainWidget(i,x,y,w,h,a,focus,bs){
moduleBase(x,y,w,h,MAIN_TITLES[i],a,focus,bs);const gx=x+16,gy=y+44,gw=w-32,gh=h-58;drawChartGrid(gx,gy,gw,gh);
const type=i%4;if(type===0)drawLineChart(gx,gy,gw,gh,a,bs,i);else if(type===1)drawWaveBars(gx,gy,gw,gh,a,bs,i);else if(type===2)drawBars(gx,gy,gw,gh,a,bs,i);else drawFlow(gx,gy,gw,gh,a,bs,i);
const cx=gx+(.12+.76*motionValue(1100+i,bs))*gw,cy=gy+(.15+.7*motionValue(1200+i,bs))*gh;drawCursor(cx,cy,a,bs,focus);
}
function moduleBase(x,y,w,h,title,a,focus,bs){box(x,y,w,h,16,'rgba(8,11,16,.72)',rgba('#FFFFFF',.06));text(title,x+16,y+21,10,WHITE,800);ctx.save();ctx.shadowColor=rgba(a,.7);ctx.shadowBlur=8*focus;circle(x+w-22,y+21,3+2*bs.pulse*focus,rgba(a,.9));ctx.restore()}
function drawChartGrid(x,y,w,h){for(let j=0;j<=4;j++)line(x,y+j*h/4,x+w,y+j*h/4,rgba('#FFFFFF',.045),1);for(let j=0;j<=8;j++)line(x+j*w/8,y,x+j*w/8,y+h,rgba('#FFFFFF',.035),1)}
function drawLineChart(x,y,w,h,a,bs,i){
const pts=[];for(let k=0;k<=18;k++){const v=.15+.7*motionValue(300+i*23+k*1.7,bs);pts.push([x+k*w/18,y+h-v*h])}
const g=ctx.createLinearGradient(0,y,0,y+h);g.addColorStop(0,rgba(a,.28));g.addColorStop(1,rgba(a,0));ctx.beginPath();ctx.moveTo(x,y+h);for(const p of pts)ctx.lineTo(p[0],p[1]);ctx.lineTo(x+w,y+h);ctx.closePath();ctx.fillStyle=g;ctx.fill();
ctx.save();ctx.shadowColor=rgba(a,.55);ctx.shadowBlur=14;ctx.beginPath();for(let k=0;k<pts.length;k++){const p=pts[k];k?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])}ctx.strokeStyle=rgba(a,.95);ctx.lineWidth=2.4;ctx.stroke();ctx.restore();
for(let k=0;k<pts.length;k+=6)circle(pts[k][0],pts[k][1],3+2*bs.pulse,rgba(WHITE,.9));
}
function drawWaveBars(x,y,w,h,a,bs,i){const n=34,gap=3,bw=(w-(n-1)*gap)/n;for(let k=0;k<n;k++){const v=.12+.82*motionValue(430+i*19+k,bs),bh=Math.max(4,v*h);box(x+k*(bw+gap),y+h-bh,bw,bh,2,rgba(k%5===0?WHITE:a,.25+.55*v))}}
function drawBars(x,y,w,h,a,bs,i){const n=12,bw=w/n*.58;for(let k=0;k<n;k++){const v=.18+.76*motionValue(520+i*17+k,bs),bh=v*h,bx=x+k*w/n+(w/n-bw)/2;box(bx,y+h-bh,bw,bh,5,rgba(a,.28+.55*v));box(bx,y+h-bh-3,bw,3,2,rgba(WHITE,.45))}}
function drawFlow(x,y,w,h,a,bs,i){for(let r=0;r<3;r++){ctx.beginPath();for(let c=0;c<6;c++){const px=x+c*w/5,py=y+h*(r+1)/4+(motionValue(610+i*13+r*9+c,bs)-.5)*18;c?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.strokeStyle=rgba(a,.22+.18*bs.pulse);ctx.lineWidth=1.5;ctx.stroke()}for(let r=0;r<3;r++)for(let c=0;c<6;c++){const px=x+c*w/5,py=y+h*(r+1)/4+(motionValue(610+i*13+r*9+c,bs)-.5)*18;circle(px,py,2.5+2*bs.pulse*motionValue(700+c+r,bs),rgba(c%2?WHITE:a,.55))}}
function drawCursor(x,y,a,bs,focus){if(focus<.3)return;ctx.save();ctx.globalAlpha*=clamp((focus-.25)*1.5,0,1);ctx.translate(x,y);ctx.shadowColor=rgba(a,.8);ctx.shadowBlur=12;ctx.strokeStyle=rgba(a,.55);ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,0,9+7*bs.pulse,0,TAU);ctx.stroke();ctx.fillStyle=WHITE;ctx.strokeStyle=rgba('#000000',.7);ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,17);ctx.lineTo(4.5,12.5);ctx.lineTo(8,20);ctx.lineTo(11,18.5);ctx.lineTo(7.5,11);ctx.lineTo(14,11);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}
function drawSideWidget(i,x,y,w,h,a,bs){
moduleBase(x,y,w,h,'PARAMETERS',a,1,bs);const rows=['SNAP','EASE','GRID','LOOP'];
for(let k=0;k<4;k++){const ry=y+50+k*29,on=motionValue(700+i*17+k,bs);text(rows[k],x+16,ry,10,MUT,700);box(x+w-62,ry-8,44,16,8,rgba('#FFFFFF',.055),rgba('#FFFFFF',.07));circle(x+w-62+8+28*on,ry,5,rgba(on>.5?a:WHITE,.75))}
text('LEVEL',x+16,y+h-22,10,MUT,700);const p=.18+.72*motionValue(900+i,bs);box(x+62,y+h-27,w-78,8,4,rgba('#FFFFFF',.06));box(x+62,y+h-27,(w-78)*p,8,4,rgba(a,.85));
}
function drawFooter(i,a,focus,bs){text('STEP '+String(i+1).padStart(2,'0'),-350,206,9,MUT,700);for(let k=0;k<12;k++)circle(-230+k*50,190,2+1.2*bs.pulse,rgba('#FFFFFF',.07+.10*focus));circle(-230+((i*2)%12)*50,190,3.5+2*bs.pulse,rgba(a,.65))}
function drawVignette(){const g=ctx.createRadialGradient(640,360,240,640,360,760);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.66)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
function measureSpaced(str,sp){let w=0;for(const c of str)w+=ctx.measureText(c).width+sp;return Math.max(0,w-sp)}
function drawKineticLine(str,x,y,maxW,size,color,ghost,bs,idx,ln){
ctx.save();let fs=size,sp=fs*.035;ctx.font='900 '+fs+'px '+FONT;while(fs>34&&measureSpaced(str,sp)>maxW){fs-=2;sp=fs*.035;ctx.font='900 '+fs+'px '+FONT}
ctx.font='900 '+fs+'px '+FONT;ctx.textAlign='center';ctx.textBaseline='alphabetic';let px=x;const beat=mod(bs.b,48);
for(let j=0;j<str.length;j++){const ch=str[j],cw=ctx.measureText(ch).width;if(ch!==' '){const seed=idx*97+ln*31+j*7+beat*11,local=clamp(bs.ph*5-j*.018,0,1),kick=Math.pow(1-local,3)*(.55+.45*hash(seed)),dy=-10*kick+(hash(seed+4)-.5)*2*bs.pulse,rot=(hash(seed+5)-.5)*.08*kick;ctx.save();ctx.translate(px+cw/2,y+dy);ctx.rotate(rot);ctx.scale(1+.075*kick,1+.11*kick);ctx.font='900 '+fs+'px '+FONT;ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.lineWidth=1.2;ctx.strokeStyle=rgba(ghost,.24+.45*kick);ctx.strokeText(ch,3,-3);ctx.shadowColor=rgba(ghost,.38);ctx.shadowBlur=12*kick;ctx.fillStyle=color;ctx.fillText(ch,0,0);ctx.restore()}px+=cw+sp}
ctx.restore()
}
function drawPhraseClip(idx,cx,cy,cw,ch,dy,bs){if(ch<=.5)return;const a=PAL[idx%PAL.length];ctx.save();ctx.beginPath();ctx.rect(cx,cy,cw,ch);ctx.clip();ctx.translate(0,dy);drawKineticLine(PHRASES[idx][0],70,245,365,78,WHITE,a,bs,idx,0);drawKineticLine(PHRASES[idx][1],70,350,365,78,a,WHITE,bs,idx,1);line(70,398,70+260*(.4+.6*motionValue(1300+idx,bs)),398,rgba(a,.55),2);text(String(idx+1).padStart(2,'0')+' / 12   BEAT LOCKED',70,424,10,MUT,700);ctx.restore()}
function drawPhrase(st,bs){
const bx=54,by=150,bw=390,bh=300,a=PAL[(st.trans?st.to:st.i)%PAL.length];ctx.save();line(52,150,52,450,rgba(a,.26),2);text('KINETIC TYPE / 120 BPM',70,126,11,WHITE,800);
if(st.trans){const oldH=bh*(1-st.q),newH=bh*st.q,split=by+oldH;drawPhraseClip(st.from,bx,by,bw,oldH,-20*st.q,bs);drawPhraseClip(st.to,bx,split,bw,newH,24*(1-st.q),bs);if(st.q>.02&&st.q<.98){line(bx,split,bx+bw,split,rgba(a,.75),2);circle(bx+bw-4,split,3+2*bs.pulse,rgba(a,.9))}}else drawPhraseClip(st.i,bx,by,bw,bh,0,bs);
text('NO HARD CUTS / SINGLE CONTINUOUS PASS',70,466,11,rgba(a,.86),800);ctx.restore();
}
function drawHUD(t,bs){const a=PAL[0];ctx.save();line(40,64,1240,64,rgba('#FFFFFF',.08),1);line(40,642,1240,642,rgba('#FFFFFF',.08),1);
ctx.save();ctx.shadowColor=rgba(a,.8);ctx.shadowBlur=12;circle(46,38,4+2*bs.pulse,rgba(a,.95));ctx.restore();text('NOCTURNE OS',64,34,12,WHITE,800);text('DARK UI MOTION / REEL 01',64,52,10,MUT,700);text('STRICT 120 BPM',1218,34,12,a,800,'right');text('0.500 s / BEAT  •  SNAPPY CAMERA',1218,52,10,MUT,700,'right');
text('ONE CONTINUOUS TIMELINE',40,674,12,WHITE,800);text('48 BEATS  /  24.0 s LOOP  /  NO CUTS',40,694,10,MUT,700);drawBeatStrip(t,bs);drawLoop(1192,678,t,a,bs);text('LOOP',1148,678,11,WHITE,800,'right');text('CYCLIC',1148,696,9,MUT,700,'right');ctx.restore()}
function drawBeatStrip(t,bs){const x=360,y=662,w=552,h=34,a=PAL[0];text('BEAT RAIL / 120 BPM',x,626,10,MUT,700);ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();line(x,y+20,x+w,y+20,rgba('#FFFFFF',.06),1);for(let k=-2;k<16;k++){const xx=x+mod(k*46-t*92,w),near=1-clamp(Math.abs(xx-(x+w/2))/70,0,1),big=mod(k,4)===0;line(xx,y+(big?5:10),xx,y+25-(big?10:5)*near,rgba(a,.14+.58*near),1+1.5*near)}ctx.restore();const cx=x+w/2;line(cx,y+2,cx,y+30,rgba(WHITE,.65),1.5);circle(cx,y+20,3+2*bs.pulse,rgba(a,.95))}
function drawLoop(cx,cy,t,a,bs){ctx.save();ctx.lineWidth=2;ctx.strokeStyle=rgba('#FFFFFF',.13);ctx.beginPath();ctx.arc(cx,cy,18,0,TAU);ctx.stroke();const ang=-Math.PI/2+TAU*t/DUR;ctx.strokeStyle=rgba(a,.92);ctx.lineWidth=3;ctx.beginPath();ctx.arc(cx,cy,18,ang-.48,ang+.48);ctx.stroke();ctx.shadowColor=rgba(a,.8);ctx.shadowBlur=10;circle(cx+18*Math.cos(ang),cy+18*Math.sin(ang),3+2*bs.pulse,rgba(a,.95));ctx.restore()}
function frame(){const now=performance.now();if(origin===null)origin=now;const t=(offset+(now-origin)/1000)%DUR;render(t);requestAnimationFrame(frame)}
requestAnimationFrame(frame);
