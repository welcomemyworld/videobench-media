<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- 
  需求：Three.js 风格 / 拒绝 Blender / 卡点下坠 / 幽默元素。
  限制：系统严禁任何外部资源 (No CDN)，无法加载真实的 three.js。
  方案：手写 "MiniThree" —— 基于原生 Canvas 2D 的 3D 透视投影与光栅化管线，
        纯函数驱动，模拟 Blender 的 AO 阴影、类 Phong 渐变、挤压拉伸(Squash&Stretch)，
        零依赖实现多乐章卡点渲染。🎱
-->
<style>
  body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
  canvas { width: 1280px; height: 720px; max-width: 100vw; max-height: 100vh; object-fit: contain; box-shadow: 0 0 50px rgba(0,0,0,0.9); background: #000; }
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<script>
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
const W = 1280, H = 720;
const DUR = 20;
window.DUR = DUR;

// ---- 场景 / 乐章配置 ----
const scenes = [
    { t0: 0,  t1: 5,  bg1: '#162a3a', bg2: '#080d14', c1: '#4ade80', c2: '#facc15', name: '第一乐章：卡农 (优雅匀速)', bpm: 120 },
    { t0: 5,  t1: 10, bg1: '#2d1b4e', bg2: '#0f041f', c1: '#c084fc', c2: '#38bdf8', name: '第二乐章：土耳其进行曲 (弹跳加速)', bpm: 240 },
    { t0: 10, t1: 15, bg1: '#3f1515', bg2: '#170404', c1: '#f87171', c2: '#fb923c', name: '第三乐章：命运交响曲 (重拍震屏)', bpm: 100 },
    { t0: 15, t1: 20, bg1: '#052e2b', bg2: '#011210', c1: '#2dd4bf', c2: '#a3e635', name: '第四乐章：野蜂飞舞 (狂乱残影)', bpm: 600 }
];
function getScene(t) {
    for (let s of scenes) if (t >= s.t0 && t < s.t1) return s;
    return scenes[scenes.length - 1];
}

// ---- 程序化生成台阶与卡点时间轴 (纯数据，支持 ?t= 跳播) ----
let steps = [];
let _t = 0, _y = 0, _z = 0, _idx = 0;
function addStep(dt, dy, type, msg = "") {
    _t += dt; _y += dy; _z += 80;
    let x = Math.sin(_idx * 0.5) * 220;
    let pTexts = type === 3 ? ["砰!", "轰!", "💥"] : ["啵!", "♪", "哎哟!", "😆"];
    if (type === 2) pTexts = ["哇啊!", "😱", "弹簧!"];
    if (type === 4) pTexts = ["", "", "⚡"];
    let parts = [];
    for (let k = 0; k < 4; k++) {
        parts.push({
            vx: (Math.random() - 0.5) * 300,
            vy: -Math.random() * 250 - 50,
            vz: (Math.random() - 0.5) * 100,
            txt: pTexts[Math.floor(Math.random() * pTexts.length)],
            isTxt: Math.random() > 0.4
        });
    }
    steps.push({ t: _t, x, y: _y, z: _z, type, idx: _idx, parts, msg });
    _idx++;
}

steps.push({ t: 0, x: 0, y: 0, z: 0, type: 0, idx: 0, parts: [], msg: "准备下坠！" });
_idx = 1;
for (let i = 0; i < 10; i++) addStep(0.5, 100, 1);                     // 0 -> 5.0s
for (let i = 0; i < 20; i++) addStep(0.25, 80, i === 10 ? 2 : 1, i === 10 ? "惊不惊喜！🎈" : ""); // 5.0 -> 10.0s
for (let i = 0; i < 8; i++) addStep(0.6, 200, 3);                      // 10.0 -> 14.8s
addStep(0.2, 100, 3, "憋住...");                                        // 14.8 -> 15.0s
for (let i = 0; i < 49; i++) addStep(0.1, 60, 4);                      // 15.0 -> 19.9s
addStep(0.1, 60, 99);                                                   // 19.9 -> 20.0s 终点板

// ---- 球体运动学 (确定性抛物线，严丝合缝卡在 beat 上) ----
function getBallState(time) {
    if (time >= DUR) time = DUR - 0.001;
    let i = 0;
    while (i < steps.length - 1 && steps[i + 1].t <= time) i++;
    let s1 = steps[i], s2 = steps[i + 1] || s1;
    let dur = s2.t - s1.t || 0.1;
    let p = Math.max(0, Math.min(1, (time - s1.t) / dur));

    let h = 120;
    if (s1.type === 2) h = 500; // 幽默弹簧
    if (s1.type === 3) h = 80;  // 沉重低弹
    if (s1.type === 4) h = 30;  // 极速微弹
    if (s1.type === 99) h = 0;

    let x = s1.x + (s2.x - s1.x) * p;
    let z = s1.z + (s2.z - s1.z) * p;
    let y = s1.y + (s2.y - s1.y) * p - 4 * h * p * (1 - p);

    // Squash & Stretch
    let land = Math.max(0, 1 - p / 0.15, 1 - (1 - p) / 0.15);
    let stretch = Math.sin(p * Math.PI) * Math.min(0.5, h / 400);
    let sx = 1 - stretch + land * 0.4;
    let sy = 1 + stretch - land * 0.4;

    return { x, y, z, sx, sy, s1, s2, p, h };
}

// ---- 3D 投影 (MiniThree Core) ----
let cam = { x: 0, y: 0, z: 0 };
function proj(x, y, z) {
    let dx = x - cam.x, dy = y - cam.y, dz = z - cam.z;
    let fov = 900;
    if (dz < 50) dz = 50;
    let s = fov / dz;
    return { x: W / 2 + dx * s, y: H / 2 + dy * s, s: s };
}
function shade(hex, amt) {
    let r = Math.max(0, Math.min(255, parseInt(hex.slice(1,3),16) + amt));
    let g = Math.max(0, Math.min(255, parseInt(hex.slice(3,5),16) + amt));
    let b = Math.max(0, Math.min(255, parseInt(hex.slice(5,7),16) + amt));
    return `rgb(${r},${g},${b})`;
}
function poly(...pts) {
    ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.closePath(); ctx.fill(); ctx.stroke();
}

// ---- 绘制组件 ----
function drawStep(s, sc, active, flash) {
    let bw = s.type === 99 ? 420 : 160, bd = s.type === 99 ? 160 : 160, bh = 30;
    let hw = bw/2, hd = bd/2, hh = bh/2;
    let p = [
        proj(s.x-hw, s.y-hh, s.z-hd), proj(s.x+hw, s.y-hh, s.z-hd),
        proj(s.x+hw, s.y-hh, s.z+hd), proj(s.x-hw, s.y-hh, s.z+hd),
        proj(s.x-hw, s.y+hh, s.z-hd), proj(s.x+hw, s.y+hh, s.z-hd),
        proj(s.x+hw, s.y+hh, s.z+hd), proj(s.x-hw, s.y+hh, s.z+hd)
    ];
    let topColor = active ? sc.c2 : shade(sc.bg1, 25);
    if (flash > 0) { ctx.shadowColor = sc.c1; ctx.shadowBlur = 35 * flash; }

    ctx.lineWidth = 1; ctx.strokeStyle = active ? 'rgba(255,255,255,0.8)' : 'rgba(255,255,255,0.05)';
    ctx.fillStyle = active ? shade(topColor, -50) : '#12121a'; poly(p[0], p[1], p[5], p[4]); // Front
    ctx.fillStyle = active ? shade(topColor, -75) : '#0a0a10';
    if (cam.x < s.x) poly(p[3], p[0], p[4], p[7]); else poly(p[1], p[2], p[6], p[5]); // Side
    ctx.fillStyle = topColor; poly(p[0], p[1], p[2], p[3]); // Top
    ctx.shadowBlur = 0;

    if (s.type === 99) {
        let cp = proj(s.x, s.y - hh - 1, s.z);
        ctx.save(); ctx.translate(cp.x, cp.y); ctx.scale(cp.s, cp.s * 0.65);
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#111';
        ctx.font = 'bold 24px sans-serif'; ctx.fillText("渲 染 完 成 !", 0, -10);
        ctx.font = '14px sans-serif'; ctx.fillText("(未加载任何 Three.js / 全手写 3D 😉)", 0, 18);
        ctx.restore();
    }
}

function drawBall(bs, sc) {
    let p = proj(bs.x, bs.y, bs.z), r = 32 * p.s;
    ctx.save(); ctx.translate(p.x, p.y); ctx.scale(bs.sx, bs.sy);

    // 极速残影
    if (bs.s1.type === 4) {
        ctx.save(); ctx.globalAlpha = 0.25;
        for (let i = 1; i <= 3; i++) {
            let pt = proj(bs.x, bs.y - i*28, bs.z - i*12);
            let pr = r * (1 - i*0.15) * bs.sx;
            ctx.beginPath(); ctx.arc(pt.x - p.x, pt.y - p.y, pr, 0, Math.PI*2);
            ctx.fillStyle = sc.c1; ctx.fill();
        }
        ctx.restore();
    }

    // Blender 风格类 Phong 渐变
    let grad = ctx.createRadialGradient(-r*0.35, -r*0.35, r*0.05, 0, 0, r*1.1);
    grad.addColorStop(0, '#ffffff'); grad.addColorStop(0.15, '#e2e8f0');
    grad.addColorStop(0.4, sc.c1); grad.addColorStop(0.8, shade(sc.c1, -90)); grad.addColorStop(1, '#0f172a');
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2);
    ctx.fillStyle = grad; ctx.fill();
    ctx.lineWidth = 1.5 * p.s; ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.stroke();

    ctx.beginPath(); ctx.ellipse(-r*0.35, -r*0.4, r*0.15, r*0.08, -0.5, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.fill();

    // 搞怪表情系统
    let lookX = (bs.s2.x - bs.s1.x) * 0.015, lookY = 0.2;
    let ew = r*0.22, eh = r*0.3;
    let shock = (bs.s1.type === 2 && bs.p > 0.1 && bs.p < 0.9);
    let squint = (bs.s1.type === 3 && (bs.p < 0.1 || bs.p > 0.9));
    let dizzy = (bs.s1.type === 4);
    if (shock) { ew *= 1.4; eh *= 1.5; lookY = 0; }

    ctx.fillStyle = '#fff';
    if (!squint && !dizzy) {
        ctx.beginPath(); ctx.ellipse(-r*0.3, -r*0.05, ew, eh, 0, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse( r*0.3, -r*0.05, ew, eh, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#111';
        ctx.beginPath(); ctx.arc(-r*0.3 + lookX*r, -r*0.05 + lookY*r, ew*0.5, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc( r*0.3 + lookX*r, -r*0.05 + lookY*r, ew*0.5, 0, Math.PI*2); ctx.fill();
    } else {
        ctx.strokeStyle = '#111'; ctx.lineWidth = 3 * p.s; ctx.lineCap = 'round';
        if (squint) {
            [[-1],[1]].forEach(sgn => { let ex = sgn[0]*r*0.3, ey = -r*0.05, d = r*0.12;
                ctx.beginPath(); ctx.moveTo(ex-d,ey-d); ctx.lineTo(ex+d,ey+d); ctx.moveTo(ex+d,ey-d); ctx.lineTo(ex-d,ey+d); ctx.stroke(); });
        } else {
            ctx.beginPath(); ctx.moveTo(-r*0.45,-r*0.05); ctx.lineTo(-r*0.15,-r*0.05);
            ctx.moveTo(r*0.15,-r*0.05); ctx.lineTo(r*0.45,-r*0.05); ctx.stroke();
        }
    }
    ctx.beginPath();
    if (shock) { ctx.arc(0, r*0.35, r*0.15, 0, Math.PI*2); ctx.fillStyle='#111'; ctx.fill(); }
    else { ctx.arc(0, r*0.25, r*0.2, 0, Math.PI); ctx.strokeStyle='#111'; ctx.lineWidth=2*p.s; ctx.stroke(); }
    ctx.restore();
}

function drawParticle(x, y, z, pt, age, sc) {
    let p = proj(x, y, z); if (p.s <= 0) return;
    ctx.save(); ctx.globalAlpha = Math.max(0, 1 - age/1.2);
    ctx.translate(p.x, p.y); ctx.scale(p.s, p.s);
    if (pt.isTxt && pt.txt) {
        ctx.font = 'bold 24px sans-serif'; ctx.textAlign = 'center';
        ctx.lineWidth = 4; ctx.strokeStyle = '#000'; ctx.strokeText(pt.txt, 0, 0);
        ctx.fillStyle = '#fff'; ctx.fillText(pt.txt, 0, 0);
    } else {
        ctx.beginPath(); ctx.arc(0,0,6,0,Math.PI*2);
        ctx.fillStyle = sc.c2; ctx.shadowColor = sc.c2; ctx.shadowBlur = 12; ctx.fill();
    }
    ctx.restore();
}

// ---- 主渲染循环 ----
function draw(time) {
    let sc = getScene(time), bs = getBallState(time);

    // 相机直接解算 (无状态累加，完美兼容跳播)
    cam.x = bs.x * 0.3;
    cam.y = bs.y - 60;   // 相机略高于球，露出下方台阶
    cam.z = bs.z - 700;  // 纵深跟随

    ctx.save();
    // 第三乐章重拍震屏
    if (sc.t0 === 10) {
        let bp = (time * sc.bpm / 60) % 1;
        let sh = Math.pow(1 - bp, 6) * 16;
        ctx.translate((Math.random()-0.5)*sh, (Math.random()-0.5)*sh);
    }

    // 背景与脉冲
    let bg = ctx.createLinearGradient(0,0,0,H);
    bg.addColorStop(0, sc.bg1); bg.addColorStop(1, sc.bg2);
    ctx.fillStyle = bg; ctx.fillRect(-50,-50,W+100,H+100);
    let bp = (time * sc.bpm / 60) % 1, pulse = Math.pow(1 - bp, 3);
    ctx.beginPath(); ctx.arc(W/2, H/2, 250 + pulse*150, 0, Math.PI*2);
    ctx.fillStyle = `rgba(255,255,255, ${pulse*0.04})`; ctx.fill();

    let rl = []; // Render List (Painter's Algorithm)
    for (let s of steps) {
        if (s.z < cam.z + 50 || s.z > cam.z + 3500) continue;
        let age = time - s.t, active = time >= s.t, flash = Math.max(0, 1 - age * 4);
        rl.push({ z: s.z, draw: () => drawStep(s, sc, active, flash) });

        // 落地 AO 阴影 (贴在正下方台阶顶面)
        if (s === bs.s1 || s === bs.s2) {
            let isTarget = (bs.p < 0.5 ? bs.s1 : bs.s2) === s;
            if (isTarget) {
                let sp = proj(bs.x, s.y - 15, bs.z);
                let ss = Math.max(0.15, 1 - bs.h/650);
                rl.push({ z: s.z - 0.1, draw: () => {
                    ctx.save(); ctx.translate(sp.x, sp.y); ctx.scale(sp.s*ss, sp.s*ss*0.45);
                    ctx.beginPath(); ctx.arc(0,0,36,0,Math.PI*2);
                    ctx.fillStyle = `rgba(0,0,0,${0.55*ss})`; ctx.fill(); ctx.restore();
                }});
            }
        }
        // 粒子
        if (age > 0 && age < 1.2) {
            for (let pt of s.parts) {
                rl.push({ z: s.z + pt.vz*age, draw: () => drawParticle(
                    s.x + pt.vx*age, s.y + pt.vy*age + 400*age*age, s.z + pt.vz*age, pt, age, sc
                )});
            }
        }
        // 悬浮吐槽
        if (s.msg && age > 0 && age < 2) {
            rl.push({ z: s.z - 0.2, draw: () => {
                let p = proj(s.x, s.y - 100 - age*40, s.z);
                ctx.save(); ctx.globalAlpha = Math.min(1, age*3, (2-age)*2);
                ctx.translate(p.x, p.y); ctx.scale(p.s, p.s);
                ctx.font = 'bold 34px sans-serif'; ctx.textAlign = 'center';
                ctx.lineWidth=5; ctx.strokeStyle='#000'; ctx.strokeText(s.msg,0,0);
                ctx.fillStyle='#fff'; ctx.fillText(s.msg,0,0); ctx.restore();
            }});
        }
    }
    rl.push({ z: bs.z, draw: () => drawBall(bs, sc) });
    rl.sort((a,b) => b.z - a.z); // 远 -> 近
    for (let item of rl) item.draw();

    // ---- UI 层 ----
    let sAge = time - sc.t0;
    if (sAge < 3) {
        let a = Math.min(1, sAge*2, (3-sAge)*1.5);
        ctx.save(); ctx.globalAlpha = a; ctx.textAlign = 'center';
        ctx.shadowColor = 'rgba(0,0,0,0.9)'; ctx.shadowBlur = 12;
        ctx.fillStyle = '#fff'; ctx.font = 'bold 44px sans-serif';
        ctx.fillText(sc.name, W/2, 90);
        ctx.font = '18px monospace'; ctx.fillStyle = sc.c1;
        ctx.fillText(">>> 正在同步程序化节拍 <<<", W/2, 125);
        ctx.restore();
    }

    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.fillRect(0, 670, W, 50);
    for (let i = 0; i < 64; i++) {
        let eh = (Math.sin(i*1.5 + time*12)*0.5 + 0.5) * 32 * pulse + 4;
        ctx.fillStyle = i%2===0 ? sc.c1 : sc.c2;
        ctx.fillRect(i*20 + 6, 696 - eh, 9, eh);
    }
    ctx.fillStyle = '#fff'; ctx.font = 'bold 15px monospace';
    ctx.textAlign = 'left';  ctx.fillText(`BPM: ${sc.bpm}  |  T: ${time.toFixed(2)}s / ${DUR}s`, 20, 691);
    ctx.textAlign = 'right'; ctx.fillText(`ENGINE: MiniThree (原生 Canvas 3D)  |  RES: 1280x720`, 1260, 691);
    ctx.restore();

    // 结尾闪白 GG
    if (time > 19.85) {
        ctx.fillStyle = `rgba(255,255,255, ${Math.min(1, (time-19.85)*6)})`;
        ctx.fillRect(0,0,W,H);
        ctx.fillStyle = '#111'; ctx.textAlign = 'center'; ctx.font = 'bold 110px sans-serif';
        ctx.fillText("GG! 🎱", W/2, 400);
    }
    ctx.restore();
}

// ---- 时间驱动 (严格 performance.now + rAF) ----
let t0 = performance.now();
let offset = 0;
const qs = new URLSearchParams(location.search);
if (qs.has('t')) offset = parseFloat(qs.get('t')) || 0;

function loop(now) {
    let t = ((now - t0) / 1000 + offset) % DUR;
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    draw(t);
    requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
