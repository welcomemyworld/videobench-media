<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PayBox Motion Reel</title>
<style>
  body {
    margin: 0; padding: 0;
    background: #000;
    display: flex; justify-content: center; align-items: center;
    height: 100vh; overflow: hidden;
  }
  #stage {
    width: 1280px; height: 720px;
    background: #050508;
    position: relative;
    box-shadow: 0 0 80px rgba(0,243,255,0.05);
    transform-origin: center center;
  }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1280" height="720"></canvas></div>
<script>
  window.DUR = 10;
  const urlParams = new URLSearchParams(window.location.search);
  const offset = parseFloat(urlParams.get('t')) || 0;
  const FONT = 'system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false });

  function resize() {
    const s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
    document.getElementById('stage').style.transform = `scale(${s})`;
  }
  window.addEventListener('resize', resize);
  resize();

  if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
      if (w < 2 * r) r = w / 2; if (h < 2 * r) r = h / 2;
      this.moveTo(x + r, y);
      this.arcTo(x + w, y, x + w, y + h, r);
      this.arcTo(x + w, y + h, x, y + h, r);
      this.arcTo(x, y + h, x, y, r);
      this.arcTo(x, y, x + w, y, r);
      this.closePath();
      return this;
    };
  }

  const clamp = (v, min=0, max=1) => Math.max(min, Math.min(max, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const easeOutExpo = x => x === 1 ? 1 : 1 - Math.pow(2, -10 * x);
  const easeInExpo = x => x === 0 ? 0 : Math.pow(2, 10 * x - 10);
  const easeInOutCubic = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  const easeOutBack = x => 1 + 2.70158 * Math.pow(x - 1, 3) + 1.70158 * Math.pow(x - 1, 2);
  const range = (T, start, end) => clamp((T - start) / (end - start));

  function drawBox(c, S, style) {
    c.lineWidth = S * 0.1; c.lineJoin = 'round'; c.strokeStyle = style;
    c.beginPath(); c.roundRect(-S/2, -S/2, S, S, S*0.25); c.stroke();
  }
  function drawCheck(c, S, style) {
    c.lineWidth = S * 0.1; c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = style;
    c.beginPath(); c.moveTo(-S*0.20, -S*0.02); c.lineTo(-S*0.02, S*0.16); c.lineTo(S*0.22, -S*0.18); c.stroke();
  }
  function renderLogoMark(c, S, sBox, sCheck) {
    drawBox(c, S, sBox); drawCheck(c, S, sCheck);
  }

  function drawBlurredText(text, x, y, font, color, p, alpha) {
    ctx.font = font; ctx.fillStyle = color;
    let vel = (1 - p) * 60, steps = 6;
    for(let i=0; i<steps; i++) {
      let t = i / (steps-1);
      ctx.globalAlpha = alpha * (1 - t) * 0.5;
      ctx.fillText(text, x + vel * t, y);
    }
    ctx.globalAlpha = alpha; ctx.fillText(text, x, y); ctx.globalAlpha = 1;
  }

  const particles = Array.from({length: 80}, (_, i) => ({
    t: i / 80,
    angle: (i / 80) * Math.PI * 2 + (Math.random()-0.5)*0.5,
    dist: 800 + Math.random() * 600,
    size: 1 + Math.random() * 2.5,
    speed: 0.8 + Math.random() * 0.4,
    color: Math.random() > 0.5 ? '#00f3ff' : '#bd00ff'
  }));

  function getSquarePoint(t) {
    let s = 160;
    if (t < 0.25) return { x: -s/2 + (t/0.25)*s, y: -s/2 };
    if (t < 0.5)  return { x: s/2, y: -s/2 + ((t-0.25)/0.25)*s };
    if (t < 0.75) return { x: s/2 - ((t-0.5)/0.25)*s, y: s/2 };
    return { x: -s/2, y: s/2 - ((t-0.75)/0.25)*s };
  }

  function draw(T) {
    ctx.setTransform(1,0,0,1,0,0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#050508';
    ctx.fillRect(0,0,1280,720);

    let vg = ctx.createRadialGradient(640,360, 200, 640,360, 900);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.8)');
    ctx.fillStyle = vg; ctx.fillRect(0,0,1280,720);

    let pZoom = range(T, 8.0, 8.5);
    let zoomScale = lerp(1, 0.45, easeInOutCubic(pZoom));
    let pCollapse = range(T, 9.2, 9.6);
    let sx = 1, sy = 1;
    if (pCollapse > 0) {
      let eC = easeInExpo(pCollapse);
      sx = lerp(1, 1.5, eC) * lerp(1, 0, range(T, 9.6, 9.8));
      sy = lerp(1, 0.002, eC);
    }

    ctx.save();
    ctx.translate(640, 360);
    ctx.scale(sx * zoomScale, sy * zoomScale);
    ctx.translate(-640, -360);

    if (pCollapse > 0 && pCollapse < 0.3) {
      ctx.fillStyle = `rgba(255,255,255,${(0.3 - pCollapse)*2})`;
      ctx.fillRect(0,0,1280,720);
    }

    // Scene 1: 0.0 - 2.0 (Convergence & Iris Wipe)
    if (T < 2.0) {
      ctx.save(); ctx.translate(640, 360);
      let pConv = range(T, 0.0, 1.5);
      let pFade = range(T, 1.2, 1.8);
      
      ctx.globalCompositeOperation = 'screen';
      for(let pt of particles) {
        let p = clamp(pConv * pt.speed);
        let ep = easeOutExpo(p);
        let target = getSquarePoint(pt.t);
        let x = lerp(Math.cos(pt.angle)*pt.dist, target.x, ep);
        let y = lerp(Math.sin(pt.angle)*pt.dist, target.y, ep);
        
        ctx.globalAlpha = (1 - pFade) * clamp(p * 5);
        let epTrail = easeOutExpo(clamp(pConv * pt.speed - 0.05));
        let tx = lerp(Math.cos(pt.angle)*(pt.dist+150), target.x, epTrail);
        let ty = lerp(Math.sin(pt.angle)*(pt.dist+150), target.y, epTrail);
        
        ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(x, y);
        ctx.strokeStyle = pt.color; ctx.lineWidth = pt.size; ctx.lineCap = 'round'; ctx.stroke();
        ctx.beginPath(); ctx.arc(x,y, pt.size, 0, Math.PI*2); ctx.fillStyle = '#fff'; ctx.fill();
      }
      
      if (pFade > 0) {
        ctx.globalCompositeOperation = 'source-over';
        let pSlam = range(T, 1.6, 2.0);
        ctx.scale(lerp(1, 25, easeInExpo(pSlam)), lerp(1, 25, easeInExpo(pSlam)));
        
        let pBox = range(T, 1.2, 1.5);
        ctx.globalAlpha = pFade * pBox;
        let grad = ctx.createLinearGradient(-80,-80,80,80);
        grad.addColorStop(0, '#00f3ff'); grad.addColorStop(1, '#bd00ff');
        ctx.shadowColor = '#00f3ff'; ctx.shadowBlur = 20;
        drawBox(ctx, 160, grad); ctx.shadowBlur = 0;
        
        let pCheck = range(T, 1.4, 1.8);
        if (pCheck > 0) {
          ctx.globalAlpha = pFade;
          ctx.setLineDash([150, 150]);
          ctx.lineDashOffset = lerp(150, 0, easeInOutCubic(pCheck));
          drawCheck(ctx, 160, '#fff'); ctx.setLineDash([]);
        }
        if (pSlam > 0) {
          ctx.globalAlpha = 1; ctx.fillStyle = '#00f3ff';
          ctx.beginPath(); ctx.roundRect(-80,-80,160,160,40); ctx.fill();
        }
      }
      ctx.restore();
    }

    // Scene 2: 2.0 - 4.0 (Wipe Reveal & Glitch)
    if (T >= 2.0 && T < 4.0) {
      let pWipe = range(T, 2.0, 2.5);
      let hWipe = easeInOutCubic(pWipe) * 360;
      if (pWipe < 1) {
        ctx.fillStyle = '#00f3ff'; ctx.fillRect(0,0,1280,720);
        ctx.fillStyle = '#050508'; ctx.fillRect(0, 360 - hWipe, 1280, hWipe * 2);
      }
      
      ctx.save();
      if (pWipe < 1) { ctx.beginPath(); ctx.rect(0, 360 - hWipe, 1280, hWipe * 2); ctx.clip(); }
      ctx.translate(640, 360);
      
      let pSlice = range(T, 3.0, 3.8);
      let isSlicing = pSlice > 0 && pSlice < 1;
      let gIntensity = (1 - range(T, 2.2, 3.0)) * (T >= 2.2 ? 1 : 0);

      if (isSlicing) {
        let shift = Math.sin(pSlice * Math.PI) * 80;
        let slices = [ {y:-100,h:60,dx:-shift}, {y:-40,h:50,dx:shift}, {y:10,h:40,dx:-shift*0.5}, {y:50,h:50,dx:shift*0.8} ];
        let grad = ctx.createLinearGradient(-100,-100,100,100);
        grad.addColorStop(0, '#00f3ff'); grad.addColorStop(1, '#bd00ff');
        for(let s of slices) {
          ctx.save(); ctx.beginPath(); ctx.rect(-200, s.y, 400, s.h); ctx.clip();
          ctx.translate(s.dx, 0); renderLogoMark(ctx, 200, grad, '#fff'); ctx.restore();
        }
      } else if (gIntensity > 0) {
        ctx.globalCompositeOperation = 'screen';
        let jx = gIntensity * (Math.random()-0.5)*40, jy = gIntensity * (Math.random()-0.5)*10;
        ctx.save(); ctx.translate(jx, jy); renderLogoMark(ctx, 200, '#ff0055', '#ff0055'); ctx.restore();
        ctx.save(); ctx.translate(-jx, -jy); renderLogoMark(ctx, 200, '#00f3ff', '#00f3ff'); ctx.restore();
        ctx.save(); renderLogoMark(ctx, 200, '#fff', '#fff'); ctx.restore();
      } else {
        let grad = ctx.createLinearGradient(-100,-100,100,100);
        grad.addColorStop(0, '#00f3ff'); grad.addColorStop(1, '#bd00ff');
        ctx.shadowColor = '#00f3ff'; ctx.shadowBlur = 15;
        renderLogoMark(ctx, 200, grad, '#fff'); ctx.shadowBlur = 0;
      }
      ctx.restore();
    }

    // Scene 3 & 4: 4.0 - 9.2 (Typography, 3D Grid, HUD)
    if (T >= 4.0 && T < 9.2) {
      ctx.save(); ctx.globalCompositeOperation = 'screen';
      for(let i=0; i<30; i++) {
        let px = (i * 137.5 + T * (10 + i%5*5)) % 1280;
        let py = (i * 241.3 + Math.sin(T + i)*20) % 720;
        ctx.fillStyle = i%2 ? 'rgba(0,243,255,0.2)' : 'rgba(189,0,255,0.2)';
        ctx.beginPath(); ctx.arc(px, py, 1.5, 0, Math.PI*2); ctx.fill();
      }
      ctx.restore();

      let pGrid = range(T, 6.0, 6.5);
      if (pGrid > 0 && T < 9.0) {
        ctx.save();
        ctx.globalAlpha = pGrid * (1 - range(T, 8.0, 8.5)) * 0.4;
        ctx.strokeStyle = '#00f3ff'; ctx.lineWidth = 1;
        let vX = 640, vY = 260, scroll = (T * 0.8) % 1;
        for(let i=0; i<15; i++) {
          let y = vY + Math.pow((i + scroll)/15, 2) * 600;
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1280, y); ctx.stroke();
        }
        for(let i=-15; i<=15; i++) {
          ctx.beginPath(); ctx.moveTo(vX, vY); ctx.lineTo(vX + i * 150, 720); ctx.stroke();
        }
        ctx.restore();
      }

      ctx.save();
      ctx.translate(640, 360);
      let eTilt = easeInOutCubic(range(T, 6.0, 6.8));
      let tiltX = lerp(0, -0.2, eTilt), scaleY = lerp(1, 0.9, eTilt);
      let bob = Math.sin(T * 4) * 8 * eTilt;
      ctx.transform(1, 0, tiltX, scaleY, 0, bob);

      if (eTilt > 0 && T < 9.0) {
        ctx.save(); ctx.translate(0, 120); ctx.scale(1, 0.2);
        let rg = ctx.createRadialGradient(0,0,0, 0,0,300);
        rg.addColorStop(0, 'rgba(0, 243, 255, 0.4)'); rg.addColorStop(1, 'rgba(0, 243, 255, 0)');
        ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(0,0,300,0,Math.PI*2); ctx.fill(); ctx.restore();
      }

      let pMove = easeInOutCubic(range(T, 4.0, 4.6));
      ctx.save();
      ctx.translate(lerp(0, -180, pMove), 0);
      let mScale = lerp(1, 0.6, pMove);
      ctx.scale(mScale, mScale);
      let grad = ctx.createLinearGradient(-100,-100,100,100);
      grad.addColorStop(0, '#00f3ff'); grad.addColorStop(1, '#bd00ff');
      ctx.shadowColor = '#00f3ff'; ctx.shadowBlur = 15;
      renderLogoMark(ctx, 200, grad, '#fff'); ctx.shadowBlur = 0;
      ctx.restore();

      if (T >= 4.4) {
        let pPay = easeOutBack(range(T, 4.4, 5.2)), pBox = easeOutBack(range(T, 4.6, 5.4));
        let aPay = clamp(range(T, 4.4, 4.6)), aBox = clamp(range(T, 4.6, 4.8));
        ctx.textBaseline = 'middle';
        ctx.font = `300 100px ${FONT}`;
        let wPay = ctx.measureText('Pay').width;
        drawBlurredText('Pay', lerp(300, -90, pPay), 5, `300 100px ${FONT}`, '#fff', pPay, aPay);
        drawBlurredText('Box', lerp(400, -90 + wPay, pBox), 5, `800 100px ${FONT}`, '#fff', pBox, aBox);
      }

      let pSweep = range(T, 5.5, 6.2);
      if (pSweep > 0 && pSweep < 1) {
        ctx.save(); ctx.globalCompositeOperation = 'screen';
        let sweepX = lerp(-600, 600, easeInOutCubic(pSweep));
        let sg = ctx.createLinearGradient(sweepX - 150, 0, sweepX + 150, 0);
        sg.addColorStop(0, 'rgba(255,255,255,0)'); sg.addColorStop(0.5, 'rgba(255,255,255,0.9)'); sg.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = sg; ctx.fillRect(-500, -150, 1000, 300); ctx.restore();
      }
      ctx.restore();

      if (T >= 8.0 && T < 9.3) {
        let eHud = easeOutExpo(range(T, 8.0, 8.6));
        ctx.save(); ctx.translate(640, 360);
        ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(0, 243, 255, 0.4)';
        ctx.setLineDash([15, 20]);
        ctx.save(); ctx.rotate(T * 0.4); ctx.beginPath(); ctx.arc(0, 0, 350 * eHud, 0, Math.PI*2); ctx.stroke(); ctx.restore();
        ctx.save(); ctx.rotate(-T * 0.25); ctx.setLineDash([60, 30, 10, 30]); ctx.beginPath(); ctx.arc(0, 0, 500 * eHud, 0, Math.PI*2); ctx.stroke(); ctx.restore();
        
        ctx.setLineDash([]); ctx.strokeStyle = '#bd00ff';
        for(let i=0; i<36; i++) {
          let a = i * Math.PI/18 + T*0.1, r1 = 520 * eHud, r2 = (i%9===0 ? 550 : 535) * eHud;
          ctx.beginPath(); ctx.moveTo(Math.cos(a)*r1, Math.sin(a)*r1); ctx.lineTo(Math.cos(a)*r2, Math.sin(a)*r2); ctx.stroke();
        }
        ctx.fillStyle = 'rgba(0, 243, 255, 0.6)'; ctx.font = `500 12px ${FONT}`;
        ctx.fillText('SECURE TRANSACTION // PBX-9000', -520 * eHud, -150 * eHud);

        let pShock = range(T, 8.6, 9.2);
        if (pShock > 0 && pShock < 1) {
          ctx.beginPath(); ctx.arc(0,0, easeOutExpo(pShock) * 1400, 0, Math.PI*2);
          ctx.strokeStyle = `rgba(255,255,255,${1-pShock})`; ctx.lineWidth = 15 * (1-pShock); ctx.stroke();
        }
        ctx.restore();
      }
    }
    ctx.restore();
  }

  function loop(now) {
    requestAnimationFrame(loop);
    let T = (((now / 1000) + offset) % window.DUR + window.DUR) % window.DUR;
    draw(T);
  }
  requestAnimationFrame(loop);
</script>
</body>
</html>
