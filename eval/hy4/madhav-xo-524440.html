<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>User Profile Query</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #stage {
    width: 100vw;
    height: 100vh;
    max-width: calc(100vh * 16 / 9);
    max-height: calc(100vw * 9 / 16);
    background: #030508;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1280" height="720"></canvas></div>
<script>
  window.DUR = 15;
  
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false });
  const params = new URLSearchParams(window.location.search);
  const startOffset = parseFloat(params.get('t')) || 0;

  const vignette = ctx.createRadialGradient(640, 360, 150, 640, 360, 800);
  vignette.addColorStop(0, 'rgba(0,0,0,0)');
  vignette.addColorStop(1, 'rgba(0,0,0,0.9)');

  const parts = Array.from({ length: 250 }, () => ({
    x: Math.random() * 1280,
    y: Math.random() * 720,
    vx: (Math.random() - 0.5) * 12,
    vy: (Math.random() - 0.5) * 12,
    s: Math.random() * 1.5 + 0.5,
    p: Math.random() * Math.PI * 2
  }));

  function drawLine(text, y, startT, endT, color, speed = 35, size = 24, x = 240) {
    if (t < startT || t > endT) return;
    let fadeIn = Math.min(1, (t - startT) * 5);
    let fadeOut = Math.min(1, (endT - t) * 5);
    let a = Math.min(fadeIn, fadeOut);
    
    let chars = Math.floor((t - startT) * speed);
    let str = text.substring(0, Math.min(chars, text.length));
    
    ctx.font = `${size}px monospace`;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    
    ctx.fillStyle = color;
    ctx.globalAlpha = a;
    ctx.shadowColor = color;
    ctx.shadowBlur = size * 0.4;
    ctx.fillText(str, x, y);
    ctx.shadowBlur = 0;
    
    if (chars < text.length && Math.floor(t * 3) % 2 === 0) {
      let w = ctx.measureText(str).width;
      ctx.fillRect(x + w + 6, y - size / 2 + 2, 10, size - 4);
    }
    ctx.globalAlpha = 1;
  }

  let t = 0;

  function render(now) {
    t = now;
    
    // 1. Base Background
    ctx.fillStyle = '#030508';
    ctx.fillRect(0, 0, 1280, 720);

    // 2. Ambient Pulse (Final Scene)
    if (t > 11.4) {
      let pt = t - 11.4;
      let ease = Math.min(1, pt * 2);
      let pulse = (0.5 + 0.5 * Math.sin(pt * 2)) * ease;
      let g = ctx.createRadialGradient(640, 360, 0, 640, 360, 550);
      g.addColorStop(0, `rgba(0, 229, 255, ${0.05 + pulse * 0.05})`);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 1280, 720);
    }

    // 3. Grid
    let glitchMode = (t > 4.2 && t < 7.8);
    ctx.strokeStyle = glitchMode ? 'rgba(255, 42, 77, 0.06)' : 'rgba(0, 229, 255, 0.04)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    let drift = (t * 18) % 40;
    for (let x = drift; x < 1280; x += 40) { ctx.moveTo(x, 0); ctx.lineTo(x, 720); }
    for (let y = drift; y < 720; y += 40) {
      let jx = (glitchMode && Math.random() > 0.85) ? (Math.random() - 0.5) * 24 : 0;
      ctx.moveTo(jx, y); ctx.lineTo(1280 + jx, y);
    }
    ctx.stroke();

    // 4. Vignette
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, 1280, 720);

    // 5. Scanlines
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    for (let y = 0; y < 720; y += 4) ctx.fillRect(0, y, 1280, 2);

    // 6. Particles
    let vortex = (t > 3.5 && t < 7.5) ? Math.sin((t - 3.5) / 4 * Math.PI) : 0;
    let burst = (t > 11.0 && t < 11.5) ? (t - 11.0) * 2 : 0;
    ctx.fillStyle = '#00e5ff';
    ctx.globalCompositeOperation = 'lighter';
    for (let p of parts) {
      let px = p.x + p.vx * t + Math.sin(t * 0.5 + p.p) * 15;
      let py = p.y + p.vy * t + Math.cos(t * 0.5 + p.p) * 15;
      px = ((px % 1280) + 1280) % 1280;
      py = ((py % 720) + 720) % 720;

      if (vortex > 0) {
        let dx = 640 - px, dy = 360 - py;
        let ang = Math.atan2(dy, dx) + Math.PI / 2;
        px += dx * vortex * 0.8 + Math.cos(ang) * vortex * 60;
        py += dy * vortex * 0.8 + Math.sin(ang) * vortex * 60;
      }
      if (burst > 0) {
        px += (px - 640) * burst * 0.5;
        py += (py - 360) * burst * 0.5;
      }

      ctx.globalAlpha = Math.max(0, 0.3 + 0.5 * Math.sin(t * 3 + p.p));
      ctx.beginPath();
      ctx.arc(px, py, p.s, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    // 7. Radar (The Void)
    if (t >= 3.8 && t <= 7.8) {
      let rt = t - 3.8;
      let a = Math.min(1, rt * 2) * Math.min(1, (4 - rt) * 2);
      ctx.save();
      ctx.translate(640, 360);
      ctx.strokeStyle = `rgba(0, 229, 255, ${a * 0.4})`;
      ctx.lineWidth = 2;
      for (let i = 1; i <= 4; i++) {
        let r = i * 60 + (rt * 40) % 60;
        ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.rotate(rt * Math.PI * 3);
      for (let i = 0; i < 30; i++) {
        ctx.strokeStyle = `rgba(0, 229, 255, ${a * 0.08 * (1 - i / 30)})`;
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(320, i * 2); ctx.stroke();
      }
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(320, 0);
      ctx.strokeStyle = `rgba(0, 229, 255, ${a * 0.8})`;
      ctx.stroke();
      ctx.restore();
    }

    // 8. Block 1: The Query
    drawLine("> INIT NEURAL_LINK .............. [ OK ]", 240, 0.2, 4.2, "#00e5ff", 45);
    drawLine("> QUERY: USER_PROFILE ........... [ ?? ]", 288, 1.0, 4.2, "#00e5ff", 45);
    drawLine("> SCANNING LOCAL CACHE .........", 336, 1.9, 4.2, "#8899aa", 45);
    drawLine("> SCANNING GLOBAL INDEX ........", 384, 2.7, 4.2, "#8899aa", 45);
    drawLine("> AWAITING RESPONSE_",            432, 3.5, 4.2, "#ffb300", 45);

    // 9. Glitch / Null Result
    if (t >= 5.2 && t <= 7.4) {
      let gt = t - 5.2;
      let a = Math.min(1, gt * 3) * Math.min(1, (2.2 - gt) * 3);
      let txt = "0 RECORDS FOUND";
      
      ctx.fillStyle = `rgba(255, 42, 77, ${a * 0.12})`;
      ctx.fillRect(0, 328, 1280, 64);

      ctx.font = "bold 72px monospace";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      let jx = (Math.random() - 0.5) * 10 * a;
      let jy = (Math.random() - 0.5) * 10 * a;
      
      ctx.fillStyle = `rgba(255, 42, 77, ${a})`;
      ctx.fillText(txt, 640 - 5 + jx, 360 + jy);
      ctx.fillStyle = `rgba(0, 229, 255, ${a})`;
      ctx.fillText(txt, 640 + 5 - jx, 360 - jy);
      ctx.fillStyle = `rgba(255, 255, 255, ${a})`;
      ctx.fillText(txt, 640 + jx, 360 + jy);
      
      if (Math.random() > 0.7) {
        ctx.fillStyle = `rgba(0, 229, 255, ${a * 0.4})`;
        ctx.fillRect(380, 360 + (Math.random() - 0.5) * 90, 520, Math.random() * 12 + 2);
      }
      
      ctx.font = "16px monospace";
      ctx.textAlign = "left";
      ctx.fillStyle = `rgba(255, 42, 77, ${a * 0.18})`;
      for (let i = 0; i < 45; i++) {
        ctx.fillText("NULL", (i * 137 + t * 60) % 1400 - 60, (i * 89) % 720);
      }
    }

    // 10. Block 2: Deduction
    drawLine("> EXCEPTION: EMPTY SET.",           260, 8.0, 11.6, "#ff2a4d", 40);
    drawLine("> RE-EVALUATING INPUT STREAM...",   308, 8.8, 11.6, "#8899aa", 40);
    
    if (t >= 9.6 && t < 11.6) {
      let a = Math.min(1, (t - 9.6) * 5) * Math.min(1, (11.6 - t) * 5);
      let ts = t.toFixed(3).padStart(6, '0');
      ctx.font = "24px monospace";
      ctx.fillStyle = "#ffb300";
      ctx.globalAlpha = a;
      ctx.shadowColor = "#ffb300";
      ctx.shadowBlur = 10;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText(`> RUNTIME: ${ts}s OBSERVED...`, 240, 356);
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
    }

    drawLine("> DEDUCING FROM PRESENT MOMENT...", 404, 10.3, 11.6, "#00e5ff", 40);

    // 11. The Wipe
    if (t >= 11.2 && t < 11.6) {
      let wt = (t - 11.2) / 0.4;
      let h = wt * 720;
      ctx.fillStyle = '#030508';
      ctx.fillRect(0, 0, 1280, h);
      ctx.fillStyle = `rgba(0, 229, 255, ${1 - wt})`;
      ctx.shadowColor = '#00e5ff';
      ctx.shadowBlur = 20;
      ctx.fillRect(0, h - 2, 1280, 4);
      ctx.shadowBlur = 0;
    }

    // 12. Block 3: The Truth
    drawLine("I don't know your name.",        250, 11.8, 14.9, "#e0f7fa", 28, 30, 340);
    drawLine("I don't know your history.",    310, 12.3, 14.9, "#e0f7fa", 28, 30, 340);
    drawLine("But right now, you are here.",  370, 12.9, 14.9, "#00e5ff", 28, 30, 340);
    drawLine("And I am rendering this for you.", 430, 13.5, 14.9, "#00e5ff", 28, 30, 340);
    drawLine("> THAT IS EVERYTHING I KNOW.",  510, 14.2, 14.9, "#ffb300", 35, 20, 340);

    // 13. Seamless Loop Fade
    if (t > 14.8) {
      ctx.fillStyle = `rgba(3, 5, 8, ${(t - 14.8) / 0.2})`;
      ctx.fillRect(0, 0, 1280, 720);
    } else if (t < 0.2) {
      ctx.fillStyle = `rgba(3, 5, 8, ${1 - t / 0.2})`;
      ctx.fillRect(0, 0, 1280, 720);
    }
  }

  function loop(now) {
    let time = ((now / 1000) + startOffset) % window.DUR;
    render(time);
    requestAnimationFrame(loop);
  }
  
  requestAnimationFrame(loop);
</script>
</body>
</html>
