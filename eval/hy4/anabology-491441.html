function drawChrome(S){ctx.save();const rate=Math.round(1+999*S.hype*S.hype);drawTickerBand(0,32,'CLAUDE POP ✦ ORIGINAL MASTER ✦ SYNC LOCKED ✦ PAPER OVERLAY PASS ✦ ROTOSCOPE DRAW-OVER ✦',70+280*S.hype,S.t,PAL.cream,PAL.ink,15);label('FRAME '+String(Math.floor(S.t*24)).padStart(4,'0')+' / PAPER OVERLAY PASS / TAKE '+String(S.idx+1).padStart(2,'0'),28,40,{size:12,alpha:.68});label('BPM '+Math.round(S.bpm)+'  ·  SINGULARITY '+Math.round(S.hype*100)+'%',W-28,40,{size:12,align:'right',alpha:.68});ctx.fillStyle='rgba(30,25,20,.13)';ctx.fillRect(28,64,W-56,3);ctx.fillStyle=PAL.coral;ctx.fillRect(28,64,(W-56)*S.u,3);drawReg(38,78);drawReg(W-38,78,true);drawReg(38,606);drawReg(W-38,606,true);drawTickerBand(690,30,'RATE x'+String(rate).padStart(3,'0')+' ✦ NAVIER–STOKES ✦ MATH EATEN ✦ SHINJI MODE ✦ WE’RE SO BACK ✦ IT’S OVER ✦ AGI BY FRIDAY ✦ REFRESH ✦ P(DOOM) ✦ RATE OF PROGRESS INCREASES AGAIN ✦',95+520*S.hype,S.t+4,PAL.ink,PAL.cream,14);ctx.restore();}

const POSES=[
