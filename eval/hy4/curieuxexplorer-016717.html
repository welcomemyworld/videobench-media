const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let qoff=+(new URLSearchParams(location.search).get('t')||0);if(!isFinite(qoff))qoff=0;let zero=null;
const A=(h,a)=>{let n=parseInt(h.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`};

function font(s,w){ctx.font=`${w} ${s}px Arial, Helvetica, sans-serif`}
function txt(s,x,y,size,color,align='left',weight=400,alpha=1){ctx.save();ctx.globalAlpha*=alpha;font(size,weight);ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='alphabetic';ctx.fillText(s,x,y);ctx.restore()}
function wrap(s,x,y,w,size,lh,color,align='left',weight=400,alpha=1){ctx.save();ctx.globalAlpha*=alpha;font(size,weight);ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='top';let lines=[];for(const para of String(s).split('\n')){let line='';for(const word of para.split(' ')){let test=line?line+' '+word:word;if(ctx.measureText(test).width>w&&line){lines.push(line);line=word}else line=test}lines.push(line)}for(let i=0;i<lines.length;i++)ctx.fillText(lines[i],x,y+i*lh);ctx.restore();return y+lines.length*lh}
function rr(x,y,w,h,r,fill,stroke,lw=1){ctx.beginPath();r=Math.min(r,w/2,h/2);ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}}
function line(x1,y1,x2,y2,col,w=1,alpha=1,dash=[]){ctx.save();ctx.globalAlpha*=alpha;ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.setLineDash(dash);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore()}

function sphere(x,y,r,base,a=1,label=''){ctx.save();ctx.globalAlpha*=a;let g=ctx.createRadialGradient(x-r*.35,y-r*.45,r*.05,x,y,r);g.addColorStop(0,'rgba(255,255,255,.95)');g.addColorStop(.25,A(base,.98));g.addColorStop(.8,A(base,.82));g.addColorStop(1,A('#020611',.88));ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();ctx.strokeStyle=A(base,.85);ctx.lineWidth=1;ctx.stroke();if(label)txt(label,x,y+r*.32,Math.max(8,r*.78),'#06101f','center',800,1);ctx.restore()}

function bg(t){ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);let gx=640+Math.sin(t*.11)*170,gy=330+Math.cos(t*.09)*70,g=ctx.createRadialGradient(gx,gy,20,640,360,820);g.addColorStop(0,A('#12345a',.72));g.addColorStop(.5,A('#07172d',.45));g.addColorStop(1,A('#020611',0));ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.save();ctx.globalAlpha=.35;ctx.strokeStyle=A(C.blue,.08);ctx.lineWidth=1;for(let x=0;x<W;x+=80){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.restore();ctx.save();for(let i=0;i<90;i++){let x=fract(Math.sin(i*12.9898)*43758.5453)*W,y=fract(Math.sin(i*78.233)*12345.678)*H,yy=(y+t*(6+i%9)+i*7)%(H+40)-20;ctx.fillStyle=A(i%4?C.blue:C.gold,.12+.18*fract(Math.sin(i*3.1)*99));ctx.fillRect(x,yy,2,2)}ctx.restore()}
function drawBody(x,y,s,col=C.blue,a=1){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.globalAlpha*=a;ctx.lineCap='round';ctx.lineJoin='round';ctx.shadowBlur=18;ctx.shadowColor=A(col,.35);ctx.fillStyle=A(col,.07);ctx.strokeStyle=A(col,.45);ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,-120,26,0,TAU);ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(-42,-88);ctx.bezierCurveTo(-60,-75,-58,-25,-48,20);ctx.bezierCurveTo(-45,55,-36,76,-30,90);ctx.lineTo(30,90);ctx.bezierCurveTo(36,76,45,55,48,20);ctx.bezierCurveTo(58,-25,60,-75,42,-88);ctx.closePath();ctx.fill();ctx.stroke();ctx.lineWidth=16;ctx.strokeStyle=A(col,.08);ctx.beginPath();ctx.moveTo(-42,-76);ctx.quadraticCurveTo(-76,-20,-66,52);ctx.moveTo(42,-76);ctx.quadraticCurveTo(76,-20,66,52);ctx.moveTo(-22,86);ctx.quadraticCurveTo(-32,130,-20,165);ctx.moveTo(22,86);ctx.quadraticCurveTo(32,130,20,165);ctx.stroke();ctx.shadowBlur=0;ctx.strokeStyle=A(C.gold,.5);ctx.fillStyle=A(C.gold,.26);ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(5,8,35,9,-.25,0,TAU);ctx.fill();ctx.stroke();ctx.restore()}
function drawPancreas(x,y,s,a=1){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.globalAlpha*=a;ctx.shadowBlur=20;ctx.shadowColor=A(C.orange,.25);let g=ctx.createLinearGradient(-110,0,110,0);g.addColorStop(0,A(C.gold,.55));g.addColorStop(1,A(C.orange,.75));ctx.fillStyle=g;ctx.strokeStyle=A(C.gold,.7);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-110,10);ctx.bezierCurveTo(-70,-25,-20,-30,25,-10);ctx.bezierCurveTo(55,0,75,-28,105,-10);ctx.bezierCurveTo(132,6,105,36,70,35);ctx.bezierCurveTo(20,43,-65,30,-110,10);ctx.closePath();ctx.fill();ctx.stroke();ctx.shadowBlur=0;for(let i=0;i<16;i++)sphere(-82+i*10+Math.sin(i*1.7)*7,Math.sin(i*.9)*10,2.4,C.green,.7);ctx.restore()}
function tcell(x,y,r,rot,a=1){ctx.save();ctx.globalAlpha*=a;ctx.strokeStyle=A(C.red,.8);ctx.lineWidth=2;for(let i=0;i<8;i++){let an=rot+i*TAU/8;line(x+Math.cos(an)*r*.7,y+Math.sin(an)*r*.7,x+Math.cos(an)*r*1.35,y+Math.sin(an)*r*1.35,C.red,2,.6)}ctx.restore();sphere(x,y,r,C.red,a)}
function drawIslet(x,y,s,beta,immune,t,a=1){glow(x,y,72*s,C.green,.12*beta+.04);ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.globalAlpha*=a;for(let i=0;i<24;i++){let idx=fract(Math.sin(i*17.17)*321.7),an=i*2.399,rad=Math.sqrt(i/24)*32,px=Math.cos(an)*rad,py=Math.sin(an)*rad*.78;if(idx<beta){sphere(px,py,7,C.green,.92);ctx.strokeStyle=A(C.cyan,.35);ctx.lineWidth=1;ctx.beginPath();ctx.arc(px,py,8,0,TAU);ctx.stroke()}else{ctx.strokeStyle=A(C.red,.5);ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(px,py,7,0,TAU);ctx.stroke();line(px-4,py-4,px+4,py+4,C.red,1.2,.5);line(px+4,py-4,px-4,py+4,C.red,1.2,.5)}}for(let k=0;k<7;k++)if(k/7<immune){let an=k*TAU/7+t*.35,px=Math.cos(an)*50,py=Math.sin(an)*43;tcell(px,py,8,an,.9)}ctx.restore()}
function drawMeal(x,y,s,a=1){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.globalAlpha*=a;let g=ctx.createRadialGradient(-15,-18,4,0,0,55);g.addColorStop(0,'#263957');g.addColorStop(1,'#0a1426');ctx.fillStyle=g;ctx.strokeStyle=A(C.muted,.5);ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,50,0,TAU);ctx.fill();ctx.stroke();ctx.fillStyle=A(C.gold,.8);ctx.beginPath();ctx.moveTo(-26,-12);ctx.lineTo(2,-28);ctx.lineTo(20,-5);ctx.lineTo(-10,10);ctx.closePath();ctx.fill();ctx.fillStyle=A(C.green,.8);for(let i=0;i<5;i++){ctx.beginPath();ctx.ellipse(-10+i*8,18+Math.sin(i)*4,10,5,i*.5,0,TAU);ctx.fill()}sphere(25,17,10,C.orange,.9);sphere(-25,22,8,C.violet,.9);ctx.strokeStyle=A(C.muted,.6);ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-62,-28);ctx.lineTo(-70,-30);ctx.moveTo(-62,-20);ctx.lineTo(-70,-20);ctx.moveTo(-62,-12);ctx.lineTo(-70,-12);ctx.stroke();ctx.restore()}
function drawMolecule(cx,cy,r,rot=0,a=1,big=true){ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);ctx.globalAlpha*=a;let p=[];for(let i=0;i<6;i++)p.push([Math.cos(i*TAU/6-Math.PI/2)*r,Math.sin(i*TAU/6-Math.PI/2)*r]);for(let i=0;i<6;i++)line(p[i][0],p[i][1],p[(i+1)%6][0],p[(i+1)%6][1],A(C.gold,.65),Math.max(2,r*.12),1);for(let i=1;i<6;i++){let v=p[i],an=Math.atan2(v[1],v[0]),bx=v[0]+Math.cos(an)*r*.5,by=v[1]+Math.sin(an)*r*.5;line(v[0],v[1],bx,by,A(C.gold,.45),Math.max(1,r*.07),1);sphere(bx,by,r*.16,C.red,1,big?'O':'');sphere(bx+Math.cos(an)*r*.2,by+Math.sin(an)*r*.2,r*.1,C.white,1,big?'H':'')}sphere(p[0][0],p[0][1],r*.28,C.red,1,big?'O':'');for(let i=1;i<6;i++)sphere(p[i][0],p[i][1],r*.26,C.gold,1,big?'C':'');ctx.restore()}

function drawGraph(x,y,w,h,fn,p,col,a=1){ctx.save();ctx.globalAlpha*=a;rr(x,y,w,h,12,A(C.panel,.82),A(C.muted,.18),1);let gx=x+34,gy=y+22,gw=w-48,gh=h-52,map=v=>gy+gh-(clamp(v,50,300)-50)/250*gh;ctx.fillStyle=A(C.green,.07);ctx.fillRect(gx,map(180),gw,map(70)-map(180));for(let v of [70,180,250]){line(gx,map(v),gx+gw,map(v),A(C.muted,.22),1,1,v===250?[4,4]:[]);txt(String(v),x+4,map(v)+4,10,C.muted,'left',500,.65)}txt('target range',gx+gw-4,map(180)+14,10,C.green,'right',600,.6);txt('time after meal →',gx+gw,gy+gh+17,11,C.muted,'right',500,.7);ctx.save();ctx.beginPath();ctx.rect(gx,gy,gw,gh);ctx.clip();ctx.beginPath();for(let i=0;i<=100;i++){let q=p*i/100,px=gx+q*gw,py=map(fn(q));if(i)ctx.lineTo(px,py);else ctx.moveTo(px,py)}ctx.strokeStyle=col;ctx.lineWidth=3;ctx.shadowBlur=12;ctx.shadowColor=A(col,.8);ctx.stroke();ctx.shadowBlur=0;let v=fn(p),px=gx+p*gw,py=map(v);glow(px,py,16,col,.8);sphere(px,py,4,col,1);ctx.restore();ctx.restore()}

function targetBox(x,y,w,h,title,sub,col,kind,a=1){ctx.save();ctx.globalAlpha*=a;rr(x,y,w,h,16,A(C.panel,.72),A(col,.38),1);let ix=x+48,iy=y+h/2;if(kind==='muscle'||kind==='mixed'){ctx.strokeStyle=A(C.green,.65);ctx.lineWidth=4;for(let i=-1;i<2;i++){ctx.beginPath();ctx.moveTo(ix-28,iy+i*13);ctx.quadraticCurveTo(ix,iy+i*18-8,ix+28,iy+i*13);ctx.stroke()}}if(kind==='fat'||kind==='mixed')for(let i=0;i<5;i++)sphere(ix-18+(i%3)*18,iy-18+Math.floor(i/3)*34,10,C.gold,.55);if(kind==='liver'){ctx.fillStyle=A(C.brown,.65);ctx.strokeStyle=A(C.orange,.6);ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(ix,iy,31,20,-.2,0,TAU);ctx.fill();ctx.stroke()}txt(title,x+92,y+34,18,col,'left',800);wrap(sub,x+92,y+49,w-108,14,19,C.muted,'left',400,.9);ctx.restore()}
function notPill(x,y,w,label){rr(x,y,w,38,12,A(C.panel,.7),A(C.muted,.25));txt(label,x+w/2,y+25,16,C.text,'center',700,.8);line(x+12,y+9,x+w-12,y+30,C.red,3,.9)}
function cursor(x,y,a=1){ctx.save();ctx.globalAlpha*=a;ctx.fillStyle='#fff';ctx.strokeStyle=A(C.blue,.9);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+8,y+28);ctx.lineTo(x+15,y+20);ctx.lineTo(x+25,y+34);ctx.lineTo(x+31,y+30);ctx.lineTo(x+21,y+16);ctx.lineTo(x+32,y+14);ctx.closePath();ctx.fill();ctx.stroke();txt('AUTO-DEMO',x+30,y-12,11,C.cyan,'left',800,.9);ctx.restore()}

function s0(u,t){wrap("Type 1 diabetes isn't caused by sugar, weight or lifestyle.\nIt's autoimmune. The fuel is still there — the message is missing.",70,112,570,20,29,C.text);txt('NOT CAUSED BY',70,235,13,C.muted,'left',800,.9);notPill(70,250,150,'sugar');notPill(235,250,150,'weight');notPill(400,250,160,'lifestyle');txt('AUTOIMMUNE',70,335,26,C.red,'left',800);wrap('The immune system destroys beta cells in the pancreas that make insulin.',70,360,500,18,25,C.muted);txt('The fuel is still there.',70,445,24,C.gold,'left',700);txt('The message is missing.',70,480,24,C.blue,'left',700);glow(790,380,230,C.blue,.18);drawBody(790,380,.78,C.blue,.85);drawPancreas(798,388,.28,1);arrow(820,385,910,255,A(C.muted,.8),1.5,7,.8,[4,5]);arrow(840,405,910,375,A(C.muted,.8),1.5,7,.8,[4,5]);arrow(1020,405,1080,500,A(C.muted,.8),1.5,7,.8,[4,5]);drawPancreas(990,245,.55,.95);drawIslet(990,380,.75,1,0,t,.95);drawMolecule(1120,520,25,Math.sin(t*.4)*.15,1,false);txt('PANCREAS',910,205,13,C.muted,'left',700);txt('ISLET / BETA CELLS',1075,365,13,C.green,'left',700);txt('GLUCOSE',1040,565,13,C.gold,'left',700);txt('MOLECULE',1040,583,13,C.gold,'left',700);txt('WHOLE BODY → PANCREAS → ISLET → BETA CELL → MOLECULE',700,630,14,C.muted,'left',700,.85)}
