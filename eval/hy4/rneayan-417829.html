<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>World Population 2024 - Marble Drop</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  canvas {
    width: 1280px; height: 720px;
    max-width: 100vw; max-height: 100vh;
    object-fit: contain;
    box-shadow: 0 0 50px rgba(0,0,0,0.9);
    background: #0a0a10;
  }
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<script>
window.DUR = 30;

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });

// --- DATA (Real 2024 Estimates, 1 unit = 1 million) ---
const countries = [
  { name: "India", pop: 1450, color: "#FF9933" },
  { name: "China", pop: 1419, color: "#DE2910" },
  { name: "United States", pop: 345, color: "#3C3B6E" },
  { name: "Indonesia", pop: 281, color: "#CE1126" },
  { name: "Pakistan", pop: 245, color: "#01411C" },
  { name: "Nigeria", pop: 229, color: "#008753" },
  { name: "Brazil", pop: 217, color: "#009C3B" },
  { name: "Bangladesh", pop: 174, color: "#006A4E" },
  { name: "Russia", pop: 144, color: "#D52B1E" },
  { name: "Mexico", pop: 130, color: "#006847" },
  { name: "Japan", pop: 123, color: "#BC002D" },
  { name: "Ethiopia", pop: 123, color: "#009A44" },
  { name: "Philippines", pop: 119, color: "#0038A8" },
  { name: "Egypt", pop: 114, color: "#CE1126" },
  { name: "DR Congo", pop: 109, color: "#007FFF" },
  { name: "Vietnam", pop: 101, color: "#DA251D" },
  { name: "Iran", pop: 89, color: "#239F40" },
  { name: "Turkey", pop: 85, color: "#E30A17" },
  { name: "Germany", pop: 84, color: "#F0C800" },
  { name: "Thailand", pop: 72, color: "#A51931" },
  { name: "United Kingdom", pop: 69, color: "#00247D" },
  { name: "Tanzania", pop: 69, color: "#1EB53A" },
  { name: "France", pop: 68, color: "#0055A4" },
  { name: "South Africa", pop: 63, color: "#007A4D" },
  { name: "Italy", pop: 59, color: "#008C45" },
  { name: "Myanmar", pop: 55, color: "#FECB00" },
  { name: "Kenya", pop: 55, color: "#006600" },
  { name: "Colombia", pop: 52, color: "#FCD116" },
  { name: "South Korea", pop: 52, color: "#CD2E3A" },
  { name: "Sudan", pop: 50, color: "#D21034" },
  { name: "Spain", pop: 48, color: "#AA151B" },
  { name: "Uganda", pop: 48, color: "#FCDC04" },
  { name: "Argentina", pop: 46, color: "#74ACDF" },
  { name: "Algeria", pop: 46, color: "#006233" },
  { name: "Iraq", pop: 46, color: "#007A3D" },
  { name: "Afghanistan", pop: 43, color: "#00736C" },
  { name: "Poland", pop: 42, color: "#DC143C" },
  { name: "Canada", pop: 40, color: "#FF0000" },
  { name: "Morocco", pop: 38, color: "#C1272D" },
  { name: "Saudi Arabia", pop: 37, color: "#006C35" },
  { name: "Other Nations", pop: 1465, color: "#888888" }
];

const N = 8144;
const colorIdx = new Uint8Array(N);
let cIdx = 0;
for (let c = 0; c < countries.length; c++) {
  for (let p = 0; p < countries[c].pop; p++) {
    if (cIdx < N) colorIdx[cIdx++] = c;
  }
}

// --- PHYSICS ARRAYS ---
const x = new Float32Array(N);
const y = new Float32Array(N);
const vx = new Float32Array(N);
const vy = new Float32Array(N);
const active = new Uint8Array(N);

const R = 4, D2 = 64;
const GW = 128, GH = 120, CELL = 10;
const head = new Int32Array(GW * GH);
const next = new Int32Array(N);

let droppedCount = 0;
let isFF = false;
let clinks = [];

function hash(px, py) {
  let cx = Math.floor(px / CELL);
  let cy = Math.floor((py + 300) / CELL);
  if (cx < 0) cx = 0; else if (cx >= GW) cx = GW - 1;
  if (cy < 0) cy = 0; else if (cy >= GH) cy = GH - 1;
  return cx + cy * GW;
}

function addClink(v, px) {
  if (clinks.length < 50) clinks.push({ v: v, p: px });
}

// --- AUDIO ---
let actx = null, master = null;
let showAudioPrompt = true;

function initAudio() {
  if (actx) return;
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain();
    master.gain.value = 0.55;
    master.connect(actx.destination);
  } catch (e) {}
}
initAudio();

function resumeAudio() {
  if (!actx) initAudio();
  if (actx && actx.state === 'suspended') actx.resume();
  showAudioPrompt = false;
}
document.addEventListener('pointerdown', resumeAudio);
document.addEventListener('keydown', resumeAudio);

function playClink(v, px) {
  let t = actx.currentTime;
  let osc = actx.createOscillator();
  let gain = actx.createGain();
  
  osc.type = 'triangle';
  let f = 2000 + Math.random() * 2500;
  osc.frequency.setValueAtTime(f, t);
  osc.frequency.exponentialRampToValueAtTime(f * 0.6, t + 0.03);
  
  let vol = Math.min(v / 20, 1) * 0.08;
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
  
  osc.connect(gain);
  if (actx.createStereoPanner) {
    let p = actx.createStereoPanner();
    p.pan.value = (px / 1280) * 2 - 1;
    gain.connect(p);
    p.connect(master);
  } else {
    gain.connect(master);
  }
  osc.start(t);
  osc.stop(t + 0.05);
}

function processClinks() {
  if (isFF || !actx || actx.state !== 'running') { clinks.length = 0; return; }
  clinks.sort((a, b) => b.v - a.v);
  let max = Math.min(clinks.length, 4);
  for (let i = 0; i < max; i++) playClink(clinks[i].v, clinks[i].p);
  clinks.length = 0;
}

// --- PRE-RENDER MARBLES ---
function hexToRgb(hex) {
  hex = hex.replace('#', '');
  let n = parseInt(hex, 16);
  return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
}

const marbleCanvases = [];
for (let c of countries) {
  let cv = document.createElement('canvas');
  cv.width = 12; cv.height = 12;
  let cx = cv.getContext('2d');
  let rgb = hexToRgb(c.color);
  let light = `rgb(${Math.min(255, rgb.r + 120)}, ${Math.min(255, rgb.g + 120)}, ${Math.min(255, rgb.b + 120)})`;
  let dark = `rgb(${Math.floor(rgb.r * 0.2)}, ${Math.floor(rgb.g * 0.2)}, ${Math.floor(rgb.b * 0.2)})`;
  
  let grad = cx.createRadialGradient(4, 4, 0, 6, 6, 6);
  grad.addColorStop(0, '#ffffff');
  grad.addColorStop(0.25, light);
  grad.addColorStop(0.7, c.color);
  grad.addColorStop(1, dark);
  
  cx.fillStyle = grad;
  cx.beginPath(); cx.arc(6, 6, 5.5, 0, Math.PI * 2); cx.fill();
  cx.strokeStyle = "rgba(255,255,255,0.3)";
  cx.lineWidth = 0.5; cx.stroke();
  marbleCanvases.push(cv);
}

// --- BACKGROUNDS & GRADIENTS ---
let bgGrad = ctx.createLinearGradient(0, 0, 0, 720);
bgGrad.addColorStop(0, '#0a0a10');
bgGrad.addColorStop(1, '#1a1a24');

let topGrad = ctx.createLinearGradient(0, 0, 0, 160);
topGrad.addColorStop(0, 'rgba(10,10,16,0.95)');
topGrad.addColorStop(1, 'rgba(10,10,16,0)');

let botGrad = ctx.createLinearGradient(0, 720, 0, 620);
botGrad.addColorStop(0, 'rgba(10,10,16,0.95)');
botGrad.addColorStop(1, 'rgba(10,10,16,0)');

// --- SIMULATION ---
function resetSim() {
  active.fill(0);
  droppedCount = 0;
  clinks.length = 0;
}

function updatePhysics(t) {
  let targetDropped = Math.min(N, Math.floor((t / 20) * N));
  let sweep = Math.sin(t * 0.4) * 450;
  
  while (droppedCount < targetDropped) {
    let k = droppedCount;
    active[k] = 1;
    x[k] = 640 + sweep + (Math.random() - 0.5) * 100;
    y[k] = -50 - (k % 20) * 12;
    vx[k] = (Math.random() - 0.5) * 1.5;
    vy[k] = 4;
    droppedCount++;
  }

  // Integrate
  for (let i = 0; i < N; i++) {
    if (!active[i]) continue;
    vy[i] += 0.25;
    vx[i] *= 0.998;
    x[i] += vx[i];
    y[i] += vy[i];
    
    if (x[i] < R) { x[i] = R; vx[i] *= -0.4; }
    else if (x[i] > 1280 - R) { x[i] = 1280 - R; vx[i] *= -0.4; }
    
    if (y[i] > 720 - R) {
      y[i] = 720 - R;
      if (vy[i] > 4.0 && !isFF) addClink(vy[i], x[i]);
      vy[i] *= -0.15;
      vx[i] *= 0.8;
      if (Math.abs(vy[i]) < 0.5) vy[i] = 0;
    }
  }

  // Build Spatial Hash
  head.fill(-1);
  for (let i = 0; i < N; i++) {
    if (!active[i]) continue;
    let h = hash(x[i], y[i]);
    next[i] = head[h];
    head[h] = i;
  }

  // Resolve Collisions (2 Iterations)
  for (let iter = 0; iter < 2; iter++) {
    for (let i = 0; i < N; i++) {
      if (!active[i]) continue;
      let cx = Math.floor(x[i] / CELL);
      let cy = Math.floor((y[i] + 300) / CELL);
      
      for (let dy = -1; dy <= 1; dy++) {
        let ny = cy + dy;
        if (ny < 0 || ny >= GH) continue;
        for (let dx = -1; dx <= 1; dx++) {
          let nx = cx + dx;
          if (nx < 0 || nx >= GW) continue;
          
          let j = head[nx + ny * GW];
          while (j !== -1) {
            if (j > i) {
              let ddx = x[j] - x[i];
              let ddy = y[j] - y[i];
              let d2 = ddx * ddx + ddy * ddy;
              if (d2 < 0.0001) { ddx = 0.1; ddy = 0; d2 = 0.01; }
              
              if (d2 < D2) {
                let dist = Math.sqrt(d2);
                let overlap = 8 - dist;
                let ux = ddx / dist;
                let uy = ddy / dist;
                
                let corr = overlap * 0.55;
                x[i] -= ux * corr; y[i] -= uy * corr;
                x[j] += ux * corr; y[j] += uy * corr;
                
                if (iter === 0) {
                  let rvx = vx[j] - vx[i];
                  let rvy = vy[j] - vy[i];
                  let vn = rvx * ux + rvy * uy;
                  if (vn < 0) {
                    let j_imp = -(1.1) * vn * 0.5;
                    vx[i] -= j_imp * ux; vy[i] -= j_imp * uy;
                    vx[j] += j_imp * ux; vy[j] += j_imp * uy;
                    
                    if (-vn > 3.0 && !isFF) addClink(-vn, (x[i] + x[j]) * 0.5);
                  }
                }
              }
            }
            j = next[j];
          }
        }
      }
    }
  }
  
  // Post-collision floor clamp
  for (let i = 0; i < N; i++) {
    if (active[i] && y[i] > 720 - R) y[i] = 720 - R;
  }
}

// --- RENDER ---
function render(t) {
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, 1280, 720);
  
  ctx.strokeStyle = "#444";
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, 719); ctx.lineTo(1280, 719); ctx.stroke();
  
  for (let i = 0; i < N; i++) {
    if (!active[i]) continue;
    if (y[i] > -12 && y[i] < 732) {
      ctx.drawImage(marbleCanvases[colorIdx[i]], x[i] - 6, y[i] - 6);
    }
  }
  
  ctx.fillStyle = topGrad; ctx.fillRect(0, 0, 1280, 160);
  ctx.fillStyle = botGrad; ctx.fillRect(0, 620, 1280, 100);
  
  // Static HUD
  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 22px 'Segoe UI', sans-serif";
  ctx.textAlign = "left";
  ctx.fillText("WORLD POPULATION 2024", 40, 45);
  ctx.font = "15px 'Segoe UI', sans-serif";
  ctx.fillStyle = "#bbbbbb";
  ctx.fillText("1 MARBLE = 1,000,000 PEOPLE", 40, 72);
  ctx.fillText("TOTAL: 8,144 MARBLES", 40, 94);
  
  // Dynamic HUD
  let cum = 0, currC = countries[countries.length - 1];
  for (let c of countries) {
    cum += c.pop;
    if (droppedCount <= cum) { currC = c; break; }
  }
  let isDone = t > 20;
  
  ctx.textAlign = "right";
  ctx.fillStyle = currC.color;
  ctx.font = "bold 44px 'Segoe UI', sans-serif";
  ctx.fillText(isDone ? "DROP COMPLETE" : currC.name.toUpperCase(), 1240, 55);
  
  ctx.fillStyle = "#ffffff";
  ctx.font = "22px 'Segoe UI', sans-serif";
  ctx.fillText(isDone ? "8,144,000,000 PEOPLE" : currC.pop.toLocaleString() + " MILLION", 1240, 88);
  
  ctx.fillStyle = "#888888";
  ctx.font = "15px 'Segoe UI', sans-serif";
  ctx.fillText(isDone ? "REAL 2024 DATA" : (currC.pop * 1000000).toLocaleString() + " PEOPLE", 1240, 112);
  
  // Progress
  let prog = Math.min(1, t / 20);
  ctx.fillStyle = "rgba(255,255,255,0.2)";
  ctx.fillRect(40, 668, 300, 8);
  ctx.fillStyle = "#4CAF50";
  ctx.fillRect(40, 668, 300 * prog, 8);
  ctx.fillStyle = "#dddddd";
  ctx.font = "13px 'Segoe UI', sans-serif";
  ctx.textAlign = "left";
  ctx.fillText(isDone ? "SIMULATION SETTLING..." : `DROPPING: ${Math.floor(prog * 100)}%`, 40, 660);
  
  // Audio Prompt
  if (showAudioPrompt) {
    if (actx && actx.state === 'running') {
      showAudioPrompt = false;
    } else {
      ctx.fillStyle = "rgba(255,255,255,0.6)";
      ctx.font = "14px 'Segoe UI', sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("CLICK ANYWHERE TO ENABLE SOUND", 640, 690);
    }
  }
}

// --- MAIN LOOP ---
const DT = 1 / 60;
let simTime = 0;
let lastTime = 0;
let acc = 0;

let startOffset = 0;
let params = new URLSearchParams(window.location.search);
if (params.has('t')) startOffset = parseFloat(params.get('t')) || 0;

resetSim();
if (startOffset > 0) {
  isFF = true;
  let steps = Math.floor(startOffset / DT);
  for (let s = 0; s < steps; s++) {
    simTime += DT;
    if (simTime >= window.DUR) { resetSim(); simTime = 0; }
    updatePhysics(simTime);
    clinks.length = 0;
  }
  isFF = false;
}

lastTime = performance.now();

function loop(now) {
  requestAnimationFrame(loop);
  
  let delta = (now - lastTime) / 1000;
  if (delta > 0.1) delta = 0.1;
  lastTime = now;
  acc += delta;
  
  while (acc >= DT) {
    simTime += DT;
    if (simTime >= window.DUR) {
      resetSim();
      simTime = 0;
    }
    updatePhysics(simTime);
    processClinks();
    acc -= DT;
  }
  
  render(simTime);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
