<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>mdfor.dev - Motion Showreel</title>
<style>
  body {
    margin: 0;
    background: #000;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  canvas {
    width: 1280px;
    height: 720px;
    max-width: 100vw;
    max-height: 100vh;
    object-fit: contain;
    box-shadow: 0 0 80px rgba(0,0,0,0.9);
    background: #050508;
  }
</style>
</head>
<body>
<canvas id="stage" width="1280" height="720"></canvas>
<script>
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');

window.DUR = 30;
const urlParams = new URLSearchParams(window.location.search);
const tOffset = parseFloat(urlParams.get('t')) || 0;
let startTime = performance.now();

if(!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r) {
    r = r || 0;
    this.moveTo(x+r, y);
    this.arcTo(x+w, y, x+w, y+h, r);
    this.arcTo(x+w, y+h, x, y+h, r);
    this.arcTo(x, y+h, x, y, r);
    this.arcTo(x, y, x+w, y, r);
    this.closePath();
    return this;
  }
}

function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
function easeOutExpo(x) { return x === 1 ? 1 : 1 - Math.pow(2, -10 * x); }
function easeOutBack(x) { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); }
function easeInOutCubic(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
function easeOutElastic(x) {
  const c4 = (2 * Math.PI) / 3;
  return x === 0 ? 0 : x === 1 ? 1 : Math.pow(2, -10 * x) * Math.sin((x * 10 - 0.75) * c4) + 1;
}

function glowingText(str, x, y, size, color, align='left', glow=0) {
  ctx.save();
  ctx.font = `800 ${size}px "Segoe UI", Roboto, Helvetica, Arial, sans-serif`;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  if (glow > 0) { ctx.shadowColor = color; ctx.shadowBlur = glow; }
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
  ctx.restore();
}

function panel(x, y, w, h) {
  ctx.save();
  ctx.fillStyle = 'rgba(18,18,26,0.75)';
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 12);
  ctx.fill(); ctx.stroke();
  ctx.restore();
}

// Procedural Audio Engine
let ctxA = new (window.AudioContext || window.webkitAudioContext)();
let masterGain = ctxA.createGain();
masterGain.gain.value = 0.4;
masterGain.connect(ctxA.destination);
document.addEventListener('click', () => { if(ctxA.state === 'suspended') ctxA.resume(); });
document.addEventListener('keydown', () => { if(ctxA.state === 'suspended') ctxA.resume(); });

let lastStep = -1;
function playKick(time) {
  let osc = ctxA.createOscillator(), gain = ctxA.createGain();
  osc.connect(gain); gain.connect(masterGain);
  osc.frequency.setValueAtTime(150, time); osc.frequency.exponentialRampToValueAtTime(0.01, time + 0.5);
  gain.gain.setValueAtTime(1.2, time); gain.gain.exponentialRampToValueAtTime(0.01, time + 0.5);
  osc.start(time); osc.stop(time + 0.5);
}
function playSnare(time) {
  let bufSize = ctxA.sampleRate * 0.2, buf = ctxA.createBuffer(1, bufSize, ctxA.sampleRate), data = buf.getChannelData(0);
  for(let i=0; i<bufSize; i++) data[i] = Math.random()*2-1;
  let noise = ctxA.createBufferSource(); noise.buffer = buf;
  let nf = ctxA.createBiquadFilter(); nf.type = 'highpass'; nf.frequency.value = 1000;
  let ng = ctxA.createGain(); ng.gain.setValueAtTime(0.6, time); ng.gain.exponentialRampToValueAtTime(0.01, time+0.2);
  noise.connect(nf); nf.connect(ng); ng.connect(masterGain); noise.start(time);
  let osc = ctxA.createOscillator(); osc.type = 'triangle';
  let og = ctxA.createGain(); og.gain.setValueAtTime(0.4, time); og.gain.exponentialRampToValueAtTime(0.01, time+0.1);
  osc.frequency.setValueAtTime(250, time);
  osc.connect(og); og.connect(masterGain); osc.start(time); osc.stop(time+0.2);
}
function playHat(time, open=false) {
  let bufSize = ctxA.sampleRate * (open?0.3:0.05), buf = ctxA.createBuffer(1, bufSize, ctxA.sampleRate), data = buf.getChannelData(0);
  for(let i=0; i<bufSize; i++) data[i] = Math.random()*2-1;
  let noise = ctxA.createBufferSource(); noise.buffer = buf;
  let f = ctxA.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 7000;
  let g = ctxA.createGain(); g.gain.setValueAtTime(0.3, time); g.gain.exponentialRampToValueAtTime(0.01, time + (open?0.3:0.05));
  noise.connect(f); f.connect(g); g.connect(masterGain); noise.start(time);
}
function playBass(time, freq) {
  let osc = ctxA.createOscillator(); osc.type = 'sawtooth';
  let f = ctxA.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(400, time); f.frequency.exponentialRampToValueAtTime(50, time+0.4);
  let g = ctxA.createGain(); g.gain.setValueAtTime(0.5, time); g.gain.linearRampToValueAtTime(0.01, time+0.4);
  osc.frequency.value = freq; osc.connect(f); f.connect(g); g.connect(masterGain);
  osc.start(time); osc.stop(time+0.4);
}
function playSynth(time, freq, vol) {
  let osc = ctxA.createOscillator(); osc.type = 'square';
  let f = ctxA.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 2000;
  let g = ctxA.createGain(); g.gain.setValueAtTime(vol, time); g.gain.linearRampToValueAtTime(0.01, time+0.3);
  osc.frequency.value = freq; osc.connect(f); f.connect(g); g.connect(masterGain);
  osc.start(time); osc.stop(time+0.3);
}
function playImpact(time) {
  let osc = ctxA.createOscillator(), g = ctxA.createGain();
  osc.frequency.setValueAtTime(100, time); osc.frequency.exponentialRampToValueAtTime(10, time + 2);
  g.gain.setValueAtTime(1.5, time); g.gain.exponentialRampToValueAtTime(0.01, time + 2);
  osc.connect(g); g.connect(masterGain); osc.start(time); osc.stop(time + 2);
  let bufSize = ctxA.sampleRate * 2, buf = ctxA.createBuffer(1, bufSize, ctxA.sampleRate), d = buf.getChannelData(0);
  for(let i=0;i<bufSize;i++) d[i] = Math.random()*2-1;
  let n = ctxA.createBufferSource(); n.buffer = buf;
  let f = ctxA.createBiquadFilter(); f.type='lowpass';
  f.frequency.setValueAtTime(10000, time); f.frequency.exponentialRampToValueAtTime(100, time+2);
  let ng = ctxA.createGain(); ng.gain.setValueAtTime(0.6, time); ng.gain.exponentialRampToValueAtTime(0.01, time+2);
  n.connect(f); f.connect(ng); ng.connect(masterGain); n.start(time);
}

function updateAudio(t) {
  if(ctxA.state === 'suspended') ctxA.resume();
  const stepDur = 0.125;
  let currentStep = Math.floor(t / stepDur);
  if (currentStep === lastStep) return;
  lastStep = currentStep;
  
  let stepInBar = currentStep % 16, bar = Math.floor(currentStep / 16), now = ctxA.currentTime + 0.02;
  
  let hasKick = (bar < 6 || (bar >= 8 && bar < 12)) && stepInBar % 4 === 0;
  if (hasKick) playKick(now);
  if (bar >= 2 && (stepInBar === 4 || stepInBar === 12)) playSnare(now);
  if (stepInBar % 2 === 0) playHat(now, stepInBar === 14);
  
  const roots = [65.41, 65.41, 51.91, 51.91, 58.27, 58.27, 49.00, 49.00];
  if (bar < 12 && [0, 6, 8, 14].includes(stepInBar)) playBass(now, roots[bar % 8]);
  
  const arp = [261.63, 311.13, 392.00, 523.25, 392.00, 311.13];
  if (bar >= 1 && stepInBar % 2 === 1) playSynth(now, arp[currentStep % arp.length] * (bar%4===3?2:1), bar >= 12 ? 0.04 : 0.1);
  if (bar === 12 && stepInBar === 0) playImpact(now);
}

// Visual Data
const lines = [
  { type: 'h1', w: 180, h: 24, color: '#00E5FF', syntax: '#' },
  { type: 'p', w: 320, h: 12, color: '#A0A0B0' },
  { type: 'p', w: 280, h: 12, color: '#A0A0B0' },
  { type: 'code', w: 380, h: 80, color: '#FF0055', syntax: '```' },
  { type: 'p', w: 300, h: 12, color: '#A0A0B0' },
  { type: 'list', w: 220, h: 12, color: '#FFD600', syntax: '-' },
  { type: 'list', w: 260, h: 12, color: '#FFD600', syntax: '-' },
  { type: 'quote', w: 340, h: 16, color: '#00E5FF', syntax: '>' }
];
const sidebarItems = Array.from({length: 10}, (_, i) => ({
  w: 80 + ((i * 37) % 100), c: i%4===0 ? '#00E5FF' : (i%3===0 ? '#FFD600' : '#505060'), indent: (i%3)*15
}));
const particles = Array.from({length: 150}, (_,i) => ({
  a: (i * 137.5) * Math.PI/180, d: 100 + ((i*31)%800), s: 2 + ((i*17)%6), c: ['#00E5FF','#FF0055','#FFD600','#FFF'][i%4]
}));

function drawBackground(t, bp) {
  let grad = ctx.createRadialGradient(640, 360, 0, 640, 360, 800);
  grad.addColorStop(0, `rgba(12, 12, 22, 1)`); grad.addColorStop(1, `rgba(5, 5, 8, 1)`);
  ctx.fillStyle = grad; ctx.fillRect(0, 0, 1280, 720);
  
  ctx.save();
  ctx.strokeStyle = `rgba(0, 229, 255, ${0.03 + bp * 0.03})`;
  ctx.lineWidth = 1;
  let offset = (t * 50) % 50;
  for(let i=0; i<15; i++) {
    let y = 360 + Math.pow(i/14, 2)*400 + offset*(i/14);
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1280, y); ctx.stroke();
    let y2 = 360 - Math.pow(i/14, 2)*400 - offset*(i/14);
    ctx.beginPath(); ctx.moveTo(0, y2); ctx.lineTo(1280, y2); ctx.stroke();
  }
  for(let i=-10; i<=10; i++) {
    ctx.beginPath(); ctx.moveTo(640 + i*60, 360); ctx.lineTo(640 + i*300, 720); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(640 + i*60, 360); ctx.lineTo(640 + i*300, 0); ctx.stroke();
  }
  ctx.restore();
}

function drawEditorContent(ox, oy, t) {
  let curY = oy + 40;
  lines.forEach((L, i) => {
    let lineT = clamp((t - 8.0 - i*0.25) / 0.2, 0, 1), e = easeOutExpo(lineT);
    let dissolved = false, dT = 0;
    if (t >= 12) {
       let scannerY = (t - 12) / 2 * 700, myY = curY - oy;
       if (scannerY > myY) { dissolved = true; dT = clamp((scannerY - myY) / 30, 0, 1); }
    }
    let alpha = 1, xOff = ox + 50;
    if (dissolved) { alpha = 1 - dT; xOff += (L.w/2)*dT; }
    if (alpha <= 0) { curY += L.h + 25; return; }
    
    ctx.save(); ctx.globalAlpha = alpha;
    if (L.syntax) {
      let sT = clamp((t - 8.2 - i*0.25) / 0.3, 0, 1);
      if (sT > 0) {
        let sE = easeOutBack(sT);
        ctx.save(); ctx.translate(ox + 20 + (1-sE)*100, curY + (1-sE)*-50); ctx.rotate((1-sE)*Math.PI);
        glowingText(L.syntax, 0, 0, 20, L.color, 'left', sE*10); ctx.restore();
      }
    }
    if (e > 0) {
      ctx.save(); ctx.translate(xOff, curY); ctx.scale(e, 1); ctx.fillStyle = L.color;
      if (L.type === 'code') {
        ctx.fillStyle = 'rgba(255,0,85,0.1)'; ctx.strokeStyle = '#FF0055';
        ctx.beginPath(); ctx.roundRect(0, 0, L.w, L.h, 4); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#FF0055';
        ctx.beginPath(); ctx.roundRect(10, 15, L.w*0.6, 6, 3); ctx.fill();
        ctx.beginPath(); ctx.roundRect(10, 30, L.w*0.8, 6, 3); ctx.fill();
        ctx.beginPath(); ctx.roundRect(10, 45, L.w*0.4, 6, 3); ctx.fill();
      } else if (L.type === 'h1') {
        ctx.beginPath(); ctx.roundRect(0, 0, L.w, L.h, 4); ctx.fill();
      } else if (L.type === 'quote') {
        ctx.beginPath(); ctx.roundRect(0, 0, 4, L.h, 2); ctx.fill();
        ctx.beginPath(); ctx.roundRect(10, 0, L.w, L.h, 4); ctx.fill();
      } else {
        ctx.beginPath(); ctx.roundRect(0, 0, L.w, L.h, 6); ctx.fill();
      }
      ctx.restore();
      if (lineT > 0 && lineT < 1) {
        ctx.beginPath(); ctx.arc(xOff + L.w, curY + L.h/2, (1-e)*50, 0, Math.PI*2);
        ctx.strokeStyle = `rgba(255,255,255,${1-lineT})`; ctx.lineWidth = 2; ctx.stroke();
      }
    }
    ctx.restore(); curY += L.h + 25;
  });
}

function drawPreviewContent(ox, oy, t) {
  let curY = oy + 40, scannerY = (t - 12) / 2 * 700; 
  lines.forEach((L, i) => {
    let rT = (scannerY > (curY - oy)) ? clamp((scannerY - (curY - oy)) / 30, 0, 1) : 0;
    let rE = easeOutElastic(rT);
    if (rT > 0) {
      ctx.save(); ctx.translate(ox + 30, curY + L.h/2); ctx.scale(rE, rE); ctx.translate(0, -L.h/2);
      if (L.type === 'h1') {
        glowingText('HEADER', 0, 0, 32, '#FFF', 'left', 10);
      } else if (L.type === 'code') {
        ctx.fillStyle = '#1A1A24'; ctx.beginPath(); ctx.roundRect(0, 0, L.w, L.h, 8); ctx.fill();
        ctx.fillStyle = '#FF0055'; ctx.beginPath(); ctx.arc(15, 15, 5, 0, 7); ctx.fill();
        ctx.fillStyle = '#FFD600'; ctx.beginPath(); ctx.arc(30, 15, 5, 0, 7); ctx.fill();
        ctx.fillStyle = '#00E5FF'; ctx.beginPath(); ctx.arc(45, 15, 5, 0, 7); ctx.fill();
        ctx.fillStyle = '#A0A0B0'; ctx.beginPath(); ctx.roundRect(15, 35, L.w*0.7, 8, 4); ctx.fill();
        ctx.beginPath(); ctx.roundRect(15, 55, L.w*0.5, 8, 4); ctx.fill();
      } else if (L.type === 'list') {
        ctx.fillStyle = '#FFD600'; ctx.beginPath(); ctx.arc(6, 6, 5, 0, 7); ctx.fill();
        ctx.fillStyle = '#FFF'; ctx.beginPath(); ctx.roundRect(20, 0, L.w-20, 12, 6); ctx.fill();
      } else if (L.type === 'quote') {
        ctx.fillStyle = '#00E5FF'; ctx.fillRect(0, 0, 4, 24);
        ctx.fillStyle = '#E0E0E0'; ctx.font = 'italic 16px sans-serif'; ctx.fillText('"Design is intelligence made visible."', 15, 16);
      } else {
        ctx.fillStyle = '#D0D0E0'; ctx.beginPath(); ctx.roundRect(0, 0, L.w, 12, 6); ctx.fill();
      }
      ctx.restore();
    }
    curY += L.h + 25;
  });
  if (t >= 12 && t <= 14.2) {
    ctx.save(); ctx.fillStyle = 'rgba(0, 229, 255, 0.8)'; ctx.shadowColor = '#00E5FF'; ctx.shadowBlur = 20;
    ctx.fillRect(ox, oy + scannerY, 440, 4); ctx.restore();
  }
}

function applyCamera(t) {
  if (t >= 8.0 && t < 12.0) {
    let zIn = easeInOutCubic(clamp((t-8.0)/0.5, 0, 1)), zOut = easeInOutCubic(clamp((t-11.5)/0.5, 0, 1));
    let zoom = 1 + zIn * 0.5 - zOut * 0.5;
    ctx.translate(640, 360); ctx.scale(zoom, zoom); ctx.translate(95, 0); ctx.translate(-640, -360);
  }
  if (t >= 16.0 && t < 20.0) {
    let bT = clamp((t-16)/1, 0, 1), bOutT = clamp((t-19.5)/0.5, 0, 1);
    let bE = easeInOutCubic(bT) * (1 - easeInOutCubic(bOutT));
    ctx.translate(640, 360); ctx.transform(1, -0.1*bE, -0.2*bE, 0.85*bE, 0, 0); ctx.translate(-640, -360);
  }
}

function drawIntro(t, bp) {
  let gT = clamp(t/1, 0, 1), gE = easeOutExpo(gT);
  ctx.strokeStyle = `rgba(0, 229, 255, ${0.3 * (1-gE)})`; ctx.lineWidth = 2;
  for(let i=0; i<10; i++) {
    let y = 360 + (i-4.5)*100 * gE;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1280, y); ctx.stroke();
  }
  glowingText('A MOTION DESIGN SHOWREEL', 640, 200, 20, '#00E5FF', 'center', 10 * bp);

  if (t > 1.0) {
    let fE = easeOutBack(clamp((t-1.0)/0.8, 0, 1));
    ctx.save(); ctx.translate(640, 360); ctx.rotate((1-fE)*Math.PI*2); ctx.scale(Math.max(0.01, fE), Math.max(0.01, fE));
    ctx.fillStyle = '#00E5FF'; ctx.shadowColor = '#00E5FF'; ctx.shadowBlur = 30;
    ctx.beginPath(); ctx.roundRect(-60, -60, 120, 120, 20); ctx.fill();
    ctx.shadowBlur = 0; ctx.fillStyle = '#050508'; ctx.font = '900 70px "Segoe UI", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('md', 0, 5);
    ctx.restore();
  }
  if (t > 1.8) {
    let txt = "for.dev", tT = clamp((t-1.8)/0.8, 0, 1), chars = Math.floor(tT * txt.length), out = txt.substring(0, chars);
    if (chars < txt.length && Math.random() > 0.5) out += String.fromCharCode(33 + Math.floor(Math.random()*90));
    ctx.save(); ctx.translate(640 + 70, 360);
    if (tT < 1) ctx.translate((Math.random()-0.5)*10, (Math.random()-0.5)*10);
    glowingText(out, 10, 5, 70, '#FFF', 'left'); ctx.restore();
  }
  if (t > 3.0) {
    let zT = clamp((t-3.0)/1.0, 0, 1), zE = Math.pow(zT, 3);
    ctx.save(); ctx.translate(640, 360); ctx.scale(1 + zE*5, 1 + zE*5); ctx.globalAlpha = 1 - zT;
    ctx.fillStyle = '#00E5FF'; ctx.beginPath(); ctx.roundRect(-60, -60, 120, 120, 20); ctx.fill(); ctx.restore();
  }
}

function drawUI(t, bp) {
  let sE = easeOutBack(clamp((t-4.0)/0.6, 0, 1)), eE = easeOutBack(clamp((t-4.5)/0.6, 0, 1)), pE = easeOutBack(clamp((t-5.0)/0.6, 0, 1));
  let sep = 0;
  if (t >= 16 && t < 20) {
    sep = easeInOutCubic(clamp((t-16)/1, 0, 1)) * (1 - easeInOutCubic(clamp((t-19.5)/0.5, 0, 1))) * 120;
  }
  
  ctx.save(); ctx.translate(-300*(1-sE) - sep, -sep*0.5); panel(50, 50, 250, 620);
  sidebarItems.forEach((item, i) => {
    let iT = clamp((t - 4.2 - i*0.05)/0.3, 0, 1);
    if(iT>0) { ctx.globalAlpha = iT; ctx.fillStyle = item.c; ctx.beginPath(); ctx.roundRect(70 + item.indent, 80 + i*35, item.w, 10, 5); ctx.fill(); }
  }); ctx.restore();
  
  ctx.save(); ctx.translate(0, 700*(1-eE) + sep*0.5); panel(320, 50, 450, 620); drawEditorContent(320, 50, t); ctx.restore();
  ctx.save(); ctx.translate(1300*(1-pE) + sep, -sep*0.5); panel(790, 50, 440, 620); drawPreviewContent(790, 50, t); ctx.restore();
  
  if (t >= 12 && t < 16) {
    ctx.strokeStyle = 'rgba(0,229,255,0.5)'; ctx.lineWidth = 2; ctx.setLineDash([10, 10]); ctx.lineDashOffset = -t * 50;
    ctx.beginPath(); ctx.moveTo(770, 360); ctx.lineTo(790, 360); ctx.stroke(); ctx.setLineDash([]);
  }
  if (sep > 0) {
    ctx.save(); ctx.globalAlpha = sep/120; ctx.strokeStyle = '#00E5FF'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(640, 360, 200 + bp*20, 0, 7); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(440, 360); ctx.lineTo(840, 360); ctx.moveTo(640, 160); ctx.lineTo(640, 560); ctx.stroke();
    glowingText('AST_PARSER: OK', 70, 650, 16, '#00E5FF', 'left', 5);
    glowingText('LIVE_SYNC: 60FPS', 1210, 650, 16, '#FF0055', 'right', 5);
    glowingText('COMPONENT DRIVEN', 640, 90, 40, '#FFF', 'center', 10 + bp*10); ctx.restore();
  }
}

function drawFeature(cut, e, t, bp) {
  ctx.save(); ctx.scale(e, e);
  if (cut === 0) {
    panel(-250, -100, 500, 200);
    let cols = ['#00E5FF', '#FF0055', '#FFD600', '#FFF'];
    for(let i=0; i<4; i++) { ctx.fillStyle = cols[i]; ctx.beginPath(); ctx.roundRect(-200 + i*110, -20, 80 + (i%3)*60, 16, 8); ctx.fill(); }
    glowingText('SYNTAX HIGHLIGHTING', 0, 60, 20, '#A0A0B0', 'center');
  } else if (cut === 1) {
    for(let i=0; i<3; i++) {
      let y = -60 + i*60;
      ctx.strokeStyle = '#FFF'; ctx.lineWidth = 4; ctx.strokeRect(-150, y, 30, 30);
      ctx.strokeStyle = '#00E5FF'; ctx.beginPath(); ctx.moveTo(-145, y+15); ctx.lineTo(-138, y+25); ctx.lineTo(-125, y+5);
      ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.stroke();
      ctx.fillStyle = '#FFF'; ctx.beginPath(); ctx.roundRect(-100, y+5, 250, 16, 8); ctx.fill();
    }
  } else if (cut === 2) {
    ctx.strokeStyle = '#FF0055'; ctx.lineWidth = 4;
    for(let i=0; i<=3; i++) { ctx.beginPath(); ctx.moveTo(-200, -100+i*60); ctx.lineTo(200, -100+i*60); ctx.stroke(); }
    for(let i=0; i<=4; i++) { ctx.beginPath(); ctx.moveTo(-200+i*100, -100); ctx.lineTo(-200+i*100, 80); ctx.stroke(); }
  } else if (cut === 3) {
    ctx.strokeStyle = '#FFD600'; ctx.lineWidth = 4; ctx.strokeRect(-200, -100, 400, 200);
    ctx.beginPath(); ctx.arc(100, -40, 30, 0, 7); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-200, 100); ctx.lineTo(-50, -50); ctx.lineTo(50, 20); ctx.lineTo(120, -20); ctx.lineTo(200, 100); ctx.stroke();
  } else if (cut === 4) {
    ctx.fillStyle = 'rgba(0,229,255,0.2)'; ctx.strokeStyle = '#00E5FF'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(-200, -40, 400, 80, 40); ctx.fill(); ctx.stroke();
    glowingText('https://mdfor.dev', 0, 0, 28, '#FFF', 'center', 10 + bp*10);
  } else if (cut === 5) {
    glowingText('B', -100, 0, 120, '#FF0055', 'center', 20); glowingText('I', 100, 0, 120, '#00E5FF', 'center', 20);
    ctx.fillStyle = '#FFF'; ctx.fillRect(-200, 80, 400, 10);
  } else if (cut === 6) {
    glowingText('E = mc²', 0, 0, 80, '#FFF', 'center', 20); ctx.fillStyle = '#FFD600'; ctx.fillRect(-120, 50, 240, 8);
  } else if (cut === 7) {
    ctx.globalAlpha = Math.floor(t*8)%2 === 0 ? 1 : 0.2; ctx.fillStyle = '#00E5FF';
    ctx.shadowColor = '#00E5FF'; ctx.shadowBlur = 30 + bp*20; ctx.fillRect(-10, -100, 20, 200);
  }
  ctx.restore();
}

function drawBlitz(t, bp) {
  let cut = Math.min(7, Math.floor((t - 20) / 0.5)), cutT = (t - 20) % 0.5;
  let cutE = easeOutBack(clamp(cutT / 0.3, 0, 1)), shake = Math.pow(1 - clamp(cutT/0.15, 0, 1), 2) * 20;
  ctx.save(); ctx.translate(640 + (Math.random()-0.5)*shake, 360 + (Math.random()-0.5)*shake);
  drawFeature(cut, cutE, t, bp); ctx.restore();
  if (cutT < 0.1) { ctx.fillStyle = `rgba(255,255,255,${(1-cutT/0.1)*0.15})`; ctx.fillRect(0,0,1280,720); }
}

function drawOutro(t, bp) {
  if (t >= 24 && t < 24.5) {
    ctx.fillStyle = `rgba(255,255,255,${Math.pow(1-(t-24)*2, 2)})`; ctx.fillRect(0,0,1280,720);
  }
  let exT = clamp((t-24)/2, 0, 1), exE = easeOutExpo(exT);
  if (exT < 1) {
    particles.forEach(p => {
      ctx.fillStyle = p.c; ctx.globalAlpha = 1 - exT;
      ctx.fillRect(640 + Math.cos(p.a)*p.d*exE, 360 + Math.sin(p.a)*p.d*exE, p.s, p.s);
    }); ctx.globalAlpha = 1;
  }
  
  if (t >= 24.0 && t < 28.0) {
    let lE = easeOutExpo(clamp((t - 24.2) / 1.0, 0, 1));
    ctx.save(); ctx.translate(640, 360);
    ctx.scale(Math.max(0.01, Math.abs(Math.cos((1 - lE) * Math.PI * 8))), lE); ctx.rotate((1-lE)*Math.PI);
    ctx.fillStyle = '#00E5FF'; ctx.shadowColor = '#00E5FF'; ctx.shadowBlur = lE * (30 + bp*20);
    ctx.beginPath(); ctx.roundRect(-60, -60, 120, 120, 20); ctx.fill();
    ctx.fillStyle = '#050508'; ctx.font = '900 70px "Segoe UI", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.shadowBlur = 0; ctx.fillText('md', 0, 5); ctx.restore();

    if (t > 25.0) {
      let fT = clamp((t-25.0)/0.5, 0, 1), fE = easeOutBack(fT);
      ctx.save(); ctx.translate(640 + 70, 360); ctx.scale(fE, 1);
      let sweepX = (t - 25.5) * 800 + 200;
      if (fT === 1 && sweepX > -200 && sweepX < 1000) {
        let grad = ctx.createLinearGradient(sweepX-150, 0, sweepX+150, 0);
        grad.addColorStop(0, '#FFF'); grad.addColorStop(0.5, '#00E5FF'); grad.addColorStop(1, '#FFF');
        ctx.font = '800 70px "Segoe UI", sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
        ctx.shadowColor = '#00E5FF'; ctx.shadowBlur = 20; ctx.fillStyle = grad; ctx.fillText('for.dev', 10, 5);
      } else { glowingText('for.dev', 10, 5, 70, '#FFF', 'left'); }
      ctx.restore();
    }
    if (t > 26.0) {
      ctx.globalAlpha = clamp((t-26.0)/0.5, 0, 1);
      glowingText('THE ULTIMATE MARKDOWN EXPERIENCE', 640, 480, 24, '#A0A0B0', 'center'); ctx.globalAlpha = 1;
    }
  }
  
  if (t >= 28.0) {
    let oE = easeInOutCubic(clamp((t - 28) / 1, 0, 1));
    ctx.save(); ctx.translate(640, 360); ctx.scale(1 - oE*0.1, 1 - oE*0.1); ctx.globalAlpha = 1 - oE;
    ctx.fillStyle = '#00E5FF'; ctx.beginPath(); ctx.roundRect(-60, -60, 120, 120, 20); ctx.fill();
    ctx.fillStyle = '#050508'; ctx.font = '900 70px "Segoe UI", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('md', 0, 5);
    glowingText('for.dev', 80, 5, 70, '#FFF', 'left'); ctx.restore();

    if (t > 28.5) {
      ctx.globalAlpha = clamp((t - 28.5)/0.5, 0, 1);
      ctx.fillStyle = '#00E5FF'; ctx.shadowColor = '#00E5FF'; ctx.shadowBlur = 15;
      ctx.beginPath(); ctx.arc(640, 330, 8*(1+bp*0.3), 0, 7); ctx.fill(); ctx.shadowBlur = 0;
      glowingText('https://mdfor.dev', 640, 400, 32, '#FFF', 'center', 10); ctx.globalAlpha = 1;
    }
  }
}

function draw(t) {
  ctx.clearRect(0,0,1280,720);
  let bp = Math.pow(1 - (t * 2) % 1, 3);
  drawBackground(t, bp);
  
  ctx.save(); applyCamera(t);
  if (t < 4.0) drawIntro(t, bp);
  if (t >= 4.0 && t < 20.0) drawUI(t, bp);
  if (t >= 20.0 && t < 24.0) drawBlitz(t, bp);
  if (t >= 24.0) drawOutro(t, bp);
  ctx.restore();
  
  let vig = ctx.createRadialGradient(640, 360, 300, 640, 360, 800);
  vig.addColorStop(0, 'rgba(0,0,0,0)'); vig.addColorStop(1, 'rgba(0,0,0,0.8)');
  ctx.fillStyle = vig; ctx.fillRect(0, 0, 1280, 720);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 1280, 16); ctx.fillRect(0, 704, 1280, 16);
}

function loop(now) {
  let t = ((now - startTime) / 1000 + tOffset) % window.DUR;
  updateAudio(t);
  draw(t);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
