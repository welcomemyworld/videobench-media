<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Mentis - Showreel</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden;
    display: flex; justify-content: center; align-items: center;
  }
  #stage {
    width: 1280px; height: 720px;
    max-width: 100vw; max-height: 100vh;
    aspect-ratio: 16 / 9;
    background: #050508;
    box-shadow: 0 0 100px rgba(0,0,0,0.9);
    position: relative;
  }
  canvas { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1280" height="720"></canvas></div>
<script>
window.DUR = 15;
const params = new URLSearchParams(window.location.search);
let startT = Math.max(0, parseFloat(params.get('t')) || 0) % window.DUR;

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });
const W = 1280, H = 720;
const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif';

if(!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r) {
    if(!r) r = 0;
    this.moveTo(x+r, y); this.arcTo(x+w, y, x+w, y+h, r);
    this.arcTo(x+w, y+h, x, y+h, r); this.arcTo(x, y+h, x, y, r);
    this.arcTo(x, y, x+w, y, r); this.closePath(); return this;
  };
}

const clamp = (v, a=0, b=1) => Math.max(a, Math.min(b, v));
const lerp = (a,b,t) => a + (b-a)*t;
const easeOut = t => 1 - Math.pow(1-t, 3);
const easeInOut = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
const smooth = (a,b,t) => clamp((t-a)/(b-a));
const easeOutBack = t => { const c1=1.70158, c3=c1+1; return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2); };

const impacts = [
  {t: 0.1, s: 8, f: 0.3}, {t: 0.9, s: 8, f: 0.3}, {t: 1.7, s: 22, f: 0.8},
  {t: 2.6, s: 0, f: 0.2}, {t: 3.5, s: 12, f: 0.5}, {t: 7.0, s: 18, f: 0.7},
  {t: 10.5, s: 28, f: 0.9}, {t: 13.5, s: 10, f: 0.4}
];

const cols = [ [5,8,20], [0,20,26], [20,0,20], [26,15,0], [5,8,20] ];
const cuts = [3.5, 7.0, 10.5, 13.5];

function getBg(t) {
  let idx = 0;
  for(let i=0; i<cuts.length; i++) if(t >= cuts[i]) idx = i+1;
  let c = cols[idx];
  if(idx > 0) {
    let dt = t - cuts[idx-1];
    if(dt < 0.3) {
      let p = smooth(0, 0.3, dt), prev = cols[idx-1];
      c = [lerp(prev[0],c[0],p), lerp(prev[1],c[1],p), lerp(prev[2],c[2],p)];
    }
  }
  return `rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;
}

function drawText(txt, x, y, size, color, align='center', weight=900, spacing=0, alpha=1, blur=0) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.font = `${weight} ${size}px ${FONT}`;
  if('letterSpacing' in ctx) ctx.letterSpacing = `${spacing}px`;
  ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillStyle = color;
  if (blur > 0) { ctx.shadowColor = color; ctx.shadowBlur = blur; }
  ctx.fillText(txt, x, y);
  if (blur > 0) ctx.fillText(txt, x, y);
  ctx.restore();
}

function drawTextGlitch(txt, x, y, size, color, align, weight, spacing, alpha, blur, amt) {
  if(amt > 1) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = alpha * 0.8;
    ctx.font = `${weight} ${size}px ${FONT}`;
    if('letterSpacing' in ctx) ctx.letterSpacing = `${spacing}px`;
    ctx.textAlign = align; ctx.textBaseline = 'middle';
    let off = amt * 0.4;
    ctx.fillStyle = '#ff0055'; ctx.fillText(txt, x - off, y);
    ctx.fillStyle = '#00f0ff'; ctx.fillText(txt, x + off, y + off*0.3);
    ctx.restore();
  }
  drawText(txt, x, y, size, color, align, weight, spacing, alpha, blur);
}

const dust = Array.from({length: 150}, () => ({
  x: Math.random()*W, y: Math.random()*H, s: Math.random()*2+0.5,
  sp: Math.random()*20+10, ph: Math.random()*Math.PI*2
}));

function drawAmbient(t) {
  ctx.save(); ctx.fillStyle = '#fff';
  for(let d of dust) {
    let y = (d.y - t * d.sp) % H; if(y < 0) y += H;
    ctx.globalAlpha = 0.08 + 0.08 * Math.sin(t*2 + d.ph);
    ctx.fillRect(d.x, y, d.s, d.s);
  }
  ctx.restore();
}

function drawS1(t, shake) {
  let words = [
    {txt: "L'ESPRIT", y: -70, start: 0.1},
    {txt: "N'A PAS DE", y: 10, start: 0.9},
    {txt: "LIMITES.", y: 90, start: 1.7}
  ];
  ctx.save(); ctx.translate(W/2, H/2);
  for(let w of words) {
    let pt = t - w.start;
    if(pt > 0 && pt < 2.5) {
      let pIn = easeOutBack(clamp(pt/0.5));
      let pOut = smooth(2.4, 2.8, t);
      let alpha = clamp(pt/0.15) * (1 - pOut);
      let scale = lerp(1.8, 1, pIn) * (1 + pOut*0.5);
      ctx.save(); ctx.translate(0, w.y); ctx.scale(scale, scale);
      let wShake = (pt < 0.3) ? shake : 0;
      drawTextGlitch(w.txt, 0, 0, 84, '#fff', 'center', 900, 8, alpha, 20*(1-pOut), wShake);
      ctx.restore();
    }
  }
  
  let lt = t - 2.6;
  if(lt > 0) {
    let p = easeOut(clamp(lt/0.7)), pOut = smooth(3.2, 3.5, t);
    ctx.save(); ctx.translate(0, -40);
    ctx.scale(lerp(1.3, 1, p) + pOut*0.2, lerp(1.3, 1, p) + pOut*0.2);
    ctx.globalAlpha = p * (1 - pOut);
    
    ctx.strokeStyle = '#00f0ff'; ctx.lineWidth = 14;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.shadowColor = '#00f0ff'; ctx.shadowBlur = 30;
    let len = 320;
    ctx.setLineDash([len, len]); ctx.lineDashOffset = lerp(len, 0, p);
    ctx.beginPath();
    ctx.moveTo(-55, 45); ctx.lineTo(-55, -45); ctx.lineTo(0, 15); ctx.lineTo(55, -45); ctx.lineTo(55, 45);
    ctx.stroke(); ctx.setLineDash([]);
    
    drawText("MENTIS", 0, 100, 52, '#fff', 'center', 900, 24, 1, 15);
    drawText("Repoussez vos frontières.", 0, 150, 20, '#00f0ff', 'center', 400, 4, smooth(0.3, 0.8, lt));
    ctx.restore();
  }
  ctx.restore();
}

function drawPolarGrid(t, color) {
  ctx.save(); ctx.translate(W/2, H/2);
  ctx.strokeStyle = color; ctx.lineWidth = 1; ctx.globalAlpha = 0.1;
  ctx.rotate(t * 0.05);
  for(let i=1; i<=6; i++) { ctx.beginPath(); ctx.arc(0,0, i*120, 0, Math.PI*2); ctx.stroke(); }
  for(let i=0; i<12; i++) {
    let a = (i/12) * Math.PI*2;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(a)*800, Math.sin(a)*800); ctx.stroke();
  }
  ctx.restore();
}

function drawS2(st) {
  let pIn = easeOut(clamp(st/0.6)), pOut = smooth(3.1, 3.5, st);
  let alpha = pIn * (1 - pOut);
  
  ctx.save();
  ctx.translate(lerp(-100, 0, pIn) - pOut*150, 0);
  ctx.globalAlpha = alpha;
  drawText("Une clarté", 100, H/2 - 40, 64, '#fff', 'left', 900);
  drawText("absolue.", 100, H/2 + 40, 64, '#00f0ff', 'left', 900, 0, 1, 20);
  drawText("Organisez, connectez, maîtrisez.", 100, H/2 + 110, 22, '#aaa', 'left', 400, 1);
  ctx.restore();

  ctx.save();
  ctx.translate(W/2 + 180, H/2); ctx.globalAlpha = alpha;
  
  let nodes = [];
  for(let i=0; i<12; i++) {
    let ang = i * 2.4 + st*0.2, rad = 100 + (i%3)*60;
    nodes.push({ x: Math.cos(ang)*rad*1.5, y: Math.sin(ang)*rad, s: 4 + (i%2)*3 });
  }
  
  ctx.strokeStyle = 'rgba(0, 240, 255, 0.3)'; ctx.lineWidth = 2;
  let connP = easeOut(clamp((st-0.3)/1.5));
  for(let i=0; i<nodes.length; i++) for(let j=i+1; j<nodes.length; j++) {
    let dx = nodes[i].x - nodes[j].x, dy = nodes[i].y - nodes[j].y;
    if(dx*dx+dy*dy < 250*250) {
      ctx.beginPath(); ctx.moveTo(nodes[i].x, nodes[i].y);
      ctx.lineTo(lerp(nodes[i].x, nodes[j].x, connP), lerp(nodes[i].y, nodes[j].y, connP)); ctx.stroke();
    }
  }
  
  ctx.fillStyle = '#00f0ff'; ctx.shadowColor = '#00f0ff'; ctx.shadowBlur = 15;
  for(let n of nodes) { ctx.beginPath(); ctx.arc(n.x, n.y, n.s * connP, 0, Math.PI*2); ctx.fill(); }
  
  let cardY = lerp(80, 0, easeOutBack(clamp((st-0.8)/0.8))) + Math.sin(st*2)*5 + pOut*100;
  ctx.translate(0, cardY); ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(10, 20, 30, 0.7)'; ctx.strokeStyle = 'rgba(0, 240, 255, 0.5)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect(-140, -80, 280, 160, 16); ctx.fill(); ctx.stroke();
  
  ctx.globalAlpha = alpha * smooth(1.2, 1.8, st);
  drawText("SYNAPSES ACTIVES", -110, -45, 14, '#00f0ff', 'left', 700, 2);
  for(let i=0; i<5; i++) {
    let bh = (Math.sin(i*2 + st*5)*0.5 + 0.5) * 50 + 15;
    ctx.fillStyle = i==2 ? '#fff' : 'rgba(0,240,255,0.4)';
    ctx.shadowColor = '#00f0ff'; ctx.shadowBlur = i==2 ? 10 : 0;
    ctx.fillRect(-110 + i*48, 45 - bh, 30, bh);
  }
  ctx.shadowBlur = 0;
  
  let scanY = ((st * 150) % 160) - 80;
  let sg = ctx.createLinearGradient(0, scanY-10, 0, scanY+10);
  sg.addColorStop(0, 'rgba(0,240,255,0)'); sg.addColorStop(0.5, 'rgba(0,240,255,0.4)'); sg.addColorStop(1, 'rgba(0,240,255,0)');
  ctx.fillStyle = sg; ctx.fillRect(-140, scanY-10, 280, 20);
  ctx.restore();
}

function drawSpeedGrid(st, color) {
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = 1;
  let cy = H/2;
  ctx.globalAlpha = 0.15;
  for(let i=-10; i<=10; i++) {
    ctx.beginPath(); ctx.moveTo(W/2 + i*40, cy); ctx.lineTo(W/2 + i*200, 0);
    ctx.moveTo(W/2 + i*40, cy); ctx.lineTo(W/2 + i*200, H); ctx.stroke();
  }
  for(let i=1; i<=8; i++) {
    let p = ((st * 1.5 + i/8) % 1);
    let yUp = cy - Math.pow(p, 2) * cy, yDn = cy + Math.pow(p, 2) * cy;
    ctx.globalAlpha = 0.2 * (1-p);
    ctx.beginPath(); ctx.moveTo(0, yUp); ctx.lineTo(W, yUp); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, yDn); ctx.lineTo(W, yDn); ctx.stroke();
  }
  ctx.restore();
}

function drawS3(st, shake) {
  let pIn = easeOut(clamp(st/0.5)), pOut = smooth(3.1, 3.5, st);
  let alpha = pIn * (1 - pOut);

  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = alpha * 0.6;
  for(let i=0; i<80; i++) {
    let seed = i * 123.456, y = (seed % H), speed = 800 + (seed % 500);
    let x = ((seed % W) + st * speed) % (W + 400) - 200, len = 50 + (seed % 150);
    ctx.strokeStyle = i%3===0 ? '#ff0055' : (i%3===1 ? '#aa00ff' : '#fff');
    ctx.lineWidth = 1 + (seed % 2);
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - len, y); ctx.stroke();
  }
  ctx.restore();

  ctx.save(); ctx.translate(W/2, H/2); ctx.globalAlpha = alpha; ctx.globalCompositeOperation = 'lighter';
  for(let i=0; i<4; i++) {
    let r = 80 + i*30, rot = st * (i%2==0 ? 2 : -1.5) + i;
    ctx.save(); ctx.rotate(rot);
    ctx.strokeStyle = i%2==0 ? '#ff0055' : '#aa00ff'; ctx.lineWidth = 4;
    ctx.shadowColor = ctx.strokeStyle; ctx.shadowBlur = 20;
    ctx.setLineDash([r * Math.PI * 0.5, r * Math.PI * 1.5]);
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }
  ctx.setLineDash([]);
  
  let pulse = 1 + Math.sin(st*15)*0.1;
  let rg = ctx.createRadialGradient(0,0,0, 0,0, 70*pulse);
  rg.addColorStop(0, '#fff'); rg.addColorStop(0.2, '#ff0055'); rg.addColorStop(1, 'rgba(255,0,85,0)');
  ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(0,0,70*pulse,0,Math.PI*2); ctx.fill();

  let frame = Math.floor(st * 40), val = (frame * 7919) % 10000;
  drawText("LATENCE", 0, -25, 12, '#ff0055', 'center', 700, 2, 0.8);
  drawText((val/100).toFixed(2) + " ms", 0, 5, 36, '#fff', 'center', 900, 2, 1, 10);
  ctx.restore();

  ctx.save();
  let tx = lerp(W, W/2, easeOut(clamp(st/0.4))) + pOut * 300;
  ctx.globalAlpha = alpha;
  let glitch = (Math.floor(st*20) % 5 === 0) ? (Math.random()-0.5)*10 : 0;
  drawTextGlitch("LA VITESSE", tx + glitch, H/2 - 200, 72, '#fff', 'center', 900, 4, 1, 20, shake);
  drawTextGlitch("DE LA PENSÉE.", tx - glitch, H/2 + 220, 72, '#ff0055', 'center', 900, 4, 1, 30, shake);
  drawText("Traitement instantané. Zéro latence.", tx, H/2 + 280, 22, '#ccc', 'center', 400, 2);
  ctx.restore();
}

function drawExpansionDust(st, alpha) {
  ctx.save(); ctx.translate(W/2, H/2);
  ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = '#ffcc00';
  for(let i=0; i<100; i++) {
    let seed = i * 99.9, ang = (seed % (Math.PI*2)), p = ((st * 0.4 + (seed%1)) % 1);
    let r = easeOut(p) * 800;
    ctx.globalAlpha = Math.sin(p * Math.PI) * 0.8 * alpha;
    ctx.beginPath(); ctx.arc(Math.cos(ang)*r, Math.sin(ang)*r, 1 + (seed%3), 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawS4(st) {
  let pIn = easeOut(clamp(st/0.6)), pOut = smooth(2.6, 3.0, st);
  let alpha = pIn * (1 - pOut);
  
  drawExpansionDust(st, alpha);

  ctx.save(); ctx.translate(W/2, H/2); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = alpha;
  for(let i=0; i<5; i++) {
    let wt = (st - i*0.3);
    if(wt > 0) {
      let r = easeOut(clamp(wt/2)) * 800, a = 1 - clamp(wt/2);
      ctx.strokeStyle = `rgba(255, 204, 0, ${a*0.5})`; ctx.lineWidth = 10 * a;
      ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.stroke();
    }
  }

  let rays = 60;
  for(let i=0; i<rays; i++) {
    let ang = (i/rays) * Math.PI*2 + Math.sin(i)*0.1;
    let len = 150 + (Math.sin(i*13.5)*0.5+0.5) * 250;
    let grow = easeOut(clamp((st - 0.2 - (i%5)*0.1) / 1.2)), currLen = len * grow;
    ctx.save(); ctx.rotate(ang);
    let rg = ctx.createLinearGradient(0,0, currLen, 0);
    rg.addColorStop(0, 'rgba(255,204,0,0)'); rg.addColorStop(0.2, '#ff5500'); rg.addColorStop(1, '#ffcc00');
    ctx.strokeStyle = rg; ctx.lineWidth = 2 + (i%3);
    ctx.shadowColor = '#ff5500'; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(currLen*0.5, Math.sin(i+st)*20, currLen, 0); ctx.stroke();
    if(grow > 0.8) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(currLen, 0, 3, 0, Math.PI*2); ctx.fill(); }
    ctx.restore();
  }
  
  let coreR = 40 + Math.sin(st*5)*10;
  let cg = ctx.createRadialGradient(0,0,0,0,0,coreR);
  cg.addColorStop(0, '#fff'); cg.addColorStop(0.5, '#ffcc00'); cg.addColorStop(1, 'rgba(255,85,0,0)');
  ctx.fillStyle = cg; ctx.beginPath(); ctx.arc(0,0,coreR,0,Math.PI*2); ctx.fill();
  
  let flareA = smooth(0, 0.1, st) * (1 - smooth(0.4, 1.2, st));
  if(flareA > 0) {
    let fg = ctx.createLinearGradient(-W/2, 0, W/2, 0);
    fg.addColorStop(0, 'rgba(255,204,0,0)'); fg.addColorStop(0.5, `rgba(255,255,255,${flareA*0.5})`); fg.addColorStop(1, 'rgba(255,204,0,0)');
    ctx.fillStyle = fg; ctx.fillRect(-W/2, -8, W, 16);
  }
  ctx.restore();

  ctx.save(); ctx.globalAlpha = alpha;
  let sc = lerp(1.2, 1, easeOut(clamp(st/1))) + pOut*0.3;
  ctx.translate(W/2, H/2); ctx.scale(sc, sc);
  drawText("VOTRE POTENTIEL,", 0, -220, 56, '#fff', 'center', 900, 6, 1, 20);
  drawText("DÉCUPLÉ.", 0, 220, 90, '#ffcc00', 'center', 900, 10, 1, 40);
  ctx.restore();
}

function drawS5(st) {
  let pIn = easeOut(clamp(st/0.5)), pOut = smooth(1.2, 1.5, st);
  let alpha = pIn * (1 - pOut);
  
  ctx.save(); ctx.translate(W/2, H/2 - 40); ctx.globalAlpha = alpha;
  let sc = lerp(2, 1, easeOutBack(clamp(st/0.8)));
  ctx.scale(sc, sc); ctx.translate(0, -60);
  
  ctx.strokeStyle = '#00f0ff'; ctx.lineWidth = 8;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.shadowColor = '#00f0ff'; ctx.shadowBlur = 20;
  ctx.beginPath();
  ctx.moveTo(-30, 25); ctx.lineTo(-30, -25); ctx.lineTo(0, 5); ctx.lineTo(30, -25); ctx.lineTo(30, 25);
  ctx.stroke();
  drawText("MENTIS", 0, 70, 36, '#fff', 'center', 900, 15);
  ctx.restore();
  
  ctx.save(); ctx.globalAlpha = alpha * smooth(0.3, 0.8, st);
  drawText("Disponible maintenant.", W/2, H/2 + 100, 24, '#ccc', 'center', 400, 2);
  
  let btnP = easeOutBack(clamp((st-0.5)/0.6));
  ctx.translate(W/2, H/2 + 170); ctx.scale(btnP, btnP);
  let pulse = 1 + Math.sin(st*8)*0.03; ctx.scale(pulse, pulse);
  ctx.fillStyle = '#fff'; ctx.shadowColor = '#00f0ff'; ctx.shadowBlur = 25;
  ctx.beginPath(); ctx.roundRect(-100, -25, 200, 50, 25); ctx.fill();
  ctx.shadowBlur = 0; drawText("Télécharger", 0, 0, 18, '#000', 'center', 800, 1);
  ctx.restore();
}

function drawOverlays(t) {
  let vg = ctx.createRadialGradient(W/2, H/2, H/3, W/2, H/2, W);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.85)');
  ctx.fillStyle = vg; ctx.fillRect(0,0,W,H);

  ctx.save(); ctx.fillStyle = 'rgba(0,0,0,0.12)';
  for(let y=0; y<H; y+=4) ctx.fillRect(0, y, W, 1);
  ctx.restore();

  ctx.save(); ctx.globalAlpha = 0.04; ctx.fillStyle = '#fff';
  let seed = Math.floor(t * 60);
  for(let i=0; i<300; i++) ctx.fillRect((seed*i*13)%W, (seed*i*71)%H, 2, 2);
  ctx.restore();

  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 2;
  let m = 40, l = 20;
  ctx.beginPath(); ctx.moveTo(m, m+l); ctx.lineTo(m, m); ctx.lineTo(m+l, m); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W-m-l, m); ctx.lineTo(W-m, m); ctx.lineTo(W-m, m+l); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(m, H-m-l); ctx.lineTo(m, H-m); ctx.lineTo(m+l, H-m); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W-m-l, H-m); ctx.lineTo(W-m, H-m); ctx.lineTo(W-m, H-m-l); ctx.stroke();
  
  ctx.globalAlpha = 0.5;
  drawText("MENTIS // SYSTÈME v1.0", m + 15, m + 25, 12, '#fff', 'left', 600, 2);
  drawText(`00:${t.toFixed(3).padStart(6, '0')}`, W - m - 15, H - m + 2, 12, '#fff', 'right', 600, 2);
  ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fillRect(m, H - m + 10, W - m*2, 2);
  ctx.fillStyle = '#00f0ff'; ctx.fillRect(m, H - m + 10, (W - m*2) * (t / window.DUR), 2);
  ctx.restore();
}

let startTime = performance.now();
function loop(now) {
  let t = ((now - startTime) / 1000 + startT) % window.DUR;
  
  let shake = 0, flash = 0;
  for(let imp of impacts) {
    let dt = t - imp.t;
    if(dt > 0 && dt < 0.35) {
      let p = 1 - dt/0.35;
      shake = Math.max(shake, p * imp.s);
      flash = Math.max(flash, Math.pow(p, 3) * imp.f);
    }
  }
  
  ctx.setTransform(1,0,0,1,0,0);
  ctx.globalCompositeOperation = 'source-over';
  let grad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W);
  grad.addColorStop(0, getBg(t)); grad.addColorStop(1, '#000000');
  ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);
  
  drawAmbient(t);
  
  ctx.save();
  if(shake > 0) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
  
  if(t < 3.5) drawS1(t, shake);
  else if(t < 7.0) { drawPolarGrid(t, '#00f0ff'); drawS2(t - 3.5); }
  else if(t < 10.5) { drawSpeedGrid(t - 7.0, '#ff0055'); drawS3(t - 7.0, shake); }
  else if(t < 13.5) { drawS4(t - 10.5); }
  else { drawS5(t - 13.5); }
  
  ctx.restore();
  
  drawOverlays(t);
  
  if(flash > 0) {
    ctx.fillStyle = `rgba(255,255,255,${flash})`;
    ctx.fillRect(0,0,W,H);
  }
  
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
