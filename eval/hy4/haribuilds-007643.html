function clamp(x,a=0,b=1){return Math.max(a,Math.min(b,x))}
function ease(x){x=clamp(x);return x*x*(3-2*x)}
function lerp(a,b,t){return a+(b-a)*t}
function comma(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,",")}

function tracking(s,x,y,size,color,space=0,weight=600,align="left"){

}
function text(s,x,y,size,color,weight=400,align="left"){ctx.save();font(size,weight);ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline="alphabetic";ctx.fillText(s,x,y);ctx.restore()}

function qPoint(a,c,b,u){const v=1-u;return{x:v*v*a.x+2*v*u*c.x+u*u*b.x,y:v*v*a.y+2*v*u*c.y+u*u*b.y}}

let seed=20240229; function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}

function wrapDeg(d){return((d+540)%360)-180}
function rad(d){return d*RAD}

const NEMO={lat:-48.8767,lon:-123.3934};
const LAND=[
 {name:"DUCIE ISLAND",sub:"Pitcairn group • north",lat:-24.671,lon:-124.79,lx:625,ly:154,align:"left"},

function project(lat,lon,cx,cy,R,lat0,lon0){const p=rad(lat),p0=rad(lat0),dl=rad(wrapDeg(lon-lon0)),c=Math.sin(p0)*Math.sin(p)+Math.cos(p0)*Math.cos(p)*Math.cos(dl);return{x:cx+R*Math.cos(p)*Math.sin(dl),y:cy-R*(Math.cos(p0)*Math.sin(p)-Math.sin(p0)*Math.cos(p)*Math.cos(dl)),vis:c>0,c}}
function geoPoint(lon,lat,cx,cy,R,lat0,lon0){const q=project(lat,lon,cx,cy,R,lat0,lon0);return{x:q.x,y:q.y,vis:q.vis,c:q.c,lon,lat}}
function horizon(a,b,cx,cy,R,lat0,lon0){let lo=0,hi=1,av=a.vis;for(let k=0;k<14;k++){let m=(lo+hi)/2,d=wrapDeg(b.lon-a.lon),lon=a.lon+d*m,lat=a.lat+(b.lat-a.lat)*m,q=geoPoint(lon,lat,cx,cy,R,lat0,lon0);if(q.vis===av)lo=m;else hi=m}let d=wrapDeg(b.lon-a.lon);return geoPoint(a.lon+d*hi,a.lat+(b.lat-a.lat)*hi,cx,cy,R,lat0,lon0)}
function drawGeoPoly(poly,fill,stroke,cx,cy,R,lat0,lon0){ctx.save();ctx.fillStyle=fill;ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.lineJoin="round";const pts=poly.map(p=>geoPoint(p[0],p[1],cx,cy,R,lat0,lon0));let seg=[];function flush(){if(seg.length>2){ctx.beginPath();ctx.moveTo(seg[0].x,seg[0].y);for(let i=1;i<seg.length;i++)ctx.lineTo(seg[i].x,seg[i].y);ctx.closePath();ctx.fill();ctx.stroke()}seg=[]}for(let i=0;i<pts.length;i++){let a=pts[i],b=pts[(i+1)%pts.length];if(a.vis&&b.vis){if(!seg.length)seg.push(a);seg.push(b)}else if(a.vis&&!b.vis){if(!seg.length)seg.push(a);seg.push(horizon(a,b,cx,cy,R,lat0,lon0));flush()}else if(!a.vis&&b.vis){if(seg.length)flush();seg=[horizon(b,a,cx,cy,R,lat0,lon0),b]}else flush()}flush();ctx.restore()}

const GEO_WNA=[[-127,49],[-124,42],[-121,36],[-117,32],[-111,25],[-105,21],[-98,20],[-96,25],[-101,31],[-108,38],[-116,44],[-124,49]];

function drawGraticule(cx,cy,R,lat0,lon0){ctx.save();ctx.lineWidth=1;ctx.strokeStyle="rgba(160,230,245,.13)";for(let lat=-60;lat<=60;lat+=30){ctx.beginPath();let drawing=false;for(let lon=-180;lon<=180;lon+=4){let q=project(lat,lon,cx,cy,R,lat0,lon0);if(q.vis){drawing?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y);drawing=true}else drawing=false}ctx.stroke()}for(let lon=-180;lon<180;lon+=30){ctx.beginPath();let drawing=false;for(let lat=-85;lat<=85;lat+=4){let q=project(lat,lon,cx,cy,R,lat0,lon0);if(q.vis){drawing?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y);drawing=true}else drawing=false}ctx.stroke()}ctx.restore()}
function drawGlobe(cx,cy,R,lat0,lon0,time){
 ctx.save();let halo=ctx.createRadialGradient(cx,cy,R*.65,cx,cy,R*1.32);halo.addColorStop(0,"rgba(45,170,220,.20)");halo.addColorStop(1,"rgba(0,0,0,0)");ctx.fillStyle=halo;ctx.beginPath();ctx.arc(cx,cy,R*1.35,0,TAU);ctx.fill();
 ctx.save();ctx.beginPath();ctx.arc(cx,cy,R,0,TAU);ctx.clip();let og=ctx.createRadialGradient(cx-R*.35,cy-R*.45,R*.08,cx,cy,R*1.12);og.addColorStop(0,"#176b87");og.addColorStop(.48,"#073651");og.addColorStop(1,"#020b18");ctx.fillStyle=og;ctx.fillRect(cx-R,cy-R,R*2,R*2);

 let sh=ctx.createRadialGradient(cx-R*.35,cy-R*.42,R*.20,cx,cy,R*1.1);sh.addColorStop(0,"rgba(255,255,255,0)");sh.addColorStop(.62,"rgba(0,0,0,0)");sh.addColorStop(1,"rgba(0,0,0,.68)");ctx.fillStyle=sh;ctx.fillRect(cx-R,cy-R,R*2,R*2);ctx.restore();
 ctx.save();ctx.globalCompositeOperation="lighter";ctx.strokeStyle="rgba(80,220,255,.16)";ctx.lineWidth=10;ctx.beginPath();ctx.arc(cx,cy,R,0,TAU);ctx.stroke();ctx.restore();ctx.strokeStyle="rgba(180,240,255,.55)";ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(cx,cy,R,0,TAU);ctx.stroke();ctx.restore();
}
function drawISS(x,y,s,rot=0){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(s,s);ctx.fillStyle="#174a72";ctx.strokeStyle="rgba(150,220,255,.65)";ctx.fillRect(-42,-10,28,20);ctx.fillRect(14,-10,28,20);ctx.strokeRect(-42,-10,28,20);ctx.strokeRect(14,-10,28,20);ctx.strokeStyle="rgba(150,220,255,.35)";for(let i=-35;i<-15;i+=7){ctx.beginPath();ctx.moveTo(i,-10);ctx.lineTo(i,10);ctx.stroke()}for(let i=21;i<42;i+=7){ctx.beginPath();ctx.moveTo(i,-10);ctx.lineTo(i,10);ctx.stroke()}ctx.fillStyle="#d8e7ed";rr(-11,-8,22,16,4);ctx.fill();ctx.fillStyle="#7fa3b2";ctx.fillRect(-3,-12,6,24);ctx.strokeStyle="#eaf7ff";ctx.beginPath();ctx.moveTo(0,-15);ctx.lineTo(0,-25);ctx.moveTo(-7,-25);ctx.lineTo(7,-25);ctx.stroke();ctx.restore()}
