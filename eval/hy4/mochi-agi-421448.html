function lipsA(t){return win(t,14.2,15.5,22.0,22.5);}
function drawLayers(t){
  const dolly=sm(0,22,t)*1.0+(t>17.7&&t<18.3?.16*sm(17.7,18.3,t):0);
  const camX=Math.sin(t*.33)*.55+Math.sin(t*.91)*.12-sm(20.3,21.8,t)*.30;
  for(const l of L){
    const k=(1000-l.z)/1000;
    let s=1+dolly*k*.46,dx=-camX*k*86,dy=-dolly*k*22+Math.sin(t*.47)*k*3,a=1;
    if(l.z===70){s=1+dolly*.10;dx=-camX*9;dy=-dolly*4;a=lipsA(t);}

    if(l.z===230)ctx.globalCompositeOperation='lighter';
    ctx.translate(W/2+dx,H/2+dy);ctx.scale(s,s);ctx.translate(-W/2,-H/2);
    ctx.drawImage(l.c,0,0);ctx.restore();
  }
}

}

}

function finish(t){
  ctx.fillStyle=`rgba(0,0,0,${sm(22.0,22.6,t)})`;ctx.fillRect(0,0,W,H);

  const vg=ctx.createRadialGradient(640,360,170,640,360,770);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.80)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
