<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Loop</title>
<style>
  body { margin: 0; background: #000; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  canvas { width: 1280px; height: 720px; max-width: 100vw; max-height: 100vh; object-fit: contain; background: #f3f3f0; }
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<script>
const DUR = 22.0;
window.DUR = DUR;
const params = new URLSearchParams(location.search);
let startTime = parseFloat(params.get('t') || '0');
const ctx = document.getElementById('c').getContext('2d');
const PI = Math.PI;

function ease(t) {
  t = Math.max(0, Math.min(1, t));
  let lo=0, hi=1, mid=0;
  for(let i=0;i<12;i++){
    mid=(lo+hi)/2;
    let x = 3*(1-mid)*(1-mid)*mid*0.45 + 3*(1-mid)*mid*mid*0.15 + mid*mid*mid;
    if(x < t) lo=mid; else hi=mid;
  }
  return 3*(1-mid)*mid*mid + mid*mid*mid;
}
function E(t, s, d) { return ease((t - s) / d); }
function L(t, s, d) { return Math.max(0, Math.min(1, (t - s) / d)); }
function lerp(a, b, t) { return a + (b - a) * t; }

function makeCover(c1, c2, hz) {
  let cv = document.createElement('canvas'); cv.width=360; cv.height=360;
  let c = cv.getContext('2d');
  let g = c.createLinearGradient(0,0,0,360);
  g.addColorStop(0,c1); g.addColorStop(1,c2);
  c.fillStyle=g; c.fillRect(0,0,360,360);
  for(let i=0;i<15;i++){
    let x=Math.random()*360, y=Math.random()*360, r=20+Math.random()*60;
    let rg=c.createRadialGradient(x,y,0,x,y,r);
    rg.addColorStop(0,'rgba(255,255,255,0.12)'); rg.addColorStop(1,'rgba(255,255,255,0)');
    c.fillStyle=rg; c.beginPath(); c.arc(x,y,r,0,PI*2); c.fill();
  }
  c.fillStyle=hz; c.beginPath(); c.moveTo(0,360);
  for(let x=0;x<=360;x+=20) c.lineTo(x, 260+Math.sin(x*0.02)*30+Math.random()*10);
  c.lineTo(360,360); c.fill();
  return cv;
}
const cover1 = makeCover('#1a103c','#4a2c6d','#0a061a');
const cover2 = makeCover('#3c1a10','#8c4224','#1a0a06');

function drawPointer(x, y, clickT, alpha, t) {
  if(alpha<=0) return;
  ctx.save(); ctx.globalAlpha=alpha; ctx.translate(x,y);
  let sc = 1 - 0.15 * Math.max(0, 1 - Math.abs(t-clickT)/0.15);
  ctx.scale(sc,sc);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,24); ctx.lineTo(6,18);
  ctx.lineTo(10,28); ctx.lineTo(14,26); ctx.lineTo(10,16); ctx.lineTo(18,16); ctx.closePath();
  ctx.fillStyle='#000'; ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.lineJoin='round';
  ctx.fill(); ctx.stroke(); ctx.restore();
}
function ptrPath(t) {
  if(t<1.5) return [lerp(640,660,E(t,0,1.5)), lerp(360,370,E(t,0,1.5))];
  if(t<4.3) return [lerp(660,640,E(t,1.5,2.8)), lerp(370,360,E(t,1.5,2.8))];
  if(t<8.727) return [640+Math.sin(t*8)*2, 360+Math.cos(t*8)*2];
  if(t<12.5) return [lerp(640,448,E(t,8.727,3.773)), lerp(360,328,E(t,8.727,3.773))];
  if(t<13.3) return [lerp(448,168,E(t,12.5,0.8)), 328];
  if(t<14.5) return [lerp(168,715,E(t,13.3,1.2)), lerp(328,360,E(t,13.3,1.2))];
  if(t<15.7) return [lerp(715,1000,E(t,14.5,1.2)), 360];
  if(t<17.0) return [lerp(1000,840,E(t,15.7,1.3)), lerp(360,210,E(t,15.7,1.3))];
  return [840,210];
}

function drawGoo(dots, r, color) {
  ctx.fillStyle=color; ctx.strokeStyle=color; ctx.lineCap='round'; ctx.lineJoin='round';
  for(let i=0;i<dots.length;i++) for(let j=i+1;j<dots.length;j++){
    let d=Math.hypot(dots[i].x-dots[j].x, dots[i].y-dots[j].y);
    if(d<r*4){ let lw=2*r*(1-d/(r*4)); if(lw>0){ ctx.lineWidth=lw; ctx.beginPath(); ctx.moveTo(dots[i].x,dots[i].y); ctx.lineTo(dots[j].x,dots[j].y); ctx.stroke(); } }
  }
  dots.forEach(p=>{ ctx.beginPath(); ctx.arc(p.x,p.y,r,0,PI*2); ctx.fill(); });
}

function drawBubble(x, y, prog, text, isLeft, t) {
  let w=12+prog*228, h=12+prog*48, r=h/2;
  let bx=isLeft? x-w+12 : x-12, by=y-h/2;
  ctx.save(); ctx.shadowColor='rgba(0,0,0,0.15)'; ctx.shadowBlur=20*prog; ctx.shadowOffsetY=10*prog;
  ctx.fillStyle='#121212'; ctx.beginPath(); ctx.roundRect(bx,by,w,h,r); ctx.fill(); ctx.restore();
  if(prog>0.5){
    let chars=Math.floor(L(t,2.3,0.8)*text.length);
    if(t>3.9) chars=Math.floor((1-L(t,3.9,0.4))*text.length);
    ctx.fillStyle='#fff'; ctx.font='500 18px sans-serif'; ctx.textBaseline='middle'; ctx.textAlign='center';
    ctx.globalAlpha=(prog-0.5)*2; ctx.fillText(text.substring(0,chars), bx+w/2, by+h/2); ctx.globalAlpha=1;
  }
}

function frame(now) {
  let t = (now/1000 + startTime) % DUR;
  let beat = (t / (60/110)) % 1;
  let pulse = Math.pow(1 - beat, 4);

  ctx.fillStyle = '#f3f3f0'; ctx.fillRect(0,0,1280,720);

  let cam = {x:640, y:360, z:1};
  if(t>=8.727 && t<9.527) cam.z = 1 + E(t,8.727,0.8)*0.1;
  else if(t>=9.527 && t<10.327) cam.z = 1.1 - E(t,9.527,0.8)*0.3;
  else if(t>=10.327 && t<14.5) cam.z = 0.8;
  else if(t>=14.5 && t<15.3) { let e=E(t,14.5,0.8); cam.x=640+e*360; cam.y=360+e*190; cam.z=0.8+e*0.7; }
  else if(t>=15.3 && t<15.7) { cam={x:1000,y:550,z:1.5}; }
  else if(t>=15.7 && t<16.1) { cam={x:1000+E(t,15.7,0.8)*400, y:550, z:1.5}; }
  else if(t>=16.1 && t<17.0) { let e=E(t,16.1,0.9); cam.x=1400-e*100; cam.y=550-e*200; cam.z=1.5-e*0.5; }
  else if(t>=17.0 && t<17.8) { cam={x:1300,y:350,z:1.0}; }
  else if(t>=17.8 && t<18.6) { let e=E(t,17.8,0.8); cam.x=1300+e*200; cam.y=350-e*150; cam.z=1.0+e*19; }

  ctx.save();
  ctx.translate(640,360); ctx.scale(cam.z,cam.z); ctx.translate(-cam.x,-cam.y);

  if(t < 8.727) {
    if(t < 1.5) {
      let pw = t<0.8 ? lerp(160,48,E(t,0,0.8)) : 48;
      ctx.fillStyle='#121212'; ctx.beginPath(); ctx.roundRect(640-pw/2, 336, pw, 48, 24); ctx.fill();
      if(t<0.4){ ctx.globalAlpha=1-E(t,0,0.4); ctx.fillStyle='#fff'; ctx.font='500 18px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('Generate',640,360); ctx.globalAlpha=1; }
      if(t>0.4 && t<1.2) {
        ctx.strokeStyle='#1ed760'; ctx.lineWidth=4+pulse*2; ctx.lineCap='round';
        ctx.beginPath(); ctx.arc(640,360,24,t*10,t*10+PI*1.5); ctx.stroke();
      }
      if(t>1.091) {
        let ck=E(t,1.091,0.4); ctx.globalAlpha=ck;
        ctx.fillStyle='#1ed760'; ctx.beginPath(); ctx.arc(640,360,24,0,PI*2); ctx.fill();
        ctx.strokeStyle='#fff'; ctx.lineWidth=4; ctx.lineJoin='round';
        ctx.beginPath(); ctx.moveTo(630,360); ctx.lineTo(637,368); ctx.lineTo(652,352); ctx.stroke();
        ctx.globalAlpha=1;
      }
    }
    else if(t < 4.3) {
      let sp=E(t,1.5,0.8), mg=E(t,3.5,0.8);
      let p = sp * (1-mg);
      let mid={x:640,y:360};
      let left={x:640-p*190, y:360-p*160};
      let right={x:640+p*190, y:360+p*160};
      drawGoo([mid,left,right], 12, '#1ed760');
      if(t>2.3) {
        let bg = E(t,2.3,0.4) * (1 - E(t,3.5,0.4));
        if(bg>0) {
          drawBubble(left.x, left.y, bg, "is this all code?", true, t);
          drawBubble(right.x, right.y, bg, "yes. every frame.", false, t);
        }
      }
    }
    else {
      let e1=E(t,4.3,0.26), e2=E(t,4.56,0.26), e3=E(t,4.83,0.27);
      let p1={x:640-e1*12, y:360-e1*18}, p2={x:640-e2*12, y:360+e2*18}, p3={x:640+e3*24, y:360};
      let sc = 1 + pulse*0.05;
      ctx.save(); ctx.translate(640,360); ctx.scale(sc,sc); ctx.translate(-640,-360);
      ctx.fillStyle='#1ed760'; ctx.strokeStyle='#1ed760'; ctx.lineWidth=12; ctx.lineJoin='round'; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.lineTo(p3.x,p3.y); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
    }
  }

  if(t >= 8.727 && t < 18.6) {
    let fl = E(t,8.727,0.8);
    ctx.fillStyle=`rgba(10,10,10,${fl})`; ctx.fillRect(-2000,-2000,5000,5000);
    if(fl>0){
      ctx.fillStyle=`rgba(255,255,255,${0.08*fl})`;
      for(let x=-1000;x<3000;x+=40) for(let y=-1000;y<2000;y+=40){ ctx.beginPath(); ctx.arc(x,y,1.5,0,PI*2); ctx.fill(); }
    }
    ctx.save(); ctx.translate(640,360); ctx.scale(fl,fl); ctx.translate(-640,-360);
    ctx.shadowColor='rgba(0,0,0,0.6)'; ctx.shadowBlur=60+pulse*20; ctx.shadowOffsetY=30;
    ctx.fillStyle='#121212'; ctx.beginPath(); ctx.roundRect(140,60,1000,600,24); ctx.fill();
    ctx.shadowColor='transparent';

    ctx.save(); ctx.beginPath(); ctx.roundRect(140,60,1000,600,24); ctx.clip();
    ctx.fillStyle='rgba(42,27,84,0.35)'; ctx.fillRect(140,60,1000,600);
    let sw=E(t,12.5,0.8);
    ctx.globalAlpha=sw; ctx.fillStyle='rgba(84,42,27,0.35)'; ctx.fillRect(140,60,1000,600); ctx.globalAlpha=1;

    let c1x=220-sw*420, c2x=580-sw*360;
    ctx.save(); ctx.beginPath(); ctx.roundRect(c1x,140,360,360,12); ctx.clip(); ctx.drawImage(cover1,c1x,140); ctx.restore();
    ctx.save(); ctx.beginPath(); ctx.roundRect(c2x,140,360,360,12); ctx.clip(); ctx.drawImage(cover2,c2x,140); ctx.restore();

    let tA=1-L(t,12.9,0.4);
    ctx.globalAlpha=tA; ctx.fillStyle='#fff'; ctx.font='bold 36px sans-serif'; ctx.textAlign='left'; ctx.fillText('Head Bang',640,220);
    ctx.fillStyle='#aaa'; ctx.font='20px sans-serif'; ctx.fillText('Mixkit',640,255);
    ctx.globalAlpha=L(t,12.9,0.4); ctx.fillStyle='#fff'; ctx.font='bold 36px sans-serif'; ctx.fillText('Atmospheric Two',640,220);
    ctx.fillStyle='#aaa'; ctx.font='20px sans-serif'; ctx.fillText('Mixkit',640,255); ctx.globalAlpha=1;

    ctx.save(); ctx.translate(640,300); ctx.beginPath(); ctx.moveTo(0,10); ctx.bezierCurveTo(-20,-10,-10,-20,0,-10); ctx.bezierCurveTo(10,-20,20,-10,0,10);
    ctx.strokeStyle='#1ed760'; ctx.lineWidth=3; ctx.stroke();
    let hf=E(t,9.527,0.8); ctx.clip(); ctx.fillStyle='#1ed760'; ctx.fillRect(-20,10-30*hf,40,30); ctx.restore();

    ctx.fillStyle='#333'; ctx.beginPath(); ctx.roundRect(640,380,400,6,3); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.roundRect(640,380,120,6,3); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.moveTo(790,440); ctx.lineTo(790,470); ctx.lineTo(810,455); ctx.fill();
    ctx.beginPath(); ctx.moveTo(890,440); ctx.lineTo(890,470); ctx.lineTo(870,455); ctx.fill();
    ctx.restore(); 

    let vX=900, vY=550, kX=1050;
    if(t>15.3) kX=1050+E(t,15.3,0.8)*250;
    let ch=E(t,16.1,0.9);
    ctx.beginPath(); ctx.moveTo(vX,vY);
    if(ch===0){
      ctx.lineTo(kX,vY); ctx.strokeStyle='#fff'; ctx.lineWidth=6;
      ctx.stroke();
      ctx.beginPath(); ctx.moveTo(vX,vY); ctx.lineTo(Math.min(kX,1100),vY); ctx.stroke();
      if(kX>1100){ ctx.strokeStyle=`rgba(255,255,255,${1-(kX-1100)/200})`; ctx.beginPath(); ctx.moveTo(1100,vY); ctx.lineTo(kX,vY); ctx.stroke(); }
    } else {
      ctx.lineTo(1100,vY);
      let cp1x=1200, cp1y=vY, cp2x=1100+ch*150, cp2y=vY-ch*350, eX=1100+ch*400, eY=vY-ch*350;
      ctx.bezierCurveTo(cp1x,cp1y,cp2x,cp2y,eX,eY);
      ctx.strokeStyle=`rgb(${255-ch*225},${255-ch*40},${255-ch*159})`; ctx.lineWidth=6+ch*2+pulse*2; ctx.stroke();
      kX=eX; vY=eY;
    }
    if(t<18.0){ ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(kX,vY,10,0,PI*2); ctx.fill(); }
    if(ch>0){ ctx.fillStyle='#1ed760'; ctx.font='bold 28px sans-serif'; ctx.textAlign='center'; ctx.globalAlpha=ch; ctx.fillText(Math.floor(ch*100)+'%',kX,vY-40); ctx.globalAlpha=1; }
    ctx.restore(); 

    if(t<9.527){
      let dc=L(t,9.127,0.4); ctx.globalAlpha=1-dc;
      let p1={x:628,y:342}, p2={x:628,y:378}, p3={x:664,y:360};
      ctx.fillStyle='#1ed760'; ctx.strokeStyle='#1ed760'; ctx.lineWidth=12; ctx.lineJoin='round';
      ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.lineTo(p3.x,p3.y); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.globalAlpha=1;
    }

    let pb=E(t,9.527,0.8), pbx=640+pb*200, pby=360+pb*95;
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(pbx,pby,24,0,PI*2); ctx.fill();
    if(pb>0.5){ ctx.globalAlpha=(pb-0.5)*2; ctx.fillStyle='#121212'; ctx.fillRect(pbx-6,pby-8,4,16); ctx.fillRect(pbx+2,pby-8,4,16); ctx.globalAlpha=1; }

    if(t>=17.8){ let e=E(t,17.8,0.8); ctx.fillStyle='#f3f3f0'; ctx.beginPath(); ctx.arc(1500,200,e*150,0,PI*2); ctx.fill(); }
  }
  ctx.restore(); 

  if(t>=18.6){
    ctx.fillStyle='#f3f3f0'; ctx.fillRect(0,0,1280,720);
    let cx=640, cy=360;
    let gr=E(t,18.6,0.8), nr=E(t,19.4,0.8), fn=E(t,20.2,0.8), lp=E(t,21.2,0.8);
    let w=(240*gr)-(40*nr), h=(56*gr)-(54*nr), r=h/2;
    if(fn<1 && lp===0){
      ctx.globalAlpha=(1-fn); ctx.fillStyle='#121212'; ctx.beginPath(); ctx.roundRect(cx-w/2,cy-h/2,w,h,r); ctx.fill();
      if(nr<0.5 && gr>0.5){ ctx.globalAlpha*=(1-nr*2)*(gr*2-1); ctx.fillStyle='#fff'; ctx.font='bold 20px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('Ask my product',cx,cy); }
      ctx.globalAlpha=1;
    }
    if(fn>0){
      let br=L(t,21.0,1.0);
      ctx.save(); ctx.translate(cx,cy); ctx.rotate(br*0.1); ctx.scale(1+br*0.05, 1+br*0.05); ctx.scale(1-lp, 1-lp);
      for(let i=0;i<12;i++){
        let odd=i%2!==0, sc=odd?L(fn,0.5,0.5):L(fn,0,0.5); if(sc<=0) continue;
        let ang=i*PI/6; if(odd) ang-=(1-L(fn,0.5,0.5))*PI/6;
        ctx.save(); ctx.rotate(ang); ctx.scale(sc,sc); ctx.fillStyle='#D97757';
        ctx.beginPath(); ctx.moveTo(0,-10); ctx.lineTo(70,-5); ctx.lineTo(70,5); ctx.lineTo(0,10); ctx.closePath(); ctx.fill(); ctx.restore();
      }
      ctx.restore();
    }
    if(lp>0){
      ctx.globalAlpha=lp; ctx.fillStyle='#121212'; ctx.beginPath(); ctx.roundRect(cx-80,cy-24,160,48,24); ctx.fill();
      ctx.fillStyle='#fff'; ctx.font='500 18px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('Generate',cx,cy); ctx.globalAlpha=1;
    }
  }

  let pAlpha=1;
  if(t>=18.0 && t<18.5) pAlpha=1-E(t,18.0,0.5);
  else if(t>=18.5 && t<21.5) pAlpha=0;
  else if(t>=21.5) pAlpha=E(t,21.5,0.5);
  
  let clicks=[0, 8.727, 17.8, 22.0];
  let cT=clicks.reduce((p,c)=>Math.abs(c-t)<Math.abs(p-t)?c:p);
  let [px,py]= t>=18.6 ? [640,360] : ptrPath(t);
  drawPointer(px,py,cT,pAlpha,t);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
