<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Winkz Enterprises</title>
<style>
html,body{margin:0;background:#000;height:100%;overflow:hidden}
#wrap{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center}
canvas{display:block}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1280" height="720"></canvas></div>
<script>
window.DUR=15;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const wrap=document.getElementById('wrap');
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);wrap.style.transform='translate(-50%,-50%) scale('+s+')';}
addEventListener('resize',fit);fit();
const q=new URLSearchParams(location.search);
const off=Math.max(0,parseFloat(q.get('t'))||0);
const t0=performance.now()-off*1000;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const eo=t=>1-Math.pow(1-t,3);
const ei=t=>t*t*(3-2*t);
const GOLD='#e8c07a',ORA='#ff8a3d',CREAM='#f6f1e8',MUTE='#9aa3b5';
const parts=[];
for(let i=0;i<90;i++){
  parts.push({x:Math.random()*1280,y:Math.random()*720,z:0.3+Math.random()*1.2,p:Math.random()*6.28,s:1+Math.random()*2.2});
}
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function glow(x,y,r,c,a){
  const g=ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,c);g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.globalAlpha=a;ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,6.283);ctx.fill();ctx.globalAlpha=1;
}
function mark(x,y,s,wink){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  ctx.fillStyle=GOLD;
  ctx.beginPath();ctx.moveTo(0,-46);ctx.lineTo(40,-8);ctx.lineTo(16,46);ctx.lineTo(-16,46);ctx.lineTo(-40,-8);ctx.closePath();ctx.fill();
  ctx.fillStyle='#14120e';
  ctx.beginPath();ctx.arc(0,2,16,0,6.283);ctx.fill();
  ctx.fillStyle=CREAM;
  ctx.beginPath();ctx.ellipse(0,2,9,9*(1-wink*0.85),0,0,6.283);ctx.fill();
  ctx.fillStyle='#1a140c';
  ctx.beginPath();ctx.arc(2,2,3.2,0,6.283);ctx.fill();
  ctx.fillStyle=ORA;
  ctx.beginPath();ctx.arc(5,-2,1.4,0,6.283);ctx.fill();
  if(wink>0.05){
    ctx.strokeStyle=GOLD;ctx.lineWidth=3;ctx.beginPath();
    ctx.moveTo(-12,2-wink*6);ctx.quadraticCurveTo(0,-8-wink*10,12,2-wink*6);ctx.stroke();
  }
  ctx.restore();
}
function card(x,y,w,h,a,title,body,k){
  ctx.save();ctx.globalAlpha=a;
  ctx.translate(x,y);
  rr(-w/2,-h/2,w,h,18);
  ctx.fillStyle='rgba(18,16,14,0.88)';ctx.fill();
  ctx.strokeStyle='rgba(232,192,122,0.45)';ctx.lineWidth=1.5;ctx.stroke();
  ctx.fillStyle=ORA;rr(-w/2+22,-h/2+22,36,6,3);ctx.fill();
  ctx.fillStyle=GOLD;ctx.font='700 13px Segoe UI,system-ui,sans-serif';ctx.fillText('0'+(k+1),-w/2+22,-h/2+52);
  ctx.fillStyle=CREAM;ctx.font='700 26px Segoe UI,system-ui,sans-serif';ctx.fillText(title,-w/2+22,-8);
  ctx.fillStyle=MUTE;ctx.font='16px Segoe UI,system-ui,sans-serif';
  const lines=body.split('\n');
  lines.forEach((ln,i)=>ctx.fillText(ln,-w/2+22,28+i*22));
  ctx.restore();
}
function frame(now){
  let t=((now-t0)/1000)%window.DUR;if(t<0)t+=window.DUR;
  ctx.clearRect(0,0,1280,720);
  const bg=ctx.createLinearGradient(0,0,1280,720);
  bg.addColorStop(0,'#07080c');bg.addColorStop(1,'#12100e');
  ctx.fillStyle=bg;ctx.fillRect(0,0,1280,720);
  glow(240,120,420,'rgba(255,138,61,0.16)',0.9);
  glow(1000,560,480,'rgba(232,192,122,0.12)',0.8);
  ctx.strokeStyle='rgba(255,255,255,0.04)';
  for(let x=40;x<1280;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,720);ctx.stroke();}
  for(let y=40;y<720;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(1280,y);ctx.stroke();}
  parts.forEach(p=>{
    const x=(p.x+t*18*p.z)%1280,y=(p.y+Math.sin(t*0.6+p.p)*12+720)%720;
    ctx.globalAlpha=0.25+0.35*p.z;ctx.fillStyle=GOLD;
    ctx.fillRect(x,y,p.s,p.s);ctx.globalAlpha=1;
  });
  const intro=seg(t,0.2,1.1),hold=1-seg(t,2.6,3.3);
  const ia=Math.min(intro,hold);
  if(ia>0.01){
    const wink=Math.sin(clamp((t-1.15)/0.35,0,1)*3.14);
    mark(640,250+ (1-eo(intro))*40,1.35,Math.max(0,wink));
    ctx.globalAlpha=ia;
    ctx.textAlign='center';
    ctx.fillStyle=CREAM;ctx.font='700 72px Segoe UI,system-ui,sans-serif';
    ctx.fillText('WINKZ',640,400);
    ctx.fillStyle=GOLD;ctx.font='600 22px Segoe UI,system-ui,sans-serif';
    ctx.letterSpacing='6px';
    ctx.fillText('ENTERPRISES',640,438);
    ctx.fillStyle=MUTE;ctx.font='20px Segoe UI,system-ui,sans-serif';
    ctx.fillText('Amazon wholesale, built for brands.',640,482);
    ctx.globalAlpha=1;ctx.textAlign='left';
  }
  const flowA=seg(t,3.1,3.8)*(1-seg(t,7.5,8.2));
  if(flowA>0.01){
    ctx.globalAlpha=flowA;ctx.textAlign='center';
    ctx.fillStyle=CREAM;ctx.font='700 40px Segoe UI,system-ui,sans-serif';
    ctx.fillText('Your products. Our engine. Amazon scale.',640,92);
    ctx.textAlign='left';ctx.globalAlpha=1;
    const boxes=6;
    for(let i=0;i<boxes;i++){
      const u=ei(seg(t,3.2+i*0.12,4.4+i*0.08));
      const x=lerp(80,430,u),y=210+i*62;
      ctx.globalAlpha=flowA*u;
      rr(x,y,150,48,10);ctx.fillStyle='#1c1915';ctx.fill();
      ctx.fillStyle=['#ff8a3d','#e8c07a','#f6f1e8','#c47b4a','#ffe0b0','#ffb067'][i];
      rr(x+10,y+12,24,24,6);ctx.fill();
      ctx.fillStyle=MUTE;ctx.font='14px Segoe UI,system-ui,sans-serif';
      ctx.fillText('SKU 0'+(i+1),x+44,y+30);
      ctx.globalAlpha=1;
    }
    const hub=eo(seg(t,4.0,4.8));
    ctx.globalAlpha=flowA*hub;
    rr(520,250,240,180,20);ctx.fillStyle='rgba(20,16,12,0.95)';ctx.fill();
    ctx.strokeStyle=GOLD;ctx.stroke();
    mark(640,310,0.55,0);
    ctx.textAlign='center';ctx.fillStyle=CREAM;ctx.font='700 20px Segoe UI,system-ui,sans-serif';
    ctx.fillText('WINKZ',640,390);
    ctx.fillStyle=MUTE;ctx.font='14px Segoe UI,system-ui,sans-serif';
    ctx.fillText('wholesale ops',640,412);
    ctx.textAlign='left';ctx.globalAlpha=1;
    const out=eo(seg(t,4.6,5.6));
    ctx.globalAlpha=flowA*out;
    rr(860,230,300,220,20);ctx.fillStyle='rgba(16,14,12,0.95)';ctx.fill();
    ctx.strokeStyle='rgba(255,138,61,0.7)';ctx.stroke();
    ctx.fillStyle=ORA;ctx.font='700 16px Segoe UI,system-ui,sans-serif';
    ctx.fillText('MARKETPLACE',884,268);
    ctx.strokeStyle='rgba(232,192,122,0.35)';ctx.beginPath();
    ctx.moveTo(890,400);ctx.lineTo(1120,400);ctx.stroke();
    ctx.beginPath();ctx.strokeStyle=GOLD;ctx.lineWidth=3;
    const pts=[[890,380],[940,360],[990,340],[1040,300],[1090,250],[1130,220]];
    ctx.moveTo(pts[0][0],pts[0][1]);
    for(let i=1;i<pts.length;i++){
      const k=seg(t,5.2,6.8);
      if(i/pts.length<=k)ctx.lineTo(pts[i][0],pts[i][1]);
    }
    ctx.stroke();ctx.lineWidth=1;
    ctx.fillStyle=CREAM;ctx.font='15px Segoe UI,system-ui,sans-serif';
    ctx.fillText('Discovery  ·  Trust  ·  Repeat',884,418);
    ctx.globalAlpha=1;
    ctx.strokeStyle='rgba(232,192,122,'+(0.35*flowA)+')';ctx.setLineDash([6,8]);
    ctx.beginPath();ctx.moveTo(240,400);ctx.lineTo(520,340);ctx.stroke();
    ctx.beginPath();ctx.moveTo(760,340);ctx.lineTo(860,340);ctx.stroke();
    ctx.setLineDash([]);
  }
  const pills=[
    ['REACH','Shoppers already\nsearching your category'],
    ['PROTECT','MAP, assets, and\nbrand voice respected'],
    ['PERFORM','FBA-ready turns\nand clear reporting']
  ];
  pills.forEach((p,i)=>{
    const a=eo(seg(t,8.0+i*0.25,8.7+i*0.25))*(1-seg(t,11.6,12.3));
    if(a<=0)return;
    const x=250+i*390,y=360+(1-a)*30;
    card(x,y,340,230,a,p[0],p[1],i);
  });
  if(t>8&&t<12.2){
    ctx.globalAlpha=seg(t,8.0,8.5)*(1-seg(t,11.6,12.3));
    ctx.textAlign='center';ctx.fillStyle=CREAM;ctx.font='700 36px Segoe UI,system-ui,sans-serif';
    ctx.fillText('Why brands let Winkz sell.',640,120);
    ctx.fillStyle=MUTE;ctx.font='18px Segoe UI,system-ui,sans-serif';
    ctx.fillText('Volume without losing the brand.',640,158);
    ctx.textAlign='left';ctx.globalAlpha=1;
  }
  const end=eo(seg(t,12.15,12.9));
  if(end>0.01){
    ctx.globalAlpha=end;
    mark(640,230,1.15,0);
    ctx.textAlign='center';
    ctx.fillStyle=CREAM;ctx.font='700 54px Segoe UI,system-ui,sans-serif';
    ctx.fillText('Let Winkz carry your brand.',640,390);
    ctx.fillStyle=GOLD;ctx.font='600 24px Segoe UI,system-ui,sans-serif';
    ctx.fillText('Sell more. Stay in control.',640,440);
    ctx.fillStyle=MUTE;ctx.font='18px Segoe UI,system-ui,sans-serif';
    ctx.fillText('WINKZ ENTERPRISES   ·   AMAZON WHOLESALE',640,500);
    const bw=eo(seg(t,13.1,13.8));
    ctx.globalAlpha=end*bw;
    rr(490,540,300,54,27);ctx.fillStyle=ORA;ctx.fill();
    ctx.fillStyle='#1a1008';ctx.font='700 20px Segoe UI,system-ui,sans-serif';
    ctx.fillText('Partner with us',640,574);
    ctx.textAlign='left';ctx.globalAlpha=1;
  }
  ctx.fillStyle='rgba(255,255,255,0.08)';ctx.fillRect(80,690,1120,4);
  ctx.fillStyle=GOLD;ctx.fillRect(80,690,1120*(t/window.DUR),4);
  ctx.fillStyle=MUTE;ctx.font='12px Segoe UI,system-ui,sans-serif';
  ctx.fillText('WINKZ ENTERPRISES',80,678);
  ctx.textAlign='right';ctx.fillText('A brand partnership film',1200,678);ctx.textAlign='left';
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
