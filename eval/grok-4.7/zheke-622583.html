<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Motion Study</title>
<style>
html,body{margin:0;background:#000;height:100%;overflow:hidden}
#wrap{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center}
canvas{display:block;background:#000}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1280" height="720"></canvas></div>
<script>
window.DUR=24;
const wrap=document.getElementById('wrap');
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
function fit(){wrap.style.transform='translate(-50%,-50%) scale('+Math.min(innerWidth/1280,innerHeight/720)+')'}
addEventListener('resize',fit);fit();
const q=new URLSearchParams(location.search);
const tOff=parseFloat(q.get('t'))||0;
const tStart=performance.now()-tOff*1000;
function clamp(a,b,x){return x<a?a:x>b?b:x}
function seg(t,a,b){return clamp(0,1,(t-a)/(b-a))}
function sm(t){t=clamp(0,1,t);return t*t*(3-2*t)}
function eo(t){t=clamp(0,1,t);return 1-Math.pow(1-t,3)}
function eio(t){t=clamp(0,1,t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
function back(t){t=clamp(0,1,t);const c=1.70158,c3=c+1;return 1+c3*Math.pow(t-1,3)+c*Math.pow(t-1,2)}
function wf(t,a,b,c,d){return Math.min(seg(t,a,b),1-seg(t,c,d))}
function hash(n){const x=Math.sin(n*127.1+n*n*0.017)*43758.5453;return x-Math.floor(x)}
function win(t,a,b,c,d){return sm(seg(t,a,b))*(1-sm(seg(t,c,d)))}

function word(text,x,y,font,color,alpha,track,rise,stagger,local,mode){
  ctx.save();
  ctx.font=font;
  ctx.textBaseline='middle';
  ctx.textAlign='left';
  ctx.fillStyle=color;
  const ch=text.split('');
  const w=ch.map(c=>ctx.measureText(c).width);
  let total=0; for(let i=0;i<w.length;i++) total+=w[i];
  total+=track*Math.max(0,ch.length-1);
  let cx=x-total/2;
  for(let i=0;i<ch.length;i++){
    const lt=seg(local,i*stagger,i*stagger+0.55);
    const e=mode==='back'?back(lt):eo(lt);
    ctx.globalAlpha=alpha*e;
    ctx.fillText(ch[i],cx,y+(1-e)*rise);
    cx+=w[i]+track;
  }
  ctx.restore();
}

function ring(cx,cy,r,rot,span,w,col,a){
  ctx.save();
  ctx.globalAlpha=a;
  ctx.strokeStyle=col;
  ctx.lineWidth=w;
  ctx.lineCap='round';
  ctx.beginPath();
  ctx.arc(cx,cy,r,rot,rot+span);
  ctx.stroke();
  ctx.restore();
}

function marks(a){
  ctx.save();
  ctx.globalAlpha=a;
  ctx.strokeStyle='#f3efe6';
  ctx.lineWidth=1;
  const L=28,m=46;
  const pts=[[m,m,1,1],[1280-m,m,-1,1],[m,720-m,1,-1],[1280-m,720-m,-1,-1]];
  for(const p of pts){
    ctx.beginPath();
    ctx.moveTo(p[0]+p[2]*10,p[1]);
    ctx.lineTo(p[0]+p[2]*(10+L),p[1]);
    ctx.moveTo(p[0],p[1]+p[3]*10);
    ctx.lineTo(p[0],p[1]+p[3]*(10+L));
    ctx.stroke();
  }
  ctx.restore();
}

function draw(t){
  const W=1280,H=720,cx=640,cy=360;
  const loop=Math.min(sm(seg(t,0,0.55)),1-sm(seg(t,23.15,24)));
  ctx.clearRect(0,0,W,H);
  const g=ctx.createRadialGradient(cx+Math.sin(t*0.3)*40,cy-20,40,cx,cy,620);
  g.addColorStop(0,'#16130f');
  g.addColorStop(0.45,'#0b0a09');
  g.addColorStop(1,'#050504');
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);

  const dustA=0.55*loop;
  for(let i=0;i<80;i++){
    const z=0.25+hash(i*1.7)*0.75;
    const x=(hash(i*3.1)*W+Math.sin(t*0.22*z+i)*36+t*8*z)%W;
    const y=(hash(i*8.2)*H+Math.cos(t*0.13+i*1.7)*16+H)%H;
    ctx.globalAlpha=dustA*(0.08+0.22*z);
    ctx.fillStyle=i%7===0?'#e8b15a':'#f4efe6';
    ctx.fillRect(x,y,z*1.6,z*1.6);
  }
  ctx.globalAlpha=1;

  const geo=win(t,0.4,1.6,21.4,23.0);
  for(let i=0;i<9;i++){
    const yy=160+i*48;
    const amp=40+hash(i+2)*180;
    const wbar=(80+amp)*(0.35+0.65*eio(seg(t,0.8+i*0.06,1.8+i*0.06)));
    ctx.globalAlpha=geo*0.09;
    ctx.fillStyle='#e8b15a';
    ctx.fillRect(78,yy,wbar*(0.55+0.45*Math.sin(t*0.9+i)),1.5);
  }

  const breathe=1+Math.sin(t*0.7)*0.012;
  ctx.save();
  ctx.translate(cx,cy);
  ctx.scale(breathe,breathe);
  ctx.translate(-cx,-cy);
  const open=eo(seg(t,0.3,2.2));
  ring(cx,cy,210*open,t*0.35,Math.PI*1.65,1,'#f3efe6',0.35*geo);
  ring(cx,cy,248*open,-t*0.22,Math.PI*1.2,1,'#e8b15a',0.55*geo);
  ring(cx,cy,168*open,t*0.5+1,1.1,2.2,'#f3efe6',0.7*geo);
  ring(cx,cy,292*Math.min(1,open*1.05),t*0.15,0.55,1.5,'#e8b15a',0.8*geo);
  const dots=12;
  for(let i=0;i<dots;i++){
    const a=t*0.45+i*(Math.PI*2/dots);
    const rr=248*open;
    const hot=i===Math.floor((t*1.4)%dots);
    ctx.globalAlpha=(hot?0.95:0.35)*geo;
    ctx.fillStyle=hot?'#e8b15a':'#f3efe6';
    ctx.beginPath();
    ctx.arc(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr,hot?3.2:1.6,0,6.3);
    ctx.fill();
  }
  ctx.restore();

  const sweep=win(t,2.1,2.6,4.6,5.4);
  if(sweep>0.01){
    ctx.save();
    ctx.globalAlpha=0.22*sweep;
    ctx.translate(cx,cy);
    ctx.rotate(-0.4+eio(seg(t,2.0,5.2))*1.3);
    const lg=ctx.createLinearGradient(-400,0,400,0);
    lg.addColorStop(0,'rgba(232,177,90,0)');
    lg.addColorStop(0.5,'rgba(243,239,230,0.9)');
    lg.addColorStop(1,'rgba(232,177,90,0)');
    ctx.fillStyle=lg;
    ctx.fillRect(-420,-1.2,840,2.4);
    ctx.restore();
  }

  marks(sm(seg(t,0.2,1.1))* (1-sm(seg(t,22.2,23.2))) *loop);

  ctx.save();
  ctx.globalAlpha=win(t,0.8,1.6,22.4,23.1)*loop;
  ctx.fillStyle='#f3efe6';
  ctx.font='12px Futura, Avenir, Trebuchet MS, sans-serif';
  ctx.textAlign='left';
  ctx.textBaseline='middle';
  const idx=t<8? '01  FORM' : t<14.5? '02  RHYTHM' : '03  LIGHT';
  ctx.fillText(idx,72,58);
  ctx.textAlign='right';
  ctx.fillText('MOTION STUDY',1208,58);
  ctx.restore();

  const s1=win(t,1.5,2.4,6.6,7.6);
  word('ATELIER',cx,cy-8,'64px Didot, Bodoni MT, Times New Roman, serif','#f6f1e8',s1*loop,10,28,0.06,seg(t,1.5,4.2),'back');
  ctx.save();
  ctx.globalAlpha=s1*loop;
  const rule=eo(seg(t,2.3,3.4))*220;
  ctx.strokeStyle='#e8b15a';
  ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(cx-rule,cy+42);
  ctx.lineTo(cx+rule,cy+42);
  ctx.stroke();
  ctx.font='13px Futura, Avenir, Trebuchet MS, sans-serif';
  ctx.fillStyle='#e8b15a';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.globalAlpha=sm(seg(t,2.8,3.6))*s1*loop;
  ctx.fillText('A  STUDY  IN  TIME',cx,cy+66);
  ctx.restore();

  const s2=win(t,7.0,7.9,12.8,13.8);
  word('CHOREOGRAPHY',cx,cy-6,'58px Didot, Bodoni MT, Times New Roman, serif','#f6f1e8',s2*loop,4,36,0.045,seg(t,7.0,10.2),'back');
  const subs=['ease','rhythm','space'];
  for(let i=0;i<3;i++){
    const a=win(t,8.2+i*0.7,8.8+i*0.7,12.6,13.6);
    ctx.save();
    ctx.globalAlpha=a*loop;
    ctx.font='13px Futura, Avenir, Trebuchet MS, sans-serif';
    ctx.fillStyle='#e8b15a';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText(subs[i].toUpperCase(),cx-160+i*160,cy+58);
    ctx.restore();
  }

  const s3=win(t,13.4,14.3,20.2,21.2);
  const lines=[
    ['EASE','the curve you feel, not the one you see'],
    ['RHYTHM','repetition given room to breathe'],
    ['SPACE','silence, held on purpose']
  ];
  for(let i=0;i<3;i++){
    const lt=seg(t,13.6+i*0.45,14.5+i*0.45);
    const e=eo(lt);
    const y=cy-70+i*78;
    ctx.save();
    ctx.globalAlpha=s3*e*loop;
    ctx.textAlign='left';
    ctx.textBaseline='middle';
    ctx.font='28px Didot, Bodoni MT, Times New Roman, serif';
    ctx.fillStyle='#f6f1e8';
    ctx.fillText(lines[i][0],cx-250+(1-e)*40,y);
    ctx.font='15px Futura, Avenir, Trebuchet MS, sans-serif';
    ctx.fillStyle='#cbbfa8';
    ctx.fillText(lines[i][1],cx-250+(1-e)*50,y+28);
    ctx.restore();
  }

  const s4=win(t,20.3,21.2,23.05,23.7);
  ctx.save();
  ctx.globalAlpha=s4*loop;
  ctx.strokeStyle='#e8b15a';
  ctx.lineWidth=1.25;
  ctx.beginPath();
  ctx.arc(cx,cy-18,46,0,Math.PI*2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx-16,cy-18);
  ctx.lineTo(cx+16,cy-18);
  ctx.moveTo(cx,cy-34);
  ctx.lineTo(cx,cy-2);
  ctx.stroke();
  ctx.restore();
  word('FLOW',cx,cy+58,'42px Didot, Bodoni MT, Times New Roman, serif','#f6f1e8',s4*loop,12,16,0.05,seg(t,20.6,22),'eo');
  ctx.save();
  ctx.globalAlpha=sm(seg(t,21.3,21.9))*s4*loop;
  ctx.font='12px Futura, Avenir, Trebuchet MS, sans-serif';
  ctx.fillStyle='#e8b15a';
  ctx.textAlign='center';
  ctx.fillText('MOTION  MADE  VISIBLE',cx,cy+92);
  ctx.restore();

  const prog=t/24;
  ctx.save();
  ctx.globalAlpha=0.85*loop;
  ctx.strokeStyle='rgba(243,239,230,0.18)';
  ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(72,678);
  ctx.lineTo(1208,678);
  ctx.stroke();
  ctx.strokeStyle='#e8b15a';
  ctx.beginPath();
  ctx.moveTo(72,678);
  ctx.lineTo(72+1136*prog,678);
  ctx.stroke();
  ctx.fillStyle='#f3efe6';
  ctx.font='11px Futura, Avenir, Trebuchet MS, sans-serif';
  ctx.textAlign='left';
  ctx.textBaseline='middle';
  ctx.fillText(String(Math.floor(t)).padStart(2,'0')+'  /  24',72,658);
  ctx.restore();

  const vg=ctx.createRadialGradient(cx,cy,280,cx,cy,700);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(0,0,0,0.55)');
  ctx.fillStyle=vg;
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(0,0,0,'+(1-loop)+')';
  ctx.fillRect(0,0,W,H);
}

function frame(now){
  let t=((now-tStart)/1000)%window.DUR;
  if(t<0)t+=window.DUR;
  draw(t);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
