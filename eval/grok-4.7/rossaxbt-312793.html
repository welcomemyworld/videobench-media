<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ask Claude</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform:translate(-50%,-50%);transform-origin:50% 50%}
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<script>
window.DUR=22;
const DUR=22, PX=640, PY=548;
const qs=new URLSearchParams(location.search).get("t");
const OFF=isFinite(parseFloat(qs))?parseFloat(qs):0;
const t0=performance.now()-OFF*1000;
const ease=p=>{
  if(p<=0)return 0; if(p>=1)return 1;
  let lo=0,hi=1,u=p;
  for(let i=0;i<16;i++){
    u=(lo+hi)/2;
    const x=3*.45*u*(1-u)*(1-u)+3*.15*u*u*(1-u)+u*u*u;
    if(x<p)lo=u; else hi=u;
  }
  u=(lo+hi)/2;
  return 3*u*u-2*u*u*u;
};
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const lin=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const seg=(t,a,b)=>ease(lin(t,a,b));
const dis=(t,a,b)=>{const p=lin(t,a,b);return p<.5?1:1-(p-.5)*2;};
const font=(w,s)=>w+" "+s+"px ui-sans-serif,system-ui,sans-serif";
const cv=document.getElementById("c"), ctx=cv.getContext("2d");
function fit(){cv.style.transform="translate(-50%,-50%) scale("+Math.min(innerWidth/1280,innerHeight/720)+")";}
addEventListener("resize",fit); fit();
function rr(x,y,w,h,r){
  r=Math.max(0,Math.min(r,w/2,h/2));
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function foot(x,y,w,lift){
  ctx.fillStyle="rgba(0,0,0,"+(0.05+lift*0.07)+")";
  ctx.beginPath();
  ctx.ellipse(x,y+10+lift*8,w*(.55+lift*.15),5+lift*5,0,0,6.2832);
  ctx.fill();
}
function cover(id,x,y,w,h){
  ctx.save(); rr(x,y,w,h,10); ctx.clip();
  const g=ctx.createLinearGradient(x,y,x+w*.2,y+h);
  if(id===0){
    g.addColorStop(0,"#1a3c4c"); g.addColorStop(.52,"#c46a45"); g.addColorStop(1,"#ead6b4");
    ctx.fillStyle=g; ctx.fillRect(x,y,w,h);
    ctx.fillStyle="#102833";
    ctx.beginPath();
    ctx.moveTo(x,y+h*.74);
    ctx.quadraticCurveTo(x+w*.32,y+h*.5,x+w*.58,y+h*.7);
    ctx.quadraticCurveTo(x+w*.82,y+h*.86,x+w,y+h*.6);
    ctx.lineTo(x+w,y+h); ctx.lineTo(x,y+h); ctx.fill();
    ctx.fillStyle="rgba(255,236,214,.9)";
    ctx.beginPath(); ctx.arc(x+w*.7,y+h*.36,w*.075,0,7); ctx.fill();
  }else{
    g.addColorStop(0,"#221232"); g.addColorStop(.48,"#6a3058"); g.addColorStop(1,"#e0a06a");
    ctx.fillStyle=g; ctx.fillRect(x,y,w,h);
    ctx.fillStyle="#120a18";
    ctx.beginPath();
    ctx.moveTo(x,y+h*.66);
    ctx.lineTo(x+w*.4,y+h*.56); ctx.lineTo(x+w,y+h*.7); ctx.lineTo(x+w,y+h); ctx.lineTo(x,y+h);
    ctx.fill();
    ctx.fillStyle="rgba(255,214,170,.75)";
    ctx.beginPath(); ctx.arc(x+w*.28,y+h*.3,w*.11,0,7); ctx.fill();
    ctx.strokeStyle="rgba(255,255,255,.22)"; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(x,y+h*.66); ctx.lineTo(x+w,y+h*.66); ctx.stroke();
  }
  ctx.restore();
}
function heart(x,y,s,f){
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
  ctx.beginPath();
  ctx.moveTo(0,2.2);
  ctx.bezierCurveTo(-7.5,-6.5,-16,1.2,0,11.5);
  ctx.bezierCurveTo(16,1.2,7.5,-6.5,0,2.2);
  ctx.closePath();
  ctx.lineWidth=1.6; ctx.strokeStyle="#fff"; ctx.stroke();
  if(f>0){ctx.save(); ctx.clip(); ctx.fillStyle="#1ed760"; ctx.fillRect(-18,12-24*f,36,26); ctx.restore();}
  ctx.restore();
}
function cpt(u){
  const v=1-u, ax=1400,ay=620,bx=1580,by=300,cx=1840,cy=312;
  return {x:v*v*ax+2*v*u*bx+u*u*cx, y:v*v*ay+2*v*u*by+u*u*cy};
}
function knobAt(t){
  if(t<13.4) return {x:600,y:640};
  if(t<14.45) return {x:lerp(600,830,seg(t,13.4,14.45)), y:640};
  if(t<15.65){const p=seg(t,14.45,15.65); return {x:lerp(830,1400,p), y:lerp(640,620,p)};}
  return cpt(seg(t,15.65,17.25));
}
function camera(t){
  if(t<7.95) return {x:PX,y:PY,s:1.26};
  if(t<9.8) return {x:PX,y:PY,s:lerp(1.26,4.35,seg(t,7.95,8.75))};
  if(t<13.05){const p=seg(t,9.8,11.45); return {x:PX,y:lerp(PY,360,p),s:lerp(4.35,1,p)};}
  if(t<14.45){const p=seg(t,13.05,14.2); return {x:lerp(PX,760,p),y:lerp(360,640,p),s:lerp(1,1.16,p)};}
  if(t<17.35){const k=knobAt(t), p=seg(t,14.45,15.15); return {x:lerp(760,k.x,p),y:lerp(640,k.y,p),s:1.16};}
  const k=cpt(1), p=seg(t,17.35,18.7);
  return {x:k.x,y:k.y,s:lerp(1.16,540,p)};
}
function cursor(x,y,down){
  ctx.save(); ctx.translate(x,y); if(down) ctx.translate(1,1);
  ctx.beginPath();
  ctx.moveTo(0,0); ctx.lineTo(0,17.2); ctx.lineTo(4.4,13.2); ctx.lineTo(7.5,20.2);
  ctx.lineTo(10.1,19.1); ctx.lineTo(7,12.2); ctx.lineTo(12.2,12.2); ctx.closePath();
  ctx.fillStyle="#fff"; ctx.strokeStyle="#111"; ctx.lineWidth=1.15; ctx.lineJoin="round";
  ctx.fill(); ctx.stroke(); ctx.restore();
}
function capsule(x1,y1,x2,y2,r){
  const d=Math.hypot(x2-x1,y2-y1);
  if(d>90||d<1) return;
  ctx.strokeStyle="#111"; ctx.lineWidth=r*2; ctx.lineCap="round";
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
}
function bubble(x,y,text,shown,open,alpha){
  if(alpha<=0) return;
  const tw=ctx.measureText(text).width;
  const w=lerp(16,tw+36,open), h=lerp(16,48,open), r=h/2;
  ctx.globalAlpha=alpha;
  foot(x,y+h*.35,w*.45,open);
  ctx.fillStyle="#111";
  rr(x-w/2,y-h/2,w,h,r); ctx.fill();
  if(open>.55 && shown){
    ctx.globalAlpha=alpha*clamp((open-.55)/.45,0,1);
    ctx.fillStyle="#fff"; ctx.font=font("500",20); ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.save(); rr(x-w/2,y-h/2,w,h,r); ctx.clip();
    ctx.fillText(shown,x,y+1); ctx.restore();
  }
  ctx.globalAlpha=1;
}
function drawEarly(t){
  const pill=lin(t,.55,1.35), pe=ease(pill);
  const toCheck=lin(t,2.05,2.85), ce=ease(toCheck);
  const split=lin(t,2.85,3.65), se=ease(split);
  const qIn=lin(t,3.65,4.45), aIn=lin(t,5.4,6.2);
  const merge=lin(t,7.15,7.95), me=ease(merge);
  const tri=lin(t,7.95,8.75);
  ctx.font=font("500",20);
  const Q="is this all code?", A="yes. every frame.";
  const qShown=Q.slice(0,Math.floor(lin(t,4.45,5.4)*Q.length));
  const aShown=A.slice(0,Math.floor(lin(t,6.2,7.15)*A.length));
  const qOpen=t<7.15?ease(qIn):lerp(1,0,me);
  const aOpen=t<7.15?ease(aIn):lerp(1,0,me);
  const qPos=t<3.65?{x:PX-40*se,y:PY}:t<7.15?{x:lerp(PX-40,450,ease(qIn)),y:lerp(PY,392,ease(qIn))}:{x:lerp(450,PX,me),y:lerp(392,PY,me)};
  const aPos=t<5.4?{x:PX+40*se,y:PY}:t<7.15?{x:lerp(PX+40,830,ease(aIn)),y:lerp(PY,688,ease(aIn))}:{x:lerp(830,PX,me),y:lerp(688,PY,me)};
  if(t<2.9){
    const w=lerp(196,56,pe), h=lerp(52,56,pe);
    const lift=t>.42&&t<.7?.08:.35;
    foot(PX,PY+18,w*.4,lift);
    ctx.fillStyle="#111";
    ctx.globalAlpha=1-clamp((pill-.45)/.55,0,1);
    rr(PX-w/2,PY-h/2,w,h,26); ctx.fill();
    ctx.globalAlpha=1;
    if(pill<.55){
      ctx.globalAlpha=dis(t,.55,1.35);
      ctx.fillStyle="#fff"; ctx.font=font("600",16); ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.fillText("Generate",PX,PY+1); ctx.globalAlpha=1;
    }
    const ringA=clamp((pill-.4)/.6,0,1)*(1-ce);
    if(ringA>0){
      ctx.strokeStyle="#111"; ctx.globalAlpha=ringA; ctx.lineWidth=4.5; ctx.lineCap="round";
      ctx.beginPath(); ctx.arc(PX,PY,20,-1.2+t*7.2,-1.2+t*7.2+Math.PI*(1.15+pe)); ctx.stroke();
      ctx.globalAlpha=1;
    }
    if(toCheck>0){
      ctx.strokeStyle="#111"; ctx.lineWidth=4.5; ctx.lineCap="round"; ctx.lineJoin="round";
      ctx.globalAlpha=ce*(1-se);
      ctx.beginPath(); ctx.moveTo(PX-12,PY); ctx.lineTo(PX-4,PY+9); ctx.lineTo(PX+14,PY-10); ctx.stroke();
      ctx.globalAlpha=1;
    }
  }
  if(t>=2.7 && t<8.05){
    const dots=[{x:PX,y:PY,r:7},{x:qPos.x,y:qPos.y,r:lerp(7,8,qOpen)},{x:aPos.x,y:aPos.y,r:lerp(7,8,aOpen)}];
    if(split<1 && t<3.7){capsule(dots[0].x,dots[0].y,dots[1].x,dots[1].y,6.5); capsule(dots[0].x,dots[0].y,dots[2].x,dots[2].y,6.5);}
    if(merge>0){capsule(PX,PY,qPos.x,qPos.y,6); capsule(PX,PY,aPos.x,aPos.y,6);}
    const da=t<3.1?se:1;
    ctx.fillStyle="#111"; ctx.globalAlpha=da*(t>7.7?1-lin(t,7.85,8.05):1);
    dots.forEach(d=>{ctx.beginPath(); ctx.arc(d.x,d.y,d.r,0,7); ctx.fill();});
    ctx.globalAlpha=1;
    if(qIn>0) bubble(qPos.x,qPos.y,Q,qShown,Math.max(qOpen,.001),t<7.15?1:dis(t,7.15,7.95));
    if(aIn>0) bubble(aPos.x,aPos.y,A,aShown,Math.max(aOpen,.001),t<7.15?1:dis(t,7.15,7.95));
  }
  if(t>=7.9 && t<9.25){
    const pts=[[22,0],[-14,15],[-14,-15]];
    ctx.fillStyle="#111"; ctx.globalAlpha=(1-lin(t,8.95,9.22))*(t<8.05?lin(t,7.9,8.05):1);
    ctx.beginPath();
    pts.forEach((pt,i)=>{
      const k=ease(clamp((tri-i*.26)/.42,0,1));
      const x=PX+pt[0]*k, y=PY+pt[1]*k;
      i?ctx.lineTo(x,y):ctx.moveTo(x,y);
    });
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha=1-ease(tri);
    ctx.beginPath(); ctx.arc(PX,PY,8,0,7); ctx.fill();
    ctx.globalAlpha=1;
  }
}
function fmt(sec){
  sec=Math.max(0,sec|0); const m=(sec/60)|0, s=sec%60;
  return m+":"+(s<10?"0":"")+s;
}
function drawApp(t){
  const sw=seg(t,11.45,13.0), tintP=sw;
  const col="rgb("+(lerp(196,106,tintP)|0)+","+(lerp(106,48,tintP)|0)+","+(lerp(69,88,tintP)|0)+")";
  ctx.fillStyle="#121212"; ctx.fillRect(-40,-80,1360,900);
  ctx.globalAlpha=.3; ctx.fillStyle=col; ctx.fillRect(-40,-80,1360,900); ctx.globalAlpha=1;
  ctx.fillStyle="rgba(0,0,0,.18)"; ctx.fillRect(1280,-80,28,900);
  const flood=t<9?0:t<9.8?seg(t,9,9.8):1;
  if(flood<1){ctx.save(); ctx.beginPath(); ctx.arc(PX,PY,lerp(18,1700,flood),0,7); ctx.clip();}
  foot(640,360,240,.4);
  ctx.save(); ctx.beginPath(); rr(490,48,300,300,12); ctx.clip();
  ctx.save(); ctx.translate(-300*sw,0); cover(0,490,48,300,300); cover(1,790,48,300,300); ctx.restore();
  ctx.restore();
  const outA=sw<.5?1:1-(sw-.5)*2, inA=sw<.5?0:(sw-.5)*2;
  ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.globalAlpha=outA; ctx.fillStyle="#fff"; ctx.font=font("600",32); ctx.fillText("Head Bang",640,392);
  ctx.globalAlpha=outA*.7; ctx.font=font("400",16); ctx.fillText("Mixkit",640,424);
  ctx.globalAlpha=inA; ctx.fillStyle="#fff"; ctx.font=font("600",32); ctx.fillText("Low Ember",640,392);
  ctx.globalAlpha=inA*.7; ctx.font=font("400",16); ctx.fillText("Mixkit",640,424);
  ctx.globalAlpha=1;
  heart(792,422,1.15,seg(t,10.05,10.8));
  const pr=clamp(.06+(t>9?(t-9)*.028:0),0,.7);
  ctx.fillStyle="rgba(255,255,255,.18)"; rr(490,470,300,4,2); ctx.fill();
  ctx.fillStyle="#1ed760"; rr(490,470,300*pr,4,2); ctx.fill();
  ctx.beginPath(); ctx.arc(490+300*pr,472,5,0,7); ctx.fillStyle="#fff"; ctx.fill();
  ctx.font=font("400",12); ctx.fillStyle="rgba(255,255,255,.65)"; ctx.textAlign="left";
  ctx.fillText(fmt(pr*204),490,494); ctx.textAlign="right"; ctx.fillText("3:24",790,494);
  ctx.fillStyle="#fff";
  ctx.beginPath(); ctx.moveTo(548,536); ctx.lineTo(536,528); ctx.lineTo(536,544); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(732,536); ctx.lineTo(744,528); ctx.lineTo(744,544); ctx.closePath(); ctx.fill();
  const press=t>8.9&&t<9.25?0.96:1;
  foot(PX,PY+22,40,.55);
  ctx.save(); ctx.translate(PX,PY); ctx.scale(press,press);
  ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(0,0,27,0,7); ctx.fill();
  ctx.fillStyle="#121212"; ctx.beginPath(); ctx.moveTo(9,0); ctx.lineTo(-7,10); ctx.lineTo(-7,-10); ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.fillStyle="#fff";
  ctx.fillRect(470,636,5,10); ctx.beginPath(); ctx.moveTo(475,636); ctx.lineTo(484,630); ctx.lineTo(484,652); ctx.lineTo(475,646); ctx.fill();
  const k=knobAt(Math.min(t,15.7));
  const trackR=t<14.45?830:lerp(830,Math.min(k.x,980),.22);
  ctx.globalAlpha=t<14.6?1:1-lin(t,14.7,15.5);
  ctx.fillStyle="rgba(255,255,255,.2)"; rr(500,638,Math.max(40,trackR-500),4,2); ctx.fill();
  ctx.fillStyle="#1ed760"; rr(500,638,Math.max(8,Math.min(k.x,830)-500),4,2); ctx.fill();
  ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(Math.min(k.x,980),640,8,0,7); ctx.fill();
  ctx.globalAlpha=1;
  if(flood<1) ctx.restore();
}
function drawChart(t){
  const u=seg(t,15.65,17.25);
  if(u<=0) return;
  ctx.strokeStyle="#1ed760"; ctx.lineWidth=3.5; ctx.lineJoin="round"; ctx.lineCap="round";
  ctx.beginPath();
  for(let i=0;i<=40;i++){
    const p=u*i/40, q=cpt(p);
    i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y);
  }
  ctx.stroke();
  const end=cpt(u);
  ctx.fillStyle="#1ed760"; ctx.beginPath(); ctx.arc(end.x,end.y,8,0,7); ctx.fill();
  const core=lin(t,16.6,17.3);
  if(core>0){ctx.globalAlpha=core; ctx.fillStyle="#f3f3f0"; ctx.beginPath(); ctx.arc(end.x,end.y,2.3,0,7); ctx.fill(); ctx.globalAlpha=1;}
  ctx.globalAlpha=lin(t,16.05,16.55);
  const n=lerp(8600,48210,u);
  ctx.fillStyle="#fff"; ctx.font=font("600",40); ctx.textAlign="left"; ctx.textBaseline="alphabetic";
  ctx.fillText(Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,","),1460,188);
  ctx.font=font("400",14); ctx.fillStyle="rgba(255,255,255,.62)"; ctx.fillText("plays",1460,212);
  ctx.globalAlpha=1;
}
function dots(alpha){
  if(alpha<=0) return;
  ctx.globalAlpha=alpha; ctx.fillStyle="#101010"; ctx.fillRect(1100,-200,1400,1200);
  ctx.fillStyle="rgba(255,255,255,.2)";
  for(let x=1120;x<2500;x+=26) for(let y=-20;y<980;y+=26){ctx.beginPath(); ctx.arc(x,y,1.25,0,7); ctx.fill();}
  ctx.globalAlpha=1;
}
function light(){
  const g=ctx.createLinearGradient(0,0,0,720);
  g.addColorStop(0,"#f3f3f0"); g.addColorStop(1,"#e3e3de");
  ctx.fillStyle=g; ctx.fillRect(-800,-800,4000,2400);
}
function ending(t){
  light();
  const grow=seg(t,18.72,19.25), narrow=lin(t,19.25,19.62), fan=lin(t,19.62,20);
  const fe=ease(fan);
  if(fan<1){
    const w=lerp(210,3,ease(narrow)), h=lerp(52,3,ease(narrow));
    const sc=grow;
    ctx.save(); ctx.translate(640,360); ctx.scale(sc,sc);
    foot(0,18,w*.4,sc);
    ctx.fillStyle="#111"; rr(-w/2,-h/2,w,h,h/2); ctx.fill();
    ctx.globalAlpha=narrow<.45?1:1-clamp((narrow-.45)/.4,0,1);
    ctx.fillStyle="#fff"; ctx.font=font("600",18); ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText("Ask Claude",0,1);
    ctx.restore(); ctx.globalAlpha=1;
  }
  if(fan>0){
    ctx.save(); ctx.translate(640,360);
    ctx.fillStyle="#d97757";
    const rot=(1-fe)*1.1, split=fe*Math.PI/12, len=lerp(2,78,fe);
    for(let i=0;i<6;i++){
      const base=rot+i/6*Math.PI*2;
      for(let k=0;k<2;k++){
        ctx.save(); ctx.rotate(base+(k?split:-split));
        ctx.beginPath(); ctx.moveTo(0,2); ctx.lineTo(5.2,len*.28); ctx.lineTo(0,len); ctx.lineTo(-5.2,len*.28); ctx.closePath(); ctx.fill();
        ctx.restore();
      }
    }
    ctx.restore();
  }
}
function pointer(t){
  const k=knobAt(t);
  let x=720,y=660;
  if(t<0.55){const p=seg(t,0,0.55); x=lerp(760,PX,p); y=lerp(680,PY,p);}
  else if(t<3.5){x=PX+18; y=PY+22;}
  else if(t<4.5){const p=seg(t,3.5,4.4); x=lerp(PX+18,560,p); y=lerp(PY+16,410,p);}
  else if(t<5.4){x=560; y=410;}
  else if(t<6.3){const p=seg(t,5.4,6.2); x=lerp(560,900,p); y=lerp(410,710,p);}
  else if(t<7.15){x=900; y=710;}
  else if(t<8.0){const p=seg(t,7.15,7.95); x=lerp(900,PX+16,p); y=lerp(710,PY+18,p);}
  else if(t<8.9){const p=seg(t,8.0,8.85); x=lerp(PX+16,PX+6,p); y=lerp(PY+18,PY+8,p);}
  else if(t<11.2){x=PX+6; y=PY+8;}
  else if(t<11.7){const p=seg(t,11.2,11.65); x=lerp(PX,640,p); y=lerp(PY,190,p);}
  else if(t<13.05){const p=seg(t,11.7,12.95); x=lerp(640,470,p); y=190;}
  else if(t<13.45){const p=seg(t,13.05,13.45); x=lerp(470,600,p); y=lerp(190,640,p);}
  else {x=k.x; y=k.y;}
  return {x,y};
}
function frame(now){
  let t=(now-t0)/1000; t=((t%DUR)+DUR)%DUR;
  const cam=camera(t);
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,1280,720);
  if(t>=18.68){ending(t); requestAnimationFrame(frame); return;}
  ctx.setTransform(cam.s,0,0,cam.s,640-cam.x*cam.s,360-cam.y*cam.s);
  light();
  dots(lin(t,14.35,15.45));
  if(t>=9) drawApp(t);
  if(t<9.3) drawEarly(t);
  if(t>=15.55) drawChart(t);
  ctx.setTransform(1,0,0,1,0,0);
  const wp=pointer(t);
  const sx=640+(wp.x-cam.x)*cam.s, sy=360+(wp.y-cam.y)*cam.s;
  const down=(t>0.42&&t<0.68)||(t>8.9&&t<9.18)||(t>17.28&&t<17.52);
  if(t<18.55) cursor(sx,sy,down);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
