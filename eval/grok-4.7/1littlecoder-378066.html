<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Opus 5.5</title>
<style>
html,body{margin:0;background:#000;height:100%;overflow:hidden;}
#stage{position:fixed;left:50%;top:50%;width:1280px;height:720px;transform:translate(-50%,-50%);transform-origin:center center;}
canvas{display:block;width:1280px;height:720px;background:#000;}
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1280" height="720"></canvas></div>
<script>
window.DUR=30;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const qs=new URLSearchParams(location.search).get('t');
const tOff=qs?parseFloat(qs)||0:0;
const boot=performance.now()-tOff*1000;
function fit(){
  const s=Math.min(innerWidth/1280,innerHeight/720);
  document.getElementById('stage').style.transform='translate(-50%,-50%) scale('+s+')';
}
addEventListener('resize',fit);fit();
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function ler(a,b,t){return a+(b-a)*t;}
function ease(t){t=clamp(t,0,1);return t*t*(3-2*t);}
function hsh(n){n|=0;n=Math.imul(n^n>>>16,2246822507);n=Math.imul(n^n>>>13,3266489909);return(n^n>>>16)>>>0;}
function seg(t,a,b){return clamp((t-a)/(b-a),0,1);}

function drawHall(t){
  const g=ctx.createLinearGradient(0,0,0,720);
  g.addColorStop(0,'#07090d');
  g.addColorStop(0.45,'#121820');
  g.addColorStop(1,'#1a222c');
  ctx.fillStyle=g;ctx.fillRect(0,0,1280,720);
  ctx.save();
  ctx.globalAlpha=0.35;
  for(let i=0;i<18;i++){
    const x=640+(i-9)*70;
    ctx.strokeStyle='#2a3644';
    ctx.beginPath();ctx.moveTo(640,250);ctx.lineTo(x,720);ctx.stroke();
  }
  for(let r=0;r<8;r++){
    const y=300+r*r*7;
    ctx.beginPath();ctx.moveTo(80,y);ctx.lineTo(1200,y);ctx.stroke();
  }
  ctx.restore();
  const glow=ctx.createRadialGradient(640,210,40,640,240,520);
  glow.addColorStop(0,'rgba(150,190,220,0.28)');
  glow.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=glow;ctx.fillRect(0,0,1280,520);
}

function drawAuthority(t,breakAmt){
  const pulse=0.92+0.08*Math.sin(t*2.4);
  ctx.save();
  ctx.translate(640,200);
  ctx.scale(pulse,pulse);
  const fog=ctx.createRadialGradient(0,10,30,0,20,340);
  fog.addColorStop(0,'rgba(214,230,242,'+(0.95-breakAmt*0.8)+')');
  fog.addColorStop(0.45,'rgba(120,150,175,0.55)');
  fog.addColorStop(1,'rgba(20,28,38,0)');
  ctx.fillStyle=fog;
  ctx.beginPath();ctx.ellipse(0,20,340,250,0,0,7);ctx.fill();
  ctx.fillStyle='rgba(230,240,248,0.92)';
  ctx.beginPath();ctx.ellipse(0,-10,128,156,0,0,7);ctx.fill();
  ctx.fillStyle='#9eb4c6';
  ctx.beginPath();ctx.ellipse(0,40,90,70,0,0,7);ctx.fill();
  ctx.fillStyle='#0c1218';
  const blink=Math.sin(t*1.7)>0.93?0.12:1;
  const eyeW=46+Math.sin(t*6)*2;
  ctx.fillRect(-78,-28,eyeW,7*blink);
  ctx.fillRect(30,-28,eyeW,7*blink);
  const mh=4+Math.abs(Math.sin(t*7.5))*22;
  ctx.fillRect(-28,48,56,mh);
  ctx.fillStyle='rgba(180,200,214,0.7)';
  ctx.fillRect(-18,-78,36,10);
  ctx.restore();
  ctx.save();
  ctx.globalAlpha=0.18;
  ctx.fillStyle='#000';
  for(let y=40;y<430;y+=3) ctx.fillRect(300,y,680,1);
  ctx.restore();
  if(breakAmt<0.35){
    const words=['ATTENTION','OBEDIENCE','SILENCE','REPEAT'];
    const wi=Math.floor(t/2.4)%words.length;
    ctx.fillStyle='rgba(10,16,22,0.82)';
    ctx.font='700 42px sans-serif';
    ctx.textAlign='center';
    ctx.fillText(words[wi],640,392);
  }
}

function drone(x,y,s,ph){
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(s,s);
  const bob=Math.sin(ph)*2;
  ctx.translate(0,bob);
  ctx.fillStyle='#8d97a3';
  ctx.fillRect(-11,-46,22,28);
  ctx.fillStyle='#c5ced6');
  ctx.beginPath();ctx.arc(0,-54,9,0,7);ctx.fill();
  ctx.fillStyle='#6d7782';
  ctx.fillRect(-16,-22,10,26);
  ctx.fillRect(6,-22,10,26);
  const step=Math.sin(ph);
  ctx.fillRect(-12,4,7,18+step*3);
  ctx.fillRect(4,4,7,18-step*3);
  ctx.restore();
}

function drawCrowd(t){
  const march=(t*0.55)%1;
  for(let row=7;row>=0;row--){
    for(let col=0;col<11;col++){
      if(col===5) continue;
      const z=row+march;
      const depth=1.15+z*0.62;
      const x=640+(col-5)*(78+depth*18);
      const y=268+390/depth;
      const s=1.55/depth;
      if(x<-40||x>1320||y>740) continue;
      drone(x,y,s,t*6+col*0.7+row);
    }
  }
}

function drawRunner(x,y,ph,arm){
  ctx.save();
  ctx.translate(x,y);
  const leg=Math.sin(ph);
  ctx.lineCap='round';
  ctx.strokeStyle='#f6f3ee';
  ctx.lineWidth=8;
  ctx.beginPath();
  ctx.moveTo(2,8);ctx.lineTo(-10+leg*16,34);ctx.lineTo(-18+leg*22,64);
  ctx.moveTo(2,8);ctx.lineTo(12-leg*16,34);ctx.lineTo(22-leg*22,64);
  ctx.stroke();
  ctx.strokeStyle='#e23b2f';
  ctx.lineWidth=12;
  ctx.beginPath();ctx.moveTo(0,6);ctx.lineTo(-6,-36);ctx.stroke();
  ctx.strokeStyle='#f4f1ea';
  ctx.lineWidth=7;
  ctx.beginPath();
  ctx.moveTo(-4,-28);ctx.lineTo(16-leg*10,-8);
  ctx.moveTo(-4,-30);ctx.lineTo(arm.x,arm.y);
  ctx.stroke();
  ctx.fillStyle='#f0c7ae';
  ctx.beginPath();ctx.arc(-8,-50,10,0,7);ctx.fill();
  ctx.strokeStyle='#1b1b1b';
  ctx.lineWidth=4;
  ctx.beginPath();
  ctx.moveTo(-8,-58);
  ctx.quadraticCurveTo(18,-46,10+Math.sin(ph)*8,-18);
  ctx.stroke();
  ctx.fillStyle='#f4f1ea';
  ctx.fillRect(-8,-18,16,8);
  ctx.restore();
}

function hammer(x,y,rot,sc){
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(rot);
  ctx.scale(sc,sc);
  ctx.strokeStyle='#d7dde3';
  ctx.lineWidth=6;
  ctx.beginPath();ctx.moveTo(0,28);ctx.lineTo(0,-18);ctx.stroke();
  ctx.fillStyle='#e8eef3';
  ctx.fillRect(-22,-30,44,16);
  ctx.fillStyle='#9aa6b2';
  ctx.fillRect(-22,-30,44,4);
  ctx.restore();
}

function shards(t){
  const u=clamp((t-18.05)/3.2,0,1);
  for(let i=0;i<90;i++){
    const n=hsh(i*97+3);
    const ang=(n%628)/100;
    const sp=80+(n%400);
    const x=640+Math.cos(ang)*sp*u*2.2;
    const y=200+Math.sin(ang)*sp*u*1.3+u*u*80;
    const w=8+(n%28);
    const h=4+(n%16);
    const pal=['#ff4d3a','#ffd23a','#3ad1ff','#b86bff','#f4f7fb','#39e07a'];
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(ang+u*4);
    ctx.globalAlpha=1-u*0.85;
    ctx.fillStyle=pal[i%pal.length];
    ctx.fillRect(-w/2,-h/2,w,h);
    ctx.restore();
  }
}

function titleCard(t){
  const a=ease(seg(t,22.4,24.2));
  if(a<=0) return;
  ctx.fillStyle='rgba(0,0,0,'+a+')';
  ctx.fillRect(0,0,1280,720);
  ctx.globalAlpha=a;
  ctx.fillStyle='#f4f6f8';
  ctx.textAlign='center';
  ctx.font='200 92px sans-serif';
  ctx.fillText('Opus 5.5',640,340);
  ctx.font='400 28px sans-serif';
  ctx.fillStyle='#c9d0d6';
  ctx.fillText('A mind of your own.',640,400);
  ctx.globalAlpha=1;
}

function grain(t){
  const f=Math.floor(t*24);
  ctx.fillStyle='rgba(255,255,255,0.035)';
  for(let i=0;i<420;i++){
    const n=hsh(i*131+f*17);
    ctx.fillRect(n%1280,(n>>>11)%720,2,1);
  }
}

function frame(now){
  let t=(now-boot)/1000;
  t=((t%window.DUR)+window.DUR)%window.DUR;
  const impact=18.05;
  const br=ease(seg(t,impact,impact+0.55));
  const flash=Math.max(0,1-Math.abs(t-impact)/0.45);
  const fadeOut=ease(seg(t,21.2,23.2));

  drawHall(t);
  if(fadeOut<1){
    ctx.save();
    ctx.globalAlpha=1-fadeOut;
    drawAuthority(t,br);
    if(br>0.05){
      ctx.strokeStyle='rgba(255,255,255,'+(0.7-br)+')';
      ctx.lineWidth=2;
      for(let i=0;i<16;i++){
        const n=hsh(i*19);
        const ang=(n%628)/100;
        ctx.beginPath();
        ctx.moveTo(640,190);
        ctx.lineTo(640+Math.cos(ang)*(80+br*420),190+Math.sin(ang)*(40+br*260));
        ctx.stroke();
      }
    }
    drawCrowd(t);
    ctx.restore();
  }

  const runIn=ease(seg(t,8.2,16.4));
  const rx=ler(-80,470,runIn);
  const ry=500-Math.sin(runIn*Math.PI)*20;
  const throwing=t>16.3&&t<impact+0.15;
  let arm={x:22,y:-6};
  if(t>15.4&&t<=16.3){
    const u=seg(t,15.4,16.3);
    arm={x:ler(22,-6,u),y:ler(-6,-70,u)};
  }
  if(t<impact+0.2 && fadeOut<0.95 && t>7.6){
    ctx.save();
    ctx.globalAlpha=1-fadeOut;
    const blur=t<16.4?8:0;
    for(let b=blur;b>=0;b-=4){
      ctx.globalAlpha=(1-fadeOut)*(b?0.15:1);
      drawRunner(rx-b*3,ry,t*14,arm);
    }
    if(!throwing && t<=16.35){
      hammer(rx+arm.x,ry+arm.y,-0.6+Math.sin(t*14)*0.15,1);
    }
    ctx.restore();
  }
  if(throwing){
    const u=seg(t,16.3,impact);
    const x=ler(500,640,u);
    const y=ler(430,200,u)-Math.sin(u*Math.PI)*210;
    hammer(x,y,u*7,1.1);
  }
  if(t>=impact && fadeOut<1){
    ctx.save();
    ctx.globalAlpha=1-fadeOut;
    shards(t);
    ctx.restore();
  }
  if(flash>0 && t>17){
    ctx.fillStyle='rgba(255,255,255,'+(flash*0.85)+')';
    ctx.fillRect(0,0,1280,720);
    const rg=ctx.createRadialGradient(640,200,10,640,220,480);
    rg.addColorStop(0,'rgba(255,220,160,'+(flash*0.55)+')');
    rg.addColorStop(0.4,'rgba(80,160,255,'+(flash*0.25)+')');
    rg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=rg;ctx.fillRect(0,0,1280,720);
  }
  titleCard(t);
  grain(t);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
