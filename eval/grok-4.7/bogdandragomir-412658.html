<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>t.co</title>
<style>
html,body{margin:0;background:#000;height:100%;overflow:hidden}
#s{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:50% 50%}
canvas{display:block}
</style>
</head>
<body>
<div id="s"><canvas id="c" width="1280" height="720"></canvas></div>
<script>
window.DUR=30;
const DUR=30,BPM=100,BD=60/BPM;
const q=new URLSearchParams(location.search);
const T0=performance.now()/1000-(parseFloat(q.get("t"))||0);
const cv=document.getElementById("c"),g=cv.getContext("2d");
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);document.getElementById("s").style.transform="translate(-50%,-50%) scale("+s+")"}
addEventListener("resize",fit);fit();
function rnd(i){const x=Math.sin(i*127.1+13.7)*43758.5453;return x-Math.floor(x)}
const P=[];
for(let i=0;i<180;i++)P.push({a:rnd(i)*6.28,r:40+rnd(i+3)*520,z:rnd(i+9),sp:.15+rnd(i+2)*.5,h:rnd(i+4)});
let ac,master,noise,sched=0,base=null,prev=-1;
function boot(){
  if(ac)return;
  ac=new AudioContext();
  master=ac.createGain();master.gain.value=.2;master.connect(ac.destination);
  const n=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate),d=n.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  noise=n;
}
function env(t,dur,peak,dest){
  const o=ac.createGain();o.gain.setValueAtTime(0,t);
  o.gain.linearRampToValueAtTime(peak,t+.012);
  o.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(dest||master);return o;
}
function tone(t,f,dur,type,peak){
  const o=ac.createOscillator(),e=env(t,dur,peak);
  o.type=type;o.frequency.setValueAtTime(f,t);o.connect(e);o.start(t);o.stop(t+dur+.05);
}
function kick(t){
  const o=ac.createOscillator(),e=env(t,.28,.55);
  o.type="sine";o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+.12);
  o.connect(e);o.start(t);o.stop(t+.3);
}
function hat(t,g0){
  const s=ac.createBufferSource(),f=ac.createBiquadFilter(),e=env(t,.06,g0);
  f.type="highpass";f.frequency.value=7000;s.buffer=noise;s.connect(f);f.connect(e);s.start(t);s.stop(t+.07);
}
const SC=[0,3,7,10,12,15,19];
function music(t){
  boot();if(ac.state==="suspended")ac.resume();
  if(base==null){base=ac.currentTime-t;sched=0}
  const now=ac.currentTime,ahead=now+.28;
  let i=Math.max(sched,Math.floor((now-base)/BD)-1);
  while(base+i*BD<ahead){
    const w=base+i*BD;
    if(w>now-.03){
      const bar=Math.floor(i/4),st=i%16;
      if(i%4===0)kick(w);
      if(i%2===0)hat(w,i%4===2?.07:.035);
      if(st%2===0){const n=SC[(bar+st)%SC.length];tone(w,220*Math.pow(2,n/12),st%8===0?.7:.28,"triangle",.07)}
      if(st===0)tone(w,55+ (bar%4)*27.5,1.4,"sine",.11);
      if(st===8)tone(w,82.5,1.1,"sine",.06);
      if(bar%4===3&&st===12)tone(w,880,.4,"sine",.04);
    }
    i++;
  }
  sched=i;
}
function clamp(a,b,c){return Math.max(b,Math.min(c,a))}
function ease(t){t=clamp(t,0,1);return t*t*(3-2*t)}
function seg(t,a,b){return ease((t-a)/(b-a))}
function draw(t){
  g.fillStyle="#05060a";g.fillRect(0,0,1280,720);
  const grd=g.createRadialGradient(640,360,40,640,380,640);
  grd.addColorStop(0,"rgba(20,40,70,.55)");grd.addColorStop(1,"rgba(0,0,0,0)");
  g.fillStyle=grd;g.fillRect(0,0,1280,720);
  const pulse=0.5+0.5*Math.sin(t*BPM/60*Math.PI*2);
  g.save();g.translate(640,360);
  for(const p of P){
    const ang=p.a+t*p.sp*.35;
    const rr=p.r*(0.72+0.28*Math.sin(t*.4+p.z*6));
    const x=Math.cos(ang)*rr,y=Math.sin(ang)*rr*0.42;
    g.globalAlpha=0.15+p.h*.45;
    g.fillStyle=p.h>.55?"#7ee7ff":"#f0c96a";
    g.beginPath();g.arc(x,y,1.2+p.h*2.2,0,6.28);g.fill();
  }
  g.globalAlpha=1;g.restore();
  // compression rings synced to beat
  g.save();g.translate(640,340);
  for(let k=0;k<5;k++){
    const ph=((t*BPM/60)+k*.2)%1;
    g.strokeStyle="rgba(126,231,255,"+(0.25*(1-ph))+")";
    g.lineWidth=2;g.beginPath();g.ellipse(0,0,80+ph*420,28+ph*140,0,0,6.28);g.stroke();
  }
  g.fillStyle="rgba(240,201,106,"+(0.35+pulse*.4)+")";
  g.beginPath();g.arc(0,0,6+pulse*4,0,6.28);g.fill();
  g.restore();
  g.fillStyle="#e8eef8";g.textAlign="center";
  const s1=seg(t,0.4,2.2),s2=seg(t,2.4,5.5),s3=seg(t,6,9),s4=seg(t,9.5,13),s5=seg(t,13.5,18),s6=seg(t,18.2,23),s7=seg(t,23.5,28);
  if(t<6.2){
    g.globalAlpha=s1;g.font="600 18px sans-serif";g.fillStyle="#9bb";g.fillText("A  T W I T T E R   S H O R T   L I N K",640,210);
    g.globalAlpha=s2;g.font="700 64px sans-serif";g.fillStyle="#f4f7fb";g.fillText("ONE TAP",640,300);
    g.font="500 28px sans-serif";g.fillStyle="#7ee7ff";g.fillText("carries a whole destination",640,352);
    g.globalAlpha=Math.min(s2,1-seg(t,5.4,6.2));
  }
  if(t>=5.6&&t<13.4){
    g.globalAlpha=Math.min(s3,1-seg(t,12.4,13.4));
    g.font="600 16px sans-serif";g.fillStyle="#9bb";g.fillText("WHAT IT DOES",640,168);
    const items=[["SHARE","a long address, shortened"],["REDIRECT","t.co opens the real page"],["TRACK","the click, not the content"],["ARRIVE","one hop, then you're there"]];
    items.forEach((it,i)=>{
      const a=seg(t,6.2+i*.7,7+i*.7);
      g.globalAlpha=a*Math.min(1,1-seg(t,12.4,13.4));
      g.font="700 32px sans-serif";g.fillStyle="#f0c96a";g.textAlign="right";g.fillText(it[0],560,250+i*78);
      g.font="400 26px sans-serif";g.fillStyle="#e8eef8";g.textAlign="left";g.fillText(it[1],590,250+i*78);
    });
  }
  if(t>=13&&t<23.4){
    g.globalAlpha=Math.min(s5,1-seg(t,22.4,23.4));
    g.textAlign="center";g.font="600 16px sans-serif";g.fillStyle="#9bb";g.fillText("THE ADDRESS",640,230);
    const code="wQXZTaqf1b";
    const n=Math.floor(seg(t,14,16.5)*code.length);
    g.font="700 72px sans-serif";g.fillStyle="#f4f7fb";
    g.fillText("t.co/"+code.slice(0,Math.max(1,n))+(t<16.5&&Math.sin(t*18)>.0?"_":""),640,340);
    g.globalAlpha*=seg(t,16.6,18);
    g.font="400 22px sans-serif";g.fillStyle="#7ee7ff";
    g.fillText("https://t.co/wQXZTaqf1b",640,400);
    g.fillStyle="#c9d4e4";g.font="400 20px sans-serif";
    g.fillText("A sealed redirect. The page behind it stays on the other side of the click.",640,470);
  }
  if(t>=22.8){
    g.globalAlpha=Math.min(s7,1);
    g.textAlign="center";g.font="700 54px sans-serif";g.fillStyle="#f4f7fb";
    g.fillText("FOLLOW THE LINK",640,320);
    g.font="400 24px sans-serif";g.fillStyle="#f0c96a";
    g.fillText("https://t.co/wQXZTaqf1b",640,380);
    g.font="400 18px sans-serif";g.fillStyle="#9bb";
    g.fillText("Shorten  ·  Share  ·  Redirect",640,430);
  }
  g.globalAlpha=.12;g.fillStyle="#fff";
  for(let y=0;y<720;y+=4)g.fillRect(0,y,1280,1);
  g.globalAlpha=1;
  g.fillStyle="#000";g.fillRect(0,0,1280,48);g.fillRect(0,672,1280,48);
  const beat=((t*BPM/60)%1);
  g.fillStyle="rgba(126,231,255,"+(0.15*(1-beat))+")";
  g.fillRect(0,48,1280,2);g.fillRect(0,670,1280,2);
}
function frame(now){
  let t=((now/1000-T0)%DUR+DUR)%DUR;
  if(prev>=0&&t<prev-1){base=null;sched=0}
  prev=t;music(t);draw(t);requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
