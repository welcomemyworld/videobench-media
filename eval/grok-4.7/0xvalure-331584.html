<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PayBox</title>
<style>
html,body{margin:0;background:#000;height:100%;overflow:hidden;}
#wrap{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:50% 50%;}
canvas{display:block;}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1280" height="720"></canvas></div>
<script>
window.DUR=15;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const wrap=document.getElementById('wrap');
function fit(){wrap.style.transform='translate(-50%,-50%) scale('+Math.min(innerWidth/1280,innerHeight/720)+')';}
addEventListener('resize',fit);fit();
const qs=new URLSearchParams(location.search);
const tOff=parseFloat(qs.get('t')||'0')||0;
const start=performance.now()-tOff*1000;
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function seg(t,a,b){return clamp((t-a)/(b-a),0,1);}
function sm(t){t=clamp(t,0,1);return t*t*(3-2*t);}
function expo(t){t=clamp(t,0,1);return t>=1?1:1-Math.pow(2,-10*t);}
function back(t){t=clamp(t,0,1);const c=1.7;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
const dots=[];
for(let i=0;i<64;i++)dots.push({a:i*0.97,d:90+((i*47)%380),sp:0.25+(i%7)*0.08,sz:1+(i%4)*0.7,ph:i*1.3});
const sparks=[];
for(let i=0;i<28;i++)sparks.push({a:i*0.55,sp:1.4+ (i%5)*0.35,len:18+(i%6)*8});
function draw(t){
  const fade=sm(seg(t,0,0.35))*(1-sm(seg(t,14.45,15)));
  ctx.clearRect(0,0,1280,720);
  const g=ctx.createRadialGradient(640,300,40,640,360,720);
  g.addColorStop(0,'#1a0b33');g.addColorStop(0.45,'#0b0616');g.addColorStop(1,'#05030a');
  ctx.fillStyle=g;ctx.fillRect(0,0,1280,720);
  ctx.save();ctx.globalAlpha=fade;
  ctx.strokeStyle='rgba(140,80,255,0.08)';ctx.lineWidth=1;
  for(let i=0;i<14;i++){ctx.beginPath();ctx.moveTo(0,40+i*50);ctx.lineTo(1280,40+i*50);ctx.stroke();}
  const wake=sm(seg(t,0.1,1.1));
  const glow=ctx.createRadialGradient(640,280,10,640,280,340);
  glow.addColorStop(0,'rgba(160,70,255,'+(0.28*wake)+')');
  glow.addColorStop(0.5,'rgba(255,50,140,'+(0.08*wake)+')');
  glow.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=glow;ctx.fillRect(0,0,1280,720);
  const lx=640,ly=268;
  const pop=back(seg(t,0.85,2.05));
  const breathe=1+Math.sin(t*2.2)*0.012*sm(seg(t,2.2,3));
  const sc=pop*breathe;
  for(let i=0;i<3;i++){
    const u=seg(t,1.15+i*0.1,2.55+i*0.2);
    ctx.beginPath();ctx.arc(lx,ly,40+u*(240+i*36),0,6.283);
    ctx.strokeStyle='rgba(255,90,180,'+( (1-u)*0.4 )+')';ctx.lineWidth=2;ctx.stroke();
  }
  dots.forEach(p=>{
    const u=expo(seg(t,1.05,3.2));
    const ang=p.a+t*p.sp;
    const rad=p.d*u*(0.92+0.08*Math.sin(t*1.6+p.ph));
    ctx.fillStyle='rgba(255,180,230,'+(0.55*u)+')';
    ctx.beginPath();ctx.arc(lx+Math.cos(ang)*rad,ly+Math.sin(ang)*rad*0.62,p.sz,0,6.283);ctx.fill();
  });
  ctx.save();
  ctx.translate(lx,ly);ctx.scale(sc,sc);ctx.rotate((1-sm(seg(t,0.85,1.8)))*-0.18);
  ctx.shadowColor='rgba(180,60,255,0.65)';ctx.shadowBlur=36;
  const box=176;
  rr(-box/2,-box/2,box,box,42);
  const lg=ctx.createLinearGradient(-90,-90,90,90);
  lg.addColorStop(0,'#7A3DFF');lg.addColorStop(0.55,'#C43BFF');lg.addColorStop(1,'#FF3B86');
  ctx.fillStyle=lg;ctx.fill();
  ctx.shadowBlur=0;
  ctx.save();
  rr(-box/2,-box/2,box,box,42);ctx.clip();
  const sh=seg(t,2.3,4.4);
  ctx.fillStyle='rgba(255,255,255,0.28)';
  ctx.save();ctx.translate(-160+sh*380,-40);ctx.rotate(0.6);
  ctx.fillRect(-30,-200,46,400);ctx.restore();
  const iu=back(seg(t,1.7,2.7));
  ctx.globalAlpha=iu;
  ctx.fillStyle='#fff';
  rr(-52,-58,26,116,13);ctx.fill();
  ctx.beginPath();ctx.arc(2,-16,42,Math.PI*1.05,Math.PI*1.95,false);
  ctx.lineWidth=26;ctx.strokeStyle='#fff';ctx.lineCap='round';ctx.stroke();
  ctx.globalAlpha=sm(seg(t,2.35,2.9));
  rr(18,18,36,36,10);ctx.fillStyle='#fff';ctx.fill();
  ctx.fillStyle='#FF3B86';
  rr(26,26,20,20,6);ctx.fill();
  ctx.restore();
  ctx.restore();
  const flash=(1-sm(seg(t,1.15,1.65)))*0.42;
  ctx.fillStyle='rgba(255,255,255,'+flash+')';ctx.fillRect(0,0,1280,720);
  ctx.font='800 84px Arial, Helvetica, sans-serif';
  ctx.textBaseline='middle';
  const name='PayBox';
  const tracking=2;
  const widths=[...name].map(ch=>ctx.measureText(ch).width);
  const total=widths.reduce((a,b)=>a+b,0)+tracking*(name.length-1);
  let x=640-total/2;
  for(let i=0;i<name.length;i++){
    const u=back(seg(t,3.15+i*0.08,3.7+i*0.08));
    ctx.globalAlpha=fade*clamp(u,0,1);
    ctx.fillStyle='#fff';
    ctx.fillText(name[i],x,452+(1-clamp(u,0,1))*28);
    x+=widths[i]+tracking;
  }
  ctx.globalAlpha=fade;
  const line=sm(seg(t,4.3,5.3));
  const grd=ctx.createLinearGradient(520,0,760,0);
  grd.addColorStop(0,'rgba(255,59,134,0)');
  grd.addColorStop(0.5,'rgba(255,190,90,0.95)');
  grd.addColorStop(1,'rgba(122,61,255,0)');
  ctx.strokeStyle=grd;ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(640-150*line,498);ctx.lineTo(640+150*line,498);ctx.stroke();
  const sub=sm(seg(t,5.0,5.8))*(1-sm(seg(t,11.6,12.3)));
  ctx.globalAlpha=fade*sub;
  ctx.font='500 26px Arial, Helvetica, sans-serif';
  ctx.textAlign='center';ctx.fillStyle='rgba(230,220,255,0.92)';
  ctx.fillText('Move money. Instantly.',640,536);
  const pills=['Instant','Secure','Together'];
  pills.forEach((label,i)=>{
    const u=back(seg(t,6.7+i*0.16,7.45+i*0.16));
    const px=400+i*240, py=618+(1-clamp(u,0,1))*26;
    ctx.globalAlpha=fade*clamp(u,0,1);
    rr(px-92,py-24,184,48,24);
    ctx.fillStyle='rgba(255,255,255,0.08)';ctx.fill();
    ctx.strokeStyle='rgba(255,140,200,0.55)';ctx.lineWidth=1.5;ctx.stroke();
    ctx.font='600 22px Arial, Helvetica, sans-serif';
    ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(label,px,py);
  });
  ctx.globalAlpha=fade*sm(seg(t,8.4,9.2));
  sparks.forEach(s=>{
    const a=s.a+t*s.sp;
    const r=118;
    ctx.strokeStyle='rgba(255,220,160,0.75)';ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(lx+Math.cos(a)*r,ly+Math.sin(a)*r);
    ctx.lineTo(lx+Math.cos(a)*(r+s.len),ly+Math.sin(a)*(r+s.len));
    ctx.stroke();
  });
  ctx.globalAlpha=fade*0.9;
  ctx.font='600 18px Arial, Helvetica, sans-serif';
  ctx.fillStyle='rgba(255,255,255,0.55)';ctx.textAlign='center';
  ctx.fillText('PAYBOX',640,78);
  ctx.restore();
}
function loop(now){
  let t=((now-start)/1000)%window.DUR;
  if(t<0)t+=window.DUR;
  draw(t);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
