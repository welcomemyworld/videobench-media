</style>
</head>
<body>
<canvas id="stage" width="1280" height="720"></canvas>
<script>

addEventListener('resize',fit);fit();

  g.fillStyle='#f2c3a6';
  g.beginPath();g.ellipse(cx,cy+ux(2),ux(22),ux(27),0,0,6.3);g.fill();
  g.fillStyle='#e8a898';

  mg.font='700 '+ux(13)+'px sans-serif';mg.lineWidth=ux(3.4);

  mg.font='500 '+ux(6.2)+'px sans-serif';mg.lineWidth=ux(2);

function matTint(i,r,g,b){

function clearPlaster(shade){

    const v=shade+((y/H)*18|0);

      const i=(y*W+x)*4;

function blit(x,y,w,h,r,g,b){

function tileColor(i,t){

function project(wx,wy,wz,cam){

function camAt(t){

function aperture(t){

function cursor(t){

const q=new URLSearchParams(location.search);

}
