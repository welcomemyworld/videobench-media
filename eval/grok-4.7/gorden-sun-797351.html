<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>卡点球体下坠</title>
<style>
html,body{margin:0;background:#000;height:100%;overflow:hidden}
#wrap{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center}
canvas{display:block;background:#000}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1280" height="720"></canvas></div>
<script>
const wrap=document.getElementById('wrap'), cv=document.getElementById('c'), ctx=cv.getContext('2d');
function fit(){wrap.style.transform='translate(-50%,-50%) scale('+Math.min(innerWidth/1280,innerHeight/720)+')';}
addEventListener('resize',fit); fit();
window.DUR=36;
const qs=new URLSearchParams(location.search);
const tOrigin=performance.now()/1000-(parseFloat(qs.get('t'))||0);
const SC=[
 {name:'客厅狂想曲',piece:'命运 · 纯音乐',bpm:120,sky:['#120818','#3a1868'],floor:'#24143c',wall:'#1a1030',
  joke:['灯是我点的','沙发：请轻放','香蕉皮出击','电视：只有雪花'],
  ball:[-4.2,6.8,-0.6,2.35,0.55],
  objs:[
   {x:-2.1,z:0.7,w:2.3,h:0.75,d:1.05,c:'#6d4dff',n:'沙发'},
   {x:1.15,z:-1.15,w:1.25,h:0.42,d:0.75,c:'#d06a32',n:'茶几'},
   {x:3.15,z:0.15,w:0.38,h:1.7,d:0.38,c:'#f0c85a',n:'落地灯'},
   {x:-0.3,z:2.15,w:1.7,h:1.05,d:0.22,c:'#1d3358',n:'电视'},
   {x:2.35,z:1.85,w:0.7,h:0.22,d:0.28,c:'#f2d24a',n:'香蕉皮'}
  ]},
 {name:'厨房失重',piece:'蓝色多瑙河 · 纯音乐',bpm:104,sky:['#071828','#14506a'],floor:'#123040',wall:'#0c2434',
  joke:['蛋糕无罪','冰箱门自己开的','锅：我先躺平','鸭子：这是泳池吗'],
  ball:[4.1,7.2,0.8,-2.5,-0.45],
  objs:[
   {x:-3.0,z:0.2,w:1.1,h:1.8,d:0.85,c:'#d8e4ee',n:'冰箱'},
   {x:0.2,z:-0.9,w:1.8,h:0.78,d:1.0,c:'#8a5a3a',n:'餐桌'},
   {x:0.3,z:-0.85,w:0.55,h:1.05,d:0.55,c:'#ff8fb0',n:'蛋糕'},
   {x:2.6,z:1.3,w:0.9,h:0.38,d:0.9,c:'#4aa0c8',n:'水槽'},
   {x:-0.8,z:1.9,w:0.55,h:0.45,d:0.45,c:'#f0c020',n:'橡皮鸭'}
  ]},
 {name:'博物馆夜逃',piece:'土耳其进行曲 · 纯音乐',bpm:138,sky:['#140818','#402040'],floor:'#2a2030',wall:'#1a1424',
  joke:['雕像眨了一下','请勿触摸（已触摸）','保安去喝茶了','展签：无名球体'],
  ball:[-1.2,8.0,-2.2,1.35,1.15],
  objs:[
   {x:-2.6,z:0.4,w:0.7,h:1.55,d:0.7,c:'#cbb89a',n:'雕像甲'},
   {x:0.1,z:1.5,w:0.7,h:1.7,d:0.7,c:'#e6d7b8',n:'雕像乙'},
   {x:2.5,z:-0.4,w:0.7,h:1.4,d:0.7,c:'#b7a48a',n:'雕像丙'},
   {x:-0.4,z:-1.5,w:1.6,h:0.5,d:0.7,c:'#6a4030',n:'展柜'},
   {x:3.3,z:1.8,w:0.35,h:1.2,d:0.35,c:'#e8d060',n:'禁止标牌'}
  ]},
 {name:'卧室终章',piece:'卡农 · 纯音乐',bpm:86,sky:['#0c1028','#243060'],floor:'#1a2244',wall:'#12182e',
  joke:['闹钟认输了','枕头：再跳一下','月亮也卡点','本球申请加班费'],
  ball:[0.2,7.4,0.2,1.7,0.35],
  objs:[
   {x:-2.4,z:0.9,w:2.2,h:0.55,d:1.3,c:'#3d5a98',n:'床'},
   {x:-2.2,z:0.55,w:0.7,h:0.85,d:0.45,c:'#f2f4ff',n:'枕头'},
   {x:2.2,z:-1.1,w:0.7,h:0.7,d:0.55,c:'#d8dee8',n:'床头柜'},
   {x:2.25,z:-1.1,w:0.28,h:1.15,d:0.28,c:'#ffb03a',n:'闹钟'},
   {x:0.4,z:2.0,w:1.3,h:1.35,d:0.18,c:'#243058',n:'窗户'}
  ]}
];
function hex(h,k){
  const n=parseInt(h.slice(1),16),r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  const m=(v)=>Math.max(0,Math.min(255,v*k|0));
  return 'rgb('+m(r)+','+m(g)+','+m(b)+')';
}
function mix(h,k){
  const n=parseInt(h.slice(1),16);
  const L=(v)=>Math.max(0,Math.min(255,(v+(255-v)*k)|0));
  return 'rgb('+L((n>>16)&255)+','+L((n>>8)&255)+','+L(n&255)+')';
}
function sim(sc,T){
  const o=sc.objs, bpm=sc.bpm, spb=60/bpm, dt=1/90, R=0.4;
  let x=sc.ball[0],y=sc.ball[1],z=sc.ball[2],vx=sc.ball[3],vy=0,vz=sc.ball[4];
  const hitT=o.map(()=>-9); let hits=0,last=-1,squash=0;
  for(let t=0;t<T-1e-6;t+=dt){
    const h=Math.min(dt,T-t);
    vy-=16.5*h; x+=vx*h; y+=vy*h; z+=vz*h;
    const b0=Math.floor(t/spb), b1=Math.floor((t+h)/spb);
    if(b1>b0 && y<R+0.35){ vy=Math.max(vy,5.2+ (b1%4===0?2.2:0)); squash=1; }
    if(y<R){ y=R; if(vy<0){ vy=Math.abs(vy)*0.62; if(vy<1.2) vy=0; squash=1; } }
    if(x<-5){x=-5;vx=Math.abs(vx)*0.9;} if(x>5){x=5;vx=-Math.abs(vx)*0.9;}
    if(z<-2.7){z=-2.7;vz=Math.abs(vz)*0.9;} if(z>2.7){z=2.7;vz=-Math.abs(vz)*0.9;}
    vx*=Math.pow(0.35,h); vz*=Math.pow(0.35,h);
    for(let i=0;i<o.length;i++){
      const b=o[i], top=b.h;
      if(x>b.x-b.w/2-R&&x<b.x+b.w/2+R&&z>b.z-b.d/2-R&&z<b.z+b.d/2+R&&y<top+R&&y>top-0.2&&vy<0){
        y=top+R; vy=Math.max(4.2,Math.abs(vy)*0.8); vx+=(x-b.x)*1.35; vz+=(z-b.z)*1.35;
        hitT[i]=t+h; hits++; last=i; squash=1;
      }
    }
    if(squash>0) squash=Math.max(0,squash-h*3.2);
  }
  return {x,y,z,vx,vy,vz,hitT,hits,last,squash};
}
function camOf(t,si){
  return {yaw:0.22*Math.sin(t*0.35)+si*0.08, y:3.15+0.15*Math.sin(t*0.5), dist:13.2};
}
function proj(x,y,z,cam){
  const cyaw=Math.cos(cam.yaw), syaw=Math.sin(cam.yaw);
  const rx=x*cyaw-z*syaw, rz=x*syaw+z*cyaw;
  const depth=cam.dist-rz, f=760/Math.max(0.4,depth);
  return {x:640+rx*f, y:400-(y-cam.y)*f, f, depth, rz};
}
function poly(pts,fill){
  ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x,pts[i].y);
  ctx.closePath(); ctx.fillStyle=fill; ctx.fill();
}
function draw(t){
  const si=Math.floor(t/9)%4, loc=t-si*9, sc=SC[si], cam=camOf(t,si);
  const P=sim(sc,loc);
  const spb=60/sc.bpm, ph=(loc%spb)/spb, pulse=Math.pow(1-ph,6);
  const beatI=Math.floor(loc/spb);
  const g=ctx.createLinearGradient(0,0,0,520);
  g.addColorStop(0,sc.sky[0]); g.addColorStop(1,sc.sky[1]);
  ctx.fillStyle=g; ctx.fillRect(0,0,1280,720);
  for(let i=0;i<18;i++){
    const a=(i*1.7+t*0.15), nx=Math.sin(a)*5.2, nz=Math.cos(a*1.3)*2.2, ny=3.2+Math.sin(a*2)*1.4;
    const q=proj(nx,ny,nz,cam);
    ctx.globalAlpha=0.25+0.2*Math.sin(t*2+i);
    ctx.fillStyle=i%3?'#ffe9a0':'#fff';
    ctx.beginPath(); ctx.arc(q.x,q.y,1.4+pulse,0,6.28); ctx.fill();
  }
  ctx.globalAlpha=1;
  const floorPts=[];
  for(let i=0;i<=8;i++){
    floorPts.push([proj(-5.4,0,-2.9+i*0.72,cam), proj(5.4,0,-2.9+i*0.72,cam)]);
  }
  const c00=proj(-5.4,0,-2.9,cam), c10=proj(5.4,0,-2.9,cam), c11=proj(5.4,0,2.9,cam), c01=proj(-5.4,0,2.9,cam);
  poly([c00,c10,c11,c01],sc.floor);
  ctx.strokeStyle='rgba(255,255,255,0.08)'; ctx.lineWidth=1;
  for(let i=0;i<=8;i++){
    const a=proj(-5.4+i*1.35,0,-2.9,cam), b=proj(-5.4+i*1.35,0,2.9,cam);
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
    const c=floorPts[i][0], d=floorPts[i][1];
    ctx.beginPath(); ctx.moveTo(c.x,c.y); ctx.lineTo(d.x,d.y); ctx.stroke();
  }
  const wL=proj(-5.5,0,-2.9,cam), wR=proj(5.5,0,-2.9,cam), wRT=proj(5.5,3.6,-2.9,cam), wLT=proj(-5.5,3.6,-2.9,cam);
  poly([wL,wR,wRT,wLT],sc.wall);
  const glowI=beatI%sc.objs.length;
  const items=sc.objs.map((b,i)=>{
    const recent=loc-P.hitT[i]<0.28;
    const musical=(i===glowI)?pulse:0;
    const gl=Math.min(1, musical*0.85 + (recent?1:0) + (P.last===i&&loc-P.hitT[i]<0.5?0.4:0));
    return {b,i,gl,depth:proj(b.x,b.h*0.5,b.z,cam).depth};
  }).sort((a,b)=>b.depth-a.depth);
  for(const it of items){
    const b=it.b, y0=0, y1=b.h, x0=b.x-b.w/2, x1=b.x+b.w/2, z0=b.z-b.d/2, z1=b.z+b.d/2;
    const col=it.gl>0.05?mix(b.c,it.gl*0.75):b.c;
    const top=[[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]].map(p=>proj(p[0],p[1],p[2],cam));
    const frontZ=z1>z0?z1:z0;
    const fr=[[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]].map(p=>proj(p[0],p[1],p[2],cam));
    const sideX=b.x>0?x0:x1;
    const sd=[[sideX,y0,z0],[sideX,y0,z1],[sideX,y1,z1],[sideX,y1,z0]].map(p=>proj(p[0],p[1],p[2],cam));
    poly(sd,hex(col,0.55));
    poly(fr,hex(col,0.78));
    poly(top,hex(col,1.15+it.gl*0.4));
    if(it.gl>0.45){
      ctx.globalAlpha=0.35*it.gl;
      ctx.fillStyle='#fff';
      poly(top,'#fff');
      ctx.globalAlpha=1;
    }
    if(b.n==='香蕉皮'){
      ctx.strokeStyle='#c9a020'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(top[0].x+12,top[0].y-6,10,0.3,2.4); ctx.stroke();
    }
    if(b.n==='橡皮鸭'||b.n==='雕像甲'||b.n==='雕像乙'||b.n==='雕像丙'){
      const q=proj(b.x,b.h+0.15,b.z,cam);
      ctx.fillStyle='#222'; ctx.beginPath(); ctx.arc(q.x-4,q.y,2,0,6.3); ctx.arc(q.x+4,q.y,2,0,6.3); ctx.fill();
    }
  }
  const sh=proj(P.x,0.02,P.z,cam);
  ctx.fillStyle='rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(sh.x,sh.y,22*sh.f/40,8*sh.f/40,0,0,6.3); ctx.fill();
  const sp=proj(P.x,P.y,P.z,cam);
  const rad=Math.max(8,0.4*sp.f);
  const sq=0.72+0.28*(1-Math.min(1,P.squash));
  const rg=ctx.createRadialGradient(sp.x-rad*0.35,sp.y-rad*0.4,rad*0.1,sp.x,sp.y,rad);
  rg.addColorStop(0,'#fff6ea'); rg.addColorStop(0.45,'#ff7a3c'); rg.addColorStop(1,'#9a2a12');
  ctx.save(); ctx.translate(sp.x,sp.y); ctx.scale(1+P.squash*0.35,sq);
  ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(0,0,rad,0,6.3); ctx.fill();
  ctx.fillStyle='#1a1020';
  ctx.beginPath(); ctx.ellipse(-rad*0.28,-rad*0.1,rad*0.12,rad*0.16,0,0,6.3); ctx.fill();
  ctx.beginPath(); ctx.ellipse(rad*0.22,-rad*0.08,rad*0.12,rad*0.16,0,0,6.3); ctx.fill();
  ctx.strokeStyle='#1a1020'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(0,rad*0.22,rad*0.28,0.15,Math.PI-0.15); ctx.stroke();
  ctx.restore();
  const joke=sc.joke[Math.abs(P.hits)%sc.joke.length];
  const bx=Math.max(80,Math.min(1000,sp.x+rad+8)), by=Math.max(120,Math.min(560,sp.y-rad-36));
  ctx.globalAlpha=0.92;
  round(bx,by,250,36,8,'rgba(0,0,0,0.55)');
  ctx.globalAlpha=1;
  ctx.fillStyle='#ffe9c2'; ctx.font='18px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText(joke,bx+12,by+24);
  ctx.fillStyle='rgba(0,0,0,0.45)'; round(36,24,520,78,12,'rgba(0,0,0,0.45)');
  ctx.fillStyle='#fff'; ctx.font='28px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('卡点球体下坠  ·  第'+(si+1)+'幕',52,58);
  ctx.font='18px "PingFang SC","Microsoft YaHei",sans-serif'; ctx.fillStyle='#ffd27a';
  ctx.fillText(sc.name+'    '+sc.piece,52,86);
  const bars=16;
  for(let i=0;i<bars;i++){
    const bh=8+pulse*28*Math.abs(Math.sin(i*1.7+beatI));
    ctx.fillStyle=i%4===beatI%4?'#ffb03a':'#6a8cff';
    ctx.globalAlpha=0.85; ctx.fillRect(760+i*28,70-bh,16,bh);
  }
  ctx.globalAlpha=1;
  ctx.fillStyle='#c9d4ff'; ctx.font='16px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('节奏点亮物件  ·  球体擅自加班',760,92);
  ctx.fillStyle='rgba(255,255,255,0.7)'; ctx.font='16px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('纯音乐串烧  ·  不使用外部音频文件，节拍由画面驱动',36,690);
  const prog=t/window.DUR;
  ctx.fillStyle='rgba(255,255,255,0.15)'; ctx.fillRect(36,660,400,4);
  ctx.fillStyle='#ffb03a'; ctx.fillRect(36,660,400*prog,4);
}
function round(x,y,w,h,r,fill){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
  ctx.fillStyle=fill; ctx.fill();
}
function loop(now){
  let t=(now/1000-tOrigin)%window.DUR; if(t<0)t+=window.DUR;
  draw(t);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
