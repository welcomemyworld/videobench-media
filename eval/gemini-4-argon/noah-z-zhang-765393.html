<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KINETIC // 120 BPM</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000000; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  #stage {
    width: 1280px; height: 720px;
    background: #000000;
    box-shadow: 0 0 60px rgba(0, 240, 255, 0.08);
    transform-origin: center center;
  }
</style>
</head>
<body>
<canvas id="stage" width="1280" height="720"></canvas>
<script>
(() => {
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');

  // Scale stage to fit window while preserving 1280x720 coordinate space
  function resize() {
    const scale = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
    canvas.style.transform = `scale(${scale})`;
  }
  window.addEventListener('resize', resize);
  resize();

  // Timeline Configuration: 24 seconds = 48 Beats at 120 BPM (0.5s per beat)
  window.DUR = 24;
  const urlParams = new URLSearchParams(window.location.search);
  const startOffset = parseFloat(urlParams.get('t')) || 0;
  const bootTime = performance.now();

  // Colors & Theme
  const C = {
    bg: '#000000',
    card: '#090A0F',
    cardHi: '#121521',
    border: '#1C2030',
    borderHi: '#2E364F',
    cyan: '#00F0FF',
    violet: '#7000FF',
    lime: '#CCFF00',
    magenta: '#FF0055',
    white: '#FFFFFF',
    muted: '#6E768A',
    darkMuted: '#2C3242'
  };

  const FONT_SANS = '-apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif';
  const FONT_MONO = 'ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace';

  // Math & Easing Helpers
  const clamp = (v, min = 0, max = 1) => Math.max(min, Math.min(max, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const invLerp = (a, b, v) => clamp((v - a) / (b - a));
  const easeOutExpo = x => x === 1 ? 1 : 1 - Math.pow(2, -10 * x);
  const easeInOutExpo = x => x === 0 ? 0 : x === 1 ? 1 : x < 0.5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2;
  const easeOutBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };

  // Snappy Spring Stepper between beat intervals
  function snapStep(B, startBeat, durBeats, easeFn = easeOutExpo) {
    return easeFn(clamp((B - startBeat) / durBeats));
  }

  // Camera Rig: Continuous trajectory with snappy keyframes on beats
  const camKeys = [
    { b: 0,  dur: 1,   x: 0,     y: 0,     z: 2.2,  r: 0 },
    { b: 2,  dur: 1.5, x: 0,     y: 0,     z: 1.0,  r: 0 },
    { b: 7,  dur: 1.4, x: 1100,  y: 0,     z: 1.0,  r: -0.025 },
    { b: 10, dur: 1.2, x: 1260,  y: -15,   z: 1.45, r: 0 },
    { b: 13, dur: 1.2, x: 1100,  y: 0,     z: 1.0,  r: 0 },
    { b: 15, dur: 1.5, x: 1100,  y: 850,   z: 1.05, r: 0.025 },
    { b: 18, dur: 1.2, x: 1100,  y: 785,   z: 1.55, r: 0 },
    { b: 21, dur: 1.2, x: 1100,  y: 850,   z: 1.0,  r: 0 },
    { b: 23, dur: 1.5, x: 0,     y: 850,   z: 1.05, r: -0.02 },
    { b: 27, dur: 1.2, x: 120,   y: 880,   z: 1.45, r: 0 },
    { b: 30, dur: 1.2, x: 0,     y: 850,   z: 1.0,  r: 0 },
    { b: 31, dur: 1.5, x: -1100, y: 850,   z: 1.05, r: 0.02 },
    { b: 35, dur: 1.2, x: -1100, y: 850,   z: 1.38, r: 0 },
    { b: 39, dur: 2.2, x: 50,    y: 425,   z: 0.36, r: 0 },
    { b: 43, dur: 1.6, x: 0,     y: 0,     z: 1.0,  r: 0 },
    { b: 46, dur: 2.0, x: 0,     y: 0,     z: 2.2,  r: 0 }
  ];

  function getCamera(B) {
    let x = camKeys[0].x, y = camKeys[0].y, z = camKeys[0].z, r = camKeys[0].r;
    for (let i = 1; i < camKeys.length; i++) {
      const prev = camKeys[i - 1];
      const curr = camKeys[i];
      if (B >= curr.b) {
        const p = snapStep(B, curr.b, curr.dur, easeOutExpo);
        x = lerp(x, curr.x, p);
        y = lerp(y, curr.y, p);
        z = lerp(z, curr.z, p);
        r = lerp(r, curr.r, p);
      }
    }
    return { x, y, z, r };
  }

  // Drawing Primitives
  function rrect(x, y, w, h, rad) {
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, rad);
  }

  function drawCard(x, y, w, h, rad = 16, glowColor = null, pulse = 0) {
    ctx.save();
    rrect(x, y, w, h, rad);
    ctx.fillStyle = C.card;
    ctx.fill();

    // Subtle top highlight gradient
    const grad = ctx.createLinearGradient(x, y, x, y + h);
    grad.addColorStop(0, 'rgba(255,255,255,0.05)');
    grad.addColorStop(0.3, 'rgba(255,255,255,0.0)');
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.lineWidth = 1.5;
    ctx.strokeStyle = glowColor ? glowColor : C.border;
    if (glowColor) {
      ctx.shadowColor = glowColor;
      ctx.shadowBlur = 15 + pulse * 12;
    }
    ctx.stroke();
    ctx.restore();
  }

  function drawPill(x, y, text, bgColor, textColor, fontSize = 11) {
    ctx.save();
    ctx.font = `700 ${fontSize}px ${FONT_MONO}`;
    const tw = ctx.measureText(text).width;
    const pw = tw + 18, ph = fontSize + 12;
    rrect(x, y, pw, ph, ph / 2);
    ctx.fillStyle = bgColor;
    ctx.fill();
    ctx.fillStyle = textColor;
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x + 9, y + ph / 2 + 1);
    ctx.restore();
    return pw;
  }

  // Infinite World Background Grid
  function drawWorldGrid(cam, beatPulse) {
    const step = 80;
    const halfW = (640 / cam.z) + 200;
    const halfH = (360 / cam.z) + 200;
    const startX = Math.floor((cam.x - halfW) / step) * step;
    const endX   = Math.ceil((cam.x + halfW) / step) * step;
    const startY = Math.floor((cam.y - halfH) / step) * step;
    const endY   = Math.ceil((cam.y + halfH) / step) * step;

    ctx.save();
    ctx.lineWidth = 1 / cam.z;
    ctx.strokeStyle = `rgba(255, 255, 255, ${0.035 + beatPulse * 0.025})`;
    ctx.beginPath();
    for (let x = startX; x <= endX; x += step) {
      ctx.moveTo(x, startY);
      ctx.lineTo(x, endY);
    }
    for (let y = startY; y <= endY; y += step) {
      ctx.moveTo(startX, y);
      ctx.lineTo(endX, y);
    }
    ctx.stroke();

    // Accent crosshairs every 320 units
    const bigStep = 320;
    const bStartX = Math.floor((cam.x - halfW) / bigStep) * bigStep;
    const bStartY = Math.floor((cam.y - halfH) / bigStep) * bigStep;
    ctx.strokeStyle = `rgba(0, 240, 255, ${0.18 + beatPulse * 0.15})`;
    ctx.lineWidth = 1.5 / cam.z;
    const cs = 6 / cam.z;
    ctx.beginPath();
    for (let x = bStartX; x <= endX; x += bigStep) {
      for (let y = bStartY; y <= endY; y += bigStep) {
        ctx.moveTo(x - cs, y); ctx.lineTo(x + cs, y);
        ctx.moveTo(x, y - cs); ctx.lineTo(x, y + cs);
      }
    }
    ctx.stroke();
    ctx.restore();
  }

  // Inter-station Routing Conduits
  function drawConduits(B, beatPulse) {
    const routes = [
      { x1: 0, y1: 0, x2: 1100, y2: 0, b: 6.5, color: C.cyan },
      { x1: 1100, y1: 0, x2: 1100, y2: 850, b: 14.5, color: C.lime },
      { x1: 1100, y1: 850, x2: 0, y2: 850, b: 22.5, color: C.violet },
      { x1: 0, y1: 850, x2: -1100, y2: 850, b: 30.5, color: C.cyan },
      { x1: -1100, y1: 850, x2: 0, y2: 0, b: 38.5, color: C.magenta }
    ];
    ctx.save();
    routes.forEach(r => {
      const p = snapStep(B, r.b, 2.0);
      if (p <= 0) return;
      ctx.strokeStyle = 'rgba(255,255,255,0.06)';
      ctx.lineWidth = 2;
      ctx.setLineDash([8, 8]);
      ctx.beginPath();
      ctx.moveTo(r.x1, r.y1);
      ctx.lineTo(lerp(r.x1, r.x2, p), lerp(r.y1, r.y2, p));
      ctx.stroke();

      // Animated data packet
      ctx.setLineDash([]);
      const packetT = (B * 0.75) % 1;
      if (p > packetT) {
        const px = lerp(r.x1, r.x2, packetT);
        const py = lerp(r.y1, r.y2, packetT);
        ctx.fillStyle = r.color;
        ctx.shadowColor = r.color;
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.arc(px, py, 4 + beatPulse * 2, 0, Math.PI * 2);
        ctx.fill();
      }
    });
    ctx.restore();
  }

  // ============================================================================
  // STATION 0: (0, 0) - KINETIC HERO & BPM METRONOME
  // ============================================================================
  function drawStation0(B, beatPulse) {
    ctx.save();

    // Central Radar Pulse Rings
    for (let i = 0; i < 3; i++) {
      const ringPhase = ((B * 0.5 + i * 0.33) % 1);
      const rad = 80 + ringPhase * 360;
      ctx.strokeStyle = `rgba(0, 240, 255, ${(1 - ringPhase) * 0.14})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(0, 0, rad, 0, Math.PI * 2);
      ctx.stroke();
    }

    // Top Status Pill
    const p0 = snapStep(B, 0, 1.0, easeOutBack);
    ctx.save();
    ctx.scale(p0, p0);
    drawCard(-150, -210, 300, 38, 19, 'rgba(0, 240, 255, 0.35)', beatPulse);
    ctx.fillStyle = C.cyan;
    ctx.beginPath();
    ctx.arc(-125, -191, 5 + beatPulse * 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.font = `700 12px ${FONT_MONO}`;
    ctx.fillStyle = C.white;
    ctx.textAlign = 'center';
    ctx.fillText('DARK.UI // MOTION SYSTEM 4.0', 10, -187);
    ctx.restore();

    // Kinetic Staggered Words
    const words = [
      { text: 'ZERO',     b: 1, x: -210, y: -65, size: 104, col: C.white,   outline: false },
      { text: 'CUTS.',    b: 2, x:  200, y: -65, size: 104, col: C.cyan,    outline: false },
      { text: 'PURE',     b: 3, x: -200, y:  55, size: 104, col: C.white,   outline: true  },
      { text: 'VELOCITY', b: 4, x:  155, y:  55, size: 104, col: C.lime,    outline: false }
    ];

    words.forEach(w => {
      const prog = snapStep(B, w.b, 0.85, easeOutBack);
      if (prog <= 0) return;
      ctx.save();
      const yOff = (1 - prog) * 45;
      const sc = 0.8 + 0.2 * prog + (Math.floor(B) === w.b ? beatPulse * 0.05 : 0);
      ctx.translate(w.x, w.y + yOff);
      ctx.scale(sc, sc);
      ctx.globalAlpha = clamp(prog * 1.5);
      ctx.font = `900 ${w.size}px ${FONT_SANS}`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      if (w.outline) {
        ctx.strokeStyle = w.col;
        ctx.lineWidth = 2.5;
        ctx.strokeText(w.text, 0, 0);
      } else {
        ctx.fillStyle = w.col;
        ctx.shadowColor = w.col;
        ctx.shadowBlur = Math.floor(B) === w.b ? 28 : 0;
        ctx.fillText(w.text, 0, 0);
      }
      ctx.restore();
    });

    // Bottom Audio Equalizer Dock
    const dockProg = snapStep(B, 4.5, 1.2, easeOutExpo);
    if (dockProg > 0) {
      ctx.save();
      ctx.translate(0, 175 + (1 - dockProg) * 40);
      ctx.globalAlpha = dockProg;
      drawCard(-280, -34, 560, 68, 16);

      ctx.font = `700 12px ${FONT_MONO}`;
      ctx.fillStyle = C.muted;
      ctx.textAlign = 'left';
      ctx.fillText('CLOCK // 120.0 BPM', -255, -6);
      ctx.fillStyle = C.lime;
      ctx.fillText('LOCKED SYNC', -255, 14);

      // 24 Equalizer Bars
      const barCount = 24;
      for (let i = 0; i < barCount; i++) {
        const bx = -75 + i * 14;
        const wave = Math.sin(B * Math.PI * 2 + i * 0.45) * 0.5 + 0.5;
        const bh = 8 + wave * 34 * (0.45 + beatPulse * 0.55);
        ctx.fillStyle = i % 4 === 0 ? C.cyan : C.borderHi;
        rrect(bx, -bh / 2, 8, bh, 3);
        ctx.fill();
      }
      ctx.restore();
    }

    ctx.restore();
  }

  // ============================================================================
  // STATION 1: (1100, 0) - COMMAND PALETTE & LIVE TELEMETRY
  // ============================================================================
  function drawStation1(B, beatPulse) {
    ctx.save();
    ctx.translate(1100, 0);

    // Oversized Kinetic Backdrop Header
    const headP = snapStep(B, 7.2, 1.2);
    ctx.save();
    ctx.globalAlpha = headP;
    ctx.font = `900 84px ${FONT_SANS}`;
    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    ctx.fillText('01 // COMMAND', -460, -220);
    ctx.restore();

    // Left Column: Command Palette Card
    const cmdP = snapStep(B, 7.6, 1.2, easeOutBack);
    ctx.save();
    ctx.translate(-220, 0);
    ctx.scale(0.9 + 0.1 * cmdP, 0.9 + 0.1 * cmdP);
    ctx.globalAlpha = cmdP;
    drawCard(-240, -180, 460, 360, 18, 'rgba(0, 240, 255, 0.25)', beatPulse);

    // Search Input Box
    rrect(-220, -160, 420, 48, 10);
    ctx.fillStyle = '#05060A';
    ctx.fill();
    ctx.strokeStyle = C.cyan;
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Typed Search Query
    const fullQuery = '> deploy --edge --zero-latency';
    const typeProg = clamp((B - 8.2) / 2.2);
    const typedText = fullQuery.slice(0, Math.floor(typeProg * fullQuery.length));
    ctx.font = `600 15px ${FONT_MONO}`;
    ctx.fillStyle = C.white;
    ctx.fillText(typedText, -202, -131);

    // Blinking Block Cursor
    if (Math.floor(B * 2) % 2 === 0) {
      const tw = ctx.measureText(typedText).width;
      ctx.fillStyle = C.cyan;
      ctx.fillRect(-198 + tw, -146, 9, 20);
    }

    // Action List Items
    const actions = [
      { title: 'Edge Cluster Sync', sub: 'us-east // eu-central // ap-northeast', key: '⌘ 1', col: C.cyan },
      { title: 'Compile Shader Pipeline', sub: 'WebGL2 Compute Kernel v4.2', key: '⌘ 2', col: C.lime },
      { title: 'Purge Global CDN Cache', sub: 'Instantaneous 180-node invalidation', key: '⌘ 3', col: C.violet },
      { title: 'Stream Live Telemetry', sub: '120Hz WebSocket binary feed', key: '⌘ 4', col: C.magenta }
    ];

    const activeIdx = B < 10 ? 0 : B < 11.5 ? 1 : B < 13 ? 2 : 0;

    actions.forEach((act, idx) => {
      const iy = -94 + idx * 64;
      const isSel = idx === activeIdx;
      if (isSel) {
        rrect(-220, iy, 420, 54, 10);
        ctx.fillStyle = 'rgba(0, 240, 255, 0.11)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(0, 240, 255, 0.45)';
        ctx.lineWidth = 1;
        ctx.stroke();
      }
      // Status dot
      ctx.fillStyle = isSel ? act.col : C.muted;
      ctx.beginPath();
      ctx.arc(-198, iy + 27, isSel ? 5 + beatPulse * 2 : 4, 0, Math.PI * 2);
      ctx.fill();

      ctx.font = `700 15px ${FONT_SANS}`;
      ctx.fillStyle = isSel ? C.white : '#A0A8C0';
      ctx.fillText(act.title, -180, iy + 22);

      ctx.font = `500 12px ${FONT_MONO}`;
      ctx.fillStyle = C.muted;
      ctx.fillText(act.sub, -180, iy + 41);

      drawPill(142, iy + 15, act.key, '#151926', isSel ? C.cyan : C.muted, 11);
    });
    ctx.restore();

    // Right Column: Live Spline Telemetry Card (Focused at Beat 10)
    const chartP = snapStep(B, 8.2, 1.4, easeOutBack);
    ctx.save();
    ctx.translate(230, -15);
    ctx.scale(0.9 + 0.1 * chartP, 0.9 + 0.1 * chartP);
    ctx.globalAlpha = chartP;
    const isChartFocused = B >= 10 && B <= 13.5;
    drawCard(-200, -165, 440, 360, 18, isChartFocused ? C.lime : null, beatPulse);

    drawPill(-175, -142, 'REALTIME THROUGHPUT', 'rgba(204,255,0,0.12)', C.lime, 11);

    // Animated Throughput Metric
    const metricVal = (98.4 + Math.sin(B * 1.7) * 1.4).toFixed(2);
    ctx.font = `900 54px ${FONT_SANS}`;
    ctx.fillStyle = C.white;
    ctx.fillText(`${metricVal}%`, -175, -62);

    ctx.font = `600 13px ${FONT_MONO}`;
    ctx.fillStyle = C.cyan;
    ctx.fillText('+14.8% vs baseline // 0.4ms p99', -175, -34);

    // Animated Area Chart
    const gx = -175, gy = -5, gw = 390, gh = 165;
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 1;
    for (let r = 0; r <= 3; r++) {
      const ly = gy + (gh / 3) * r;
      ctx.beginPath(); ctx.moveTo(gx, ly); ctx.lineTo(gx + gw, ly); ctx.stroke();
    }

    const drawProg = clamp((B - 8.8) / 2.8);
    const pts = [];
    const N = 36;
    for (let i = 0; i <= N; i++) {
      const t = i / N;
      if (t > drawProg) break;
      const px = gx + t * gw;
      const wave = Math.sin(t * 7 + B * 2.2) * 26 + Math.cos(t * 13 - B * 1.4) * 18;
      const py = gy + gh * 0.52 - wave - t * 25;
      pts.push({ x: px, y: py });
    }

    if (pts.length > 1) {
      // Gradient Fill under curve
      ctx.beginPath();
      ctx.moveTo(pts[0].x, gy + gh);
      pts.forEach(p => ctx.lineTo(p.x, p.y));
      ctx.lineTo(pts[pts.length - 1].x, gy + gh);
      ctx.closePath();
      const fillG = ctx.createLinearGradient(0, gy, 0, gy + gh);
      fillG.addColorStop(0, 'rgba(0, 240, 255, 0.38)');
      fillG.addColorStop(1, 'rgba(0, 240, 255, 0.0)');
      ctx.fillStyle = fillG;
      ctx.fill();

      // Glowing Stroke
      ctx.beginPath();
      pts.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
      ctx.strokeStyle = C.cyan;
      ctx.lineWidth = 3;
      ctx.shadowColor = C.cyan;
      ctx.shadowBlur = 14;
      ctx.stroke();
      ctx.shadowBlur = 0;

      // Active Scrubbing Playhead
      const head = pts[pts.length - 1];
      ctx.strokeStyle = C.lime;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(head.x, gy);
      ctx.lineTo(head.x, gy + gh);
      ctx.stroke();

      ctx.fillStyle = C.lime;
      ctx.beginPath();
      ctx.arc(head.x, head.y, 6 + beatPulse * 3, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    ctx.restore();
  }

  // ============================================================================
  // STATION 2: (1100, 850) - NODE GRAPH ORCHESTRATION
  // ============================================================================
  function drawStation2(B, beatPulse) {
    ctx.save();
    ctx.translate(1100, 850);

    // Kinetic Header Banner
    const hProg = snapStep(B, 15.2, 1.2);
    ctx.save();
    ctx.globalAlpha = hProg;
    ctx.font = `900 72px ${FONT_SANS}`;
    ctx.fillStyle = C.white;
    ctx.textAlign = 'center';
    ctx.fillText('NEURAL PIPELINE', 0, -245);
    drawPill(-95, -215, 'AUTO-ROUTING GRAPH // 120HZ', 'rgba(112,0,255,0.25)', C.cyan, 11);
    ctx.restore();

    const nodes = [
      { id: 'INGEST',   sub: 'RAW STREAM',   x: -360, y: -90,  col: C.cyan,    b: 15.6 },
      { id: 'VECTOR',   sub: 'EMBEDDING',    x: -360, y:  95,  col: C.violet,  b: 16.0 },
      { id: 'SYNAPSE',  sub: 'CORE ROUTER',  x:    0, y: -65,  col: C.lime,    b: 16.4, core: true },
      { id: 'EDGE.CDN', sub: 'GLOBAL MESH',  x:  360, y: -90,  col: C.cyan,    b: 17.0 },
      { id: 'REPLICA',  sub: 'ZERO-LATENCY', x:  360, y:  95,  col: C.magenta, b: 17.4 }
    ];

    const links = [
      [0, 2], [1, 2], [2, 3], [2, 4]
    ];

    // Draw Bezier Wires & Traveling Pulses
    links.forEach(([ai, bi], idx) => {
      const a = nodes[ai], b = nodes[bi];
      const lProg = snapStep(B, 16.2 + idx * 0.3, 1.2);
      if (lProg <= 0) return;

      const x1 = a.x + 110, y1 = a.y;
      const x2 = b.x - 110, y2 = b.y;
      const cx1 = (x1 + x2) / 2, cy1 = y1;
      const cx2 = (x1 + x2) / 2, cy2 = y2;

      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,0.14)';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.bezierCurveTo(cx1, cy1, cx2, cy2, x2, y2);
      ctx.stroke();

      // Traveling Signal Orb along Bezier
      for (let p = 0; p < 2; p++) {
        const t = ((B * 0.85 + idx * 0.25 + p * 0.5) % 1);
        const mt = 1 - t;
        const px = mt*mt*mt*x1 + 3*mt*mt*t*cx1 + 3*mt*t*t*cx2 + t*t*t*x2;
        const py = mt*mt*mt*y1 + 3*mt*mt*t*cy1 + 3*mt*t*t*cy2 + t*t*t*y2;

        ctx.fillStyle = b.col;
        ctx.shadowColor = b.col;
        ctx.shadowBlur = 14;
        ctx.beginPath();
        ctx.arc(px, py, 5 + beatPulse * 2, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    });

    // Draw Nodes
    nodes.forEach(n => {
      const np = snapStep(B, n.b, 1.0, easeOutBack);
      if (np <= 0) return;
      ctx.save();
      ctx.translate(n.x, n.y);
      const sc = np * (n.core && B >= 18 && B <= 21 ? 1 + beatPulse * 0.04 : 1);
      ctx.scale(sc, sc);

      const nw = n.core ? 240 : 210;
      const nh = n.core ? 135 : 96;
      drawCard(-nw / 2, -nh / 2, nw, nh, 16, n.col, beatPulse);

      // Port connectors
      ctx.fillStyle = n.col;
      ctx.beginPath();
      ctx.arc(-nw / 2, 0, 5, 0, Math.PI * 2);
      ctx.arc(nw / 2, 0, 5, 0, Math.PI * 2);
      ctx.fill();

      ctx.font = `800 18px ${FONT_SANS}`;
      ctx.fillStyle = C.white;
      ctx.fillText(n.id, -nw / 2 + 20, -nh / 2 + 34);

      ctx.font = `600 11px ${FONT_MONO}`;
      ctx.fillStyle = n.col;
      ctx.fillText(n.sub, -nw / 2 + 20, -nh / 2 + 54);

      if (n.core) {
        // Core Node Live Load Bar
        const load = Math.round(78 + Math.sin(B * 3) * 18);
        ctx.fillStyle = '#151926';
        rrect(-nw / 2 + 20, 22, nw - 40, 12, 6);
        ctx.fill();

        ctx.fillStyle = C.lime;
        rrect(-nw / 2 + 20, 22, (nw - 40) * (load / 100), 12, 6);
        ctx.fill();

        ctx.font = `700 11px ${FONT_MONO}`;
        ctx.fillStyle = C.white;
        ctx.fillText(`LOAD: ${load}% // 0.12ms`, -nw / 2 + 20, 14);
      } else {
        ctx.font = `600 11px ${FONT_MONO}`;
        ctx.fillStyle = C.muted;
        ctx.fillText('STATUS: ACTIVE', -nw / 2 + 20, 28);
      }
      ctx.restore();
    });

    ctx.restore();
  }

  // ============================================================================
  // STATION 3: (0, 850) - DESIGN TOKENS & SPRING PHYSICS INSPECTOR
  // ============================================================================
  function drawStation3(B, beatPulse) {
    ctx.save();
    ctx.translate(0, 850);

    // Left Kinetic Stack: "60 FPS / SPRING / MOTION"
    const stack = [
      { t: '120 BPM', col: C.cyan,   b: 23.4 },
      { t: 'SPRING',  col: C.white,  b: 24.0 },
      { t: 'PHYSICS', col: C.lime,   b: 24.6 }
    ];
    stack.forEach((s, i) => {
      const sp = snapStep(B, s.b, 0.9, easeOutBack);
      if (sp <= 0) return;
      ctx.save();
      ctx.translate(-340 - (1 - sp) * 60, -110 + i * 95);
      ctx.globalAlpha = sp;
      ctx.font = `900 78px ${FONT_SANS}`;
      ctx.fillStyle = s.col;
      ctx.textAlign = 'left';
      ctx.fillText(s.t, -150, 0);
      ctx.restore();
    });

    // Right Inspector Card (Zoomed at Beat 27)
    const cardP = snapStep(B, 23.8, 1.2, easeOutBack);
    ctx.save();
    ctx.translate(150, 15);
    ctx.scale(0.9 + 0.1 * cardP, 0.9 + 0.1 * cardP);
    ctx.globalAlpha = cardP;
    drawCard(-260, -195, 560, 390, 20, C.violet, beatPulse);

    drawPill(-230, -170, 'MOTION INSPECTOR // TOKENS', 'rgba(112,0,255,0.2)', C.cyan, 11);

    // Interactive Sliders
    const sliders = [
      { label: 'STIFFNESS', val: 420, max: 600, col: C.cyan,   phase: 0.0 },
      { label: 'DAMPING',   val: 28,  max: 60,  col: C.lime,   phase: 1.5 },
      { label: 'MASS',      val: 1.0, max: 3.0, col: C.magenta,phase: 3.0 }
    ];

    sliders.forEach((sl, i) => {
      const sy = -100 + i * 62;
      const osc = Math.sin(B * 2.0 + sl.phase) * 0.22 + 0.68;
      const curVal = (sl.max * osc).toFixed(sl.max < 10 ? 2 : 0);

      ctx.font = `700 12px ${FONT_MONO}`;
      ctx.fillStyle = C.muted;
      ctx.fillText(sl.label, -230, sy);

      ctx.fillStyle = C.white;
      ctx.fillText(curVal, -20, sy);

      // Track
      rrect(-230, sy + 12, 250, 10, 5);
      ctx.fillStyle = '#141824';
      ctx.fill();

      // Active Fill
      rrect(-230, sy + 12, 250 * osc, 10, 5);
      ctx.fillStyle = sl.col;
      ctx.fill();

      // Thumb Knob
      ctx.fillStyle = C.white;
      ctx.shadowColor = sl.col;
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(-230 + 250 * osc, sy + 17, 8 + beatPulse * 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    });

    // Live Damped Spring Oscillation Preview Box on Right Side of Card
    rrect(55, -125, 215, 220, 14);
    ctx.fillStyle = '#05060A';
    ctx.fill();
    ctx.strokeStyle = C.borderHi;
    ctx.stroke();

    ctx.font = `600 11px ${FONT_MONO}`;
    ctx.fillStyle = C.muted;
    ctx.fillText('IMPULSE RESPONSE', 72, -100);

    // Draw Spring Curve
    ctx.beginPath();
    const damp = 4.2 + Math.sin(B * 2) * 1.2;
    const freq = 18 + Math.cos(B * 2) * 4;
    for (let x = 0; x <= 180; x += 2) {
      const t = x / 180;
      const y = Math.exp(-damp * t) * Math.cos(freq * t) * 65;
      const px = 72 + x;
      const py = -10 + y;
      x === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.strokeStyle = C.lime;
    ctx.lineWidth = 2.5;
    ctx.shadowColor = C.lime;
    ctx.shadowBlur = 12;
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Bouncing Preview Puck synced to Beat
    const bounceY = -10 + (beatPulse - 0.3) * -55;
    ctx.fillStyle = C.cyan;
    ctx.beginPath();
    ctx.arc(235, bounceY, 10, 0, Math.PI * 2);
    ctx.fill();

    // Color Swatch Pills at Bottom of Card
    const swatches = [
      { hex: '#00F0FF', col: C.cyan },
      { hex: '#CCFF00', col: C.lime },
      { hex: '#7000FF', col: C.violet },
      { hex: '#FF0055', col: C.magenta }
    ];
    swatches.forEach((sw, i) => {
      const sx = -230 + i * 128;
      const sy = 125;
      rrect(sx, sy, 114, 38, 10);
      ctx.fillStyle = '#111420';
      ctx.fill();
      ctx.fillStyle = sw.col;
      ctx.beginPath();
      ctx.arc(sx + 20, sy + 19, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.font = `700 12px ${FONT_MONO}`;
      ctx.fillStyle = C.white;
      ctx.fillText(sw.hex, sx + 36, sy + 23);
    });

    ctx.restore();
    ctx.restore();
  }

  // ============================================================================
  // STATION 4: (-1100, 850) - GLOBAL DEPLOYMENT & SHADER CORE
  // ============================================================================
  function drawStation4(B, beatPulse) {
    ctx.save();
    ctx.translate(-1100, 850);

    const p4 = snapStep(B, 31.2, 1.2, easeOutBack);
    ctx.scale(0.9 + 0.1 * p4, 0.9 + 0.1 * p4);
    ctx.globalAlpha = p4;

    drawCard(-420, -220, 840, 440, 22, C.cyan, beatPulse);

    // Left Side: 3D Wireframe Lat/Lon Globe
    const gx = -190, gy = 0, grad = 145;
    ctx.save();
    ctx.translate(gx, gy);

    // Outer Halo
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.35)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, grad + 8 + beatPulse * 4, 0, Math.PI * 2);
    ctx.stroke();

    // Longitude ellipses rotating
    const rot = B * 0.45;
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.22)';
    ctx.lineWidth = 1.2;
    for (let i = 0; i < 6; i++) {
      const a = rot + (i * Math.PI) / 6;
      const rx = Math.abs(Math.cos(a)) * grad;
      ctx.beginPath();
      ctx.ellipse(0, 0, rx, grad, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
    // Latitude lines
    for (let l = -2; l <= 2; l++) {
      const ly = (l / 3) * grad;
      const lw = Math.sqrt(grad * grad - ly * ly);
      ctx.beginPath();
      ctx.moveTo(-lw, ly);
      ctx.lineTo(lw, ly);
      ctx.stroke();
    }

    // Glowing Edge Nodes on Globe
    for (let n = 0; n < 7; n++) {
      const na = rot * 1.4 + n * 2.1;
      const ny = Math.sin(n * 1.7) * grad * 0.75;
      const maxR = Math.sqrt(grad * grad - ny * ny);
      const nx = Math.cos(na) * maxR;
      if (Math.sin(na) > -0.2) {
        ctx.fillStyle = n % 2 === 0 ? C.lime : C.cyan;
        ctx.shadowColor = ctx.fillStyle;
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.arc(nx, ny, 5 + beatPulse * 2, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();

    // Right Side: Launch Readout & Kinetic Status
    ctx.textAlign = 'left';
    drawPill(30, -170, 'EDGE MESH // 180 REGIONS', 'rgba(0,240,255,0.15)', C.cyan, 12);

    ctx.font = `900 58px ${FONT_SANS}`;
    ctx.fillStyle = C.white;
    ctx.fillText('SHIPPED.', 30, -90);

    ctx.font = `800 32px ${FONT_SANS}`;
    ctx.fillStyle = C.lime;
    ctx.fillText('ZERO COLD STARTS', 30, -45);

    // Region Latency Bars
    const regions = [
      { name: 'IAD // US-EAST',     ms: '0.8ms', p: 0.94, col: C.cyan },
      { name: 'FRA // EU-CENTRAL',  ms: '1.1ms', p: 0.89, col: C.lime },
      { name: 'NRT // AP-EAST',     ms: '1.4ms', p: 0.85, col: C.violet },
      { name: 'GRU // SA-EAST',     ms: '1.9ms', p: 0.78, col: C.magenta }
    ];

    regions.forEach((rg, idx) => {
      const ry = 0 + idx * 46;
      ctx.font = `700 12px ${FONT_MONO}`;
      ctx.fillStyle = C.white;
      ctx.fillText(rg.name, 30, ry);
      ctx.fillStyle = rg.col;
      ctx.fillText(rg.ms, 315, ry);

      rrect(30, ry + 8, 340, 10, 5);
      ctx.fillStyle = '#141824';
      ctx.fill();

      const fillW = 340 * rg.p * snapStep(B, 32 + idx * 0.4, 1.2);
      rrect(30, ry + 8, fillW, 10, 5);
      ctx.fillStyle = rg.col;
      ctx.fill();
    });

    ctx.restore();
  }

  // ============================================================================
  // MACRO OVERVIEW OVERLAY (Beats 39 to 43)
  // ============================================================================
  function drawMacroBanner(B, beatPulse) {
    if (B < 38.8 || B > 43.5) return;
    const pIn = snapStep(B, 39.0, 1.0);
    const pOut = 1 - snapStep(B, 42.5, 0.8);
    const alpha = pIn * pOut;
    if (alpha <= 0) return;

    ctx.save();
    ctx.translate(50, 425);
    ctx.scale(1 / 0.36, 1 / 0.36); // Counter-scale for crisp giant title in world center
    ctx.globalAlpha = alpha;

    drawCard(-340, -68, 680, 136, 24, C.lime, beatPulse);
    ctx.font = `900 56px ${FONT_SANS}`;
    ctx.fillStyle = C.white;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('UNIFIED ARCHITECTURE', 0, -10);

    ctx.font = `700 14px ${FONT_MONO}`;
    ctx.fillStyle = C.lime;
    ctx.fillText('ONE CONTINUOUS TIMELINE // ZERO HARD CUTS // 120 BPM', 0, 38);
    ctx.restore();
  }

  // ============================================================================
  // SCREEN-SPACE HUD OVERLAY (Timecode, BPM Metronome, Corner Brackets)
  // ============================================================================
  function drawHUD(t, B, beatPulse, cam) {
    ctx.save();

    // Subtle Edge Vignette
    const vig = ctx.createRadialGradient(640, 360, 420, 640, 360, 760);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, 'rgba(0,0,0,0.65)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, 1280, 720);

    // Corner Framing Brackets
    const pad = 26, len = 18;
    ctx.strokeStyle = 'rgba(255,255,255,0.28)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    // TL
    ctx.moveTo(pad, pad + len); ctx.lineTo(pad, pad); ctx.lineTo(pad + len, pad);
    // TR
    ctx.moveTo(1280 - pad - len, pad); ctx.lineTo(1280 - pad, pad); ctx.lineTo(1280 - pad, pad + len);
    // BL
    ctx.moveTo(pad, 720 - pad - len); ctx.lineTo(pad, 720 - pad); ctx.lineTo(pad + len, 720 - pad);
    // BR
    ctx.moveTo(1280 - pad - len, 720 - pad); ctx.lineTo(1280 - pad, 720 - pad); ctx.lineTo(1280 - pad, 720 - pad - len);
    ctx.stroke();

    // Top-Left System Telemetry
    ctx.font = `700 12px ${FONT_MONO}`;
    ctx.fillStyle = C.white;
    ctx.fillText('SYS // DRIBBBLE.DARK.MOTION', 44, 48);
    ctx.fillStyle = C.muted;
    ctx.fillText(`CAM: [${Math.round(cam.x)}, ${Math.round(cam.y)}]  ZOOM: ${cam.z.toFixed(2)}x`, 44, 66);

    // Top-Right 120 BPM 4-Beat Metronome Indicators
    const currentBeatInBar = Math.floor(B) % 4;
    ctx.textAlign = 'right';
    ctx.fillStyle = C.white;
    ctx.fillText('120 BPM // SYNC', 1135, 48);
    ctx.fillStyle = C.cyan;
    ctx.fillText(`BAR ${String(Math.floor(B / 4) + 1).padStart(2, '0')} : BEAT ${currentBeatInBar + 1}`, 1135, 66);

    for (let i = 0; i < 4; i++) {
      const bx = 1155 + i * 20;
      const by = 52;
      const active = i === currentBeatInBar;
      ctx.fillStyle = active ? (i === 0 ? C.lime : C.cyan) : '#1C2030';
      if (active) {
        ctx.shadowColor = ctx.fillStyle;
        ctx.shadowBlur = 12;
      }
      rrect(bx, by - (active ? 10 : 6), 12, active ? 20 : 12, 4);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    // Bottom Timeline Scrub Bar
    const barX = 44, barY = 682, barW = 1192;
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.fillRect(barX, barY, barW, 3);

    const prog = t / window.DUR;
    ctx.fillStyle = C.cyan;
    ctx.fillRect(barX, barY, barW * prog, 3);

    // Beat Tick Marks along Timeline
    for (let b = 0; b <= 48; b += 4) {
      const tx = barX + (b / 48) * barW;
      ctx.fillStyle = b <= B ? C.cyan : 'rgba(255,255,255,0.2)';
      ctx.fillRect(tx, barY - 3, 1.5, 9);
    }

    ctx.textAlign = 'left';
    ctx.fillStyle = C.muted;
    ctx.fillText(`TIMECODE // 00:${String(Math.floor(t)).padStart(2, '0')}.${String(Math.floor((t % 1) * 60)).padStart(2, '0')}`, 44, 670);

    ctx.textAlign = 'right';
    ctx.fillStyle = C.lime;
    ctx.fillText('CONTINUOUS CAMERA RIG // 0 CUTS', 1236, 670);

    ctx.restore();
  }

  // ============================================================================
  // MAIN RENDER LOOP
  // ============================================================================
  function render(now) {
    const elapsed = (now - bootTime) / 1000 + startOffset;
    const t = ((elapsed % window.DUR) + window.DUR) % window.DUR;

    // 120 BPM = 2.0 beats per second
    const B = t * 2.0;
    const beatPhase = B % 1;
    const beatPulse = Math.pow(1 - beatPhase, 3); // Sharp exponential kick every 0.5s

    // Clear Pitch Black Canvas
    ctx.fillStyle = C.bg;
    ctx.fillRect(0, 0, 1280, 720);

    // Evaluate Snappy Camera Trajectory
    const cam = getCamera(B);

    // Enter World Coordinate Space
    ctx.save();
    ctx.translate(640, 360);
    ctx.scale(cam.z, cam.z);
    ctx.rotate(cam.r);
    ctx.translate(-cam.x, -cam.y);

    drawWorldGrid(cam, beatPulse);
    drawConduits(B, beatPulse);

    drawStation0(B, beatPulse);
    drawStation1(B, beatPulse);
    drawStation2(B, beatPulse);
    drawStation3(B, beatPulse);
    drawStation4(B, beatPulse);
    drawMacroBanner(B, beatPulse);

    ctx.restore();

    // Screen-Space HUD Overlay
    drawHUD(t, B, beatPulse, cam);

    requestAnimationFrame(render);
  }

  requestAnimationFrame(render);
})();
</script>
