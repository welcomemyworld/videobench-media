<script>
(() => {
  const W = 1280, H = 720;
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d', { alpha: false });

  // Fit 1280x720 stage nicely in any window
  function resize() {
    const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
    canvas.style.transform = `scale(${scale})`;
    canvas.style.transformOrigin = 'center center';
  }
  window.addEventListener('resize', resize);
  resize();

  // Timeline constants: 128 BPM -> 1 bar = 1.875s, 16 bars = 30.0s
  const BPM = 128;
  const BEAT_DUR = 60 / BPM;       // 0.46875s
  const STEP_DUR = BEAT_DUR / 4;   // 0.1171875s (16th note)
  window.DUR = 30.0;               // 64 beats / 256 steps

  const urlParams = new URLSearchParams(window.location.search);
  const startOffset = parseFloat(urlParams.get('t')) || 0;

  // ============================================================================
  // PROCEDURAL WEB AUDIO SYNTHESIZER (128 BPM Cyberpunk Synthwave / French Touch)
  // ============================================================================
  let actx = null;
  let masterGain = null;
  let analyser = null;
  let freqData = new Uint8Array(64);
  let noiseBuf = null;
  let lastStep = -1;

  function mtof(m) {
    return 440 * Math.pow(2, (m - 69) / 12);
  }

  function initAudio() {
    if (actx) {
      if (actx.state === 'suspended') actx.resume();
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = new AC();

    const comp = actx.createDynamicsCompressor();
    comp.threshold.value = -14;
    comp.knee.value = 12;
    comp.ratio.value = 6;
    comp.attack.value = 0.003;
    comp.release.value = 0.18;

    masterGain = actx.createGain();
    masterGain.gain.value = 0.78;

    analyser = actx.createAnalyser();
    analyser.fftSize = 128;
    analyser.smoothingTimeConstant = 0.72;
    freqData = new Uint8Array(analyser.frequencyBinCount);

    masterGain.connect(comp);
    comp.connect(analyser);
    analyser.connect(actx.destination);

    // Pre-generate white noise buffer for snares & hi-hats
    noiseBuf = actx.createBuffer(1, actx.sampleRate * 1.0, actx.sampleRate);
    const data = noiseBuf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  }

  // Unlock audio on any user gesture + try immediately for headless/recording browsers
  window.addEventListener('pointerdown', initAudio);
  window.addEventListener('keydown', initAudio);
  try { initAudio(); } catch (e) {}

  function playKick(now, punch = 1) {
    const osc = actx.createOscillator();
    const g = actx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(145 * punch, now);
    osc.frequency.exponentialRampToValueAtTime(34, now + 0.11);
    g.gain.setValueAtTime(0.95 * punch, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
    osc.connect(g);
    g.connect(masterGain);
    osc.start(now);
    osc.stop(now + 0.33);
  }

  function playSnare(now, vol = 0.55) {
    const src = actx.createBufferSource();
    src.buffer = noiseBuf;
    const flt = actx.createBiquadFilter();
    flt.type = 'bandpass';
    flt.frequency.setValueAtTime(1900, now);
    flt.Q.value = 0.9;
    const g = actx.createGain();
    g.gain.setValueAtTime(vol, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.19);
    src.connect(flt);
    flt.connect(g);
    g.connect(masterGain);
    src.start(now);
    src.stop(now + 0.2);

    const body = actx.createOscillator();
    const bg = actx.createGain();
    body.type = 'triangle';
    body.frequency.setValueAtTime(210, now);
    body.frequency.exponentialRampToValueAtTime(95, now + 0.08);
    bg.gain.setValueAtTime(vol * 0.6, now);
    bg.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
    body.connect(bg);
    bg.connect(masterGain);
    body.start(now);
    body.stop(now + 0.11);
  }

  function playHat(now, open = false) {
    const dur = open ? 0.22 : 0.045;
    const src = actx.createBufferSource();
    src.buffer = noiseBuf;
    const flt = actx.createBiquadFilter();
    flt.type = 'highpass';
    flt.frequency.setValueAtTime(7500, now);
    const g = actx.createGain();
    g.gain.setValueAtTime(open ? 0.22 : 0.13, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + dur);
    src.connect(flt);
    flt.connect(g);
    g.connect(masterGain);
    src.start(now);
    src.stop(now + dur + 0.01);
  }

  function playBass(now, midi, cutoff = 900) {
    const osc1 = actx.createOscillator();
    const osc2 = actx.createOscillator();
    const flt = actx.createBiquadFilter();
    const g = actx.createGain();
    const f = mtof(midi);
    osc1.type = 'sawtooth';
    osc2.type = 'square';
    osc1.frequency.setValueAtTime(f, now);
    osc2.frequency.setValueAtTime(f * 0.5, now);
    flt.type = 'lowpass';
    flt.Q.value = 4.5;
    flt.frequency.setValueAtTime(cutoff, now);
    flt.frequency.exponentialRampToValueAtTime(110, now + 0.11);
    g.gain.setValueAtTime(0.32, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
    osc1.connect(flt);
    osc2.connect(flt);
    flt.connect(g);
    g.connect(masterGain);
    osc1.start(now);
    osc2.start(now);
    osc1.stop(now + 0.13);
    osc2.stop(now + 0.13);
  }

  function playArp(now, midi, bright = 1) {
    const osc1 = actx.createOscillator();
    const osc2 = actx.createOscillator();
    const flt = actx.createBiquadFilter();
    const g = actx.createGain();
    const f = mtof(midi);
    osc1.type = 'sawtooth';
    osc2.type = 'sawtooth';
    osc1.frequency.setValueAtTime(f, now);
    osc2.frequency.setValueAtTime(f * 1.007, now); // lush detune
    flt.type = 'lowpass';
    flt.Q.value = 3.0;
    flt.frequency.setValueAtTime(2200 * bright, now);
    flt.frequency.exponentialRampToValueAtTime(380, now + 0.16);
    g.gain.setValueAtTime(0.16, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
    osc1.connect(flt);
    osc2.connect(flt);
    flt.connect(g);
    g.connect(masterGain);
    osc1.start(now);
    osc2.start(now);
    osc1.stop(now + 0.19);
    osc2.stop(now + 0.19);
  }

  function playChordPad(now, notes, dur = 1.8) {
    notes.forEach((m) => {
      const osc = actx.createOscillator();
      const flt = actx.createBiquadFilter();
      const g = actx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(mtof(m), now);
      flt.type = 'lowpass';
      flt.frequency.setValueAtTime(1400, now);
      g.gain.setValueAtTime(0.001, now);
      g.gain.linearRampToValueAtTime(0.065, now + 0.18);
      g.gain.exponentialRampToValueAtTime(0.001, now + dur);
      osc.connect(flt);
      flt.connect(g);
      g.connect(masterGain);
      osc.start(now);
      osc.stop(now + dur + 0.05);
    });
  }

  const CHORDS = [
    { root: 41, arp: [65, 68, 72, 77, 72, 68, 65, 72], pad: [53, 60, 65, 68] }, // F minor
    { root: 37, arp: [61, 65, 68, 73, 68, 65, 61, 68], pad: [49, 56, 61, 65] }, // Db major
    { root: 32, arp: [63, 68, 72, 75, 72, 68, 63, 72], pad: [44, 56, 60, 63] }, // Ab major
    { root: 39, arp: [63, 67, 70, 75, 70, 67, 63, 70], pad: [51, 58, 63, 67] }  // Eb major
  ];

  // Visual reactive envelopes triggered by music
  let kickPulse = 0;
  let snarePulse = 0;
  let arpPulse = 0;

  function triggerMusicStep(step) {
    const bar = Math.floor(step / 16);
    const stepInBar = step % 16;
    const chord = CHORDS[bar % 4];

    // Visual pulses always fire even if browser muted audio
    if (stepInBar % 4 === 0 && (bar >= 1 || stepInBar === 0)) kickPulse = 1.0;
    if ((stepInBar === 4 || stepInBar === 12) && bar >= 2) snarePulse = 1.0;
    if (bar >= 1 && step % 2 === 0) arpPulse = 0.85;

    if (!actx || actx.state !== 'running') return;
    const now = actx.currentTime + 0.005;

    // Pad trigger at start of every bar
    if (stepInBar === 0) {
      playChordPad(now, chord.pad, 1.85);
    }

    // Intro (bars 0..1): atmospheric pulse + rising arps
    if (bar < 2) {
      if (stepInBar === 0 || stepInBar === 8) playKick(now, 0.75);
      if (stepInBar % 2 === 0) {
        playArp(now, chord.arp[(stepInBar / 2) % 8], 0.6 + bar * 0.3);
      }
      return;
    }

    // Main Cyberpunk Groove (bars 2..14) & Outro (bar 15)
    const isOutro = bar === 15;
    if (stepInBar % 4 === 0) {
      playKick(now, isOutro ? 0.8 : 1.05);
    }
    if (!isOutro && (stepInBar === 4 || stepInBar === 12)) {
      playSnare(now, 0.58);
    }
    // Riser snare fill at the end of every 4-bar phrase
    if (bar % 4 === 3 && stepInBar >= 12) {
      playSnare(now, 0.28 + (stepInBar - 12) * 0.1);
    }
    // Hi-hats
    if (!isOutro) {
      playHat(now, stepInBar % 4 === 2);
    }
    // Off-beat driving rolling bassline
    if (stepInBar % 4 !== 0) {
      const oct = (stepInBar === 7 || stepInBar === 15) ? 12 : 0;
      playBass(now, chord.root + oct, bar >= 6 ? 1350 : 850);
    }
    // Lead 16th-note melodic arpeggio
    const note = chord.arp[stepInBar % 8] + (bar >= 8 && stepInBar % 4 === 2 ? 12 : 0);
    playArp(now, note, bar >= 6 ? 1.35 : 0.95);
  }

  // ============================================================================
  // VISUAL SCENE ASSETS & PROCEDURAL GEOMETRY
  // ============================================================================
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function easeOutCubic(x) { return 1 - Math.pow(1 - clamp(x, 0, 1), 3); }
  function easeInOutCubic(x) {
    x = clamp(x, 0, 1);
    return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  }

  // Starfield / Data Particles
  const stars = Array.from({ length: 140 }, (_, i) => ({
    x: ((i * 73.13) % 1) * 2 - 1,
    y: ((i * 39.71) % 1) * 2 - 1,
    z: ((i * 19.37) % 1),
    c: i % 3 === 0 ? '#00f0ff' : (i % 3 === 1 ? '#ff2a85' : '#8a64ff')
  }));

  // 3D Globe Nodes for Act 2 (Global Edge Redirect Routing)
  const globeNodes = [];
  for (let i = 0; i < 48; i++) {
    const phi = Math.acos(1 - 2 * (i + 0.5) / 48);
    const theta = Math.PI * (1 + Math.sqrt(5)) * i;
    globeNodes.push({
      x: Math.cos(theta) * Math.sin(phi),
      y: Math.cos(phi),
      z: Math.sin(theta) * Math.sin(phi),
      hub: i % 6 === 0
    });
  }

  // Chaos URL fragments that get compressed into t.co/wQXZTaqf1b in Act 1
  const chaosFragments = [
    "https://platform.cloud-cluster.dev/v4/deploy/production?",
    "utm_source=twitter_timeline&utm_medium=social_card_sync&",
    "session_token=9f8a7d6c5b4e3f2a1098c7d6e5f4&",
    "redirect_uri=https%3A%2F%2Fapp.ultracode.io%2Flaunch%2F",
    "signature=SHA256_wQXZTaqf1b_8849201948273645&",
    "edge_node=fra-01&telemetry=realtime_stream_active",
    "card_meta=og%3Aimage%2Btwitter%3Aplayer%2Bverified_ssl",
    "payload_hash=0x7F9A2C4E8B1D5F3A6C9E0B2D4F"
  ];

  // ============================================================================
  // DRAWING HELPERS
  // ============================================================================
  function drawRoundedRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawGlowText(text, x, y, size, color, glowColor, align = 'center', weight = '800') {
    ctx.save();
    ctx.font = `${weight} ${size}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
    ctx.textAlign = align;
    ctx.textBaseline = 'middle';
    ctx.shadowColor = glowColor || color;
    ctx.shadowBlur = 22;
    ctx.fillStyle = color;
    ctx.fillText(text, x, y);
    ctx.shadowBlur = 0;
    ctx.fillText(text, x, y);
    ctx.restore();
  }

  function drawMonoText(text, x, y, size, color, align = 'center', weight = '700') {
    ctx.save();
    ctx.font = `${weight} ${size}px "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace`;
    ctx.textAlign = align;
    ctx.textBaseline = 'middle';
    ctx.fillStyle = color;
    ctx.fillText(text, x, y);
    ctx.restore();
  }

  // Background Cyber-Grid + Warp Particles + Audio Spectrum Horizon
  function drawBackground(t, beatFrac) {
    // Deep space gradient
    const bgGrad = ctx.createRadialGradient(W / 2, H * 0.42, 40, W / 2, H / 2, W * 0.85);
    const pulseTint = Math.floor(kickPulse * 18);
    bgGrad.addColorStop(0, `rgb(${10 + pulseTint}, ${16 + pulseTint}, ${38 + pulseTint * 2})`);
    bgGrad.addColorStop(0.6, '#060914');
    bgGrad.addColorStop(1, '#020308');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);

    // Perspective floor & ceiling synthwave grid
    ctx.save();
    const horizon = H * 0.52;
    ctx.strokeStyle = `rgba(0, 240, 255, ${0.11 + kickPulse * 0.12})`;
    ctx.lineWidth = 1;

    // Radial perspective lines
    for (let i = -14; i <= 14; i++) {
      const xBot = W / 2 + i * 130;
      const xTop = W / 2 + i * 18;
      ctx.beginPath();
      ctx.moveTo(xTop, horizon + 20);
      ctx.lineTo(xBot, H);
      ctx.stroke();
    }

    // Scrolling horizontal grid lines
    const scroll = (t * 2.2) % 1;
    for (let i = 1; i <= 12; i++) {
      const p = Math.pow((i + scroll) / 13, 2.3);
      const y = horizon + 20 + p * (H - horizon - 20);
      ctx.strokeStyle = `rgba(0, 240, 255, ${p * (0.28 + kickPulse * 0.2)})`;
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
      ctx.stroke();
    }
    ctx.restore();

    // 3D Warp Stars
    ctx.save();
    const speed = 0.42 + kickPulse * 0.35;
    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      let z = (s.z - t * speed) % 1;
      if (z <= 0.02) z += 1;
      const sx = W / 2 + (s.x / z) * 420;
      const sy = H / 2 + (s.y / z) * 260;
      if (sx < 0 || sx > W || sy < 0 || sy > H) continue;
      const r = clamp((1 - z) * 3.2, 0.5, 3.5);
      ctx.fillStyle = s.c;
      ctx.globalAlpha = clamp((1 - z) * 0.85, 0, 1);
      ctx.beginPath();
      ctx.arc(sx, sy, r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    // Bottom Audio-Synced Spectrum Bars
    if (analyser && actx && actx.state === 'running') {
      analyser.getByteFrequencyData(freqData);
    }
    ctx.save();
    const bars = 48;
    const barW = 14;
    const totalW = bars * (barW + 6);
    const startX = (W - totalW) / 2;
    for (let i = 0; i < bars; i++) {
      const mirrorIdx = Math.abs(i - bars / 2);
      let val = 0;
      if (actx && actx.state === 'running' && freqData[mirrorIdx] > 0) {
        val = freqData[mirrorIdx] / 255;
      } else {
        // Deterministic procedural fallback so headless MP4 recording is 100% beat-synced!
        const wave = Math.sin(t * 14 + mirrorIdx * 0.45) * 0.5 + 0.5;
        val = clamp(
          (1 - mirrorIdx / 28) * (0.25 + kickPulse * 0.55 + arpPulse * 0.3 * wave) + snarePulse * 0.25,
          0.06,
          1.0
        );
      }
      const bh = val * 58;
      const bx = startX + i * (barW + 6);
      const by = H - 24 - bh;
      ctx.fillStyle = i % 2 === 0 ? 'rgba(0, 240, 255, 0.45)' : 'rgba(255, 42, 133, 0.45)';
      ctx.fillRect(bx, by, barW, bh);
    }
    ctx.restore();
  }

  // Top & Bottom Cyberpunk HUD Frame
  function drawHUD(t, step) {
    ctx.save();
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.32)';
    ctx.lineWidth = 1.5;

    // Top bar brackets
    ctx.beginPath();
    ctx.moveTo(36, 52); ctx.lineTo(36, 28); ctx.lineTo(320, 28);
    ctx.moveTo(W - 36, 52); ctx.lineTo(W - 36, 28); ctx.lineTo(W - 320, 28);
    ctx.stroke();

    // Live beat indicator dots
    const beatInBar = Math.floor(step / 4) % 4;
    for (let b = 0; b < 4; b++) {
      ctx.fillStyle = b === beatInBar ? '#00f0ff' : 'rgba(0, 240, 255, 0.22)';
      ctx.beginPath();
      ctx.arc(54 + b * 16, 44, b === beatInBar ? 4.5 : 3, 0, Math.PI * 2);
      ctx.fill();
    }

    drawMonoText('SYS://T.CO/wQXZTaqf1b', 195, 44, 12, 'rgba(0, 240, 255, 0.85)', 'left');
    drawMonoText(`SYNC 128.0 BPM  |  STEP ${String(step).padStart(3, '0')}/256`, W - 54, 44, 12, 'rgba(0, 240, 255, 0.8)', 'right');
    ctx.restore();
  }

  // ============================================================================
  // ACT 1 (0.0s - 6.0s): THE QUANTUM URL COMPRESSION ENGINE
  // Shows bloated URLs collapsing into the clean, cryptographic t.co/wQXZTaqf1b
  // ============================================================================
  function drawScene1(t) {
    const p = clamp(t / 6.0, 0, 1);
    const compressP = easeInOutCubic(clamp((t - 1.1) / 2.2, 0, 1));
    const revealP = easeOutCubic(clamp((t - 2.6) / 1.0, 0, 1));

    ctx.save();
    // Title header
    drawMonoText('PHASE 01 // HIGH-ENTROPY URL COMPRESSION', W / 2, 108, 15, '#ff2a85');
    drawGlowText(
      compressP < 0.75 ? 'TAMING THE BLOATED WEB' : 'ONE COMPACT GATEWAY LINK',
      W / 2, 148, 38, '#ffffff', '#00f0ff'
    );

    // Orbiting / collapsing raw URL fragments
    if (compressP < 0.99) {
      for (let i = 0; i < chaosFragments.length; i++) {
        const angle = (i / chaosFragments.length) * Math.PI * 2 + t * 1.4;
        const radiusX = lerp(390, 0, compressP);
        const radiusY = lerp(155, 0, compressP);
        const fx = W / 2 + Math.cos(angle) * radiusX;
        const fy = H / 2 + 15 + Math.sin(angle) * radiusY;

        ctx.save();
        ctx.globalAlpha = (1 - compressP) * 0.88;
        ctx.strokeStyle = i % 2 === 0 ? 'rgba(0,240,255,0.35)' : 'rgba(255,42,133,0.35)';
        ctx.beginPath();
        ctx.moveTo(fx, fy);
        ctx.lineTo(W / 2, H / 2 + 15);
        ctx.stroke();

        ctx.fillStyle = 'rgba(8, 14, 30, 0.85)';
        drawRoundedRect(fx - 185, fy - 16, 370, 32, 6);
        ctx.fill();
        ctx.stroke();
        drawMonoText(chaosFragments[i], fx, fy, 12, i % 2 === 0 ? '#8be9fd' : '#ff79c6');
        ctx.restore();
      }
    }

    // Central Singularity Core / Capsule
    const coreRadius = lerp(34, 0, revealP) + kickPulse * 8;
    if (coreRadius > 2) {
      const g = ctx.createRadialGradient(W / 2, H / 2 + 15, 2, W / 2, H / 2 + 15, coreRadius * 2.8);
      g.addColorStop(0, '#ffffff');
      g.addColorStop(0.4, '#00f0ff');
      g.addColorStop(1, 'rgba(0,240,255,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(W / 2, H / 2 + 15, coreRadius * 2.8, 0, Math.PI * 2);
      ctx.fill();
    }

    // Revealed Hero Shortlink Capsule
    if (revealP > 0.01) {
      ctx.save();
      ctx.translate(W / 2, H / 2 + 15);
      const s = lerp(0.6, 1.0, revealP) + kickPulse * 0.035;
      ctx.scale(s, s);
      ctx.globalAlpha = revealP;

      // Shockwave ring
      const ringR = revealP * 340;
      ctx.strokeStyle = `rgba(0, 240, 255, ${(1 - revealP) * 0.8})`;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(0, 0, ringR, 0, Math.PI * 2);
      ctx.stroke();

      // Main glass capsule
      const cw = 680, ch = 116;
      ctx.shadowColor = '#00f0ff';
      ctx.shadowBlur = 32 + kickPulse * 20;
      ctx.fillStyle = 'rgba(6, 14, 32, 0.92)';
      ctx.strokeStyle = '#00f0ff';
      ctx.lineWidth = 2.5;
      drawRoundedRect(-cw / 2, -ch / 2, cw, ch, 22);
      ctx.fill();
      ctx.stroke();
      ctx.shadowBlur = 0;

      // Highlighted domain + 10-char Base62 token
      drawMonoText('https://', -215, 0, 28, 'rgba(160, 195, 235, 0.75)', 'center', '600');
      drawGlowText('t.co/', -88, 0, 44, '#00f0ff', '#00f0ff', 'center', '800');
      drawGlowText('wQXZTaqf1b', 135, 0, 44, '#ffffff', '#ff2a85', 'center', '800');

      // Sub-caption badges below capsule

  // ============================================================================

  // Subtle CRT Scanlines & Cinematic Vignette Post-Processing
  function drawPostProcess() {
    ctx.save();
    // Scanlines
    ctx.fillStyle = 'rgba(0, 0, 0, 0.14)';
    for (let y = 0; y < H; y += 4) {
      ctx.fillRect(0, y, W, 1.5);
    }
    // Vignette
    const vig = ctx.createRadialGradient(W / 2, H / 2, W * 0.35, W / 2, H / 2, W * 0.78);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, 'rgba(0,0,0,0.58)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  // ============================================================================
  // MAIN ANIMATION LOOP (Driven strictly by performance.now())
  // ============================================================================
  let t0 = null;
  let prevElapsed = 0;

  function frame(now) {
    if (t0 === null) t0 = now;
    const rawElapsed = (now - t0) / 1000 + startOffset;
    const dt = Math.min(0.1, Math.max(0.001, rawElapsed - prevElapsed));
    prevElapsed = rawElapsed;

    const t = ((rawElapsed % window.DUR) + window.DUR) % window.DUR;

    // Decay visual reactive envelopes smoothly
    kickPulse = Math.max(0, kickPulse - dt * 4.8);
    snarePulse = Math.max(0, snarePulse - dt * 6.0);
    arpPulse = Math.max(0, arpPulse - dt * 7.5);

    // Exact 16th-note step sequencer locked to visual timeline `t`
    const currentStep = Math.floor(t / STEP_DUR);
    if (currentStep !== lastStep) {
      lastStep = currentStep;
      triggerMusicStep(currentStep);
    }

    const beatFrac = (t % BEAT_DUR) / BEAT_DUR;

    // 1. Background & Audio Spectrum
    drawBackground(t, beatFrac);

    // 2. Act Dispatcher
    if (t < 6.0) {
      drawScene1(t);
    } else if (t < 13.5) {
      drawScene2(t);
    } else if (t < 21.0) {
      drawScene3(t);
    } else {
      drawScene4(t);
    }

    // 3. HUD & Post-processing
    drawHUD(t, currentStep);
    drawPostProcess();

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
