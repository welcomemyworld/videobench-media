<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KINETIX // Motion Reel</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  #stage {
    width: 1280px;
    height: 720px;
    max-width: 100vw;
    max-height: 100vh;
    aspect-ratio: 16 / 9;
    box-shadow: 0 0 50px rgba(0, 240, 255, 0.15);
    background: #07070c;
  }
</style>
</head>
<body>
<canvas id="stage" width="1280" height="720"></canvas>
<script>
(() => {
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  const W = 1280, H = 720;
  window.DUR = 15;

  const urlParams = new URLSearchParams(window.location.search);
  const timeOffset = parseFloat(urlParams.get('t')) || 0;
  let startTime = null;

  // Color Palette
  const C = {
    bg: '#07070C',
    grid: 'rgba(255, 255, 255, 0.04)',
    white: '#F4F6F8',
    muted: '#687086',
    cyan: '#00F0FF',
    magenta: '#FF0055',
    lime: '#BFFF00',
    violet: '#7000FF',
    dark: '#0E1017'
  };

  // Easing & Math Utilities
  const clamp = (v, min = 0, max = 1) => Math.max(min, Math.min(max, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const invLerp = (a, b, v) => clamp((v - a) / (b - a));
  const prog = (t, s, e) => clamp((t - s) / (e - s));

  const easeOutCubic = x => 1 - Math.pow(1 - x, 3);
  const easeInCubic = x => x * x * x;
  const easeOutQuart = x => 1 - Math.pow(1 - x, 4);
  const easeInOutQuart = x => x < 0.5 ? 8 * x * x * x * x : 1 - Math.pow(-2 * x + 2, 4) / 2;
  const easeOutExpo = x => x === 1 ? 1 : 1 - Math.pow(2, -10 * x);
  const easeOutBack = x => {
    const c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
  };
  const easeOutElastic = x => {
    const c4 = (2 * Math.PI) / 3;
    return x === 0 ? 0 : x === 1 ? 1 : Math.pow(2, -10 * x) * Math.sin((x * 10 - 0.75) * c4) + 1;
  };

  // Drawing Helpers
  function roundRect(x, y, w, h, r) {
    const min = Math.min(w, h) / 2;
    if (r > min) r = min;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawPlus(x, y, size, color, lw = 1.5) {
    ctx.strokeStyle = color;
    ctx.lineWidth = lw;
    ctx.beginPath();
    ctx.moveTo(x - size, y);
    ctx.lineTo(x + size, y);
    ctx.moveTo(x, y - size);
    ctx.lineTo(x, y + size);
    ctx.stroke();
  }

  function drawGrid(t, zoom = 1, panX = 0, panY = 0) {
    ctx.save();
    ctx.translate(W / 2 + panX, H / 2 + panY);
    ctx.scale(zoom, zoom);
    const step = 80;
    ctx.strokeStyle = C.grid;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = -W; x <= W; x += step) {
      ctx.moveTo(x, -H);
      ctx.lineTo(x, H);
    }
    for (let y = -H; y <= H; y += step) {
      ctx.moveTo(-W, y);
      ctx.lineTo(W, y);
    }
    ctx.stroke();

    for (let x = -W; x <= W; x += step * 2) {
      for (let y = -H; y <= H; y += step * 2) {
        drawPlus(x, y, 4, 'rgba(255,255,255,0.12)', 1);
      }
    }
    ctx.restore();
  }

  function drawHUD(t) {
    ctx.save();
    ctx.font = '600 11px monospace';
    ctx.fillStyle = C.muted;
    ctx.textBaseline = 'middle';

    // Top Left
    drawPlus(32, 32, 5, C.cyan, 1.5);
    ctx.fillText('SYS // KINETIX.ENGINE.v4.2', 48, 32);

    // Top Right
    const frame = Math.floor(t * 60).toString().padStart(4, '0');
    const sec = t.toFixed(2).padStart(5, '0');
    ctx.textAlign = 'right';
    ctx.fillText(`TC 00:00:${sec} // FR ${frame}`, W - 48, 32);
    drawPlus(W - 32, 32, 5, C.magenta, 1.5);

    // Bottom Left
    ctx.textAlign = 'left';
    ctx.fillText('RES: 1280x720 @ 60FPS // PROCEDURAL RENDER', 48, H - 32);
    drawPlus(32, H - 32, 5, C.white, 1.5);

    // Bottom Right Progress Bar
    const barW = 160;
    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
    ctx.strokeRect(W - 48 - barW, H - 36, barW, 8);
    ctx.fillStyle = C.cyan;
    ctx.fillRect(W - 48 - barW + 2, H - 34, (barW - 4) * (t / window.DUR), 4);
    drawPlus(W - 32, H - 32, 5, C.lime, 1.5);

    ctx.restore();
  }

  function drawLogoMark(x, y, scale, rot, t) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    ctx.rotate(rot);

    // Outer Hexagon / Diamond hybrid
    const r = 65;
    ctx.lineWidth = 6;
    ctx.strokeStyle = C.cyan;
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = (i * Math.PI) / 3 + t * 0.5;
      const px = Math.cos(a) * r;
      const py = Math.sin(a) * r;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.stroke();

    // Inner K-shape geometry
    ctx.fillStyle = C.magenta;
    ctx.beginPath();
    ctx.moveTo(-25, -35);
    ctx.lineTo(-5, -35);
    ctx.lineTo(-5, 35);
    ctx.lineTo(-25, 35);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = C.white;
    ctx.beginPath();
    ctx.moveTo(0, -3);
    ctx.lineTo(28, -35);
    ctx.lineTo(35, -20);
    ctx.lineTo(14, 3);
    ctx.lineTo(35, 25);
    ctx.lineTo(25, 35);
    ctx.lineTo(-5, 2);
    ctx.closePath();
    ctx.fill();

    // Orbiting dots
    for (let i = 0; i < 3; i++) {
      const a = -t * 3 + (i * Math.PI * 2) / 3;
      ctx.fillStyle = i === 0 ? C.lime : C.cyan;
      ctx.beginPath();
      ctx.arc(Math.cos(a) * (r + 18), Math.sin(a) * (r + 18), 4, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }

  // ==========================================
  // SCENE 1: IGNITION & KINETIC TYPOGRAPHY (0.0s - 3.2s)
  // ==========================================
  function scene1(t) {
    const enter = easeOutExpo(prog(t, 0, 0.8));
    const exit = easeInCubic(prog(t, 2.7, 3.2));

    drawGrid(t, 1 + t * 0.05, 0, 0);

    ctx.save();
    ctx.translate(W / 2, H / 2);
    if (exit > 0) {
      ctx.scale(1 + exit * 3, 1 + exit * 3);
      ctx.globalAlpha = 1 - exit;
    }

    // Shockwave rings
    for (let i = 0; i < 3; i++) {
      const rp = prog(t, 0.1 + i * 0.15, 1.8 + i * 0.2);
      if (rp > 0 && rp < 1) {
        const rad = easeOutQuart(rp) * 550;
        ctx.strokeStyle = i % 2 === 0 ? C.cyan : C.magenta;
        ctx.lineWidth = (1 - rp) * 8;
        ctx.globalAlpha = (1 - rp) * (1 - exit);
        ctx.beginPath();
        ctx.arc(0, 0, rad, 0, Math.PI * 2);
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1 - exit;

    // Phase 1A: Central core morphing into Typography (0 - 1.5s)
    if (t < 1.6) {
      const p1 = prog(t, 0, 1.5);
      const rot = easeOutQuart(p1) * Math.PI;
      const boxS = easeOutBack(prog(t, 0, 0.5)) * 140 * (1 - easeInCubic(prog(t, 1.1, 1.5)));

      ctx.save();
      ctx.rotate(rot);
      ctx.strokeStyle = C.white;
      ctx.lineWidth = 4;
      ctx.strokeRect(-boxS / 2, -boxS / 2, boxS, boxS);
      ctx.fillStyle = C.magenta;
      ctx.fillRect(-boxS / 4, -boxS / 4, boxS / 2, boxS / 2);
      ctx.restore();

      // Flash text
      const words = ['FRAMES', 'VECTORS', 'SHADERS', 'MOTION'];
      const wIdx = Math.min(3, Math.floor(prog(t, 0.25, 1.45) * 4));
      if (t > 0.25) {
        ctx.font = '900 110px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = C.white;
        ctx.fillText(words[wIdx], 0, 0);

        // Chromatic aberration slice
        const glitch = Math.sin(t * 60) * 6;
        ctx.fillStyle = C.cyan;
        ctx.globalCompositeOperation = 'screen';
        ctx.fillText(words[wIdx], glitch, -2);
        ctx.fillStyle = C.magenta;
        ctx.fillText(words[wIdx], -glitch, 2);
        ctx.globalCompositeOperation = 'source-over';
      }
    }

    // Phase 1B: Product Reveal "MEET KINETIX" (1.4s - 3.2s)
    if (t >= 1.4) {
      const p2 = prog(t, 1.4, 2.2);
      const slide = easeOutExpo(p2);

      // Background accent bars
      ctx.fillStyle = C.violet;
      const barW = slide * 760;
      ctx.fillRect(-barW / 2, -95, barW, 190);

      ctx.fillStyle = C.cyan;
      const barW2 = easeOutExpo(prog(t, 1.5, 2.3)) * 740;
      ctx.fillRect(-barW2 / 2 + 15, -85, barW2, 170);

      ctx.fillStyle = C.dark;
      const barW3 = easeOutExpo(prog(t, 1.55, 2.35)) * 730;
      ctx.fillRect(-barW3 / 2, -80, barW3, 160);

      // Main Title
      ctx.save();
      ctx.beginPath();
      ctx.rect(-365, -80, 730, 160);
      ctx.clip();

      ctx.font = '900 108px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = C.white;
      const yOff = (1 - easeOutBack(prog(t, 1.6, 2.1))) * 140;
      ctx.fillText('KINETIX', 0, yOff + 5);
      ctx.restore();

      // Subtitle badge
      const subP = easeOutQuart(prog(t, 1.8, 2.4));
      ctx.globalAlpha = subP * (1 - exit);
      ctx.font = '700 18px monospace';
      ctx.fillStyle = C.lime;
      ctx.textAlign = 'center';
      ctx.letterSpacing = '6px';
      ctx.fillText('PROCEDURAL MOTION ENGINE', 0, -120 - (1 - subP) * 20);

      // Decorative brackets
      const brk = 390 * slide;
      ctx.strokeStyle = C.magenta;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(-brk, -60); ctx.lineTo(-brk - 20, -60); ctx.lineTo(-brk - 20, 60); ctx.lineTo(-brk, 60);
      ctx.moveTo(brk, -60); ctx.lineTo(brk + 20, -60); ctx.lineTo(brk + 20, 60); ctx.lineTo(brk, 60);
      ctx.stroke();
    }

    ctx.restore();
  }

  // ==========================================
  // SCENE 2: THE PROBLEM VS SOLUTION (2.9s - 6.2s)
  // ==========================================
  function scene2(t) {
    const enter = easeOutExpo(prog(t, 2.9, 3.5));
    const flip = easeInOutQuart(prog(t, 4.3, 4.9));
    const exit = easeInCubic(prog(t, 5.7, 6.2));

    drawGrid(t, 1.1, -t * 20, 0);

    ctx.save();
    ctx.translate(W / 2, H / 2);

    if (exit > 0) {
      ctx.translate(-exit * W, 0);
    }

    // Header text switching
    ctx.save();
    ctx.translate(0, -240 * enter);
    ctx.textAlign = 'center';
    ctx.font = '800 42px sans-serif';

    if (flip < 0.5) {
      const a = 1 - flip * 2;
      ctx.globalAlpha = a * enter;
      ctx.fillStyle = C.magenta;
      ctx.fillText('STOP WRESTLING WITH KEYFRAMES.', 0, 0);
      ctx.font = '500 18px monospace';
      ctx.fillStyle = C.muted;
      ctx.fillText('MANUAL TIMELINES ARE SLOW, RIGID & FRAGILE', 0, 36);
    } else {
      const a = (flip - 0.5) * 2;
      ctx.globalAlpha = a;
      ctx.fillStyle = C.cyan;
      ctx.fillText('DESIGN WITH PURE PHYSICS & LOGIC.', 0, 0);
      ctx.font = '500 18px monospace';
      ctx.fillStyle = C.lime;
      ctx.fillText('INFINITE VARIATIONS // ZERO MANUAL TWEENING', 0, 36);
    }
    ctx.restore();

    // Central Workspace Card
    const cardW = 920, cardH = 360;
    const scaleY = Math.cos(flip * Math.PI);
    ctx.save();
    ctx.translate(0, 30 + (1 - enter) * 200);
    ctx.scale(1, Math.abs(scaleY) * 0.85 + 0.15);

    // Card Base
    roundRect(-cardW / 2, -cardH / 2, cardW, cardH, 16);
    ctx.fillStyle = 'rgba(18, 21, 30, 0.9)';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = flip < 0.5 ? 'rgba(255, 0, 85, 0.5)' : 'rgba(0, 240, 255, 0.6)';
    ctx.stroke();

    if (flip < 0.5) {
      // OLD WAY: Clunky timeline tracks & tangled bezier handles
      const subT = t - 2.9;
      ctx.save();
      ctx.beginPath();
      roundRect(-cardW / 2, -cardH / 2, cardW, cardH, 16);
      ctx.clip();

      // Track rows
      for (let i = 0; i < 5; i++) {
        const y = -120 + i * 60;
        ctx.fillStyle = 'rgba(255,255,255,0.03)';
        ctx.fillRect(-cardW / 2, y - 20, cardW, 40);
        ctx.fillStyle = C.muted;
        ctx.font = '600 13px monospace';
        ctx.textAlign = 'left';
        ctx.fillText(`LAYER_0${i + 1}.transform.pos`, -cardW / 2 + 24, y + 4);

        // Diamond keyframes scattered chaotically
        for (let k = 0; k < 6; k++) {
          const kx = -150 + k * 95 + Math.sin(i * 3 + k) * 25;
          const jitter = Math.sin(subT * 25 + i * k) * 3 * prog(t, 3.6, 4.3);
          ctx.save();
          ctx.translate(kx + jitter, y);
          ctx.rotate(Math.PI / 4);
          ctx.fillStyle = (i + k) % 3 === 0 ? C.magenta : '#444b5e';
          ctx.fillRect(-7, -7, 14, 14);
          ctx.restore();
        }
      }

      // Red error playhead
      const phX = -180 + (subT * 180) % 560;
      ctx.strokeStyle = C.magenta;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(phX, -cardH / 2);
      ctx.lineTo(phX, cardH / 2);
      ctx.stroke();

      ctx.restore();
    } else {
      // NEW WAY: Smooth Procedural Wave + Dynamic Nodes
      const subT = t - 4.5;
      ctx.save();
      ctx.beginPath();
      roundRect(-cardW / 2, -cardH / 2, cardW, cardH, 16);
      ctx.clip();

      // Smooth procedural multi-wave
      const colors = [C.cyan, C.magenta, C.lime];
      for (let w = 0; w < 3; w++) {
        ctx.beginPath();
        ctx.strokeStyle = colors[w];
        ctx.lineWidth = 4;
        for (let x = -cardW / 2 + 40; x <= cardW / 2 - 40; x += 10) {
          const normX = x / (cardW / 2);
          const env = Math.cos(normX * Math.PI * 0.5);
          const y = Math.sin(normX * 4 - subT * 5 + w * 1.1) * 95 * env;
          if (x === -cardW / 2 + 40) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }

      // Interactive harmonic nodes
      for (let i = -3; i <= 3; i++) {
        const x = i * 110;
        const normX = x / (cardW / 2);
        const env = Math.cos(normX * Math.PI * 0.5);
        const y = Math.sin(normX * 4 - subT * 5) * 95 * env;

        ctx.strokeStyle = 'rgba(255,255,255,0.12)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x, -140);
        ctx.lineTo(x, 140);
        ctx.stroke();

        ctx.fillStyle = C.white;
        ctx.beginPath();
        ctx.arc(x, y, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = C.cyan;
        ctx.lineWidth = 3;
        ctx.stroke();
      }

      // Live Formula Pill
      roundRect(-190, 115, 380, 38, 19);
      ctx.fillStyle = '#07070c';
      ctx.fill();
      ctx.strokeStyle = C.lime;
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.fillStyle = C.lime;
      ctx.font = '600 14px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('spring(stiffness: 240, damping: 14)', 0, 139);

      ctx.restore();
    }

    ctx.restore();
    ctx.restore();
  }

  // ==========================================
  // SCENE 3: THE LIVE WORKSPACE DEMO (5.8s - 9.6s)
  // ==========================================
  function scene3(t) {
    const enter = easeOutExpo(prog(t, 5.8, 6.5));
    const exit = easeInCubic(prog(t, 9.1, 9.6));

    drawGrid(t, 1.0, 0, -t * 15);

    ctx.save();
    ctx.translate(W / 2, H / 2);
    ctx.scale(0.9 + 0.1 * enter + exit * 0.5, 0.9 + 0.1 * enter + exit * 0.5);
    ctx.globalAlpha = enter * (1 - exit);

    // Section Title
    ctx.textAlign = 'left';
    ctx.font = '800 28px sans-serif';
    ctx.fillStyle = C.white;
    ctx.fillText('REAL-TIME NODE & CURVE STUDIO', -540, -255);
    ctx.font = '600 14px monospace';
    ctx.fillStyle = C.cyan;
    ctx.fillText('// AUTO-PILOT WORKFLOW DEMO', -540 + 445, -255);

    // 3 Bento Panels
    const pY = -225, pH = 470;

    // --- PANEL 1: Node Graph & Code (Left) ---
    const p1X = -540, p1W = 330;
    roundRect(p1X, pY, p1W, pH, 14);
    ctx.fillStyle = 'rgba(14, 16, 23, 0.92)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.fillStyle = C.muted;
    ctx.font = '700 12px monospace';
    ctx.fillText('01 // REACTIVE GRAPH', p1X + 20, pY + 30);

    // Draw Nodes & Cables
    const nodes = [
      { x: p1X + 75, y: pY + 110, label: 'TIME', col: C.cyan },
      { x: p1X + 75, y: pY + 210, label: 'NOISE', col: C.magenta },
      { x: p1X + 235, y: pY + 160, label: 'MORPH', col: C.lime },
      { x: p1X + 235, y: pY + 290, label: 'SHADER', col: C.violet }
    ];

    const links = [[0, 2], [1, 2], [2, 3]];
    links.forEach(([a, b], idx) => {
      const n1 = nodes[a], n2 = nodes[b];
      ctx.strokeStyle = 'rgba(255,255,255,0.2)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(n1.x + 40, n1.y);
      ctx.bezierCurveTo(n1.x + 90, n1.y, n2.x - 90, n2.y, n2.x - 40, n2.y);
      ctx.stroke();

      // Data pulse along cable
      const pulse = (t * 1.8 + idx * 0.3) % 1;
      const px = lerp(n1.x + 40, n2.x - 40, pulse);
      const py = lerp(n1.y, n2.y, easeInOutQuart(pulse));
      ctx.fillStyle = n1.col;
      ctx.beginPath();
      ctx.arc(px, py, 4, 0, Math.PI * 2);
      ctx.fill();
    });

    nodes.forEach(n => {
      roundRect(n.x - 45, n.y - 22, 90, 44, 8);
      ctx.fillStyle = '#181c28';
      ctx.fill();
      ctx.strokeStyle = n.col;
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = C.white;
      ctx.font = '700 12px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(n.label, n.x, n.y + 4);
    });

    // Parameter Sliders at bottom of Panel 1
    ctx.textAlign = 'left';
    const sliders = [
      { name: 'TURBULENCE', val: 0.3 + 0.55 * Math.sin(t * 2.2 - 1), col: C.cyan },
      { name: 'HARMONICS', val: 0.6 + 0.35 * Math.cos(t * 3.1), col: C.magenta },
      { name: 'BLOOM_GLOW', val: easeInOutQuart(prog(t, 6.2, 8.2)), col: C.lime }
    ];
    sliders.forEach((s, i) => {
      const sy = pY + 365 + i * 32;
      ctx.fillStyle = C.muted;
      ctx.font = '600 11px monospace';
      ctx.fillText(s.name, p1X + 20, sy);
      ctx.fillStyle = 'rgba(255,255,255,0.1)';
      ctx.fillRect(p1X + 115, sy - 7, 185, 6);
      ctx.fillStyle = s.col;
      ctx.fillRect(p1X + 115, sy - 7, 185 * clamp(s.val), 6);
      ctx.beginPath();
      ctx.arc(p1X + 115 + 185 * clamp(s.val), sy - 4, 6, 0, Math.PI * 2);
      ctx.fillStyle = C.white;
      ctx.fill();
    });

    // --- PANEL 2: Live Procedural Viewport (Center) ---
    const p2X = -190, p2W = 410;
    roundRect(p2X, pY, p2W, pH, 14);
    ctx.fillStyle = 'rgba(10, 12, 18, 0.95)';
    ctx.fill();
    ctx.strokeStyle = C.cyan;
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.fillStyle = C.cyan;
    ctx.font = '700 12px monospace';
    ctx.fillText('02 // REAL-TIME VIEWPORT (60 FPS)', p2X + 20, pY + 30);

    // 3D Procedural Wireframe Torus/Sphere inside Viewport
    ctx.save();
    ctx.translate(p2X + p2W / 2, pY + pH / 2 + 15);
    const morph = sliders[2].val;
    const rings = 14, segs = 24;
    const rotX = t * 1.4, rotY = t * 1.9;

    for (let r = 0; r < rings; r++) {
      const phi = (r / rings) * Math.PI * 2;
      ctx.beginPath();
      for (let s = 0; s <= segs; s++) {
        const theta = (s / segs) * Math.PI * 2;
        const rad = 95 + Math.sin(phi * 3 + t * 5) * 28 * morph;
        let x = rad * Math.sin(theta) * Math.cos(phi);
        let y = rad * Math.sin(theta) * Math.sin(phi);
        let z = rad * Math.cos(theta);

        // Rotate Y & X
        let x1 = x * Math.cos(rotY) - z * Math.sin(rotY);
        let z1 = z * Math.cos(rotY) + x * Math.sin(rotY);
        let y1 = y * Math.cos(rotX) - z1 * Math.sin(rotX);

        if (s === 0) ctx.moveTo(x1, y1);
        else ctx.lineTo(x1, y1);
      }
      ctx.strokeStyle = r % 2 === 0 ? 'rgba(0, 240, 255, 0.55)' : 'rgba(255, 0, 85, 0.55)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
    ctx.restore();

    // --- PANEL 3: Spring & Easing Inspector (Right) ---
    const p3X = 240, p3W = 300;
    roundRect(p3X, pY, p3W, pH, 14);
    ctx.fillStyle = 'rgba(14, 16, 23, 0.92)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.fillStyle = C.muted;
    ctx.font = '700 12px monospace';
    ctx.fillText('03 // CURVE SOLVER', p3X + 20, pY + 30);

    // Interactive Bezier Box
    const bx = p3X + 35, by = pY + 65, bs = 230;
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.strokeRect(bx, by, bs, bs);

    // Animated Control Handles
    const h1x = bx + bs * (0.25 + 0.15 * Math.sin(t * 3));
    const h1y = by + bs * (0.1 + 0.1 * Math.cos(t * 2.5));
    const h2x = bx + bs * (0.65 + 0.2 * Math.cos(t * 2));
    const h2y = by + bs * (0.85 - 0.2 * Math.sin(t * 3));

    ctx.strokeStyle = C.magenta;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(bx, by + bs); ctx.lineTo(h1x, h1y);
    ctx.moveTo(bx + bs, by); ctx.lineTo(h2x, h2y);
    ctx.stroke();

    // Bezier Curve
    ctx.strokeStyle = C.lime;
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.moveTo(bx, by + bs);
    ctx.bezierCurveTo(h1x, h1y, h2x, h2y, bx + bs, by);
    ctx.stroke();

    // Handle knobs
    [ [h1x, h1y], [h2x, h2y] ].forEach(([hx, hy]) => {
      ctx.fillStyle = C.white;
      ctx.beginPath();
      ctx.arc(hx, hy, 6, 0, Math.PI * 2);
      ctx.fill();
    });

    // Live Telemetry Bars at bottom of Panel 3
    for (let b = 0; b < 12; b++) {
      const bh = 25 + Math.abs(Math.sin(t * 6 + b * 0.5)) * 75;
      ctx.fillStyle = b % 3 === 0 ? C.cyan : b % 2 === 0 ? C.magenta : '#2a3042';
      ctx.fillRect(bx + b * 19.5, pY + 425 - bh, 13, bh);
    }

    // AI Bot Cursor smoothly orchestrating the workspace
    const curP = prog(t, 6.2, 8.8);
    const curX = lerp(p1X + 210, h1x, easeInOutQuart(curP));
    const curY = lerp(pY + 429, h1y, easeInOutQuart(curP));

    ctx.save();
    ctx.translate(curX, curY);
    ctx.fillStyle = C.lime;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(0, 22);
    ctx.lineTo(6, 16);
    ctx.lineTo(14, 24);
    ctx.lineTo(18, 20);
    ctx.lineTo(10, 12);
    ctx.lineTo(18, 12);
    ctx.closePath();
    ctx.fill();

    roundRect(16, 18, 76, 20, 4);
    ctx.fillStyle = C.lime;
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.font = '800 10px monospace';
    ctx.fillText('AI_DESIGN', 22, 32);
    ctx.restore();

    ctx.restore();
  }

  // ==========================================
  // SCENE 4: RAPID FEATURE SHOWCASE (9.3s - 12.4s)
  // ==========================================
  function scene4(t) {
    // 3 rapid-fire 1.0s cuts showcasing core capabilities
    if (t < 10.35) {
      // 4A: ELASTIC PHYSICS
      const p = prog(t, 9.3, 10.35);
      const enter = easeOutExpo(prog(t, 9.3, 9.6));
      ctx.save();
      ctx.translate(W / 2, H / 2);

      // Isometric spring grid of spheres
      const cols = 7, rows = 4, sp = 95;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const gx = (c - (cols - 1) / 2) * sp;
          const gy = (r - (rows - 1) / 2) * sp + 30;
          const dist = Math.hypot(gx, gy) / 300;
          const bounce = easeOutElastic(clamp((p - dist * 0.25) * 1.4));
          const rad = 26 * bounce;

          ctx.fillStyle = (r + c) % 2 === 0 ? C.cyan : C.magenta;
          ctx.beginPath();
          ctx.arc(gx, gy - (1 - bounce) * 120, Math.max(0, rad), 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // Bold kinetic overlay banner
      ctx.fillStyle = C.dark;
      ctx.fillRect(-380 * enter, -255, 760 * enter, 74);
      ctx.strokeStyle = C.lime;
      ctx.lineWidth = 3;
      ctx.strokeRect(-380 * enter, -255, 760 * enter, 74);

      ctx.font = '900 44px sans-serif';
      ctx.fillStyle = C.white;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('01 // ELASTIC SPRING PHYSICS', 0, -216);
      ctx.restore();

    } else if (t < 11.4) {
      // 4B: GPU SHADER PIPELINE
      const p = prog(t, 10.35, 11.4);
      ctx.save();
      ctx.translate(W / 2, H / 2);

      // Concentric interferencetunnel
      for (let i = 22; i >= 1; i--) {
        const s = i * 32 + ((p * 240) % 32);
        ctx.save();
        ctx.rotate(Math.sin(t * 2 + i * 0.2) * 0.35);
        ctx.strokeStyle = i % 3 === 0 ? C.lime : i % 2 === 0 ? C.cyan : C.violet;
        ctx.lineWidth = 3;
        ctx.strokeRect(-s / 2, -s / 2, s, s);
        ctx.restore();
      }

      ctx.fillStyle = C.dark;
      ctx.fillRect(-380, -38, 760, 76);
      ctx.strokeStyle = C.cyan;
      ctx.lineWidth = 3;
      ctx.strokeRect(-380, -38, 760, 76);

      ctx.font = '900 44px sans-serif';
      ctx.fillStyle = C.white;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('02 // REAL-TIME GPU SHADERS', 0, 2);
      ctx.restore();

    } else {
      // 4C: INSTANT 4K / WEBGL EXPORT
      const p = prog(t, 11.4, 12.4);
      const barP = easeOutQuart(prog(t, 11.45, 12.25));

      drawGrid(t, 1.2, 0, 0);
      ctx.save();
      ctx.translate(W / 2, H / 2);

      // Format Badges
      const formats = ['MP4 // 4K 60FPS', 'WEBGL // 12KB', 'LOTTIE // JSON', 'REACT // SDK'];
      formats.forEach((fmt, i) => {
        const bx = (i - 1.5) * 245;
        const pop = easeOutBack(clamp((p - i * 0.08) * 2.2));
        ctx.save();
        ctx.translate(bx, -75);
        ctx.scale(pop, pop);
        roundRect(-105, -45, 210, 90, 12);
        ctx.fillStyle = '#141824';
        ctx.fill();
        ctx.strokeStyle = i % 2 === 0 ? C.cyan : C.magenta;
        ctx.lineWidth = 2.5;
        ctx.stroke();

        ctx.fillStyle = C.white;
        ctx.font = '800 18px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(fmt, 0, 0);
        ctx.restore();
      });

      // Ultra-fast Render Bar
      roundRect(-420, 55, 840, 54, 27);
      ctx.fillStyle = '#10131d';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.2)';
      ctx.lineWidth = 2;
      ctx.stroke();

      roundRect(-414, 61, 828 * barP, 42, 21);
      ctx.fillStyle = C.lime;
      ctx.fill();

      ctx.font = '900 22px monospace';
      ctx.fillStyle = barP > 0.5 ? '#000' : C.white;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(`EXPORTING PRODUCTION BUILD... ${Math.floor(barP * 100)}%`, 0, 82);

      ctx.font = '900 42px sans-serif';
      ctx.fillStyle = C.white;
      ctx.fillText('03 // ZERO-LATENCY MULTI-EXPORT', 0, -195);

      ctx.restore();
    }
  }

  // ==========================================
  // SCENE 5: GRAND FINALE & HERO LOCKUP (12.2s - 15.0s)
  // ==========================================
  function scene5(t) {
    const enter = easeOutExpo(prog(t, 12.2, 13.0));
    const loopFade = easeInCubic(prog(t, 14.55, 15.0));

    drawGrid(t, 1 + (1 - enter) * 0.4, 0, 0);

    ctx.save();
    ctx.translate(W / 2, H / 2);

    // Converging background energy lines
    for (let i = 0; i < 16; i++) {
      const a = (i / 16) * Math.PI * 2 + t * 0.15;
      const r1 = 260 + Math.sin(t * 4 + i) * 30;
      const r2 = 700;
      ctx.strokeStyle = i % 2 === 0 ? 'rgba(0, 240, 255, 0.15)' : 'rgba(255, 0, 85, 0.15)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * r1, Math.sin(a) * r1);
      ctx.lineTo(Math.cos(a) * r2, Math.sin(a) * r2);
      ctx.stroke();
    }

    ctx.scale(0.85 + 0.15 * enter, 0.85 + 0.15 * enter);
    ctx.globalAlpha = enter * (1 - loopFade);

    // Animated Geometric Brand Mark
    const logoScale = easeOutBack(prog(t, 12.3, 13.1));
    drawLogoMark(0, -115, logoScale, (1 - enter) * -Math.PI, t);

    // Main Brand Lockup
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '900 92px sans-serif';
    ctx.fillStyle = C.white;
    ctx.fillText('KINETIX', 0, 35);

    // Tagline
    ctx.font = '700 20px monospace';
    ctx.fillStyle = C.cyan;
    ctx.fillText('THE NEXT-GEN MOTION DESIGN PLATFORM', 0, 105);

    // Call to Action Pill
    const ctaP = easeOutBack(prog(t, 12.7, 13.4));
    ctx.save();
    ctx.translate(0, 180);
    ctx.scale(ctaP, ctaP);

    roundRect(-185, -28, 370, 56, 28);
    ctx.fillStyle = C.magenta;
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = C.white;
    ctx.stroke();

    ctx.font = '800 20px monospace';
    ctx.fillStyle = C.white;
    ctx.fillText('START CREATING // KINETIX.IO', 0, 2);
    ctx.restore();

    ctx.restore();

    // Seamless transition implosion back to t=0 core
    if (loopFade > 0) {
      ctx.save();
      ctx.translate(W / 2, H / 2);
      const s = (1 - loopFade) * 600;
      ctx.strokeStyle = C.cyan;
      ctx.lineWidth = 6;
      ctx.strokeRect(-s / 2, -s / 2, s, s);
      ctx.restore();
    }
  }

  // ==========================================
  // MASTER RENDER LOOP
  // ==========================================
  function render(now) {
    if (startTime === null) startTime = now;
    const elapsed = (now - startTime) / 1000 + timeOffset;
    const t = elapsed % window.DUR;

    // Clear Stage
    ctx.fillStyle = C.bg;
    ctx.fillRect(0, 0, W, H);

    // Subtle radial ambient glow
    const grad = ctx.createRadialGradient(W / 2, H / 2, 50, W / 2, H / 2, 700);
    grad.addColorStop(0, 'rgba(30, 18, 60, 0.35)');
    grad.addColorStop(1, 'rgba(7, 7, 12, 0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Route Active Scenes
    if (t < 3.2) scene1(t);
    if (t >= 2.9 && t < 6.2) scene2(t);
    if (t >= 5.8 && t < 9.6) scene3(t);
    if (t >= 9.3 && t < 12.4) scene4(t);
    if (t >= 12.2) scene5(t);

    // Persistent Designer HUD
    drawHUD(t);

    requestAnimationFrame(render);
  }

  requestAnimationFrame(render);
})();
</script>
