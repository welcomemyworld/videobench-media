<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>mdfor.dev — Motion Design Showreel</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    user-select: none;
  }
  #stage {
    width: 1280px; height: 720px;
    position: relative;
    box-shadow: 0 0 80px rgba(0, 240, 255, 0.15);
    background: #06070b;
    overflow: hidden;
    transform-origin: center center;
  }
  canvas {
    display: block;
    width: 1280px; height: 720px;
  }
  #sound-pill {
    position: absolute; bottom: 18px; right: 22px;
    background: rgba(15, 18, 28, 0.78);
    border: 1px solid rgba(0, 240, 255, 0.35);
    color: #b8e7ff; font-size: 12px; letter-spacing: 0.08em;
    padding: 6px 12px; border-radius: 999px;
    cursor: pointer; backdrop-filter: blur(6px);
    z-index: 10; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="1280" height="720"></canvas>
  <div id="sound-pill">🔊 CLICK FOR AUDIO SYNC</div>
</div>
<script>
(() => {
  const W = 1280, H = 720;
  window.DUR = 30.0;
  const BPM = 128;
  const BEAT_S = 60 / BPM; // 0.46875s per beat, 64 beats in 30s

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');
  const soundPill = document.getElementById('sound-pill');

  function fitStage() {
    const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
    stage.style.transform = `scale(${scale})`;
  }
  window.addEventListener('resize', fitStage);
  fitStage();

  const params = new URLSearchParams(location.search);
  const startOffset = parseFloat(params.get('t') || '0') || 0;

  // --- EASING & MATH HELPERS ---
  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const invLerp = (a, b, v) => clamp((v - a) / (b - a));
  const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
  const easeOutExpo = t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t);
  const easeInOutCubic = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const easeOutBack = (t, s = 1.70158) => 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2);
  const easeOutElastic = t => {
    if (t <= 0) return 0;
    if (t >= 1) return 1;
    return Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (2 * Math.PI) / 3) + 1;
  };
  const springSquash = (t) => {
    const s = Math.exp(-6 * t) * Math.sin(t * 22);
    return { sx: 1 + s * 0.28, sy: 1 - s * 0.28 };
  };

  // --- WEB AUDIO SYNTHESIZER (128 BPM French-Touch / Tech Synthwave) ---
  let ac = null, masterGain = null, lastStep = -1;
  function initAudio() {
    if (ac) {
      if (ac.state === 'suspended') ac.resume();
      return;
    }
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    ac = new AudioCtx();
    masterGain = ac.createGain();
    masterGain.gain.value = 0.35;
    masterGain.connect(ac.destination);
    soundPill.textContent = '🔊 128 BPM LOCKED';
    setTimeout(() => { soundPill.style.opacity = '0.25'; }, 1200);
  }
  window.addEventListener('pointerdown', initAudio);
  window.addEventListener('keydown', initAudio);
  initAudio();

  function triggerStep(stepIndex) {
    if (!ac || ac.state !== 'running') return;
    const now = ac.currentTime;
    const beat = Math.floor(stepIndex / 4);
    const sub = stepIndex % 4;

    // Kick on every beat (4-on-the-floor) + extra syncopation on fills
    if (sub === 0 || (beat % 8 === 7 && sub === 2)) {
      const osc = ac.createOscillator();
      const g = ac.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(145, now);
      osc.frequency.exponentialRampToValueAtTime(36, now + 0.14);
      g.gain.setValueAtTime(0.95, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
      osc.connect(g); g.connect(masterGain);
      osc.start(now); osc.stop(now + 0.25);
    }

    // Crisp Snare / Clap on beats 1 and 3
    if (sub === 0 && (beat % 2 === 1)) {
      const bufSize = ac.sampleRate * 0.14;
      const buf = ac.createBuffer(1, bufSize, ac.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufSize * 0.28));
      const noise = ac.createBufferSource();
      noise.buffer = buf;
      const filter = ac.createBiquadFilter();
      filter.type = 'highpass';
      filter.frequency.value = 900;
      const g = ac.createGain();
      g.gain.setValueAtTime(0.55, now);
      g.gain.exponentialRampToValueAtTime(0.01, now + 0.14);
      noise.connect(filter); filter.connect(g); g.connect(masterGain);
      noise.start(now);
    }

    // 16th-note Hi-Hats
    {
      const bufSize = ac.sampleRate * 0.04;
      const buf = ac.createBuffer(1, bufSize, ac.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufSize * 0.25));
      const noise = ac.createBufferSource();
      noise.buffer = buf;
      const hp = ac.createBiquadFilter();
      hp.type = 'highpass';
      hp.frequency.value = 6500;
      const g = ac.createGain();
      const accent = (sub === 2) ? 0.25 : 0.10;
      g.gain.setValueAtTime(accent, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
      noise.connect(hp); hp.connect(g); g.connect(masterGain);
      noise.start(now);
    }

    // Driving Bass + Pluck Arp (D minor / F major progression)
    const roots = [38, 38, 41, 43, 45, 45, 41, 40]; // D2, D2, F2, G2, A2, A2, F2, E2
    const rootMidi = roots[Math.floor(beat / 4) % roots.length];
    const arpOffsets = [0, 7, 12, 15, 7, 12, 19, 12];
    const noteMidi = (sub % 2 === 0 ? rootMidi : rootMidi + 12) + (sub === 3 ? 7 : 0);
    const freq = 440 * Math.pow(2, (noteMidi - 69) / 12);

    const bass = ac.createOscillator();
    const bg = ac.createGain();
    const bf = ac.createBiquadFilter();
    bass.type = 'sawtooth';
    bass.frequency.setValueAtTime(freq, now);
    bf.type = 'lowpass';
    bf.frequency.setValueAtTime(sub === 2 ? 1900 : 850, now);
    bf.frequency.exponentialRampToValueAtTime(220, now + 0.11);
    bg.gain.setValueAtTime(sub === 0 ? 0.18 : 0.34, now); // sidechain duck on sub 0
    bg.gain.exponentialRampToValueAtTime(0.008, now + 0.11);
    bass.connect(bf); bf.connect(bg); bg.connect(masterGain);
    bass.start(now); bass.stop(now + 0.12);

    // Lead sparkle arp
    const leadMidi = rootMidi + 24 + arpOffsets[stepIndex % arpOffsets.length];
    const lFreq = 440 * Math.pow(2, (leadMidi - 69) / 12);
    const lead = ac.createOscillator();
    const lg = ac.createGain();
    lead.type = 'triangle';
    lead.frequency.setValueAtTime(lFreq, now);
    lg.gain.setValueAtTime(0.14, now);
    lg.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
    lead.connect(lg); lg.connect(masterGain);
    lead.start(now); lead.stop(now + 0.17);
  }

  // --- DRAWING PRIMITIVES & UI ASSETS ---
  const COLORS = {
    bg: '#06070c',
    panel: '#0e111b',
    panelHi: '#161b2c',
    border: 'rgba(120, 150, 255, 0.22)',
    cyan: '#00f0ff',
    magenta: '#ff2a85',
    violet: '#7c3aed',
    lime: '#10b981',
    amber: '#f59e0b',
    white: '#f8fafc',
    muted: '#8b9bb4'
  };

  function roundRect(x, y, w, h, r) {
    const rr = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  // Draw the signature mdfor.dev brand mark (Vector Icon + Typography)
  function drawBrandLogo(x, y, scale = 1, reveal = 1, glow = 1) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);

    // Outer rounded badge
    const bw = 96, bh = 96;
    ctx.save();
    if (glow > 0) {
      ctx.shadowColor = COLORS.cyan;
      ctx.shadowBlur = 28 * glow;
    }
    const grad = ctx.createLinearGradient(-bw / 2, -bh / 2, bw / 2, bh / 2);
    grad.addColorStop(0, '#00f0ff');
    grad.addColorStop(0.5, '#6366f1');
    grad.addColorStop(1, '#ff2a85');
    roundRect(-bw / 2, -bh / 2, bw, bh, 22);
    ctx.fillStyle = '#0b0e17';
    ctx.fill();
    ctx.lineWidth = 4;
    ctx.strokeStyle = grad;
    ctx.stroke();
    ctx.restore();

    // Inner "M + Down-Arrow + Code Slash" mark
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.lineWidth = 7;
    ctx.strokeStyle = '#ffffff';
    ctx.beginPath();
    // M shape morphing into markdown arrow
    ctx.moveTo(-26, 18);
    ctx.lineTo(-26, -18);
    ctx.lineTo(-6, 4);
    ctx.lineTo(14, -18);
    ctx.lineTo(14, 18);
    ctx.stroke();

    // Accent cyan arrow / slash on right
    ctx.strokeStyle = COLORS.cyan;
    ctx.beginPath();
    ctx.moveTo(26, -12);
    ctx.lineTo(26, 16);
    ctx.moveTo(19, 9);
    ctx.lineTo(26, 17);
    ctx.lineTo(33, 9);
    ctx.stroke();
    ctx.restore();

    ctx.restore();
  }

  // Draw dynamic background grid + beat rings + ambient particles
  const particles = Array.from({ length: 42 }, (_, i) => ({
    x: (i * 197) % W,
    y: (i * 131) % H,
    r: 1.5 + (i % 3) * 1.2,
    sp: 18 + (i % 5) * 14,
    col: i % 3 === 0 ? COLORS.cyan : (i % 3 === 1 ? COLORS.magenta : '#6366f1')
  }));

  function drawStageBackdrop(t, beatPulse, camTiltX = 0, camTiltY = 0) {
    ctx.fillStyle = COLORS.bg;
    ctx.fillRect(0, 0, W, H);

    // Radial neon atmosphere
    const g1 = ctx.createRadialGradient(W * 0.25 + camTiltX * 40, H * 0.25 + camTiltY * 40, 10, W * 0.25, H * 0.25, 620);
    g1.addColorStop(0, 'rgba(0, 240, 255, 0.13)');
    g1.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = g1;
    ctx.fillRect(0, 0, W, H);

    const g2 = ctx.createRadialGradient(W * 0.78 - camTiltX * 40, H * 0.75 - camTiltY * 40, 10, W * 0.78, H * 0.75, 580);
    g2.addColorStop(0, 'rgba(255, 42, 133, 0.13)');
    g2.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = g2;
    ctx.fillRect(0, 0, W, H);

    // Perspective dot/line grid
    ctx.save();
    ctx.strokeStyle = `rgba(110, 145, 255, ${0.05 + beatPulse * 0.04})`;
    ctx.lineWidth = 1;
    const spacing = 64;
    const ox = (t * 28) % spacing;
    const oy = (t * 18) % spacing;
    ctx.beginPath();
    for (let x = -spacing + ox; x < W + spacing; x += spacing) {
      ctx.moveTo(x, 0); ctx.lineTo(x, H);
    }
    for (let y = -spacing + oy; y < H + spacing; y += spacing) {
      ctx.moveTo(0, y); ctx.lineTo(W, y);
    }
    ctx.stroke();
    ctx.restore();

    // Floating bokeh particles
    for (const p of particles) {
      const py = (p.y - t * p.sp % H + H) % H;
      const px = (p.x + Math.sin(t * 1.5 + p.y) * 18 + W) % W;
      ctx.fillStyle = p.col;
      ctx.globalAlpha = 0.25 + beatPulse * 0.25;
      ctx.beginPath();
      ctx.arc(px, py, p.r * (1 + beatPulse * 0.3), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // Draw a sleek vector cursor with click ripples
  function drawCursor(x, y, clicking = 0) {
    ctx.save();
    ctx.translate(x, y);
    if (clicking > 0) {
      ctx.strokeStyle = COLORS.cyan;
      ctx.lineWidth = 2.5;
      ctx.globalAlpha = 1 - clicking;
      ctx.beginPath();
      ctx.arc(0, 0, 10 + clicking * 36, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
    const sc = 1 - Math.sin(clicking * Math.PI) * 0.22;
    ctx.scale(sc, sc);
    ctx.shadowColor = 'rgba(0,0,0,0.6)';
    ctx.shadowBlur = 12;
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#06070c';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(0, 22);
    ctx.lineTo(6, 17);
    ctx.lineTo(11, 26);
    ctx.lineTo(15, 24);
    ctx.lineTo(10, 15);
    ctx.lineTo(18, 15);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  // --- SCENE 1 (0.0s - 4.0s): KINETIC SHOWREEL INTRO & BRAND SLAM ---
  function renderScene1(t, beat, beatFrac, beatPulse) {
    // 0 - 1.8s: Rapid kinetic typography cuts synchronized to beats
    if (t < 1.875) {
      const bIdx = Math.floor(t / BEAT_S); // 0, 1, 2, 3
      const words = [
        { top: '60FPS KINETIC', main: 'MOTION', sub: 'DESIGN SHOWREEL // 2025', col: COLORS.cyan },
        { top: 'BUILT FOR', main: 'DEVELOPERS', sub: 'CLEAN. DETERMINISTIC. INSTANT.', col: COLORS.magenta },
        { top: 'TURN ANY URL INTO', main: 'MARKDOWN', sub: 'ZERO NOISE // LLM READY', col: '#a855f7' },
        { top: 'INTRODUCING', main: 'MDFOR.DEV', sub: 'THE WEB, DISTILLED FOR AI', col: COLORS.lime }
      ][bIdx % 4];

      const localT = (t % BEAT_S) / BEAT_S;
      const slam = easeOutBack(clamp(localT * 3.2), 2.1);
      const sq = springSquash(localT);

      // Diagonal kinetic shutters
      ctx.save();
      ctx.translate(W / 2, H / 2);
      ctx.rotate((bIdx % 2 === 0 ? -0.04 : 0.04));
      ctx.fillStyle = words.col;
      ctx.globalAlpha = 0.08;
      ctx.fillRect(-W, -160 * slam, W * 2, 320 * slam);
      ctx.restore();

      ctx.save();
      ctx.translate(W / 2, H / 2);
      ctx.scale(slam * sq.sx, slam * sq.sy);

      // Top tag pill
      roundRect(-140, -135, 280, 34, 17);
      ctx.fillStyle = 'rgba(255,255,255,0.08)';
      ctx.fill();
      ctx.strokeStyle = words.col;
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.fillStyle = words.col;
      ctx.font = '700 14px ui-monospace, SFMono-Regular, monospace';
      ctx.textAlign = 'center';
      ctx.fillText(words.top, 0, -113);

      // Giant kinetic title with chromatic offset
      ctx.font = '900 124px -apple-system, BlinkMacSystemFont, sans-serif';
      ctx.fillStyle = COLORS.magenta;
      ctx.globalAlpha = 0.6 * (1 - localT);
      ctx.fillText(words.main, -8 * (1 - localT), 28);
      ctx.fillStyle = COLORS.cyan;
      ctx.fillText(words.main, 8 * (1 - localT), 28);
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#ffffff';
      ctx.fillText(words.main, 0, 28);

      // Bottom subtitle
      ctx.font = '600 18px ui-monospace, SFMono-Regular, monospace';
      ctx.fillStyle = COLORS.muted;
      ctx.fillText(words.sub, 0, 88);
      ctx.restore();
      return;
    }

    // 1.875s - 4.0s: Hero Brand Lockup Assembly with shockwave rings
    const lt = (t - 1.875) / (4.0 - 1.875);
    const entry = easeOutElastic(clamp(lt * 1.4));
    const sq = springSquash(lt);

    // Expanding shockwave rings
    for (let i = 0; i < 3; i++) {
      const rp = clamp(lt * 1.5 - i * 0.16);
      if (rp > 0 && rp < 1) {
        ctx.save();
        ctx.strokeStyle = i % 2 === 0 ? COLORS.cyan : COLORS.magenta;
        ctx.lineWidth = 4 * (1 - rp);
        ctx.globalAlpha = (1 - rp) * 0.7;
        ctx.beginPath();
        ctx.arc(W / 2, H / 2 - 20, rp * 540, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
    }

    ctx.save();
    ctx.translate(W / 2, H / 2 - 25);
    ctx.scale(entry * sq.sx, entry * sq.sy);

    // Logo icon on left, wordmark on right
    drawBrandLogo(-225, 0, 1.15, 1, 1 + beatPulse * 0.6);

    ctx.textAlign = 'left';
    ctx.font = '900 92px -apple-system, BlinkMacSystemFont, sans-serif';
    ctx.fillStyle = '#ffffff';
    ctx.fillText('mdfor', -145, 30);

    // ".dev" in glowing cyan gradient
    const g = ctx.createLinearGradient(125, -40, 310, 40);
    g.addColorStop(0, COLORS.cyan);
    g.addColorStop(1, '#818cf8');
    ctx.fillStyle = g;
    ctx.fillText('.dev', 120, 30);

    // Tagline bar underneath
    const barW = 580 * easeOutCubic(clamp((lt - 0.15) * 2));
    roundRect(-290, 68, barW, 40, 20);
    ctx.fillStyle = 'rgba(14, 17, 27, 0.9)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.4)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    if (lt > 0.25) {
      ctx.textAlign = 'center';
      ctx.font = '600 16px ui-monospace, SFMono-Regular, monospace';
      ctx.fillStyle = '#d1fae5';
      ctx.fillText('https://mdfor.dev  •  Any URL → Clean Markdown for LLMs & Devs', 0, 93);
    }
    ctx.restore();
  }

  // --- SCENE 2 (4.0s - 9.0s): THE BLOATED DOM PROBLEM vs LASER SLICER ---
  function renderScene2(t, beat, beatFrac, beatPulse) {
    const lt = (t - 4.0) / 5.0; // 0..1 over 5s

    // Top narrative header
    ctx.save();
    ctx.textAlign = 'center';
    ctx.font = '700 15px ui-monospace, SFMono-Regular, monospace';
    ctx.fillStyle = COLORS.magenta;
    ctx.fillText('01 // THE PROBLEM WITH RAW HTML SCRAPING', W / 2, 48);
    ctx.font = '800 34px -apple-system, BlinkMacSystemFont, sans-serif';
    ctx.fillStyle = '#ffffff';
    ctx.fillText(lt < 0.58 ? 'Modern Web Pages Are 90% Token Bloat' : 'Strip Away the Noise in One Prefix', W / 2, 86);
    ctx.restore();

    // Cluttered noisy cards that pop in, then get laser-sliced at lt = 0.52
    const sliceT = clamp((lt - 0.50) / 0.28);
    const laserX = lerp(120, W - 120, easeInOutCubic(sliceT));

    const bloatItems = [
      { x: 180, y: 150, w: 280, h: 120, title: '🍪 GDPR Cookie Wall', code: '<div class="modal-backdrop z-9999">', col: '#ef4444' },
      { x: 490, y: 140, w: 310, h: 110, title: '📢 AdSense Banner_728x90', code: '<iframe src="ads.doubleclick.net">', col: '#f59e0b' },
      { x: 830, y: 155, w: 270, h: 125, title: '📦 42 Tracking Scripts', code: '<script src="analytics.min.js">', col: '#ec4899' },
      { x: 160, y: 305, w: 300, h: 130, title: '🧭 Mega-Menu Nav DOM', code: '<ul class="nav-lvl-4 hidden">', col: '#8b5cf6' },
      { x: 820, y: 310, w: 290, h: 130, title: '🔔 Newsletter Popover', code: '<aside id="subscribe-nag">', col: '#f97316' },
      { x: 220, y: 465, w: 380, h: 110, title: '🌀 Hydrated SVG Sprites', code: '<svg viewBox="0 0 1024 1024">...', col: '#6366f1' },
      { x: 640, y: 465, w: 420, h: 110, title: '💬 Unloaded Comment Widget', code: '<div id="disqus_thread"></div>', col: '#14b8a6' }
    ];

    // Central core article card (survives the laser)
    ctx.save();
    const coreScale = 1 + easeOutBack(clamp((lt - 0.55) * 2.2)) * 0.14;
    ctx.translate(W / 2, 365);
    ctx.scale(coreScale, coreScale);
    roundRect(-155, -75, 310, 150, 16);
    ctx.fillStyle = '#0f172a';
    ctx.fill();
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = COLORS.cyan;
    ctx.stroke();
    ctx.fillStyle = COLORS.cyan;
    ctx.font = '700 13px ui-monospace, SFMono-Regular, monospace';
    ctx.fillText('PURE CONTENT PAYLOAD', -130, -42);
    ctx.fillStyle = '#ffffff';
    ctx.font = '800 22px -apple-system, sans-serif';
    ctx.fillText('# Deep Dive Architecture', -130, -10);
    ctx.fillStyle = COLORS.muted;
    ctx.font = '500 14px ui-monospace, monospace';
    ctx.fillText('Clean headings, tables & code', -130, 22);
    ctx.fillStyle = COLORS.lime;
    ctx.fillText('✓ 1,420 Tokens (Saved 92%)', -130, 50);
    ctx.restore();

    // Draw each bloat item; if laserX has passed it, shatter & vaporize it
    bloatItems.forEach((it, idx) => {
      const popIn = easeOutBack(clamp((lt * 5.0) - idx * 0.18));
      if (popIn <= 0) return;

      const centerX = it.x + it.w / 2;
      const centerY = it.y + it.h / 2;
      const hitProgress = sliceT > 0 ? clamp((laserX - centerX + 120) / 220) : 0;

      ctx.save();
      ctx.translate(centerX, centerY);
      const wobble = Math.sin(t * 7 + idx) * 0.03;
      const pushX = hitProgress * (centerX < W / 2 ? -90 : 90);
      const pushY = hitProgress * (centerY < 360 ? -70 : 70);
      ctx.translate(pushX, pushY);
      ctx.rotate(wobble + hitProgress * (idx % 2 === 0 ? 0.35 : -0.35));
      const sc = popIn * (1 - hitProgress * 0.85);
      ctx.scale(sc, sc);
      ctx.globalAlpha = 1 - hitProgress;

      roundRect(-it.w / 2, -it.h / 2, it.w, it.h, 14);
      ctx.fillStyle = '#141826';
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = it.col;
      ctx.stroke();

      // Fake window dots
      ctx.fillStyle = it.col;
      ctx.beginPath();

      const r1 = 190 + Math.sin(t * 4 + i) * 20;
      const r2 = 340 + beatPulse * 60;
      ctx.strokeStyle = i % 2 === 0 ? COLORS.cyan : COLORS.magenta;
      ctx.globalAlpha = 0.14 + beatPulse * 0.12;

      ctx.moveTo(Math.cos(ang) * r1, Math.sin(ang) * r1);
      ctx.lineTo(Math.cos(ang) * r2, Math.sin(ang) * r2);
      ctx.stroke();
    }
    ctx.restore();

    ctx.save();
    ctx.translate(W / 2, H / 2 - 30);
    ctx.scale(pop * (1 + beatPulse * 0.03), pop * (1 + beatPulse * 0.03));

    // Center hero badge + brand logo
    drawBrandLogo(0, -110, 1.25, 1, 1.2 + beatPulse * 0.8);

    // Huge URL lockup
    ctx.textAlign = 'center';
    ctx.font = '900 84px -apple-system, BlinkMacSystemFont, sans-serif';
    ctx.fillStyle = '#ffffff';
    ctx.fillText('https://mdfor.dev', 0, 22);

    // Subtitle
    ctx.font = '600 22px -apple-system, sans-serif';
    ctx.fillStyle = '#94a3b8';
    ctx.fillText('Turn any webpage into clean, LLM-ready Markdown.', 0, 68);

    // Interactive CTA Pill Button
    const ctaScale = 1 + Math.sin(t * 8) * 0.025;
    ctx.save();
    ctx.translate(0, 138);
    ctx.scale(ctaScale, ctaScale);
    roundRect(-230, -30, 460, 60, 30);
    const cg = ctx.createLinearGradient(-230, 0, 230, 0);
    cg.addColorStop(0, COLORS.cyan);
    cg.addColorStop(0.5, '#6366f1');
    cg.addColorStop(1, COLORS.magenta);
    ctx.fillStyle = cg;
    ctx.shadowColor = COLORS.cyan;
    ctx.shadowBlur = 26;
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#05070e';
    ctx.font = '900 18px ui-monospace, SFMono-Regular, monospace';
    ctx.fillText('TRY IT NOW → MDFOR.DEV/<ANY-URL>', 0, 6);
    ctx.restore();

    ctx.restore();
  }

  // --- GLOBAL HUD: BEAT EQUALIZER, TIMECODE & PROGRESS BAR ---
  function renderShowreelHUD(t, beat, beatFrac, beatPulse) {
    ctx.save();

    // Top-left showreel watermark
    ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
    ctx.font = '700 12px ui-monospace, SFMono-Regular, monospace';
    ctx.textAlign = 'left';
    ctx.fillText('MOTION DESIGN REEL // MDFOR.DEV', 26, 28);

    // Top-right 128 BPM Audio Equalizer bars
    const eqX = W - 155, eqY = 16;
    for (let i = 0; i < 12; i++) {
      const h = 4 + Math.abs(Math.sin(t * 14 + i * 0.9)) * 14 * (0.45 + beatPulse * 0.8);
      ctx.fillStyle = i % 2 === 0 ? COLORS.cyan : COLORS.magenta;
      ctx.fillRect(eqX + i * 8, eqY + (18 - h), 5, h);
    }

    // Bottom progress timeline bar
    const prog = t / window.DUR;
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.fillRect(0, H - 5, W, 5);
    const pg = ctx.createLinearGradient(0, 0, W, 0);
    pg.addColorStop(0, COLORS.cyan);
    pg.addColorStop(0.5, '#6366f1');
    pg.addColorStop(1, COLORS.magenta);
    ctx.fillStyle = pg;
    ctx.fillRect(0, H - 5, W * prog, 5);

    ctx.restore();
  }

  // --- MAIN RENDER LOOP (Driven strictly by performance.now) ---
  let t0 = null;
  function frame(now) {
    if (t0 === null) t0 = now;
    const rawElapsed = (now - t0) / 1000 + startOffset;
    const t = ((rawElapsed % window.DUR) + window.DUR) % window.DUR;

    // 128 BPM synchronization math
    const totalBeats = t / BEAT_S;
    const beat = Math.floor(totalBeats);
    const beatFrac = totalBeats - beat;
    const beatPulse = Math.pow(1 - beatFrac, 3); // sharp attack on every beat

    // Trigger WebAudio synth on every 16th note step
    const stepIndex = Math.floor(totalBeats * 4);
    if (stepIndex !== lastStep) {
      lastStep = stepIndex;
      triggerStep(stepIndex);
    }

    // Backdrop
    drawStageBackdrop(t, beatPulse, Math.sin(t * 0.9), Math.cos(t * 0.7));

    // Scene Router with Whip-Pan / Flash Transitions
    if (t < 4.0) {
      renderScene1(t, beat, beatFrac, beatPulse);
    } else if (t < 9.0) {
      renderScene2(t, beat, beatFrac, beatPulse);
    } else if (t < 20.0) {
      renderScene3(t, beat, beatFrac, beatPulse);
    } else if (t < 25.5) {
      renderScene4(t, beat, beatFrac, beatPulse);
    } else {
      renderScene5(t, beat, beatFrac, beatPulse);
    }

    // Crisp kinetic wipe flashes at scene boundaries
    const cuts = [4.0, 9.0, 20.0, 25.5];
    for (const c of cuts) {
      const dt = Math.abs(t - c);
      if (dt < 0.18) {
        const p = 1 - dt / 0.18;
        ctx.save();
        ctx.fillStyle = COLORS.cyan;
        ctx.globalAlpha = p * 0.28;
        ctx.fillRect(0, 0, W, H);
        ctx.restore();
      }
    }

    renderShowreelHUD(t, beat, beatFrac, beatPulse);
    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
